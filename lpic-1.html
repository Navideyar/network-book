"ch3-lvm-practice": `
<div class="section-header">
    <div class="section-badge">۳</div>
    <div>
        <h1>LVM — پیاده‌سازی عملی و مدیریت</h1>
        <div class="meta">سخت‌افزار، دیسک و سیستم فایل · بخش ۷ از ۱۰</div>
    </div>
</div>

<p>در جلسه قبل، <strong>ساختار LVM</strong> را یاد گرفتیم:</p>

<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">Physical Disk / Partition
          ↓
         PV
          ↓
         VG
          ↓
         LV
          ↓
     Filesystem
          ↓
        Mount</div></div>

<p>در این جلسه دیگر فقط درباره مفهوم صحبت نمی‌کنیم؛ یک سناریوی کامل را از <strong>شناسایی Disk تا ساخت LVM، استفاده، بررسی و افزایش فضا</strong> مرحله‌به‌مرحله اجرا می‌کنیم.</p>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>فایل‌های درسی پیوست‌شده‌ای که در دسترس من هستند محتوای مشخصی درباره LVM عملی ندارند؛ بنابراین بخش عملی زیر را بر اساس سرفصل و مفاهیم LVM که در همین دوره مشخص کرده‌ایم آموزش می‌دهم و چیزی را به محتوای فایل‌ها نسبت نمی‌دهم.</div></div>

<h2>قبل از شروع: سناریوی Lab</h2>

<p>فرض کنیم در Virtual Machine خودمان دو Disk جدید داریم:</p>

<div class="code-container"><span class="code-label">دیسک‌ها</span><div class="code-block no-prompt">/dev/sdb → 10GB
/dev/sdc → 10GB</div></div>

<p>می‌خواهیم:</p>

<div class="code-container"><span class="code-label">هدف</span><div class="code-block no-prompt">/dev/sdb
/dev/sdc
      ↓
     PV
      ↓
     VG
      ↓
     LV
      ↓
    ext4
      ↓
    /data</div></div>

<p>بسازیم.</p>

<p>بعد یک Disk سوم اضافه می‌کنیم:</p>

<div class="code-container"><span class="code-label">دیسک جدید</span><div class="code-block no-prompt">/dev/sdd → 10GB</div></div>

<p>و آن را به LVM اضافه می‌کنیم تا فضای <code>/data</code> را افزایش دهیم.</p>

<h2>مرحله اول — شناسایی Diskها</h2>

<p>اولین قانون کار با Storage:</p>

<blockquote><strong>هیچ‌وقت قبل از شناسایی Disk، عملیات مخرب انجام نده.</strong></blockquote>

<p>ابتدا:</p>

<div class="code-container"><span class="code-label">شناسایی</span><div class="code-block">lsblk</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">NAME   SIZE TYPE MOUNTPOINTS
sda     50G disk
├─sda1   1G part /boot
└─sda2  49G part /
sdb     10G disk
sdc     10G disk</div></div>

<p>اینجا:</p>

<div class="code-container"><span class="code-label">تفسیر</span><div class="code-block no-prompt">sda → Disk سیستم
sdb → Disk جدید
sdc → Disk جدید</div></div>

<p>پس برای Lab می‌توانیم از:</p>

<div class="code-container"><span class="code-label">انتخاب</span><div class="code-block no-prompt">/dev/sdb
/dev/sdc</div></div>

<p>استفاده کنیم.</p>

<h2>آیا باید حتماً Partition بسازیم؟</h2>

<p>نه.</p>

<p>در LVM دو حالت رایج داریم.</p>

<h3>حالت اول</h3>
<p>کل Disk را مستقیماً PV کنیم:</p>
<div class="code-container"><span class="code-label">حالت اول</span><div class="code-block no-prompt">/dev/sdb
   ↓
PV</div></div>

<h3>حالت دوم</h3>
<p>ابتدا Partition بسازیم:</p>
<div class="code-container"><span class="code-label">حالت دوم</span><div class="code-block no-prompt">/dev/sdb
   ↓
/dev/sdb1
   ↓
PV</div></div>

<p>برای یادگیری LPIC-1 بهتر است هر دو مفهوم را بشناسی.</p>

<p>در این جلسه برای ساده‌تر شدن Lab از <strong>کل Disk</strong> استفاده می‌کنیم.</p>

<h2>مرحله دوم — ساخت PV</h2>

<p>حالا Diskها را به LVM معرفی می‌کنیم.</p>

<div class="code-container"><span class="code-label">ساخت PV</span><div class="code-block">sudo pvcreate /dev/sdb /dev/sdc</div></div>

<p>یعنی:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">/dev/sdb ──→ PV
/dev/sdc ──→ PV</div></div>

<p>دستور اصلی:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block no-prompt">pvcreate</div></div>

<p>است.</p>

<h2>بررسی PVها</h2>

<p>بعد از ساخت PV بهتر است وضعیت را بررسی کنیم:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">sudo pvdisplay</div></div>

<p>ممکن است اطلاعاتی شبیه این ببینیم:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">--- Physical volume ---
PV Name               /dev/sdb
VG Name
PV Size               10.00 GiB
...</div></div>

<p>و برای <code>/dev/sdc</code> نیز مشابه آن.</p>

<p>پس:</p>

<div class="code-container"><span class="code-label">چرخه</span><div class="code-block no-prompt">pvcreate
   ↓
ساخت PV

pvdisplay
   ↓
بررسی PV</div></div>

<h2>یک روش ساده‌تر برای مشاهده PVها</h2>

<p>فرمان دیگری که در محیط‌های LVM زیاد می‌بینی:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo pvs</div></div>

<p>است.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">PV         VG   Fmt  Attr PSize   PFree
/dev/sdb       lvm2      10.00g  10.00g
/dev/sdc       lvm2      10.00g  10.00g</div></div>

<p>برای LPIC-1 این تفاوت را بدان:</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">pvdisplay
   ↓
جزئیات بیشتر

pvs
   ↓
نمایش خلاصه PVها</div></div>

<h2>مرحله سوم — ساخت Volume Group</h2>

<p>حالا دو PV داریم:</p>

<div class="code-container"><span class="code-label">PVها</span><div class="code-block no-prompt">PV1 = /dev/sdb
PV2 = /dev/sdc</div></div>

<p>می‌خواهیم آنها را در یک Pool قرار دهیم.</p>

<p>فرض کنیم اسم VG را می‌گذاریم:</p>

<div class="code-container"><span class="code-label">نام VG</span><div class="code-block no-prompt">storage_vg</div></div>

<p>دستور:</p>

<div class="code-container"><span class="code-label">ساخت VG</span><div class="code-block">sudo vgcreate storage_vg /dev/sdb /dev/sdc</div></div>

<p>ساختار:</p>

<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">/dev/sdb ──┐
           │
           ├──→ storage_vg
           │
/dev/sdc ──┘</div></div>

<p>در نتیجه تقریباً:</p>

<div class="code-container"><span class="code-label">ظرفیت</span><div class="code-block no-prompt">storage_vg = 20GB</div></div>

<p>فضای خام در اختیار داریم.</p>

<h2>بررسی VG</h2>

<p>برای مشاهده اطلاعات:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">sudo vgdisplay</div></div>

<p>یا نسخه خلاصه:</p>

<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block">sudo vgs</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">VG          #PV  #LV  VSize   VFree
storage_vg   2    0   20.00g  20.00g</div></div>

<p>اینجا:</p>

<div class="code-container"><span class="code-label">تفسیر</span><div class="code-block no-prompt">#PV = 2
#LV = 0
VSize = 20GB
VFree = 20GB</div></div>

<p>یعنی:</p>
<ul>
    <li>دو PV داریم.</li>
    <li>هنوز LV نساخته‌ایم.</li>
    <li>کل VG تقریباً 20GB ظرفیت دارد.</li>
    <li>تمام فضای آن آزاد است.</li>
</ul>

<h2>تا اینجا چه ساختیم؟</h2>

<p>تا اینجا:</p>

<div class="code-container"><span class="code-label">وضعیت</span><div class="code-block no-prompt">/dev/sdb ──→ PV ──┐
                   │
                   ├──→ VG: storage_vg
                   │
/dev/sdc ──→ PV ──┘</div></div>

<p>اما هنوز کاربر نمی‌تواند به شکل عادی از این فضا فایل ذخیره کند.</p>

<p>چرا؟</p>

<p>چون هنوز:</p>

<div class="code-container"><span class="code-label">کمبود</span><div class="code-block no-prompt">LV
Filesystem
Mount</div></div>

<p>نداریم.</p>

<h2>مرحله چهارم — ساخت Logical Volume</h2>

<p>فرض کنیم می‌خواهیم یک LV به نام:</p>

<div class="code-container"><span class="code-label">نام LV</span><div class="code-block no-prompt">data_lv</div></div>

<p>با اندازه 10GB بسازیم.</p>

<p>دستور:</p>

<div class="code-container"><span class="code-label">ساخت LV</span><div class="code-block">sudo lvcreate -n data_lv -L 10G storage_vg</div></div>

<p>اجزای دستور:</p>

<div class="code-container"><span class="code-label">تجزیه</span><div class="code-block no-prompt">lvcreate
   │
   ├── -n data_lv
   │       ↓
   │     نام LV
   │
   ├── -L 10G
   │       ↓
   │     اندازه
   │
   └── storage_vg
           ↓
          VG</div></div>

<p>پس:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">VG = 20GB

       ↓

LV = 10GB
Free = 10GB</div></div>

<h2>بررسی LV</h2>

<p>می‌توانیم از:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">sudo lvdisplay</div></div>

<p>استفاده کنیم.</p>

<p>یا:</p>

<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block">sudo lvs</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">LV       VG          Attr       LSize
data_lv  storage_vg  -wi-a----- 10.00g</div></div>

<p>پس:</p>

<div class="code-container"><span class="code-label">نقش</span><div class="code-block no-prompt">lvs
 ↓
نمایش خلاصه LVها</div></div>

<p>و:</p>

<div class="code-container"><span class="code-label">نقش</span><div class="code-block no-prompt">lvdisplay
 ↓
جزئیات بیشتر LV</div></div>

<h2>مسیر Logical Volume</h2>

<p>LV ما:</p>

<div class="code-container"><span class="code-label">LV</span><div class="code-block no-prompt">data_lv</div></div>

<p>داخل:</p>

<div class="code-container"><span class="code-label">VG</span><div class="code-block no-prompt">storage_vg</div></div>

<p>است.</p>

<p>مسیر رایج آن:</p>

<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">/dev/storage_vg/data_lv</div></div>

<p>است.</p>

<p>پس:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">/dev/storage_vg/data_lv</div></div>

<p>را می‌توانیم به عنوان Device موردنظر استفاده کنیم.</p>

<h2>وضعیت فعلی</h2>

<p>تا اینجا:</p>

<div class="code-container"><span class="code-label">وضعیت</span><div class="code-block no-prompt">/dev/sdb
     ↓
    PV
     │
     ├─────────────┐
                   │
/dev/sdc            ↓
     ↓         storage_vg
    PV             │
                   ↓
                data_lv
                  10GB</div></div>

<p>ولی هنوز Filesystem نداریم.</p>

<h2>مرحله پنجم — ساخت Filesystem</h2>

<p>برای اینکه بتوانیم فایل ذخیره کنیم، روی LV یک Filesystem می‌سازیم.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">ساخت</span><div class="code-block">sudo mkfs.ext4 /dev/storage_vg/data_lv</div></div>

<p>حالا:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">LV
 ↓
ext4</div></div>

<p>داریم.</p>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>⚠️ هشدار مهم</strong><br><code>mkfs</code> روی Device موردنظر Filesystem جدید می‌سازد و در صورت وجود داده قبلی می‌تواند باعث از بین رفتن آن داده‌ها شود. پس همیشه Device را دقیق بررسی کن.</div></div>

<h2>مرحله ششم — ساخت Mount Point</h2>

<p>فرض کنیم می‌خواهیم این Storage در مسیر:</p>

<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">/data</div></div>

<p>در دسترس باشد.</p>

<p>پس:</p>

<div class="code-container"><span class="code-label">ایجاد</span><div class="code-block">sudo mkdir /data</div></div>

<p>حالا Directory داریم:</p>

<div class="code-container"><span class="code-label">دایرکتوری</span><div class="code-block no-prompt">/data</div></div>

<p>اما هنوز LV به آن متصل نشده است.</p>

<h2>مرحله هفتم — Mount</h2>

<p>اکنون:</p>

<div class="code-container"><span class="code-label">Mount</span><div class="code-block">sudo mount /dev/storage_vg/data_lv /data</div></div>

<p>یعنی:</p>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">/dev/storage_vg/data_lv
          ↓
        ext4
          ↓
        /data</div></div>

<p>حالا <code>/data</code> قابل استفاده است.</p>

<h2>بررسی Mount</h2>

<p>دستور:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">df -h</div></div>

<p>را اجرا می‌کنیم.</p>

<p>ممکن است چیزی شبیه:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Filesystem                    Size  Used Avail Use% Mounted on
/dev/mapper/storage_vg-data_lv 10G  ...   ...   ... /data</div></div>

<p>ببینیم.</p>

<p>یعنی LV ما واقعاً Mount شده است.</p>

<h2><code>lsblk</code> بعد از Mount</h2>

<p>حالا:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">lsblk</div></div>

<p>ممکن است چیزی شبیه:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">sdb                 10G disk
sdc                 10G disk
└─storage_vg-data_lv 10G lvm  /data</div></div>

<p>ببینیم.</p>

<p>این خروجی خیلی جالب است چون ساختار را به شکل درختی نشان می‌دهد.</p>

<h2>نقشه کامل Lab تا اینجا</h2>

<div class="code-container"><span class="code-label">نقشه</span><div class="code-block no-prompt">/dev/sdb ──→ PV ──┐
                   │
                   ├──→ storage_vg
                   │         │
/dev/sdc ──→ PV ──┘         │
                             ↓
                          data_lv
                            10GB
                             │
                             ↓
                            ext4
                             │
                             ↓
                           /data</div></div>

<p>اگر این تصویر را بفهمی، بخش بزرگی از LVM را فهمیده‌ای.</p>

<h2>حالا مشکل واقعی: فضای <code>/data</code> کم شده!</h2>

<p>فرض کنیم:</p>

<div class="code-container"><span class="code-label">فضا</span><div class="code-block no-prompt">/data = 10GB</div></div>

<p>است.</p>

<p>بعد از مدتی:</p>

<div class="code-container"><span class="code-label">مشکل</span><div class="code-block no-prompt">/data
 ↓
فضای کافی ندارد</div></div>

<p>اما خوشبختانه VG ما هنوز:</p>

<div class="code-container"><span class="code-label">فضای آزاد</span><div class="code-block no-prompt">10GB Free</div></div>

<p>دارد.</p>

<p>پس می‌توانیم از فضای آزاد VG به LV اضافه کنیم.</p>

<h2>افزایش LV با <code>lvextend</code></h2>

<p>فرض کنیم می‌خواهیم 5GB به LV اضافه کنیم.</p>

<p>دستور:</p>

<div class="code-container"><span class="code-label">افزایش</span><div class="code-block">sudo lvextend -L +5G /dev/storage_vg/data_lv</div></div>

<p>علامت:</p>

<div class="code-container"><span class="code-label">علامت</span><div class="code-block no-prompt">+5G</div></div>

<p>مهم است.</p>

<p>یعنی:</p>

<blockquote><strong>5GB به اندازه فعلی اضافه کن.</strong></blockquote>

<p>پس:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">قبل:
LV = 10GB

بعد:
LV = 15GB</div></div>

<h2>آیا Filesystem هم بزرگ شد؟</h2>

<p>اینجا یک نکته بسیار مهم وجود دارد.</p>

<p>بعد از:</p>

<div class="code-container"><span class="code-label">lvextend</span><div class="code-block">lvextend</div></div>

<p>ممکن است:</p>

<div class="code-container"><span class="code-label">تفاوت</span><div class="code-block no-prompt">LV = 15GB
Filesystem = 10GB</div></div>

<p>داشته باشیم.</p>

<p>یعنی فضای جدید وارد LV شده، اما Filesystem هنوز اندازه قبلی را می‌شناسد.</p>

<p>پس باید Filesystem را نیز افزایش دهیم.</p>

<h2>افزایش ext4 با <code>resize2fs</code></h2>

<p>برای ext4:</p>

<div class="code-container"><span class="code-label">افزایش</span><div class="code-block">sudo resize2fs /dev/storage_vg/data_lv</div></div>

<p>حالا:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">LV
15GB
 ↓
resize2fs
 ↓
Filesystem
15GB</div></div>

<p>و <code>/data</code> می‌تواند فضای جدید را استفاده کند.</p>

<h2>زنجیره افزایش فضای LVM</h2>

<p>این قسمت را خیلی خوب حفظ کن:</p>

<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">VG Free Space
      ↓
   lvextend
      ↓
   LV بزرگ‌تر
      ↓
  resize2fs
      ↓
Filesystem بزرگ‌تر</div></div>

<p>یعنی:</p>

<div class="code-container"><span class="code-label">lvextend</span><div class="code-block no-prompt">lvextend</div></div>

<p>خود LV را بزرگ می‌کند.</p>

<p>و:</p>

<div class="code-container"><span class="code-label">resize2fs</span><div class="code-block no-prompt">resize2fs</div></div>

<p>در این سناریو Filesystem <code>ext4</code> را بزرگ می‌کند.</p>

<h2>حالا فرض کنیم VG هم فضای آزاد ندارد</h2>

<p>سناریوی قبلی ساده بود:</p>

<div class="code-container"><span class="code-label">سناریو</span><div class="code-block no-prompt">VG
│
├── LV = 15GB
└── Free = 5GB</div></div>

<p>اما اگر:</p>

<div class="code-container"><span class="code-label">بدون فضا</span><div class="code-block no-prompt">VG
│
└── Free = 0GB</div></div>

<p>باشد، <code>lvextend</code> فضای جدیدی از خودش ایجاد نمی‌کند.</p>

<p>اول باید فضای فیزیکی جدید وارد VG کنیم.</p>

<p>فرض کنیم Disk جدید:</p>

<div class="code-container"><span class="code-label">دیسک جدید</span><div class="code-block no-prompt">/dev/sdd</div></div>

<p>داریم.</p>

<h2>اضافه کردن Disk جدید</h2>

<p>ابتدا بررسی:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">lsblk</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">sdb  10G
sdc  10G
sdd  10G</div></div>

<p>می‌بینیم.</p>

<p>حالا <code>/dev/sdd</code> را به PV تبدیل می‌کنیم:</p>

<div class="code-container"><span class="code-label">ساخت PV</span><div class="code-block">sudo pvcreate /dev/sdd</div></div>

<h2>اضافه کردن PV به VG با <code>vgextend</code></h2>

<p>حالا:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">/dev/sdd
   ↓
PV</div></div>

<p>داریم.</p>

<p>ولی هنوز عضو <code>storage_vg</code> نیست.</p>

<p>پس:</p>

<div class="code-container"><span class="code-label">اضافه</span><div class="code-block">sudo vgextend storage_vg /dev/sdd</div></div>

<p>حالا:</p>

<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">/dev/sdb ──→ PV ──┐
                   │
/dev/sdc ──→ PV ──┼──→ storage_vg
                   │
/dev/sdd ──→ PV ──┘</div></div>

<p>و VG فضای بیشتری پیدا می‌کند.</p>

<h2>بررسی وضعیت بعد از <code>vgextend</code></h2>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">sudo vgs</div></div>

<p>ممکن است:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">VG           #PV   #LV   VSize   VFree
storage_vg    3     1    30G     15G</div></div>

<p>ببینیم.</p>

<p>یعنی:</p>

<div class="code-container"><span class="code-label">تفسیر</span><div class="code-block no-prompt">3 PV
1 LV
30GB total
15GB free</div></div>

<p>حالا می‌توانیم از فضای آزاد استفاده کنیم.</p>

<h2>افزایش LV بعد از اضافه شدن Disk</h2>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">افزایش</span><div class="code-block">sudo lvextend -L +10G /dev/storage_vg/data_lv</div></div>

<p>حالا:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">LV
15GB
 ↓
+10GB
 ↓
25GB</div></div>

<p>اما دوباره:</p>

<div class="code-container"><span class="code-label">Filesystem</span><div class="code-block no-prompt">Filesystem</div></div>

<p>را نیز باید بررسی و در صورت نیاز Resize کنیم.</p>

<p>برای ext4:</p>

<div class="code-container"><span class="code-label">Resize</span><div class="code-block">sudo resize2fs /dev/storage_vg/data_lv</div></div>

<h2>یک روش مهم‌تر برای <code>lvextend</code></h2>

<p><code>lvextend</code> گزینه‌ای دارد که می‌تواند Filesystem را هم هنگام افزایش LV Resize کند.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">با -r</span><div class="code-block">sudo lvextend -r -L +10G /dev/storage_vg/data_lv</div></div>

<p>گزینه:</p>

<div class="code-container"><span class="code-label">-r</span><div class="code-block no-prompt">-r</div></div>

<p>به LVM می‌گوید Resize مربوط به Filesystem را نیز انجام دهد.</p>

<p>در نتیجه به صورت مفهومی:</p>

<div class="code-container"><span class="code-label">ترکیب</span><div class="code-block no-prompt">lvextend
   +
Filesystem Resize</div></div>

<p>در یک مرحله انجام می‌شود.</p>

<p>با این حال برای یادگیری LPIC-1 بهتر است تفاوت این دو مرحله را <strong>کاملاً بفهمی</strong>:</p>

<div class="code-container"><span class="code-label">تفکیک</span><div class="code-block no-prompt">lvextend
 ↓
LV بزرگ‌تر

resize2fs
 ↓
Filesystem بزرگ‌تر</div></div>

<p>حتی اگر در عمل بتوانیم آنها را با <code>-r</code> ترکیب کنیم.</p>

<h2>بررسی نهایی با <code>df</code></h2>

<p>بعد از Resize:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">df -h</div></div>

<p>می‌زنیم.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Filesystem                     Size
/dev/mapper/storage_vg-data_lv 25G</div></div>

<p>حالا Filesystem نیز فضای جدید را می‌بیند.</p>

<h2>بررسی کل ساختار با <code>lsblk</code></h2>

<p>همچنین:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">lsblk</div></div>

<p>برای مشاهده ساختار بسیار مفید است:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">sdb
sdc
sdd
└─storage_vg-data_lv</div></div>

<p>و Mount Point را نیز می‌توانیم ببینیم:</p>

<div class="code-container"><span class="code-label">Mount</span><div class="code-block no-prompt">/data</div></div>

<p>پس برای عیب‌یابی Storage معمولاً ترکیبی از:</p>

<div class="code-container"><span class="code-label">ترکیب</span><div class="code-block no-prompt">lsblk
pvs
vgs
lvs
df -h</div></div>

<p>خیلی کاربردی است.</p>

<h2>پنج دستور بررسی مهم LVM</h2>

<p>این پنج فرمان را خوب یاد بگیر:</p>

<h3>PV</h3>
<div class="code-container"><span class="code-label">PV</span><div class="code-block">pvs</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">PV</span><div class="code-block">pvdisplay</div></div>

<h3>VG</h3>
<div class="code-container"><span class="code-label">VG</span><div class="code-block">vgs</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">VG</span><div class="code-block">vgdisplay</div></div>

<h3>LV</h3>
<div class="code-container"><span class="code-label">LV</span><div class="code-block">lvs</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">LV</span><div class="code-block">lvdisplay</div></div>

<h3>Disk / Block Device</h3>
<div class="code-container"><span class="code-label">Disk</span><div class="code-block">lsblk</div></div>

<h3>Filesystem / فضای قابل استفاده</h3>
<div class="code-container"><span class="code-label">Filesystem</span><div class="code-block">df -h</div></div>

<p>پس:</p>

<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">lsblk → Disk / Partition / LVM structure
pvs   → PV
vgs   → VG
lvs   → LV
df -h → Filesystem / Used / Available</div></div>

<h2>تفاوت <code>pvs</code>، <code>vgs</code> و <code>lvs</code></h2>

<p>این سه دستور را نباید قاطی کنی.</p>

<div class="code-container"><span class="code-label">pvs</span><div class="code-block no-prompt">pvs
 ↓
Physical Volume</div></div>

<div class="code-container"><span class="code-label">vgs</span><div class="code-block no-prompt">vgs
 ↓
Volume Group</div></div>

<div class="code-container"><span class="code-label">lvs</span><div class="code-block no-prompt">lvs
 ↓
Logical Volume</div></div>

<p>یک روش خیلی ساده برای حفظ کردن:</p>

<div class="code-container"><span class="code-label">یادآوری</span><div class="code-block no-prompt">p → Physical
v → Volume
s → Summary</div></div>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">pvs → PV
vgs → VG
lvs → LV</div></div>

<h2>اگر بخواهیم LV را حذف کنیم چه می‌شود؟</h2>

<p>برای حذف LV:</p>

<div class="code-container"><span class="code-label">حذف</span><div class="code-block">sudo lvremove /dev/storage_vg/data_lv</div></div>

<p>اما قبل از آن باید مطمئن شویم LV موردنظر:</p>
<ul>
    <li>Mount نباشد.</li>
    <li>داده مهمی روی آن نباشد.</li>
    <li>Device صحیح باشد.</li>
</ul>

<p>مثلاً ابتدا:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">mount</div></div>

<p>یا:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">lsblk</div></div>

<p>را بررسی می‌کنیم.</p>

<p>بعد اگر مطمئن بودیم:</p>

<div class="code-container"><span class="code-label">Unmount</span><div class="code-block">sudo umount /data</div></div>

<p>و سپس:</p>

<div class="code-container"><span class="code-label">حذف</span><div class="code-block">sudo lvremove /dev/storage_vg/data_lv</div></div>

<h2>ترتیب حذف LVM</h2>

<p>در ساخت LVM داشتیم:</p>

<div class="code-container"><span class="code-label">ساخت</span><div class="code-block no-prompt">PV
 ↓
VG
 ↓
LV
 ↓
Filesystem
 ↓
Mount</div></div>

<p>برای حذف، منطقی است از لایه بالاتر به پایین‌تر حرکت کنیم.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">حذف</span><div class="code-block no-prompt">Unmount
   ↓
LV remove
   ↓
VG remove
   ↓
PV remove</div></div>

<p>فرمان‌های مربوطه:</p>

<div class="code-container"><span class="code-label">فرمان‌ها</span><div class="code-block no-prompt">umount
lvremove
vgremove
pvremove</div></div>

<h2>حذف VG</h2>

<p>فرض کنیم LVها حذف شده‌اند و می‌خواهیم VG را حذف کنیم:</p>

<div class="code-container"><span class="code-label">حذف VG</span><div class="code-block">sudo vgremove storage_vg</div></div>

<p>بعد VG دیگر وجود ندارد.</p>

<h2>حذف PV</h2>

<p>بعد از اینکه PV دیگر عضو VG نیست:</p>

<div class="code-container"><span class="code-label">حذف PV</span><div class="code-block">sudo pvremove /dev/sdb</div></div>

<p>یا مثلاً:</p>

<div class="code-container"><span class="code-label">حذف</span><div class="code-block">sudo pvremove /dev/sdc</div></div>

<p>می‌توانیم PV را از LVM خارج کنیم.</p>

<p>پس ساخت:</p>

<div class="code-container"><span class="code-label">ساخت</span><div class="code-block no-prompt">pvcreate
 ↓
vgcreate
 ↓
lvcreate</div></div>

<p>و حذف:</p>

<div class="code-container"><span class="code-label">حذف</span><div class="code-block no-prompt">lvremove
 ↓
vgremove
 ↓
pvremove</div></div>

<h2>نکته مهم درباره <code>pvremove</code></h2>

<p>نباید این کار را روی PVای که هنوز عضو VG است انجام دهی.</p>

<p>اول باید رابطه LVM را بررسی کنیم:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">pvs
vgs
lvs</div></div>

<p>و مطمئن شویم PV موردنظر دیگر در VG استفاده نمی‌شود.</p>

<h2>Mount دائمی — <code>/etc/fstab</code></h2>

<p>تا اینجا اگر اجرا کنیم:</p>

<div class="code-container"><span class="code-label">Mount</span><div class="code-block">mount /dev/storage_vg/data_lv /data</div></div>

<p>Mount انجام می‌شود.</p>

<p>اما یک مشکل داریم:</p>

<blockquote>بعد از Reboot ممکن است این Mount به شکل دستی باقی نماند.</blockquote>

<p>برای Mount خودکار هنگام Boot معمولاً از:</p>

<div class="code-container"><span class="code-label">fstab</span><div class="code-block no-prompt">/etc/fstab</div></div>

<p>استفاده می‌کنیم.</p>

<p>ساختار کلی:</p>

<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">Filesystem     Mount Point    Type    Options</div></div>

<p>مثلاً می‌توانیم Device یا ترجیحاً UUID مربوط به Filesystem را در <code>fstab</code> قرار دهیم.</p>

<h2>چرا UUID مهم است؟</h2>

<p>ممکن است نام Deviceها مثل:</p>

<div class="code-container"><span class="code-label">نام</span><div class="code-block no-prompt">/dev/sdb
/dev/sdc</div></div>

<p>در شرایط مختلف تغییر کند.</p>

<p>برای Filesystem می‌توانیم UUID را بررسی کنیم:</p>

<div class="code-container"><span class="code-label">UUID</span><div class="code-block">blkid</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">/dev/storage_vg/data_lv: UUID="..." TYPE="ext4"</div></div>

<p>سپس UUID را در <code>/etc/fstab</code> استفاده می‌کنیم.</p>

<p>نکته مهم LPIC-1:</p>

<div class="code-container"><span class="code-label">fstab</span><div class="code-block no-prompt">/etc/fstab
 ↓
Mountهای دائمی / خودکار</div></div>

<h2>سناریوی کامل از صفر تا مدیریت</h2>

<p>حالا کل جلسه را بدون توقف مرور کنیم.</p>

<h3>۱. شناسایی:</h3>
<div class="code-container"><span class="code-label">شناسایی</span><div class="code-block">lsblk</div></div>

<h3>۲. ساخت PV:</h3>
<div class="code-container"><span class="code-label">ساخت PV</span><div class="code-block">sudo pvcreate /dev/sdb /dev/sdc</div></div>

<h3>۳. بررسی:</h3>
<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">sudo pvs</div></div>

<h3>۴. ساخت VG:</h3>
<div class="code-container"><span class="code-label">ساخت VG</span><div class="code-block">sudo vgcreate storage_vg /dev/sdb /dev/sdc</div></div>

<h3>۵. بررسی:</h3>
<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">sudo vgs</div></div>

<h3>۶. ساخت LV:</h3>
<div class="code-container"><span class="code-label">ساخت LV</span><div class="code-block">sudo lvcreate -n data_lv -L 10G storage_vg</div></div>

<h3>۷. بررسی:</h3>

<h2>RAID چیست؟</h2>

<p>RAID مخفف عبارت زیر است:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">Redundant Array of Independent Disks</div></div>

<p>به زبان ساده:</p>

<blockquote>RAID یعنی چند Disk را با یک روش مشخص ترکیب کنیم تا از دید سیستم یک Storage منطقی ایجاد شود.</blockquote>

<p>هدف از استفاده از RAID می‌تواند یکی یا ترکیبی از موارد زیر باشد:</p>

<ul>
    <li>افزایش Performance</li>
    <li>افزایش Fault Tolerance</li>
    <li>افزایش Availability</li>
    <li>ترکیب ظرفیت چند Disk</li>
    <li>ایجاد تعادل بین Performance، Redundancy و ظرفیت قابل استفاده</li>
</ul>

<p>اما باید از ابتدا یک نکته بسیار مهم را بدانیم:</p>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>RAID جایگزین Backup نیست.</strong><br>
RAID ممکن است در برابر خرابی یک یا چند Disk از اطلاعات محافظت کند، اما لزوماً از شما در برابر موارد زیر محافظت نمی‌کند:
<ul>
    <li>حذف اشتباهی فایل</li>
    <li>خراب شدن داده</li>
    <li>حذف شدن فایل توسط کاربر</li>
    <li>خرابی File System</li>
    <li>حملات یا مشکلات نرم‌افزاری</li>
</ul>
پس: <strong>RAID ≠ Backup</strong></div></div>

<h2>RAID چگونه کار می‌کند؟</h2>

<p>فرض کنید فقط یک Disk داریم:</p>

<div class="code-container"><span class="code-label">یک دیسک</span><div class="code-block no-prompt">Disk 1
  ↓
100 GB</div></div>

<p>اگر این Disk خراب شود، ممکن است تمام Storage از دسترس خارج شود.</p>

<p>حالا فرض کنید چند Disk داریم:</p>

<div class="code-container"><span class="code-label">چند دیسک</span><div class="code-block no-prompt">Disk 1
Disk 2
Disk 3
Disk 4</div></div>

<p>می‌توانیم این Diskها را به روش‌های مختلف با هم ترکیب کنیم.</p>

<p>این روش ترکیب را:</p>

<div class="code-container"><span class="code-label">RAID Level</span><div class="code-block no-prompt">RAID Level</div></div>

<p>می‌نامیم.</p>

<p>هر RAID Level مشخص می‌کند:</p>

<ul>
    <li>داده چگونه بین Diskها توزیع شود.</li>
    <li>آیا داده کپی شود یا نه.</li>
    <li>آیا اطلاعات Parity وجود داشته باشد یا نه.</li>
    <li>چند Disk می‌توانند خراب شوند.</li>
    <li>چه مقدار از ظرفیت خام قابل استفاده باشد.</li>
</ul>

<h2>سه مفهوم اصلی قبل از یادگیری RAID Levelها</h2>

<p>قبل از بررسی RAID 0، RAID 1 و سایر Levelها، ابتدا باید سه مفهوم اصلی را یاد بگیریم.</p>

<h3>Striping</h3>

<p>در Striping، داده بین چند Disk تقسیم می‌شود.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">داده</span><div class="code-block no-prompt">Data:

A B C D E F G H</div></div>

<p>بین دو Disk:</p>

<div class="code-container"><span class="code-label">Striping</span><div class="code-block no-prompt">Disk 1        Disk 2

A             B
C             D
E             F
G             H</div></div>

<p>نتیجه:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">چند Disk
    ↓
مشارکت همزمان در I/O
    ↓
Performance بهتر</div></div>

<p>اما Striping به‌تنهایی هیچ محافظتی در برابر خرابی Disk ایجاد نمی‌کند.</p>

<h3>Mirroring</h3>

<p>در Mirroring، یک نسخه یکسان از داده روی Disk دیگر نگهداری می‌شود.</p>

<div class="code-container"><span class="code-label">Mirroring</span><div class="code-block no-prompt">Disk 1        Disk 2

A             A
B             B
C             C
D             D</div></div>

<p>پس:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">Data
 ↓
Copy
 ↓
Redundancy</div></div>

<p>اگر یکی از Diskها خراب شود، نسخه دیگر همچنان وجود دارد.</p>

<h3>Parity</h3>

<p>Parity اطلاعات اضافی‌ای است که برای کمک به بازسازی داده در صورت خرابی Disk استفاده می‌شود.</p>

<p>به صورت مفهومی:</p>

<div class="code-container"><span class="code-label">Parity</span><div class="code-block no-prompt">Data
+
Parity
↓
Recovery Capability</div></div>

<p>در RAIDهای مختلف، Parity می‌تواند:</p>

<ul>
    <li>روی یک Disk اختصاصی قرار بگیرد.</li>
    <li>بین Diskها توزیع شود.</li>
    <li>به صورت یک یا دو مجموعه Parity وجود داشته باشد.</li>
</ul>

<h2>RAID Level چیست؟</h2>

<p>RAID Level مشخص می‌کند که Diskها چگونه با هم کار کنند.</p>

<p>Levelهای مهم این جلسه:</p>

<div class="code-container"><span class="code-label">Levelها</span><div class="code-block no-prompt">RAID 0
RAID 1
RAID 4
RAID 5
RAID 6
RAID 10</div></div>

<p>برای یادگیری بهتر، آن‌ها را در سه گروه بررسی می‌کنیم:</p>

<div class="code-container"><span class="code-label">دسته‌بندی</span><div class="code-block no-prompt">RAID
│
├── Performance
│   └── RAID 0
│
├── Mirroring
│   └── RAID 1
│
├── Parity-based RAID
│   ├── RAID 4
│   ├── RAID 5
│   └── RAID 6
│
└── Combined RAID
    └── RAID 10</div></div>

<h2>RAID 0 — Striping برای Performance</h2>

<h3>مفهوم اصلی</h3>

<p>RAID 0 فقط از:</p>

<div class="code-container"><span class="code-label">Striping</span><div class="code-block no-prompt">Striping</div></div>

<p>استفاده می‌کند.</p>

<p>داده بین چند Disk تقسیم می‌شود:</p>

<div class="code-container"><span class="code-label">نمونه</span><div class="code-block no-prompt">Disk 1        Disk 2

A             B
C             D
E             F
G             H</div></div>

<h3>مزایا</h3>

<p>مهم‌ترین مزیت RAID 0:</p>

<div class="code-container"><span class="code-label">مزیت</span><div class="code-block no-prompt">Performance ↑</div></div>

<p>چون چند Disk می‌توانند هم‌زمان در عملیات I/O شرکت کنند.</p>

<p>همچنین تقریباً تمام ظرفیت Diskها قابل استفاده است.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">2 × 1 TB</div></div>

<p>تقریباً:</p>

<div class="code-container"><span class="code-label">فضا</span><div class="code-block no-prompt">Usable = 2 TB</div></div>

<h3>مشکل RAID 0</h3>

<p>RAID 0 هیچ Redundancy ندارد.</p>

<p>اگر یکی از Diskها خراب شود:</p>

    ↓
Array Data Unavailable</div></div>

<p>پس:</p>

<div class="code-container"><span class="code-label">خلاصه RAID 0</span><div class="code-block no-prompt">RAID 0
↓
Striping
↓
Speed
↓
No Fault Tolerance</div></div>

<h3>حداقل تعداد Disk</h3>

<div class="code-container"><span class="code-label">حداقل</span><div class="code-block no-prompt">2 Disk</div></div>

<h2>RAID 1 — Mirroring برای Redundancy</h2>

<h3>مفهوم اصلی</h3>

<p>RAID 1 از:</p>

<div class="code-container"><span class="code-label">Mirroring</span><div class="code-block no-prompt">Mirroring</div></div>

<p>استفاده می‌کند.</p>

<div class="code-container"><span class="code-label">نمونه</span><div class="code-block no-prompt">Disk 1        Disk 2

A             A
B             B
C             C
D             D</div></div>

<p>هر دو Disk نسخه‌ای از داده را نگهداری می‌کنند.</p>

<h3>مزیت اصلی</h3>

<p>اگر یکی از Diskها خراب شود:</p>

<div class="code-container"><span class="code-label">خرابی</span><div class="code-block no-prompt">Disk 1 → FAILED
Disk 2 → OK</div></div>

<p>داده همچنان روی Disk دیگر وجود دارد.</p>

<p>در یک Mirror دو دیسکی:</p>

<div class="code-container"><span class="code-label">تحمل خرابی</span><div class="code-block no-prompt">1 Disk Failure Tolerance</div></div>

<h3>هزینه RAID 1</h3>

<p>فرض کنید:</p>

<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">2 × 1 TB</div></div>

<p>داریم.</p>

<p>فضای قابل استفاده تقریباً:</p>

<div class="code-container"><span class="code-label">فضا</span><div class="code-block no-prompt">1 TB</div></div>

<p>است.</p>

<p>چون داده روی هر دو Disk کپی می‌شود.</p>

<h3>Read و Write</h3>

<p>در RAID 1:</p>

<ul>
    <li>هنگام Write داده باید روی Mirrorها نوشته شود.</li>
    <li>در Read می‌توان از Diskهای مختلف استفاده کرد.</li>
</ul>

<p>اما مهم‌ترین ویژگی RAID 1 همچنان:</p>

<div class="code-container"><span class="code-label">ویژگی</span><div class="code-block no-prompt">Redundancy</div></div>

<p>است.</p>

<h3>حداقل تعداد Disk</h3>

<div class="code-container"><span class="code-label">حداقل</span><div class="code-block no-prompt">2 Disk</div></div>

<h3>خلاصه</h3>

<div class="code-container"><span class="code-label">خلاصه RAID 1</span><div class="code-block no-prompt">RAID 1
↓
Mirroring
↓
Redundancy
↓
≈ 50% Usable Capacity</div></div>

<h2>RAIDهای مبتنی بر Parity</h2>

<p>اکنون وارد خانواده‌ای می‌شویم که ترکیبی از:</p>

<div class="code-container"><span class="code-label">ترکیب</span><div class="code-block no-prompt">Striping
+
Parity</div></div>

<p>هستند.</p>

<p>مهم‌ترین تفاوت RAID 4، RAID 5 و RAID 6 در نحوه استفاده از Parity و میزان Fault Tolerance است.</p>

<h2>RAID 4 — Dedicated Parity</h2>

<p>RAID 4 از:</p>

<div class="code-container"><span class="code-label">RAID 4</span><div class="code-block no-prompt">Striping + Parity</div></div>

<p>استفاده می‌کند.</p>

<p>اما Parity روی یک Disk اختصاصی قرار می‌گیرد:</p>

<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">Disk 1 → Data
Disk 2 → Data
Disk 3 → Data
Disk 4 → Parity</div></div>

<p>مشکل اصلی:</p>

<div class="code-container"><span class="code-label">مشکل</span><div class="code-block no-prompt">Dedicated Parity Disk
        ↓
Possible Bottleneck</div></div>

<p>به همین دلیل RAID 4 نسبت به RAID 5 کاربرد بسیار کمتری دارد.</p>

<p>مهم‌ترین نکته‌ای که باید به خاطر بسپارید:</p>

<div class="code-container"><span class="code-label">نکته</span><div class="code-block no-prompt">RAID 4
↓
Parity روی یک Disk مشخص</div></div>

<h2>RAID 5 — Distributed Parity</h2>

<p>RAID 5 از:</p>

<div class="code-container"><span class="code-label">RAID 5</span><div class="code-block no-prompt">Striping
+
Distributed Parity</div></div>

<p>استفاده می‌کند.</p>

<p>برخلاف RAID 4، اطلاعات Parity روی یک Disk ثابت قرار ندارد.</p>

<p>Parity بین Diskها توزیع می‌شود.</p>

<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">Disk 1 → Data + Parity
Disk 2 → Data + Parity
Disk 3 → Data + Parity</div></div>

<p>به این ساختار:</p>

<div class="code-container"><span class="code-label">Distributed Parity</span><div class="code-block no-prompt">Distributed Parity</div></div>

<p>می‌گوییم.</p>

<h3>Fault Tolerance</h3>

<p>اگر یک Disk خراب شود:</p>

<div class="code-container"><span class="code-label">خرابی</span><div class="code-block no-prompt">1 Disk Failed</div></div>

<div class="code-container"><span class="code-label">بازسازی</span><div class="code-block no-prompt">Remaining Data
+
Parity</div></div>

<p>داده‌های موردنیاز را بازسازی کند.</p>

<p>پس:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">RAID 5
↓
1 Disk Failure Tolerance</div></div>

<div class="code-container"><span class="code-label">حداقل</span><div class="code-block no-prompt">3 Disk</div></div>

<div class="code-container"><span class="code-label">فرمول</span><div class="code-block no-prompt">Usable ≈ (N - 1) × Size</div></div>

<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">3 × 1 TB</div></div>

<div class="code-container"><span class="code-label">فضا</span><div class="code-block no-prompt">2 TB Usable</div></div>

<p>یا:</p>

<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">4 × 1 TB</div></div>

<div class="code-container"><span class="code-label">فضا</span><div class="code-block no-prompt">3 TB Usable</div></div>

↓
1 Disk Failure
↓

<h2>Hardware RAID و Software RAID</h2>

<p>RAID به دو شکل کلی پیاده‌سازی می‌شود.</p>

<h3>Hardware RAID</h3>

<p>در Hardware RAID یک RAID Controller مدیریت RAID را انجام می‌دهد.</p>

<div class="code-container"><span class="code-label">Hardware RAID</span><div class="code-block no-prompt">Disk 1 ─┐
Disk 2 ─┼──→ RAID Controller ──→ OS
Disk 3 ─┘</div></div>

<p>سیستم‌عامل معمولاً Storage منطقی ارائه‌شده توسط Controller را مشاهده می‌کند.</p>

<h3>Software RAID</h3>

<p>در Software RAID، سیستم‌عامل و Kernel مسئول مدیریت RAID هستند.</p>

<p>در Linux، ابزار مهم:</p>

<div class="code-container"><span class="code-label">ابزار</span><div class="code-block">mdadm</div></div>

<p>است.</p>

<p>به صورت مفهومی:</p>

<div class="code-container"><span class="code-label">Software RAID</span><div class="code-block no-prompt">Disk 1 ─┐
Disk 2 ─┼──→ Linux Kernel / mdadm
Disk 3 ─┘</div></div>

<p>در این دوره تمرکز ما روی:</p>

<blockquote><strong>Software RAID در Linux</strong></blockquote>

<p>است.</p>

<h2>ابزارهای مهم Software RAID در Linux</h2>

<h3><code>--create</code></h3>

<blockquote>یک RAID جدید ایجاد کن.</blockquote>

/dev/sdc1</div></div>

<div class="code-container"><span class="code-label">RAID Device</span><div class="code-block no-prompt">/dev/md0</div></div>

<h3><code>--level=0</code></h3>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">RAID 0</span><div class="code-block no-prompt">RAID 0</div></div>

<h3><code>--raid-devices=2</code></h3>
<p>یعنی:</p>
<blockquote>این RAID شامل 2 Device است.</blockquote>

<h3><code>/dev/sdb1 /dev/sdc1</code></h3>
<p>Memberهای RAID هستند.</p>

<h2>RAID Device چیست؟</h2>

<p>بعد از ساخت:</p>

<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">/dev/sdb1 ─┐
           ├──→ /dev/md0
/dev/sdc1 ─┘</div></div>

<p>از اینجا به بعد:</p>

<div class="code-container"><span class="code-label">RAID Device</span><div class="code-block no-prompt">/dev/md0</div></div>

<p>برای ما یک Storage منطقی محسوب می‌شود.</p>

<p>یعنی:</p>

<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">Physical Devices
      ↓
    mdadm
      ↓
   /dev/md0
      ↓
 Filesystem
      ↓
    Mount</div></div>

<p>این مفهوم بسیار مهم است.</p>

<h2>بررسی RAID بعد از ساخت</h2>

<p>یکی از مهم‌ترین دستورات:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">cat /proc/mdstat</div></div>

<p>است.</p>

<p>مثلاً ممکن است چیزی شبیه این ببینی:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Personalities : [raid0]
md0 : active raid0 sdc1 sdb1
      ...</div></div>

<p>این فایل اطلاعات RAIDهای <code>md</code> را از Kernel نشان می‌دهد.</p>

<p>پس:</p>

<div class="code-container"><span class="code-label">نقش</span><div class="code-block no-prompt">cat /proc/mdstat
   ↓
وضعیت کلی Software RAIDهای فعال را ببین.</div></div>

<h2>بررسی جزئیات RAID</h2>

<p>دستور مهم بعدی:</p>

<div class="code-container"><span class="code-label">جزئیات</span><div class="code-block">sudo mdadm --detail /dev/md0</div></div>

<p>است.</p>

<p>این دستور اطلاعات دقیق Array را نمایش می‌دهد.</p>

<p>مثلاً مواردی مانند:</p>

<div class="code-container"><span class="code-label">اطلاعات</span><div class="code-block no-prompt">Raid Level
Raid Devices
State
Active Devices
Working Devices
Failed Devices</div></div>

<p>را می‌توانیم مشاهده کنیم.</p>

<h2>بررسی Metadata روی Disk</h2>

<p>برای بررسی اطلاعات RAID روی یک Member:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">sudo mdadm --examine /dev/sdb1</div></div>

<p>یا فرم کوتاه:</p>

<div class="code-container"><span class="code-label">فرم کوتاه</span><div class="code-block">sudo mdadm -E /dev/sdb1</div></div>

<p>و:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">sudo mdadm -E /dev/sdc1</div></div>

<p>این دستور اطلاعات RAID Metadata/Superblock را بررسی می‌کند.</p>

<p>پس سه دستور مهم را کنار هم داشته باش:</p>

<div class="code-container"><span class="code-label">سه دستور</span><div class="code-block no-prompt">cat /proc/mdstat
        ↓
وضعیت کلی

mdadm --detail /dev/md0
        ↓
جزئیات Array

mdadm --examine /dev/sdb1
        ↓
Metadata روی Member</div></div>

<h2>RAID هنوز Filesystem ندارد!</h2>

<p>این اشتباه خیلی مهم است.</p>

<p>بعد از:</p>

<div class="code-container"><span class="code-label">ساخت</span><div class="code-block">mdadm --create ...</div></div>

<p>هنوز نمی‌توانیم انتظار داشته باشیم RAID مثل یک Directory معمولی قابل استفاده باشد.</p>

<p>چون ساختار ما فعلاً:</p>

<div class="code-container"><span class="code-label">وضعیت</span><div class="code-block no-prompt">Disk
 ↓
Partition
 ↓
RAID
 ↓
???</div></div>

<p>است.</p>

<p>باید روی RAID یک Filesystem بسازیم.</p>

<h2>ساخت Filesystem روی RAID</h2>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">ساخت</span><div class="code-block">sudo mkfs.ext4 /dev/md0</div></div>

<p>حالا ساختار:</p>

<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">/dev/sdb1 ─┐
           ├──→ /dev/md0
/dev/sdc1 ─┘
               ↓
             ext4</div></div>

<h2>ساخت Mount Point</h2>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">ایجاد</span><div class="code-block">sudo mkdir /mnt/raid0</div></div>

<h2>Mount کردن RAID</h2>

<p>حالا:</p>

<div class="code-container"><span class="code-label">Mount</span><div class="code-block">sudo mount /dev/md0 /mnt/raid0</div></div>

<p>بررسی:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">df -h</div></div>

<p>یا:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">lsblk</div></div>

<p>اکنون:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">/dev/md0
   ↓
ext4
   ↓
/mnt/raid0</div></div>

<h2>تست عملی RAID</h2>

<p>یک فایل آزمایشی بساز:</p>

<div class="code-container"><span class="code-label">تست</span><div class="code-block">sudo touch /mnt/raid0/test.txt</div></div>

<p>یا:</p>

<div class="code-container"><span class="code-label">تست</span><div class="code-block">echo "Hello RAID" | sudo tee /mnt/raid0/test.txt</div></div>

<p>بررسی:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">ls -l /mnt/raid0</div></div>

<p>اگر فایل را دیدی، مسیر:</p>

<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">Disk
→ Partition
→ RAID
→ Filesystem
→ Mount</div></div>

<p>به درستی انجام شده است.</p>

<h2>نکته مهم درباره RAID 0</h2>

<p>اگر یکی از Diskهای RAID 0 خراب شود:</p>

<div class="code-container"><span class="code-label">خرابی</span><div class="code-block no-prompt">/dev/sdb1 → FAILED</div></div>

<p>دیگر نباید انتظار داشته باشیم اطلاعات RAID 0 حفظ شوند.</p>

<p>چون:</p>

<div class="code-container"><span class="code-label">RAID 0</span><div class="code-block no-prompt">RAID 0
=
Striping
=
No Redundancy</div></div>

<p>پس RAID 0 برای داده‌ای که تنها نسخه آن است انتخاب مناسبی نیست.</p>

<h2>ساخت RAID 1</h2>

<p>حالا RAID 1 را بررسی کنیم.</p>

<p>RAID 1 از:</p>

<blockquote><strong>Mirroring</strong></blockquote>

<p>استفاده می‌کند.</p>

<p>برای ساخت RAID 1 با دو Partition:</p>

<div class="code-container"><span class="code-label">ساخت RAID 1</span><div class="code-block">sudo mdadm --create /dev/md1 \
  --level=1 \
  --raid-devices=2 \
  /dev/sdb1 /dev/sdc1</div></div>

<p>یا:</p>

<div class="code-container"><span class="code-label">فرم کوتاه</span><div class="code-block">sudo mdadm -C /dev/md1 -l 1 -n 2 /dev/sdb1 /dev/sdc1</div></div>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>نکته</strong><br>اگر <code>/dev/sdb1</code> و <code>/dev/sdc1</code> قبلاً عضو RAID دیگری هستند، مستقیماً از آنها برای Array جدید استفاده نکن. ابتدا باید Array قبلی را متوقف و Metadata آن را پاک کنی. اینجا صرفاً سناریوی ساخت یک RAID 1 جدید را نشان می‌دهیم.</div></div>

<h2>وضعیت RAID 1</h2>

<p>بعد از ایجاد:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">cat /proc/mdstat</div></div>

<p>ممکن است چیزی شبیه:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">md1 : active raid1 sdc1 sdb1</div></div>

<p>bبینی.</p>

<p>در هنگام ساخت RAID 1 ممکن است عملیات:</p>

<blockquote><strong>Resync</strong></blockquote>

<p>نیز انجام شود.</p>

<h2>Resync چیست؟</h2>

<p>در RAID 1، باید اطلاعات Mirror شوند.</p>

<p>یعنی:</p>

<div class="code-container"><span class="code-label">Mirror</span><div class="code-block no-prompt">Disk 1
   ↓
   Data
   ↓
Disk 2</div></div>

<p>در زمان ساخت یا بعضی عملیات‌های مدیریتی، Linux باید وضعیت Mirror را Synchronize کند.</p>

<p>این فرآیند:</p>

<blockquote><strong>Resync</strong></blockquote>

<p>نام دارد.</p>

<p>و وضعیت آن را می‌توانیم با:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">cat /proc/mdstat</div></div>

<p>مشاهده کنیم.</p>

<h2>ساخت Filesystem روی RAID 1</h2>

<p>بعد از آماده شدن Array:</p>

<div class="code-container"><span class="code-label">ساخت</span><div class="code-block">sudo mkfs.ext4 /dev/md1</div></div>

<p>سپس:</p>

<div class="code-container"><span class="code-label">ایجاد</span><div class="code-block">sudo mkdir /mnt/raid1</div></div>

<p>و:</p>

<div class="code-container"><span class="code-label">Mount</span><div class="code-block">sudo mount /dev/md1 /mnt/raid1</div></div>

<p>بررسی:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">df -h</div></div>

<h2>مهم‌ترین بخش عملی: شبیه‌سازی خرابی Disk</h2>

<p>حالا می‌رسیم به بخش بسیار مهم مدیریت RAID.</p>

<p>فرض کنیم RAID 1 داریم:</p>

<div class="code-container"><span class="code-label">RAID 1</span><div class="code-block no-prompt">/dev/md1

/dev/sdb1 → Active
/dev/sdc1 → Active</div></div>

<p>حالا <code>/dev/sdb1</code> خراب شده است.</p>

<h2>علامت‌گذاری Disk به عنوان Faulty</h2>

<p>برای اعلام خرابی یک Member به <code>mdadm</code>:</p>

<div class="code-container"><span class="code-label">Fail</span><div class="code-block">sudo mdadm /dev/md1 --fail /dev/sdb1</div></div>

<p>یا:</p>

<div class="code-container"><span class="code-label">Fail</span><div class="code-block">sudo mdadm --manage /dev/md1 --fail /dev/sdb1</div></div>

<p>اینجا:</p>

<div class="code-container"><span class="code-label">--fail</span><div class="code-block no-prompt">--fail</div></div>

<p>یعنی:</p>

<blockquote>این Member را خراب/Failed در نظر بگیر.</blockquote>

<h2>بررسی وضعیت بعد از Fail</h2>

<p>حالا:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">cat /proc/mdstat</div></div>

<p>و:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">sudo mdadm --detail /dev/md1</div></div>

<p>را اجرا کن.</p>

<p>باید متوجه شوی که یکی از Deviceها:</p>

<div class="code-container"><span class="code-label">Failed</span><div class="code-block no-prompt">Failed</div></div>

<p>شده است.</p>

<p>اما RAID 1 همچنان می‌تواند با Disk سالم کار کند.</p>

<p>این همان مزیت اصلی RAID 1 است.</p>

<h2>چرا باید Disk خراب را Remove کنیم؟</h2>

<p>بعد از Fail کردن Member، بهتر است آن را از Array خارج کنیم.</p>

<p>دستور:</p>

<div class="code-container"><span class="code-label">Remove</span><div class="code-block">sudo mdadm /dev/md1 --remove /dev/sdb1</div></div>

<p>یا:</p>

<div class="code-container"><span class="code-label">Remove</span><div class="code-block">sudo mdadm --manage /dev/md1 --remove /dev/sdb1</div></div>

<p>اینجا:</p>

<div class="code-container"><span class="code-label">--remove</span><div class="code-block no-prompt">--remove</div></div>

<p>یعنی:</p>

<blockquote>Member خراب را از Array حذف کن.</blockquote>

<h2>Fail و Remove چه تفاوتی دارند؟</h2>

<p>این دو را قاطی نکن.</p>

<h3><code>--fail</code></h3>
<p>می‌گوید:</p>
<blockquote>این Disk دیگر قابل اعتماد نیست؛ آن را Failed کن.</blockquote>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">Active
  ↓
Failed</div></div>

<h3><code>--remove</code></h3>
<p>می‌گوید:</p>
<blockquote>این Member Failed را از Array خارج کن.</blockquote>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">Failed
  ↓
Removed</div></div>

<p>پس سناریوی معمول:</p>

<div class="code-container"><span class="code-label">سناریو</span><div class="code-block no-prompt">Failure
   ↓
--fail
   ↓
Failed
   ↓
--remove
   ↓
Removed</div></div>

<h2>جایگزین کردن Disk خراب</h2>

<p>فرض کنیم Disk خراب را از VM/Server خارج کردیم و یک Disk جدید داریم:</p>

<div class="code-container"><span class="code-label">دیسک جدید</span><div class="code-block no-prompt">/dev/sdd</div></div>

<p>ابتدا آن را بررسی می‌کنیم:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">lsblk</div></div>

<p>اگر لازم باشد Partition مناسب ایجاد می‌کنیم.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">Partition</span><div class="code-block no-prompt">/dev/sdd1</div></div>

<h2>اضافه کردن Disk جدید به RAID</h2>

<p>حالا:</p>

<div class="code-container"><span class="code-label">Add</span><div class="code-block">sudo mdadm /dev/md1 --add /dev/sdd1</div></div>

<p>یا:</p>

<div class="code-container"><span class="code-label">Add</span><div class="code-block">sudo mdadm --manage /dev/md1 --add /dev/sdd1</div></div>

<p>اینجا:</p>

<div class="code-container"><span class="code-label">--add</span><div class="code-block no-prompt">--add</div></div>

<p>یعنی:</p>

<blockquote>این Device را به Array اضافه کن.</blockquote>

<h2>Rebuild چیست؟</h2>

<p>بعد از اضافه کردن Disk جدید، RAID 1 باید اطلاعات Mirror را روی Disk جدید بازسازی کند.</p>

<p>این فرآیند:</p>

<blockquote><strong>Rebuild</strong></blockquote>

<p>نام دارد.</p>

<p>و با:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">cat /proc/mdstat</div></div>

<p>می‌توانیم پیشرفت آن را ببینیم.</p>

<p>ساختار مفهومی:</p>

<div class="code-container"><span class="code-label">Rebuild</span><div class="code-block no-prompt">Healthy Disk
     │
     │ Data
     ↓
New Disk
     │
     ↓
Rebuild
     │
     ↓
Mirror دوباره کامل</div></div>

<h2>Resync و Rebuild</h2>

<p>در تست‌ها ممکن است این دو اصطلاح را ببینی.</p>

<p>به شکل ساده:</p>

<h3>Resync</h3>
<p>هماهنگ‌سازی اطلاعات بین اعضای RAID.</p>

<h3>Rebuild</h3>
<p>بازسازی اطلاعات روی یک Member جدید یا جایگزین‌شده.</p>

<p>در هر دو حالت:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">cat /proc/mdstat</div></div>

<p>یکی از ابزارهای مهم برای مشاهده وضعیت است.</p>

<h2>وضعیت نهایی RAID</h2>

<p>بعد از پایان Rebuild:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">cat /proc/mdstat</div></div>

<p>و:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">sudo mdadm --detail /dev/md1</div></div>

<p>را بررسی کن.</p>

<p>هدف این است که Array دوباره وضعیت سالم داشته باشد.</p>

<p>به صورت مفهومی:</p>

<div class="code-container"><span class="code-label">قبل و بعد</span><div class="code-block no-prompt">قبل:

Disk 1 → FAILED
Disk 2 → Active


بعد:

Disk 2 → Active
Disk 3 → Active</div></div>

<p>و RAID 1 دوباره Mirror شده است.</p>

<h2>RAID را از Filesystem جدا نکن</h2>

<p>یک نکته مفهومی مهم:</p>

<p>RAID و Filesystem دو چیز متفاوت‌اند.</p>

<p>ساختار:</p>

<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">/dev/sdb1
/dev/sdc1
     ↓
   mdadm
     ↓
 /dev/md1
     ↓
  ext4
     ↓
/mnt/raid1</div></div>

<p>یعنی:</p>

<h3>Partition</h3>
<p>فضای Disk را تقسیم می‌کند.</p>

<h3>RAID</h3>
<p>چند Device را در یک Array منطقی قرار می‌دهد.</p>

<h3>Filesystem</h3>
<p>ساختار ذخیره فایل را ایجاد می‌کند.</p>

<h3>Mount</h3>
<p>Filesystem را به درخت دایرکتوری Linux متصل می‌کند.</p>

<h2>ذخیره Configuration مربوط به RAID</h2>

<p>بعد از ساخت RAID، معمولاً باید Configuration مربوط به Arrayها در سیستم ثبت شود تا سیستم بتواند آنها را در Bootهای بعدی شناسایی و Assemble کند.</p>

<p>در سیستم‌های مبتنی بر RHEL/AlmaLinux، فایل:</p>

<div class="code-container"><span class="code-label">فایل</span><div class="code-block no-prompt">/etc/mdadm.conf</div></div>

<p>برای این منظور استفاده می‌شود.</p>

<p>در برخی سیستم‌ها ممکن است فایل یا روش تولید Configuration متفاوت باشد؛ بنابراین باید مطابق توزیع مورد استفاده عمل کرد.</p>

<h2>چرا UUID مهم است؟</h2>

<p>هر RAID Array دارای اطلاعات شناسایی مخصوص خود است.</p>

<p>برای مشاهده جزئیات:</p>

<div class="code-container"><span class="code-label">جزئیات</span><div class="code-block">sudo mdadm --detail /dev/md1</div></div>

<p>و برای بررسی Metadata:</p>

<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">sudo mdadm -E /dev/sdb1</div></div>

<p>این اطلاعات برای شناسایی صحیح Array در Boot و مدیریت آن مهم هستند.</p>

<h2>توقف RAID</h2>

<p>اگر بخواهیم یک Array را متوقف کنیم:</p>

<div class="code-container"><span class="code-label">توقف</span><div class="code-block">sudo mdadm --stop /dev/md1</div></div>

<p>اما قبل از این کار باید مطمئن باشیم Array در حال استفاده نیست.</p>

<p>اگر Mount شده است:</p>

<div class="code-container"><span class="code-label">Unmount</span><div class="code-block">sudo umount /mnt/raid1</div></div>

<p>سپس می‌توان Array را متوقف کرد.</p>

<h2>ترتیب درست برای حذف RAID</h2>

<p>به صورت مفهومی:</p>

<div class="code-container"><span class="code-label">حذف</span><div class="code-block no-prompt">Filesystem
    ↓
umount
    ↓
Stop RAID
    ↓
Remove RAID metadata</div></div>

<p>یعنی ابتدا:</p>

<div class="code-container"><span class="code-label">Unmount</span><div class="code-block">sudo umount /mnt/raid1</div></div>

<p>بعد:</p>

<div class="code-container"><span class="code-label">Stop</span><div class="code-block">sudo mdadm --stop /dev/md1</div></div>

<p>و اگر واقعاً قصد حذف کامل Metadata را داشته باشیم، باید Memberهای RAID را نیز پاک‌سازی کنیم.</p>

<h2>پاک کردن RAID Metadata</h2>

<p>برای پاک کردن Superblock یک Member، از:</p>

<div class="code-container"><span class="code-label">Zero Superblock</span><div class="code-block">sudo mdadm --zero-superblock /dev/sdb1</div></div>

<p>استفاده می‌شود.</p>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>هشدار</strong><br>این دستور می‌تواند اطلاعات RAID Metadata را از بین ببرد. روی Disk اشتباه اجرا کردن آن می‌تواند باعث مشکل جدی شود.</div></div>

<p>پس:</p>

<div class="code-container"><span class="code-label">نکته</span><div class="code-block no-prompt">--stop
   ↓
--zero-superblock</div></div>

<p>جزو عملیات‌های تخریبی محسوب می‌شوند و باید با دقت انجام شوند.</p>

<h2>چرخه کامل مدیریت Disk خراب</h2>

<p>این بخش را حتماً یاد بگیر:</p>

<div class="code-container"><span class="code-label">چرخه</span><div class="code-block no-prompt">RAID 1
 │
 ├── Disk A → Healthy
 └── Disk B → Healthy
          ↓
       Failure
          ↓
   --fail Disk B
          ↓
      Failed
          ↓
   --remove Disk B
          ↓
      Removed
          ↓
   نصب Disk جدید
          ↓
     /dev/sdc1
          ↓
      --add
          ↓
       Rebuild
          ↓
       Healthy</div></div>

<p>این یکی از مهم‌ترین سناریوهای عملی RAID است.</p>

<h2>مدل ذخیره‌سازی در Linux</h2>

<h3>Linux یک درخت فایل واحد دارد</h3>

<p>در Linux برخلاف Windows که با Drive Letterهایی مثل:</p>

<div class="code-container"><span class="code-label">ویندوز</span><div class="code-block no-prompt">C:\\
D:\\
E:\\</div></div>

<p>کار می‌کند، تمام فایل‌ها در یک درخت واحد قرار دارند.</p>

<p>ریشه این درخت:</p>

<div class="code-container"><span class="code-label">ریشه</span><div class="code-block no-prompt">/</div></div>

<p>است.</p>

<p>به آن <strong>Root Directory</strong> می‌گوییم.</p>

<p>ساختار ساده:</p>

<div class="code-container"><span class="code-label">درخت</span><div class="code-block no-prompt">/
├── boot
├── dev
├── etc
├── home
│   ├── ali
│   └── sara
├── mnt
├── opt
├── usr
└── var</div></div>

<p>تمام این مسیرها بخشی از یک Filesystem Tree واحد هستند.</p>

<h3>Disk چگونه وارد این درخت می‌شود؟</h3>

<p>یک Partition مانند:</p>

<div class="code-container"><span class="code-label">Partition</span><div class="code-block no-prompt">/dev/sdb1</div></div>

<p>به‌صورت مستقیم یک Drive Letter ایجاد نمی‌کند.</p>

<p>ابتدا روی آن Filesystem قرار می‌گیرد و سپس Filesystem در یک Directory به نام <strong>Mount Point</strong> متصل می‌شود.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">Mount</span><div class="code-block">sudo mount /dev/sdb1 /mnt</div></div>

<p>مفهوم کلی:</p>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">/dev/sdb1
    │
    ▼
Filesystem
    │
    ▼
Mount
    │
    ▼
/mnt</div></div>

<p>بنابراین:</p>

<blockquote><strong>Mount Point مسیری است که Filesystem از طریق آن وارد Directory Tree لینوکس می‌شود.</strong></blockquote>

<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">Disk
  ↓
Partition
  ↓
Filesystem
  ↓
Mount
  ↓
Directory Tree
  ↓
Files</div></div>

<p>ابزارهای این جلسه هر کدام در قسمت متفاوتی از این زنجیره نگاه می‌کنند.</p>

<p>وظیفه اصلی آن بررسی <strong>فضای Filesystemها</strong> است.</p>

<blockquote><code>df</code> به تو می‌گوید یک Filesystem چقدر فضا دارد و چه مقدار از آن استفاده شده است.</blockquote>

<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">df</div></div>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Filesystem     1024-blocks     Used Available Capacity Mounted on
/dev/sda2        20000000  9000000  11000000      45% /</div></div>

<h3><code>df</code> چه اطلاعاتی می‌دهد؟</h3>

<p>مهم‌ترین ستون‌ها:</p>

<div class="table-wrap">
<table>
<thead><tr><th>ستون</th><th>مفهوم</th></tr></thead>
<tbody>
<tr><td><code>Filesystem</code></td><td>نام Filesystem</td></tr>
<tr><td><code>Size</code></td><td>ظرفیت کل</td></tr>
<tr><td><code>Used</code></td><td>فضای استفاده‌شده</td></tr>
<tr><td><code>Avail</code></td><td>فضای قابل استفاده</td></tr>
<tr><td><code>Use%</code></td><td>درصد استفاده</td></tr>
<tr><td><code>Mounted on</code></td><td>محل Mount</td></tr>
</tbody>
</table>
</div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Filesystem      Size  Used Avail Use% Mounted on
/dev/sda2        20G   12G    8G  60% /</div></div>

<p>یعنی:</p>

<div class="code-container"><span class="code-label">تفسیر</span><div class="code-block no-prompt">کل فضا       = 20G
مصرف‌شده     = 12G
قابل استفاده = 8G
درصد مصرف    = 60%
Mount Point  = /</div></div>

<h2><code>df -h</code></h2>

<h3>چرا <code>-h</code>؟</h3>

<p>خروجی معمول <code>df</code> ممکن است بر اساس Block نمایش داده شود.</p>

<p>برای خروجی قابل فهم‌تر:</p>

<div class="code-container"><span class="code-label">خوانا</span><div class="code-block">df -h</div></div>

<p>استفاده می‌کنیم.</p>

<p><code>-h</code> یعنی:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">Human-readable</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Filesystem      Size  Used Avail Use% Mounted on
/dev/sda2        20G   12G    8G  60% /</div></div>

<p>این خروجی برای بررسی روزمره بسیار خواناتر است.</p>

<h3>سؤال کلیدی <code>df</code></h3>

<p>اگر سؤال این باشد:</p>

<blockquote>«Filesystem من چقدر فضای آزاد دارد؟»</blockquote>

<p>اولین دستوری که باید به ذهن برسد:</p>

<div class="code-container"><span class="code-label">پاسخ</span><div class="code-block">df -h</div></div>

<p>است.</p>

<h2><code>du</code></h2>

<h3><code>du</code> چیست؟</h3>

<p><code>du</code> مخفف:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">Disk Usage</div></div>

<p>است.</p>

<p>برخلاف <code>df</code> که از دید <strong>Filesystem</strong> نگاه می‌کند، <code>du</code> از دید <strong>Files و Directories</strong> به مصرف فضا نگاه می‌کند.</p>

<p>به زبان ساده:</p>

<blockquote><code>du</code> کمک می‌کند بفهمیم چه فایل‌ها و Directoryهایی فضای دیسک را مصرف کرده‌اند.</blockquote>

<h3><code>du</code> ساده</h3>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">du /home</div></div>

<p>می‌تواند میزان مصرف زیرشاخه‌های <code>/home</code> را نشان دهد.</p>

<p>اما خروجی ممکن است برای انسان چندان خوانا نباشد.</p>

<p>برای همین معمولاً از:</p>

<div class="code-container"><span class="code-label">خوانا</span><div class="code-block">du -h</div></div>

<p>استفاده می‌کنیم.</p>

<h3><code>du -h</code></h3>

<p>گزینه <code>-h</code> یعنی:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">Human-readable</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">4.0K    ./Documents
200M    ./Downloads
500M    ./Videos
705M    .</div></div>

<p>اکنون می‌توانیم راحت‌تر بفهمیم کدام Directory فضای بیشتری مصرف کرده است.</p>

<h2>مهم‌ترین ترکیب <code>du</code></h2>

<h3><code>du -sh</code></h3>

<p>یکی از مهم‌ترین دستورهای این جلسه:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">du -sh /home</div></div>

<p>گزینه‌ها:</p>

<div class="code-container"><span class="code-label">گزینه‌ها</span><div class="code-block no-prompt">-s → Summary
-h → Human-readable</div></div>

<p>بنابراین:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block">du -sh /home</div></div>

<p>یعنی:</p>

<blockquote>مجموع فضای مصرف‌شده توسط <code>/home</code> را به شکل خوانا نمایش بده.</blockquote>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">12G    /home</div></div>

<h2>تفاوت <code>df</code> و <code>du</code></h2>

<h3>تفاوت اصلی</h3>

<p>این مهم‌ترین مفهوم جلسه است.</p>

<h4><code>df</code></h4>

<p>از دید:</p>

<div class="code-container"><span class="code-label">df</span><div class="code-block no-prompt">Filesystem</div></div>

<p>نگاه می‌کند.</p>

<p>یعنی:</p>

<blockquote>«Filesystem چقدر فضا دارد و چقدر از آن مصرف شده؟»</blockquote>

<h4><code>du</code></h4>

<p>از دید:</p>

<div class="code-container"><span class="code-label">du</span><div class="code-block no-prompt">Files
Directories</div></div>

<p>نگاه می‌کند.</p>

<p>یعنی:</p>

<blockquote>«چه فایل‌ها و Directoryهایی این فضا را مصرف کرده‌اند؟»</blockquote>

<h3>روش ساده برای حفظ کردن</h3>

<div class="code-container"><span class="code-label">df</span><div class="code-block no-prompt">df
 ↓
Filesystem
 ↓
چقدر فضا دارم؟</div></div>

<p>در مقابل:</p>

<div class="code-container"><span class="code-label">du</span><div class="code-block no-prompt">du
 ↓
Files / Directories
 ↓
چه چیزی فضا را مصرف کرده؟</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>جمله طلایی LPIC-1</strong><br>
<strong><code>df</code> فضای Filesystem را بررسی می‌کند؛ <code>du</code> مصرف فضا توسط Files و Directories را بررسی می‌کند.</strong></div></div>

<h2>سناریوی اصلی Troubleshooting</h2>

<h3>وقتی Disk پر شده است چه کنیم؟</h3>

<p>فرض کن سیستم خطای زیر می‌دهد:</p>

<div class="code-container"><span class="code-label">خطا</span><div class="code-block no-prompt">No space left on device</div></div>

<p>اولین کار:</p>

<div class="code-container"><span class="code-label">مرحله ۱</span><div class="code-block">df -h</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Filesystem      Size  Used Avail Use% Mounted on
/dev/sda2        20G   20G     0  100% /</div></div>

<p>نتیجه:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">/ → 100% full</div></div>

<p>اما هنوز نمی‌دانیم <strong>چه چیزی</strong> این فضا را مصرف کرده است.</p>

<p>اینجا <code>du</code> وارد می‌شود.</p>

<h3>مرحله دوم: پیدا کردن Directory حجیم</h3>

<p>برای بررسی Directoryهای اصلی:</p>

<div class="code-container"><span class="code-label">مرحله ۲</span><div class="code-block">sudo du -sh /*</div></div>

<p>ممکن است چیزی شبیه این ببینیم:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">500M    /boot
2.0G    /home
8.5G    /var
4.0G    /usr</div></div>

<p>مشخص است که:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">/var</div></div>

<p>مشکوک است.</p>

<h3>مرحله سوم: ورود به Directory مشکوک</h3>

<p>حالا:</p>

<div class="code-container"><span class="code-label">مرحله ۳</span><div class="code-block">sudo du -sh /var/*</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">6G      /var/log
1G      /var/cache
500M    /var/tmp</div></div>

<p>پس:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">/var/log</div></div>

<p>بخش عمده فضا را مصرف کرده است.</p>

<p>می‌توانیم یک مرحله دیگر جلو برویم:</p>

<div class="code-container"><span class="code-label">ادامه</span><div class="code-block">sudo du -sh /var/log/*</div></div>

<p>به این ترتیب مرحله‌به‌مرحله به منبع مصرف فضا نزدیک می‌شویم.</p>

<h2>یک Workflow مهم برای امتحان و کار واقعی</h2>

<h3>الگوریتم بررسی Disk Full</h3>

<p>این روند را حفظ کن:</p>

<div class="code-container"><span class="code-label">الگوریتم</span><div class="code-block no-prompt">Disk Full?
    │
    ▼
 df -h
    │
    ▼
کدام Filesystem پر است؟
    │
    ▼
 du -sh /*
    │
    ▼
کدام Directory بزرگ است؟
    │
    ▼
 du -sh /directory/*
    │
    ▼
تکرار بررسی
    │
    ▼
پیدا کردن عامل اصلی</div></div>

<p>مثال:</p>

<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">df -h
  ↓
/ = 95%
  ↓
du -sh /*
  ↓
/var = 8.5G
  ↓
du -sh /var/*
  ↓
/var/log = 6G</div></div>

<p>این یکی از مهم‌ترین سناریوهای عملی این جلسه است.</p>

<h2>چرا <code>df</code> و <code>du</code> ممکن است متفاوت باشند؟</h2>

<h3>اختلاف بین <code>df</code> و <code>du</code></h3>

<p>گاهی ممکن است:</p>

<div class="code-container"><span class="code-label">df</span><div class="code-block">df -h</div></div>

<p>فضای مصرف‌شده بیشتری نسبت به:</p>

<div class="code-container"><span class="code-label">du</span><div class="code-block">du -sh /</div></div>

<p>نشان دهد.</p>

<p>یکی از دلایل معروف:</p>

<blockquote><strong>فایلی حذف شده، اما هنوز توسط یک Process باز نگه داشته شده است.</strong></blockquote>

<p>در این حالت:</p>

<div class="code-container"><span class="code-label">دلیل</span><div class="code-block no-prompt">File
 ↓
Delete
 ↓
نام فایل از Directory حذف می‌شود
 ↓
Process هنوز File را باز نگه داشته
 ↓
فضا همچنان توسط Filesystem مصرف می‌شود</div></div>

<p>بنابراین:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">du
↓
ممکن است فایل را نبیند

df
↓
فضای اشغال‌شده را همچنان نشان می‌دهد</div></div>

<p>این موضوع در Troubleshooting بسیار مهم است.</p>

<h2><code>lsblk</code></h2>

<h3><code>lsblk</code> چیست؟</h3>

<p><code>lsblk</code> مخفف:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">List Block Devices</div></div>

<p>است.</p>

<p>برای مشاهده ساختار Block Deviceها، Diskها و Partitionها بسیار مفید است.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">lsblk</div></div>

<p>ممکن است:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">NAME   SIZE TYPE MOUNTPOINTS
sda     20G disk
├─sda1   1G part /boot
└─sda2  19G part /
sdb     10G disk
└─sdb1  10G part /mnt/data</div></div>

<p>را نشان دهد.</p>

<h3><code>lsblk</code> چه سؤالی را جواب می‌دهد؟</h3>

<p>اگر سؤال این باشد:</p>

<blockquote>«چه Disk و Partitionهایی دارم و کجا Mount شده‌اند؟»</blockquote>

<p>دستور مناسب:</p>

<div class="code-container"><span class="code-label">پاسخ</span><div class="code-block">lsblk</div></div>

<p>است.</p>

<p>بنابراین:</p>

<div class="code-container"><span class="code-label">تفکیک</span><div class="code-block no-prompt">lsblk → ساختار Storage
df    → فضای Filesystem
du    → مصرف Files و Directories</div></div>

<h2><code>df</code> در مقابل <code>lsblk</code></h2>

<p>این دو را هم اشتباه نکن.</p>

<h3><code>lsblk</code></h3>

<p>تمرکز روی:</p>

<div class="code-container"><span class="code-label">lsblk</span><div class="code-block no-prompt">Disk
Partition
Block Device
Mount Point</div></div>

<h3><code>df</code></h3>

<p>تمرکز روی:</p>

<div class="code-container"><span class="code-label">df</span><div class="code-block no-prompt">Filesystem
Used
Available
Use%</div></div>

<p>پس:</p>

<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">lsblk
  ↓
ساختار Storage

df
  ↓
وضعیت فضای Filesystem</div></div>

<h2><code>iostat</code></h2>

<h3>Capacity با Performance فرق دارد</h3>

<p>ممکن است یک Disk:</p>

<div class="code-container"><span class="code-label">فضا</span><div class="code-block no-prompt">20 GB total
5 GB free</div></div>

<p>فضای آزاد داشته باشد، اما بسیار کند باشد.</p>

<p>در این حالت مشکل لزوماً کمبود فضا نیست.</p>

<p>ممکن است مشکل:</p>

<div class="code-container"><span class="code-label">مشکل</span><div class="code-block no-prompt">I/O Performance</div></div>

<p>باشد.</p>

<p>برای بررسی عملکرد I/O می‌توان از:</p>

<div class="code-container"><span class="code-label">ابزار</span><div class="code-block">iostat</div></div>

<p>استفاده کرد.</p>

<h3><code>iostat</code></h3>

<p><code>iostat</code> برای بررسی فعالیت و عملکرد I/O سیستم استفاده می‌شود.</p>

<p>مثلاً اطلاعات مرتبط با:</p>

<div class="code-container"><span class="code-label">معیارها</span><div class="code-block no-prompt">Read
Write
I/O</div></div>

<p>را بررسی می‌کند.</p>

<p>در این جلسه کافی است تفاوت زیر را کاملاً بفهمی:</p>

<div class="code-container"><span class="code-label">تفاوت</span><div class="code-block no-prompt">df / du
   ↓
Storage Capacity

iostat
   ↓
Storage I/O Performance</div></div>

<h3><code>iostat -x</code></h3>

<p>این دستور برای Troubleshooting مشکلات I/O مفید است.</p>

<p>در سیستم‌هایی که <code>iostat</code> در دسترس نیست، معمولاً این فرمان همراه بسته <code>sysstat</code> ارائه می‌شود.</p>

<div class="summary-box">
    <h3>⭐ نکات طلایی LPIC-1</h3>

    <h4>نکته ۱</h4>
    <p>ریشه Directory Tree لینوکس:</p>
    <div class="code-container"><span class="code-label">ریشه</span><div class="code-block no-prompt">/</div></div>

    <h4>نکته ۲</h4>
    <p>Linux از یک درخت فایل واحد استفاده می‌کند، نه Drive Letterهایی مانند <code>C:</code> و <code>D:</code>.</p>

    <h4>نکته ۳</h4>
    <p><code>df</code> برای بررسی <strong>Filesystem Space</strong> است.</p>
    <div class="code-container"><span class="code-label">df</span><div class="code-block">df -h</div></div>

    <h4>نکته ۴</h4>
    <p><code>du</code> برای بررسی <strong>File/Directory Usage</strong> است.</p>
    <div class="code-container"><span class="code-label">du</span><div class="code-block">du -sh /home</div></div>

    <h4>نکته ۵</h4>
    <p><code>-h</code> یعنی:</p>
    <div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">Human-readable</div></div>

    <h4>نکته ۶</h4>
    <p><code>-s</code> در <code>du</code> یعنی:</p>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>جمع‌بندی نهایی</strong><br>
