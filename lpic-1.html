<div class="section-header">
    <div class="section-badge">۱</div>
    <div>
        <h1>Addressing in Linux + cd + ls</h1>
        <div class="meta">کار با خط فرمان · بخش ۲ از ۱۴</div>
    </div>
</div>

<p>در این جلسه سه موضوع را به هم وصل می‌کنیم:</p>
<ol>
    <li>مسیرها (Path / Addressing) در لینوکس</li>
    <li>دستور <code>cd</code></li>
    <li>دستور <code>ls</code></li>
</ol>
<p>این جلسه خیلی مهم است، چون تقریباً تمام کارهایی که بعداً با فایل‌ها، <code>grep</code>، <code>find</code>، <code>sed</code>، Permission و... انجام می‌دهی، به درک درست <strong>Path</strong> وابسته است.</p>

<h2>فایل‌ها در لینوکس کجا قرار دارند؟</h2>
<p>در ویندوز معمولاً با چیزی مثل این مواجه می‌شوی:</p>
<div class="code-container"><span class="code-label">ویندوز</span><div class="code-block no-prompt">C:\\Users\\Navid\\Documents</div></div>
<p>اما لینوکس ساختار متفاوتی دارد. در لینوکس یک درخت فایل داریم که از:</p>
<div class="code-container"><span class="code-label">ریشه</span><div class="code-block no-prompt">/</div></div>
<p>شروع می‌شود. به این <code>/</code> می‌گوییم <strong>Root Directory</strong>.</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">/\n├── home\n│   ├── navid\n│   └── ali\n├── etc\n├── var\n├── usr\n├── tmp\n└── root</div></div>
<p>بنابراین <code>/</code> بالاترین سطح درخت فایل لینوکس است.</p>

<h2>Root Directory با Root User فرق دارد</h2>
<p>این یکی از دام‌های مهم آزمون است.</p>
<h3>Root Directory</h3>
<p><code>/</code> دایرکتوری ریشه سیستم فایل است.</p>
<h3>Root User</h3>
<p><code>root</code> کاربر قدرتمند سیستم است.</p>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته</strong>این دو <strong>یکی نیستند</strong>. <code>/</code> یک Directory است ولی <code>root</code> یک User است.</div></div>

<h2>Absolute Path</h2>
<p>مسیر <strong>Absolute</strong> از <code>/</code> شروع می‌شود. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">/home/navid\n/etc/ssh/sshd_config\n/var/log</div></div>
<p>چون مسیر از <code>/</code> شروع شده، مسیر Absolute است.</p>
<p>فرض کن این ساختار را داریم:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">/\n└── home\n    └── navid\n        └── Documents\n            └── test.txt</div></div>
<p>مسیر کامل فایل:</p>
<div class="code-container"><span class="code-label">مسیر مطلق</span><div class="code-block no-prompt">/home/navid/Documents/test.txt</div></div>
<p>این یک Absolute Path است.</p>

<h2>Relative Path</h2>
<p>Relative Path از <code>/</code> شروع نمی‌شود. مثلاً اگر الان داخل <code>/home/navid</code> باشیم و بخواهیم وارد <code>Documents</code> شویم:</p>
<div class="code-container"><span class="code-label">نسبی</span><div class="code-block">cd Documents</div></div>
<p>این یک Relative Path است. یا:</p>
<div class="code-container"><span class="code-label">نسبی</span><div class="code-block">cd Documents/Linux</div></div>
<p>باز هم Relative است. چون با <code>/</code> شروع نشده است.</p>

<h2>تفاوت Absolute و Relative</h2>
<p>فرض کنیم الان اینجا هستیم:</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">/home/navid</div></div>
<p>این دستور:</p>
<div class="code-container"><span class="code-label">نسبی</span><div class="code-block">cd Documents</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">/home/navid/Documents</div></div>
<p>اما:</p>
<div class="code-container"><span class="code-label">مطلق</span><div class="code-block">cd /etc</div></div>
<p>مستقیماً به <code>/etc</code> می‌رود. یعنی مهم نیست الان کجا هستیم.</p>

<h2><code>.</code> چیست؟</h2>
<p>در لینوکس:</p>
<div class="code-container"><span class="code-label">نقطه</span><div class="code-block no-prompt">.</div></div>
<p>یعنی <strong>Current Directory</strong> یا دایرکتوری فعلی.</p>
<p>فرض کنیم در <code>/home/navid</code> باشیم. این دو تقریباً یک معنی دارند:</p>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block">cd Documents\ncd ./Documents</div></div>
<p>چون <code>.</code> یعنی همین جایی که هستیم.</p>

<h2><code>..</code> چیست؟</h2>
<p>این مورد بسیار مهم است.</p>
<div class="code-container"><span class="code-label">دو نقطه</span><div class="code-block no-prompt">..</div></div>
<p>یعنی <strong>Parent Directory</strong> یعنی دایرکتوری والد.</p>
<p>فرض کنیم <code>/home/navid/Documents</code> هستیم. اگر بزنیم:</p>
<div class="code-container"><span class="code-label">یک سطح</span><div class="code-block">cd ..</div></div>
<p>می‌رویم به <code>/home/navid</code>.</p>
<p>دوباره:</p>
<div class="code-container"><span class="code-label">دو سطح</span><div class="code-block">cd ..</div></div>
<p>می‌شویم <code>/home</code>.</p>
<p>و دوباره:</p>
<div class="code-container"><span class="code-label">سه سطح</span><div class="code-block">cd ..</div></div>
<p>می‌شویم <code>/</code>.</p>

<h2>چند مسیر مهم</h2>
<p>این‌ها را خوب بشناس:</p>
<div class="code-container"><span class="code-label">مسیرها</span><div class="code-block no-prompt">/       Root Directory\n.       Current Directory\n..      Parent Directory\n~       Home Directory</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cd ~</div></div>
<p>ما را به Home Directory کاربر فعلی می‌برد. اگر کاربر <code>navid</code> باشد:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">/home/navid</div></div>

<h2><code>~</code> چیست؟</h2>
<p>علامت <code>~</code> معمولاً به Home Directory کاربر فعلی اشاره می‌کند.</p>
<p>مثلاً اگر کاربر <code>navid</code> باشد:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cd ~</div></div>
<p>می‌رود به <code>/home/navid</code>.</p>
<p>همچنین:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cd</div></div>
<p>به‌تنهایی هم معمولاً کاربر را به Home Directory خودش می‌برد. پس <code>cd</code> و <code>cd ~</code> در حالت معمول نتیجه مشابهی دارند.</p>

<h2>دستور <code>pwd</code></h2>
<p>قبل از <code>cd</code> باید یک دستور خیلی مهم را بشناسیم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">pwd</div></div>
<p>مخفف <strong>Print Working Directory</strong> است. یعنی مسیر فعلی من چیست؟</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">pwd</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">/home/navid</div></div>
<p>یعنی الان در <code>/home/navid</code> قرار داریم.</p>

<h2>دستور <code>cd</code></h2>
<p><code>cd</code> مخفف <strong>Change Directory</strong> است. برای تغییر دایرکتوری استفاده می‌شود.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cd /etc</div></div>
<p>بعد:</p>
<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">pwd</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">/etc</div></div>

<h2>استفاده از Absolute Path با <code>cd</code></h2>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مطلق</span><div class="code-block">cd /var/log</div></div>
<p>مستقیماً وارد <code>/var/log</code> می‌شویم. مهم نیست قبلاً کجا بوده‌ایم.</p>

<h2>استفاده از Relative Path با <code>cd</code></h2>
<p>فرض کنیم <code>/home/navid</code> هستیم. ساختار:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">/home/navid\n├── Documents\n├── Downloads\n└── Pictures</div></div>
<p>می‌توانیم بنویسیم:</p>
<div class="code-container"><span class="code-label">نسبی</span><div class="code-block">cd Documents</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">نسبی با نقطه</span><div class="code-block">cd ./Documents</div></div>

<h2>برگشتن با <code>..</code></h2>
<p>فرض کنیم <code>/home/navid/Documents</code> هستیم. بزن:</p>
<div class="code-container"><span class="code-label">برگشت</span><div class="code-block">cd ..</div></div>
<p>نتیجه:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">/home/navid</div></div>

<h2>رفتن چند سطح به عقب</h2>
<p>مثلاً <code>/home/navid/Documents/Linux/LPIC</code> هستیم. اگر بزنیم:</p>
<div class="code-container"><span class="code-label">دو سطح</span><div class="code-block">cd ../..</div></div>
<p>دو سطح بالا می‌رویم: <code>/home/navid/Documents</code>.</p>
<p>چون <code>..</code> → <code>Linux</code> و <code>../..</code> → <code>Documents</code>.</p>

<h2>رفتن به Home</h2>
<div class="code-container"><span class="code-label">خانه</span><div class="code-block">cd ~</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">خانه</span><div class="code-block">cd</div></div>

<h2>رفتن به Root Directory</h2>
<p>برای رفتن به ریشه:</p>
<div class="code-container"><span class="code-label">ریشه</span><div class="code-block">cd /</div></div>
<p>دقت کن <code>/</code> با <code>~</code> کاملاً متفاوت است.</p>
<div class="code-container"><span class="code-label">تفاوت</span><div class="code-block no-prompt">/ → Root Directory\n~ → Home Directory</div></div>

<h2>یک دستور بسیار کاربردی: <code>cd -</code></h2>
<p>این دستور:</p>
<div class="code-container"><span class="code-label">قبلی</span><div class="code-block">cd -</div></div>
<p>تو را به <strong>دایرکتوری قبلی</strong> برمی‌گرداند.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">pwd</div></div>
<p>داریم <code>/home/navid</code>. بعد:</p>
<div class="code-container"><span class="code-label">تغییر</span><div class="code-block">cd /etc</div></div>
<p>حالا <code>/etc</code> هستیم. اگر بزنیم:</p>
<div class="code-container"><span class="code-label">برگشت</span><div class="code-block">cd -</div></div>
<p>برمی‌گردیم <code>/home/navid</code>. دوباره:</p>
<div class="code-container"><span class="code-label">برگشت</span><div class="code-block">cd -</div></div>
<p>می‌رویم <code>/etc</code>. خیلی کاربردی است.</p>

<h2>دستور <code>ls</code></h2>
<p>حالا که بلدیم بین Directoryها حرکت کنیم، باید بتوانیم محتوای آنها را ببینیم.</p>
<p>دستور <code>ls</code> برای نمایش محتویات Directory استفاده می‌شود.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">لیست</span><div class="code-block">ls</div></div>
<p>ممکن است خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Documents  Downloads  Pictures  Videos</div></div>

<h2><code>ls</code> با Path</h2>
<p>می‌توانیم مشخص کنیم محتوای کدام Directory را ببینیم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls /etc\nls /var/log\nls /home</div></div>

<h2><code>ls -l</code></h2>
<p>یکی از مهم‌ترین Optionهای <code>ls</code>:</p>
<div class="code-container"><span class="code-label">جزئیات</span><div class="code-block">ls -l</div></div>
<p>است. <code>-l</code> یعنی <strong>Long Listing Format</strong>.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">نمونه</span><div class="code-block no-prompt">-rw-r--r-- 1 navid navid 120 Aug 14 test.txt</div></div>
<p>فعلاً لازم نیست تمام ستون‌ها را حفظ کنی. در فصل Permission آنها را کامل بررسی می‌کنیم. اما فعلاً بدان <code>ls -l</code> اطلاعات بیشتری درباره فایل‌ها نمایش می‌دهد.</p>

<h2><code>ls -a</code></h2>
<p>Option مهم دیگر:</p>
<div class="code-container"><span class="code-label">همه</span><div class="code-block">ls -a</div></div>
<p><code>-a</code> یعنی <strong>all</strong> و فایل‌های Hidden را هم نمایش می‌دهد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">.\n..\n.bashrc\n.profile\nDocuments</div></div>
<p>در حالت عادی <code>ls</code> فایل‌هایی مثل <code>.bashrc</code> را نمایش نمی‌دهد.</p>

<h2>فایل Hidden در لینوکس</h2>
<p>در لینوکس معمولاً فایل یا Directoryای که نامش با <code>.</code> شروع شود، Hidden محسوب می‌شود.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مخفی</span><div class="code-block no-prompt">.bashrc\n.config\n.ssh</div></div>
<p>پس <code>ls -a</code> برای دیدن آنها استفاده می‌شود.</p>

<h2><code>ls -la</code></h2>
<p>می‌توانیم Optionها را ترکیب کنیم:</p>
<div class="code-container"><span class="code-label">ترکیب</span><div class="code-block">ls -la</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">-l → Long Listing\n-a → All</div></div>
<p>پس اطلاعات کامل‌تر و فایل‌های Hidden را می‌بینیم.</p>

<h2><code>ls -lh</code></h2>
<p>یک Option کاربردی دیگر:</p>
<div class="code-container"><span class="code-label">خوانا</span><div class="code-block">ls -lh</div></div>
<p><code>h</code> یعنی <strong>Human-readable</strong>. مثلاً به‌جای <code>1048576</code> ممکن است چیزی مثل <code>1.0M</code> ببینیم.</p>

<h2>ترکیب چند Option</h2>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">ترکیب</span><div class="code-block">ls -lah</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">-l → اطلاعات کامل\n-a → فایل‌های Hidden\n-h → اندازه قابل فهم برای انسان</div></div>
<p>این دستور را خیلی در لینوکس خواهی دید: <code>ls -lah</code></p>

<h2>یک نکته مهم درباره <code>ls</code></h2>
<p>این دستور:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls</div></div>
<p>محتویات Directory فعلی را نمایش می‌دهد.</p>
<p>اما:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls /etc</div></div>
<p>محتویات <code>/etc</code> را نمایش می‌دهد، بدون اینکه الزاماً وارد <code>/etc</code> شویم.</p>
<p>این تفاوت مهم است:</p>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block">cd /etc\nls</div></div>
<p>در این حالت واقعاً وارد <code>/etc</code> شده‌ایم.</p>
<p>اما:</p>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block">ls /etc</div></div>
<p>فقط محتویات <code>/etc</code> را مشاهده می‌کنیم.</p>

<div class="summary-box">
<h3>🧠 خلاصه جلسه</h3>
<table>
<thead><tr><th>مفهوم</th><th>معنی</th></tr></thead>
<tbody>
<tr><td><code>/</code></td><td>Root Directory</td></tr>
<tr><td><code>.</code></td><td>Current Directory</td></tr>
<tr><td><code>..</code></td><td>Parent Directory</td></tr>
<tr><td><code>~</code></td><td>Home Directory کاربر فعلی</td></tr>
<tr><td>Absolute Path</td><td>مسیری که از <code>/</code> شروع می‌شود</td></tr>
<tr><td>Relative Path</td><td>مسیری که از <code>/</code> شروع نمی‌شود</td></tr>
<tr><td><code>pwd</code></td><td>نمایش مسیر فعلی</td></tr>
<tr><td><code>cd</code></td><td>تغییر Directory</td></tr>
<tr><td><code>cd ..</code></td><td>یک سطح به عقب</td></tr>
<tr><td><code>cd ~</code></td><td>رفتن به Home</td></tr>
<tr><td><code>cd -</code></td><td>رفتن به Directory قبلی</td></tr>
<tr><td><code>ls</code></td><td>نمایش محتویات</td></tr>
<tr><td><code>ls -l</code></td><td>نمایش جزئیات</td></tr>
<tr><td><code>ls -a</code></td><td>نمایش Hiddenها</td></tr>
<tr><td><code>ls -h</code></td><td>نمایش اندازه به شکل Human-readable</td></tr>
</tbody>
</table>
</div>

<h2>🧪 تمرین عملی</h2>
<p>حالا داخل VM این دستورات را <strong>به ترتیب</strong> اجرا کن:</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">pwd\nls\nls -la\ncd /\npwd\nls\ncd /etc\npwd\ncd ..\npwd\ncd ~\npwd\ncd -\npwd</div></div>
<p>اگر این تمرین را انجام بدهی، مفهوم Path و <code>cd</code> خیلی خوب جا می‌افتد.</p>

<h2>خودآزمایی</h2>
<div class="quiz-card"><p>❓ تست ۱: اگر کاربر در مسیر زیر باشد: <code>/home/navid/Documents</code> کدام دستور او را به <code>/home/navid</code> می‌برد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>cd /</code></button>
    <button onclick="selectOption(this)">ب) <code>cd .</code></button>
    <button onclick="selectOption(this)">ج) <code>cd ..</code></button>
    <button onclick="selectOption(this)">د) <code>cd ~</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br><code>..</code> یعنی Parent Directory. پس <code>/home/navid/Documents</code> با <code>cd ..</code> به <code>/home/navid</code> می‌رویم. <code>cd .</code> هیچ تغییری ایجاد نمی‌کند. <code>cd /</code> به Root می‌رود. <code>cd ~</code> به Home کاربر می‌رود.</div>
</div>

<div class="quiz-card"><p>❓ تست ۲: کدام مورد یک <strong>Absolute Path</strong> است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>Documents/Linux</code></button>
    <button onclick="selectOption(this)">ب) <code>./Documents</code></button>
    <button onclick="selectOption(this)">ج) <code>../etc</code></button>
    <button onclick="selectOption(this)">د) <code>/etc/ssh</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: د</strong><br>Absolute Path از <code>/</code> شروع می‌شود: <code>/etc/ssh</code>. اما <code>Documents/Linux</code>، <code>./Documents</code> و <code>../etc</code> Relative هستند. نکته آزمونی: به محض دیدن <code>/</code> در ابتدای مسیر، احتمالاً با Absolute Path طرف هستی.</div>
</div>

<div class="quiz-card"><p>❓ تست ۳: اگر کاربر در <code>/home/navid</code> باشد، نتیجه <code>cd ~</code> معمولاً چیست؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>/</code></button>
    <button onclick="selectOption(this)">ب) <code>/root</code></button>
    <button onclick="selectOption(this)">ج) <code>/home/navid</code></button>
    <button onclick="selectOption(this)">د) <code>/home</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br><code>~</code> به Home Directory کاربر فعلی اشاره می‌کند. اگر کاربر <code>navid</code> باشد <code>~</code> → <code>/home/navid</code>. اما برای کاربر <code>root</code> معمولاً <code>~</code> → <code>/root</code> است. پس <code>~</code> به <strong>Home کاربر فعلی</strong> وابسته است.</div>
</div>

<div class="quiz-card"><p>❓ تست ۴: کدام دستور فایل‌های Hidden را نیز نمایش می‌دهد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>ls -h</code></button>
    <button onclick="selectOption(this)">ب) <code>ls -l</code></button>
    <button onclick="selectOption(this)">ج) <code>ls -a</code></button>
    <button onclick="selectOption(this)">د) <code>ls -r</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br>Option <code>-a</code> مخفف <strong>all</strong> است. بنابراین <code>ls -a</code> فایل‌هایی مثل <code>.bashrc</code>، <code>.config</code> و <code>.ssh</code> را هم نمایش می‌دهد. <code>-l</code> مربوط به Long Listing است و <code>-h</code> مربوط به Human-readable بودن اندازه‌هاست.</div>
</div>

<div class="quiz-card"><p>❓ تست ۵: فرض کنید ابتدا در <code>/home/navid</code> هستید. سپس اجرا می‌کنید: <code>cd /etc</code> و بعد <code>cd -</code>. بعد از اجرای <code>cd -</code> در کدام مسیر خواهید بود؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>/</code></button>
    <button onclick="selectOption(this)">ب) <code>/etc</code></button>
    <button onclick="selectOption(this)">ج) <code>/home/navid</code></button>
    <button onclick="selectOption(this)">د) <code>/home</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br><code>cd -</code> ما را به <strong>دایرکتوری قبلی</strong> برمی‌گرداند. ابتدا <code>/home/navid</code> بودیم، سپس <code>cd /etc</code> رفتیم <code>/etc</code>، حالا <code>cd -</code> ما را به <code>/home/navid</code> برمی‌گرداند. نکته آزمونی مهم: <code>cd ..</code> یعنی Parent Directory اما <code>cd -</code> یعنی Previous Directory.</div>
</div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>خروجی مورد انتظار از جلسه ۲</strong><br>
بعد از این جلسه باید بتوانی بدون کمک توضیح بدهی:
<ul>
<li><code>/</code> چیست؟</li>
<li><code>.</code> چیست؟</li>
<li><code>..</code> چیست؟</li>
<li><code>~</code> چیست؟</li>
</ul>
و تفاوت این‌ها را کاملاً بفهمی:
<code>cd /etc</code>، <code>cd etc</code>، <code>cd ..</code>، <code>cd .</code>، <code>cd ~</code>، <code>cd -</code>
<br>
همچنین باید بتوانی تشخیص بدهی Absolute Path در مقابل Relative Path و کاربرد این دستورات را بدانی: <code>pwd</code>، <code>ls</code>، <code>ls -l</code>، <code>ls -a</code>، <code>ls -h</code>، <code>ls -la</code>، <code>ls -lah</code>.
<br><strong>جلسه ۲ تمام شد.</strong>
</div></div>

<div class="section-header">
    <div class="section-badge">۱</div>
    <div>
        <h1>Show File + Make File</h1>
        <div class="meta">کار با خط فرمان · بخش ۳ از ۱۴</div>
    </div>
</div>

<p>در این جلسه می‌خواهیم یاد بگیریم چطور در لینوکس:</p>
<ul>
    <li>محتوای فایل را ببینیم.</li>
    <li>فایل جدید بسازیم.</li>
    <li>با فایل‌های متنی کار کنیم.</li>
    <li>تفاوت چند دستور مهم مثل <code>cat</code>، <code>less</code>، <code>head</code>، <code>tail</code> و <code>touch</code> را بفهمیم.</li>
</ul>

<h2>Show File</h2>
<p>فرض کن داخل لینوکس یک فایل به اسم <code>test.txt</code> داریم:</p>
<div class="code-container"><span class="code-label">نمایش</span><div class="code-block">cat test.txt</div></div>
<p>خروجی مثلاً:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Hello Linux\nThis is my first file.\nLPIC-1</div></div>
<p>دستور <code>cat</code> یکی از ساده‌ترین روش‌ها برای <strong>نمایش محتوای فایل</strong> است.</p>
<h3>ساختار کلی</h3>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block">cat filename</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat /home/user/test.txt</div></div>

<h2><code>cat</code></h2>
<p><code>cat</code> مخفف <strong>concatenate</strong> است. یکی از کاربردهای اصلی آن نمایش محتوای فایل است.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat test.txt</div></div>
<p>اگر فایل ۵ خط داشته باشد، هر ۵ خط را نمایش می‌دهد.</p>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>نکته مهم LPIC</strong>اگر فایل خیلی بزرگ باشد، <code>cat</code> ممکن است انتخاب مناسبی نباشد؛ چون کل محتوا را یک‌باره داخل ترمینال می‌ریزد. برای فایل‌های بزرگ‌تر معمولاً از <code>less</code> استفاده می‌کنیم.</div></div>

<h2><code>less</code></h2>
<div class="code-container"><span class="code-label">مشاهده</span><div class="code-block">less test.txt</div></div>
<p>به‌جای اینکه کل فایل را یک‌باره نمایش دهد، امکان حرکت داخل فایل را می‌دهد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">less /var/log/syslog</div></div>
<p>در <code>less</code> می‌توانی:</p>
<ul>
    <li>با <code>↑</code> و <code>↓</code> حرکت کنی.</li>
    <li>با <code>Page Up</code> و <code>Page Down</code> جابه‌جا شوی.</li>
    <li>با <code>/</code> جستجو کنی.</li>
    <li>با <code>q</code> خارج شوی.</li>
</ul>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">جستجو</span><div class="code-block no-prompt">/error</div></div>
<p>برای پیدا کردن عبارت <code>error</code>.</p>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته</strong>برای خروج از <code>less</code>: <code>q</code></div></div>

<h2><code>more</code></h2>
<p>دستور دیگری برای مشاهده فایل:</p>
<div class="code-container"><span class="code-label">مشاهده</span><div class="code-block">more test.txt</div></div>
<p><code>more</code> و <code>less</code> هر دو برای مشاهده فایل‌های متنی هستند. ولی <code>less</code> امکانات بیشتری دارد و در استفاده روزمره معمولاً کاربردی‌تر است.</p>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته جالب</strong>یک نکته جالب برای حفظ کردن: <strong>less is more</strong> یعنی اسم <code>less</code> عمداً یک شوخی با <code>more</code> است. 😄</div></div>

<h2><code>head</code></h2>
<p>گاهی اصلاً نمی‌خواهیم کل فایل را ببینیم. مثلاً فقط می‌خواهیم <strong>۱۰ خط اول</strong> را ببینیم:</p>
<div class="code-container"><span class="code-label">ابتدا</span><div class="code-block">head test.txt</div></div>
<p>به‌صورت پیش‌فرض <code>10 lines</code> نمایش داده می‌شود.</p>
<h3>مشخص کردن تعداد خطوط</h3>
<p>مثلاً ۵ خط اول:</p>
<div class="code-container"><span class="code-label">۵ خط</span><div class="code-block">head -n 5 test.txt</div></div>
<p>یا شکل کوتاه‌تر:</p>
<div class="code-container"><span class="code-label">کوتاه</span><div class="code-block">head -5 test.txt</div></div>
<p>هر دو در محیط‌های رایج لینوکس قابل استفاده‌اند.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">head -n 3 /var/log/syslog</div></div>
<p>یعنی سه خط اول فایل را نمایش بده.</p>

<h2><code>tail</code></h2>
<p>برعکس <code>head</code>، دستور <code>tail</code> قسمت <strong>انتهایی فایل</strong> را نمایش می‌دهد.</p>
<div class="code-container"><span class="code-label">انتها</span><div class="code-block">tail test.txt</div></div>
<p>به‌صورت پیش‌فرض ۱۰ خط آخر را نشان می‌دهد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">۵ خط آخر</span><div class="code-block">tail -n 5 test.txt</div></div>
<p>یعنی ۵ خط آخر فایل را نشان بده.</p>

<h2><code>head</code> در مقابل <code>tail</code></h2>
<p>خیلی مهم است:</p>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">head  → ابتدای فایل\ntail  → انتهای فایل</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">head -n 3 file.txt</div></div>
<p>سه خط اول.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">tail -n 3 file.txt</div></div>
<p>سه خط آخر.</p>

<h2>Make File</h2>
<p>حالا می‌رسیم به ساخت فایل. یکی از مهم‌ترین دستورات:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">touch</div></div>

<h2><code>touch</code></h2>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">ایجاد</span><div class="code-block">touch test.txt</div></div>
<p>اگر <code>test.txt</code> وجود نداشته باشد، یک فایل خالی ایجاد می‌شود.</p>
<p>بعد:</p>
<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">ls</div></div>
<p>ممکن است ببینی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">test.txt</div></div>

<h3>اگر فایل از قبل وجود داشته باشد چه؟</h3>
<p>فرض کن <code>test.txt</code> از قبل وجود دارد. اگر بزنیم:</p>
<div class="code-container"><span class="code-label">دوباره</span><div class="code-block">touch test.txt</div></div>
<p>فایل پاک نمی‌شود و محتوای آن هم از بین نمی‌رود.</p>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته خیلی مهم</strong><code>touch</code> معمولاً برای ایجاد فایل خالی یا تغییر timestamp فایل استفاده می‌شود، نه پاک کردن محتوا.</div></div>

<h2>ساخت چند فایل با <code>touch</code></h2>
<p>می‌توانیم چند فایل را هم‌زمان ایجاد کنیم:</p>
<div class="code-container"><span class="code-label">چند فایل</span><div class="code-block">touch file1.txt file2.txt file3.txt</div></div>
<p>حالا:</p>
<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">ls</div></div>
<p>ممکن است ببینی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">file1.txt  file2.txt  file3.txt</div></div>

<h2>ساخت فایل در مسیر مشخص</h2>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block">touch /tmp/test.txt</div></div>
<p>فایل در <code>/tmp</code> ساخته می‌شود.</p>
<p>برای اطمینان:</p>
<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">ls /tmp</div></div>

<h2>ساخت فایل با <code>></code></h2>
<p>یک روش دیگر:</p>
<div class="code-container"><span class="code-label">با echo</span><div class="code-block">echo "Hello Linux" > test.txt</div></div>
<p>اگر <code>test.txt</code> وجود نداشته باشد، ساخته می‌شود. محتوای آن:</p>
<div class="code-container"><span class="code-label">محتوای فایل</span><div class="code-block no-prompt">Hello Linux</div></div>
<p>خواهد بود.</p>
<p>بعد:</p>
<div class="code-container"><span class="code-label">نمایش</span><div class="code-block">cat test.txt</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Hello Linux</div></div>
<p>اینجا با یک مفهوم بسیار مهم به نام <strong>Redirection</strong> روبه‌رو می‌شویم که در جلسه ۱۱ کامل یاد می‌گیریم.</p>

<h2>اضافه کردن محتوا با <code>>></code></h2>
<p>تفاوت مهم:</p>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">> \n>></div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">overwrite</span><div class="code-block">echo "Hello" > test.txt</div></div>
<p>اگر فایل قبلاً محتوا داشته باشد، محتوای قبلی <strong>جایگزین</strong> می‌شود.</p>
<p>اما:</p>
<div class="code-container"><span class="code-label">append</span><div class="code-block">echo "Linux" >> test.txt</div></div>
<p>محتوا را به <strong>انتهای فایل اضافه</strong> می‌کند.</p>
<p>مثلاً ابتدا:</p>
<div class="code-container"><span class="code-label">قبل</span><div class="code-block no-prompt">Hello</div></div>
<p>بعد:</p>
<div class="code-container"><span class="code-label">بعد</span><div class="code-block">echo "Linux" >> test.txt</div></div>
<p>فایل تبدیل می‌شود به:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">Hello\nLinux</div></div>
<p>این تفاوت را حتماً یاد بگیر:</p>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">>   → ایجاد/جایگزینی\n>>  → اضافه کردن به انتها</div></div>

<h2>مثال عملی کامل</h2>
<p>بیایید یک فایل بسازیم:</p>
<div class="code-container"><span class="code-label">ایجاد</span><div class="code-block">touch students.txt</div></div>
<p>حالا چند خط داخل آن قرار دهیم:</p>
<div class="code-container"><span class="code-label">نوشتن</span><div class="code-block">echo "Ali" > students.txt\necho "Reza" >> students.txt\necho "Sara" >> students.txt</div></div>
<p>حالا:</p>
<div class="code-container"><span class="code-label">نمایش</span><div class="code-block">cat students.txt</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Ali\nReza\nSara</div></div>
<p>اگر بزنیم:</p>
<div class="code-container"><span class="code-label">head</span><div class="code-block">head -n 2 students.txt</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Ali\nReza</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">tail</span><div class="code-block">tail -n 2 students.txt</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Reza\nSara</div></div>

<div class="summary-box">
<h3>🧠 نکات مهم LPIC-1 این جلسه ⭐</h3>
<p>این موارد را خوب بلد باش:</p>
<table>
<thead><tr><th>دستور</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>cat</code></td><td>نمایش محتوای فایل</td></tr>
<tr><td><code>less</code></td><td>مشاهده فایل به‌صورت صفحه‌ای</td></tr>
<tr><td><code>more</code></td><td>مشاهده صفحه‌ای فایل</td></tr>
<tr><td><code>head</code></td><td>نمایش ابتدای فایل</td></tr>
<tr><td><code>tail</code></td><td>نمایش انتهای فایل</td></tr>
<tr><td><code>touch</code></td><td>ایجاد فایل خالی / تغییر timestamp</td></tr>
<tr><td><code>></code></td><td>ایجاد یا overwrite کردن خروجی</td></tr>
<tr><td><code>>></code></td><td>اضافه کردن خروجی به انتهای فایل</td></tr>
</tbody>
</table>
<p>و این دو مورد را خیلی خوب به خاطر بسپار:</p>
<div class="code-container"><span class="code-label">head</span><div class="code-block no-prompt">⬅️ اول فایل</div></div>
<div class="code-container"><span class="code-label">tail</span><div class="code-block no-prompt">➡️ آخر فایل</div></div>
</div>

<h2>🧪 تمرین</h2>
<p>داخل ترمینال این کارها را انجام بده:</p>
<h3>تمرین ۱</h3>
<p>یک فایل بساز:</p>
<div class="code-container"><span class="code-label">ساخت</span><div class="code-block">touch test.txt</div></div>
<h3>تمرین ۲</h3>
<p>داخلش این سه خط را قرار بده:</p>
<div class="code-container"><span class="code-label">محتوای فایل</span><div class="code-block no-prompt">Linux\nLPIC-1\nTerminal</div></div>
<h3>تمرین ۳</h3>
<p>محتوای فایل را با <code>cat</code> ببین.</p>
<h3>تمرین ۴</h3>
<p>فقط خط اول را با <code>head</code> نمایش بده.</p>
<h3>تمرین ۵</h3>
<p>فقط خط آخر را با <code>tail</code> نمایش بده.</p>

<h2>خودآزمایی</h2>
<div class="quiz-card"><p>❓ تست ۱: کدام دستور برای نمایش محتوای یک فایل متنی مناسب است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>mkdir file.txt</code></button>
    <button onclick="selectOption(this)">ب) <code>cat file.txt</code></button>
    <button onclick="selectOption(this)">ج) <code>cd file.txt</code></button>
    <button onclick="selectOption(this)">د) <code>touch file.txt</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>cat file.txt</code> محتوای فایل را نمایش می‌دهد. <code>touch</code> معمولاً برای ایجاد فایل یا تغییر timestamp است، نه نمایش محتوای آن.</div>
</div>

<div class="quiz-card"><p>❓ تست ۲: خروجی دستور زیر چیست؟ <code>head -n 5 file.txt</code></p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) پنج خط آخر فایل</button>
    <button onclick="selectOption(this)">ب) پنج کلمه اول فایل</button>
    <button onclick="selectOption(this)">ج) پنج خط اول فایل</button>
    <button onclick="selectOption(this)">د) کل فایل</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br><code>head</code> قسمت ابتدایی فایل را نمایش می‌دهد. گزینه <code>-n 5</code> یعنی پنج خط نمایش بده. پس <code>head → اول فایل</code> و <code>-n 5 → پنج خط</code>.</div>
</div>

<div class="quiz-card"><p>❓ تست ۳: کدام دستور ۱۰ خط آخر فایل را نمایش می‌دهد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>head file.txt</code></button>
    <button onclick="selectOption(this)">ب) <code>tail file.txt</code></button>
    <button onclick="selectOption(this)">ج) <code>cat -10 file.txt</code></button>
    <button onclick="selectOption(this)">د) <code>less -10 file.txt</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>tail file.txt</code> به‌صورت پیش‌فرض ۱۰ خط آخر فایل را نمایش می‌دهد. اگر بخواهیم صریح بنویسیم: <code>tail -n 10 file.txt</code>.</div>
</div>

<div class="quiz-card"><p>❓ تست ۴: اگر فایل <code>test.txt</code> از قبل حاوی اطلاعات باشد، اجرای کدام دستور محتوای قبلی را جایگزین می‌کند؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>echo "Linux" >> test.txt</code></button>
    <button onclick="selectOption(this)">ب) <code>touch test.txt</code></button>
    <button onclick="selectOption(this)">ج) <code>echo "Linux" > test.txt</code></button>
    <button onclick="selectOption(this)">د) <code>cat test.txt</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br>علامت <code>></code> باعث می‌شود خروجی به فایل نوشته شود و اگر فایل قبلاً وجود داشته باشد، محتوای قبلی overwrite می‌شود. اما <code>>></code> محتوای جدید را به انتهای فایل اضافه می‌کند.</div>
</div>

<div class="quiz-card"><p>❓ تست ۵: کدام عبارت درباره <code>touch</code> صحیح است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) همیشه محتوای فایل را پاک می‌کند.</button>
    <button onclick="selectOption(this)">ب) فقط برای حذف فایل استفاده می‌شود.</button>
    <button onclick="selectOption(this)">ج) می‌تواند یک فایل خالی ایجاد کند.</button>
    <button onclick="selectOption(this)">د) محتوای فایل را نمایش می‌دهد.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br>مثلاً <code>touch test.txt</code> اگر فایل وجود نداشته باشد، آن را ایجاد می‌کند. اگر فایل از قبل وجود داشته باشد، محتوای آن را پاک نمی‌کند.</div>
</div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>جمع‌بندی نهایی جلسه ۳</strong><br>
اگر بخواهم جلسه امروز را در چند خط خلاصه کنم:
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">cat file.txt   → محتوای فایل را ببین.\nless file.txt  → فایل را صفحه‌ای مشاهده کن.\nhead file.txt  → اول فایل را ببین.\ntail file.txt  → آخر فایل را ببین.\ntouch file.txt → فایل ایجاد کن.\necho "Hello" > file.txt   → فایل را ایجاد/overwrite کن.\necho "Hello" >> file.txt  → به انتهای فایل اضافه کن.</div></div>
<strong>سه نکته‌ای که حتماً باید بلد باشی:</strong>
<ol>
    <li><code>head = beginning</code> و <code>tail = ending</code></li>
    <li><code>> = overwrite</code> و <code>>> = append</code></li>
    <li>با <code>touch</code> فایل موجود حذف یا خالی نمی‌شود؛ در صورت نبودن فایل، می‌تواند آن را ایجاد کند.</li>
</ol>
</div></div>

"ch1-4": `
<div class="section-header">
    <div class="section-badge">۱</div>
    <div>
        <h1>Variable + History</h1>
        <div class="meta">کار با خط فرمان · بخش ۴ از ۱۴</div>
    </div>
</div>

<p>در این جلسه با یکی از مهم‌ترین مفاهیم لینوکس یعنی <strong>متغیرها (Variables)</strong> آشنا می‌شویم و یاد می‌گیریم چگونه از <strong>تاریخچه دستورات (History)</strong> استفاده کنیم. این مبحث در آزمون <strong>LPIC-1</strong> اهمیت زیادی دارد.</p>

<h2>Variable (متغیر)</h2>

<h3>متغیر چیست؟</h3>
<p>متغیر (<strong>Variable</strong>) محلی در حافظه است که لینوکس اطلاعات موردنیاز برنامه‌ها و Shell را در آن ذخیره می‌کند.</p>
<p>این اطلاعات می‌تواند شامل موارد زیر باشد:</p>
<ul>
    <li>نام کاربر</li>
    <li>مسیر فعلی</li>
    <li>مسیر فایل‌های اجرایی</li>
    <li>ویرایشگر پیش‌فرض</li>
    <li>مسیر Home کاربر</li>
    <li>و ...</li>
</ul>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>به زبان ساده</strong>Variable = محلی برای نگهداری اطلاعات</div></div>

<h3>نمایش متغیرهای محیطی</h3>
<p>برای مشاهده تمام متغیرهای محیطی از دستور زیر استفاده می‌کنیم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">env</div></div>
<p>نمونه خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">USER=ali\nHOME=/home/ali\nPATH=/usr/local/bin:/usr/bin:/bin\nSHELL=/bin/bash</div></div>
<p>هر خط شامل یک متغیر و مقدار آن است.</p>

<h3>مشاهده مقدار یک متغیر</h3>
<p>برای مشاهده مقدار یک متغیر از علامت <code>$</code> استفاده می‌کنیم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo $USER</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">ali</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo $HOME</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">/home/ali</div></div>

<h2>انواع متغیرها</h2>
<p>متغیرها به دو دسته تقسیم می‌شوند.</p>

<h3>Local Variable</h3>
<p>فقط در همان Shell فعلی قابل استفاده است.</p>
<p>ایجاد متغیر:</p>
<div class="code-container"><span class="code-label">ایجاد</span><div class="code-block">name="Ali"</div></div>
<p>نمایش مقدار:</p>
<div class="code-container"><span class="code-label">نمایش</span><div class="code-block">echo $name</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Ali</div></div>
<p>اگر یک Shell جدید باز کنید، این متغیر وجود نخواهد داشت.</p>

<h3>Environment Variable</h3>
<p>این متغیرها علاوه بر Shell فعلی، به برنامه‌هایی که از آن اجرا می‌شوند نیز منتقل می‌شوند.</p>
<p>برای تبدیل یک متغیر به Environment Variable از <code>export</code> استفاده می‌کنیم.</p>
<div class="code-container"><span class="code-label">تبدیل</span><div class="code-block">export name="Ali"</div></div>
<p>اکنون این متغیر برای برنامه‌های اجرا شده نیز قابل مشاهده است.</p>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته LPIC-1 ⭐</strong>در Shellهای مختلف مانند <code>bash</code> و <code>csh</code> روش تعریف متغیر متفاوت است، اما در آزمون LPIC-1 معمولاً منظور <strong>Bash</strong> است.</div></div>

<h2>متغیرهای مهم</h2>

<h3>PATH</h3>
<p>یکی از مهم‌ترین متغیرهای لینوکس است. این متغیر مشخص می‌کند Shell هنگام اجرای یک دستور، فایل اجرایی را در چه مسیرهایی جستجو کند.</p>
<p>مشاهده مقدار:</p>
<div class="code-container"><span class="code-label">مشاهده</span><div class="code-block">echo $PATH</div></div>
<p>نمونه خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">/usr/local/bin:/usr/bin:/bin</div></div>
<p>هر مسیر با علامت <code>:</code> از مسیر بعدی جدا می‌شود.</p>

<h4>نحوه عملکرد PATH</h4>
<p>فرض کنید دستور زیر را اجرا می‌کنید:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ls</div></div>
<p>Shell به ترتیب این مسیرها را بررسی می‌کند:</p>
<div class="code-container"><span class="code-label">مسیرها</span><div class="code-block no-prompt">PATH\n │\n ├── /usr/local/bin\n ├── /usr/bin\n └── /bin</div></div>
<p>به محض اینکه فایل <code>ls</code> را پیدا کند، آن را اجرا می‌کند.</p>

<h4>اضافه کردن مسیر جدید</h4>
<div class="code-container"><span class="code-label">افزودن</span><div class="code-block">export PATH=$PATH:/opt/scripts</div></div>
<p>اکنون Shell پوشه <code>/opt/scripts</code> را نیز برای یافتن برنامه‌ها بررسی می‌کند.</p>

<h3>EDITOR</h3>
<p>این متغیر مشخص می‌کند ویرایشگر پیش‌فرض سیستم چیست.</p>
<p>مشاهده:</p>
<div class="code-container"><span class="code-label">مشاهده</span><div class="code-block">echo $EDITOR</div></div>
<p>تنظیم:</p>
<div class="code-container"><span class="code-label">تنظیم</span><div class="code-block">export EDITOR=nano</div></div>
<p>یا</p>
<div class="code-container"><span class="code-label">تنظیم</span><div class="code-block">export EDITOR=vim</div></div>
<p>برنامه‌هایی مانند <code>crontab -e</code> از این متغیر استفاده می‌کنند.</p>

<h3>PS1</h3>
<p>متغیری است که ظاهر Prompt ترمینال را مشخص می‌کند.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مشاهده</span><div class="code-block">echo $PS1</div></div>
<p>نمونه:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">\\u@\\h:\\w$</div></div>
<p>معنی کاراکترها:</p>
<table>
<thead><tr><th>کد</th><th>توضیح</th></tr></thead>
<tbody>
<tr><td><code>\\u</code></td><td>نام کاربر</td></tr>
<tr><td><code>\\h</code></td><td>نام سیستم (Host)</td></tr>
<tr><td><code>\\w</code></td><td>مسیر جاری</td></tr>
</tbody>
</table>
<p>مثال:</p>
<div class="code-container"><span class="code-label">تنظیم</span><div class="code-block">export PS1="\\u@\\h:\\w$ "</div></div>
<p>خروجی Prompt:</p>
<div class="code-container"><span class="code-label">نمونه</span><div class="code-block no-prompt">ali@server:/home/ali$</div></div>

<h3>SHLVL</h3>
<p>تعداد Shellهای تو در تو را نشان می‌دهد.</p>
<p>نمایش:</p>
<div class="code-container"><span class="code-label">نمایش</span><div class="code-block">echo $SHLVL</div></div>
<p>نمونه خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">1</div></div>
<p>اگر دوباره Bash اجرا کنید:</p>
<div class="code-container"><span class="code-label">شل جدید</span><div class="code-block">bash</div></div>
<p>اکنون:</p>
<div class="code-container"><span class="code-label">نمایش</span><div class="code-block">echo $SHLVL</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">2</div></div>

<h3>SHELL</h3>
<p>شل پیش‌فرض کاربر را نشان می‌دهد.</p>
<div class="code-container"><span class="code-label">نمایش</span><div class="code-block">echo $SHELL</div></div>
<p>نمونه خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">/bin/bash</div></div>
<p>این مقدار معمولاً در فایل زیر مشخص می‌شود:</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">/etc/passwd</div></div>

<h2>History</h2>
<p>یکی از امکانات بسیار مفید Bash، نگهداری تاریخچه دستورات است.</p>

<h3>HISTFILE</h3>
<p>فایل ذخیره تاریخچه دستورات را مشخص می‌کند.</p>
<p>نمایش:</p>
<div class="code-container"><span class="code-label">نمایش</span><div class="code-block">echo $HISTFILE</div></div>
<p>معمولاً:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">/home/ali/.bash_history</div></div>

<h3>دستور history</h3>
<p>برای مشاهده دستورات قبلی:</p>
<div class="code-container"><span class="code-label">تاریخچه</span><div class="code-block">history</div></div>
<p>نمونه خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">1 pwd\n2 ls\n3 cd /etc\n4 cat file.txt</div></div>

<h4>پاک کردن History</h4>
<div class="code-container"><span class="code-label">پاک کردن</span><div class="code-block">history -c</div></div>
<p>تاریخچه نشست فعلی پاک می‌شود.</p>

<h4>ذخیره در فایل</h4>
<div class="code-container"><span class="code-label">ذخیره</span><div class="code-block">history -w</div></div>
<p>تاریخچه فعلی را در فایل <code>HISTFILE</code> ذخیره می‌کند.</p>

<h2>اجرای مجدد دستورات</h2>

<h3>اجرای یک دستور با شماره</h3>
<p>اگر خروجی History به شکل زیر باشد:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">98 ls\n99 pwd\n100 df -h</div></div>
<p>برای اجرای دستور شماره 100:</p>
<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">!100</div></div>

<h3>اجرای آخرین دستور</h3>
<div class="code-container"><span class="code-label">آخرین</span><div class="code-block">!!</div></div>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo !!</div></div>
<p>اگر آخرین دستور را بدون <code>sudo</code> اجرا کرده باشید، این روش بسیار کاربردی است.</p>

<h3>استفاده از آخرین آرگومان</h3>
<p>فرض کنید:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">mkdir project</div></div>
<p>حالا:</p>
<div class="code-container"><span class="code-label">استفاده</span><div class="code-block">cd !$</div></div>
<p>در واقع Bash آن را به شکل زیر اجرا می‌کند:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block">cd project</div></div>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>نکته مهم</strong>متغیر <code>$HISTFILE</code> فقط مسیر فایل تاریخچه را نشان می‌دهد و برای اجرای دستورات استفاده نمی‌شود.</div></div>

<div class="summary-box">
<h3>🎯 نکات مهم LPIC-1</h3>
<ul>
    <li>✔ متغیرهای محیطی را با <code>env</code> مشاهده کنید.</li>
    <li>✔ برای مشاهده مقدار متغیر از <code>echo $VARIABLE</code> استفاده می‌شود.</li>
    <li>✔ <code>export</code> متغیر را به Environment Variable تبدیل می‌کند.</li>
    <li>✔ <code>PATH</code> مسیر جستجوی فایل‌های اجرایی را مشخص می‌کند.</li>
    <li>✔ <code>EDITOR</code> ویرایشگر پیش‌فرض را تعیین می‌کند.</li>
    <li>✔ <code>PS1</code> ظاهر Prompt را تغییر می‌دهد.</li>
    <li>✔ <code>SHELL</code> شل پیش‌فرض کاربر را نمایش می‌دهد.</li>
    <li>✔ <code>history</code> تاریخچه دستورات را نمایش می‌دهد.</li>
    <li>✔ <code>!!</code> آخرین دستور را اجرا می‌کند.</li>
    <li>✔ <code>!number</code> دستور موردنظر را با شماره اجرا می‌کند.</li>
    <li>✔ <code>!$</code> آخرین آرگومان دستور قبلی را استفاده می‌کند.</li>
</ul>
</div>

<h2>🧪 تمرین</h2>
<h3>تمرین ۱</h3>
<p>مقدار متغیرهای زیر را مشاهده کنید:</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">echo $USER\necho $HOME\necho $PATH\necho $SHELL</div></div>

<h3>تمرین ۲</h3>
<p>یک متغیر محلی ایجاد کنید:</p>
<div class="code-container"><span class="code-label">ایجاد</span><div class="code-block">city="Tehran"\necho $city</div></div>

<h3>تمرین ۳</h3>
<p>آن را به یک متغیر محیطی تبدیل کنید:</p>
<div class="code-container"><span class="code-label">تبدیل</span><div class="code-block">export city</div></div>

<h3>تمرین ۴</h3>
<p>تاریخچه دستورات را مشاهده کنید.</p>
<div class="code-container"><span class="code-label">تاریخچه</span><div class="code-block">history</div></div>

<h3>تمرین ۵</h3>
<p>آخرین دستور را دوباره اجرا کنید.</p>
<div class="code-container"><span class="code-label">آخرین</span><div class="code-block">!!</div></div>

<h2>خودآزمایی</h2>
<div class="quiz-card"><p>❓ تست ۱: کدام دستور تمام متغیرهای محیطی را نمایش می‌دهد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>history</code></button>
    <button onclick="selectOption(this)">ب) <code>echo</code></button>
    <button onclick="selectOption(this)">ج) <code>env</code></button>
    <button onclick="selectOption(this)">د) <code>export</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br>دستور <code>env</code> تمام Environment Variableها را نمایش می‌دهد. <code>echo</code> فقط مقدار یک متغیر را نشان می‌دهد، <code>export</code> برای تعریف متغیر محیطی استفاده می‌شود و <code>history</code> ارتباطی با متغیرها ندارد.</div>
</div>

<div class="quiz-card"><p>❓ تست ۲: کدام متغیر مسیر جستجوی فایل‌های اجرایی را مشخص می‌کند؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>EDITOR</code></button>
    <button onclick="selectOption(this)">ب) <code>PATH</code></button>
    <button onclick="selectOption(this)">ج) <code>SHELL</code></button>
    <button onclick="selectOption(this)">د) <code>HOME</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>PATH</code> شامل مسیرهایی است که Shell برای پیدا کردن دستورات در آن‌ها جستجو می‌کند.</div>
</div>

<div class="quiz-card"><p>❓ تست ۳: کدام دستور مقدار متغیر <code>PATH</code> را نمایش می‌دهد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>env PATH</code></button>
    <button onclick="selectOption(this)">ب) <code>echo $PATH</code></button>
    <button onclick="selectOption(this)">ج) <code>history PATH</code></button>
    <button onclick="selectOption(this)">د) <code>PATH</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br>برای نمایش مقدار یک متغیر در Bash باید از <code>echo</code> همراه با <code>$</code> استفاده کرد.</div>
</div>

<div class="quiz-card"><p>❓ تست ۴: کدام دستور آخرین فرمان اجراشده را دوباره اجرا می‌کند؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>!1</code></button>
    <button onclick="selectOption(this)">ب) <code>!$</code></button>
    <button onclick="selectOption(this)">ج) <code>!!</code></button>
    <button onclick="selectOption(this)">د) <code>history</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br><code>!!</code> آخرین دستور را مجدداً اجرا می‌کند. <code>!$</code> آخرین آرگومان دستور قبلی را برمی‌گرداند و <code>!1</code> دستور شماره ۱ تاریخچه را اجرا می‌کند.</div>
</div>

<div class="quiz-card"><p>❓ تست ۵: متغیر <code>PS1</code> چه کاربردی دارد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) تعیین شل پیش‌فرض</button>
    <button onclick="selectOption(this)">ب) ذخیره تاریخچه دستورات</button>
    <button onclick="selectOption(this)">ج) تغییر ظاهر Prompt ترمینال</button>
    <button onclick="selectOption(this)">د) تعیین مسیر فایل‌های اجرایی</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br><code>PS1</code> قالب نمایش Prompt را مشخص می‌کند و می‌توان با آن اطلاعاتی مانند نام کاربر، نام میزبان و مسیر جاری را در خط فرمان نمایش داد.</div>
</div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>جمع‌بندی جلسه ۴</strong><br>
اگر بخواهیم مهم‌ترین مطالب این جلسه را مرور کنیم:
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">env                    → نمایش تمام متغیرهای محیطی\necho $PATH            → نمایش مسیرهای جستجوی دستورات\nexport VAR=value      → تعریف متغیر محیطی\nhistory               → نمایش تاریخچه دستورات\n!!                    → اجرای آخرین دستور\n!25                   → اجرای دستور شماره ۲۵\n!$                    → استفاده از آخرین آرگومان دستور قبلی</div></div>
<strong>سه نکته‌ای که حتماً باید بلد باشید:</strong>
<ol>
    <li><code>PATH</code> مشخص می‌کند Shell فایل‌های اجرایی را در چه مسیرهایی جستجو کند.</li>
    <li><code>export</code> یک متغیر محلی را به متغیر محیطی تبدیل می‌کند.</li>
    <li><code>history</code>، <code>!!</code>، <code>!number</code> و <code>!$</code> از دستورات مهم و پرتکرار Bash و آزمون LPIC-1 هستند.</li>
</ol>
</div></div>

<div class="section-header">
    <div class="section-badge">۱</div>
    <div>
        <h1>man + آشنایی با ویرایش فایل</h1>
        <div class="meta">کار با خط فرمان · بخش ۵ از ۱۴</div>

<p>در جلسات قبل با دستورات پایه لینوکس آشنا شدیم. اما یک سؤال مهم وجود دارد:</p>
<blockquote>اگر دستور جدیدی دیدیم و نحوه استفاده از آن را بلد نبودیم، چه کار کنیم؟</blockquote>
<p>در لینوکس تقریباً برای هر دستور یک راهنما وجود دارد. در این جلسه یاد می‌گیریم چگونه از این راهنماها استفاده کنیم و همچنین با ویرایشگرهای متنی لینوکس آشنا می‌شویم.</p>

<h2>دریافت راهنما در لینوکس</h2>
<p>لینوکس چند روش مختلف برای دریافت راهنمای دستورات در اختیار ما قرار می‌دهد. مهم‌ترین آن‌ها عبارتند از:</p>
<ul>
    <li><code>--help</code></li>
    <li><code>-h</code></li>
    <li><code>man</code></li>
    <li><code>help</code></li>
</ul>

<h3>استفاده از <code>--help</code></h3>
<p>بیشتر دستورات لینوکس از گزینه <code>--help</code> پشتیبانی می‌کنند.</p>
<p>ساختار:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block">command --help</div></div>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls --help</div></div>
<p>یا</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cp --help</div></div>
<p>نمونه خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Usage: ls [OPTION]... [FILE]...\nList information about the FILEs...</div></div>
<p>این روش یک راهنمای <strong>کوتاه و سریع</strong> ارائه می‌دهد.</p>

<h3>استفاده از <code>-h</code></h3>
<p>بعضی از برنامه‌ها از گزینه <code>-h</code> نیز استفاده می‌کنند.</p>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">tar -h</div></div>
<p>یا</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ssh -h</div></div>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>نکته</strong>همه دستورات از <code>-h</code> پشتیبانی نمی‌کنند، بنابراین همیشه مطمئن‌ترین گزینه <code>--help</code> است.</div></div>

<h3>مقایسه <code>-h</code> و <code>--help</code></h3>
<table>
<thead><tr><th>گزینه</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>--help</code></td><td>راهنمای خلاصه (رایج‌تر)</td></tr>
<tr><td><code>-h</code></td><td>راهنمای خلاصه (در برخی برنامه‌ها)</td></tr>
</tbody>
</table>

<h2>دستور <code>man</code></h2>
<p>اگر به توضیحات کامل یک دستور نیاز داشته باشیم، از <code>man</code> استفاده می‌کنیم.</p>
<p><code>man</code> مخفف <strong>Manual</strong> است.</p>
<p>ساختار:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block">man command</div></div>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">man ls</div></div>
<p>یا</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">man cp</div></div>

<h3>محیط <code>man</code></h3>
<p>با اجرای دستور <code>man ls</code> صفحه‌ای مشابه زیر مشاهده می‌کنید:</p>
<div class="code-container"><span class="code-label">نمونه</span><div class="code-block no-prompt">NAME\nSYNOPSIS\nDESCRIPTION\nOPTIONS\n...</div></div>
<p>این صفحه شامل توضیح کامل دستور، گزینه‌ها و مثال‌ها است.</p>

<h3>کلیدهای مهم در <code>man</code></h3>
<table>
<thead><tr><th>کلید</th><th>عملکرد</th></tr></thead>
<tbody>
<tr><td><code>↑</code> / <code>↓</code></td><td>حرکت بین خطوط</td></tr>
<tr><td><code>Page Up</code> / <code>Page Down</code></td><td>جابه‌جایی بین صفحات</td></tr>
<tr><td><code>/</code></td><td>جستجوی یک عبارت</td></tr>
<tr><td><code>n</code></td><td>نتیجه بعدی جستجو</td></tr>
<tr><td><code>q</code></td><td>خروج از <code>man</code></td></tr>
</tbody>
</table>
<p>مثال: اگر داخل <code>man</code> بنویسید <code>/search</code>، عبارت موردنظر جستجو می‌شود.</p>

<h3>تفاوت <code>man</code> و <code>--help</code></h3>
<table>
<thead><tr><th><code>--help</code></th><th><code>man</code></th></tr></thead>
<tbody>
<tr><td>خلاصه</td><td>کامل</td></tr>
<tr><td>سریع</td><td>جزئیات بیشتر</td></tr>
<tr><td>مناسب یادآوری</td><td>مناسب یادگیری</td></tr>
</tbody>
</table>

<h2>دستور <code>help</code></h2>
<p>برخی دستورات، <strong>Built-in</strong> هستند؛ یعنی توسط خود Shell اجرا می‌شوند و فایل اجرایی جداگانه ندارند.</p>
<p>برای مشاهده راهنمای این دستورات از <code>help</code> استفاده می‌کنیم.</p>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">help cd</div></div>
<p>یا</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">help export</div></div>

<h3>تفاوت <code>help</code> و <code>man</code></h3>
<table>
<thead><tr><th>دستور</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>help</code></td><td>راهنمای دستورات داخلی Shell</td></tr>
<tr><td><code>man</code></td><td>راهنمای دستورات سیستم</td></tr>
</tbody>
</table>

<h2>اهمیت ویرایش فایل‌ها</h2>
<p>یکی از مهم‌ترین مهارت‌های یک مدیر سیستم لینوکس، ویرایش فایل‌های متنی است.</p>
<p>در لینوکس تقریباً همه تنظیمات داخل فایل ذخیره می‌شوند. برای مثال:</p>
<ul>
    <li>تنظیمات شبکه</li>
    <li>تنظیمات SSH</li>
    <li>تنظیمات کاربران</li>
    <li>تنظیمات سرویس‌ها</li>
    <li>فایل‌های لاگ</li>
</ul>
<p>همگی فایل متنی هستند.</p>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>Everything is a File</strong>تقریباً همه چیز در لینوکس به شکل فایل قابل دسترسی است.</div></div>

<h3>چرا باید ویرایش فایل را یاد بگیریم؟</h3>
<p>در کار روزمره بارها مجبور خواهید شد:</p>
<ul>
    <li>تنظیمات را تغییر دهید.</li>
    <li>یک فایل پیکربندی را اصلاح کنید.</li>
    <li>متنی را جستجو کنید.</li>
    <li>عبارتی را جایگزین کنید.</li>
</ul>
<p>این مهارت در آزمون LPIC-1 و همچنین در محیط کاری بسیار مهم است.</p>

<h2>ویرایشگرهای متنی لینوکس</h2>
<p>دو ویرایشگر متنی رایج در لینوکس عبارتند از:</p>
<ul>
    <li><code>vi</code> / <code>vim</code></li>
    <li><code>nano</code></li>
</ul>

<h3>ویرایشگر <code>vi</code></h3>
<p>قدیمی‌ترین و معروف‌ترین ویرایشگر لینوکس است.</p>
<p>ویژگی‌ها:</p>
<ul>
    <li>بسیار سریع</li>
    <li>روی تقریباً همه توزیع‌های لینوکس وجود دارد.</li>
    <li>مناسب مدیران سیستم</li>
</ul>
<p><code>vi</code> دارای حالت‌های مختلف است؛ مهم‌ترین آن‌ها:</p>
<ul>
    <li>حالت فرمان (Command Mode)</li>
    <li>حالت درج متن (Insert Mode)</li>
</ul>
<p>در جلسه بعد به‌صورت کامل با <code>vi</code> کار خواهیم کرد.</p>

<h3>ویرایشگر <code>vim</code></h3>
<p><code>vim</code> نسخه پیشرفته‌تر <code>vi</code> است.</p>
<p>مزایا:</p>
<ul>
    <li>امکانات بیشتر</li>
    <li>رنگ‌بندی کدها</li>
    <li>جستجوی بهتر</li>
    <li>قابلیت‌های بیشتر برای برنامه‌نویسی</li>
</ul>
<p>در بسیاری از سیستم‌ها، دستور <code>vi</code> در واقع <code>vim</code> را اجرا می‌کند.</p>

<h3>ویرایشگر <code>nano</code></h3>
<p><code>nano</code> یک ویرایشگر ساده و مناسب کاربران مبتدی است.</p>
<p>مزایا:</p>
<ul>
    <li>یادگیری آسان</li>
    <li>نمایش کلیدهای میانبر در پایین صفحه</li>
    <li>مناسب برای ویرایش‌های سریع</li>
</ul>
<p>در جلسه ۷ به‌طور کامل با آن آشنا می‌شویم.</p>

<h3>مقایسه <code>vi</code> و <code>nano</code></h3>
<table>
<thead><tr><th>ویژگی</th><th>vi / vim</th><th>nano</th></tr></thead>
<tbody>
<tr><td>یادگیری</td><td>سخت‌تر</td><td>آسان‌تر</td></tr>
<tr><td>امکانات</td><td>بسیار زیاد</td><td>پایه</td></tr>
<tr><td>مناسب آزمون LPIC-1</td><td>⭐⭐⭐⭐⭐</td><td>⭐⭐⭐</td></tr>
</tbody>
</table>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته LPIC-1</strong>در Shellهای مختلف مانند bash و csh روش تعریف متغیر متفاوت است. اما در آزمون LPIC-1 معمولاً منظور Bash است.</div></div>

<h2>چگونه مهارت خود را افزایش دهیم؟</h2>
<p>برای حرفه‌ای شدن در لینوکس:</p>
<ul>
    <li>✔ یک ویرایشگر را انتخاب کنید.</li>
    <li>✔ هر روز با همان ویرایشگر کار کنید.</li>
    <li>✔ میانبرهای آن را یاد بگیرید.</li>
    <li>✔ سعی کنید کارها را سریع‌تر انجام دهید.</li>
    <li>✔ اگر دیدید کاری را چند بار تکرار می‌کنید، بررسی کنید آیا میانبر یا روش بهتری وجود دارد یا خیر.</li>
</ul>
<p>با گذشت زمان سرعت و دقت شما به شکل محسوسی افزایش پیدا می‌کند.</p>

<div class="summary-box">
<h3>🎯 نکات مهم LPIC-1</h3>
<ul>
    <li>⭐ برای مشاهده راهنمای سریع دستورات از <code>command --help</code> استفاده کنید.</li>
    <li>⭐ برای مطالعه کامل یک دستور: <code>man command</code></li>
    <li>⭐ برای راهنمای دستورات داخلی Bash: <code>help command</code></li>
    <li>⭐ مهم‌ترین ویرایشگر آزمون LPIC-1: <code>vi / vim</code></li>
    <li>⭐ ویرایش فایل‌های متنی یکی از مهارت‌های اصلی مدیر سیستم لینوکس است.</li>
</ul>
</div>

<h2>🧪 تمرین</h2>
<h3>تمرین ۱</h3>
<p>راهنمای دستور <code>ls</code> را مشاهده کنید.</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">ls --help</div></div>

<h3>تمرین ۲</h3>
<p>دفترچه راهنمای <code>cp</code> را باز کنید.</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">man cp</div></div>
<p>سپس با کلید <code>q</code> خارج شوید.</p>

<h3>تمرین ۳</h3>
<p>راهنمای دستور داخلی <code>cd</code> را مشاهده کنید.</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">help cd</div></div>

<h3>تمرین ۴</h3>
<p>راهنمای دستور <code>export</code> را مشاهده کنید.</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">help export</div></div>

<h3>تمرین ۵</h3>
<p>بررسی کنید آیا سیستم شما از <code>vi</code> و <code>nano</code> پشتیبانی می‌کند.</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">vi\nnano</div></div>
<p>(در صورت اجرا، بدون تغییر فایل از برنامه خارج شوید.)</p>

</div>

<p>مهم‌ترین و گیج‌کننده‌ترین بخش برای مبتدی‌ها، <strong>حالت‌های مختلف</strong> <code>vi</code> است.</p>

<p>در Command Mode می‌توانید بدون استفاده از موس، به‌سرعت جابه‌جا شوید.</p>

<h3>حرکت با کاراکتر</h3>
<div class="table-wrap">
    <table>
        <thead><tr><th>کلید</th><th>عملکرد</th></tr></thead>
        <tbody>
            <tr><td><code>h</code></td><td>چپ</td></tr>
            <tr><td><code>l</code></td><td>راست</td></tr>
            <tr><td><code>j</code></td><td>پایین</td></tr>
            <tr><td><code>k</code></td><td>بالا</td></tr>
        </tbody>
    </table>
</div>
<div class="box note"><i class="fas fa-lightbulb"></i><div>این چهار کلید جایگزین کلیدهای جهت‌دار (Arrow Keys) هستند.</div></div>

<h3>حرکت سریع‌تر</h3>
<div class="table-wrap">
    <table>
        <thead><tr><th>کلید</th><th>عملکرد</th></tr></thead>
        <tbody>
            <tr><td><code>0</code></td><td>ابتدای خط</td></tr>
            <tr><td><code>$</code></td><td>انتهای خط</td></tr>
            <tr><td><code>w</code></td><td>یک کلمه به جلو</td></tr>
            <tr><td><code>b</code></td><td>یک کلمه به عقب</td></tr>
            <tr><td><code>gg</code></td><td>ابتدای فایل</td></tr>
            <tr><td><code>G</code></td><td>انتهای فایل</td></tr>
            <tr><td><code>:n</code></td><td>رفتن به خط شماره n (مثلاً <code>:10</code>)</td></tr>
        </tbody>
    </table>
</div>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">:25</div></div>
<p>مکان‌نما را به خط ۲۵ فایل می‌برد.</p>

<h2>بخش ششم: ذخیره و خروج (Last Line Mode)</h2>
<p>برای ذخیره یا خروج، ابتدا باید در Command Mode باشید (با <code>Esc</code>)، سپس <code>:</code> را بزنید.</p>
<div class="table-wrap">
    <table>
        <thead><tr><th>دستور</th><th>عملکرد</th></tr></thead>
        <tbody>
            <tr><td><code>:w</code></td><td>ذخیره فایل</td></tr>
            <tr><td><code>:q</code></td><td>خروج (اگر تغییری نباشد)</td></tr>
            <tr><td><code>:wq</code></td><td>ذخیره و خروج</td></tr>
            <tr><td><code>:x</code></td><td>ذخیره و خروج (مشابه <code>:wq</code>)</td></tr>
            <tr><td><code>:q!</code></td><td>خروج بدون ذخیره (نادیده گرفتن تغییرات)</td></tr>
            <tr><td><code>:w newname</code></td><td>ذخیره با نام جدید</td></tr>
        </tbody>
    </table>
</div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی مهم:</strong> تفاوت <code>:q</code> و <code>:q!</code>
<ul>
    <li><code>:q</code> اگر فایل تغییر کرده باشد، اجازه خروج نمی‌دهد.</li>
    <li><code>:q!</code> بدون توجه به تغییرات، خارج می‌شود.</li>
</ul>
</div></div>

<h2>بخش هفتم: حذف، کپی و جای‌گذاری متن</h2>

<h3>حذف (Delete)</h3>
<div class="table-wrap">
    <table>
        <thead><tr><th>کلید</th><th>عملکرد</th></tr></thead>
        <tbody>
            <tr><td><code>x</code></td><td>حذف یک کاراکتر زیر مکان‌نما</td></tr>
            <tr><td><code>dd</code></td><td>حذف کل خط</td></tr>
            <tr><td><code>ndd</code></td><td>حذف n خط (مثلاً <code>3dd</code>)</td></tr>
            <tr><td><code>dw</code></td><td>حذف یک کلمه</td></tr>
            <tr><td><code>D</code></td><td>حذف از مکان‌نما تا انتهای خط</td></tr>
        </tbody>
    </table>
</div>

<h3>کپی (Yank) و جای‌گذاری (Paste)</h3>
<div class="table-wrap">
    <table>
        <thead><tr><th>کلید</th><th>عملکرد</th></tr></thead>
        <tbody>
            <tr><td><code>yy</code></td><td>کپی کل خط</td></tr>
            <tr><td><code>nyy</code></td><td>کپی n خط</td></tr>
            <tr><td><code>p</code></td><td>جای‌گذاری بعد از خط فعلی</td></tr>
            <tr><td><code>P</code></td><td>جای‌گذاری قبل از خط فعلی</td></tr>
        </tbody>
    </table>
</div>
<div class="box note"><i class="fas fa-lightbulb"></i><div>نکته: در <code>vi</code>، دستور <code>dd</code> علاوه بر حذف، متن حذف‌شده را در حافظه موقت نگه می‌دارد؛ پس می‌توانید با <code>p</code> همان خط را جای دیگری جای‌گذاری کنید.</div></div>

<h2>بخش هشتم: بازگشت تغییرات (Undo / Redo)</h2>
<div class="table-wrap">
    <table>
        <thead><tr><th>کلید</th><th>عملکرد</th></tr></thead>
        <tbody>
            <tr><td><code>u</code></td><td>بازگشت آخرین تغییر (Undo)</td></tr>
            <tr><td><code>Ctrl + r</code></td><td>بازگرداندن تغییر لغوشده (Redo)</td></tr>
        </tbody>
    </table>
</div>

<h2>بخش نهم: جستجو و جایگزینی</h2>
<h3>جستجوی ساده</h3>
<div class="table-wrap">
    <table>
        <thead><tr><th>کلید</th><th>عملکرد</th></tr></thead>
        <tbody>
            <tr><td><code>/word</code></td><td>جستجوی «word» به سمت جلو</td></tr>
            <tr><td><code>?word</code></td><td>جستجوی «word» به سمت عقب</td></tr>
            <tr><td><code>n</code></td><td>رفتن به نتیجه بعدی</td></tr>
            <tr><td><code>N</code></td><td>رفتن به نتیجه قبلی (جهت معکوس)</td></tr>
        </tbody>
    </table>
</div>

<h3>جایگزینی (Find & Replace)</h3>
<p>ساختار کلی:</p>
<div class="code-container"><span class="code-label">جایگزینی</span><div class="code-block">:s/old/new/</div></div>
<p>جایگزینی فقط اولین مورد در خط فعلی.</p>
<div class="code-container"><span class="code-label">جایگزینی همه در خط</span><div class="code-block">:s/old/new/g</div></div>
<p>جایگزینی همه موارد در خط فعلی (<code>g</code> = global در خط).</p>
<div class="code-container"><span class="code-label">جایگزینی در کل فایل</span><div class="code-block">:%s/old/new/g</div></div>
<p>جایگزینی همه موارد در <strong>کل فایل</strong>.</p>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">:%s/root/admin/g</div></div>
<p>همه کلمات «root» را در کل فایل به «admin» تبدیل می‌کند.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی</strong>این دستور یکی از پرکاربردترین و پرسؤال‌ترین موارد <code>vi</code> در LPIC-1 است.</div></div>

<h2>بخش دهم: کپی و جای‌گذاری چند خط با محدوده</h2>
<p>می‌توانید عملیات را روی محدوده‌ای از خطوط انجام دهید:</p>
<div class="code-container"><span class="code-label">حذف محدوده</span><div class="code-block">:5,10d</div></div>
<p>حذف خطوط ۵ تا ۱۰</p>
<div class="code-container"><span class="code-label">کپی محدوده</span><div class="code-block">:5,10y</div></div>
<p>کپی خطوط ۵ تا ۱۰</p>
<div class="code-container"><span class="code-label">جایگزینی محدوده</span><div class="code-block">:5,10s/old/new/g</div></div>
<p>جایگزینی در خطوط ۵ تا ۱۰</p>

<h2>بخش یازدهم: شماره خط و تنظیمات نمایشی</h2>
<div class="table-wrap">
    <table>
        <thead><tr><th>دستور</th><th>عملکرد</th></tr></thead>
        <tbody>
            <tr><td><code>:set nu</code></td><td>نمایش شماره خطوط</td></tr>
            <tr><td><code>:set nonu</code></td><td>مخفی کردن شماره خطوط</td></tr>
        </tbody>
    </table>
</div>

<div class="summary-box">
<h3>جدول خلاصه کلیدهای پرکاربرد <code>vi</code></h3>
<div class="table-wrap">
    <table>
        <thead><tr><th>دسته</th><th>کلید</th><th>عملکرد</th></tr></thead>
        <tbody>
            <tr><td>ورود به Insert</td><td><code>i</code> <code>a</code> <code>o</code></td><td>شروع نوشتن</td></tr>
            <tr><td>خروج از Insert</td><td><code>Esc</code></td><td>بازگشت به Command Mode</td></tr>
            <tr><td>حرکت</td><td><code>h</code> <code>j</code> <code>k</code> <code>l</code></td><td>چپ، پایین، بالا، راست</td></tr>
            <tr><td>حرکت سریع</td><td><code>gg</code> <code>G</code> <code>0</code> <code>$</code></td><td>ابتدا/انتهای فایل یا خط</td></tr>
            <tr><td>ذخیره/خروج</td><td><code>:w</code> <code>:q</code> <code>:wq</code> <code>:q!</code></td><td>ذخیره، خروج، خروج اجباری</td></tr>
            <tr><td>حذف</td><td><code>x</code> <code>dd</code></td><td>حذف کاراکتر / خط</td></tr>
            <tr><td>کپی-جای‌گذاری</td><td><code>yy</code> <code>p</code></td><td>کپی خط / جای‌گذاری</td></tr>
            <tr><td>بازگشت</td><td><code>u</code> <code>Ctrl+r</code></td><td>Undo / Redo</td></tr>
            <tr><td>جستجو</td><td><code>/word</code> <code>n</code></td><td>جستجو / نتیجه بعدی</td></tr>
            <tr><td>جایگزینی</td><td><code>:%s/old/new/g</code></td><td>جایگزینی در کل فایل</td></tr>
        </tbody>
    </table>
</div>
</div>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکات مهم LPIC-1</strong>
<ul>
    <li>⭐ همیشه به یاد داشته باشید <code>vi</code> با <strong>Command Mode</strong> باز می‌شود، نه حالت تایپ.</li>
    <li>⭐ برای شروع تایپ حتماً باید یکی از کلیدهای <code>i</code> <code>a</code> <code>o</code> را بزنید.</li>
    <li>⭐ تفاوت <code>:q</code> و <code>:q!</code> را حتماً حفظ کنید.</li>
    <li>⭐ دستور <code>:%s/old/new/g</code> مهم‌ترین دستور جایگزینی در <code>vi</code> است و در آزمون بسیار پرتکرار است.</li>
    <li>⭐ <code>dd</code> هم حذف می‌کند و هم در حافظه برای <code>p</code> نگه می‌دارد.</li>
</ul>
</div></div>

<h2>🧪 تمرین</h2>

<h3>تمرین ۱</h3>
<p>فایلی به نام <code>practice.txt</code> بسازید و وارد آن شوید:</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">vi practice.txt</div></div>
<p>با کلید <code>i</code> وارد Insert Mode شوید و چند خط متن دلخواه بنویسید.</p>

<h3>تمرین ۲</h3>
<p>با <code>Esc</code> به Command Mode برگردید و فایل را ذخیره کرده و خارج شوید:</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">:wq</div></div>

<h3>تمرین ۳</h3>
<p>فایل را دوباره باز کنید، یک خط را با <code>dd</code> حذف کنید، سپس با <code>u</code> آن را بازگردانید.</p>

<h3>تمرین ۴</h3>
<p>با استفاده از دستور زیر، همه کلمات «test» موجود در فایل را به «done» تغییر دهید:</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">:%s/test/done/g</div></div>

<h3>تمرین ۵</h3>
<p>شماره خطوط را نمایش دهید:</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">:set nu</div></div>
<p>سپس با <code>:n</code> (مثلاً <code>:3</code>) به خط سوم بروید.</p>

<h2>📝 تست‌های جلسه ۶</h2>

<div class="quiz-card"><p>❓ تست ۱: بلافاصله بعد از اجرای دستور <code>vi file.txt</code> در کدام حالت قرار داریم؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) Insert Mode</button>
    <button onclick="selectOption(this)">ب) Command Mode</button>
    <button onclick="selectOption(this)">ج) Last Line Mode</button>
    <button onclick="selectOption(this)">د) Replace Mode</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>vi</code> همیشه در حالت Command باز می‌شود؛ برای تایپ باید وارد Insert Mode شویم.</div>
</div>

<div class="quiz-card"><p>❓ تست ۲: کدام دستور فایل را ذخیره کرده و از <code>vi</code> خارج می‌کند؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>:w</code></button>
    <button onclick="selectOption(this)">ب) <code>:q</code></button>
    <button onclick="selectOption(this)">ج) <code>:wq</code></button>
    <button onclick="selectOption(this)">د) <code>:q!</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br><code>:wq</code> هم ذخیره می‌کند و هم خارج می‌شود. <code>:q!</code> فقط خروج بدون ذخیره است، نه ذخیره و خروج.</div>
</div>

<div class="quiz-card"><p>❓ تست ۳: دستور <code>dd</code> در <code>vi</code> چه کاری انجام می‌دهد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) کپی خط فعلی</button>
    <button onclick="selectOption(this)">ب) حذف کل خط فعلی</button>
    <button onclick="selectOption(this)">ج) ذخیره فایل</button>
    <button onclick="selectOption(this)">د) جستجوی یک عبارت</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>dd</code> خط فعلی را حذف می‌کند و آن را در حافظه موقت برای <code>p</code> نگه می‌دارد.</div>
</div>

<div class="quiz-card"><p>❓ تست ۴: کدام دستور همه موارد کلمه «old» را در <strong>کل فایل</strong> به «new» تغییر می‌دهد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>:s/old/new/</code></button>
    <button onclick="selectOption(this)">ب) <code>:s/old/new/g</code></button>
    <button onclick="selectOption(this)">ج) <code>:%s/old/new/g</code></button>
    <button onclick="selectOption(this)">د) <code>/old/new/</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br>علامت <code>%</code> یعنی «همه خطوط فایل» و <code>g</code> یعنی «همه موارد در هر خط». بدون <code>%</code>، جایگزینی فقط در خط فعلی انجام می‌شود.</div>
</div>

<div class="quiz-card"><p>❓ تست ۵: برای بازگرداندن آخرین تغییر انجام‌شده در <code>vi</code> از کدام کلید استفاده می‌شود؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>p</code></button>
    <button onclick="selectOption(this)">ب) <code>u</code></button>
    <button onclick="selectOption(this)">ج) <code>x</code></button>
    <button onclick="selectOption(this)">د) <code>n</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>u</code> معادل Undo است. برای Redo از <code>Ctrl+r</code> استفاده می‌شود.</div>
</div>

<div class="summary-box">
<h3>🎯 جمع‌بندی جلسه ۶</h3>
<p>مهم‌ترین نکات این جلسه:</p>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">i / a / o   -> ورود به Insert Mode
Esc         -> بازگشت به Command Mode
:w :q :wq :q!  -> ذخیره و خروج
dd / yy / p    -> حذف، کپی، جای‌گذاری
u / Ctrl+r     -> Undo / Redo
/word , n      -> جستجو
:%s/old/new/g  -> جایگزینی در کل فایل</div></div>
<p>همچنین یاد گرفتیم که:</p>
<ul>
    <li><code>vi</code> سه حالت اصلی دارد: Command، Insert و Last Line.</li>
    <li>همیشه کار در <code>vi</code> با Command Mode شروع می‌شود.</li>
    <li>دستورات ذخیره و خروج، حذف/کپی/جای‌گذاری و جایگزینی متن، پرتکرارترین موضوعات آزمون LPIC-1 درباره <code>vi</code> هستند.</li>
    <li>تمرین روزانه با <code>vi</code> سرعت و مهارت شما را به‌طور محسوسی افزایش می‌دهد.</li>
</ul>
<p>در جلسه بعد به‌صورت کامل با ویرایشگر <code>nano</code> آشنا خواهیم شد.</p>
</div>
