<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <!-- ============================================================
         سرصفحه (Head)
         شامل متا تگ‌ها، عنوان، فونت‌ها، آیکون‌ها و استایل‌های اصلی
         ============================================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebBook-LPIC1</title>

    <!-- فونت وزیرمتن برای متن‌های فارسی -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet">
    <!-- فونت JetBrains Mono برای نمایش کدها -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 برای آیکون‌ها -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ============================================================
           بخش ۱ – متغیرهای CSS (تم روشن و تاریک)
           ============================================================ */
        :root {
            --primary: #E95420;            /* رنگ اصلی (نارنجی اوبونتو) */
            --primary-hover: #c7461a;
            --primary-soft: #fde8e0;
            --primary-glow: rgba(233, 84, 32, 0.18);

            --bg-body: #f7f7f7;
            --bg-card: #ffffff;
            --bg-navbar: rgba(255, 255, 255, 0.92);

            --text-main: #333333;
            --text-heading: #1a1a1a;
            --text-muted: #666666;

            --border: #e0e0e0;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --radius: 12px;

            --note-bg: #e8f5e9;
            --note-border: #4caf50;
            --important-bg: #e3f2fd;
            --important-border: #2196f3;
            --warning-bg: #fff8e1;
            --warning-border: #ff9800;

            --code-bg: #2c001e;
            --code-text: #eeeeee;
            --terminal-green: #8ae234;

            --sidebar-width: 300px;
        }

        /* تم تاریک – با استفاده از attribute selector */
        [data-theme="dark"] {
            --primary: #E95420;
            --primary-hover: #ff6b3d;
            --primary-soft: rgba(233, 84, 32, 0.15);
            --primary-glow: rgba(233, 84, 32, 0.2);

            --bg-body: #1e1e1e;
            --bg-card: #2a2a2a;
            --bg-navbar: rgba(42, 42, 42, 0.95);

            --text-main: #e0e0e0;
            --text-heading: #ffffff;
            --text-muted: #aaaaaa;

            --border: #404040;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);

            --note-bg: rgba(76, 175, 80, 0.12);
            --note-border: #81c784;
            --important-bg: rgba(33, 150, 243, 0.12);
            --important-border: #64b5f6;
            --warning-bg: rgba(255, 152, 0, 0.12);
            --warning-border: #ffb74d;

            --code-bg: #1a1a1a;
            --code-text: #e0e0e0;
        }

        /* ============================================================
           بخش ۲ – ریست و استایل‌های عمومی
           ============================================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            overflow-x: hidden;
            max-width: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.85;
            font-size: 16.5px;
            padding-top: 64px;          /* ارتفاع نوار بالا */
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            max-width: 100%;
        }

        /* ============================================================
           بخش ۳ – نوار ناوبری (Navbar) ثابت در بالا
           ============================================================ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-navbar);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            white-space: nowrap;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
        }

        .nav-spacer {
            flex: 1;          /* فضای خالی بین برند و دکمه تم */
        }

        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .theme-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        /* ============================================================
           بخش ۴ – نوار پیشرفت (Progress Bar)
           ============================================================ */
        .progress-track {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            z-index: 999;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #ff7a45);
            width: 0%;
            transition: width 0.12s;
        }

        /* ============================================================
           بخش ۵ – نوار کناری (Sidebar) شامل فهرست مطالب
           ============================================================ */
        .sidebar {
            position: fixed;
            top: 60px;
            right: 0;
            width: var(--sidebar-width);
            height: calc(100vh - 60px);
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            z-index: 900;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.06);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg-card);
            z-index: 2;
        }

        .sidebar-header h3 {
            font-size: 1rem;
            color: var(--text-heading);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-header h3 i {
            color: var(--primary);
        }

        .sidebar-close {
            display: none;        /* در موبایل نمایش داده می‌شود */
            background: none;
            border: none;
            font-size: 1.15rem;
            color: var(--text-muted);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: 0.2s;
        }
        .sidebar-close:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }

        /* ============================================================
           بخش ۶ – استایل فهرست مطالب (TOC)
           ============================================================ */
        .toc {
            padding: 8px 0 30px;
        }

        .toc-chapter {
            border-bottom: 1px solid var(--border);
        }
        .toc-chapter:last-child {
            border-bottom: none;
        }

        .toc-chapter summary {
            padding: 12px 14px;
            font-weight: 600;
            color: var(--text-heading);
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: background 0.2s;
            user-select: none;
            font-size: 0.92rem;
            line-height: 1.4;
        }
        .toc-chapter summary::-webkit-details-marker {
            display: none;
        }

        /* فلش باز/بسته شدن */
        .toc-chapter summary::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            margin-right: auto;
            margin-top: 2px;
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: transform 0.25s;
            flex-shrink: 0;
        }
        .toc-chapter[open] summary::after {
            transform: rotate(180deg);
        }

        .toc-chapter summary:hover {
            background: var(--primary-soft);
        }
        .toc-chapter[open] > summary {
            background: var(--primary-soft);
            color: var(--primary);
        }

        .chapter-num {
            width: 24px;
            height: 24px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .toc-sections {
            list-style: none;
            padding: 0 0 8px 0;
            margin: 0;
            background: var(--bg-body);
        }

        .toc-sections li a {
            display: block;
            padding: 8px 14px 8px 48px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.18s;
            border-right: 3px solid transparent;
            line-height: 1.45;
        }
        .toc-sections li a:hover {
            color: var(--primary);
            background: var(--primary-soft);
        }
        .toc-sections li a.active {
            color: var(--primary);
            background: var(--primary-soft);
            border-right-color: var(--primary);
            font-weight: 600;
        }

        /* ============================================================
           بخش ۷ – دکمه باز کردن سایدبار (در موبایل) و اوورلی
           ============================================================ */
        .sidebar-toggle {
            display: none;          /* فقط در موبایل نشان داده می‌شود */
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            font-size: 1.25rem;
            box-shadow: 0 6px 20px var(--primary-glow);
            z-index: 950;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }
        .sidebar-toggle:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 850;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.open {
            display: block;
        }

        /* ============================================================
           بخش ۸ – محتوای اصلی (Main)
           ============================================================ */
        .main {
            max-width: 820px;
            margin: 0 auto;
            margin-right: calc(var(--sidebar-width) + 24px);
            padding: 32px 24px 80px;
            transition: margin 0.3s;
            min-width: 0;
            width: 100%;
            overflow-x: hidden;
        }

        /* هر بخش (section) به صورت پیش‌فرض مخفی است */
        .section {
            display: none;
            animation: fadeIn 0.35s ease;
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }
        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           بخش ۹ – هدر هر بخش (عنوان، شماره، متا)
           ============================================================ */
        .section-header {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }
        .section-header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background: var(--primary);
        }

        .section-badge {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .section-header h1 {
            font-size: 1.3rem;
            color: var(--text-heading);
            margin-bottom: 3px;
        }
        .section-header .meta {
            font-size: 0.84rem;
            color: var(--text-muted);
        }

        /* ============================================================
           بخش ۱۰ – تایپوگرافی محتوا (عنوان‌ها، پاراگراف‌ها، لیست‌ها و ...)
           ============================================================ */
        h2 {
            color: var(--text-heading);
            font-size: 1.2rem;
            margin: 28px 0 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            flex-shrink: 0;
        }

        h3 {
            color: var(--text-heading);
            font-size: 1.05rem;
            margin: 18px 0 8px;
        }

        p {
            margin-bottom: 14px;
            text-align: justify;
        }

        strong {
            color: var(--text-heading);
        }

        ul,
        ol {
            margin: 10px 0 18px;
            padding-right: 22px;
        }
        li {
            margin-bottom: 6px;
        }

        blockquote {
            background: var(--primary-soft);
            border-right: 4px solid var(--primary);
            padding: 14px 18px;
            margin: 20px 0;
            border-radius: 0 10px 10px 0;
            color: var(--text-heading);
            font-style: italic;
        }

        /* ============================================================
           بخش ۱۱ – جعبه‌های اطلاعاتی (نکته، مهم، هشدار)
           ============================================================ */
        .box {
            display: flex;
            gap: 14px;
            padding: 16px 18px;
            border-radius: 10px;
            margin: 22px 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            max-width: 100%;
            min-width: 0;
            overflow-x: hidden;
            overflow-wrap: break-word;
        }

        .box > div {
            min-width: 0;
            flex: 1;
            overflow-wrap: break-word;
        }
        .box i {
            font-size: 1.3rem;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .box strong {
            display: block;
            margin-bottom: 3px;
        }

        .box.note {
            background: var(--note-bg);
            border-color: var(--note-border);
        }
        .box.note i,
        .box.note strong {
            color: var(--note-border);
        }

        .box.important {
            background: var(--important-bg);
            border-color: var(--important-border);
        }
        .box.important i,
        .box.important strong {
            color: var(--important-border);
        }

        .box.warning {
            background: var(--warning-bg);
            border-color: var(--warning-border);
        }
        .box.warning i,
        .box.warning strong {
            color: var(--warning-border);
        }

        /* ============================================================
           بخش ۱۲ – نمایش کدها (Code Blocks)
           ============================================================ */
        .code-container {
            position: relative;
            margin: 24px 0;
            max-width: 100%;
            min-width: 0;
            width: 100%;
        }

        .code-label {
            position: absolute;
            top: -11px;
            left: 14px;
            background: var(--primary);
            color: #fff;
            font-size: 0.72rem;
            padding: 2px 12px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            z-index: 1;
        }

        .code-block {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 28px 18px 18px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            direction: ltr;
            text-align: left;
            unicode-bidi: isolate;
            white-space: pre;
            overflow-x: auto;
            border: 1px solid var(--border);
            max-width: 100%;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
        }

        /* جمع‌بندی‌ها و خطوط دو زبانه روی موبایل داخل کادر بمانند */
        .summary-box,
        .summary-box .code-container,
        .summary-box .code-block,
        .box .code-container,
        .box .code-block {
            max-width: 100%;
            min-width: 0;
        }

        code, .section code {
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        /* پرامپت $ برای خطوط فرمان */
        .code-block::before {
            content: '$ ';
            color: var(--terminal-green);
        }
        .code-block.no-prompt::before {
            content: none;
        }

        /* ============================================================
           بخش ۱۳ – جدول‌ها
           ============================================================ */
        .table-wrap {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 22px 0;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .table-wrap table {
            margin: 0;
            border: none;
            border-radius: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 22px 0;
            font-size: 0.93rem;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            min-width: 0;
        }

        th,
        td {
            border: 1px solid var(--border);
            padding: 11px 14px;
            text-align: right;
            vertical-align: top;
        }

        th {
            background: var(--primary-soft);
            color: var(--text-heading);
            font-weight: 600;
            white-space: nowrap;
        }

        tr:hover td {
            background: var(--bg-body);
        }

        td code {
            white-space: nowrap;
        }

        /* ============================================================
           بخش ۱۴ – جزئیات قابل باز و بسته شدن (details)
           ============================================================ */
        details.content-details {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            margin: 18px 0;
        }
        details.content-details summary {
            font-weight: 600;
            color: var(--text-heading);
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        details.content-details summary::-webkit-details-marker {
            display: none;
        }
        details.content-details[open] summary {
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border);
        }

        /* ============================================================
           بخش ۱۵ – کارت‌های آزمون (Quiz)
           ============================================================ */
        .quiz-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
            margin: 28px 0 16px;
            box-shadow: var(--shadow);
        }

        .quiz-card>p {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-heading);
            margin-bottom: 16px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quiz-options button {
            background: var(--bg-body);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            text-align: right;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.2s;
        }
        .quiz-options button:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        .quiz-options button.selected {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .quiz-answer {
            display: none;
            margin-top: 14px;
            padding: 14px 16px;
            background: var(--note-bg);
            border-radius: 10px;
            border-right: 4px solid var(--note-border);
            color: var(--text-heading);
            font-size: 0.95rem;
        }
        .quiz-answer.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        /* ============================================================
           بخش ۱۶ – حالت placeholder برای بخش‌های خالی
           ============================================================ */
        .placeholder {
            text-align: center;
            color: var(--text-muted);
            padding: 48px 20px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px dashed var(--border);
        }
        .placeholder i {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 14px;
            opacity: 0.7;
            display: block;
        }

        /* ============================================================
           بخش ۱۷ – دکمه‌های ناوبری بین بخش‌ها
           ============================================================ */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            gap: 12px;
        }

        .nav-btn {
            padding: 11px 22px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 24px;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 4px 14px var(--primary-glow);
        }
        .nav-btn:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }
        .nav-btn:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* ============================================================
           بخش ۱۸ – جعبه جمع‌بندی (Summary Box)
           ============================================================ */
        .summary-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            margin: 24px 0;
            box-shadow: var(--shadow);
            max-width: 100%;
            min-width: 0;
            overflow-x: hidden;
            overflow-wrap: break-word;
        }
        .summary-box h3 {
            margin-top: 0;
            color: var(--primary);
        }

        /* ============================================================

        <p>در این جلسه می‌خواهیم یک پایه خیلی مهم بسازیم:</p>

        <h2>سیستم‌عامل چیست؟</h2>

        <div class="code-container"><span class="code-label">ترکیب</span><div class="code-block no-prompt">Linux Kernel\n      +\nGNU Tools\n      ↓\nGNU/Linux</div></div>
        <p>یعنی <strong>Linux Kernel</strong> هسته را فراهم می‌کند و <strong>GNU</strong> بسیاری از ابزارهای پایه‌ای موردنیاز را فراهم می‌کند.</p>
        <p>به همین دلیل از نظر فنی اصطلاح <strong>GNU/Linux</strong> دقیق‌تر از صرفاً «Linux» است. البته در مکالمات روزمره تقریباً همه می‌گویند Linux، ولی وقتی درباره ساختار سیستم صحبت می‌کنیم، باید تفاوت را بدانیم.</p>

        <h2>آیا GNU/Linux هم یک سیستم کامل و آماده است؟</h2>
        <p>هنوز نه به معنای چیزی که کاربر عادی انتظار دارد. برای اینکه یک سیستم قابل استفاده و آماده داشته باشیم، اجزای دیگری هم لازم هستند.</p>
        <div class="code-container"><span class="code-label">ساختار توزیع</span><div class="code-block no-prompt">            Distribution\n                 │\n    ┌────────────┴────────────┐\n    │                         │\nLinux Kernel              GNU Tools\n    │                         │\n    └────────────┬────────────┘\n                 │\n          Other Software\n                 │\n   ┌─────────────┼─────────────┐\n   │             │             │\nPackage       Applications   Configuration\nManager</div></div>
        <p>و اگر سیستم Desktop باشد، محیط گرافیکی و برنامه‌های گرافیکی هم اضافه می‌شوند.</p>

        <h2>Distribution چیست؟</h2>
        <p>اینجا می‌رسیم به یکی از مهم‌ترین مفاهیم.</p>
        <p>احتمالاً اسم این‌ها را زیاد شنیده‌ای: Debian، Ubuntu، Fedora، AlmaLinux، Rocky Linux، Arch Linux. این‌ها <strong>Distribution</strong> یا توزیع‌های Linux هستند.</p>
        <p>به زبان ساده:</p>
        <blockquote>یک مجموعه آماده از Linux Kernel + ابزارهای سیستم + Package Manager + نرم‌افزارها + تنظیمات و اجزای دیگر که به‌صورت یک سیستم قابل نصب و استفاده ارائه می‌شود.</blockquote>
        <div class="code-container"><span class="code-label">تعریف</span><div class="code-block no-prompt">Linux Kernel\n     +\nGNU / System Tools\n     +\nPackage Manager\n     +\nRepositories\n     +\nApplications\n     +\nConfiguration\n     ↓\nLinux Distribution</div></div>

        <h2>چرا Distributionهای مختلف داریم؟</h2>
        <p>همه توزیع‌ها یک هدف و فلسفه یکسان ندارند.</p>
        <ul>
            <li><strong>Debian</strong> — تمرکز زیادی روی پایداری، ساختار منظم و سیستم بسته‌بندی Debian دارد.</li>
            <li><strong>Ubuntu</strong> — بر پایه Debian ساخته شده و روی سادگی استفاده و آماده بودن سیستم تمرکز دارد.</li>
            <li><strong>Fedora</strong> — به فناوری‌ها و نرم‌افزارهای نسبتاً جدیدتر و اکوسیستم Red Hat نزدیک است.</li>
            <li><strong>AlmaLinux</strong> — از خانواده توزیع‌های سازگار با اکوسیستم RHEL و برای محیط‌های سروری و سازمانی مهم است.</li>
            <li><strong>Arch Linux</strong> — رویکرد حداقلی و قابل سفارشی‌سازی دارد و کاربر کنترل بیشتری روی ساخت سیستم دارد.</li>
        </ul>

        <h2>خانواده‌های مهم برای LPIC-1</h2>
        <p>برای ما این قسمت خیلی مهم است. در طول دوره با دو خانواده مهم زیاد سروکار خواهیم داشت:</p>
        <div class="code-container"><span class="code-label">خانواده‌ها</span><div class="code-block no-prompt">Debian Family\n│\n├── Debian\n└── Ubuntu\n\nRed Hat Family\n│\n├── RHEL\n├── AlmaLinux\n├── Rocky Linux\n└── Fedora</div></div>
        <p>این خانواده‌ها در بعضی قسمت‌ها تفاوت‌های مهمی دارند. مثلاً در مدیریت Package:</p>
        <p><strong>Debian</strong> با ابزارهایی مثل <code>apt</code> و <code>dpkg</code> کار می‌کنیم و Packageها معمولاً <code>.deb</code> هستند.</p>
        <p><strong>Red Hat / AlmaLinux</strong> با ابزارهایی مثل <code>dnf</code> و <code>rpm</code> کار می‌کنیم و Packageها معمولاً <code>.rpm</code> هستند.</p>

        <div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>در فایل آموزشی تأکید شده که برای محیط آموزشی LPIC-1، Full ISO مسیر مطمئن‌تری است؛ مخصوصاً با توجه به مشکلات احتمالی دسترسی به Repositoryها و اینترنت.</div></div>

        <h2>نصب AlmaLinux</h2>
        <p>فرآیند کلی:</p>
        <div class="code-container"><span class="code-label">مراحل</span><div class="code-block no-prompt">AlmaLinux ISO\n      ↓\nCreate VM\n      ↓\nCPU / RAM / Disk\n      ↓\nAttach ISO\n      ↓\nBoot\n      ↓\nInstaller\n      ↓\nPartitioning\n      ↓\nNetwork\n      ↓\nUser\n      ↓\nInstall\n      ↓\nReboot</div></div>
        <p>در هنگام نصب معمولاً با مواردی مثل این مواجه می‌شوی: Language، Keyboard، Time Zone، Disk، Network، User، Root، Installation.</p>

        <h2>Partitioning چیست؟</h2>
        <p>در زمان نصب، باید مشخص کنیم Linux چگونه از Disk استفاده کند. مثلاً:</p>
        <div class="code-container"><span class="code-label">دیسک</span><div class="code-block no-prompt">Disk\n│\n├── Partition 1\n│\n├── Partition 2\n│\n└── ...</div></div>
        <p>در فصل سوم به‌صورت جدی‌تر سراغ <code>fdisk</code>، <code>LVM</code>، <code>RAID</code>، <code>mount</code>، <code>filesystem</code> می‌رویم. پس فعلاً لازم نیست وارد جزئیات Partitioning شویم.</p>
        <p>فقط مفهوم را بفهم: Installer باید بداند فایل‌های Linux را روی کدام بخش Disk قرار دهد.</p>

        <h2>User و Root</h2>
        <p>در نصب Linux معمولاً با مفهوم User و Root روبه‌رو می‌شوی.</p>
        <h3>User معمولی</h3>
        <p>برای کارهای روزمره. مثلاً <code>navid</code>.</p>
        <h3>Root</h3>
        <p>کاربر Administrator اصلی Linux است. <code>root</code> تقریباً بالاترین سطح دسترسی را دارد.</p>
        <div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امنیتی</strong>با Root نباید بی‌دلیل همه کارها را انجام داد. در فصل‌های Permission و <code>sudo</code> مفصل‌تر بررسی می‌کنیم.</div></div>

        <h2>نصب Debian</h2>
        <p>حالا همین روند را برای Debian داریم:</p>
        <div class="code-container"><span class="code-label">مراحل</span><div class="code-block no-prompt">Debian ISO\n     ↓\nCreate VM\n     ↓\nCPU / RAM / Disk\n     ↓\nAttach ISO\n     ↓\nBoot\n     ↓\nDebian Installer\n     ↓\nPartitioning\n     ↓\nNetwork\n     ↓\nUser\n     ↓\nPackage Selection\n     ↓\nInstall\n     ↓\nReboot</div></div>
        <p>در Debian ممکن است ظاهر Installer و جزئیات بعضی مراحل با AlmaLinux متفاوت باشد، ولی مفهوم کلی همان است.</p>

        <h2>یک نکته خیلی مهم درباره دو VM</h2>
        <p>قرار نیست AlmaLinux و Debian را فقط نصب کنیم و کنار بگذاریم. در ادامه دوره هرجا لازم باشد، می‌توانیم یک مفهوم را روی هر دو بررسی کنیم.</p>
        <p>مثلاً:</p>
        <h3>نصب Package</h3>

        <p>اینجا کم‌کم تفاوت بین <strong>مفاهیم مشترک Linux</strong> و <strong>روش پیاده‌سازی متفاوت Distributionها</strong> را یاد می‌گیری.</p>

        "intro-3": `
<div class="section-header">
    <div class="section-badge">م</div>
    <div>
        <h1>Repository، Mirror، شبکه VM و SSH</h1>
        <div class="meta">مقدمه · بخش ۳ از ۳</div>
    </div>
</div>

<p>در دو جلسه قبل، اول ساختار Linux را شناختیم و بعد Lab را ساختیم.</p>
<p>حالا سه موضوع را به هم وصل می‌کنیم:</p>
<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">Repository / Mirror\n        ↓\n    Packageها\n        ↓\n   Network\n        ↓\n       SSH\n        ↓\nمدیریت VM از سیستم اصلی</div></div>
<p>این جلسه آخرین جلسه مقدمه است و بعد از آن وارد <strong>فصل اول</strong> می‌شویم.</p>

<h2>Repository چیست؟</h2>
<p>فرض کن می‌خواهی یک برنامه روی Linux نصب کنی.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">AlmaLinux</span><div class="code-block">dnf install nginx</div></div>
<p>یا در Debian:</p>
<div class="code-container"><span class="code-label">Debian</span><div class="code-block">apt install nginx</div></div>
<p>سؤال: این Package از کجا می‌آید؟ از <strong>Repository</strong>.</p>
<p>Repository را فعلاً می‌توانیم این‌طور تصور کنیم:</p>
<blockquote>یک محل سازمان‌یافته که Packageهای مربوط به Distribution در آن قرار دارند و Package Manager از آن‌ها استفاده می‌کند.</blockquote>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Debian</span><div class="code-block no-prompt">Debian\n   ↓\nRepository\n   ↓\nnginx.deb\nvim.deb\ncurl.deb</div></div>
<p>و در AlmaLinux:</p>
<div class="code-container"><span class="code-label">AlmaLinux</span><div class="code-block no-prompt">AlmaLinux\n   ↓\nRepository\n   ↓\nnginx.rpm\nvim.rpm\ncurl.rpm</div></div>

<h2>Package Manager چیست؟</h2>
<p>Package Manager برنامه‌ای است که مدیریت Packageها را انجام می‌دهد.</p>
<p>در خانواده Debian:</p>
<div class="code-container"><span class="code-label">Debian</span><div class="code-block no-prompt">apt\ndpkg</div></div>
<p>و در خانواده Red Hat:</p>
<div class="code-container"><span class="code-label">Red Hat</span><div class="code-block no-prompt">dnf\nrpm</div></div>
<p>مثلاً در Debian:</p>
<div class="code-container"><span class="code-label">Debian</span><div class="code-block">apt install nginx</div></div>
<p>در AlmaLinux:</p>
<div class="code-container"><span class="code-label">AlmaLinux</span><div class="code-block">dnf install nginx</div></div>
<p>در اینجا <code>apt</code> و <code>dnf</code> با Repository ارتباط برقرار می‌کنند و Package موردنیاز را دریافت و نصب می‌کنند.</p>

<h2>Repository و Mirror چه تفاوتی دارند؟</h2>
<p>این دو را با هم اشتباه نکن.</p>
<h3>Repository</h3>
<p>مجموعه/محل Packageها و Metadata مربوط به آن‌هاست.</p>
<h3>Mirror</h3>
<p>یک نسخه کپی‌شده یا همگام‌شده از Repository است که در یک سرور دیگر قرار دارد.</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">Official Repository\n       │\n       ├──────────────┐\n       ↓              ↓\n   Mirror A        Mirror B\n       │              │\n       ↓              ↓\n     User           User</div></div>
<p>چرا Mirror وجود دارد؟ برای کاهش فشار روی سرور اصلی، افزایش سرعت دانلود، توزیع جغرافیایی محتوا و دسترسی بهتر کاربران.</p>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته مهم</strong>آدرس Mirrorها ثابت و ابدی نیستند. در این دوره مفهوم و روش پیدا کردن/تنظیم Repository مهم‌تر از حفظ آدرس‌هاست.</div></div>

<h2>Repository در Debian</h2>
<p>در خانواده Debian، تنظیمات Repository در ساختار <code>/etc/apt/</code> قرار می‌گیرند.</p>
<p>مفهوم کلی:</p>
<div class="code-container"><span class="code-label">APT</span><div class="code-block no-prompt">APT\n ↓\nRepository Configuration\n ↓\nRepository\n ↓\nPackage</div></div>
<p>مثلاً یک خط Repository به شکل زیر است:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">deb http://mirror.example/debian bookworm main</div></div>
<p>ساختار این خط:</p>
<div class="code-container"><span class="code-label">اجزا</span><div class="code-block no-prompt">deb\n ↓\nRepository URL\n ↓\nDistribution\n ↓\nComponents</div></div>

<h2>Repository در AlmaLinux</h2>
<p>در AlmaLinux ساختار Repositoryها معمولاً در <code>/etc/yum.repos.d/</code> قرار دارد. فایل‌ها معمولاً پسوند <code>.repo</code> دارند.</p>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>دو مسیر مهم</strong><br>
Debian → <code>/etc/apt/</code><br>
AlmaLinux → <code>/etc/yum.repos.d/</code>
</div></div>

<h2>حالا برویم سراغ Network</h2>
<p>برای اینکه بتوانیم از Host به VM وصل شویم، VM باید شبکه داشته باشد.</p>
<p>داخل Linux دستور مهم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ip a</div></div>
<p>این دستور اطلاعات Interfaceهای شبکه و IPهای آن‌ها را نمایش می‌دهد.</p>
<p>مثلاً ممکن است چیزی شبیه این ببینی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">2: enp0s3: <BROADCAST,MULTICAST,UP,LOWER_UP>\n    inet 192.168.1.100/24</div></div>
<p>قسمت مهم فعلاً <code>192.168.1.100</code> است که IP است.</p>

<h2>Network Interface چیست؟</h2>
<p>وقتی می‌زنیم <code>ip a</code> ممکن است Interfaceهایی مثل <code>eth0</code>، <code>ens3</code>، <code>enp0s3</code> ببینیم. این‌ها نام Interfaceهای شبکه هستند.</p>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>توجه</strong>نام Interface الزاماً در تمام سیستم‌ها یکسان نیست. نباید انتظار داشته باشی همیشه <code>eth0</code> ببینی.</div></div>

<h2>IP Address</h2>
<p>برای ارتباط شبکه‌ای، دستگاه باید آدرس داشته باشد. مثلاً <code>192.168.1.100</code>.</p>
<p>در خروجی <code>ip a</code> ممکن است ببینی <code>inet 192.168.1.100/24</code>. فعلاً <code>/24</code> را به‌عنوان بخش مربوط به Subnet/Prefix بشناس.</p>

<h2>NAT چیست؟</h2>
<p>اگر VM را روی <strong>NAT</strong> قرار دهیم، VM معمولاً از طریق Host به شبکه/اینترنت دسترسی پیدا می‌کند.</p>
<div class="code-container"><span class="code-label">NAT</span><div class="code-block no-prompt">Internet\n   │\nHost\n   │\n NAT\n   │\n VM</div></div>
<p>در NAT، VM در یک شبکه مجازی قرار می‌گیرد. این حالت برای دسترسی VM به اینترنت بسیار مناسب است اما دسترسی مستقیم از Host یا شبکه بیرونی به VM همیشه به سادگی Bridge نیست.</p>

<h2>Bridge چیست؟</h2>
<p>در حالت <strong>Bridge</strong>، ماشین مجازی را می‌توان به شکل ساده‌تر مثل یک دستگاه جداگانه در شبکه محلی دید.</p>
<div class="code-container"><span class="code-label">Bridge</span><div class="code-block no-prompt">Router\n  │\n  ├── Host\n  │\n  └── VM</div></div>
<p>در این حالت VM می‌تواند یک IP مستقل در شبکه LAN بگیرد. مثلاً <code>Host → 192.168.1.10</code> و <code>VM → 192.168.1.20</code>. بنابراین Host می‌تواند مستقیماً با IP ماشین مجازی ارتباط برقرار کند.</p>

<h2>NAT یا Bridge؟</h2>
<table>
<thead><tr><th>ویژگی</th><th>NAT</th><th>Bridge</th></tr></thead>
<tbody>
<tr><td>دسترسی VM به اینترنت</td><td>✅</td><td>✅</td></tr>
<tr><td>VM در شبکه LAN مثل یک دستگاه مستقل</td><td>معمولاً ❌</td><td>✅</td></tr>
<tr><td>IP مستقل در LAN</td><td>معمولاً ❌</td><td>✅</td></tr>
<tr><td>مناسب برای SSH از Host</td><td>نیازمند تنظیم بیشتر</td><td>معمولاً ساده‌تر</td></tr>
</tbody>
</table>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>جزئیات دقیق رفتار NAT به نرم‌افزار مجازی‌سازی و تنظیمات شبکه بستگی دارد.</div></div>

<h2>Host-only چیست؟</h2>
<p>یک حالت دیگر: <strong>Host-only</strong>. در این حالت شبکه‌ای خصوصی بین Host و VM ایجاد می‌شود. معمولاً اینترنت از این شبکه به VM ارائه نمی‌شود، مگر اینکه خودمان Routing/NAT اضافه کنیم.</p>

<h2>SSH چیست؟</h2>
<p><strong>SSH = Secure Shell</strong></p>
<p>SSH به ما اجازه می‌دهد از راه دور به سیستم Linux وصل شویم و با Shell آن کار کنیم.</p>
<div class="code-container"><span class="code-label">اتصال</span><div class="code-block no-prompt">Windows Host\n      │\n      │ SSH\n      ↓\nAlmaLinux VM</div></div>
<p>و به جای اینکه دائماً داخل پنجره VM کار کنیم، از Terminal سیستم اصلی به Linux وصل می‌شویم.</p>

<h2>پیدا کردن IP برای SSH</h2>
<p>داخل AlmaLinux یا Debian:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ip a</div></div>
<p>مثلاً <code>inet 192.168.1.100/24</code> پس IP <code>192.168.1.100</code> است.</p>

<h2>دستور SSH</h2>
<p>ساختار کلی:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block">ssh username@ip_address</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ssh navid@192.168.1.100</div></div>
<p>یعنی با کاربر <code>navid</code> به سیستم دارای IP <code>192.168.1.100</code> وصل شو.</p>

<h2>اولین اتصال SSH</h2>
<p>در اولین اتصال ممکن است پیامی درباره Host Key ببینی. اگر مطمئن هستی که این همان ماشین موردنظر است، معمولاً <code>yes</code> و سپس Password را وارد می‌کنی.</p>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>نکته</strong>وقتی Password را در Terminal تایپ می‌کنی، معمولاً چیزی نمایش داده نمی‌شود. این طبیعی است.</div></div>

<h2>مثال کامل</h2>
<p>فرض کنیم AlmaLinux این IP را دارد: <code>192.168.1.100</code> و User ما <code>navid</code> است.</p>
<p>از سیستم Host:</p>
<div class="code-container"><span class="code-label">اتصال</span><div class="code-block">ssh navid@192.168.1.100</div></div>
<p>سپس <code>yes</code> و Password. اگر اتصال موفق باشد، وارد Shell ماشین AlmaLinux می‌شوی.</p>

<h2>اگر NAT باشد چه؟</h2>
<p>فرض کنیم VM در حالت NAT است. در این حالت ممکن است نتوانی مستقیماً <code>ssh user@VM_IP</code> را از Host اجرا کنی.</p>
<p>یک راه‌حل: <strong>Port Forwarding</strong></p>
<div class="code-container"><span class="code-label">Port Forwarding</span><div class="code-block no-prompt">Host:2222\n     ↓\nNAT\n     ↓\nVM:22</div></div>
<p>و بعد:</p>
<div class="code-container"><span class="code-label">اتصال</span><div class="code-block">ssh -p 2222 user@localhost</div></div>
<p>عدد <code>22</code> پورت استاندارد SSH است. عدد <code>2222</code> در این مثال یک Port انتخابی روی Host است.</p>

<div class="summary-box">
<h3>🧠 تصویر کلی جلسه سوم</h3>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">              Linux VM\n                 │\n      ┌──────────┴──────────┐\n      │                     │\n   Network              Repository\n      │                     │\n  IP Address            Package\n      │                     │\n   SSH / Network        apt / dnf\n      │\n   Host ↔ VM</div></div>
<p>و کل Lab:</p>
<div class="code-container"><span class="code-label">Lab</span><div class="code-block no-prompt">                Host\n                 │\n             VMware\n                 │\n      ┌──────────┴──────────┐\n      │                     │\n      ▼                     ▼\n AlmaLinux                Debian\n      │                     │\n  Red Hat                Debian\n  Family                 Family\n      │                     │\n   dnf/rpm               apt/dpkg\n      │                     │\n      └──────────┬──────────┘\n                 │\n              Network\n                 │\n                SSH</div></div>
<p><strong>نکته ۱:</strong> Repository محل ارائه Packageها و Metadata مربوط به آن‌هاست.</p>
<p><strong>نکته ۲:</strong> Mirror یک نسخه همگام‌شده از Repository روی سرور دیگری است.</p>
<p><strong>نکته ۳:</strong> Debian: <code>/etc/apt/</code> — AlmaLinux: <code>/etc/yum.repos.d/</code></p>
<p><strong>نکته ۴:</strong> برای دیدن Interface و IP: <code>ip a</code></p>
<p><strong>نکته ۵:</strong> ساختار SSH: <code>ssh user@IP</code></p>
<p><strong>نکته ۶:</strong> در NAT ممکن است برای اتصال از Host به VM به Port Forwarding نیاز داشته باشیم.</p>
<p><strong>نکته ۷:</strong> Bridge معمولاً باعث می‌شود VM مثل یک دستگاه مستقل در شبکه LAN IP بگیرد.</p>
</div>

<h2>خودآزمایی</h2>
<div class="quiz-card"><p>❓ تست ۱: کدام گزینه تفاوت Repository و Mirror را بهتر بیان می‌کند؟</p>
<div class="quiz-options">
<button onclick="selectOption(this)">الف) Repository فقط برای Debian است و Mirror فقط برای AlmaLinux.</button>
<button onclick="selectOption(this)">ب) Repository محل ارائه Packageهاست و Mirror نسخه‌ای همگام‌شده از Repository است.</button>
<button onclick="selectOption(this)">ج) Repository یک Network Interface است.</button>
<button onclick="selectOption(this)">د) Mirror همان Package Manager است.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br>Repository محل ارائه Packageها و اطلاعات مربوط به آن‌هاست. Mirror برای توزیع و ارائه همان محتوا از یک سرور دیگر استفاده می‌شود.</div></div>

<div class="quiz-card"><p>❓ تست ۲: کدام مسیر برای Repositoryهای AlmaLinux مهم است؟</p>
<div class="quiz-options">
<button onclick="selectOption(this)">الف) <code>/etc/apt/</code></button>
<button onclick="selectOption(this)">ب) <code>/etc/network/</code></button>
<button onclick="selectOption(this)">ج) <code>/etc/yum.repos.d/</code></button>
<button onclick="selectOption(this)">د) <code>/var/ssh/</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br>در AlmaLinux فایل‌های Repository معمولاً در <code>/etc/yum.repos.d/</code> قرار دارند.</div></div>

<div class="quiz-card"><p>❓ تست ۳: برای پیدا کردن IP ماشین Linux کدام دستور مناسب است؟</p>
<div class="quiz-options">
<button onclick="selectOption(this)">الف) <code>ls</code></button>
<button onclick="selectOption(this)">ب) <code>ip a</code></button>
<button onclick="selectOption(this)">ج) <code>grep</code></button>
<button onclick="selectOption(this)">د) <code>tar</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>ip a</code> اطلاعات Interfaceهای شبکه و IPها را نمایش می‌دهد.</div></div>

<div class="quiz-card"><p>❓ تست ۴: می‌خواهیم با User به نام <code>ali</code> به سیستم دارای IP <code>192.168.1.50</code> از طریق SSH متصل شویم. کدام دستور درست است؟</p>
<div class="quiz-options">
<button onclick="selectOption(this)">الف) <code>ssh 192.168.1.50@ali</code></button>
<button onclick="selectOption(this)">ب) <code>ssh ali@192.168.1.50</code></button>
<button onclick="selectOption(this)">ج) <code>ssh ali:192.168.1.50</code></button>
<button onclick="selectOption(this)">د) <code>ssh --ali 192.168.1.50</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br>ساختار SSH: <code>ssh username@ip</code> بنابراین <code>ssh ali@192.168.1.50</code> درست است.</div></div>

<div class="quiz-card"><p>❓ تست ۵ — مهم: فرض کنیم VM در حالت NAT قرار دارد و می‌خواهیم از Host به SSH داخل VM متصل شویم. کدام گزینه می‌تواند راه‌حل باشد؟</p>
<div class="quiz-options">
<button onclick="selectOption(this)">الف) حذف کردن IP ماشین</button>
<button onclick="selectOption(this)">ب) استفاده از Port Forwarding</button>
<button onclick="selectOption(this)">ج) حذف کردن Network Adapter</button>
<button onclick="selectOption(this)">د) نصب دوباره Kernel</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br>در NAT ممکن است Host نتواند مستقیماً به سرویس داخل VM دسترسی پیدا کند. یکی از راه‌ها Port Forwarding است. مثلاً <code>Host:2222 → VM:22</code> و سپس <code>ssh -p 2222 user@localhost</code>.</div></div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>پایان مقدمه — تمرین عملی</strong><br>
حالا روی AlmaLinux: <code>ip a</code> را بزن و IP را پیدا کن. سپس از Host تلاش کن <code>ssh username@IP</code> را اجرا کنی. همین کار را برای Debian هم انجام بده.<br>
اگر توانستی از Host به هر دو VM وصل شوی، <strong>مقدمه LPIC-1 تمام شده است</strong> و از جلسه بعد وارد <strong>فصل اول — کار با خط فرمان</strong> می‌شویم.
</div></div>

"ch1-1": `
<div class="section-header">
    <div class="section-badge">۱</div>
    <div>
        <h1>Terminal, Shell, Command</h1>
        <div class="meta">کار با خط فرمان · بخش ۱ از ۱۴</div>
    </div>
</div>

<p>در این جلسه می‌خواهیم سه مفهوم پایه‌ای ولی <strong>خیلی مهم</strong> لینوکس را یاد بگیریم:</p>
<blockquote><strong>Terminal → Shell → Command</strong></blockquote>
<p>اگر این سه مورد را درست بفهمی، خیلی از مباحث بعدی لینوکس برایت راحت‌تر می‌شود.</p>

<h2>Terminal چیست؟</h2>
<p><strong>Terminal</strong> یا ترمینال محیطی است که از طریق آن می‌توانیم با سیستم‌عامل ارتباط برقرار کنیم و دستورات را وارد کنیم.</p>
<p>مثلاً وقتی در لینوکس یک پنجره باز می‌کنی و چیزی شبیه این می‌بینی:</p>
<div class="code-container"><span class="code-label">نمونه</span><div class="code-block no-prompt">user@linux:~$</div></div>
<p>این محیط، <strong>Terminal</strong> است.</p>
<p>ما داخل Terminal دستور وارد می‌کنیم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ls</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">pwd</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">mkdir test</div></div>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته مهم</strong>Terminal خودش دستورها را اجرا نمی‌کند. Terminal بیشتر نقش <strong>محیط ورودی/خروجی</strong> را دارد.</div></div>
<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">تو\n ↓\nTerminal\n ↓\nShell\n ↓\nCommand\n ↓\nLinux</div></div>

<h2>Shell چیست؟</h2>
<p><strong>Shell</strong> برنامه‌ای است که دستورات متنی ما را دریافت می‌کند، آن‌ها را تفسیر می‌کند و از سیستم‌عامل می‌خواهد کاری را انجام دهد.</p>
<p>معروف‌ترین Shell در لینوکس:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">Bash</div></div>
<p>است. Bash مخفف <strong>Bourne Again SHell</strong> است.</p>
<p>اما Shellهای دیگری هم وجود دارند، مثل:</p>
<div class="code-container"><span class="code-label">نمونه</span><div class="code-block no-prompt">sh\nbash\nzsh\nfish\nksh</div></div>
<p>مثلاً ممکن است Terminal تو از Bash استفاده کند.</p>
<p>می‌توانی با این دستور Shell فعلی را بررسی کنی:</p>
<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">echo $SHELL</div></div>
<p>ممکن است خروجی چیزی شبیه این باشد:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">/bin/bash</div></div>
<p>یعنی Shell پیش‌فرض کاربر Bash است.</p>

<h2>تفاوت Terminal و Shell</h2>
<p>این قسمت برای LPIC-1 مهم است.</p>
<p>فرض کن Terminal را مثل یک <strong>اتاق</strong> در نظر بگیریم. Shell کسی است که داخل آن اتاق نشسته و حرف‌های تو را می‌فهمد.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">Terminal\n   │\n   ▼\n Bash\n   │\n   ▼\n دستور\n   │\n   ▼\n Linux</div></div>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نتیجه</strong>Terminal ≠ Shell<br>Terminal محیطی برای تعامل با Shell است. Shell برنامه‌ای است که دستورات را تفسیر می‌کند.</div></div>

<h2>Command چیست؟</h2>
<p><strong>Command</strong> یا دستور، چیزی است که به Shell می‌دهیم تا یک عملیات انجام دهد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">pwd</div></div>
<p>یک command است. یا:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ls</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">mkdir test</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">cat file.txt</div></div>
<p>همه Command هستند.</p>

<h2>یک مثال واقعی</h2>
<p>وقتی این را می‌نویسی:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ls</div></div>
<p>چه اتفاقی می‌افتد؟</p>
<div class="code-container"><span class="code-label">روند</span><div class="code-block no-prompt">Terminal\n   ↓\nShell (مثلاً Bash)\n   ↓\nبررسی دستور ls\n   ↓\nاجرای ls\n   ↓\nنمایش فایل‌ها و پوشه‌ها</div></div>
<p>در واقع تو مستقیماً با Kernel صحبت نمی‌کنی.</p>

<h2>Shell چطور Command را پیدا می‌کند؟</h2>
<p>وقتی می‌نویسی <code>ls</code>، Bash باید بفهمد برنامه <code>ls</code> کجاست.</p>
<p>معمولاً مسیرهایی مثل این در متغیر <code>PATH</code> قرار دارند:</p>
<div class="code-container"><span class="code-label">مسیرها</span><div class="code-block no-prompt">/bin\n/usr/bin\n/usr/local/bin</div></div>
<p>مثلاً ممکن است <code>ls</code> در این مسیر باشد:</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">/usr/bin/ls</div></div>
<p>بعداً در مبحث <code>PATH</code> بیشتر با این موضوع کار خواهیم کرد.</p>

<h2>Command می‌تواند Argument داشته باشد</h2>
<p>دستورها می‌توانند <strong>Argument</strong> دریافت کنند.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls /home</div></div>
<p>اینجا <code>ls</code> دستور است و <code>/home</code> یک Argument است.</p>
<p>مثال دیگر:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">mkdir test</div></div>
<p>اینجا <code>mkdir</code> Command و <code>test</code> Argument است.</p>

<h2>Option چیست؟</h2>
<p>دستورها معمولاً Option هم دارند.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls -l</div></div>
<p>اینجا <code>ls</code> Command است و <code>-l</code> Option است.</p>
<p>یا:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls -la /home</div></div>
<p>داریم:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">Command → ls\nOption  → -l\nOption  → -a\nArgument → /home</div></div>
<p>البته بعضی دستورها شکل‌های متفاوتی برای Option دارند. مثلاً <code>--help</code> یک <strong>Long Option</strong> است.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls --help</div></div>

<h2>Command معمولاً سه بخش دارد</h2>
<p>یک ساختار ساده برای ذهن:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">command   option   argument\n   │         │         │\n   ▼         ▼         ▼\n  ls        -l       /home</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls -l /home</div></div>
<p>اما دقت کن که <strong>همه Commandها الزاماً Option یا Argument ندارند.</strong></p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">pwd</div></div>
<p>فقط یک Command است.</p>

<h2>Commandهای داخلی و خارجی</h2>
<p>این قسمت برای LPIC-1 مهم است.</p>
<p>در Shellها دو نوع کلی Command داریم:</p>
<h3>Built-in Command</h3>
<p>دستورهایی که خود Shell درون خودش دارد. مثلاً در Bash:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cd</div></div>
<p>یک Bash Built-in است. همچنین <code>echo</code>، <code>pwd</code>، <code>history</code> ممکن است به‌صورت Built-in در Bash وجود داشته باشند.</p>
<h3>External Command</h3>
<p>برنامه‌ای جدا از Shell است که روی سیستم وجود دارد. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls</div></div>
<p>معمولاً یک برنامه خارجی است. مسیر آن را می‌توانیم با:</p>
<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">which ls</div></div>
<p>بررسی کنیم. مثلاً:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">/usr/bin/ls</div></div>

<h2>چطور بفهمیم یک Command چیست؟</h2>
<p>یکی از دستورات بسیار مهم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">type</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">type cd</div></div>
<p>ممکن است بگوید:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">cd is a shell builtin</div></div>
<p>ولی:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">type ls</div></div>
<p>ممکن است بگوید:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">ls is /usr/bin/ls</div></div>
<p>این دستور برای فهمیدن ماهیت Command بسیار کاربردی است.</p>

<h2>چند دستور پایه که از همین الان باید بشناسی</h2>
<p>فعلاً لازم نیست همه را عمیق یاد بگیری.</p>
<table>
<thead><tr><th>Command</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>pwd</code></td><td>نمایش مسیر فعلی</td></tr>
<tr><td><code>ls</code></td><td>نمایش فایل‌ها و پوشه‌ها</td></tr>
<tr><td><code>cd</code></td><td>تغییر مسیر</td></tr>
<tr><td><code>mkdir</code></td><td>ساخت پوشه</td></tr>
<tr><td><code>touch</code></td><td>ساخت فایل خالی</td></tr>
<tr><td><code>cat</code></td><td>نمایش محتوای فایل</td></tr>
<tr><td><code>echo</code></td><td>چاپ متن</td></tr>
<tr><td><code>history</code></td><td>نمایش دستورات قبلی</td></tr>
<tr><td><code>man</code></td><td>نمایش Manual</td></tr>
</tbody>
</table>
<p>این‌ها را در جلسات بعدی عمیق‌تر یاد می‌گیریم.</p>

<h2>Prompt چیست؟</h2>
<p>وقتی Terminal را باز می‌کنی، معمولاً چیزی شبیه این می‌بینی:</p>
<div class="code-container"><span class="code-label">نمونه</span><div class="code-block no-prompt">navid@debian:~$</div></div>
<p>این را <strong>Shell Prompt</strong> می‌گوییم. Prompt به تو نشان می‌دهد که Shell آماده دریافت دستور است.</p>
<p>مثلاً <code>$</code> یعنی معمولاً کاربر معمولی هستی. اما <code>#</code> معمولاً نشان‌دهنده Shell کاربر <code>root</code> است.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">root@server:~#</div></div>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته آزمونی مهم</strong>به‌طور معمول: <code>$ → Regular User</code> و <code># → root</code>. البته این صرفاً یک convention برای Prompt است و می‌توان آن را تغییر داد.</div></div>

<h2>Kernel کجای این داستان است؟</h2>
<p>Linux در معنای دقیق، <strong>Kernel</strong> است. Kernel مسئول ارتباط با سخت‌افزار و مدیریت منابع سیستم است.</p>
<div class="code-container"><span class="code-label">زنجیره کامل</span><div class="code-block no-prompt">User\n  ↓\nTerminal\n  ↓\nShell\n  ↓\nCommand / Program\n  ↓\nKernel\n  ↓\nHardware</div></div>
<p>برای مثال وقتی یک برنامه نیاز به خواندن اطلاعات از دیسک دارد، در نهایت از امکانات Kernel استفاده می‌کند.</p>

<div class="summary-box">
<h3>🧠 جمع‌بندی جلسه</h3>
<p>این چهار مفهوم را فعلاً خیلی خوب در ذهنت نگه دار:</p>
<div class="code-container"><span class="code-label">مفاهیم</span><div class="code-block no-prompt">Terminal\n   ↓\nمحیط تعامل با سیستم\n\nShell\n   ↓\nمفسر دستورات\n\nCommand\n   ↓\nدستوری که به Shell می‌دهیم\n\nKernel\n   ↓\nهسته سیستم‌عامل و واسط اصلی با سخت‌افزار</div></div>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>Terminal و Shell یکی نیستند.</div></div>
</div>

<h2>🧪 تمرین عملی</h2>
<p>داخل AlmaLinux یا Debian این دستورات را اجرا کن:</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">echo $SHELL\ntype cd\ntype ls\nwhich ls\npwd</div></div>
<p>خروجی‌ها را نگاه کن و سعی کن برای خودت توضیح بدهی هرکدام چه چیزی را نشان می‌دهند.</p>

<h2>خودآزمایی</h2>
<div class="quiz-card"><p>❓ تست ۱: کدام گزینه تفاوت Terminal و Shell را درست بیان می‌کند؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) Terminal دستورها را تفسیر می‌کند و Shell فقط خروجی را نمایش می‌دهد.</button>
    <button onclick="selectOption(this)">ب) Terminal محیط تعامل است و Shell دستورات را تفسیر و اجرا می‌کند.</button>
    <button onclick="selectOption(this)">ج) Terminal بخشی از Kernel است و Shell بخشی از Hardware.</button>
    <button onclick="selectOption(this)">د) Terminal و Shell دقیقاً یک مفهوم هستند.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br>Terminal محیطی است که از طریق آن با سیستم تعامل می‌کنیم، درحالی‌که Shell وظیفه دریافت و تفسیر دستورات را دارد. مثال: <code>Terminal → Bash → Command</code>.</div>
</div>

<div class="quiz-card"><p>❓ تست ۲: کدام مورد نمونه‌ای از Shell در لینوکس است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) Bash</button>
    <button onclick="selectOption(this)">ب) Kernel</button>
    <button onclick="selectOption(this)">ج) Terminal</button>
    <button onclick="selectOption(this)">د) GRUB</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: الف</strong><br><code>Bash</code> یک Shell است. <code>Zsh</code>، <code>Fish</code>، <code>Ksh</code> نمونه‌های دیگری از Shell هستند. <code>Kernel</code> هسته سیستم‌عامل است، <code>Terminal</code> محیط تعامل با Shell است و <code>GRUB</code> Boot Loader است.</div>
</div>

<div class="quiz-card"><p>❓ تست ۳: دستور زیر را در نظر بگیر: <code>ls -l /home</code>. کدام گزینه ساختار آن را درست مشخص می‌کند؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>ls</code> = Argument ، <code>-l</code> = Command ، <code>/home</code> = Option</button>
    <button onclick="selectOption(this)">ب) <code>ls</code> = Command ، <code>-l</code> = Option ، <code>/home</code> = Argument</button>
    <button onclick="selectOption(this)">ج) <code>ls</code> = Option ، <code>-l</code> = Argument ، <code>/home</code> = Command</button>
    <button onclick="selectOption(this)">د) هر سه Argument هستند.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br>ساختار دستور: <code>ls → Command</code>، <code>-l → Option</code>، <code>/home → Argument</code>. یعنی دستور <code>ls</code> را با Option <code>-l</code> روی مسیر <code>/home</code> اجرا کن.</div>
</div>

<div class="quiz-card"><p>❓ تست ۴: کدام دستور برای تشخیص اینکه <code>cd</code> یک Built-in است یا External Command مناسب‌تر است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>type cd</code></button>
    <button onclick="selectOption(this)">ب) <code>pwd cd</code></button>
    <button onclick="selectOption(this)">ج) <code>ls cd</code></button>
    <button onclick="selectOption(this)">د) <code>cat cd</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: الف</strong><br>دستور <code>type cd</code> به Shell می‌گوید نوع <code>cd</code> را مشخص کند. در Bash معمولاً خروجی <code>cd is a shell builtin</code> است. این نکته برای LPIC-1 مهم است.</div>
</div>

<div class="quiz-card"><p>❓ تست ۵: اگر Prompt به شکل زیر باشد: <code>root@server:~#</code> علامت <code>#</code> معمولاً چه مفهومی دارد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) سیستم در حالت Shutdown است.</button>
    <button onclick="selectOption(this)">ب) کاربر یک کاربر عادی است.</button>
    <button onclick="selectOption(this)">ج) Shell معمولاً با دسترسی root در حال اجراست.</button>
    <button onclick="selectOption(this)">د) Shell از Bash استفاده نمی‌کند.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br>به‌صورت معمول <code>$ → Regular User</code> و <code># → root</code> است. بنابراین <code>root@server:~#</code> معمولاً نشان می‌دهد که Shell با کاربر <code>root</code> اجرا شده است.</div>
</div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>چیزهایی که باید از جلسه ۱ بلد باشی</strong><br>
قبل از رفتن به جلسه بعد، باید بتوانی این‌ها را بدون نگاه کردن توضیح بدهی:
<ul>
<li>Terminal چیست؟</li>
<li>Shell چیست؟</li>
<li>تفاوت Terminal و Shell چیست؟</li>
<li>Command چیست؟</li>
<li>Option و Argument چه هستند؟</li>
<li>Built-in و External Command چه تفاوتی دارند؟</li>
<li><code>type</code> چه کاربردی دارد؟</li>
<li><code>PATH</code> به‌طور کلی چه نقشی دارد؟</li>
<li><code>$</code> و <code>#</code> در Prompt معمولاً چه مفهومی دارند؟</li>
<li>رابطه‌ی <strong>User → Terminal → Shell → Command → Kernel</strong> چیست؟</li>
</ul>
اگر این‌ها را فهمیدی، <strong>جلسه ۱ کامل است</strong>.
