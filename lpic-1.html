"ch1-13": `
<div class="section-header">
    <div class="section-badge">۱</div>
    <div>
        <h1>xargs – تبدیل کنندهٔ خروجی به آرگومان</h1>
        <div class="meta">کار با خط فرمان · بخش ۱۳ از ۱۴</div>
    </div>
</div>

<p>در جلسات قبل با ابزارهایی مثل <code>grep</code>، <code>find</code> و <code>sed</code> آشنا شدیم. حالا می‌خواهیم یکی از ابزارهای بسیار مهم خط فرمان لینوکس را یاد بگیریم:</p>
<div class="code-container"><span class="code-label">ابزار</span><div class="code-block">xargs</div></div>
<p><code>xargs</code> در نگاه اول ساده است، اما یکی از ابزارهایی است که اگر منطق آن را درست متوجه شوید، ترکیب کردن چند دستور لینوکس برای انجام کارهای پیچیده بسیار راحت‌تر می‌شود.</p>
<p>در <strong>LPIC-1</strong> نیز باید بتوانید:</p>
<ul>
    <li>مفهوم <code>xargs</code> را توضیح دهید.</li>
    <li>تفاوت <code>xargs</code> و Pipe را بدانید.</li>
    <li>از <code>-n</code> استفاده کنید.</li>
    <li>از <code>-I</code> برای جایگزینی ورودی استفاده کنید.</li>
    <li>مشکل نام فایل‌های دارای فاصله را تشخیص دهید.</li>
    <li>ترکیب <code>find -print0 | xargs -0</code> را بشناسید.</li>
    <li>گزینه‌های <code>-p</code>، <code>-t</code> و <code>-r</code> را تشخیص دهید.</li>
    <li>خروجی <code>xargs</code> را در ذهن خود به دستور واقعی تبدیل کنید.</li>
</ul>

<h2>بخش اول — <code>xargs</code> چیست؟</h2>

<h3>تعریف ساده</h3>
<p><code>xargs</code> ورودی استاندارد (<code>stdin</code>) را می‌گیرد و آن را به <strong>آرگومان‌های یک دستور</strong> تبدیل می‌کند.</p>
<blockquote><code>xargs</code> خروجی یک دستور را می‌گیرد و آن را به چیزی تبدیل می‌کند که بتوانیم به‌عنوان آرگومان به دستور دیگری بدهیم.</blockquote>
<p>ساختار ذهنی:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">Command 1\n   │\n   │ stdout\n   ▼\n xargs\n   │\n   │ arguments\n   ▼\nCommand 2</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "file1 file2 file3" | xargs rm</div></div>
<p>تقریباً یعنی:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">rm file1 file2 file3</div></div>
<p>پس <code>xargs</code> در اینجا خروجی <code>echo</code> را به آرگومان‌های <code>rm</code> تبدیل کرده است.</p>

<h2>بخش دوم — تفاوت Pipe و <code>xargs</code></h2>
<p>این یکی از مهم‌ترین مفاهیم این جلسه است.</p>

<h3>Pipe چیست؟</h3>
<p>وقتی می‌نویسیم:</p>
<div class="code-container"><span class="code-label">Pipe</span><div class="code-block">command1 | command2</div></div>
<p>خروجی <code>command1</code> به <strong>stdin</strong> دستور دوم فرستاده می‌شود.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "hello world" | wc -w</div></div>
<p><code>wc</code> می‌تواند از <code>stdin</code> بخواند، بنابراین Pipe برای آن مناسب است.</p>

<h3>اما <code>xargs</code> چه می‌کند؟</h3>
<p><code>xargs</code> خروجی را به <strong>آرگومان خط فرمان</strong> تبدیل می‌کند.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "file1 file2" | xargs rm</div></div>
<p>تقریباً تبدیل می‌شود به:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">rm file1 file2</div></div>

<div class="table-wrap">
    <table>
        <thead><tr><th>Pipe</th><th><code>xargs</code></th></tr></thead>
        <tbody>
            <tr><td>خروجی را به <code>stdin</code> می‌دهد</td><td>خروجی را به آرگومان تبدیل می‌کند</td></tr>
            <tr><td>مناسب دستورهایی که از stdin می‌خوانند</td><td>مناسب دستورهایی که آرگومان می‌گیرند</td></tr>
            <tr><td><code>grep</code>، <code>wc</code> و ...</td><td><code>rm</code>، <code>cp</code>، <code>chmod</code> و ...</td></tr>
        </tbody>
    </table>
</div>

<div class="box important"><i class="fas fa-star"></i><div><strong>قانون طلایی</strong><br>
این جمله را برای آزمون به خاطر بسپار:
<div class="code-container"><span class="code-label">قانون</span><div class="code-block no-prompt">Pipe → stdin\nxargs → arguments</div></div>
</div></div>

<h2>بخش سوم — ساختار کلی <code>xargs</code></h2>
<p>ساختار معمول:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block">command1 | xargs [options] command2</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -name "*.log" | xargs wc -l</div></div>
<p>اجزای آن:</p>
<div class="code-container"><span class="code-label">اجزا</span><div class="code-block no-prompt">find\n │\n │ output\n ▼\nxargs\n │\n │ arguments\n ▼\nwc -l</div></div>
<p>اگر <code>find</code> این خروجی را بدهد:</p>
<div class="code-container"><span class="code-label">خروجی find</span><div class="code-block no-prompt">./a.log\n./b.log\n./c.log</div></div>
<p><code>xargs</code> می‌تواند چیزی شبیه این اجرا کند:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">wc -l ./a.log ./b.log ./c.log</div></div>

<h2>بخش چهارم — اگر دستور مشخص نکنیم چه می‌شود؟</h2>
<p>اگر بعد از <code>xargs</code> دستوری مشخص نکنیم، دستور پیش‌فرض <code>echo</code> استفاده می‌شود.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "one two three" | xargs</div></div>
<p>تقریباً نتیجه:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">echo one two three</div></div>
<p>و خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">one two three</div></div>
<p>بنابراین:</p>
<div class="code-container"><span class="code-label">نکته</span><div class="code-block no-prompt">xargs</div></div>
<p>به‌صورت پیش‌فرض با <code>echo</code> کار می‌کند.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی</strong><br>
اگر سؤال گفت: «What is the default command used by xargs?» پاسخ: <code>echo</code></div></div>

<h2>بخش پنجم — اولین مثال‌های عملی</h2>

<h3>مثال ۱</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "one two three" | xargs echo</div></div>
<p>تقریباً:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">echo one two three</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">one two three</div></div>

<h3>مثال ۲ — ساخت چند دایرکتوری</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "dir1 dir2 dir3" | xargs mkdir</div></div>
<p>تقریباً:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">mkdir dir1 dir2 dir3</div></div>
<p>در نتیجه سه دایرکتوری ساخته می‌شود:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">dir1\ndir2\ndir3</div></div>

<h3>مثال ۳ — حذف چند فایل</h3>
<p>فرض کنید فایل‌های زیر وجود دارند:</p>
<div class="code-container"><span class="code-label">فایل‌ها</span><div class="code-block no-prompt">a.txt\nb.txt\nc.txt</div></div>
<p>می‌توانیم بنویسیم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "a.txt b.txt c.txt" | xargs rm</div></div>
<p>که تقریباً معادل است با:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">rm a.txt b.txt c.txt</div></div>

<h2>بخش ششم — <code>xargs</code> چگونه ورودی را تقسیم می‌کند؟</h2>
<p>این قسمت بسیار مهم است.</p>
<p>به‌صورت پیش‌فرض <code>xargs</code> ورودی را بر اساس <strong>whitespace</strong> تقسیم می‌کند.</p>
<p>Whitespace شامل مواردی مانند:</p>
<ul>
    <li>Space</li>
    <li>Tab</li>
    <li>Newline</li>
</ul>
<p>است.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "A B C D" | xargs echo</div></div>
<p>به آرگومان‌های زیر تبدیل می‌شود:</p>
<div class="code-container"><span class="code-label">آرگومان‌ها</span><div class="code-block no-prompt">A\nB\nC\nD</div></div>
<p>و دستور تقریباً می‌شود:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">echo A B C D</div></div>
<p>اما نکته مهم این است که <code>xargs</code> لزوماً برای هر آرگومان یک بار دستور را اجرا نمی‌کند.</p>
<p>در حالت عادی سعی می‌کند چند آرگومان را در یک اجرای دستور قرار دهد.</p>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "A B C D" | xargs echo</div></div>
<p>تقریباً:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">echo A B C D</div></div>
<p>و نه:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">echo A\necho B\necho C\necho D</div></div>
<p>برای کنترل تعداد آرگومان‌ها از <code>-n</code> استفاده می‌کنیم.</p>

<h2>بخش هفتم — گزینه <code>-n</code></h2>
<p>گزینه:</p>
<div class="code-container"><span class="code-label">گزینه</span><div class="code-block">-n number</div></div>
<p>تعداد آرگومان‌هایی را که در <strong>هر بار اجرای دستور</strong> استفاده می‌شوند مشخص می‌کند.</p>

<h3><code>-n 1</code></h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "A B C D" | xargs -n 1 echo</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">A\nB\nC\nD</div></div>
<p>چرا؟ چون در هر اجرای <code>echo</code> فقط یک آرگومان قرار می‌گیرد.</p>
<p>تقریباً:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">echo A\necho B\necho C\necho D</div></div>

<h3><code>-n 2</code></h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "A B C D" | xargs -n 2 echo</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">A B\nC D</div></div>
<p>تقریباً:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">echo A B\necho C D</div></div>

<h3><code>-n 3</code></h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "A B C D E" | xargs -n 3 echo</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">A B C\nD E</div></div>
<p>تقریباً:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">echo A B C\necho D E</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته بسیار مهم</strong><br>
<code>-n</code> به معنی «دستور چند بار اجرا شود» نیست. بلکه «در هر اجرای دستور چند آرگومان قرار بگیرد» است. تعداد اجرا از تعداد کل آرگومان‌ها و مقدار <code>-n</code> به دست می‌آید. مثلاً ۱۰ آرگومان با <code>-n 2</code> یعنی تقریباً ۵ بار اجرا.</div></div>

<h2>بخش هشتم — گزینه <code>-I</code> و Placeholder</h2>
<p>گاهی نمی‌خواهیم ورودی فقط در انتهای دستور قرار بگیرد.</p>
<p>مثلاً می‌خواهیم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">echo "a.txt b.txt" | ...</div></div>
<p>را به شکل زیر استفاده کنیم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">echo "Processing a.txt"\necho "Processing b.txt"</div></div>
<p>اینجاست که <code>-I</code> بسیار مهم می‌شود.</p>
<p>ساختار:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block">xargs -I PLACEHOLDER command PLACEHOLDER</div></div>
<p>رایج‌ترین Placeholder:</p>
<div class="code-container"><span class="code-label">جای‌گذار</span><div class="code-block no-prompt">{}</div></div>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "a.txt b.txt" | xargs -I {} echo "Processing {}"</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Processing a.txt\nProcessing b.txt</div></div>

<h2>بخش نهم — <code>-I</code> چگونه کار می‌کند؟</h2>
<p>در این دستور:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">xargs -I {} echo "File: {}"</div></div>
<p><code>{}</code> یک جای خالی است. هر ورودی جای <code>{}</code> قرار می‌گیرد.</p>
<p>پس:</p>
<div class="code-container"><span class="code-label">ورودی</span><div class="code-block no-prompt">a.txt</div></div>
<p>تبدیل می‌شود به:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">echo "File: a.txt"</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">ورودی</span><div class="code-block no-prompt">b.txt</div></div>
<p>تبدیل می‌شود به:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">echo "File: b.txt"</div></div>

<h2>بخش دهم — تفاوت اصلی <code>-n</code> و <code>-I</code></h2>
<p>این تفاوت را خوب یاد بگیر.</p>

<h3><code>-n</code></h3>
<p>تمرکز روی <strong>تعداد آرگومان‌ها در هر اجرا</strong> است.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "A B C D" | xargs -n 2 echo</div></div>
<p>تقریباً:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">echo A B\necho C D</div></div>

<h3><code>-I</code></h3>
<p>تمرکز روی <strong>محل قرار گرفتن ورودی</strong> است.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "A B C" | xargs -I {} echo "Value={}"</div></div>
<p>تقریباً:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">echo "Value=A"\necho "Value=B"\necho "Value=C"</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته مهم LPIC-1</strong><br>
برای سؤال‌های آزمون:
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">-n → number of arguments\n-I → replace input at a specific location</div></div>
</div></div>

<h2>بخش یازدهم — مثال بسیار مهم با <code>cp</code></h2>
<p>فرض کنید:</p>
<div class="code-container"><span class="code-label">فایل‌ها</span><div class="code-block no-prompt">file1.txt\nfile2.txt\nfile3.txt</div></div>
<p>داریم.</p>
<p>اگر بنویسیم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "file1.txt file2.txt file3.txt" | xargs cp -t /backup/</div></div>
<p>تقریباً:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">cp -t /backup/ file1.txt file2.txt file3.txt</div></div>
<p>یعنی همه فایل‌ها در یک اجرای <code>cp</code> کپی می‌شوند.</p>
<p>اما با <code>-I</code>:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "file1.txt file2.txt file3.txt" |\nxargs -I {} cp {} /backup/</div></div>
<p>تقریباً:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">cp file1.txt /backup/\ncp file2.txt /backup/\ncp file3.txt /backup/</div></div>
<p>یعنی دستور برای هر ورودی جداگانه اجرا می‌شود.</p>

<h2>بخش دوازدهم — ترکیب <code>find</code> و <code>xargs</code></h2>
<p>یکی از مهم‌ترین کاربردهای <code>xargs</code>:</p>
<div class="code-container"><span class="code-label">ترکیب</span><div class="code-block no-prompt">find + xargs</div></div>
<p>است.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -name "*.log" | xargs wc -l</div></div>
<p>اگر <code>find</code> این موارد را پیدا کند:</p>
<div class="code-container"><span class="code-label">خروجی find</span><div class="code-block no-prompt">./app.log\n./error.log\n./system.log</div></div>
<p><code>xargs</code> آن‌ها را به آرگومان‌های <code>wc</code> تبدیل می‌کند:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">wc -l ./app.log ./error.log ./system.log</div></div>

<h2>بخش سیزدهم — چرا <code>find -exec</code> را هم باید بشناسیم؟</h2>
<p>یک نکته مهم: <code>xargs</code> تنها راه اجرای یک دستور روی خروجی <code>find</code> نیست.</p>
<p><code>find</code> خودش گزینه‌ای به نام:</p>
<div class="code-container"><span class="code-label">گزینه</span><div class="code-block">-exec</div></div>
<p>دارد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -name "*.log" -exec wc -l {} \\;</div></div>
<p>این دستور نیز روی فایل‌های پیدا شده <code>wc -l</code> را اجرا می‌کند.</p>
<p>بنابراین:</p>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">find ... | xargs ...\n\nfind ... -exec ...</div></div>
<p>دو روش متفاوت برای انجام کار روی خروجی <code>find</code> هستند. برای LPIC-1 باید مفهوم هر دو را بدانید.</p>

<h2>بخش چهاردهم — مشکل بزرگ: نام فایل‌های دارای فاصله</h2>
<p>اینجا یکی از مهم‌ترین دام‌های <code>xargs</code> قرار دارد.</p>
<p>فرض کنید فایلی داریم:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block no-prompt">my file.txt</div></div>
<p>دستور زیر را اجرا می‌کنیم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">find . -name "*.txt" | xargs rm</div></div>
<p><code>find</code> ممکن است خروجی بدهد:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">./my file.txt</div></div>
<p>اما <code>xargs</code> به‌صورت پیش‌فرض whitespace را جداکننده می‌داند. در نتیجه ممکن است آن را به شکل زیر تفسیر کند:</p>
<div class="code-container"><span class="code-label">تفسیر</span><div class="code-block no-prompt">./my\nfile.txt</div></div>
<p>در نتیجه:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">rm ./my file.txt</div></div>
<p>عملاً به معنای دو آرگومان است:</p>
<div class="code-container"><span class="code-label">آرگومان‌ها</span><div class="code-block no-prompt">./my\nfile.txt</div></div>
<p>نه یک فایل به نام:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block no-prompt">my file.txt</div></div>
<p>این می‌تواند باعث خطا یا حتی حذف اشتباه فایل‌ها شود.</p>

<h2>بخش پانزدهم — راه‌حل امن: <code>-print0</code> و <code>-0</code></h2>
<p>راه‌حل استاندارد:</p>
<div class="code-container"><span class="code-label">راه‌حل</span><div class="code-block">find . -name "*.txt" -print0 | xargs -0 rm</div></div>
<p>این دو گزینه باید با هم یاد گرفته شوند.</p>

<h3><code>find -print0</code></h3>
<p>به‌جای جدا کردن فایل‌ها با newline، آن‌ها را با کاراکتر NULL جدا می‌کند.</p>
<div class="code-container"><span class="code-label">گزینه</span><div class="code-block">-print0</div></div>
<p>یعنی:</p>
<blockquote>Print each result followed by a null character.</blockquote>

<h3><code>xargs -0</code></h3>
<p>به <code>xargs</code> می‌گوید: ورودی را با NULL جدا کن، نه whitespace.</p>
<p>بنابراین:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -name "*.txt" -print0 | xargs -0 rm</div></div>
<p>نام:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block no-prompt">my file.txt</div></div>
<p>را به‌عنوان <strong>یک آرگومان کامل</strong> حفظ می‌کند.</p>

<h2>بخش شانزدهم — چرا NULL مهم است؟</h2>
<p>فرض کنید این فایل‌ها را داریم:</p>
<div class="code-container"><span class="code-label">فایل‌ها</span><div class="code-block no-prompt">file1.txt\nmy file.txt\nbackup file.txt</div></div>
<p>با روش عادی:</p>
<div class="code-container"><span class="code-label">روش عادی</span><div class="code-block">find . -name "*.txt" | xargs ...</div></div>
<p>ممکن است فاصله باعث شکسته شدن نام‌ها شود.</p>
<p>اما:</p>
<div class="code-container"><span class="code-label">روش امن</span><div class="code-block">find . -name "*.txt" -print0 | xargs -0 ...</div></div>
<p>داده‌ها به شکل منطقی زیر جدا می‌شوند:</p>
<div class="code-container"><span class="code-label">داده</span><div class="code-block no-prompt">file1.txt\\0\nmy file.txt\\0\nbackup file.txt\\0</div></div>
<p>در نتیجه:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">file1.txt\nmy file.txt\nbackup file.txt</div></div>
<p>هر کدام یک آرگومان مستقل هستند.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>قانون طلایی</strong><br>
این دو را همیشه کنار هم به خاطر بسپار:
<div class="code-container"><span class="code-label">قانون</span><div class="code-block no-prompt">-print0  ↔  -0</div></div>
</div></div>

<h2>بخش هفدهم — گزینه <code>-p</code></h2>
<p>گزینه:</p>
<div class="code-container"><span class="code-label">گزینه</span><div class="code-block">-p</div></div>
<p>مخفف Prompt است. قبل از اجرای دستور، از کاربر تأیید می‌گیرد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "file1.txt file2.txt" | xargs -p rm</div></div>
<p><code>xargs</code> دستور پیشنهادی را نمایش می‌دهد و از شما تأیید می‌خواهد.</p>
<p>این گزینه مخصوصاً برای دستورات خطرناک مثل <code>rm</code> می‌تواند مفید باشد.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی</strong><br>
<div class="code-container"><span class="code-label">یادآوری</span><div class="code-block no-prompt">-p → Prompt</div></div>
یعنی: قبل از اجرای هر دستور از کاربر تأیید بگیر.</div></div>

<h2>بخش هجدهم — گزینه <code>-t</code></h2>
<p>گزینه:</p>
<div class="code-container"><span class="code-label">گزینه</span><div class="code-block">-t</div></div>
<p>دستور ساخته‌شده را قبل از اجرای آن نمایش می‌دهد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "a.txt b.txt" | xargs -t rm</div></div>
<p>ممکن است چیزی شبیه این نمایش دهد:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">rm a.txt b.txt</div></div>
<p>سپس دستور اجرا می‌شود.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>به خاطر سپاری</strong><br>
<div class="code-container"><span class="code-label">یادآوری</span><div class="code-block no-prompt">-t → trace</div></div>
یعنی: دستور را قبل از اجرا ببین.</div></div>

<h2>بخش نوزدهم — گزینه <code>-r</code></h2>
<p>یکی از رفتارهای مهم <code>xargs</code> این است که اگر ورودی وجود نداشته باشد، در بعضی پیاده‌سازی‌ها ممکن است دستور را بدون آرگومان اجرا کند.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -name "*.xyz" | xargs rm</div></div>
<p>اگر هیچ فایل <code>.xyz</code> پیدا نشود، ممکن است <code>rm</code> بدون آرگومان اجرا شود.</p>
<p>برای جلوگیری از این رفتار:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -name "*.xyz" | xargs -r rm</div></div>
<p><code>-r</code> یعنی: اگر ورودی خالی بود، دستور را اجرا نکن.</p>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته مهم</strong><br>
رفتار <code>-r</code> در نسخه‌های مختلف <code>xargs</code> ممکن است متفاوت باشد؛ در GNU <code>xargs</code> این گزینه رایج است. برای LPIC-1 معمولاً دانستن مفهوم آن کافی است:
<div class="code-container"><span class="code-label">یادآوری</span><div class="code-block no-prompt">-r → no-run-if-empty</div></div>
</div></div>

<h2>بخش بیستم — گزینه <code>-0</code></h2>
<p>گزینه:</p>
<div class="code-container"><span class="code-label">گزینه</span><div class="code-block">-0</div></div>
<p>برای کار با ورودی‌هایی است که با NULL جدا شده‌اند.</p>
<p>معمولاً همراه:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find ... -print0</div></div>
<p>استفاده می‌شود.</p>
<p>الگوی بسیار مهم:</p>
<div class="code-container"><span class="code-label">الگو</span><div class="code-block">find ... -print0 | xargs -0 command</div></div>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find /tmp -name "*.tmp" -print0 | xargs -0 rm</div></div>

<h2>بخش بیست‌ویکم — <code>xargs</code> و تعداد اجرای دستور</h2>
<p>یکی از نکات مهم این است که <code>xargs</code> لزوماً برای هر ورودی یک بار دستور را اجرا نمی‌کند.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "A B C D" | xargs echo</div></div>
<p>یک اجرای تقریبی:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">echo A B C D</div></div>
<p>اما:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "A B C D" | xargs -n 2 echo</div></div>
<p>تقریباً:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">echo A B\necho C D</div></div>
<p>بنابراین <code>xargs</code> می‌تواند چندین ورودی را در یک اجرای دستور جمع کند. این کار از نظر کارایی مهم است.</p>

<h2>بخش بیست‌ودوم — چرا <code>xargs</code> می‌تواند مفید باشد؟</h2>
<p>فرض کنید ۱۰۰۰ فایل داریم. به‌جای اینکه الزاماً ۱۰۰۰ بار یک دستور اجرا شود، <code>xargs</code> می‌تواند چند فایل را در یک اجرای دستور قرار دهد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -name "*.log" -print0 | xargs -0 -n 20 wc -l</div></div>
<p>یعنی: در هر اجرای <code>wc</code> حداکثر ۲۰ فایل قرار بده. این می‌تواند تعداد اجرای processها را کاهش دهد.</p>

<h2>بخش بیست‌وسوم — مثال‌های کاربردی مهم</h2>

<h3>مثال ۱ — حذف فایل‌های <code>.tmp</code></h3>
<p>روش امن:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -name "*.tmp" -print0 | xargs -0 rm</div></div>

<h3>مثال ۲ — شمارش خطوط فایل‌ها</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -name "*.c" -print0 | xargs -0 wc -l</div></div>

<h3>مثال ۳ — فشرده‌سازی</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -name "*.log" -print0 | xargs -0 gzip</div></div>

<h3>مثال ۴ — تغییر permission</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -name "*.sh" -print0 | xargs -0 chmod +x</div></div>
<p>تقریباً:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">chmod +x file1.sh file2.sh file3.sh</div></div>

<h3>مثال ۵ — تغییر مالکیت</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -user olduser -print0 | xargs -0 chown newuser</div></div>

<h2>بخش بیست‌وچهارم — یک الگوی بسیار مهم برای LPIC</h2>
<p>اگر سؤال چیزی شبیه این گفت: «تمام فایل‌های پیدا شده توسط <code>find</code> را به یک دستور دیگر بده، در حالی که نام فایل‌ها ممکن است شامل فاصله باشد.»</p>
<p>الگوی ذهنی:</p>
<div class="code-container"><span class="code-label">الگو</span><div class="code-block">find ... -print0 | xargs -0 ...</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find /home -name "*.log" -print0 | xargs -0 wc -l</div></div>

<h2>بخش بیست‌وپنجم — <code>xargs -I</code> در یک سناریوی واقعی</h2>
<p>فرض کنید فایل <code>users.txt</code> شامل:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block no-prompt">ali\nreza\nsara</div></div>
<p>است. می‌خواهیم برای هر کاربر پیام چاپ کنیم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat users.txt | xargs -I {} echo "User: {}"</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">User: ali\nUser: reza\nUser: sara</div></div>
<p>تقریباً:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">echo "User: ali"\necho "User: reza"\necho "User: sara"</div></div>

<h2>بخش بیست‌وششم — استفاده از Placeholder در وسط دستور</h2>
<p>مزیت مهم <code>-I</code> این است که ورودی می‌تواند در هر جای دستور قرار بگیرد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "ali reza sara" | xargs -I {} echo "Hello {}"</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "a.txt b.txt" | xargs -I {} mv {} {}.bak</div></div>
<p>در مثال دوم، برای هر فایل:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">mv a.txt a.txt.bak\nmv b.txt b.txt.bak</div></div>
<p>اجرا می‌شود.</p>

<h2>بخش بیست‌وهفتم — دام مهم <code>xargs -I</code></h2>
<p>وقتی از <code>-I {}</code> استفاده می‌کنیم، <code>xargs</code> معمولاً ورودی را به‌صورت یک logical line در نظر می‌گیرد و برای هر مورد جایگزینی انجام می‌دهد. بنابراین رفتار <code>-I</code> را با رفتار عادی <code>xargs</code> یکی ندانید.</p>
<p>برای آزمون، این تفاوت مهم است:</p>
<div class="code-container"><span class="code-label">تفاوت</span><div class="code-block no-prompt">xargs\n    → جمع کردن آرگومان‌ها و اجرای دستور\n\nxargs -n\n    → کنترل تعداد آرگومان در هر اجرا\n\nxargs -I\n    → جایگزینی ورودی در محل مشخص</div></div>

<h2>بخش بیست‌وهشتم — گزینه‌های مهم <code>xargs</code></h2>
<div class="table-wrap">
    <table>
        <thead><tr><th>گزینه</th><th>معنی</th><th>کاربرد</th></tr></thead>
        <tbody>
            <tr><td><code>-n N</code></td><td>حداکثر N آرگومان در هر اجرا</td><td>کنترل تعداد آرگومان</td></tr>
            <tr><td><code>-I {}</code></td><td>جایگزینی ورودی</td><td>قرار دادن ورودی در محل مشخص</td></tr>
            <tr><td><code>-0</code></td><td>NULL-delimited input</td><td>ورودی امن از <code>find -print0</code></td></tr>
            <tr><td><code>-p</code></td><td>Prompt</td><td>تأیید قبل از اجرا</td></tr>
            <tr><td><code>-t</code></td><td>Trace</td><td>نمایش دستور قبل از اجرا</td></tr>
            <tr><td><code>-r</code></td><td>No-run-if-empty</td><td>در صورت ورودی خالی اجرا نکن</td></tr>
        </tbody>
    </table>
</div>

<div class="box important"><i class="fas fa-star"></i><div><strong>مهم‌ترین‌ها برای LPIC-1</strong><br>
اگر بخواهیم اولویت‌بندی کنیم:
<div class="code-container"><span class="code-label">اولویت</span><div class="code-block no-prompt">★★★★★  -n\n★★★★★  -I\n★★★★★  -0\n★★★★★  -print0 در find\n★★★★☆  -p\n★★★★☆  -t\n★★★☆☆  -r</div></div>
</div></div>

<h2>بخش بیست‌ونهم — الگوهای مهم برای حفظ کردن</h2>

<h3>الگو ۱</h3>
<div class="code-container"><span class="code-label">الگو ۱</span><div class="code-block">command1 | xargs command2</div></div>
<p>یعنی: خروجی command1 → آرگومان command2</p>

<h3>الگو ۲</h3>
<div class="code-container"><span class="code-label">الگو ۲</span><div class="code-block">... | xargs -n 1 command</div></div>
<p>یعنی: هر بار یک آرگومان.</p>

<h3>الگو ۳</h3>
<div class="code-container"><span class="code-label">الگو ۳</span><div class="code-block">... | xargs -I {} command {}</div></div>
<p>یعنی: ورودی را در محل <code>{}</code> قرار بده.</p>

<h3>الگو ۴</h3>
<div class="code-container"><span class="code-label">الگو ۴</span><div class="code-block">find ... -print0 | xargs -0 command</div></div>
<p>یعنی: نام فایل‌ها را به‌صورت امن، حتی با فاصله، منتقل کن.</p>

<h3>الگو ۵</h3>
<div class="code-container"><span class="code-label">الگو ۵</span><div class="code-block">... | xargs -p command</div></div>
<p>یعنی: قبل از اجرا تأیید بگیر.</p>

<h3>الگو ۶</h3>
<div class="code-container"><span class="code-label">الگو ۶</span><div class="code-block">... | xargs -t command</div></div>
<p>یعنی: دستور در حال اجرا را نمایش بده.</p>

<h2>بخش سی‌ام — دام‌های آزمون LPIC-1</h2>

<h3>دام ۱</h3>
<p><code>xargs</code> خروجی را به <code>stdin</code> نمی‌دهد. بلکه آن را به <code>arguments</code> تبدیل می‌کند.</p>

<h3>دام ۲</h3>
<p><code>-n 1</code> به معنی «فقط یک بار اجرا کن» نیست. بلکه: در هر اجرا یک آرگومان قرار بده.</p>

<h3>دام ۳</h3>
<p><code>-I</code> برای تعداد آرگومان نیست. برای <code>replacement</code> است.</p>

<h3>دام ۴</h3>
<p><code>-print0</code> مربوط به <code>find</code> است: <code>find ... -print0</code> اما <code>-0</code> مربوط به <code>xargs</code> است: <code>xargs -0</code></p>

<h3>دام ۵</h3>
<p>این دو را با هم اشتباه نکن: <code>-p → prompt</code> و <code>-t → trace</code></p>

<h2>بخش سی‌ویکم — جمع‌بندی جلسه</h2>
<p><code>xargs</code> پلی بین <strong>stdin</strong> و <strong>command-line arguments</strong> ایجاد می‌کند.</p>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">stdin\n  ↓\nxargs\n  ↓\narguments\n  ↓\ncommand</div></div>
<p>مهم‌ترین گزینه‌ها:</p>
<div class="code-container"><span class="code-label">گزینه‌ها</span><div class="code-block no-prompt">-n   → تعداد آرگومان در هر اجرا\n-I   → جایگزینی ورودی\n-0   → ورودی NULL-delimited\n-p   → تأیید قبل از اجرا\n-t   → نمایش دستور قبل از اجرا\n-r   → اجرا نکردن در صورت ورودی خالی</div></div>
<p>و مهم‌ترین ترکیب جلسه:</p>
<div class="code-container"><span class="code-label">ترکیب</span><div class="code-block">find ... -print0 | xargs -0 ...</div></div>
<p>این ترکیب برای جلوگیری از مشکل نام فایل‌های دارای فاصله و کاراکترهای خاص بسیار مهم است.</p>

<div class="summary-box">
    <h3>🧠 خلاصه فوق‌سریع برای شب امتحان</h3>
    <div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Pipe:\noutput → stdin\n\nxargs:\nstdin → arguments\n\n-n:\nnumber of arguments\n\n-I:\ninput replacement\n\n-0:\nNULL-separated input\n\n-print0:\nNULL-separated output from find\n\n-p:\nprompt\n\n-t:\ntrace\n\n-r:\nno run if empty\n\nDefault command:\necho</div></div>
    <p>و مهم‌ترین الگوی جلسه:</p>
    <div class="code-container"><span class="code-label">الگوی نهایی</span><div class="code-block">find . -name "*.log" -print0 | xargs -0 wc -l</div></div>
</div>

<h2>🧪 تمرین‌های کاربردی</h2>

<h3>تمرین ۱ — شروع ساده</h3>
<p>دستور زیر را اجرا کنید:</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">echo "one two three four" | xargs -n 1 echo</div></div>
<p><strong>سؤال:</strong> چرا چهار خط خروجی تولید می‌شود؟</p>
<p><strong>پاسخ:</strong> چون <code>-n 1</code> باعث می‌شود در هر اجرای <code>echo</code> فقط یک آرگومان قرار بگیرد.</p>

<h3>تمرین ۲ — گروه‌بندی</h3>
<p>دستور زیر را اجرا کنید:</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">echo "1 2 3 4 5 6" | xargs -n 2 echo</div></div>
<p><strong>انتظار:</strong></p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">1 2\n3 4\n5 6</div></div>
<p><strong>سؤال:</strong> تقریباً چه دستورهایی اجرا شده‌اند؟</p>
<p><strong>پاسخ:</strong></p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">echo 1 2\necho 3 4\necho 5 6</div></div>

<h3>تمرین ۳ — Placeholder</h3>
<p>دستور زیر را اجرا کنید:</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">echo "Ali Reza Sara" | xargs -I {} echo "User: {}"</div></div>
<p><strong>سؤال:</strong> چرا هر نام در یک خط جداگانه نمایش داده می‌شود؟</p>
<p><strong>پاسخ:</strong> چون <code>-I {}</code> باعث می‌شود ورودی در محل <code>{}</code> جایگزین شود و برای هر ورودی دستور اجرا شود.</p>

<h3>تمرین ۴ — کار با <code>find</code></h3>
<p>دستور زیر را تحلیل کنید:</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">find . -name "*.log" -print0 | xargs -0 wc -l</div></div>
<p><strong>سؤال:</strong> نقش هر بخش چیست؟</p>
<p><strong>پاسخ:</strong></p>
<div class="code-container"><span class="code-label">تحلیل</span><div class="code-block no-prompt">find\n    → فایل‌ها را پیدا می‌کند.\n\n-name "*.log"\n    → فقط فایل‌های log\n\n-print0\n    → خروجی را با NULL جدا می‌کند.\n\nxargs -0\n    → ورودی NULL-separated را دریافت می‌کند.\n\nwc -l\n    → تعداد خطوط را محاسبه می‌کند.</div></div>

<h3>تمرین ۵ — تشخیص مشکل</h3>
<p>دستور زیر را ببینید:</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">find . -name "*.txt" | xargs rm</div></div>
<p>فرض کنید یکی از فایل‌ها نام زیر را دارد:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block no-prompt">my notes.txt</div></div>
<p><strong>سؤال:</strong> چه مشکلی ممکن است رخ دهد؟</p>
<p><strong>پاسخ:</strong> <code>xargs</code> به‌صورت پیش‌فرض whitespace را جداکننده در نظر می‌گیرد. در نتیجه <code>my notes.txt</code> ممکن است به دو آرگومان <code>my</code> و <code>notes.txt</code> تبدیل شود. روش امن:</p>
<div class="code-container"><span class="code-label">راه‌حل</span><div class="code-block">find . -name "*.txt" -print0 | xargs -0 rm</div></div>

<h3>تمرین ۶ — <code>-p</code></h3>
<p>دستور زیر را اجرا کنید:</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">echo "a.txt b.txt" | xargs -p rm</div></div>
<p><strong>سؤال:</strong> وظیفه <code>-p</code> چیست؟</p>
<p><strong>پاسخ:</strong> قبل از اجرای دستور از کاربر تأیید می‌گیرد.</p>

<h3>تمرین ۷ — <code>-t</code></h3>
<p>دستور:</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">echo "a.txt b.txt" | xargs -t rm</div></div>
<p><strong>سؤال:</strong> <code>-t</code> چه چیزی را تغییر می‌دهد؟</p>
<p><strong>پاسخ:</strong> دستور ساخته‌شده را قبل از اجرای آن نمایش می‌دهد.</p>

<h3>تمرین ۸ — سؤال ترکیبی</h3>
<p>دستور زیر را تحلیل کنید:</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">find /var/log -name "*.log" -print0 | xargs -0 -n 5 wc -l</div></div>
<p><strong>پاسخ:</strong> این دستور:</p>
<ol>
    <li>فایل‌های <code>.log</code> را پیدا می‌کند.</li>
    <li>نتایج را با NULL جدا می‌کند.</li>
    <li><code>xargs -0</code> آن‌ها را به‌صورت امن دریافت می‌کند.</li>
    <li>در هر اجرای <code>wc</code> حداکثر ۵ فایل قرار می‌دهد.</li>
    <li>تعداد خطوط فایل‌ها را محاسبه می‌کند.</li>
</ol>

<h2>📝 تست‌های LPIC-1 — جلسه ۱۳</h2>

<div class="quiz-card"><p>❓ تست ۱: وظیفه اصلی <code>xargs</code> چیست؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) تبدیل stdout به stdin</button>
    <button onclick="selectOption(this)">ب) تبدیل stdin به آرگومان‌های خط فرمان</button>
    <button onclick="selectOption(this)">ج) حذف فایل‌های موقت</button>
    <button onclick="selectOption(this)">د) ویرایش فایل‌های متنی</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>xargs</code> ورودی استاندارد را گرفته و آن را به آرگومان‌های یک دستور تبدیل می‌کند.</div>
</div>

<div class="quiz-card"><p>❓ تست ۲: کدام گزینه تفاوت اصلی Pipe و <code>xargs</code> را درست بیان می‌کند؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) Pipe آرگومان می‌سازد و <code>xargs</code> stdin می‌سازد.</button>
    <button onclick="selectOption(this)">ب) هر دو دقیقاً یک کار انجام می‌دهند.</button>
    <button onclick="selectOption(this)">ج) Pipe خروجی را به stdin می‌دهد، در حالی که <code>xargs</code> آن را به آرگومان تبدیل می‌کند.</button>
    <button onclick="selectOption(this)">د) <code>xargs</code> فقط برای <code>find</code> است.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br>این یکی از مهم‌ترین نکات این جلسه است: <code>Pipe → stdin</code> و <code>xargs → arguments</code>.</div>
</div>

<div class="quiz-card"><p>❓ تست ۳: خروجی دستور زیر چیست؟</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">echo "A B C D" | xargs -n 2 echo</div></div>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) A B C D</button>
    <button onclick="selectOption(this)">ب) A B\nC D</button>
    <button onclick="selectOption(this)">ج) A\nB\nC\nD</button>
    <button onclick="selectOption(this)">د) هیچ خروجی‌ای ندارد.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>-n 2</code> یعنی در هر اجرای <code>echo</code> حداکثر دو آرگومان قرار بگیرد.</div>
</div>

<div class="quiz-card"><p>❓ تست ۴: کدام گزینه برای قرار دادن ورودی در محل مشخصی از دستور استفاده می‌شود؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>-n</code></button>
    <button onclick="selectOption(this)">ب) <code>-p</code></button>
    <button onclick="selectOption(this)">ج) <code>-I</code></button>
    <button onclick="selectOption(this)">د) <code>-t</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br><code>-I</code> یک replacement string تعریف می‌کند: <code>xargs -I {} command {}</code></div>
</div>

<div class="quiz-card"><p>❓ تست ۵: در دستور زیر <code>{}</code> چه نقشی دارد؟</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">echo "a.txt b.txt" | xargs -I {} echo "File: {}"</div></div>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) تعداد آرگومان‌ها را تعیین می‌کند.</button>
    <button onclick="selectOption(this)">ب) یک Placeholder است.</button>
    <button onclick="selectOption(this)">ج) دستور <code>echo</code> را فعال می‌کند.</button>
    <button onclick="selectOption(this)">د) ورودی را NULL-separated می‌کند.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>{}</code> محل قرارگیری ورودی است.</div>
</div>

<div class="quiz-card"><p>❓ تست ۶: برای کار با فایل‌هایی که نامشان شامل فاصله است، کدام روش مناسب‌تر است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>find . -name "*.txt" | xargs rm</code></button>
    <button onclick="selectOption(this)">ب) <code>find . -name "*.txt" -print0 | xargs -0 rm</code></button>
    <button onclick="selectOption(this)">ج) <code>find . -name "*.txt" -print0 | xargs rm</code></button>
    <button onclick="selectOption(this)">د) <code>find . -name "*.txt" | xargs -0 rm</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br>هر دو طرف باید از یک روش جداسازی استفاده کنند: <code>find -print0</code> و <code>xargs -0</code>.</div>
</div>

<div class="quiz-card"><p>❓ تست ۷: گزینه <code>-p</code> چه کاری انجام می‌دهد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) دستور را چاپ می‌کند ولی اجرا نمی‌کند.</button>
    <button onclick="selectOption(this)">ب) قبل از اجرای دستور از کاربر تأیید می‌گیرد.</button>
    <button onclick="selectOption(this)">ج) ورودی را به NULL تبدیل می‌کند.</button>
    <button onclick="selectOption(this)">د) تعداد آرگومان‌ها را محدود می‌کند.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>p</code> را به خاطر Prompt به یاد بسپار.</div>
</div>

<div class="quiz-card"><p>❓ تست ۸: گزینه <code>-t</code> چه کاری انجام می‌دهد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) دستور ساخته‌شده را قبل از اجرا نمایش می‌دهد.</button>
    <button onclick="selectOption(this)">ب) اجرای دستور را متوقف می‌کند.</button>
    <button onclick="selectOption(this)">ج) ورودی را یک آرگومان در نظر می‌گیرد.</button>
    <button onclick="selectOption(this)">د) ورودی خالی را حذف می‌کند.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: الف</strong><br><code>-t</code> از Trace می‌آید و برای مشاهده دستور اجراشده مفید است.</div>
</div>

<div class="quiz-card"><p>❓ تست ۹: کدام گزینه به <code>xargs</code> می‌گوید در صورت خالی بودن ورودی دستور را اجرا نکند؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>-n</code></button>
    <button onclick="selectOption(this)">ب) <code>-I</code></button>
    <button onclick="selectOption(this)">ج) <code>-r</code></button>
    <button onclick="selectOption(this)">د) <code>-p</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br><code>-r</code> در GNU <code>xargs</code> به معنی <code>no-run-if-empty</code> است.</div>
</div>

<div class="quiz-card"><p>❓ تست ۱۰ — تست مفهومی سخت: دستور زیر را در نظر بگیرید:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">echo "A B C D E" | xargs -n 2 echo</div></div>
<p>تقریباً چند بار <code>echo</code> اجرا می‌شود؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) ۱</button>
    <button onclick="selectOption(this)">ب) ۲</button>
    <button onclick="selectOption(this)">ج) ۳</button>
    <button onclick="selectOption(this)">د) ۵</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br>پنج آرگومان داریم و در هر اجرا دو آرگومان قرار می‌گیرد: <code>A B</code>، <code>C D</code>، <code>E</code> → بنابراین ۳ بار اجرا.</div>
</div>

<div class="summary-box">
    <h3>🎯 نکات طلایی جلسه ۱۳</h3>
    <ol>
        <li><strong>مهم‌ترین مفهوم:</strong> <code>xargs = stdin → arguments</code></li>
        <li><strong>Pipe را اشتباه نکن:</strong> <code>| → stdin</code> و <code>xargs → arguments</code></li>
        <li><strong><code>-n</code>:</strong> <code>-n N</code> یعنی در هر اجرای دستور، حداکثر N آرگومان.</li>
        <li><strong><code>-I</code>:</strong> <code>-I {}</code> یعنی <code>{}</code> را با ورودی جایگزین کن.</li>
        <li><strong>فایل‌های دارای فاصله:</strong> همیشه الگوی <code>find ... -print0 | xargs -0 ...</code> را به خاطر بسپار.</li>
        <li><strong>گزینه‌های کوچک ولی مهم:</strong> <code>-p → Prompt</code>، <code>-t → Trace</code>، <code>-r → no run if empty</code></li>
        <li><strong>دستور پیش‌فرض:</strong> اگر command مشخص نشود: <code>echo</code></li>
        <li><strong>نکته بسیار مهم:</strong> <code>xargs</code> لزوماً برای هر ورودی یک process جداگانه ایجاد نمی‌کند؛ می‌تواند چندین آرگومان را در یک اجرای دستور قرار دهد. با <code>-n</code> می‌توانیم این تعداد را کنترل کنیم.</li>
    </ol>
</div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>🧠 نقشه ذهنی نهایی</strong><br>
<div class="code-container"><span class="code-label">نقشه</span><div class="code-block no-prompt">                    xargs\n                      │\n          ┌───────────┴───────────┐\n          │                       │\n       ورودی                    خروجی\n        stdin                 arguments\n          │                       │\n          └───────────┬───────────┘\n                      ▼\n                   command\n                      │\n          ┌───────────┼───────────┐\n          │           │           │\n         -n          -I          -0\n     تعداد args    جایگزینی    NULL input\n                      │\n          ┌───────────┴───────────┐\n          │                       │\n         -p                      -t\n       Prompt                   Trace\n\n             find + xargs\n                  │\n                  ▼\n       -print0 | xargs -0\n                  │\n                  ▼\n          Safe filenames</div></div>
<p>اگر فقط <strong>۵ چیز</strong> از این جلسه یادت بماند، این‌ها باشند:</p>
<div class="code-container"><span class="code-label">۵ نکته</span><div class="code-block no-prompt">1. command | xargs command\n2. xargs → arguments\n3. xargs -n 2\n4. xargs -I {}\n5. find ... -print0 | xargs -0 ...</div></div>
<p>این پنج مورد هسته اصلی <code>xargs</code> برای LPIC-1 هستند.</p>
</div></div>

<div class="section-header">
    <div class="section-badge">۱</div>
    <div>
        <h1>مرور و جمع‌بندی فصل اول</h1>
        <div class="meta">کار با خط فرمان · بخش ۱۴ از ۱۴</div>
    </div>
</div>

<p>در این جلسه، <strong>کل فصل اول</strong> را مرور می‌کنیم و یک نمای کلی از همه مباحثی که تا اینجا یاد گرفته‌اید به دست می‌آوریم. هدف این است که:</p>
<ul>
    <li>یک <strong>نقشه ذهنی</strong> از تمام مفاهیم داشته باشید.</li>
    <li>ارتباط بین مباحث را درک کنید.</li>
    <li>نقاط قوت و ضعف خود را شناسایی کنید.</li>
    <li>برای آزمون LPIC-1 آماده‌تر شوید.</li>
</ul>

<h2>فهرست کامل مباحث جلسات ۱ تا ۱۳</h2>

<table>
<thead><tr><th>جلسه</th><th>موضوع اصلی</th><th>مفاهیم کلیدی</th></tr></thead>
<tbody>
<tr><td><strong>۱</strong></td><td>Terminal, Shell, Command</td><td>تفاوت ترمینال و شل، انواع شل (bash، sh، zsh)، ساختار دستورات (command -options arguments)</td></tr>
<tr><td><strong>۲</strong></td><td>Addressing + <code>cd</code> + <code>ls</code></td><td>مسیرهای مطلق و نسبی، <code>.</code> و <code>..</code>، <code>~</code>، دستورات <code>pwd</code>، <code>cd</code>، <code>ls -la</code></td></tr>
<tr><td><strong>۳</strong></td><td>Show File + Make File</td><td><code>cat</code>، <code>less</code>، <code>more</code>، <code>head</code>، <code>tail</code>، <code>touch</code>، <code>mkdir</code>، <code>rmdir</code></td></tr>
<tr><td><strong>۴</strong></td><td>Variable + History</td><td>متغیرهای محیطی (<code>PATH</code>، <code>HOME</code>)، متغیرهای محلی، <code>export</code>، تاریخچه دستورات (<code>history</code>، <code>!</code>)</td></tr>
<tr><td><strong>۵</strong></td><td><code>man</code> + ویرایش فایل</td><td>صفحات راهنما (<code>man</code>، <code>--help</code>، <code>info</code>)، آشنایی با ویرایشگرهای متنی</td></tr>
<tr><td><strong>۶</strong></td><td><code>vi</code></td><td>حالت‌های <code>vi</code> (Normal، Insert، Visual)، حرکت با <code>h</code> <code>j</code> <code>k</code> <code>l</code>، ذخیره و خروج (<code>:wq</code>، <code>:q!</code>)</td></tr>
<tr><td><strong>۷</strong></td><td><code>nano</code> + مقایسه با <code>vi</code></td><td>کار با <code>nano</code>، مزایا و معایب هر ویرایشگر، انتخاب ویرایشگر مناسب</td></tr>
<tr><td><strong>۸</strong></td><td>File Process + File Sum</td><td>پردازش فایل‌ها: <code>wc</code>، <code>sort</code>، <code>uniq</code>، <code>cut</code>، بررسی جمع‌های هش (<code>md5sum</code>، <code>sha256sum</code>)</td></tr>
<tr><td><strong>۹</strong></td><td><code>grep</code></td><td>جستجوی الگو در متن، گزینه‌های <code>-i</code>، <code>-v</code>، <code>-r</code>، <code>-n</code>، <code>-l</code>، عبارات منظم (Regex) ساده</td></tr>
<tr><td><strong>۱۰</strong></td><td>Redirect</td><td>ورودی/خروجی استاندارد (stdin، stdout، stderr)، <code>></code>، <code>>></code>، <code><</code>، <code>2></code>، <code>&></code></td></tr>

<tr><td><strong>۱۲</strong></td><td><code>sed</code></td><td>ویرایش جریانی متن، جایگزینی (<code>s/old/new/</code>)، حذف خطوط (<code>d</code>)، ذخیره در فایل</td></tr>
<tr><td><strong>۱۳</strong></td><td><code>xargs</code></td><td>تبدیل stdin به آرگومان، گزینه‌های <code>-n</code>، <code>-I {}</code>، <code>-0</code>، <code>-p</code>، <code>-t</code></td></tr>

<h2>جمع‌بندی هر بخش با مثال‌های ترکیبی</h2>

<h3>بخش ۱: مسیرها و فایل‌ها (جلسات ۲ و ۳)</h3>
<p><strong>مثال ترکیبی:</strong> یک ساختار پوشه ایجاد کنید، فایل بسازید و محتوای آن را نمایش دهید.</p>
<div class="code-container"><span class="code-label">تمرین ترکیبی</span><div class="code-block">mkdir -p ~/project/{src,docs,backup}
touch ~/project/src/main.py
echo "print('Hello World')" > ~/project/src/main.py
cat ~/project/src/main.py
ls -la ~/project/src/</div></div>

<h3>بخش ۲: متغیرها و تاریخچه (جلسه ۴)</h3>
<p><strong>مثال ترکیبی:</strong> یک متغیر محیطی بسازید و از تاریخچه برای اجرای مجدد استفاده کنید.</p>
<div class="code-container"><span class="code-label">تمرین ترکیبی</span><div class="code-block">export PROJECT_DIR=~/project
cd $PROJECT_DIR
echo $PROJECT_DIR
history | grep "cd"
# !&lt;number&gt;  # اجرای مجدد یک دستور خاص</div></div>

<h3>بخش ۳: ویرایش فایل‌ها (جلسات ۵-۷)</h3>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته کلیدی</strong>
<ul>
    <li>از <code>vi</code> برای ویرایش سریع در محیط‌های بدون GUI استفاده کنید.</li>
    <li>از <code>nano</code> برای ویرایش ساده و کاربرپسند استفاده کنید.</li>
    <li>همیشه قبل از ویرایش فایل‌های سیستمی، از آنها <strong>بکاپ</strong> بگیرید: <br> <code>cp /etc/hosts /etc/hosts.bak</code></li>
</ul>
</div></div>

<h3>بخش ۴: پردازش فایل‌ها (جلسه ۸)</h3>
<p><strong>مثال ترکیبی:</strong> تعداد خطوط، کلمات و کاراکترهای یک فایل را بگیرید، آن را مرتب کنید و خطوط تکراری را حذف کنید.</p>
<div class="code-container"><span class="code-label">تمرین ترکیبی</span><div class="code-block">wc -l ~/project/src/main.py
sort ~/project/src/main.py | uniq -c
cut -d: -f1 /etc/passwd | sort | uniq</div></div>

<h3>بخش ۵: جستجو و ویرایش متون (جلسات ۹ و ۱۲)</h3>
<p><strong>مثال ترکیبی:</strong> در تمام فایل‌های <code>.py</code> عبارت <code>TODO</code> را پیدا کنید و با <code>sed</code> آن را به <code>FIXME</code> تبدیل کنید.</p>
<div class="code-container"><span class="code-label">تمرین ترکیبی</span><div class="code-block">grep -r "TODO" ~/project/src/
find ~/project/src/ -name "*.py" | xargs sed -i 's/TODO/FIXME/g'
grep -r "FIXME" ~/project/src/</div></div>

<h3>بخش ۶: مدیریت جریان داده (جلسات ۱۰، ۱۱، ۱۳)</h3>
<p><strong>مثال ترکیبی نهایی:</strong></p>
<ol>
    <li>همه فایل‌های لاگ بزرگتر از ۱۰ مگابایت را پیدا کنید.</li>
    <li>آنها را فشرده کنید.</li>
    <li>خروجی را در یک فایل لاگ بنویسید.</li>
    <li>خطاها را به فایل جداگانه‌ای ارسال کنید.</li>
    <li>تعداد فایل‌های پردازش شده را بشمارید.</li>
</ol>
<div class="code-container"><span class="code-label">تمرین نهایی</span><div class="code-block">find /var/log -name "*.log" -type f -size +10M -print0 | \
xargs -0 -I {} gzip {} 2>> errors.log 1>> success.log

echo "تعداد فایل‌های پردازش شده:"
grep "gzip" success.log | wc -l</div></div>

<h2>نکات طلایی برای آزمون LPIC-1 (فصل اول)</h2>

<table>
<thead><tr><th>موضوع</th><th>نکته کلیدی</th></tr></thead>
<tbody>
<tr><td><strong>مسیرها</strong></td><td>مسیر مطلق همیشه با <code>/</code> شروع می‌شود. <code>.</code> یعنی پوشه جاری، <code>..</code> یعنی پوشه والد.</td></tr>
<tr><td><strong>گزینه‌های <code>ls</code></strong></td><td><code>-l</code> = جزئیات، <code>-a</code> = نمایش فایل‌های مخفی، <code>-h</code> = اندازه قابل خواندن برای انسان.</td></tr>
<tr><td><strong><code>grep</code></strong></td><td><code>-i</code> = نادیده گرفتن حروف بزرگ/کوچک، <code>-v</code> = خطوطی که <strong>مطابقت ندارند</strong>، <code>-r</code> = جستجوی بازگشتی.</td></tr>
<tr><td><strong>ردایرکت</strong></td><td><code>&gt;</code> = بازنویسی، <code>&gt;&gt;</code> = اضافه کردن، <code>2&gt;</code> = خطاها، <code>&amp;&gt;</code> = همه خروجی‌ها.</td></tr>
<tr><td><strong>Pipe</strong></td><td><code>|</code> فقط stdout را منتقل می‌کند، stderr را نه. برای خطاها از <code>2&gt;&amp;1</code> استفاده کنید.</td></tr>
<tr><td><strong><code>sed</code></strong></td><td><code>sed -i</code> یعنی تغییرات را در خود فایل اعمال کن (خطرناک! از بکاپ بگیرید).</td></tr>
<tr><td><strong><code>xargs</code></strong></td><td>برای فایل‌های دارای فاصله، حتماً از <code>-0</code> و <code>-print0</code> استفاده کنید.</td></tr>
<tr><td><strong><code>vi</code></strong></td><td>حالت Normal: <code>i</code> = Insert، <code>Esc</code> = خروج از Insert، <code>:wq</code> = ذخیره و خروج، <code>:q!</code> = خروج بدون ذخیره.</td></tr>
</tbody>
</table>

<h2>اشتباهات رایج در آزمون (و نحوه جلوگیری)</h2>

<table>
<thead><tr><th>اشتباه</th><th>راه حل</th></tr></thead>
<tbody>
<tr><td>فراموش کردن <code>-</code> قبل از گزینه‌ها</td><td>گزینه‌های کوتاه با <code>-</code> و بلند با <code>--</code> شروع می‌شوند.</td></tr>
<tr><td>قاطی کردن <code>&gt;</code> و <code>&gt;&gt;</code></td><td><code>&gt;</code> فایل را از نو می‌نویسد، <code>&gt;&gt;</code> به انتهای فایل اضافه می‌کند.</td></tr>
<tr><td>استفاده از <code>|</code> با دستوراتی که stdin نمی‌خوانند</td><td>از <code>xargs</code> استفاده کنید.</td></tr>
<tr><td>فراموش کردن <code>-i</code> در <code>sed</code></td><td>بدون <code>-i</code>، <code>sed</code> فقط خروجی را چاپ می‌کند و فایل را تغییر نمی‌دهد.</td></tr>
<tr><td>قاطی کردن <code>vi</code> و <code>vim</code></td><td><code>vi</code> نسخه قدیمی‌تر است، <code>vim</code> نسخه بهبودیافته. در اکثر توزیع‌ها <code>vi</code> در واقع <code>vim</code> است.</td></tr>
</tbody>
</table>

<h2>خودآزمایی جامع (۵ تست چهارگزینه‌ای)</h2>

<div class="quiz-card"><p>❓ تست ۱: کدام دستور، تمام فایل‌های <code>*.tmp</code> را در پوشه جاری و زیرپوشه‌ها پیدا کرده و آنها را <strong>به‌طور امن</strong> (با در نظر گرفتن فاصله در نام فایل‌ها) حذف می‌کند؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>find . -name "*.tmp" | rm</code></button>
    <button onclick="selectOption(this)">ب) <code>find . -name "*.tmp" -exec rm {} \;</code></button>
    <button onclick="selectOption(this)">ج) <code>find . -name "*.tmp" -print0 | xargs -0 rm -f</code></button>
    <button onclick="selectOption(this)">د) <code>rm -rf *.tmp</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ج</strong><br>
ترکیب <code>-print0</code> و <code>-0</code> باعث می‌شود حتی فایل‌های با نام دارای فاصله هم به‌درستی حذف شوند. همچنین <code>-f</code> باعث می‌شود خطاهای مربوط به عدم وجود فایل نادیده گرفته شوند. گزینه الف چون <code>rm</code> stdin را نمی‌خواند، غلط است. گزینه ب گرچه امن است اما کندتر است و از <code>-f</code> استفاده نکرده. گزینه د فقط فایل‌های پوشه جاری را حذف می‌کند و به زیرپوشه‌ها نمی‌رود.</div>
</div>

<div class="quiz-card"><p>❓ تست ۲: با فرض اینکه فایل <code>data.txt</code> شامل ۵ خط متن است، خروجی دستور زیر چیست؟<br> <code>cat data.txt | grep -v "error" | wc -l</code></p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) تعداد کل خطوط فایل</button>
    <button onclick="selectOption(this)">ب) تعداد خطوطی که کلمه "error" در آنها وجود دارد</button>
    <button onclick="selectOption(this)">ج) تعداد خطوطی که کلمه "error" در آنها <strong>وجود ندارد</strong></button>
    <button onclick="selectOption(this)">د) تعداد کلمات فایل به جز "error"</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ج</strong><br>
<code>grep -v</code> یعنی «خطوطی که <strong>مطابقت ندارند</strong> با الگو را نشان بده». پس خطوطی که "error" ندارند انتخاب می‌شوند و <code>wc -l</code> تعداد آنها را می‌شمرد. گزینه الف تعداد کل خطوط را نشان نمی‌دهد، گزینه ب مربوط به <code>grep "error"</code> بدون <code>-v</code> است و گزینه د مربوط به شمارش کلمات نیست.</div>
</div>

<div class="quiz-card"><p>❓ تست ۳: کدام گزینه، دستور <code>sed</code> را به‌درستی توضیح می‌دهد که تمام اعداد موجود در فایل <code>report.txt</code> را با کلمه <code>[NUMBER]</code> جایگزین می‌کند؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>sed 's/[0-9]/[NUMBER]/g' report.txt</code></button>
    <button onclick="selectOption(this)">ب) <code>sed 's/[0-9]*/[NUMBER]/' report.txt</code></button>
    <button onclick="selectOption(this)">ج) <code>sed -i 's/[0-9]/[NUMBER]/g' report.txt</code></button>
    <button onclick="selectOption(this)">د) <code>sed 's/[0-9]+/[NUMBER]/g' report.txt</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ج</strong><br>
<code>-i</code> یعنی تغییرات را در خود فایل اعمال کن. <code>[0-9]</code> یعنی هر رقم از ۰ تا ۹. <code>g</code> یعنی همه موارد در هر خط (Global). گزینه الف بدون <code>-i</code> فقط خروجی را چاپ می‌کند. گزینه ب با <code>*</code> صفر یا چند رقم را جایگزین می‌کند که نتیجه اشتباه می‌دهد. گزینه د از <code>+</code> استفاده کرده که در <code>sed</code> پیش‌فرض پشتیبانی نمی‌شود.</div>
</div>

<div class="quiz-card"><p>❓ تست ۴: کدام گزینه به‌درستی تفاوت بین <code>|</code> (Pipe) و <code>&gt;</code> (Redirect) را توضیح می‌دهد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) Pipe خروجی را به فایل می‌فرستد و Redirect خروجی را به دستور بعدی می‌دهد.</button>
    <button onclick="selectOption(this)">ب) Pipe خروجی را به دستور بعدی می‌دهد و Redirect خروجی را به فایل می‌فرستد.</button>
    <button onclick="selectOption(this)">ج) Pipe خطاها را به فایل می‌فرستد و Redirect خروجی را به دستور بعدی می‌دهد.</button>
    <button onclick="selectOption(this)">د) هر دو کار یکسان را انجام می‌دهند.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ب</strong><br>
<code>|</code> (Pipe) برای <strong>اتصال خروجی یک دستور به ورودی دستور دیگر</strong> استفاده می‌شود. <code>&gt;</code> (Redirect) برای <strong>ذخیره خروجی در یک فایل</strong> استفاده می‌شود. گزینه الف برعکس توضیح داده شده، ج غلط است و د نیز نادرست است.</div>
</div>

<div class="quiz-card"><p>❓ تست ۵: فرض کنید می‌خواهید یک متغیر محیطی به نام <code>MY_PATH</code> بسازید که مسیر پوشه <code>~/Documents</code> را نگهداری کند و در تمام شل‌های جدید هم در دسترس باشد. کدام ترتیب از دستورات صحیح است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>MY_PATH=~/Documents</code><br><code>export MY_PATH</code></button>
    <button onclick="selectOption(this)">ب) <code>export MY_PATH=~/Documents</code></button>
    <button onclick="selectOption(this)">ج) <code>set MY_PATH=~/Documents</code></button>
    <button onclick="selectOption(this)">د) هر دو گزینه الف و ب صحیح هستند.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: د</strong><br>
هر دو روش الف و ب صحیح هستند. در روش اول، متغیر ساخته و سپس <code>export</code> می‌شود. در روش دوم، مستقیماً با <code>export</code> ساخته می‌شود. هر دو متغیر را به متغیر محیطی (محیطی که در شل‌های فرزند هم در دسترس است) تبدیل می‌کنند. گزینه ج با <code>set</code> برای متغیرهای محلی است و در شل‌های جدید در دسترس نیست.</div>
</div>

<div class="section-header">
    <div class="section-badge">۲</div>
    <div>
        <h1>Basic Installations — مبانی نصب نرم‌افزار در Linux</h1>
        <div class="meta">مدیریت نرم‌افزار و فرآیندها · بخش ۱ از ۸</div>
    </div>
</div>

<p>در این جلسه می‌خواهیم <strong>از پایه بفهمیم نرم‌افزار در لینوکس چطور نصب می‌شود</strong> و مهم‌تر از آن، تفاوت خانواده‌های مختلف لینوکس و روش‌های نصب را یاد بگیریم.</p>

<blockquote>هدف این جلسه این نیست که فقط چند دستور حفظ کنی؛ باید در پایان بتوانی تشخیص بدهی <strong>چه نوع بسته‌ای داری، روی چه توزیعی هستی و برای نصب باید از چه ابزاری استفاده کنی.</strong></blockquote>

<h2>نرم‌افزار در Linux چطور نصب می‌شود؟</h2>

<p>در ویندوز معمولاً با فایل‌هایی مثل:</p>
<div class="code-container"><span class="code-label">ویندوز</span><div class="code-block no-prompt">setup.exe
program.msi</div></div>

<p>مواجه می‌شویم.</p>

<p>اما در لینوکس معمولاً نرم‌افزارها به شکل <strong>Package (بسته)</strong> توزیع می‌شوند.</p>

<p>یک Package فقط خود برنامه نیست؛ می‌تواند شامل موارد مختلفی باشد، مثل:</p>
<ul>
    <li>فایل‌های اجرایی برنامه</li>
    <li>فایل‌های Configuration</li>
    <li>مستندات</li>
    <li>کتابخانه‌های موردنیاز</li>
    <li>اطلاعات مربوط به نسخه</li>
    <li>اطلاعات وابستگی‌ها</li>
    <li>اطلاعات مربوط به نصب و حذف برنامه</li>
</ul>

<p>مثلاً فرض کن می‌خواهیم <code>tmux</code> نصب کنیم.</p>

<p>در لینوکس ممکن است یک بسته‌ای شبیه این داشته باشیم:</p>
<div class="code-container"><span class="code-label">Debian</span><div class="code-block no-prompt">tmux_3.4-1_amd64.deb</div></div>

<p>یا در خانواده Red Hat:</p>
<div class="code-container"><span class="code-label">Red Hat</span><div class="code-block no-prompt">tmux-3.4-1.x86_64.rpm</div></div>

<p>هر دو می‌توانند مربوط به <strong>tmux</strong> باشند، ولی فرمت Package آنها متفاوت است.</p>

<h2>دو خانواده اصلی Packageها</h2>

<p>یکی از مهم‌ترین چیزهایی که در LPIC-1 باید بلد باشی این است که توزیع‌های Linux از سیستم‌های Package Management متفاوتی استفاده می‌کنند.</p>

<p>به صورت ساده دو خانواده بسیار مهم داریم:</p>
<div class="code-container"><span class="code-label">خانواده‌ها</span><div class="code-block no-prompt">Debian Family
       ↓
     .deb
       ↓
     apt

Red Hat Family
       ↓
     .rpm
       ↓
   yum / dnf</div></div>

<h3>خانواده Debian</h3>

<p>توزیع‌هایی مثل:</p>
<ul>
    <li>Debian</li>
    <li>Ubuntu</li>
    <li>Linux Mint</li>
    <li>Kali Linux</li>
</ul>

<p>در خانواده Debian قرار می‌گیرند.</p>

<p>فرمت Package اصلی این خانواده:</p>
<div class="code-container"><span class="code-label">فرمت</span><div class="code-block no-prompt">.deb</div></div>

<p>است. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">nginx_1.24.deb</div></div>

<p>برای مدیریت Packageها معمولاً با ابزارهایی مثل:</p>
<div class="code-container"><span class="code-label">ابزار</span><div class="code-block">apt</div></div>

<p>کار می‌کنیم.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo apt install nginx</div></div>

<p>یعنی:</p>
<blockquote>از مخازن تنظیم‌شده، بسته nginx را پیدا کن، وابستگی‌هایش را بررسی کن و نصبش کن.</blockquote>

<h3>خانواده Red Hat</h3>

<p>خانواده مهم دیگر:</p>
<ul>
    <li>Red Hat Enterprise Linux (RHEL)</li>
    <li>Fedora</li>
    <li>Rocky Linux</li>
    <li>AlmaLinux</li>
</ul>

<p>است.</p>

<p>فرمت Package اصلی این خانواده:</p>
<div class="code-container"><span class="code-label">فرمت</span><div class="code-block no-prompt">.rpm</div></div>

<p>است. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">nginx-1.24.rpm</div></div>

<p>در سیستم‌های جدید Red Hat معمولاً از:</p>
<div class="code-container"><span class="code-label">ابزار</span><div class="code-block">dnf</div></div>

<p>استفاده می‌شود.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo dnf install nginx</div></div>

<p>در سیستم‌های قدیمی‌تر یا برخی محیط‌ها ممکن است:</p>
<div class="code-container"><span class="code-label">ابزار قدیمی</span><div class="code-block">yum</div></div>

<p>را ببینی. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo yum install nginx</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>رابطه مهم</strong>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Debian → .deb → apt
Red Hat → .rpm → dnf / yum</div></div>
</div></div>

<h2>یک نکته بسیار مهم: Package Format با Package Manager یکی نیست</h2>

<p>این مورد در آزمون مهم است.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">.deb</div></div>

<p>یک <strong>فرمت Package</strong> است.</p>

<p>ولی:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">apt</div></div>

<p>یک <strong>Package Management Tool</strong> است.</p>

<p>یعنی این دو یکی نیستند.</p>

<p>همین موضوع برای Red Hat هم وجود دارد:</p>

<div class="code-container"><span class="code-label">Red Hat</span><div class="code-block no-prompt">.rpm → فرمت Package
dnf → ابزار مدیریت Package</div></div>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>نکات آزمونی</strong>
<ul>
    <li>❌ <code>apt</code> فرمت Package نیست.</li>
    <li>❌ <code>.deb</code> ابزار نصب نیست.</li>
    <li>❌ <code>dnf</code> فرمت Package نیست.</li>
    <li>✅ <code>.deb</code> → Package Format</li>
    <li>✅ <code>apt</code> → ابزار مدیریت Package</li>
    <li>✅ <code>.rpm</code> → Package Format</li>
    <li>✅ <code>dnf</code> → ابزار مدیریت Package</li>
</ul>
</div></div>

<h2>نصب Offline و Online</h2>

<p>حالا به یکی از مفاهیم مهم جلسه می‌رسیم.</p>

<p>به صورت ساده نصب نرم‌افزار را می‌توانیم به دو حالت تقسیم کنیم:</p>
<div class="code-container"><span class="code-label">روش‌های نصب</span><div class="code-block no-prompt">نصب محلی (Offline / Local)
نصب از Repository (Online / Repository-based)</div></div>

<h3>نصب محلی — Local Installation</h3>

<p>فرض کن یک فایل Package روی سیستم خودت داری.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">tmux.deb</div></div>

<p>و این فایل در مسیر فعلی قرار دارد.</p>

<p>در Debian می‌توانی از ابزارهایی مثل <code>dpkg</code> برای نصب مستقیم فایل استفاده کنی:</p>
<div class="code-container"><span class="code-label">نصب محلی Debian</span><div class="code-block">sudo dpkg -i tmux.deb</div></div>

<p>اینجا فایل Package <strong>از روی کامپیوتر خودت</strong> نصب می‌شود.</p>

<p>در خانواده Red Hat هم می‌توان Package محلی RPM را مستقیماً با <code>rpm</code> نصب کرد:</p>
<div class="code-container"><span class="code-label">نصب محلی Red Hat</span><div class="code-block">sudo rpm -i tmux.rpm</div></div>

<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Local Package
      ↓
 ┌───────────┐
 │  Debian   │ → dpkg
 └───────────┘

 ┌───────────┐
 │ Red Hat   │ → rpm
 └───────────┘</div></div>

<h3>نصب Online / Repository-based</h3>

<p>حالا فرض کن فایل <code>.deb</code> یا <code>.rpm</code> را نداری.</p>

<p>می‌خواهی خود سیستم آن را از اینترنت دریافت کند.</p>

<p>اینجا ابزارهایی مثل:</p>
<div class="code-container"><span class="code-label">ابزار</span><div class="code-block">apt</div></div>

<p>و:</p>
<div class="code-container"><span class="code-label">ابزار</span><div class="code-block">dnf</div></div>

<p>خیلی مهم می‌شوند.</p>

<p>مثلاً در Debian:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo apt install nginx</div></div>

<p>سیستم تقریباً این کارها را انجام می‌دهد:</p>
<div class="code-container"><span class="code-label">مراحل</span><div class="code-block no-prompt">1. Repositoryها را بررسی می‌کند
          ↓
2. Package موردنظر را پیدا می‌کند
          ↓
3. Dependencyها را بررسی می‌کند
          ↓
4. Packageهای لازم را دانلود می‌کند
          ↓
5. آنها را نصب می‌کند</div></div>

<p>در Red Hat هم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo dnf install nginx</div></div>

<p>عملکرد مشابهی دارد.</p>

<h2>Dependency چیست؟</h2>

<p>یکی از مهم‌ترین مفاهیم Package Management همین <strong>Dependency</strong> است.</p>

<p>فرض کن برنامه‌ای به سه کتابخانه دیگر نیاز دارد:</p>
<div class="code-container"><span class="code-label">وابستگی</span><div class="code-block no-prompt">MyProgram
   │
   ├── Library A
   ├── Library B
   └── Library C</div></div>

<p>یعنی MyProgram بدون این کتابخانه‌ها ممکن است درست کار نکند.</p>

<p>به این نیازها می‌گوییم:</p>
<blockquote><strong>Dependency</strong></blockquote>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">Program A
   ↓
needs
   ↓
Library B</div></div>

<p>در این حالت <code>Library B</code> یک Dependency برای Program A است.</p>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>مدیریت Dependencyها یکی از دلایل اصلی استفاده از Package Managerهای سطح بالا مثل <code>apt</code> و <code>dnf</code> است.</div></div>

<h2>چرا apt و dnf مهم‌تر از dpkg و rpm هستند؟</h2>

<p>این سؤال خیلی مهم است.</p>

<p><code>dpkg</code> و <code>rpm</code> می‌توانند Package را نصب کنند، اما در مدیریت Dependencyها محدودتر از ابزارهای سطح بالاتر هستند.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo dpkg -i program.deb</div></div>

<p>ممکن است با خطای Dependency مواجه شود.</p>

<p>اما:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo apt install program</div></div>

<p>می‌تواند Repositoryها را بررسی کند و Dependencyهای لازم را نیز دریافت کند.</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">dpkg / rpm
     ↓
کار با Packageهای محلی و سطح پایین‌تر

apt / dnf
     ↓
مدیریت Package + Repository + Dependency</div></div>

<p>این تفاوت را خوب یاد بگیر.</p>

<h2>Repository چیست؟</h2>

<p>حالا می‌رسیم به مفهوم <strong>Repository</strong>.</p>

<p>Repository را می‌توانی مثل یک <strong>انبار نرم‌افزاری</strong> در نظر بگیری.</p>

<p>در آنجا تعداد زیادی Package قرار دارد. مثلاً:</p>
<div class="code-container"><span class="code-label">مخزن</span><div class="code-block no-prompt">Repository
│
├── nginx
├── tmux
├── vim
├── curl
├── git
├── python3
└── ...</div></div>

<p>وقتی اجرا می‌کنی:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo apt install tmux</div></div>

<p>سیستم معمولاً Package را از Repositoryهای تنظیم‌شده دریافت می‌کند.</p>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">Computer
    │
    │ درخواست tmux
    ↓
Repository
    │
    │ tmux package
    ↓
Computer</div></div>

<h3>Repository الزاماً به معنی اینترنت نیست</h3>

<p>یک نکته ظریف:</p>

<p>Repository می‌تواند روی اینترنت باشد، اما الزاماً نباید اینترنتی باشد.</p>

<p>می‌توان Repository داخلی در یک شبکه هم داشت. مثلاً در یک شرکت:</p>
<div class="code-container"><span class="code-label">شبکه داخلی</span><div class="code-block no-prompt">          Internal Network

PC1 ───────┐
PC2 ───────┤
PC3 ───────┼──→ Internal Repository Server
PC4 ───────┘</div></div>

<p>در این حالت کامپیوترها Packageها را از یک Repository داخلی دریافت می‌کنند.</p>

<p>پس مفهوم اصلی Repository:</p>
<blockquote>منبع سازمان‌یافته‌ای برای ارائه Packageها.</blockquote>

<h2>Binary چیست؟</h2>

<p>حالا یک اصطلاح مهم دیگر:</p>

<p><strong>Binary</strong></p>

<p>Binary معمولاً به فایل اجرایی یا داده‌ای در قالب باینری اشاره دارد.</p>

<p>در بحث نصب نرم‌افزار، وقتی Package نصب می‌شود، فایل‌های اجرایی برنامه در مسیرهای مختلف سیستم قرار می‌گیرند.</p>

<p>مثلاً ممکن است executable یک برنامه در:</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">/usr/bin/</div></div>

<p>قرار بگیرد. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">/usr/bin/tmux
/usr/bin/ls
/usr/bin/curl</div></div>

<p>وقتی اجرا می‌کنی:</p>
<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">tmux</div></div>

<p>Shell فایل اجرایی مناسب را پیدا کرده و اجرا می‌کند.</p>

<h3>ارتباط Package با Binary</h3>

<p>این رابطه را خوب در ذهنت نگه دار:</p>
<div class="code-container"><span class="code-label">رابطه</span><div class="code-block no-prompt">Package
   ↓
شامل فایل‌های مختلف
   ↓
Binary + Config + Documentation + ...
   ↓
بعد از نصب در مسیرهای مناسب قرار می‌گیرند</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">tmux.deb
    ↓
    نصب
    ↓
/usr/bin/tmux</div></div>

<p>پس:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">tmux.deb        → خود Package است.
/usr/bin/tmux   → فایل اجرایی نصب‌شده است.</div></div>

<p>این دو را با هم اشتباه نکن.</p>

<div class="summary-box">
    <h3>🧠 جمع‌بندی جلسه</h3>
    <p>تا اینجا باید این تصویر را در ذهنت داشته باشی:</p>
