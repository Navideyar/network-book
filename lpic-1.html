<p>در جلسه قبل با <code>tmux</code> آشنا شدیم و یاد گرفتیم چطور یک Session را زنده نگه داریم حتی بعد از قطع اتصال SSH. قبل‌تر هم در جلسه ۵ با PID، <code>ps</code> و <code>top</code> آشنا شده بودیم.</p>

<p>حالا وقتش رسیده که یاد بگیریم چطور یک Process را متوقف کنیم، چطور آن را بین پیش‌زمینه و پس‌زمینه جابه‌جا کنیم، و سیگنال‌هایی که پشت <code>kill</code> هستند دقیقاً چه معنایی دارند.</p>

<p>طبق برنامه این جلسه شامل دو بخش است:</p>
<div class="code-container"><span class="code-label">سرفصل‌ها</span><div class="code-block no-prompt">1. اجرای Process در پس‌زمینه و جابه‌جایی بین پیش‌زمینه/پس‌زمینه
2. فرمان kill و مفهوم Signal</div></div>

<h2>بخش اول — اجرای Process در پس‌زمینه</h2>

<h3>Foreground در برابر Background</h3>

<p>وقتی یک دستور را در ترمینال اجرا می‌کنیم، به‌طور پیش‌فرض آن دستور <strong>Foreground</strong> (پیش‌زمینه) است.</p>

<p>یعنی:</p>
<div class="code-container"><span class="code-label">Foreground</span><div class="code-block no-prompt">دستور اجرا می‌شود → ترمینال قفل می‌شود → تا پایان اجرا منتظر می‌مانیم</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sleep 100</div></div>

<p>تا وقتی این دستور تمام نشود، نمی‌توانیم دستور بعدی را در همان ترمینال بنویسیم.</p>

<h3>اجرا در پس‌زمینه با <code>&</code></h3>

<p>اگر نخواهیم منتظر پایان یک دستور بمانیم، می‌توانیم آن را در <strong>Background</strong> (پس‌زمینه) اجرا کنیم.</p>

<p>برای این کار کافی است <code>&</code> را بعد از دستور اضافه کنیم:</p>
<div class="code-container"><span class="code-label">اجرا در پس‌زمینه</span><div class="code-block">sleep 100 &</div></div>

<p>به محض اجرای این دستور، شماره‌ای شبیه این نمایش داده می‌شود:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">[1] 4821</div></div>

<p>که:</p>
<div class="code-container"><span class="code-label">تفسیر</span><div class="code-block no-prompt">[1]  → شماره Job
4821 → PID</div></div>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">command & → اجرا در Background → Terminal بلافاصله آزاد می‌شود</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته آزمونی</strong>
<p><code>&</code> باعث می‌شود Process در پس‌زمینه اجرا شود، اما این با Detach کردن یک Session در <code>tmux</code> فرق دارد؛ اگر همان Terminal (بدون <code>tmux</code>) به‌طور کامل بسته شود، Processهای Background معمولی معمولاً همراه آن از بین می‌روند، مگر با ابزارهایی مثل <code>nohup</code> یا <code>tmux</code> محافظت شده باشند.</p>
</div></div>

<h3>مشاهده Jobها با <code>jobs</code></h3>

<p>برای دیدن لیست Processهایی که در همان Session ترمینال به شکل Job در حال اجرا هستند:</p>
<div class="code-container"><span class="code-label">مشاهده Jobها</span><div class="code-block">jobs</div></div>

<p>خروجی می‌تواند شبیه این باشد:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">[1]+  Running    sleep 100 &</div></div>

<div class="code-container"><span class="code-label">کاربرد</span><div class="code-block no-prompt">jobs → لیست Jobهای پس‌زمینه/متوقف‌شده همین Shell</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته آزمونی</strong>
<p><code>jobs</code> را با <code>ps</code> اشتباه نگیر:</p>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">ps   → Snapshot از همه Processهای قابل مشاهده سیستم
jobs → فقط Jobهای مرتبط با Shell فعلی</div></div>
</div></div>

<h3>شماره Job در برابر PID</h3>

<p>نکته مهمی که باید دقیق باشیم:</p>
<div class="code-container"><span class="code-label">تفاوت</span><div class="code-block no-prompt">%1   → اشاره به Job شماره ۱
4821 → PID واقعی همان Process</div></div>

<p>یعنی برای اشاره به یک Job از علامت <code>%</code> به همراه شماره Job استفاده می‌کنیم، نه شماره PID مستقیم.</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">Job Number  →  %1, %2, %3, ...
PID         →  1234, 4821, ...</div></div>

<h2>بخش دوم — جابه‌جایی بین پیش‌زمینه و پس‌زمینه</h2>

<h3>آوردن Job به پیش‌زمینه با <code>fg</code></h3>

<p>اگر بخواهیم یک Job پس‌زمینه را دوباره به پیش‌زمینه بیاوریم:</p>
<div class="code-container"><span class="code-label">آوردن به Foreground</span><div class="code-block">fg %number</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">fg %1</div></div>

<p><code>fg</code> مخفف <strong>foreground</strong> است.</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">Background Job → fg %1 → Foreground</div></div>

<h3>متوقف کردن موقت با <code>Ctrl+Z</code></h3>

<p>اگر یک Process در حال اجرا (Foreground) باشد و بخواهیم موقتاً آن را متوقف کنیم بدون اینکه بسته شود:</p>
<div class="code-container"><span class="code-label">توقف موقت</span><div class="code-block no-prompt">Ctrl+Z</div></div>

<p>با این کار، Process به حالت <strong>Stopped</strong> (متوقف‌شده) می‌رود؛ یعنی نه اجرا می‌شود و نه بسته شده است، فقط موقتاً نگه داشته شده.</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">Foreground Process → Ctrl+Z → Stopped</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی مهم</strong>
<p><code>Ctrl+Z</code> برابر با بستن یا کشتن Process <strong>نیست</strong>. Process فقط متوقف (Suspend) می‌شود و همچنان در حافظه باقی می‌ماند.</p>
</div></div>

<h3>ادامه در پس‌زمینه با <code>bg</code></h3>

<p>بعد از اینکه یک Process را با <code>Ctrl+Z</code> متوقف کردیم، می‌توانیم آن را در پس‌زمینه دوباره به حالت اجرا برگردانیم:</p>
<div class="code-container"><span class="code-label">ادامه در پس‌زمینه</span><div class="code-block">bg %number</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">bg %1</div></div>

<p><code>bg</code> مخفف <strong>background</strong> است.</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">Stopped (Ctrl+Z) → bg %1 → Running در Background</div></div>

<h3>چرخه کامل Foreground / Background</h3>

<p>این چرخه یکی از پرتکرارترین سناریوهای عملی و آزمونی است:</p>

<div class="code-container"><span class="code-label">چرخه</span><div class="code-block no-prompt">اجرای دستور به‌صورت Foreground
          ↓
     Ctrl+Z (Stop)
          ↓
        jobs
          ↓
   bg %1  (ادامه در Background)
          ↓
        jobs
          ↓
   fg %1  (بازگشت به Foreground)</div></div>

<table>
<thead><tr><th>دستور / کلید</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>command &</code></td><td>اجرای مستقیم در Background</td></tr>
<tr><td><code>jobs</code></td><td>نمایش لیست Jobهای Shell فعلی</td></tr>
<tr><td><code>Ctrl+Z</code></td><td>توقف موقت Process فعلی (Foreground → Stopped)</td></tr>
<tr><td><code>bg %number</code></td><td>ادامه Job متوقف‌شده در Background</td></tr>
<tr><td><code>fg %number</code></td><td>آوردن Job به Foreground</td></tr>
</tbody>
</table>

<h2>بخش سوم — پایان دادن به Processها</h2>

<h3>پایان دادن به یک Job با <code>kill %number</code></h3>

<p>اگر بخواهیم یک Job پس‌زمینه را مستقیماً از طریق شماره Job متوقف کنیم:</p>
<div class="code-container"><span class="code-label">پایان Job</span><div class="code-block">kill %number</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">kill %1</div></div>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">kill %1 → پایان دادن به Job شماره ۱</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته آزمونی</strong>
<p>اینجا <code>kill</code> با علامت <code>%</code> همراه با <strong>شماره Job</strong> به کار می‌رود، نه با PID مستقیم. در بخش بعد با استفاده از <code>kill</code> همراه با PID آشنا می‌شویم.</p>
</div></div>

<h3>فرمان <code>kill</code></h3>

<p>دستور اصلی برای پایان دادن به یک Process با استفاده از PID آن:</p>
<div class="code-container"><span class="code-label">پایان با PID</span><div class="code-block">kill PID</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">kill 4821</div></div>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">Process → PID → kill PID</div></div>

<p>این دقیقاً همان ارتباطی است که در جلسه ۵ درباره اهمیت PID صحبت کردیم.</p>

<h3>مفهوم Signal</h3>

<p>نکته‌ای که خیلی از افراد در ابتدا اشتباه متوجه می‌شوند این است:</p>

<blockquote><code>kill</code> به معنای «کشتن مستقیم» Process نیست؛ <code>kill</code> یک <strong>Signal</strong> (سیگنال) به Process ارسال می‌کند.</blockquote>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">kill → ارسال Signal → Process</div></div>

<p>اینکه Process دقیقاً چه واکنشی به آن Signal نشان دهد، به نوع Signal و به خود برنامه بستگی دارد.</p>

<h3><code>kill -9 PID</code></h3>

<p>رایج‌ترین شکلی که همه از <code>kill</code> دیده‌اند:</p>
<div class="code-container"><span class="code-label">پایان اجباری</span><div class="code-block">kill -9 PID</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">kill -9 4821</div></div>

<p>عدد <code>9</code> در اینجا شماره یک Signal خاص است که در ادامه دقیق بررسی می‌کنیم.</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">kill -9 PID → ارسال Signal شماره 9 (SIGKILL) → پایان اجباری Process</div></div>

<h3>پایان دادن با نام: <code>killall</code></h3>

<p>اگر بخواهیم همه Processهایی که یک نام مشخص دارند را همزمان پایان دهیم، به جای پیدا کردن تک‌تک PIDها می‌توانیم از:</p>
<div class="code-container"><span class="code-label">پایان با نام</span><div class="code-block">killall name</div></div>

<p>استفاده کنیم.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">killall firefox</div></div>

<p>این دستور به همه Processهایی که نامشان <code>firefox</code> است Signal ارسال می‌کند، نه فقط یکی.</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">kill PID       → یک Process مشخص با PID
killall name   → همه Processهای با یک نام مشخص</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی مهم</strong>
<p>تفاوت <code>kill</code> و <code>killall</code> را دقیق به خاطر بسپار:</p>
<div class="code-container"><span class="code-label">تفاوت</span><div class="code-block no-prompt">kill    → بر اساس PID عمل می‌کند
killall → بر اساس نام Process عمل می‌کند</div></div>
</div></div>

<h2>بخش چهارم — انواع Signal</h2>

<h3>چرا چند نوع Signal داریم؟</h3>

<p>Signalهای مختلف معانی متفاوتی دارند؛ بعضی به Process اجازه می‌دهند خودش را تمیز ببندد، بعضی دیگر بدون هیچ اجازه‌ای Process را متوقف می‌کنند.</p>

<p>جدول اصلی Signalهایی که باید بشناسی:</p>

<table>
<thead><tr><th>Signal</th><th>شماره</th><th>معنی</th></tr></thead>
<tbody>
<tr><td><code>SIGTERM</code></td><td>15</td><td>خاتمه معمولی (پیش‌فرض <code>kill</code>)</td></tr>
<tr><td><code>SIGKILL</code></td><td>9</td><td>خاتمه اجباری، غیرقابل‌نادیده‌گیری</td></tr>
<tr><td><code>SIGSTOP</code></td><td>—</td><td>توقف اجباری، غیرقابل‌نادیده‌گیری</td></tr>
<tr><td><code>SIGINT</code></td><td>2</td><td>وقفه از صفحه‌کلید، معادل <code>Ctrl+C</code></td></tr>
</tbody>
</table>

<h3><code>SIGTERM</code> — سیگنال پیش‌فرض</h3>

<p>وقتی می‌نویسیم:</p>
<div class="code-container"><span class="code-label">پیش‌فرض</span><div class="code-block">kill PID</div></div>

<p>بدون مشخص کردن هیچ عددی، به‌طور پیش‌فرض Signal زیر ارسال می‌شود:</p>
<div class="code-container"><span class="code-label">سیگنال</span><div class="code-block no-prompt">SIGTERM (شماره 15)</div></div>

<p><code>SIGTERM</code> یعنی «درخواست خاتمه معمولی».</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">kill PID → SIGTERM → درخواست پایان دادن به‌صورت مرتب</div></div>

<p>نکته مهم این است که برنامه می‌تواند این Signal را دریافت کند و قبل از بسته شدن، کارهایی مثل ذخیره فایل یا بستن Connectionها را انجام دهد.</p>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی</strong>
<p>اگر سؤال پرسید: «سیگنال پیش‌فرض دستور <code>kill</code> چیست؟»</p>
<p>پاسخ: <code>SIGTERM (15)</code></p>
</div></div>

<h3><code>SIGKILL</code> — خاتمه اجباری</h3>

<p>وقتی می‌نویسیم:</p>
<div class="code-container"><span class="code-label">اجباری</span><div class="code-block">kill -9 PID</div></div>

<p>سیگنال زیر ارسال می‌شود:</p>
<div class="code-container"><span class="code-label">سیگنال</span><div class="code-block no-prompt">SIGKILL (شماره 9)</div></div>

<p><code>SIGKILL</code> برخلاف <code>SIGTERM</code>، به Process هیچ فرصتی برای واکنش یا تمیزکاری نمی‌دهد؛ Process بلافاصله و اجباری متوقف می‌شود.</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">kill -9 PID → SIGKILL → پایان فوری و اجباری → غیرقابل نادیده‌گیری</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی مهم</strong>
<div class="code-container"><span class="code-label">نکته</span><div class="code-block no-prompt">SIGKILL و SIGSTOP → غیرقابل نادیده‌گیری (Cannot be caught, blocked, or ignored)</div></div>
<p>یعنی هیچ برنامه‌ای نمی‌تواند این دو Signal را نادیده بگیرد یا مدیریت کند؛ هسته سیستم‌عامل مستقیماً این کار را انجام می‌دهد.</p>
</div></div>

<h3><code>SIGSTOP</code> — توقف اجباری</h3>

<p><code>SIGSTOP</code> باعث می‌شود Process متوقف (Suspend) شود، دقیقاً شبیه همان کاری که <code>Ctrl+Z</code> به‌صورت تعاملی انجام می‌دهد.</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">SIGSTOP → توقف اجباری Process → غیرقابل نادیده‌گیری</div></div>

<p>تفاوت کلیدی با <code>SIGKILL</code> این است که <code>SIGSTOP</code> فقط Process را متوقف می‌کند، آن را از بین نمی‌برد؛ Process همچنان در حافظه باقی می‌ماند و می‌تواند بعداً با Signal مناسب (<code>SIGCONT</code>) ادامه پیدا کند.</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">SIGKILL → پایان کامل Process
SIGSTOP → توقف موقت، Process باقی می‌ماند</div></div>

<h3><code>SIGINT</code> — وقفه از صفحه‌کلید</h3>

<p>وقتی داخل یک Process فعال هستیم و کلیدهای:</p>
<div class="code-container"><span class="code-label">میانبر</span><div class="code-block no-prompt">Ctrl+C</div></div>

<p>را می‌زنیم، سیستم Signal زیر را برای آن Process ارسال می‌کند:</p>
<div class="code-container"><span class="code-label">سیگنال</span><div class="code-block no-prompt">SIGINT (شماره 2)</div></div>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">Ctrl+C → SIGINT → درخواست وقفه/توقف Process</div></div>

<p>برخلاف <code>SIGKILL</code> و <code>SIGSTOP</code>، برنامه می‌تواند <code>SIGINT</code> را مدیریت یا حتی نادیده بگیرد.</p>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی</strong>
<p>معادل بودن <code>Ctrl+C</code> با <code>SIGINT</code> یکی از سؤالات کلاسیک آزمون است:</p>
<div class="code-container"><span class="code-label">نکته</span><div class="code-block no-prompt">Ctrl+C = SIGINT = Signal شماره 2</div></div>
</div></div>

<h3>مقایسه کلی Signalها</h3>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">SIGTERM (15) → درخواست مؤدبانه پایان → قابل مدیریت توسط برنامه

SIGINT (2) → وقفه از صفحه‌کلید (Ctrl+C) → قابل مدیریت توسط برنامه

SIGKILL (9) → پایان اجباری و فوری → غیرقابل نادیده‌گیری

SIGSTOP → توقف اجباری (نه پایان) → غیرقابل نادیده‌گیری</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته طلایی آزمون</strong>
<p>این تقسیم‌بندی را همیشه به خاطر بسپار:</p>
<div class="code-container"><span class="code-label">تقسیم‌بندی</span><div class="code-block no-prompt">قابل نادیده‌گیری توسط برنامه   → SIGTERM, SIGINT
غیرقابل نادیده‌گیری توسط برنامه → SIGKILL, SIGSTOP</div></div>
</div></div>

<h3>چرا معمولاً اول <code>SIGTERM</code> امتحان می‌شود؟</h3>

<p>روال معمول و توصیه‌شده در مدیریت سیستم این است:</p>

<div class="code-container"><span class="code-label">روال</span><div class="code-block no-prompt">1. kill PID          (ارسال SIGTERM)
2. صبر می‌کنیم Process خودش را تمیز ببندد
3. اگر بسته نشد →
4. kill -9 PID        (ارسال SIGKILL به‌عنوان آخرین راه‌حل)</div></div>

<p>دلیل این ترتیب این است که <code>SIGTERM</code> به برنامه فرصت می‌دهد کارهایی مثل ذخیره داده یا آزاد کردن منابع را قبل از بسته شدن انجام دهد؛ در حالی که <code>SIGKILL</code> این فرصت را نمی‌دهد و ممکن است باعث از دست رفتن داده شود.</p>

<div class="code-container"><span class="code-label">توصیه</span><div class="code-block no-prompt">SIGTERM اول → اگر جواب نداد → SIGKILL به‌عنوان آخرین انتخاب</div></div>

<h2>نقشه کلی جلسه</h2>

<div class="code-container"><span class="code-label">نقشه</span><div class="code-block no-prompt">                     Process Management
                            │
        ┌───────────────────┼───────────────────┐
        ↓                    ↓                    ↓
  Foreground/           kill / killall         Signal
  Background                │                    │
        │              PID / Job Number    SIGTERM / SIGKILL /
   & , jobs,                                SIGSTOP / SIGINT
   fg , bg , Ctrl+Z</div></div>

<div class="summary-box">
    <h3>⭐ نکات طلایی آزمون</h3>

    <h4>۱. اجرا در پس‌زمینه</h4>
    <div class="code-container"><span class="code-label">یادآوری</span><div class="code-block no-prompt">command &   → اجرا در Background
jobs        → نمایش Jobهای Shell فعلی</div></div>

    <h4>۲. جابه‌جایی Foreground/Background</h4>
    <div class="code-container"><span class="code-label">یادآوری</span><div class="code-block no-prompt">fg %number   → آوردن به Foreground
Ctrl+Z       → توقف موقت (Stopped)
bg %number   → ادامه در Background</div></div>

    <h4>۳. پایان دادن به Job پس‌زمینه</h4>
    <div class="code-container"><span class="code-label">یادآوری</span><div class="code-block">kill %number</div></div>

    <h4>۴. فرمان <code>kill</code></h4>
    <div class="code-container"><span class="code-label">یادآوری</span><div class="code-block no-prompt">kill PID        → ارسال SIGTERM (پیش‌فرض)
kill -9 PID     → ارسال SIGKILL (اجباری)
killall name    → پایان همه Processهای با یک نام</div></div>

    <h4>۵. جدول Signalها</h4>
    <div class="code-container"><span class="code-label">جدول</span><div class="code-block no-prompt">SIGTERM (15) → خاتمه معمولی، پیش‌فرض kill
SIGKILL (9)  → خاتمه اجباری، غیرقابل‌نادیده‌گیری
SIGSTOP      → توقف اجباری، غیرقابل‌نادیده‌گیری
SIGINT (2)   → وقفه از صفحه‌کلید، معادل Ctrl+C</div></div>
</div>

<div class="quiz-card"><p>❓ تست ۲: سیگنال پیش‌فرضی که با اجرای ساده <code>kill PID</code> (بدون هیچ عددی) ارسال می‌شود کدام است؟</p>

</div>

<div class="quiz-card"><p>❓ تست ۳: کدام گزینه درباره <code>SIGKILL</code> و <code>SIGSTOP</code> صحیح است؟</p>

</div>

<div class="quiz-card"><p>❓ تست ۴: تفاوت اصلی <code>kill</code> و <code>killall</code> چیست؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>kill</code> بر اساس PID عمل می‌کند و <code>killall</code> بر اساس نام Process.</button>
    <button onclick="selectOption(this)">ب) <code>kill</code> فقط برای Sessionهای <code>tmux</code> است.</button>
    <button onclick="selectOption(this)">ج) <code>killall</code> فقط یک Process با کمترین PID را می‌بندد.</button>

<h2>بخش اول — مرور نصب نرم‌افزار</h2>

<div class="quiz-answer"><strong>✅ پاسخ صحیح: ج</strong><br><code>Ctrl+b d</code> عملیات Detach را انجام می‌دهد؛ یعنی فقط از دید ما خارج می‌شود ولی Session در پس‌زمینه فعال باقی می‌ماند. در مقابل، <code>tmux kill-session -t name</code> Session را به‌طور کامل از بین می‌برد.</div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>🎯 جمع‌بندی نهایی فصل دوم</strong><br>
فصل دوم LPIC-1 را با چهار محور اصلی جمع‌بندی می‌کنیم:

<div class="code-container"><span class="code-label">چهار محور</span><div class="code-block no-prompt">1. نصب نرم‌افزار
   apt/dpkg, dnf/rpm, Source, Snap, AppImage, Repository اختصاصی (Zabbix)

2. Library
   Static vs Shared, ldd, chroot

4. مدیریت Session و Process

   kill, killall, Signal (SIGTERM/SIGKILL/SIGSTOP/SIGINT)
   foreground/background (&, jobs, fg, bg, Ctrl+Z)</div></div>

<p>با این جلسه، فصل دوم به پایان رسید. هر زمان آماده بودی، می‌توانیم وارد <strong>فصل سوم</strong> دوره LPIC-1 شویم.</p>

        };

        // ============================================================
        // ۲۶-۳ – ساخت آرایه flat از تمام بخش‌ها برای ناوبری
        // ============================================================
        const allSections = [];
        course.forEach((ch, chIdx) => {
            ch.sections.forEach((sec, secIdx) => {
                allSections.push(Object.assign({}, sec, {
                    chapterId: ch.id,
                    chapterTitle: ch.title,
                    badge: ch.badge,
                    chapterIndex: chIdx,
                    sectionIndex: secIdx,
                    totalInChapter: ch.sections.length
                }));
            });
        });

        let currentIndex = 0; // شاخص بخش فعلی

        // ============================================================
        // ۲۶-۴ – ساخت فهرست مطالب (TOC) به صورت داینامیک
        // ============================================================
        function buildTOC() {
            const toc = document.getElementById('tocNav');
            toc.innerHTML = '';

            course.forEach((ch, idx) => {
                const details = document.createElement('details');
                details.className = 'toc-chapter';
                if (idx === 0) details.open = true; // فصل اول باز باشد

                const summary = document.createElement('summary');
                summary.innerHTML = '<span class="chapter-num">' + ch.badge + '</span><span>' + ch.title +
                '</span>';
                details.appendChild(summary);

                const ul = document.createElement('ul');
                ul.className = 'toc-sections';

                ch.sections.forEach(sec => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = '#' + sec.id;
                    a.textContent = sec.title;
                    a.dataset.id = sec.id;

                    // کلیک روی هر آیتم TOC -> نمایش بخش مربوطه
                    a.addEventListener('click', function(e) {
                        e.preventDefault();
                        const index = allSections.findIndex(s => s.id === sec.id);
                        if (index !== -1) showSection(index);
                    });

                    li.appendChild(a);
                    ul.appendChild(li);
                });

                details.appendChild(ul);
                toc.appendChild(details);
            });
        }

        // ============================================================
        // ۲۶-۵ – ساخت تمام بخش‌ها در محتوای اصلی (با استفاده از richContent یا placeholder)
        // ============================================================
        function buildSections() {
            const main = document.getElementById('mainContent');
            main.innerHTML = '';

            allSections.forEach((sec, idx) => {
                const div = document.createElement('div');
                div.className = 'section' + (idx === 0 ? ' active' : '');
                div.id = sec.id;

                const isFirst = idx === 0;
                const isLast = idx === allSections.length - 1;

                let body = '';

                // اگر محتوای غنی برای این بخش وجود دارد، از آن استفاده کن
                if (richContent[sec.id]) {
                    body = richContent[sec.id];
                } else {
                    // در غیر این صورت یک placeholder نشان بده
                    body = `
                        <div class="section-header">
                            <div class="section-badge">${sec.badge}</div>
                            <div>
                                <h1>${sec.title}</h1>
                                <div class="meta">${sec.chapterTitle} · بخش ${sec.sectionIndex + 1} از ${sec.totalInChapter}</div>
                            </div>
                        </div>
                        <div class="placeholder">
                            <i class="fas fa-laptop-code"></i>
                            <p>محتوای این بخش در حال آماده‌سازی است...</p>
                            <p style="font-size:0.9rem;margin-top:6px;opacity:0.8;">${sec.chapterTitle} — ${sec.title}</p>
                        </div>
                    `;
                }

                // دکمه‌های ناوبری قبلی/بعدی
                body += `
                    <div class="nav-buttons">
                        <button class="nav-btn" ${isFirst ? 'disabled' : ''} onclick="goToPrev()">
                            ${isFirst ? 'بخش قبلی' : '<i class="fas fa-arrow-right"></i> بخش قبلی'}
                        </button>
                        <button class="nav-btn" ${isLast ? 'disabled' : ''} onclick="goToNext()">
                            ${isLast ? 'پایان' : 'بخش بعدی <i class="fas fa-arrow-left"></i>'}
                        </button>
                    </div>
                `;

                div.innerHTML = body;
                main.appendChild(div);
            });
        }

        // ============================================================
        // ۲۶-۶ – توابع نمایش بخش، رفتن به قبلی/بعدی
        // ============================================================
        function showSection(index) {
            if (index < 0 || index >= allSections.length) return;

            currentIndex = index;

            // مخفی کردن همه بخش‌ها و نمایش بخش انتخاب‌شده
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(allSections[index].id);
            if (target) target.classList.add('active');

            // به‌روزرسانی وضعیت active در TOC
            document.querySelectorAll('.toc-sections a').forEach(a => {
                a.classList.remove('active');
                if (a.dataset.id === allSections[index].id) a.classList.add('active');
            });

            // باز کردن فصل مربوطه در TOC
            const chIdx = allSections[index].chapterIndex;
            document.querySelectorAll('.toc-chapter').forEach((d, i) => {
                d.open = (i === chIdx);
            });

            // اسکرول به بالای صفحه
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // در موبایل سایدبار را ببند
            if (window.innerWidth <= 1000) closeSidebar();
        }

        function goToPrev() {
            if (currentIndex > 0) showSection(currentIndex - 1);
        }

        function goToNext() {
            if (currentIndex < allSections.length - 1) showSection(currentIndex + 1);
        }

        // ============================================================
        // ۲۶-۷ – کنترل سایدبار (باز و بستن)
        // ============================================================
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const toggleBtn = document.getElementById('sidebarToggle');
        const closeBtn = document.getElementById('sidebarClose');

        function openSidebar() {
            sidebar.classList.add('open');
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        toggleBtn.addEventListener('click', openSidebar);
        closeBtn.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);

        // ============================================================
        // ۲۶-۸ – تغییر تم (روشن/تاریک) و ذخیره در localStorage
        // ============================================================
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.querySelector('.theme-icon');
            if (theme === 'dark') {
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
            }
        }

        // بارگذاری تم ذخیره‌شده
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        // ============================================================
        // ۲۶-۹ – عملکرد کوئیزها (انتخاب گزینه و نمایش پاسخ)
        // ============================================================
        function selectOption(btn) {
            const parent = btn.parentElement;
            // حذف انتخاب از سایر گزینه‌ها
            parent.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            // نمایش پاسخ
            parent.nextElementSibling.classList.add('show');
        }

        // ============================================================
        // ۲۶-۱۰ – به‌روزرسانی نوار پیشرفت هنگام اسکرول
        // ============================================================
        window.onscroll = function() {
            const scroll = document.documentElement.scrollTop || document.body.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            document.getElementById('progressBar').style.width = (height > 0 ? (scroll / height * 100) : 0) + '%';
        };

        // ============================================================
        // ۲۶-۱۱ – کنترل با صفحه‌کلید (Esc بستن سایدبار، فلش‌ها برای ناوبری)
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSidebar();
            if (e.key === 'ArrowLeft') goToNext();   // در RTL چپ به معنای بعدی است
            if (e.key === 'ArrowRight') goToPrev();  // راست به معنای قبلی
        });

        // ============================================================
        // ۲۶-۱۲ – بسته‌بندی جدول‌ها برای اسکرول افقی روی موبایل (بدون حذف محتوا)
        // ============================================================
        function wrapTables() {
            document.querySelectorAll('.section table').forEach(function(table) {
                if (table.parentElement && table.parentElement.classList.contains('table-wrap')) return;
                var wrap = document.createElement('div');
                wrap.className = 'table-wrap';
                table.parentNode.insertBefore(wrap, table);
                wrap.appendChild(table);
            });
        }

        // ============================================================
        // ۲۶-۱۳ – مقداردهی اولیه: ساخت TOC، بخش‌ها و نمایش بخش اول
        // ============================================================
        buildTOC();
        buildSections();
        wrapTables();
        showSection(0);
    </script>
