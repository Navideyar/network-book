"ch1-11": `
<div class="section-header">
    <div class="section-badge">۱</div>
    <div>
        <h1>لوله (Pipe) و دستور tr</h1>
        <div class="meta">کار با خط فرمان · بخش ۱۱ از ۱۴</div>
    </div>
</div>

<p>در جلسه قبل با <strong>Redirect</strong> آشنا شدیم و یاد گرفتیم چطور خروجی یک دستور را به <strong>فایل</strong> هدایت کنیم. اما گاهی نمی‌خواهیم خروجی را در فایل ذخیره کنیم؛ می‌خواهیم مستقیماً آن را به‌عنوان <strong>ورودی دستور بعدی</strong> بفرستیم. دقیقاً همین‌جاست که مفهوم <strong>Pipe (لوله)</strong> وارد می‌شود؛ یکی از قدرتمندترین و پرکاربردترین ابزارهای خط فرمان لینوکس.</p>

<p>در ادامه این جلسه، با دستور <code>tr</code> هم آشنا می‌شویم که معمولاً همراه با Pipe استفاده می‌شود و برای تبدیل یا حذف کاراکترها به کار می‌رود.</p>

<h2>Pipe چیست؟</h2>

<h3>تفاوت Pipe با Redirect</h3>
<p>در جلسه قبل دیدیم که Redirect (<code>></code> و <code>>></code>) خروجی یک دستور را به یک <strong>فایل</strong> می‌فرستد:</p>
<div class="code-container"><span class="code-label">Redirect</span><div class="code-block no-prompt">command  ──▶  >  ──▶  file</div></div>

<p>اما Pipe (نماد <code>|</code>) خروجی (STDOUT) یک دستور را مستقیماً به‌عنوان <strong>ورودی (STDIN)</strong> دستور بعدی می‌فرستد؛ بدون اینکه هیچ فایل واسطه‌ای ساخته شود:</p>
<div class="code-container"><span class="code-label">Pipe</span><div class="code-block no-prompt">command1  ──▶  |  ──▶  command2\n   (STDOUT)          (STDIN)</div></div>

<div class="code-container"><span class="code-label">جریان داده</span><div class="code-block no-prompt">┌───────────┐        ┌───────────┐\n│ command1  │──STDOUT──▶│ command2  │──▶ Screen\n└───────────┘   (|)   └───────────┘</div></div>

<h3>چرا Pipe این‌قدر مهم است؟</h3>
<p>در لینوکس، فلسفه‌ی اصلی این است که هر دستور، <strong>یک کار مشخص را به بهترین شکل انجام دهد</strong> (مثلاً <code>grep</code> فقط جستجو می‌کند، <code>sort</code> فقط مرتب می‌کند، <code>wc</code> فقط می‌شمارد). با Pipe می‌توانیم چند دستور کوچک را به هم زنجیر کنیم و یک ابزار قدرتمند و سفارشی بسازیم؛ دقیقاً مثل قطعات لگو که کنار هم یک ساختار بزرگ‌تر می‌سازند.</p>

<h3>نماد Pipe</h3>
<p>نماد Pipe در لینوکس علامت <code>|</code> است (روی اکثر کیبوردها با ترکیب <code>Shift</code> و کلید بالای <code>Enter</code> تایپ می‌شود).</p>

<h2>مثال‌های ساده Pipe</h2>

<h3>مثال ۱: ترکیب <code>ls</code> و <code>less</code></h3>
<p>اگر یک پوشه فایل‌های زیادی داشته باشد، خروجی <code>ls -l</code> ممکن است از صفحه نمایش بیرون بزند. با Pipe می‌توانیم آن را به <code>less</code> بفرستیم تا صفحه‌به‌صفحه مشاهده کنیم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls -l /etc | less</div></div>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">ls -l /etc\n     │\n     ▼ (STDOUT)\n    less   ─▶  نمایش صفحه‌به‌صفحه با قابلیت جستجو و اسکرول</div></div>

<h3>مثال ۲: ترکیب <code>cat</code> و <code>grep</code></h3>
<p>نمایش فقط خطوطی از یک فایل که شامل کلمه <code>error</code> هستند:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat logfile.txt | grep "error"</div></div>

<h3>مثال ۳: ترکیب <code>ls</code> و <code>wc</code></h3>
<p>شمارش تعداد فایل‌ها و پوشه‌های داخل یک مسیر:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls -1 /etc | wc -l</div></div>
<p>در این‌جا <code>ls -1</code> هر آیتم را در یک خط جداگانه چاپ می‌کند و <code>wc -l</code> تعداد خطوط (یعنی تعداد آیتم‌ها) را می‌شمارد.</p>

<h3>مثال ۴: زنجیره‌ای از چند Pipe</h3>
<p>می‌توانید بیش از دو دستور را هم به هم زنجیر کنید. مثلاً پیدا کردن پرتکرارترین شل ورودی کاربران در فایل <code>/etc/passwd</code>:</p>
<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block">cat /etc/passwd | cut -d':' -f7 | sort | uniq -c | sort -nr | head -5</div></div>

<p>بیایید این زنجیره را قدم‌به‌قدم بررسی کنیم:</p>
<div class="code-container"><span class="code-label">مراحل</span><div class="code-block no-prompt">cat /etc/passwd            → نمایش کل فایل\n   │\n   ▼ |\ncut -d':' -f7               → استخراج فیلد هفتم (مسیر شل هر کاربر)\n   │\n   ▼ |\nsort                        → مرتب‌سازی الفبایی (پیش‌نیاز uniq)\n   │\n   ▼ |\nuniq -c                     → شمارش تعداد تکرار هر مقدار\n   │\n   ▼ |\nsort -nr                    → مرتب‌سازی عددی نزولی (بیشترین تکرار اول)\n   │\n   ▼ |\nhead -5                     → نمایش فقط ۵ مورد اول</div></div>

<p>این مثال به‌خوبی نشان می‌دهد که چطور با ترکیب چند دستور ساده، یک تحلیل نسبتاً پیچیده را بدون نوشتن حتی یک خط کد انجام می‌دهیم.</p>

<h2>Pipe در مقابل Redirect — کدام را کِی استفاده کنیم؟</h2>

<table>
<thead><tr><th>هدف</th><th>ابزار مناسب</th></tr></thead>
<tbody>
<tr><td>ذخیره خروجی یک دستور در یک فایل</td><td>Redirect (<code>></code> یا <code>>></code>)</td></tr>
<tr><td>فرستادن خروجی یک دستور به‌عنوان ورودی دستور دیگر</td><td>Pipe (<code>|</code>)</td></tr>
<tr><td>ذخیره پیام خطا در فایل جداگانه</td><td>Redirect (<code>2></code>)</td></tr>
<tr><td>فیلتر کردن یا پردازش پی‌درپی داده‌ها بدون ساخت فایل واسطه</td><td>Pipe (<code>|</code>)</td></tr>
</tbody>
</table>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>می‌توانید Pipe و Redirect را هم با هم ترکیب کنید؛ مثلاً نتیجه نهایی یک زنجیره Pipe را در فایل ذخیره کنید:</div></div>
<div class="code-container"><span class="code-label">ترکیب</span><div class="code-block">cat /etc/passwd | cut -d':' -f1 | sort > users_sorted.txt</div></div>

<h2>دستور <code>tr</code> چیست؟</h2>
<p><code>tr</code> مخفف <strong>Translate</strong> (ترجمه/تبدیل) است. این دستور برای <strong>تبدیل، حذف یا فشرده‌سازی کاراکترها</strong> در متن استفاده می‌شود.</p>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته بسیار مهم</strong><code>tr</code> نام فایل نمی‌گیرد! برخلاف بیشتر دستوراتی که تا الان دیدیم (مثل <code>grep file</code> یا <code>cut file</code>)، دستور <code>tr</code> <strong>نمی‌تواند مستقیماً نام فایل بگیرد</strong> و فقط از <strong>STDIN</strong> ورودی می‌خواند. به همین دلیل تقریباً همیشه با <strong>Pipe</strong> یا <strong>Redirect ورودی (<code><</code>)</strong> همراه است:</div></div>
<div class="code-container"><span class="code-label">روش صحیح</span><div class="code-block">cat file.txt | tr 'a' 'b'</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">روش صحیح</span><div class="code-block">tr 'a' 'b' < file.txt</div></div>

<p>اگر دستور <code>tr file.txt</code> را مستقیم اجرا کنید، <code>tr</code> نام فایل را به‌عنوان یک <strong>آرگومان تبدیل</strong> در نظر می‌گیرد نه اسم فایل، که نتیجه‌ی نادرستی می‌دهد. این یکی از رایج‌ترین اشتباهات مبتدیان با <code>tr</code> است.</p>

<h2>سینتکس و کاربردهای <code>tr</code></h2>

<h3>سینتکس پایه</h3>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block">tr [options] 'SET1' 'SET2'</div></div>
<p>هر کاراکتری که در <code>SET1</code> باشد، با کاراکتر <strong>متناظر</strong> در <code>SET2</code> جایگزین می‌شود (یعنی کاراکتر اول با کاراکتر اول، دومی با دومی، و به همین ترتیب).</p>

<h3>مثال ۱: تبدیل حروف کوچک به بزرگ</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "hello world" | tr 'a-z' 'A-Z'</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">HELLO WORLD</div></div>
<div class="code-container"><span class="code-label">نحوه تبدیل</span><div class="code-block no-prompt">h e l l o   w o r l d\n│ │ │ │ │       │ │ │ │\n▼ ▼ ▼ ▼ ▼       ▼ ▼ ▼ ▼\nH E L L O   W O R L D</div></div>

<h3>مثال ۲: تبدیل حروف بزرگ به کوچک</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "HELLO WORLD" | tr 'A-Z' 'a-z'</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">hello world</div></div>

<h3>مثال ۳: جایگزینی یک کاراکتر خاص با کاراکتر دیگر</h3>
<p>تبدیل تمام <code>:</code> به <code>,</code> در فایل <code>/etc/passwd</code> (مثلاً برای تبدیل به فرمت CSV):</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat /etc/passwd | tr ':' ','</div></div>

<h3>مثال ۴: حذف کاراکترها با گزینه <code>-d</code></h3>
<p>گزینه <code>-d</code> (Delete) کاراکترهای مشخص‌شده را به‌طور کامل از متن <strong>حذف</strong> می‌کند (بدون جایگزینی با چیز دیگر).</p>
<p>حذف تمام اعداد از یک متن:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "User123 Linux456" | tr -d '0-9'</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">User Linux</div></div>
<p>حذف کاراکترهای Carriage Return (<code>\r</code>) که معمولاً هنگام انتقال فایل از ویندوز به لینوکس باقی می‌مانند:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">tr -d '\r' < windows_file.txt > linux_file.txt</div></div>

<h3>مثال ۵: فشرده کردن کاراکترهای تکراری با <code>-s</code></h3>
<p>گزینه <code>-s</code> (Squeeze) کاراکترهای تکراری و پشت‌سرهم را به <strong>یک کاراکتر</strong> تبدیل می‌کند.</p>
<p>فرض کنید یک متن با چند فاصله پشت‌سرهم داریم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "Hello      World" | tr -s ' '</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Hello World</div></div>
<p>همه فاصله‌های تکراری به یک فاصله تبدیل شدند.</p>

<h3>مثال ۶: ترکیب <code>-d</code> و کلاس‌های کاراکتری آماده</h3>
<p><code>tr</code> از کلاس‌های کاراکتری از پیش تعریف‌شده هم پشتیبانی می‌کند، مثل:</p>
<table>
<thead><tr><th>کلاس</th><th>معنی</th></tr></thead>
<tbody>
<tr><td><code>[:upper:]</code></td><td>حروف بزرگ</td></tr>
<tr><td><code>[:lower:]</code></td><td>حروف کوچک</td></tr>
<tr><td><code>[:digit:]</code></td><td>اعداد</td></tr>
<tr><td><code>[:space:]</code></td><td>فاصله‌ها (Space, Tab, ...)</td></tr>
<tr><td><code>[:punct:]</code></td><td>علائم نگارشی</td></tr>
</tbody>
</table>

<p>مثال: تبدیل حروف کوچک به بزرگ با استفاده از کلاس‌ها (معادل مثال ۱، اما خواناتر):</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "hello world" | tr '[:lower:]' '[:upper:]'</div></div>

<p>مثال: حذف تمام علائم نگارشی از یک متن:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "Hello, World! How are you?" | tr -d '[:punct:]'</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Hello World How are you</div></div>

<h2>ترکیب Pipe با <code>tr</code> در سناریوهای واقعی</h2>

<h3>مثال: شمارش تعداد کلمات یک فایل (هر کلمه در یک خط)</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat file.txt | tr ' ' '\n' | wc -l</div></div>
<p>در اینجا هر فاصله (<code> </code>) با یک خط جدید (<code>\n</code>) جایگزین می‌شود، در نتیجه هر کلمه در یک خط جداگانه قرار می‌گیرد و سپس <code>wc -l</code> تعداد خطوط (یعنی تعداد کلمات) را می‌شمارد.</p>

<h3>مثال: تبدیل فایل با جداکننده Tab به CSV</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat data.tsv | tr '\t' ',' > data.csv</div></div>

<h3>مثال: نرمال‌سازی فاصله‌ها قبل از پردازش با <code>cut</code></h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat messy_file.txt | tr -s ' ' | cut -d' ' -f2</div></div>
<p>اول فاصله‌های تکراری فشرده می‌شوند تا <code>cut</code> بتواند ستون‌ها را درست تشخیص دهد، سپس فیلد دوم استخراج می‌شود.</p>

<div class="summary-box">
<h3>جدول خلاصه گزینه‌های مهم <code>tr</code></h3>
<table>
<thead><tr><th>گزینه</th><th>عملکرد</th></tr></thead>
<tbody>
<tr><td><code>tr 'SET1' 'SET2'</code></td><td>جایگزینی کاراکترهای متناظر</td></tr>
<tr><td><code>tr -d 'SET1'</code></td><td>حذف کامل کاراکترهای موجود در SET1</td></tr>
<tr><td><code>tr -s 'SET1'</code></td><td>فشرده کردن کاراکترهای تکراری پشت‌سرهم به یک کاراکتر</td></tr>
<tr><td><code>tr 'a-z' 'A-Z'</code></td><td>تبدیل حروف کوچک به بزرگ</td></tr>
<tr><td><code>tr '[:lower:]' '[:upper:]'</code></td><td>همان تبدیل بالا با استفاده از کلاس کاراکتری</td></tr>
<tr><td><code>tr -d '[:punct:]'</code></td><td>حذف تمام علائم نگارشی</td></tr>
<tr><td><code>tr -d '\r'</code></td><td>حذف کاراکتر Carriage Return (تبدیل فایل ویندوزی به لینوکسی)</td></tr>
</tbody>
</table>
</div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکات مهم LPIC-1</strong>
<ul>
    <li>⭐ Pipe با نماد <strong><code>|</code></strong> خروجی یک دستور را مستقیماً به ورودی دستور بعدی می‌فرستد، بدون ساخت فایل واسطه.</li>
    <li>⭐ تفاوت اصلی Pipe و Redirect: Redirect خروجی را به <strong>فایل</strong> می‌فرستد، Pipe خروجی را به <strong>دستور دیگر</strong> می‌فرستد.</li>
    <li>⭐ می‌توان چند Pipe را پشت‌سرهم زنجیر کرد تا خروجی‌های میانی به‌ترتیب پردازش شوند.</li>
    <li>⭐ دستور <code>tr</code> مخفف <strong>Translate</strong> است و برای تبدیل، حذف یا فشرده‌سازی کاراکترها استفاده می‌شود.</li>
    <li>⭐ <code>tr</code> <strong>نمی‌تواند مستقیماً نام فایل بگیرد</strong>؛ همیشه باید از طریق Pipe (<code>|</code>) یا Redirect ورودی (<code><</code>) به آن داده شود.</li>
    <li>⭐ گزینه <code>-d</code> در <code>tr</code> برای <strong>حذف</strong> کاراکتر و گزینه <code>-s</code> برای <strong>فشرده کردن</strong> کاراکترهای تکراری استفاده می‌شود.</li>
    <li>⭐ <code>tr 'a-z' 'A-Z'</code> یا معادل آن با کلاس‌های <code>[:lower:]</code> و <code>[:upper:]</code>، رایج‌ترین کاربرد <code>tr</code> برای تبدیل حروف کوچک و بزرگ به هم است.</li>
</ul>
</div></div>

<h2>🧪 تمرین</h2>

<h3>تمرین ۱</h3>
<p>با ترکیب <code>ls -l /etc</code> و <code>less</code> خروجی طولانی یک پوشه را صفحه‌به‌صفحه مشاهده کنید.</p>

<h3>تمرین ۲</h3>
<p>با استفاده از Pipe، تعداد فایل‌های داخل پوشه <code>/etc</code> را با ترکیب <code>ls</code> و <code>wc -l</code> بشمارید.</p>

<h3>تمرین ۳</h3>
<p>یک متن دلخواه را با <code>echo</code> بنویسید و با <code>tr</code> تمام حروف آن را از کوچک به بزرگ تبدیل کنید.</p>

<h3>تمرین ۴</h3>
<p>با <code>tr -d</code> تمام اعداد را از یک رشته متنی حذف کنید.</p>

<h3>تمرین ۵</h3>
<p>یک رشته با چند فاصله پشت‌سرهم بسازید (مثلاً با <code>echo "A   B   C"</code>) و با <code>tr -s ' '</code> فاصله‌های اضافه را به یک فاصله تبدیل کنید.</p>

<h3>تمرین ۶</h3>
<p>با ترکیب <code>cat /etc/passwd</code>، <code>cut</code>، <code>sort</code>، <code>uniq -c</code> و <code>sort -nr</code>، پرتکرارترین شل‌های سیستم را پیدا کنید (مثل مثالی که در بخش دوم دیدید).</p>

<h2>خودآزمایی</h2>

<div class="quiz-card"><p>❓ تست ۱: تفاوت اصلی بین Pipe (<code>|</code>) و Redirect (<code>></code>) در چیست؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) هیچ تفاوتی ندارند و کاملاً یکسان عمل می‌کنند.</button>
    <button onclick="selectOption(this)">ب) Pipe خروجی را به فایل می‌فرستد، Redirect خروجی را به دستور دیگر می‌فرستد.</button>
    <button onclick="selectOption(this)">ج) Redirect خروجی را به فایل می‌فرستد، Pipe خروجی یک دستور را به ورودی دستور دیگر می‌فرستد.</button>
    <button onclick="selectOption(this)">د) Pipe فقط برای فایل‌های متنی کار می‌کند، Redirect برای فایل‌های باینری.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br>Redirect (مثل <code>></code> یا <code>>></code>) خروجی یک دستور را در یک <strong>فایل</strong> ذخیره می‌کند، در حالی که Pipe (<code>|</code>) خروجی (STDOUT) یک دستور را مستقیماً به‌عنوان ورودی (STDIN) دستور بعدی می‌فرستد، بدون ساخت هیچ فایل واسطه‌ای.</div>
</div>

<div class="quiz-card"><p>❓ تست ۲: در دستور <code>cat /etc/passwd | cut -d':' -f1 | sort</code>، ترتیب اجرای عملیات چگونه است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) ابتدا مرتب‌سازی، سپس استخراج فیلد، سپس نمایش فایل.</button>
    <button onclick="selectOption(this)">ب) ابتدا نمایش فایل، سپس استخراج فیلد اول، سپس مرتب‌سازی نتیجه.</button>
    <button onclick="selectOption(this)">ج) هر سه دستور به‌طور هم‌زمان و بدون ارتباط با هم اجرا می‌شوند.</button>
    <button onclick="selectOption(this)">د) فقط آخرین دستور (<code>sort</code>) اجرا می‌شود و بقیه نادیده گرفته می‌شوند.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br>در یک زنجیره Pipe، دستورات به‌ترتیب از چپ به راست اجرا می‌شوند و خروجی هر دستور، ورودی دستور بعدی می‌شود: ابتدا <code>cat</code> محتوای فایل را نمایش می‌دهد، سپس <code>cut</code> فیلد اول (نام کاربری) را استخراج می‌کند و در نهایت <code>sort</code> نتیجه را مرتب می‌کند.</div>
</div>

<div class="quiz-card"><p>❓ تست ۳: چرا معمولاً دستور <code>tr</code> را مستقیماً با نام فایل اجرا نمی‌کنند (مثل <code>tr 'a' 'b' file.txt</code>)؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) چون <code>tr</code> اصلاً فایل نمی‌شناسد و باید حتماً از Pipe استفاده کرد.</button>
    <button onclick="selectOption(this)">ب) چون <code>tr</code> نام فایل را به‌عنوان یک آرگومان تبدیل در نظر می‌گیرد، نه نام فایل ورودی، و نتیجه نادرست می‌شود.</button>
    <button onclick="selectOption(this)">ج) چون <code>tr</code> فقط روی فایل‌های باینری کار می‌کند.</button>
    <button onclick="selectOption(this)">د) چون این کار باعث حذف فایل می‌شود.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>tr</code> طراحی شده تا ورودی را فقط از STDIN بخواند. اگر نام فایل را مستقیم بعد از الگوهای تبدیل بنویسید، <code>tr</code> آن را به‌اشتباه به‌عنوان یکی از آرگومان‌های SET1/SET2 در نظر می‌گیرد، نه اسم فایل؛ به همین دلیل باید از Pipe (<code>|</code>) یا Redirect ورودی (<code><</code>) استفاده شود.</div>
</div>

<div class="quiz-card"><p>❓ تست ۴: دستور <code>tr -s ' '</code> چه کاری انجام می‌دهد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) تمام فاصله‌ها را کاملاً از متن حذف می‌کند.</button>
    <button onclick="selectOption(this)">ب) فاصله‌ها را با کاما جایگزین می‌کند.</button>
    <button onclick="selectOption(this)">ج) فاصله‌های تکراری و پشت‌سرهم را به یک فاصله فشرده می‌کند.</button>
    <button onclick="selectOption(this)">د) فقط اولین فاصله هر خط را حذف می‌کند.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br>گزینه <code>-s</code> (Squeeze) در <code>tr</code> باعث می‌شود کاراکترهای تکراری و پشت‌سرهم (در این مثال فاصله) به یک نمونه از همان کاراکتر فشرده شوند؛ برخلاف <code>-d</code> که کاراکتر را به‌طور کامل حذف می‌کند.</div>
</div>

<div class="quiz-card"><p>❓ تست ۵: کدام دستور، تمام حروف کوچک یک متن ورودی را به حروف بزرگ تبدیل می‌کند؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>tr -d 'a-z'</code></button>
    <button onclick="selectOption(this)">ب) <code>tr 'a-z' 'A-Z'</code></button>
    <button onclick="selectOption(this)">ج) <code>tr -s 'a-z'</code></button>
    <button onclick="selectOption(this)">د) <code>cut -c 'a-z'</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>tr 'a-z' 'A-Z'</code> هر کاراکتر کوچک را با کاراکتر بزرگ متناظر خودش جایگزین می‌کند. گزینه A حروف کوچک را حذف می‌کند (نه تبدیل)، گزینه C فقط تکرارهای پشت‌سرهم را فشرده می‌کند، و <code>cut</code> اصلاً برای تبدیل حروف کاربرد ندارد.</div>
</div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>جمع‌بندی جلسه ۱۱</strong><br>
Pipe و <code>tr</code> دو ابزار قدرتمند برای پردازش داده‌ها در خط فرمان هستند. مهم‌ترین نکات:
<ul>
    <li>Pipe (<code>|</code>) خروجی یک دستور را به‌عنوان ورودی دستور بعدی می‌فرستد.</li>
    <li>برخلاف Redirect که خروجی را به فایل می‌فرستد.</li>
    <li>زنجیره‌ای از Pipeها امکان انجام پردازش‌های پیچیده را بدون نیاز به اسکریپت‌نویسی فراهم می‌کند.</li>
    <li><code>tr</code> برای تبدیل، حذف یا فشرده‌سازی کاراکترها استفاده می‌شود و فقط از STDIN ورودی می‌خواند.</li>
    <li>گزینه‌های مهم <code>tr</code>: <code>-d</code> برای حذف، <code>-s</code> برای فشرده‌سازی.</li>
</ul>
</div></div>

<div class="section-header">
    <div class="section-badge">۱</div>
    <div>
        <h1>ویرایشگر جریانی sed</h1>
        <div class="meta">کار با خط فرمان · بخش ۱۲ از ۱۴</div>
    </div>
</div>

<h2><code>sed</code> چیست؟</h2>
<p><code>sed</code> مخفف <strong>Stream Editor</strong> (ویرایشگر جریانی) است.</p>

<blockquote><code>sed</code> یک ابزار خط فرمانی است که ورودی را به‌صورت <strong>خط‌به‌خط</strong> پردازش می‌کند و بدون باز کردن فایل در ویرایشگر، عملیات <strong>جستجو، جایگزینی، حذف و استخراج متن</strong> را روی آن انجام می‌دهد.</blockquote>

<p>نکته کلیدی در نام «Stream Editor» همین‌جاست: <code>sed</code> فایل را مثل یک <strong>جریان (Stream)</strong> از داده می‌بیند؛ یعنی محتوا را خط‌به‌خط از ابتدا تا انتها می‌خواند، روی هر خط دستور شما را اعمال می‌کند و نتیجه را می‌فرستد بیرون — دقیقاً مثل یک خط تولید کارخانه که هر قطعه (خط) از جلوی یک ایستگاه کاری (دستور <code>sed</code>) رد می‌شود.</p>

<div class="code-container"><span class="code-label">جریان داده</span><div class="code-block no-prompt">خط ۱ ──┐\nخط ۲ ──┤\nخط ۳ ──┼──▶  [ sed 'command' ]  ──▶  خروجی پردازش‌شده\nخط ۴ ──┤\nخط ۵ ──┘</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته بسیار مهم: sed فایل اصلی را تغییر نمی‌دهد!</strong><br>
به‌طور پیش‌فرض، <code>sed</code>:
<ul>
    <li>نتیجه را روی <strong>خروجی استاندارد (STDOUT)</strong> یعنی صفحه نمایش چاپ می‌کند.</li>
    <li><strong>هیچ فایلی را بدون گزینه‌ی صریح (مثل <code>-i</code>) تغییر نمی‌دهد.</strong></li>
</ul>
</div></div>

<p>یعنی وقتی دستوری مثل زیر را اجرا می‌کنید:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed 's/root/admin/' /etc/passwd</div></div>

<p>فایل <code>/etc/passwd</code> <strong>دست‌نخورده</strong> باقی می‌ماند و فقط یک <strong>نسخه‌ی تغییریافته</strong> از آن روی صفحه نمایش داده می‌شود. این ویژگی باعث می‌شود <code>sed</code> ابزاری <strong>امن</strong> برای تست کردن تغییرات باشد، قبل از اینکه واقعاً چیزی را در فایل اصلی دستکاری کنید.</p>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">/etc/passwd (فایل اصلی، دست‌نخورده)\n        │\n        ▼\n       sed\n        │\n        ▼\n خروجی روی صفحه نمایش (نسخه تغییریافته)</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>برای اینکه تغییرات واقعاً روی خود فایل ذخیره شوند، باید از گزینه <code>-i</code> استفاده کنید که در بخش سوم همین جلسه به‌طور کامل توضیح می‌دهیم.</div></div>

<h2>ساختار کلی دستور <code>sed</code></h2>

<p>ساختار پایه:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block">sed [options] 'command' file</div></div>

<table>
<thead><tr><th>بخش</th><th>توضیح</th></tr></thead>
<tbody>
<tr><td><code>options</code></td><td>گزینه‌های اختیاری مثل <code>-i</code> (ویرایش مستقیم فایل) یا <code>-n</code> (فقط نمایش نتایج مشخص)</td></tr>
<tr><td><code>command</code></td><td>دستوری که می‌خواهید روی هر خط اجرا شود (مثل جستجو و جایگزینی، یا حذف خط)</td></tr>
<tr><td><code>file</code></td><td>فایلی که می‌خواهید پردازش شود (اختیاری؛ در صورت نبودن، <code>sed</code> از STDIN می‌خواند)</td></tr>
</tbody>
</table>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>نکته</strong>دستور <code>sed</code> معمولاً داخل <strong>کوتیشن تکی (<code>'...'</code>)</strong> نوشته می‌شود تا Shell کاراکترهای خاص مثل <code>/</code>، <code>$</code> یا <code>*</code> را به‌اشتباه تفسیر نکند.</div></div>

<h3>مهم‌ترین کاربرد <code>sed</code>: جستجو و جایگزینی (Substitute)</h3>

<p>پرکاربردترین دستور داخلی <code>sed</code>، دستور <strong><code>s</code> (Substitute)</strong> است که برای <strong>جایگزین کردن یک عبارت با عبارت دیگر</strong> استفاده می‌شود.</p>

<p>ساختار کلی دستور <code>s</code>:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">s/الگوی جستجو/عبارت جایگزین/flags</div></div>

<div class="code-container"><span class="code-label">اجزا</span><div class="code-block no-prompt">   s        /   root   /   admin   /\n   │            │            │\nدستور جایگزینی   الگوی جستجو    عبارت جایگزین</div></div>

<h4>مثال ۱: جایگزینی ساده (فقط اولین مورد در هر خط)</h4>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed 's/root/admin/' /etc/passwd</div></div>

<p>این دستور در <strong>هر خط</strong> از فایل <code>/etc/passwd</code>، به‌دنبال کلمه <code>root</code> می‌گردد و <strong>فقط اولین مورد پیدا‌شده در هر خط</strong> را با <code>admin</code> جایگزین می‌کند و نتیجه را روی صفحه نمایش می‌دهد.</p>

<p>مثال ورودی:</p>
<div class="code-container"><span class="code-label">ورودی</span><div class="code-block no-prompt">root:x:0:0:root:/root:/bin/bash</div></div>

<p>خروجی بعد از اجرای دستور بالا:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">admin:x:0:0:root:/root:/bin/bash</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>دقت کنید</strong>فقط <strong>اولین</strong> <code>root</code> در خط تبدیل به <code>admin</code> شد؛ دو <code>root</code> دیگر در همان خط دست‌نخورده باقی ماندند. این رفتار پیش‌فرض <code>s</code> است.</div></div>

<h4>مثال ۲: جایگزینی همه موارد در هر خط با فلگ <code>g</code></h4>

<p>اگر بخواهید <strong>همه</strong> موارد تکرار در هر خط جایگزین شوند (نه فقط اولین مورد)، باید از فلگ <code>g</code> (Global) استفاده کنید:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed 's/bash/sh/g' /etc/passwd</div></div>

<p>این دستور تمام کلماتی که با <code>bash</code> مطابقت دارند را در هر خط، با <code>sh</code> جایگزین می‌کند.</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">sed 's/الگو/جایگزین/'     →  فقط اولین مورد در هر خط\nsed 's/الگو/جایگزین/g'    →  همه موارد در هر خط</div></div>

<h4>چند فلگ رایج دیگر برای دستور <code>s</code></h4>

<table>
<thead><tr><th>فلگ</th><th>عملکرد</th></tr></thead>
<tbody>
<tr><td>(بدون فلگ)</td><td>فقط اولین مورد در هر خط جایگزین می‌شود</td></tr>
<tr><td><code>g</code></td><td>همه موارد در هر خط جایگزین می‌شوند (Global)</td></tr>
<tr><td><code>2</code></td><td>فقط دومین مورد در هر خط جایگزین می‌شود</td></tr>
<tr><td><code>gi</code> یا <code>ig</code></td><td>همه موارد و بدون توجه به بزرگی/کوچکی حروف (Case-Insensitive)</td></tr>
<tr><td><code>p</code></td><td>خط تغییریافته را چاپ می‌کند (معمولاً همراه گزینه <code>-n</code> استفاده می‌شود)</td></tr>
</tbody>
</table>

<p>مثال بدون توجه به حروف بزرگ و کوچک:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed 's/root/admin/gi' file.txt</div></div>

<h2>ویرایش مستقیم فایل با <code>-i</code> (In-Place Editing)</h2>

<p>همان‌طور که گفتیم، <code>sed</code> به‌طور پیش‌فرض فقط خروجی را نمایش می‌دهد و فایل اصلی را تغییر نمی‌دهد. اما در بسیاری از کارهای واقعی مدیریت سیستم (مثل تغییر یک فایل پیکربندی)، شما می‌خواهید تغییر واقعاً <strong>روی خود فایل ذخیره شود</strong>. برای این کار از گزینه‌ی <strong><code>-i</code> (In-Place)</strong> استفاده می‌کنیم.</p>

<blockquote>گزینه <code>-i</code> تغییرات را <strong>مستقیماً روی خود فایل</strong> اعمال می‌کند؛ یعنی به‌جای چاپ نتیجه روی صفحه، فایل اصلی با محتوای جدید بازنویسی می‌شود.</blockquote>

<p>مثال کاربردی و بسیار رایج: فعال کردن ورود کاربر <code>root</code> از طریق SSH در فایل تنظیمات سرویس SSH:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed -i 's/PermitRootLogin no/PermitRootLogin yes/' /etc/ssh/sshd_config</div></div>

<div class="code-container"><span class="code-label">تغییر</span><div class="code-block no-prompt">قبل از اجرا (داخل فایل sshd_config):\nPermitRootLogin no\n\nبعد از اجرا (داخل همان فایل، بازنویسی شده):\nPermitRootLogin yes</div></div>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">/etc/ssh/sshd_config\n        │\n        ▼\n   sed -i 's/no/yes/'\n        │\n        ▼\n/etc/ssh/sshd_config   (خود فایل تغییر کرد!)</div></div>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>نکات ایمنی بسیار مهم درباره <code>-i</code></strong><br>
چون <code>-i</code> فایل اصلی را <strong>بازنویسی</strong> می‌کند و هیچ Undo ساده‌ای وجود ندارد، رعایت این نکات ضروری است:
<ol>
    <li><strong>همیشه ابتدا بدون <code>-i</code> تست کنید.</strong> یعنی اول دستور را بدون <code>-i</code> اجرا کنید، خروجی روی صفحه را بررسی کنید، و فقط زمانی که مطمئن شدید نتیجه درست است، <code>-i</code> را اضافه کنید.</li>
    <li><strong>از فایل مهم، پشتیبان (Backup) بگیرید.</strong> بسیاری از نسخه‌های <code>sed</code> (مثل GNU sed در لینوکس) به شما اجازه می‌دهند هم‌زمان با ویرایش، یک نسخه پشتیبان هم بسازید:</li>
</ol>
</div></div>

<div class="code-container"><span class="code-label">پشتیبان</span><div class="code-block">sed -i.bak 's/no/yes/' /etc/ssh/sshd_config</div></div>

<p>در این حالت، قبل از اعمال تغییرات، یک فایل با نام <code>sshd_config.bak</code> (شامل محتوای اصلی و دست‌نخورده) ساخته می‌شود.</p>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">sed -i.bak 's/no/yes/' file.conf\n         │\n         ├──▶ file.conf.bak   (نسخه پشتیبان از قبل تغییر)\n         └──▶ file.conf       (نسخه تغییریافته)</div></div>

<h2>حذف خطوط با <code>sed</code> (Deleting Lines)</h2>

<p>یکی دیگر از کاربردهای بسیار رایج <code>sed</code>، حذف خط یا محدوده‌ای از خطوط از یک فایل یا خروجی است. برای این کار از دستور <strong><code>d</code> (Delete)</strong> استفاده می‌شود.</p>

<h3>حذف یک خط مشخص</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed '5d' file</div></div>
<p>این دستور <strong>خط پنجم</strong> فایل <code>file</code> را حذف می‌کند و بقیه خطوط را (بدون تغییر خط ۵) نمایش می‌دهد.</p>

<div class="code-container"><span class="code-label">نمایش</span><div class="code-block no-prompt">خط ۱\nخط ۲\nخط ۳\nخط ۴\nخط ۵   ◀── حذف می‌شود\nخط ۶</div></div>

<h3>حذف یک محدوده از خطوط</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed '10,20d' file</div></div>
<p>این دستور همه‌ی خطوط از شماره <strong>۱۰ تا ۲۰</strong> (هر دو شامل) را حذف می‌کند.</p>

<div class="code-container"><span class="code-label">نمایش</span><div class="code-block no-prompt">خط ۹\nخط ۱۰  ◀┐\nخط ۱۱   │\n  ...    ├── همه این خطوط حذف می‌شوند\nخط ۱۹   │\nخط ۲۰  ◀┘\nخط ۲۱</div></div>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>یادتان باشد</strong>مثل همیشه، این دستورات بدون <code>-i</code> فقط <strong>نمایش</strong> می‌دهند که فایل بدون آن خطوط چه شکلی خواهد بود؛ فایل اصلی دست‌نخورده باقی می‌ماند مگر اینکه <code>-i</code> را هم اضافه کنید:</div></div>
<div class="code-container"><span class="code-label">ذخیره</span><div class="code-block">sed -i '10,20d' file</div></div>

<h4>چند مثال کاربردی دیگر حذف خط</h4>

<p>حذف <strong>آخرین خط</strong> فایل:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed '$d' file</div></div>
<p>(علامت <code>$</code> در <code>sed</code> به معنای «آخرین خط» است.)</p>

<p>حذف خطوطی که با یک الگوی خاص مطابقت دارند (مثلاً حذف تمام خطوطی که با <code>#</code> شروع می‌شوند، یعنی خطوط کامنت):</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed '/^#/d' file</div></div>

<p>حذف خطوط خالی:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed '/^$/d' file</div></div>

<h2>مروری بر آدرس‌دهی خطوط در <code>sed</code></h2>

<p>قبل از این‌که سراغ تست‌ها برویم، لازم است با مفهوم <strong>آدرس‌دهی خط (Line Addressing)</strong> در <code>sed</code> بیشتر آشنا شوید، چون در اکثر دستورات <code>sed</code> (چه جایگزینی، چه حذف) از همین مفهوم استفاده می‌شود.</p>

<table>
<thead><tr><th>آدرس</th><th>معنی</th><th>مثال</th></tr></thead>
<tbody>
<tr><td><code>N</code></td><td>فقط خط شماره N</td><td><code>sed '5d' file</code></td></tr>
<tr><td><code>N,M</code></td><td>از خط N تا خط M</td><td><code>sed '10,20d' file</code></td></tr>
<tr><td><code>$</code></td><td>آخرین خط فایل</td><td><code>sed '$d' file</code></td></tr>
<tr><td><code>/pattern/</code></td><td>خطوطی که با الگو (Regex) مطابقت دارند</td><td><code>sed '/root/d' file</code></td></tr>
<tr><td><code>N,$</code></td><td>از خط N تا انتهای فایل</td><td><code>sed '5,$d' file</code></td></tr>
</tbody>
</table>

<div class="code-container"><span class="code-label">انواع آدرس</span><div class="code-block no-prompt">فایل\n │\n ├── آدرس عددی (5، 10,20)\n ├── آدرس نمادین ($ = آخرین خط)\n └── آدرس الگویی (/pattern/)</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>همین مفهوم آدرس‌دهی، هم برای دستور <code>d</code> (حذف) و هم برای دستور <code>s</code> (جایگزینی) قابل استفاده است. مثلاً:</div></div>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed '1,5s/root/admin/' file</div></div>
<p>یعنی «فقط در خطوط ۱ تا ۵، کلمه <code>root</code> را با <code>admin</code> جایگزین کن»؛ نه در کل فایل.</p>

<div class="summary-box">
<h3>جدول خلاصه دستورات مهم <code>sed</code></h3>
<table>
<thead><tr><th>دستور</th><th>عملکرد</th></tr></thead>
<tbody>
<tr><td><code>sed 's/old/new/' file</code></td><td>جایگزینی اولین مورد <code>old</code> با <code>new</code> در هر خط (فقط نمایش)</td></tr>
<tr><td><code>sed 's/old/new/g' file</code></td><td>جایگزینی همه موارد <code>old</code> با <code>new</code> در هر خط</td></tr>
<tr><td><code>sed 's/old/new/gi' file</code></td><td>جایگزینی همه موارد، بدون توجه به بزرگی/کوچکی حروف</td></tr>
<tr><td><code>sed -i 's/old/new/' file</code></td><td>جایگزینی و <strong>ذخیره مستقیم</strong> روی خود فایل</td></tr>
<tr><td><code>sed -i.bak 's/old/new/' file</code></td><td>جایگزینی، ذخیره روی فایل + ساخت نسخه پشتیبان <code>.bak</code></td></tr>
<tr><td><code>sed 'Nd' file</code></td><td>حذف خط شماره N</td></tr>
<tr><td><code>sed 'N,Md' file</code></td><td>حذف خطوط از N تا M</td></tr>
<tr><td><code>sed '$d' file</code></td><td>حذف آخرین خط</td></tr>
<tr><td><code>sed '/pattern/d' file</code></td><td>حذف خطوطی که با الگوی مشخص مطابقت دارند</td></tr>
</tbody>
</table>
</div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکات مهم LPIC-1</strong>
<ul>
    <li>⭐ <code>sed</code> مخفف <strong>Stream Editor</strong> است و فایل را به‌صورت <strong>خط‌به‌خط</strong> پردازش می‌کند.</li>
    <li>⭐ به‌طور پیش‌فرض، <code>sed</code> هیچ فایلی را تغییر <strong>نمی‌دهد</strong> و فقط نتیجه را روی STDOUT چاپ می‌کند.</li>
    <li>⭐ برای ذخیره‌ی واقعی تغییرات روی فایل، باید از گزینه‌ی <strong><code>-i</code> (In-Place)</strong> استفاده کرد.</li>
    <li>⭐ دستور <code>s/old/new/</code> بدون فلگ فقط <strong>اولین</strong> مورد در هر خط را تغییر می‌دهد؛ برای تغییر <strong>همه</strong> موارد باید از فلگ <code>g</code> استفاده کرد.</li>
    <li>⭐ دستور <code>d</code> برای <strong>حذف خط</strong> استفاده می‌شود؛ می‌توان با یک عدد (<code>5d</code>)، یک محدوده (<code>10,20d</code>)، نماد <code>$</code> (آخرین خط) یا یک الگو (<code>/pattern/d</code>) آدرس‌دهی کرد.</li>
    <li>⭐ قبل از اجرای <code>sed -i</code> روی فایل‌های مهم (مثل فایل‌های پیکربندی سیستم)، حتماً یا ابتدا بدون <code>-i</code> تست کنید، یا با <code>-i.bak</code> یک نسخه پشتیبان بسازید.</li>
    <li>⭐ دستور <code>sed</code> باید داخل کوتیشن تکی (<code>'...'</code>) نوشته شود تا Shell کاراکترهای خاص را اشتباه تفسیر نکند.</li>
</ul>
</div></div>

<h2>🧪 تمرین</h2>

<h3>تمرین ۱</h3>
<p>یک فایل متنی بسازید که چند بار کلمه‌ی <code>test</code> در خطوط مختلف آن تکرار شده باشد. با <code>sed 's/test/exam/'</code> فقط اولین مورد هر خط را جایگزین کنید و نتیجه را با حالتی که از فلگ <code>g</code> استفاده می‌کنید مقایسه کنید.</p>

<h3>تمرین ۲</h3>
<p>یک کپی از فایل <code>/etc/passwd</code> بگیرید (مثلاً با نام <code>passwd_test</code>) و با دستور زیر همه‌ی موارد <code>bash</code> را در آن به <code>sh</code> تغییر دهید، بدون این‌که فایل اصلی سیستم را تغییر دهید:</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">sed 's/bash/sh/g' passwd_test</div></div>

<h3>تمرین ۳</h3>
<p>روی همان فایل <code>passwd_test</code>، این‌بار با استفاده از <code>-i.bak</code> تغییرات را واقعاً روی فایل ذخیره کنید و بررسی کنید که فایل <code>passwd_test.bak</code> ساخته شده باشد.</p>

<h3>تمرین ۴</h3>
<p>یک فایل ۱۰ خطی بسازید و با <code>sed '5d'</code> خط پنجم را حذف کنید. سپس با <code>sed '3,7d'</code> بررسی کنید خطوط ۳ تا ۷ چطور حذف می‌شوند.</p>

<h3>تمرین ۵</h3>
<p>در همان فایل ۱۰ خطی، آخرین خط را با <code>sed '$d'</code> حذف کنید.</p>

<h3>تمرین ۶</h3>
<p>یک فایل بسازید که چند خط آن با <code>#</code> شروع شود (مثل یک فایل کانفیگ واقعی). با دستور <code>sed '/^#/d' file</code> تمام خطوط کامنت را حذف کنید و فقط خطوط تنظیمات واقعی را ببینید.</p>

</div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>جمع‌بندی جلسه ۱۲</strong><br>
<code>sed</code> یکی از قدرتمندترین ابزارهای ویرایش جریانی در لینوکس است که بدون باز کردن فایل‌ها، تغییرات سریع و خودکار را امکان‌پذیر می‌کند. مهم‌ترین نکات:
<ul>
    <li><code>sed</code> مخفف Stream Editor است و ورودی را خط‌به‌خط پردازش می‌کند.</li>
    <li>به‌طور پیش‌فرض فقط خروجی را نمایش می‌دهد و فایل اصلی را تغییر نمی‌دهد.</li>
    <li>برای ذخیره تغییرات روی فایل از <code>-i</code> استفاده می‌شود (با احتیاط و پشتیبان‌گیری).</li>
    <li>دستور <code>s/old/new/</code> برای جایگزینی، <code>s/old/new/g</code> برای جایگزینی همه موارد.</li>
    <li>دستور <code>d</code> برای حذف خطوط با آدرس‌دهی عددی، الگویی یا نمادین.</li>
    <li><code>sed</code> همراه با Pipe و در اسکریپت‌نویسی کاربرد بسیار گسترده‌ای دارد.</li>
</ul>
</div></div>

<div class="section-header">
    <div class="section-badge">۱</div>
    <div>
        <h1>xargs – تبدیل کنندهٔ خروجی به آرگومان</h1>
        <div class="meta">کار با خط فرمان · بخش ۱۳ از ۱۴</div>
    </div>
</div>

<p><code>xargs</code> یکی از قدرتمندترین و در عین حال کمتر شناخته‌شده‌ترین ابزارهای خط فرمان لینوکس است که در اسکریپت‌نویسی و مدیریت سیستم کاربرد فراوانی دارد. در این جلسه به‌طور کامل با این ابزار آشنا می‌شویم.</p>

<h2>مشکل بنیادین در خط فرمان (و اینکه چرا <code>xargs</code> متولد شد)</h2>

<p>در محیط لینوکس، هر دستور خروجی خود را به‌صورت <strong>متن (stdout)</strong> چاپ می‌کند. با استفاده از <strong>لوله (<code>|</code>)</strong> می‌توانیم این خروجی را به <strong>ورودی استاندارد (stdin)</strong> دستور بعدی بدهیم. اما <strong>همهٔ دستورات</strong> ورودی خود را از stdin نمی‌گیرند!</p>

<p>به مثال ساده توجه کنید:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "myfile.txt" | rm</div></div>

<p>این دستور <strong>کار نمی‌کند</strong>، چون <code>rm</code> منتظر است آرگومان را جلوی خودش ببیند، نه اینکه از stdin بخواند. خطا می‌دهد: <code>rm: missing operand</code></p>

<p>اینجا بود که ابزار <code>xargs</code> ساخته شد تا این <strong>شکاف</strong> را پر کند. <code>xargs</code> <strong>خروجی stdin را می‌خواند، آن را به آرگومان‌های خط فرمان تبدیل می‌کند و دستور مورد نظر را با آن آرگومان‌ها اجرا می‌کند.</strong></p>

<p>پس فرمول کلی:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block">[دستور مولد خروجی] | xargs [دستور هدف] [گزینه‌های xargs]</div></div>

<h2>طرز کار <code>xargs</code> به زبان ساده (جریان داده)</h2>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">┌─────────────────┐\n│  فرمان اول      │  ← مثلاً ls یا find یا cat\n│  (خروجی می‌دهد) │\n└────────┬────────┘\n         │  از طریق لوله (|)\n         ▼\n┌─────────────────┐\n│     xargs        │  ← خروجی را می‌خواند و به آرگومان تبدیل می‌کند\n└────────┬────────┘\n         │  آرگومان‌ها را به دستور هدف می‌دهد\n         ▼\n┌─────────────────┐\n│  فرمان هدف      │  ← مثلاً rm, cp, mkdir, grep, chmod\n│  (اجرا می‌شود)  │\n└─────────────────┘</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته مهم</strong><code>xargs</code> به‌طور پیش‌فرض <strong>از فاصله و خط جدید (newline)</strong> به‌عنوان جداکننده استفاده می‌کند. یعنی هر کلمه یا هر خط را یک آرگومان در نظر می‌گیرد.</div></div>

<h2>گزینه‌های اصلی و حیاتی <code>xargs</code></h2>

<h3>گزینه <code>-n</code> (تعداد آرگومان در هر بار اجرا)</h3>

<p>به <code>xargs</code> می‌گوید: «هر بار بیش از N آرگومان به دستور هدف نده». این گزینه برای زمانی به کار می‌رود که دستور هدف <strong>تعداد مشخصی آرگومان</strong> قبول می‌کند یا می‌خواهیم اجراهای کوچک‌تر و متعدد داشته باشیم.</p>

<p><strong>مثال:</strong></p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo 1 2 3 4 5 | xargs -n 2</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">1 2\n3 4\n5</div></div>

<p><strong>مثال کاربردی‌تر:</strong> فرض کنید می‌خواهید فایل‌ها را به گروه‌های ۵تایی به <code>rm</code> بدهید:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls *.log | xargs -n 5 rm -f</div></div>

<h3>گزینه <code>-I {}</code> (تعریف متغیر جایگزین)</h3>

<p>قدرتمندترین گزینهٔ <code>xargs</code>. وقتی می‌خواهید آرگومان را <strong>در میانهٔ دستور</strong> قرار دهید، نه فقط در انتهای آن، از <code>-I</code> استفاده می‌کنیم.</p>

<p><strong>فرمول:</strong> <code>... | xargs -I {} [دستور] {} [بقیهٔ دستور]</code></p>

<ul>
    <li><code>{}</code> یک <strong>متغیر</strong> است که به‌جای هر آرگومان ورودی قرار می‌گیرد.</li>
    <li>می‌توانید به‌جای <code>{}</code> هر چیز دیگری مثل <code>[file]</code> یا <code>$arg</code> هم بنویسید، ولی <code>{}</code> قرارداد رایج است.</li>
</ul>

<p><strong>مثال ۱: کپی کردن هر فایل به نام جدید با پسوند <code>.bak</code></strong></p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls *.txt | xargs -I {} cp {} {}.bak</div></div>
<p>برای فایل <code>a.txt</code> تبدیل می‌شود به: <code>cp a.txt a.txt.bak</code></p>

<p><strong>مثال ۲: انتقال هر فایل به پوشه‌ای دیگر با همان نام</strong></p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls *.jpg | xargs -I {} mv {} ~/Pictures/</div></div>

<p><strong>مثال ۳: ساخت پوشه به ازای هر فایل (با نام فایل)</strong></p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls *.pdf | xargs -I {} mkdir {}_dir</div></div>

<h3>گزینه <code>-0</code> (جداکنندهٔ null) – ناجی فایل‌های با فاصله</h3>

<p>به‌طور پیش‌فرض، <code>xargs</code> از <strong>فاصله و خط جدید (space و newline)</strong> برای جدا کردن آرگومان‌ها استفاده می‌کند. این یعنی اگر نام فایل شما <code>"my file.pdf"</code> باشد، <code>xargs</code> آن را به <strong>دو آرگومان</strong> <code>my</code> و <code>file.pdf</code> تبدیل می‌کند که باعث خرابی دستور می‌شود.</p>

<p><strong>راه حل:</strong> از ترکیب <code>-print0</code> در دستور مولد و <code>-0</code> در <code>xargs</code> استفاده کنید.</p>
<ul>
    <li><code>-print0</code> در <code>find</code> باعث می‌شود نام فایل‌ها با کاراکتر <strong>null</strong> (<code>\0</code>) از هم جدا شوند (نه فاصله یا Enter).</li>
    <li><code>-0</code> در <code>xargs</code> یعنی «ورودی را با null جدا کن».</li>
</ul>

<p><strong>مثال امن برای حذف فایل‌های موقت:</strong></p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find /tmp -name "*.tmp" -type f -print0 | xargs -0 rm -f</div></div>

<p>حتی اگر فایلی به اسم <code>"my temp file.tmp"</code> باشد، به‌درستی یک آرگومان در نظر گرفته می‌شود.</p>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته</strong>برخی دستورات مثل <code>grep -Z</code> و <code>sort -z</code> هم از null پشتیبانی می‌کنند تا زنجیرهٔ امنی بسازید.</div></div>

<h3>گزینه <code>-p</code> (حالت تعاملی – Interactive)</h3>

<p>قبل از اجرای هر دستور، از شما <strong>سؤال می‌کند</strong> که آیا اجرا شود یا خیر. برای تست و اشکال‌زدایی عالی است.</p>

<p><strong>مثال:</strong></p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "file1.txt file2.txt" | xargs -p rm</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">rm file1.txt file2.txt ?...y</div></div>
<p>شما با زدن <code>y</code> دستور اجرا می‌شود و با <code>n</code> رد می‌شود.</p>

<h3>گزینه <code>-t</code> (حالت verbose – نمایش دستور قبل از اجرا)</h3>

<p>دستوری که قرار است اجرا شود را <strong>چاپ</strong> می‌کند و بعد اجرا می‌کند. بسیار مفید برای آموزش و دیباگ.</p>

<p><strong>مثال:</strong></p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "a.txt b.txt" | xargs -t rm</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">rm a.txt b.txt</div></div>

<h3>گزینه <code>-r</code> (اجرا نکن اگر ورودی خالی باشد)</h3>

<p>اگر <code>xargs</code> هیچ ورودی دریافت نکند، به‌طور پیش‌فرض <strong>یک بار</strong> دستور را با آرگومان خالی اجرا می‌کند (که ممکن است خطرناک باشد). گزینه <code>-r</code> می‌گوید: «اگر ورودی نداشتی، اصلاً اجرا نکن».</p>

<p><strong>مثال:</strong></p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -name "*.nonexist" | xargs -r rm</div></div>

<h2>ترکیب <code>xargs</code> با سایر دستورات – سناریوهای واقعی</h2>

<h3>سناریو ۱: پیدا کردن همه فایل‌های <code>*.conf</code> و تغییر مجوز آنها به <code>644</code></h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find /etc -name "*.conf" -type f | xargs chmod 644</div></div>

<h3>سناریو ۲: گرفتن ۱۰ فایل بزرگ و نمایش جزئیات آنها با <code>ls -lh</code></h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -type f -size +10M | xargs ls -lh</div></div>

<h3>سناریو ۳: حذف همه فایل‌های خالی در یک پوشه (با <code>find</code> و <code>xargs</code>)</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -type f -empty -print0 | xargs -0 rm -v</div></div>

<h3>سناریو ۴: فشرده‌سازی همه فایل‌های <code>*.log</code> با <code>gzip</code></h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls *.log | xargs -n 1 gzip</div></div>

<h3>سناریو ۵: جستجوی یک عبارت در میان همه فایل‌های متنی یک پروژه</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find /project -name "*.py" | xargs grep -n "TODO"</div></div>

<h3>سناریو ۶: ساخت پوشه‌های جدید بر اساس نام فایل‌های موجود در یک لیست</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat folders.txt | xargs -I {} mkdir -p "{}"</div></div>

<h2>اشتباهات رایج و روش‌های جلوگیری</h2>

<table>
<thead><tr><th>اشتباه</th><th>توضیح</th><th>راه حل</th></tr></thead>
<tbody>
<tr><td><strong>استفاده از Pipe مستقیم به دستوراتی مثل <code>rm</code></strong></td><td><code>rm</code> stdin را نمی‌خواند.</td><td>حتماً از <code>xargs</code> استفاده کنید.</td></tr>
<tr><td><strong>فراموش کردن <code>-0</code> در مواجهه با فایل‌های دارای فاصله</strong></td><td>باعث می‌شود فایل‌ها اشتباه گرفته شوند.</td><td>ترکیب <code>-print0</code> و <code>-0</code> را فراموش نکنید.</td></tr>
<tr><td><strong>اجرای دستورات مخرب با <code>rm</code></strong></td><td>ممکن است فایل‌های اشتباه حذف شوند.</td><td>اول با <code>-p</code> یا <code>-t</code> تست کنید، یا از <code>echo</code> به‌جای دستور اصلی استفاده کنید: <code>find ... | xargs echo rm</code></td></tr>
<tr><td><strong>خطای «Argument list too long»</strong></td><td>وقتی تعداد آرگومان‌ها خیلی زیاد است.</td><td><code>xargs</code> خودش این مشکل را حل می‌کند، اما اگر با <code>find</code> و <code>-exec</code> کار می‌کنید، از <code>xargs</code> استفاده کنید.</td></tr>
</tbody>
</table>

<h2>مقایسهٔ <code>xargs</code> با <code>-exec</code> در <code>find</code></h2>

<p>خیلی از کاربران بین این دو سردرگم می‌شوند. تفاوت اصلی:</p>

<table>
<thead><tr><th><code>-exec</code> در <code>find</code></th><th><code>xargs</code></th></tr></thead>
<tbody>
<tr><td>به‌ازای <strong>هر</strong> فایل پیدا شده، یک بار دستور را اجرا می‌کند (مگر اینکه از <code>+</code> استفاده کنید).</td><td>لیست را جمع می‌کند و در <strong>چند بار اجرای بهینه</strong> به دستور می‌دهد.</td></tr>
<tr><td>امن‌تر است (با فاصله در نام فایل مشکلی ندارد).</td><td>نیاز به <code>-0</code> دارد تا با فاصله مشکل نداشته باشد.</td></tr>
<tr><td>کندتر است چون تعداد اجراها زیاد است.</td><td>سریع‌تر است چون تعداد اجراها کمتر است.</td></tr>
</tbody>
</table>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>توصیه</strong>برای کارهای حجیم و سنگین، از <code>xargs</code> استفاده کنید. برای کارهای ساده و امن، <code>-exec</code> کافی است.</div></div>

<div class="summary-box">
<h3>جمع‌بندی نهایی</h3>
<ul>
    <li><strong><code>xargs</code></strong> خروجی stdin را به آرگومان خط فرمان تبدیل می‌کند.</li>
    <li>اگر با فایل‌های دارای <strong>فاصله</strong> سر و کار دارید، همیشه از <code>-0</code> استفاده کنید.</li>
    <li>اگر می‌خواهید آرگومان را در میانهٔ دستور قرار دهید، از <code>-I {}</code> استفاده کنید.</li>
    <li>اگر می‌خواهید تعداد آرگومان‌ها را کنترل کنید، از <code>-n</code> استفاده کنید.</li>
    <li>برای تست و امنیت، از <code>-p</code> یا <code>-t</code> غافل نشوید.</li>
    <li><code>xargs</code> راه حل قطعی برای خطای «Argument list too long» است.</li>
</ul>
</div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکات مهم LPIC-1</strong>
<ul>
    <li>⭐ <code>xargs</code> خروجی stdin را به آرگومان خط فرمان تبدیل می‌کند.</li>
    <li>⭐ <code>-n</code> تعداد آرگومان‌ها در هر بار اجرا را کنترل می‌کند.</li>
    <li>⭐ <code>-I {}</code> برای قرار دادن آرگومان در میانهٔ دستور استفاده می‌شود.</li>
    <li>⭐ <code>-0</code> به همراه <code>-print0</code> در <code>find</code> برای مدیریت امن فایل‌های دارای فاصله استفاده می‌شود.</li>
    <li>⭐ <code>-p</code> حالت تعاملی و <code>-t</code> حالت verbose برای تست و دیباگ.</li>
    <li>⭐ <code>-r</code> از اجرا در صورت ورودی خالی جلوگیری می‌کند.</li>
</ul>
</div></div>

<h2>🧪 تمرین</h2>

<h3>تمرین ۱</h3>
<p>با استفاده از <code>find</code> و <code>xargs</code> همه فایل‌های <code>.txt</code> را پیدا کرده و محتوای آنها را با <code>grep</code> برای کلمه <code>test</code> جستجو کنید.</p>

<h3>تمرین ۲</h3>
<p>یک لیست از نام فایل‌ها در فایل <code>files.txt</code> بسازید و با <code>xargs -I {}</code> هر فایل را به پوشه <code>backup</code> کپی کنید.</p>

<h3>تمرین ۳</h3>
<p>با <code>find</code> و <code>xargs</code> همه فایل‌های <code>.tmp</code> را به‌صورت امن (با <code>-0</code>) حذف کنید.</p>

<h3>تمرین ۴</h3>
<p>از گزینه <code>-n</code> برای حذف فایل‌ها در گروه‌های ۳تایی استفاده کنید.</p>

<h2>خودآزمایی</h2>

<div class="quiz-card"><p>❓ تست ۱: کدام یک از گزینه‌ها به‌درستی بیان می‌کند که چرا دستور زیر <strong>کار نمی‌کند</strong>؟ <code>ls *.txt | rm</code></p>
<div class="quiz-options">

<h2>جمع‌بندی هر بخش با مثال‌های ترکیبی</h2>

<h3>بخش ۱: مسیرها و فایل‌ها (جلسات ۲ و ۳)</h3>
<p><strong>مثال ترکیبی:</strong> یک ساختار پوشه ایجاد کنید، فایل بسازید و محتوای آن را نمایش دهید.</p>
<div class="code-container"><span class="code-label">تمرین ترکیبی</span><div class="code-block">mkdir -p ~/project/{src,docs,backup}
touch ~/project/src/main.py
echo "print('Hello World')" > ~/project/src/main.py
cat ~/project/src/main.py
ls -la ~/project/src/</div></div>

<h3>بخش ۲: متغیرها و تاریخچه (جلسه ۴)</h3>
<p><strong>مثال ترکیبی:</strong> یک متغیر محیطی بسازید و از تاریخچه برای اجرای مجدد استفاده کنید.</p>
<div class="code-container"><span class="code-label">تمرین ترکیبی</span><div class="code-block">export PROJECT_DIR=~/project

history | grep "cd"
# !&lt;number&gt;  # اجرای مجدد یک دستور خاص</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته کلیدی</strong>
<ul>

    <li>همیشه قبل از ویرایش فایل‌های سیستمی، از آنها <strong>بکاپ</strong> بگیرید: <br> <code>cp /etc/hosts /etc/hosts.bak</code></li>
</ul>

<h3>بخش ۴: پردازش فایل‌ها (جلسه ۸)</h3>
<p><strong>مثال ترکیبی:</strong> تعداد خطوط، کلمات و کاراکترهای یک فایل را بگیرید، آن را مرتب کنید و خطوط تکراری را حذف کنید.</p>
<div class="code-container"><span class="code-label">تمرین ترکیبی</span><div class="code-block">wc -l ~/project/src/main.py

<p><strong>مثال ترکیبی:</strong> در تمام فایل‌های <code>.py</code> عبارت <code>TODO</code> را پیدا کنید و با <code>sed</code> آن را به <code>FIXME</code> تبدیل کنید.</p>

<tr><td><strong><code>grep</code></strong></td><td><code>-i</code> = نادیده گرفتن حروف بزرگ/کوچک، <code>-v</code> = خطوطی که <strong>مطابقت ندارند</strong>، <code>-r</code> = جستجوی بازگشتی.</td></tr>
<tr><td><strong>ردایرکت</strong></td><td><code>&gt;</code> = بازنویسی، <code>&gt;&gt;</code> = اضافه کردن، <code>2&gt;</code> = خطاها، <code>&amp;&gt;</code> = همه خروجی‌ها.</td></tr>
<tr><td><strong>Pipe</strong></td><td><code>|</code> فقط stdout را منتقل می‌کند، stderr را نه. برای خطاها از <code>2&gt;&amp;1</code> استفاده کنید.</td></tr>
<tr><td><strong><code>sed</code></strong></td><td><code>sed -i</code> یعنی تغییرات را در خود فایل اعمال کن (خطرناک! از بکاپ بگیرید).</td></tr>
<tr><td><strong><code>xargs</code></strong></td><td>برای فایل‌های دارای فاصله، حتماً از <code>-0</code> و <code>-print0</code> استفاده کنید.</td></tr>
<tr><td><strong><code>vi</code></strong></td><td>حالت Normal: <code>i</code> = Insert، <code>Esc</code> = خروج از Insert، <code>:wq</code> = ذخیره و خروج، <code>:q!</code> = خروج بدون ذخیره.</td></tr>
</tbody>
</table>

<h2>اشتباهات رایج در آزمون (و نحوه جلوگیری)</h2>

<table>
<thead><tr><th>اشتباه</th><th>راه حل</th></tr></thead>
<tbody>
<tr><td>فراموش کردن <code>-</code> قبل از گزینه‌ها</td><td>گزینه‌های کوتاه با <code>-</code> و بلند با <code>--</code> شروع می‌شوند.</td></tr>
<tr><td>قاطی کردن <code>&gt;</code> و <code>&gt;&gt;</code></td><td><code>&gt;</code> فایل را از نو می‌نویسد، <code>&gt;&gt;</code> به انتهای فایل اضافه می‌کند.</td></tr>
<tr><td>استفاده از <code>|</code> با دستوراتی که stdin نمی‌خوانند</td><td>از <code>xargs</code> استفاده کنید.</td></tr>
<tr><td>فراموش کردن <code>-i</code> در <code>sed</code></td><td>بدون <code>-i</code>، <code>sed</code> فقط خروجی را چاپ می‌کند و فایل را تغییر نمی‌دهد.</td></tr>
<tr><td>قاطی کردن <code>vi</code> و <code>vim</code></td><td><code>vi</code> نسخه قدیمی‌تر است، <code>vim</code> نسخه بهبودیافته. در اکثر توزیع‌ها <code>vi</code> در واقع <code>vim</code> است.</td></tr>
</tbody>
</table>

<h2>خودآزمایی جامع (۵ تست چهارگزینه‌ای)</h2>

<div class="quiz-card"><p>❓ تست ۱: کدام دستور، تمام فایل‌های <code>*.tmp</code> را در پوشه جاری و زیرپوشه‌ها پیدا کرده و آنها را <strong>به‌طور امن</strong> (با در نظر گرفتن فاصله در نام فایل‌ها) حذف می‌کند؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>find . -name "*.tmp" | rm</code></button>
    <button onclick="selectOption(this)">ب) <code>find . -name "*.tmp" -exec rm {} \;</code></button>
    <button onclick="selectOption(this)">ج) <code>find . -name "*.tmp" -print0 | xargs -0 rm -f</code></button>
    <button onclick="selectOption(this)">د) <code>rm -rf *.tmp</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ج</strong><br>
ترکیب <code>-print0</code> و <code>-0</code> باعث می‌شود حتی فایل‌های با نام دارای فاصله هم به‌درستی حذف شوند. همچنین <code>-f</code> باعث می‌شود خطاهای مربوط به عدم وجود فایل نادیده گرفته شوند. گزینه الف چون <code>rm</code> stdin را نمی‌خواند، غلط است. گزینه ب گرچه امن است اما کندتر است و از <code>-f</code> استفاده نکرده. گزینه د فقط فایل‌های پوشه جاری را حذف می‌کند و به زیرپوشه‌ها نمی‌رود.</div>
</div>

<div class="quiz-card"><p>❓ تست ۲: با فرض اینکه فایل <code>data.txt</code> شامل ۵ خط متن است، خروجی دستور زیر چیست؟<br> <code>cat data.txt | grep -v "error" | wc -l</code></p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) تعداد کل خطوط فایل</button>
    <button onclick="selectOption(this)">ب) تعداد خطوطی که کلمه "error" در آنها وجود دارد</button>
    <button onclick="selectOption(this)">ج) تعداد خطوطی که کلمه "error" در آنها <strong>وجود ندارد</strong></button>
    <button onclick="selectOption(this)">د) تعداد کلمات فایل به جز "error"</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ج</strong><br>
<code>grep -v</code> یعنی «خطوطی که <strong>مطابقت ندارند</strong> با الگو را نشان بده». پس خطوطی که "error" ندارند انتخاب می‌شوند و <code>wc -l</code> تعداد آنها را می‌شمرد. گزینه الف تعداد کل خطوط را نشان نمی‌دهد، گزینه ب مربوط به <code>grep "error"</code> بدون <code>-v</code> است و گزینه د مربوط به شمارش کلمات نیست.</div>
</div>

<div class="quiz-card"><p>❓ تست ۳: کدام گزینه، دستور <code>sed</code> را به‌درستی توضیح می‌دهد که تمام اعداد موجود در فایل <code>report.txt</code> را با کلمه <code>[NUMBER]</code> جایگزین می‌کند؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>sed 's/[0-9]/[NUMBER]/g' report.txt</code></button>
    <button onclick="selectOption(this)">ب) <code>sed 's/[0-9]*/[NUMBER]/' report.txt</code></button>
    <button onclick="selectOption(this)">ج) <code>sed -i 's/[0-9]/[NUMBER]/g' report.txt</code></button>
    <button onclick="selectOption(this)">د) <code>sed 's/[0-9]+/[NUMBER]/g' report.txt</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ج</strong><br>
<code>-i</code> یعنی تغییرات را در خود فایل اعمال کن. <code>[0-9]</code> یعنی هر رقم از ۰ تا ۹. <code>g</code> یعنی همه موارد در هر خط (Global). گزینه الف بدون <code>-i</code> فقط خروجی را چاپ می‌کند. گزینه ب با <code>*</code> صفر یا چند رقم را جایگزین می‌کند که نتیجه اشتباه می‌دهد. گزینه د از <code>+</code> استفاده کرده که در <code>sed</code> پیش‌فرض پشتیبانی نمی‌شود.</div>
</div>

<div class="quiz-card"><p>❓ تست ۴: کدام گزینه به‌درستی تفاوت بین <code>|</code> (Pipe) و <code>&gt;</code> (Redirect) را توضیح می‌دهد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) Pipe خروجی را به فایل می‌فرستد و Redirect خروجی را به دستور بعدی می‌دهد.</button>
    <button onclick="selectOption(this)">ب) Pipe خروجی را به دستور بعدی می‌دهد و Redirect خروجی را به فایل می‌فرستد.</button>
    <button onclick="selectOption(this)">ج) Pipe خطاها را به فایل می‌فرستد و Redirect خروجی را به دستور بعدی می‌دهد.</button>
    <button onclick="selectOption(this)">د) هر دو کار یکسان را انجام می‌دهند.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ب</strong><br>
<code>|</code> (Pipe) برای <strong>اتصال خروجی یک دستور به ورودی دستور دیگر</strong> استفاده می‌شود. <code>&gt;</code> (Redirect) برای <strong>ذخیره خروجی در یک فایل</strong> استفاده می‌شود. گزینه الف برعکس توضیح داده شده، ج غلط است و د نیز نادرست است.</div>
</div>

<div class="quiz-card"><p>❓ تست ۵: فرض کنید می‌خواهید یک متغیر محیطی به نام <code>MY_PATH</code> بسازید که مسیر پوشه <code>~/Documents</code> را نگهداری کند و در تمام شل‌های جدید هم در دسترس باشد. کدام ترتیب از دستورات صحیح است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>MY_PATH=~/Documents</code><br><code>export MY_PATH</code></button>
    <button onclick="selectOption(this)">ب) <code>export MY_PATH=~/Documents</code></button>
    <button onclick="selectOption(this)">ج) <code>set MY_PATH=~/Documents</code></button>
    <button onclick="selectOption(this)">د) هر دو گزینه الف و ب صحیح هستند.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: د</strong><br>
هر دو روش الف و ب صحیح هستند. در روش اول، متغیر ساخته و سپس <code>export</code> می‌شود. در روش دوم، مستقیماً با <code>export</code> ساخته می‌شود. هر دو متغیر را به متغیر محیطی (محیطی که در شل‌های فرزند هم در دسترس است) تبدیل می‌کنند. گزینه ج با <code>set</code> برای متغیرهای محلی است و در شل‌های جدید در دسترس نیست.</div>
</div>

<div class="section-header">
    <div class="section-badge">۲</div>
    <div>
        <h1>Basic Installations — مبانی نصب نرم‌افزار در Linux</h1>
        <div class="meta">مدیریت نرم‌افزار و فرآیندها · بخش ۱ از ۸</div>

<p>در این جلسه می‌خواهیم <strong>از پایه بفهمیم نرم‌افزار در لینوکس چطور نصب می‌شود</strong> و مهم‌تر از آن، تفاوت خانواده‌های مختلف لینوکس و روش‌های نصب را یاد بگیریم.</p>

<blockquote>هدف این جلسه این نیست که فقط چند دستور حفظ کنی؛ باید در پایان بتوانی تشخیص بدهی <strong>چه نوع بسته‌ای داری، روی چه توزیعی هستی و برای نصب باید از چه ابزاری استفاده کنی.</strong></blockquote>

<h2>نرم‌افزار در Linux چطور نصب می‌شود؟</h2>

<p>در ویندوز معمولاً با فایل‌هایی مثل:</p>
<div class="code-container"><span class="code-label">ویندوز</span><div class="code-block no-prompt">setup.exe
program.msi</div></div>

<p>مواجه می‌شویم.</p>

<p>اما در لینوکس معمولاً نرم‌افزارها به شکل <strong>Package (بسته)</strong> توزیع می‌شوند.</p>

<p>یک Package فقط خود برنامه نیست؛ می‌تواند شامل موارد مختلفی باشد، مثل:</p>
<ul>
    <li>فایل‌های اجرایی برنامه</li>
    <li>فایل‌های Configuration</li>
    <li>مستندات</li>
    <li>کتابخانه‌های موردنیاز</li>
    <li>اطلاعات مربوط به نسخه</li>
    <li>اطلاعات وابستگی‌ها</li>
    <li>اطلاعات مربوط به نصب و حذف برنامه</li>
</ul>

<p>مثلاً فرض کن می‌خواهیم <code>tmux</code> نصب کنیم.</p>

<p>در لینوکس ممکن است یک بسته‌ای شبیه این داشته باشیم:</p>
<div class="code-container"><span class="code-label">Debian</span><div class="code-block no-prompt">tmux_3.4-1_amd64.deb</div></div>

<p>یا در خانواده Red Hat:</p>
<div class="code-container"><span class="code-label">Red Hat</span><div class="code-block no-prompt">tmux-3.4-1.x86_64.rpm</div></div>

<p>هر دو می‌توانند مربوط به <strong>tmux</strong> باشند، ولی فرمت Package آنها متفاوت است.</p>

<h2>دو خانواده اصلی Packageها</h2>

<p>یکی از مهم‌ترین چیزهایی که در LPIC-1 باید بلد باشی این است که توزیع‌های Linux از سیستم‌های Package Management متفاوتی استفاده می‌کنند.</p>

<p>به صورت ساده دو خانواده بسیار مهم داریم:</p>
<div class="code-container"><span class="code-label">خانواده‌ها</span><div class="code-block no-prompt">Debian Family
       ↓
     .deb
       ↓
     apt

Red Hat Family
       ↓
     .rpm
       ↓
   yum / dnf</div></div>

<h3>خانواده Debian</h3>

<p>توزیع‌هایی مثل:</p>
<ul>
    <li>Debian</li>
    <li>Ubuntu</li>
    <li>Linux Mint</li>
    <li>Kali Linux</li>
</ul>

<p>در خانواده Debian قرار می‌گیرند.</p>

<p>فرمت Package اصلی این خانواده:</p>
<div class="code-container"><span class="code-label">فرمت</span><div class="code-block no-prompt">.deb</div></div>

<p>است. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">nginx_1.24.deb</div></div>

<p>برای مدیریت Packageها معمولاً با ابزارهایی مثل:</p>
<div class="code-container"><span class="code-label">ابزار</span><div class="code-block">apt</div></div>

<p>کار می‌کنیم.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo apt install nginx</div></div>

<p>یعنی:</p>
<blockquote>از مخازن تنظیم‌شده، بسته nginx را پیدا کن، وابستگی‌هایش را بررسی کن و نصبش کن.</blockquote>

<h3>خانواده Red Hat</h3>

<p>خانواده مهم دیگر:</p>
<ul>
    <li>Red Hat Enterprise Linux (RHEL)</li>
    <li>Fedora</li>
    <li>Rocky Linux</li>
    <li>AlmaLinux</li>
</ul>

<p>است.</p>

<p>فرمت Package اصلی این خانواده:</p>
<div class="code-container"><span class="code-label">فرمت</span><div class="code-block no-prompt">.rpm</div></div>

<p>است. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">nginx-1.24.rpm</div></div>

<p>در سیستم‌های جدید Red Hat معمولاً از:</p>
<div class="code-container"><span class="code-label">ابزار</span><div class="code-block">dnf</div></div>

<p>استفاده می‌شود.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo dnf install nginx</div></div>

<p>در سیستم‌های قدیمی‌تر یا برخی محیط‌ها ممکن است:</p>
<div class="code-container"><span class="code-label">ابزار قدیمی</span><div class="code-block">yum</div></div>

<p>را ببینی. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo yum install nginx</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>رابطه مهم</strong>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Debian → .deb → apt
Red Hat → .rpm → dnf / yum</div></div>
</div></div>

<h2>یک نکته بسیار مهم: Package Format با Package Manager یکی نیست</h2>

<p>این مورد در آزمون مهم است.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">.deb</div></div>

<p>یک <strong>فرمت Package</strong> است.</p>

<p>ولی:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">apt</div></div>

<p>یک <strong>Package Management Tool</strong> است.</p>

<p>یعنی این دو یکی نیستند.</p>

dnf → ابزار مدیریت Package</div></div>

<ul>

    <li>❌ <code>.deb</code> ابزار نصب نیست.</li>
    <li>❌ <code>dnf</code> فرمت Package نیست.</li>
    <li>✅ <code>.deb</code> → Package Format</li>
    <li>✅ <code>apt</code> → ابزار مدیریت Package</li>
    <li>✅ <code>.rpm</code> → Package Format</li>
    <li>✅ <code>dnf</code> → ابزار مدیریت Package</li>
</ul>
</div></div>

<h2>نصب Offline و Online</h2>

<p>حالا به یکی از مفاهیم مهم جلسه می‌رسیم.</p>

<p>به صورت ساده نصب نرم‌افزار را می‌توانیم به دو حالت تقسیم کنیم:</p>
<div class="code-container"><span class="code-label">روش‌های نصب</span><div class="code-block no-prompt">نصب محلی (Offline / Local)
نصب از Repository (Online / Repository-based)</div></div>

<h3>نصب محلی — Local Installation</h3>

<p>فرض کن یک فایل Package روی سیستم خودت داری.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">tmux.deb</div></div>

<p>و این فایل در مسیر فعلی قرار دارد.</p>

<p>در Debian می‌توانی از ابزارهایی مثل <code>dpkg</code> برای نصب مستقیم فایل استفاده کنی:</p>
<div class="code-container"><span class="code-label">نصب محلی Debian</span><div class="code-block">sudo dpkg -i tmux.deb</div></div>

<p>اینجا فایل Package <strong>از روی کامپیوتر خودت</strong> نصب می‌شود.</p>

<p>در خانواده Red Hat هم می‌توان Package محلی RPM را مستقیماً با <code>rpm</code> نصب کرد:</p>
<div class="code-container"><span class="code-label">نصب محلی Red Hat</span><div class="code-block">sudo rpm -i tmux.rpm</div></div>

<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Local Package
      ↓
 ┌───────────┐
 │  Debian   │ → dpkg
 └───────────┘

 ┌───────────┐
 │ Red Hat   │ → rpm
 └───────────┘</div></div>

<h3>نصب Online / Repository-based</h3>

<p>حالا فرض کن فایل <code>.deb</code> یا <code>.rpm</code> را نداری.</p>

<p>می‌خواهی خود سیستم آن را از اینترنت دریافت کند.</p>

<p>اینجا ابزارهایی مثل:</p>
<div class="code-container"><span class="code-label">ابزار</span><div class="code-block">apt</div></div>

<p>و:</p>
<div class="code-container"><span class="code-label">ابزار</span><div class="code-block">dnf</div></div>

<p>خیلی مهم می‌شوند.</p>

<p>مثلاً در Debian:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo apt install nginx</div></div>

<p>سیستم تقریباً این کارها را انجام می‌دهد:</p>
<div class="code-container"><span class="code-label">مراحل</span><div class="code-block no-prompt">1. Repositoryها را بررسی می‌کند
          ↓
2. Package موردنظر را پیدا می‌کند
          ↓
3. Dependencyها را بررسی می‌کند
          ↓
4. Packageهای لازم را دانلود می‌کند
          ↓
5. آنها را نصب می‌کند</div></div>

<p>در Red Hat هم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo dnf install nginx</div></div>

<p>عملکرد مشابهی دارد.</p>

<h2>Dependency چیست؟</h2>

<p>یکی از مهم‌ترین مفاهیم Package Management همین <strong>Dependency</strong> است.</p>

<p>فرض کن برنامه‌ای به سه کتابخانه دیگر نیاز دارد:</p>
<div class="code-container"><span class="code-label">وابستگی</span><div class="code-block no-prompt">MyProgram
   │
   ├── Library A
   ├── Library B
   └── Library C</div></div>

<p>یعنی MyProgram بدون این کتابخانه‌ها ممکن است درست کار نکند.</p>

<p>به این نیازها می‌گوییم:</p>
<blockquote><strong>Dependency</strong></blockquote>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">Program A
   ↓
needs
   ↓
Library B</div></div>

<p>در این حالت <code>Library B</code> یک Dependency برای Program A است.</p>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>مدیریت Dependencyها یکی از دلایل اصلی استفاده از Package Managerهای سطح بالا مثل <code>apt</code> و <code>dnf</code> است.</div></div>

<h2>چرا apt و dnf مهم‌تر از dpkg و rpm هستند؟</h2>

<p>این سؤال خیلی مهم است.</p>

<p><code>dpkg</code> و <code>rpm</code> می‌توانند Package را نصب کنند، اما در مدیریت Dependencyها محدودتر از ابزارهای سطح بالاتر هستند.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo dpkg -i program.deb</div></div>

<p>ممکن است با خطای Dependency مواجه شود.</p>

<p>اما:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo apt install program</div></div>

<p>می‌تواند Repositoryها را بررسی کند و Dependencyهای لازم را نیز دریافت کند.</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">dpkg / rpm
     ↓
کار با Packageهای محلی و سطح پایین‌تر

apt / dnf
     ↓
مدیریت Package + Repository + Dependency</div></div>

<p>این تفاوت را خوب یاد بگیر.</p>

<h2>Repository چیست؟</h2>

<p>حالا می‌رسیم به مفهوم <strong>Repository</strong>.</p>

<p>Repository را می‌توانی مثل یک <strong>انبار نرم‌افزاری</strong> در نظر بگیری.</p>

<p>در آنجا تعداد زیادی Package قرار دارد. مثلاً:</p>
<div class="code-container"><span class="code-label">مخزن</span><div class="code-block no-prompt">Repository
│
├── nginx
├── tmux
├── vim
├── curl
├── git
├── python3
└── ...</div></div>

<p>وقتی اجرا می‌کنی:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo apt install tmux</div></div>

<p>سیستم معمولاً Package را از Repositoryهای تنظیم‌شده دریافت می‌کند.</p>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">Computer
    │
    │ درخواست tmux
    ↓
Repository
    │
    │ tmux package
    ↓
Computer</div></div>

<h3>Repository الزاماً به معنی اینترنت نیست</h3>

<p>یک نکته ظریف:</p>

<p>Repository می‌تواند روی اینترنت باشد، اما الزاماً نباید اینترنتی باشد.</p>

<p>می‌توان Repository داخلی در یک شبکه هم داشت. مثلاً در یک شرکت:</p>
<div class="code-container"><span class="code-label">شبکه داخلی</span><div class="code-block no-prompt">          Internal Network

PC1 ───────┐
PC2 ───────┤

PC4 ───────┘</div></div>

<p>در این حالت کامپیوترها Packageها را از یک Repository داخلی دریافت می‌کنند.</p>

<p>پس مفهوم اصلی Repository:</p>
<blockquote>منبع سازمان‌یافته‌ای برای ارائه Packageها.</blockquote>

<h2>Binary چیست؟</h2>

<p><strong>Binary</strong></p>

<p>Binary معمولاً به فایل اجرایی یا داده‌ای در قالب باینری اشاره دارد.</p>

<p>مثلاً ممکن است executable یک برنامه در:</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">/usr/bin/</div></div>

<p>قرار بگیرد. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">/usr/bin/tmux
/usr/bin/ls
/usr/bin/curl</div></div>

<p>وقتی اجرا می‌کنی:</p>
<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">tmux</div></div>

<p>Shell فایل اجرایی مناسب را پیدا کرده و اجرا می‌کند.</p>

<h3>ارتباط Package با Binary</h3>

<p>این رابطه را خوب در ذهنت نگه دار:</p>
<div class="code-container"><span class="code-label">رابطه</span><div class="code-block no-prompt">Package
   ↓
شامل فایل‌های مختلف
   ↓
Binary + Config + Documentation + ...
   ↓
بعد از نصب در مسیرهای مناسب قرار می‌گیرند</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">tmux.deb
    ↓
    نصب
    ↓
/usr/bin/tmux</div></div>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">tmux.deb        → خود Package است.
