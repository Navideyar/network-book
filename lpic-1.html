"ch3-disk-concepts": `
<div class="section-header">
    <div class="section-badge">۳</div>
    <div>
        <h1>Disk Concepts — دیسک، Partition، Filesystem و Mount</h1>
        <div class="meta">سخت‌افزار، دیسک و سیستم فایل · بخش ۴ از ۱۰</div>
    </div>
</div>

<p>در سه جلسه قبل، از <strong>Hardware</strong> و <strong>Kernel</strong> و <strong>Kernel Module</strong> عبور کردیم.</p>

<p>حالا می‌خواهیم یکی از مهم‌ترین بخش‌های کار با Linux را یاد بگیریم:</p>

<blockquote><strong>Linux چگونه با Disk و Storage کار می‌کند؟</strong></blockquote>

<p>طبق درسنامه، در این جلسه هنوز وارد کار عملی <code>fdisk</code> نمی‌شویم؛ اول باید ساختار ذهنی درستی از Disk، Partition، Filesystem و Mount داشته باشیم.</p>

<h2>اول از همه: Disk چیست؟</h2>

<p>وقتی می‌گوییم:</p>

<div class="code-container"><span class="code-label">Disk</span><div class="code-block no-prompt">Disk</div></div>

<p>منظورمان یک وسیله‌ی ذخیره‌سازی است.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">انواع</span><div class="code-block no-prompt">HDD
SSD</div></div>

<p>هر دو می‌توانند به عنوان Disk در سیستم استفاده شوند.</p>

<p>فرض کن یک SSD با ظرفیت 500GB به سیستم وصل کرده‌ای:</p>

<div class="code-container"><span class="code-label">دیسک فیزیکی</span><div class="code-block no-prompt">Physical Disk
     ↓
   500 GB</div></div>

<p>اما آیا همین الان می‌توانی داخل آن فایل ایجاد کنی؟</p>

<p><strong>نه.</strong></p>

<p>چون هنوز باید مشخص کنیم فضای Disk چگونه سازمان‌دهی شود.</p>

<p>در یک سناریوی معمول، با این لایه‌ها روبه‌رو می‌شویم:</p>

<div class="code-container"><span class="code-label">لایه‌ها</span><div class="code-block no-prompt">Physical Disk
      ↓
   Partition
      ↓
  Filesystem
      ↓
    Mount
      ↓
Files & Directories</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>⭐ این زنجیره یکی از مهم‌ترین چیزهای کل جلسه است.</strong></div></div>

<h2>Disk در Linux کجا دیده می‌شود؟</h2>

<p>Linux سخت‌افزارها را از طریق Device Fileها در مسیر:</p>

<div class="code-container"><span class="code-label">/dev</span><div class="code-block no-prompt">/dev</div></div>

<p>در اختیار سیستم قرار می‌دهد.</p>

<p>بنابراین ممکن است Diskها را به شکل زیر ببینی:</p>

<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">/dev/sda
/dev/sdb
/dev/sdc</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">تفسیر</span><div class="code-block no-prompt">/dev/sda
   ↓
Disk اول

/dev/sdb
   ↓
Disk دوم</div></div>

<h2><code>sda</code> یعنی چه؟</h2>

<p>به این نام دقت کن:</p>

<div class="code-container"><span class="code-label">نام</span><div class="code-block no-prompt">/dev/sda</div></div>

<p>قسمت:</p>

<div class="code-container"><span class="code-label">sd</span><div class="code-block no-prompt">sd</div></div>

<p>به خانواده نام‌گذاری دستگاه‌های Storage اشاره می‌کند و حرف آخر معمولاً Diskها را از یکدیگر متمایز می‌کند.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">ترتیب</span><div class="code-block no-prompt">sda → Disk اول
sdb → Disk دوم
sdc → Disk سوم</div></div>

<p>پس اگر سه Disk داشته باشیم، ممکن است:</p>

<div class="code-container"><span class="code-label">سه دیسک</span><div class="code-block no-prompt">/dev/sda
/dev/sdb
/dev/sdc</div></div>

<p>را ببینیم.</p>

<h2>Interfaceهای Disk</h2>

<p>Diskها از طریق Interfaceهای مختلفی به سیستم متصل می‌شوند.</p>

<p>در این مبحث سه مورد را بشناس:</p>

<div class="code-container"><span class="code-label">رابط‌ها</span><div class="code-block no-prompt">PATA
SATA
SCSI</div></div>

<h3>PATA</h3>

<p>PATA یک Interface قدیمی‌تر است.</p>

<p>ویژگی کلی:</p>

<div class="code-container"><span class="code-label">PATA</span><div class="code-block no-prompt">PATA
 ↓
Parallel
 ↓
قدیمی‌تر
 ↓
کابل پهن</div></div>

<p>امروزه بیشتر از نظر تاریخی با آن مواجه می‌شویم.</p>

<h3>SATA</h3>

<p>SATA مخفف:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">Serial ATA</div></div>

<p>است.</p>

<p>در مقایسه با PATA، انتقال داده به صورت Serial انجام می‌شود.</p>

<p>برای حفظ کردن:</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">PATA → Parallel → قدیمی

SATA → Serial → رایج</div></div>

<h3>SCSI</h3>

<p>SCSI هم یکی از استانداردهای مهم Storage است که به‌خصوص در محیط‌های Server اهمیت دارد.</p>

<p>برای این جلسه همین مقدار کافی است:</p>

<div class="code-container"><span class="code-label">SCSI</span><div class="code-block no-prompt">SCSI
 ↓
Storage / Server</div></div>

<h2>Partition چیست؟</h2>

<p>حالا به یکی از مهم‌ترین مفاهیم می‌رسیم.</p>

<p>فرض کن یک Disk داریم:</p>

<div class="code-container"><span class="code-label">دیسک</span><div class="code-block no-prompt">/dev/sda</div></div>

<p>با ظرفیت:</p>

<div class="code-container"><span class="code-label">ظرفیت</span><div class="code-block no-prompt">500 GB</div></div>

<p>می‌توانیم این Disk را به قسمت‌های منطقی تقسیم کنیم:</p>

<div class="code-container"><span class="code-label">تقسیم</span><div class="code-block no-prompt">/dev/sda
│
├── /dev/sda1 → 100 GB
├── /dev/sda2 → 200 GB
└── /dev/sda3 → 200 GB</div></div>

<p>هر کدام از این قسمت‌ها یک:</p>

<div class="code-container"><span class="code-label">Partition</span><div class="code-block no-prompt">Partition</div></div>

<p>هستند.</p>

<p>پس:</p>

<blockquote><strong>Partition یعنی تقسیم کردن فضای یک Disk به بخش‌های منطقی.</strong></blockquote>

<h2>نام‌گذاری Partitionها</h2>

<p>به این دو دقت کن:</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">/dev/sda
/dev/sda1</div></div>

<p>اولی:</p>

<div class="code-container"><span class="code-label">دیسک</span><div class="code-block no-prompt">/dev/sda
↓
Disk</div></div>

<p>دومی:</p>

<div class="code-container"><span class="code-label">پارتیشن</span><div class="code-block no-prompt">/dev/sda1
↓
Partition اول</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">/dev/sda
│
├── /dev/sda1
├── /dev/sda2
└── /dev/sda3</div></div>

<p>یعنی Disk <code>sda</code> سه Partition دارد.</p>

<div class="box important"><i class="fas fa-star"></i><div><strong>⭐ پس:</strong><br>
<code>/dev/sda  → Disk</code><br>
<code>/dev/sda1 → Partition 1</code><br>
<code>/dev/sda2 → Partition 2</code><br>
<code>/dev/sda3 → Partition 3</code><br>
این نام‌گذاری را در جلسه بعد هنگام کار با <code>fdisk</code> بسیار زیاد خواهی دید.</div></div>

<h2>چرا Disk را Partition می‌کنیم؟</h2>

<p>فرض کن تمام فضای Disk یک فضای واحد باشد:</p>

<div class="code-container"><span class="code-label">بدون Partition</span><div class="code-block no-prompt">Disk
 ↓
Everything</div></div>

<p>می‌توانیم با Partition کردن، بخش‌های مختلف را از هم جدا کنیم.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">با Partition</span><div class="code-block no-prompt">Disk
│
├── System
│
└── Data</div></div>

<p>این جداسازی می‌تواند مدیریت فضا را راحت‌تر کند.</p>

<p>پس یکی از اهداف Partitioning:</p>

<blockquote><strong>جدا کردن بخش‌های مختلف داده و فضای سیستم است.</strong></blockquote>

<h2>Partition Table چیست؟</h2>

<p>حالا یک سؤال مهم:</p>

<p>Linux از کجا می‌فهمد Partitionهای یک Disk کجا هستند؟</p>

<p>اطلاعات مربوط به ساختار Partitionهای Disk در چیزی به نام:</p>

<div class="code-container"><span class="code-label">Partition Table</span><div class="code-block no-prompt">Partition Table</div></div>

<p>نگهداری می‌شود.</p>

<p>دو نوع بسیار مهم:</p>

<div class="code-container"><span class="code-label">انواع</span><div class="code-block no-prompt">MBR
GPT</div></div>

<p>هستند.</p>

<p>این قسمت برای LPIC-1 <strong>خیلی مهم</strong> است.</p>

<h2>MBR چیست؟</h2>

<p>MBR مخفف:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">Master Boot Record</div></div>

<p>است.</p>

<p>یک روش قدیمی‌تر برای Partitioning است.</p>

<p>یکی از محدودیت‌های معروف MBR:</p>

<blockquote>حداکثر <strong>۴ Primary Partition</strong>.</blockquote>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">MBR</span><div class="code-block no-prompt">Disk
│
├── Primary 1
├── Primary 2
├── Primary 3
└── Primary 4</div></div>

<p>اما Linux و سیستم‌های قدیمی برای حل این محدودیت راهکاری داشتند.</p>

<h2>Extended و Logical Partition</h2>

<p>یکی از Primary Partitionها می‌توانست:</p>

<div class="code-container"><span class="code-label">Extended</span><div class="code-block no-prompt">Extended Partition</div></div>

<p>باشد.</p>

<p>بعد داخل آن می‌توان Partitionهای منطقی ایجاد کرد:</p>

<div class="code-container"><span class="code-label">Logical</span><div class="code-block no-prompt">Logical Partition</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">Disk
│
├── Primary
├── Primary
├── Primary
└── Extended
       │
       ├── Logical
       ├── Logical
       └── Logical</div></div>

<p>بنابراین:</p>

<div class="code-container"><span class="code-label">انواع</span><div class="code-block no-prompt">Primary
Extended
Logical</div></div>

<p>را بیشتر در ساختار <strong>MBR</strong> می‌بینی.</p>

<h2>شماره‌گذاری در MBR</h2>

<p>در مدل سنتی MBR معمولاً:</p>

<div class="code-container"><span class="code-label">شماره‌گذاری</span><div class="code-block no-prompt">/dev/sda1
/dev/sda2
/dev/sda3
/dev/sda4</div></div>

<p>برای چهار Partition ابتدایی استفاده می‌شوند.</p>

<p>Partitionهای Logical معمولاً از شماره‌های بالاتر شروع می‌شوند:</p>

<div class="code-container"><span class="code-label">Logical</span><div class="code-block no-prompt">/dev/sda5
/dev/sda6
/dev/sda7</div></div>

<p>پس یک تصویر ذهنی خوب:</p>

<div class="code-container"><span class="code-label">شناسایی</span><div class="code-block no-prompt">sda1 → Primary
sda2 → Primary
sda3 → Primary
sda4 → Primary / Extended

sda5 → Logical
sda6 → Logical
...</div></div>

<p>این همان مدل سنتی‌ای است که برای LPIC-1 باید بشناسی.</p>

<h2>GPT چیست؟</h2>

<p>GPT مخفف:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">GUID Partition Table</div></div>

<p>است.</p>

<p>GPT روش جدیدتر Partitioning است و برای برطرف کردن بسیاری از محدودیت‌های MBR طراحی شده است.</p>

<p>به صورت آموزشی معمولاً این دو را کنار هم می‌بینیم:</p>

<div class="code-container"><span class="code-label">جفت‌ها</span><div class="code-block no-prompt">BIOS  → MBR
UEFI  → GPT</div></div>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>⚠️ اما این را به عنوان یک قانون مطلق حفظ نکن.</strong><br>این فقط یک <strong>جفت آموزشی رایج</strong> است؛ از نظر فنی UEFI الزاماً به GPT محدود نیست.</div></div>

<h2>MBR در مقابل GPT</h2>

<p>این جدول را خوب یاد بگیر:</p>

<div class="table-wrap">
<table>
<thead><tr><th>ویژگی</th><th>MBR</th><th>GPT</th></tr></thead>
<tbody>
<tr><td>نسل</td><td>قدیمی‌تر</td><td>جدیدتر</td></tr>
<tr><td>محدودیت Primary</td><td>حداکثر ۴</td><td>محدودیت مشابه ندارد</td></tr>
<tr><td>Extended</td><td>دارد</td><td>ندارد</td></tr>
<tr><td>Logical</td><td>دارد</td><td>ندارد</td></tr>
<tr><td>کاربرد امروزی</td><td>سیستم‌های قدیمی</td><td>سیستم‌های جدید</td></tr>
</tbody>
</table>
</div>

<p>در Linux و ابزارهای رایج، GPT معمولاً با <strong>۱۲۸ Partition</strong> به صورت پیش‌فرض دیده می‌شود.</p>

<h3>نکته امتحانی</h3>

<div class="code-container"><span class="code-label">MBR</span><div class="code-block no-prompt">MBR
 ↓
4 Primary
 ↓
Extended / Logical</div></div>

<p>در مقابل:</p>

<div class="code-container"><span class="code-label">GPT</span><div class="code-block no-prompt">GPT
 ↓
Many Partitions
 ↓
No Extended Partition</div></div>

<h2>یک Partition به تنهایی کافی نیست</h2>

<p>فرض کن داریم:</p>

<div class="code-container"><span class="code-label">Partition</span><div class="code-block no-prompt">/dev/sda1</div></div>

<p>آیا می‌توانی همین الان فایل ایجاد کنی؟</p>

<div class="code-container"><span class="code-label">فایل‌ها</span><div class="code-block no-prompt">file.txt
photo.jpg
database.db</div></div>

<p><strong>نه.</strong></p>

<p>چون:</p>

<blockquote>Partition فقط یک فضای تقسیم‌شده از Disk است.</blockquote>

<p>برای مدیریت فایل‌ها به چیزی به نام:</p>

<div class="code-container"><span class="code-label">Filesystem</span><div class="code-block no-prompt">Filesystem</div></div>

<p>نیاز داریم.</p>

<h2>Filesystem چیست؟</h2>

<p>Filesystem ساختاری است که مشخص می‌کند فایل‌ها و Directoryها چگونه روی Storage ذخیره و مدیریت شوند.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">ext4
XFS</div></div>

<p>دو Filesystem مهمی هستند که در Linux با آنها مواجه می‌شوی.</p>

<p>تصویر ذهنی:</p>

<div class="code-container"><span class="code-label">لایه</span><div class="code-block no-prompt">Partition
    ↓
Filesystem
    ↓
Files & Directories</div></div>

<h2>مثال Partition + Filesystem</h2>

<p>فرض کن:</p>

<div class="code-container"><span class="code-label">Partition</span><div class="code-block no-prompt">/dev/sda1</div></div>

<p>یک Partition است.</p>

<p>حالا روی آن:</p>

<div class="code-container"><span class="code-label">Filesystem</span><div class="code-block no-prompt">ext4</div></div>

<p>می‌سازیم.</p>

<p>نتیجه:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">/dev/sda1
     ↓
    ext4
     ↓
Files & Directories</div></div>

<p>حالا این فضا از نظر Filesystem آماده استفاده است.</p>

<h2>ساخت Filesystem با <code>mkfs</code></h2>

<p>برای ساخت Filesystem می‌توان از ابزارهای <code>mkfs</code> استفاده کرد.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo mkfs.ext4 /dev/sda1</div></div>

<p>یعنی:</p>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">/dev/sda1
     ↓
mkfs.ext4
     ↓
ext4 Filesystem</div></div>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>⚠️ هشدار مهم:</strong><br>اجرای <code>mkfs</code> روی یک Partition موجود می‌تواند اطلاعات آن را از بین ببرد. پس روی Disk واقعی بدون اطمینان اجرا نمی‌کنیم.</div></div>

<h2>حالا Mount چیست؟</h2>

<p>فرض کن Filesystem داریم:</p>

<div class="code-container"><span class="code-label">Filesystem</span><div class="code-block no-prompt">/dev/sdb1
     ↓
    ext4</div></div>

<p>یک سؤال:</p>

<blockquote>Linux چطور این Filesystem را داخل ساختار Directoryهای خودش قرار دهد؟</blockquote>

<p>اینجا مفهوم:</p>

<div class="code-container"><span class="code-label">Mount</span><div class="code-block no-prompt">Mount</div></div>

<p>وارد می‌شود.</p>

<p>مثلاً می‌توانیم آن را روی:</p>

<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">/data</div></div>

<p>Mount کنیم:</p>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">/dev/sdb1
    ↓
   ext4
    ↓
  /data
    ↓
Files</div></div>

<h2>Mount Point چیست؟</h2>

<p>در مثال بالا:</p>

<div class="code-container"><span class="code-label">Mount Point</span><div class="code-block no-prompt">/data</div></div>

<p>یک:</p>

<div class="code-container"><span class="code-label">Mount Point</span><div class="code-block no-prompt">Mount Point</div></div>

<p>است.</p>

<p>Mount Point در واقع یک Directory است که Filesystem روی آن متصل می‌شود.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">/
├── etc
├── home
├── var
├── usr
└── data   ← Mount Point</div></div>

<p>پس:</p>

<blockquote><strong>Mount Point = محلی در Directory Tree که Filesystem روی آن Mount می‌شود.</strong></blockquote>

<h2>دستور <code>mount</code></h2>

<p>برای Mount کردن می‌توانیم بنویسیم:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo mount /dev/sdb1 /data</div></div>

<p>یعنی:</p>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">/dev/sdb1
    ↓
Filesystem
    ↓
/data</div></div>

<p>بعد:</p>

<div class="code-container"><span class="code-label">دسترسی</span><div class="code-block">cd /data</div></div>

<p>وارد فضای آن Filesystem می‌شوی.</p>

<h2>مفهوم واقعی Mount</h2>

<p>این تعریف را خوب یاد بگیر:</p>

<blockquote><strong>Mount کردن یعنی متصل کردن یک Filesystem به درخت Directoryهای Linux.</strong></blockquote>

<p>Linux برخلاف Windows، یک درخت Directory واحد دارد که ریشه آن:</p>

<div class="code-container"><span class="code-label">ریشه</span><div class="code-block no-prompt">/</div></div>

<p>است.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">درخت</span><div class="code-block no-prompt">/
├── home
├── var
├── usr
├── data
└── backup</div></div>

<p>می‌توانیم Filesystemهای مختلف را در قسمت‌های مختلف این درخت Mount کنیم.</p>

<h2>تفاوت مهم: Partition، Filesystem، Mount Point</h2>

<p>این سه را <strong>هرگز با هم قاطی نکن.</strong></p>

<div class="code-container"><span class="code-label">mkfs</span><div class="code-block">mkfs.ext4</div></div>
<p>روی Partition یک Filesystem می‌سازیم.</p>

<p>پس:</p>

<div class="code-container"><span class="code-label">تفکیک</span><div class="code-block no-prompt">fdisk
  ↓
Partition

mkfs
  ↓
Filesystem</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته طلایی</strong><br>این تفاوت برای آزمون LPIC-1 بسیار مهم است.</div></div>

<h2>قبل از هر کاری Diskها را پیدا کنیم</h2>

<p>فرض کن می‌خواهیم روی یک Disk جدید کار کنیم.</p>

<p>اول باید بفهمیم Disk موردنظر چیست.</p>

<p>یکی از بهترین ابزارها:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">lsblk</div></div>

<p>است.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">lsblk</div></div>

<p>ممکن است چیزی شبیه این نشان دهد:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">NAME   MAJ:MIN RM   SIZE RO TYPE MOUNTPOINTS
sda      8:0    0    50G  0 disk
├─sda1   8:1    0     1G  0 part /boot
└─sda2   8:2    0    49G  0 part /
sdb      8:16   0    20G  0 disk</div></div>

<p>اینجا:</p>

<div class="code-container"><span class="code-label">تفسیر</span><div class="code-block no-prompt">sda
 ↓
Disk

sda1
sda2
 ↓
Partitions</div></div>

<p>و:</p>

<div class="code-container"><span class="code-label">تفسیر</span><div class="code-block no-prompt">sdb
 ↓
Disk
 ↓
No Partition</div></div>

<p>در این مثال <code>sdb</code> می‌تواند Disk جدیدی باشد که برای تمرین استفاده می‌کنیم.</p>

<h2>چرا باید قبل از <code>fdisk</code> Disk را شناسایی کنیم؟</h2>

<p>چون <code>fdisk</code> یک ابزار قدرتمند و در عین حال خطرناک است.</p>

<p>اگر به جای:</p>

<div class="code-container"><span class="code-label">درست</span><div class="code-block no-prompt">/dev/sdb</div></div>

<p>اشتباهی:</p>

<div class="code-container"><span class="code-label">اشتباه</span><div class="code-block no-prompt">/dev/sda</div></div>

<p>را انتخاب کنیم، ممکن است Partitionهای سیستم اصلی را تغییر دهیم.</p>

<p>بنابراین همیشه:</p>

<div class="code-container"><span class="code-label">روش صحیح</span><div class="code-block no-prompt">1. Disk را شناسایی کن
2. مطمئن شو Disk درست است
3. بعد fdisk را اجرا کن</div></div>

<p>این عادت حرفه‌ای بسیار مهم است.</p>

<h2>اجرای <code>fdisk</code></h2>

<p>برای باز کردن Disk:</p>

<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">sudo fdisk /dev/sdb</div></div>

<p>در اینجا:</p>

<div class="code-container"><span class="code-label">Disk موردنظر</span><div class="code-block no-prompt">/dev/sdb
   ↓
Disk موردنظر</div></div>

<p>است.</p>

<p>بعد وارد محیط تعاملی <code>fdisk</code> می‌شویم.</p>

<p>ممکن است چیزی شبیه این ببینیم:</p>

<div class="code-container"><span class="code-label">ورود</span><div class="code-block no-prompt">Welcome to fdisk
Command (m for help):</div></div>

<p>حالا دیگر دستورات Linux معمولی را وارد نمی‌کنیم؛ بلکه دستورات مخصوص محیط <code>fdisk</code> را وارد می‌کنیم.</p>

<h2>اولین دستور مهم: <code>m</code></h2>

<p>اگر در محیط <code>fdisk</code> هستیم:</p>

<div class="code-container"><span class="code-label">محیط</span><div class="code-block no-prompt">Command (m for help):</div></div>

<p>می‌توانیم بزنیم:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block no-prompt">m</div></div>

<p>یعنی:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">m
 ↓
Help</div></div>

<p>و لیست فرمان‌های قابل استفاده نمایش داده می‌شود.</p>

<p>این یکی از بهترین راه‌ها برای یادگیری خود <code>fdisk</code> است.</p>

<h2>مشاهده Partition Table با <code>p</code></h2>

<p>یکی از مهم‌ترین فرمان‌ها:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block no-prompt">p</div></div>

<p>است.</p>

<p><code>p</code> یعنی:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">print</div></div>

<p>یعنی Partition Table فعلی را نمایش بده.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">اجرا</span><div class="code-block no-prompt">Command (m for help): p</div></div>

<p>ممکن است خروجی‌ای شبیه این داشته باشد:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Disk /dev/sdb: 20 GiB
Device       Start      End  Sectors  Size Type
/dev/sdb1     2048  2099199  2097152    1G Linux filesystem
/dev/sdb2  2099200 41943039 39843840   19G Linux filesystem</div></div>

<p>پس:</p>

<div class="code-container"><span class="code-label">نقش</span><div class="code-block no-prompt">p
 ↓
Print Partition Table</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی</strong><br>اگر سؤال پرسید: <strong>کدام فرمان برای نمایش Partition Table در <code>fdisk</code> استفاده می‌شود؟</strong><br>
پاسخ: <code>p</code></div></div>

<h2>ایجاد Partition با <code>n</code></h2>

<p>یکی از مهم‌ترین فرمان‌های <code>fdisk</code>:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block no-prompt">n</div></div>

<p>است.</p>

<p><code>n</code> یعنی:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">new</div></div>

<p>یعنی:</p>

<blockquote>یک Partition جدید ایجاد کن.</blockquote>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">اجرا</span><div class="code-block no-prompt">Command (m for help): n</div></div>

<p>بعد <code>fdisk</code> از ما اطلاعاتی درباره Partition می‌خواهد.</p>

<h2>ساخت Partition در عمل</h2>

<p>فرض کن یک Disk خالی داریم:</p>

<div class="code-container"><span class="code-label">دیسک</span><div class="code-block no-prompt">/dev/sdb</div></div>

<p>و می‌خواهیم یک Partition یک گیگابایتی بسازیم.</p>

<p>ابتدا:</p>

<div class="code-container"><span class="code-label">مرحله ۱</span><div class="code-block">sudo fdisk /dev/sdb</div></div>

<p>سپس:</p>

<div class="code-container"><span class="code-label">مرحله ۲</span><div class="code-block no-prompt">n</div></div>

<p><code>fdisk</code> ممکن است سؤال‌هایی شبیه این بپرسد:</p>

<div class="code-container"><span class="code-label">سوال</span><div class="code-block no-prompt">Partition type
   p   primary
   e   extended

Select</div></div>

<p>در ساختار MBR ممکن است گزینه‌های:</p>

<div class="code-container"><span class="code-label">گزینه‌ها</span><div class="code-block no-prompt">p
e</div></div>

<p>را ببینیم.</p>

<p>یعنی:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">p → Primary
e → Extended</div></div>

<h2>Primary و Extended</h2>

<p>این قسمت به جلسه قبل مربوط می‌شود.</p>

<p>در MBR:</p>

<div class="code-container"><span class="code-label">MBR</span><div class="code-block no-prompt">Primary
Extended</div></div>

<p>داریم.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">Disk
│
├── Primary
├── Primary
├── Primary
└── Extended
      │
      ├── Logical
      └── Logical</div></div>

<p>اما در GPT دیگر مفهوم Extended Partition برای دور زدن محدودیت ۴ Primary وجود ندارد.</p>

<p>پس وقتی در <code>fdisk</code> با گزینه‌های:</p>

<div class="code-container"><span class="code-label">گزینه‌ها</span><div class="code-block no-prompt">p
e</div></div>

<p>مواجه می‌شوی، باید به ساختار Partition Table توجه کنی.</p>

<h2>Partition Number</h2>

<p>بعد از انتخاب نوع Partition، معمولاً <code>fdisk</code> شماره Partition را می‌پرسد.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">سوال</span><div class="code-block no-prompt">Partition number (1-4, default 1):</div></div>

<p>اگر Disk خالی باشد، معمولاً:</p>

<div class="code-container"><span class="code-label">انتخاب</span><div class="code-block no-prompt">1</div></div>

<p>را انتخاب می‌کنیم.</p>

<p>در نتیجه:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">/dev/sdb
    ↓
/dev/sdb1</div></div>

<p>ایجاد خواهد شد.</p>

<h2>First Sector چیست؟</h2>

<p>بعد ممکن است چیزی شبیه این ببینی:</p>

<div class="code-container"><span class="code-label">سوال</span><div class="code-block no-prompt">First sector</div></div>

<p>Sectorها واحدهای بسیار کوچک آدرس‌دهی روی Disk هستند.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">First sector (2048-...):</div></div>

<p>در بسیاری از موارد می‌توانیم مقدار پیش‌فرض را قبول کنیم.</p>

<p>یعنی فقط:</p>

<div class="code-container"><span class="code-label">قبول</span><div class="code-block no-prompt">Enter</div></div>

<p>بزنیم.</p>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>چرا؟</strong><br>چون <code>fdisk</code> معمولاً مقدار مناسب را به صورت پیش‌فرض پیشنهاد می‌کند. برای کارهای معمول بهتر است بدون دلیل خاص مقدار پیش‌فرض را تغییر ندهیم.</div></div>

<h2>Last Sector چیست؟</h2>

<p>بعد <code>fdisk</code> ممکن است بپرسد:</p>

<div class="code-container"><span class="code-label">سوال</span><div class="code-block no-prompt">Last sector</div></div>

<p>اینجا مشخص می‌کنیم Partition چقدر فضا داشته باشد.</p>

<p>مثلاً اگر بخواهیم تقریباً 1GB باشد:</p>

<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">+1G</div></div>

<p>می‌توانیم وارد کنیم.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">نمونه</span><div class="code-block no-prompt">Last sector, +/-sectors or +/-size{K,M,G,T,P}: +1G</div></div>

<p>یعنی:</p>

<blockquote>اندازه این Partition را حدود 1GB قرار بده.</blockquote>

<h2>نتیجه ایجاد Partition</h2>

<p>فرض کن:</p>

<div class="code-container"><span class="code-label">دیسک</span><div class="code-block no-prompt">/dev/sdb</div></div>

<p>یک Disk خالی 20GB بود.</p>

<p>ما یک Partition یک گیگابایتی ساختیم.</p>

<p>حالا:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">Disk /dev/sdb
│
├── /dev/sdb1 → 1G
│
└── Free Space → ~19G</div></div>

<p>داریم.</p>

<h2>آیا Partition همین الان ساخته شده؟</h2>

<p>اینجا یک نکته <strong>خیلی مهم</strong> وجود دارد.</p>

<p>وقتی داخل <code>fdisk</code> یک Partition می‌سازی، تغییرات ابتدا در محیط <code>fdisk</code> ثبت می‌شوند؛ اما برای اعمال واقعی تغییرات روی Disk باید آنها را Write کنیم.</p>

<p>یعنی:</p>

<div class="code-container"><span class="code-label">مراحل</span><div class="code-block no-prompt">Create Partition
      ↓
Changes pending
      ↓
Write
      ↓
Partition Table updated</div></div>

<p>فرمان Write:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block no-prompt">w</div></div>

<p>است.</p>

<h2><code>w</code> — نوشتن تغییرات</h2>

<p>در محیط <code>fdisk</code>:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block no-prompt">w</div></div>

<p>یعنی:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">write</div></div>

<p>پس:</p>

<div class="code-container"><span class="code-label">نقش</span><div class="code-block no-prompt">w
 ↓
Write changes
 ↓
Save Partition Table</div></div>

<p>این یکی از مهم‌ترین فرمان‌های <code>fdisk</code> است.</p>

<div class="box important"><i class="fas fa-star"></i><div><strong>حفظ کن:</strong><br>
<code>p → print</code><br>
<code>n → new</code><br>
<code>w → write</code></div></div>

<h2><code>q</code> — خروج بدون ذخیره تغییرات</h2>

<p>حالا فرض کن اشتباهی Partition ساختی و نمی‌خواهی تغییرات اعمال شوند.</p>

<p>در این حالت:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block no-prompt">q</div></div>

<p>را می‌زنیم.</p>

<p><code>q</code> یعنی:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">quit</div></div>

<p>یعنی خروج.</p>

<p>به صورت مفهومی:</p>

<div class="code-container"><span class="code-label">نقش</span><div class="code-block no-prompt">q
 ↓
Quit
 ↓
Don't write pending changes</div></div>

<p>پس یکی از نکات مهم:</p>

<div class="code-container"><span class="code-label">تفاوت</span><div class="code-block no-prompt">w → ذخیره تغییرات و خروج
q → خروج بدون نوشتن تغییرات</div></div>

<h2>تفاوت بسیار مهم <code>w</code> و <code>q</code></h2>

<p>این مورد را برای آزمون خیلی خوب یاد بگیر.</p>

<p>فرض کن:</p>

<div class="code-container"><span class="code-label">ایجاد</span><div class="code-block no-prompt">n</div></div>

<p>زدیم و یک Partition ساختیم.</p>

<p>اگر بزنیم:</p>

<div class="code-container"><span class="code-label">خروج</span><div class="code-block no-prompt">q</div></div>

<p>تغییرات ذخیره نمی‌شوند.</p>

<p>ولی:</p>

<div class="code-container"><span class="code-label">ذخیره</span><div class="code-block no-prompt">w</div></div>

<p>باعث می‌شود تغییرات روی Partition Table نوشته شوند.</p>

<p>بنابراین:</p>

<div class="code-container"><span class="code-label">چرخه</span><div class="code-block no-prompt">n
 ↓
Create / Modify
 ↓
w
 ↓
Write</div></div>

<h2>حذف Partition با <code>d</code></h2>

<p>فرض کن Partition داریم:</p>

<div class="code-container"><span class="code-label">Partition</span><div class="code-block no-prompt">/dev/sdb1</div></div>

<p>و می‌خواهیم آن را حذف کنیم.</p>

<p>در <code>fdisk</code>:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block no-prompt">d</div></div>

<p>را می‌زنیم.</p>

<p><code>d</code> یعنی:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">delete</div></div>

<p>پس:</p>

<div class="code-container"><span class="code-label">نقش</span><div class="code-block no-prompt">d
 ↓
Delete Partition</div></div>

<p>ممکن است <code>fdisk</code> بپرسد کدام Partition را حذف کنیم:</p>

<div class="code-container"><span class="code-label">سوال</span><div class="code-block no-prompt">Partition number:</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">انتخاب</span><div class="code-block no-prompt">1</div></div>

<p>در نتیجه:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">/dev/sdb1</div></div>

<p>برای حذف علامت‌گذاری می‌شود.</p>

<p>اما باز هم:</p>

<blockquote>تا وقتی <code>w</code> نزده‌ایم، تغییرات نهایی نشده‌اند.</blockquote>

<h2>سناریوی کامل ایجاد Partition</h2>

<p>حالا یک سناریو را از ابتدا تا انتها ببینیم.</p>

<p>فرض:</p>

<div class="code-container"><span class="code-label">دیسک</span><div class="code-block no-prompt">/dev/sdb</div></div>

<p>یک Disk خالی است.</p>

<h3>مرحله ۱</h3>
<div class="code-container"><span class="code-label">مرحله ۱</span><div class="code-block">sudo fdisk /dev/sdb</div></div>

<h3>مرحله ۲ — مشاهده وضعیت</h3>
<div class="code-container"><span class="code-label">مرحله ۲</span><div class="code-block no-prompt">p</div></div>

<h3>مرحله ۳ — ایجاد Partition</h3>
<div class="code-container"><span class="code-label">مرحله ۳</span><div class="code-block no-prompt">n</div></div>

<h3>مرحله ۴</h3>
<p>انتخاب نوع Partition در صورت نیاز:</p>
<div class="code-container"><span class="code-label">مرحله ۴</span><div class="code-block no-prompt">p</div></div>

<h3>مرحله ۵</h3>
<p>انتخاب شماره:</p>
<div class="code-container"><span class="code-label">مرحله ۵</span><div class="code-block no-prompt">1</div></div>

<h3>مرحله ۶</h3>
<p>قبول First Sector:</p>
<div class="code-container"><span class="code-label">مرحله ۶</span><div class="code-block no-prompt">Enter</div></div>

<h3>مرحله ۷</h3>
<p>اندازه:</p>
<div class="code-container"><span class="code-label">مرحله ۷</span><div class="code-block no-prompt">+1G</div></div>

<h3>مرحله ۸ — بررسی</h3>
<div class="code-container"><span class="code-label">مرحله ۸</span><div class="code-block no-prompt">p</div></div>
<p>باید Partition جدید را ببینیم:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">/dev/sdb1</div></div>

<h3>مرحله ۹ — ذخیره</h3>
<div class="code-container"><span class="code-label">مرحله ۹</span><div class="code-block no-prompt">w</div></div>

<p>در نهایت:</p>

<div class="code-container"><span class="code-label">نهایی</span><div class="code-block no-prompt">/dev/sdb
     ↓
/dev/sdb1</div></div>

<p>داریم.</p>

<h2>آیا <code>/dev/sdb1</code> الان قابل استفاده برای فایل است؟</h2>

<p><strong>هنوز نه.</strong></p>

<p>این یکی از دام‌های مهم آزمون است.</p>

<p>ما فقط Partition ساخته‌ایم.</p>

/dev/sdb1

fdisk

mkfs

Filesystem

<h2><code>fdisk</code> و Filesystem را اشتباه نکن</h2>

<p>این سؤال بسیار محتمل است:</p>

<blockquote>کدام دستور برای ایجاد Partition استفاده می‌شود؟</blockquote>

<div class="code-container"><span class="code-label">پاسخ</span><div class="code-block">fdisk</div></div>

<p>ولی:</p>

<blockquote>کدام دستور برای ایجاد Filesystem استفاده می‌شود؟</blockquote>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">پاسخ</span><div class="code-block">mkfs.ext4</div></div>

<p>پس:</p>

<div class="code-container"><span class="code-label">تفکیک</span><div class="code-block no-prompt">fdisk → Partition
mkfs  → Filesystem
mount → اتصال Filesystem به Directory Tree</div></div>

<p>این سه را کنار هم حفظ کن.</p>

<h2>تغییر Type یک Partition</h2>

<p><code>fdisk</code> فقط برای ساخت و حذف Partition نیست.</p>

<p>می‌توانیم Type یک Partition را نیز تغییر دهیم.</p>

<p>فرمان مربوطه:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block no-prompt">t</div></div>

<p>است.</p>

<p>یعنی:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">t
 ↓
type
 ↓
Change Partition Type</div></div>

<p>در بعضی ساختارها، <code>fdisk</code> فهرستی از Typeهای قابل انتخاب را در اختیارمان قرار می‌دهد.</p>

<h2>نمایش Typeها</h2>

<p>در نسخه‌های جدید <code>fdisk</code> معمولاً می‌توان با:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block no-prompt">l</div></div>

<p>لیست Partition Typeها را مشاهده کرد.</p>

<p>یعنی:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">l
 ↓
list
 ↓
Partition Types</div></div>

<p>پس:</p>

<div class="code-container"><span class="code-label">نکته</span><div class="code-block no-prompt">t → تغییر Type
l → نمایش Typeها</div></div>

<h2>فرمان <code>g</code></h2>

<p>در <code>fdisk</code> می‌توان Partition Table جدید از نوع GPT ایجاد کرد.</p>

<p>فرمان:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block no-prompt">g</div></div>

<p>برای ایجاد یک GPT جدید استفاده می‌شود.</p>

<p>به صورت مفهومی:</p>

<div class="code-container"><span class="code-label">نقش</span><div class="code-block no-prompt">g
 ↓
Create new GPT Partition Table</div></div>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>هشدار</strong>این عملیات می‌تواند ساختار Partition قبلی را از بین ببرد؛ بنابراین روی Disk واقعی بدون اطمینان اجرا نمی‌کنیم.</div></div>

<h2>فرمان <code>o</code></h2>

<p>برای ایجاد Partition Table از نوع MBR/DOS در <code>fdisk</code> معمولاً:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block no-prompt">o</div></div>

<p>استفاده می‌شود.</p>

<p>پس:</p>

<div class="code-container"><span class="code-label">تفکیک</span><div class="code-block no-prompt">g → GPT
o → DOS/MBR</div></div>

<p>این دو برای آزمون مهم هستند.</p>

<h2>یک نکته مهم درباره MBR و GPT</h2>

<p>جلسه قبل گفتیم:</p>

<div class="code-container"><span class="code-label">MBR</span><div class="code-block no-prompt">MBR
GPT</div></div>

<p>دو نوع مهم Partition Table هستند.</p>

<p>در <code>fdisk</code> می‌توانیم متناسب با نیاز، Partition Table را ایجاد یا مدیریت کنیم.</p>

<p>به صورت خلاصه:</p>

<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">g
 ↓
GPT

o
 ↓
MBR / DOS</div></div>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>هشدار</strong>اجرای این فرمان‌ها روی Disk دارای اطلاعات می‌تواند بسیار خطرناک باشد.</div></div>

<h2><code>fdisk -l</code></h2>

<p>تا اینجا داخل محیط تعاملی <code>fdisk</code> بودیم.</p>

<p>اما می‌توانیم <code>fdisk</code> را مستقیماً از Shell هم اجرا کنیم.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo fdisk -l</div></div>

<p>این دستور برای:</p>

<div class="code-container"><span class="code-label">List</span><div class="code-block no-prompt">List</div></div>

<p>کردن Diskها و Partition Tableها استفاده می‌شود.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Disk /dev/sda: ...
Disk /dev/sdb: ...

Device      Start      End ...
/dev/sda1   ...
/dev/sda2   ...
/dev/sdb1   ...</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong><br>
<code>fdisk -l</code> با <code>p</code> داخل محیط <code>fdisk</code> هر دو برای مشاهده اطلاعات Partition هستند، اما یکی از Shell اجرا می‌شود و دیگری فرمان داخلی محیط <code>fdisk</code> است.</div></div>

<h2>تفاوت <code>fdisk -l</code> و <code>lsblk</code></h2>

<p>این دو دستور را زیاد خواهی دید.</p>

<p>پس به صورت ذهنی:</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">lsblk

fdisk -l

<p>بعد دوباره:</p>

<h2>بعد از <code>fdisk</code> چه اتفاقی افتاد؟</h2>

<p>در جلسه‌های قبل با Disk، Partition و Filesystem آشنا شدیم.</p>

<p>در حالت ساده می‌توانیم Storage را این‌طور تصور کنیم:</p>

 ↓
Partition
 ↓
Filesystem
 ↓
Mount</div></div>

<p>اما یک مشکل مهم وجود دارد.</p>

<p>فرض کن یک سرور داریم و فضای <code>/data</code> بعد از مدتی پر می‌شود.</p>

<p>اگر Storage را به شکل سنتی مدیریت کرده باشیم، ممکن است برای افزایش فضا مجبور شویم Partitionها را تغییر دهیم یا ساختار Storage را دوباره تنظیم کنیم.</p>

<p>اینجاست که <strong>LVM</strong> وارد می‌شود.</p>

<h2>LVM چیست؟</h2>

<p>LVM مخفف:</p>

<div class="code-container"><span class="code-label">LVM</span><div class="code-block no-prompt">Logical Volume Manager</div></div>

<p>است.</p>

<p>LVM یک لایه مدیریتی بین Storage فیزیکی و فضای منطقی سیستم ایجاد می‌کند.</p>

<p>به زبان ساده:</p>

<blockquote>LVM اجازه می‌دهد فضای Storage را به شکل انعطاف‌پذیرتری مدیریت کنیم.</blockquote>

<p>در حالت معمول:</p>

<div class="code-container"><span class="code-label">معمول</span><div class="code-block no-prompt">Disk
 ↓
Partition
 ↓
Filesystem
 ↓
Mount</div></div>

<p>اما در LVM:</p>

<div class="code-container"><span class="code-label">LVM</span><div class="code-block no-prompt">Disk / Partition
       ↓
      PV
       ↓
      VG
       ↓
      LV
       ↓
  Filesystem
       ↓
     Mount</div></div>

<p>سه مفهوم اصلی LVM:</p>

<div class="code-container"><span class="code-label">سه مفهوم</span><div class="code-block no-prompt">PV = Physical Volume

VG = Volume Group

LV = Logical Volume</div></div>

<p>این سه مفهوم، پایه اصلی LVM هستند.</p>

<h2>چرا LVM به وجود آمد؟</h2>

<p>فرض کن دو Disk داریم:</p>

<div class="code-container"><span class="code-label">دیسک‌ها</span><div class="code-block no-prompt">/dev/sdb = 100GB
/dev/sdc = 100GB</div></div>

<p>در حالت معمول هر Disk را جداگانه مدیریت می‌کنیم.</p>

<p>اما با LVM می‌توانیم فضای این Storageها را وارد یک Pool کنیم:</p>

<div class="code-container"><span class="code-label">ترکیب</span><div class="code-block no-prompt">/dev/sdb ──┐
           ├── VG
/dev/sdc ──┘</div></div>

<p>در نتیجه می‌توانیم یک فضای منطقی بزرگ‌تر داشته باشیم:</p>

 ↓
LV</div></div>

<p>پس:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">Partition ≠ LV</div></div>

<p>Partition بخشی از Disk است، در حالی که LV از فضای Volume Group ایجاد می‌شود.</p>

<h2>LV و Filesystem</h2>

<p>بعد از ساخت LV هنوز Filesystem نداریم.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">وضعیت</span><div class="code-block no-prompt">PV
 ↓
VG
 ↓
LV
 ↓
???</div></div>

<p>برای استفاده معمول از LV، باید روی آن Filesystem ایجاد کنیم:</p>

<div class="code-container"><span class="code-label">ساخت</span><div class="code-block no-prompt">PV
 ↓
VG
 ↓
LV
 ↓
Filesystem</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">LV
 ↓
ext4</div></div>

<p>بعد می‌توانیم آن را Mount کنیم:</p>

<div class="code-container"><span class="code-label">Mount</span><div class="code-block no-prompt">LV
 ↓
ext4
 ↓
/data</div></div>

<p>بنابراین ساختار کامل:</p>

<div class="code-container"><span class="code-label">ساختار کامل</span><div class="code-block no-prompt">PV
 ↓
VG
 ↓
LV
 ↓
Filesystem
 ↓
Mount Point</div></div>

<h2>یک مثال کامل</h2>

<p>فرض کن دو Partition داریم:</p>

<div class="code-container"><span class="code-label">پارتیشن‌ها</span><div class="code-block no-prompt">/dev/sdb1
/dev/sdb2</div></div>

<p>آن‌ها را برای LVM آماده می‌کنیم:</p>

<div class="code-container"><span class="code-label">ساخت PV</span><div class="code-block no-prompt">/dev/sdb1 ──→ PV
/dev/sdb2 ──→ PV</div></div>

<p>سپس آنها را در یک VG قرار می‌دهیم:</p>

<div class="code-container"><span class="code-label">ساخت VG</span><div class="code-block no-prompt">PV1 ──┐
      ├── VG
PV2 ──┘</div></div>

<p>از VG یک LV ایجاد می‌کنیم:</p>

<div class="code-container"><span class="code-label">ساخت LV</span><div class="code-block no-prompt">VG
 ↓
LV</div></div>

<p>روی LV یک Filesystem ایجاد می‌کنیم:</p>

<div class="code-container"><span class="code-label">ساخت Filesystem</span><div class="code-block no-prompt">LV
 ↓
ext4</div></div>

<p>و در نهایت آن را Mount می‌کنیم:</p>

<div class="code-container"><span class="code-label">Mount</span><div class="code-block no-prompt">ext4
 ↓
/data</div></div>

<p>پس:</p>

<div class="code-container"><span class="code-label">نهایی</span><div class="code-block no-prompt">/dev/sdb1 ──┐
            │
            ├── PV ──┐
/dev/sdb2 ──┘        │
                     ↓
                VG: storage
                     ↓
                LV: data
                     ↓
                    ext4
                     ↓
                   /data</div></div>

<p>این تصویر را باید به عنوان مدل ذهنی LVM در نظر بگیری.</p>

<h2>مهم‌ترین مزیت LVM</h2>

<p>یکی از مهم‌ترین دلایل استفاده از LVM، <strong>انعطاف‌پذیری در مدیریت Storage</strong> است.</p>

<p>فرض کن:</p>

<div class="code-container"><span class="code-label">وضعیت</span><div class="code-block no-prompt">VG = 200GB
LV = 50GB</div></div>

<p>بعداً متوجه می‌شویم LV به فضای بیشتری نیاز دارد.</p>

<p>می‌توانیم یک Storage جدید به سیستم اضافه کنیم و فضای آن را وارد LVM کنیم.</p>

<p>به صورت مفهومی:</p>

<div class="code-container"><span class="code-label">اضافه کردن</span><div class="code-block no-prompt">New Disk
   ↓
   PV
   ↓
   VG</div></div>

<p>حالا VG بزرگ‌تر شده است.</p>

<p>سپس می‌توانیم از فضای آزاد VG برای بزرگ‌تر کردن LV استفاده کنیم:</p>

<div class="code-container"><span class="code-label">افزایش LV</span><div class="code-block no-prompt">VG
 ↓
LV بزرگ‌تر</div></div>

<p>و در نهایت Filesystem را نیز متناسب با آن بزرگ کنیم:</p>

<div class="code-container"><span class="code-label">افزایش Filesystem</span><div class="code-block no-prompt">LV
 ↓
Filesystem Resize</div></div>

<p>بنابراین زنجیره افزایش فضا:</p>

<div class="code-container"><span class="code-label">زنجیره افزایش</span><div class="code-block no-prompt">New Storage
    ↓
   PV
    ↓
   VG
    ↓
   LV
    ↓
Filesystem</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته مهم</strong><br>اضافه شدن فضا به VG <strong>خودکار باعث بزرگ شدن LV نمی‌شود</strong>. و بزرگ شدن LV نیز لزوماً به معنی بزرگ شدن خودکار Filesystem نیست. این سه لایه را باید از هم جدا نگه داری.</div></div>

<h2>مفهوم افزایش فضا در LVM</h2>

<p>برای اینکه این موضوع را برای جلسه عملی آماده کنیم، فقط مفهوم دستورات را بشناس:</p>

<div class="code-container"><span class="code-label">pvcreate</span><div class="code-block no-prompt">pvcreate
   ↓
ساخت PV</div></div>

<div class="code-container"><span class="code-label">vgextend</span><div class="code-block no-prompt">vgextend
   ↓
اضافه کردن PV به VG</div></div>

<div class="code-container"><span class="code-label">lvextend</span><div class="code-block no-prompt">lvextend
   ↓
افزایش اندازه LV</div></div>

<p>و بعد Filesystem باید متناسب با نوع آن Resize شود.</p>

<p>مثلاً برای Filesystemهای خانواده ext:</p>

<div class="code-container"><span class="code-label">resize2fs</span><div class="code-block">resize2fs</div></div>

<p>در جلسه بعد این فرآیند را <strong>واقعاً روی یک سناریوی عملی</strong> اجرا می‌کنیم.</p>

<h2>LVM چه مشکلی را حل می‌کند؟</h2>

<p>بدون LVM:</p>

<div class="code-container"><span class="code-label">بدون LVM</span><div class="code-block no-prompt">Disk
├── Partition 1
├── Partition 2
└── Partition 3</div></div>

<p>اندازه و ساختار Storage بیشتر به Partitionها وابسته است.</p>

<p>با LVM:</p>

<div class="code-container"><span class="code-label">با LVM</span><div class="code-block no-prompt">Disk(s)
   ↓
  PV
   ↓
  VG
   ↓
  LV</div></div>

<p>فضای VG به صورت یک Pool مدیریت می‌شود و می‌توانیم از آن LVهای مختلف بسازیم.</p>

<p>بنابراین LVM بیشتر روی این موضوع تمرکز دارد:</p>

<div class="code-container"><span class="code-label">تمرکز LVM</span><div class="code-block no-prompt">Flexible Storage Management</div></div>

<h2>LVM باعث افزایش سرعت Disk می‌شود؟</h2>

<p>هدف اصلی LVM افزایش سرعت Disk نیست.</p>

<p>LVM بیشتر برای موارد زیر استفاده می‌شود:</p>

<ul>
    <li>مدیریت انعطاف‌پذیر Storage</li>
    <li>ترکیب فضای چند PV در یک VG</li>
    <li>ایجاد Logical Volume</li>
    <li>افزایش یا کاهش اندازه Volumeها در شرایط پشتیبانی‌شده</li>
    <li>مدیریت بهتر فضای ذخیره‌سازی</li>
</ul>

<p>در مقابل، RAID بیشتر با مفاهیمی مثل:</p>

<div class="code-container"><span class="code-label">RAID</span><div class="code-block no-prompt">Performance
Redundancy
Fault Tolerance</div></div>

<p>مرتبط است.</p>

<p>پس:</p>

<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">LVM ≠ RAID</div></div>

<p>هر دو برای Storage مهم هستند، اما هدف اصلی آنها یکسان نیست.</p>

<p>RAID را در جلسات بعدی جداگانه بررسی می‌کنیم.</p>

<h2>جمع‌بندی جلسه</h2>

<p>LVM یک سیستم مدیریت انعطاف‌پذیر Storage است.</p>

<p>ساختار اصلی:</p>

<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">Physical Storage
      ↓
     PV
      ↓
     VG
      ↓
     LV
      ↓
Filesystem
      ↓
Mount</div></div>

<p>سه مفهوم اصلی:</p>

<div class="code-container"><span class="code-label">مفاهیم</span><div class="code-block no-prompt">PV = Physical Volume
VG = Volume Group
LV = Logical Volume</div></div>

<p>و تفاوت مهم:</p>

<div class="code-container"><span class="code-label">تفاوت</span><div class="code-block no-prompt">Partition ≠ LV</div></div>

<p>همچنین:</p>

<div class="code-container"><span class="code-label">تفاوت</span><div class="code-block no-prompt">LVM ≠ RAID</div></div>

<p>LVM بیشتر برای مدیریت انعطاف‌پذیر Storage است، در حالی که RAID بیشتر برای ترکیب Diskها با اهدافی مانند Redundancy و Performance استفاده می‌شود.</p>

<div class="quiz-card"><p>❓ تست ۸: کدام دستور برای ساخت Volume Group استفاده می‌شود؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>vgcreate</code></button>
    <button onclick="selectOption(this)">ب) <code>pvcreate</code></button>
    <button onclick="selectOption(this)">ج) <code>lvcreate</code></button>
    <button onclick="selectOption(this)">د) <code>vgextend</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: الف</strong><br><code>vgcreate</code> برای ساخت Volume Group استفاده می‌شود.</div>
</div>

<div class="quiz-card"><p>❓ تست ۹: کدام دستور برای ساخت Logical Volume استفاده می‌شود؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>pvcreate</code></button>
    <button onclick="selectOption(this)">ب) <code>lvcreate</code></button>
    <button onclick="selectOption(this)">ج) <code>vgcreate</code></button>
    <button onclick="selectOption(this)">د) <code>mkfs</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ب</strong><br><code>lvcreate</code> برای ساخت Logical Volume استفاده می‌شود.</div>
</div>

<div class="quiz-card"><p>❓ تست ۱۰: اگر یک PV جدید داشته باشیم و بخواهیم آن را به یک VG موجود اضافه کنیم، کدام دستور مناسب است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>vgcreate</code></button>
    <button onclick="selectOption(this)">ب) <code>lvcreate</code></button>
    <button onclick="selectOption(this)">ج) <code>vgextend</code></button>
    <button onclick="selectOption(this)">د) <code>pvdisplay</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ج</strong><br><code>vgextend</code> برای اضافه کردن PV به VG موجود استفاده می‌شود.</div>
</div>

<div class="quiz-card"><p>❓ تست ۱۱: بعد از ساخت LV، برای استفاده معمول از آن چه چیزی باید روی آن ایجاد شود؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) BIOS</button>
    <button onclick="selectOption(this)">ب) Filesystem</button>
    <button onclick="selectOption(this)">ج) GRUB</button>
    <button onclick="selectOption(this)">د) Partition Table</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ب</strong><br>بعد از ساخت LV باید روی آن Filesystem ایجاد شود تا قابل استفاده باشد.</div>
</div>

<div class="quiz-card"><p>❓ تست ۱۲: کدام زنجیره صحیح است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) Disk → LV → PV → VG → Filesystem</button>
    <button onclick="selectOption(this)">ب) PV → LV → VG → Filesystem</button>
    <button onclick="selectOption(this)">ج) PV → VG → LV → Filesystem → Mount</button>
    <button onclick="selectOption(this)">د) VG → Disk → PV → LV</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ج</strong><br>زنجیره صحیح: PV → VG → LV → Filesystem → Mount</div>
</div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>🧠 مرور نهایی</strong><br>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">                LVM
                 │
        ┌────────┴────────┐
        ↓                 ↓
       PV                VG
                         ↓
                        LV
                         ↓
                    Filesystem
                         ↓
                       Mount</div></div>

<p>فرمول اصلی:</p>
<div class="code-container"><span class="code-label">فرمول</span><div class="code-block no-prompt">PV → VG → LV → Filesystem → Mount</div></div>

<p>فرمول افزایش فضا:</p>
<div class="code-container"><span class="code-label">افزایش</span><div class="code-block no-prompt">New Storage
    ↓
   PV
    ↓
   VG
    ↓
   LV
    ↓
Filesystem</div></div>

<p>و مهم‌ترین تفاوت‌ها:</p>
<div class="code-container"><span class="code-label">تفاوت‌ها</span><div class="code-block no-prompt">Partition ≠ PV ≠ VG ≠ LV ≠ Filesystem</div></div>

<p>هر کدام یک <strong>لایه متفاوت</strong> در Storage هستند.</p>

<p><strong>جلسه ۶ — LVM مفاهیم و ساختار تمام شد.</strong></p>

<p>در جلسه بعد، همین ساختار را روی یک Lab واقعی اجرا می‌کنیم و از <code>lsblk</code> شروع می‌کنیم و قدم‌به‌قدم به:</p>

<div class="code-container"><span class="code-label">مراحل عملی</span><div class="code-block no-prompt">pvcreate
→ vgcreate
→ lvcreate
→ mkfs
→ mount
→ lvextend
→ Filesystem Resize</div></div>

<p>می‌رسیم.</p>
</div></div>
