</div>

<div class="quiz-card"><p>❓ تست ۳: کدام دستور یک Session جدید با نام <code>backup</code> می‌سازد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>tmux ls backup</code></button>
    <button onclick="selectOption(this)">ب) <code>tmux attach -t backup</code></button>
    <button onclick="selectOption(this)">ج) <code>tmux new -s backup</code></button>
    <button onclick="selectOption(this)">د) <code>tmux kill-session -t backup</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ج</strong><br>برای ساخت Session جدید با نام مشخص از دستور <code>tmux new -s backup</code> استفاده می‌شود. گزینه‌های A، B و D به ترتیب برای لیست، اتصال و حذف Session هستند.</div>
</div>

<div class="quiz-card"><p>❓ تست ۴: تفاوت اصلی بین Detach کردن یک Session و اجرای <code>tmux kill-session</code> چیست؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) هیچ تفاوتی ندارند و هر دو Session را حذف می‌کنند.</button>
    <button onclick="selectOption(this)">ب) Detach کردن Session را متوقف می‌کند اما <code>kill-session</code> آن را در پس‌زمینه نگه می‌دارد.</button>
    <button onclick="selectOption(this)">ج) Detach کردن Session را زنده نگه می‌دارد و در پس‌زمینه فعال است، اما <code>kill-session</code> آن را کاملاً حذف می‌کند.</button>
    <button onclick="selectOption(this)">د) هر دو فقط روی Windowها تأثیر می‌گذارند، نه روی Session.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ج</strong><br>Detach کردن (<code>Ctrl+b d</code>) فقط ما را از دید Session خارج می‌کند، در حالی که Session و هر Processی که داخلش اجرا می‌شود، در پس‌زمینه به کار خود ادامه می‌دهد. اما <code>tmux kill-session -t name</code> باعث حذف کامل Session می‌شود.</div>
</div>

<div class="quiz-card"><p>❓ تست ۵: کدام ترکیب کلید برای تقسیم افقی صفحه (Paneها کنار هم) در <code>tmux</code> استفاده می‌شود؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>Ctrl+b "</code></button>
    <button onclick="selectOption(this)">ب) <code>Ctrl+b %</code></button>
    <button onclick="selectOption(this)">ج) <code>Ctrl+b c</code></button>
    <button onclick="selectOption(this)">د) <code>Ctrl+b d</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ب</strong><br>برای تقسیم افقی صفحه (Paneها کنار هم) از ترکیب <code>Ctrl+b %</code> استفاده می‌شود. <code>Ctrl+b "</code> برای تقسیم عمودی (زیر هم) است، <code>Ctrl+b c</code> برای ساخت Window جدید و <code>Ctrl+b d</code> برای Detach است.</div>
</div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>🧠 مرور ۳۰ ثانیه‌ای جلسه ۶</strong><br>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">tmux → Terminal Multiplexer → Session / Window / Pane

tmux new -s name    → ساخت Session
tmux ls             → لیست Sessionها
tmux attach -t name → اتصال به Session
tmux kill-session -t name → حذف Session

Ctrl+b d   → Detach (Session زنده می‌ماند)
Ctrl+b c   → Window جدید
Ctrl+b %   → تقسیم افقی
Ctrl+b "   → تقسیم عمودی</div></div>

<p>و مهم‌ترین نکته جلسه:</p>
<blockquote><strong>Session در <code>tmux</code> مستقل از اتصال Terminal است؛ Detach کردن Session را نمی‌کشد، فقط آن را در پس‌زمینه پنهان می‌کند.</strong></blockquote>

<p>در جلسه بعدی طبق فهرست دوره می‌رویم سراغ <strong>جلسه ۷: <code>kill</code></strong>؛ یعنی حالا که با PID و Processها (از جلسه ۵) و مدیریت Session با <code>tmux</code> آشنا شدیم، یاد می‌گیریم چطور یک Process را با استفاده از PID آن متوقف یا Kill کنیم.</p>
</div></div>

"ch2-7": `
<div class="section-header">
    <div class="section-badge">۲</div>
    <div>
        <h1>kill + مدیریت Processهای پس‌زمینه</h1>
        <div class="meta">مدیریت نرم‌افزار و فرآیندها · بخش ۷ از ۸</div>
    </div>
</div>

<p>در جلسه قبل با <code>tmux</code> آشنا شدیم و یاد گرفتیم چطور یک Session را زنده نگه داریم حتی بعد از قطع اتصال SSH. قبل‌تر هم در جلسه ۵ با PID، <code>ps</code> و <code>top</code> آشنا شده بودیم.</p>

<p>حالا وقتش رسیده که یاد بگیریم چطور یک Process را متوقف کنیم، چطور آن را بین پیش‌زمینه و پس‌زمینه جابه‌جا کنیم، و سیگنال‌هایی که پشت <code>kill</code> هستند دقیقاً چه معنایی دارند.</p>

<p>طبق برنامه این جلسه شامل دو بخش است:</p>
<div class="code-container"><span class="code-label">سرفصل‌ها</span><div class="code-block no-prompt">1. اجرای Process در پس‌زمینه و جابه‌جایی بین پیش‌زمینه/پس‌زمینه
2. فرمان kill و مفهوم Signal</div></div>

<h2>بخش اول — اجرای Process در پس‌زمینه</h2>

<h3>Foreground در برابر Background</h3>

<p>وقتی یک دستور را در ترمینال اجرا می‌کنیم، به‌طور پیش‌فرض آن دستور <strong>Foreground</strong> (پیش‌زمینه) است.</p>

<p>یعنی:</p>
<div class="code-container"><span class="code-label">Foreground</span><div class="code-block no-prompt">دستور اجرا می‌شود → ترمینال قفل می‌شود → تا پایان اجرا منتظر می‌مانیم</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sleep 100</div></div>

<p>تا وقتی این دستور تمام نشود، نمی‌توانیم دستور بعدی را در همان ترمینال بنویسیم.</p>

<h3>اجرا در پس‌زمینه با <code>&</code></h3>

<p>اگر نخواهیم منتظر پایان یک دستور بمانیم، می‌توانیم آن را در <strong>Background</strong> (پس‌زمینه) اجرا کنیم.</p>

<p>برای این کار کافی است <code>&</code> را بعد از دستور اضافه کنیم:</p>
<div class="code-container"><span class="code-label">اجرا در پس‌زمینه</span><div class="code-block">sleep 100 &</div></div>

<p>به محض اجرای این دستور، شماره‌ای شبیه این نمایش داده می‌شود:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">[1] 4821</div></div>

<p>که:</p>
<div class="code-container"><span class="code-label">تفسیر</span><div class="code-block no-prompt">[1]  → شماره Job
4821 → PID</div></div>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">command & → اجرا در Background → Terminal بلافاصله آزاد می‌شود</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته آزمونی</strong>
<p><code>&</code> باعث می‌شود Process در پس‌زمینه اجرا شود، اما این با Detach کردن یک Session در <code>tmux</code> فرق دارد؛ اگر همان Terminal (بدون <code>tmux</code>) به‌طور کامل بسته شود، Processهای Background معمولی معمولاً همراه آن از بین می‌روند، مگر با ابزارهایی مثل <code>nohup</code> یا <code>tmux</code> محافظت شده باشند.</p>
</div></div>

<h3>مشاهده Jobها با <code>jobs</code></h3>

<p>برای دیدن لیست Processهایی که در همان Session ترمینال به شکل Job در حال اجرا هستند:</p>
<div class="code-container"><span class="code-label">مشاهده Jobها</span><div class="code-block">jobs</div></div>

<p>خروجی می‌تواند شبیه این باشد:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">[1]+  Running    sleep 100 &</div></div>

<div class="code-container"><span class="code-label">کاربرد</span><div class="code-block no-prompt">jobs → لیست Jobهای پس‌زمینه/متوقف‌شده همین Shell</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته آزمونی</strong>
<p><code>jobs</code> را با <code>ps</code> اشتباه نگیر:</p>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">ps   → Snapshot از همه Processهای قابل مشاهده سیستم
jobs → فقط Jobهای مرتبط با Shell فعلی</div></div>
</div></div>

<h3>شماره Job در برابر PID</h3>

<p>نکته مهمی که باید دقیق باشیم:</p>
<div class="code-container"><span class="code-label">تفاوت</span><div class="code-block no-prompt">%1   → اشاره به Job شماره ۱
4821 → PID واقعی همان Process</div></div>

<p>یعنی برای اشاره به یک Job از علامت <code>%</code> به همراه شماره Job استفاده می‌کنیم، نه شماره PID مستقیم.</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">Job Number  →  %1, %2, %3, ...
PID         →  1234, 4821, ...</div></div>

<h2>بخش دوم — جابه‌جایی بین پیش‌زمینه و پس‌زمینه</h2>

<h3>آوردن Job به پیش‌زمینه با <code>fg</code></h3>

<p>اگر بخواهیم یک Job پس‌زمینه را دوباره به پیش‌زمینه بیاوریم:</p>
<div class="code-container"><span class="code-label">آوردن به Foreground</span><div class="code-block">fg %number</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">fg %1</div></div>

<p><code>fg</code> مخفف <strong>foreground</strong> است.</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">Background Job → fg %1 → Foreground</div></div>

<h3>متوقف کردن موقت با <code>Ctrl+Z</code></h3>

<p>اگر یک Process در حال اجرا (Foreground) باشد و بخواهیم موقتاً آن را متوقف کنیم بدون اینکه بسته شود:</p>
<div class="code-container"><span class="code-label">توقف موقت</span><div class="code-block no-prompt">Ctrl+Z</div></div>

<p>با این کار، Process به حالت <strong>Stopped</strong> (متوقف‌شده) می‌رود؛ یعنی نه اجرا می‌شود و نه بسته شده است، فقط موقتاً نگه داشته شده.</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">Foreground Process → Ctrl+Z → Stopped</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی مهم</strong>
<p><code>Ctrl+Z</code> برابر با بستن یا کشتن Process <strong>نیست</strong>. Process فقط متوقف (Suspend) می‌شود و همچنان در حافظه باقی می‌ماند.</p>
</div></div>

<h3>ادامه در پس‌زمینه با <code>bg</code></h3>

<p>بعد از اینکه یک Process را با <code>Ctrl+Z</code> متوقف کردیم، می‌توانیم آن را در پس‌زمینه دوباره به حالت اجرا برگردانیم:</p>
<div class="code-container"><span class="code-label">ادامه در پس‌زمینه</span><div class="code-block">bg %number</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">bg %1</div></div>

<p><code>bg</code> مخفف <strong>background</strong> است.</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">Stopped (Ctrl+Z) → bg %1 → Running در Background</div></div>

<h3>چرخه کامل Foreground / Background</h3>

<p>این چرخه یکی از پرتکرارترین سناریوهای عملی و آزمونی است:</p>

<div class="code-container"><span class="code-label">چرخه</span><div class="code-block no-prompt">اجرای دستور به‌صورت Foreground
          ↓
     Ctrl+Z (Stop)
          ↓
        jobs
          ↓
   bg %1  (ادامه در Background)
          ↓
        jobs
          ↓
   fg %1  (بازگشت به Foreground)</div></div>

<table>
<thead><tr><th>دستور / کلید</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>command &</code></td><td>اجرای مستقیم در Background</td></tr>
<tr><td><code>jobs</code></td><td>نمایش لیست Jobهای Shell فعلی</td></tr>
<tr><td><code>Ctrl+Z</code></td><td>توقف موقت Process فعلی (Foreground → Stopped)</td></tr>
<tr><td><code>bg %number</code></td><td>ادامه Job متوقف‌شده در Background</td></tr>
<tr><td><code>fg %number</code></td><td>آوردن Job به Foreground</td></tr>
</tbody>
</table>

<h2>بخش سوم — پایان دادن به Processها</h2>

<h3>پایان دادن به یک Job با <code>kill %number</code></h3>

<p>اگر بخواهیم یک Job پس‌زمینه را مستقیماً از طریق شماره Job متوقف کنیم:</p>
<div class="code-container"><span class="code-label">پایان Job</span><div class="code-block">kill %number</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">kill %1</div></div>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">kill %1 → پایان دادن به Job شماره ۱</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته آزمونی</strong>
<p>اینجا <code>kill</code> با علامت <code>%</code> همراه با <strong>شماره Job</strong> به کار می‌رود، نه با PID مستقیم. در بخش بعد با استفاده از <code>kill</code> همراه با PID آشنا می‌شویم.</p>
</div></div>

<h3>فرمان <code>kill</code></h3>

<p>دستور اصلی برای پایان دادن به یک Process با استفاده از PID آن:</p>
<div class="code-container"><span class="code-label">پایان با PID</span><div class="code-block">kill PID</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">kill 4821</div></div>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">Process → PID → kill PID</div></div>

<p>این دقیقاً همان ارتباطی است که در جلسه ۵ درباره اهمیت PID صحبت کردیم.</p>

<h3>مفهوم Signal</h3>

<p>نکته‌ای که خیلی از افراد در ابتدا اشتباه متوجه می‌شوند این است:</p>

<blockquote><code>kill</code> به معنای «کشتن مستقیم» Process نیست؛ <code>kill</code> یک <strong>Signal</strong> (سیگنال) به Process ارسال می‌کند.</blockquote>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">kill → ارسال Signal → Process</div></div>

<p>اینکه Process دقیقاً چه واکنشی به آن Signal نشان دهد، به نوع Signal و به خود برنامه بستگی دارد.</p>

<h3><code>kill -9 PID</code></h3>

<p>رایج‌ترین شکلی که همه از <code>kill</code> دیده‌اند:</p>
<div class="code-container"><span class="code-label">پایان اجباری</span><div class="code-block">kill -9 PID</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">kill -9 4821</div></div>

<p>عدد <code>9</code> در اینجا شماره یک Signal خاص است که در ادامه دقیق بررسی می‌کنیم.</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">kill -9 PID → ارسال Signal شماره 9 (SIGKILL) → پایان اجباری Process</div></div>

<h3>پایان دادن با نام: <code>killall</code></h3>

<p>اگر بخواهیم همه Processهایی که یک نام مشخص دارند را همزمان پایان دهیم، به جای پیدا کردن تک‌تک PIDها می‌توانیم از:</p>
<div class="code-container"><span class="code-label">پایان با نام</span><div class="code-block">killall name</div></div>

<p>استفاده کنیم.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">killall firefox</div></div>

<p>این دستور به همه Processهایی که نامشان <code>firefox</code> است Signal ارسال می‌کند، نه فقط یکی.</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">kill PID       → یک Process مشخص با PID
killall name   → همه Processهای با یک نام مشخص</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی مهم</strong>
<p>تفاوت <code>kill</code> و <code>killall</code> را دقیق به خاطر بسپار:</p>
<div class="code-container"><span class="code-label">تفاوت</span><div class="code-block no-prompt">kill    → بر اساس PID عمل می‌کند
killall → بر اساس نام Process عمل می‌کند</div></div>
</div></div>

<h2>بخش چهارم — انواع Signal</h2>

<h3>چرا چند نوع Signal داریم؟</h3>

<p>Signalهای مختلف معانی متفاوتی دارند؛ بعضی به Process اجازه می‌دهند خودش را تمیز ببندد، بعضی دیگر بدون هیچ اجازه‌ای Process را متوقف می‌کنند.</p>

<p>جدول اصلی Signalهایی که باید بشناسی:</p>

<table>
<thead><tr><th>Signal</th><th>شماره</th><th>معنی</th></tr></thead>
<tbody>
<tr><td><code>SIGTERM</code></td><td>15</td><td>خاتمه معمولی (پیش‌فرض <code>kill</code>)</td></tr>
<tr><td><code>SIGKILL</code></td><td>9</td><td>خاتمه اجباری، غیرقابل‌نادیده‌گیری</td></tr>
<tr><td><code>SIGSTOP</code></td><td>—</td><td>توقف اجباری، غیرقابل‌نادیده‌گیری</td></tr>
<tr><td><code>SIGINT</code></td><td>2</td><td>وقفه از صفحه‌کلید، معادل <code>Ctrl+C</code></td></tr>
</tbody>
</table>

<h3><code>SIGTERM</code> — سیگنال پیش‌فرض</h3>

<p>وقتی می‌نویسیم:</p>
<div class="code-container"><span class="code-label">پیش‌فرض</span><div class="code-block">kill PID</div></div>

<p>بدون مشخص کردن هیچ عددی، به‌طور پیش‌فرض Signal زیر ارسال می‌شود:</p>
<div class="code-container"><span class="code-label">سیگنال</span><div class="code-block no-prompt">SIGTERM (شماره 15)</div></div>

<p><code>SIGTERM</code> یعنی «درخواست خاتمه معمولی».</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">kill PID → SIGTERM → درخواست پایان دادن به‌صورت مرتب</div></div>

<p>نکته مهم این است که برنامه می‌تواند این Signal را دریافت کند و قبل از بسته شدن، کارهایی مثل ذخیره فایل یا بستن Connectionها را انجام دهد.</p>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی</strong>
<p>اگر سؤال پرسید: «سیگنال پیش‌فرض دستور <code>kill</code> چیست؟»</p>
<p>پاسخ: <code>SIGTERM (15)</code></p>
</div></div>

<h3><code>SIGKILL</code> — خاتمه اجباری</h3>

<p>وقتی می‌نویسیم:</p>
<div class="code-container"><span class="code-label">اجباری</span><div class="code-block">kill -9 PID</div></div>

<p>سیگنال زیر ارسال می‌شود:</p>
<div class="code-container"><span class="code-label">سیگنال</span><div class="code-block no-prompt">SIGKILL (شماره 9)</div></div>

<p><code>SIGKILL</code> برخلاف <code>SIGTERM</code>، به Process هیچ فرصتی برای واکنش یا تمیزکاری نمی‌دهد؛ Process بلافاصله و اجباری متوقف می‌شود.</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">kill -9 PID → SIGKILL → پایان فوری و اجباری → غیرقابل نادیده‌گیری</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی مهم</strong>
<div class="code-container"><span class="code-label">نکته</span><div class="code-block no-prompt">SIGKILL و SIGSTOP → غیرقابل نادیده‌گیری (Cannot be caught, blocked, or ignored)</div></div>
<p>یعنی هیچ برنامه‌ای نمی‌تواند این دو Signal را نادیده بگیرد یا مدیریت کند؛ هسته سیستم‌عامل مستقیماً این کار را انجام می‌دهد.</p>
</div></div>

<h3><code>SIGSTOP</code> — توقف اجباری</h3>

<p><code>SIGSTOP</code> باعث می‌شود Process متوقف (Suspend) شود، دقیقاً شبیه همان کاری که <code>Ctrl+Z</code> به‌صورت تعاملی انجام می‌دهد.</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">SIGSTOP → توقف اجباری Process → غیرقابل نادیده‌گیری</div></div>

<p>تفاوت کلیدی با <code>SIGKILL</code> این است که <code>SIGSTOP</code> فقط Process را متوقف می‌کند، آن را از بین نمی‌برد؛ Process همچنان در حافظه باقی می‌ماند و می‌تواند بعداً با Signal مناسب (<code>SIGCONT</code>) ادامه پیدا کند.</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">SIGKILL → پایان کامل Process
SIGSTOP → توقف موقت، Process باقی می‌ماند</div></div>

<h3><code>SIGINT</code> — وقفه از صفحه‌کلید</h3>

<p>وقتی داخل یک Process فعال هستیم و کلیدهای:</p>
<div class="code-container"><span class="code-label">میانبر</span><div class="code-block no-prompt">Ctrl+C</div></div>

<p>را می‌زنیم، سیستم Signal زیر را برای آن Process ارسال می‌کند:</p>
<div class="code-container"><span class="code-label">سیگنال</span><div class="code-block no-prompt">SIGINT (شماره 2)</div></div>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">Ctrl+C → SIGINT → درخواست وقفه/توقف Process</div></div>

<p>برخلاف <code>SIGKILL</code> و <code>SIGSTOP</code>، برنامه می‌تواند <code>SIGINT</code> را مدیریت یا حتی نادیده بگیرد.</p>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی</strong>
<p>معادل بودن <code>Ctrl+C</code> با <code>SIGINT</code> یکی از سؤالات کلاسیک آزمون است:</p>
<div class="code-container"><span class="code-label">نکته</span><div class="code-block no-prompt">Ctrl+C = SIGINT = Signal شماره 2</div></div>
</div></div>

<h3>مقایسه کلی Signalها</h3>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">SIGTERM (15) → درخواست مؤدبانه پایان → قابل مدیریت توسط برنامه

SIGINT (2) → وقفه از صفحه‌کلید (Ctrl+C) → قابل مدیریت توسط برنامه

SIGKILL (9) → پایان اجباری و فوری → غیرقابل نادیده‌گیری

SIGSTOP → توقف اجباری (نه پایان) → غیرقابل نادیده‌گیری</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته طلایی آزمون</strong>
<p>این تقسیم‌بندی را همیشه به خاطر بسپار:</p>
<div class="code-container"><span class="code-label">تقسیم‌بندی</span><div class="code-block no-prompt">قابل نادیده‌گیری توسط برنامه   → SIGTERM, SIGINT
غیرقابل نادیده‌گیری توسط برنامه → SIGKILL, SIGSTOP</div></div>
</div></div>

<h3>چرا معمولاً اول <code>SIGTERM</code> امتحان می‌شود؟</h3>

<p>روال معمول و توصیه‌شده در مدیریت سیستم این است:</p>

<div class="code-container"><span class="code-label">روال</span><div class="code-block no-prompt">1. kill PID          (ارسال SIGTERM)
2. صبر می‌کنیم Process خودش را تمیز ببندد
3. اگر بسته نشد →
4. kill -9 PID        (ارسال SIGKILL به‌عنوان آخرین راه‌حل)</div></div>

<p>دلیل این ترتیب این است که <code>SIGTERM</code> به برنامه فرصت می‌دهد کارهایی مثل ذخیره داده یا آزاد کردن منابع را قبل از بسته شدن انجام دهد؛ در حالی که <code>SIGKILL</code> این فرصت را نمی‌دهد و ممکن است باعث از دست رفتن داده شود.</p>

<div class="code-container"><span class="code-label">توصیه</span><div class="code-block no-prompt">SIGTERM اول → اگر جواب نداد → SIGKILL به‌عنوان آخرین انتخاب</div></div>

<h2>نقشه کلی جلسه</h2>

<div class="code-container"><span class="code-label">نقشه</span><div class="code-block no-prompt">                     Process Management
                            │
        ┌───────────────────┼───────────────────┐
        ↓                    ↓                    ↓
  Foreground/           kill / killall         Signal
  Background                │                    │
        │              PID / Job Number    SIGTERM / SIGKILL /
   & , jobs,                                SIGSTOP / SIGINT
   fg , bg , Ctrl+Z</div></div>

<div class="summary-box">
    <h3>⭐ نکات طلایی آزمون</h3>

    <h4>۱. اجرا در پس‌زمینه</h4>
    <div class="code-container"><span class="code-label">یادآوری</span><div class="code-block no-prompt">command &   → اجرا در Background
jobs        → نمایش Jobهای Shell فعلی</div></div>

    <h4>۲. جابه‌جایی Foreground/Background</h4>
    <div class="code-container"><span class="code-label">یادآوری</span><div class="code-block no-prompt">fg %number   → آوردن به Foreground
Ctrl+Z       → توقف موقت (Stopped)
bg %number   → ادامه در Background</div></div>

    <h4>۳. پایان دادن به Job پس‌زمینه</h4>
    <div class="code-container"><span class="code-label">یادآوری</span><div class="code-block">kill %number</div></div>

    <h4>۴. فرمان <code>kill</code></h4>
    <div class="code-container"><span class="code-label">یادآوری</span><div class="code-block no-prompt">kill PID        → ارسال SIGTERM (پیش‌فرض)
kill -9 PID     → ارسال SIGKILL (اجباری)
killall name    → پایان همه Processهای با یک نام</div></div>

    <h4>۵. جدول Signalها</h4>
    <div class="code-container"><span class="code-label">جدول</span><div class="code-block no-prompt">SIGTERM (15) → خاتمه معمولی، پیش‌فرض kill
SIGKILL (9)  → خاتمه اجباری، غیرقابل‌نادیده‌گیری
SIGSTOP      → توقف اجباری، غیرقابل‌نادیده‌گیری
SIGINT (2)   → وقفه از صفحه‌کلید، معادل Ctrl+C</div></div>
</div>

<h2>خودآزمایی</h2>

<div class="quiz-card"><p>❓ تست ۱: کدام دستور یک Process در حال اجرا را به پس‌زمینه می‌فرستد بدون اینکه از ابتدا با <code>&</code> اجرا شده باشد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) ابتدا <code>Ctrl+Z</code> سپس <code>bg %number</code></button>

</div>

<div class="quiz-card"><p>❓ تست ۲: سیگنال پیش‌فرضی که با اجرای ساده <code>kill PID</code> (بدون هیچ عددی) ارسال می‌شود کدام است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>SIGKILL</code></button>
    <button onclick="selectOption(this)">ب) <code>SIGSTOP</code></button>

</div>

<div class="quiz-card"><p>❓ تست ۳: کدام گزینه درباره <code>SIGKILL</code> و <code>SIGSTOP</code> صحیح است؟</p>

</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ب</strong><br><code>SIGKILL</code> و <code>SIGSTOP</code> هر دو غیرقابل‌نادیده‌گیری هستند و مستقیماً توسط هسته سیستم‌عامل اعمال می‌شوند؛ هیچ برنامه‌ای نمی‌تواند این دو Signal را مدیریت یا نادیده بگیرد.</div>
</div>

<div class="quiz-card"><p>❓ تست ۴: تفاوت اصلی <code>kill</code> و <code>killall</code> چیست؟</p>

</div>

</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: د</strong><br>فشردن <code>Ctrl+C</code> هنگام اجرای یک Process باعث ارسال Signal شماره ۲ یعنی <code>SIGINT</code> می‌شود که به معنای وقفه از صفحه‌کلید است.</div>
</div>

<h2>بخش اول — مرور نصب نرم‌افزار</h2>

<h3>دو خانواده اصلی Package Management</h3>

<p>کل فصل با دو خانواده اصلی توزیع‌های Linux شروع شد:</p>

<div class="code-container"><span class="code-label">خانواده‌ها</span><div class="code-block no-prompt">Debian Family              Red Hat Family
     │                          │
   .deb                       .rpm
     │                          │
 dpkg / apt                dnf (rpm)</div></div>

<p>جدول جامع دستورات:</p>

<table>
<thead><tr><th>عملیات</th><th>Debian (<code>apt</code>)</th><th>Red Hat (<code>dnf</code>)</th></tr></thead>
<tbody>
<tr><td>نصب Package</td><td><code>sudo apt install name</code></td><td><code>sudo dnf install name</code></td></tr>
<tr><td>حذف Package</td><td><code>sudo apt remove name</code></td><td><code>sudo dnf remove name</code></td></tr>
<tr><td>به‌روزرسانی لیست Repository</td><td><code>sudo apt update</code></td><td>(خودکار در <code>dnf</code>)</td></tr>
<tr><td>ارتقای Packageها</td><td><code>sudo apt upgrade</code></td><td><code>sudo dnf upgrade</code></td></tr>
<tr><td>ابزار سطح پایین</td><td><code>dpkg -i file.deb</code></td><td><code>rpm -i file.rpm</code></td></tr>
</tbody>
</table>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی</strong>
<div class="code-container"><span class="code-label">سطح ابزارها</span><div class="code-block no-prompt">dpkg و rpm → ابزارهای سطح پایین (Low-Level) — به Dependency توجه نمی‌کنند
apt و dnf  → ابزارهای سطح بالا (High-Level) — Dependencyها را هم مدیریت می‌کنند</div></div>
</div></div>

<h3>نصب از Source Code</h3>

<p>روش سنتی دیگر، کامپایل از Source است؛ سه مرحله کلاسیک:</p>

<div class="code-container"><span class="code-label">مراحل</span><div class="code-block no-prompt">Source Code → ./configure → make → make install</div></div>

<div class="code-container"><span class="code-label">توضیح</span><div class="code-block no-prompt">configure  → بررسی محیط و آماده‌سازی Makefile
make       → کامپایل کد
make install → کپی فایل‌های نهایی به مسیرهای سیستم</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>نصب از Source معمولاً به Package Manager سیستم شناخته نمی‌شود؛ یعنی به‌راحتی با <code>apt remove</code> یا <code>dnf remove</code> قابل حذف نیست، مگر با ابزارهایی مانند <code>make uninstall</code> (در صورت وجود) یا حذف دستی.</div></div>

<p>در کنار Package Manager و Source، سه روش دیگر را هم دیدیم:</p>

<div class="code-container"><span class="code-label">روش‌ها</span><div class="code-block no-prompt">روش‌های جایگزین نصب

<h4>مقایسه نهایی</h4>
<table>
<thead><tr><th>ویژگی</th><th>Snap</th><th>AppImage</th></tr></thead>
<tbody>
<tr><td>مدل</td><td>Package مدیریت‌شده</td><td>فایل اجرایی مستقل</td></tr>

</div></div>

<h2>چرا Hardware در Linux مهم است؟</h2>

<p>وقتی Linux را روی یک کامپیوتر نصب می‌کنیم، سیستم‌عامل باید بتواند با سخت‌افزارهای مختلف ارتباط برقرار کند.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">سخت‌افزارها</span><div class="code-block no-prompt">CPU
RAM
Disk
Network Card
USB
Keyboard
Mouse
Graphics Card</div></div>

<p>Linux باید این سخت‌افزارها را شناسایی کند و بتواند از آنها استفاده کند.</p>

<p>به صورت ساده:</p>

<div class="code-container"><span class="code-label">لایه‌های ارتباطی</span><div class="code-block no-prompt">Hardware

<h2>Linux از لحظه روشن شدن سیستم چه مسیری را طی می‌کند؟</h2>

<p>چند مرحله پشت سر هم اتفاق می‌افتد.</p>

<h2>Firmware چیست؟</h2>

<div class="code-container"><span class="code-label">UEFI</span><div class="code-block no-prompt">UEFI</div></div>

<p>را می‌بینیم.</p>

<p>وظیفه Firmware این است که محیط اولیه لازم برای شروع فرآیند Boot را فراهم کند و سخت‌افزارهای لازم را شناسایی و آماده کند.</p>

<p>به صورت ذهنی:</p>

<div class="code-container"><span class="code-label">نقش Firmware</span><div class="code-block no-prompt">Hardware
   ↓
Firmware
   ↓
Boot Process</div></div>

<h2>BIOS و UEFI</h2>

<p>در LPIC-1 بهتر است تفاوت کلی این دو را بدانی.</p>

<h3>BIOS</h3>
<p>روش قدیمی‌تر Firmware در PCها است.</p>

<h3>UEFI</h3>
<p>نسل جدیدتر Firmware است که امروزه در سیستم‌های جدید بسیار رایج است.</p>

<p>پس:</p>

<div class="code-container"><span class="code-label">سیستم‌های قدیمی و جدید</span><div class="code-block no-prompt">Old Systems
    ↓
  BIOS

Modern Systems
    ↓
  UEFI</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>این دو را نباید با Boot Loader اشتباه بگیری. Firmware و Boot Loader دو مفهوم متفاوت هستند.</div></div>

<h2>Boot Loader چیست؟</h2>

<p>بعد از مرحله Firmware، فرآیند Boot باید Linux را پیدا کرده و اجرا کند.</p>

<p>اینجا <strong>Boot Loader</strong> وارد می‌شود.</p>

<p>در بسیاری از سیستم‌های Linux با:</p>

<div class="code-container"><span class="code-label">Boot Loader معروف</span><div class="code-block no-prompt">GRUB</div></div>

<p>مواجه می‌شویم.</p>

<p>به صورت ساده:</p>

<div class="code-container"><span class="code-label">جایگاه GRUB</span><div class="code-block no-prompt">BIOS / UEFI
      ↓
   GRUB
      ↓
Linux Kernel</div></div>

<p>GRUB می‌تواند Kernel مناسب را انتخاب و برای اجرا آماده کند.</p>

<h2>Linux Kernel</h2>

<p>بعد از Boot Loader، نوبت به Kernel می‌رسد.</p>

<div class="code-container"><span class="code-label">ورود به Kernel</span><div class="code-block no-prompt">Boot Loader
     ↓
Linux Kernel</div></div>

<p>Kernel یکی از مهم‌ترین اجزای Linux است.</p>

<p>Kernel بین نرم‌افزارها و سخت‌افزار سیستم قرار می‌گیرد.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">ارتباط نرم‌افزار و سخت‌افزار</span><div class="code-block no-prompt">Application
     ↓
System Calls
     ↓
Kernel
     ↓
Hardware</div></div>

<p>فرض کن یک برنامه می‌خواهد اطلاعاتی را از Disk بخواند.</p>

<p>برنامه معمولاً مستقیماً به کنترلر Disk دسترسی ندارد.</p>

<p>در عوض:</p>

<div class="code-container"><span class="code-label">مسیر خواندن از دیسک</span><div class="code-block no-prompt">Application
     ↓
Kernel
     ↓
Storage Driver
     ↓
Disk</div></div>

<h3>Kernel چرا برای فصل سوم مهم است؟</h3>

<p>چون در جلسات بعدی به موضوع:</p>

<blockquote>Linux Kernel Module</blockquote>

<p>می‌رسیم.</p>

<p>بسیاری از قابلیت‌های سخت‌افزاری Linux از طریق Kernel و Driverها در اختیار سیستم قرار می‌گیرند.</p>

<p>به صورت ساده:</p>

<div class="code-container"><span class="code-label">نقش Kernel Module</span><div class="code-block no-prompt">Hardware
    ↓
Driver / Kernel Module
    ↓
Linux Kernel
    ↓
Linux System</div></div>

<p>بنابراین وقتی در جلسه دوم با <code>lshw</code> سخت‌افزار را بررسی کنیم و در جلسه سوم Kernel Module را یاد بگیریم، این مفاهیم به هم متصل خواهند شد.</p>

<h2>بعد از Kernel چه اتفاقی می‌افتد؟</h2>

<p>بعد از راه‌اندازی Kernel، سیستم باید محیط کاربری را راه‌اندازی کند.</p>

<p>در سیستم‌های Linux مدرن معمولاً:</p>

<div class="code-container"><span class="code-label">systemd</span><div class="code-block no-prompt">systemd</div></div>

<p>نقش مهمی در این مرحله دارد.</p>

<p>به شکل ساده:</p>

<div class="code-container"><span class="code-label">مراحل پس از Kernel</span><div class="code-block no-prompt">Linux Kernel
      ↓
systemd
      ↓
Services
      ↓
Login</div></div>

<p><code>systemd</code> سرویس‌های موردنیاز سیستم را راه‌اندازی می‌کند.</p>

<p>مثلاً سرویس‌های مختلف شبکه، لاگ و سایر سرویس‌های سیستم.</p>

<h2>تصویر کلی Boot</h2>

<p>تا اینجا می‌توانیم کل فرآیند را این‌طور ببینیم:</p>

<div class="code-container"><span class="code-label">چرخه کامل Boot</span><div class="code-block no-prompt">                Computer Power On
                       ↓
                  BIOS / UEFI
                       ↓
                   Boot Loader
                       ↓
                  Linux Kernel
                       ↓
                    systemd
                       ↓
                    Services
                       ↓
                     Login</div></div>

<p>این زنجیره را فعلاً به عنوان <strong>نقشه ذهنی</strong> نگه دار.</p>

<p>در فصل پنجم دوباره به Boot و Systemd برمی‌گردیم و آنجا جزئیات بیشتری بررسی می‌کنیم.</p>

<h2>Hardware در Linux</h2>

<p>حالا از Boot کمی فاصله بگیریم و خود Hardware را بررسی کنیم.</p>

<p>Linux باید بتواند سخت‌افزارهای مختلف را شناسایی کند.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">سخت‌افزارهای قابل شناسایی</span><div class="code-block no-prompt">CPU
RAM
Disk
Network Controller
USB Controller
Audio Device
GPU</div></div>

<p>یکی از ابزارهایی که برای مشاهده اطلاعات Hardware استفاده می‌کنیم:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">lshw</div></div>

<p>است.</p>

<h3><code>lshw</code> چیست؟</h3>

<p>نام <code>lshw</code> از:</p>

<div class="code-container"><span class="code-label">معنی</span><div class="code-block no-prompt">List Hardware</div></div>

<p>می‌آید.</p>

<p>این ابزار برای نمایش اطلاعات Hardware سیستم استفاده می‌شود.</p>

<p>مثلاً می‌توانی اجرا کنی:</p>

<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">sudo lshw</div></div>

<p>خروجی می‌تواند اطلاعات مختلف سخت‌افزاری سیستم را نشان دهد.</p>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته مهم</strong><code>lshw</code> ابزار مدیریت Hardware نیست؛ ابزار <strong>مشاهده و گزارش اطلاعات Hardware</strong> است.</div></div>

<h3>چرا <code>lshw</code> را یاد می‌گیریم؟</h3>

<p>فرض کن یک سرور Linux داری و می‌خواهی بفهمی:</p>

<div class="code-container"><span class="code-label">سوالات متداول</span><div class="code-block no-prompt">چه CPUای دارد؟
چه RAMای دارد؟
چه Diskهایی دارد؟
چه کارت شبکه‌ای دارد؟
چه Controllerهایی دارد؟</div></div>

<p>به جای اینکه همه چیز را از روی ظاهر سیستم حدس بزنی، می‌توانی از ابزارهای Linux استفاده کنی.</p>

<p>یکی از آنها:</p>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">lshw</div></div>

<p>است.</p>

<p>در جلسه دوم فصل سوم به صورت کامل‌تر سراغ <code>lshw</code> خواهیم رفت.</p>

<h2>Storage چیست؟</h2>

<p>حالا وارد بخش مهم‌تر فصل می‌شویم.</p>

<p>یکی از مهم‌ترین سخت‌افزارهای یک سیستم Linux، <strong>Storage</strong> است.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">انواع Storage</span><div class="code-block no-prompt">HDD
SSD
NVMe SSD
USB Storage</div></div>

<p>این تجهیزات برای ذخیره اطلاعات استفاده می‌شوند.</p>

<p>به صورت ساده:</p>

<div class="code-container"><span class="code-label">لایه‌های ذخیره‌سازی</span><div class="code-block no-prompt">Application
     ↓
Filesystem
     ↓
Partition
     ↓
Disk</div></div>

<p>اما این تصویر هنوز کامل نیست؛ چون در Linux معمولاً مفاهیم بیشتری بین این لایه‌ها وجود دارد.</p>

<h3>Disk چیست؟</h3>

<p>به صورت ساده، Disk وسیله‌ای برای ذخیره اطلاعات است.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">نمونه نام دیسک</span><div class="code-block no-prompt">/dev/sda</div></div>

<p>یا:</p>

<div class="code-container"><span class="code-label">نمونه NVMe</span><div class="code-block no-prompt">/dev/nvme0n1</div></div>

<p>ممکن است نماینده یک Disk در Linux باشند.</p>

<p>این نام‌ها را در جلسه <code>fdisk</code> و Disk Concepts دقیق‌تر بررسی خواهیم کرد.</p>

<h3>Partition چیست؟</h3>

<p>یک Disk می‌تواند به چند بخش تقسیم شود.</p>

<p>به هر بخش:</p>

<div class="code-container"><span class="code-label">Partition</span><div class="code-block no-prompt">Partition</div></div>

<p>می‌گوییم.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">ساختار Partition</span><div class="code-block no-prompt">Disk
│
├── Partition 1
├── Partition 2
└── Partition 3</div></div>

<p>یا به شکل Linux:</p>

<div class="code-container"><span class="code-label">نمایش در Linux</span><div class="code-block no-prompt">/dev/sda
   │
   ├── /dev/sda1
   ├── /dev/sda2
   └── /dev/sda3</div></div>

<p>در اینجا:</p>

<div class="code-container"><span class="code-label">خود دیسک</span><div class="code-block no-prompt">/dev/sda</div></div>

<p>خود Disk است.</p>

<p>و:</p>

<div class="code-container"><span class="code-label">پارتیشن‌ها</span><div class="code-block no-prompt">/dev/sda1
/dev/sda2
/dev/sda3</div></div>

<p>Partitionهای آن هستند.</p>

<h3>آیا Partition همان Filesystem است؟</h3>

<p><strong>خیر.</strong></p>

<p>این یکی از نکات مهم فصل است.</p>

<p>Partition و Filesystem دو مفهوم متفاوت هستند.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">تفاوت</span><div class="code-block no-prompt">Disk
  ↓
Partition
  ↓
Filesystem</div></div>

<p>یعنی ابتدا یک Partition داریم و می‌توانیم روی آن یک Filesystem ایجاد کنیم.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">/dev/sda1
     ↓
   ext4</div></div>

<p>اینجا:</p>

<div class="code-container"><span class="code-label">Partition</span><div class="code-block no-prompt">/dev/sda1</div></div>

<p>Partition است.</p>

<p>و:</p>

<div class="code-container"><span class="code-label">Filesystem</span><div class="code-block no-prompt">ext4</div></div>

<p>Filesystem است.</p>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته طلایی</strong>این تفاوت را حتماً یاد بگیر.</div></div>

<h3>Mount چیست؟</h3>

<p>Filesystem زمانی که می‌خواهیم از آن در ساختار فایل Linux استفاده کنیم، باید در یک مسیر مناسب <strong>Mount</strong> شود.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">مراحل Mount</span><div class="code-block no-prompt">/dev/sda1
    ↓
Filesystem
    ↓
Mount
    ↓
/data</div></div>

<p>بعد از Mount شدن، می‌توانیم از مسیر:</p>

<div class="code-container"><span class="code-label">مسیر دسترسی</span><div class="code-block no-prompt">/data</div></div>

<p>به اطلاعات آن Filesystem دسترسی داشته باشیم.</p>

<p>پس:</p>

<div class="code-container"><span class="code-label">زنجیره کامل</span><div class="code-block no-prompt">Disk
 ↓
Partition
 ↓
Filesystem
 ↓
Mount Point</div></div>

<p>این زنجیره یکی از مهم‌ترین مفاهیم فصل سوم است.</p>

<h3>یک مثال کامل</h3>

<p>فرض کن یک Disk داریم:</p>

<div class="code-container"><span class="code-label">دیسک</span><div class="code-block no-prompt">/dev/sdb</div></div>

<p>آن را Partition می‌کنیم:</p>

<div class="code-container"><span class="code-label">پارتیشن‌ها</span><div class="code-block no-prompt">/dev/sdb
    │
    ├── /dev/sdb1
    └── /dev/sdb2</div></div>

<p>روی <code>/dev/sdb1</code> یک Filesystem ایجاد می‌کنیم:</p>

<div class="code-container"><span class="code-label">ساخت Filesystem</span><div class="code-block no-prompt">/dev/sdb1
    ↓
ext4</div></div>

<p>بعد آن را Mount می‌کنیم:</p>

<div class="code-container"><span class="code-label">Mount</span><div class="code-block no-prompt">/dev/sdb1
    ↓
ext4
    ↓
/data</div></div>

<p>حالا کاربر می‌تواند از:</p>

<div class="code-container"><span class="code-label">دسترسی</span><div class="code-block">/data</div></div>

<p>برای دسترسی به اطلاعات استفاده کند.</p>

<h2>Partition، RAID و LVM چه ارتباطی دارند؟</h2>

<p>طبق سرفصل فصل سوم، یکی از بخش‌های اصلی:</p>

<blockquote>پارتیشن‌بندی RAID و LVM</blockquote>

<p>است.</p>

<p>این سه مفهوم را نباید یکی فرض کنیم.</p>

<h3>Partition</h3>
<p>تقسیم کردن فضای Disk به بخش‌های مختلف.</p>

<h3>RAID</h3>
<p>ترکیب چند Disk برای اهدافی مانند:</p>
<div class="code-container"><span class="code-label">اهداف RAID</span><div class="code-block no-prompt">Performance
Redundancy
Fault Tolerance</div></div>

<h3>LVM</h3>
<p>ایجاد یک لایه مدیریت انعطاف‌پذیر برای فضای Storage.</p>

<p>به صورت خیلی ساده:</p>

<div class="code-container"><span class="code-label">LVM</span><div class="code-block no-prompt">Disk
 ↓
Partition
 ↓
LVM
 ↓
Logical Volume
 ↓
Filesystem</div></div>

<p>یا در یک سناریوی دیگر:</p>

<div class="code-container"><span class="code-label">RAID</span><div class="code-block no-prompt">Multiple Disks
      ↓
     RAID
      ↓
   Storage
      ↓
Filesystem</div></div>

<p>بعداً هر کدام را جداگانه و عمیق بررسی می‌کنیم.</p>

<h2>ساختار کلی Storage در Linux</h2>

<p>حالا می‌توانیم یک تصویر ذهنی بزرگ‌تر بسازیم:</p>

<div class="code-container"><span class="code-label">نقشه کلی Storage</span><div class="code-block no-prompt">                    Linux Storage
                         │
          ┌──────────────┴──────────────┐
          ↓                             ↓
       Hardware                       Software
          │                             │
        Disk                        Filesystem
          │                             │
      Partition                    Mount Point
          │
     ┌────┴────┐
     ↓         ↓
    LVM       RAID</div></div>

<p>البته این نمودار صرفاً برای درک ارتباط مفاهیم است و همه سناریوهای واقعی Storage را نشان نمی‌دهد.</p>

<h2>چرا شناخت Disk مهم است؟</h2>

<p>فرض کن سرور شرکت دارای چهار Disk باشد:</p>

<div class="code-container"><span class="code-label">دیسک‌های سرور</span><div class="code-block no-prompt">Disk 1
Disk 2
Disk 3
Disk 4</div></div>

<p>اگر بخواهی روی آن‌ها RAID ایجاد کنی، باید اول بتوانی تشخیص بدهی:</p>

<div class="code-container"><span class="code-label">سوالات کلیدی</span><div class="code-block no-prompt">کدام Disk چیست؟
نام Linux آن چیست؟
ظرفیت آن چقدر است؟
آیا Disk موردنظر همان Diskی است که فکر می‌کنم؟</div></div>

<p>اگر اشتباه کنی و Disk اشتباهی را Partition یا Format کنی، ممکن است اطلاعات مهم از بین برود.</p>

<p>بنابراین قبل از دستورات خطرناک مثل:</p>

<div class="code-container"><span class="code-label">دستورات پرخطر</span><div class="code-block">fdisk
mkfs
pvcreate
mdadm</div></div>

<p>باید <strong>Hardware و Disk را درست شناسایی کنیم.</strong></p>

<p>این موضوع از نظر Lab بسیار مهم است.</p>

<h2>یک اصل مهم در کار با Disk</h2>

<p>قبل از هر عملیات Storage:</p>

<blockquote>اول شناسایی، بعد بررسی، سپس تغییر.</blockquote>

<p>یعنی:</p>

<div class="code-container"><span class="code-label">روش صحیح</span><div class="code-block no-prompt">Identify
   ↓
Inspect
   ↓
Plan
   ↓
Change</div></div>

<p>نه اینکه مستقیماً دستور Partition یا Format را اجرا کنیم.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">روش غلط</span><div class="code-block no-prompt">❌ fdisk
   ↓
   بعد ببینیم روی چه Diskی هستیم</div></div>

<p>روش صحیح:</p>

<div class="code-container"><span class="code-label">روش درست</span><div class="code-block no-prompt">✅ شناسایی Disk
   ↓
بررسی Disk
   ↓
انتخاب Disk صحیح
   ↓
fdisk</div></div>

<p>این عادت در محیط واقعی Linux بسیار مهم است.</p>

<h2>ارتباط چهار بخش اصلی فصل</h2>

<p>حالا چهار بخش اسلاید فصل سوم را کنار هم قرار دهیم.</p>

<h3>بخش اول — Boot</h3>
<div class="code-container"><span class="code-label">Boot</span><div class="code-block no-prompt">Power
 ↓
BIOS / UEFI
 ↓
Boot Loader
 ↓
Kernel
 ↓
systemd
 ↓
Services</div></div>

<h3>بخش دوم — Hardware</h3>
<div class="code-container"><span class="code-label">Hardware</span><div class="code-block no-prompt">CPU
RAM
Disk
Network
USB
GPU
...</div></div>
<p>و ابزارهایی مثل:</p>
<div class="code-container"><span class="code-label">ابزار</span><div class="code-block">lshw</div></div>
<p>برای مشاهده Hardware.</p>

<h3>بخش سوم — Partition / RAID / LVM</h3>
<div class="code-container"><span class="code-label">Storage Technologies</span><div class="code-block no-prompt">Disk
 ↓
Partition
 ↓
 ┌───────┬───────┐
 ↓       ↓       ↓
LVM     RAID    Normal</div></div>

<h3>بخش چهارم — Disk Structure</h3>
<div class="code-container"><span class="code-label">ساختار دیسک</span><div class="code-block no-prompt">Disk
 ↓
Partition
 ↓
Filesystem
 ↓

<p>در این جلسه می‌خواهیم درک کنیم که <strong>سیستم‌عامل Linux چگونه سخت‌افزار را شناسایی، مدیریت و در اختیار کاربر قرار می‌دهد</strong>. فرقی نمی‌کند با یک دیسک سخت، کارت شبکه، درایو USB یا یک دستگاه PCI سروکار داشته باشیم؛ باید بدانیم:</p>

<ul>
    <li><strong>از کجا</strong> باید اطلاعات آن را پیدا کنیم (<code>/dev</code>, <code>/proc</code>, <code>/sys</code>)</li>
    <li><strong>با چه ابزاری</strong> می‌توانیم آن را شناسایی و عیب‌یابی کنیم (<code>lshw</code>, <code>lsblk</code>, <code>lspci</code>, <code>lsusb</code>, ...)</li>
    <li><strong>فرآیند بوت</strong> چگونه از روشن شدن دستگاه تا لاگین کاربر پیش می‌رود</li>
</ul>

<p>این جلسه پایه‌ای برای مباحث بعدی مانند <strong>Kernel Modules</strong>, <strong>Disk Management</strong>, <strong>LVM</strong>, <strong>RAID</strong> و <strong>Systemd</strong> خواهد بود.</p>

<h2>مرور کلی: لایه‌های سخت‌افزار در Linux</h2>

<p>قبل از ورود به جزئیات، بیایید یک نمای کلی از لایه‌های مختلف سیستم را ببینیم:</p>

<div class="code-container"><span class="code-label">لایه‌ها</span><div class="code-block no-prompt">Computer (Hardware)
        ↓
BIOS / UEFI (Firmware)
        ↓
GRUB (Boot Loader)
        ↓
Linux Kernel (هسته)
        ↓
systemd (اولین فرایند در User Space)
        ↓
سرویس‌ها و Targetها
        ↓
ورود کاربر (Login)</div></div>

<p>در ادامه هر مرحله را با دقت بیشتری بررسی می‌کنیم.</p>

<h2>فرآیند بوت (Boot Process) از صفر تا ورود کاربر</h2>

<h3>روشن شدن دستگاه (Power On)</h3>

<p>وقتی دکمه پاور را می‌زنید، <strong>Firmware</strong> سیستم (که روی مادربرد قرار دارد) کنترل را به دست می‌گیرد. این Firmware می‌تواند به دو نوع باشد:</p>

<ul>
    <li><strong>BIOS</strong> (قدیمی‌تر)</li>
    <li><strong>UEFI</strong> (جدیدتر)</li>
</ul>

<p>در این مرحله، هنوز هیچ سیستم‌عاملی اجرا نشده است.</p>

<h3>POST (Power‑On Self‑Test)</h3>

<p>پس از روشن شدن، Firmware یک سری تست‌های اولیه روی سخت‌افزارهای اصلی انجام می‌دهد تا مطمئن شود که همه چیز برای راه‌اندازی آماده است. به این تست‌ها <strong>POST</strong> گفته می‌شود.</p>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>در صورت بروز خطا در POST، ممکن است سیستم با یک سری بوق (Beep) یا پیغام خطا مواجه شود.</div></div>

<h3>انتخاب دستگاه بوت و اجرای Boot Loader</h3>

<p>بعد از POST، Firmware به دنبال یک <strong>دستگاه بوت</strong> (مثل هارددیسک، SSD، USB یا DVD) می‌گردد و <strong>Boot Loader</strong> را از روی آن بارگیری می‌کند.</p>

<p>در اکثر سیستم‌های Linux، Boot Loader محبوب <strong>GRUB</strong> (GRand Unified Bootloader) است.</p>

<p>وظیفه GRUB:</p>

<ul>
    <li>نمایش منوی بوت (در صورت وجود چندین سیستم‌عامل یا چندین کرنل)</li>
    <li>بارگذاری <strong>Kernel</strong> و <strong>initramfs</strong> (یا initrd) در حافظه</li>
    <li>انتقال کنترل به کرنل</li>
</ul>

<h3>بارگذاری Linux Kernel</h3>

<p>پس از اینکه GRUB کرنل را بارگذاری کرد، کرنل اجرا می‌شود. کرنل <strong>قلب</strong> سیستم‌عامل است و مسئولیت‌های کلیدی زیر را بر عهده دارد:</p>

<ul>
    <li>شناسایی و مقداردهی اولیه سخت‌افزارها</li>
    <li>راه‌اندازی درایورهای مورد نیاز</li>
    <li>ایجاد ساختارهای داده برای مدیریت حافظه، پردازنده، و دستگاه‌ها</li>
    <li>راه‌اندازی اولین فرایند در <strong>User Space</strong> (که معمولاً systemd است)</li>
</ul>

<p>در این مرحله، کرنل دستگاه‌های متصل را شناسایی می‌کند و اطلاعات مربوط به آنها را در ساختارهای مجازی مانند <code>/proc</code> و <code>/sys</code> در اختیار قرار می‌دهد.</p>

<h3>systemd – اولین فرایند در User Space</h3>

<p>بعد از اینکه کرنل بارگذاری شد، اولین فرایند در فضای کاربر (User Space) اجرا می‌شود. در توزیع‌های مدرن Linux، این فرایند <strong>systemd</strong> است (با PID=1).</p>

<p>systemd وظیفه دارد:</p>

<ul>
    <li>سرویس‌های سیستمی را راه‌اندازی کند</li>
    <li>به <strong>Target</strong> (وضعیت هدف) مشخصی برسد (مثلاً multi‑user.target یا graphical.target)</li>
    <li>در نهایت، محیط ورود کاربر (مانند getty یا Display Manager) را فعال کند</li>
</ul>

<h3>Target و سرویس‌ها</h3>

<p>systemd بر اساس <strong>Target</strong>ها عمل می‌کند. یک Target مجموعه‌ای از سرویس‌ها و وابستگی‌ها را تعریف می‌کند که باید در آن حالت خاص اجرا شوند. برای مثال:</p>

<ul>
    <li><code>multi-user.target</code> → حالت چندکاربری با خط فرمان</li>
    <li><code>graphical.target</code> → حالت چندکاربری با محیط گرافیکی</li>
</ul>

<p>پس از اینکه سرویس‌های مورد نیاز راه‌اندازی شدند، سیستم آماده پذیرش کاربر است.</p>

<h3>ورود کاربر (Login)</h3>

<p>در نهایت، یک <strong>Getty</strong> (برای ورود از طریق کنسول) یا <strong>Display Manager</strong> (برای ورود گرافیکی) اجرا می‌شود و کاربر می‌تواند وارد سیستم شود.</p>

<h2>BIOS در مقابل UEFI (نکات کلیدی)</h2>

<p>درک تفاوت بین BIOS و UEFI برای مدیریت بوت و دیسک بسیار مهم است.</p>

<h2>نمایش سخت‌افزار در Linux: سه شاخه کلیدی</h2>

<p>Linux برای نمایش سخت‌افزار و دستگاه‌ها از <strong>سه شاخه مجازی</strong> اصلی استفاده می‌کند:</p>

<div class="table-wrap">
<table>
<thead><tr><th>مسیر</th><th>نقش</th><th>نوع</th></tr></thead>
<tbody>
<tr><td><code>/dev</code></td><td>شامل <strong>فایل‌های دستگاه</strong> (Device Files) برای تعامل با سخت‌افزار</td><td>فایل‌های ویژه (Special Files)</td></tr>
<tr><td><code>/proc</code></td><td>اطلاعات لحظه‌ای درباره کرنل، فرایندها، و سخت‌افزار (مجازی)</td><td>Virtual Filesystem</td></tr>
<tr><td><code>/sys</code></td><td>اطلاعات ساختاریافته و سلسله‌مراتبی درباره دستگاه‌ها و درایورها</td><td>Virtual Filesystem</td></tr>
</tbody>
</table>
</div>

<p>بیایید هر کدام را دقیق‌تر ببینیم.</p>

<h3><code>/dev</code> – فایل‌های دستگاه</h3>

<p>در Unix/Linux، تقریباً همه چیز به صورت <strong>فایل</strong> در نظر گرفته می‌شود. دستگاه‌های سخت‌افزاری نیز از طریق فایل‌های مخصوصی در <code>/dev</code> قابل دسترسی هستند.</p>

<ul>
    <li>یک دیسک سخت ممکن است به صورت <code>/dev/sda</code> یا <code>/dev/nvme0n1</code> ظاهر شود.</li>
    <li>پارتیشن‌های آن: <code>/dev/sda1</code>, <code>/dev/sda2</code> و ...</li>
    <li>یک ترمینال سریال: <code>/dev/ttyS0</code></li>
    <li>یک دستگاه USB: ممکن است به صورت <code>/dev/ttyUSB0</code> (اگر شبیه‌ساز سریال باشد) یا به صورت یک فایل بلوکی برای حافظه ذخیره‌سازی ظاهر شود.</li>
</ul>

<h4>دو نوع اصلی فایل دستگاه</h4>

<div class="table-wrap">
<table>
<thead><tr><th>نوع</th><th>ویژگی</th><th>مثال</th></tr></thead>
<tbody>
<tr><td><strong>Character Device</strong></td><td>داده را به صورت <strong>جریانی</strong> (Stream) و ترتیبی منتقل می‌کند؛ دسترسی بایت‌به‌بایت</td><td>ترمینال (<code>/dev/tty</code>)، موس، صفحه کلید، پورت سریال</td></tr>
<tr><td><strong>Block Device</strong></td><td>داده را به صورت <strong>بلوک‌هایی</strong> با اندازه ثابت منتقل می‌کند؛ دسترسی تصادفی (Random Access) امکان‌پذیر است</td><td>دیسک‌ها (<code>/dev/sda</code>، <code>/dev/nvme0n1</code>)</td></tr>
</tbody>
</table>
</div>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمون</strong><br>دیسک‌ها همیشه <strong>Block Device</strong> هستند، در حالی که دستگاه‌های ورودی/خروجی کاراکتری معمولاً <strong>Character Device</strong> محسوب می‌شوند.</div></div>

<h3><code>/proc</code> – اطلاعات کرنل و سیستم</h3>

<p><code>/proc</code> یک <strong>فایل‌سیستم مجازی</strong> است که توسط کرنل ساخته می‌شود و اطلاعات پویا درباره:</p>

<ul>
    <li>فرایندهای در حال اجرا (هر فرایند یک زیرشاخه به نام PID دارد)</li>
    <li>سخت‌افزار و پیکربندی کرنل</li>
    <li>آمار سیستم</li>
</ul>

<p>را در اختیار کاربر قرار می‌دهد.</p>

<p>دو فایل مهم در این جلسه:</p>

<div class="table-wrap">
<table>
<thead><tr><th>فایل</th><th>محتوا</th></tr></thead>
<tbody>
<tr><td><code>/proc/interrupts</code></td><td>نشان‌دهنده <strong>IRQ</strong>ها (Interrupt Request) و تعداد وقفه‌های هر دستگاه</td></tr>
<tr><td><code>/proc/ioports</code></td><td>نشان‌دهنده محدوده <strong>I/O Port</strong>هایی که دستگاه‌ها از آنها استفاده می‌کنند</td></tr>
</tbody>
</table>
</div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>کاربرد عملی</strong><br>اگر دستگاهی به درستی کار نمی‌کند، بررسی <code>/proc/interrupts</code> و <code>/proc/ioports</code> می‌تواند به شناسایی تداخل‌های سخت‌افزاری کمک کند.</div></div>

<h3><code>/sys</code> – اطلاعات ساختاریافته دستگاه‌ها</h3>

<p><code>/sys</code> نیز یک فایل‌سیستم مجازی است که اطلاعات دقیق‌تری درباره <strong>دستگاه‌ها، درایورها و روابط بین آنها</strong> در اختیار می‌گذارد. برخلاف <code>/proc</code> که بیشتر جنبه آماری و فرایندی دارد، <code>/sys</code> به صورت سلسله‌مراتبی بر اساس <strong>bus</strong>ها، <strong>device</strong>ها و <strong>driver</strong>ها سازماندهی شده است.</p>

<p>برای مثال:</p>

<ul>
    <li><code>/sys/block/sda/</code> → اطلاعات مربوط به دیسک <code>sda</code></li>
    <li><code>/sys/class/net/eth0/</code> → اطلاعات مربوط به رابط شبکه <code>eth0</code></li>
</ul>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>ابزارهایی مانند <code>udev</code> از <code>/sys</code> برای مدیریت پویای دستگاه‌ها استفاده می‌کنند.</div></div>

<h2>ابزارهای شناسایی سخت‌افزار (عملی)</h2>

<p>حالا که با مکان‌های ذخیره اطلاعات آشنا شدیم، نوبت به <strong>دستورات عملی</strong> می‌رسد که می‌توانیم برای مشاهده و عیب‌یابی سخت‌افزار از آنها استفاده کنیم.</p>

<h3><code>lshw</code> – اطلاعات جامع سخت‌افزار</h3>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo lshw</div></div>

<p>این دستور گزارشی <strong>کامل</strong> از تمام سخت‌افزارهای شناسایی شده شامل CPU، حافظه، مادربرد، دیسک‌ها، کارت‌های شبکه، دستگاه‌های PCI و USB ارائه می‌دهد.</p>

<ul>
    <li>به دلیل نیاز به دسترسی به اطلاعات سطح پایین، معمولاً باید با <code>sudo</code> اجرا شود.</li>
    <li>با گزینه <code>-short</code> خروجی خلاصه‌تر می‌شود:</li>
</ul>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block">sudo lshw -short</div></div>

<ul>
    <li>با گزینه <code>-class</code> می‌توانید یک دسته خاص مانند <code>disk</code> یا <code>network</code> را فیلتر کنید:</li>
</ul>
<div class="code-container"><span class="code-label">فیلتر</span><div class="code-block">sudo lshw -class disk</div></div>

<h3><code>lsdev</code> – اطلاعات دستگاه‌ها (از طریق <code>/proc</code>)</h3>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">lsdev</div></div>

<p>این دستور اطلاعات کلی درباره دستگاه‌ها، از جمله <strong>IRQ</strong> و <strong>I/O Port</strong> مربوط به هر دستگاه را نشان می‌دهد. در واقع اطلاعات خود را از <code>/proc/interrupts</code>، <code>/proc/ioports</code> و <code>/proc/dma</code> می‌گیرد.</p>

<h3><code>lsblk</code> – لیست Block Deviceها (دیسک‌ها و پارتیشن‌ها)</h3>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">lsblk</div></div>

<p>این دستور به صورت <strong>درختی</strong> تمام دیسک‌ها و پارتیشن‌های سیستم را نمایش می‌دهد. خروجی شامل اطلاعاتی مانند اندازه، نوع (disk/part) و نقطه اتصال (mount point) است.</p>

<p>مثال خروجی:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">NAME        MAJ:MIN RM  SIZE RO TYPE MOUNTPOINT
sda           8:0    0   50G  0 disk
├─sda1        8:1    0    1G  0 part /boot
└─sda2        8:2    0   49G  0 part /</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>این دستور برای شروع کار با دیسک‌ها بسیار مفید است و در مباحث بعدی (<code>fdisk</code>, <code>parted</code>, <code>LVM</code>) بارها از آن استفاده خواهید کرد.</div></div>

<h3><code>lspci</code> – دستگاه‌های PCI</h3>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">lspci</div></div>

<p>تمام دستگاه‌های متصل به <strong>PCI Bus</strong> (مانند کارت گرافیک، کارت شبکه، کنترلرهای ذخیره‌سازی) را لیست می‌کند.</p>

<ul>
    <li>با گزینه <code>-v</code> یا <code>-vv</code> جزئیات بیشتری دریافت می‌کنید.</li>
    <li>با گزینه <code>-k</code> می‌توانید ببینید که کدام <strong>درایور کرنل</strong> برای هر دستگاه استفاده شده است.</li>
</ul>

<div class="code-container"><span class="code-label">مثال</span><div class="code-block">lspci -k</div></div>

<p>خروجی ممکن است چیزی شبیه این باشد:</p>

<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">00:1f.2 SATA controller: Intel Corporation 82801IR/IO/IH (ICH9R/DO/DH) 6 port SATA Controller [AHCI mode]
        Kernel driver in use: ahci</div></div>

<h3><code>lsusb</code> – دستگاه‌های USB</h3>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">lsusb</div></div>

<p>دستگاه‌های متصل به <strong>USB</strong> را نمایش می‌دهد. با گزینه <code>-v</code> جزئیات بیشتر (مانند سرعت، شناسه‌های محصول و فروشنده) قابل مشاهده است.</p>

<h3>ابزارهای تکمیلی (مفید برای LPIC-1)</h3>

<p>علاوه بر دستورات اصلی، این ابزارها نیز در عیب‌یابی سخت‌افزار کاربرد دارند:</p>

<ul>
    <li><strong><code>lscpu</code></strong> – اطلاعات مربوط به CPU (معماری، هسته‌ها، فرکانس)</li>
    <li><strong><code>lsmem</code></strong> – اطلاعات مربوط به حافظه فیزیکی (در برخی توزیع‌ها)</li>
    <li><strong><code>dmidecode</code></strong> – اطلاعات کامل سخت‌افزار از طریق DMI (SMBIOS) که حتی مدل مادربرد و شماره سریال را نشان می‌دهد.</li>
    <li><strong><code>dmesg</code></strong> – نمایش پیام‌های حلقه کرنل که شامل اطلاعات شناسایی دستگاه‌ها در زمان بوت است. بسیار مفید برای عیب‌یابی اولیه.</li>
</ul>

<h2>سناریوهای عیب‌یابی (تشخیص مشکل)</h2>

<p>بیایید چند سناریوی رایج را بررسی کنیم تا بدانیم در هر موقعیت از کدام ابزار استفاده کنیم.</p>

<h3>سناریو ۱: یک دیسک جدید وصل کرده‌ایم، اما در سیستم دیده نمی‌شود</h3>

<ol>
    <li>بررسی کلی سخت‌افزار:
        <div class="code-container"><span class="code-label">بررسی</span><div class="code-block">sudo lshw -class disk</div></div>
    </li>
    <li>بررسی Block Deviceها:
        <div class="code-container"><span class="code-label">بررسی</span><div class="code-block">lsblk</div></div>
    </li>
    <li>بررسی پیام‌های کرنل برای مشاهده رویدادهای شناسایی:
        <div class="code-container"><span class="code-label">بررسی</span><div class="code-block">dmesg | tail -20</div></div>
    </li>
    <li>اگر دیسک از نوع USB است، ابتدا:
        <div class="code-container"><span class="code-label">بررسی</span><div class="code-block">lsusb</div></div>
    </li>
</ol>

<h3>سناریو ۲: کارت شبکه عملکرد مناسبی ندارد</h3>

<ol>
    <li>بررسی دستگاه PCI:
        <div class="code-container"><span class="code-label">بررسی</span><div class="code-block">lspci -k | grep -i network</div></div>
    </li>
    <li>بررسی درایور بارگذاری شده:
        <div class="code-container"><span class="code-label">بررسی</span><div class="code-block">lsmod | grep &lt;driver_name&gt;</div></div>
    </li>
    <li>بررسی interrupts:
        <div class="code-container"><span class="code-label">بررسی</span><div class="code-block">cat /proc/interrupts | grep -i &lt;interface_name&gt;</div></div>
    </li>
</ol>

<h3>سناریو ۳: یک دستگاه USB متصل شده اما شناسایی نمی‌شود</h3>

<ol>
    <li>بررسی USB:
        <div class="code-container"><span class="code-label">بررسی</span><div class="code-block">lsusb</div></div>
    </li>
    <li>بررسی کرنل برای رویدادهای USB:
        <div class="code-container"><span class="code-label">بررسی</span><div class="code-block">dmesg | grep -i usb</div></div>
    </li>
    <li>اگر دستگاه یک حافظه فلش است، در <code>/dev</code> ظاهر می‌شود؛ پس:
        <div class="code-container"><span class="code-label">بررسی</span><div class="code-block">lsblk</div></div>
    </li>
</ol>

<h2>جمع‌بندی مفهومی (نمودار نهایی)</h2>

<div class="code-container"><span class="code-label">نقشه کامل</span><div class="code-block no-prompt">                   Computer
                       ↓
                   Power On
                       ↓
                  BIOS / UEFI
                       ↓
                     POST
                       ↓
                     GRUB
                       ↓
                 Linux Kernel
                       ↓
                    systemd
                       ↓
                  User Space
                       │
        ┌──────────────┼──────────────┐
        ↓              ↓              ↓
      /dev           /proc           /sys
        │              │              │
   Device Files    Kernel Info    Hardware Info
        │              │              │
   ┌────┴────┐   ┌─────┴─────┐   ┌────┴────┐
   │Block Dev│   │interrupts │   │class/net│
   │Char Dev │   │ioports    │   │block/   │
   └─────────┘   └───────────┘   └─────────┘
        │
   ┌────┴──────────────────────┐
   │          ابزارها           │
   │  lshw  lsdev  lsblk       │
   │  lspci lsusb  lscpu       │
   └───────────────────────────┘</div></div>

<h2>جدول نهایی دستورات (برای مرور سریع)</h2>

<div class="table-wrap">
<table>
<thead><tr><th>دستور</th><th>کاربرد اصلی</th></tr></thead>
<tbody>
<tr><td><code>lshw</code></td><td>گزارش جامع سخت‌افزار</td></tr>
<tr><td><code>lsdev</code></td><td>اطلاعات دستگاه‌ها از <code>/proc</code></td></tr>
<tr><td><code>lsblk</code></td><td>لیست Block Deviceها (دیسک و پارتیشن)</td></tr>
<tr><td><code>lspci</code></td><td>دستگاه‌های PCI</td></tr>
<tr><td><code>lsusb</code></td><td>دستگاه‌های USB</td></tr>
<tr><td><code>lscpu</code></td><td>اطلاعات CPU</td></tr>
<tr><td><code>dmidecode</code></td><td>اطلاعات کامل سخت‌افزار از BIOS/UEFI</td></tr>
<tr><td><code>dmesg</code></td><td>پیام‌های کرنل (بوت و زمان اجرا)</td></tr>
</tbody>
</table>
</div>

<div class="summary-box">
    <h3>⭐ نکات طلایی برای LPIC-1</h3>
    <ul>
        <li><strong>ترتیب بوت</strong>: <code>BIOS/UEFI → GRUB → Kernel → systemd → Login</code></li>
        <li><strong>فایل‌های دستگاه</strong>: در <code>/dev</code> قرار دارند و دو نوع <code>Character</code> و <code>Block</code> دارند.</li>
        <li><strong><code>/proc</code></strong>: مجازی، حاوی اطلاعات کرنل و فرایندها (از جمله <code>interrupts</code> و <code>ioports</code>).</li>
        <li><strong><code>/sys</code></strong>: مجازی، حاوی اطلاعات ساختاریافته دستگاه‌ها و درایورها.</li>
        <li><strong>تفاوت Firmware و Boot Loader</strong>: <code>BIOS/UEFI</code> = Firmware، <code>GRUB</code> = Boot Loader.</li>
        <li><strong>UEFI</strong> از <code>ESP</code> (EFI System Partition) استفاده می‌کند که معمولاً در <code>/boot/efi</code> mount می‌شود و با FAT فرمت می‌شود.</li>
        <li><strong>ابزارهای شناسایی</strong>: هر کدام برای نوع خاصی از سخت‌افزار طراحی شده‌اند؛ انتخاب درست ابزار به نوع مشکل بستگی دارد.</li>
    </ul>
</div>

<div class="quiz-answer"><strong>✅ پاسخ صحیح: ب</strong><br>UEFI نسل جدید Firmware است و از ESP (EFI System Partition) برای بوت استفاده می‌کند. Boot Loader مانند GRUB جدا از Firmware است.</div>
</div>

<div class="quiz-card"><p>❓ سوال ۱۰: کدام تطابق بین مسیر و محتوای آن صحیح است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>/dev</code> → فقط اطلاعات کرنل</button>
    <button onclick="selectOption(this)">ب) <code>/proc</code> → فایل‌های دستگاه</button>
    <button onclick="selectOption(this)">ج) <code>/sys</code> → اطلاعات دستگاه و سخت‌افزار</button>
    <button onclick="selectOption(this)">د) <code>/dev</code> → اطلاعات فرایندها</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ج</strong><br><code>/sys</code> شامل اطلاعات ساختاریافته دستگاه‌ها و سخت‌افزار است. <code>/dev</code> شامل فایل‌های دستگاه، <code>/proc</code> شامل اطلاعات کرنل و فرایندهاست.</div>
</div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>🧠 مرور ۳۰ ثانیه‌ای (برای شب قبل از آزمون)</strong><br>
<div class="code-container"><span class="code-label">مرور سریع</span><div class="code-block no-prompt">Boot: BIOS/UEFI → GRUB → Kernel → systemd → Login

Device Files: /dev  (Character / Block)

Virtual FS:
  /proc → کرنل، فرایندها، interrupts, ioports
  /sys  → دستگاه‌ها، درایورها، اطلاعات ساختاریافته

ابزارها:
  lshw   → سخت‌افزار کلی
  lsdev  → دستگاه‌ها از /proc
  lsblk  → دیسک و پارتیشن
  lspci  → PCI
  lsusb  → USB
  dmesg  → پیام‌های کرنل</div></div>
<p><strong>✅ جلسه ۲ به پایان رسید.</strong></p>
<p>در جلسه بعدی به سراغ <strong>Kernel و Kernel Modules</strong> خواهیم رفت و نحوه بارگذاری، مدیریت و عیب‌یابی درایورهای کرنل را بررسی می‌کنیم.</p>
</div></div>

"ch3-kernel-modules": `
<div class="section-header">
    <div class="section-badge">۳</div>
    <div>
        <h1>Linux Kernel & Kernel Modules</h1>
        <div class="meta">سخت‌افزار، دیسک و سیستم فایل · بخش ۳ از ۱۰</div>
    </div>
</div>

<p>در جلسه قبل دیدیم که پس از اجرای GRUB، نوبت به <strong>Linux Kernel</strong> می‌رسد. کرنل مغز سیستم‌عامل است؛ وظیفه دارد:</p>

<ul>
    <li><strong>منابع سخت‌افزاری</strong> (CPU، حافظه، دیسک، شبکه) را مدیریت کند.</li>
    <li><strong>درایورها</strong> را برای ارتباط با دستگاه‌ها اجرا کند.</li>
    <li><strong>فضای کاربری (User Space)</strong> را از سخت‌افزار جدا کند تا برنامه‌ها به صورت امن و یکسان با سخت‌افزار ارتباط برقرار کنند.</li>
</ul>

<div class="code-container"><span class="code-label">لایه‌ها</span><div class="code-block no-prompt">+------------------+
|   برنامه‌های کاربر  |
+------------------+
         ↓
+------------------+
|     Kernel       |  ← هسته سیستم
+------------------+
         ↓
+------------------+
|    سخت‌افزار      |
+------------------+</div></div>

<h2>چالش: چگونه قابلیت جدید به Kernel اضافه کنیم؟</h2>

<p>فرض کنید یک <strong>کارت شبکه جدید</strong> خریداری کرده‌اید که کرنل فعلی آن را نمی‌شناسد. برای پشتیبانی از این کارت، دو راه داریم:</p>

<h3>روش اول: کامپایل مجدد کل Kernel (روش قدیمی)</h3>

<ul>
    <li>کد منبع کرنل را دریافت کنید.</li>
    <li>تنظیمات (Config) را تغییر دهید تا درایور جدید فعال شود.</li>
    <li>کل کرنل را کامپایل کنید (مدت زمان طولانی).</li>
    <li>کرنل جدید را نصب کرده و سیستم را ریبوت کنید.</li>
</ul>

<p><strong>مشکلات این روش:</strong></p>
<ul>
    <li>زمان‌بر و پیچیده.</li>
    <li>نیاز به ابزارهای کامپایل و وابستگی‌های متعدد.</li>
    <li>امکان بروز خطا در هر مرحله (از تنظیمات تا نصب).</li>
    <li>برای هر تغییر کوچک، باید کل فرایند را تکرار کنید.</li>
</ul>

<h3>روش دوم: استفاده از Kernel Module (روش مدرن)</h3>

<ul>
    <li>فقط <strong>همان درایور</strong> را به صورت یک ماژول جداگانه کامپایل کنید.</li>
    <li>ماژول را در زمان اجرا به کرنل متصل (Load) کنید.</li>
    <li>بدون ریبوت، قابلیت جدید در دسترس خواهد بود.</li>
    <li>در صورت نیاز، ماژول را از کرنل جدا (Unload) کنید.</li>
</ul>

<p><strong>مزایا:</strong></p>
<ul>
    <li>سریع و کم‌هزینه.</li>
    <li>فقط بخش مورد نظر ساخته می‌شود.</li>
    <li>امکان بارگذاری و باربرداری پویا.</li>
    <li>کاهش حجم کرنل اصلی.</li>
</ul>

<h2>Kernel Module دقیقاً چیست؟</h2>

<p>یک <strong>Kernel Module</strong> یک فایل باینری (معمولاً با پسوند <code>.ko</code>) است که شامل کد قابل اجرا در فضای کرنل می‌باشد. این فایل می‌تواند:</p>

<ul>
    <li>یک <strong>درایور سخت‌افزاری</strong> (مثلاً برای کارت شبکه، چاپگر، یا USB) باشد.</li>
    <li>یک <strong>قابلیت سیستمی</strong> جدید (مثل یک سیستم فایل جدید) اضافه کند.</li>
    <li>یک <strong>قابلیت امنیتی</strong> یا <strong>ابزار ردیابی</strong> را فراهم آورد.</li>
</ul>

<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">        Kernel (هسته اصلی)
            │
    ┌───────┼───────┐
    │       │       │
 ماژول A   ماژول B  ماژول C
 (درایور)  (ویژگی)  (ابزار)</div></div>

<h2>چرخه حیات یک Module</h2>

<ol>
    <li><strong>ایجاد (Compile)</strong> – کد منبع ماژول با استفاده از امکانات کرنل ساخته می‌شود.</li>
    <li><strong>بارگذاری (Loading)</strong> – ماژول با دستوراتی مثل <code>insmod</code> یا <code>modprobe</code> به کرنل اضافه می‌شود.</li>
    <li><strong>استفاده (Using)</strong> – قابلیت جدید در دسترس سیستم و برنامه‌ها قرار می‌گیرد.</li>
    <li><strong>باربرداری (Unloading)</strong> – در صورت عدم نیاز، ماژول با دستور <code>rmmod</code> از کرنل خارج می‌شود.</li>
</ol>

<div class="code-container"><span class="code-label">چرخه</span><div class="code-block no-prompt">Compile → Load → Use → Unload</div></div>

<h2>دستورات مدیریت ماژول (کاربردی و آزمونی)</h2>

<h3><code>lsmod</code> – نمایش ماژول‌های بارگذاری‌شده</h3>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">lsmod</div></div>

<p>ستون‌های خروجی:</p>
<ul>
    <li><strong>Module</strong>: نام ماژول</li>
    <li><strong>Size</strong>: اندازه (بایت)</li>
    <li><strong>Used by</strong>: تعداد دفعات استفاده و ماژول‌های وابسته</li>
</ul>

<p>مثال:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Module                  Size  Used by
nvidia                  12345  3
usb_storage             9876  1</div></div>

<h3><code>modinfo</code> – دریافت اطلاعات یک ماژول خاص</h3>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">modinfo &lt;نام ماژول&gt;</div></div>

<p>نمایش مواردی مانند:</p>
<ul>
    <li>مسیر فایل ماژول</li>
    <li>توضیحات</li>
    <li>وابستگی‌ها</li>
    <li>مجوز (License)</li>
</ul>

<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">modinfo usb_storage</div></div>

<h3><code>insmod</code> – بارگذاری ساده ماژول</h3>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo insmod /path/to/module.ko</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>توجه</strong><br><code>insmod</code> وابستگی‌های ماژول را <strong>به صورت خودکار</strong> مدیریت نمی‌کند. اگر ماژول A به ماژول B وابسته باشد، ابتدا باید B را با <code>insmod</code> بارگذاری کنید، سپس A را.</div></div>

<h3><code>modprobe</code> – بارگذاری هوشمند ماژول</h3>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo modprobe &lt;نام ماژول&gt;</div></div>

<p><code>modprobe</code> با استفاده از اطلاعات موجود در <code>/lib/modules/$(uname -r)/modules.dep</code> وابستگی‌ها را تشخیص داده و به ترتیب بارگذاری می‌کند. این دستور <strong>انتخاب اول</strong> برای بارگذاری ماژول‌هاست.</p>

<h4>مقایسه سریع:</h4>

<div class="table-wrap">
<table>
<thead><tr><th>دستور</th><th>مدیریت وابستگی</th><th>نیاز به مسیر کامل</th></tr></thead>
<tbody>
<tr><td><code>insmod</code></td><td>خیر (دستی)</td><td>بله (فایل <code>.ko</code>)</td></tr>
<tr><td><code>modprobe</code></td><td>بله (خودکار)</td><td>خیر (فقط نام ماژول)</td></tr>
</tbody>
</table>
</div>

<h3><code>rmmod</code> – باربرداری ماژول</h3>

<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo rmmod &lt;نام ماژول&gt;</div></div>

<p>ماژول را از کرنل خارج می‌کند، به شرطی که در حال استفاده نباشد.</p>

<h2>مثال عملی: بارگذاری یک ماژول فرضی</h2>

<p>فرض کنید ماژولی به نام <code>my_driver.ko</code> داریم که به ماژول <code>usb_core</code> وابسته است.</p>

<p><strong>روش با <code>insmod</code> (دستی):</strong></p>
<div class="code-container"><span class="code-label">insmod</span><div class="code-block">sudo insmod /lib/modules/.../usb_core.ko
sudo insmod /path/to/my_driver.ko</div></div>

<p><strong>روش با <code>modprobe</code> (خودکار):</strong></p>
<div class="code-container"><span class="code-label">modprobe</span><div class="code-block">sudo modprobe my_driver   # وابستگی‌ها را خودکار بار می‌کند</div></div>

<h2>امنیت و Kernel Module: خطر Rootkit</h2>

<p>از آنجا که ماژول‌ها در <strong>فضای کرنل</strong> اجرا می‌شوند، به تمام حافظه و سخت‌افزار دسترسی کامل دارند. این قدرت، هم نعمت است و هم تهدید.</p>

<ul>
    <li>یک ماژول مخرب (بدافزار) می‌تواند:
        <ul>
            <li>اطلاعات حساس را بدزدد.</li>
            <li>فرایندها را پنهان کند.</li>
            <li>دسترسی سطح بالا (root) را برای مهاجم حفظ کند.</li>
            <li>خود را در کرنل پنهان کرده و تشخیص آن را دشوار سازد.</li>
        </ul>
    </li>
</ul>

<p>به چنین بدافزارهایی <strong>Rootkit</strong> گفته می‌شود. به همین دلیل:</p>
<ul>
    <li>فقط ماژول‌های معتبر و امضا شده باید بارگذاری شوند.</li>
    <li>در سیستم‌های امن، بارگذاری ماژول‌های جدید محدود می‌شود (مثلاً با <code>module.sig_enforce=1</code> در کرنل).</li>
</ul>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>هشدار امنیتی</strong><br>ماژول‌های مخرب می‌توانند به Rootkit تبدیل شوند و کنترل کامل سیستم را در دست بگیرند. همیشه ماژول‌ها را از منابع معتبر دریافت کنید.</div></div>

<div class="summary-box">
    <h3>🧠 جمع‌بندی نهایی (برای مرور سریع)</h3>

    <p><strong>کرنل چیست؟</strong><br>واسط بین نرم‌افزار و سخت‌افزار، مدیر منابع.</p>

    <p><strong>چگونه قابلیت جدید اضافه کنیم؟</strong></p>
    <ul>
        <li>روش سنتی: کامپایل کل کرنل (سخت و زمان‌بر)</li>
        <li>روش مدرن: ماژول (سریع و انعطاف‌پذیر)</li>
    </ul>

    <p><strong>ماژول چیست؟</strong><br>یک فایل <code>.ko</code> که قابلیت جدیدی به کرنل می‌دهد؛ قابل بارگذاری و باربرداری پویا.</p>

    <p><strong>دستورات اصلی:</strong></p>
    <ul>
        <li><code>lsmod</code> → لیست ماژول‌های فعال</li>
        <li><code>modinfo</code> → اطلاعات یک ماژول</li>
        <li><code>insmod</code> → بارگذاری (بدون وابستگی‌ها)</li>
        <li><code>modprobe</code> → بارگذاری هوشمند (با وابستگی‌ها)</li>
        <li><code>rmmod</code> → باربرداری</li>
    </ul>

    <p><strong>نکته امنیتی:</strong><br>ماژول‌ها با بالاترین سطح دسترسی اجرا می‌شوند؛ ممکن است مسیر را برای Rootkit باز کنند.</p>
</div>

<h2>خودآزمایی</h2>

<div class="quiz-card"><p>❓ سوال ۱: کدام دستور برای نمایش ماژول‌های بارگذاری‌شده در کرنل استفاده می‌شود؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>modinfo</code></button>
    <button onclick="selectOption(this)">ب) <code>lsmod</code></button>
    <button onclick="selectOption(this)">ج) <code>insmod</code></button>
    <button onclick="selectOption(this)">د) <code>modprobe</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ب — <code>lsmod</code></strong><br><code>lsmod</code> لیست ماژول‌های بارگذاری‌شده در کرنل را نمایش می‌دهد.</div>
</div>

<div class="quiz-card"><p>❓ سوال ۲: تفاوت اصلی <code>insmod</code> و <code>modprobe</code> چیست؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>insmod</code> فقط برای ماژول‌های USB است.</button>
    <button onclick="selectOption(this)">ب) <code>modprobe</code> وابستگی‌ها را خودکار مدیریت می‌کند.</button>
    <button onclick="selectOption(this)">ج) <code>insmod</code> سریع‌تر است.</button>
    <button onclick="selectOption(this)">د) هیچ تفاوتی ندارند.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ب</strong><br><code>modprobe</code> وابستگی‌های ماژول را به‌طور خودکار مدیریت می‌کند، در حالی که <code>insmod</code> این کار را نمی‌کند.</div>
</div>

<div class="quiz-card"><p>❓ سوال ۳: یک Kernel Module مخرب چه تهدیدی می‌تواند ایجاد کند؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) فقط پیام خطا چاپ کند.</button>
    <button onclick="selectOption(this)">ب) یک Rootkit ایجاد کرده و کنترل سیستم را در دست بگیرد.</button>
    <button onclick="selectOption(this)">ج) فقط سرعت سیستم را کم کند.</button>
    <button onclick="selectOption(this)">د) هیچ خطری ندارد.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ب</strong><br>یک ماژول مخرب می‌تواند به Rootkit تبدیل شود و کنترل کامل سیستم را در دست بگیرد.</div>
</div>

<div class="quiz-card"><p>❓ سوال ۴: کدام دستور اطلاعات یک ماژول خاص را نمایش می‌دهد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>lsmod</code></button>
    <button onclick="selectOption(this)">ب) <code>modinfo</code></button>
    <button onclick="selectOption(this)">ج) <code>insmod</code></button>
    <button onclick="selectOption(this)">د) <code>rmmod</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ب — <code>modinfo</code></strong><br><code>modinfo</code> اطلاعاتی مانند مسیر، وابستگی‌ها و مجوز یک ماژول را نمایش می‌دهد.</div>
</div>

<div class="quiz-card"><p>❓ سوال ۵: پسوند استاندارد فایل‌های Kernel Module چیست؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>.txt</code></button>
    <button onclick="selectOption(this)">ب) <code>.conf</code></button>
    <button onclick="selectOption(this)">ج) <code>.ko</code></button>
    <button onclick="selectOption(this)">د) <code>.mod</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ج — <code>.ko</code></strong><br>فایل‌های Kernel Module معمولاً با پسوند <code>.ko</code> (Kernel Object) شناخته می‌شوند.</div>
</div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>✅ جلسه ۳ به پایان رسید.</strong><br>
<p>در جلسه بعدی به سراغ <strong>مفاهیم دیسک، پارتیشن‌بندی، سیستم‌فایل و Mount</strong> می‌رویم – پایه‌ای برای مباحث پیشرفته‌تر مانند LVM و RAID.</p>
</div></div>
