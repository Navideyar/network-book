چرخ داریم؟
ابزار داریم؟
قطعات لازم وجود دارند؟</div></div>

<p><code>configure</code> تقریباً چنین نقشی دارد.</p>

<div class="code-container"><span class="code-label">نقش configure</span><div class="code-block no-prompt">Source Code
     ↓
./configure
     ↓
بررسی محیط + آماده‌سازی Build</div></div>

<h4>مرحله سوم — <code>make</code></h4>

<p>بعد از <code>configure</code> معمولاً اجرا می‌کنیم:</p>
<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">make</div></div>

<p><code>make</code> فرآیند Build را انجام می‌دهد.</p>

<p>یعنی Source Code را با استفاده از Compilerها و تنظیمات آماده‌شده به فایل‌های قابل اجرا تبدیل می‌کند.</p>

<div class="code-container"><span class="code-label">نقش make</span><div class="code-block no-prompt">Source Code
     ↓
make
     ↓
Compiled Program</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>تفاوت کلیدی</strong>
<ul>
    <li><code>configure</code> → آماده‌سازی</li>
    <li><code>make</code> → Build کردن</li>
</ul>
این دو را با هم اشتباه نکن.
</div></div>

<h4>مرحله چهارم — <code>make install</code></h4>

<p>بعد از اینکه برنامه با موفقیت Build شد:</p>
<div class="code-container"><span class="code-label">نصب</span><div class="code-block">make install</div></div>

<p>برنامه و فایل‌های مربوط به آن را در محل‌های مناسب سیستم نصب می‌کند.</p>

<p>معمولاً برای این مرحله به دسترسی Administrator نیاز داریم:</p>
<div class="code-container"><span class="code-label">با دسترسی root</span><div class="code-block">sudo make install</div></div>

<p>پس روند کامل:</p>
<div class="code-container"><span class="code-label">روند کامل</span><div class="code-block">./configure
make
sudo make install</div></div>

<h3>خلاصه چهار مرحله Source Installation</h3>

<p>این قسمت را برای LPIC-1 خوب حفظ کن:</p>

<table>
<thead><tr><th>مرحله</th><th>دستور</th><th>وظیفه</th></tr></thead>
<tbody>
<tr><td>۱</td><td>دریافت Source</td><td>گرفتن کد برنامه</td></tr>
<tr><td>۲</td><td><code>./configure</code></td><td>بررسی سیستم و آماده‌سازی Build</td></tr>
<tr><td>۳</td><td><code>make</code></td><td>Build/Compile کردن برنامه</td></tr>
<tr><td>۴</td><td><code>make install</code></td><td>نصب برنامه</td></tr>
</tbody>
</table>

<h3>آیا همیشه این چهار دستور کافی هستند؟</h3>

<p><strong>نه.</strong></p>

<p>این روش یک الگوی رایج و کلاسیک است، اما همه پروژه‌ها دقیقاً از این روش استفاده نمی‌کنند.</p>

<p>ممکن است پروژه‌ای از سیستم‌های Build دیگری استفاده کند، مثلاً:</p>
<div class="code-container"><span class="code-label">سیستم‌های دیگر</span><div class="code-block no-prompt">CMake
Meson
Autotools
Cargo
Python build tools</div></div>

<p>بنابراین نباید تصور کنی هر Source Code لینوکس حتماً این دستورات را دارد.</p>

<p>اما:</p>
<div class="code-container"><span class="code-label">الگوی کلاسیک</span><div class="code-block">./configure
make
make install</div></div>

<p>یک الگوی بسیار مهم و کلاسیک است که برای LPIC-1 باید بشناسی.</p>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>معایب نصب از Source</strong>

<p>نصب از Source همیشه بهترین روش نیست.</p>

<p>یکی از مشکلات اصلی این است که Package Manager سیستم به شکل معمول نمی‌تواند به خوبی از برنامه‌ای که دستی نصب کرده‌ای اطلاع داشته باشد.</p>

<div class="code-container"><span class="code-label">مشکل</span><div class="code-block no-prompt">apt
  ↓
Packageهای نصب‌شده را مدیریت می‌کند

اما

make install
  ↓
ممکن است خارج از مدیریت معمول Package Manager باشد</div></div>

<h4>مشکل Update چیست؟</h4>

<p>فرض کن امروز <code>tmux 3.4</code> را از Source نصب کردی.</p>

<p>یک ماه بعد <code>tmux 3.5</code> منتشر می‌شود.</p>

<p>اگر Package Manager آن را مدیریت می‌کرد، احتمالاً می‌توانستی با یک دستور ساده آن را Update کنی.</p>

<p>ولی وقتی خودت از Source نصب کرده‌ای، باید فرآیند Build و نصب نسخه جدید را دوباره انجام دهی.</p>

<div class="code-container"><span class="code-label">فرآیند مجدد</span><div class="code-block no-prompt">Download Source جدید
        ↓
./configure
        ↓
make
        ↓
make install</div></div>

<blockquote><strong>مدیریت بروزرسانی نرم‌افزارهای نصب‌شده از Source می‌تواند سخت‌تر باشد.</strong></blockquote>

<h4>توصیه مهم: روی Production تست نکن</h4>

<p>نصب از Source را بهتر است ابتدا در محیط آزمایشی انجام دهی.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">محیط‌های مناسب</span><div class="code-block no-prompt">VMware
Virtual Machine
Test Server
Lab Environment</div></div>

<p>نه اینکه مستقیماً روی سرور اصلی شرکت اجرا کنی.</p>

<p>چرا؟</p>

<ul>
    <li>ممکن است Dependency ناقص باشد.</li>
    <li>تنظیمات اشتباه شود.</li>
    <li>نسخه قبلی برنامه تحت تأثیر قرار بگیرد.</li>
    <li>فایل‌هایی در مسیرهای سیستم قرار بگیرند.</li>
    <li>حذف برنامه بعداً دشوار شود.</li>
</ul>

<blockquote><strong>قبل از نصب از Source روی سیستم‌های حساس، ابتدا در محیط آزمایشگاهی تست کن.</strong></blockquote>
</div></div>

<h2>بخش دوم — RPM و DEB</h2>

<p>حالا می‌رسیم به قسمت دوم جلسه.</p>

<p>در جلسه قبل با دو خانواده آشنا شدیم.</p>

<p>امروز ساختار خود Packageها را دقیق‌تر بررسی می‌کنیم.</p>

<h3>RPM چیست؟</h3>

<p>RPM مخفف <strong>RPM Package Manager</strong> است.</p>

<p>فرمت Package در این سیستم:</p>
<div class="code-container"><span class="code-label">فرمت</span><div class="code-block no-prompt">.rpm</div></div>

<p>RPM به طور سنتی با خانواده Red Hat ارتباط دارد.</p>

<p>مثلاً:</p>
<ul>
    <li>Red Hat</li>
    <li>CentOS</li>
    <li>Fedora</li>
</ul>

<p>از خانواده RPM هستند.</p>

<p>توزیع‌های دیگری مثل:</p>
<ul>
    <li>Rocky Linux</li>
    <li>AlmaLinux</li>
</ul>

<p>نیز در همین خانواده قرار می‌گیرند.</p>

<h3>DEB چیست؟</h3>

<p>در خانواده Debian، Packageها معمولاً با فرمت:</p>
<div class="code-container"><span class="code-label">فرمت</span><div class="code-block no-prompt">.deb</div></div>

<p>هستند.</p>

<p>توزیع‌های معروف این خانواده:</p>
<ul>
    <li>Debian</li>
    <li>Ubuntu</li>
    <li>Linux Mint</li>
</ul>

<p>هستند.</p>

<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Red Hat Family → .rpm
Debian Family → .deb</div></div>

<h3>ساختار نام یک RPM</h3>

<p>یکی از نکات مهم این جلسه ساختار نام Package است.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">tmux-3.4-1.x86_64.rpm</div></div>

<p>ساختار کلی:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">NAME-VERSION-RELEASE.ARCHITECTURE.rpm</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">تجزیه</span><div class="code-block no-prompt">tmux-3.4-1.x86_64.rpm
│    │   │    │
│    │   │    └── Architecture
│    │   └─────── Release
│    └─────────── Version
└──────────────── Name</div></div>

<h4>NAME</h4>

<p>قسمت اول نام Package:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">tmux</div></div>

<p>نام نرم‌افزار است.</p>

<h4>VERSION</h4>

<p>بعد از Name، نسخه نرم‌افزار می‌آید.</p>

<p>مثلاً <code>tmux-3.4</code>، در اینجا <code>3.4</code> نسخه نرم‌افزار است.</p>

<h4>RELEASE</h4>

<p>بعد از Version معمولاً Release قرار می‌گیرد.</p>

<p>مثلاً <code>tmux-3.4-1</code>، اینجا <code>1</code> Release است.</p>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>توجه</strong>Version و Release یکی نیستند.
<br>
ممکن است <code>Version = 3.4</code> و <code>Release = 1</code> باشد، یا <code>Version = 3.4</code> و <code>Release = 2</code>.
<br>
یعنی Package می‌تواند همان نسخه نرم‌افزار را داشته باشد ولی Release متفاوتی داشته باشد.</div></div>

<h4>ARCHITECTURE</h4>

<p>مثلاً <code>x86_64</code> معماری Package را مشخص می‌کند.</p>

<p>نمونه‌های رایج:</p>
<div class="code-container"><span class="code-label">معماری‌ها</span><div class="code-block no-prompt">x86_64
aarch64
i686</div></div>

<div class="code-container"><span class="code-label">ساختار کامل RPM</span><div class="code-block no-prompt">tmux-3.4-1.x86_64.rpm

NAME          = tmux
VERSION       = 3.4
RELEASE       = 1
ARCHITECTURE  = x86_64
FORMAT        = rpm</div></div>

<h3>ساختار نام DEB</h3>

<p>ساختار کلی DEB به صورت:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">NAME-VERSION-RELEASE.ARCHITECTURE.deb</div></div>

<p>مثلاً برای درک ساختار:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">tmux-3.4-1.amd64.deb

tmux       → NAME
3.4        → VERSION
1          → RELEASE
amd64      → ARCHITECTURE
.deb       → FORMAT</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته مهم</strong>در دنیای واقعی، نام‌گذاری Debian Packageها می‌تواند با این الگوی ساده کمی متفاوت باشد. برای سطح این جلسه و فهم تفاوت خانواده‌ها، مهم‌ترین چیزی که باید بلد باشی:
<ul>
    <li><code>.deb</code> → Debian Family</li>
    <li><code>.rpm</code> → Red Hat Family</li>
</ul>
و مفهوم بخش‌های <code>Name</code>، <code>Version</code>، <code>Release</code> و <code>Architecture</code> است.</div></div>

<h3>مقایسه RPM و DEB</h3>

<table>
<thead><tr><th>ویژگی</th><th>RPM</th><th>DEB</th></tr></thead>
<tbody>
<tr><td>خانواده اصلی</td><td>Red Hat</td><td>Debian</td></tr>
<tr><td>فرمت</td><td><code>.rpm</code></td><td><code>.deb</code></td></tr>
<tr><td>نمونه توزیع</td><td>RHEL, Fedora, CentOS</td><td>Debian, Ubuntu, Mint</td></tr>
<tr><td>ابزار سطح پایین</td><td><code>rpm</code></td><td><code>dpkg</code></td></tr>
<tr><td>ابزار سطح بالاتر</td><td><code>dnf</code></td><td><code>apt</code></td></tr>
</tbody>
</table>

<div class="code-container"><span class="code-label">نمودار نهایی</span><div class="code-block no-prompt">                 Linux Distributions
                        │
             ┌──────────┴──────────┐
             ↓                     ↓
       Debian Family          Red Hat Family
             │                     │
           .deb                   .rpm
             │                     │
           dpkg                    rpm
             │                     │
           apt                     dnf</div></div>

tmux-3.4-1.x86_64.rpm   → Package آماده نصب</div></div>

    <p>اگر بخواهیم کل جلسه را در یک نقشه خلاصه کنیم:</p>
    <div class="code-container"><span class="code-label">نقشه ذهنی</span><div class="code-block no-prompt">                 نصب نرم‌افزار

<h2>خودآزمایی</h2>

<div class="quiz-card"><p>❓ تست ۱: ترتیب معمول نصب یک نرم‌افزار از Source Code کدام است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>make</code> → <code>./configure</code> → <code>make install</code></button>
    <button onclick="selectOption(this)">ب) <code>./configure</code> → <code>make</code> → <code>make install</code></button>
    <button onclick="selectOption(this)">ج) <code>make install</code> → <code>make</code> → <code>./configure</code></button>

</div>

<div class="quiz-card"><p>❓ تست ۲: وظیفه اصلی <code>make</code> در فرآیند نصب از Source چیست؟</p>

</div>

</div>

<div class="quiz-card"><p>❓ تست ۴: کدام گزینه درباره نصب نرم‌افزار از Source صحیح‌تر است؟</p>

<p>در دو جلسه قبل یاد گرفتیم نرم‌افزار در لینوکس معمولاً به شکل Package ارائه می‌شود، خانواده‌های اصلی Package را شناختیم و با نصب از Source هم آشنا شدیم. در جلسه ۳ می‌خواهیم نصب نرم‌افزار را <strong>به‌صورت عملی در Debian و Red Hat</strong> بررسی کنیم.</p>

<h2>اول یک مرور سریع</h2>

<p>تا اینجا این رابطه را داریم:</p>
<div class="code-container"><span class="code-label">مرور</span><div class="code-block no-prompt">Debian Family → .deb → dpkg / apt
Red Hat Family → .rpm → rpm / dnf</div></div>

<p>در جلسه قبل هم دیدیم که Package آماده نصب با Source Code تفاوت دارد. Package معمولاً از قبل Build شده و آماده نصب است، در حالی که در Source باید خودمان فرآیند Build را انجام دهیم.</p>

<h2>نصب نرم‌افزار در Debian</h2>

<p>فرض کنیم روی یک سیستم Debian یا Ubuntu هستیم.</p>

<p>مثلاً می‌خواهیم <code>tmux</code> را نصب کنیم.</p>

<p>ساده‌ترین روش:</p>
<div class="code-container"><span class="code-label">نصب</span><div class="code-block">sudo apt install tmux</div></div>

<p>اینجا <code>apt</code> وظیفه دارد Package موردنظر را از Repositoryهای تنظیم‌شده پیدا کند و فرآیند نصب را انجام دهد.</p>

<p>به صورت ساده:</p>
<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">apt install
     ↓
پیدا کردن Package
     ↓
بررسی Dependency
     ↓
دانلود Packageهای لازم
     ↓
Install</div></div>

<h3>چرا از <code>apt</code> استفاده می‌کنیم؟</h3>

<p>قبلاً گفتیم <code>dpkg</code> ابزار سطح پایین‌تر Debian است.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">نصب محلی</span><div class="code-block">sudo dpkg -i tmux.deb</div></div>

<p>یک فایل <code>.deb</code> محلی را مستقیماً نصب می‌کند.</p>

<p>اما <code>apt</code> امکانات بیشتری برای مدیریت Package دارد.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">نصب از مخزن</span><div class="code-block">sudo apt install tmux</div></div>

<p>در این حالت لازم نیست خودت فایل <code>.deb</code> را دانلود و پیدا کنی.</p>

<p><code>apt</code> از Repositoryهای تنظیم‌شده استفاده می‌کند.</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">dpkg → نصب مستقیم Package محلی
apt  → Repository + Dependency + Install</div></div>

<p>این تفاوت برای LPIC-1 مهم است.</p>

<h3>جستجوی Package در Debian</h3>

<p>گاهی اسم دقیق Package را نمی‌دانیم.</p>

<p>مثلاً می‌خواهیم Packageهایی که مربوط به <code>tmux</code> هستند را پیدا کنیم.</p>

<p>می‌توانیم از:</p>
<div class="code-container"><span class="code-label">جستجو</span><div class="code-block">apt search tmux</div></div>

<p>استفاده کنیم.</p>

<p>این دستور Packageهای مرتبط را در Repositoryهای تنظیم‌شده جستجو می‌کند.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">apt search nginx
apt search python</div></div>

<h3>نمایش اطلاعات Package</h3>

<p>برای مشاهده اطلاعات یک Package می‌توانیم از:</p>
<div class="code-container"><span class="code-label">اطلاعات</span><div class="code-block">apt show tmux</div></div>

<p>استفاده کنیم.</p>

<p>مثلاً ممکن است اطلاعاتی مانند:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Package
Version
Architecture
Description
Dependencies</div></div>

<p>را مشاهده کنیم.</p>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته آزمونی</strong>
<p>این دو را اشتباه نکن:</p>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block">apt install tmux  → نصب
apt show tmux     → نمایش اطلاعات</div></div>
</div></div>

<h3>به‌روزرسانی اطلاعات Repository در Debian</h3>

<p>یکی از دستورهای بسیار مهم:</p>
<div class="code-container"><span class="code-label">به‌روزرسانی</span><div class="code-block">sudo apt update</div></div>

<p>است.</p>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>دقت کن</strong>
<p><code>apt update</code> به معنی <strong>Update کردن خود نرم‌افزارهای نصب‌شده نیست</strong>.</p>
<p>این دستور اطلاعات Packageها و Repositoryها را به‌روزرسانی می‌کند.</p>
<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">Repository → apt update → اطلاعات جدید Packageها</div></div>
<p>بعد از آن می‌توانیم Packageها را Upgrade کنیم.</p>
</div></div>

<h3>تفاوت <code>apt update</code> و <code>apt upgrade</code></h3>

<p>این یکی از نکات مهم آزمونی است.</p>

<div class="code-container"><span class="code-label">update</span><div class="code-block">sudo apt update</div></div>
<p>اطلاعات مربوط به Packageها را از Repositoryها به‌روزرسانی می‌کند.</p>

<div class="code-container"><span class="code-label">upgrade</span><div class="code-block">sudo apt upgrade</div></div>
<p>Packageهای نصب‌شده را در صورت وجود نسخه جدید، Upgrade می‌کند.</p>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته طلایی آزمون</strong>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">apt update  → به‌روزرسانی اطلاعات Repository
apt upgrade → به‌روزرسانی Packageهای نصب‌شده</div></div>
<p><code>update</code> لزوماً به معنی نصب نسخه جدید نرم‌افزارها نیست.</p>
</div></div>

<h3>حذف Package در Debian</h3>

<p>برای حذف یک Package می‌توانیم از:</p>
<div class="code-container"><span class="code-label">حذف</span><div class="code-block">sudo apt remove tmux</div></div>

<p>استفاده کنیم.</p>

<p>اگر بخواهیم Package و Configurationهای مربوط به آن نیز حذف شوند، در شرایط مناسب می‌توان از:</p>
<div class="code-container"><span class="code-label">پاک‌سازی</span><div class="code-block">sudo apt purge tmux</div></div>

<p>استفاده کرد.</p>

<div class="code-container"><span class="code-label">تفاوت</span><div class="code-block no-prompt">remove → حذف Package
purge  → حذف Package + Configurationهای مربوط</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته آزمونی</strong><code>remove</code> و <code>purge</code> را با هم اشتباه نکن.</div></div>

<h3>نصب یک فایل <code>.deb</code> محلی</h3>

<p>حالا فرض کنیم فایل Package را خودمان دانلود کرده‌ایم:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block no-prompt">tmux.deb</div></div>

<p>می‌توانیم آن را با <code>dpkg</code> نصب کنیم:</p>
<div class="code-container"><span class="code-label">نصب محلی</span><div class="code-block">sudo dpkg -i tmux.deb</div></div>

<p>اما همان‌طور که در جلسه اول گفتیم، <code>dpkg</code> در مدیریت Dependencyها مثل <code>apt</code> سطح بالاتری نیست.</p>

<p>بنابراین اگر Dependency ناقص باشد، ممکن است نصب کامل انجام نشود.</p>

<p>در چنین شرایطی معمولاً <code>apt</code> برای مدیریت Dependencyها مناسب‌تر است.</p>

<h4>یک نکته درباره نصب فایل DEB با apt</h4>

<p>در سیستم‌های Debian-based می‌توان Package محلی را نیز با <code>apt</code> نصب کرد.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">نصب با apt</span><div class="code-block">sudo apt install ./tmux.deb</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>وجود <code>./</code> مهم است. <code>./tmux.deb</code> به یک فایل موجود در مسیر فعلی اشاره می‌کند.</div></div>

<h2>حالا برویم سراغ Red Hat</h2>

<p>در خانواده Red Hat وضعیت تقریباً مشابه است.</p>

<p>در این خانواده:</p>
<div class="code-container"><span class="code-label">فرمت</span><div class="code-block no-prompt">.rpm</div></div>

<p>فرمت Package است.</p>

<p>و ابزارهای مهم:</p>
<div class="code-container"><span class="code-label">ابزارها</span><div class="code-block no-prompt">rpm
dnf</div></div>

<p>هستند.</p>

<p>در جلسه‌های قبل رابطه کلی را دیدیم:</p>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Red Hat → .rpm → rpm / dnf</div></div>

<h3>نصب Package با DNF</h3>

<p>فرض کنیم روی Fedora، Rocky Linux یا AlmaLinux هستیم.</p>

<p>برای نصب <code>tmux</code>:</p>
<div class="code-container"><span class="code-label">نصب</span><div class="code-block">sudo dnf install tmux</div></div>

<p>مشابه Debian:</p>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">Debian: sudo apt install tmux
Red Hat: sudo dnf install tmux</div></div>

<p>در هر دو حالت Package Manager از Repository استفاده می‌کند.</p>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی</strong>
<ul>
    <li>ابزار سطح بالاتر در Debian → <code>apt</code></li>
    <li>ابزار سطح بالاتر در Red Hat → <code>dnf</code></li>
</ul>
</div></div>

<h3>جستجوی Package در Red Hat</h3>

<p>برای جستجوی Package می‌توانیم از:</p>
<div class="code-container"><span class="code-label">جستجو</span><div class="code-block">dnf search tmux</div></div>

<p>استفاده کنیم.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">dnf search nginx</div></div>

<p>این دستور Packageهای مرتبط را جستجو می‌کند.</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">Debian: apt search tmux
Red Hat: dnf search tmux</div></div>

<h3>نمایش اطلاعات Package در DNF</h3>

<p>برای مشاهده اطلاعات یک Package:</p>
<div class="code-container"><span class="code-label">اطلاعات</span><div class="code-block">dnf info tmux</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">dnf info nginx</div></div>

<p>اطلاعات Package را نمایش می‌دهد.</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">Debian: apt show tmux
Red Hat: dnf info tmux</div></div>

<h3>Update و Upgrade در DNF</h3>

<p>در سیستم‌های Red Hat-based می‌توانیم از:</p>
<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">sudo dnf check-update</div></div>

<p>برای بررسی Updateهای موجود استفاده کنیم.</p>

<p>همچنین:</p>
<div class="code-container"><span class="code-label">ارتقا</span><div class="code-block">sudo dnf upgrade</div></div>

<p>برای Upgrade Packageها استفاده می‌شود.</p>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>در نسخه‌های جدید، <code>dnf update</code> نیز برای به‌روزرسانی Packageها استفاده می‌شود و در عمل <code>update</code> و <code>upgrade</code> در DNF بسیار نزدیک‌اند. برای سطح LPIC-1 مهم است که بدانی <code>dnf</code> مدیریت Packageها شامل Install / Update / Upgrade / Remove را انجام می‌دهد.</div></div>

<h3>حذف Package در Red Hat</h3>

<p>برای حذف <code>tmux</code>:</p>
<div class="code-container"><span class="code-label">حذف</span><div class="code-block">sudo dnf remove tmux</div></div>

<p>یا:</p>
<div class="code-container"><span class="code-label">حذف</span><div class="code-block">sudo dnf erase tmux</div></div>

<p>می‌توان استفاده کرد.</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">Debian: apt remove
Red Hat: dnf remove</div></div>

<h3>نصب RPM محلی</h3>

<p>فرض کن این فایل را داریم:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block no-prompt">tmux-3.4-1.x86_64.rpm</div></div>

<p>می‌توانیم با ابزار <code>rpm</code> آن را نصب کنیم:</p>
<div class="code-container"><span class="code-label">نصب محلی</span><div class="code-block">sudo rpm -i tmux-3.4-1.x86_64.rpm</div></div>

<p>اینجا:</p>
<div class="code-container"><span class="code-label">نقش</span><div class="code-block no-prompt">rpm → نصب مستقیم فایل RPM</div></div>

<p>مشابه:</p>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block">sudo dpkg -i tmux.deb</div></div>

<p>در Debian است.</p>

<p>پس یک تطابق بسیار مهم:</p>
<div class="code-container"><span class="code-label">تطابق</span><div class="code-block no-prompt">Debian: dpkg -i file.deb
Red Hat: rpm -i file.rpm</div></div>

<h3>نصب RPM محلی با DNF</h3>

<p>در سیستم‌های Red Hat-based می‌توان فایل RPM محلی را نیز با <code>dnf</code> نصب کرد.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">نصب با dnf</span><div class="code-block">sudo dnf install ./tmux-3.4-1.x86_64.rpm</div></div>

<p>مزیت استفاده از ابزار سطح بالاتر این است که مدیریت Dependencyها نیز بهتر انجام می‌شود.</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">rpm → Low-level Package Tool
dnf → High-level Package Management + Repository + Dependency</div></div>

<h2>یک مثال کامل در Debian</h2>

<p>فرض کنیم یک Ubuntu یا Debian تازه نصب کرده‌ای و می‌خواهی <code>tmux</code> نصب کنی.</p>

<h3>مرحله ۱ — Update اطلاعات Repository</h3>
<div class="code-container"><span class="code-label">مرحله ۱</span><div class="code-block">sudo apt update</div></div>

<h3>مرحله ۲ — نصب Package</h3>
<div class="code-container"><span class="code-label">مرحله ۲</span><div class="code-block">sudo apt install tmux</div></div>

<h3>مرحله ۳ — بررسی اطلاعات</h3>
<div class="code-container"><span class="code-label">مرحله ۳</span><div class="code-block">apt show tmux</div></div>

<h3>مرحله ۴ — در صورت نیاز حذف</h3>
<div class="code-container"><span class="code-label">مرحله ۴</span><div class="code-block">sudo apt remove tmux</div></div>

<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">apt update → apt install tmux → apt show tmux → apt remove tmux</div></div>

<h2>یک مثال کامل در Red Hat</h2>

<p>حالا همان کار را در Fedora / Rocky / AlmaLinux تصور کن.</p>

<h3>مرحله ۱ — بررسی Updateها</h3>
<div class="code-container"><span class="code-label">مرحله ۱</span><div class="code-block">sudo dnf check-update</div></div>

<h3>مرحله ۲ — نصب</h3>
<div class="code-container"><span class="code-label">مرحله ۲</span><div class="code-block">sudo dnf install tmux</div></div>

<h3>مرحله ۳ — مشاهده اطلاعات</h3>
<div class="code-container"><span class="code-label">مرحله ۳</span><div class="code-block">dnf info tmux</div></div>

<h3>مرحله ۴ — حذف</h3>
<div class="code-container"><span class="code-label">مرحله ۴</span><div class="code-block">sudo dnf remove tmux</div></div>

<h2>چرا <code>sudo</code>؟</h2>

<p>بیشتر عملیات نصب و حذف Packageها نیاز به دسترسی Administrator دارند.</p>

<p>به همین دلیل معمولاً دستور را با:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo</div></div>

<p>اجرا می‌کنیم.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo apt install tmux</div></div>

<p>یا:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo dnf install tmux</div></div>

<p>اما دستورهایی مثل:</p>
<div class="code-container"><span class="code-label">بدون sudo</span><div class="code-block">apt search tmux
apt show tmux</div></div>

<p>معمولاً برای مشاهده اطلاعات نیاز به <code>sudo</code> ندارند.</p>

<div class="summary-box">
    <h3>🧠 نقشه ذهنی جلسه ۳</h3>
    <p>اگر بخواهیم کل جلسه را در یک نمودار خلاصه کنیم:</p>
    <div class="code-container"><span class="code-label">نقشه ذهنی</span><div class="code-block no-prompt">                  Linux Package Management
                           │
              ┌────────────┴────────────┐
              ↓                         ↓
          Debian                    Red Hat
              │                         │
            .deb                      .rpm
              │                         │
       ┌──────┴──────┐           ┌──────┴──────┐
       ↓             ↓           ↓             ↓
     dpkg           apt         rpm           dnf
       │             │           │             │
   Local File    Repository   Local File    Repository</div></div>

    <h3>دستورات مهم</h3>
    <div class="code-container"><span class="code-label">Debian</span><div class="code-block no-prompt">apt update
apt install
apt search
apt show
apt remove
apt purge

dpkg -i file.deb</div></div>

    <div class="code-container"><span class="code-label">Red Hat</span><div class="code-block no-prompt">dnf check-update
dnf install
dnf search
dnf info
dnf remove
dnf upgrade

rpm -i file.rpm</div></div>
</div>

<div class="box important"><i class="fas fa-star"></i><div><strong>⭐ نکات طلایی آزمون</strong>
<p>این قسمت را حتماً خوب یاد بگیر:</p>

<h4>۱. خانواده Debian</h4>
<div class="code-container"><span class="code-label">Debian</span><div class="code-block no-prompt">.deb → dpkg → apt</div></div>

<h4>۲. خانواده Red Hat</h4>
<div class="code-container"><span class="code-label">Red Hat</span><div class="code-block no-prompt">.rpm → rpm → dnf</div></div>

<h4>۳. نصب فایل محلی</h4>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">dpkg -i file.deb
rpm -i file.rpm</div></div>

<h4>۴. نصب از Repository</h4>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">apt install package
dnf install package</div></div>

<h4>۵. تفاوت مهم</h4>
<div class="code-container"><span class="code-label">سطح</span><div class="code-block no-prompt">dpkg / rpm → سطح پایین‌تر
apt / dnf  → مدیریت سطح بالاتر + Repository + Dependency</div></div>

<h4>۶. تفاوت <code>apt update</code> و <code>apt upgrade</code></h4>
<div class="code-container"><span class="code-label">تفاوت</span><div class="code-block no-prompt">apt update  → به‌روزرسانی اطلاعات Repository
apt upgrade → Upgrade کردن Packageهای نصب‌شده</div></div>
</div></div>

<h2>خودآزمایی</h2>

<div class="quiz-card"><p>❓ تست ۱: کدام دستور برای نصب یک Package به نام <code>tmux</code> از Repository در Debian صحیح است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>sudo rpm -i tmux</code></button>
    <button onclick="selectOption(this)">ب) <code>sudo apt install tmux</code></button>
    <button onclick="selectOption(this)">ج) <code>sudo dpkg -r tmux</code></button>
    <button onclick="selectOption(this)">د) <code>sudo dnf search tmux</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ب</strong><br><code>sudo apt install tmux</code> برای نصب Package از Repository در سیستم‌های Debian-based استفاده می‌شود. <code>rpm</code> مربوط به خانواده Red Hat است، <code>dpkg -r</code> برای حذف است و <code>dnf search</code> برای جستجو در Red Hat است.</div>
</div>

<div class="quiz-card"><p>❓ تست ۲: کدام گزینه تطابق صحیح بین نصب Package محلی در Debian و Red Hat را نشان می‌دهد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>dpkg -i file.deb</code> / <code>rpm -i file.rpm</code></button>
    <button onclick="selectOption(this)">ب) <code>apt search file.deb</code> / <code>dnf search file.rpm</code></button>
    <button onclick="selectOption(this)">ج) <code>rpm -i file.deb</code> / <code>dpkg -i file.rpm</code></button>
    <button onclick="selectOption(this)">د) <code>apt remove file.deb</code> / <code>dnf remove file.rpm</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: الف</strong><br>برای نصب مستقیم فایل Package محلی: <code>sudo dpkg -i file.deb</code> در Debian و <code>sudo rpm -i file.rpm</code> در Red Hat استفاده می‌شود. گزینه‌های B و D مربوط به جستجو و حذف هستند و گزینه C ابزارها را جابه‌جا کرده است.</div>
</div>

<div class="quiz-card"><p>❓ تست ۳: وظیفه اصلی دستور <code>sudo apt update</code> چیست؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) حذف تمام Packageها</button>
    <button onclick="selectOption(this)">ب) نصب آخرین نسخه تمام نرم‌افزارها</button>
    <button onclick="selectOption(this)">ج) به‌روزرسانی اطلاعات Packageها از Repositoryها</button>
    <button onclick="selectOption(this)">د) تبدیل فایل <code>.deb</code> به <code>.rpm</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ج</strong><br><code>apt update</code> اطلاعات مربوط به Packageها و Repositoryها را به‌روزرسانی می‌کند. برای Upgrade کردن Packageهای نصب‌شده معمولاً از <code>sudo apt upgrade</code> استفاده می‌کنیم.</div>
</div>

<div class="quiz-card"><p>❓ تست ۴: کدام گزینه درباره <code>apt</code> و <code>dnf</code> صحیح است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) هر دو Package Format هستند.</button>
    <button onclick="selectOption(this)">ب) <code>apt</code> برای Debian و <code>dnf</code> برای Red Hat ابزار مدیریت Package هستند.</button>
    <button onclick="selectOption(this)">ج) <code>apt</code> فقط برای Source Code و <code>dnf</code> فقط برای Binary است.</button>
    <button onclick="selectOption(this)">د) <code>apt</code> و <code>dnf</code> هر دو ابزار سطح پایین هستند.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ب</strong><br>رابطه اصلی: <code>Debian → apt</code> و <code>Red Hat → dnf</code>. هر دو ابزارهای سطح بالاتر برای مدیریت Package هستند. فرمت‌ها <code>.deb</code> و <code>.rpm</code> هستند و ابزارهای سطح پایین <code>dpkg</code> و <code>rpm</code> می‌باشند.</div>
</div>

<div class="quiz-card"><p>❓ تست ۵: کدام گزینه درباره <code>apt remove</code> و <code>apt purge</code> صحیح است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) هر دو فقط Package را نصب می‌کنند.</button>
    <button onclick="selectOption(this)">ب) <code>remove</code> برای حذف Package و <code>purge</code> برای حذف Package همراه با Configurationهای مربوط است.</button>
    <button onclick="selectOption(this)">ج) <code>remove</code> فقط در Red Hat و <code>purge</code> فقط در Fedora وجود دارد.</button>
    <button onclick="selectOption(this)">د) <code>purge</code> برای جستجوی Package استفاده می‌شود.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ صحیح: ب</strong><br><code>sudo apt remove tmux</code> برای حذف Package و <code>sudo apt purge tmux</code> برای حذف Package به همراه Configurationهای مربوط به آن استفاده می‌شود. هر دو دستور مربوط به <code>apt</code> و خانواده Debian هستند.</div>
</div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>🧠 مرور ۳۰ ثانیه‌ای جلسه ۳</strong><br>
اگر فقط بخواهی مهم‌ترین مطالب جلسه را حفظ کنی:

dpkg
apt

Install: apt install package

Search: apt search package

<div class="code-container"><span class="code-label">RED HAT</span><div class="code-block no-prompt">.rpm
rpm
dnf

Upgrade: dnf upgrade</div></div>

<p>و مهم‌ترین تطابق جلسه:</p>
<div class="code-container"><span class="code-label">تطابق</span><div class="code-block no-prompt">Debian              Red Hat
────────            ────────
.deb                .rpm
dpkg                rpm
apt                 dnf
apt install         dnf install
dpkg -i             rpm -i

<div class="section-header">
    <div class="section-badge">۲</div>
    <div>
        <h1>Snap and AppImage + Install Zabbix</h1>
        <div class="meta">مدیریت نرم‌افزار و فرآیندها · بخش ۴ از ۸</div>
    </div>
</div>

<p>در جلسات قبل با روش‌های سنتی نصب نرم‌افزار در لینوکس آشنا شدیم: <code>apt</code>/<code>dpkg</code> در Debian و <code>dnf</code>/<code>rpm</code> در Red Hat. در این جلسه با <strong>روش‌های جدیدتر و جایگزین</strong> نصب نرم‌افزار آشنا می‌شویم و سپس یک <strong>نصب عملی Zabbix</strong> (سیستم مانیتورینگ شبکه) را انجام می‌دهیم.</p>

<h2>روش‌های دیگر نصب نرم‌افزار در لینوکس</h2>

<p>روش‌های جایگزین برای نصب نرم‌افزار در لینوکس (غیر از <code>apt</code>/<code>dpkg</code> و <code>dnf</code>/<code>rpm</code>):</p>

<ul>
    <li><strong>استفاده از مخازن هر پروژه</strong> — خود پروژه مخزن مخصوص خود را ارائه می‌دهد (مثلاً مخزن رسمی Zabbix)</li>
    <li><strong>نصب از طریق کد برنامه (Source)</strong> — کامپایل و نصب دستی از کد منبع (جلسه ۲)</li>
    <li><strong>استفاده از برنامه‌های دیگر مثل Snap</strong> — بسته‌های containerized و مستقل</li>
    <li><strong>استفاده از AppImage</strong> — فایل اجرایی قابل حمل که نیازی به نصب ندارد</li>
</ul>

<h2>Snap — نصب‌های containerized</h2>

<p><strong>Snap</strong> یک سیستم بسته‌بندی و انتشار نرم‌افزار است که توسط Canonical (سازندهٔ اوبونتو) توسعه یافته. بسته‌های Snap <strong>خودکفا (self-contained)</strong> هستند و تمام وابستگی‌های خود را همراه دارند.</p>

<h3>ویژگی‌های Snap</h3>
<ul>
    <li><strong>ایزوله (Sandbox)</strong> — هر Snap در محیطی جدا از سیستم اصلی اجرا می‌شود.</li>
    <li><strong>بروزرسانی خودکار</strong> — Snapها به‌طور خودکار در پس‌زمینه بروزرسانی می‌شوند.</li>
    <li><strong>قابل اجرا روی اکثر توزیع‌ها</strong> — Snap روی اکثر توزیع‌های لینوکس (حتی برخی توزیع‌های غیر Debian/Ubuntu) قابل اجراست.</li>
    <li><strong>نیاز به <code>snapd</code></strong> — برای اجرای Snapها، سرویس <code>snapd</code> باید روی سیستم نصب و فعال باشد.</li>
</ul>

<h3>نصب snapd</h3>

<p>در Debian/Ubuntu:</p>
<div class="code-container"><span class="code-label">نصب snapd</span><div class="code-block">sudo apt update
sudo apt install snapd</div></div>

<p>در AlmaLinux/RHEL:</p>
<div class="code-container"><span class="code-label">نصب snapd</span><div class="code-block">sudo dnf install epel-release
sudo dnf install snapd
sudo systemctl enable --now snapd.socket</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>بعد از نصب <code>snapd</code>، ممکن است نیاز به خروج و ورود مجدد به سیستم یا ری‌استارت Shell داشته باشید تا متغیرهای محیطی <code>snap</code> به‌درستی بارگذاری شوند.</div></div>

<h3>دستورات پایه Snap</h3>

<div class="code-container"><span class="code-label">جستجوی یک بسته</span><div class="code-block">snap find package-name</div></div>

<div class="code-container"><span class="code-label">نصب یک بسته</span><div class="code-block">sudo snap install package-name</div></div>

<div class="code-container"><span class="code-label">نصب با کانال خاص (stable/candidate/beta/edge)</span><div class="code-block">sudo snap install package-name --channel=stable</div></div>

<div class="code-container"><span class="code-label">لیست بسته‌های نصب‌شده</span><div class="code-block">snap list</div></div>

<div class="code-container"><span class="code-label">بروزرسانی یک بسته</span><div class="code-block">sudo snap refresh package-name</div></div>

<div class="code-container"><span class="code-label">بروزرسانی همه بسته‌ها</span><div class="code-block">sudo snap refresh</div></div>

<div class="code-container"><span class="code-label">نمایش اطلاعات یک بسته</span><div class="code-block">snap info package-name</div></div>

<div class="code-container"><span class="code-label">حذف یک بسته</span><div class="code-block">sudo snap remove package-name</div></div>

<h3>مثال عملی: نصب Firefox با Snap</h3>

<div class="code-container"><span class="code-label">نصب Firefox</span><div class="code-block">sudo snap install firefox</div></div>

<p>بعد از نصب، Firefox به‌عنوان یک برنامه مستقل در دسترس خواهد بود و به‌طور خودکار بروزرسانی می‌شود.</p>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته LPIC-1</strong>در برخی توزیع‌ها (مخصوصاً اوبونتو)، Snap به‌عنوان روش پیش‌فرض نصب برخی برنامه‌ها (مثل Firefox) استفاده می‌شود. آشنایی با دستورات پایه Snap می‌تواند در آزمون مفید باشد.</div></div>

<h2>AppImage — فایل‌های اجرایی قابل حمل</h2>

<p><strong>AppImage</strong> یک فرمت قابل‌اجرای مستقل است که <strong>نیازی به نصب ندارد</strong>. فقط کافی است فایل را دانلود کرده، مجوز اجرا بدهید و اجرا کنید.</p>

<h3>ویژگی‌های AppImage</h3>
<ul>
    <li><strong>قابل حمل (Portable)</strong> — یک فایل واحد که در هر سیستم لینوکسی قابل اجراست.</li>
    <li><strong>بدون نیاز به نصب</strong> — نیازی به <code>sudo</code> یا نصب ندارد.</li>
    <li><strong>بدون نیاز به دامون (Daemon)</strong> — برخلاف Snap، نیازی به سرویس پس‌زمینه ندارد.</li>
    <li><strong>خودکفا</strong> — تمام وابستگی‌ها را همراه دارد.</li>
</ul>

<h3>مثال کار با AppImage</h3>

<p>فرض کنید می‌خواهید برنامه <code>Obsidian</code> را با AppImage اجرا کنید:</p>

<div class="code-container"><span class="code-label">دانلود AppImage</span><div class="code-block">wget https://github.com/obsidianmd/obsidian-releases/releases/download/v1.5.3/Obsidian-1.5.3.AppImage</div></div>

<div class="code-container"><span class="code-label">دادن مجوز اجرا</span><div class="code-block">chmod +x Obsidian-1.5.3.AppImage</div></div>

<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">./Obsidian-1.5.3.AppImage</div></div>

<p>و برنامه اجرا می‌شود! بدون نیاز به نصب یا دسترسی root.</p>

<h3>مقایسه Snap و AppImage</h3>

<table>
<thead><tr><th>ویژگی</th><th>Snap</th><th>AppImage</th></tr></thead>
<tbody>
<tr><td>نیاز به نصب</td><td>✅ نیاز به نصب با <code>snap install</code></td><td>❌ فقط دانلود و اجرا</td></tr>
<tr><td>نیاز به دامون (Daemon)</td><td>✅ نیاز به <code>snapd</code></td><td>❌ بدون نیاز به دامون</td></tr>
<tr><td>بروزرسانی خودکار</td><td>✅ به‌طور خودکار</td><td>❌ دستی</td></tr>
<tr><td>اجرا در محیط ایزوله</td><td>✅ Sandbox</td><td>❌ معمولاً بدون ایزوله</td></tr>
<tr><td>قابل اجرا روی اکثر توزیع‌ها</td><td>✅ (با نصب snapd)</td><td>✅ (مستقیم)</td></tr>
</tbody>
</table>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>هر دو روش برای سناریوهایی مناسب هستند که نرم‌افزار موردنظر در مخازن اصلی موجود نیست یا به نسخهٔ جدیدتری نیاز دارید. Snap مدیریت ساده‌تری دارد، اما AppImage سبک‌تر و قابل‌حمل‌تر است.</div></div>

<h2>Zabbix — یک سیستم مانیتورینگ شبکه</h2>

<p><strong>Zabbix</strong> یک نرم‌افزار <strong>مانیتورینگ شبکه</strong> است که به صورت <strong>رایگان</strong> و <strong>متن‌باز</strong> در دسترس است و بر روی <strong>سرورهای لینوکسی</strong> نصب می‌شود.</p>

<p>در این بخش، Zabbix را به‌صورت عملی روی یک سرور Debian/Ubuntu نصب می‌کنیم.</p>

<h3>مراحل نصب Zabbix (Debian/Ubuntu)</h3>

<h4>مرحله ۱: اضافه کردن مخزن رسمی Zabbix</h4>

<p>ابتدا مخزن رسمی Zabbix را به سیستم اضافه می‌کنیم:</p>

<div class="code-container"><span class="code-label">اضافه کردن مخزن</span><div class="code-block">wget https://repo.zabbix.com/zabbix/6.4/ubuntu/pool/main/z/zabbix-release/zabbix-release_6.4-1+ubuntu22.04_all.deb
sudo dpkg -i zabbix-release_6.4-1+ubuntu22.04_all.deb
sudo apt update</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>نسخهٔ Zabbix و معماری سیستم ممکن است متفاوت باشد. همیشه از وب‌سایت رسمی Zabbix آخرین نسخه را بررسی کنید.</div></div>

<h4>مرحله ۲: نصب Zabbix Server و Frontend</h4>

<div class="code-container"><span class="code-label">نصب سرویس‌ها</span><div class="code-block">sudo apt install -y zabbix-server-mysql zabbix-frontend-php zabbix-apache-conf zabbix-sql-scripts</div></div>

<h4>مرحله ۳: نصب و راه‌اندازی MariaDB (پایگاه داده)</h4>

<div class="code-container"><span class="code-label">نصب MariaDB</span><div class="code-block">sudo apt install -y mariadb-server
sudo systemctl start mariadb
sudo systemctl enable mariadb</div></div>

<p>سپس امنیت MariaDB را تنظیم کنید:</p>
<div class="code-container"><span class="code-label">امنیت</span><div class="code-block">sudo mysql_secure_installation</div></div>

<h4>مرحله ۴: ایجاد پایگاه داده Zabbix</h4>

<p>وارد MySQL شوید و پایگاه داده و کاربر Zabbix را ایجاد کنید:</p>

<div class="code-container"><span class="code-label">ایجاد پایگاه داده</span><div class="code-block no-prompt">sudo mysql -u root -p</div></div>

<p>سپس دستورات SQL زیر را اجرا کنید:</p>

<div class="code-container"><span class="code-label">دستورات SQL</span><div class="code-block no-prompt">CREATE DATABASE zabbix CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;
CREATE USER 'zabbix'@'localhost' IDENTIFIED BY 'your_strong_password';
GRANT ALL PRIVILEGES ON zabbix.* TO 'zabbix'@'localhost';
FLUSH PRIVILEGES;
EXIT;</div></div>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>هشدار</strong>حتماً <code>your_strong_password</code> را با یک رمز عبور قوی و واقعی جایگزین کنید. این رمز را در مرحله بعد در فایل پیکربندی Zabbix وارد خواهید کرد.</div></div>

<h4>مرحله ۵: ایمپورت کردن اسکیما (Schema) Zabbix</h4>

<div class="code-container"><span class="code-label">ایمپورت اسکیما</span><div class="code-block">zcat /usr/share/zabbix-sql-scripts/mysql/server.sql.gz | mysql -u zabbix -p zabbix</div></div>

<p>رمز عبور کاربر <code>zabbix</code> را که در مرحله قبل تعیین کردید وارد کنید.</p>

<h4>مرحله ۶: تنظیم فایل پیکربندی Zabbix Server</h4>

<div class="code-container"><span class="code-label">ویرایش پیکربندی</span><div class="code-block">sudo nano /etc/zabbix/zabbix_server.conf</div></div>

<p>خط زیر را پیدا کرده و رمز عبور را تنظیم کنید:</p>

<div class="code-container"><span class="code-label">تنظیم رمز</span><div class="code-block no-prompt">DBPassword=your_strong_password</div></div>

<p>فایل را ذخیره کرده و خارج شوید (<code>Ctrl+O</code>، <code>Enter</code>، <code>Ctrl+X</code>).</p>

<h4>مرحله ۷: راه‌اندازی سرویس‌ها</h4>

<div class="code-container"><span class="code-label">راه‌اندازی سرویس‌ها</span><div class="code-block">sudo systemctl restart zabbix-server zabbix-agent apache2
sudo systemctl enable zabbix-server zabbix-agent apache2</div></div>

<h4>مرحله ۸: بررسی وضعیت سرویس‌ها</h4>

<div class="code-container"><span class="code-label">بررسی وضعیت</span><div class="code-block">sudo systemctl status zabbix-server
sudo systemctl status zabbix-agent
sudo systemctl status apache2</div></div>

<h4>مرحله ۹: دسترسی به رابط وب Zabbix</h4>

<p>پس از نصب، می‌توانید از طریق مرورگر به آدرس زیر به رابط وب Zabbix دسترسی داشته باشید:</p>

<div class="code-container"><span class="code-label">آدرس</span><div class="code-block no-prompt">http://your-server-ip/zabbix</div></div>

<p>مراحل Setup Wizard را طی کنید و اطلاعات پایگاه داده را وارد کنید تا نصب کامل شود.</p>

<h3>نصب Zabbix روی AlmaLinux/RHEL</h3>

<p>نصب Zabbix روی AlmaLinux مشابه است، با این تفاوت که دستورات <code>apt</code> با <code>dnf</code> جایگزین می‌شوند:</p>

<h4>مراحل سریع</h4>

<div class="code-container"><span class="code-label">نصب مخزن</span><div class="code-block">sudo rpm -Uvh https://repo.zabbix.com/zabbix/6.4/rhel/9/x86_64/zabbix-release-6.4-1.el9.noarch.rpm
sudo dnf clean all</div></div>

<div class="code-container"><span class="code-label">نصب سرویس‌ها</span><div class="code-block">sudo dnf install -y zabbix-server-mysql zabbix-web-mysql zabbix-apache-conf zabbix-sql-scripts</div></div>

<p>سپس مراحل ایجاد پایگاه داده (با MariaDB) و ایمپورت اسکیما مشابه Debian است. فقط مسیر فایل اسکیما در <code>/usr/share/zabbix-sql-scripts/mysql/server.sql.gz</code> قرار دارد.</p>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته LPIC-1</strong>Zabbix یک مثال عملی از نصب نرم‌افزار از <strong>مخزن اختصاصی پروژه</strong> است. این روش در آزمون LPIC-1 اهمیت دارد زیرا بسیاری از نرم‌افزارهای تخصصی مخزن مخصوص خود را دارند و از مخازن اصلی توزیع استفاده نمی‌کنند.</div></div>

<p>در جلسه قبل با روش‌های مختلف نصب نرم‌افزار مثل Snap و AppImage آشنا شدیم. در این جلسه وارد دو مبحث مهم‌تر می‌شویم:</p>
<ol>
    <li><strong>کتابخانه‌ها (Libraries) و دستور <code>ldd</code></strong></li>
    <li><strong>پردازش‌ها (Processes) و دستورات <code>ps</code> و <code>top</code></strong></li>
</ol>

<h2>بخش اول — Library در Linux</h2>

<h3>کتابخانه چیست؟</h3>

<p>وقتی یک برنامه نوشته می‌شود، خیلی از کارها را لازم نیست برنامه‌نویس از صفر پیاده‌سازی کند.</p>

<p>مثلاً یک برنامه ممکن است نیاز داشته باشد:</p>
<ul>
    <li>فایل باز کند</li>
    <li>اطلاعات بخواند</li>
    <li>با حافظه کار کند</li>
    <li>عملیات محاسباتی انجام دهد</li>
    <li>با سیستم‌عامل ارتباط برقرار کند</li>
</ul>

<p>برای این کارها می‌توان از <strong>Library</strong>ها استفاده کرد.</p>

<blockquote>کتابخانه سیستم مجموعه‌ای از آیتم‌ها مانند توابع برنامه است.</blockquote>

<p>و <strong>Function</strong>ها ماژول‌های مستقلی از کد هستند که یک کار مشخص انجام می‌دهند؛ مثلاً باز کردن و خواندن یک فایل.</p>

<h3>چرا Library داریم؟</h3>

<p>فرض کنیم ۱۰ برنامه مختلف داریم که همگی برای خواندن فایل به یک سری توابع نیاز دارند.</p>

<p>اگر هر برنامه این توابع را داخل خودش قرار دهد:</p>
<div class="code-container"><span class="code-label">بدون Library</span><div class="code-block no-prompt">Program 1 → Function
Program 2 → Function
Program 3 → Function
...
Program 10 → Function</div></div>

<p>کد زیادی تکرار می‌شود.</p>

<p>اما با Library:</p>
<div class="code-container"><span class="code-label">با Library</span><div class="code-block no-prompt">             Library
          ↙    ↓    ↘
      Program 1  Program 2  Program 3</div></div>

<p>چندین برنامه می‌توانند از توابع مشترک استفاده کنند.</p>

<p>این یکی از مزیت‌های Library است.</p>

<h3>انواع Library در Linux</h3>

<p>در Linux به‌طور کلی با دو نوع Library مهم روبه‌رو هستیم:</p>
<div class="code-container"><span class="code-label">انواع</span><div class="code-block no-prompt">Static Libraries
Shared Libraries</div></div>

<h4>Static Library</h4>

<p>در <strong>Static Library</strong>، کتابخانه هنگام کامپایل داخل برنامه قرار می‌گیرد.</p>

<p>به شکل ساده:</p>
<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">Library → Compile → Program</div></div>

<p>یعنی هنگام ساخت برنامه، کد موردنیاز Library داخل برنامه قرار می‌گیرد.</p>

<p>در نتیجه برنامه برای آن قسمت از کد، وابستگی زمان اجرای کمتری به Library خارجی دارد.</p>

<h4>Shared Library</h4>

<p>در <strong>Shared Library</strong>، کتابخانه به شکل جداگانه وجود دارد و برنامه هنگام اجرا از آن استفاده می‌کند.</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">Program
   │
   └──────→ Shared Library</div></div>

<p>در واقع توابع موردنیاز در زمان اجرای برنامه در حافظه بارگذاری و به برنامه متصل می‌شوند.</p>

<h4>یک مثال ساده برای درک تفاوت</h4>

<p>فرض کنیم برنامه <code>A</code> به یک Library نیاز دارد.</p>

<h5>Static</h5>
<div class="code-container"><span class="code-label">Static</span><div class="code-block no-prompt">Library → داخل Program کپی می‌شود → Program</div></div>

<h5>Shared</h5>
<div class="code-container"><span class="code-label">Shared</span><div class="code-block no-prompt">Program → در زمان اجرا → Shared Library</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته آزمونی</strong>
<ul>
    <li><strong>Static</strong> → هنگام کامپایل داخل برنامه قرار می‌گیرد.</li>
    <li><strong>Shared</strong> → هنگام اجرا از Library جداگانه استفاده می‌شود.</li>
</ul>
<p>اگر سؤال پرسید: «کدام نوع Library هنگام اجرای برنامه بارگذاری می‌شود؟» پاسخ: <strong>Shared Library</strong></p>
</div></div>

<h4>شباهت با Windows</h4>

<p>اگر قبلاً با Windows کار کرده باشی، احتمالاً فایل‌های <code>.dll</code> را دیده‌ای.</p>

<p>Libraryهای پویا در Linux از نظر مفهوم شبیه Dynamic Link Libraryهای Windows هستند.</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">Windows: .dll
   ↕
Linux: Shared Library</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>این به معنی یکسان بودن ساختار داخلی آن‌ها نیست؛ منظور، شباهت مفهومی Dynamic/Shared Library است.</div></div>

<h3>سیستم Library را از کجا پیدا می‌کند؟</h3>

<p>وقتی یک برنامه به یک Shared Library نیاز دارد، سیستم باید بتواند آن Library را پیدا کند.</p>

<p>مسیرهای جستجو به این ترتیب هستند:</p>
<div class="code-container"><span class="code-label">مسیرهای جستجو</span><div class="code-block no-prompt">1. LD_LIBRARY_PATH
2. PATH برنامه
3. /etc/ld.so.conf.d/
4. /etc/ld.so.conf
5. /lib*/
6. /usr/lib*/</div></div>

<p>این ترتیب را برای آزمون جدی بگیر.</p>

<h4><code>LD_LIBRARY_PATH</code></h4>

<p>یکی از موارد مهم:</p>
<div class="code-container"><span class="code-label">متغیر</span><div class="code-block no-prompt">LD_LIBRARY_PATH</div></div>

<p>این یک <strong>Environment Variable</strong> است که می‌تواند مسیرهای موردنظر برای پیدا کردن Shared Libraryها را مشخص کند.</p>

<p>مثلاً از نظر مفهومی:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">LD_LIBRARY_PATH → /home/user/mylibs → Search Library</div></div>

<p>پس اگر Library در یک مسیر غیرمعمول قرار داشته باشد، می‌توان مسیر آن را از طریق <code>LD_LIBRARY_PATH</code> معرفی کرد.</p>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته آزمونی</strong>
<p><code>LD_LIBRARY_PATH</code> را با <code>PATH</code> معمولی اشتباه نکن.</p>
<ul>
    <li><code>PATH</code> → برای پیدا کردن <strong>Executable</strong>ها</li>
    <li><code>LD_LIBRARY_PATH</code> → برای مسیر جستجوی Libraryها</li>
</ul>
</div></div>

<h4>مسیرهای Configuration مربوط به Library</h4>

<p>دو مسیر مهم دیگر:</p>
<div class="code-container"><span class="code-label">مسیرها</span><div class="code-block no-prompt">/etc/ld.so.conf.d/
/etc/ld.so.conf</div></div>

<p>هستند.</p>

<p>این مسیرها در فرآیند پیدا کردن Libraryها نقش دارند.</p>

<p>در نهایت مسیرهای معمولی مانند:</p>
<div class="code-container"><span class="code-label">مسیرها</span><div class="code-block no-prompt">/lib*/
/usr/lib*/</div></div>

<p>نیز در این فرآیند قرار دارند.</p>

<h2>بخش دوم — دستور <code>ldd</code></h2>

<p>حالا می‌رسیم به مهم‌ترین دستور این بخش.</p>

<h3><code>ldd</code> چیست؟</h3>

<p>دستور <code>ldd</code> برای مشاهده <strong>Libraryهای موردنیاز یک برنامه</strong> استفاده می‌شود.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ldd /usr/bin/ls</div></div>

<p>یعنی:</p>
<blockquote>به من نشان بده برنامه <code>/usr/bin/ls</code> به چه Libraryهایی نیاز دارد.</blockquote>

<h3>اجرای <code>ldd</code></h3>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">ldd /usr/bin/ls</div></div>

<p>خروجی می‌تواند شبیه این باشد:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">linux-vdso.so.1
libselinux.so.1 => /lib/x86_64-linux-gnu/libselinux.so.1
libc.so.6 => /lib/x86_64-linux-gnu/libc.so.6
libpcre2-8.so.0 => /lib/x86_64-linux-gnu/libpcre2-8.so.0
/lib64/ld-linux-x86-64.so.2</div></div>

<h3>خروجی <code>ldd</code> را چطور بخوانیم؟</h3>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">تفسیر</span><div class="code-block no-prompt">libc.so.6 => /lib/x86_64-linux-gnu/libc.so.6</div></div>

<p>یعنی برنامه به Library زیر نیاز دارد:</p>
<div class="code-container"><span class="code-label">نام Library</span><div class="code-block no-prompt">libc.so.6</div></div>

<p>و سیستم آن را در این مسیر پیدا کرده:</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">/lib/x86_64-linux-gnu/libc.so.6</div></div>

<p>پس <code>ldd</code> هم <strong>نام Library</strong> و هم محل پیدا شدن آن را به ما نشان می‌دهد.</p>

<h3><code>ldd</code> چه کاربردی دارد؟</h3>

<p>فرض کن برنامه‌ای اجرا نمی‌شود و احتمال می‌دهیم یک Dependency یا Library لازم را ندارد.</p>

<p>می‌توانیم بررسی کنیم:</p>
<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">ldd ./myprogram</div></div>

<p>و ببینیم چه Libraryهایی موردنیاز آن هستند.</p>

<div class="code-container"><span class="code-label">کاربرد</span><div class="code-block no-prompt">Program → ldd → Required Libraries</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی</strong>
<p>اگر سؤال پرسید: «کدام دستور Dependencyهای Shared Library یک برنامه را نشان می‌دهد؟»</p>
<p>پاسخ: <code>ldd program</code></p>
</div></div>

<h3><code>ldconfig</code></h3>

<p>دستور <code>ldconfig -V</code> برای نمایش اطلاعات مربوط به Library Configuration/Cache استفاده می‌شود.</p>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته مهم</strong>
<p><code>ldconfig</code> را با <code>ldd</code> اشتباه نگیری:</p>
<ul>
    <li><code>ldd</code> → Libraryهای موردنیاز یک برنامه</li>
    <li><code>ldconfig</code> → مدیریت/به‌روزرسانی اطلاعات Libraryهای سیستم</li>
</ul>
</div></div>

<h2>بخش سوم — <code>chroot</code></h2>

<h3><code>chroot</code> چیست؟</h3>

<p><code>chroot</code> ریشه دایرکتوری یک فرمان یا Process را تغییر می‌دهد.</p>

<p>یعنی به زبان ساده می‌توانیم محیطی ایجاد کنیم که یک Process، یک Directory مشخص را به عنوان <code>/</code> ببیند.</p>

<h3>Jail چیست؟</h3>

<p>یکی از کاربردهای <code>chroot</code> ایجاد یک محیط محدود یا <strong>Jail</strong> است.</p>

<p>تصور کن سیستم اصلی این است:</p>
<div class="code-container"><span class="code-label">سیستم اصلی</span><div class="code-block no-prompt">/
├── home
├── etc
├── usr
├── var
└── ...</div></div>

<p>ولی می‌خواهیم یک Process را در محیط محدودتری قرار دهیم:</p>
<div class="code-container"><span class="code-label">Jail</span><div class="code-block no-prompt">/jail
├── bin
├── etc
├── lib
└── ...</div></div>

<p>برای آن Process می‌توان <code>/jail</code> را به عنوان Root محیط در نظر گرفت.</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">chroot → Change Root → Restricted Environment / Jail</div></div>

<p>طبق اسلاید، یکی از کاربردهای آن محدود کردن دسترسی کاربر به یک Directory خاص است.</p>

<h2>بخش چهارم — Process در Linux</h2>

<p>حالا از Libraryها فاصله می‌گیریم و وارد قسمت دوم جلسه می‌شویم.</p>

<h3>Process چیست؟</h3>

<p>هر برنامه، فرمان، ابزار یا سرویسی که در Linux در حال اجرا باشد، یک <strong>Process</strong> محسوب می‌شود.</p>

<p>مثلاً وقتی اجرا می‌کنیم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">firefox</div></div>

<p>یک Process ایجاد می‌شود.</p>

<p>یا:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">python
sleep 100</div></div>

<p>هرکدام می‌توانند Process ایجاد کنند.</p>

<h3>PID چیست؟</h3>

<p>هر Process در Linux یک شماره منحصربه‌فرد دارد که به آن <strong>PID</strong> می‌گوییم.</p>

<p>PID مخفف <strong>Process ID</strong> است.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">Process        PID
──────────     ────
bash           1250
python         1842
firefox        2310</div></div>

<p>پس اگر بخواهیم یک Process مشخص را شناسایی کنیم، PID آن بسیار مهم است.</p>

<h3>چرا PID مهم است؟</h3>

<p>در جلسات بعدی که به <code>kill</code> می‌رسیم، از PID برای مشخص کردن Process موردنظر استفاده خواهیم کرد.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">Process → PID = 1234 → kill 1234</div></div>

<p>بنابراین:</p>
<blockquote>PID مثل شماره شناسایی یک Process است.</blockquote>

<h3>اولین Process</h3>

<p>به صورت سنتی اولین Process پس از راه‌اندازی Kernel، <code>init</code> بوده است.</p>

<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">Kernel → init → Other Processes</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>در سیستم‌های Linux مدرن، معمولاً <code>systemd</code> نقش PID 1 را بر عهده دارد؛ اما در مباحث کلاسیک LPIC، مفهوم تاریخی <strong>init به عنوان اولین Process</strong> مطرح شده است.</div></div>

<p>بنابراین برای درک مفهوم:</p>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">PID 1 → اولین Process سیستم</div></div>

<h2>بخش پنجم — دستور <code>ps</code></h2>

<h3><code>ps</code> چیست؟</h3>

<p>دستور <code>ps</code> برای مشاهده Processها استفاده می‌شود.</p>

<p>اما یک نکته مهم دارد:</p>
<blockquote><code>ps</code> یک <strong>Snapshot یا عکس لحظه‌ای</strong> از Processها به ما می‌دهد.</blockquote>

<h3>اجرای <code>ps</code></h3>

<p>اگر فقط بنویسیم:</p>
<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">ps</div></div>

<p>ممکن است چیزی شبیه این ببینیم:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">PID TTY          TIME CMD
1234 pts/0    00:00:00 bash
1456 pts/0    00:00:00 ps</div></div>

<p>یعنی Processهای مرتبط با Session فعلی نمایش داده می‌شوند.</p>

<h3><code>ps aux</code></h3>

<p>یکی از حالت‌های بسیار معروف:</p>
<div class="code-container"><span class="code-label">نمایش کامل</span><div class="code-block">ps aux</div></div>

<p>این دستور اطلاعات گسترده‌تری از Processهای سیستم نمایش می‌دهد.</p>

<p>مثلاً ممکن است ستون‌هایی مثل:</p>
<div class="code-container"><span class="code-label">ستون‌ها</span><div class="code-block no-prompt">USER
PID
%CPU
%MEM
STAT
START
TIME
COMMAND</div></div>

<p>را ببینیم.</p>

<h3><code>ps -ef</code></h3>

<p>یک حالت بسیار رایج دیگر:</p>
<div class="code-container"><span class="code-label">نمایش کامل</span><div class="code-block">ps -ef</div></div>

<p>این هم برای مشاهده Processهای سیستم استفاده می‌شود.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">ستون‌ها</span><div class="code-block no-prompt">UID
PID
PPID
C
STIME
TTY
TIME
CMD</div></div>

<p>را می‌توانیم ببینیم.</p>

<p>در LPIC مهم‌تر از حفظ تمام ستون‌ها، این است که بدانیم:</p>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">ps → Snapshot → Process List</div></div>

<h2>بخش ششم — دستور <code>top</code></h2>

<h3><code>top</code> چیست؟</h3>

<p>دستور <code>top</code> هم برای مشاهده Processها استفاده می‌شود.</p>

<p>اما تفاوت مهمی با <code>ps</code> دارد.</p>

<p><code>top</code> یک نمای <strong>لحظه‌ای و پویا</strong> ارائه می‌کند و اطلاعات را مرتباً به‌روزرسانی می‌کند.</p>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">ps  → Snapshot → یک عکس
top → Dynamic → Refresh → Refresh → Refresh</div></div>

<h3>اجرای <code>top</code></h3>

<p>فقط کافی است بنویسیم:</p>
<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">top</div></div>

<p>و Enter بزنیم.</p>

<p>یک محیط متنی باز می‌شود که اطلاعات Processها را به شکل مداوم نمایش می‌دهد.</p>

<p>معمولاً می‌توانیم اطلاعاتی مانند:</p>
<div class="code-container"><span class="code-label">اطلاعات</span><div class="code-block no-prompt">PID
USER
CPU
MEMORY
TIME
COMMAND</div></div>

<p>را مشاهده کنیم.</p>

<h3>تفاوت اصلی <code>ps</code> و <code>top</code></h3>

<p>این بخش را خیلی خوب یاد بگیر:</p>

<table>
<thead><tr><th>دستور</th><th>نوع نمایش</th></tr></thead>
<tbody>
<tr><td><code>ps</code></td><td>Snapshot / عکس لحظه‌ای</td></tr>
<tr><td><code>top</code></td><td>Dynamic / پویا و مداوم</td></tr>
</tbody>
</table>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکات آزمونی مهم</strong>
<ul>
    <li>اگر سؤال پرسید: «کدام دستور Processها را به صورت پویا و مداوم نمایش می‌دهد؟» → <code>top</code></li>
    <li>اگر پرسید: «کدام دستور Snapshot از Processها می‌دهد؟» → <code>ps</code></li>
</ul>
</div></div>

<h3>یک مثال عملی</h3>

<p>فرض کنیم می‌خواهیم ببینیم چه Processهایی روی سیستم در حال اجرا هستند.</p>

<p>ابتدا:</p>
<div class="code-container"><span class="code-label">Snapshot</span><div class="code-block">ps</div></div>

<p>یک Snapshot می‌گیریم.</p>

<p>بعد:</p>
<div class="code-container"><span class="code-label">پویا</span><div class="code-block">top</div></div>

<p>را اجرا می‌کنیم.</p>

<p>حالا اگر یک Process جدید اجرا شود، <code>top</code> می‌تواند در Refreshهای بعدی آن را نمایش دهد.</p>

<p>ولی خروجی قبلی <code>ps</code> خودش به‌صورت خودکار تغییر نمی‌کند.</p>

<p>برای گرفتن Snapshot جدید باید دوباره <code>ps</code> را اجرا کنیم.</p>

<h3>ارتباط <code>ps</code> و <code>top</code> با جلسه بعد</h3>

<p>در جلسه بعد به دستور <code>kill</code> می‌رسیم.</p>

<p>برای Kill کردن یک Process معمولاً ابتدا باید PID آن را بدانیم.</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">روش</span><div class="code-block no-prompt">ps → PID → kill PID</div></div>

<p>یا:</p>
<div class="code-container"><span class="code-label">روش</span><div class="code-block no-prompt">top → PID → kill PID</div></div>

<p>پس جلسه امروز پایه مهمی برای جلسه بعد است.</p>

       │
       ↓

Required Libraries</div></div>

Shared  → هنگام Run/Execution بارگذاری</div></div>

<div class="code-container"><span class="code-label">ldd</span><div class="code-block">ldd /usr/bin/ls</div></div>
<p>→ Libraryهای موردنیاز <code>ls</code></p>

    <li><strong><code>PID</code></strong> = Process ID</li>

<p>جلسه بعد طبق برنامه وارد <strong><code>tmux</code></strong> می‌شویم و بعد از آن در جلسه ۷ سراغ <strong><code>kill</code> و مدیریت Processها</strong> خواهیم رفت.</p>

<div class="section-header">
    <div class="section-badge">۲</div>
    <div>
        <h1>tmux — Terminal Multiplexer</h1>
        <div class="meta">مدیریت نرم‌افزار و فرآیندها · بخش ۶ از ۸</div>
    </div>
</div>

<p>در جلسه قبل با Libraryها (<code>ldd</code>)، Processها، <code>ps</code> و <code>top</code> آشنا شدیم. یاد گرفتیم چطور Processهای در حال اجرا را ببینیم — یکی به صورت Snapshot (<code>ps</code>) و دیگری به صورت Dynamic (<code>top</code>).</p>

<p>در این جلسه سراغ ابزاری می‌رویم که ارتباط مستقیمی با کار روزمره روی سرورهای Linux دارد:</p>
<div class="code-container"><span class="code-label">ابزار</span><div class="code-block no-prompt">tmux</div></div>

<p>یعنی <strong>Terminal Multiplexer</strong>. این ابزار به ما کمک می‌کند چند Session و چند پنجره ترمینال را همزمان مدیریت کنیم، حتی اگر اتصال SSH ما قطع شود.</p>

<h2>مشکلی که <code>tmux</code> حل می‌کند</h2>

<p>فرض کن روی یک سرور از راه دور با SSH وصل شده‌ای و یک فرآیند طولانی اجرا می‌کنی:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">./long-backup-script.sh</div></div>

<p>حالا اگر اتصال اینترنت قطع شود یا SSH بسته شود، چه اتفاقی می‌افتد؟</p>
<div class="code-container"><span class="code-label">مشکل</span><div class="code-block no-prompt">SSH Connection → Disconnect → Terminal بسته می‌شود → Process متوقف می‌شود</div></div>

<p>این دقیقاً مشکلی است که <code>tmux</code> حل می‌کند.</p>

<h2><code>tmux</code> چیست؟</h2>

<p><code>tmux</code> مخفف <strong>Terminal Multiplexer</strong> است.</p>

<p>طبق تعریف کلی، <code>tmux</code> به ما اجازه می‌دهد:</p>
<div class="code-container"><span class="code-label">کاربرد</span><div class="code-block no-prompt">چند Terminal Session
      ↓
داخل یک اتصال SSH واحد
      ↓
مدیریت شوند</div></div>

<p>نکته مهم‌تر این است که یک Session در <code>tmux</code> می‌تواند حتی بعد از قطع شدن اتصال SSH، در پس‌زمینه سرور به کار خودش ادامه دهد.</p>

<h2>ایده اصلی: Session مستقل از Terminal</h2>

<p>به این شکل به موضوع نگاه کن:</p>
<div class="code-container"><span class="code-label">Terminal معمولی</span><div class="code-block no-prompt">Terminal معمولی → Process به Terminal وابسته است → Terminal بسته شود → Process متوقف می‌شود</div></div>

<p>اما:</p>
<div class="code-container"><span class="code-label">tmux</span><div class="code-block no-prompt">tmux Session → Process به Session وابسته است، نه به Terminal → Terminal بسته شود → Session روی سرور باقی می‌ماند</div></div>

<blockquote><strong>Session در <code>tmux</code> مستقل از اتصال ترمینال است.</strong></blockquote>

<h2>نصب <code>tmux</code></h2>

<p>مثل هر Package دیگری، <code>tmux</code> را می‌توان با Package Manager توزیع نصب کرد.</p>

<h3>Debian / Ubuntu</h3>
<div class="code-container"><span class="code-label">نصب</span><div class="code-block">sudo apt install tmux</div></div>

<h3>Red Hat / CentOS</h3>
<div class="code-container"><span class="code-label">نصب</span><div class="code-block">sudo dnf install tmux</div></div>

<p>این دقیقاً همان الگویی است که در جلسات اول این فصل با آن آشنا شدیم:</p>
<div class="code-container"><span class="code-label">الگو</span><div class="code-block no-prompt">Repository → Package Manager → Package → Install</div></div>

<h2>اجرای اولین Session</h2>

<p>برای شروع یک Session جدید کافی است بنویسیم:</p>
<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">tmux</div></div>

<p>با اجرای این دستور، یک صفحه جدید باز می‌شود و در پایین صفحه یک نوار وضعیت (Status Bar) سبزرنگ ظاهر می‌شود.</p>

<p>به‌صورت مفهومی:</p>
<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">tmux → New Session → Status Bar پایین صفحه</div></div>

<p>این یعنی الان داخل یک Session از <code>tmux</code> هستیم.</p>

<h2>Prefix Key چیست؟</h2>

<p>مهم‌ترین مفهومی که باید در <code>tmux</code> یاد بگیری، <strong>Prefix Key</strong> است.</p>

<p><code>tmux</code> اکثر دستورات داخلی خودش را از طریق یک ترکیب کلید خاص اجرا می‌کند، نه به‌صورت مستقیم.</p>

<p>Prefix پیش‌فرض:</p>
<div class="code-container"><span class="code-label">Prefix</span><div class="code-block no-prompt">Ctrl + b</div></div>

<p>است.</p>

<p>یعنی برای اجرای اکثر دستورات داخل <code>tmux</code>، ابتدا <code>Ctrl+b</code> را می‌زنیم، سپس کلید مربوط به دستور موردنظر را می‌زنیم.</p>

<div class="code-container"><span class="code-label">روش</span><div class="code-block no-prompt">Ctrl+b → سپس یک کلید دیگر → اجرای دستور tmux</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی</strong>
<p>Prefix پیش‌فرض <code>tmux</code>:</p>
<div class="code-container"><span class="code-label">tmux</span><div class="code-block no-prompt">Ctrl+b</div></div>
<p>را با Prefix پیش‌فرض <code>screen</code> که:</p>
<div class="code-container"><span class="code-label">screen</span><div class="code-block no-prompt">Ctrl+a</div></div>
<p>است اشتباه نگیر. این دو ابزار مشابه هم هستند اما Prefix پیش‌فرضشان متفاوت است.</p>
</div></div>

<h2>مفاهیم پایه: Session، Window، Pane</h2>

<p>قبل از رفتن سراغ دستورات، باید سه مفهوم اصلی <code>tmux</code> را بشناسیم:</p>
<div class="code-container"><span class="code-label">سلسله‌مراتب</span><div class="code-block no-prompt">Session
   │
   └── Window (مثل تب)
          │
          └── Pane (تقسیم صفحه)</div></div>

<h3>Session</h3>
<p>یک محیط کاری مستقل که می‌تواند شامل چند Window باشد.</p>

<h3>Window</h3>
<p>شبیه یک تب در Terminal است؛ هر Window یک صفحه کامل ترمینال است.</p>

<h3>Pane</h3>
<p>هر Window می‌تواند به چند Pane تقسیم شود؛ یعنی چند صفحه ترمینال کنار هم یا زیر هم.</p>

<p>به‌صورت تصویری:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">Session
├── Window 0
│      ├── Pane 1
│      └── Pane 2
└── Window 1
       └── Pane 1</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته آزمونی</strong>
<p>ترتیب سلسله‌مراتبی را دقیق به خاطر بسپار:</p>
<div class="code-container"><span class="code-label">ترتیب</span><div class="code-block no-prompt">Session > Window > Pane</div></div>
</div></div>

<h2>ساخت Session با نام مشخص</h2>

<p>بهتر است Sessionها را بدون نام رها نکنیم، چون مدیریت چند Session بی‌نام سخت می‌شود.</p>

<p>برای ساخت یک Session با نام دلخواه:</p>
<div class="code-container"><span class="code-label">ساخت</span><div class="code-block">tmux new -s session-name</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">tmux new -s backup</div></div>

<p>ساختار دستور:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">tmux → new → -s → session-name</div></div>

<p><code>-s</code> مخفف <code>session</code> است و نام Session را مشخص می‌کند.</p>

<h2>جدا شدن از Session (Detach)</h2>

<p>فرض کن داخل یک Session هستیم و می‌خواهیم بدون بستن Session از آن خارج شویم؛ یعنی Session در پس‌زمینه به کارش ادامه دهد.</p>

<p>برای این کار:</p>
<div class="code-container"><span class="code-label">Detach</span><div class="code-block no-prompt">Ctrl+b → d</div></div>

<p>یعنی ابتدا Prefix را می‌زنیم، سپس حرف <code>d</code> (مخفف detach).</p>

<p>بعد از این کار، به Terminal اصلی برمی‌گردیم، اما Session و هر Processی که داخلش در حال اجراست، همچنان روی سرور فعال باقی می‌ماند.</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">tmux Session → Ctrl+b d → Detach → Session در پس‌زمینه باقی می‌ماند</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی مهم</strong>
<p>Detach کردن به معنی بستن یا از بین رفتن Session <strong>نیست</strong>. Session همچنان زنده است و فقط از دید ما پنهان شده.</p>
</div></div>

<h2>مشاهده لیست Sessionها</h2>

<p>برای دیدن اینکه چه Sessionهایی در حال حاضر باز هستند:</p>
<div class="code-container"><span class="code-label">لیست</span><div class="code-block">tmux ls</div></div>

<p>خروجی می‌تواند شبیه این باشد:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">backup: 1 windows (created ...)
monitor: 2 windows (created ...)</div></div>

<p>یعنی این دستور به ما نشان می‌دهد چند Session باز است و هرکدام چند Window دارند.</p>

<div class="code-container"><span class="code-label">کاربرد</span><div class="code-block no-prompt">tmux ls → List of Sessions</div></div>

<h2>بازگشت به یک Session (Attach)</h2>

<p>حالا فرض کن Session را Detach کرده‌ایم و می‌خواهیم دوباره به آن وصل شویم.</p>

<div class="code-container"><span class="code-label">اتصال</span><div class="code-block">tmux attach -t session-name</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">tmux attach -t backup</div></div>

<p>ساختار دستور:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">tmux → attach → -t → session-name</div></div>

<p><code>-t</code> مخفف <code>target</code> است و مشخص می‌کند به کدام Session می‌خواهیم وصل شویم.</p>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی</strong>
<p>چرخه کامل کار با یک Session را حتماً به خاطر بسپار:</p>
<div class="code-container"><span class="code-label">چرخه</span><div class="code-block no-prompt">tmux new -s backup
      ↓
   کار می‌کنیم
      ↓
   Ctrl+b d  (Detach)
      ↓
tmux ls  (بررسی Sessionها)
      ↓
tmux attach -t backup  (بازگشت)</div></div>
</div></div>

<h2>چرا این چرخه اهمیت دارد؟</h2>

<p>تصور کن روی سرور از راه دور یک Process طولانی اجرا کرده‌ای:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">tmux new -s backup
./long-backup-script.sh</div></div>

<p>بعد Session را Detach می‌کنی و کامپیوترت را خاموش می‌کنی یا SSH را می‌بندی.</p>

<p>فردا دوباره به سرور SSH می‌زنی و می‌نویسی:</p>
<div class="code-container"><span class="code-label">ادامه</span><div class="code-block">tmux attach -t backup</div></div>

<p>و دقیقاً همان صفحه‌ای که دیروز رها کرده بودی را می‌بینی؛ Process همچنان (در صورت کامل نشدن) در حال اجراست.</p>

<div class="code-container"><span class="code-label">سناریو</span><div class="code-block no-prompt">روز اول
   ↓
tmux new -s backup + اجرای Script
   ↓
Detach
   ↓
قطع اتصال SSH

روز بعد
   ↓
tmux attach -t backup
   ↓
همان محیط قبلی</div></div>

<h2>ساخت Window جدید</h2>

<p>داخل یک Session می‌توانیم چند Window داشته باشیم.</p>

<p>برای ساخت Window جدید:</p>
<div class="code-container"><span class="code-label">Window جدید</span><div class="code-block no-prompt">Ctrl+b → c</div></div>

<p><code>c</code> مخفف create است.</p>

<div class="code-container"><span class="code-label">فرآیند</span><div class="code-block no-prompt">Ctrl+b c → Window جدید ساخته می‌شود</div></div>

<h2>جابه‌جایی بین Windowها</h2>

<p>برای رفتن به Window بعدی یا قبلی:</p>
<div class="code-container"><span class="code-label">جابه‌جایی</span><div class="code-block no-prompt">Ctrl+b n  → Window بعدی (next)
Ctrl+b p  → Window قبلی (previous)</div></div>

<p>برای رفتن مستقیم به یک شماره Window خاص:</p>
<div class="code-container"><span class="code-label">شماره</span><div class="code-block no-prompt">Ctrl+b 0
Ctrl+b 1
Ctrl+b 2</div></div>

<p>یعنی هر Window با یک شماره مشخص می‌شود، از ۰ شروع می‌شود.</p>

<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">Window 0   Window 1   Window 2
   ↓           ↓           ↓
Ctrl+b 0   Ctrl+b 1   Ctrl+b 2</div></div>

<h2>تقسیم صفحه با Pane</h2>

<p>یکی از قابلیت‌های معروف <code>tmux</code>، توانایی تقسیم یک Window به چند Pane است.</p>

<h3>تقسیم افقی (کنار هم)</h3>
<div class="code-container"><span class="code-label">افقی</span><div class="code-block no-prompt">Ctrl+b → %</div></div>

<h3>تقسیم عمودی (زیر هم)</h3>
<div class="code-container"><span class="code-label">عمودی</span><div class="code-block no-prompt">Ctrl+b → "</div></div>

<p>به‌صورت تصویری:</p>
<div class="code-container"><span class="code-label">نمایش</span><div class="code-block no-prompt">Ctrl+b %                Ctrl+b "

┌───────┬───────┐        ┌───────────────┐
│       │       │        │               │
│ Pane1 │ Pane2 │        │     Pane1     │
│       │       │        ├───────────────┤
└───────┴───────┘        │     Pane2     │
                          └───────────────┘</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی</strong>
<p>خیلی از افراد این دو را برعکس به خاطر می‌سپارند؛ حتماً چند بار تمرین کن:</p>
<div class="code-container"><span class="code-label">یادآوری</span><div class="code-block no-prompt">%  → تقسیم افقی (Pane کنار هم)
"  → تقسیم عمودی (Pane زیر هم)</div></div>
</div></div>

<h2>جابه‌جایی بین Paneها</h2>

<p>برای جابه‌جایی بین Paneهای مختلف داخل یک Window:</p>
<div class="code-container"><span class="code-label">جابه‌جایی</span><div class="code-block no-prompt">Ctrl+b → جهت‌نما (Arrow Keys)</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">Ctrl+b →
Ctrl+b ↓</div></div>

<p>باعث می‌شود بین Paneها حرکت کنیم.</p>

<h2>بستن یک Pane یا Window</h2>

<p>برای بستن Pane یا Window فعلی، معمولاً کافی است دستور داخل آن Shell را ببندیم:</p>
<div class="code-container"><span class="code-label">بستن</span><div class="code-block">exit</div></div>

<p>یا:</p>
<div class="code-container"><span class="code-label">میانبر</span><div class="code-block no-prompt">Ctrl+d</div></div>

<p>با این کار، اگر آن Pane آخرین Pane باقی‌مانده در Window باشد، Window هم بسته می‌شود؛ و اگر آن Window آخرین Window باقی‌مانده در Session باشد، Session نیز بسته می‌شود.</p>

<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">exit → بستن Pane → اگر آخرین Pane بود → بستن Window → اگر آخرین Window بود → بستن Session</div></div>

<h2>حذف کامل یک Session</h2>

<p>اگر بخواهیم مستقیماً و بدون ورود به Session، آن را از بین ببریم:</p>
<div class="code-container"><span class="code-label">حذف</span><div class="code-block">tmux kill-session -t session-name</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">tmux kill-session -t backup</div></div>

<p>این با Detach کردن فرق دارد:</p>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">Detach (Ctrl+b d) → Session زنده می‌ماند
kill-session → Session کاملاً از بین می‌رود</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>نکته آزمونی مهم</strong>
<p>این تفاوت یکی از رایج‌ترین نکاتی است که در آزمون‌ها اشتباه گرفته می‌شود:</p>
