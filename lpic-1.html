"ch1-7": `
<div class="section-header">
    <div class="section-badge">۱</div>
    <div>
        <h1>ویرایشگر nano و مقایسه با vi</h1>
        <div class="meta">کار با خط فرمان · بخش ۷ از ۱۴</div>
    </div>
</div>

<p>در جلسه قبل با ویرایشگر <strong><code>vi</code></strong> آشنا شدیم؛ ویرایشگری قدرتمند که تقریباً روی تمام سیستم‌های لینوکسی وجود دارد. اما بسیاری از کاربران تازه‌کار، کار با <code>vi</code> را در ابتدا کمی دشوار می‌دانند، زیرا دارای حالت‌های مختلف (Mode) است.</p>

<p>در این جلسه با <strong>ویرایشگر <code>nano</code></strong> آشنا می‌شویم؛ ویرایشگری ساده، کاربرپسند و مناسب برای ویرایش سریع فایل‌های متنی. همچنین در پایان، <code>nano</code> را با <code>vi</code> مقایسه می‌کنیم تا بدانید در چه شرایطی از هرکدام استفاده کنید.</p>

<h2>nano چیست؟</h2>
<p><code>nano</code> یک ویرایشگر متنی مبتنی بر ترمینال (Terminal-Based Text Editor) است که برای ویرایش فایل‌های متنی در محیط خط فرمان استفاده می‌شود.</p>
<p>مزیت اصلی <code>nano</code> نسبت به <code>vi</code> این است که <strong>حالت‌های مختلف ندارد</strong> و از همان لحظه‌ای که فایل را باز می‌کنید، می‌توانید مستقیماً شروع به تایپ کنید.</p>
<p>برای باز کردن یک فایل:</p>
<div class="code-container"><span class="code-label">باز کردن</span><div class="code-block">nano file.txt</div></div>
<p>اگر فایل وجود نداشته باشد، هنگام ذخیره کردن ایجاد خواهد شد.</p>

<h3>اگر nano نصب نباشد...</h3>
<p>در بعضی از توزیع‌های مینیمال لینوکس، ممکن است <code>nano</code> به‌صورت پیش‌فرض نصب نباشد.</p>
<p>در Debian و Ubuntu:</p>
<div class="code-container"><span class="code-label">نصب</span><div class="code-block">sudo apt install nano</div></div>
<p>در RHEL و CentOS:</p>
<div class="code-container"><span class="code-label">نصب</span><div class="code-block">sudo dnf install nano</div></div>

<h2>اجرای nano</h2>
<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">nano test.txt</div></div>
<p>بعد از اجرای دستور، محیطی مشابه زیر مشاهده می‌کنید:</p>
<div class="code-container"><span class="code-label">نمایش</span><div class="code-block no-prompt">+-------------------------------------------+\n|                                           |\n|   اینجا متن خود را بنویسید...              |\n|                                           |\n|                                           |\n+-------------------------------------------+\n\n^G Help     ^O Write Out    ^X Exit\n^K Cut      ^U Paste        ^W Search</div></div>
<p>قسمت پایین صفحه، مهم‌ترین میانبرهای صفحه‌کلید را نمایش می‌دهد.</p>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته مهم</strong>در <code>nano</code> برخلاف <code>vi</code>:
<ul>
    <li>Command Mode وجود ندارد.</li>
    <li>Insert Mode وجود ندارد.</li>
    <li>Ex Mode وجود ندارد.</li>
</ul>
از همان ابتدا می‌توانید تایپ کنید.
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">اجرای nano\n      │\n      ▼\n+---------------------+\n| مستقیماً تایپ کنید |\n+---------------------+</div></div>
</div></div>

<h2>ذخیره فایل</h2>
<p>بعد از ویرایش فایل، برای ذخیره کردن:</p>
<div class="code-container"><span class="code-label">ذخیره</span><div class="code-block no-prompt">Ctrl + O</div></div>
<p>در پایین صفحه پیام زیر نمایش داده می‌شود:</p>
<div class="code-container"><span class="code-label">پیام</span><div class="code-block no-prompt">File Name to Write:</div></div>
<p>اگر نام فایل درست است:</p>
<div class="code-container"><span class="code-label">تأیید</span><div class="code-block no-prompt">Enter</div></div>
<p>را فشار دهید.</p>

<h2>خروج از nano</h2>
<p>برای خروج:</p>
<div class="code-container"><span class="code-label">خروج</span><div class="code-block no-prompt">Ctrl + X</div></div>
<p>اگر فایل ذخیره نشده باشد، پیام زیر نمایش داده می‌شود:</p>
<div class="code-container"><span class="code-label">پیام</span><div class="code-block no-prompt">Save modified buffer?\nY Yes\nN No</div></div>
<p>اگر <code>Y</code> را انتخاب کنید، فایل ذخیره می‌شود. اگر <code>N</code> را انتخاب کنید، تغییرات از بین می‌رود.</p>

<h2>جستجو در فایل</h2>
<p>برای جستجوی یک عبارت:</p>
<div class="code-container"><span class="code-label">جستجو</span><div class="code-block no-prompt">Ctrl + W</div></div>
<p>سپس عبارت موردنظر را وارد کنید.</p>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">Linux</div></div>
<p>در صورت وجود، مکان‌نما روی اولین نتیجه قرار می‌گیرد.</p>

<h2>بریدن (Cut) متن</h2>
<p>برای بریدن خط جاری:</p>
<div class="code-container"><span class="code-label">بریدن</span><div class="code-block no-prompt">Ctrl + K</div></div>
<p>مثال:</p>
<p>قبل:</p>
<div class="code-container"><span class="code-label">قبل</span><div class="code-block no-prompt">Line 1\nLine 2\nLine 3</div></div>
<p>اگر مکان‌نما روی خط دوم باشد و <code>Ctrl + K</code> را فشار دهید:</p>
<p>بعد:</p>
<div class="code-container"><span class="code-label">بعد</span><div class="code-block no-prompt">Line 1\nLine 3</div></div>

<h2>چسباندن (Paste)</h2>
<p>برای چسباندن متن بریده‌شده:</p>
<div class="code-container"><span class="code-label">چسباندن</span><div class="code-block no-prompt">Ctrl + U</div></div>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">Ctrl + K\nCtrl + U</div></div>

<h2>دریافت راهنما (Help)</h2>
<p>برای مشاهده راهنمای کامل <code>nano</code>:</p>
<div class="code-container"><span class="code-label">راهنما</span><div class="code-block no-prompt">Ctrl + G</div></div>
<p>این صفحه تقریباً تمام میانبرهای موجود را نمایش می‌دهد.</p>

<h2>رفتن به شماره خط</h2>
<p>گاهی فایل بسیار بزرگ است و می‌خواهید مستقیماً به یک خط مشخص بروید.</p>
<p>میانبر:</p>
<div class="code-container"><span class="code-label">رفتن به خط</span><div class="code-block no-prompt">Ctrl + _</div></div>
<p>سپس شماره خط را وارد کنید.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">125</div></div>

<h2>نمایش شماره خطوط</h2>
<p>برای اجرای nano همراه با شماره خطوط:</p>
<div class="code-container"><span class="code-label">با شماره خط</span><div class="code-block">nano -l file.txt</div></div>
<p>نمونه:</p>
<div class="code-container"><span class="code-label">نمونه</span><div class="code-block no-prompt">1  Linux\n2  Ubuntu\n3  Debian</div></div>

<h2>باز کردن فایل فقط برای خواندن</h2>
<p>گاهی نمی‌خواهید فایل به‌طور تصادفی تغییر کند.</p>
<div class="code-container"><span class="code-label">فقط خواندنی</span><div class="code-block">nano -v file.txt</div></div>
<p>در این حالت فایل فقط قابل مشاهده است.</p>

<h2>جستجو و جایگزینی (Replace)</h2>
<p>برای جایگزین کردن متن:</p>
<div class="code-container"><span class="code-label">جایگزینی</span><div class="code-block no-prompt">Ctrl + \\</div></div>
<p>ابتدا عبارت قدیمی را وارد کنید:</p>
<div class="code-container"><span class="code-label">قدیمی</span><div class="code-block no-prompt">Linux</div></div>
<p>سپس عبارت جدید:</p>
<div class="code-container"><span class="code-label">جدید</span><div class="code-block no-prompt">Ubuntu</div></div>

<h2>مقایسه <code>nano</code> و <code>vi</code></h2>
<p>هر دو ویرایشگر برای ویرایش فایل‌های متنی استفاده می‌شوند، اما تفاوت‌های مهمی دارند.</p>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">               Text Editor\n                    │\n        ┌───────────┴───────────┐\n        │                       │\n      nano                     vi\n        │                       │\n   ساده و سریع            حرفه‌ای و قدرتمند</div></div>

<h3>مقایسه از نظر یادگیری</h3>
<h4>nano</h4>
<ul>
    <li>بسیار ساده</li>
    <li>مناسب کاربران تازه‌کار</li>
    <li>بدون حالت (Mode)</li>
</ul>
<h4>vi</h4>
<ul>
    <li>نیاز به یادگیری دستورات</li>
    <li>دارای حالت‌های مختلف</li>
    <li>مناسب مدیران سیستم</li>
</ul>

<h3>مقایسه از نظر امکانات</h3>
<table>
<thead><tr><th>ویژگی</th><th>nano</th><th>vi</th></tr></thead>
<tbody>
<tr><td>یادگیری</td><td>آسان</td><td>نسبتاً سخت</td></tr>
<tr><td>حالت‌های مختلف</td><td>❌ ندارد</td><td>✅ دارد</td></tr>
<tr><td>کار با ماوس</td><td>در برخی ترمینال‌ها محدود</td><td>معمولاً خیر</td></tr>
<tr><td>ویرایش سریع</td><td>✅</td><td>✅</td></tr>
<tr><td>امکانات پیشرفته</td><td>کمتر</td><td>بسیار زیاد</td></tr>
<tr><td>روی اکثر سیستم‌ها نصب است</td><td>گاهی خیر</td><td>تقریباً همیشه</td></tr>
</tbody>
</table>

<h3>مقایسه از نظر آزمون LPIC-1</h3>
<p>در آزمون LPIC-1 معمولاً تأکید بیشتری روی <strong><code>vi</code></strong> وجود دارد، زیرا تقریباً روی تمام سیستم‌های لینوکسی موجود است و مدیران سیستم باید بتوانند با آن کار کنند.</p>
<p>با این حال، آشنایی با <code>nano</code> نیز مهم است؛ زیرا در بسیاری از توزیع‌ها به‌عنوان ویرایشگر پیش‌فرض یا انتخاب محبوب کاربران تازه‌کار استفاده می‌شود.</p>

<div class="summary-box">
<h3>جدول خلاصه دستورات مهم nano</h3>
<table>
<thead><tr><th>دستور</th><th>عملکرد</th></tr></thead>
<tbody>
<tr><td><code>nano file</code></td><td>باز کردن فایل</td></tr>
<tr><td><code>Ctrl + O</code></td><td>ذخیره فایل</td></tr>
<tr><td><code>Ctrl + X</code></td><td>خروج</td></tr>
<tr><td><code>Ctrl + W</code></td><td>جستجو</td></tr>
<tr><td><code>Ctrl + K</code></td><td>بریدن خط</td></tr>
<tr><td><code>Ctrl + U</code></td><td>چسباندن</td></tr>
<tr><td><code>Ctrl + G</code></td><td>راهنما</td></tr>
<tr><td><code>Ctrl + _</code></td><td>رفتن به شماره خط</td></tr>
<tr><td><code>Ctrl + \\</code></td><td>جستجو و جایگزینی</td></tr>
<tr><td><code>nano -v</code></td><td>فقط خواندنی</td></tr>
<tr><td><code>nano -l</code></td><td>نمایش شماره خطوط</td></tr>
</tbody>
</table>
</div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکات مهم LPIC-1</strong>
<ul>
    <li>⭐ <code>nano</code> <strong>حالت‌های مختلف (Mode)</strong> ندارد و از همان ابتدا آماده تایپ است.</li>
    <li>⭐ برای ذخیره فایل از <strong><code>Ctrl + O</code></strong> استفاده می‌شود.</li>
    <li>⭐ برای خروج از برنامه از <strong><code>Ctrl + X</code></strong> استفاده می‌شود.</li>
    <li>⭐ <code>Ctrl + K</code> خط جاری را <strong>Cut</strong> می‌کند.</li>
    <li>⭐ <code>Ctrl + U</code> متن بریده‌شده را <strong>Paste</strong> می‌کند.</li>
    <li>⭐ <code>Ctrl + W</code> برای جستجو و <code>Ctrl + \\</code> برای جستجو و جایگزینی استفاده می‌شود.</li>
    <li>⭐ در آزمون LPIC-1، معمولاً تسلط بر <code>vi</code> اهمیت بیشتری دارد، اما آشنایی با <code>nano</code> نیز لازم است.</li>
</ul>
</div></div>

<h2>🧪 تمرین</h2>
<h3>تمرین ۱</h3>
<p>یک فایل جدید ایجاد کنید:</p>
<div class="code-container"><span class="code-label">ایجاد</span><div class="code-block">nano notes.txt</div></div>

<h3>تمرین ۲</h3>
<p>چند خط متن در فایل بنویسید.</p>

<h3>تمرین ۳</h3>
<p>فایل را با <code>Ctrl + O</code> ذخیره کنید و سپس <code>Enter</code> را فشار دهید.</p>

<h3>تمرین ۴</h3>
<p>یکی از خطوط را با <code>Ctrl + K</code> ببرید و سپس با <code>Ctrl + U</code> در محل دیگری قرار دهید.</p>

<h3>تمرین ۵</h3>
<p>عبارت <code>Linux</code> را با <code>Ubuntu</code> جایگزین کنید. <code>Ctrl + \\</code></p>

<h3>تمرین ۶</h3>
<p>از برنامه خارج شوید. <code>Ctrl + X</code></p>

<h2>خودآزمایی</h2>
<div class="quiz-card"><p>❓ تست ۱: بعد از اجرای دستور <code>nano file.txt</code>، در چه حالتی قرار دارید؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) Command Mode</button>
    <button onclick="selectOption(this)">ب) Insert Mode</button>
    <button onclick="selectOption(this)">ج) Ex Mode</button>
    <button onclick="selectOption(this)">د) آماده تایپ مستقیم</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: د</strong><br><code>nano</code> مانند <code>vi</code> حالت‌های مختلف ندارد و بلافاصله پس از باز شدن می‌توانید شروع به تایپ کنید. بنابراین گزینه‌های A، B و C که مربوط به حالت‌های <code>vi</code> هستند، نادرست‌اند.</div>
</div>

<div class="quiz-card"><p>❓ تست ۲: کدام میانبر برای ذخیره فایل در <code>nano</code> استفاده می‌شود؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>Ctrl + X</code></button>
    <button onclick="selectOption(this)">ب) <code>Ctrl + O</code></button>
    <button onclick="selectOption(this)">ج) <code>Ctrl + K</code></button>
    <button onclick="selectOption(this)">د) <code>Ctrl + W</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>Ctrl + O</code> فایل را ذخیره می‌کند. <code>Ctrl + X</code> برای خروج، <code>Ctrl + K</code> برای بریدن خط و <code>Ctrl + W</code> برای جستجو استفاده می‌شوند.</div>
</div>

<div class="quiz-card"><p>❓ تست ۳: برای جستجو در فایل از کدام میانبر استفاده می‌شود؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>Ctrl + G</code></button>
    <button onclick="selectOption(this)">ب) <code>Ctrl + U</code></button>
    <button onclick="selectOption(this)">ج) <code>Ctrl + W</code></button>
    <button onclick="selectOption(this)">د) <code>Ctrl + O</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br><code>Ctrl + W</code> پنجره جستجو را باز می‌کند. <code>Ctrl + G</code> راهنما، <code>Ctrl + U</code> چسباندن و <code>Ctrl + O</code> ذخیره فایل است.</div>
</div>

<div class="quiz-card"><p>❓ تست ۴: کدام ویژگی، <code>nano</code> را از <code>vi</code> متمایز می‌کند؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) فقط روی لینوکس اجرا می‌شود.</button>
    <button onclick="selectOption(this)">ب) دارای Command Mode است.</button>
    <button onclick="selectOption(this)">ج) از همان ابتدا امکان تایپ مستقیم را فراهم می‌کند.</button>
    <button onclick="selectOption(this)">د) امکان ذخیره فایل ندارد.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br>مهم‌ترین تفاوت <code>nano</code> با <code>vi</code> این است که نیازی به ورود به Insert Mode ندارد و مستقیماً آماده ویرایش است. سایر گزینه‌ها نادرست هستند.</div>
</div>

<div class="quiz-card"><p>❓ تست ۵: برای بریدن خط جاری و سپس چسباندن آن، کدام ترکیب صحیح است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>Ctrl + W</code> سپس <code>Ctrl + G</code></button>
    <button onclick="selectOption(this)">ب) <code>Ctrl + K</code> سپس <code>Ctrl + U</code></button>
    <button onclick="selectOption(this)">ج) <code>Ctrl + O</code> سپس <code>Ctrl + X</code></button>
    <button onclick="selectOption(this)">د) <code>Ctrl + X</code> سپس <code>Ctrl + O</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>Ctrl + K</code> خط جاری را Cut می‌کند و <code>Ctrl + U</code> همان متن را Paste می‌کند. گزینه‌های دیگر مربوط به جستجو، راهنما، ذخیره یا خروج هستند.</div>
</div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>جمع‌بندی جلسه ۷</strong><br>
<code>nano</code> یک ویرایشگر ساده و کاربرپسند است که برای ویرایش سریع فایل‌های متنی بسیار مناسب است. مهم‌ترین نکات:
<ul>
    <li><code>nano</code> برخلاف <code>vi</code> حالت‌های مختلف ندارد.</li>
    <li>ذخیره فایل: <code>Ctrl + O</code></li>
    <li>خروج: <code>Ctrl + X</code></li>
    <li>جستجو: <code>Ctrl + W</code></li>
    <li>بریدن خط: <code>Ctrl + K</code></li>
    <li>چسباندن: <code>Ctrl + U</code></li>
    <li>جستجو و جایگزینی: <code>Ctrl + \\</code></li>
    <li>در آزمون LPIC-1، <code>vi</code> اهمیت بیشتری دارد اما آشنایی با <code>nano</code> نیز مفید است.</li>
</ul>
</div></div>

"ch1-8": `
<div class="section-header">
    <div class="section-badge">۱</div>
    <div>
        <h1>پردازش فایل و خلاصه‌سازی فایل (File Process + File Sum)</h1>
        <div class="meta">کار با خط فرمان · بخش ۸ از ۱۴</div>
    </div>
</div>

<p>در جلسات قبل با ویرایشگرهای متنی <code>vi</code> و <code>nano</code> آشنا شدیم و یاد گرفتیم چطور محتوای فایل را <strong>بنویسیم</strong> و <strong>ویرایش</strong> کنیم.</p>

<p>در این جلسه وارد دنیای <strong>پردازش فایل</strong> می‌شویم: چطور چند فایل را با هم <strong>ادغام</strong> کنیم، چطور یک فایل بزرگ را به چند تکه <strong>تقسیم</strong> کنیم، چطور محتوای یک فایل را <strong>مرتب</strong>، <strong>شمارش</strong>، یا از آن <strong>بخشی را استخراج</strong> کنیم و در نهایت چطور <strong>صحت (integrity)</strong> یک فایل را بررسی کنیم تا مطمئن شویم در حین انتقال یا کپی خراب نشده است.</p>

<p>این جلسه یکی از پرکاربردترین جلسات دوره LPIC-1 است، چون تقریباً هر مدیر سیستمی هر روز از این دستورات استفاده می‌کند.</p>

<h2>ادغام کردن فایل‌ها — <code>cat</code> و <code>paste</code></h2>

<h3><code>cat</code> چیست؟</h3>
<p><code>cat</code> مخفف <strong>concatenate</strong> (به‌هم پیوستن) است. ساده‌ترین کاربرد آن نمایش محتوای یک فایل است، اما کاربرد اصلی‌اش <strong>ادغام چند فایل</strong> در یکدیگر است.</p>

<p>نمایش یک فایل:</p>
<div class="code-container"><span class="code-label">نمایش</span><div class="code-block">cat file1.txt</div></div>

<p>ادغام دو فایل و نمایش خروجی در ترمینال:</p>
<div class="code-container"><span class="code-label">ادغام</span><div class="code-block">cat file1.txt file2.txt</div></div>

<p>ادغام و ذخیره در یک فایل جدید:</p>
<div class="code-container"><span class="code-label">ذخیره</span><div class="code-block">cat file1.txt file2.txt > merged.txt</div></div>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">file1.txt   file2.txt\n    │            │\n    └─────┬──────┘\n          ▼\n        cat\n          │\n          ▼\n     merged.txt</div></div>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>نکته مهم</strong>علامت <code>></code> فایل مقصد را <strong>بازنویسی</strong> می‌کند. اگر بخواهید محتوا را به انتهای فایل موجود <strong>اضافه</strong> کنید، از <code>>></code> استفاده کنید:</div></div>
<div class="code-container"><span class="code-label">اضافه</span><div class="code-block">cat file3.txt >> merged.txt</div></div>

<h4>چند کاربرد دیگر <code>cat</code></h4>
<p>نمایش شماره خط:</p>
<div class="code-container"><span class="code-label">شماره خط</span><div class="code-block">cat -n file.txt</div></div>

<p>نمایش خطوط خالی به‌صورت فشرده (چند خط خالی پشت‌سرهم را یکی می‌کند):</p>
<div class="code-container"><span class="code-label">فشرده</span><div class="code-block">cat -s file.txt</div></div>

<h3><code>paste</code> چیست؟</h3>
<p>برخلاف <code>cat</code> که فایل‌ها را <strong>زیر هم (عمودی)</strong> می‌چسباند، <code>paste</code> محتوای فایل‌ها را <strong>کنار هم (افقی)</strong> و ستونی به هم می‌چسباند.</p>

<p>مثال: فرض کنید:</p>
<div class="code-container"><span class="code-label">فایل‌ها</span><div class="code-block no-prompt">names.txt          ages.txt\n------             ------\nAli                25\nSara               30\nReza               28</div></div>

<p>اجرای:</p>
<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">paste names.txt ages.txt</div></div>

<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Ali     25\nSara    30\nReza    28</div></div>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">names.txt   ages.txt\n   │            │\n   └─────┬──────┘\n         ▼\n      paste\n         │\n         ▼\n   Ali    25\n   Sara   30\n   Reza   28</div></div>

<p>می‌توانید جداکننده دلخواه هم مشخص کنید (به‌جای Tab پیش‌فرض):</p>
<div class="code-container"><span class="code-label">جداکننده</span><div class="code-block">paste -d',' names.txt ages.txt</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Ali,25\nSara,30\nReza,28</div></div>

<h2>تبدیل فایل — دستور <code>od</code></h2>
<h3><code>od</code> چیست؟</h3>
<p><code>od</code> مخفف <strong>Octal Dump</strong> است. این دستور محتوای یک فایل را به‌صورت <strong>باینری، اکتال، هگزادسیمال یا ASCII</strong> نمایش می‌دهد. این دستور بیشتر برای بررسی فایل‌های باینری یا کاراکترهای غیرقابل‌مشاهده (مثل کاراکترهای کنترلی) استفاده می‌شود.</p>

<p>نمایش پیش‌فرض (اکتال):</p>
<div class="code-container"><span class="code-label">اکتال</span><div class="code-block">od file.txt</div></div>

<p>نمایش هگزادسیمال:</p>
<div class="code-container"><span class="code-label">هگز</span><div class="code-block">od -x file.txt</div></div>

<p>نمایش همراه با کاراکترهای ASCII:</p>
<div class="code-container"><span class="code-label">ASCII</span><div class="code-block">od -c file.txt</div></div>

<p>مثال: اگر <code>file.txt</code> شامل متن <code>AB</code> باشد:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">od -c file.txt</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">0000000   A   B  \\n\n0000003</div></div>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">فایل باینری/متنی\n       │\n       ▼\n      od\n       │\n       ▼\nنمایش Octal / Hex / ASCII</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>کاربرد رایج</strong>پیدا کردن کاراکترهای پنهان مثل <code>\\r</code> (Carriage Return) در فایل‌هایی که از ویندوز به لینوکس منتقل شده‌اند.</div></div>

<h2>جدا کردن فایل — دستور <code>split</code></h2>
<h3><code>split</code> چیست؟</h3>
<p>وقتی یک فایل بسیار بزرگ دارید (مثلاً یک فایل لاگ چند گیگابایتی) و می‌خواهید آن را به چند فایل کوچک‌تر تقسیم کنید، از <code>split</code> استفاده می‌کنید.</p>

<p>تقسیم بر اساس تعداد خط (مثلاً هر فایل ۱۰۰ خط):</p>
<div class="code-container"><span class="code-label">تقسیم بر خط</span><div class="code-block">split -l 100 bigfile.txt part_</div></div>

<p>تقسیم بر اساس حجم (مثلاً هر فایل ۱ مگابایت):</p>
<div class="code-container"><span class="code-label">تقسیم بر حجم</span><div class="code-block">split -b 1M bigfile.txt part_</div></div>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">bigfile.txt (بزرگ)\n        │\n        ▼\n      split\n        │\n   ┌────┼────┐\n   ▼    ▼    ▼\npart_aa part_ab part_ac</div></div>

<p>خروجی به‌طور پیش‌فرض به اسم‌هایی مثل <code>part_aa</code>، <code>part_ab</code> و ... تولید می‌شود.</p>

<h4>برگرداندن فایل‌های تقسیم‌شده به حالت اول</h4>
<p>چون تقسیم با <code>split</code> در واقع نوعی «بریدن» فایل است، برای بازسازی فایل اصلی کافی است دوباره آن‌ها را با <code>cat</code> به هم بچسبانید:</p>
<div class="code-container"><span class="code-label">بازسازی</span><div class="code-block">cat part_aa part_ab part_ac > bigfile_restored.txt</div></div>

<h2>تغییر قالب و مرتب‌سازی فایل — <code>sort</code> / <code>join</code> / <code>uniq</code></h2>

<h3><code>sort</code> — مرتب‌سازی</h3>
<p>خطوط یک فایل را به‌ترتیب الفبایی مرتب می‌کند:</p>
<div class="code-container"><span class="code-label">مرتب‌سازی</span><div class="code-block">sort names.txt</div></div>

<p>مرتب‌سازی معکوس:</p>
<div class="code-container"><span class="code-label">معکوس</span><div class="code-block">sort -r names.txt</div></div>

<p>مرتب‌سازی عددی (نه الفبایی):</p>
<div class="code-container"><span class="code-label">عددی</span><div class="code-block">sort -n numbers.txt</div></div>

<p>مرتب‌سازی بر اساس یک ستون خاص (مثلاً ستون دوم):</p>
<div class="code-container"><span class="code-label">ستون</span><div class="code-block">sort -k2 file.txt</div></div>

<h3><code>join</code> — ترکیب دو فایل بر اساس یک فیلد مشترک</h3>
<p><code>join</code> دو فایل را بر اساس یک <strong>ستون مشترک</strong> (معمولاً ستون اول) با هم ترکیب می‌کند؛ شبیه به <code>JOIN</code> در پایگاه‌داده.</p>

<p>مثال:</p>
<div class="code-container"><span class="code-label">فایل‌ها</span><div class="code-block no-prompt">file1.txt          file2.txt\n----------          ----------\n1 Ali               1 Tehran\n2 Sara               2 Shiraz\n3 Reza               3 Mashhad</div></div>

<p>اجرا:</p>
<div class="code-container"><span class="code-label">اجرا</span><div class="code-block">join file1.txt file2.txt</div></div>

<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">1 Ali Tehran\n2 Sara Shiraz\n3 Reza Mashhad</div></div>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">file1.txt   file2.txt\n    │            │\n    └─────┬──────┘\n          ▼\n        join\n          │\n          ▼\n  خروجی ترکیب‌شده بر اساس فیلد مشترک</div></div>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>نکته مهم</strong>هر دو فایل باید از قبل بر اساس فیلد مشترک <strong>مرتب (sort)</strong> شده باشند، در غیر این صورت <code>join</code> نتیجه درستی نمی‌دهد.</div></div>

<h3><code>uniq</code> — حذف خطوط تکراری</h3>
<p><code>uniq</code> خطوط <strong>تکراری و پشت‌سرهم</strong> را حذف می‌کند. به همین دلیل معمولاً همراه با <code>sort</code> استفاده می‌شود.</p>

<p>مثال:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block no-prompt">data.txt\n--------\napple\napple\nbanana\napple</div></div>

<p>اجرای مستقیم <code>uniq</code>:</p>
<div class="code-container"><span class="code-label">بدون sort</span><div class="code-block">uniq data.txt</div></div>
<p>خروجی (چون خط سوم <code>apple</code> پشت‌سرهم نیست، حذف نمی‌شود):</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">apple\nbanana\napple</div></div>

<p>اجرای صحیح همراه با <code>sort</code>:</p>
<div class="code-container"><span class="code-label">با sort</span><div class="code-block">sort data.txt | uniq</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">apple\nbanana</div></div>

<p>شمارش تعداد تکرار هر خط:</p>
<div class="code-container"><span class="code-label">شمارش</span><div class="code-block">sort data.txt | uniq -c</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">      2 apple\n      1 banana</div></div>

<p>نمایش فقط خطوطی که <strong>تکراری هستند</strong>:</p>
<div class="code-container"><span class="code-label">تکراری</span><div class="code-block">sort data.txt | uniq -d</div></div>

<p>نمایش فقط خطوطی که <strong>فقط یک‌بار</strong> آمده‌اند:</p>
<div class="code-container"><span class="code-label">یک‌بار</span><div class="code-block">sort data.txt | uniq -u</div></div>

<h2>مشاهده محتوای فایل — <code>less</code> / <code>more</code> / <code>head</code> / <code>tail</code></h2>

<h3><code>more</code></h3>
<p>نمایش فایل صفحه‌به‌صفحه (فقط رو به جلو):</p>
<div class="code-container"><span class="code-label">more</span><div class="code-block">more file.txt</div></div>

<h3><code>less</code></h3>
<p>نسخه پیشرفته‌تر <code>more</code> است و امکان حرکت <strong>به جلو و عقب</strong> و همچنین جستجو در فایل را دارد. به همین دلیل در عمل بیشتر از <code>more</code> استفاده می‌شود.</p>
<div class="code-container"><span class="code-label">less</span><div class="code-block">less file.txt</div></div>

<p>میانبرهای مهم در <code>less</code>:</p>
<table>
<thead><tr><th>کلید</th><th>عملکرد</th></tr></thead>
<tbody>
<tr><td><code>Space</code></td><td>رفتن به صفحه بعد</td></tr>
<tr><td><code>b</code></td><td>رفتن به صفحه قبل</td></tr>
<tr><td><code>/text</code></td><td>جستجوی عبارت <code>text</code></td></tr>
<tr><td><code>q</code></td><td>خروج</td></tr>
</tbody>
</table>

<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">more   →   فقط جلو می‌رود\nless   →   جلو و عقب + جستجو</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته کنکوری</strong>جمله معروف در دنیای لینوکس این است: <strong>"less is more than more"</strong> یعنی <code>less</code> امکانات بیشتری از <code>more</code> دارد!</div></div>

<h3><code>head</code></h3>
<p>نمایش چند <strong>خط ابتدایی</strong> فایل (پیش‌فرض: ۱۰ خط):</p>
<div class="code-container"><span class="code-label">head</span><div class="code-block">head file.txt</div></div>
<p>نمایش ۵ خط اول:</p>
<div class="code-container"><span class="code-label">۵ خط</span><div class="code-block">head -n 5 file.txt</div></div>

<h3><code>tail</code></h3>
<p>نمایش چند <strong>خط انتهایی</strong> فایل (پیش‌فرض: ۱۰ خط):</p>
<div class="code-container"><span class="code-label">tail</span><div class="code-block">tail file.txt</div></div>
<p>نمایش ۵ خط آخر:</p>
<div class="code-container"><span class="code-label">۵ خط</span><div class="code-block">tail -n 5 file.txt</div></div>
<p>نمایش زنده و پیوسته انتهای فایل (بسیار پرکاربرد برای مانیتور کردن فایل‌های لاگ):</p>
<div class="code-container"><span class="code-label">دنبال کردن</span><div class="code-block">tail -f /var/log/messages</div></div>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">فایل بزرگ\n   │\n   ├── head → چند خط اول\n   └── tail → چند خط آخر\n             └── tail -f → دنبال کردن زنده تغییرات</div></div>

<h2>شمارش محتوا — دستور <code>wc</code></h2>
<p><code>wc</code> مخفف <strong>Word Count</strong> است و برای شمارش تعداد خطوط، کلمات و کاراکترهای یک فایل استفاده می‌شود.</p>

<p>نمایش هر سه مورد با هم:</p>
<div class="code-container"><span class="code-label">همه</span><div class="code-block">wc file.txt</div></div>
<p>خروجی به ترتیب: تعداد خط، تعداد کلمه، تعداد بایت.</p>

<p>فقط تعداد خطوط:</p>
<div class="code-container"><span class="code-label">خطوط</span><div class="code-block">wc -l file.txt</div></div>

<p>فقط تعداد کلمات:</p>
<div class="code-container"><span class="code-label">کلمات</span><div class="code-block">wc -w file.txt</div></div>

<p>فقط تعداد کاراکترها:</p>
<div class="code-container"><span class="code-label">کاراکترها</span><div class="code-block">wc -c file.txt</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>کاربرد بسیار رایج</strong>شمارش تعداد خطوط خروجی یک دستور دیگر با استفاده از pipe:</div></div>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls -l | wc -l</div></div>

<h2>استخراج بخشی از محتوا — دستور <code>cut</code></h2>
<p><code>cut</code> برای استخراج بخشی خاص از هر خط استفاده می‌شود؛ مثلاً یک ستون خاص از یک فایل جدولی.</p>

<h4>استخراج بر اساس کاراکتر</h4>
<p>نمایش کاراکترهای ۱ تا ۳ هر خط:</p>
<div class="code-container"><span class="code-label">کاراکتر</span><div class="code-block">cut -c1-3 file.txt</div></div>

<h4>استخراج بر اساس فیلد (ستون)</h4>
<p>فرض کنید فایل زیر را داریم که با <code>:</code> جدا شده:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block no-prompt">Ali:25:Tehran\nSara:30:Shiraz</div></div>

<p>استخراج فیلد اول (نام):</p>
<div class="code-container"><span class="code-label">فیلد اول</span><div class="code-block">cut -d':' -f1 file.txt</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Ali\nSara</div></div>

<p>استخراج فیلد اول و سوم:</p>
<div class="code-container"><span class="code-label">فیلد اول و سوم</span><div class="code-block">cut -d':' -f1,3 file.txt</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Ali:Tehran\nSara:Shiraz</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>کاربرد رایج</strong>استخراج نام کاربران از فایل <code>/etc/passwd</code> که با <code>:</code> جدا شده است:</div></div>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cut -d':' -f1 /etc/passwd</div></div>

<div class="code-container"><span class="code-label">نمایش</span><div class="code-block no-prompt">Ali:25:Tehran\n  │   │    │\n  f1  f2   f3</div></div>

<h2>بررسی صحت فایل — Hashing با <code>md5sum</code></h2>
<h3>چرا صحت‌سنجی فایل مهم است؟</h3>
<p>وقتی فایلی را دانلود می‌کنید یا از یک سرور به سرور دیگر کپی می‌کنید، ممکن است در حین انتقال <strong>خراب یا دستکاری</strong> شود. برای اطمینان از سالم بودن فایل، از <strong>الگوریتم‌های هش (Hash)</strong> استفاده می‌شود.</p>
<p>هش، یک رشته‌ی منحصربه‌فرد و ثابت‌طول است که از محتوای فایل تولید می‌شود. حتی یک تغییر کوچک در فایل، کل هش را به‌طور کامل عوض می‌کند.</p>

<h3><code>md5sum</code></h3>
<div class="code-container"><span class="code-label">هش</span><div class="code-block">md5sum file.txt</div></div>
<p>خروجی نمونه:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">d41d8cd98f00b204e9800998ecf8427e  file.txt</div></div>

<h4>بررسی صحت فایل بعد از انتقال</h4>
<p>مرحله ۱ — روی سیستم مبدأ:</p>
<div class="code-container"><span class="code-label">مرحله ۱</span><div class="code-block">md5sum file.txt > file.md5</div></div>
<p>مرحله ۲ — فایل <code>file.txt</code> و <code>file.md5</code> را به سیستم مقصد منتقل کنید.</p>
<p>مرحله ۳ — روی سیستم مقصد:</p>
<div class="code-container"><span class="code-label">مرحله ۳</span><div class="code-block">md5sum -c file.md5</div></div>
<p>اگر فایل سالم باشد:</p>
<div class="code-container"><span class="code-label">سالم</span><div class="code-block no-prompt">file.txt: OK</div></div>
<p>اگر فایل تغییر کرده باشد:</p>
<div class="code-container"><span class="code-label">خراب</span><div class="code-block no-prompt">file.txt: FAILED</div></div>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">مبدأ                          مقصد\nfile.txt                     file.txt\n   │                             │\n md5sum                       md5sum\n   │                             │\n   ▼                             ▼\nhash1  ─────── مقایسه ───────  hash2\n\nhash1 == hash2  →  فایل سالم است\nhash1 != hash2  →  فایل خراب/دستکاری شده است</div></div>

<h4>سایر الگوریتم‌های هش</h4>
<p>علاوه بر <code>md5sum</code>، الگوریتم‌های امن‌تری هم وجود دارند که در آزمون LPIC-1 و در دنیای واقعی بیشتر توصیه می‌شوند:</p>
<div class="code-container"><span class="code-label">الگوریتم‌ها</span><div class="code-block">sha1sum file.txt\nsha256sum file.txt\nsha512sum file.txt</div></div>
<p>هرچه الگوریتم قوی‌تر باشد (مثل SHA-256)، احتمال برخورد (Collision) و جعل هش کمتر است.</p>

<div class="summary-box">
<h3>جدول خلاصه دستورات مهم جلسه ۸</h3>
<table>
<thead><tr><th>دستور</th><th>عملکرد</th></tr></thead>
<tbody>
<tr><td><code>cat</code></td><td>نمایش/ادغام عمودی فایل‌ها</td></tr>
<tr><td><code>paste</code></td><td>ادغام افقی (ستونی) فایل‌ها</td></tr>
<tr><td><code>od</code></td><td>نمایش محتوای فایل به‌صورت Octal/Hex/ASCII</td></tr>
<tr><td><code>split</code></td><td>تقسیم یک فایل به چند فایل کوچک‌تر</td></tr>
<tr><td><code>sort</code></td><td>مرتب‌سازی خطوط فایل</td></tr>
<tr><td><code>join</code></td><td>ترکیب دو فایل بر اساس فیلد مشترک</td></tr>
<tr><td><code>uniq</code></td><td>حذف خطوط تکراری پشت‌سرهم</td></tr>
<tr><td><code>less</code></td><td>نمایش فایل با قابلیت جلو و عقب رفتن</td></tr>
<tr><td><code>more</code></td><td>نمایش فایل فقط رو به جلو</td></tr>
<tr><td><code>head</code></td><td>نمایش خطوط ابتدایی فایل</td></tr>
<tr><td><code>tail</code></td><td>نمایش خطوط انتهایی فایل (و <code>-f</code> برای دنبال کردن زنده)</td></tr>
<tr><td><code>wc</code></td><td>شمارش خط، کلمه و کاراکتر</td></tr>
<tr><td><code>cut</code></td><td>استخراج بخشی از هر خط (ستون/کاراکتر)</td></tr>
<tr><td><code>md5sum</code> / <code>sha256sum</code></td><td>تولید و بررسی هش برای صحت‌سنجی فایل</td></tr>
</tbody>
</table>
</div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکات مهم LPIC-1</strong>
<ul>
    <li>⭐ <code>cat</code> فایل‌ها را <strong>زیر هم</strong>، و <code>paste</code> فایل‌ها را <strong>کنار هم</strong> ادغام می‌کند.</li>
    <li>⭐ <code>od</code> برای نمایش محتوای فایل به شکل <strong>Octal / Hex / ASCII</strong> استفاده می‌شود، مخصوصاً برای بررسی کاراکترهای غیرقابل‌مشاهده.</li>
    <li>⭐ <code>split</code> فایل بزرگ را تقسیم می‌کند؛ برای بازگرداندن آن به فایل اصلی از <code>cat</code> استفاده می‌شود.</li>
    <li>⭐ <code>join</code> نیاز به <strong>مرتب بودن قبلی</strong> دو فایل بر اساس فیلد مشترک دارد.</li>
    <li>⭐ <code>uniq</code> فقط خطوط <strong>تکراری پشت‌سرهم</strong> را حذف می‌کند؛ به همین دلیل معمولاً بعد از <code>sort</code> استفاده می‌شود.</li>
    <li>⭐ <code>less</code> امکانات بیشتری نسبت به <code>more</code> دارد (جلو، عقب، جستجو).</li>
    <li>⭐ <code>tail -f</code> برای مانیتور کردن زنده فایل‌های لاگ استفاده می‌شود.</li>
    <li>⭐ <code>wc -l</code> تعداد خطوط را می‌شمارد و بسیار پرکاربرد است.</li>
    <li>⭐ <code>cut -d -f</code> برای استخراج فیلد بر اساس جداکننده و <code>cut -c</code> برای استخراج بر اساس کاراکتر استفاده می‌شود.</li>
    <li>⭐ <code>md5sum</code> و <code>sha256sum</code> برای بررسی صحت (Integrity) فایل استفاده می‌شوند؛ اگر یک بایت از فایل تغییر کند، هش کاملاً متفاوت می‌شود.</li>
</ul>
</div></div>

<h2>🧪 تمرین</h2>
<h3>تمرین ۱</h3>
<p>دو فایل <code>a.txt</code> و <code>b.txt</code> بسازید و آن‌ها را با <code>cat</code> در فایل <code>c.txt</code> ادغام کنید.</p>

<h3>تمرین ۲</h3>
<p>همان دو فایل را این‌بار با <code>paste</code> کنار هم بچسبانید.</p>

<h3>تمرین ۳</h3>
<p>یک فایل ۳۰۰ خطی بسازید و آن را با <code>split -l 100</code> به سه بخش تقسیم کنید، سپس دوباره با <code>cat</code> آن را بازسازی کنید.</p>

<h3>تمرین ۴</h3>
<p>یک فایل با چند خط تکراری بسازید و با ترکیب <code>sort</code> و <code>uniq -c</code> تعداد تکرار هر خط را نمایش دهید.</p>

<h3>تمرین ۵</h3>
<p>از فایل <code>/etc/passwd</code> فقط نام کاربران (فیلد اول) را با <code>cut</code> استخراج کنید.</p>

<h3>تمرین ۶</h3>
<p>هش <code>md5sum</code> یک فایل را بگیرید، سپس یک کاراکتر از فایل را تغییر دهید و دوباره هش بگیرید تا تفاوت کامل هش را ببینید.</p>

<h2>خودآزمایی</h2>
<div class="quiz-card"><p>❓ تست ۱: کدام دستور برای ادغام <strong>افقی (ستونی)</strong> دو فایل استفاده می‌شود؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>cat</code></button>
    <button onclick="selectOption(this)">ب) <code>paste</code></button>
    <button onclick="selectOption(this)">ج) <code>split</code></button>
    <button onclick="selectOption(this)">د) <code>join</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>paste</code> محتوای فایل‌ها را کنار هم (ستون به ستون) قرار می‌دهد. <code>cat</code> فایل‌ها را زیر هم می‌چسباند، <code>split</code> فایل را تقسیم می‌کند و <code>join</code> بر اساس فیلد مشترک ترکیب می‌کند، نه صرفاً کنار هم گذاشتن.</div>
</div>

<div class="quiz-card"><p>❓ تست ۲: پیش‌نیاز اصلی برای استفاده صحیح از دستور <code>join</code> چیست؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) فایل‌ها باید هش یکسان داشته باشند.</button>
    <button onclick="selectOption(this)">ب) فایل‌ها باید از قبل بر اساس فیلد مشترک مرتب شده باشند.</button>
    <button onclick="selectOption(this)">ج) فایل‌ها باید حتماً باینری باشند.</button>
    <button onclick="selectOption(this)">د) فایل‌ها باید با <code>split</code> تقسیم شده باشند.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>join</code> دو فایل را بر اساس یک فیلد مشترک ترکیب می‌کند و برای کار درست، هر دو فایل باید از قبل بر اساس آن فیلد <code>sort</code> شده باشند؛ در غیر این صورت نتیجه نادرست خواهد بود.</div>
</div>

<div class="quiz-card"><p>❓ تست ۳: برای اینکه دستور <code>uniq</code> خطوط تکراری غیر پشت‌سرهم را هم به‌درستی حذف کند، باید قبل از آن از کدام دستور استفاده کرد؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>cut</code></button>
    <button onclick="selectOption(this)">ب) <code>wc</code></button>
    <button onclick="selectOption(this)">ج) <code>sort</code></button>
    <button onclick="selectOption(this)">د) <code>od</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br><code>uniq</code> فقط خطوط تکراری <strong>پشت‌سرهم</strong> را حذف می‌کند. برای حذف کامل تکراری‌ها (حتی اگر کنار هم نباشند)، باید ابتدا فایل را با <code>sort</code> مرتب کرد تا خطوط مشابه کنار هم قرار بگیرند.</div>
</div>

<div class="quiz-card"><p>❓ تست ۴: کدام گزینه درباره تفاوت <code>less</code> و <code>more</code> <strong>درست</strong> است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>more</code> امکان جستجو و حرکت به عقب را دارد ولی <code>less</code> ندارد.</button>
    <button onclick="selectOption(this)">ب) <code>less</code> فقط برای فایل‌های باینری استفاده می‌شود.</button>
    <button onclick="selectOption(this)">ج) <code>less</code> امکان حرکت به جلو، عقب و جستجو را دارد، اما <code>more</code> فقط رو به جلو حرکت می‌کند.</button>
    <button onclick="selectOption(this)">د) هیچ تفاوتی بین این دو وجود ندارد.</button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br><code>less</code> نسخه پیشرفته‌تر <code>more</code> است و علاوه بر حرکت رو به جلو، امکان بازگشت به عقب و جستجوی متن را نیز فراهم می‌کند؛ به همین دلیل در عمل ترجیح داده می‌شود.</div>
</div>

<div class="quiz-card"><p>❓ تست ۵: اگر بخواهید نام کاربران را از فایل <code>/etc/passwd</code> (که فیلدها با <code>:</code> از هم جدا شده‌اند) استخراج کنید، کدام دستور صحیح است؟</p>
<div class="quiz-options">
    <button onclick="selectOption(this)">الف) <code>wc -l /etc/passwd</code></button>
    <button onclick="selectOption(this)">ب) <code>cut -d':' -f1 /etc/passwd</code></button>
    <button onclick="selectOption(this)">ج) <code>od -c /etc/passwd</code></button>
    <button onclick="selectOption(this)">د) <code>md5sum /etc/passwd</code></button>
</div>
<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br><code>cut -d':' -f1</code> با مشخص کردن <code>:</code> به‌عنوان جداکننده (delimiter)، فیلد اول (نام کاربری) هر خط را استخراج می‌کند. <code>wc</code> برای شمارش، <code>od</code> برای نمایش خام و <code>md5sum</code> برای هش کردن استفاده می‌شود، نه استخراج فیلد.</div>
</div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>جمع‌بندی جلسه ۸</strong><br>
در این جلسه با ابزارهای قدرتمند پردازش فایل در لینوکس آشنا شدیم:
<ul>
    <li><code>cat</code> و <code>paste</code> برای ادغام عمودی و افقی فایل‌ها</li>
    <li><code>od</code> برای مشاهده محتوای خام فایل</li>
    <li><code>split</code> برای تقسیم فایل‌های بزرگ</li>
    <li><code>sort</code>، <code>join</code> و <code>uniq</code> برای مرتب‌سازی و ترکیب</li>
    <li><code>head</code>، <code>tail</code> و <code>less</code> برای مشاهده بخش‌های مختلف فایل</li>
    <li><code>wc</code> برای شمارش محتوا</li>
    <li><code>cut</code> برای استخراج ستون‌های خاص</li>
    <li><code>md5sum</code> و <code>sha256sum</code> برای صحت‌سنجی فایل‌ها</li>
</ul>
این دستورات پایه‌ای‌ترین ابزارهای هر مدیر سیستم لینوکس هستند و تسلط بر آن‌ها برای آزمون LPIC-1 ضروری است.
</div></div>

"ch1-9": `
<div class="section-header">
    <div class="section-badge">۱</div>
    <div>
        <h1>دستور grep (جستجو در متن)</h1>
        <div class="meta">کار با خط فرمان · بخش ۹ از ۱۴</div>
    </div>
</div>

<p>در جلسات قبل با ویرایش فایل‌ها، Pipe و ابزارهای مختلف لینوکس آشنا شدیم. اما زمانی که فایل‌ها بزرگ می‌شوند (مثلاً فایل‌های Log یا فایل‌های تنظیمات)، پیدا کردن یک عبارت به‌صورت دستی تقریباً غیرممکن است.</p>

<p>در این جلسه با یکی از مهم‌ترین ابزارهای لینوکس یعنی <strong><code>grep</code></strong> آشنا می‌شویم؛ ابزاری که تقریباً هر مدیر سیستم روزانه از آن استفاده می‌کند.</p>

<h2>grep چیست؟</h2>
<p><strong>grep</strong> مخفف عبارت <strong>Global Regular Expression Print</strong> است.</p>
<p>این ابزار خطوطی را که با یک <strong>الگو (Pattern)</strong> مطابقت داشته باشند، از میان فایل‌ها یا ورودی استاندارد (Standard Input) پیدا کرده و نمایش می‌دهد.</p>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>به بیان ساده</strong>grep = جستجوی متن در فایل‌ها یا خروجی دستورات</div></div>

<h3>کاربردهای grep</h3>
<p>مدیران سیستم معمولاً از <code>grep</code> برای کارهای زیر استفاده می‌کنند:</p>
<ul>
    <li>جستجو در فایل‌های Log</li>
    <li>جستجو در فایل‌های تنظیمات (Configuration Files)</li>
    <li>پیدا کردن کاربران</li>
    <li>بررسی خطاهای سیستم</li>
    <li>فیلتر کردن خروجی دستورات</li>
    <li>جستجو در چندین فایل به‌صورت هم‌زمان</li>
</ul>

<p>مثال:</p>
<p>فرض کنید فایل <code>/etc/passwd</code> شامل صدها کاربر باشد. برای پیدا کردن کاربر <code>root</code> کافی است:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep root /etc/passwd</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">root:x:0:0:root:/root:/bin/bash</div></div>

<h2>ساختار کلی دستور grep</h2>
<p>ساختار کلی:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block">grep [options] pattern file(s)</div></div>
<p>اجزای دستور:</p>
<div class="code-container"><span class="code-label">اجزا</span><div class="code-block no-prompt">grep\n │\n ├── Options (اختیاری)\n │\n ├── Pattern (عبارت جستجو)\n │\n └── File(s)</div></div>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep root /etc/passwd</div></div>
<p>یعنی: در فایل <code>/etc/passwd</code> به دنبال عبارت <code>root</code> بگرد.</p>

<h2>Pattern چیست؟</h2>
<p>Pattern همان عبارتی است که می‌خواهیم آن را جستجو کنیم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep Linux file.txt</div></div>
<p>یعنی هر خطی که کلمه Linux را داشته باشد نمایش بده.</p>
<p>اگر فایل:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block no-prompt">Linux\nUbuntu\nCentOS\nLinux Server\nDebian</div></div>
<p>باشد، خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Linux\nLinux Server</div></div>

<h2>جستجوی ساده</h2>
<p>نمونه:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep root /etc/passwd</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">root:x:0:0:root:/root:/bin/bash</div></div>
<p>مثال دیگر:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep bash /etc/passwd</div></div>
<p>تمام کاربرانی که Shell آن‌ها <code>bash</code> باشد نمایش داده می‌شوند.</p>

<h2>گزینه‌های مهم grep</h2>

<h3>جستجوی بدون توجه به بزرگی و کوچکی حروف</h3>
<p>گزینه <code>-i</code></p>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep -i error /var/log/messages</div></div>
<p>عبارات زیر همگی پیدا می‌شوند:</p>
<div class="code-container"><span class="code-label">نمونه</span><div class="code-block no-prompt">ERROR\nError\nerror\nErRoR</div></div>

<h3>نمایش خطوطی که <strong>مطابقت ندارند</strong></h3>
<p>گزینه <code>-v</code></p>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep -v bash /etc/passwd</div></div>
<p>یعنی تمام خطوطی که <code>bash</code> ندارند.</p>
<p>اگر فایل:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block no-prompt">root:/bin/bash\nuser:/bin/sh\ntest:/bin/bash</div></div>
<p>باشد، خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">user:/bin/sh</div></div>

<h3>نمایش شماره خطوط</h3>
<div class="code-container"><span class="code-label">شماره خط</span><div class="code-block">grep -n root file.txt</div></div>
<p>نمونه خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">3:root\n18:root user</div></div>

<h3>شمارش تعداد خطوط پیدا شده</h3>
<div class="code-container"><span class="code-label">شمارش</span><div class="code-block">grep -c root file.txt</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">5</div></div>

<h3>جستجو در چند فایل</h3>
<div class="code-container"><span class="code-label">چند فایل</span><div class="code-block">grep root file1 file2 file3</div></div>

<h3>جستجوی بازگشتی در پوشه‌ها</h3>
<div class="code-container"><span class="code-label">بازگشتی</span><div class="code-block">grep -r root /etc</div></div>
<p>یا</p>
<div class="code-container"><span class="code-label">بازگشتی</span><div class="code-block">grep -R root /etc</div></div>

<h2>Regular Expression (عبارات منظم)</h2>
<p>قدرت واقعی <code>grep</code> زمانی مشخص می‌شود که از <strong>Regular Expression</strong> یا <strong>Regex</strong> استفاده کنیم. Regex به ما اجازه می‌دهد الگوهای پیچیده را جستجو کنیم.</p>

<h3>علامت <code>^</code> (ابتدای خط)</h3>
<p>کاراکتر <code>^</code> به معنی <strong>ابتدای خط</strong> است.</p>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep "^root" /etc/passwd</div></div>
<p>یعنی خط‌هایی را پیدا کن که با <code>root</code> شروع می‌شوند.</p>
<p>نمونه:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block no-prompt">root:x:0:0\nadmin:x:1:1\nmyroot:x:2:2</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">root:x:0:0</div></div>

<h3>علامت <code>$</code> (انتهای خط)</h3>
<p>کاراکتر <code>$</code> به معنی <strong>انتهای خط</strong> است.</p>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep "sh$" /etc/passwd</div></div>
<p>یعنی خط‌هایی که با <code>sh</code> تمام می‌شوند.</p>
<p>نمونه:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block no-prompt">/bin/bash\n/bin/sh\n/bin/zsh</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">/bin/bash\n/bin/sh\n/bin/zsh</div></div>
<p>زیرا هر سه با <code>sh</code> پایان می‌یابند.</p>

<h3>علامت <code>.</code> (هر کاراکتر)</h3>
<p>نقطه <code>.</code> یعنی <strong>هر یک کاراکتر</strong>.</p>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep "r.ot" file.txt</div></div>
<p>پیدا می‌کند:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">root\nriot\nr9ot</div></div>

<h3>علامت <code>*</code></h3>
<p>یعنی <strong>صفر یا چند بار تکرار</strong>.</p>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep "ab*" file.txt</div></div>
<p>مطابقت می‌دهد:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">a\nab\nabb\nabbb</div></div>

<h3>علامت <code>.*</code></h3>
<p>یکی از پرکاربردترین الگوها: <code>.*</code> یعنی <strong>هر تعداد کاراکتر</strong>.</p>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep "^root.*bash$" /etc/passwd</div></div>
<p>یعنی خطی که با <code>root</code> شروع شود و با <code>bash</code> تمام شود.</p>

<h2>خط خالی (Empty Line)</h2>
<p>گاهی لازم است فقط خطوط خالی را پیدا کنیم.</p>
<p>الگو:</p>
<div class="code-container"><span class="code-label">خط خالی</span><div class="code-block">grep "^$" file.txt</div></div>
<p>توضیح:</p>
<div class="code-container"><span class="code-label">توضیح</span><div class="code-block no-prompt">^   ابتدای خط\n$   انتهای خط\nاگر ابتدای خط بلافاصله به انتهای خط برسد،\nیعنی هیچ کاراکتری وجود ندارد.\n=> خط خالی</div></div>
<div class="code-container"><span class="code-label">نمودار</span><div class="code-block no-prompt">^$\n││\n└┴── هیچ کاراکتری بین آن‌ها نیست</div></div>

<h2>چند مثال مهم</h2>
<h3>پیدا کردن کاربر root</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep root /etc/passwd</div></div>

<h3>حذف خطوط دارای bash</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep -v bash /etc/passwd</div></div>

<h3>جستجوی بدون حساسیت به حروف</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep -i error /var/log/messages</div></div>

<h3>پیدا کردن خطوطی که با root شروع می‌شوند</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep "^root" /etc/passwd</div></div>

<h3>پیدا کردن خطوطی که با sh تمام می‌شوند</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep "sh$" /etc/passwd</div></div>

<h3>پیدا کردن خطوط خالی</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep "^$" file.txt</div></div>

<h2>استفاده از grep همراه با Pipe</h2>
<p>یکی از رایج‌ترین کاربردهای <code>grep</code>، استفاده همراه با Pipe است.</p>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ps aux | grep ssh</div></div>
<p>جریان اجرا:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">ps aux\n    │\n    ▼\nلیست پردازه‌ها\n    │\n    ▼\ngrep ssh\n    │\n    ▼\nفقط پردازه‌های ssh</div></div>
<p>مثال دیگر:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls -l | grep ".txt$"</div></div>
<p>خروجی: فقط فایل‌هایی که پسوند txt دارند.</p>

<h2>تفاوت Pattern معمولی و Regex</h2>
<table>
<thead><tr><th>Pattern</th><th>معنی</th></tr></thead>
<tbody>
<tr><td><code>root</code></td><td>وجود عبارت root در هر جای خط</td></tr>
<tr><td><code>^root</code></td><td>شروع خط با root</td></tr>
<tr><td><code>root$</code></td><td>پایان خط با root</td></tr>
<tr><td><code>^$</code></td><td>خط خالی</td></tr>
<tr><td><code>sh$</code></td><td>پایان خط با sh</td></tr>
<tr><td><code>.*</code></td><td>هر تعداد کاراکتر</td></tr>
</tbody>
</table>

<div class="summary-box">
<h3>جدول خلاصه دستورات مهم</h3>
<table>
<thead><tr><th>دستور</th><th>عملکرد</th></tr></thead>
<tbody>
<tr><td><code>grep root file</code></td><td>جستجوی عبارت root</td></tr>
<tr><td><code>grep -i pattern file</code></td><td>بدون حساسیت به حروف</td></tr>
<tr><td><code>grep -v pattern file</code></td><td>نمایش خطوط غیرمطابق</td></tr>
<tr><td><code>grep -n pattern file</code></td><td>نمایش شماره خطوط</td></tr>
<tr><td><code>grep -c pattern file</code></td><td>شمارش خطوط پیدا شده</td></tr>
<tr><td><code>grep -r pattern dir</code></td><td>جستجو در پوشه</td></tr>
<tr><td><code>grep "^root"</code></td><td>شروع خط با root</td></tr>
<tr><td><code>grep "sh$"</code></td><td>پایان خط با sh</td></tr>
<tr><td><code>grep "^$"</code></td><td>خط‌های خالی</td></tr>
</tbody>
</table>
</div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکات مهم LPIC-1</strong>
<ul>
    <li>⭐ <code>grep</code> مخفف <strong>Global Regular Expression Print</strong> است.</li>
    <li>⭐ ساختار کلی دستور: <code>grep [options] pattern file</code></li>
    <li>⭐ گزینه <code>-i</code> حساسیت به حروف کوچک و بزرگ را از بین می‌برد.</li>
    <li>⭐ گزینه <code>-v</code> خطوط <strong>غیرمطابق</strong> را نمایش می‌دهد.</li>
    <li>⭐ <code>^</code> یعنی <strong>ابتدای خط</strong>.</li>
    <li>⭐ <code>$</code> یعنی <strong>انتهای خط</strong>.</li>
    <li>⭐ <code>^$</code> یعنی <strong>خط کاملاً خالی</strong>.</li>
    <li>⭐ <code>grep</code> معمولاً همراه با <strong>Pipe (<code>|</code>)</strong> استفاده می‌شود.</li>
</ul>
</div></div>

<h2>🧪 تمرین</h2>
<h3>تمرین ۱</h3>
<p>کاربر <code>root</code> را در فایل <code>/etc/passwd</code> پیدا کنید.</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">grep root /etc/passwd</div></div>

<h3>تمرین ۲</h3>
<p>تمام کاربرانی که Shell آن‌ها <code>bash</code> نیست را نمایش دهید.</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">grep -v bash /etc/passwd</div></div>

<h3>تمرین ۳</h3>
<p>بدون حساسیت به بزرگی و کوچکی حروف، عبارت <code>error</code> را در یک فایل Log جستجو کنید.</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">grep -i error /var/log/messages</div></div>

<h3>تمرین ۴</h3>
<p>خط‌هایی را پیدا کنید که با <code>root</code> شروع می‌شوند.</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">grep "^root" /etc/passwd</div></div>

<h3>تمرین ۵</h3>
<p>خط‌های خالی یک فایل را پیدا کنید.</p>
<div class="code-container"><span class="code-label">تمرین</span><div class="code-block">grep "^$" file.txt</div></div>

<h2>خودآزمایی</h2>
<div class="quiz-card"><p>❓ تست ۱: عبارت <code>grep</code> مخفف کدام گزینه است؟</p>
<div class="quiz-options">

</div>

<div class="quiz-card"><p>❓ تست ۲: کدام دستور تمام خطوطی را که <strong>با <code>root</code> شروع می‌شوند</strong> نمایش می‌دهد؟</p>
<div class="quiz-options">

</div>

<div class="quiz-card"><p>❓ تست ۳: کدام دستور خطوطی را نمایش می‌دهد که <strong>عبارت <code>bash</code> را ندارند؟</strong></p>
<div class="quiz-options">

<div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br>گزینه <code>-v</code> نتیجه جستجو را معکوس می‌کند و خطوط غیرمطابق را نمایش می‌دهد.</div>
</div>

<div class="quiz-card"><p>❓ تست ۴: الگوی <code>^$</code> چه مفهومی دارد؟</p>

</div>

<div class="quiz-card"><p>❓ تست ۵: کدام دستور بدون توجه به بزرگی و کوچکی حروف، عبارت <code>error</code> را جستجو می‌کند؟</p>

</div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>جمع‌بندی جلسه ۹</strong><br>
<code>grep</code> یکی از قدرتمندترین ابزارهای جستجو در لینوکس است که با ترکیب Regex و Pipe می‌تواند کارهای بسیار پیچیده‌ای را انجام دهد. مهم‌ترین نکات:
<ul>

"ch1-10": `
<div class="section-header">
    <div class="section-badge">۱</div>
    <div>
        <h1>انتقال ورودی و خروجی (Redirect)</h1>
        <div class="meta">کار با خط فرمان · بخش ۱۰ از ۱۴</div>
    </div>
</div>

<p>در جلسات قبل با نحوه ساخت، نمایش، پردازش و صحت‌سنجی فایل‌ها آشنا شدیم. در این جلسه یکی از مهم‌ترین و پرکاربردترین مفاهیم خط فرمان لینوکس را یاد می‌گیریم: <strong>Redirect</strong> یا <strong>تغییر مسیر ورودی/خروجی</strong>.</p>

<p>این مفهوم پایه و اساس بسیاری از دستورات پیچیده‌تر در آینده (مثل <code>pipe</code>، اسکریپت‌نویسی و مدیریت لاگ) است، پس باید کاملاً آن را درک کنید.</p>

<h2>سه کانال اصلی در لینوکس</h2>

<p>هر دستوری که در ترمینال اجرا می‌کنید، با سه <strong>کانال ورودی/خروجی</strong> استاندارد سروکار دارد:</p>

<table>
<thead><tr><th>نام</th><th>شماره (File Descriptor)</th><th>توضیح</th></tr></thead>
<tbody>
<tr><td><strong>STDIN</strong></td><td><code>0</code></td><td>ورودی استاندارد (معمولاً صفحه‌کلید)</td></tr>
<tr><td><strong>STDOUT</strong></td><td><code>1</code></td><td>خروجی استاندارد (معمولاً صفحه نمایش)</td></tr>
<tr><td><strong>STDERR</strong></td><td><code>2</code></td><td>خروجی خطا (معمولاً صفحه نمایش)</td></tr>
</tbody>
</table>

<div class="code-container"><span class="code-label">جریان داده</span><div class="code-block no-prompt">                 ┌───────────┐\n  Keyboard ─────▶│           │─────▶ Screen (STDOUT)\n   (STDIN=0)      │  Command  │\n                 │           │─────▶ Screen (STDERR)\n                 └───────────┘</div></div>

<p>به‌طور پیش‌فرض:</p>
<ul>
    <li><strong>STDIN</strong> از صفحه‌کلید خوانده می‌شود.</li>
    <li><strong>STDOUT</strong> و <strong>STDERR</strong> هر دو روی صفحه نمایش (ترمینال) چاپ می‌شوند؛ با این تفاوت که STDOUT خروجی موفق و STDERR پیام خطا را نشان می‌دهد.</li>
</ul>

<p>مثال ساده:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls /root</div></div>

<p>اگر دسترسی کافی نداشته باشید، پیام خطا (STDERR) روی صفحه چاپ می‌شود؛ اگر دسترسی داشته باشید، لیست فایل‌ها (STDOUT) نمایش داده می‌شود. هر دو در ظاهر شبیه هم دیده می‌شوند، اما لینوکس آن‌ها را <strong>دو کانال جداگانه</strong> می‌داند و همین موضوع باعث می‌شود بتوانیم آن‌ها را جدا از هم مدیریت کنیم.</p>

<h2>جدول عملگرهای Redirect</h2>

<table>
<thead><tr><th>عملگر</th><th>عملکرد</th></tr></thead>
<tbody>
<tr><td><code>></code></td><td>انتقال STDOUT به فایل مشخص‌شده. اگر فایل وجود داشته باشد، <strong>بازنویسی (Overwrite)</strong> می‌شود؛ اگر نباشد، ساخته می‌شود.</td></tr>
<tr><td><code>>></code></td><td>انتقال STDOUT به فایل مشخص‌شده. اگر فایل وجود داشته باشد، محتوا به انتهای آن <strong>اضافه (Append)</strong> می‌شود؛ اگر نباشد، ساخته می‌شود.</td></tr>
<tr><td><code>2></code></td><td>انتقال STDERR به فایل مشخص‌شده. در صورت وجود فایل، بازنویسی می‌شود؛ در غیر این صورت ساخته می‌شود.</td></tr>
<tr><td><code>2>></code></td><td>انتقال STDERR به فایل مشخص‌شده به‌صورت Append.</td></tr>
<tr><td><code>&></code></td><td>انتقال <strong>هم‌زمان STDOUT و STDERR</strong> به فایل مشخص‌شده، به‌صورت Overwrite.</td></tr>
<tr><td><code>&>></code></td><td>انتقال <strong>هم‌زمان STDOUT و STDERR</strong> به فایل مشخص‌شده، به‌صورت Append.</td></tr>
<tr><td><code><</code></td><td>خواندن STDIN از یک فایل مشخص، به‌جای صفحه‌کلید.</td></tr>
<tr><td><code>< ... > ...</code></td><td>خواندن STDIN از یک فایل و در همان زمان انتقال STDOUT به فایل مشخص‌شده.</td></tr>
</tbody>
</table>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>نکته مهم</strong>در <strong>Bash استاندارد</strong> سینتکس صحیح برای ترکیب STDOUT و STDERR، <code>&></code> (Overwrite) و <code>&>></code> (Append) است. توجه کنید که <code>&&</code> در Bash معنای کاملاً متفاوتی دارد (اجرای دستور دوم فقط در صورت موفقیت دستور اول) و ربطی به Redirect ندارد.</div></div>

<h2><code>></code> — انتقال STDOUT (Overwrite)</h2>

<p>خروجی یک دستور را در فایل ذخیره می‌کند و اگر فایل از قبل وجود داشته باشد، <strong>کاملاً پاک و بازنویسی</strong> می‌شود.</p>

<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls -l > filelist.txt</div></div>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">ls -l\n   │\n   ▼  (STDOUT)\nfilelist.txt   (محتوای قبلی پاک می‌شود)</div></div>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>هشدار</strong>اگر دوباره همین دستور را اجرا کنید، محتوای قبلی فایل <code>filelist.txt</code> <strong>از بین می‌رود</strong> و با خروجی جدید جایگزین می‌شود.</div></div>

<h2><code>>></code> — انتقال STDOUT (Append)</h2>

<p>خروجی دستور به <strong>انتهای</strong> فایل اضافه می‌شود و محتوای قبلی فایل حفظ می‌شود.</p>

<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "Line 1" > log.txt\necho "Line 2" >> log.txt\necho "Line 3" >> log.txt</div></div>

<p>محتوای نهایی <code>log.txt</code>:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Line 1\nLine 2\nLine 3</div></div>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">echo "Line 1"  ──▶  >   ──▶  log.txt  (پاک و ساخته می‌شود)\necho "Line 2"  ──▶  >>  ──▶  log.txt  (اضافه می‌شود)\necho "Line 3"  ──▶  >>  ──▶  log.txt  (اضافه می‌شود)</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>کاربرد رایج</strong>نوشتن لاگ‌های پی‌درپی در یک فایل بدون از دست دادن سوابق قبلی.</div></div>

<h2><code>2></code> و <code>2>></code> — انتقال STDERR</h2>

<p>فقط پیام‌های <strong>خطا</strong> را به فایل هدایت می‌کند؛ خروجی موفق (STDOUT) همچنان روی صفحه نمایش داده می‌شود.</p>

<p>مثال: فرض کنید فایل <code>notexist.txt</code> وجود ندارد:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat notexist.txt 2> error.log</div></div>

<p>چون دستور با خطا مواجه می‌شود، هیچ‌چیز روی صفحه چاپ نمی‌شود و پیام خطا داخل <code>error.log</code> ذخیره می‌شود.</p>

<p>مثال ترکیبی با یک فایل موجود و یک فایل ناموجود:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat file1.txt notexist.txt 2> error.log</div></div>

<p>نتیجه:</p>
<ul>
    <li>محتوای <code>file1.txt</code> روی <strong>صفحه نمایش</strong> چاپ می‌شود (چون STDOUT است).</li>
    <li>پیام خطای مربوط به <code>notexist.txt</code> داخل <code>error.log</code> ذخیره می‌شود (چون STDERR است).</li>
</ul>

<p>برای append کردن خطاها بدون پاک کردن فایل قبلی:</p>
<div class="code-container"><span class="code-label">append</span><div class="code-block">cat notexist.txt 2>> error.log</div></div>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">cat file1.txt notexist.txt\n        │              │\n     STDOUT         STDERR\n        │              │\n        ▼              ▼\n     Screen        error.log</div></div>

<h2><code>&></code> و <code>&>></code> — انتقال هم‌زمان STDOUT و STDERR</h2>

<p>گاهی می‌خواهید <strong>هم خروجی موفق و هم پیام خطا</strong>، هر دو در یک فایل واحد ذخیره شوند؛ مثلاً هنگام اجرای یک اسکریپت طولانی که می‌خواهید کل لاگ آن (چه موفق چه خطا) را نگه دارید.</p>

<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls file1.txt notexist.txt &> all_output.log</div></div>

<p>محتوای <code>all_output.log</code> شامل هم نام <code>file1.txt</code> (خروجی موفق) و هم پیام خطای مربوط به <code>notexist.txt</code> خواهد بود.</p>

<p>برای append کردن:</p>
<div class="code-container"><span class="code-label">append</span><div class="code-block">ls file1.txt notexist.txt &>> all_output.log</div></div>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">STDOUT ──┐\n         ├──▶ &> / &>>  ──▶  all_output.log\nSTDERR ──┘</div></div>

<h3>روش جایگزین و سنتی‌تر</h3>

<p>قبل از رایج شدن <code>&></code> در نسخه‌های جدیدتر Bash، از روش زیر برای انجام همین کار استفاده می‌شد و همچنان در اسکریپت‌های قدیمی‌تر دیده می‌شود:</p>

<div class="code-container"><span class="code-label">روش سنتی</span><div class="code-block">ls file1.txt notexist.txt > all_output.log 2>&1</div></div>

<p>در این دستور، ابتدا STDOUT به فایل هدایت می‌شود و سپس <code>2>&1</code> یعنی «STDERR هم به همان‌جایی برود که STDOUT رفته است».</p>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته مهم</strong>در این روش <strong>ترتیب نوشتن</strong> اهمیت دارد. دستور <code>2>&1 > file.txt</code> نتیجه‌ی متفاوتی نسبت به <code>> file.txt 2>&1</code> می‌دهد، چون در حالت اول، STDERR هنوز به ترمینال اشاره می‌کند و فقط بعداً STDOUT تغییر مسیر می‌دهد.</div></div>

<h2><code><</code> — انتقال STDIN از فایل</h2>

<p>به‌جای اینکه ورودی یک دستور را از صفحه‌کلید تایپ کنید، می‌توانید آن را از یک فایل بخوانید.</p>

<p>مثال با دستور <code>wc</code> (شمارش):</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">wc -l < names.txt</div></div>

<p>در اینجا <code>wc</code> محتوای فایل <code>names.txt</code> را به‌جای صفحه‌کلید، به‌عنوان ورودی دریافت می‌کند و تعداد خطوط آن را می‌شمارد.</p>

<p>مثال دیگر با برنامه‌هایی که منتظر ورودی تعاملی هستند:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">mail -s "Subject" user@example.com < message.txt</div></div>

<p>در این حالت، محتوای <code>message.txt</code> به‌جای اینکه شما آن را تایپ کنید، مستقیم به‌عنوان بدنه ایمیل خوانده می‌شود.</p>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">names.txt\n   │\n   ▼ (STDIN)\n  wc -l\n   │\n   ▼ (STDOUT)\n Screen</div></div>

<h2><code>< ... > ...</code> — ترکیب STDIN و STDOUT</h2>

<p>با نوشتن <code><</code> و <code>></code> در کنار هم در یک خط دستور، می‌توانید هم‌زمان از یک فایل به‌عنوان <strong>STDIN</strong> استفاده کنید و <strong>STDOUT</strong> را هم به فایل دیگری هدایت کنید.</p>

<div class="code-container"><span class="code-label">مثال</span><div class="code-block">command <input.txt >output.txt</div></div>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">input.txt\n   │\n   ▼ (STDIN)\n command\n   │\n   ▼ (STDOUT)\noutput.txt</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>این حالت با علامت ترکیبی <code><></code> که در برخی جدول‌های آموزشی دیده می‌شود، از نظر مفهومی یکی است — یعنی «هم‌زمان خواندن از یک فایل و نوشتن در فایل دیگر» — و در عمل با نوشتن <code><</code> و <code>></code> پشت‌سرهم در یک خط دستور پیاده‌سازی می‌شود.</div></div>

<h2>فایل مخصوص دور ریختن — <code>/dev/null</code></h2>

<p>گاهی نمی‌خواهید نه خروجی و نه خطا را در هیچ‌کجا ذخیره کنید و فقط می‌خواهید آن‌ها <strong>نادیده گرفته شوند</strong>. برای این کار از فایل مخصوص <code>/dev/null</code> استفاده می‌شود؛ فایلی که هر چیزی به آن نوشته شود، برای همیشه از بین می‌رود.</p>

<p>نادیده گرفتن خطاها:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find / -name "*.conf" 2> /dev/null</div></div>

<p>نادیده گرفتن کامل خروجی و خطا:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">command &> /dev/null</div></div>

<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">هر داده‌ای\n    │\n    ▼\n /dev/null\n    │\n    ▼\n  (نابود می‌شود)</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>کاربرد رایج</strong>در اسکریپت‌ها و کرون‌جاب‌ها (Cron Jobs) برای جلوگیری از شلوغ شدن خروجی با پیام‌های غیرضروری.</div></div>

<div class="summary-box">
<h3>جدول خلاصه عملگرهای Redirect</h3>
<table>
<thead><tr><th>عملگر</th><th>کانال</th><th>عملکرد</th></tr></thead>
<tbody>
<tr><td><code>></code></td><td>STDOUT</td><td>بازنویسی فایل</td></tr>
<tr><td><code>>></code></td><td>STDOUT</td><td>اضافه کردن به انتهای فایل</td></tr>
<tr><td><code>2></code></td><td>STDERR</td><td>بازنویسی فایل خطا</td></tr>
<tr><td><code>2>></code></td><td>STDERR</td><td>اضافه کردن به انتهای فایل خطا</td></tr>
<tr><td><code>&></code></td><td>STDOUT + STDERR</td><td>بازنویسی هر دو در یک فایل</td></tr>
<tr><td><code>&>></code></td><td>STDOUT + STDERR</td><td>اضافه کردن هر دو به یک فایل</td></tr>
<tr><td><code>> file 2>&1</code></td><td>STDOUT + STDERR</td><td>روش سنتی برای ترکیب هر دو در یک فایل</td></tr>
<tr><td><code><</code></td><td>STDIN</td><td>خواندن ورودی از فایل</td></tr>
<tr><td><code>< ... > ...</code></td><td>STDIN + STDOUT</td><td>خواندن ورودی از فایل و نوشتن خروجی در فایل دیگر</td></tr>
<tr><td><code>2> /dev/null</code></td><td>STDERR</td><td>نادیده گرفتن کامل پیام‌های خطا</td></tr>
</tbody>
</table>
</div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکات مهم LPIC-1</strong>
<ul>
    <li>⭐ سه کانال استاندارد: <strong>STDIN (0)</strong>، <strong>STDOUT (1)</strong>، <strong>STDERR (2)</strong>.</li>
    <li>⭐ <code>></code> فایل را <strong>پاک و بازنویسی</strong> می‌کند؛ <code>>></code> به فایل <strong>اضافه</strong> می‌کند.</li>
    <li>⭐ برای هدایت خطا از <code>2></code> و برای هدایت هم‌زمان خروجی و خطا از <code>&></code> استفاده می‌شود.</li>
    <li>⭐ روش سنتی‌تر برای ترکیب STDOUT و STDERR: <code>command > file 2>&1</code> — و <strong>ترتیب نوشتن</strong> در این روش اهمیت دارد.</li>
    <li>⭐ <code><</code> ورودی دستور را از یک فایل به‌جای صفحه‌کلید می‌خواند.</li>
    <li>⭐ <code>/dev/null</code> یک «سیاه‌چاله» است؛ هر چیزی که به آن هدایت شود، برای همیشه حذف می‌شود.</li>
    <li>⭐ Redirect با <strong>Pipe (<code>|</code>)</strong> که در جلسه بعد می‌بینیم فرق دارد: Redirect خروجی را به <strong>فایل</strong> می‌فرستد، اما Pipe خروجی یک دستور را به <strong>ورودی دستور دیگر</strong> وصل می‌کند.</li>
</ul>
</div></div>

<h2>🧪 تمرین</h2>

<h3>تمرین ۱</h3>
<p>خروجی دستور <code>ls -l</code> را در فایلی به نام <code>list.txt</code> ذخیره کنید، سپس دوباره همان دستور را اجرا کنید و ببینید محتوای فایل چه تغییری می‌کند.</p>

<h3>تمرین ۲</h3>
<p>با استفاده از <code>echo</code> و عملگر <code>>></code> سه خط متن پشت‌سرهم به یک فایل اضافه کنید بدون آنکه خطوط قبلی پاک شوند.</p>

<h3>تمرین ۳</h3>
<p>دستوری اجرا کنید که یک فایل ناموجود را بخواند (مثلاً <code>cat notfound.txt</code>) و پیام خطای آن را با <code>2></code> در فایلی جداگانه ذخیره کنید.</p>

<h3>تمرین ۴</h3>
<p>دستوری بنویسید که هم‌زمان یک فایل موجود و یک فایل ناموجود را بخواند و با <code>&></code> هر دو خروجی (موفق و خطا) را در یک فایل واحد ذخیره کنید.</p>

<h3>تمرین ۵</h3>
<p>با استفاده از <code><</code> تعداد خطوط یک فایل را از طریق <code>wc -l</code> بدون تایپ مستقیم محاسبه کنید.</p>

<h3>تمرین ۶</h3>
<p>یک دستور بنویسید که پیام‌های خطای آن به‌طور کامل نادیده گرفته شود (با هدایت به <code>/dev/null</code>).</p>

<div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br><code>/dev/null</code> یک فایل مخصوص در لینوکس است که هر داده‌ای به آن نوشته شود، بلافاصله از بین می‌رود. این روش معمولاً برای نادیده گرفتن پیام‌های غیرضروری خروجی یا خطا، به‌خصوص در اسکریپت‌ها و کرون‌جاب‌ها، استفاده می‌شود.</div>
</div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>جمع‌بندی جلسه ۱۰</strong><br>
Redirect یکی از مفاهیم پایه‌ای و حیاتی خط فرمان لینوکس است که با درک صحیح آن می‌توانید خروجی دستورات را به‌صورت دلخواه مدیریت کنید. مهم‌ترین نکات:
<ul>
    <li>سه کانال اصلی: STDIN (0)، STDOUT (1)، STDERR (2)</li>
    <li><code>></code> برای بازنویسی، <code>>></code> برای اضافه کردن</li>
    <li><code>2></code> و <code>2>></code> برای مدیریت خطاها</li>
    <li><code>&></code> و <code>&>></code> برای ترکیب خروجی و خطا</li>
    <li><code><</code> برای خواندن ورودی از فایل</li>
    <li><code>/dev/null</code> برای دور ریختن خروجی‌های غیرضروری</li>
</ul>
</div></div>
