<hr class="lesson-divider">

<h2 class="lesson-title">1. از نوشتن شرط تا حل مسئله</h2>

<p>در بخش قبلی یاد گرفتیم که با <code>if</code>، <code>elif</code> و <code>else</code> می‌توانیم بر اساس یک شرط تصمیم بگیریم.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if condition:
    ...
elif condition:
    ...
else:
    ...</div>
</div>

<p>اما در برنامه‌نویسی واقعی، مشکل اصلی معمولاً <strong>نوشتن Syntax</strong> نیست؛ بلکه این است که بدانیم یک مسئله را چگونه به شرط‌های درست تبدیل کنیم.</p>

<p>مثلاً مسئله زیر را در نظر بگیر:</p>

<blockquote>
اگر نمره دانش‌آموز حداقل 10 باشد، قبول است؛ در غیر این صورت مردود.
</blockquote>

<p>قبل از کدنویسی باید قانون مسئله را به یک شرط تبدیل کنیم:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">قانون:
نمره حداقل 10 → قبول

شرط:
score >= 10</div>

</div>

<p>حالا کدنویسی ساده می‌شود:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">score = 15

if score >= 10:
print("Pass")
else:
print("Fail")</div>

</div>

<p>پس اولین مهارت مهم این جلسه این است:</p>

<blockquote>
<strong>ابتدا قانون مسئله را بفهم، سپس آن را به شرط تبدیل کن.</strong>
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">2. وقتی مسئله چند حالت دارد</h2>

<p>اگر مسئله بیشتر از دو حالت داشته باشد، معمولاً از <code>elif</code> استفاده می‌کنیم.</p>

<p>مثلاً:</p>

<blockquote>
نمره را دسته‌بندی کن:
<br>18 تا 20 → Excellent
<br>15 تا 17 → Good
<br>10 تا 14 → Pass
<br>کمتر از 10 → Fail
</blockquote>

<p>به جای ساختن چند <code>if</code> مستقل، می‌توانیم از یک زنجیره شرطی استفاده کنیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">score = 16

if score >= 18:
print("Excellent")
elif score >= 15:
print("Good")
elif score >= 10:
print("Pass")
else:
print("Fail")</div>

</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">Good</div>
</div>

<p>نکته مهم این است که Python شرط‌ها را <strong>از بالا به پایین</strong> بررسی می‌کند.</p>

<p>برای <code>score = 16</code>:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">16 >= 18  → False
16 >= 15  → True</div>
</div>

<p>به محض اینکه شرط دوم <code>True</code> شود، بخش مربوط به آن اجرا می‌شود و Python دیگر شرط‌های پایین‌تر را بررسی نمی‌کند.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">3. ترتیب شرط‌ها چرا مهم است؟</h2>

<p>یکی از مهم‌ترین خطاهای منطقی در شرط‌های چندحالتی، قرار دادن شرط‌ها در ترتیب اشتباه است.</p>

<p>مثلاً:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">score = 19

if score >= 10:
print("Pass")
elif score >= 18:
print("Excellent")
else:
print("Fail")</div>

</div>

<p>ممکن است انتظار داشته باشیم <code>Excellent</code> چاپ شود، اما خروجی:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">Pass</div>
</div>

<p>است.</p>

<p>چون شرط اول:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">score >= 10</div>
</div>

<p>برای عدد 19 درست است؛ بنابراین Python همان بخش را اجرا می‌کند و دیگر به <code>elif</code> نمی‌رسد.</p>

<p>پس وقتی شرط‌ها روی یکدیگر هم‌پوشانی دارند، معمولاً باید <strong>شرط خاص‌تر را قبل از شرط عمومی‌تر</strong> قرار دهیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if score >= 18:
    print("Excellent")
elif score >= 15:
    print("Good")
elif score >= 10:
    print("Pass")
else:
    print("Fail")</div>
</div>

<p>یک قانون ساده برای مسائل این‌چنینی:</p>

<blockquote>
<strong>از حالت سخت‌تر یا خاص‌تر شروع کن و به حالت عمومی‌تر برس.</strong>
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">4. لازم نیست همیشه همه بازه‌ها را بنویسیم</h2>

<p>برای دسته‌بندی نمره‌ها می‌توانستیم بنویسیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if 18 <= score <= 20:
    print("Excellent")
elif 15 <= score <= 17:
    print("Good")
elif 10 <= score <= 14:
    print("Pass")
else:
    print("Fail")</div>
</div>

<p>اما در این مسئله روش کوتاه‌تر و خواناتری داریم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if score >= 18:
    print("Excellent")
elif score >= 15:
    print("Good")
elif score >= 10:
    print("Pass")
else:
    print("Fail")</div>
</div>

<p>چرا شرط دوم فقط <code>score >= 15</code> است؟</p>

<p>چون اگر Python به <code>elif</code> رسیده باشد، می‌دانیم شرط قبلی درست نبوده است.</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">score >= 18 → False

پس می‌دانیم:
score < 18

حالا:
score >= 15

یعنی:
15 <= score < 18</div>

</div>

<p>بنابراین خود ساختار <code>if / elif</code> بخشی از محدودیت بازه را برای ما مشخص می‌کند.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">5. شرط‌های ترکیبی با <code>and</code></h2>

<p>گاهی یک تصمیم به <strong>چند شرط هم‌زمان</strong> وابسته است.</p>

<p>مثلاً:</p>

<blockquote>
برای قبولی، نمره حداقل 10 باشد <strong>و</strong> حضور حداقل 80 درصد باشد.
</blockquote>

<p>دو شرط داریم:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">score >= 10
attendance >= 80</div>
</div>

<p>چون هر دو باید درست باشند، از <code>and</code> استفاده می‌کنیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">score = 15
attendance = 90

if score >= 10 and attendance >= 80:
print("Passed")
else:
print("Failed")</div>

</div>

<p>اگر یکی از شرط‌ها نادرست باشد، کل شرط <code>and</code> نادرست می‌شود.</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">score >= 10       → True
attendance >= 80 → False

True and False → False</div>

</div>

<p>بنابراین خروجی:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">Failed</div>
</div>

<p>پس:</p>

<blockquote>
<strong><code>and</code> یعنی همه شرط‌های موردنظر باید برقرار باشند.</strong>
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">6. شرط‌های ترکیبی با <code>or</code></h2>

<p>گاهی کافی است <strong>یکی از چند حالت</strong> برقرار باشد.</p>

<p>مثلاً:</p>

<blockquote>
اگر کاربر Admin یا Manager باشد، اجازه ورود دارد.
</blockquote>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">role = "Manager"

if role == "Admin" or role == "Manager":
print("Access granted")
else:
print("Access denied")</div>

</div>

<p>در این مثال:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">role == "Admin"   → False
role == "Manager" → True

False or True → True</div>

</div>

<p>پس دسترسی مجاز است.</p>

<blockquote>
<strong><code>or</code> یعنی کافی است حداقل یکی از شرط‌ها درست باشد.</strong>
</blockquote>

<p>دقت کن که هر مقایسه باید کامل نوشته شود.</p>

<p>درست:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if color == "red" or color == "blue":
    print("Allowed")</div>
</div>

<p>نه:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if color == "red" or "blue":
    print("Allowed")</div>
</div>

<p>در حالت درست، هر دو طرف <code>or</code> یک مقایسه کامل هستند.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">7. ترکیب چند شرط در یک مسئله واقعی</h2>

<p>فرض کن یک فروشگاه اینترنتی داریم و کاربر فقط زمانی اجازه خرید دارد که:</p>

<ul>
<li>موجودی کافی داشته باشد.</li>
<li>حساب کاربری فعال باشد.</li>
</ul>

<p>اطلاعات:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">balance = 500
price = 300
account_active = True</div>
</div>

<p>شرط موجودی:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">balance >= price</div>
</div>

<p>شرط فعال بودن حساب نیز:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">account_active</div>
</div>

<p>چون هر دو شرط لازم هستند:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if balance >= price and account_active:
    print("Purchase allowed")
else:
    print("Purchase denied")</div>
</div>

<p>از آنجا که <code>account_active</code> خودش یک Boolean است، نیازی نیست بنویسیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">account_active == True</div>
</div>

<p>نوشتن مستقیم آن خواناتر است:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if balance >= price and account_active:</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">8. Nested Condition — شرط تو در تو</h2>

<p>گاهی تصمیم دوم فقط زمانی معنا دارد که تصمیم اول برقرار باشد. در این حالت می‌توانیم از <strong>Nested Condition</strong> استفاده کنیم.</p>

<p>مثلاً:</p>

<blockquote>
ابتدا بررسی کن کاربر حداقل 18 سال دارد. اگر داشت، سپس بررسی کن کارت شناسایی معتبر دارد یا نه.
</blockquote>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">age = 20
has_id = True

if age >= 18:
if has_id:
print("Entry allowed")
else:
print("Valid ID required")
else:
print("You are too young")</div>

</div>

<p>در اینجا شرط دوم داخل شرط اول قرار گرفته است.</p>

<p>یعنی اگر:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">age >= 18</div>
</div>

<p>برقرار نباشد، اصلاً بررسی کارت شناسایی انجام نمی‌شود.</p>

<p>اما اگر فقط می‌خواهیم بگوییم <strong>هر دو شرط باید درست باشند</strong>، معمولاً می‌توانیم کد را ساده‌تر کنیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if age >= 18 and has_id:
    print("Entry allowed")</div>
</div>

<p>پس:</p>

<ul>
<li>اگر دو شرط مستقل هستند و هر دو باید برقرار باشند → معمولاً <code>and</code> ساده‌تر است.</li>
<li>اگر تصمیم دوم به نتیجه یا مسیر تصمیم اول وابسته است → <strong>Nested Condition</strong> می‌تواند مناسب باشد.</li>
</ul>

<hr class="lesson-divider">

<h2 class="lesson-title">9. شرط‌های بازه‌ای در Python</h2>

<p>Python اجازه می‌دهد مقایسه‌های زنجیره‌ای را بسیار خوانا بنویسیم.</p>

<p>مثلاً:</p>

<blockquote>آیا دما بین 20 و 30 درجه است؟</blockquote>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">temperature = 25

if 20 <= temperature <= 30:
print("Normal")</div>

</div>

<p>این عبارت از نظر منطقی معادل است با:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if temperature >= 20 and temperature <= 30:
    print("Normal")</div>
</div>

<p>در Python شکل اول معمولاً خواناتر است.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">10. دقت به کلمات مسئله</h2>

<p>یکی از مهارت‌های مهم در حل مسائل شرطی، تبدیل دقیق کلمات مسئله به عملگر مقایسه‌ای است.</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>عبارت</th>
<th>عملگر مناسب</th>
</tr>
</thead>
<tbody>
<tr>
<td>بیشتر از</td>
<td><code>></code></td>
</tr>
<tr>
<td>کمتر از</td>
<td><code><</code></td>
</tr>
<tr>
<td>حداقل</td>
<td><code>>=</code></td>
</tr>
<tr>
<td>حداکثر</td>
<td><code><=</code></td>
</tr>
<tr>
<td>برابر</td>
<td><code>==</code></td>
</tr>
<tr>
<td>برابر نیست</td>
<td><code>!=</code></td>
</tr>
</tbody>
</table>
</div>

<p>مثلاً:</p>

<blockquote>اگر نمره <strong>حداقل 10</strong> باشد، قبول است.</blockquote>

<p>«حداقل 10» یعنی خود عدد 10 نیز شامل شود:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if score >= 10:</div>
</div>

<p>نه:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if score > 10:</div>
</div>

<p>چون در حالت دوم، نمره 10 قبول نمی‌شود.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">11. تست حالت‌های مرزی</h2>

<p>یک برنامه شرطی را نباید فقط با یک مقدار آزمایش کنیم.</p>

<p>به‌خصوص زمانی که قانون شامل مرزهایی مثل «حداقل»، «حداکثر» یا «بیشتر از» است، باید مقادیر نزدیک به مرز را تست کنیم.</p>

<p>مثلاً در این قانون:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">1,000,000 یا بیشتر → 20٪
500,000 تا کمتر از 1,000,000 → 10٪
کمتر از 500,000 → 0٪</div>
</div>

<p>مقادیر مهم برای تست:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">499,999
500,000
500,001

999,999
1,000,000
1,000,001</div>

</div>

<p>این مقادیر کمک می‌کنند مطمئن شویم مرزهای شرط‌ها را درست پیاده‌سازی کرده‌ایم.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">12. حل مسئله مرحله‌به‌مرحله: سیستم تخفیف</h2>

<p>حالا یک مسئله کامل را از ابتدا حل کنیم.</p>

<h3>صورت مسئله</h3>

<p>یک فروشگاه برای مشتریان خود قوانین زیر را دارد:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">مبلغ خرید 1,000,000 یا بیشتر → 20٪ تخفیف
مبلغ خرید 500,000 یا بیشتر → 10٪ تخفیف
کمتر از 500,000 → بدون تخفیف</div>
</div>

<h3>مرحله ۱ — مشخص کردن داده</h3>

<p>فقط مبلغ خرید برای تعیین تخفیف اصلی لازم است:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">price</div>
</div>

<h3>مرحله ۲ — مشخص کردن حالت‌ها</h3>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">price >= 1,000,000 → 20٪
price >= 500,000  → 10٪
در غیر این صورت   → 0٪</div>
</div>

<h3>مرحله ۳ — تبدیل قوانین به شرط</h3>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if price >= 1_000_000:
    discount = 20
elif price >= 500_000:
    discount = 10
else:
    discount = 0</div>
</div>

<p>دقت کن که شرط دوم فقط <code>price >= 500_000</code> است.</p>

<p>چون اگر Python به <code>elif</code> برسد، می‌دانیم شرط اول برقرار نبوده است؛ بنابراین خودبه‌خود می‌دانیم:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">price < 1,000,000</div>
</div>

<h3>مرحله ۴ — محاسبه مقدار تخفیف</h3>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">discount_amount = price * discount / 100
final_price = price - discount_amount</div>
</div>

<h3>مرحله ۵ — برنامه کامل</h3>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">price = 750_000

if price >= 1_000_000:
discount = 20
elif price >= 500_000:
discount = 10
else:
discount = 0

discount_amount = price * discount / 100
final_price = price - discount_amount

print("Discount:", discount, "%")
print("Final price:", final_price)</div>

</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">Discount: 10 %
Final price: 675000.0</div>
</div>

<p>در این مثال چند مفهوم قبلی با هم ترکیب شدند:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">Variables
    +
Arithmetic Operators
    +
if / elif / else
    ↓
حل مسئله</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">13. اضافه کردن چند شرط به مسئله</h2>

<p>حالا مسئله را کمی واقعی‌تر می‌کنیم.</p>

<blockquote>
اگر مشتری عضو باشگاه باشد، 5 درصد تخفیف اضافه دریافت می‌کند.
</blockquote>

<p>داده‌های ما:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">price = 1_200_000
member = True</div>
</div>

<p>ابتدا تخفیف اصلی را مشخص می‌کنیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if price >= 1_000_000:
    discount = 20
elif price >= 500_000:
    discount = 10
else:
    discount = 0</div>
</div>

<p>سپس وضعیت عضویت را جداگانه بررسی می‌کنیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if member:
    discount = discount + 5</div>
</div>

<p>حالا محاسبه قیمت نهایی:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">discount_amount = price * discount / 100
final_price = price - discount_amount</div>
</div>

<p>برنامه کامل:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">price = 1_200_000
member = True

if price >= 1_000_000:
discount = 20
elif price >= 500_000:
discount = 10
else:
discount = 0

if member:
discount = discount + 5

discount_amount = price * discount / 100
final_price = price - discount_amount

print("Discount:", discount, "%")
print("Final price:", final_price)</div>

</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">Discount: 25 %
Final price: 900000.0</div>
</div>

<p>اینجا دو تصمیم جدا داریم:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">تصمیم اول:
تعیین تخفیف بر اساس مبلغ

تصمیم دوم:
افزودن تخفیف عضویت</div>

</div>

<p>این روش معمولاً از قرار دادن همه قوانین در یک شرط بسیار طولانی خواناتر است.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">14. تبدیل یک مسئله متنی به کد</h2>

<p>یک روش بسیار مهم برای حل مسئله این است که جمله فارسی مسئله را به اجزای منطقی آن تبدیل کنیم.</p>

<p>مثلاً:</p>

<blockquote>
اگر سن حداقل 18 باشد و کارت شناسایی داشته باشد، ورود مجاز است.
</blockquote>

<p>قانون را به دو شرط تقسیم می‌کنیم:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">سن حداقل 18
AND
کارت شناسایی دارد</div>
</div>

<p>سپس:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if age >= 18 and has_id:
    print("Entry allowed")</div>
</div>

<p>مثال دوم:</p>

<blockquote>
اگر کاربر Admin یا Manager باشد، دسترسی مجاز است.
</blockquote>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if role == "Admin" or role == "Manager":
    print("Access granted")</div>
</div>

<p>پس هنگام خواندن یک مسئله، به کلمات منطقی توجه کن:</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>در مسئله</th>
<th>در Python</th>
</tr>
</thead>
<tbody>
<tr>
<td>و</td>

<h2 class="lesson-title">🎯 جمع‌بندی جلسه</h2>

<p>در بخش قبلی یاد گرفتیم که شرط‌ها چگونه نوشته می‌شوند. در این جلسه یک قدم مهم‌تر برداشتیم:</p>

<blockquote>
<strong>یاد گرفتیم چگونه یک مسئله را به مجموعه‌ای از تصمیم‌های قابل‌کدنویسی تبدیل کنیم.</strong>
</blockquote>

<p>هسته حل یک مسئله شرطی این است:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">مسئله
   ↓
Input
   ↓
حالت‌های ممکن
   ↓
قوانین هر حالت
   ↓
if / elif / else
   ↓
and / or در صورت نیاز
   ↓
محاسبه نتیجه
   ↓
تست حالت‌های مختلف</div>
</div>

<p>مهم‌ترین نکاتی که باید از این جلسه بلد باشی:</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>مفهوم</th>
<th>نکته اصلی</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>if</code></td>
<td>بررسی اولین شرط</td>
</tr>
<tr>
<td><code>elif</code></td>
<td>بررسی حالت جایگزین، فقط اگر شرط‌های قبلی برقرار نباشند</td>
</tr>
<tr>
<td><code>else</code></td>
<td>پوشش حالت باقی‌مانده</td>
</tr>
<tr>
<td><code>and</code></td>
<td>همه شرط‌ها باید درست باشند</td>
</tr>
<tr>
<td><code>or</code></td>
<td>حداقل یکی از شرط‌ها باید درست باشد</td>
</tr>
<tr>
<td>Nested Condition</td>
<td>وقتی تصمیم دوم به تصمیم اول وابسته است</td>
</tr>
<tr>
<td>شرط بازه‌ای</td>
<td>مثل <code>20 <= x <= 30</code></td>
</tr>
<tr>
<td>حالت مرزی</td>
<td>مقادیر دقیق اطراف مرزهای شرط را تست کن</td>
</tr>
</tbody>
</table>
</div>

<p>و مهم‌تر از همه، وقتی با یک مسئله جدید روبه‌رو شدی، مستقیم سراغ <code>if</code> نرو.</p>

<p>ابتدا از خودت بپرس:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">چه داده‌ای دارم؟
چه حالت‌هایی وجود دارد؟
قانون هر حالت چیست؟
آیا شرط‌ها با هم هم‌پوشانی دارند؟
آیا به and یا or نیاز دارم؟
مرزهای شرط کجا هستند؟
چطور می‌توانم نتیجه را تست کنم؟</div>
</div>

<blockquote>
<strong>برنامه‌نویسی فقط نوشتن Syntax نیست؛ مهارت اصلی این است که قوانین یک مسئله واقعی را به تصمیم‌های دقیق و قابل‌اجرا تبدیل کنیم.</strong>
</blockquote>

<p>تا اینجا با <strong>Variables، Data Types، Operators، Input/Output و Conditions</strong> ابزارهای اصلی برای ساخت برنامه‌های ساده را در اختیار داریم.</p>

<p>در فصل بعد وارد <strong>Loops</strong> می‌شویم و یاد می‌گیریم چگونه یک بخش از برنامه را چندین بار اجرا کنیم. ابتدا با <code>while</code> شروع می‌کنیم و سپس به <code>for</code>، <code>range()</code> و <code>enumerate()</code> می‌رسیم.</p>`

<hr class="lesson-divider">

<h2 class="lesson-title">1. چرا به Loop نیاز داریم؟</h2>

<p>در جلسه قبل با <code>if</code> یاد گرفتیم بر اساس یک شرط تصمیم بگیریم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if condition:
    # code</div>
</div>

<p>اما <code>if</code> برای تصمیم‌گیری است، نه تکرار.</p>

<p>فرض کن بخواهیم یک پیام را 100 بار چاپ کنیم. بدون Loop مجبور می‌شویم کد را بارها تکرار کنیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">print("Hello")
print("Hello")
print("Hello")
# ...
# 100 بار</div>
</div>

<p>این روش هم طولانی است و هم نگهداری آن سخت می‌شود.</p>

<p>اینجاست که <strong>Loop</strong> وارد می‌شود:</p>

<blockquote>
<strong>Loop</strong> یعنی اجرای تکراری یک بخش از کد بر اساس یک شرط یا قانون مشخص.
</blockquote>

<p>در این جلسه با <code>while</code> آشنا می‌شویم.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">2. <code>while</code> چیست؟</h2>

<p>کلمه <code>while</code> را می‌توانیم «تا زمانی که» در نظر بگیریم.</p>

<p>حلقه <code>while</code> تا زمانی که شرط آن <code>True</code> باشد، بدنه حلقه را اجرا می‌کند.</p>

<p>Syntax اصلی:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">while condition:
    code</div>
</div>

<p>مثال ساده:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">count = 1

while count <= 5:
    print(count)
    count += 1</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">1
2
3
4
5</div>
</div>

<p>منطق برنامه بسیار ساده است:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">بررسی شرط
    ↓
True ؟
    ↓
اجرای بدنه
    ↓
تغییر وضعیت
    ↓
بررسی دوباره شرط
    ↓
False ؟
    ↓
پایان</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">3. حلقه <code>while</code> چگونه اجرا می‌شود؟</h2>

<p>مثال زیر را مرحله‌به‌مرحله بررسی کنیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">count = 1

while count <= 5:
    print(count)
    count += 1</div>
</div>

<p>ابتدا:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">count = 1</div>
</div>

<p>Python شرط را بررسی می‌کند:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">count <= 5</div>
</div>

<p>یعنی:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">1 <= 5 → True</div>
</div>

<p>پس بدنه اجرا می‌شود:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">print(count)
count += 1</div>
</div>

<p>حالا مقدار <code>count</code> برابر 2 است و شرط دوباره بررسی می‌شود.</p>

<p>روند کامل:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">1 <= 5 → True  → چاپ 1
2 <= 5 → True  → چاپ 2
3 <= 5 → True  → چاپ 3
4 <= 5 → True  → چاپ 4
5 <= 5 → True  → چاپ 5
6 <= 5 → False → پایان</div>
</div>

<blockquote>
<strong>نکته مهم:</strong> شرط <code>while</code> قبل از هر بار اجرای بدنه بررسی می‌شود.
</blockquote>

<p>بنابراین اگر شرط از همان ابتدا <code>False</code> باشد، حلقه حتی یک بار هم اجرا نمی‌شود.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">count = 10

while count < 5:
    print(count)</div>
</div>

<p>در اینجا:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">10 < 5 → False</div>
</div>

<p>پس هیچ خروجی تولید نمی‌شود.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">4. Indentation در <code>while</code></h2>

<p>مثل <code>if</code>، بدنه <code>while</code> باید با <strong>Indentation</strong> مشخص شود.</p>

<p>درست:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">while condition:
    print("Hello")</div>
</div>

<p>دستورهای دارای Indentation داخل حلقه هستند.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">count = 1

while count <= 3:
    print("Hello")
    print(count)
    count += 1

print("Done")</div>
</div>

<p>در این مثال سه دستور داخل حلقه قرار دارند:</p>

<ul>
<li><code>print("Hello")</code></li>
<li><code>print(count)</code></li>
<li><code>count += 1</code></li>
</ul>

<p>اما <code>print("Done")</code> خارج از حلقه است و فقط یک بار اجرا می‌شود.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">5. Counter و کنترل حلقه</h2>

<p>در بسیاری از حلقه‌های <code>while</code> یک متغیر برای کنترل تعداد تکرار داریم که به آن <strong>Counter</strong> می‌گوییم.</p>

<p>مثلاً:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">count = 1

while count <= 5:
    print(count)
    count += 1</div>
</div>

<p>اینجا <code>count</code> نقش Counter را دارد.</p>

<p>خط زیر بسیار مهم است:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">count += 1</div>
</div>

<p>که معادل است با:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">count = count + 1</div>
</div>

<p>بنابراین مقدار Counter در هر تکرار تغییر می‌کند:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">1 → 2 → 3 → 4 → 5 → 6</div>
</div>

<p>وقتی مقدار به 6 برسد، شرط <code>count <= 5</code> برابر <code>False</code> می‌شود و حلقه پایان پیدا می‌کند.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">6. تغییر Counter در جهت درست</h2>

<p>گاهی لازم است به‌جای افزایش، مقدار متغیر را کاهش دهیم.</p>

<p>مثلاً شمارش معکوس:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">number = 5

while number >= 1:
    print(number)
    number -= 1</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">5
4
3
2
1</div>
</div>

<p>در اینجا:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">number -= 1</div>
</div>

<p>معادل است با:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">number = number - 1</div>
</div>

<p>قاعده مهم این است که تغییر متغیر باید با جهت شرط هماهنگ باشد.</p>

<table class="lesson-table">
<thead>
<tr>
<th>هدف</th>
<th>شرط</th>
<th>تغییر</th>
</tr>
</thead>
<tbody>
<tr>
<td>شمارش رو به بالا</td>
<td><code>x &lt;= 5</code></td>
<td><code>x += 1</code></td>
</tr>
<tr>
<td>شمارش رو به پایین</td>
<td><code>x &gt;= 1</code></td>
<td><code>x -= 1</code></td>
</tr>
</tbody>
</table>

<hr class="lesson-divider">

<h2 class="lesson-title">7. Infinite Loop — حلقه بی‌نهایت</h2>

<p>یکی از مهم‌ترین مشکلات <code>while</code>، حلقه‌ای است که هیچ‌وقت تمام نمی‌شود.</p>

<p>مثلاً:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">count = 1

while count <= 5:
    print(count)</div>
</div>

<p>اینجا <code>count</code> هیچ‌وقت تغییر نمی‌کند.</p>

<p>بنابراین شرط همیشه:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">1 <= 5 → True</div>
</div>

<p>باقی می‌ماند و حلقه متوقف نمی‌شود.</p>

<blockquote>
<strong>Infinite Loop</strong> یعنی حلقه‌ای که مسیر اجرای آن هیچ‌وقت به وضعیت پایان نمی‌رسد.
</blockquote>

<p>برای بررسی یک <code>while</code> همیشه این سه سؤال را از خودت بپرس:</p>

<ol>
<li>شرط ادامه حلقه چیست؟</li>
<li>چه چیزی در هر تکرار تغییر می‌کند؟</li>
<li>چه زمانی شرط <code>False</code> می‌شود؟</li>
</ol>

<p>اگر پاسخ سؤال سوم مشخص نباشد، احتمال Infinite Loop وجود دارد.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">8. <code>while</code> فقط برای شمارش نیست</h2>

<p>یکی از اشتباهات رایج این است که فکر کنیم <code>while</code> فقط برای شمارش اعداد استفاده می‌شود.</p>

<p>کاربرد اصلی آن گسترده‌تر است:</p>

<blockquote>
<strong>تا زمانی که یک وضعیت برقرار است، کاری را ادامه بده.</strong>
</blockquote>

<p>مثلاً:</p>

<ul>
<li>تا زمانی که رمز صحیح وارد نشده، دوباره رمز بگیر.</li>
<li>تا زمانی که ورودی معتبر نیست، دوباره ورودی بگیر.</li>
<li>تا زمانی که بازی تمام نشده، بازی را ادامه بده.</li>
<li>تا زمانی که موجودی باقی مانده است، عملیات را ادامه بده.</li>
</ul>

<p>بنابراین بهتر است <code>while</code> را به‌عنوان یک حلقه <strong>شرط‌محور</strong> بشناسی، نه صرفاً یک ابزار شمارش.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">9. <code>while</code> با شرط‌های ترکیبی</h2>

<p>شرط <code>while</code> می‌تواند مانند <code>if</code> با عملگرهای منطقی ترکیب شود.</p>

<p>مثلاً:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">number = 1

while number <= 10 and number != 7:
    print(number)
    number += 1</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">1
2
3
4
5
6</div>
</div>

<p>حلقه زمانی ادامه دارد که <strong>هر دو شرط</strong> درست باشند:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">number <= 10
AND
number != 7</div>
</div>

<p>وقتی <code>number</code> به 7 برسد، شرط دوم <code>False</code> می‌شود و حلقه پایان پیدا می‌کند.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">10. <code>while</code> با <code>bool</code></h2>

<p>چون شرط <code>while</code> در نهایت باید یک مقدار منطقی داشته باشد، می‌توانیم از متغیر Boolean نیز استفاده کنیم.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">running = True

while running:
    print("Program is running")
    running = False</div>
</div>

<p>در اولین بررسی:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">running → True</div>
</div>

<p>پس حلقه اجرا می‌شود.</p>

<p>سپس:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">running = False</div>
</div>

<p>در بررسی بعدی شرط <code>False</code> است و حلقه پایان پیدا می‌کند.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">11. <code>while True</code></h2>

<p>گاهی می‌بینیم که شرط حلقه مستقیماً <code>True</code> نوشته شده است:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">while True:
    print("Hello")</div>
</div>

<p>چون <code>True</code> همیشه درست است، این حلقه ذاتاً بی‌نهایت است.</p>

<blockquote>
<code>while True</code> تا زمانی که مکانیزم خروجی نداشته باشد، متوقف نمی‌شود.
</blockquote>

<p>در ادامه فصل با <code>break</code> یاد می‌گیریم چگونه چنین حلقه‌ای را کنترل کنیم.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">12. تفاوت <code>if</code> و <code>while</code></h2>

<p>این دو مفهوم بسیار نزدیک‌اند، اما کاربردشان متفاوت است.</p>

<table class="lesson-table">

<tr>

<th><code>while</code></th>
</tr>
</thead>

</tr>

<hr class="lesson-divider">

<h2 class="lesson-title">13. کاربرد مهم: دریافت ورودی تا زمانی که معتبر شود</h2>

<p>یکی از کاربردهای واقعی <code>while</code> این است که از کاربر ورودی بگیریم تا زمانی که مقدار معتبر وارد کند.</p>

<p>فرض کنیم عدد باید بین 1 تا 10 باشد:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">number = int(input("Enter a number between 1 and 10: "))

while number < 1 or number > 10:
    print("Invalid number!")
    number = int(input("Enter a number between 1 and 10: "))

print("Valid number:", number)</div>
</div>

<p>اگر کاربر ابتدا <code>15</code> وارد کند، شرط:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">number < 1 or number > 10</div>
</div>

<p>برابر <code>True</code> است؛ بنابراین ورودی دوباره دریافت می‌شود.</p>

<p>اگر بعداً کاربر <code>7</code> وارد کند:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">7 < 1 → False
7 > 10 → False

False or False → False</div>
</div>

<p>پس حلقه پایان پیدا می‌کند.</p>

<blockquote>
این مثال ترکیب چند مفهوم قبلی است:
<strong>input + int + comparison + logical operators + while</strong>
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">14. تغییر وضعیت داخل حلقه</h2>

<p>در مثال قبل یک نکته بسیار مهم وجود داشت: متغیری که شرط به آن وابسته است باید بتواند تغییر کند.</p>

<p>این کد مشکل دارد:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">number = int(input("Enter a number: "))

while number < 1:
    print("Invalid!")</div>
</div>

<p>اگر کاربر <code>0</code> وارد کند، مقدار <code>number</code> هیچ‌وقت تغییر نمی‌کند.</p>

<p>در نتیجه:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">number = 0
0 < 1 → True
0 < 1 → True
0 < 1 → True
...</div>
</div>

<p>برای اصلاح آن باید داخل حلقه مقدار جدید دریافت کنیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">number = int(input("Enter a number: "))

while number < 1:
    print("Invalid!")
    number = int(input("Enter a number: "))</div>
</div>

<p>اکنون وضعیت برنامه در هر تکرار می‌تواند تغییر کند و در نهایت شرط به <code>False</code> برسد.</p>

<h2 class="lesson-title">15. یک مثال ترکیبی: شمارش تلاش‌ها</h2>

<p>فرض کن می‌خواهیم یک عملیات را حداکثر سه بار انجام دهیم.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">attempt = 1

while attempt <= 3:
    print("Attempt:", attempt)

<div class="code-container">

Attempt: 3</div>

<p>روند آن:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">attempt = 1
    ↓
attempt <= 3 → True
    ↓
اجرای کد
    ↓

بررسی دوباره

<h2 class="lesson-title">16. ترکیب <code>while</code> و <code>if</code></h2>

<p>در برنامه‌های واقعی معمولاً چند مفهوم را با هم ترکیب می‌کنیم.</p>

<p>مثلاً یک سیستم ورود ساده که حداکثر سه بار فرصت دارد:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">attempt = 1
logged_in = False

while attempt <= 3 and not logged_in:
    password = input("Enter password: ")

    if password == "python123":
        print("Access granted!")
        logged_in = True
    else:
        print("Wrong password.")

    attempt += 1

if not logged_in:
    print("Account locked.")</div>
</div>

<p>اینجا چند مفهوم قبلی با هم ترکیب شده‌اند:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">Variables
    ↓
input()
    ↓
Comparison
    ↓
if / else
    ↓
and / not
    ↓
while</div>
</div>

<p>نکته اصلی این مثال این است که <code>while</code> تکرار را کنترل می‌کند و <code>if</code> تصمیم داخل هر تکرار را می‌گیرد.</p>

<h2 class="lesson-title">17. یک نکته مهم درباره تغییر شمارنده</h2>

<p>تغییر متغیر کنترل‌کننده باید دقیقاً همان چیزی باشد که مسئله می‌خواهد.</p>

<p>مثلاً:</p>

<div class="code-container">
<span class="code-label">Python</span>

while number <= 5:

</div>

<div class="code-container">

3
5</div>

<div class="code-container">

<div class="code-block no-prompt">1 → 3 → 5 → 7</div>
</div>

<p>پس اگر هدف چاپ تمام اعداد بود، باید از <code>number += 1</code> استفاده می‌کردیم.</p>

<h2 class="lesson-title">18. یک مثال با String</h2>

<p><code>while</code> فقط برای اعداد نیست. می‌توانیم وضعیت یک String را نیز بررسی کنیم.</p>

<p>مثلاً دریافت رمز عبور تا زمانی که صحیح شود:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">password = ""

while password != "python123":
    password = input("Enter password: ")

print("Access granted!")</div>
</div>

<p>در این برنامه تا زمانی که مقدار <code>password</code> برابر رمز صحیح نشده باشد، حلقه ادامه پیدا می‌کند.</p>

<p>این مثال مفهوم اصلی <code>while</code> را به‌خوبی نشان می‌دهد:</p>

<blockquote>
<strong>تکرار تا رسیدن به یک وضعیت مشخص.</strong>
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">19. الگوی اصلی حل مسئله با <code>while</code></h2>

<p>بیشتر مسائل ساده <code>while</code> را می‌توان با این چهار مرحله تحلیل کرد:</p>

<ol>
<li><strong>Initial State:</strong> مقدار یا وضعیت اولیه را مشخص کن.</li>
<li><strong>Condition:</strong> مشخص کن حلقه تا چه زمانی ادامه دارد.</li>
<li><strong>Action:</strong> کاری که باید در هر تکرار انجام شود را بنویس.</li>
<li><strong>Update:</strong> وضعیت را طوری تغییر بده که در نهایت شرط <code>False</code> شود.</li>
</ol>

<p>مثلاً:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">count = 1                  # Initial State

while count <= 5:         # Condition
    print(count)          # Action
    count += 1            # Update</div>
</div>

<p>این الگو یکی از مهم‌ترین الگوهای فکری برای کار با <code>while</code> است.</p>

<h2 class="lesson-title">1. از <code>while</code> به <code>for</code></h2>

<p>در جلسه قبل با <code>while</code> آشنا شدیم. یکی از کاربردهای آن اجرای چندباره یک قطعه کد است.</p>

<p>مثلاً برای چاپ اعداد 1 تا 5:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">number = 1

while number <= 5:
    print(number)
    number += 1</div></div>

<p>در این روش خودمان باید:</p>

<ul>
<li>متغیر شمارنده را ایجاد کنیم.</li>
<li>شرط ادامه حلقه را بنویسیم.</li>
<li>در هر مرحله شمارنده را تغییر دهیم.</li>
</ul>

<p>اما اگر از قبل بدانیم می‌خواهیم روی یک دنباله مشخص حرکت کنیم، <code>for</code> معمولاً ساده‌تر است:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(1, 6):
    print(number)</div></div>

<p>خروجی هر دو روش:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
2
3
4
5</div></div>

<p>تفاوت اصلی این است که در <code>for</code> معمولاً خود حلقه مسئول حرکت روی داده‌هاست و لازم نیست شمارنده را دستی مدیریت کنیم.</p>

<blockquote>
<strong>ایده اصلی:</strong> اگر می‌خواهی «برای هر مورد» کاری انجام دهی، معمولاً <code>for</code> انتخاب طبیعی‌تری است.
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">2. <code>for</code> چیست؟</h2>

<p>حلقه <code>for</code> برای <strong>پیمایش (Iteration)</strong> روی یک داده قابل پیمایش و اجرای یک قطعه کد برای هر مقدار استفاده می‌شود.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

for name in names:
    print(name)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali
Sara
Reza</div></div>

<p>در هر بار اجرای حلقه، یک عنصر از <code>names</code> در متغیر <code>name</code> قرار می‌گیرد:</p>

<div class="table-wrap"><table>
<thead>
<tr><th>مرحله</th><th><code>name</code></th></tr>
</thead>
<tbody>
<tr><td>اول</td><td><code>"Ali"</code></td></tr>
<tr><td>دوم</td><td><code>"Sara"</code></td></tr>
<tr><td>سوم</td><td><code>"Reza"</code></td></tr>
</tbody>
</table></div>

<p>بنابراین می‌توانی <code>for</code> را ساده این‌طور بخوانی:</p>

<blockquote><strong>برای هر عنصر، این کار را انجام بده.</strong></blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">3. Syntax حلقه <code>for</code></h2>

<p>ساختار اصلی:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for variable in iterable:
    code</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in numbers:
    print(number)</div></div>

<div class="table-wrap"><table>
<thead>
<tr><th>بخش</th><th>وظیفه</th></tr>
</thead>
<tbody>
<tr><td><code>for</code></td><td>شروع حلقه</td></tr>
<tr><td><code>variable</code></td><td>دریافت مقدار فعلی</td></tr>
<tr><td><code>in</code></td><td>مشخص کردن داده‌ای که روی آن پیمایش می‌کنیم</td></tr>
<tr><td><code>iterable</code></td><td>داده‌ای که می‌توان عناصر آن را یکی‌یکی دریافت کرد</td></tr>
<tr><td><code>:</code></td><td>شروع بدنه حلقه</td></tr>
<tr><td>کد Indented</td><td>دستورات تکرارشونده</td></tr>
</tbody>
</table></div>

<p>در سطح Python Basic، کافی است <code>iterable</code> را به‌عنوان چیزی در نظر بگیری که می‌توانیم روی آن یکی‌یکی حرکت کنیم؛ مثل <code>list</code> و <code>string</code>.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">4. <code>for</code> روی List</h2>

<p>یکی از رایج‌ترین کاربردهای <code>for</code> پیمایش یک <code>list</code> است.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">fruits = ["apple", "banana", "orange"]

for fruit in fruits:
    print(fruit)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">apple
banana
orange</div></div>

<p>نکته مهم: اگر فقط خود مقادیر را می‌خواهیم، نیازی نیست Indexها را مدیریت کنیم.</p>

<p>Python خودش عناصر را یکی‌یکی در متغیر <code>fruit</code> قرار می‌دهد.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">5. <code>for</code> روی String</h2>

<p><code>for</code> فقط برای <code>list</code> نیست. می‌توانیم روی یک <code>string</code> نیز حرکت کنیم.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">word = "Python"

for letter in word:
    print(letter)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">P
y
t
h
o
n</div></div>

<p>در اینجا هر بار یک کاراکتر از رشته در متغیر <code>letter</code> قرار می‌گیرد.</p>

<p>بنابراین:</p>

<blockquote>
<code>for</code> می‌تواند روی داده‌هایی حرکت کند که عناصرشان را می‌توان یکی‌یکی دریافت کرد.
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">6. <code>for</code> در برابر <code>while</code></h2>

<p>یکی از مهم‌ترین تصمیم‌ها هنگام کار با حلقه‌ها این است که از <code>for</code> استفاده کنیم یا <code>while</code>.</p>

<h3><code>for</code></h3>

<p>وقتی معمولاً می‌خواهیم روی مجموعه‌ای از داده‌ها یا یک دنباله مشخص حرکت کنیم.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

for name in names:
    print(name)</div></div>

<p>یعنی:</p>

<blockquote>برای هر نام موجود در لیست، آن را چاپ کن.</blockquote>

<h3><code>while</code></h3>

<p>وقتی ادامه تکرار به یک <strong>شرط یا وضعیت</strong> وابسته است و ممکن است تعداد تکرار از قبل مشخص نباشد.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">password = ""

while password != "1234":
    password = input("Password: ")</div></div>

<p>یعنی:</p>

<blockquote>تا زمانی که رمز صحیح نشده، دوباره رمز بگیر.</blockquote>

<div class="table-wrap"><table>
<thead>
<tr><th><code>for</code></th><th><code>while</code></th></tr>
</thead>
<tbody>
<tr><td>پیمایش روی داده‌ها</td><td>تکرار بر اساس شرط</td></tr>
<tr><td>مناسب دنباله یا تعداد مشخص</td><td>مناسب وضعیت یا شرط</td></tr>
<tr><td>معمولاً نیاز به شمارنده دستی ندارد</td><td>ممکن است نیاز به تغییر وضعیت داشته باشد</td></tr>
<tr><td><code>for x in items</code></td><td><code>while condition</code></td></tr>
</tbody>
</table></div>

<blockquote>
<strong>قانون ساده:</strong><br>
«برای هر عنصر...» → <code>for</code><br>
«تا زمانی که...» → <code>while</code>
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">7. <code>range()</code> چیست؟</h2>

<p>وقتی می‌خواهیم یک دنباله عددی داشته باشیم، <code>range()</code> یکی از مهم‌ترین ابزارهای همراه <code>for</code> است.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(5):
    print(number)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0
1
2
3
4</div></div>

<p>نکته بسیار مهم:</p>

<blockquote>
در <code>range(5)</code>، عدد <code>5</code> شامل نمی‌شود.
</blockquote>

<p>پس <code>range(5)</code> یعنی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0, 1, 2, 3, 4</div></div>

<p>وقتی فقط یک مقدار به <code>range()</code> می‌دهیم، آن مقدار به‌عنوان <code>stop</code> در نظر گرفته می‌شود و شروع به‌صورت پیش‌فرض <code>0</code> است.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">8. <code>range(start, stop)</code></h2>

<p>می‌توانیم نقطه شروع را نیز مشخص کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(2, 6):
    print(number)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">2
3
4
5</div></div>

<p>در اینجا:</p>

<ul>
<li><code>start = 2</code> → شامل می‌شود.</li>
<li><code>stop = 6</code> → شامل نمی‌شود.</li>
</ul>

<blockquote>
<strong>قانون طلایی:</strong> در <code>range()</code>، <code>start</code> شامل می‌شود اما <code>stop</code> شامل نمی‌شود.
</blockquote>

<p>به همین دلیل برای چاپ اعداد 1 تا 5 باید بنویسیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(1, 6):
    print(number)</div></div>

<p>چون <code>6</code> بیرون بازه است.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">9. <code>range(start, stop, step)</code></h2>

<p>پارامتر سوم <code>range()</code> یعنی <code>step</code> مشخص می‌کند در هر مرحله چه مقدار تغییر کنیم.</p>

<p>ساختار:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">range(start, stop, step)</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(0, 10, 2):
    print(number)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0
2
4
6
8</div></div>

<p>در این مثال:</p>

<div class="table-wrap"><table>
<thead>
<tr><th>پارامتر</th><th>مقدار</th></tr>
</thead>
<tbody>
<tr><td><code>start</code></td><td><code>0</code></td></tr>
<tr><td><code>stop</code></td><td><code>10</code></td></tr>
<tr><td><code>step</code></td><td><code>2</code></td></tr>
</tbody>
</table></div>

<p>یعنی از <code>0</code> شروع کن، هر بار <code>2</code> واحد جلو برو و قبل از رسیدن به <code>10</code> متوقف شو.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">10. <code>step</code> منفی و حرکت معکوس</h2>

<p>اگر بخواهیم از عدد بزرگ‌تر به عدد کوچک‌تر حرکت کنیم، به یک <code>step</code> منفی نیاز داریم.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(5, 0, -1):
    print(number)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">5
4
3
2
1</div></div>

<p>در اینجا:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">start = 5
stop  = 0
step  = -1</div></div>

<p>دوباره <code>stop</code> شامل نمی‌شود؛ بنابراین <code>0</code> چاپ نمی‌شود.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">11. خلاصه کاربردی <code>range()</code></h2>

<div class="table-wrap"><table>
<thead>
<tr><th>Syntax</th><th>نتیجه</th><th>کاربرد</th></tr>
</thead>
<tbody>
<tr>
<td><code>range(5)</code></td>
<td><code>0, 1, 2, 3, 4</code></td>
<td>از صفر تا قبل از 5</td>
</tr>
<tr>
<td><code>range(2, 6)</code></td>
<td><code>2, 3, 4, 5</code></td>
<td>شروع مشخص</td>
</tr>
<tr>
<td><code>range(0, 10, 2)</code></td>
<td><code>0, 2, 4, 6, 8</code></td>
<td>گام 2</td>
</tr>
<tr>
<td><code>range(5, 0, -1)</code></td>
<td><code>5, 4, 3, 2, 1</code></td>
<td>حرکت معکوس</td>
</tr>
</tbody>
</table></div>

<p>مهم‌ترین نکته‌ای که باید به خاطر بسپاری:</p>

<blockquote><strong><code>stop</code> همیشه خارج از بازه است.</strong></blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">12. استفاده از <code>range()</code> برای تعداد مشخصی تکرار</h2>

<p>گاهی به خود عددهای <code>range()</code> نیاز نداریم و فقط می‌خواهیم یک کد تعداد مشخصی بار اجرا شود.</p>

<p>مثلاً چاپ <code>Hello</code> پنج بار:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for _ in range(5):
    print("Hello")</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Hello
Hello
Hello
Hello
Hello</div></div>

<p>در اینجا از <code>_</code> استفاده کرده‌ایم، چون مقدار تولیدشده برای ما مهم نیست.</p>

<blockquote>
<code>_</code> در این کاربرد یعنی «این مقدار را لازم ندارم».
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">13. <code>enumerate()</code> چیست؟</h2>

<p>گاهی هنگام پیمایش یک لیست، فقط مقدار عنصر کافی نیست و هم‌زمان به <strong>Index</strong> آن نیز نیاز داریم.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]</div></div>

<p>اگر فقط مقدارها را بخواهیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for name in names:
    print(name)</div></div>

<p>اما اگر هم Index و هم Value لازم باشد، می‌توانیم از <code>enumerate()</code> استفاده کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, name in enumerate(names):
    print(index, name)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0 Ali
1 Sara
2 Reza</div></div>

<p>یعنی <code>enumerate()</code> هنگام پیمایش، اطلاعات هر عنصر را به شکل <strong>Index + Value</strong> در اختیار حلقه قرار می‌دهد.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">14. چرا <code>enumerate()</code> مفید است؟</h2>

<p>بدون <code>enumerate()</code> ممکن است برای دسترسی به Index به این شکل عمل کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

for i in range(len(names)):
    print(i, names[i])</div></div>

<p>این کد درست است، اما وقتی هدف ما فقط دریافت <strong>Index و Value</strong> است، <code>enumerate()</code> خواناتر است:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

for index, name in enumerate(names):
    print(index, name)</div></div>

<p>روش دوم مستقیماً هدف کد را نشان می‌دهد:</p>

<blockquote>
برای هر عنصر، Index و Value آن را در اختیارم قرار بده.
</blockquote>

<p>بنابراین یک الگوی مهم را به خاطر بسپار:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, value in enumerate(items):
    ...</div></div>

<hr class="lesson-divider">

<h2 class="lesson-title">15. تغییر نقطه شروع <code>enumerate()</code></h2>

<p>به‌صورت پیش‌فرض Index از <code>0</code> شروع می‌شود:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

for index, name in enumerate(names):
    print(index, name)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0 Ali
1 Sara
2 Reza</div></div>

<p>اگر بخواهیم شماره‌گذاری از <code>1</code> شروع شود، از پارامتر <code>start</code> استفاده می‌کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, name in enumerate(names, start=1):
    print(index, name)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1 Ali
2 Sara
3 Reza</div></div>

<p>نکته مهم: <code>start=1</code> فقط شماره‌ای را که <code>enumerate()</code> تولید می‌کند تغییر می‌دهد؛ Index واقعی لیست همچنان از <code>0</code> شروع می‌شود.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">16. ترکیب <code>for</code> و <code>if</code></h2>

<p>حلقه‌ها معمولاً همراه شرط‌ها استفاده می‌شوند.</p>

<p>مثلاً می‌خواهیم فقط اعداد زوج یک لیست را چاپ کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [1, 2, 3, 4, 5, 6]

for number in numbers:
    if number % 2 == 0:
        print(number)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">2
4
6</div></div>

<p>نحوه اجرای برنامه ساده است:</p>

<ol>
<li><code>for</code> عناصر لیست را یکی‌یکی دریافت می‌کند.</li>
<li><code>if</code> هر عنصر را بررسی می‌کند.</li>
<li>اگر شرط درست باشد، <code>print()</code> اجرا می‌شود.</li>
</ol>

<p>این ترکیب یکی از الگوهای بسیار مهم در برنامه‌نویسی است:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">for item in items:
    if condition:
        do_something()</div></div>

<hr class="lesson-divider">

<h2 class="lesson-title">17. <code>for</code> روی String همراه شرط</h2>

<p>همین الگو را می‌توان روی String نیز استفاده کرد.</p>

<p>مثلاً می‌خواهیم حروف <code>a</code> موجود در کلمه <code>banana</code> را چاپ کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">word = "banana"

for letter in word:
    if letter == "a":
        print(letter)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">a
a
a</div></div>

<p>در اینجا <code>for</code> کاراکترها را یکی‌یکی دریافت می‌کند و <code>if</code> بررسی می‌کند که آیا کاراکتر فعلی برابر <code>"a"</code> است یا خیر.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">18. تفاوت <code>range()</code> و <code>list</code></h2>

<p>ممکن است <code>range()</code> و <code>list</code> را به دلیل استفاده مشابه در <code>for</code> با هم اشتباه بگیریم.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [1, 2, 3, 4]</div></div>

<p>و:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">range(1, 5)</div></div>

<p>هر دو را می‌توان در حلقه استفاده کرد:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in numbers:
    print(number)</div></div>

<p>و:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(1, 5):
    print(number)</div></div>

<p>اما مفهوم آن‌ها یکی نیست:</p>

<ul>
<li><code>list</code> یک مجموعه از مقادیر است.</li>
<li><code>range()</code> یک دنباله عددی قابل پیمایش ایجاد می‌کند.</li>
</ul>

<p>پس:</p>

<blockquote>
اگر داده‌های واقعی را داری → مستقیماً روی داده پیمایش کن.<br>
اگر به یک دنباله عددی نیاز داری → <code>range()</code> انتخاب مناسبی است.
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">19. انتخاب درست بین <code>for</code>، <code>range()</code> و <code>enumerate()</code></h2>

<div class="table-wrap"><table>
<thead>
<tr><th>نیاز</th><th>الگوی مناسب</th></tr>
</thead>
<tbody>
<tr>
<td>پیمایش مقدارهای یک لیست</td>
<td><code>for item in items</code></td>
</tr>
<tr>
<td>پیمایش کاراکترهای String</td>
<td><code>for char in text</code></td>
</tr>
<tr>
<td>تعداد مشخصی تکرار</td>
<td><code>for _ in range(n)</code></td>
</tr>
<tr>
<td>دنباله عددی</td>
<td><code>range()</code></td>
</tr>
<tr>
<td>Index + Value</td>
<td><code>enumerate()</code></td>
</tr>
<tr>
<td>تکرار وابسته به شرط</td>
<td><code>while</code></td>
</tr>
</tbody>
</table></div>

<hr class="lesson-divider">

<h1 class="lesson-title section-troubleshoot">Troubleshooting</h1>

<h3>مشکل ۱ — چرا عدد آخر چاپ نشد؟</h3>

<p>اگر بنویسیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(1, 5):
    print(i)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
2
3
4</div></div>

<p>دلیلش این است که <code>stop</code> در <code>range()</code> شامل نمی‌شود.</p>

<p>برای چاپ 1 تا 5:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(1, 6):
    print(i)</div></div>

<h3>مشکل ۲ — چرا حلقه معکوس چیزی چاپ نمی‌کند؟</h3>

<p>این کد:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(5, 0):
    print(i)</div></div>

<p>خروجی ندارد؛ چون <code>range()</code> به‌صورت پیش‌فرض <code>step=1</code> دارد، در حالی که برای حرکت از 5 به 1 باید به سمت پایین حرکت کنیم.</p>

<p>راه درست:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(5, 0, -1):
    print(i)</div></div>

<h3>مشکل ۳ — چرا <code>enumerate()</code> خروجی مورد انتظار را نمی‌دهد؟</h3>

<p>ترتیب مقادیر <code>enumerate()</code> این است:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Index, Value</div></div>

<p>پس الگوی معمول:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, value in enumerate(items):
    print(index, value)</div></div>

<p>اگر برعکس بنویسیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for value, index in enumerate(items):
    print(index, value)</div></div>

<p>از نظر Syntax خطایی رخ نمی‌دهد، اما نام‌گذاری متغیرها باعث می‌شود مقدارها در متغیر نامناسب قرار بگیرند و خروجی مورد انتظار را نگیریم.</p>

<h3>مشکل ۴ — آیا همیشه باید از <code>range()</code> استفاده کنیم؟</h3>

<p>خیر.</p>

<p>اگر خود داده‌ها را داریم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

for name in names:
    print(name)</div></div>

<p>نیازی به <code>range()</code> نداریم.</p>

<p><code>range()</code> زمانی مناسب‌تر است که به یک دنباله عددی یا تعداد مشخصی تکرار نیاز داریم.</p>

<h1 class="lesson-title section-scenario">سناریوی ترکیبی — نمایش نمرات دانش‌آموزان</h1>

<p>حالا مفاهیم این جلسه را در یک مثال واقعی‌تر ترکیب کنیم.</p>

<p>فرض کن نمرات چند دانش‌آموز را داریم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">scores = [18, 12, 20, 9, 15]</div></div>

<p>می‌خواهیم:</p>

<ol>
<li>شماره هر دانش‌آموز را نمایش دهیم.</li>
<li>نمره او را نمایش دهیم.</li>
<li>مشخص کنیم قبول شده یا مردود.</li>
</ol>

<p>قانون:</p>

<blockquote>
نمره 10 یا بیشتر → <strong>Pass</strong><br>
نمره کمتر از 10 → <strong>Fail</strong>
</blockquote>

<h3>مرحله ۱ — پیمایش نمرات</h3>

<p>اگر فقط نمره‌ها را بخواهیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for score in scores:
    print(score)</div></div>

<p>اما شماره دانش‌آموز را نداریم.</p>

<h3>مرحله ۲ — اضافه کردن <code>enumerate()</code></h3>

<p>برای دریافت شماره و نمره هم‌زمان:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, score in enumerate(scores, start=1):
    print(index, score)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1 18
2 12
3 20
4 9
5 15</div></div>

<h3>مرحله ۳ — اضافه کردن شرط</h3>

<p>حالا می‌توانیم وضعیت قبولی را مشخص کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">scores = [18, 12, 20, 9, 15]

for index, score in enumerate(scores, start=1):

    if score >= 10:
        result = "Pass"
    else:
        result = "Fail"

    print(index, score, result)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1 18 Pass
2 12 Pass
3 20 Pass
4 9 Fail
5 15 Pass</div></div>

<p>در این مثال چند مفهوم را کنار هم قرار دادیم:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">List
  ↓
for
  ↓
enumerate()
  ↓
if / else
  ↓
Comparison
  ↓
print()</div></div>

<p>این دقیقاً یکی از مهارت‌های مهم در یادگیری Python است: به‌جای اینکه یک مسئله را یک‌باره حل کنیم، آن را به چند مرحله ساده تقسیم می‌کنیم و مفاهیمی را که یاد گرفته‌ایم کنار هم قرار می‌دهیم.</p>

<h3>تمرین سناریو 🧑‍💻</h3>

<h2 class="lesson-title">🎯 جمع‌بندی جلسه</h2>

<p>در جلسه قبل با <code>while</code> آشنا شدیم؛ یعنی:</p>

<blockquote>
<strong>تا زمانی که شرط برقرار است، تکرار کن.</strong>
</blockquote>

<p>در این جلسه <code>for</code> را یاد گرفتیم:</p>

<blockquote>
<strong>برای هر عنصر، این کار را انجام بده.</strong>
</blockquote>

<p>اگر یک لیست داشته باشیم و فقط مقدارهای آن را بخواهیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for value in items:
    print(value)</div></div>

<p>اگر به یک دنباله عددی یا تعداد مشخصی تکرار نیاز داشته باشیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(1, 6):
    print(number)</div></div>

<p>و اگر هم Index و هم Value را بخواهیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, value in enumerate(items):
    print(index, value)</div></div>

<div class="table-wrap"><table>
<thead>
<tr><th>مسئله</th><th>ابزار مناسب</th></tr>
</thead>
<tbody>
<tr><td>تکرار وابسته به یک شرط</td><td><code>while</code></td></tr>
<tr><td>پیمایش عناصر List</td><td><code>for</code></td></tr>
<tr><td>پیمایش کاراکترهای String</td><td><code>for</code></td></tr>
<tr><td>تعداد مشخصی تکرار</td><td><code>for</code> + <code>range()</code></td></tr>
<tr><td>دنباله عددی</td><td><code>range()</code></td></tr>
<tr><td>Index + Value</td><td><code>enumerate()</code></td></tr>
</tbody>
</table></div>

<p>سه نکته اصلی این جلسه را حتماً به خاطر بسپار:</p>

<ol>
<li><strong><code>for</code> برای پیمایش است.</strong> اگر مسئله می‌گوید «برای هر عنصر»، به <code>for</code> فکر کن.</li>
<li><strong><code>range()</code> برای دنباله‌های عددی و تکرار مشخص است.</strong> مهم‌ترین قانون آن این است که <code>stop</code> شامل نمی‌شود.</li>
<li><strong><code>enumerate()</code> برای Index + Value است.</strong> به‌صورت پیش‌فرض Index از <code>0</code> شروع می‌شود و با <code>start=</code> می‌توان نقطه شروع را تغییر داد.</li>
</ol>

<blockquote>
<strong>فرمول ساده جلسه:</strong><br><br>
«تا وقتی...» → <code>while</code><br>
«برای هر عنصر...» → <code>for</code><br>
«از یک عدد تا یک عدد دیگر...» → <code>range()</code><br>
«Index و Value با هم...» → <code>enumerate()</code>
</blockquote>

<p>در جلسه بعد می‌رویم سراغ <strong><code>break</code>، <code>continue</code>، <code>pass</code>، حلقه‌های تو‌در‌تو و <code>zip()</code></strong>؛ یعنی یاد می‌گیریم چگونه اجرای حلقه را کنترل کنیم و چند داده را هم‌زمان پیمایش کنیم.</p>`

<h2 class="lesson-title">1. از جلسه قبل تا اینجا</h2>

<p>
در دو جلسه قبل با <code>while</code> و <code>for</code> یاد گرفتیم که چگونه یک بخش از کد را چند بار اجرا کنیم.
اما هنوز یک سؤال مهم باقی می‌ماند:
<strong>اگر وسط حلقه بخواهیم جریان اجرای آن را تغییر دهیم چه کنیم؟</strong>
</p>

<p>برای کنترل اجرای حلقه‌ها سه دستور مهم داریم:</p>

<tr>

    <th>عملکرد</th>
</tr>

    <td><code>break</code></td>

<h2 class="lesson-title">2. <code>break</code> — خروج از حلقه</h2>

<p>
وقتی Python به <code>break</code> می‌رسد، اجرای همان حلقه را متوقف می‌کند و
از حلقه خارج می‌شود.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">for number in range(1, 6):
    if number == 3:
        break

    print(number)</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">1
2</div>
</div>

<p>
وقتی <code>number</code> به <code>3</code> می‌رسد، <code>break</code> اجرا می‌شود
و حلقه دیگر ادامه پیدا نمی‌کند.
بنابراین <code>3</code> و اعداد بعد از آن چاپ نمی‌شوند.
</p>

<blockquote>
<strong>break → از حلقه خارج شو.</strong>
</blockquote>

<h3>یک کاربرد واقعی</h3>

<p>
فرض کن در حال بررسی سفارش‌ها هستیم و مقدار <code>STOP</code> یعنی عملیات باید متوقف شود:
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">orders = ["Order 1", "Order 2", "STOP", "Order 4"]

for order in orders:
    if order == "STOP":
        break

    print("Processing:", order)</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">Processing: Order 1
Processing: Order 2</div>
</div>

<p>
به محض رسیدن به <code>STOP</code>، حلقه متوقف می‌شود.
</p>

<hr class="lesson-divider">

<h2 class="lesson-title">3. <code>continue</code> — رد کردن یک تکرار</h2>

<p>
برخلاف <code>break</code>، دستور <code>continue</code> کل حلقه را متوقف نمی‌کند.
فقط ادامه کدهای همان تکرار را رد می‌کند و حلقه به تکرار بعدی می‌رود.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">for number in range(1, 6):
    if number == 3:
        continue

    print(number)</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">1
2
4
5</div>
</div>

<p>
در تکرار مربوط به <code>3</code>، دستور <code>continue</code> اجرا می‌شود.
بنابراین <code>print(number)</code> برای آن تکرار اجرا نمی‌شود.
اما حلقه برای <code>4</code> و <code>5</code> ادامه پیدا می‌کند.
</p>

<blockquote>
<strong>continue → این تکرار را رد کن و برو سراغ تکرار بعدی.</strong>
</blockquote>

<h3>مثال کاربردی</h3>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">orders = ["Order 1", "INVALID", "Order 3"]

for order in orders:
    if order == "INVALID":
        continue

    print("Processing:", order)</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">Processing: Order 1
Processing: Order 3</div>
</div>

<p>
در اینجا سفارش نامعتبر را متوقف نمی‌کنیم؛ فقط آن را نادیده می‌گیریم.
پس <code>continue</code> انتخاب مناسبی است.
</p>

<hr class="lesson-divider">

<h2 class="lesson-title">4. <code>pass</code> — فعلاً هیچ کاری نکن</h2>

<p>
<code>pass</code> برخلاف <code>break</code> و <code>continue</code> جریان حلقه را تغییر نمی‌دهد.
فقط یک دستور خالی است که می‌گوید:
<strong>فعلاً هیچ کاری انجام نده.</strong>
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">for number in range(5):
    if number == 2:
        pass

    print(number)</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">0
1
2
3
4</div>
</div>

<p>
عدد <code>2</code> همچنان چاپ می‌شود، چون <code>pass</code> هیچ تکراری را حذف یا متوقف نمی‌کند.
</p>

<p>
یکی از کاربردهای مهم <code>pass</code> زمانی است که هنوز نمی‌خواهیم برای یک بخش کد
منطق خاصی بنویسیم:
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if condition:
    pass</div>
</div>

<p>
Python بعد از <code>:</code> به یک دستور نیاز دارد و <code>pass</code> می‌تواند موقتاً
جای آن دستور قرار بگیرد.
</p>

<blockquote>
<strong>pass → ساختار را نگه دار، اما فعلاً کاری انجام نده.</strong>
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">5. تفاوت سه دستور در یک نگاه</h2>

<div class="table-wrap">
<table>
<thead>
<tr>
    <th>دستور</th>
    <th>چه اتفاقی می‌افتد؟</th>
    <th>حلقه ادامه دارد؟</th>
</tr>
</thead>
<tbody>
<tr>
    <td><code>break</code></td>
    <td>از حلقه خارج می‌شویم.</td>
    <td>❌</td>
</tr>
<tr>
    <td><code>continue</code></td>
    <td>تکرار فعلی رد می‌شود.</td>
    <td>✅</td>
</tr>
<tr>
    <td><code>pass</code></td>
    <td>هیچ عملیات خاصی انجام نمی‌شود.</td>
    <td>✅</td>
</tr>
</tbody>
</table>
</div>

<div class="code-container">
<span class="code-label">Exam Tip</span>
<div class="code-block no-prompt">break      → Exit Loop
continue   → Skip Current Iteration
pass       → Do Nothing</div>
</div>

<p>
اگر در سؤال تشخیص عملکرد این سه دستور شک کردی، فقط به این سه مفهوم فکر کن:
<strong>خروج، رد کردن، هیچ‌کاری.</strong>
</p>

<hr class="lesson-divider">

<h2 class="lesson-title">6. ترکیب <code>break</code> و <code>continue</code></h2>

<p>
این دو دستور می‌توانند در یک حلقه کنار هم استفاده شوند.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">for number in range(1, 6):

    if number == 2:
        continue

    if number == 4:
        break

    print(number)</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">1
3</div>
</div>

<p>جریان اجرا:</p>

<div class="code-container">
<span class="code-label">Flow</span>
<div class="code-block no-prompt">1 → چاپ می‌شود
2 → continue → چاپ نمی‌شود
3 → چاپ می‌شود
4 → break → حلقه تمام می‌شود
5 → اصلاً اجرا نمی‌شود</div>
</div>

<p>
نکته مهم این است که <code>continue</code> فقط همان تکرار را رد می‌کند،
اما <code>break</code> اجرای کل حلقه را تمام می‌کند.
</p>

<hr class="lesson-divider">

<h2 class="lesson-title">7. Nested Loop — حلقه‌های تو‌در‌تو</h2>

<p>
گاهی لازم است یک حلقه را داخل حلقه دیگری قرار دهیم.
به این ساختار <strong>Nested Loop</strong> یا <strong>حلقه تو‌در‌تو</strong> می‌گوییم.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">for i in range(3):
    for j in range(2):
        print(i, j)</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">0 0
0 1
1 0
1 1
2 0
2 1</div>
</div>

<p>
نکته اصلی:
<strong>برای هر بار اجرای حلقه بیرونی، حلقه داخلی از ابتدا تا انتها اجرا می‌شود.</strong>
</p>

<p>مثلاً وقتی:</p>

<div class="code-container">
<span class="code-label">Flow</span>
<div class="code-block no-prompt">i = 0</div>
</div>

<p>حلقه داخلی کامل اجرا می‌شود:</p>

<div class="code-container">
<span class="code-label">Flow</span>
<div class="code-block no-prompt">j = 0
j = 1</div>
</div>

<p>
سپس <code>i</code> به <code>1</code> می‌رود و حلقه داخلی دوباره از <code>j = 0</code> شروع می‌شود.
</p>

<hr class="lesson-divider">

<h2 class="lesson-title">8. تعداد اجرا در Nested Loop</h2>

<p>
یکی از مهم‌ترین نکات Nested Loop، محاسبه تعداد دفعات اجرای دستور داخل حلقه است.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">for i in range(3):
    for j in range(2):
        print(i, j)</div>
</div>

<p>حلقه بیرونی:</p>

<div class="code-container">
<span class="code-label">Count</span>
<div class="code-block no-prompt">3 بار</div>
</div>

<p>حلقه داخلی برای هر بار:</p>

<div class="code-container">
<span class="code-label">Count</span>
<div class="code-block no-prompt">2 بار</div>
</div>

<p>بنابراین:</p>

<div class="code-container">
<span class="code-label">Formula</span>
<div class="code-block no-prompt">3 × 2 = 6</div>
</div>

<p>
پس <code>print()</code> در مجموع <strong>۶ بار</strong> اجرا می‌شود.
این روش محاسبه برای سؤال‌های خروجی بسیار مهم است.
</p>

<hr class="lesson-divider">

<h2 class="lesson-title">9. Nested Loop برای ساخت الگو</h2>

<p>
یکی از کاربردهای ساده Nested Loop ساخت جدول یا الگوهای تکراری است.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">for row in range(3):
    for col in range(4):
        print("*", end=" ")

    print()</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">* * * *
* * * *
* * * *</div>
</div>

<p>
در این مثال:
</p>

<ul>
    <li>حلقه بیرونی → تعداد ردیف‌ها</li>
    <li>حلقه داخلی → تعداد ستون‌ها</li>
</ul>

<p>
دستور <code>print("*", end=" ")</code> باعث می‌شود ستاره‌ها در همان خط چاپ شوند.
سپس <code>print()</code> به خط بعد می‌رود.
</p>

<hr class="lesson-divider">

<h2 class="lesson-title">10. <code>break</code> در Nested Loop</h2>

<p>
وقتی حلقه‌ها تو‌در‌تو هستند، محل قرار گرفتن <code>break</code> اهمیت زیادی دارد.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">for i in range(3):
    for j in range(3):

        if j == 1:
            break

        print(i, j)</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">0 0
1 0
2 0</div>
</div>

<p>
چون <code>break</code> داخل حلقه داخلی قرار دارد،
فقط همان حلقه داخلی را متوقف می‌کند.
حلقه بیرونی همچنان ادامه پیدا می‌کند.
</p>

<blockquote>
اگر <code>break</code> داخل حلقه داخلی باشد، به‌صورت عادی فقط همان حلقه داخلی متوقف می‌شود.
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">11. <code>zip()</code> — پیمایش هم‌زمان چند مجموعه</h2>

<p>
فرض کن دو لیست داریم:
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]
scores = [18, 20, 15]</div>
</div>

<p>
می‌خواهیم نام و نمره مربوط به هر شخص را هم‌زمان دریافت کنیم.
</p>

<p>روش معمول با Index:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">for i in range(len(names)):
    print(names[i], scores[i])</div>
</div>

<p>
اما Python راه ساده‌تری دارد:
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">for name, score in zip(names, scores):
    print(name, score)</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">Ali 18
Sara 20
Reza 15</div>
</div>

<p>
<code>zip()</code> عناصر مربوط به موقعیت یکسان را کنار هم قرار می‌دهد:
</p>

<div class="code-container">
<span class="code-label">Concept</span>
<div class="code-block no-prompt">(Ali, 18)
(Sara, 20)
(Reza, 15)</div>
</div>

بنابراین در هر تکرار:
</p>

<div class="code-container">

score ← نمره</div>

<h2 class="lesson-title">12. <code>zip()</code> با سه مجموعه</h2>

<p>
<code>zip()</code> محدود به دو مجموعه نیست.
می‌توانیم سه یا بیشتر مجموعه را نیز با هم پیمایش کنیم.

<h2 class="lesson-title">13. اگر طول مجموعه‌ها برابر نباشد چه می‌شود؟</h2>

<p>
در حالت معمول، <code>zip()</code> تا کوتاه‌ترین مجموعه ادامه پیدا می‌کند.

for name, score in zip(names, scores):

<div class="code-block no-prompt">names  → 3 عنصر
scores → 2 عنصر

zip() → 2 جفت</div>
</div>

<blockquote>

<h2 class="lesson-title">14. ترکیب <code>zip()</code> و <code>if</code></h2>

<p>
حالا می‌توانیم چند مفهوم قبلی را با هم ترکیب کنیم:

Reza Pass</div>
</div>

جریان برنامه ساده است:
</p>

<div class="code-container">
<span class="code-label">Flow</span>

<h2 class="lesson-title">15. ترکیب <code>zip()</code>، <code>continue</code> و <code>break</code></h2>

<p>
در این مرحله می‌توانیم تمام مفاهیم اصلی جلسه را در یک مسئله ترکیبی استفاده کنیم.
</p>

<p>
فرض کن اطلاعات دانش‌آموزان در دو لیست قرار دارد:
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">names = ["Ali", "Sara", "Reza", "Mina", "Omid"]
scores = [18, 7, 15, 20, 4]</div>
</div>

<p>قوانین برنامه:</p>

<ol>
    <li>اگر نمره کمتر از 5 بود، آن دانش‌آموز نادیده گرفته شود.</li>
    <li>اگر نمره 20 بود، بررسی متوقف شود.</li>
    <li>در غیر این صورت مشخص شود دانش‌آموز قبول شده یا مردود.</li>
</ol>

<p>راه‌حل:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">names = ["Ali", "Sara", "Reza", "Mina", "Omid"]
scores = [18, 7, 15, 20, 4]

for name, score in zip(names, scores):

    if score < 5:
        continue

    if score == 20:
        break

    if score >= 10:
        print(name, score, "Pass")
    else:
        print(name, score, "Fail")</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">Ali 18 Pass
Sara 7 Fail
Reza 15 Pass</div>
</div>

<p>
چرا <code>Mina</code> چاپ نشد؟
چون نمره او <code>20</code> بود و <code>break</code> باعث شد حلقه متوقف شود.
</p>

<p>
چرا <code>Omid</code> بررسی نشد؟
چون بعد از رسیدن به <code>Mina</code>، دیگر حلقه ادامه پیدا نکرد.
</p>

<div class="code-container">
<span class="code-label">Flow</span>
<div class="code-block no-prompt">names + scores
        ↓
      zip()
        ↓
   name + score
        ↓
    score < 5 ?
      /     \
    Yes      No
     ↓        ↓
 continue   score == 20 ?
              /      \
            Yes       No
             ↓         ↓
           break    score >= 10 ?
                       /      \
                    Pass      Fail</div>
</div>

<h2 class="lesson-title">16. یک نکته مهم درباره انتخاب دستور</h2>

<p>
برای انتخاب بین <code>break</code> و <code>continue</code> به هدف برنامه نگاه کن:

<tr>

</tr>

    <td><code>continue</code></td>

    <td>فعلاً برای این بخش کدی ندارم.</td>
    <td><code>pass</code></td>
</tr>
</tbody>
</table>
</div>

<p>مثلاً:</p>

  ↓
break

  ↓

TODO / Empty Block

<h2 class="lesson-title">17. ارتباط <code>enumerate()</code> و <code>zip()</code></h2>

<p>
در جلسه قبل با <code>enumerate()</code> آشنا شدیم.
حالا تفاوت آن با <code>zip()</code> را دقیق مشخص کنیم.
</p>

<div class="table-wrap">
<table>
<thead>
<tr>
    <th>ابزار</th>
    <th>کاربرد</th>
</tr>
</thead>
<tbody>
<tr>
    <td><code>enumerate()</code></td>
    <td>Index + Value از یک مجموعه</td>
</tr>
<tr>
    <td><code>zip()</code></td>
    <td>Valueهای چند مجموعه در کنار هم</td>
</tr>
</tbody>
</table>
</div>

<p>مثال <code>enumerate()</code>:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

for index, name in enumerate(names):
    print(index, name)</div>
</div>

<p>مثال <code>zip()</code>:</p>

<div class="code-container">

</p>

<div class="code-container">
<span class="code-label">Exam Tip</span>

zip       → Value از چند مجموعه</div>
