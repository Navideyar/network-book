<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دوره Python · ZeroDay</title>

    <!-- فونت‌ها -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- CodeMirror (editor) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />

    <style>
        /* ===== متغیرهای CSS ===== */
        :root {
            --primary: #306998;
            --primary-hover: #1d4b6e;
            --primary-soft: #d1e0f0;
            --primary-glow: rgba(48, 105, 152, 0.25);
            --link: #245f96;
            --link-hover: #17466f;

            --bg-body: #f5f7fa;
            --bg-card: #ffffff;
            --bg-navbar: rgba(255, 255, 255, 0.92);
            --bg-code: #1e293b;
            --bg-toc-hover: #eef4fb;

            --text-main: #2d3748;
            --text-heading: #1a202c;
            --text-muted: #4a5568;

            --border: #e2e8f0;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --radius-sm: 10px;

            --note-bg: #e6ffed;
            --note-border: #2b8a3e;
            --important-bg: #e3f2fd;
            --important-border: #1976d2;
            --warning-bg: #fff8e1;
            --warning-border: #f57c00;

            --code-text: #e2e8f0;
            --terminal-green: #8ae234;
            --sidebar-width: 300px;
        }

        [data-theme="dark"] {
            --primary: #4d8dc7;
            --primary-hover: #5fa3d9;
            --primary-soft: rgba(77, 141, 199, 0.15);
            --primary-glow: rgba(77, 141, 199, 0.25);
            --link: #7fc4ff;
            --link-hover: #a9d9ff;

            --bg-body: #1a1e26;
            --bg-card: #242a36;
            --bg-navbar: rgba(30, 34, 44, 0.95);
            --bg-code: #0f131a;
            --bg-toc-hover: rgba(77, 141, 199, 0.12);

            --text-main: #e2e8f0;
            --text-heading: #f0f4fa;
            --text-muted: #a0aec0;

            --border: #3a4050;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);

            --note-bg: rgba(43, 138, 62, 0.15);
            --note-border: #5fbf7a;
            --important-bg: rgba(25, 118, 210, 0.15);
            --important-border: #64b5f6;
            --warning-bg: rgba(245, 124, 0, 0.15);
            --warning-border: #ffb74d;

            --code-text: #e2e8f0;
        }

        /* ===== ریست و پایه ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            overflow-x: hidden;
            max-width: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.8;
            font-size: 16.5px;
            padding-top: 64px;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            max-width: 100%;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== نوار بالا ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-navbar);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
            z-index: 1000;
            transition: background 0.3s, border-color 0.3s;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            white-space: nowrap;
        }
        .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
        }
        .nav-spacer {
            flex: 1;
        }
        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .theme-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        /* ===== نوار پیشرفت ===== */
        .progress-track {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            z-index: 999;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #7ab7e0);
            width: 0%;
            transition: width 0.15s;
        }

        /* ===== سایدبار ===== */
        .sidebar {
            position: fixed;
            top: 60px;
            right: 0;
            width: var(--sidebar-width);
            height: calc(100vh - 60px);
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            z-index: 900;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s, border-color 0.3s;
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.04);
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg-card);
            z-index: 2;
        }
        .sidebar-header h3 {
            font-size: 1rem;
            color: var(--text-heading);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-header h3 i {
            color: var(--primary);
        }
        .sidebar-close {
            display: none;
            background: none;
            border: none;
            font-size: 1.15rem;
            color: var(--text-muted);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: 0.2s;
        }
        .sidebar-close:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }

        /* ===== فهرست مطالب ===== */
        .toc {
            padding: 8px 0 30px;
        }
        .toc-chapter {
            border-bottom: 1px solid var(--border);
        }
        .toc-chapter:last-child {
            border-bottom: none;
        }
        .toc-chapter summary {
            padding: 12px 14px;
            font-weight: 600;
            color: var(--text-heading);
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: background 0.15s;
            user-select: none;
            font-size: 0.92rem;
            line-height: 1.4;
            border-radius: 0;
        }
        .toc-chapter summary::-webkit-details-marker {
            display: none;
        }
        .toc-chapter summary::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            margin-right: auto;
            margin-top: 2px;
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: transform 0.25s;
            flex-shrink: 0;
        }
        .toc-chapter[open] summary::after {
            transform: rotate(180deg);
        }
        .toc-chapter summary:hover {
            background: var(--bg-toc-hover);
        }
        .toc-chapter[open]>summary {
            background: var(--primary-soft);
            color: var(--primary);
        }
        .chapter-num {
            width: 24px;
            height: 24px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .toc-sections {
            list-style: none;
            padding: 0 0 8px 0;
            margin: 0;
            background: var(--bg-body);
        }
        .toc-sections li a {
            display: block;
            padding: 8px 14px 8px 48px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.15s;
            border-right: 3px solid transparent;
            line-height: 1.45;
        }
        .toc-sections li a:hover {
            color: var(--primary);
            background: var(--bg-toc-hover);
        }
        .toc-sections li a.active {
            color: var(--primary);
            background: var(--primary-soft);
            border-right-color: var(--primary);
            font-weight: 600;
        }

        .toc-practice {
            display: block;
            padding: 0;
            margin-top: 2px;
            font-size: 0.83rem;
            line-height: 1.45;
        }

        .toc-practice a {
            display: block;
            padding: 8px 14px 10px 48px;
            color: var(--link);
            text-decoration: none;
            border-right: 3px solid transparent;
            cursor: pointer;
        }

        .toc-practice a:hover {
            color: var(--link-hover);
            background: var(--primary-soft);
            border-right-color: var(--primary);
        }

        .toc-practice i {
            color: inherit;
            margin-left: 5px;
            font-size: 0.8rem;
        }

        /* ===== دکمه باز کردن سایدبار ===== */
        .sidebar-toggle {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            font-size: 1.25rem;
            box-shadow: 0 6px 20px var(--primary-glow);
            z-index: 950;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }
        .sidebar-toggle:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 850;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.open {
            display: block;
        }

        /* ===== محتوای اصلی ===== */
        .main {
            max-width: 820px;
            margin: 0 auto;
            margin-right: calc(var(--sidebar-width) + 24px);
            padding: 32px 24px 80px;
            transition: margin 0.3s;
            min-width: 0;
            width: 100%;
            overflow-x: hidden;
        }
        .section {
            display: none;
            animation: fadeIn 0.35s ease;
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }
        .section.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== هدر بخش ===== */
        .section-header {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
            transition: background 0.3s, border-color 0.3s;
        }
        .section-header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background: var(--primary);
        }
        .section-badge {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .section-header h1 {
            font-size: 1.3rem;
            color: var(--text-heading);
            margin-bottom: 3px;
            line-height: 1.4;
        }
        .section-header .meta {
            font-size: 0.84rem;
            color: var(--text-muted);
        }

        /* ===== تایپوگرافی ===== */
        h2 {
            color: var(--text-heading);
            font-size: 1.25rem;
            margin: 32px 0 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            flex-shrink: 0;
        }
        h3 {
            color: var(--text-heading);
            font-size: 1.05rem;
            margin: 20px 0 8px;
        }

        .lesson-title {
            color: var(--text-heading);
            margin-top: 30px;
        }
        p {
            margin-bottom: 14px;
            text-align: justify;
        }
        strong {
            color: var(--text-heading);
        }

        /* ===== تمرینات فصل ===== */
        .exercise-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.65);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }

        .exercise-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .exercise-modal-content {
            position: relative;
            width: min(420px, 100%);
            padding: 32px 24px;
            text-align: center;
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
        }

        .exercise-modal-close {
            position: absolute;
            top: 8px;
            left: 12px;
            border: 0;
            background: transparent;
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
        }

        .exercise-modal-icon {
            color: var(--primary);
            font-size: 30px;
            margin-bottom: 10px;
        }

        .exercise-modal-content h2 {
            margin: 0 0 8px;
            color: var(--text-heading);
        }

        .exercise-modal-chapter {
            margin: 0 0 18px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .exercise-modal-message {
            margin: 0;
            color: var(--link);
            font-weight: 600;
        }

        /* ===== لینک‌ها ===== */
        a {
            color: var(--link);
            text-decoration-thickness: 1px;
            text-underline-offset: 2px;
            transition: color 0.15s, background 0.15s;
        }

        a:hover {
            color: var(--link-hover);
        }

        /* لینک‌های فهرست ظاهر اختصاصی خودشان را حفظ می‌کنند */
        .toc-sections li a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .toc-sections li a:hover,
        .toc-sections li a.active {
            color: var(--primary);
        }
        ul,
        ol {
            margin: 10px 0 18px;
            padding-right: 24px;
        }
        li {
            margin-bottom: 6px;
        }
        blockquote {
            background: var(--primary-soft);
            border-right: 4px solid var(--primary);
            padding: 14px 18px;
            margin: 20px 0;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            color: var(--text-heading);
            font-style: italic;
            transition: background 0.3s, border-color 0.3s;
        }

        /* ===== جعبه‌های اطلاعاتی ===== */
        .box {
            display: flex;
            gap: 14px;
            padding: 16px 18px;
            border-radius: var(--radius-sm);
            margin: 22px 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            transition: background 0.3s, border-color 0.3s;
        }
        .box>div {
            min-width: 0;
            flex: 1;
            overflow-wrap: break-word;
        }
        .box i {
            font-size: 1.3rem;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .box strong {
            display: block;
            margin-bottom: 3px;
        }
        .box.note {
            background: var(--note-bg);
            border-color: var(--note-border);
        }
        .box.note i,
        .box.note strong {
            color: var(--note-border);
        }
        .box.important {
            background: var(--important-bg);
            border-color: var(--important-border);
        }
        .box.important i,
        .box.important strong {
            color: var(--important-border);
        }
        .box.warning {
            background: var(--warning-bg);
            border-color: var(--warning-border);
        }
        .box.warning i,
        .box.warning strong {
            color: var(--warning-border);
        }

        /* ===== کد ===== */
        .code-container {
            position: relative;
            margin: 24px 0;
            max-width: 100%;
            min-width: 0;
            width: 100%;
        }
        .code-label {
            position: absolute;
            top: -11px;
            left: 14px;
            background: var(--primary);
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 14px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            z-index: 1;
            letter-spacing: 0.3px;
        }
        .code-block {
            background: var(--bg-code);
            color: var(--code-text);
            padding: 28px 18px 18px;
            border-radius: var(--radius-sm);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            direction: ltr;
            text-align: left;
            unicode-bidi: isolate;
            white-space: pre;
            overflow-x: auto;
            border: 1px solid var(--border);
            max-width: 100%;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
            transition: background 0.3s, border-color 0.3s;
            line-height: 1.6;
        }
        .code-block::before {
            content: '>>> ';
            color: var(--terminal-green);
        }
        .code-block.no-prompt::before {
            content: none;
        }

        /* ===== جدول ===== */
        .table-wrap {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 22px 0;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0;
            font-size: 0.93rem;
            border-radius: var(--radius-sm);
            overflow: hidden;
            min-width: 0;
        }
        th,
        td {
            border: 1px solid var(--border);
            padding: 11px 14px;
            text-align: right;
            vertical-align: top;
        }
        th {
            background: var(--primary-soft);
            color: var(--text-heading);
            font-weight: 600;
            white-space: nowrap;
        }
        tr:hover td {
            background: var(--bg-body);
        }
        td code {
            white-space: nowrap;
        }

        /* ===== جمع‌بندی ===== */
        .summary-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            margin: 24px 0;
            box-shadow: var(--shadow);
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            transition: background 0.3s, border-color 0.3s;
        }
        .summary-box h3 {
            margin-top: 0;
            color: var(--primary);
        }

        /* ===== کوئیز ===== */
        .quiz-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            margin: 28px 0 16px;
            box-shadow: var(--shadow);
            transition: background 0.3s, border-color 0.3s;
        }
        .quiz-card>p {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-heading);
            margin-bottom: 16px;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .quiz-options button {
            background: var(--bg-body);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            text-align: right;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.2s;
        }
        .quiz-options button:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        .quiz-options button.selected {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .quiz-answer {
            display: none;
            margin-top: 14px;
            padding: 14px 16px;
            background: var(--note-bg);
            border-radius: var(--radius-sm);
            border-right: 4px solid var(--note-border);
            color: var(--text-heading);
            font-size: 0.95rem;
            transition: background 0.3s, border-color 0.3s;
        }
        .quiz-answer.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        /* ===== ویرایشگر پایتون (Playground) ===== */
        .python-playground {
            margin: 24px 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
            background: #1e1e2e;
            border: 1px solid #313244;
            direction: ltr;
            max-width: 100%;
        }
        .playground-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #181825;
            padding: 10px 14px;

<h2 class="lesson-title">10. تابع <code>type()</code></h2>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">x = 10

<!-- ==================== 12 ==================== -->
<h2 class="lesson-title">12. Dynamic Typing در Python</h2>

<p>
    در Python لازم نیست هنگام ساخت Variable نوع آن را از قبل مشخص کنیم.
</p>

<p>مثلاً در زبان‌هایی با Syntax مشابه این را نمی‌نویسیم:</p>

<div class="code-container">
    <span class="code-label">Code</span>
    <div class="code-block no-prompt">int age = 25</div>
</div>

<p>در Python کافی است بنویسیم:</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">age = 25</div>
</div>

<p>
    Python نوع مقدار را تشخیص می‌دهد.
</p>

<p>
    حتی یک Variable می‌تواند بعداً به مقدار دیگری با Type متفاوت نسبت داده شود:
</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">x = 10
print(type(x))

x = "Hello"
print(type(x))</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">&lt;class 'int'&gt;
&lt;class 'str'&gt;</div>
</div>

<blockquote>
    Python دارای <strong>Dynamic Typing</strong> است؛
    Variable مجبور نیست همیشه به یک Type ثابت محدود باشد.
</blockquote>

3
1
8</div>
</div>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">10 / 3  → 3.333...
10 // 3 → 3
10 % 3  → 1</div>
</div>

<h3>کاربرد مهم <code>%</code></h3>

<p>با <code>%</code> می‌توانیم زوج یا فرد بودن عدد را بررسی کنیم:</p>

<div class="code-container">

<div class="code-block no-prompt">number = 8

<th>Operator</th>

</div>

<p>مثلاً:</p>

<h2 class="lesson-title">8. Comparison Operators</h2>

<p>Comparison برای مقایسه مقدارهاست و نتیجه آن معمولاً <code>True</code> یا <code>False</code> است.</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Operator</th>
<th>معنی</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>==</code></td>
<td>برابر است؟</td>
</tr>
<tr>
<td><code>!=</code></td>
<td>نابرابر است؟</td>
</tr>
<tr>
<td><code>&gt;</code></td>
<td>بزرگ‌تر است؟</td>
</tr>
<tr>
<td><code>&lt;</code></td>
<td>کوچک‌تر است؟</td>
</tr>
<tr>
<td><code>&gt;=</code></td>
<td>بزرگ‌تر یا مساوی است؟</td>
</tr>
<tr>
<td><code>&lt;=</code></td>
<td>کوچک‌تر یا مساوی است؟</td>
</tr>
</tbody>
</table>
</div>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">age = 20

print(age == 20)
print(age &gt; 18)
print(age &lt; 18)
print(age != 25)</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">True
True
False
True</div>
</div>

<h3>کاربرد واقعی</h3>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">age = 20

allowed = age &gt;= 18

print(allowed)</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">True</div>
</div>

<p>یعنی یک Comparison می‌تواند نتیجه‌ای تولید کند که بعداً در شرط‌ها استفاده شود.</p>

<h2 class="lesson-title">9. Logical Operators</h2>

<th>B</th>

<tr>
<th>A</th>
<th>B</th>

</tr>

</table>
</div>

<div class="code-container">

result = age &gt;= 18 or has_permission

</div>

<div class="code-container">

</div>

<h3><code>not</code></h3>

<h2 class="lesson-title">11. Membership Operators</h2>

<p>Membership بررسی می‌کند که آیا یک مقدار <strong>داخل یک مجموعه یا Sequence</strong> وجود دارد یا نه.</p>

<div class="table-wrap">

<tr>
<th>Operator</th>
<th>معنی</th>
</tr>

<h1 class="lesson-title section-troubleshoot">اشتباهات رایج</h1>

<h3>اشتباه ۱ — <code>=</code> به جای <code>==</code></h3>

<div class="code-container">

<div class="code-block no-prompt">age = 18</div>

<p>این کد مقداردهی است، نه مقایسه.</p>

<div class="code-container">

<h2 class="lesson-title">5. <code>input()</code> — دریافت اطلاعات از کاربر</h2>

<p>برای دریافت اطلاعات از کاربر از <code>input()</code> استفاده می‌کنیم.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">name = input()</div>
</div>

<p>برنامه در اینجا منتظر می‌ماند تا کاربر چیزی وارد کند. مقدار واردشده در Variable قرار می‌گیرد.</p>

<p>معمولاً بهتر است سؤال را نیز به کاربر نمایش دهیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">name = input("What is your name? ")

print(name)</div>
</div>

<p>اگر کاربر <code>Ali</code> وارد کند، مقدار <code>name</code> برابر <code>"Ali"</code> خواهد بود.</p>

<p>در نتیجه می‌توانیم اولین برنامه تعاملی خود را این‌طور بنویسیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">name = input("What is your name? ")

print("Hello", name)</div>
</div>

<p>جریان برنامه:</p>

<div class="code-container">
<span class="code-label">Flow</span>

دریافت اطلاعات
   ↓
Variable
   ↓
print()
   ↓
نمایش نتیجه</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">6. نکته بسیار مهم: <code>input()</code> همیشه <code>str</code> برمی‌گرداند</h2>

<p>این مهم‌ترین نکته این جلسه است:</p>

<blockquote>
<strong>مقدار برگشتی <code>input()</code> همیشه از نوع <code>str</code> است.</strong>
</blockquote>

<p>حتی اگر کاربر یک عدد وارد کند:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">age = input("Age: ")

print(type(age))</div>
</div>

<p>اگر کاربر <code>20</code> وارد کند، مقدار واقعی:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">"20"</div>
</div>

<p>است، نه:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">20</div>
</div>

<p>بنابراین:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">&lt;class 'str'&gt;</div>
</div>

<p>این موضوع زمانی مهم می‌شود که بخواهیم روی ورودی عملیات عددی انجام دهیم.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">7. Input + Type Casting</h2>

<p>در جلسه ۳ یاد گرفتیم که با Type Casting می‌توانیم نوع داده را تغییر دهیم.</p>

<p>پس اگر ورودی ما باید عدد باشد، آن را هنگام دریافت تبدیل می‌کنیم.</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>نوع داده موردنیاز</th>
<th>روش دریافت</th>
</tr>
</thead>
<tbody>
<tr>
<td>متن</td>
<td><code>input()</code></td>
</tr>
<tr>
<td>عدد صحیح</td>
<td><code>int(input())</code></td>
</tr>
<tr>
<td>عدد اعشاری</td>
<td><code>float(input())</code></td>
</tr>
</tbody>
</table>
</div>

<h3>عدد صحیح</h3>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">age = int(input("Age: "))

print(age + 5)</div>
</div>

<p>اگر کاربر <code>20</code> وارد کند، ابتدا <code>input()</code> مقدار <code>"20"</code> را می‌دهد و سپس <code>int()</code> آن را به <code>20</code> تبدیل می‌کند.</p>

<div class="code-container">
<span class="code-label">Flow</span>
<div class="code-block no-prompt">input()
   ↓
"20"
   ↓
int()
   ↓
20
   ↓
age + 5
   ↓
25</div>
</div>

<h3>عدد اعشاری</h3>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">price = float(input("Price: "))

print(price)</div>
</div>

<p>اگر کاربر <code>19.5</code> وارد کند، مقدار <code>price</code> از نوع <code>float</code> خواهد بود.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">8. چرا Type Casting مهم است؟</h2>

<p>فرض کن دو عدد از کاربر دریافت می‌کنیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">a = input()
b = input()

print(a + b)</div>
</div>

<p>اگر ورودی‌ها <code>10</code> و <code>20</code> باشند، خروجی:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">1020</div>
</div>

<p>چون Python در واقع این عملیات را انجام داده است:</p>

<div class="code-container">
<span class="code-label">Concept</span>
<div class="code-block no-prompt">"10" + "20"
     ↓
"1020"</div>
</div>

<p>این <strong>جمع عددی نیست</strong>؛ اتصال دو String است.</p>

<p>اگر جمع عددی می‌خواهیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">a = int(input())
b = int(input())

print(a + b)</div>
</div>

<p>حالا:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">30</div>
</div>

<div class="code-container">
<span class="code-label">نکته کلیدی</span>
<div class="code-block no-prompt">input() → String

برای محاسبه عددی:
int(input())
یا
float(input())</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">9. ترکیب Input + Casting + Operators</h2>

<p>اینجا مطالب چند جلسه به یکدیگر متصل می‌شوند:</p>

<div class="code-container">
<span class="code-label">Connection</span>
<div class="code-block no-prompt">Variables + Data Types
        ↓
Type Casting
        ↓
Operators
        ↓
Input / Output</div>
</div>

<p>مثلاً برنامه‌ای که یک عدد دریافت کرده و دو برابر آن را نمایش دهد:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">number = int(input("Enter a number: "))

result = number * 2

print(result)</div>
</div>

<p>اگر ورودی <code>7</code> باشد:</p>

<div class="code-container">
<span class="code-label">Flow</span>
<div class="code-block no-prompt">"7"
 ↓
int()
 ↓
7
 ↓
7 * 2
 ↓
14
 ↓
print()</div>
</div>

<p>این الگو یکی از مهم‌ترین الگوهای برنامه‌های ساده Python است:</p>

<div class="code-container">
<span class="code-label">Pattern</span>
<div class="code-block no-prompt">Input
  ↓
Convert
  ↓
Process
  ↓
Output</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">10. دریافت چند ورودی</h2>

<p>یک برنامه می‌تواند چند ورودی از کاربر دریافت کند.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">name = input("Name: ")
age = int(input("Age: "))

print("Name:", name)
print("Age:", age)</div>
</div>

<p>در این مثال:</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Variable</th>
<th>ورودی</th>
<th>نوع</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>name</code></td>
<td>نام</td>
<td><code>str</code></td>
</tr>
<tr>
<td><code>age</code></td>
<td>سن</td>
<td><code>int</code></td>
</tr>
</tbody>
</table>
</div>

<p>نکته مهم این است که نوع داده را بر اساس <strong>نوع اطلاعاتی که می‌خواهیم پردازش کنیم</strong> انتخاب می‌کنیم.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">11. ساخت خروجی خوانا</h2>

<p>خروجی برنامه بهتر است برای کاربر واضح باشد.</p>

<p>مثلاً:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">age = 20

print(age)</div>
</div>

<p>کار می‌کند، اما مشخص نیست این عدد مربوط به چیست.</p>

<p>بهتر:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">print("Your age is:", age)</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">Your age is: 20</div>
</div>

<p>همچنین می‌توانیم چند مقدار را با <code>print()</code> ترکیب کنیم:</p>

<div class="code-container">

<div class="code-block no-prompt">name = "Ali"
score = 18

print("Name:", name, "Score:", score)</div>
</div>

<p>پس هدف فقط «چاپ کردن» نیست؛ خروجی باید <strong>خوانا و قابل‌فهم</strong> باشد.</p>

<h2 class="lesson-title">🔄 Recall سریع</h2>

<p>بدون نگاه کردن به درس جواب بده:</p>

<ol>
<li><code>input()</code> و <code>print()</code> چه کاری انجام می‌دهند؟</li>
<li><code>input()</code> چه نوع داده‌ای برمی‌گرداند؟</li>
<li>اگر کاربر <code>25</code> وارد کند، آیا مقدار آن <code>25</code> است یا <code>"25"</code>؟</li>

<li>برای دریافت عدد اعشاری چه می‌نویسیم؟</li>
<li><code>sep</code> چه چیزی را کنترل می‌کند؟</li>
<li><code>end</code> چه چیزی را کنترل می‌کند؟</li>
<li>چرا <code>"5" + "3"</code> برابر <code>"53"</code> است؟</li>
<li>الگوی کلی یک برنامه تعاملی ساده چیست؟</li>
</ol>

<p>اگر بتوانی این موارد را توضیح بدهی، هسته جلسه ۵ را یاد گرفته‌ای.</p>

<h1 class="lesson-title section-scenario">سناریوی ترکیبی — فاکتور ساده فروشگاه</h1>

</div>

<h3>مرحله ۲ — دریافت قیمت</h3>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">price = float(input("Price: "))</div>
</div>

<div class="code-container">

<td><code>input()</code></td>
<td>همیشه <code>str</code> برمی‌گرداند</td>
</tr>
<tr>
<td><code>int(input())</code></td>
<td>دریافت عدد صحیح</td>
</tr>
<tr>
<td><code>float(input())</code></td>
<td>دریافت عدد اعشاری</td>
</tr>
<tr>
<td><code>sep</code></td>
<td>جداکننده بین مقادیر <code>print()</code></td>
</tr>
<tr>
<td><code>end</code></td>
<td>مقدار قرارگرفته در انتهای <code>print()</code></td>
</tr>
</tbody>
</table>
</div>

<p>مهم‌ترین الگوی این جلسه را حفظ کن:</p>

<div class="code-container">

<div class="code-block no-prompt">Input
  ↓
Type Casting
  ↓
Variable
  ↓
Operator / Processing
  ↓
Result
  ↓
print()</div>
</div>

<p>مثلاً:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">number = int(input("Number: "))
result = number * 2
print(result)</div>
</div>

<p>تا اینجا ابزارهای اصلی لازم برای ساخت برنامه‌های ساده را داریم. در <strong>جلسه ۶ — Strings</strong> وارد یکی از مهم‌ترین Data Typeهای Python می‌شویم و یاد می‌گیریم با متن‌ها کار کنیم: <strong>Indexing، Slicing، Methods و f-string</strong>.</p>`
,
"ch6-1":`
<div class="section-header">

        <h1>Strings در Python</h1>

<hr class="lesson-divider">

<h2 class="lesson-title">معرفی جلسه</h2>

<p>
در جلسه قبل با <code>input()</code> و <code>print()</code> یاد گرفتیم که برنامه می‌تواند
با کاربر تعامل داشته باشد.
اما مقدار زیادی از اطلاعاتی که برنامه‌ها دریافت و پردازش می‌کنند، <strong>متن</strong> هستند.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">name = "Ali"
city = "Tehran"
message = "Hello Python"</div>
</div>

<p>
در Python به داده‌های متنی <strong>String</strong> یا <code>str</code> می‌گوییم.
در این جلسه یاد می‌گیریم چگونه داخل String حرکت کنیم، بخشی از آن را جدا کنیم،
متن را پردازش کنیم و در نهایت آن را همراه با متغیرها در خروجی نمایش دهیم.
</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">String
  │
  ├── Indexing  → دسترسی به یک کاراکتر
  │
  ├── Slicing   → استخراج بخشی از متن
  │
  ├── Methods   → پردازش متن
  │
  └── f-string  → ساخت متن خوانا</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">1. String چیست؟</h2>

<p>
<strong>String</strong> داده‌ای است که برای نگهداری متن و مجموعه‌ای از کاراکترها استفاده می‌شود.
</p>

<p>برای ساخت String معمولاً از کوتیشن تکی یا دوتایی استفاده می‌کنیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">name = "Ali"
city = 'Tehran'</div>
</div>

<p>هر دو صحیح هستند.</p>

<p>نوع داده را نیز می‌توانیم با <code>type()</code> بررسی کنیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">name = "Ali"

print(type(name))</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">&lt;class 'str'&gt;</div>
</div>

<p>پس:</p>

<div class="code-container">
<span class="code-label">Recall</span>
<div class="code-block no-prompt">"Ali" → str</div>
</div>

<div class="lesson-note">
<strong>نکته:</strong>
کوتیشن شروع و پایان String باید با هم هماهنگ باشند.
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">2. طول String با <code>len()</code></h2>

<p>
برای فهمیدن تعداد کاراکترهای یک String از <code>len()</code> استفاده می‌کنیم.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">word = "Python"

print(len(word))</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">6</div>
</div>

<p>
دقت کن که <code>len()</code> تعداد کاراکترها را می‌دهد، اما Indexها از <strong>0</strong> شروع می‌شوند.
</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">String:  P   y   t   h   o   n
Index:   0   1   2   3   4   5</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">3. Indexing — دسترسی به یک کاراکتر</h2>

<p>
هر کاراکتر داخل String یک <strong>Index</strong> دارد.
برای دسترسی به یک کاراکتر از <code>[]</code> استفاده می‌کنیم.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">word = "Python"

print(word[0])
print(word[1])
print(word[5])</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">P
y
n</div>
</div>

<p>پس:</p>

<div class="code-container">
<span class="code-label">Recall</span>
<div class="code-block no-prompt">word[0] → P
word[1] → y
word[2] → t
word[3] → h
word[4] → o
word[5] → n</div>
</div>

<div class="lesson-note">
<strong>نکته امتحانی:</strong>
Index در Python از <code>0</code> شروع می‌شود، نه 1.
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">4. Index منفی</h2>

<p>
Python اجازه می‌دهد از انتهای String نیز به کاراکترها دسترسی داشته باشیم.
</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">String:     P    y    t    h    o    n
Positive:   0    1    2    3    4    5
Negative:  -6   -5   -4   -3   -2   -1</div>
</div>

<p>مهم‌ترین حالت:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">word = "Python"

print(word[-1])
print(word[-2])</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">n
o</div>
</div>

<div class="code-container">
<span class="code-label">Recall</span>
<div class="code-block no-prompt">[0]   → اولین کاراکتر
[-1]  → آخرین کاراکتر</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">5. اگر Index اشتباه باشد</h2>

<p>
اگر Indexای را استفاده کنیم که در String وجود ندارد، با <code>IndexError</code> مواجه می‌شویم.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">word = "Python"

print(word[10])</div>
</div>

<div class="code-container">
<span class="code-label">Error</span>
<div class="code-block no-prompt">IndexError: string index out of range</div>
</div>

<p>
چون String بالا فقط Indexهای <code>0</code> تا <code>5</code> دارد.
</p>

<hr class="lesson-divider">

<h2 class="lesson-title">6. Slicing — استخراج بخشی از String</h2>

<p>
<strong>Indexing</strong> یک کاراکتر را برمی‌گرداند.
اما اگر بخواهیم چند کاراکتر را با هم برداریم، از <strong>Slicing</strong> استفاده می‌کنیم.
</p>

<p>ساختار:</p>

<div class="code-container">
<span class="code-label">Syntax</span>
<div class="code-block no-prompt">text[start:end]</div>
</div>

<div class="lesson-important">
<strong>قانون طلایی:</strong>
<code>start</code> شامل می‌شود، اما <code>end</code> شامل نمی‌شود.
</div>

<p>مثلاً:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">word = "Python"

print(word[0:2])</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">Py</div>
</div>

<p>چون Indexهای 0 و 1 انتخاب شده‌اند و در Index 2 متوقف می‌شویم.</p>

<div class="code-container">
<span class="code-label">Recall</span>
<div class="code-block no-prompt">0 → P
1 → y
2 → توقف</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">7. حالت‌های مهم Slicing</h2>

<h3>از ابتدا</h3>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">word = "Python"

print(word[:3])</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">Pyt</div>
</div>

<p><code>word[:3]</code> یعنی از ابتدا تا قبل از Index 3.</p>

<h3>از یک Index تا انتها</h3>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">print(word[2:])</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">thon</div>
</div>

<h3>کل String</h3>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">print(word[:])</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">Python</div>
</div>

<div class="code-container">
<span class="code-label">Recall</span>
<div class="code-block no-prompt">text[start:end]
text[:end]
text[start:]
text[:]</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">8. Slicing با <code>step</code></h2>

<p>
Slicing می‌تواند یک مقدار سوم به نام <code>step</code> نیز داشته باشد.
</p>

<div class="code-container">
<span class="code-label">Syntax</span>
<div class="code-block no-prompt">text[start:end:step]</div>
</div>

<p>مثلاً:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">word = "Python"

print(word[0:6:2])</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">Pto</div>
</div>

<p>
یعنی با گام 2 حرکت می‌کنیم و یک کاراکتر در میان انتخاب می‌شود.
</p>

<hr class="lesson-divider">

<h2 class="lesson-title">9. برعکس کردن String</h2>

<p>
یکی از کاربردهای مهم Step منفی، برعکس کردن String است.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">word = "Python"

print(word[::-1])</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">nohtyP</div>
</div>

<div class="code-container">
<span class="code-label">Recall</span>
<div class="code-block no-prompt">text[0]     → اولین کاراکتر
text[-1]    → آخرین کاراکتر
text[:3]    → سه کاراکتر اول
text[2:]    → از Index 2 تا انتها
text[::2]   → یک کاراکتر در میان
text[::-1]  → برعکس</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">10. Stringها Immutable هستند</h2>

<p>
یکی از ویژگی‌های مهم String در Python این است که <strong>immutable</strong> است.
</p>

<p>
یعنی بعد از ساخته شدن String، نمی‌توانیم یک کاراکتر مشخص آن را مستقیماً تغییر دهیم.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">word = "Python"

word[0] = "J"</div>
</div>

<p>این کد با <code>TypeError</code> مواجه می‌شود.</p>

<p>اگر بخواهیم String جدیدی بسازیم، می‌توانیم مقدار جدید را ایجاد کنیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">word = "Python"

word = "J" + word[1:]

print(word)</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">Jython</div>
</div>

<div class="lesson-important">
<strong>نکته:</strong>
String را مستقیماً تغییر نمی‌دهیم؛ معمولاً یک String جدید ایجاد می‌کنیم.
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">11. String Methods</h2>

<p>
Python متدهای زیادی برای پردازش String دارد.
در این دوره لازم نیست همه آن‌ها را حفظ کنی؛ چند مورد پرکاربرد کافی است.
</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Method</th>
<th>کاربرد</th>
</tr>
</thead>
<tbody>
<tr><td><code>upper()</code></td><td>حروف بزرگ</td></tr>
<tr><td><code>lower()</code></td><td>حروف کوچک</td></tr>
<tr><td><code>strip()</code></td><td>حذف فاصله ابتدا و انتها</td></tr>
<tr><td><code>replace()</code></td><td>جایگزینی متن</td></tr>
<tr><td><code>find()</code></td><td>پیدا کردن Index</td></tr>
<tr><td><code>count()</code></td><td>شمارش تکرار</td></tr>

<tr><td><code>endswith()</code></td><td>بررسی پایان متن</td></tr>
</tbody>
</table>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">12. <code>upper()</code> و <code>lower()</code></h2>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">text = "Python"

print(text.upper())
print(text.lower())</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">PYTHON
python</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">13. <code>strip()</code> — حذف فاصله‌های اضافی</h2>

<p>
<code>strip()</code> فاصله‌های ابتدا و انتهای String را حذف می‌کند.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">name = "   Ali   "

print(name.strip())</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">Ali</div>
</div>

<p>
دقت کن که <code>strip()</code> فاصله‌های وسط متن را حذف نمی‌کند.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">text = "Hello World"

print(text.strip())</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">Hello World</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">14. <code>replace()</code> — جایگزینی متن</h2>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">text = "I like Java"

new_text = text.replace("Java", "Python")

print(new_text)</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">I like Python</div>
</div>

<p>ساختار:</p>

<div class="code-container">
<span class="code-label">Syntax</span>
<div class="code-block no-prompt">text.replace(old, new)</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">15. <code>find()</code> — پیدا کردن Index</h2>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">text = "I love Python"

print(text.find("Python"))</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">7</div>
</div>

<p>
اگر عبارت پیدا نشود، <code>find()</code> مقدار <code>-1</code> برمی‌گرداند.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">text = "Hello"

print(text.find("Python"))</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">-1</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">16. <code>count()</code></h2>

<p>
با <code>count()</code> تعداد تکرار یک عبارت را پیدا می‌کنیم.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">text = "banana"

print(text.count("a"))</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">3</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">17. <code>startswith()</code> و <code>endswith()</code></h2>

<p>
این دو متد برای بررسی شروع و پایان String استفاده می‌شوند و نتیجه آن‌ها <code>bool</code> است.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">filename = "python.py"

print(filename.startswith("python"))
print(filename.endswith(".py"))</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">True
True</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">18. یک نکته مهم درباره String Methods</h2>

<p>
بسیاری از متدهای String مقدار اصلی را مستقیماً تغییر نمی‌دهند؛ بلکه یک String جدید برمی‌گردانند.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">text = "python"

text.upper()

print(text)</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">python</div>
</div>

<p>
اگر نتیجه را می‌خواهیم نگه داریم، باید آن را ذخیره کنیم:

<h2 class="lesson-title">6. اضافه کردن عناصر</h2>

<h3><code>append()</code></h3>

<p>
    <code>append()</code> یک عنصر را به <strong>انتهای List</strong> اضافه می‌کند.
</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">names = ["Ali", "Sara"]

names.append("Reza")

print(names)</div>
</div>

    <span class="code-label">Output</span>
    <div class="code-block no-prompt">['Ali', 'Sara', 'Reza']</div>
</div>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">numbers = [1, 2]

print(numbers)</div>
</div>

</div>

<h3><code>insert()</code></h3>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">names = ["Ali", "Reza"]

print(names)</div>
</div>

<div class="code-container">

<h2 class="lesson-title">7. حذف عناصر</h2>

<h3><code>remove()</code> — حذف بر اساس مقدار</h3>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

names.remove("Sara")

print(names)</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">['Ali', 'Reza']</div>
</div>

<p>
    <code>remove()</code> بر اساس <strong>Value</strong> کار می‌کند.
    اگر مقدار وجود نداشته باشد، <code>ValueError</code> ایجاد می‌شود.
</p>

<h3><code>pop()</code> — حذف بر اساس Index</h3>

<p>
    <code>pop()</code> عنصر را حذف می‌کند و مقدار حذف‌شده را نیز برمی‌گرداند.
</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

removed = names.pop(1)

print(removed)
print(names)</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">Sara
['Ali', 'Reza']</div>
</div>

<p>
    اگر Index مشخص نکنیم، <code>pop()</code> آخرین عنصر را حذف می‌کند:
</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">last = names.pop()</div>
</div>

<h2 class="lesson-title">13. Unpacking چیست؟</h2>

<p>
    با Unpacking می‌توانیم چند مقدار را مستقیماً داخل چند متغیر قرار دهیم.
</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">person = ("Ali", 20, "Tehran")

name, age, city = person

print(name)
print(age)
print(city)</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">Ali
20
Tehran</div>
</div>

<blockquote>
    <strong>مدل ذهنی:</strong>
    چند مقدار → چند متغیر
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">14. قانون مهم Unpacking</h2>

<p>
    در Unpacking معمولی، تعداد متغیرها باید با تعداد مقادیر برابر باشد.
</p>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>کد</th>
                <th>نتیجه</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><code>a, b, c = (1, 2, 3)</code></td>
                <td>صحیح</td>
            </tr>
            <tr>
                <td><code>a, b = (1, 2, 3)</code></td>
                <td>خطا</td>
            </tr>
            <tr>
                <td><code>a, b, c, d = (1, 2, 3)</code></td>
                <td>خطا</td>
            </tr>
        </tbody>
    </table>
</div>

<blockquote>
    <strong>نکته امتحانی:</strong>
    در Unpacking معمولی:
    <code>تعداد متغیرها = تعداد مقادیر</code>
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">15. Unpacking با List</h2>

<p>
    Unpacking فقط مخصوص Tuple نیست و با List نیز انجام می‌شود.
</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">numbers = [10, 20, 30]

a, b, c = numbers

print(a)
print(b)
print(c)</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">10
20
30</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">16. Unpacking همراه با <code>input()</code></h2>

<p>
    می‌توان ورودی چندگانه را با <code>split()</code> دریافت و سپس Unpack کرد.
</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">data = input("Name Age City: ").split()

name, age, city = data
age = int(age)

print(name)
print(age)
print(city)</div>
</div>

<p>
    نکته: خروجی <code>split()</code> شامل Stringهاست؛ بنابراین برای محاسبات عددی باید
    مقدار را با <code>int()</code> تبدیل کنیم.
</p>

<hr class="lesson-divider">

<h2 class="lesson-title">17. Unpacking با <code>*</code></h2>

<p>
    با <code>*</code> می‌توان یک متغیر را برای دریافت چند مقدار باقی‌مانده استفاده کرد.
</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">numbers = [10, 20, 30, 40]

first, *rest = numbers

print(first)
print(rest)</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">10
[20, 30, 40]</div>
</div>

            </tr>
            <tr>

            </tr>
        </tbody>
    </table>
</div>

<h2 class="lesson-title">18. مثال ترکیبی</h2>

<p>

<p>

<p>
    <code>get()</code> برای دریافت مقدار یک Key استفاده می‌شود و در صورت نبودن Key،
    به‌صورت پیش‌فرض <code>None</code> برمی‌گرداند.
</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">student = {
    "name": "Ali",
    "age": 20
}

print(student.get("name"))
print(student.get("phone"))</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">Ali
None</div>
</div>

<h3>مقدار پیش‌فرض</h3>

<p>
    می‌توانیم برای Keyهای ناموجود یک مقدار پیش‌فرض تعیین کنیم:
</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">print(student.get("phone", "Not found"))</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">Not found</div>
</div>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>روش</th>
                <th>Key موجود</th>
                <th>Key ناموجود</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><code>d[key]</code></td>
                <td>Value</td>
                <td><code>KeyError</code></td>
            </tr>
            <tr>
                <td><code>d.get(key)</code></td>
                <td>Value</td>
                <td><code>None</code></td>
            </tr>
            <tr>
                <td><code>d.get(key, default)</code></td>
                <td>Value</td>
                <td>مقدار پیش‌فرض</td>
            </tr>
        </tbody>
    </table>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">6. اضافه کردن و تغییر مقدار</h2>

<p>
    Dictionary قابل تغییر است.
    با یک Syntax می‌توان هم مقدار جدید اضافه کرد و هم مقدار موجود را تغییر داد.
</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">student = {
    "name": "Ali",
    "age": 20
}

student["city"] = "Tehran"
student["age"] = 21

print(student)</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">{'name': 'Ali', 'age': 21, 'city': 'Tehran'}</div>
</div>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>دستور</th>
                <th>نتیجه</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><code>d[new_key] = value</code></td>
                <td>Key جدید اضافه می‌شود.</td>
            </tr>
            <tr>
                <td><code>d[existing_key] = value</code></td>
                <td>Value قبلی تغییر می‌کند.</td>
            </tr>
        </tbody>
    </table>
</div>

<blockquote>
    <strong>نکته مهم:</strong>
    <code>dictionary[key] = value</code>
    هم برای <strong>Add</strong> و هم <strong>Update</strong> استفاده می‌شود.
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">7. Key تکراری</h2>

<p>
    Keyهای یک Dictionary باید یکتا باشند.

</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">student = {
    "name": "Ali",
    "name": "Sara"
}

print(student)</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">{'name': 'Sara'}</div>
</div>

<blockquote>
    <strong>نکته امتحانی:</strong>
    <code>Dictionary → Keyهای یکتا</code>
</blockquote>

<h2 class="lesson-title">8. حذف اطلاعات با del</h2>

<p>
    برای حذف یک Key و Value مربوط به آن می‌توان از <code>del</code> استفاده کرد.

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">student = {
    "name": "Ali",
    "age": 20,
    "city": "Tehran"
}

del student["city"]

print(student)</div>
</div>

<div class="code-container">

</div>

<h2 class="lesson-title">9. حذف با pop()</h2>

<p>

</div>

<div class="code-container">

{'name': 'Ali'}</div>
</div>

            <tr>

            <tr>

            </tr>
        </tbody>
    </table>
</div>

<h2 class="lesson-title">10. پاک کردن کل Dictionary با clear()</h2>

<p>

}

print(student)</div>
</div>

<div class="code-container">

<h2 class="lesson-title">11. len() و in در Dictionary</h2>

<h3><code>len()</code></h3>

<p>
    <code>len()</code> تعداد Keyهای Dictionary را برمی‌گرداند.
</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">student = {
    "name": "Ali",
    "age": 20,
    "city": "Tehran"
}

print(len(student))</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">3</div>
</div>

<h3><code>in</code></h3>

<p>
    در Dictionary، عملگر <code>in</code> به‌طور معمول وجود <strong>Key</strong> را بررسی می‌کند.
</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">student = {
    "name": "Ali"
}

print("name" in student)
print("Ali" in student)</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">True
False</div>
</div>

<blockquote>
    <strong>نکته امتحانی:</strong>
    <code>"name" in student</code> → بررسی Key
    <br>
    <code>"Ali" in student</code> → Value را بررسی نمی‌کند.
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">12. keys()، values() و items()</h2>

<p>
    این سه متد برای دریافت بخش‌های مختلف Dictionary بسیار مهم هستند.
</p>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>متد</th>
                <th>مفهوم</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><code>keys()</code></td>
                <td>Keyها</td>
            </tr>
            <tr>
                <td><code>values()</code></td>
                <td>Valueها</td>
            </tr>
            <tr>
                <td><code>items()</code></td>
                <td>جفت‌های Key و Value</td>
            </tr>
        </tbody>
    </table>
</div>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">student = {
    "name": "Ali",
    "age": 20
}

print(student.keys())
print(student.values())
print(student.items())</div>
</div>

<div class="code-container">
    <span class="code-label">Conceptual Output</span>
    <div class="code-block no-prompt">dict_keys(['name', 'age'])
dict_values(['Ali', 20])
dict_items([('name', 'Ali'), ('age', 20)])</div>
</div>

<blockquote>
    <strong>مدل ذهنی:</strong>
    <code>keys()</code> → فقط Key
    <br>
    <code>values()</code> → فقط Value
    <br>
    <code>items()</code> → Key + Value
</blockquote>

<h2 class="lesson-title">13. update()</h2>

<p>

<h2 class="lesson-title">3. List — مرور سریع</h2>

<p>
    <code>List</code> برای داده‌های مرتب و قابل تغییر استفاده می‌شود.
    Index از <code>0</code> شروع می‌شود و آخرین عنصر با <code>[-1]</code> قابل دسترسی است.
</p>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>نیاز</th>
                <th>دستور</th>
            </tr>

                <td><code>items[0]</code></td>
            </tr>
            <tr>
                <td>آخرین عنصر</td>
                <td><code>items[-1]</code></td>
            </tr>
            <tr>
                <td>تعداد</td>
                <td><code>len(items)</code></td>
            </tr>
            <tr>
                <td>اضافه به انتها</td>
                <td><code>append(x)</code></td>
            </tr>
            <tr>
                <td>اضافه در Index</td>
                <td><code>insert(i, x)</code></td>
            </tr>
            <tr>
                <td>حذف بر اساس مقدار</td>
                <td><code>remove(x)</code></td>
            </tr>
            <tr>
                <td>حذف بر اساس Index</td>
                <td><code>pop(i)</code></td>
            </tr>
            <tr>
                <td>مرتب‌سازی</td>
                <td><code>sort()</code></td>
            </tr>
            <tr>
                <td>بررسی وجود</td>
                <td><code>x in items</code></td>
            </tr>
        </tbody>
    </table>
</div>

<blockquote>
    <strong>نکته:</strong>
    <code>remove()</code> بر اساس <strong>Value</strong> حذف می‌کند،
    اما <code>pop()</code> بر اساس <strong>Index</strong> حذف می‌کند و مقدار حذف‌شده را برمی‌گرداند.
</blockquote>

<p>

<div class="code-container">

            </tr>

<h2 class="lesson-title">6. elif؛ چند حالت مختلف</h2>

<p>
    وقتی بیش از دو حالت داریم، از <code>elif</code> استفاده می‌کنیم.
</p>

    <div class="code-block no-prompt">score = 16

else:

<div class="code-container">

    ...

    ...
else:
    ...</div>
</div>

<h3>قانون مهم <code>if/elif</code></h3>

<p>
    Python شرط‌ها را از بالا به پایین بررسی می‌کند و

</p>

    print("Excellent")</div>

</p>

<h3>استفاده از <code>in</code></h3>

fruits = ["apple", "banana", "orange"]

if "banana" in fruits:
    print("Found")</div>
</div>

<blockquote>
    <strong>نکته:</strong>
    در Dictionary، عبارت <code>key in dictionary</code>
    به‌طور معمول وجود Key را بررسی می‌کند.
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">9. Nested Condition</h2>

<p>
    اگر یک شرط داخل شرط دیگری قرار بگیرد، با
    <strong>Nested Condition</strong> روبه‌رو هستیم.
</p>

<p>مثلاً ابتدا سن را بررسی می‌کنیم و سپس کارت شناسایی را:</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">age = 20
has_id = True

if age >= 18:
    if has_id:
        print("Entry allowed")
    else:
        print("ID required")
else:
    print("Too young")</div>
</div>

<p>ترتیب تصمیم:</p>

<div class="code-container">
    <span class="code-label">Flow</span>
    <div class="code-block no-prompt">age >= 18 ?
     │
   Yes
     ↓
has_id ?
 /     \
Yes     No
 ↓       ↓
Allow   ID required

No
 ↓
Too young</div>
</div>

<h3>Nested یا <code>and</code>؟</h3>

<p>
    اگر فقط می‌خواهیم هر دو شرط برقرار باشند، معمولاً <code>and</code> ساده‌تر است:
</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">if age >= 18 and has_id:
    print("Allowed")</div>
</div>

<p>
    اما اگر بعد از شرط اول قرار است تصمیم‌های جداگانه‌ای گرفته شود،
    Nested Condition می‌تواند مناسب‌تر باشد.
</p>

<hr class="lesson-divider">

<h2 class="lesson-title">10. چند if مستقل در برابر if/elif</h2>

<p>
    این دو ساختار رفتار متفاوتی دارند و از نکات مهم جلسه هستند.
</p>

<h3>دو <code>if</code> مستقل</h3>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">number = 15

if number > 0:
    print("Positive")

if number > 10:
    print("Greater than 10")</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">Positive
Greater than 10</div>
</div>

<p>
    هر دو شرط مستقل هستند؛ بنابراین هر دو می‌توانند اجرا شوند.
</p>

<h3><code>if/elif</code></h3>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">number = 15

if number > 0:
    print("Positive")
elif number > 10:
    print("Greater than 10")</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">Positive</div>
</div>

<p>
    چون شرط اول <code>True</code> شده است، <code>elif</code> بررسی نمی‌شود.
</p>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>ساختار</th>
                <th>رفتار</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><code>if + if</code></td>
                <td>هر دو شرط مستقل هستند و ممکن است هر دو اجرا شوند.</td>
            </tr>
            <tr>
                <td><code>if + elif</code></td>
                <td>فقط اولین شرط True در زنجیره اجرا می‌شود.</td>
            </tr>
        </tbody>
    </table>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">11. شرط با Boolean</h2>

<p>
    وقتی یک متغیر خودش مقدار Boolean دارد، نیازی نیست آن را با
    <code>True</code> مقایسه کنیم.
</p>

<p>به‌جای:</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">if is_student == True:
    print("Student")</div>
</div>

<p>می‌توان نوشت:</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">if is_student:
    print("Student")</div>
</div>

<p>برای حالت مخالف نیز:</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">if not is_student:
    print("Not student")</div>
</div>

<blockquote>
    این شکل معمولاً خواناتر و ساده‌تر است.
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">12. Assignment و Comparison</h2>

<p>
    یکی از اشتباه‌های رایج، اشتباه گرفتن <code>=</code> و <code>==</code> است.
</p>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>Operator</th>
                <th>کاربرد</th>
                <th>مثال</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><code>=</code></td>
                <td>Assignment</td>
                <td><code>age = 20</code></td>
            </tr>
            <tr>
                <td><code>==</code></td>
                <td>مقایسه برابری</td>
                <td><code>age == 20</code></td>
            </tr>
        </tbody>
    </table>
</div>

<p>مثال صحیح در شرط:</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">age = 20

if age == 20:
    print("Twenty")</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">13. مثال ترکیبی — سیستم ورود</h2>

<p>
    حالا چند مفهوم جلسه را در یک مثال ترکیب می‌کنیم.
</p>

<p>شرایط:</p>

<ul>
    <li>نام کاربری باید <code>admin</code> باشد.</li>
    <li>رمز عبور باید <code>1234</code> باشد.</li>
    <li>اگر هر دو صحیح باشند، ورود موفق است.</li>
    <li>در غیر این صورت پیام مناسب نمایش داده می‌شود.</li>
</ul>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">username = "admin"
password = "1234"

if username == "admin":
    if password == "1234":
        print("Login successful")
    else:
        print("Wrong password")
else:
    print("Wrong username")</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">Login successful</div>
</div>

<p>اگر رمز عبور تغییر کند:</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">username = "admin"
password = "9999"</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">Wrong password</div>
</div>

<p>
    این مثال ترکیبی از <code>if</code>، <code>else</code>،
    مقایسه String و Nested Condition است.
</p>
