<h2 class="lesson-title">18. نکات کلیدی جلسه</h2>

<ul>
    <li><code>break</code> اجرای حلقه‌ای را که داخل آن قرار دارد متوقف می‌کند.</li>
    <li><code>continue</code> فقط تکرار فعلی را رد می‌کند و حلقه ادامه پیدا می‌کند.</li>
    <li><code>pass</code> هیچ عملیات خاصی انجام نمی‌دهد.</li>
    <li>در Nested Loop، حلقه داخلی برای هر بار اجرای حلقه بیرونی اجرا می‌شود.</li>
    <li>تعداد اجرای Nested Loop معمولاً از ضرب تعداد تکرارهای حلقه‌ها به دست می‌آید.</li>
    <li><code>break</code> داخل حلقه داخلی، به‌صورت عادی فقط همان حلقه داخلی را متوقف می‌کند.</li>
    <li><code>zip()</code> برای پیمایش هم‌زمان چند مجموعه استفاده می‌شود.</li>
    <li>در حالت معمول، <code>zip()</code> تا کوتاه‌ترین مجموعه ادامه پیدا می‌کند.</li>
    <li><code>enumerate()</code> برای گرفتن Index و Value یک مجموعه مناسب است.</li>
</ul>

<h2 class="lesson-title">1. چرا به Function نیاز داریم؟</h2>

<p>فرض کن یک عملیات مشخص چند بار در برنامه تکرار شود. مثلاً می‌خواهیم مربع چند عدد را محاسبه کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">number = 10
result = number * number
print(result)

number = 20
result = number * number
print(result)

number = 30
result = number * number
print(result)</div></div>

<p>در اینجا یک الگوی مشخص داریم:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">عدد
 ↓
ضرب در خودش
 ↓
نمایش نتیجه</div></div>

<p>اگر همین منطق در قسمت‌های مختلف برنامه تکرار شود، مجبور می‌شویم کد را چند بار بنویسیم.</p>

<p>این کار باعث می‌شود:</p>

<ul>
<li>کد طولانی‌تر شود.</li>
<li>تغییر دادن منطق سخت‌تر شود.</li>
<li>احتمال خطا افزایش پیدا کند.</li>
<li>خوانایی و مدیریت برنامه کاهش پیدا کند.</li>
</ul>

<p>راه‌حل این است که منطق تکراری را یک بار در یک بخش نام‌گذاری‌شده قرار دهیم و هر زمان لازم بود آن را اجرا کنیم.</p>

<blockquote><strong>این بخش نام‌گذاری‌شده همان Function است.</strong></blockquote>

<h2 class="lesson-title">2. Function چیست؟</h2>

<p>در ساده‌ترین تعریف:</p>

<blockquote>

<p>مثلاً به جای اینکه منطق محاسبه مربع را چند بار بنویسیم، آن را داخل یک تابع قرار می‌دهیم:</p>

<h2 class="lesson-title">3. تعریف اولین Function</h2>

<p>کد کامل:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def say_hello():
    print("Hello!")

say_hello()</div></div>

<div class="code-container"><span class="code-label">Output</span><div class="code-block no-prompt">Hello!</div></div>

<div class="table-wrap">

<thead>
<tr>

</tr>

<tbody>
<tr>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Hello Ali
Hello Sara
Hello Reza</div></div>

<p>برای این کار باید بتوانیم داده را به تابع بدهیم.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">7. Parameter چیست؟</h2>

<p><strong>Parameter</strong> متغیری است که هنگام تعریف تابع برای دریافت ورودی مشخص می‌کنیم.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def say_hello(name):
    print("Hello", name)</div></div>

<p>در اینجا <code>name</code> یک Parameter است.</p>

<p>حالا می‌توانیم تابع را با داده‌های مختلف فراخوانی کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">say_hello("Ali")
say_hello("Sara")
say_hello("Reza")</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Output</span><div class="code-block no-prompt">Hello Ali
Hello Sara
Hello Reza</div></div>

<p>پس Parameter مانند یک جای خالی برای دریافت داده است.</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">def say_hello(name):
                 ↑
             جای ورودی</div></div>

<hr class="lesson-divider">

<h2 class="lesson-title">8. Argument چیست؟</h2>

<p>حالا باید تفاوت <strong>Parameter</strong> و <strong>Argument</strong> را دقیق بدانیم.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def say_hello(name):
    print("Hello", name)</div></div>

<p>در تعریف تابع، <code>name</code> یک <strong>Parameter</strong> است.</p>

<p>اما هنگام فراخوانی:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">say_hello("Ali")</div></div>

<p><code>"Ali"</code> یک <strong>Argument</strong> است.</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>مفهوم</th>
<th>زمان استفاده</th>
<th>مثال</th>
</tr>
</thead>
<tbody>
<tr>
<td>Parameter</td>
<td>هنگام تعریف تابع</td>
<td><code>name</code></td>
</tr>
<tr>
<td>Argument</td>
<td>هنگام فراخوانی تابع</td>
<td><code>"Ali"</code></td>
</tr>
</tbody>
</table>
</div>

<p>برای حفظ کردن:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Parameter → در تعریف Function

Argument → در Function Call</div></div>

<hr class="lesson-divider">

<h2 class="lesson-title">9. چند Parameter</h2>

<p>یک تابع می‌تواند چند Parameter داشته باشد.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def introduce(name, age):
    print("Name:", name)
    print("Age:", age)</div></div>

<p>هنگام فراخوانی:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">introduce("Ali", 20)</div></div>

<p>در اینجا:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">name → "Ali"
age  → 20</div></div>

<p>هر دو مقدار، Argument هستند و به Parameter متناظر خود اختصاص داده می‌شوند.</p>

<p>ترتیب آن‌ها مهم است:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">introduce("Ali", 20)</div></div>

<p>یعنی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">name = "Ali"
age = 20</div></div>

<p>اما اگر ترتیب را عوض کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">introduce(20, "Ali")</div></div>

<p>Python مقدارها را بر اساس موقعیت به پارامترها اختصاص می‌دهد:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">name = 20
age = "Ali"</div></div>

<blockquote><strong>در این مرحله، ترتیب Argumentها باید با ترتیب Parameterها هماهنگ باشد.</strong></blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">10. Function برای انجام محاسبه</h2>

<p>حالا یک تابع کاربردی‌تر بسازیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def square(number):
    result = number * number
    print(result)</div></div>

<p>می‌توانیم آن را با عددهای مختلف فراخوانی کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">square(5)
square(10)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Output</span><div class="code-block no-prompt">25
100</div></div>

<p>تا اینجا تابع محاسبه را انجام داده و نتیجه را <strong>نمایش</strong> داده است.</p>

<p>اما اگر بخواهیم نتیجه را در ادامه برنامه استفاده کنیم چه؟</p>

<hr class="lesson-divider">

<h2 class="lesson-title">11. چرا فقط <code>print()</code> کافی نیست؟</h2>

<p>به این تابع نگاه کن:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def square(number):
    print(number * number)</div></div>

<p>اگر بنویسیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = square(5)</div></div>

<p>ممکن است انتظار داشته باشیم <code>result</code> برابر <code>25</code> شود؛ اما این اتفاق نمی‌افتد.</p>

<p>چون <code>print()</code> فقط نتیجه را روی خروجی نمایش می‌دهد.</p>

<p>برای تحویل دادن نتیجه به بخش دیگری از برنامه به <code>return</code> نیاز داریم.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">12. <code>return</code> چیست؟</h2>

<p><code>return</code> مقدار را از تابع به محل فراخوانی برمی‌گرداند.</p>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def square(number):
    return number * number</div></div>

<p>حالا می‌توانیم نتیجه را دریافت کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = square(5)

print(result)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Output</span><div class="code-block no-prompt">25</div></div>

<p>اتفاقی که افتاده:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">square(5)
   ↓
5 × 5
   ↓
25
   ↓
result</div></div>

<p>یعنی مقدار برگشتی تابع می‌تواند در یک متغیر ذخیره شود یا در بخش دیگری از برنامه استفاده شود.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">13. تفاوت مهم <code>print()</code> و <code>return</code></h2>

<p>این تفاوت را باید کاملاً درک کنی:</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th><code>print()</code></th>
<th><code>return</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>مقدار را نمایش می‌دهد.</td>
<td>مقدار را از تابع برمی‌گرداند.</td>
</tr>
<tr>
<td>برای نمایش نتیجه مناسب است.</td>
<td>برای استفاده مجدد از نتیجه مناسب است.</td>
</tr>
<tr>
<td>به‌تنهایی مقدار را برای ادامه محاسبات تحویل نمی‌دهد.</td>
<td>مقدار را می‌توان در متغیر، شرط، محاسبه و... استفاده کرد.</td>
</tr>
</tbody>
</table>
</div>

<p>مثال با <code>print()</code>:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):
    print(a + b)</div></div>

<p>مثال با <code>return</code>:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):
    return a + b</div></div>

<p>قانون ساده:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">print()
↓
نتیجه را نشان بده

return
↓
نتیجه را به برنامه برگردان</div></div>

<hr class="lesson-divider">

<h2 class="lesson-title">14. اگر تابع <code>return</code> نداشته باشد چه می‌شود؟</h2>

<p>اگر تابعی مقدار مشخصی را <code>return</code> نکند، مقدار برگشتی آن <code>None</code> است.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):
    print(a + b)

result = add(3, 4)
print(result)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Output</span><div class="code-block no-prompt">7
None</div></div>

<p>تابع عدد <code>7</code> را چاپ کرده، اما آن را برنگردانده است.</p>

<p>اگر بخواهیم مقدار <code>7</code> را دریافت کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):
    return a + b

result = add(3, 4)
print(result)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Output</span><div class="code-block no-prompt">7</div></div>

<hr class="lesson-divider">

<h2 class="lesson-title">15. <code>return</code> اجرای Function را متوقف می‌کند</h2>

<p>وقتی Python به <code>return</code> می‌رسد، اجرای همان تابع پایان پیدا می‌کند.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def test():
    print("A")
    return
    print("B")

test()</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Output</span><div class="code-block no-prompt">A</div></div>

<p>دستور <code>print("B")</code> اجرا نمی‌شود، چون تابع قبل از رسیدن به آن با <code>return</code> پایان یافته است.</p>

<p>همچنین <code>return</code> می‌تواند یک مقدار داشته باشد:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):
    return a + b</div></div>

<p>یا:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def is_adult(age):
    return age >= 18</div></div>

<p>در مثال دوم، مقدار برگشتی می‌تواند <code>True</code> یا <code>False</code> باشد.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">16. استفاده از مقدار برگشتی در شرط</h2>

<p>یکی از مزیت‌های مهم <code>return</code> این است که نتیجه تابع را می‌توان مستقیماً در شرط استفاده کرد.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def is_adult(age):
    return age >= 18

age = 20

if is_adult(age):
    print("Adult")
else:
    print("Not adult")</div></div>

<p>در اینجا:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">is_adult(20)
     ↓
20 >= 18
     ↓
True
     ↓
if True
     ↓
Adult</div></div>

<p>پس نتیجه Function فقط برای ذخیره در متغیر نیست؛ می‌توان آن را در شرط، محاسبه یا سایر بخش‌های برنامه نیز استفاده کرد.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">17. استفاده از نتیجه Function در متغیر</h2>

<p>یک مثال واقعی‌تر:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_total(price, quantity):
    return price * quantity

total = calculate_total(100, 3)

print(total)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Output</span><div class="code-block no-prompt">300</div></div>

<p>مسیر داده:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">price = 100
quantity = 3
       ↓
calculate_total()
       ↓
100 × 3
       ↓
300
       ↓
total</div></div>

<p>حالا می‌توانیم از <code>total</code> در قسمت‌های دیگر برنامه استفاده کنیم.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">18. یک Function را چند بار استفاده کنیم</h2>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_total(price, quantity):
    return price * quantity

total1 = calculate_total(100, 2)
total2 = calculate_total(50, 4)

print(total1)
print(total2)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Output</span><div class="code-block no-prompt">200
200</div></div>

<p>منطق محاسبه فقط یک بار نوشته شده است:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">return price * quantity</div></div>

<p>اما همان منطق چند بار با داده‌های مختلف استفاده شده است.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">19. ترکیب Function با <code>input()</code></h2>

<p>حالا Function را با مفاهیمی که قبلاً یاد گرفته‌ایم ترکیب کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def square(number):
    return number * number

number = int(input("Enter a number: "))

result = square(number)

print("Result:", result)</div></div>

<p>اگر کاربر عدد <code>5</code> را وارد کند:</p>

<div class="code-container"><span class="code-label">Output</span><div class="code-block no-prompt">Result: 25</div></div>

<p>اینجا چند مفهوم قبلی با هم ترکیب شده‌اند:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">input()
   ↓
int()
   ↓
variable
   ↓
Function
   ↓
return
   ↓
print()</div></div>

<p>این همان چیزی است که در برنامه‌نویسی واقعی اتفاق می‌افتد: مفاهیم مختلف جدا از هم باقی نمی‌مانند، بلکه با یکدیگر ترکیب می‌شوند.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">20. یک Function خوب چه ویژگی‌ای دارد؟</h2>

<p>در سطح Python Basic، یک اصل مهم را حفظ کن:</p>

<blockquote><strong>هر Function بهتر است یک وظیفه مشخص داشته باشد.</strong></blockquote>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_area(width, height):
    return width * height</div></div>

<p>نام تابع مشخص است و وظیفه آن نیز مشخص است: محاسبه مساحت.</p>

<p>در مقابل، تابعی با نامی مانند:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def do_everything():
    ...</div></div>

<p>معمولاً وظیفه مشخصی را بیان نمی‌کند.</p>

<p>فعلاً لازم نیست وارد طراحی پیشرفته Functionها شویم؛ فقط این اصل را در ذهن داشته باش:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">یک Function
     ↓
یک وظیفه مشخص</div></div>

<hr class="lesson-divider">

<h2 class="lesson-title">21. نام‌گذاری Function</h2>

<p>نام تابع باید تا حد امکان نشان دهد که تابع چه کاری انجام می‌دهد.</p>

<p>در Python معمولاً برای نام Function از سبک <code>snake_case</code> استفاده می‌کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">calculate_total()
get_name()
print_result()
check_age()
calculate_average()</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_area():</div></div>

<p>از نامی مانند:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def x():</div></div>

<p>خواناتر است، چون وظیفه تابع را مشخص می‌کند.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">22. فراموش کردن <code>()</code> هنگام Call</h2>

<p>برای اجرای تابع معمولاً باید آن را با پرانتز فراخوانی کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def say_hello():
    print("Hello")

say_hello()</div></div>

<p>تفاوت این دو را بدان:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">say_hello
↓
خود تابع

say_hello()
↓
فراخوانی تابع</div></div>

<p>در این جلسه برای اجرای Function از شکل <code>function_name()</code> استفاده می‌کنیم.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">23. Syntax و Indentation در Function</h2>

<p>بعد از تعریف تابع باید <code>:</code> قرار بگیرد:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def say_hello():
    print("Hello")</div></div>

<p>بدنه تابع نیز باید با Indentation مشخص شود:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def say_hello():
    print("Hello")</div></div>

<p>اگر بدنه تابع داخل آن قرار نگیرد، Python با خطای Syntax یا Indentation مواجه می‌شود.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">24. تعداد Argumentها باید درست باشد</h2>

<p>اگر تابع دو Parameter داشته باشد:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):
    return a + b</div></div>

<p>در حالت معمول باید دو Argument ارسال کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">add(2, 3)</div></div>

<p>اگر فقط یک مقدار ارسال کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">add(2)</div></div>

<p>یکی از Parameterهای موردنیاز مقدار ندارد و Python خطا می‌دهد.</p>

<p>همین‌طور:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">add(2, 3, 4)</div></div>

<p>نیز با این تعریف سازگار نیست، چون سه Argument برای تابعی با دو Parameter ارسال شده است.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">25. ترکیب Function و Loop</h2>

<p>حالا Function را با حلقه‌ای که در فصل قبل یاد گرفتیم ترکیب کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def square(number):
    return number * number

for number in range(1, 6):
    print(square(number))</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Output</span><div class="code-block no-prompt">1
4
9
16
25</div></div>

<p>در هر تکرار، مقدار <code>number</code> به Function ارسال می‌شود و نتیجه برمی‌گردد.</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1 → square(1) → 1
2 → square(2) → 4

<h1 class="lesson-title section-troubleshoot">Troubleshooting</h1>

<h3>مشکل ۱ — تابع اجرا نمی‌شود</h3>

<p>تعریف تابع به‌تنهایی باعث اجرای آن نمی‌شود. باید آن را Call کنی:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">say_hello()</div></div>

<h3>مشکل ۲ — مقدار <code>None</code> دریافت می‌کنم</h3>

<p>اگر تابع فقط <code>print()</code> داشته باشد و مقدار را <code>return</code> نکند، مقدار برگشتی آن <code>None</code> خواهد بود.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):
    print(a + b)

result = add(2, 3)
print(result)</div></div>

<h3>مشکل ۳ — <code>SyntaxError</code></h3>

<p>وجود <code>:</code> بعد از تعریف تابع را بررسی کن:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):
    return a + b</div></div>

<h3>مشکل ۴ — <code>IndentationError</code></h3>

<p>کد داخل تابع باید با Indentation نوشته شود:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):
    return a + b</div></div>

<h3>مشکل ۵ — تعداد Argumentها اشتباه است</h3>

<p>تعداد Argumentها را با تعداد Parameterهای موردنیاز تابع مقایسه کن:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):
    return a + b

add(2, 3)</div></div>

<h1 class="lesson-title section-scenario">سناریوی ترکیبی</h1>

<p>فرض کن می‌خواهیم یک برنامه ساده برای یک فروشگاه بنویسیم.</p>

<p>قیمت محصول و تعداد خرید را داریم. ابتدا مبلغ کل را محاسبه می‌کنیم و سپس اگر مبلغ خرید حداقل <code>500</code> باشد، ۱۰٪ تخفیف می‌دهیم.</p>

<p>در این مسئله چند مفهوم را کنار هم قرار می‌دهیم:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Function
   +
Parameter
   +
return
   +
if
   +
Arithmetic</div></div>

<h3>مرحله ۱ — محاسبه مبلغ کل</h3>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_total(price, quantity):
    return price * quantity</div></div>

<p>مثلاً:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">total = calculate_total(200, 3)

print(total)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Output</span><div class="code-block no-prompt">600</div></div>

<h3>مرحله ۲ — محاسبه تخفیف</h3>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_discount(total):
    if total >= 500:
        return total * 0.10
    else:
        return 0</div></div>

<p>حالا:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">discount = calculate_discount(600)

print(discount)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Output</span><div class="code-block no-prompt">60.0</div></div>

<h3>مرحله ۳ — محاسبه مبلغ نهایی</h3>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">final_price = total - discount

print(final_price)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Output</span><div class="code-block no-prompt">540.0</div></div>

<h3>مرحله ۴ — نسخه کامل</h3>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_total(price, quantity):
    return price * quantity


def calculate_discount(total):
    if total >= 500:
        return total * 0.10
    else:
        return 0


price = 200
quantity = 3

total = calculate_total(price, quantity)
discount = calculate_discount(total)

final_price = total - discount

print("Total:", total)
print("Discount:", discount)
print("Final price:", final_price)</div></div>

<p>خروجی:</p>

<div class="code-container"><span class="code-label">Output</span><div class="code-block no-prompt">Total: 600
Discount: 60.0
Final price: 540.0</div></div>

<p>مزیت Function در این مثال مشخص است. برنامه به قسمت‌های کوچک‌تر تقسیم شده است:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">calculate_total()
        ↓
محاسبه مبلغ

calculate_discount()
        ↓
محاسبه تخفیف

بخش اصلی برنامه
        ↓
ترکیب نتایج</div></div>

<p>هر تابع یک وظیفه مشخص دارد و بخش اصلی برنامه فقط این وظایف را با هم ترکیب می‌کند.</p>

<h2 class="lesson-title">🎯 جمع‌بندی جلسه</h2>

<p>در این جلسه از مشکل <strong>تکرار کد</strong> شروع کردیم و دیدیم که Function به ما کمک می‌کند یک منطق مشخص را یک بار تعریف و چند بار استفاده کنیم.</p>

<p>ساختار اصلی Function:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def function_name(parameter):
    # processing
    return result</div></div>

<p>هنگام استفاده از Function، مقدار موردنیاز را به‌صورت Argument ارسال می‌کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = function_name(argument)</div></div>

<p>سه مفهوم اصلی این جلسه را از هم جدا نگه دار:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Parameter
↓
ورودی تعریف‌شده در Function

Argument
↓
مقداری که هنگام Call ارسال می‌شود

return
↓
مقداری که Function برمی‌گرداند</div></div>

<p>و مهم‌ترین تفاوت جلسه:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">print()
↓
نمایش نتیجه

return
↓
برگرداندن نتیجه برای استفاده در برنامه</div></div>

<p>همچنین یاد گرفتیم که:</p>

<ul>
<li>Function با <code>def</code> تعریف می‌شود.</li>
<li>تعریف Function به‌تنهایی باعث اجرای آن نمی‌شود.</li>
<li>برای اجرای Function از Call مانند <code>say_hello()</code> استفاده می‌کنیم.</li>
<li>Parameter هنگام تعریف Function مشخص می‌شود.</li>
<li>Argument هنگام فراخوانی Function ارسال می‌شود.</li>
<li>تعداد و ترتیب Argumentها اهمیت دارد.</li>
<li><code>return</code> مقدار را به محل فراخوانی برمی‌گرداند.</li>
<li>رسیدن به <code>return</code> اجرای همان Function را متوقف می‌کند.</li>
<li>اگر تابع مقدار مشخصی را <code>return</code> نکند، مقدار برگشتی آن <code>None</code> است.</li>
<li>Functionها می‌توانند با <code>if</code>، <code>for</code>، <code>input()</code> و سایر مفاهیم ترکیب شوند.</li>
<li>بهتر است هر Function یک وظیفه مشخص داشته باشد.</li>
</ul>

<p>در <strong>جلسه ۲ فصل ۱۰</strong> همین مفهوم را یک مرحله جلوتر می‌بریم و با <strong>انواع آرگومان‌ها، Scope متغیرها و اصول بهتر کار کردن با Functionها</strong> آشنا می‌شویم.</p>`

<h2 class="lesson-title">1. مرور جلسه قبل</h2>

<p>در جلسه قبل یاد گرفتیم Function برای انجام یک کار مشخص ساخته می‌شود و می‌تواند ورودی دریافت کند و نتیجه را با <code>return</code> برگرداند.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def add(a, b):
    return a + b

result = add(10, 20)
print(result)</div>
</div>

<p>در این مثال:</p>

<ul>
<li><code>a</code> و <code>b</code> → <strong>Parameter</strong></li>
<li><code>10</code> و <code>20</code> → <strong>Argument</strong></li>
<li><code>return</code> → نتیجه را از Function خارج می‌کند.</li>
</ul>

<p>حالا می‌خواهیم ببینیم اطلاعات را چگونه می‌توانیم به شکل‌های مختلف به Function بدهیم و متغیرها در چه محدوده‌ای قابل استفاده هستند.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">2. Argument چیست و چرا چند نوع دارد؟</h2>

<p>وقتی یک Function را صدا می‌زنیم، مقداری که به آن ارسال می‌کنیم <strong>Argument</strong> نام دارد.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def introduce(name, age):
    print("Name:", name)
    print("Age:", age)

introduce("Ali", 20)</div>
</div>

<p>در اینجا:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">"Ali" → name
20     → age</div>
</div>

<p>Python چند روش برای ارسال این مقادیر دارد. در این سطح سه مورد مهم را یاد می‌گیریم:</p>

<ul>
<li><strong>Positional Argument</strong></li>
<li><strong>Keyword Argument</strong></li>
<li><strong>Default Parameter</strong></li>
</ul>

<hr class="lesson-divider">

<h2 class="lesson-title">3. Positional Argument</h2>

<p>در <strong>Positional Argument</strong>، مقدار بر اساس <strong>جایگاه</strong> آن به Parameter مربوط می‌شود.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def subtract(a, b):
    return a - b

print(subtract(10, 3))</div>
</div>

<p>Python مقدارها را از چپ به راست قرار می‌دهد:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">10 → a
3  → b</div>
</div>

<p>بنابراین:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">10 - 3 = 7</div>
</div>

<p>اما اگر ترتیب را تغییر دهیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">print(subtract(3, 10))</div>
</div>

<p>خروجی می‌شود:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">-7</div>
</div>

<p>چون در Positional، <strong>ترتیب مهم است</strong>.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">4. Keyword Argument</h2>

<p>در <strong>Keyword Argument</strong>، علاوه بر مقدار، نام Parameter را نیز مشخص می‌کنیم.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def introduce(name, age):
    print("Name:", name)
    print("Age:", age)

introduce(name="Ali", age=20)</div>
</div>

<p>در این روش Python از نام Parameter برای قرار دادن مقدار استفاده می‌کند:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">name → "Ali"
age  → 20</div>
</div>

<p>مزیت مهم این روش این است که ترتیب Keywordها اهمیت ندارد:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">introduce(age=20, name="Ali")</div>
</div>

<p>این کد نیز همان نتیجه را دارد.</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">Name: Ali
Age: 20</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">5. Positional در برابر Keyword</h2>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>نوع</th>
<th>مثال</th>
<th>ترتیب مهم است؟</th>
</tr>
</thead>
<tbody>
<tr>
<td>Positional</td>
<td><code>add(10, 20)</code></td>
<td>بله</td>
</tr>
<tr>
<td>Keyword</td>
<td><code>add(a=10, b=20)</code></td>
<td>خیر</td>
</tr>
</tbody>
</table>
</div>

<p>پس یک قانون ساده:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">Positional → بر اساس جایگاه
Keyword   → بر اساس نام Parameter</div>
</div>

<h2 class="lesson-title">6. ترکیب Positional و Keyword</h2>

<p>این دو نوع Argument را می‌توانیم با هم استفاده کنیم.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def introduce(name, age):
    print(name, age)

introduce("Ali", age=20)</div>
</div>

<p>این کد صحیح است.</p>

<p>اما یک قانون مهم وجود دارد:</p>

<blockquote>
<strong>Positional Argument باید قبل از Keyword Argument قرار بگیرد.</strong>
</blockquote>

<p>درست:</p>

<div class="code-container">

<div class="code-block no-prompt">introduce("Ali", age=20)</div>

<span class="code-label">Python</span>
<div class="code-block no-prompt">introduce(name="Ali", 20)</div>
</div>

<p>چون بعد از یک Keyword Argument نمی‌توانیم یک Positional Argument معمولی قرار دهیم.</p>

<div class="code-container">

<div class="code-block no-prompt">ترتیب صحیح:

Positional → Keyword</div>
</div>

<h2 class="lesson-title">7. Default Parameter</h2>

<p>گاهی یک ورودی معمولاً مقدار مشخصی دارد و نمی‌خواهیم کاربر مجبور باشد هر بار آن را ارسال کند.</p>

<p>برای این کار می‌توانیم برای Parameter یک مقدار پیش‌فرض تعیین کنیم.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def greet(name="Guest"):
    print("Hello", name)</div>
</div>

<p>حالا دو حالت داریم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">greet("Ali")
greet()</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">Hello Ali
Hello Guest</div>
</div>

<p>وقتی Argument ارسال شود، مقدار ارسال‌شده استفاده می‌شود.</p>

<p>اگر Argument ارسال نشود، Python مقدار پیش‌فرض را استفاده می‌کند.</p>

<h2 class="lesson-title">8. Default Parameter چگونه کار می‌کند؟</h2>

<p>این تعریف:</p>

<h2 class="lesson-title">13. Scope چیست؟</h2>

<p>حالا از نحوه ارسال داده به Function عبور می‌کنیم و به محدوده متغیرها می‌رسیم.</p>

<p><strong>Scope</strong> یعنی محدوده‌ای که یک متغیر در آن قابل دسترسی است.</p>

<p>به این مثال توجه کن:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">name = "Ali"

def say_hello():
    print(name)

say_hello()</div>
</div>

<p>چون <code>name</code> خارج Function تعریف شده، تابع می‌تواند مقدار آن را بخواند.</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">Ali</div>
</div>

<p>اما اگر متغیر داخل Function ساخته شود:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def say_hello():
    message = "Hello"
    print(message)</div>
</div>

<p><code>message</code> متعلق به محدوده داخل Function است.</p>

<p>بنابراین این کد خارج Function به آن متغیر دسترسی مستقیم ندارد:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">print(message)</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">14. Local Variable</h2>

<p>متغیری که داخل Function تعریف می‌شود، در سطح Basic یک <strong>Local Variable</strong> محسوب می‌شود.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def calculate():
    result = 100
    print(result)

calculate()</div>
</div>

<p>اینجا <code>result</code> فقط در محدوده اجرای Function تعریف شده است.</p>

<p>بنابراین:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">print(result)</div>
</div>

<p>خارج از Function قابل دسترسی مستقیم نیست.</p>

<p>نکته مهم: <strong>Parameterهای Function نیز در محدوده همان Function قرار دارند.</strong></p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def square(number):
    return number * number</div>
</div>

<p><code>number</code> یک Parameter است و در جریان اجرای این Function در دسترس است.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">15. Global Variable</h2>

<p>اگر متغیری خارج از Function تعریف شود، در سطح Basic می‌توانیم آن را <strong>Global Variable</strong> در نظر بگیریم.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">name = "Ali"

def say_hello():
    print(name)

say_hello()</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">Ali</div>
</div>

<p>تابع توانسته متغیر Global را بخواند.</p>

<p>اما بهتر است Functionها برای دریافت اطلاعات موردنیاز خود، تا حد امکان به Parameterها تکیه کنند.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">16. چرا وابستگی به Global مناسب نیست؟</h2>

<p>این Function به یک متغیر بیرونی وابسته است:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">score = 20

def check_score():
    return score >= 10</div>
</div>

<p>روش بهتر این است که داده موردنیاز را به Function بدهیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def check_score(score):
    return score >= 10

result = check_score(20)</div>
</div>

<p>در نسخه دوم، Function ورودی خودش را دریافت می‌کند و به متغیر بیرونی وابسته نیست.</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>روش</th>
<th>ویژگی</th>
</tr>
</thead>
<tbody>
<tr>
<td>Global Variable</td>
<td>Function به بیرون وابسته است</td>
</tr>
<tr>
<td>Parameter</td>
<td>Function ورودی خودش را دریافت می‌کند</td>
</tr>
</tbody>
</table>
</div>

<p>برای طراحی Functionهای ساده و قابل استفاده مجدد، معمولاً روش دوم انتخاب بهتری است.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">17. تفاوت نام یکسان در Scopeهای مختلف</h2>

<p>ممکن است یک نام در دو Scope مختلف وجود داشته باشد.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">name = "Ali"

def show_name():
    name = "Sara"
    print(name)

show_name()
print(name)</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">Sara
Ali</div>
</div>

<p>چرا؟ چون دو متغیر در دو محدوده مختلف داریم:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">داخل Function:
name = "Sara"

خارج Function:
name = "Ali"</div>
</div>

<p>پس وجود یک نام یکسان لزوماً به معنی یک متغیر واحد نیست؛ <strong>Scope مهم است.</strong></p>

<hr class="lesson-divider">

<h2 class="lesson-title">18. یک Function خوب چه ساختاری دارد؟</h2>

<p>یکی از بهترین الگوهای ساده برای طراحی Function این است:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">Input
  ↓
Processing
  ↓
Output</div>
</div>

<p>مثلاً:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def calculate_average(score1, score2):
    return (score1 + score2) / 2</div>
</div>

<p>در این Function:</p>

<ul>
<li><code>score1</code> و <code>score2</code> → ورودی</li>
<li>جمع و تقسیم → پردازش</li>
<li><code>return</code> → خروجی</li>
</ul>

<p>این نوع طراحی باعث می‌شود Function ساده، قابل فهم و قابل استفاده مجدد باشد.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">19. چرا return بهتر از print است؟</h2>

<p>Function زیر نتیجه را برمی‌گرداند:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def calculate_average(a, b):
    return (a + b) / 2</div>
</div>

<p>به همین دلیل می‌توانیم نتیجه را در جاهای مختلف استفاده کنیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">average = calculate_average(10, 20)

print(average)</div>
</div>

<p>یا مستقیماً:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">print(calculate_average(10, 20))</div>
</div>

<p>یا حتی در یک شرط:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">if calculate_average(10, 20) >= 15:
    print("Good")</div>
</div>

<p>اما اگر Function فقط <code>print()</code> کند:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def calculate_average(a, b):
    print((a + b) / 2)</div>
</div>

<p>نتیجه فقط نمایش داده می‌شود و برای استفاده در بخش‌های دیگر برنامه در دسترس نیست.</p>

<p>برای Functionهای محاسباتی، این الگو معمولاً مناسب‌تر است:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">Function → return
Program  → print / use result</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">20. Functionها می‌توانند با هم همکاری کنند</h2>

<p>در برنامه‌های واقعی لازم نیست یک Function تمام کارها را انجام دهد.</p>

<p>می‌توانیم یک کار بزرگ را به چند Function کوچک تقسیم کنیم.</p>

<p>مثلاً در یک سیستم خرید:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">calculate_total()
        ↓
calculate_discount()
        ↓
calculate_tax()
        ↓
calculate_final_price()</div>
</div>

<p>هر Function یک مسئولیت مشخص دارد.</p>

<p>همچنین خروجی یک Function می‌تواند ورودی Function بعدی باشد.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def calculate_total(price, quantity):
    return price * quantity

def calculate_discount(total):
    return total * 0.10

total = calculate_total(200, 3)
discount = calculate_discount(total)

print(discount)</div>
</div>

<p>خروجی Function اول وارد Function دوم شده است.</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">calculate_total()
      ↓
    total
      ↓
calculate_discount()
      ↓
  discount</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">21. Function را بیش از حد بزرگ نکن</h2>

<p>اگر یک Function همزمان ورودی بگیرد، محاسبه کند، نتیجه را بررسی کند، گزارش بسازد و فایل ذخیره کند، نگهداری آن سخت‌تر می‌شود.</p>

<p>بهتر است منطق را به Functionهای کوچک‌تر تقسیم کنیم.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def calculate_average(score1, score2):
    return (score1 + score2) / 2


def check_result(average):
    if average >= 10:
        return "Pass"
    return "Fail"</div>
</div>

<p>حالا هر Function یک مسئولیت مشخص دارد:</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Function</th>
<th>وظیفه</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>calculate_average()</code></td>
<td>محاسبه میانگین</td>
</tr>
<tr>
<td><code>check_result()</code></td>
<td>بررسی قبولی</td>
</tr>
</tbody>
</table>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">22. ترکیب Function با شرط</h2>

<p>در Function می‌توانیم از شرط استفاده کنیم و در هر مسیر یک مقدار مناسب برگردانیم.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def check_score(score):
    if score >= 10:
        return "Pass"

    return "Fail"</div>
</div>

<p>اگر شرط درست باشد، <code>return "Pass"</code> اجرا می‌شود و Function همان‌جا تمام می‌شود.</p>

<p>اگر شرط درست نباشد، برنامه به <code>return "Fail"</code> می‌رسد.</p>

<p>این الگو در Functionهای Python بسیار رایج است.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">23. Function و input()</h2>

<p>می‌توانیم Function را با <code>input()</code> ترکیب کنیم، اما بهتر است مسئولیت‌ها را جدا نگه داریم.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def calculate_average(score1, score2):
    return (score1 + score2) / 2


score1 = float(input("Score 1: "))
score2 = float(input("Score 2: "))

average = calculate_average(score1, score2)

print("Average:", average)</div>
</div>

<p>در این ساختار:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">input()
   ↓
تبدیل نوع
   ↓
Function
   ↓
return
   ↓
print()</div>
</div>

<p>Function فقط کار خودش را انجام می‌دهد و دریافت Input و نمایش Output در بخش اصلی برنامه انجام می‌شود.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">24. Function و Loop</h2>

<p>Function را می‌توانیم داخل Loop نیز استفاده کنیم.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def square(number):
    return number * number


for number in range(1, 6):
    result = square(number)
    print(result)</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">1
4
9
16
25</div>
</div>

<p>Function یک بار تعریف شده، اما Loop آن را چند بار با Argumentهای مختلف اجرا می‌کند.</p>

<hr class="lesson-divider">

<h2 class="lesson-title">25. Function و List</h2>

<p>Function می‌تواند یک List را نیز به عنوان Argument دریافت کند.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def calculate_sum(numbers):
    return sum(numbers)


scores = [10, 15, 20]

result = calculate_sum(scores)

print(result)</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">45</div>
</div>

<p>اینجا:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">scores
   ↓
Argument

numbers
   ↓
Parameter</div>
</div>

<p>حتی می‌توانیم همین کار را با <code>for</code> خودمان انجام دهیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">def calculate_sum(numbers):
    total = 0

    for number in numbers:
        total += number

    return total


numbers = [10, 20, 30]

print(calculate_sum(numbers))</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">60</div>
</div>

<p>این مثال چند مفهوم قبلی را با هم ترکیب می‌کند:</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">List
 +
Function
 +
Parameter
 +
for
 +
Variable
 +
return</div>
</div>

<p>در این فصل یاد گرفتیم Function چگونه برنامه را از یک کد بزرگ و تکراری به قسمت‌های کوچک‌تر و قابل استفاده مجدد تبدیل می‌کند.</p>

<p>در این جلسه سه روش مهم برای کار با ورودی‌ها را یاد گرفتیم:</p>

<p>همچنین فهمیدیم <strong>Scope</strong> تعیین می‌کند یک متغیر در کجا قابل دسترسی باشد:</p>

<p>و مهم‌تر از همه، یک Function خوب معمولاً ساختار مشخصی دارد:</p>

<p>همچنین یک برنامه بزرگ را می‌توانیم به چند Function کوچک تقسیم کنیم؛ هر Function یک وظیفه مشخص انجام دهد و خروجی آن در صورت نیاز وارد Function بعدی شود.</p>

        const allSections = [];
        course.forEach((ch, chIdx) => {
            ch.sections.forEach((sec, secIdx) => {
                allSections.push(Object.assign({}, sec, {
                    chapterId: ch.id,
                    chapterTitle: ch.title,
                    badge: ch.badge,
                    chapterIndex: chIdx,
                    sectionIndex: secIdx,
                    totalInChapter: ch.sections.length,
                    isExercise: false
                }));
            });
            // اگر تمرینات فصل وجود دارد، به‌عنوان یک بخش عادی اضافه شود
            if (chapterExercises[ch.id]) {
                allSections.push({
                    id: 'chapter-exercises-' + ch.id,
                    title: 'تمرینات فصل',
                    chapterId: ch.id,
                    chapterTitle: ch.title,
                    badge: ch.badge,
                    chapterIndex: chIdx,
                    sectionIndex: ch.sections.length,
                    totalInChapter: ch.sections.length + 1,
                    isExercise: true
                });
            }
        });

        let currentIndex = 0;

        // ============================================================
        // ساخت TOC
        // ============================================================
        function buildTOC() {
            const toc = document.getElementById('tocNav');
            toc.innerHTML = '';

            course.forEach((ch, idx) => {
                const details = document.createElement('details');
                details.className = 'toc-chapter';
                if (idx === 0) details.open = true;

                const summary = document.createElement('summary');
                summary.innerHTML = '<span class="chapter-num">' + ch.badge + '</span><span>' + ch.title +
                '</span>';
                details.appendChild(summary);

                const ul = document.createElement('ul');
                ul.className = 'toc-sections';

                ch.sections.forEach(sec => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = '#' + sec.id;
                    a.textContent = sec.title;
                    a.dataset.id = sec.id;

                    a.addEventListener('click', function(e) {
                        e.preventDefault();
                        const index = allSections.findIndex(s => s.id === sec.id);
                        if (index !== -1) showSection(index);
                    });

                    li.appendChild(a);
                    ul.appendChild(li);
                });

                // تمرینات فصل — فقط اگر محتوا وجود داشته باشد
                if (chapterExercises[ch.id]) {
                    const practiceLi = document.createElement('li');
                    practiceLi.className = 'toc-practice';

                    const practiceA = document.createElement('a');
                    const practiceId = 'chapter-exercises-' + ch.id;
                    practiceA.href = '#' + practiceId;
                    practiceA.innerHTML = '<i class="fas fa-dumbbell"></i> تمرینات فصل';
                    practiceA.dataset.id = practiceId;
                    practiceA.title = 'تمرینات فصل';

                    practiceA.addEventListener('click', function(e) {
                        e.preventDefault();
                        const index = allSections.findIndex(s => s.id === practiceId);
                        if (index !== -1) showSection(index);
                    });

                    practiceLi.appendChild(practiceA);
                    ul.appendChild(practiceLi);
                }

                details.appendChild(ul);
                toc.appendChild(details);
            });
        }

        // ============================================================
        // ساخت بخش‌ها
        // ============================================================

        // ============================================================
        // Syntax Highlighting for static code blocks (Highlight.js)
        // ============================================================
        function highlightCodeBlocks(root) {
            if (typeof hljs === 'undefined') return;
            const scope = root || document;
            const blocks = scope.querySelectorAll('.code-block:not(.hljs-processed)');
            blocks.forEach(function(block) {
                if (block.querySelector('pre code')) {
                    block.classList.add('hljs-processed');
                    return;
                }
                const codeText = block.textContent;
                if (!codeText || !codeText.trim()) {
                    block.classList.add('hljs-processed');
                    return;
                }
                // Detect label from parent container to decide language
                let lang = 'python';
                const container = block.closest('.code-container');
                if (container) {
                    const label = container.querySelector('.code-label');
                    if (label) {
                        const t = (label.textContent || '').trim().toLowerCase();
                        // Only pure output / non-code labels stay unhighlighted (plaintext)
                        if (t === 'output' || t === 'خروجی' || t === 'اطلاعات' || t === 'مثال') {
                            lang = 'plaintext';
                        }
                    }
                }
                const isNoPrompt = block.classList.contains('no-prompt');
                const pre = document.createElement('pre');
                pre.className = 'hljs';
                const code = document.createElement('code');
                code.className = 'language-' + lang;
                code.textContent = codeText;
                pre.appendChild(code);
                block.textContent = '';
                block.appendChild(pre);
                block.classList.add('hljs-processed');
                if (isNoPrompt) block.classList.add('no-prompt');
                try {
                    hljs.highlightElement(code);
                } catch (e) {
                    console.warn('Highlight error:', e);
                }
            });
            scope.querySelectorAll('pre code[class*="language-"]:not(.hljs)').forEach(function(el) {
                try { hljs.highlightElement(el); } catch (e) {}
            });
        }

        function buildSections() {
            const main = document.getElementById('mainContent');
            main.innerHTML = '';

            allSections.forEach((sec, idx) => {
                const div = document.createElement('div');
                div.className = 'section' + (idx === 0 ? ' active' : '');
                div.id = sec.id;

                const isFirst = idx === 0;
                const isLast = idx === allSections.length - 1;

                let body = '';

                if (sec.isExercise && chapterExercises[sec.chapterId]) {
                    body = `
                        <div class="section-header">
                            <div class="section-badge">${sec.badge}</div>
                            <div>
                                <h1>تمرینات فصل — ${sec.chapterTitle}</h1>
                                <div class="meta">${sec.chapterTitle} · تمرینات فصل</div>
                            </div>
                        </div>
                        ${chapterExercises[sec.chapterId]}
                    `;
                } else if (richContent[sec.id]) {
                    body = richContent[sec.id];
                } else {
                    body = `
                        <div class="section-header">
                            <div class="section-badge">${sec.badge}</div>
                            <div>
                                <h1>${sec.title}</h1>
                                <div class="meta">${sec.chapterTitle} · بخش ${sec.sectionIndex + 1} از ${sec.totalInChapter}</div>
                            </div>
                        </div>
                        <div class="placeholder">
                            <i class="fas fa-laptop-code"></i>
                            <p>محتوای این بخش در حال آماده‌سازی است...</p>
                            <p style="font-size:0.9rem;margin-top:6px;opacity:0.8;">${sec.chapterTitle} — ${sec.title}</p>
                        </div>
                    `;
                }

                body += `
                    <div class="nav-buttons">
                        <button class="nav-btn" ${isFirst ? 'disabled' : ''} onclick="goToPrev()">
                            ${isFirst ? 'بخش قبلی' : '<i class="fas fa-arrow-right"></i> بخش قبلی'}
                        </button>
                        <button class="nav-btn" ${isLast ? 'disabled' : ''} onclick="goToNext()">
                            ${isLast ? 'پایان' : 'بخش بعدی <i class="fas fa-arrow-left"></i>'}
                        </button>
                    </div>
                `;

                div.innerHTML = body;
                main.appendChild(div);
            });
        }

        // ============================================================
        // توابع ناوبری
        // ============================================================
        // تمرینات فصل به‌عنوان section عادی نمایش داده می‌شوند
        function showChapterExercises(chapterId, chapterTitle) {
            const practiceId = 'chapter-exercises-' + chapterId;
            const index = allSections.findIndex(s => s.id === practiceId);
            if (index !== -1) {
                showSection(index);
                return;
            }
            alert('تمرینات این فصل هنوز آماده نشده است.');
        }

        function showSection(index) {
            if (index < 0 || index >= allSections.length) return;

            currentIndex = index;

            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(allSections[index].id);
            if (target) target.classList.add('active');

            document.querySelectorAll('.toc-sections a').forEach(a => {
                a.classList.remove('active');
                if (a.dataset.id === allSections[index].id) a.classList.add('active');
            });

            const chIdx = allSections[index].chapterIndex;
            document.querySelectorAll('.toc-chapter').forEach((d, i) => {
                d.open = (i === chIdx);
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (window.innerWidth <= 1000) closeSidebar();

            // بعد از نمایش بخش، ادیتورهای CodeMirror را refresh کن + هایلایت کدهای ثابت
            setTimeout(function() {
                document.querySelectorAll('.section.active .python-playground .CodeMirror').forEach(function(cmEl) {
                    if (cmEl.CodeMirror) {
                        try { cmEl.CodeMirror.refresh(); } catch (e) {}
                    }
                });
                // هایلایت بلاک‌های کد پایتون در بخش فعلی
                const activeSec = document.querySelector('.section.active');
                if (activeSec) highlightCodeBlocks(activeSec);
            }, 50);
        }

        function goToPrev() {
            if (currentIndex > 0) showSection(currentIndex - 1);
        }

        function goToNext() {
            if (currentIndex < allSections.length - 1) showSection(currentIndex + 1);
        }

        // ============================================================
        // سایدبار

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const toggleBtn = document.getElementById('sidebarToggle');
        const closeBtn = document.getElementById('sidebarClose');

        function openSidebar() {
            sidebar.classList.add('open');
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        toggleBtn.addEventListener('click', openSidebar);
        closeBtn.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);

        // ============================================================
        // تم
        // ============================================================
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.querySelector('.theme-icon');
            if (theme === 'dark') {
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        // ============================================================
        // کوئیزها
        // ============================================================
        function selectOption(btn) {
            const parent = btn.parentElement;
            parent.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            parent.nextElementSibling.classList.add('show');
        }

        // ============================================================
        // نوار پیشرفت
        // ============================================================
        window.onscroll = function() {
            const scroll = document.documentElement.scrollTop || document.body.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            document.getElementById('progressBar').style.width = (height > 0 ? (scroll / height * 100) : 0) + '%';
        };

        // ============================================================
        // کلیدهای صفحه‌کلید
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSidebar();
            if (e.key === 'ArrowLeft') goToNext();
            if (e.key === 'ArrowRight') goToPrev();
        });

        // ============================================================
        // بسته‌بندی جدول‌ها
        // ============================================================
        function wrapTables() {
            document.querySelectorAll('.section table').forEach(function(table) {
                if (table.parentElement && table.parentElement.classList.contains('table-wrap')) return;
                var wrap = document.createElement('div');
                wrap.className = 'table-wrap';
                table.parentNode.insertBefore(wrap, table);
                wrap.appendChild(table);
            });
        }

        // ============================================================
        // مقداردهی اولیه
        // ============================================================
        buildTOC();
        buildSections();
        wrapTables();
        // Highlight all static code blocks after content is built
        setTimeout(function() { highlightCodeBlocks(document); }, 100);
        showSection(0);
    </script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>


<script>
(function () {
    const playgrounds = Array.from(document.querySelectorAll('.python-playground[data-playground]'));
    if (!playgrounds.length || typeof CodeMirror === 'undefined') return;

    let pyodide = null;
    let pyodideReady = false;
    let loadingPromise = null;
    const editors = new Map();

    function setOutput(root, text, type) {
        const out = root.querySelector('.playground-output');
        if (!out) return;
        out.textContent = text;
        out.classList.remove('error', 'success', 'loading');
        if (type) out.classList.add(type);
    }
    function setStatus(root, text) {
        const el = root.querySelector('.playground-status');
        if (el) el.textContent = text;
    }

    function setupEditors() {
        playgrounds.forEach(root => {
            const ta = root.querySelector('.python-editor');
            if (!ta) return;
            const editor = CodeMirror.fromTextArea(ta, {
                mode: 'python', theme: 'dracula', lineNumbers: true,
                indentUnit: 4, tabSize: 4, indentWithTabs: false,
                lineWrapping: true, autofocus: false, viewportMargin: Infinity,
                extraKeys: {
                    'Ctrl-Enter': () => run(root),
                    'Cmd-Enter': () => run(root),
                    'Tab': cm => cm.somethingSelected() ? cm.indentSelection('add') : cm.replaceSelection('    ', 'end')
                }
            });
            editors.set(root, editor);
            root.querySelector('[data-action="run"]').addEventListener('click', () => run(root));
            root.querySelector('[data-action="clear"]').addEventListener('click', () => {
                setOutput(root, '▶ Output cleared. Run the code.');
                setStatus(root, pyodideReady ? '' : 'Preparing...');
            });
            setTimeout(() => editor.refresh(), 200);
        });
    }

    async function loadPyodideOnce() {
        if (pyodideReady) return true;
        if (loadingPromise) return loadingPromise;
        loadingPromise = (async () => {
            playgrounds.forEach(r => { setStatus(r, 'Loading...'); setOutput(r, '⏳ Loading the Python interpreter (this may take a moment the first time)...', 'loading'); });
            try {
                pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });
                pyodide.runPython(`
import builtins
from js import prompt as _browser_prompt
def _input(prompt=""):
    result = _browser_prompt(str(prompt) if prompt else "")
    return "" if result is None else str(result)
builtins.input = _input
`);
                pyodideReady = true;
                playgrounds.forEach(r => { setStatus(r, ''); setOutput(r, '✅ Interpreter ready', 'success'); });
                return true;
            } catch (err) {
                playgrounds.forEach(r => { setStatus(r, 'Error'); setOutput(r, '❌ Error loading the interpreter: ' + (err.message || String(err)), 'error'); });
                return false;
            }
        })();
        return loadingPromise;
    }

    async function run(root) {
        const editor = editors.get(root);
        if (!editor || root.dataset.running === '1') return;
        root.dataset.running = '1';
        const runBtn = root.querySelector('[data-action="run"]');
        if (runBtn) runBtn.disabled = true;
        try {
            if (!(await loadPyodideOnce())) return;
            const code = editor.getValue();
            if (!code.trim()) { setOutput(root, '⚠️ Please write some code.', 'loading'); return; }
            setOutput(root, '⏳ Running...', 'loading'); setStatus(root, 'Running...');
            pyodide.runPython(`
import sys
from io import StringIO
__stdout_backup = sys.stdout
__stderr_backup = sys.stderr
sys.stdout = StringIO()
sys.stderr = StringIO()
`);
            let result = null, error = null;
            try { result = await pyodide.runPythonAsync(code); } catch (e) { error = e; }
            const captured = pyodide.runPython(`
out = sys.stdout.getvalue()
err = sys.stderr.getvalue()
sys.stdout = __stdout_backup
sys.stderr = __stderr_backup
out + (err if err else "")
`);
            let finalOutput = (captured || '').trimEnd();
            if (result !== undefined && result !== null && String(result) !== 'None') finalOutput += (finalOutput ? '\n' : '') + String(result);
            if (error) {
                let msg = error.message || String(error);
                msg = msg.replace(/File "<exec>", line \d+, in <module>\n?/g, '').replace(/File "<exec>", line \d+, in /g, '').trim();
                setOutput(root, (finalOutput ? finalOutput + '\n\n' : '') + '❌ ' + msg, 'error');
                setStatus(root, 'Error');
            } else {
                setOutput(root, finalOutput || '✅ Executed (no output)', finalOutput ? null : 'success');
                setStatus(root, '');
            }
        } finally {
            root.dataset.running = '0';
            if (runBtn) runBtn.disabled = false;
            try { editor.refresh(); } catch(e) {}
        }
    }

    document.querySelectorAll('.solution-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
            const target = document.getElementById(btn.dataset.solution);
            if (!target) return;
            const show = target.classList.toggle('show');
            btn.innerHTML = show ? '<i class="fas fa-eye-slash"></i> مخفی‌کردن پاسخ' : '<i class="fas fa-eye"></i> نمایش پاسخ';
        });
    });

    setupEditors();
    window.addEventListener('resize', () => editors.forEach(e => { try { e.refresh(); } catch(_) {} }));
    window.addEventListener('load', () => setTimeout(loadPyodideOnce, 400));
    if (document.readyState === 'complete') setTimeout(loadPyodideOnce, 500);
})();
</script>
