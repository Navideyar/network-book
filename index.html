<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>رودمپ مطالعاتی امنیت سایبری</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-gradient: linear-gradient(145deg, #eef2f5 0%, #d5dce4 100%);
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(255, 255, 255, 0.95);
            --text-primary: #0f263b;
            --text-secondary: #3d5a73;
            --accent-color: #0088cc;
            --shadow-glass: 0 8px 30px 0 rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 15px 40px 0 rgba(0, 0, 0, 0.10);
            --coming-soon-bg: rgba(0, 0, 0, 0.04);
            --coming-soon-text: #888;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(145deg, #0f1a24 0%, #1a2a38 100%);
            --card-bg: rgba(30, 45, 58, 0.88);
            --card-border: rgba(255, 255, 255, 0.06);
            --text-primary: #e8edf2;
            --text-secondary: #9ab0c4;
            --shadow-glass: 0 8px 30px 0 rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 15px 40px 0 rgba(0, 0, 0, 0.4);
            --coming-soon-bg: rgba(255, 255, 255, 0.05);
            --coming-soon-text: #7a8a9a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 25px 15px;
            background-attachment: fixed;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        /* --- هدر (پروفایل و تلگرام) --- */
        .header-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 10px 14px;
            margin-bottom: 28px;
            box-shadow: var(--shadow-glass);
            transition: background 0.3s, border 0.3s;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.04);
        }

        .profile-text {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
        }

        .profile-name {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
            transition: color 0.3s;
        }

        .telegram-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #ffffff;
            color: var(--accent-color);
            padding: 5px 12px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.7rem;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0, 136, 204, 0.08);
            border: 1px solid rgba(0, 136, 204, 0.1);
            transition: all 0.3s ease;
            direction: ltr;
        }

        .telegram-btn svg {
            width: 14px;
            height: 14px;
            fill: var(--accent-color);
            flex-shrink: 0;
        }

        .telegram-btn:hover, .telegram-btn:active {
            background: var(--accent-color);
            color: white;
            transform: scale(1.05);
        }

        .telegram-btn:hover svg, .telegram-btn:active svg {
            fill: white;
        }

        /* --- تیتر اصلی --- */
        .title-wrapper {
            text-align: center;
            margin-bottom: 22px;
            padding: 0 5px;
        }

        .main-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
            display: block;
        }
        
        .main-title span {
            background: linear-gradient(135deg, #0f263b 0%, #1a6b8a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        [data-theme="dark"] .main-title span {
            background: linear-gradient(135deg, #e8edf2 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* --- لیست کارت‌های دوره --- */
        .course-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .course-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: var(--shadow-glass);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 58px;
            transition: background 0.3s, border 0.3s, box-shadow 0.3s;
        }

        .course-card:active {
            transform: scale(0.97);
        }

        .course-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .course-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .course-number {
            width: 32px;
            height: 32px;
            background: var(--text-primary);
            color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            flex-shrink: 0;
            transition: background 0.3s;
        }

        [data-theme="dark"] .course-number {
            background: #3b82f6;
        }

        .course-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: var(--text-primary);
            transition: color 0.3s;
        }

        .course-status {
            font-size: 0.65rem;
            color: var(--coming-soon-text);
            background: var(--coming-soon-bg);
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.3s, color 0.3s;
        }

        .arrow-icon {
            color: #b0b0b0;
            font-size: 1.2rem;
            font-weight: 300;
            transition: transform 0.3s ease, color 0.3s;
        }
        
        .course-card:hover .arrow-icon {
            transform: translateX(4px);
            color: var(--text-secondary);
        }

        .course-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .course-link-disabled {
            cursor: default;
        }

        .course-link-disabled .course-card:hover {
            transform: none;
            box-shadow: var(--shadow-glass);
        }

        .course-link-disabled .course-card:hover .arrow-icon {
            transform: none;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.65rem;
            color: rgba(0,0,0,0.2);
            transition: color 0.3s;
        }

        [data-theme="dark"] .footer {
            color: rgba(255,255,255,0.15);
        }

        /* دکمه تغییر تم (پنهان ولی فعال) */
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: var(--shadow-glass);
            transition: all 0.3s;
            z-index: 999;
            color: var(--text-primary);
            backdrop-filter: blur(8px);
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- هدر -->
        <div class="header-section">
            <div class="profile-info">
                <img src="profile.jpg" alt="پروفایل" class="profile-img">
                <div class="profile-text">
                    <span class="profile-name">Navidyar</span>
                </div>
            </div>
            <a href="https://t.me/ZeroDay_Ch" target="_blank" class="telegram-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
                </svg>
                <span>@ZeroDay_Ch</span>
            </a>
        </div>

        <!-- تیتر اصلی -->
        <div class="title-wrapper">
            <div class="main-title">
                <span>مسیر طرح نام آور</span>
            </div>
        </div>

        <!-- لیست دوره‌ها -->
        <div class="course-grid">
            
            <!-- 1. Network+ (فعال) -->
            <a href="network-plus.html" class="course-link">
                <div class="course-card">
                    <div class="course-info">
                        <span class="course-number">1</span>
                        <span class="course-title">Network+</span>
                    </div>
                    <span class="arrow-icon">›</span>
                </div>
            </a>

            <!-- 2. LPIC-1 (به زودی) -->
            <div class="course-link-disabled">
                <div class="course-card">
                    <div class="course-info">
                        <span class="course-number">2</span>
                        <span class="course-title">LPIC-1</span>
                    </div>
                    <span class="course-status">به زودی</span>
                </div>
            </div>

            <!-- 3. Python (به زودی) -->
            <div class="course-link-disabled">
                <div class="course-card">
                    <div class="course-info">
                        <span class="course-number">3</span>
                        <span class="course-title">Python</span>
                    </div>
                    <span class="course-status">به زودی</span>
                </div>
            </div>

            <!-- 4. MCSA (به زودی) -->
            <div class="course-link-disabled">
                <div class="course-card">
                    <div class="course-info">
                        <span class="course-number">4</span>
                        <span class="course-title">MCSA</span>
                    </div>
                    <span class="course-status">به زودی</span>
                </div>
            </div>

            <!-- 5. CEH (به زودی) -->
            <div class="course-link-disabled">
                <div class="course-card">
                    <div class="course-info">
                        <span class="course-number">5</span>
                        <span class="course-title">CEH</span>
                    </div>
                    <span class="course-status">به زودی</span>
                </div>
            </div>

            <!-- 6. SANS (به زودی) -->
            <div class="course-link-disabled">
                <div class="course-card">
                    <div class="course-info">
                        <span class="course-number">6</span>
                        <span class="course-title">SANS</span>
                    </div>
                    <span class="course-status">به زودی</span>
                </div>
            </div>

        </div>

        <div class="footer">
            تمامی حقوق محفوظ است | ZeroDay
        </div>

    </div>

    <!-- دکمه تغییر تم -->
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="تغییر تم">
        🌙
    </button>

    <script>
        // تغییر تم (شب/روز)
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        updateThemeUI(currentTheme);

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeUI(newTheme);
        }

        function updateThemeUI(theme) {
            const btn = document.querySelector('.theme-toggle');
            if (theme === 'dark') {
                btn.textContent = '☀️';
            } else {
                btn.textContent = '🌙';
            }
        }
    </script>

</body>
</html>
