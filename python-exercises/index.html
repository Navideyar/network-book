        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { overflow-x: hidden; max-width: 100%; }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: 'PeydaWeb', 'Vazirmatn', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.85;
            font-size: 16.5px;
            padding-top: 116px;
            transition: background 0.2s ease, color 0.2s ease;
            overflow-x: hidden;
        }
        button, input, textarea, select { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }
        code, pre, .code-text { font-family: 'JetBrains Mono', monospace; }
        code {
            direction: ltr;
            unicode-bidi: isolate;
            background: var(--primary-soft);
            color: var(--primary-hover);
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 0.9em;
        }
        pre {
            margin: 0;
            max-width: 100%;
            overflow-x: auto;

        function secureRandomInt(max) {
            if (max <= 0) return 0;
            if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
                const limit = Math.floor(0x100000000 / max) * max;
                const buf = new Uint32Array(1);
                let value;
                do {
                    window.crypto.getRandomValues(buf);
                    value = buf[0];
                } while (value >= limit);
                return value % max;
            }
            return Math.floor(Math.random() * max);
        }

        function shuffle(array) {
            const result = [...array];
            for (let i = result.length - 1; i > 0; i--) {
                const j = secureRandomInt(i + 1);
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

            return String(value).replace(/\d/g, d => digits[d]);
        }

        function optionLabel(index) {
            return String.fromCharCode(65 + index) + '.';
        }

        function buildExercise(exId) {
            const wrap = document.getElementById('cards-' + exId);
            const source = exercisesData[exId] || [];
            if (!wrap) return;
            scores[exId] = {};
            runtimeSets[exId] = shuffle(source).map(item => ({
                ...item,
                options: shuffle(item.options.map(text => ({ text, correct: text === item.answer })))
            }));

            wrap.innerHTML = '';
            runtimeSets[exId].forEach((item, qIdx) => {
                const card = document.createElement('article');
                card.className = 'quiz-card';
                card.dataset.q = item.id;

                const questionCode = item.code
                    ? `<div class="question-code"><pre><code>${escapeAttr(item.code)}</code></pre></div>`
                    : '';

                const optionsHtml = item.options.map((opt, oIdx) => `
                    <button type="button" data-qidx="${qIdx}" data-opt="${oIdx}" aria-label="گزینه ${optionLabel(oIdx)}">
                        <span class="option-letter">${optionLabel(oIdx)}</span>
                        <span class="option-content">${opt.text}</span>
                    </button>
                `).join('');

                const answerText = item.options.find(opt => opt.correct)?.text || item.answer;
                let answerHtml = `<span class="answer-title">✅ پاسخ صحیح: </span>${answerText}<br><br>${item.explain}`;
                if (item.other_options && item.other_options.length) {
                    answerHtml += `<div class="other-options"><span class="other-options-title">بررسی گزینه‌های دیگر:</span><ul>${item.other_options.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
                }

                card.innerHTML = `
                    <p><span class="q-num">❓ تست ${toFa(qIdx + 1)}:</span><span class="question-text">${item.q}</span></p>
                    ${questionCode}
                    <div class="quiz-options" id="opts-${exId}-${qIdx}">${optionsHtml}</div>
                    <div class="quiz-answer" id="answer-${exId}-${qIdx}">${answerHtml}</div>
                    <div class="card-footer">
                        <button class="peek-btn" type="button" data-action="peek" data-ex="${exId}" data-qidx="${qIdx}">
                            <i class="fas fa-eye" id="peek-icon-${exId}-${qIdx}" aria-hidden="true"></i>
                            <span id="peek-text-${exId}-${qIdx}">نمایش پاسخ</span>
                        </button>
                    </div>
                `;
                wrap.appendChild(card);
            });

            const total = document.getElementById('total-' + exId);
            if (total) total.textContent = toFa(source.length);
            updateScore(exId);
        }

        function selectAnswer(exId, qIdx, oIdx) {
            const optsWrap = document.getElementById(`opts-${exId}-${qIdx}`);
            if (!optsWrap || optsWrap.classList.contains('locked')) return;

            const item = runtimeSets[exId][qIdx];
            const buttons = [...optsWrap.querySelectorAll('button')];
            const isCorrect = !!item.options[oIdx]?.correct;

            buttons.forEach((button, i) => {
                const option = item.options[i];
                button.disabled = true;
                if (option.correct) button.classList.add('correct-opt');
                if (i === oIdx) {
                    if (isCorrect) button.classList.add('selected', 'correct-opt');
                    else button.classList.add('wrong-opt');
                }
            });

            optsWrap.classList.add('locked');
            const answerBox = document.getElementById(`answer-${exId}-${qIdx}`);
            if (answerBox) answerBox.classList.add('show');

            scores[exId][item.id] = isCorrect;
            updateScore(exId);
        }

        function togglePeek(exId, qIdx) {
            const answerBox = document.getElementById(`answer-${exId}-${qIdx}`);
            const icon = document.getElementById(`peek-icon-${exId}-${qIdx}`);
            const text = document.getElementById(`peek-text-${exId}-${qIdx}`);
            if (!answerBox || !icon || !text) return;
            const shown = answerBox.classList.toggle('show');
            icon.className = shown ? 'fas fa-eye-slash' : 'fas fa-eye';
            text.textContent = shown ? 'مخفی کردن پاسخ' : 'نمایش پاسخ';
        }

        function showAllAnswers(exId) {
            document.querySelectorAll(`#cards-${exId} .quiz-answer`).forEach(el => el.classList.add('show'));
            document.querySelectorAll(`#cards-${exId} [data-action="peek"]`).forEach(btn => {
                const icon = btn.querySelector('i');
                const text = btn.querySelector('span');
                if (icon) icon.className = 'fas fa-eye-slash';
                if (text) text.textContent = 'مخفی کردن پاسخ';
            });
        }

        function hideAllAnswers(exId) {
            document.querySelectorAll(`#cards-${exId} .quiz-answer`).forEach(el => el.classList.remove('show'));
            document.querySelectorAll(`#cards-${exId} [data-action="peek"]`).forEach(btn => {
                const icon = btn.querySelector('i');
                const text = btn.querySelector('span');
                if (icon) icon.className = 'fas fa-eye';
                if (text) text.textContent = 'نمایش پاسخ';
            });
        }

        function resetExercise(exId) {
            buildExercise(exId); // Reset also reshuffles questions and options.
        }

        function updateScore(exId) {
            const el = document.getElementById('score-' + exId);
            if (!el) return;
            const correctCount = Object.values(scores[exId]).filter(Boolean).length;
            el.textContent = toFa(correctCount);
        }

        function setActivePage(pageId) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const active = btn.dataset.page === pageId;
                btn.classList.toggle('active', active);
                btn.setAttribute('aria-selected', String(active));
            });
            document.querySelectorAll('.page').forEach(page => page.classList.toggle('active', page.id === pageId));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleTheme() {
            const html = document.documentElement;
            const newTheme = html.dataset.theme === 'dark' ? 'light' : 'dark';
            html.dataset.theme = newTheme;
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.querySelector('.theme-icon');
            if (!icon) return;
            icon.className = theme === 'dark' ? 'fas fa-sun theme-icon' : 'fas fa-moon theme-icon';
        }

        document.addEventListener('click', event => {
            const tab = event.target.closest('.tab-btn');
            if (tab) {
                setActivePage(tab.dataset.page);
                return;
            }

            const option = event.target.closest('.quiz-options button');
            if (option) {
                const wrap = option.closest('.quiz-options');
                const exId = wrap?.id.split('-')[1];
                const qIdx = Number(option.dataset.qidx);
                const oIdx = Number(option.dataset.opt);
                if (exId && Number.isInteger(qIdx) && Number.isInteger(oIdx)) selectAnswer(exId, qIdx, oIdx);
                return;
            }

            const action = event.target.closest('[data-action]');
            if (!action) return;
            const exId = action.dataset.ex;
            if (action.dataset.action === 'show-all') showAllAnswers(exId);
            else if (action.dataset.action === 'hide-all') hideAllAnswers(exId);
            else if (action.dataset.action === 'reset') resetExercise(exId);
            else if (action.dataset.action === 'peek') togglePeek(exId, Number(action.dataset.qidx));
        });

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
        updateThemeIcon(document.documentElement.dataset.theme);
        document.getElementById('themeBtn').addEventListener('click', toggleTheme);

        buildExercise('ex1');
        buildExercise('ex2');

        ['ex3', 'ex4'].forEach(exId => {
            const total = document.getElementById('total-' + exId);
            if (total) total.textContent = toFa(exercisesData[exId].length);
            updateScore(exId);
        });
    </script>
</body>
</html>
