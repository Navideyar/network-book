<h2>02. ابزارهای Footprinting</h2>
<p>علاوه بر روش‌های دستی، ابزارهای قدرتمندی برای اتوماتیک‌سازی فرآیند Footprinting وجود دارند که سرعت و دقت کار را چندین برابر می‌کنند:</p>

<img src="images/CEHv13_02/slide_36.webp" alt="Footprinting Tools" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۶: ابزارهای پیشرفته Footprinting</div>

<ul>
<li><strong>Maltego:</strong> یک ابزار قدرتمند برای تحلیل داده‌ها و کشف روابط بین موجودیت‌ها (افراد، سازمان‌ها، دامنه‌ها، IPها). Maltego این روابط را به صورت گرافیکی (نمودار) نمایش می‌دهد.</li>
<li><strong>Recon-ng:</strong> یک چارچوب (Framework) ماژولار برای Footprinting و Reconnaissance که شبیه به Metasploit عمل می‌کند و از ماژول‌های مختلف برای جمع‌آوری اطلاعات از منابع عمومی (OSINT) استفاده می‌کند.</li>
<li><strong>FOCA:</strong> ابزاری برای استخراج متادیتا (Metadata) از اسناد (مثل PDF، Word، Excel) که به‌طور عمومی در وب‌سایت‌ها منتشر شده‌اند. متادیتا می‌تواند شامل نام کاربری، مسیرهای شبکه، نرم‌افزارهای استفاده‌شده و حتی رمزهای عبور باشد!</li>
<li><strong>Metagoofil:</strong> مشابه FOCA، برای استخراج متادیتا از فایل‌های عمومی طراحی شده است.</li>
<li><strong>ابزارهای دیگر:</strong> Prefix Whois، Netmask، Net Scan Tools Pro، Binging، Tctrace، Search Bug.</li>
</ul>

<div class="box note"><i class="fas fa-search-plus"></i><div><strong>چرا FOCA خطرناک است؟</strong>سازمان‌ها اغلب فایل‌های PDF یا Word خود (مثل بروشورها یا گزارش‌های مالی) را به صورت آنلاین قرار می‌دهند. این فایل‌ها حاوی متادیتای پنهانی هستند که ممکن است شامل نام نویسنده، مسیر ذخیره‌سازی (مثل <code>C:\\Users\\Admin\\Desktop\\SecretProject</code>) و حتی نام سرورهای داخلی باشد. FOCA این اطلاعات را استخراج کرده و نقشه‌ای از شبکه داخلی به مهاجم می‌دهد.</div></div>

<h2>03. ابزارهای OSINT مبتنی بر هوش مصنوعی (AI-Powered OSINT)</h2>
<p>هوش مصنوعی انقلابی در جمع‌آوری اطلاعات ایجاد کرده است. ابزارهای AI-Powered OSINT می‌توانند حجم عظیمی از داده‌ها را در چند ثانیه تحلیل کنند و الگوهایی را کشف کنند که برای انسان‌ها قابل مشاهده نیست.</p>

<img src="images/CEHv13_02/slide_37.webp" alt="Taranis AI" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۷: Taranis AI و ابزارهای OSINT مبتنی بر هوش مصنوعی</div>

<ul>
<li><strong>Taranis AI:</strong> یک ابزار OSINT است که با استفاده از هوش مصنوعی، اطلاعاتی را از منابع متنوع مثل وب‌سایت‌ها و خبرگزاری‌ها استخراج می‌کند. کاربرد اصلی آن در تحلیل ریسک در فضای سایبری، نظارت بر اخبار امنیتی درباره یک کشور، سازمان یا فرد است. Taranis AI برای سناریوهایی مثل تحلیل لحظه‌ای تهدیدات سایبری، پایش ریسک رسانه‌ای یا پیش‌بینی بحران‌های امنیتی، ابزاری بسیار هوشمند و کارآمد محسوب می‌شود.</li>
<li><strong>DorkGPT و DorkGenius:</strong> ابزارهای مبتنی بر AI برای تولید خودکار Google Dorkهای پیشرفته. شما یک هدف را وارد می‌کنید و AI بهترین Dorkها را برای یافتن اطلاعات حساس تولید می‌کند.</li>
<li><strong>DarkGPT:</strong> یک ابزار AI برای جستجو و تحلیل در وب تاریک (Dark Web). این ابزار می‌تواند به شناسایی تهدیدات و اطلاعات لو رفته در بازارهای سیاه کمک کند.</li>

<h2>04. مقابله با Footprinting (Countermeasures)</h2>
<p>حالا که با قدرت Footprinting آشنا شدیم، وقت آن است که یاد بگیریم چطور از سازمان خود در برابر آن محافظت کنیم. مقابله با Footprinting شامل مسدود کردن دسترسی به اطلاعات و افزایش آگاهی است.</p>

<img src="images/CEHv13_02/slide_38.webp" alt="Footprinting Countermeasures" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۸: راه‌های مقابله با Footprinting</div>

<p>مهم‌ترین اقدامات دفاعی عبارتند از:</p>
<ul>
<li><strong>محدودسازی شبکه:</strong> محدود نمودن کارمندان برای دسترسی به سایت‌های شبکه‌های اجتماعی از طریق شبکه سازمان.</li>
<li><strong>پیکربندی صحیح سرور:</strong> پیکربندی صحیح وب سرور برای جلوگیری از نشت اطلاعات و غیرفعال کردن پروتکل‌های ناخواسته (مثل بستن Directory Listing در Apache).</li>
<li><strong>استفاده از IDS:</strong> استفاده از سیستم تشخیص نفوذ به منظور شناسایی ترافیک‌های مشکوک Footprinting.</li>
<li><strong>آموزش کارمندان:</strong> آموزش کارمندان برای استفاده از نام‌های مستعار در وبلاگ‌ها و انجمن‌ها و عدم افشای اطلاعات شخصی/سازمانی.</li>
<li><strong>ارزیابی اطلاعات:</strong> ارزیابی دقیق اطلاعات قبل از انتشار در وب‌سایت و عدم استفاده از اطلاعات حساس در گزارش‌های سالانه عمومی، اخبار یا کاتالوگ محصولات.</li>
</ul>

<img src="images/CEHv13_02/slide_39.webp" alt="Footprinting Countermeasures 2" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۹: اقدامات تکمیلی برای مقابله با Footprinting</div>

<p>اقدامات تکمیلی و فنی‌تر:</p>
<ul>
<li><strong>حفاظت از موقعیت مکانی:</strong> غیرفعال کردن Geo-Location در موبایل و غیرفعال کردن Geo-Tagging در دوربین‌ها.</li>
<li><strong>شبکه‌های اجتماعی:</strong> عدم انتشار موقعیت مکانی یا برنامه سفر در شبکه‌های اجتماعی.</li>
<li><strong>DNS امن:</strong> جدا سازی سرور DNS داخلی و خارجی با استفاده از Split DNS و محدودسازی Zone Transfer.</li>
<li><strong>رمزنگاری:</strong> رمزنگاری و محافظت با پسورد برای اطلاعات حساس.</li>
<li><strong>فیلتر ایمیل:</strong> جلوگیری از پذیرش ایمیل ناشناس توسط میل سرورها.</li>
<li><strong>جمع‌آوری اطلاعات علیه خود:</strong> اجرای عملیات Footprinting علیه سازمان خود و حذف اطلاعات حساس یافت‌شده (Self-Footprinting).</li>
</ul>

                    });
                    li.appendChild(a);
                    ul.appendChild(li);
                });
                details.appendChild(ul);
                toc.appendChild(details);
            });
        }

        function buildSections() {
            const main = document.getElementById('mainContent');
            main.innerHTML = '';
            allSections.forEach((sec, idx) => {
                const div = document.createElement('div');
                div.className = 'section' + (idx === 0 ? ' active' : '');
                div.id = sec.id;
                const isFirst = idx === 0;
                const isLast = idx === allSections.length - 1;
                let body = '';
                if (richContent[sec.id]) {
                    body = richContent[sec.id];
                } else {
                    body = `
                        <div class="section-header">
                            <div class="section-badge">${sec.badge}</div>
                            <div>
                                <h1>${sec.title}</h1>
                                <div class="meta">Module ${sec.badge} · ${sec.chapterTitle} · Session ${toFa(sec.sectionIndex + 1)} of ${toFa(sec.totalInChapter)}</div>
                            </div>
                        </div>
                        <div class="placeholder">
                            <i class="fas fa-terminal"></i>
                            <p>محتوای این جلسه در حال آماده‌سازی است...</p>
                            <p style="font-size:0.88rem;margin-top:6px;opacity:0.7;">${sec.chapterTitle} — ${sec.title}</p>
                        </div>
                    `;
                }
                body += `
                    <div class="nav-buttons">
                        <button class="nav-btn" ${isFirst ? 'disabled' : ''} onclick="goToPrev()">
                            ${isFirst ? 'جلسه قبلی' : '<i class="fas fa-arrow-right"></i> جلسه قبلی'}
                        </button>
                        <button class="nav-btn" ${isLast ? 'disabled' : ''} onclick="goToNext()">
                            ${isLast ? 'پایان' : 'جلسه بعدی <i class="fas fa-arrow-left"></i>'}
                        </button>
                    </div>
                `;
                div.innerHTML = body;
                main.appendChild(div);
            });
        }

        function showSection(index) {
            if (index < 0 || index >= allSections.length) return;
            currentIndex = index;
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(allSections[index].id);
            if (target) target.classList.add('active');
            document.querySelectorAll('.toc-sections a').forEach(a => {
                a.classList.remove('active');
                if (a.dataset.id === allSections[index].id) a.classList.add('active');
            });
            const chIdx = allSections[index].chapterIndex;
            document.querySelectorAll('.toc-chapter').forEach((d, i) => { d.open = (i === chIdx); });
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (window.innerWidth <= 1000) closeSidebar();
        }

        function goToPrev() { if (currentIndex > 0) showSection(currentIndex - 1); }
        function goToNext() { if (currentIndex < allSections.length - 1) showSection(currentIndex + 1); }

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const toggleBtn = document.getElementById('sidebarToggle');
        const closeBtn = document.getElementById('sidebarClose');

        function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); document.body.style.overflow = 'hidden'; }
        function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = ''; }

        toggleBtn.addEventListener('click', openSidebar);
        closeBtn.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') !== 'light';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('ceh-theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.querySelector('.theme-icon');
            if (!icon) return;
            if (theme === 'light') {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            } else {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
        }

        const savedTheme = localStorage.getItem('ceh-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme === 'light' ? 'light' : 'dark');
        updateThemeIcon(savedTheme);

        function selectOption(btn) {
            const parent = btn.parentElement;
            if (parent.classList.contains('answered')) return;
            parent.classList.add('answered');
            const isCorrect = btn.dataset.correct === 'true';
            parent.querySelectorAll('button').forEach(b => {
                b.classList.remove('selected', 'correct', 'wrong');
                if (b.dataset.correct === 'true') b.classList.add('correct');
            });
            if (!isCorrect) btn.classList.add('wrong');
            parent.nextElementSibling.classList.add('show');
        }

        window.onscroll = function() {
            const scroll = document.documentElement.scrollTop || document.body.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            document.getElementById('progressBar').style.width = (height > 0 ? (scroll / height * 100) : 0) + '%';
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSidebar();
            if (e.key === 'ArrowLeft') goToNext();
            if (e.key === 'ArrowRight') goToPrev();
        });

        function wrapTables() {
            document.querySelectorAll('.section table').forEach(function(table) {
                if (table.parentElement && table.parentElement.classList.contains('table-wrap')) return;
                var wrap = document.createElement('div');
                wrap.className = 'table-wrap';
                table.parentNode.insertBefore(wrap, table);
                wrap.appendChild(table);
            });
        }


        // ---------- بهبودهای ظاهری درسنامه ----------
        // شماره‌ی ابتدای تیترهای h2 (مثل «01.») به صورت چیپ جدا نمایش داده می‌شود
        function enhanceHeadings() {
            document.querySelectorAll('.section h2').forEach(function(h) {
                if (h.classList.contains('has-num')) return;
                var m = h.textContent.match(/^\s*([0-9۰-۹]{1,3})\s*[.\-–:]\s*(.+)$/s);
                if (!m) return;
                h.classList.add('has-num');
                h.innerHTML = '<span class="h2-num"></span><span class="h2-text"></span>';
                h.querySelector('.h2-num').textContent = m[1];
                h.querySelector('.h2-text').textContent = m[2];
            });
        }

        // هر تصویر اسلاید + کپشن داخل یک کادر (figure) و قابل بزرگ‌نمایی
        function enhanceSlides() {
            document.querySelectorAll('.section img.pdf-image').forEach(function(img) {
                if (img.parentElement.classList.contains('slide-fig')) return;
                var fig = document.createElement('figure');
                fig.className = 'slide-fig';
                img.parentNode.insertBefore(fig, img);
                fig.appendChild(img);
                var cap = fig.nextElementSibling;
                if (cap && cap.classList.contains('image-caption')) fig.appendChild(cap);
                img.decoding = 'async';
                img.addEventListener('click', function() { openLightbox(img); });
            });
        }

        var lightbox = document.getElementById('lightbox');
        function openLightbox(img) {
            document.getElementById('lightboxImg').src = img.currentSrc || img.src;
            document.getElementById('lightboxImg').alt = img.alt || '';
            var cap = img.parentElement.querySelector('.image-caption');
            document.getElementById('lightboxCap').textContent = cap ? cap.textContent : '';
            lightbox.classList.add('open');
            lightbox.setAttribute('aria-hidden', 'false');
        }
        function closeLightbox() {
            lightbox.classList.remove('open');
            lightbox.setAttribute('aria-hidden', 'true');
        }
        lightbox.addEventListener('click', closeLightbox);
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });

        // اندازه‌ی فونت (ذخیره در مرورگر)
        var fontScale = parseFloat(localStorage.getItem('ceh-fs')) || 1;
        function applyFont() { document.documentElement.style.setProperty('--fs', fontScale); }
        function changeFont(dir) {
            fontScale = Math.min(1.3, Math.max(0.85, Math.round((fontScale + dir * 0.05) * 100) / 100));
            localStorage.setItem('ceh-fs', fontScale);
            applyFont();
        }
        applyFont();

        buildTOC();
        buildSections();
        wrapTables();
        enhanceHeadings();
        enhanceSlides();
        showSection(0); // شروع از جلسه ۱
    </script>

</body>
</html>
