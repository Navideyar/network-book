<h2>01. متاسپلویت (Metasploit Framework)</h2>
<p>قبل از اینکه وارد بحث ارتقای دسترسی شویم، باید ابزاری را بشناسیم که تقریباً در تمام مراحل تست نفوذ، از جمع‌آوری اطلاعات تا نگهداری دسترسی، کنار ماست. <strong>Metasploit</strong> یکی از قدرتمندترین و محبوب‌ترین چارچوب‌های تست نفوذ در دنیاست. در حقیقت، امروزه Metasploit یک مجموعه یکپارچه از اجزای حمله است که به شما امکان می‌دهد از جمع‌آوری اطلاعات تا اکسپلویت کردن و نگهداری دسترسی را در یک محیط واحد انجام دهید.</p>

<img src="images/CEHv13_06/slide_21.webp" alt="Metasploit Framework" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۱: لوگوی Metasploit و کاربردهای آن</div>

<p>عملیاتی که در Metasploit قابل انجام است:</p>
<ul>
<li>جمع‌آوری اطلاعات (Information Gathering)</li>
<li>اسکن شبکه (Network Scanning)</li>
<li>اکسپلویتینگ (Exploiting)</li>
<li>ایجاد محتوای مخرب و عبور از سیستم‌های امنیتی</li>
<li>انجام حملات کلمه عبور (Password Attacks)</li>
<li>انجام حملات علیه برنامه‌های تحت وب (Web Application Attacks)</li>
</ul>

<h3>ماژول‌های اصلی Metasploit</h3>
<p>محیط Metasploit از چندین ماژول اصلی تشکیل شده است که هر کدام نقش خاصی دارند. برای درک منطق کار، این ماژول‌ها را به ترتیب یک سناریوی حمله در نظر بگیرید: اول اطلاعات جمع می‌کنیم، بعد آسیب‌پذیری را اکسپلویت می‌کنیم، بعد کد مورد نظر را روی هدف اجرا می‌کنیم و در پایان کارهای پس از نفوذ را انجام می‌دهیم:</p>

<img src="images/CEHv13_06/slide_22.webp" alt="Metasploit Modules" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۲: چهار ماژول اصلی Metasploit</div>

<ul>
<li><strong>Auxiliary (کمکی):</strong> ابزارهای جانبی مثل اسکنرها، Snifferها، حملات Brute Force و ماژول‌های جمع‌آوری اطلاعات. (این ماژول‌ها مستقیماً سیستم را هک نمی‌کنند، بلکه اطلاعات جمع می‌کنند).</li>
<li><strong>Exploit (اکسپلویت):</strong> کدی که از یک آسیب‌پذیری خاص (مثلاً در SMB یا Apache) سوءاستفاده می‌کند و باعث اجرای کد روی سیستم هدف می‌شود.</li>
<li><strong>Payload (پی‌لود):</strong> کدی که <em>بعد از</em> موفقیت اکسپلویت، روی سیستم هدف اجرا می‌شود. مثلاً یک Shell (شل معکوس یا بایند) که به مهاجم دسترسی می‌دهد.</li>
<li><strong>Post (پس از بهره‌برداری):</strong> ماژول‌هایی که بعد از به دست آوردن دسترسی اجرا می‌شوند (مثلاً برای جمع‌آوری پسوردها، ارتقای دسترسی، یا Pivoting).</li>
</ul>

<div class="code-container"><div class="code-label">bash · msfconsole</div><pre class="code-block">msfconsole
msf6 > use exploit/windows/smb/ms17_010_eternalblue
msf6 exploit(ms17_010_eternalblue) > set RHOSTS 10.10.10.10
msf6 exploit(ms17_010_eternalblue) > set PAYLOAD windows/x64/meterpreter/reverse_tcp
msf6 exploit(ms17_010_eternalblue) > exploit</pre></div>

<p>حالا که با Metasploit و جایگاه آن در فرآیند نفوذ آشنا شدیم، بیایید ببینیم قدم بعدی بعد از گرفتن یک شل معمولی چیست: ارتقای دسترسی.</p>

<h2>02. ارتقای سطح دسترسی (Privilege Escalation)</h2>
<p><strong>Privilege Escalation</strong> به فرآیندی گفته می‌شود که در آن یک نفوذگر با استفاده از یک اکانت معمولی به شبکه متصل شده و در مرحله بعد دسترسی خود را به سطح مدیر (Administrator/root) افزایش می‌دهد.</p>

<p>ارتقای سطح دسترسی به نفوذگر این اجازه را می‌دهد تا به اطلاعات حساس دسترسی پیدا کند، فایل‌ها را حذف نماید، برنامه‌های مخرب نصب نموده و یا مواردی از این دست را انجام دهد.</p>

<img src="images/CEHv13_06/slide_23.webp" alt="Privilege Escalation Concept" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۳: مفهوم Privilege Escalation (از کاربر عادی به ادمین)</div>

<h3>انواع Privilege Escalation</h3>
<p>Privilege Escalation به دو دسته زیر تقسیم می‌شود. تفاوت اصلی این دو در این است که آیا مهاجم به منابع «هم‌سطح» خودش دست پیدا می‌کند یا به منابع «سطح بالاتر»:</p>

<img src="images/CEHv13_06/slide_24.webp" alt="Horizontal vs Vertical Privilege Escalation" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۴: تفاوت Horizontal و Vertical Privilege Escalation</div>

<ul>
<li><strong>Horizontal Privilege Escalation (افقی):</strong> در این روش، یک کاربر غیرمجاز تلاش می‌کند تا به منابع، توابع و موارد دیگر از <strong>یک کاربر مجاز در سطح دسترسی خودش</strong> دسترسی پیدا کند. (مثلاً کاربر A به منابع کاربر B دسترسی پیدا کند، هر دو در یک سطح هستند).</li>
<li><strong>Vertical Privilege Escalation (عمودی):</strong> در این روش، یک کاربر غیرمجاز تلاش می‌کند تا به منابع، توابع و موارد دیگر از <strong>یک کاربر مجاز با سطح دسترسی بالاتر از خودش</strong> دسترسی پیدا کند. (مثلاً کاربر A به منابع ادمین دسترسی پیدا کند).</li>
</ul>

<p>در ادامه، چهار تکنیک عملی برای Privilege Escalation عمودی را بررسی می‌کنیم. هر کدام از این تکنیک‌ها از یک ضعف متفاوت سوءاستفاده می‌کند.</p>

<h2>03. PrivEsc با اکسپلویت کردن آسیب‌پذیری‌ها</h2>
<p>اولین و رایج‌ترین راه، سوءاستفاده از یک آسیب‌پذیری نرم‌افزاری یا سخت‌افزاری است. در این روش، نفوذگر با استفاده از اکسپلویت نمودن یک آسیب‌پذیری، سطح دسترسی خود را ارتقا می‌دهد. برای این منظور، نفوذگر می‌تواند در سایت <strong>Exploit-DB</strong> جستجو کرده و اکسپلویت‌های مورد نظر خود برای بالا بردن سطح دسترسی را شناسایی نماید.</p>

<img src="images/CEHv13_06/slide_25.webp" alt="Exploit-DB Privilege Escalation" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۵: جستجوی اکسپلویت‌های Privilege Escalation در Exploit-DB</div>

<h3>آسیب‌پذیری‌های Spectre و Meltdown</h3>
<p>در میان آسیب‌پذیری‌ها، دو مورد خاص در سطح سخت‌افزار (پردازنده) قرار دارند و بسیار خطرناک محسوب می‌شوند. جالب است بدانید که این دو آسیب‌پذیری حتی از مرزهای نرم‌افزار عبور می‌کنند و مستقیماً به لایه سخت‌افزار حمله می‌کنند:</p>

<img src="images/CEHv13_06/slide_26.webp" alt="Spectre and Meltdown" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۶: آسیب‌پذیری‌های Spectre و Meltdown (CVE-2017-5754، CVE-2017-5715)</div>

<ul>
<li><strong>Meltdown (CVE-2017-5754):</strong> به هکرها امکان می‌دهد تا به قطعات حافظه کامپیوتر که توسط برنامه‌ها و سیستم‌عامل مورد استفاده قرار می‌گیرند، دسترسی داشته باشند. این حفره بر پردازشگرهای <strong>Intel</strong> تأثیرگذار است.</li>
<li><strong>Spectre (CVE-2017-5715 و CVE-2017-5753):</strong> به هکرها اجازه می‌دهد تا به اطلاعات نفوذ یافته در فایل‌های Kernel/Cache یا داده‌های ذخیره شده در حافظه برنامه‌های در حال اجرا (همچون گواهی‌ها، رمز عبورها، کلیدهای Login) دسترسی پیدا کنند. این آسیب‌پذیری بر پردازنده‌های <strong>Intel، AMD و ARM</strong> اثرگذار است.</li>
</ul>

<p>در حالی که Spectre و Meltdown از ضعف سخت‌افزار سوءاستفاده می‌کنند، تکنیک بعدی از یک ویژگی کاملاً نرم‌افزاری در ویندوز استفاده می‌کند.</p>

<h2>04. PrivEsc با Named Pipe Impersonation</h2>
<p>در سیستم‌عامل ویندوز، از <strong>Named Pipe</strong>ها به منظور ارتباط بین پروسس‌های در حال اجرا استفاده می‌گردد. در این تکنیک، پیام‌ها به وسیله یک فایل بین پروسس‌ها مبادله می‌شود.</p>

<img src="images/CEHv13_06/slide_27.webp" alt="Named Pipe Impersonation" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۷: نحوه کارکرد Named Pipe و Impersonation</div>

<p>به عنوان مثال، اگر پروسس A بخواهد یک پیام را برای پروسس B ارسال کند، آن را در یک فایل نوشته و پروسس B آن پیام را از این فایل می‌خواند.</p>

<ul>
<li>هنگامی که یک پروسس یک Pipe را ایجاد می‌کند، نقش یک <strong>Pipe Server</strong> را بازی می‌کند.</li>
<li>اگر هر پروسس دیگری بخواهد با این پروسس ارتباط برقرار کند، به عنوان <strong>Pipe Client</strong> این کار را انجام خواهد داد.</li>
<li>هنگامی که یک کلاینت به Pipe Server متصل می‌شود، Pipe Client می‌تواند از <strong>Security Context و Access Privilege</strong> مربوط به Pipe Server بهره‌برداری نماید.</li>
</ul>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>نحوه سوءاستفاده مهاجم:</strong> نفوذگر از این ویژگی سوءاستفاده نموده و با ایجاد یک <strong>Pipe Server با دسترسی پایین</strong>، سعی می‌کند تا یک کلاینت با <strong>دسترسی بالاتر</strong> (مثلاً ادمین) را به سرور خود متصل کند. سپس با Impersonation، هویت آن کلاینت را جعل کرده و دسترسی خود را ارتقا می‌دهد.</div></div>

<p>تکنیک بعدی هم مانند Named Pipe از پیکربندی‌های ویندوز سوءاستفاده می‌کند، اما این بار از طریق سرویس‌ها.</p>

<h2>05. PrivEsc با Service Object Permission</h2>
<p>گاهی اوقات تنظیمات اشتباه برای یک سرویس (Service) ممکن است به نفوذگر اجازه تغییر یا تنظیم مجدد Attributeهای مرتبط با سرور را بدهد. این موضوع حتی می‌تواند منجر به تغییر مسیر اجرای برنامه توسط نفوذگر شده و موجب اجرای فایل‌های مخرب شود.</p>

<p>اگر یک سرویس با دسترسی SYSTEM اجرا شود و مهاجم بتواند فایل اجرایی آن سرویس را جایگزین کند، دفعه بعد که سرویس استارت می‌شود، کد مخرب مهاجم با بالاترین سطح دسترسی اجرا خواهد شد.</p>

<p>در ادامه، به سراغ تکنیکی می‌رویم که از یک فایل به‌جامانده از نصب ویندوز سوءاستفاده می‌کند.</p>

<h2>06. PrivEsc با Unattended Install</h2>
<p>نصب <strong>Unattended</strong> به نفوذگران اجازه می‌دهد که تا سیستم‌عامل ویندوز را بدون دخالت ادمین Deploy نمایند. مدیران شبکه می‌بایست فایل‌های نصب را که اغلب در فایلی با نام <strong>Unattend.xml</strong> ذخیره می‌شود را حذف نمایند.</p>

<p>در این فایل اطلاعات زیادی در خصوص تنظیمات و فرآیندهای نصب سیستم‌عامل قرار دارد (تنظیمات، نام کاربری یا حتی پسورد). این فایل‌ها در مسیرهای زیر قرار دارند:</p>

<div class="code-container"><div class="code-label">path · windows unattend</div><pre class="code-block no-prompt">C:\\windows\\Panther
C:\\windows\\Panther\\Unattend\\
C:\\windows\\System32\\
C:\\windows\\Panther\\sysprep</pre></div>

<p>اگر این فایل‌ها پاک نشوند، مهاجم می‌تواند با دسترسی به آن‌ها، رمز عبور ادمین محلی (Local Admin) را استخراج کند.</p>

<p>تا اینجا همه تکنیک‌ها برای بالا رفتن از «یک سیستم» بود. اما در تست نفوذ واقعی، معمولاً باید از یک سیستم به سیستم‌های دیگر هم دسترسی پیدا کنیم. اینجاست که Pivoting وارد می‌شود.</p>

<h2>07. چرخش و پاسخ به ماشین‌های خارجی (Pivoting)</h2>
<p>در دستور <code>route</code> در Metrepreter، تمامی ترافیک‌های محیط کنسول از طریق ارتباط با آدرس وارد شده هدایت می‌شوند. به این کار <strong>Pivoting</strong> می‌گویند.</p>

<img src="images/CEHv13_06/slide_31.webp" alt="Pivoting" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۱: مفهوم Pivoting (استفاده از سیستم هک‌شده برای حمله به شبکه‌های داخلی)</div>

<p>فرض کنید شما یک ماشین (Target1) را هک کرده‌اید. این ماشین به شبکه داخلی دیگری متصل است که از اینترنت قابل دسترسی نیست. با استفاده از Pivoting، شما از Target1 به عنوان یک پل (Router) استفاده می‌کنید و با تنظیم مسیرها، به سراغ Target2 می‌روید.</p>

<div class="code-container"><div class="code-label">bash · meterpreter</div><pre class="code-block">meterpreter > route add 10.0.0.0 255.255.255.0 1
msf6 > use exploit/windows/smb/ms17_010_eternalblue
msf6 exploit(ms17_010_eternalblue) > set RHOSTS 10.0.0.5
msf6 exploit(ms17_010_eternalblue) > set PAYLOAD windows/x64/meterpreter/reverse_tcp
msf6 exploit(ms17_010_eternalblue) > exploit</pre></div>

<p>در پایان، بیایید ببینیم ابزارهایی که این فرآیند را خودکار می‌کنند چه هستند و چطور می‌توانند کار ما را سریع‌تر کنند.</p>

<h2>08. ابزارهای ارتقای دسترسی</h2>
<p>ابزارهای متعددی برای کشف خودکار مسیرهای ارتقای دسترسی وجود دارد که در تست‌های نفوذ بسیار کمک‌کننده هستند:</p>

<img src="images/CEHv13_06/slide_32.webp" alt="Privilege Escalation Tools" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۲: ابزارهای BeRoot (ویندوز) و Linprivchecker (لینوکس)</div>

<ul>
<li><strong>BeRoot (ویندوز):</strong> اسکریپتی که سیستم را بررسی کرده و پیکربندی‌های اشتباه (مثل سرویس‌های آسیب‌پذیر یا مجوزهای ضعیف) را پیدا می‌کند.</li>
<li><strong>Linprivchecker (لینوکس):</strong> ابزاری برای بررسی سیستم‌های لینوکسی و پیدا کردن راه‌های ارتقای دسترسی.</li>
<li><strong>ابزارهای دیگر:</strong> PowerUp، WinPEAS، LinPEAS، Seatbelt.</li>
</ul>

<h2>01. اجرای برنامه‌ها (Executing Applications)</h2>
<p>در جلسه قبل به بالاترین سطح دسترسی رسیدیم. اما دسترسی بالا به‌تنهایی کافی نیست؛ باید بتوانیم روی سیستم هدف برنامه‌های خودمان را اجرا کنیم. در این مرحله، نفوذگر اقدام به اجرای برنامه‌های مخرب بر روی سیستم هدف می‌نماید. در برخی موارد به این مرحله <strong>مالکیت سیستم (Owning)</strong> نیز گفته می‌شود. چرا؟ چون وقتی یک برنامه مخرب (مثل بک‌دور یا کی‌لاگر) را نصب می‌کنید، عملاً کنترل سیستم را در دست گرفته‌اید و می‌توانید هر زمان که خواستید به آن برگردید.</p>

<img src="images/CEHv13_06/slide_34.webp" alt="Executing Applications" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۴: چرخه اجرای برنامه‌های مخرب (Keylogger، Spyware، Backdoor، Cracker)</div>

<p>چهار ابزار اصلی که در این مرحله استفاده می‌شوند عبارتند از:</p>
<ul>
<li><strong>Keylogger (کی‌لاگر):</strong> برای ثبت تمام کلیدهای فشرده‌شده توسط کاربر (مثل رمز عبور، پیام‌ها، شماره کارت).</li>
<li><strong>Spyware (جاسوس‌افزار):</strong> نرم‌افزاری که فعالیت‌های کاربر را بدون اطلاع او ضبط می‌کند.</li>
<li><strong>Backdoor (درب پشتی):</strong> راهی مخفی برای برگشتن به سیستم بدون نیاز به احراز هویت مجدد.</li>
<li><strong>Cracker (کرکر):</strong> ابزاری برای شکستن رمز عبور فایل‌ها یا سیستم.</li>
</ul>

<p>در ادامه، دو ابزار اول را دقیق‌تر بررسی می‌کنیم؛ چون بیشترین کاربرد را در جاسوسی و سرقت اطلاعات دارند.</p>

<h2>02. انواع کی‌لاگرها (Keyloggers)</h2>
<p>کی‌لاگرها به دو دسته اصلی سخت‌افزاری و نرم‌افزاری تقسیم می‌شوند. یک هکر بسته به اینکه به سیستم قربانی دسترسی فیزیکی دارد یا نه، یکی از این دو را انتخاب می‌کند.</p>

<h3>۱-۲. کی‌لاگرهای سخت‌افزاری (Hardware Keyloggers)</h3>
<p>این کی‌لاگرها به صورت فیزیکی بین صفحه‌کلید و کامپیوتر قرار می‌گیرند. از آنجا که در سطح سیستم‌عامل نصب نمی‌شوند، آنتی‌ویروس‌ها و ابزارهای نرم‌افزاری نمی‌توانند آن‌ها را شناسایی کنند. برای نصب این نوع، مهاجم باید به سیستم قربانی دسترسی فیزیکی داشته باشد.</p>

<img src="images/CEHv13_06/slide_35.webp" alt="Hardware Keyloggers" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۵: انواع کی‌لاگرهای سخت‌افزاری (PS/2، USB، Wi-Fi، بلوتوث و تعبیه‌شده در کیبورد)</div>

<ul>
<li><strong>PS/2 Keylogger:</strong> در پورت قدیمی PS/2 قرار می‌گیرد (امروزه کمتر استفاده می‌شود).</li>
<li><strong>USB Keylogger:</strong> در پورت USB قرار می‌گیرد و ظاهری شبیه به یک فلش کوچک دارد.</li>
<li><strong>Wi-Fi / Bluetooth Keylogger:</strong> داده‌های فشرده‌شده را به صورت بی‌سیم به مهاجم می‌فرستد.</li>
<li><strong>Keylogger embedded in keyboard:</strong> کی‌لاگر مستقیماً داخل بدنه صفحه‌کلید تعبیه شده است (فقط با باز کردن پیچ‌های کیبورد قابل تشخیص است).</li>
</ul>

<h3>۲-۲. کی‌لاگرهای نرم‌افزاری (Software Keyloggers)</h3>
<p>این نوع، به صورت یک برنامه مخفی روی سیستم‌عامل نصب می‌شود و نیاز به دسترسی فیزیکی ندارد. می‌تواند از راه دور توسط هکر فعال شود. ابزارهای تجاری زیادی برای ویندوز و مک وجود دارند که برخی از آن‌ها عبارتند از:</p>
<ul>
<li><strong>برای ویندوز:</strong> Advanced Keylogger، Spyrix Personal Monitor، Elite Keylogger، REFOG Personal Monitor.</li>
<li><strong>برای مک (MAC):</strong> Aobo Mac Keylogger، Perfect Keylogger for Mac، Kid Logger for Mac.</li>
</ul>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>چرا کی‌لاگرها خطرناک هستند؟</strong> حتی اگر رمز عبور شما بسیار قوی و پیچیده باشد، کی‌لاگر تمام کاراکترهای وارد شده را ثبت می‌کند و به مهاجم می‌فرستد. به همین دلیل، همیشه توصیه می‌شود از کیبورد مجازی (On-Screen Keyboard) برای وارد کردن اطلاعات حساس در کامپیوترهای عمومی استفاده کنید.</div></div>

<h2>03. جاسوس‌افزارها (Spyware)</h2>
<p>کی‌لاگر فقط کلیدها را ثبت می‌کند، اما Spyware دامنه گسترده‌تری دارد و کل فعالیت کاربر را زیر نظر می‌گیرد. <strong>Spyware</strong> برنامه‌هایی هستند که فعالیت کاربر را بدون اینکه متوجه شود ضبط می‌کنند. این نرم‌افزارها بدون آشکارسازی خود اجرا می‌شوند و فایل‌ها، پردازش‌ها و دیگر قسمت‌های آن از دید کاربر پنهان می‌ماند تا از حذف شدن آن جلوگیری به عمل آید.</p>

<img src="images/CEHv13_06/slide_38.webp" alt="Spyware Concept" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۸: مفهوم جاسوس‌افزار و راه‌های انتشار آن</div>

<p><strong>راه‌های انتشار Spyware:</strong></p>
<ul>
<li>آسیب‌پذیری مرورگر وب (Web Browser Vulnerabilities).</li>
<li>اضافات یا Add-ons مخرب مرورگر.</li>
<li>تغییر ظاهر به عنوان یک نرم‌افزار امنیتی (Anti-Spyware جعلی).</li>
<li>از طریق دانلود نرم‌افزارهای رایگان (Freeware).</li>
</ul>

<p><strong>انواع Spyware:</strong></p>
<ul>
<li><strong>Desktop Spyware:</strong> ضبط فعالیت‌های روی دسکتاپ (مثل کلیک‌ها و پنجره‌ها).</li>
<li><strong>Email and Internet Spyware:</strong> ردیابی ایمیل‌ها و فعالیت‌های اینترنتی.</li>
<li><strong>Child Monitoring Spyware:</strong> نرم‌افزارهای کنترل والدین (که گاهی به اشتباه نصب می‌شوند).</li>
<li><strong>Audio/Video Spyware:</strong> دسترسی به میکروفون و دوربین.</li>
<li><strong>GPS Spyware:</strong> ردیابی موقعیت مکانی دستگاه.</li>
</ul>

<p>حالا که با این دو ابزار جاسوسی آشنا شدیم، بیایید ببینیم چطور در برابر آن‌ها از خود دفاع کنیم.</p>

<h2>04. مقابله با کی‌لاگر و جاسوس‌افزار</h2>
<p>چطور از خود در برابر این جاسوسان دیجیتال محافظت کنیم؟ همان‌طور که ابزارها متفاوت هستند، دفاع در برابر هرکدام هم رویکرد جداگانه‌ای دارد.</p>

<h3>۱-۴. مقابله با Keylogger</h3>
<ul>
<li>نصب نرم‌افزارهای آنتی‌ویروس و بروزرسانی آن‌ها.</li>
<li>نصب یک HIDS (سیستم تشخیص نفوذ میزبان) یا فایروال نرم‌افزاری.</li>
<li>بررسی فیزیکی سیستم‌های سخت‌افزاری (مخصوصاً کابل‌های صفحه‌کلید) برای اطمینان از عدم نصب کی‌لاگر.</li>
<li>استفاده از ابزارهای ثبت کلید مجازی (Virtual Keyboard) با کاراکترهای به هم ریخته.</li>
<li>عدم کلیک بر روی لینک‌های ناخواسته در ایمیل‌ها و پیام‌ها.</li>
</ul>

<img src="images/CEHv13_06/slide_42.webp" alt="Anti Keylogger" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۲: نرم‌افزار Zemana AntiLogger (نمونه‌ای از Anti-Keylogger)</div>

<p>ابزارهای Anti-Keylogger مثل <strong>Zemana AntiLogger</strong>، KeyScrambler و Guarded ID با رمزنگاری ورودی‌های صفحه‌کلید، از ثبت آن‌ها توسط کی‌لاگرها جلوگیری می‌کنند.</p>

<h3>۲-۴. مقابله با Spyware</h3>
<ul>
<li>انجام تنظیمات امنیتی مرورگر (مثل مسدود کردن Pop-upها و افزونه‌های ناشناس).</li>
<li>عدم دانلود فایل‌های رایگان از منابع نامعتبر.</li>
<li>استفاده از حساب کاربری Administrator برای کارهای روزمره (مگر در موارد ضروری).</li>
<li>نصب و استفاده از برنامه‌های Anti-Spyware مثل <strong>SuperAntiSpyware</strong>، <strong>Spybot</strong> و <strong>Malwarebytes</strong>.</li>
<li>اسکن دوره‌ای سیستم برای کشف جاسوس‌افزارها.</li>
</ul>

<p>تا اینجا با جاسوس‌افزارهای سطح کاربر آشنا شدیم. اما خطرناک‌تر از همه این‌ها، ابزارهایی هستند که در عمیق‌ترین لایه‌های سیستم پنهان می‌شوند. اینجاست که Rootkit وارد می‌شود.</p>

<h2>05. پنهان‌سازی فایل‌ها با Rootkit</h2>
<p>حالا به بخش هیجان‌انگیز جلسه می‌رسیم: چطور ردپای خود را پاک کنیم؟ قوی‌ترین ابزار برای این کار، <strong>Rootkit</strong> است.</p>
<p>روت‌کیت‌ها ابزارهایی هستند که حضور نفوذگر و فعالیت‌های مخرب وی را در سیستم قربانی مخفی می‌کنند. یک روت‌کیت می‌تواند شامل برنامه‌های درب پشتی، برنامه‌های DDoS، برنامه‌های شنود بسته، ابزارهای حذف لاگ‌ها و مانند این باشد. روت‌کیت‌ها معمولاً ابزارها و توابع سیستم‌عامل را با نسخه دستکاری‌شده‌ای از آن‌ها جایگزین کرده و موجب کاهش سطح امنیتی سیستم می‌شوند.</p>

<img src="images/CEHv13_06/slide_47.webp" alt="Rootkit Goals" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۷: اهداف روت‌کیت‌ها (گرفتن دسترسی Root، مخفی‌سازی ردپا، جمع‌آوری اطلاعات)</div>

<p><strong>نحوه توزیع روت‌کیت‌ها:</strong></p>
<ul>
<li>مخفی‌سازی آن در بسته‌ها و ابزارهای عمومی مانند بازی.</li>
<li>نصب آن بر روی کامپیوترهای عمومی یا کامپیوترهای یک شرکت از طریق مهندسی اجتماعی.</li>
<li>انجام حملات Zero Day.</li>
</ul>

<h3>انواع Rootkit</h3>
<p>روت‌کیت‌ها بر اساس سطح دسترسی و نحوه عملکرد به دسته‌های زیر تقسیم می‌شوند. نکته کلیدی این است که هر چه روت‌کیت در لایه پایین‌تری اجرا شود، شناسایی و حذف آن دشوارتر است:</p>

<img src="images/CEHv13_06/slide_48.webp" alt="Types of Rootkit" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۸: انواع روت‌کیت بر اساس سطح عملکرد</div>

<ul>
<li><strong>Kernel Level Rootkit:</strong> کدهای مخرب به برنامه‌های هسته سیستم‌عامل اضافه یا جایگزین می‌شوند. خطرناک‌ترین نوع است چون در سطح Ring 0 اجرا می‌شود و کنترل کامل سیستم را در دست دارد.</li>
<li><strong>Application Level Rootkit:</strong> جایگزینی کدهای کتابخانه‌ای یا تغییر رفتار برنامه‌های موجود با تزریق کدهای مخرب.</li>
<li><strong>Hardware/Firmware Rootkit:</strong> در دستگاه‌های سخت‌افزاری یا فریم‌ور (مثل BIOS یا کارت شبکه) پنهان می‌شود و قابل بازیابی نیست.</li>
<li><strong>Boot Loader Level Rootkit:</strong> در این روش، بوت‌لودر اصلی (Boot Loader) سیستم‌عامل با یک نسخه دستکاری‌شده جایگزین می‌شود.</li>
<li><strong>Library Level Rootkit:</strong> توابع پرکاربرد سیستم‌عامل را با نسخه جعلی جایگزین می‌کند تا اطلاعات مربوط به مهاجم را مخفی کند.</li>
</ul>

<h3>شناسایی روت‌کیت</h3>
<p>چون روت‌کیت‌ها در سطح بسیار پایین کار می‌کنند، شناسایی آن‌ها با ابزارهای معمولی (مثل Task Manager) تقریباً غیرممکن است. روش‌های شناسایی:</p>
<ul>
<li><strong>Signature Based Detection:</strong> مقایسه مشخصات فرآیندها و فایل‌های سیستمی با پایگاه داده روت‌کیت‌های شناخته‌شده.</li>
<li><strong>Integrity Based Detection:</strong> مقایسه فایل‌های سیستم، رکوردهای بوت و حافظه با یک مورد پایه (Baseline) شناخته‌شده و قابل اطمینان.</li>
<li><strong>Heuristic Detection:</strong> استفاده از انحراف الگوهای طبیعی و رفتارها برای شناسایی روت‌کیت‌های ناشناخته.</li>
<li><strong>Runtime Execution Path Profiling:</strong> مقایسه مسیرهای اجرایی همه فرآیندهای سیستم قبل و بعد از تأثیرگذاری روت‌کیت.</li>
<li><strong>Analyzing Memory Dumps:</strong> بررسی فایل‌های Dump حافظه (Memory Dumps) برای پیدا کردن آثار روت‌کیت.</li>
</ul>

<h3>ابزارهای Anti-Rootkit و مقابله</h3>
<p>ابزارهایی مثل <strong>GMER</strong>، <strong>TDSSKiller</strong>، <strong>Rootkit Buster</strong> و <strong>Malwarebytes Anti-Rootkit</strong> برای شناسایی و پاک‌سازی روت‌کیت‌ها طراحی شده‌اند.</p>
<p><strong>مقابله با Rootkit:</strong></p>
<ul>
<li>نصب مجدد سیستم‌عامل از یک منبع مطمئن (تنها راه حل قطعی برای روت‌کیت‌های سطح هسته).</li>
<li>آموزش کارمندان برای عدم دانلود فایل از منابع ناشناس.</li>
<li>نصب فایروال‌های مبتنی بر میزبان (Host-based Firewall).</li>
<li>بروزرسانی وصله‌های امنیتی و آنتی‌ویروس.</li>
</ul>

<p>روت‌کیت برای مخفی کردن <em>فرآیندها</em> استفاده می‌شود. اما یک تکنیک دیگر در ویندوز وجود دارد که برای مخفی کردن <em>فایل‌ها</em> به کار می‌رود و در آزمون CEH بسیار پرتکرار است.</p>

<h2>06. جریان‌های داده جایگزین (Alternate Data Streams - ADS)</h2>
<p>این بخش یکی از جذاب‌ترین و پرکاربردترین تکنیک‌های پنهان‌سازی در آزمون CEH و دنیای واقعی است. <strong>ADS</strong> یک ویژگی در فایل‌سیستم <strong>NTFS</strong> (مربوط به ویندوز) است.</p>

<p>در فایل‌سیستم‌های قدیمی (مثل FAT32)، هر فایل فقط یک «جریان داده» (Data Stream) داشت. اما NTFS به هر فایل اجازه می‌دهد چندین جریان داده داشته باشد. جریان داده‌ی پیش‌فرض (که با باز کردن فایل می‌بینید) با <code>:$DATA</code> نشان داده می‌شود. اما شما می‌توانید یک جریان داده‌ی مخفی با یک نام دلخواه ایجاد کنید.</p>

<img src="images/CEHv13_06/slide_54.webp" alt="ADS Concept" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۵۴: نحوه ایجاد یک جریان داده مخفی در Notepad (بدون تغییر در حجم فایل اصلی)</div>

<p><strong>نحوه ایجاد ADS با Notepad:</strong></p>
<div class="code-container"><div class="code-label">cmd · ads</div><pre class="code-block">c:\\> notepad myfile.txt:lion.txt</pre></div>
<p>با اجرای این دستور، یک فایل متنی جدید (lion.txt) داخل فایل myfile.txt (که در ظاهر حجمش تغییر نمی‌کند) ایجاد می‌شود. اگر فایل myfile.txt را باز کنید، هیچ متنی نمی‌بینید، اما اگر همین دستور را دوباره اجرا کنید، متن مخفی را مشاهده خواهید کرد.</p>

<p><strong>چرا ADS خطرناک است؟</strong> چون می‌توان یک فایل اجرایی مخرب (مثل Trojan.exe) را داخل یک فایل متنی بی‌خطر (مثل Readme.txt) پنهان کرد. در ظاهر، فایل Readme.txt حجم 0 بایت دارد و هیچ آنتی‌ویروسی به آن شک نمی‌کند، اما فایل مخرب درون آن پنهان است.</p>

<img src="images/CEHv13_06/slide_55.webp" alt="ADS Execution" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۵۵: نحوه جاسازی Trojan.exe در فایل Readme.txt و اجرای آن از طریق mklink</div>

<p><strong>مراحل پنهان‌سازی و اجرای فایل مخرب با ADS:</strong></p>
<ol>
<li><strong>انتقال فایل مخرب به ADS:</strong> دستور <code>type c:\\Trojan.exe &gt; c:\\Readme.txt:Trojan.exe</code> فایل Trojan.exe را داخل جریان داده‌ی Readme.txt قرار می‌دهد. حجم Readme.txt همچنان ۰ بایت است!</li>
<li><strong>ایجاد یک لینک (Shortcut) به فایل مخفی:</strong> دستور <code>mklink backdoor.exe Readme.txt:Trojan.exe</code> یک فایل اجرایی (backdoor.exe) می‌سازد که در واقع به Trojan.exe مخفی اشاره می‌کند.</li>
<li><strong>اجرا:</strong> با دستور <code>backdoor</code> یا دابل کلیک روی backdoor.exe، فایل مخرب اجرا می‌شود.</li>
</ol>

<div class="box warning"><i class="fas fa-eye-slash"></i><div><strong>چگونه ADS را شناسایی کنیم؟</strong> دستور <code>dir</code> در ویندوز ADS را نشان نمی‌دهد. برای دیدن آن باید از دستور <code>dir /r</code> استفاده کنید یا از ابزارهای تخصصی مثل <strong>Stream Armor</strong>، <strong>ADS Scanner</strong> و <strong>GMER</strong> استفاده نمایید.</div></div>

<img src="images/CEHv13_06/slide_57.webp" alt="Stream Armor" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۵۷: ابزار Stream Armor برای شناسایی فایل‌های پنهان در ADS</div>

<div class="summary-box">
<h3>🧠 جمع‌بندی جلسه ۶-۳</h3>
<p><strong>۱.</strong> پس از نفوذ، مهاجم ابزارهای مخرب مثل Keylogger (سخت‌افزاری/نرم‌افزاری) و Spyware را برای جمع‌آوری اطلاعات اجرا می‌کند.</p>
<p><strong>۲.</strong> کی‌لاگرهای سخت‌افزاری در سطح سیستم‌عامل نصب نمی‌شوند و آنتی‌ویروس‌ها نمی‌توانند آن‌ها را شناسایی کنند. برای مقابله با کی‌لاگرهای نرم‌افزاری از Anti-Keylogger و کیبورد مجازی استفاده کنید.</p>
<p><strong>۳.</strong> Spywareها برای ردیابی فعالیت‌های کاربر و سرقت اطلاعات طراحی شده‌اند و با Anti-Spywareهایی مثل Malwarebytes و SuperAntiSpyware قابل شناسایی هستند.</p>
<p><strong>۴.</strong> Rootkitها خطرناک‌ترین ابزار پنهان‌سازی هستند که در سطوح مختلف (Kernel، Application، Bootloader، Library) عمل می‌کنند. شناسایی آن‌ها با روش‌های Signature، Integrity، Heuristic و Memory Dump انجام می‌شود.</p>
<p><strong>۵.</strong> بهترین راه مقابله با روت‌کیت‌های سطح هسته، نصب مجدد سیستم‌عامل است.</p>
<p><strong>۶.</strong> ADS (Alternate Data Streams) یک ویژگی NTFS است که به مهاجم اجازه می‌دهد فایل مخرب را داخل فایل متنی بی‌خطر پنهان کند (بدون تغییر در حجم فایل). برای شناسایی ADS از دستور <code>dir /r</code> و ابزار Stream Armor استفاده کنید.</p>
</div>

<div class="section-header"><div class="section-badge">16</div><div><h1>پاک کردن ردپا</h1><div class="meta">Module 06 · System Hacking · Session 4 of 4</div></div></div>

<p>به چهارمین و آخرین جلسه از فصل System Hacking رسیدیم. تا اینجا یاد گرفتیم وارد سیستم شویم، دسترسی خود را بالا ببریم و ابزارهای جاسوسی را نصب کنیم. اما فرض کنید یک کارآگاه وارد صحنه جرم می‌شود. اگر ما اثر انگشت، رد پا و DNA خودمان را روی صحنه جا گذاشته باشیم، خیلی زود شناسایی می‌شویم. در دنیای سایبری، این «اثر انگشت» همان <strong>لاگ‌ها (Logs)</strong>، <strong>تایم‌استمپ‌ها (Timestamps)</strong> و <strong>فایل‌های موقت</strong>ی هستند که ویندوز و لینوکس به طور خودکار ثبت می‌کنند. در این جلسه ابتدا منطق پشت پاک کردن ردپا را می‌بینیم، سپس سراغ لاگ‌های ویندوز می‌رویم، بعد شش قابلیت ویندوز را که ردپا به جا می‌گذارند بررسی می‌کنیم، در ادامه پاک کردن تاریخچه Bash در لینوکس را مرور می‌کنیم و در پایان با روش‌های پنهان‌سازی فایل در هر دو سیستم‌عامل آشنا می‌شویم. مهم‌تر از یادگیری تکنیک، باید بفهمیم <strong>چرا</strong> این ردپاها وجود دارند، چون تنها در این صورت است که می‌فهمیم چطور باید آن‌ها را محو کنیم.</p>

<h2>01. مفهوم Covering Tracks و منطق پشت آن</h2>
<p>وقتی یک مهاجم وارد سیستم می‌شود، سیستم‌عامل به طور خودکار شروع به ثبت رویدادها می‌کند. این ثبت رویدادها برای مدیران شبکه یک نعمت است (چون می‌توانند بفهمند چه اتفاقی افتاده) و برای مهاجم یک دردسر بزرگ (چون همه‌چیز ثبت شده است). بنابراین، آخرین مرحله از هر حمله سایبری، <strong>پاک کردن این ردپاها</strong> است.</p>
<p>روش‌های پاک کردن ردپا در سه سطح انجام می‌شود:</p>
<ol>
<li><strong>سطح لاگ‌های سیستم‌عامل:</strong> پاک کردن یا دستکاری Event Logهای ویندوز یا Syslogهای لینوکس.</li>
<li><strong>سطح ردپای فایل‌سیستم:</strong> پاک کردن تایم‌استمپ‌های دسترسی، غیرفعال کردن قابلیت‌های ویندوز که ردپا به جا می‌گذارند.</li>
<li><strong>سطح لاگ‌های برنامه‌ها:</strong> پاک کردن تاریخچه دستورات شل (Bash History) در لینوکس.</li>
</ol>

<div class="box note"><i class="fas fa-search"></i><div><strong>نبرد مهاجم و تحلیل‌گر فارنزیک:</strong> هر تکنیکی که در این جلسه یاد می‌گیرید، در واقع یک پاسخ به یک روش فارنزیکی است. تحلیل‌گر دنبال «شواهد» است، و مهاجم دنبال «حذف شواهد». مثلاً تحلیل‌گر از لاگ‌ها استفاده می‌کند، پس مهاجم لاگ‌ها را پاک می‌کند. تحلیل‌گر از Timestamp دسترسی به فایل‌ها استفاده می‌کند، پس مهاجم آن را غیرفعال می‌کند. این یک بازی گربه و موش است.</div></div>

<p>حالا که منطق کلی را فهمیدیم، بیایید از اولین و مهم‌ترین سطح شروع کنیم: لاگ‌های خود سیستم‌عامل ویندوز.</p>

<h2>02. پاک کردن لاگ‌های ویندوز (Windows Event Logs)</h2>
<p>ویندوز به طور پیش‌فرض سه نوع لاگ اصلی ثبت می‌کند: <strong>Security</strong> (رویدادهای امنیتی مثل لاگین)، <strong>System</strong> (رویدادهای سیستم‌عامل) و <strong>Application</strong> (رویدادهای برنامه‌ها). وقتی مهاجم وارد سیستم می‌شود، این لاگ‌ها پر از شواهد می‌شوند. پس چطور آن‌ها را پاک کنیم؟</p>

<h3>۱-۲. ابزار Auditpol (مدیریت ممیزی)</h3>
<p>ابزار خط فرمان <code>auditpol</code> در ویندوز برای مدیریت «سیاست‌های ممیزی» (Audit Policies) طراحی شده است. اما یک مهاجم از این ابزار برای پاک کردن سیاست‌های ممیزی استفاده می‌کند تا از این به بعد سیستم هیچ رویدادی را ثبت نکند!</p>

<img src="images/CEHv13_06/slide_63.webp" alt="Auditpol" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۶۳: ابزار Auditpol</div>

<p>دستوراتی که در اسلاید ۷۴ آمده‌اند، به ترتیب:</p>
<div class="code-container"><div class="code-label">cmd · auditpol</div><pre class="code-block">auditpol /get /category:*                              &#8592; دیدن تنظیمات فعلی ممیزی
auditpol /set /category:"system","account logon" /success:enable /failure:enable  &#8592; فعال کردن ثبت رویدادها (برای تست)
auditpol /clear /y                                     &#8592; پاک کردن تمام تنظیمات ممیزی (ردپا محو می‌شود)
auditpol \\\\IP /disable                               &#8592; غیرفعال کردن ممیزی روی یک سیستم از راه دور
elsev -s \\\\ip -l security -c                        &#8592; پاک کردن لاگ‌های امنیتی یک سیستم از راه دور</pre></div>

<p><strong>چرا این کار جواب می‌دهد؟</strong> چون سیستم‌های امنیتی و تحلیل‌گران به این لاگ‌ها وابسته‌اند. اگر لاگ نباشد، حمله‌ای که رخ داده، در نظر تحلیل‌گر «هیچ اتفاقی نیفتاده» به نظر می‌رسد. البته یک تحلیل‌گر حرفه‌ای متوجه می‌شود که لاگ‌ها پاک شده‌اند (مثلاً فاصله زمانی خالی در لاگ‌ها یا تغییر تنظیمات ممیزی خودش یک نشانه است!)، اما برای مهاجم آماتور کارساز است.</p>

<h3>۲-۲. ابزارهای پاک کردن لاگ</h3>
<p>ابزارهای متعددی برای پاک کردن لاگ‌های ویندوز وجود دارد که دو نمونه معروف آن‌ها عبارتند از:</p>
<ul>
<li><strong>clearlogs.exe:</strong> یک ابزار خط فرمان که لاگ‌های Security، System و Application را پاک می‌کند.</li>
<li><strong>Meterpreter (از Metasploit):</strong> اگر سیستم با Metasploit هک شده باشد، مهاجم می‌تواند از دستور <code>clearev</code> در شل Meterpreter استفاده کند تا تمام لاگ‌های ویندوز را پاک کند.</li>
</ul>

<img src="images/CEHv13_06/slide_64.webp" alt="ClearLogs" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۶۴: ابزار clearlogs.exe و دستور clearev در Meterpreter</div>

<p>لاگ‌ها فقط یکی از راه‌های شناسایی مهاجم هستند. در واقع حتی اگر لاگ‌ها پاک شوند، قابلیت‌های دیگری در ویندوز وجود دارند که می‌توانند به عنوان شاهد علیه مهاجم عمل کنند. در بخش بعدی، شش مورد از مهم‌ترین آن‌ها را می‌بینیم.</p>

<h2>03. غیرفعال کردن قابلیت‌های ویندوز (برای جلوگیری از ثبت ردپا)</h2>
<p>این بخش جذاب‌ترین قسمت این جلسه است، چون درک آن نیازمند دانستن این است که «ویندوز اصلاً چرا این قابلیت‌ها را دارد؟». هر قابلیتی که در ادامه می‌بینید، در اصل برای بهبود عملکرد و راحتی کاربر طراحی شده، اما هر کدام می‌توانند به عنوان یک شاهد علیه مهاجم عمل کنند. پس مهاجم آن‌ها را غیرفعال می‌کند.</p>

<h3>۱-۳. غیرفعال کردن Timestamp آخرین دسترسی (Last Access Timestamp)</h3>
<p>ویندوز به طور پیش‌فرض هر بار که یک فایل را باز می‌کنید (حتی فقط برای خواندن)، زمان آن را در فایل ثبت می‌کند. این یعنی تحلیل‌گر می‌تواند بفهمد مهاجم چه فایل‌هایی را و در چه زمانی باز کرده است.</p>
<p>برای غیرفعال کردن این قابلیت، از دستور زیر استفاده می‌شود:</p>
<div class="code-container"><div class="code-label">cmd · fsutil</div><pre class="code-block">fsutil behavior set disablelastaccess 1</pre></div>

<img src="images/CEHv13_06/slide_66.webp" alt="Disable Last Access" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۶۶: غیرفعال کردن Last Access Timestamp با دستور fsutil</div>

<div class="box warning"><i class="fas fa-info-circle"></i><div><strong>نکته مهم:</strong> از ویندوز ویستا به بعد، این قابلیت به طور پیش‌فرض غیرفعال شده است. اما در بسیاری از سازمان‌ها هنوز فعال است. مهاجم با اجرای این دستور، مطمئن می‌شود که حتی اگر سیستم فعال باشد، دیگر تایم‌استمپی ثبت نشود.</div></div>

<h3>۲-۳. غیرفعال کردن Hibernation (خواب زمستانی)</h3>
<p>وقتی سیستم را در حالت Hibernate قرار می‌دهید، ویندوز تمام محتویات RAM را در یک فایل مخفی به نام <code>hiberfil.sys</code> در ریشه درایو ذخیره می‌کند. این فایل ممکن است حاوی اطلاعات حساسی مثل رمزهای عبور باز، کلیدهای رمزنگاری و حتی شواهد فعالیت مهاجم باشد.</p>
<p>تحلیل‌گر فارنزیک می‌تواند این فایل را استخراج کرده و از آن برای بازسازی صحنه جرم استفاده کند. پس مهاجم Hibernate را غیرفعال می‌کند تا این فایل تولید نشود.</p>

<img src="images/CEHv13_06/slide_67.webp" alt="Disable Hibernation" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۶۷: غیرفعال کردن Hibernate از طریق رجیستری</div>

<h3>۳-۳. غیرفعال کردن Paging File (حافظه مجازی)</h3>
<p>Paging File (یا Virtual Memory) یک فایل روی هارد است که وقتی RAM پر می‌شود، ویندوز بخشی از داده‌ها را به آن منتقل می‌کند. این فایل می‌تواند حاوی داده‌های رمزگشایی‌شده باشد که مهاجم قبلاً رمز آن‌ها را شکسته است.</p>
<p>اگر مهاجم فایلی را رمزگشایی کرده باشد، حتی بعد از خروج او، ممکن است نسخه رمزگشایی‌شده در Paging File باقی بماند. تحلیل‌گر می‌تواند این فایل را بررسی کند. پس مهاجم Paging File را غیرفعال می‌کند تا این شواهد تولید نشوند.</p>

<img src="images/CEHv13_06/slide_68.webp" alt="Disable Paging File" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۶۸: غیرفعال کردن Paging File از تنظیمات System Properties</div>

<h3>۴-۳. غیرفعال کردن System Restore Points</h3>
<p>System Restore Points یا نقاط بازگردانی سیستم، به صورت دوره‌ای از فایل‌های سیستمی و رجیستری نسخه پشتیبان می‌گیرند. اگر مهاجم فایلی را حذف کند، ممکن است تحلیل‌گر آن را از یک Restore Point بازیابی کند! پس مهاجم تمام Restore Pointها را غیرفعال و پاک می‌کند.</p>

<img src="images/CEHv13_06/slide_69.webp" alt="Disable System Restore" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۶۹: غیرفعال کردن و پاک کردن System Restore Points</div>

<h3>۵-۳. غیرفعال کردن Thumbnail Cache (thumbs.db)</h3>
<p>وقتی یک پوشه را باز می‌کنید، ویندوز برای نمایش سریع‌تر، تصویر بندانگشتی (Thumbnail) تمام فایل‌های تصویری و اسناد را در یک فایل مخفی به نام <code>thumbs.db</code> ذخیره می‌کند. اگر مهاجم یک فایل مخرب را داخل یک تصویر پنهان کرده باشد و بعد آن تصویر را حذف کند، Thumbnail آن تصویر همچنان در <code>thumbs.db</code> باقی می‌ماند و تحلیل‌گر می‌فهمد که آن فایل قبلاً روی سیستم وجود داشته است.</p>

<img src="images/CEHv13_06/slide_70.webp" alt="Disable Thumbnail Cache" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۷۰: غیرفعال کردن Thumbnail Cache از طریق Group Policy</div>

<h3>۶-۳. غیرفعال کردن Prefetch</h3>
<p>Prefetch یکی از قابلیت‌های ویندوز است که اطلاعاتی درباره برنامه‌هایی که کاربر معمولاً اجرا می‌کند ذخیره می‌کند تا بارگذاری آن‌ها سریع‌تر شود. اما اگر مهاجم یک برنامه مخرب را نصب و بعد حذف کند، یک نسخه از آن برنامه در فایل‌های Prefetch (پوشه <code>C:\\Windows\\Prefetch</code>) باقی می‌ماند و تحلیل‌گر می‌تواند از آن برای شناسایی فعالیت‌های مشکوک استفاده کند.</p>

<img src="images/CEHv13_06/slide_71.webp" alt="Disable Prefetch" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۷۱: غیرفعال کردن سرویس SysMain (که مسئول Prefetch است)</div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>الگوی مشترک این ۶ تکنیک چیست؟</strong> هر کدام از این قابلیت‌های ویندوز، یک نوع ردپا (Timestamp، فایل Cache، فایل Dump) به جا می‌گذارند. مهاجم با غیرفعال کردن آن‌ها، سعی می‌کند اطمینان حاصل کند که هیچ شاهدی از فعالیت او باقی نماند. اما دقت کنید: <strong>غیرفعال کردن هر کدام از این قابلیت‌ها خودش یک تغییر سیستم است</strong> که ممکن است توسط ابزارهای مانیتورینگ شناسایی شود.</div></div>

<p>تا اینجا همه تکنیک‌ها مخصوص ویندوز بود. حالا بیایید ببینیم در لینوکس چه ردپایی از مهاجم باقی می‌ماند.</p>

<h2>04. پاک کردن ردپا در لینوکس (Bash History)</h2>
<p>در لینوکس، پوسته پیش‌فرض <code>bash</code> است. Bash هر دستوری که شما تایپ می‌کنید را در یک فایل به نام <code>~/.bash_history</code> ذخیره می‌کند. اگر مهاجم یک سری دستور برای اکسپلویت، نصب بک‌دور یا پاک کردن لاگ‌ها اجرا کرده باشد، همه آن‌ها در این فایل ثبت شده‌اند. تحلیل‌گر می‌تواند این فایل را بررسی کند و بفهمد مهاجم دقیقاً چه کاری انجام داده است.</p>

<img src="images/CEHv13_06/slide_72.webp" alt="Bash History" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۷۲: دستورات پاک کردن تاریخچه Bash</div>

<p>چند روش برای پاک کردن ردپا در Bash وجود دارد:</p>
<div class="code-container"><div class="code-label">bash · clear_history</div><pre class="code-block">export HISTSIZE=0                        &#8592; غیرفعال کردن تاریخچه برای جلسه فعلی
history -c                               &#8592; پاک کردن تاریخچه ذخیره‌شده در حافظه
history -w                               &#8592; پاک کردن تاریخچه از شل فعلی
cat /dev/null > ~/.bash_history          &#8592; خالی کردن کامل فایل تاریخچه
shred ~/.bash_history                    &#8592; بازنویسی و تخریب فایل تاریخچه (بهترین روش)
history -c && exit                       &#8592; پاک کردن و خروج</pre></div>

<p><strong>تفاوت <code>cat /dev/null</code> با <code>shred</code>:</strong> وقتی فایل را با <code>cat /dev/null</code> خالی می‌کنید، محتوای آن پاک می‌شود اما ممکن است داده‌های قدیمی همچنان روی دیسک باقی بمانند و با ابزارهای فارنزیک بازیابی شوند. اما <code>shred</code> فایل را چندین بار با داده‌های تصادفی بازنویسی می‌کند تا بازیابی آن تقریباً غیرممکن شود.</p>

<h2>05. پنهان‌سازی فایل در سیستم‌عامل (OS)</h2>
<p>روش‌های پنهان‌سازی فایل در ویندوز و لینوکس متفاوت است. در ویندوز از ADS (که در جلسه قبل یاد گرفتیم) استفاده می‌شود، اما در لینوکس روش ساده‌تر است:</p>

<img src="images/CEHv13_06/slide_73.webp" alt="Covering Tracks on OS" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۷۳: پنهان‌سازی فایل در ویندوز (ADS) و لینوکس (پیشوند نقطه)</div>

<ul>
<li><strong>در ویندوز:</strong> پنهان کردن فایل در NTFS Alternate Data Streams (ADS) با دستور <code>type c:\\SecretFile.txt &gt; c:\\LegitFile.txt:SecretFile.txt</code>.</li>
<li><strong>در لینوکس:</strong> کافی است یک نقطه (.) به ابتدای نام فایل اضافه کنید. فایل‌هایی که با نقطه شروع می‌شوند (مثل <code>.secret</code> یا <code>.hidden</code>) به طور پیش‌فرض در خروجی دستور <code>ls</code> نمایش داده نمی‌شوند (باید از <code>ls -a</code> استفاده کنید).</li>
</ul>

<h2>01. بدافزار (Malware) چیست و چرا وجود دارد؟</h2>
<p>کلمه <strong>Malware</strong> از ترکیب دو کلمه <em>Malicious</em> (مخرب) و <em>Software</em> (نرم‌افزار) ساخته شده است. اما این تعریف ساده، عمق ماجرا را نشان نمی‌دهد. وقتی یک مهاجم بدافزار می‌سازد، به دنبال یک چیز است: <strong>اجرای کدی روی سیستم قربانی بدون اینکه قربانی متوجه شود.</strong></p>

<p>بدافزارها از راه‌های مختلفی وارد سیستم می‌شوند که برخی از مهم‌ترین آن‌ها عبارتند از:</p>
<ul>
<li><strong>پیام‌رسان‌های اینترنتی:</strong> لینک‌های مخربی که در چت‌ها ارسال می‌شوند.</li>
<li><strong>دستگاه‌های USB:</strong> فلش‌های آلوده که به سیستم وصل می‌شوند.</li>
<li><strong>پیوست‌های ایمیل:</strong> فایل‌های مخربی که در قالب اسناد اداری ارسال می‌شوند.</li>
<li><strong>برنامه‌های جعلی:</strong> نرم‌افزارهایی که در ظاهر سالم به نظر می‌رسند اما حاوی کد مخرب هستند.</li>
<li><strong>نرم‌افزارهای رایگان:</strong> نرم‌افزارهای کرک‌شده یا رایگانی که کد مخرب دارند.</li>
</ul>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>تفاوت بدافزار با یک ابزار معمولی چیست؟</strong>یک نرم‌افزار معمولی (مثل مرورگر یا آفیس) برای راحتی کار شما طراحی شده و شما از وجود آن آگاه هستید. اما بدافزار پنهانی طراحی شده تا شما از وجودش بی‌خبر باشید و در پس‌زمینه، اهداف مهاجم را پیش ببرد. این «پنهان‌کاری» (Stealth) مهم‌ترین ویژگی بدافزار است.</div></div>

<p>حالا که فهمیدیم بدافزار چیست، بیایید ببینیم از چه اجزایی ساخته می‌شود؛ چون درک این اجزا کلید فهم نحوه کار آنتی‌ویروس‌ها و روش‌های مقابله است.</p>

<h2>02. اجزای تشکیل‌دهنده بدافزار (Components of Malware)</h2>
<p>یک بدافزار حرفه‌ای فقط یک فایل اجرایی ساده نیست. سازندگان بدافزار، آن را از اجزای مختلفی می‌سازند که هر کدام وظیفه خاصی دارند تا هم مخفی بمانند، هم آنتی‌ویروس‌ها را دور بزنند و هم به هدف برسند.</p>

<img src="images/CEHv13_07/slide_5.webp" alt="Components of Malware" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۵: اجزای تشکیل‌دهنده یک بدافزار حرفه‌ای (Crypter، Dropper، Exploit، Injector، Obfuscator، Payload)</div>

<ul>
<li><strong>Crypter (رمزکننده):</strong> برنامه‌ای که کد بدافزار را رمزنگاری می‌کند تا آنتی‌ویروس‌ها نتوانند امضای آن را تشخیص دهند. وقتی بدافزار اجرا می‌شود، Crypter کد را در حافظه رمزگشایی می‌کند. مهاجم با هر بار رمزنگاری، یک بدافزار کاملاً جدید (از نظر امضای آنتی‌ویروس) تولید می‌کند که به آن <em>FUD (Fully Undetectable)</em> می‌گویند.</li>
<li><strong>Dropper (چکاننده):</strong> برنامه‌ای که کد مخرب را در پشت یک فایل بی‌خطر (مثل یک بازی یا سند PDF) پنهان می‌کند و آن را روی سیستم قربانی نصب می‌نماید. Dropper چندین نسخه از بدافزار را با خود حمل می‌کند تا اگر یک نسخه شناسایی شد، از نسخه دیگر استفاده کند.</li>
<li><strong>Exploit (اکسپلویت):</strong> کدی که از یک آسیب‌پذیری در سیستم‌عامل یا نرم‌افزار (مثلاً EternalBlue در SMB) سوءاستفاده می‌کند تا بدافزار را بدون نیاز به دخالت کاربر اجرا کند.</li>
<li><strong>Injector (تزریق‌کننده):</strong> برنامه‌ای که کد مخرب را به داخل یک پروسس در حال اجرا (مثل مرورگر یا explorer.exe) تزریق می‌کند. نتیجه: بدافزار به عنوان بخشی از یک پروسس معتبر دیده می‌شود و آنتی‌ویروس به آن شک نمی‌کند.</li>
<li><strong>Obfuscator (مبهم‌کننده):</strong> برنامه‌ای که کد بدافزار را طوری تغییر می‌دهد که برای انسان (و آنتی‌ویروس) غیرقابل خواندن باشد. این کار بدون تغییر رفتار بدافزار انجام می‌شود.</li>
<li><strong>Packer (فشرده‌ساز):</strong> کد بدافزار را فشرده می‌کند تا حجم آن کم شود و امضای آن مخدوش شود.</li>
<li><strong>Payload (محتوای اصلی):</strong> بخشی که کار اصلی و مخرب را انجام می‌دهد: حذف/تغییر فایل‌ها، باز کردن پورت، نصب بک‌دور، رمزنگاری داده (باج‌افزار) و غیره.</li>
</ul>

<div class="box note"><i class="fas fa-puzzle-piece"></i><div><strong>چرا بدافزار از این همه جزء ساخته می‌شود؟</strong>چون هر لایه، یک سد دفاعی برای آنتی‌ویروس ایجاد می‌کند. Crypter از تشخیص امضا جلوگیری می‌کند، Injector کد را در یک پروسس معتبر پنهان می‌کند، Obfuscator خواندن کد را دشوار می‌کند و Dropper نصب را مخفیانه انجام می‌دهد. یک بدافزار حرفه‌ای، مجموع این لایه‌ها است.</div></div>

<p>حالا که ساختار یک بدافزار را شناختیم، بیایید ببینیم وقتی این اجزا در خدمت یک گروه حرفه‌ای و هدفمند قرار می‌گیرند، چه چیزی به وجود می‌آید: یک تهدید پیشرفته و پایدار.</p>

<h2>03. تهدیدات پیشرفته و پایدار (APT - Advanced Persistent Threats)</h2>
<p>کلمه «APT» را می‌توان به «تهدید پیشرفته و پایدار» ترجمه کرد، اما این ترجمه، شدت آن را نشان نمی‌دهد. APT یک حمله سایبری است که در آن یک مهاجم (معمولاً یک گروه یا حتی یک کشور) <strong>برای مدت طولانی</strong> و به صورت <strong>هدفمند</strong> به یک سازمان نفوذ می‌کند تا اطلاعات حساس را بدزدد. برخلاف حملات معمولی که سریع انجام می‌شوند، APT می‌تواند <strong>ماه‌ها یا حتی سال‌ها</strong> طول بکشد بدون اینکه شناسایی شود.</p>

<img src="images/CEHv13_07/slide_9.webp" alt="APT Lifecycle" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۹: چرخه حیات یک حمله APT (از آماده‌سازی تا پاک‌سازی)</div>

<p><strong>چرخه حیات یک حمله APT (APT Lifecycle):</strong></p>
<ol>
<li><strong>Preparation (آماده‌سازی):</strong> تعریف هدف، تحقیق درباره آن، سازماندهی تیم، ساخت ابزار و تست روش‌های شناسایی.</li>
<li><strong>Initial Intrusion (نفوذ اولیه):</strong> استقرار بدافزار در سیستم و ایجاد یک اتصال خروجی (Outbound Connection) به سرور کنترل مهاجم.</li>
<li><strong>Expansion (گسترش):</strong> گسترش دسترسی به سیستم‌های دیگر شبکه و به دست آوردن اعتبارنامه‌های بیشتر.</li>
<li><strong>Persistence (ماندگاری):</strong> حفظ دسترسی برای مدت طولانی (مثلاً نصب بک‌دور).</li>
<li><strong>Search and Exfiltration (جستجو و استخراج):</strong> استخراج داده‌های حساس (اطلاعات کاربران، اسناد محرمانه، اطلاعات کارت اعتباری).</li>
<li><strong>Cleanup (پاک‌سازی):</strong> پاک کردن ردپا و ماندن در سایه بدون شناسایی.</li>
</ol>

<div class="box warning"><i class="fas fa-user-secret"></i><div><strong>چرا APT این‌قدر خطرناک است؟</strong>چون برخلاف حملات معمولی که هدفشان «تخریب» است، هدف APT «سرقت اطلاعات» است. این حملات می‌توانند سال‌ها ادامه داشته باشند و حتی وقتی سازمان متوجه شود، دیگر دیر شده است. گروه‌های APT معروف (مثل APT29 و APT28) معمولاً به کشورها یا گروه‌های جاسوسی سایبری نسبت داده می‌شوند.</div></div>

<p>در دل این حملات طولانی، معمولاً یک نوع بدافزار خاص بیشترین نقش را بازی می‌کند که در ادامه با آن آشنا می‌شویم.</p>

<h2>04. تروجان‌ها (Trojans): اسب چوبی دنیای دیجیتال</h2>
<p>نام تروجان از داستان معروف «اسب چوبی تروا» گرفته شده است. در آن داستان، یونانیان یک اسب چوبی عظیم به عنوان هدیه به شهر تروا فرستادند، اما درون آن سربازان مخفی شده بودند. تروجان‌های کامپیوتری هم دقیقاً همین کار را می‌کنند: در ظاهر یک نرم‌افزار بی‌خطر و حتی مفید به نظر می‌رسند، اما در باطن کد مخرب خود را اجرا می‌کنند.</p>

<img src="images/CEHv13_07/slide_14.webp" alt="Trojans Wrappers" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۴: تکنیک Wrapper (ترکیب Trojan.exe با یک برنامه سالم مثل Chess.exe)</div>

<h3>۱-۴. اهداف تروجان</h3>
<ul>
<li>حذف یا جایگزینی فایل‌های حساس سیستم‌عامل.</li>
<li>غیرفعال کردن آنتی‌ویروس و فایروال.</li>
<li>ثبت تصویر از صفحه قربانی، ضبط صدا و فیلم از کامپیوتر قربانی.</li>
<li>دزدیدن اطلاعاتی مانند پسوردها، کدهای امنیتی و اطلاعات کارت‌های اعتباری.</li>
<li>آلوده کردن کامپیوتر قربانی به عنوان یک پروکسی سرور و استفاده از آن در حملات.</li>
<li>استفاده از کامپیوتر قربانی برای هرزنامه‌نگاری (Spamming).</li>
<li>استفاده از کامپیوتر قربانی به عنوان یک ربات (Bot) برای آماده‌سازی حملات DDoS.</li>
</ul>

<h3>۲-۴. پورت‌هایی که تروجان‌ها استفاده می‌کنند</h3>
<p>بسیاری از تروجان‌ها از پورت‌های خاصی برای ارتباط با سرور مهاجم استفاده می‌کنند. یک تحلیل‌گر امنیتی می‌تواند با مانیتورینگ پورت‌های غیرمعمول، تروجان‌ها را شناسایی کند.</p>

<h3>۳-۴. تکنیک Wrapper (پوشش)</h3>
<p>اما تروجان چطور کاربر را فریب می‌دهد که آن را اجرا کند؟ یکی از هوشمندانه‌ترین تکنیک‌ها، <strong>Wrapper</strong> است. در این تکنیک، مهاجم یک تروجان اجرایی (مثلاً <code>Trojan.exe</code> با حجم 20KB) را با یک برنامه سالم و محبوب (مثلاً <code>Chess.exe</code> با حجم 90KB) ترکیب می‌کند. نتیجه یک فایل واحد به حجم 110KB است که به نظر می‌رسد فقط یک بازی شطرنج است.</p>
<p>وقتی کاربر <code>Chess.exe</code> را اجرا می‌کند، ابتدا تروجان در پس‌زمینه اجرا می‌شود (بدون اینکه کاربر متوجه شود) و سپس بازی شطرنج باز می‌شود. کاربر فکر می‌کند فقط یک بازی معمولی اجرا کرده، اما در واقع سیستم او آلوده شده است.</p>

<h3>۴-۴. انواع تروجان‌ها</h3>
<p>تروجان‌ها بر اساس هدف و رفتارشان به انواع مختلفی تقسیم می‌شوند:</p>
<ul>
<li><strong>Remote Access Trojans (RATs):</strong> کنترل کامل سیستم قربانی از راه دور (مثل njRAT و DarkComet).</li>
<li><strong>Backdoor Trojans:</strong> ایجاد یک درب پشتی برای دسترسی‌های بعدی.</li>
<li><strong>Proxy Server Trojans:</strong> تبدیل سیستم قربانی به یک پروکسی برای مخفی کردن هویت مهاجم.</li>
<li><strong>Botnet Trojans:</strong> تبدیل سیستم قربانی به یک ربات برای حملات DDoS.</li>
<li><strong>DDoS Attack Trojans:</strong> اجرای حملات DDoS از سیستم قربانی.</li>
<li><strong>E-Banking Trojans:</strong> سرقت اطلاعات بانکی.</li>
<li><strong>Mobile Trojans:</strong> تروجان‌های مخصوص گوشی‌های همراه.</li>
<li><strong>Defacement Trojans:</strong> تغییر ظاهر وب‌سایت‌ها.</li>
<li><strong>Destructive Trojans:</strong> تخریب فایل‌ها و سیستم.</li>
<li><strong>Rootkit Trojans:</strong> ترکیب تروجان با روت‌کیت برای پنهان‌سازی کامل.</li>
<li><strong>Service Protocol Trojans:</strong> سوءاستفاده از پروتکل‌های سرویس.</li>
<li><strong>Covert Channel Trojans:</strong> استفاده از کانال‌های مخفی برای ارتباط.</li>
<li><strong>Security Software Disabler Trojans:</strong> غیرفعال کردن نرم‌افزارهای امنیتی.</li>
<li><strong>Command Shell Trojans:</strong> اجرای دستورات خط فرمان روی سیستم قربانی.</li>
<li><strong>IoT Trojans:</strong> تروجان‌های مخصوص دستگاه‌های اینترنت اشیا.</li>
</ul>

<p>تروجان یک فایل مستقل است و خود را تکثیر نمی‌کند. اما نوع دیگری از بدافزار وجود دارد که قابلیت تکثیر خودکار دارد و به همین دلیل می‌تواند به سرعت در یک سیستم پخش شود.</p>

<h2>05. ویروس‌ها (Viruses): کدهایی که خود را تکثیر می‌کنند</h2>
<p>ویروس‌ها یکی دیگر از انواع مهم بدافزارها هستند. تفاوت اصلی آن‌ها با تروجان‌ها در این است که ویروس‌ها <strong>قابلیت تکثیر خودکار</strong> دارند و برای اجرا شدن، <strong>به یک فایل میزبان (Host)</strong> نیاز دارند. در حالی که تروجان یک فایل مستقل است و خود را تکثیر نمی‌کند.</p>

<h3>۱-۵. چرخه حیات یک ویروس</h3>
<ol>
<li><strong>طراحی (Design):</strong> توسعه‌دهنده ویروس، کد را با یک زبان برنامه‌نویسی می‌نویسد.</li>
<li><strong>تکثیر (Replication):</strong> ویروس در یک مدت زمان خاص خود را در سیستم قربانی به صورت پنهان تکثیر می‌دهد (مثلاً با آلوده کردن فایل‌های .exe دیگر).</li>
<li><strong>اجرا (Execution):</strong> ویروس با انجام یک فعالیت خاص کاربر (مثل اجرای یک برنامه آلوده) فعالیت مخرب خود را شروع می‌کند.</li>
<li><strong>شناسایی (Detection):</strong> در این مرحله ویروس توسط آنتی‌ویروس شناسایی می‌شود.</li>
<li><strong>شبیه‌سازی (Simulation):</strong> توسعه‌دهندگان آنتی‌ویروس، دفاع در برابر ویروس را شبیه‌سازی می‌کنند.</li>
<li><strong>حذف (Elimination):</strong> کاربران با استفاده از بروزرسانی آنتی‌ویروس، تهدید را از بین می‌برند.</li>
</ol>

<h3>۲-۵. چگونه یک کامپیوتر توسط ویروس آلوده می‌شود؟</h3>
<ul>
<li>هنگامی که کاربر بدون اطلاع از منبع یک فایل، آن را دانلود می‌کند.</li>
<li>هنگامی که پیوست یک ایمیل ناشناخته باز می‌شود.</li>
<li>هنگامی که نرم‌افزارهای کرک‌شده نصب می‌شوند.</li>
<li>هنگامی که بروزرسانی و نسخه جدید یک برنامه نصب نشده باشد.</li>
<li>هنگامی که آنتی‌ویروسی روی سیستم نصب نشده یا بروزرسانی نشده باشد.</li>
</ul>

<h3>۳-۵. انواع ویروس‌ها</h3>
<img src="images/CEHv13_07/slide_21.webp" alt="Types of Viruses" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۱: انواع مختلف ویروس‌ها</div>

<ul>
<li><strong>System or Boot Sector Viruses:</strong> بخش راه‌اندازی (Boot Sector) دیسک را آلوده می‌کنند.</li>
<li><strong>File and Multipartite Viruses:</strong> فایل‌های اجرایی را آلوده می‌کنند و می‌توانند به Boot Sector هم سرایت کنند.</li>
<li><strong>Macro Viruses:</strong> در فایل‌های آفیس (Word، Excel) با استفاده از ماکروها اجرا می‌شوند.</li>
<li><strong>Cluster Viruses:</strong> جدول تخصیص فایل (FAT) را تغییر می‌دهند.</li>
<li><strong>Stealth/Tunneling Viruses:</strong> خود را از دید آنتی‌ویروس پنهان می‌کنند.</li>
<li><strong>Encryption Viruses:</strong> خود را رمزنگاری می‌کنند تا شناسایی نشوند.</li>
<li><strong>Polymorphic Code:</strong> در هر بار تکثیر، شکل خود را تغییر می‌دهند (این باعث می‌شود آنتی‌ویروس‌ها نتوانند با امضا آن‌ها را شناسایی کنند).</li>
<li><strong>Metamorphic Viruses:</strong> در هر بار تکثیر، کد خود را کاملاً بازنویسی می‌کنند (نه فقط ظاهر آن را تغییر می‌دهند).</li>
<li><strong>File Overwriting or Cavity Viruses:</strong> فایل‌های قربانی را بازنویسی یا محتوای آن‌ها را پر می‌کنند.</li>
<li><strong>Companion/Camouflage Viruses:</strong> یک فایل هم‌نام با فایل اصلی ایجاد می‌کنند و کاربر به اشتباه آن را اجرا می‌کند.</li>
<li><strong>File Extension Viruses:</strong> پسوند فایل را تغییر می‌دهند تا کاربر آن را اشتباهاً اجرا کند.</li>
<li><strong>Add-on and Intrusive Viruses:</strong> کد خود را به فایل اصلی اضافه می‌کنند بدون اینکه آن را از بین ببرند.</li>
</ul>

<h3>۴-۵. آنتی‌ویروس جعلی (Fake Antivirus)</h3>
<p>و در پایان، یک تکنیک بسیار رایج در بین مهاجمان که از اعتماد کاربر به ابزارهای امنیتی سوءاستفاده می‌کند: ساخت آنتی‌ویروس‌های جعلی. این برنامه‌ها در ظاهر شبیه به یک آنتی‌ویروس واقعی هستند و حتی ممکن است هشدارهای واقعی نمایش دهند (مثلاً «سیستم شما ویروسی شده!»). اما وقتی کاربر روی دکمه «پاک‌سازی» کلیک می‌کند، در واقع یک بدافزار را دانلود و نصب می‌کند.</p>

<h3>🧠 جمع‌بندی جلسه ۷-۱</h3>
<p><strong>۱.</strong> بدافزار (Malware) نرم‌افزاری مخرب است که برای اجرای کد روی سیستم قربانی بدون اطلاع او طراحی شده است.</p>
<p><strong>۲.</strong> بدافزارهای حرفه‌ای از اجزای مختلفی ساخته می‌شوند: Crypter (رمزنگاری)، Dropper (نصب مخفیانه)، Exploit (بهره‌برداری)، Injector (تزریق)، Obfuscator (مبهم‌سازی) و Payload (محتوای مخرب).</p>
<p><strong>۳.</strong> APT (تهدید پیشرفته و پایدار) یک حمله طولانی‌مدت و هدفمند است که هدف آن سرقت اطلاعات حساس است. چرخه حیات آن شامل ۶ مرحله: آماده‌سازی، نفوذ، گسترش، ماندگاری، جستجو/استخراج و پاک‌سازی.</p>
<p><strong>۴.</strong> تروجان‌ها در ظاهر بی‌خطر هستند اما در باطن مخرب‌اند. تکنیک Wrapper آن‌ها را با برنامه‌های سالم ترکیب می‌کند تا کاربر فریب بخورد. هر تروجان معروف، پورت خاص خودش را دارد.</p>
<p><strong>۵.</strong> ویروس‌ها برای اجرا به یک فایل میزبان نیاز دارند و خود را تکثیر می‌کنند. انواع مختلفی دارند: Boot Sector، Macro، Polymorphic (تغییر ظاهر) و Metamorphic (بازنویسی کامل کد).</p>
<p><strong>۶.</strong> آنتی‌ویروس‌های جعلی (Fake Antivirus) برنامه‌هایی هستند که در ظاهر سیستم را پاک‌سازی می‌کنند اما در واقع بدافزار نصب می‌کنند.</p>
</div>

<h2>01. باج‌افزار (Ransomware): گروگان‌گیری دیجیتال</h2>
<p>تا اینجا با ویروس‌ها و تروجان‌ها آشنا شدیم. اما یک نوع بدافزار وجود دارد که در دهه اخیر به یک بحران جهانی تبدیل شده و حتی بیمارستان‌ها و شرکت‌های بزرگ را فلج کرده است: <strong>باج‌افزار (Ransomware)</strong>.</p>

<p>باج‌افزارها نوعی از بدافزارها هستند که موجب ایجاد محدودیت در دسترسی به فایل‌ها و پوشه‌ها می‌شوند و پس از آن شما را به یک سایت پرداخت آنلاین هدایت می‌کنند تا با پرداخت هزینه (باج)، به اطلاعات خود دسترسی داشته باشید.</p>

<img src="images/CEHv13_07/slide_23.webp" alt="Ransomware Concept" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۳: نمونه‌ای از صفحه درخواست باج (CTB-Locker)</div>

<div class="box note"><i class="fas fa-question-circle"></i><div><strong>چرا باج‌افزارها به وجود آمدند؟</strong>تا قبل از باج‌افزارها، مهاجمان برای کسب درآمد باید اطلاعات را می‌دزدیدند و در بازار سیاه می‌فروختند. این کار سخت بود. اما باج‌افزار یک مدل درآمدی کاملاً جدید ساخت: <strong>داده‌های قربانی را قفل کن، از خود قربانی بخواه پول بدهد تا بازش کند.</strong> این مدل، آن‌قدر سودآور بود که امروز باج‌افزار به یک صنعت چند میلیارد دلاری تبدیل شده است.</div></div>

<h3>۱-۱. چرخه حیات یک حمله باج‌افزاری</h3>
<p>برای اینکه بفهمیم چرا باج‌افزار این‌قدر مؤثر است، بیایید ببینیم یک حمله باج‌افزاری از ابتدا تا انتها چطور پیش می‌رود. این چرخه چهار مرحله دارد که پشت سر هم انجام می‌شوند:</p>
<ol>
<li><strong>نفوذ (Infection):</strong> باج‌افزار از طریق ایمیل فیشینگ، آسیب‌پذیری نرم‌افزار (مثل SMB یا RDP) یا دانلود از سایت‌های ناشناس وارد سیستم می‌شود.</li>
<li><strong>رمزنگاری (Encryption):</strong> باج‌افزار با یک الگوریتم رمزنگاری قوی (معمولاً AES یا RSA)، تمام فایل‌های حساس کاربر را رمزنگاری می‌کند.</li>
<li><strong>درخواست باج (Ransom Note):</strong> یک فایل متنی با دستورالعمل پرداخت (معمولاً با ارز دیجیتال مثل بیت‌کوین) روی دسکتاپ ظاهر می‌شود.</li>
<li><strong>تخریب یا پرداخت (Destruction/Payment):</strong> اگر قربانی پول بدهد، مهاجم کلید رمزگشایی را می‌فرستد. اگر نه، داده‌ها برای همیشه از دست می‌روند (یا در نسخه‌های مدرن‌تر، داده‌ها در سایت‌های لیک اطلاعات منتشر می‌شوند).</li>
</ol>

<p>حالا که چرخه کلی را دیدیم، بیایید دو نمونه از رایج‌ترین خانواده‌های باج‌افزار را بررسی کنیم؛ هر کدام یک مسیر نفوذ متفاوت دارند.</p>

<h3>۲-۱. باج‌افزار Mallox</h3>
<p>Mallox برای اولین بار در ژوئن ۲۰۲۱ شناسایی شد و شبکه‌هایی با سرورهای <strong>MS-SQL</strong> آسیب‌پذیر را آلوده می‌کند. این باج‌افزار از طریق ایمیل، ابزارهای کرک و دانلود از سایت‌های ناشناس منتشر می‌شود.</p>

<img src="images/CEHv13_07/slide_25.webp" alt="Mallox Ransomware" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۵: Mallox Ransomware و پیام قفل شدن سیستم</div>

<p><strong>نشانه‌های آلودگی به Mallox:</strong></p>
<ul>
<li>فایل‌های سیستم را رمزگذاری کرده و پسوند <code>.mallox</code> را به آن‌ها اضافه می‌کند (مثلاً <code>sample.txt.mallox</code>).</li>
<li>نسخه‌های دیگر پسوندهایی مانند <code>malloxxx</code> و <code>malloxxx</code> دارند.</li>
<li>یک فایل متنی به نام <code>RECOVERY INFORMATION.txt</code> ایجاد می‌کند که شامل دستورالعمل‌های ارتباط با مهاجم است.</li>
<li>پرداخت باج از طریق یک وب‌سایت <strong>TOR</strong> انجام می‌شود (تا ردیابی نشود).</li>
</ul>

<div class="box note"><i class="fas fa-info-circle"></i><div><strong>چرا سرورهای MS-SQL؟</strong>بسیاری از سازمان‌ها سرورهای MSSQL را با رمز عبور پیش‌فرض (sa) یا رمزهای ضعیف به اینترنت متصل می‌کنند. Mallox این ضعف را شناسایی کرده و از آن برای نفوذ استفاده می‌کند. این یک درس بزرگ است: <strong>هرگز سرور دیتابیس خود را مستقیماً روی اینترنت قرار ندهید.</strong></div></div>

<p>Mallox بیشتر سرورهای سازمانی را هدف می‌گیرد. اما خانواده دیگری از باج‌افزارها روی کاربران خانگی تمرکز دارند و به همین دلیل شیوع بیشتری دارند.</p>

<h3>۳-۱. باج‌افزار STOP/DJVU</h3>
<p>حمله <strong>STOP/DJUVU</strong> اولین بار در فوریه ۲۰۱۸ شناسایی شد و اکنون بیش از ۶۰۰ نسخه دارد. این یکی از رایج‌ترین خانواده‌های باج‌افزار در دنیاست و معمولاً سیستم‌های ویندوزی کاربران خانگی را هدف قرار می‌دهد.</p>

<p><strong>مشخصات STOP/DJUVU:</strong></p>
<ul>
<li>با پسوند <code>.djvu</code> روی فایل‌ها کار می‌کند و پسوندهای متنوعی مانند <code>.looy</code>، <code>.vook</code>، <code>.kool</code>، <code>.nood</code>، <code>.miwa</code>، <code>.lkhy</code>، <code>.cdxx</code> ایجاد می‌کند.</li>
<li>فایلی به نام <code>_readme.txt</code> شامل دستورالعمل پرداخت باج ایجاد می‌کند.</li>
<li>از طریق ایمیل‌های اسپم با پیوست مخرب و فایل‌های تورنت جعلی منتشر می‌شود.</li>
</ul>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>نکته حیاتی:</strong>نام‌گذاری باج‌افزارها بر اساس پسوندی است که به فایل‌ها اضافه می‌کنند. بنابراین، اگر فایلی با پسوند <code>.djvu</code> یا <code>.mallox</code> دیدید، فوراً بدانید که سیستم شما آلوده شده است. اکثر این باج‌افزارها پس از رمزنگاری، خود را حذف می‌کنند تا ردی از خود باقی نگذارند.</div></div>

<p>باج‌افزار برای پخش شدن نیاز به دخالت کاربر یا آسیب‌پذیری دارد. اما نوع دیگری از بدافزار وجود دارد که خودش به تنهایی در شبکه می‌چرخد و پخش می‌شود.</p>

<h2>02. کرم‌ها (Worms): پخش‌کننده‌های خودکار</h2>
<p>در جلسه قبل دیدیم که ویروس‌ها برای اجرا به یک فایل میزبان نیاز دارند و باید توسط کاربر اجرا شوند. اما <strong>کرم (Worm)</strong> یک تفاوت اساسی با ویروس دارد: کرم‌ها <strong>خودکار</strong> هستند. آن‌ها برای تکثیر خود نیازی به دخالت کاربر ندارند و می‌توانند از یک سیستم به سیستم دیگر در شبکه حرکت کنند.</p>

<img src="images/CEHv13_07/slide_27.webp" alt="Worm Concept" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۷: مفهوم کرم و تفاوت آن با ویروس</div>

<p>یک کرم در واقع یک بدافزار است که خود اجرا شده و خود را در سراسر شبکه بدون دخالت کاربر تکثیر می‌نماید. بیشتر کرم‌ها فقط یک نسخه از خود تکثیر کرده و در سراسر شبکه انتشار می‌دهند. کرم‌ها از منابع شبکه استفاده می‌کنند و به میزبان خسارت‌هایی را وارد می‌نمایند.</p>

<h3>۱-۲. تفاوت ویروس و کرم</h3>
<p>این جدول را به خاطر بسپارید، چون در آزمون CEH و مصاحبه‌های شغلی بسیار مهم است:</p>
<table>
<thead><tr><th>ویژگی</th><th>ویروس (Virus)</th><th>کرم (Worm)</th></tr></thead>
<tbody>
<tr><td>نیاز به فایل میزبان</td><td>بله (به یک فایل .exe یا .doc نیاز دارد)</td><td>خیر (یک فایل مستقل است)</td></tr>
<tr><td>نیاز به دخالت کاربر</td><td>بله (کاربر باید فایل آلوده را اجرا کند)</td><td>خیر (خودکار تکثیر می‌شود)</td></tr>
<tr><td>سرعت تکثیر</td><td>کند (فقط با اجرای کاربر)</td><td>بسیار سریع (در عرض چند دقیقه کل شبکه را آلوده می‌کند)</td></tr>
<tr><td>هدف اصلی</td><td>آلوده کردن فایل‌ها</td><td>آلوده کردن شبکه و میزبان‌ها</td></tr>
</tbody>
</table>

<h3>۲-۲. چرا کرم‌ها این‌قدر خطرناک هستند؟</h3>
<p>یک کرم می‌تواند در عرض چند ساعت کل شبکه یک سازمان را آلوده کند. کرم‌های معروفی مثل <strong>WannaCry</strong> (که در سال ۲۰۱۷ از آسیب‌پذیری EternalBlue استفاده کرد و بیش از ۲۰۰,۰۰۰ کامپیوتر در ۱۵۰ کشور را آلوده کرد) و <strong>Conficker</strong> نشان دادند که یک کرم خوب می‌تواند به یک فاجعه جهانی تبدیل شود.</p>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>چرا کرم‌ها از طریق شبکه پخش می‌شوند؟</strong>کرم‌ها از آسیب‌پذیری‌های سرویس‌های شبکه (مثل SMB، RDP، NetBIOS) استفاده می‌کنند تا به سیستم‌های دیگر نفوذ کنند. به همین دلیل، کرم‌ها معمولاً در سازمان‌هایی که Patch Updates آن‌ها به‌روز نیست، شیوع بیشتری دارند.</div></div>

<p>همه بدافزارهای تا اینجا یک چیز مشترک داشتند: یک فایل روی هارد. اما دسته‌ای از بدافزارها وجود دارند که اصلاً فایلی روی هارد نمی‌نویسند.</p>

<h2>03. بدافزار بدون فایل (Fileless Malware): نامرئی‌ترین تهدید</h2>
<p>حالا به یکی از پیشرفته‌ترین و خطرناک‌ترین انواع بدافزار می‌رسیم: <strong>بدافزار بدون فایل (Fileless Malware)</strong>. همان‌طور که از نامش مشخص است، این نوع بدافزار <strong>از فایل یا پردازشی که آنتی‌ویروس بتواند اسکن کند، استفاده نمی‌کند</strong>.</p>

<img src="images/CEHv13_07/slide_30.webp" alt="Fileless Malware Concept" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۰: مفهوم بدافزار بدون فایل (Fileless Malware)</div>

<h3>۱-۳. چرا این نوع بدافزار خطرناک است؟</h3>
<p>آنتی‌ویروس‌های سنتی به این صورت کار می‌کنند:</p>
<ul>
<li>فایل‌های موجود روی هارد را اسکن می‌کنند.</li>
<li>هر فایلی که با امضای بدافزار شناخته‌شده مطابقت داشته باشد را قرنطینه می‌کنند.</li>
</ul>
<p>اما بدافزارهای بدون فایل، از این چرخه عبور می‌کنند. آن‌ها به جای اینکه یک فایل .exe روی هارد بنویسند، <strong>مستقیماً در حافظه (RAM) اجرا می‌شوند</strong> و از ابزارهای خود ویندوز (مثل PowerShell، WMI، رجیستری) برای اجرای کد مخرب استفاده می‌کنند. در نتیجه، آنتی‌ویروس هیچ فایلی برای اسکن پیدا نمی‌کند.</p>

<h3>۲-۳. چرخه حمله بدافزار بدون فایل</h3>
<p>یک حمله بدون فایل معمولاً هفت مرحله دارد که در آن مهاجم از نفوذ اولیه به تکامل مداوم می‌رسد:</p>
<ol>
<li><strong>Infiltration (نفوذ):</strong> ورود از طریق فیشینگ ایمیل یا سایر روش‌ها.</li>
<li><strong>Establishment (ایجاد پایگاه):</strong> بهره‌برداری از آسیب‌پذیری‌ها و تثبیت حضور در سیستم (اغلب در رجیستری).</li>
<li><strong>Learning (یادگیری):</strong> جمع‌آوری داده و تطبیق با محیط.</li>
<li><strong>Adaptation (تطبیق):</strong> تغییر کد و تکنیک‌ها برای عبور از آنتی‌ویروس.</li>
<li><strong>Execution (اجرا):</strong> اجرای فعالیت‌های مخرب (مثل سرقت داده یا رمزنگاری).</li>
<li><strong>Propagation (گسترش):</strong> انتشار به سایر سیستم‌های شبکه.</li>
<li><strong>Evolution (تکامل):</strong> یادگیری از حملات قبلی و تطبیق بیشتر.</li>
</ol>

<div class="box warning"><i class="fas fa-user-secret"></i><div><strong>یک مثال واقعی:</strong>فرض کنید روی سیستم شما یک افزونه قدیمی Flash Player نصب است. شما به یک سایت آلوده وارد می‌شوید. یک <strong>Exploit Kit</strong> (کیت بهره‌برداری) شروع به اسکن می‌کند و یک آسیب‌پذیری در Flash پیدا می‌کند. بلافاصله یک Payload را در حافظه مرورگر شما اجرا می‌کند (بدون اینکه فایلی روی هارد نوشته شود). این Payload به سرور C&C متصل می‌شود و کلید رمزنگاری را دریافت می‌کند. سپس شروع به رمزنگاری داده‌های شما می‌کند (باج‌افزار بدون فایل!). هیچ فایلی روی هارد شما نوشته نشده که آنتی‌ویروس بتواند پیدا کند.</div></div>

<p>حالا که مکانیزم کلی را دیدیم، بیایید یک نمونه واقعی و کلاسیک را بررسی کنیم که ثابت کرد این نوع بدافزار عملاً وجود دارد.</p>

<h3>۳-۳. بدافزار Poweliks: یک نمونه کلاسیک</h3>
<p>آلودگی بدافزار بدون فایل برای اولین بار در سال ۲۰۱۴ مشاهده شد که نام آن <strong>Poweliks Trojan</strong> بود. این بدافزار برای اولین بار طراحی شده بود که «نوعی کلاهبرداری مبتنی بر کلیک» یا Click-fraud ایجاد کند.</p>

<img src="images/CEHv13_07/slide_32.webp" alt="Poweliks Trojan" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۲: Poweliks Trojan و قابلیت‌های آن</div>

<p><strong>چرا Poweliks این‌قدر مخفی بود؟</strong> چون خود را به صورت رمزنگاری‌شده در رجیستری ویندوز ذخیره می‌کرد و هیچ فایلی روی هارد نداشت. هیچ آنتی‌ویروسی نمی‌توانست آن را پیدا کند.</p>

<p>و در پس تمام این حملات، یک ابزار مشترک وجود دارد که هم بدافزارهای بدون فایل و هم باج‌افزارها از آن استفاده می‌کنند: کیت‌های بهره‌برداری.</p>

<h3>۴-۳. کیت‌های بهره‌برداری (Exploit Kits)</h3>
<p>بدافزارهای بدون فایل معمولاً از <strong>Exploit Kitها</strong> استفاده می‌کنند. یک Exploit Kit یک بسته نرم‌افزاری است که شامل اکسپلویت‌های متعددی برای آسیب‌پذیری‌های مختلف (مرورگرها، افزونه‌ها، سیستم‌عامل) است. وقتی کاربر وارد یک سایت آلوده می‌شود، Exploit Kit شروع به اسکن می‌کند تا ببیند کدام آسیب‌پذیری روی سیستم قربانی وجود دارد، و سپس از همان استفاده می‌کند.</p>

<img src="images/CEHv13_07/slide_36.webp" alt="Exploit Kit Chain" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۶: چرخه حمله Exploit Kit (از سایت آلوده تا نصب بدافزار)</div>

<div class="box important"><i class="fas fa-shield-alt"></i><div><strong>چرا Exploit Kitها این‌قدر مؤثرند؟</strong>چون نیازی به دخالت کاربر ندارند. کاربر فقط باید وارد یک سایت شود (مثلاً یک سایت خبری آلوده). همین کافی است تا Exploit Kit کار خود را انجام دهد. به همین دلیل، همیشه توصیه می‌شود که <strong>مرورگر و افزونه‌های خود را به‌روز نگه دارید</strong>؛ چون اکثر اکسپلویت‌ها روی نسخه‌های قدیمی کار می‌کنند.</div></div>

<p>تا اینجا همه بدافزارها رفتارشان از پیش برنامه‌ریزی شده بود. اما نسل جدیدی از بدافزارها وارد شده که در هر بار اجرا یاد می‌گیرند و خود را تغییر می‌دهند.</p>

<h2>04. بدافزارهای مبتنی بر هوش مصنوعی (AI-Based Malware)</h2>
<p>حالا به آخرین و شاید نگران‌کننده‌ترین بخش این جلسه می‌رسیم: <strong>بدافزارهای مبتنی بر هوش مصنوعی</strong>. تا اینجا بدافزارهایی را دیدیم که رفتارشان از پیش برنامه‌ریزی شده بود (مثلاً یک باج‌افزار همیشه یک کار را انجام می‌داد). اما با ظهور هوش مصنوعی، نسل جدیدی از بدافزارها ظهور کرده‌اند که می‌توانند <strong>یاد بگیرند</strong> و <strong>تکامل پیدا کنند</strong>.</p>

<img src="images/CEHv13_07/slide_37.webp" alt="AI-Based Malware" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۷: بدافزارهای مبتنی بر هوش مصنوعی و مراحل عملکرد آن‌ها</div>

<p>بدافزار مبتنی بر هوش مصنوعی، نرم‌افزار مخربی است که از روش‌ها و الگوریتم‌های هوش مصنوعی برای افزایش قابلیت‌ها و دستیابی به اهداف خود استفاده می‌کند. این بدافزار می‌تواند رفتار و تکنیک‌های خود را بر اساس محیط اطراف تطبیق دهد، اقدامات امنیتی را دور بزند و با دقت بالا به سیستم‌های هدف نفوذ کند.</p>

<p><strong>مراحل عملکرد یک بدافزار AI:</strong></p>
<ul>
<li><strong>Infiltration (نفوذ):</strong> ورود از طریق فیشینگ ایمیل یا روش‌های دیگر.</li>
<li><strong>Establishment (ایجاد پایگاه):</strong> بهره‌برداری از آسیب‌پذیری‌ها و تثبیت حضور در سیستم.</li>
<li><strong>Learning (یادگیری):</strong> جمع‌آوری داده از محیط و تطبیق با آن.</li>
<li><strong>Adaptation (تطبیق):</strong> تغییر کد و تکنیک‌ها برای عبور از آنتی‌ویروس.</li>
<li><strong>Execution (اجرا):</strong> انجام اقدامات مخرب مثل سرقت داده یا رمزنگاری.</li>
<li><strong>Propagation (گسترش):</strong> انتشار به سایر سیستم‌های شبکه.</li>
<li><strong>Evolution (تکامل):</strong> یادگیری از حملات قبلی و تطبیق بیشتر.</li>
</ul>

<div class="box note"><i class="fas fa-robot"></i><div><strong>چرا بدافزارهای AI خطرناک‌ترند؟</strong>یک بدافزار معمولی اگر شناسایی شود، برای همیشه شناسایی می‌شود. اما یک بدافزار AI می‌تواند در هر بار اجرا، رفتار خود را تغییر دهد تا از شناسایی فرار کند. این یک مسابقه تسلیحاتی جدید بین مهاجمان و مدافعان است.</div></div>

<p>حالا که با تمام این تهدیدات آشنا شدیم، بیایید ببینیم در عمل چطور می‌توان در برابر هر کدام از آن‌ها دفاع کرد.</p>

<h2>05. مقابله با این تهدیدات</h2>
<p>برای مقابله با باج‌افزارها، کرم‌ها و بدافزارهای بدون فایل، استراتژی دفاعی باید چندلایه باشد. هر تهدید، دفاع مخصوص خودش را می‌طلبد:</p>

<h3>۱-۵. مقابله با باج‌افزارها</h3>
<ul>
<li><strong>پشتیبان‌گیری منظم (Backup):</strong> مهم‌ترین راه دفاع. اگر داده‌ها را در جای دیگری داشته باشید، باج‌افزار بی‌فایده می‌شود.</li>
<li><strong>به‌روزرسانی مداوم:</strong> اکثر باج‌افزارها از آسیب‌پذیری‌های قدیمی استفاده می‌کنند.</li>
<li><strong>عدم پرداخت باج:</strong> پرداخت باج، مهاجم را تشویق می‌کند و تضمینی برای بازگشت داده‌ها نیست.</li>
<li><strong>غیرفعال کردن RDP و SMB:</strong> اگر نیازی به این سرویس‌ها ندارید، غیرفعالشان کنید.</li>
</ul>

<h3>۲-۵. مقابله با کرم‌ها</h3>
<ul>
<li><strong>Patch Management:</strong> کرم‌ها از آسیب‌پذیری‌های شناخته‌شده استفاده می‌کنند. با نصب وصله‌ها، جلوی آن‌ها را بگیرید.</li>
<li><strong>Segment بندی شبکه (Network Segmentation):</strong> با VLANبندی، جلوی پخش شدن کرم را بگیرید.</li>
<li><strong>غیرفعال کردن سرویس‌های غیرضروری:</strong> SMB نسخه ۱ و NetBIOS را غیرفعال کنید.</li>
</ul>

<h3>۳-۵. مقابله با بدافزار بدون فایل</h3>
<ul>
<li><strong>غیرفعال کردن PowerShell و WMI:</strong> اگر نیاز ندارید، این سرویس‌ها را غیرفعال کنید.</li>
<li><strong>استفاده از EDR (Endpoint Detection and Response):</strong> EDRها برخلاف آنتی‌ویروس‌های سنتی، رفتار فرآیندها را در حافظه مانیتور می‌کنند و می‌توانند بدافزارهای بدون فایل را شناسایی کنند.</li>
<li><strong>به‌روزرسانی مرورگر و افزونه‌ها:</strong> بیشتر حملات Exploit Kit از افزونه‌های قدیمی (مثل Flash Player، Java، Adobe Reader) استفاده می‌کنند.</li>
</ul>

<div class="summary-box">
<h3>🧠 جمع‌بندی جلسه ۷-۲</h3>
<p><strong>۱.</strong> باج‌افزارها (Ransomware) داده‌ها را رمزنگاری می‌کنند و برای بازگشایی درخواست پول می‌کنند. نمونه‌های معروف: Mallox (سرورهای MS-SQL با پسوند .mallox) و STOP/DJUVU (پسوند .djvu).</p>
<p><strong>۲.</strong> کرم‌ها (Worms) برخلاف ویروس‌ها خودکار تکثیر می‌شوند و به فایل میزبان نیاز ندارند. می‌توانند در عرض چند ساعت کل شبکه را آلوده کنند.</p>
<p><strong>۳.</strong> بدافزارهای بدون فایل (Fileless Malware) مستقیماً در حافظه اجرا می‌شوند و هیچ فایلی روی هارد ندارند. Poweliks یک نمونه کلاسیک است که در رجیستری پنهان می‌شود.</p>
<p><strong>۴.</strong> Exploit Kits بسته‌های نرم‌افزاری هستند که آسیب‌پذیری‌های سیستم قربانی را شناسایی و از آن‌ها برای نصب بدافزار استفاده می‌کنند. به‌روزرسانی مرورگر و افزونه‌ها بهترین دفاع در برابر آن‌هاست.</p>
<p><strong>۵.</strong> بدافزارهای AI نسل جدیدی هستند که می‌توانند یاد بگیرند و رفتار خود را برای فرار از شناسایی تطبیق دهند. این یک چالش جدی برای مدافعان است.</p>
<p><strong>۶.</strong> دفاع در برابر این تهدیدات نیازمند استراتژی چندلایه است: پشتیبان‌گیری منظم، به‌روزرسانی مداوم، Segment بندی شبکه، غیرفعال کردن سرویس‌های غیرضروری و استفاده از EDR به جای آنتی‌ویروس سنتی.</p>
</div>

<p>تا اینجا بدافزارها را از دید مهاجم بررسی کردیم: چطور ساخته می‌شوند، چطور پخش می‌شوند و چطور به سیستم نفوذ می‌کنند. اما یک متخصص امنیت سایبری (یا یک تحلیل‌گر بدافزار) باید بتواند از سمت مدافع هم نگاه کند. وقتی یک فایل مشکوک به دستتان می‌رسد، چطور می‌فهمید که آیا واقعاً مخرب است؟ در این جلسه ابتدا با مفهوم <strong>تحلیل بدافزار (Malware Analysis)</strong> و دو رویکرد آن آشنا می‌شویم، سپس ابزارهای تحلیل ایستا و پویا را می‌بینیم، بعد یاد می‌گیریم چطور یک محیط آزمایشگاهی امن (Lab) بسازیم و در پایان راه‌های مقابله و ابزارهای دفاعی را بررسی می‌کنیم.</p>
