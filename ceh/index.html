<h2>01. تحلیل بدافزار (Malware Analysis) چیست؟</h2>
<p>قبل از ورود به ابزارها، بیایید ببینیم تحلیل بدافزار اصلاً چه هدفی دارد. تجزیه و تحلیل بدافزار، فرآیند <strong>مهندسی معکوس (Reverse Engineering)</strong> بخش خاصی از بدافزار، جهت شناسایی عملکرد آن است. هدف این است که بفهمیم بدافزار دقیقاً چه کاری انجام می‌دهد (آیا فایل‌ها را رمزنگاری می‌کند؟ آیا اطلاعات را می‌دزدد؟) و چه اثراتی روی سیستم می‌گذارد.</p>

<p>تحلیل بدافزار به دو بخش اصلی تقسیم می‌شود که مکمل یکدیگرند:</p>
<ol>
<li><strong>Static Malware Analysis (تحلیل ایستا):</strong> در این روش، بدافزار را <strong>بدون اجرا کردن</strong> بررسی می‌کنیم. مثل این است که یک ماشین را بدون روشن کردن موتور، از بیرون و داخل کاپوت باز کنیم و قطعاتش را بشناسیم.</li>
<li><strong>Dynamic Malware Analysis (تحلیل پویا):</strong> در این روش، بدافزار را در یک محیط ایزوله <strong>اجرا می‌کنیم</strong> و رفتار آن را زیر نظر می‌گیریم. مثل این است که ماشین را روشن کنیم و ببینیم چطور کار می‌کند، دود می‌کند یا نه، و چه صدایی می‌دهد.</li>
</ol>

<img src="images/CEHv13_07/slide_39.webp" alt="Malware Analysis Types" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۹: دو نوع تحلیل بدافزار (Static و Dynamic)</div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>چرا به هر دو روش نیاز داریم؟</strong>تحلیل ایستا سریع و امن است، اما اگر بدافزار <strong>مبهم‌سازی (Obfuscation)</strong> شده باشد (مثل Crypterها که در جلسه قبل دیدیم)، کد ظاهری چیز زیادی لو نمی‌دهد. در این حالت، باید بدافزار را اجرا کنیم تا ببینیم چه رفتاری از خود نشان می‌دهد. به همین دلیل، اکثر تحلیل‌گران حرفه‌ای ابتدا از Static شروع می‌کنند و سپس به Dynamic می‌روند.</div></div>

<p>حالا که با این دو رویکرد آشنا شدیم، بیایید اول از رویکرد ایستا شروع کنیم؛ چون امن‌تر است و اولین قدم هر تحلیل حرفه‌ای است.</p>

<h2>02. تحلیل ایستا (Static Malware Analysis) - مثل کالبدشکافی</h2>
<p>در این مرحله، ما فایل بدافزار را باز نمی‌کنیم (اجرا نمی‌کنیم)، بلکه مشخصات و ساختار آن را بررسی می‌کنیم. مراحل و ابزارهای اصلی عبارتند از:</p>

<img src="images/CEHv13_07/slide_40.webp" alt="Static Malware Analysis" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۰: مراحل تحلیل ایستا و ابزارهای آن</div>

<ul>
<li><strong>محاسبه هش فایل (Computing Hash Value):</strong> اولین قدم این است که یک اثر انگشت دیجیتال (مثل MD5 یا SHA-256) از فایل بگیریم. ابزار: <strong>Hash My File</strong>. این کار به ما اجازه می‌دهد بفهمیم آیا این فایل قبلاً دیده شده است یا نه.</li>
<li><strong>اسکن آنلاین (Online Scanning):</strong> هش یا فایل را در سایت <strong>VirusTotal</strong> آپلود می‌کنیم تا ببینیم آیا آنتی‌ویروس‌های دیگر آن را مخرب می‌شناسند یا نه.</li>
<li><strong>تحلیل رشته‌ها (Analyze Embedded String):</strong> فایل‌های اجرایی حاوی متن‌هایی (Strings) هستند که می‌توانند سرنخ‌های مهمی باشند (مثل آدرس‌های IP، URLها، پیام‌های خطا). ابزار: <strong>BinText</strong>.</li>
<li><strong>تشخیص مبهم‌سازی (Detect Obfuscation):</strong> بررسی اینکه آیا فایل توسط Packerها یا Crypterها فشرده/رمزنگاری شده است یا نه. ابزار: <strong>PEid</strong>.</li>
<li><strong>تحلیل متادیتا (Analyze Metadata):</strong> بررسی هدر فایل (PE Header) برای فهمیدن نوع فایل، زمان کامپایل و اطلاعات دیگر. ابزار: <strong>PE Explorer</strong>.</li>
<li><strong>یافتن توابع کتابخانه‌ای (Find all Lib Functions):</strong> بررسی اینکه فایل به چه کتابخانه‌های DLL وابسته است. ابزار: <strong>Dependency Walker</strong>.</li>
<li><strong>دیس‌اسمبل کد باینری (Disassemble Binary code):</strong> تبدیل کد ماشین به اسمبلی برای درک منطق برنامه. ابزار: <strong>OllyDbg</strong>.</li>
</ul>

<div class="box note"><i class="fas fa-stethoscope"></i><div><strong>مثال از دنیای واقعی:</strong>فرض کنید یک فایل <code>update.exe</code> دریافت می‌کنید. اول یک هش MD5 از آن می‌گیرید (مثلاً <code>d41d8cd98f00b204e9800998ecf8427e</code>). سپس این هش را در VirusTotal جستجو می‌کنید. اگر نتیجه ۰/۷۰ باشد (یعنی هیچ آنتی‌ویروسی آن را نمی‌شناسد)، ممکن است فایل کاملاً جدید باشد. حالا نوبت به تحلیل دستی می‌رسد: با BinText متن‌های داخل آن را بررسی می‌کنید. اگر آدرس‌های IP عجیب یا عبارت <code>cmd.exe /c</code> دیدید، باید شک کنید.</div></div>

<p>تحلیل ایستا همیشه کافی نیست. اگر فایل مبهم‌سازی شده باشد، باید آن را در یک محیط ایزوله اجرا کنیم و ببینیم چه رفتاری دارد.</p>

<h2>03. تحلیل پویا (Dynamic Malware Analysis) - مثل رفتارشناسی</h2>
<p>در این روش، فایل بدافزار را در یک محیط ایزوله اجرا می‌کنیم و تمام تغییراتی که در سیستم ایجاد می‌کند را زیر نظر می‌گیریم. این کار به ما می‌گوید بدافزار دقیقاً چه کاری انجام می‌دهد.</p>

<img src="images/CEHv13_07/slide_41.webp" alt="Dynamic Malware Analysis" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۱: هشت بخش اصلی مانیتورینگ در تحلیل پویا</div>

<p>هشت بخش اصلی که باید مانیتور شوند:</p>
<ol>
<li><strong>Port Monitoring (پایش پورت‌ها):</strong> آیا بدافزار پورتی را باز کرده است؟ (ابزار: CurrPorts)</li>
<li><strong>Process Monitoring (پایش پروسس‌ها):</strong> چه فرآیندهای جدیدی اجرا شده‌اند؟ (ابزار: Process Monitor)</li>
<li><strong>Registry Monitoring (پایش رجیستری):</strong> چه تغییراتی در رجیستری ایجاد شده است؟ (ابزار: Regshot)</li>
<li><strong>Windows Services Monitoring (پایش سرویس‌ها):</strong> آیا سرویس جدیدی نصب شده است؟ (ابزار: Process Hacker)</li>
<li><strong>Startup Programs Monitoring (پایش برنامه‌های استارتاپ):</strong> آیا بدافزار در لیست برنامه‌های هنگام بوت اضافه شده است؟ (ابزار: Autoruns)</li>
<li><strong>Event Logs Monitoring (پایش لاگ‌های رویداد):</strong> چه رویدادهایی در Event Viewer ثبت شده است؟ (ابزار: Splunk)</li>
<li><strong>Device Drivers Monitoring (پایش درایورها):</strong> آیا درایور جدیدی نصب شده است؟ (ابزار: DriverView)</li>
<li><strong>Files and Folders Monitoring (پایش فایل‌ها و پوشه‌ها):</strong> چه فایل‌هایی ایجاد، حذف یا تغییر یافته‌اند؟ (ابزار: PA File Sight)</li>
</ol>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>هشدار بسیار مهم:</strong>تحلیل پویا <strong>باید</strong> در یک محیط ایزوله انجام شود. هرگز بدافزار را روی سیستم شخصی یا شبکه سازمانی خود اجرا نکنید! اگر این کار را بکنید، ممکن است کل شبکه شما آلوده شود.</div></div>

<p>حالا که فهمیدیم تحلیل پویا چقدر خطرناک است، باید ببینیم چطور یک محیط امن برای این کار بسازیم.</p>

<h2>04. محیط آزمایشگاهی امن: Sheep Dip Computer</h2>
<p>برای تحلیل امن بدافزار، دو مفهوم اصلی وجود دارد: یکی راه‌حل فیزیکی و سنتی، دیگری راه‌حل مجازی و مدرن.</p>

<h3>۱-۴. Sheep Dip Computer</h3>
<p>شاید بپرسید چرا به آن Sheep Dip می‌گویند؟ در دنیای دامداری، کشاورزان گوسفندان را در یک حوضچه (Dip) پر از مواد ضدعفونی‌کننده فرو می‌کنند تا انگل‌ها و باکتری‌های روی پوستشان از بین برود، قبل از اینکه به گله اصلی بپیوندند.</p>

<p>در دنیای امنیت، <strong>Sheep Dip</strong> به یک کامپیوتر ایزوله و مجزا گفته می‌شود که برای آنالیز فایل‌های مشکوک، پیام‌های ورودی و از این دست موارد استفاده می‌شود. این کامپیوتر به هیچ شبکه‌ای متصل نیست و به عنوان یک «قرنطینه» برای فایل‌های مشکوک عمل می‌کند.</p>

<img src="images/CEHv13_07/slide_42.webp" alt="Sheep Dip Computer" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۲: مفهوم Sheep Dip (اجرای فایل مشکوک در محیط ایزوله با مانیتورهای مختلف)</div>

<p>روی این کامپیوتر، برنامه‌های مانیتورینگ فایل، پورت، شبکه و همچنین آنتی‌ویروس نصب می‌شود و برای کنترل دقیق شبکه به آن متصل می‌گردد. هر فایل مشکوکی که وارد سازمان می‌شود، ابتدا در این کامپیوتر اجرا و تحلیل می‌شود. اگر بی‌خطر بود، به شبکه اصلی منتقل می‌شود.</p>

<h3>۲-۴. ایجاد یک تحلیل‌گر ویروس (Virtual Machine)</h3>
<p>در دنیای امروز، استفاده از کامپیوتر فیزیکی برای Sheep Dip هزینه‌بر است. به جای آن، از <strong>ماشین‌های مجازی (Virtual Machines)</strong> استفاده می‌شود. برای ایجاد یک آزمایشگاه امن، مراحل زیر را دنبال کنید:</p>

<ol>
<li>ابتدا یک نرم‌افزار مجازی‌سازی مانند <strong>VMware</strong> یا <strong>VirtualBox</strong> را روی سیستم خود نصب کنید.</li>
<li>سپس یک سیستم‌عامل (مثلاً ویندوز ۱۰) روی آن نصب کنید.</li>
<li><strong>مهم‌ترین مرحله:</strong> تنظیمات کارت شبکه سیستم مجازی را روی حالت <strong>Host-Only</strong> قرار دهید. این کار باعث می‌شود که ماشین مجازی به اینترنت و شبکه اصلی متصل نشود و فقط با سیستم میزبان (Host) ارتباط داشته باشد. این کار از پخش شدن بدافزار جلوگیری می‌کند.</li>
<li>اشتراک‌گذاری فایل‌ها (Shared Folders) را غیرفعال کنید تا بدافزار نتواند به فایل‌های سیستم اصلی شما دسترسی داشته باشد.</li>
<li>قبل از اجرای بدافزار، یک <strong>Snapshot (عکس فوری)</strong> از سیستم مجازی بگیرید. اگر بدافزار به سیستم آسیب زد، می‌توانید با یک کلیک همه‌چیز را به حالت قبل برگردانید.</li>
</ol>

<img src="images/CEHv13_07/slide_43.webp" alt="VM Setup" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۳: مراحل ایجاد یک تحلیل‌گر ویروس در محیط مجازی (Host-Only + غیرفعال کردن File Sharing)</div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>مفهوم Snapshot چیست؟</strong>تصور کنید در یک بازی کامپیوتری هستید و می‌خواهید یک مرحله سخت را امتحان کنید. قبل از شروع، بازی را Save می‌کنید (Save Point). اگر شکست خوردید، دوباره از همان نقطه شروع می‌کنید. Snapshot در ماشین مجازی دقیقاً همین کار را می‌کند: یک نسخه پشتیبان از کل سیستم‌عامل (با تمام فایل‌ها و تنظیمات) در آن لحظه می‌گیرد. بعد از اینکه بدافزار را اجرا کردید و سیستم آلوده شد، کافی است Snapshot را بازیابی کنید تا سیستم به حالت تمیز برگردد.</div></div>

<p>حالا که هم تحلیل و هم محیط امن را بلد شدیم، بیایید ببینیم پس از فهمیدن رفتار بدافزار، چطور باید با آن مقابله کنیم.</p>

<h2>05. مقابله با بدافزارها (Countermeasures)</h2>
<p>دفاع در برابر بدافزارها نیازمند یک استراتژی چندلایه است؛ هیچ لایه‌ای به‌تنهایی کافی نیست:</p>

<img src="images/CEHv13_07/slide_45.webp" alt="Countermeasures" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۵: راه‌های مقابله با بدافزارها</div>

<ul>
<li><strong>استفاده از آنتی‌ویروس و بروزرسانی آن:</strong> پایه‌ای‌ترین لایه دفاعی.</li>
<li><strong>اجتناب از دانلود و اجرای برنامه‌های مختلف از منابع نامطمئن:</strong> (مثل کرک‌ها و نرم‌افزارهای رایگان).</li>
<li><strong>اجتناب از باز کردن پیوست‌های ایمیل‌های ناشناس.</strong></li>
<li><strong>غیرفعال کردن ماکروها:</strong> در فایل‌های آفیس (Word، Excel) ماکروها می‌توانند کد مخرب اجرا کنند.</li>
<li><strong>نصب پچ‌ها و بروزرسانی امنیتی سیستم‌عامل و برنامه‌ها:</strong> اکثر بدافزارها از آسیب‌پذیری‌های قدیمی استفاده می‌کنند.</li>
<li><strong>اسکن سی‌دی‌ها، فلش‌ها و حافظه‌های فلش با آنتی‌ویروس قبل از استفاده.</strong></li>
<li><strong>اجتناب از پذیرفتن برنامه‌های انتقال‌یافته از طریق پیام‌های آنی (مسنجرها).</strong></li>
<li><strong>بستن تمام پورت‌های غیرضروری روی سیستم میزبان و فایروال.</strong></li>
</ul>

<p>در کنار این اقدامات، ابزارهای تخصصی ضد بدافزار هم وجود دارند که هر کدام روی بخشی از تهدیدات تمرکز می‌کنند.</p>

<h2>06. نرم‌افزارهای ضد بدافزار (Anti-Malware Software)</h2>
<p>ابزارهای مختلفی برای مقابله با بدافزارها وجود دارند که از نظر قدرت و امکانات متفاوت هستند:</p>

<img src="images/CEHv13_07/slide_48.webp" alt="Anti-Malware Software" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۸: نمونه‌ای از نرم‌افزارهای ضد بدافزار (Kaspersky Internet Security)</div>

<ul>
<li><strong>Kaspersky Internet Security:</strong> یکی از قوی‌ترین و محبوب‌ترین مجموعه‌های امنیتی (شامل آنتی‌ویروس، فایروال و کنترل والدین).</li>
<li><strong>Norton Internet Security:</strong> یکی دیگر از گزینه‌های تجاری معتبر.</li>
<li><strong>Malwarebytes:</strong> تخصصی در شناسایی و پاک‌سازی بدافزارهای جدید (مکمل خوبی برای آنتی‌ویروس‌های سنتی است).</li>
<li><strong>SuperAntiSpyware:</strong> تمرکز بر روی Spyware و Adware.</li>
<li><strong>Spybot – Search & Destroy:</strong> یک ابزار متن‌باز و رایگان برای پاک‌سازی جاسوس‌افزارها.</li>
</ul>

<div class="box warning"><i class="fas fa-shield-alt"></i><div><strong>نکته مهم:</strong>امروزه آنتی‌ویروس‌های سنتی (که فقط بر اساس امضا کار می‌کنند) در برابر بدافزارهای بدون فایل و AI-Based ناکارآمد هستند. به همین دلیل، سازمان‌های بزرگ به سمت <strong>EDR (Endpoint Detection and Response)</strong> حرکت کرده‌اند. EDRها رفتار فرآیندها را در حافظه و شبکه مانیتور می‌کنند و می‌توانند تهدیدات ناشناخته را شناسایی کنند.</div></div>

<h2>01. مفهوم شنود (Sniffing Concept)</h2>
<p>بیایید از تعریف شروع کنیم. <strong>Sniffing</strong> به فرآیندی گفته می‌شود که در آن کلیه بسته‌های داده‌ای در شبکه مانیتور و ضبط می‌شوند. این کار معمولاً با ابزارهای مخصوص انجام می‌شود. اگر بخواهیم واقع‌بینانه بگوییم، Sniff یک نوع استراق سمع در سطح کامپیوتری است.</p>

<img src="images/CEHv13_08/slide_5.webp" alt="Sniffing Concept" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۵: اطلاعات حساسی که از طریق Sniffing به دست می‌آیند</div>

<p><strong>چه اطلاعاتی را می‌توان از طریق Sniffing به دست آورد؟</strong></p>
<ul>
<li><strong>رمز عبور پروتکل‌های قدیمی:</strong> مثل Telnet، FTP و SMTP که داده‌ها را به صورت متن ساده (Clear Text) ارسال می‌کنند.</li>
<li><strong>ترافیک DNS:</strong> فهمیدن اینکه کاربران به چه سایت‌هایی مراجعه می‌کنند.</li>
<li><strong>پیکربندی روترها:</strong> اطلاعات حساس شبکه.</li>
<li><strong>ترافیک ایمیل:</strong> محتوای ایمیل‌های ارسال شده.</li>
<li><strong>ترافیک وب:</strong> اطلاعات ارسال شده در فرم‌های وب (در صورت عدم استفاده از HTTPS).</li>
<li><strong>جلسات چت:</strong> مکالمات آنلاین.</li>
</ul>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>چرا Sniffing خطرناک است؟</strong>در شبکه‌های امروزی، ما فکر می‌کنیم چون از سوئیچ (Switch) استفاده می‌کنیم، ترافیک ما خصوصی است. اما یک مهاجم می‌تواند با تکنیک‌هایی که در ادامه یاد می‌گیریم، سوئیچ را فریب دهد و ترافیک شما را شنود کند. به همین دلیل است که استفاده از پروتکل‌های رمزنگاری‌شده (مثل HTTPS و SSH) در شبکه‌های عمومی یک ضرورت است، نه یک انتخاب.</div></div>

<p>حالا که فهمیدیم شنود چیست، بیایید ببینیم یک کارت شبکه باید در چه حالتی باشد تا بتواند همه بسته‌ها را ببیند.</p>

<h2>02. حالت بی‌قاعده (Promiscuous Mode)</h2>
<p>یک کارت شبکه (NIC) در حالت عادی، فقط بسته‌هایی را می‌پذیرد که آدرس MAC مقصدشان با آدرس MAC خودش مطابقت داشته باشد (یا بسته‌های Broadcast). اما یک Sniffer برای دیدن همه ترافیک، کارت شبکه را در حالت <strong>Promiscuous Mode (حالت بی‌قاعده)</strong> قرار می‌دهد.</p>

<img src="images/CEHv13_08/slide_6.webp" alt="Promiscuous Mode" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۶: حالت Promiscuous Mode در کارت شبکه (دریافت تمام بسته‌ها)</div>

<p>در این حالت، کارت شبکه تمام بسته‌های عبوری از کابل (یا فضای بی‌سیم) را دریافت کرده و به لایه‌های بالاتر می‌فرستد. به همین دلیل است که یک هکر با قرار دادن کارت شبکه در این حالت و استفاده از نرم‌افزارهایی مثل Wireshark، می‌تواند تمام ترافیک شبکه را ببیند.</p>

<p>اما دیدن بسته‌ها به این سادگی نیست. بسته به اینکه در شبکه از هاب استفاده می‌شود یا سوئیچ، روش شنود متفاوت است. بیایید اول سراغ شبکه‌های هابی برویم.</p>

<h2>03. شنود غیرفعال (Passive Sniffing)</h2>
<p>در این روش، مهاجم فقط ترافیک را تماشا می‌کند و هیچ بسته اضافی به شبکه ارسال نمی‌کند. این روش بیشتر در شبکه‌هایی کار می‌کند که از <strong>هاب (Hub)</strong> استفاده می‌کنند.</p>

<img src="images/CEHv13_08/slide_8.webp" alt="Passive Sniffing" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۸: شنود غیرفعال از طریق هاب (ترافیک برای همه ارسال می‌شود)</div>

<p><strong>چرا هاب باعث شنود می‌شود؟</strong> هاب یک دستگاه «احمق» است. وقتی یک بسته به آن می‌رسد، آن را برای <strong>تمام</strong> پورت‌های خود کپی می‌کند (Broadcast). در نتیجه، هر کامپیوتری که به هاب متصل است، می‌تواند ترافیک تمام کامپیوترهای دیگر را ببیند (اگر کارت شبکه‌اش در حالت Promiscuous باشد).</p>

<div class="box note"><i class="fas fa-history"></i><div><strong>چرا هاب‌ها منقرض شدند؟</strong>امروزه هاب‌ها جای خود را به سوئیچ‌ها داده‌اند. سوئیچ برخلاف هاب، بسته را فقط به پورتی که کامپیوتر مقصد به آن متصل است، می‌فرستد. بنابراین Passive Sniffing در شبکه‌های مدرن (که سوئیچ دارند) تقریباً بی‌فایده است. به همین دلیل مهاجمان به سراغ <strong>Active Sniffing</strong> می‌روند.</div></div>

<h2>04. شنود فعال (Active Sniffing)</h2>
<p>در شبکه‌های سوییچ‌شده، ترافیک به صورت هوشمندانه به مقصد هدایت می‌شود. بنابراین مهاجم برای شنود، باید کاری کند که سوئیچ، ترافیک را به سمت او بفرستد (یا مجبور به Broadcast کند). به این روش، <strong>Active Sniffing</strong> می‌گویند. تکنیک‌های اصلی Active Sniffing عبارتند از:</p>
<ul>
<li><strong>MAC Flooding:</strong> پر کردن جدول CAM سوئیچ.</li>
<li><strong>DHCP Attack / DHCP Starvation:</strong> حمله به سرور DHCP.</li>
<li><strong>ARP Poisoning:</strong> مسموم کردن جدول ARP.</li>
<li><strong>MAC Spoofing:</strong> جعل آدرس MAC.</li>
<li><strong>IRDP Spoofing:</strong> جعل پیام‌های مسیریابی.</li>
</ul>

<p>پیش از ورود به این حملات، بیایید ببینیم در محیط‌های واقعی (مثلاً برای راه‌اندازی یک IDS) چطور می‌توان بدون دستکاری شبکه، ترافیک را دید.</p>

<h2>05. تجزیه‌گر پروتکل سخت‌افزاری (Hardware Protocol Analyzer) و SPAN Port</h2>
<p>گاهی اوقات برای تحلیل ترافیک (مخصوصاً در محیط‌های عملیاتی)، نمی‌توان از نرم‌افزار استفاده کرد. در این موارد از <strong>Hardware Protocol Analyzer</strong> استفاده می‌شود. این دستگاه‌ها برای تحلیل ترافیک شبکه طراحی شده‌اند و می‌توانند سیگنال‌های شبکه را بدون ایجاد تغییر در آن‌ها دریافت و تحلیل کنند.</p>

<img src="images/CEHv13_08/slide_11.webp" alt="Hardware Protocol Analyzer" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۱: نمونه‌ای از تجهیزات Hardware Protocol Analyzer</div>

<p>اما در شبکه‌های سوییچ‌شده، برای اینکه یک ابزار تحلیلگر (یا یک IDS) بتواند ترافیک را ببیند، از <strong>SPAN Port (Switched Port Analyzer)</strong> استفاده می‌شود. در این تنظیمات، سوئیچ کپی تمام ترافیک پورت‌های دیگر را به یک پورت خاص (که ابزار تحلیلگر به آن متصل است) ارسال می‌کند.</p>

<img src="images/CEHv13_08/slide_12.webp" alt="SPAN Port" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۲: نحوه کار SPAN Port در سوئیچ (کپی ترافیک به پورت تحلیلگر)</div>

<p>حالا که با روش‌های مشروع دیدن ترافیک آشنا شدیم، بیایید ببینیم مهاجم چطور سوئیچ را مجبور به رفتار مانند هاب می‌کند. اینجاست که حمله MAC Flooding وارد می‌شود.</p>

<h2>06. جدول CAM و حمله MAC Flooding</h2>
<p>برای فهمیدن MAC Flooding، اول باید بفهمیم سوئیچ چطور کار می‌کند. هر سوئیچ یک جدول به نام <strong>CAM (Content Addressable Memory)</strong> دارد. این جدول نگاشت بین آدرس MAC و شماره پورت فیزیکی سوئیچ را نگه می‌دارد.</p>

<p><strong>حمله MAC Flooding چطور کار می‌کند؟</strong></p>
<ol>
<li>مهاجم ابزاری مثل <strong>Macof</strong> را اجرا می‌کند.</li>
<li>این ابزار شروع به ارسال هزاران بسته با آدرس‌های MAC جعلی و تصادفی می‌کند.</li>
<li>سوئیچ هر MAC جدید را در جدول CAM ذخیره می‌کند. اما جدول CAM یک ظرفیت محدود دارد (مثلاً ۸۰۰۰ رکورد).</li>
<li>وقتی جدول پر شد، سوئیچ دیگر نمی‌تواند MACهای جدید را یاد بگیرد. در این حالت، سوئیچ به یک رفتار پیش‌فرض روی می‌آورد: <strong>تمام بسته‌هایی که مقصدشان در جدول نیست را به همه پورت‌ها ارسال می‌کند (مثل هاب!)</strong>.</li>
</ol>

<img src="images/CEHv13_08/slide_16.webp" alt="MAC Flooding" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۶: ابزار Macof برای پر کردن جدول CAM</div>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>نتیجه MAC Flooding:</strong> سوئیچ به یک هاب تبدیل می‌شود و مهاجم می‌تواند تمام ترافیک شبکه را با استفاده از Sniffer مشاهده کند. این یک DoS (حمله انکار سرویس) نیز هست، چون کارایی شبکه به شدت کاهش می‌یابد.</div></div>

<h3>مقابله با MAC Flooding</h3>
<p>برای جلوگیری از این حمله، مدیران شبکه از ویژگی <strong>Port Security</strong> در سوئیچ‌های سیسکو استفاده می‌کنند. با این ویژگی، می‌توان تعیین کرد که هر پورت فقط اجازه دیدن تعداد محدودی MAC (مثلاً ۱ یا ۲) را دارد. اگر تعداد MACهای یک پورت از حد تعیین‌شده بیشتر شود، سوئیچ آن پورت را غیرفعال یا مسدود می‌کند.</p>

<img src="images/CEHv13_08/slide_17.webp" alt="Port Security" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۷: تنظیم Port Security برای مقابله با MAC Flooding</div>

<p>سوئیچ را با موفقیت از کار انداختیم. حالا بیایید ببینیم هدف بعدی چیست: سرور DHCP. اگر بتوانیم استخر IP آن را تخلیه کنیم، کل شبکه از کار می‌افتد.</p>

<h2>07. حملات DHCP (DHCP Starvation)</h2>
<p>پروتکل <strong>DHCP</strong> برای تخصیص خودکار IP به دستگاه‌ها استفاده می‌شود. سرور DHCP یک استخر (Pool) از آدرس‌های IP دارد و به هر دستگاه یک IP می‌دهد.</p>

<p><strong>حمله DHCP Starvation چطور کار می‌کند؟</strong></p>
<p>مهاجم با استفاده از ابزارهایی مثل <strong>Yersinia</strong> یا <strong>DHCP Starve</strong>، شروع به ارسال هزاران درخواست DHCP با آدرس‌های MAC جعلی می‌کند. سرور DHCP فکر می‌کند هزاران دستگاه جدید وارد شبکه شده‌اند و شروع به تخصیص IP می‌کند. وقتی استخر IP خالی شد، هیچ دستگاه قانونی نمی‌تواند IP بگیرد و شبکه از کار می‌افتد (یک حمله DoS).</p>

<img src="images/CEHv13_08/slide_21.webp" alt="DHCP Starvation" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۱: حمله DHCP Starvation (تخلیه استخر IPهای سرور DHCP)</div>

<h3>مقابله با DHCP Starvation</h3>
<ul>
<li><strong>Port Security:</strong> همانطور که برای MAC Flooding گفتیم، با محدود کردن تعداد MAC در هر پورت، می‌توان از ارسال هزاران درخواست جعلی جلوگیری کرد.</li>
<li><strong>DHCP Snooping:</strong> یک ویژگی سوئیچ که اجازه می‌دهد فقط پورت‌های مشخصی (پورت‌هایی که سرور DHCP به آن‌ها متصل است) به عنوان پورت‌های قابل اعتماد (Trusted) شناخته شوند و بقیه پورت‌ها (Untrusted) نتوانند پیام‌های DHCP ارسال کنند.</li>
</ul>

<img src="images/CEHv13_08/slide_24.webp" alt="DHCP Snooping" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۴: فعال‌سازی DHCP Snooping برای مقابله با حملات DHCP</div>

<p>سرویس DHCP را از کار انداختیم. اما خطرناک‌ترین حمله در شبکه‌های داخلی، حمله‌ای است که ترافیک را مستقیم به سمت مهاجم می‌کشد. اینجاست که ARP Poisoning وارد می‌شود.</p>

<h2>08. مسمومیت ARP (ARP Poisoning)</h2>
<p>این یکی از مهم‌ترین و پرکاربردترین حملات در شبکه‌های داخلی است. پروتکل <strong>ARP (Address Resolution Protocol)</strong> وظیفه تبدیل آدرس IP به آدرس MAC را بر عهده دارد.</p>

<p><strong>چرا ARP آسیب‌پذیر است؟</strong> چون ARP یک پروتکل <strong>بدون حالت (Stateless)</strong> و <strong>بدون احراز هویت</strong> است. یعنی وقتی یک دستگاه می‌پرسد «چه کسی IP 192.168.1.1 را دارد؟»، هر دستگاهی می‌تواند پاسخ دهد «من!» حتی اگر واقعاً آن دستگاه نباشد.</p>

<p><strong>حمله ARP Poisoning چطور کار می‌کند؟</strong></p>
<ol>
<li>مهاجم بسته‌های ARP جعلی به سمت قربانی (مثلاً کامپیوتر A) می‌فرستد و می‌گوید: «من IP روتر (Gateway) هستم، MAC من این است».</li>
<li>همچنین به سمت روتر می‌فرستد: «من کامپیوتر A هستم، MAC من این است».</li>
<li>حالا جدول ARP هر دو طرف مسموم شده است. کامپیوتر A فکر می‌کند برای دسترسی به اینترنت باید بسته‌ها را به MAC مهاجم بفرستد، و روتر هم فکر می‌کند پاسخ‌ها را باید به مهاجم بفرستد.</li>
<li>نتیجه: مهاجم بین قربانی و روتر قرار می‌گیرد و تمام ترافیک را شنود می‌کند. این حمله <strong>Man-in-the-Middle (MITM)</strong> نام دارد.</li>
</ol>

<img src="images/CEHv13_08/slide_29.webp" alt="ARP Poisoning" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۹: حمله ARP Poisoning (قرار گرفتن مهاجم بین قربانی و روتر)</div>

<p><strong>ابزارهای حمله ARP Poisoning:</strong> Ettercap، Ufasoft Snif، Win ARP Attacker، Cain & Abel.</p>

<h3>مقابله با ARP Poisoning</h3>
<p>برای جلوگیری از این حمله، از ویژگی <strong>Dynamic ARP Inspection (DAI)</strong> در سوئیچ‌های سیسکو استفاده می‌شود. این ویژگی با استفاده از جدول <strong>DHCP Snooping Binding</strong> (که در بخش قبل یاد گرفتیم) صحت بسته‌های ARP را بررسی می‌کند. اگر یک بسته ARP با اطلاعات جدول DHCP Snooping مطابقت نداشته باشد، دور ریخته می‌شود.</p>

<img src="images/CEHv13_08/slide_31.webp" alt="DAI Protection" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۱: نحوه کار Dynamic ARP Inspection (DAI) با استفاده از DHCP Snooping</div>

<p>ARP Poisoning از یک نقطه ضعف در لایه دوم سوءاستفاده می‌کرد. اما گاهی مهاجم به جای مسموم کردن جدول، هویت خود آدرس MAC را جعل می‌کند تا از فیلترها عبور کند.</p>

<h2>09. جعل و تکرار آدرس MAC (MAC Spoofing/Duplication)</h2>
<p>در حمله <strong>MAC Spoofing</strong>، مهاجم آدرس MAC خود را به یک آدرس MAC احراز هویت شده تغییر می‌دهد تا از مکانیزم MAC Filtering در یک اکسس پوینت (AP) عبور کند. یا اینکه از آدرس MAC یک کاربر مجاز استفاده می‌کند تا ترافیک او را دریافت کند.</p>

<p>در <strong>MAC Duplication</strong>، مهاجم با شنود شبکه، آدرس MAC یک کاربر فعال را پیدا کرده و از آن استفاده می‌کند. در این حالت، سوئیچ گیج می‌شود و ممکن است ترافیک را برای هر دو دستگاه ارسال کند.</p>

<img src="images/CEHv13_08/slide_34.webp" alt="MAC Spoofing" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۴: حمله MAC Spoofing (استفاده از MAC جعلی برای عبور از فیلتر)</div>

<p><strong>مقابله:</strong> فعال‌سازی <strong>IP Source Guard</strong>، <strong>DHCP Snooping</strong> و <strong>Dynamic ARP Inspection</strong> در سوئیچ.</p>

<p>و در پایان این جلسه، بیایید ببینیم آخرین حمله در این لایه چطور از یک پروتکل مسیریابی برای هدایت ترافیک سوءاستفاده می‌کند.</p>

<h2>10. جعل IRDP (IRDP Spoofing)</h2>
<p>پروتکل <strong>IRDP (ICMP Router Discovery Protocol)</strong> به میزبان‌های IP اجازه می‌دهد تا آدرس روتر (Gateway) خود را شناسایی کنند. در حمله <strong>IRDP Spoofing</strong>، مهاجم پیام‌های Advertisement جعلی IRDP ارسال می‌کند و خود را به عنوان یک روتر معرفی می‌کند. سپس ترافیک قربانیان را به سمت خود هدایت کرده و شنود می‌کند (MITM) یا حملات DoS انجام می‌دهد.</p>

<h2>01. حمله VLAN Hopping</h2>
<p>در جلسه قبل دیدیم که شبکه‌های سوییچ‌شده امن‌تر از هاب‌ها هستند. اما مدیران شبکه برای اینکه یک شبکه بزرگ را مدیریت کنند، آن را به <strong>VLANهای</strong> کوچک‌تر (Virtual Local Area Network) تقسیم می‌کنند. مثلاً VLAN 10 برای منابع انسانی، VLAN 20 برای مالی و VLAN 30 برای سرورها. VLANها مثل دیوارهای مجازی عمل می‌کنند و ترافیک یک VLAN از VLAN دیگر جدا است.</p>

<p>اما همان‌طور که یک دزد می‌تواند از دیوار یک ساختمان بالا برود، یک مهاجم هم می‌تواند از دیوار VLAN عبور کند. به این حمله <strong>VLAN Hopping</strong> می‌گویند. هدف اصلی این حمله، دسترسی به ترافیک در یک VLAN دیگر (معمولاً VLAN مدیریت یا سرورها) است. دو روش اصلی برای این حمله وجود دارد که در ادامه هر کدام را جداگانه بررسی می‌کنیم.</p>

<h3>۱-۱. جعل سوئیچ (Switch Spoofing)</h3>
<p>در این روش، مهاجم یک سوئیچ جعلی (یا یک کامپیوتر که به عنوان سوئیچ عمل می‌کند) را به شبکه متصل می‌کند و با ارسال پیام‌های <strong>DTP (Dynamic Trunking Protocol)</strong>، خود را به عنوان یک سوئیچ معتبر جا می‌زند و درخواست ایجاد یک لینک <strong>Trunk</strong> می‌دهد.</p>

<p><strong>Trunk چیست؟</strong> یک لینک Trunk، یک مسیر ارتباطی است که می‌تواند ترافیک چندین VLAN مختلف را به طور همزمان حمل کند. اگر سوئیچ اصلی گول بخورد و پورت مهاجم را به حالت Trunk تبدیل کند، مهاجم می‌تواند به تمام VLANها دسترسی پیدا کند.</p>

<div class="image-caption">اسلاید ۳۸: Switch Spoofing (اتصال یک سوئیچ جعلی و ایجاد Trunk غیرمجاز)</div>

<h3>۲-۱. برچسب‌گذاری مضاعف (Double Tagging)</h3>
<p>این روش پیچیده‌تر است و به تکنیک <strong>802.1Q</strong> (استاندارد VLAN) مربوط می‌شود. در این روش، مهاجم یک بسته را با <strong>دو برچسب VLAN</strong> ارسال می‌کند: یک برچسب بیرونی (Outer Tag) و یک برچسب درونی (Inner Tag).</p>

<p><strong>چرا این کار جواب می‌دهد؟</strong> بیایید مسیر بسته را قدم به قدم دنبال کنیم:</p>
<ol>
<li>مهاجم بسته‌ای می‌فرستد که برچسب بیرونی آن VLAN 1 (VLAN پیش‌فرض) و برچسب درونی آن VLAN 20 (VLAN هدف) است.</li>
<li>اولین سوئیچ (که مهاجم به آن متصل است)، برچسب بیرونی را می‌بیند و فکر می‌کند بسته مربوط به VLAN 1 است. آن را برمی‌دارد (Strip) و بسته را به سوئیچ بعدی می‌فرستد.</li>
<li>سوئیچ دوم، برچسب درونی (VLAN 20) را می‌بیند و بسته را به مقصد در VLAN 20 تحویل می‌دهد.</li>
</ol>

<img src="images/CEHv13_08/slide_38.webp" alt="Double Tagging" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۸ (بخش دوم): Double Tagging (برچسب بیرونی و درونی برای عبور از سوئیچ اول)</div>

<div class="box note"><i class="fas fa-layer-group"></i><div><strong>چرا Double Tagging فقط یک‌طرفه است؟</strong>مهاجم می‌تواند بسته را به VLAN هدف بفرستد، اما نمی‌تواند پاسخ را دریافت کند. چون سوئیچ دوم پاسخ را با یک برچسب (VLAN 20) برمی‌گرداند، اما سوئیچ اول آن را مسدود می‌کند. به همین دلیل به این روش «حمله یک‌طرفه» یا «کور» (Blind) هم می‌گویند. با این حال، برای انجام حملات DoS یا تزریق داده کافی است.</div></div>

<h3>۳-۱. مقابله با VLAN Hopping</h3>
<p>برای جلوگیری از این حمله، مدیران شبکه باید چند تنظیم ساده اما حیاتی را روی سوئیچ‌ها اعمال کنند:</p>
<ul>
<li>پورت‌هایی که برای دسترسی کاربران (Access Port) استفاده می‌شوند را به صراحت تنظیم کنند: <code>switchport mode access</code> و <code>switchport nonegotiate</code> (غیرفعال کردن DTP).</li>
<li>پورت‌های Trunk را فقط روی پورت‌های مشخص و با <code>switchport mode trunk</code> تنظیم کنند.</li>
<li>VLAN بومی (Native VLAN) را از VLAN 1 (پیش‌فرض) به یک VLAN بلااستفاده (مثلاً 999) تغییر دهند: <code>switchport trunk native vlan 999</code>.</li>
</ul>

<img src="images/CEHv13_08/slide_39.webp" alt="VLAN Hopping Countermeasures" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۹: تنظیمات سوئیچ برای مقابله با VLAN Hopping</div>

<p>تا اینجا یاد گرفتیم چطور از دیوار VLAN عبور کنیم. حالا بیایید از لایه دوم شبکه بالاتر برویم و ببینیم چطور می‌توانیم با دستکاری یک سرویس لایه کاربردی (DNS)، کاربر را به جای مقصد واقعی، به سمت خودمان بکشانیم.</p>

<h2>02. مسمومیت DNS (DNS Poisoning)</h2>
<p>تصور کنید می‌خواهید به سایت بانک خود بروید. شما آدرس <code>www.mybank.com</code> را در مرورگر خود تایپ می‌کنید. اما کامپیوتر شما آدرس IP بانک را نمی‌داند. پس از سرور DNS (مثل 8.8.8.8) می‌پرسد: «آدرس IP سایت mybank.com چیست؟»</p>

<p>حالا اگر یک مهاجم بتواند به سرور DNS شما بگوید که «آدرس IP سایت mybank.com در واقع 192.168.1.100 (سرور من) است»، شما به جای بانک واقعی، به سایت جعلی مهاجم هدایت می‌شوید. این دقیقاً همان کاری است که <strong>DNS Poisoning</strong> انجام می‌دهد: <strong>مسموم کردن پاسخ‌های DNS برای هدایت ترافیک به سمت مقصد دلخواه مهاجم.</strong></p>

<img src="images/CEHv13_08/slide_41.webp" alt="DNS Poisoning Concept" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۱: مفهوم DNS Poisoning (تغییر پاسخ DNS برای هدایت به سایت جعلی)</div>

<h3>۱-۲. انواع DNS Poisoning</h3>
<p>حملات DNS Poisoning بسته به اینکه مهاجم کجا قرار دارد و چه چیزی را هدف گرفته، به چهار دسته تقسیم می‌شوند. هر چه از دسته اول به سمت دسته چهارم برویم، دامنه تأثیر حمله بیشتر و خطرناک‌تر می‌شود:</p>

<h4>۱-۱-۲. جعل DNS داخلی (Intranet DNS Spoofing)</h4>
<p>در این روش، مهاجم باید به یک شبکه محلی (LAN) متصل باشد و قادر به شنود بسته‌ها باشد. او با ترکیب <strong>ARP Poisoning</strong> (که در جلسه قبل یاد گرفتیم)، ترافیک DNS کاربر را به سمت خود هدایت می‌کند و سپس یک پاسخ DNS جعلی به کاربر می‌فرستد. این حمله فقط روی کاربرانی اثر دارد که در همان شبکه محلی هستند.</p>

<h4>۲-۱-۲. جعل DNS اینترنتی (Internet DNS Spoofing)</h4>
<p>در این روش، مهاجم با استفاده از یک تروجان، سیستم قربانی را آلوده کرده و آدرس IP سرور DNS کاربر را در تنظیمات ویندوز با IP سرور DNS خودش (که یک سرور جعلی است) جایگزین می‌کند. از این به بعد، تمام درخواست‌های DNS کاربر به سمت مهاجم می‌رود.</p>

<h4>۳-۱-۲. جعل DNS از طریق پروکسی (Proxy Server DNS Spoofing)</h4>
<p>مهاجم با ارسال یک تروجان، تنظیمات سرور پروکسی کاربر را در مرورگر (مثلاً Internet Explorer) با IP خودش عوض می‌کند. در نتیجه، تمام درخواست‌های وب کاربر از طریق سیستم مهاجم عبور می‌کند.</p>

<h4>۴-۱-۲. مسمومیت کش DNS (DNS Cache Poisoning)</h4>
<p>این خطرناک‌ترین نوع است. در این روش، مهاجم یک رکورد جعلی را داخل کش (Cache) سرور DNS (مثلاً سرور DNS شرکت یا ISP) قرار می‌دهد. از این به بعد، <strong>همه کاربرانی</strong> که از آن سرور DNS استفاده می‌کنند، به جای سایت واقعی، به سایت جعلی هدایت می‌شوند. توجه کنید که در این حالت، مهاجم حتی نیازی به آلوده کردن سیستم‌های کاربران ندارد؛ فقط یک سرور DNS را آلوده می‌کند و همه از آن تأثیر می‌گیرند.</p>

<img src="images/CEHv13_08/slide_44.webp" alt="DNS Cache Poisoning" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۴: DNS Cache Poisoning (مسموم کردن کش سرور DNS و آلوده کردن همه کاربران)</div>

<h2>03. ابزارهای DNS Poisoning</h2>
<p>برای انجام حملات DNS Poisoning، ابزارهای مختلفی وجود دارد. برخی از معروف‌ترین آن‌ها عبارتند از:</p>

<img src="images/CEHv13_08/slide_45.webp" alt="DNS Poisoning Tools" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۵: ابزارهای DNS Poisoning (Ettercap، DerpNSp00f، DNS-poison و ...)</div>

<ul>
<li><strong>Ettercap:</strong> یک ابزار جامع برای حملات MITM که قابلیت DNS Spoofing را نیز دارد.</li>
<li><strong>DerpNSp00f:</strong> ابزاری برای جعل پاسخ‌های DNS.</li>
<li><strong>DNS-poison:</strong> اسکریپتی برای مسموم کردن کش DNS.</li>
<li><strong>Evilgrade:</strong> ابزاری برای شبیه‌سازی آپدیت‌های جعلی (که از DNS Spoofing استفاده می‌کند).</li>
<li><strong>TORNADO:</strong> ابزاری برای حملات DNS.</li>
</ul>

<h2>04. مقابله با DNS Poisoning</h2>
<p>برای جلوگیری از این حمله، استراتژی‌های دفاعی متعددی وجود دارد. این استراتژی‌ها را می‌توان به دو دسته تقسیم کرد: یکی در سطح پروتکل DNS و دیگری در سطح زیرساخت شبکه.</p>

<h3>۱-۴. دفاع در سطح پروتکل DNS</h3>

<img src="images/CEHv13_08/slide_46.webp" alt="DNS Poisoning Countermeasures" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۶: راه‌های مقابله با DNS Poisoning</div>

<ul>
<li><strong>پیاده‌سازی DNSSEC:</strong> استاندارد DNSSEC با استفاده از امضای دیجیتال، صحت پاسخ‌های DNS را تأیید می‌کند و از پاسخ‌های جعلی جلوگیری می‌کند. این مهم‌ترین دفاع در سطح پروتکل است.</li>
<li><strong>استفاده از SSL/TLS:</strong> با استفاده از HTTPS، حتی اگر DNS مسموم شود، کاربر هنگام اتصال به سایت جعلی، هشدار گواهی نامعتبر دریافت می‌کند و متوجه می‌شود.</li>
<li><strong>استفاده از پورت مبدأ تصادفی برای هر درخواست DNS:</strong> این کار پیش‌بینی پاسخ توسط مهاجم را دشوارتر می‌کند.</li>
<li><strong>محدودسازی نرخ پاسخ به دامنه‌های ناموجود (NXDOMAIN):</strong> برای کاهش خطر حملات با دامنه‌های جعلی.</li>
</ul>

<h3>۲-۴. دفاع در سطح زیرساخت شبکه</h3>

<img src="images/CEHv13_08/slide_47.webp" alt="DNS Poisoning Countermeasures 2" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۷: راه‌های تکمیلی مقابله با DNS Poisoning</div>

<ul>
<li><strong>هدایت تمام درخواست‌های DNS به یک DNS محلی:</strong> با این کار کنترل بیشتری بر ترافیک DNS خواهید داشت.</li>
<li><strong>محدود کردن درخواست‌های DNS به سرورهای خارجی:</strong> فقط به سرورهای داخلی اجازه پاسخ‌دهی به درخواست‌ها را بدهید.</li>
<li><strong>پیکربندی فایروال:</strong> برای محدود کردن Lookup خارجی DNS و جلوگیری از ارسال درخواست‌های غیرمجاز به اینترنت.</li>
<li><strong>محدودسازی سرویس تکرار (Recursion):</strong> فقط به کاربران مجاز اجازه استفاده کامل از سرویس DNS را بدهید.</li>
<li><strong>ایمن‌سازی ماشین‌های داخلی:</strong> جلوگیری از آلوده شدن سیستم‌های داخلی که ممکن است حملات را تسهیل کنند.</li>
<li><strong>استفاده از جدول‌های ARP و IP استاتیک:</strong> برای جلوگیری از جعل آدرس‌ها و هدایت اشتباه بسته‌ها.</li>
<li><strong>استفاده از SSH:</strong> برای ارتباطات امن با سرورها یا مدیریت سیستم‌های DNS.</li>
<li><strong>ممانعت از استفاده از پورت UDP 53 به عنوان پورت خروجی:</strong> این پورت معمولاً برای DNS استفاده می‌شود و می‌تواند هدف حملات باشد.</li>
<li><strong>ممیزی منظم سرورهای DNS:</strong> بررسی‌های دوره‌ای برای اطمینان از به‌روز بودن و عدم وجود نقاط ضعف.</li>
</ul>

<h2>01. Wireshark: میکروسکوپ دنیای شبکه</h2>
<p>بیایید با مهم‌ترین ابزار این جلسه شروع کنیم. Wireshark (که قبلاً Ethereal نام داشت) یکی از معروف‌ترین و پرکاربردترین ابزارهای تحلیل پروتکل و شنود بسته‌های شبکه است. اگر بخواهیم آن را با یک مثال ساده توضیح دهیم: تصور کنید یک پزشک می‌خواهد سلول‌های خون را بررسی کند. او به یک میکروسکوپ نیاز دارد تا بتواند سلول‌ها را ببیند و تحلیل کند. Wireshark هم برای یک تحلیل‌گر شبکه، همان میکروسکوپ است: <strong>به شما اجازه می‌دهد بسته‌های داده‌ای را که در شبکه جریان دارند، تک‌تک ببینید و تحلیل کنید.</strong></p>

<img src="images/CEHv13_08/slide_49.webp" alt="Wireshark" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۹: ویژگی‌های Wireshark (متن‌باز، رابط گرافیکی، پشتیبانی از پلتفرم‌های مختلف)</div>

<p><strong>چرا Wireshark این‌قدر محبوب است؟</strong></p>
<ul>
<li>متن‌باز و رایگان است.</li>
<li>رابط کاربری گرافیکی (GUI) بسیار کاربرپسندی دارد.</li>
<li>روی سیستم‌عامل‌های مختلف (ویندوز، لینوکس، مک) اجرا می‌شود.</li>
<li>از بیش از ۵۰۰ پروتکل شبکه (مثل HTTP، DNS، TCP، ARP) پشتیبانی می‌کند.</li>
<li>قابلیت ذخیره و نمایش ترافیک در قالب‌های مختلف را دارد.</li>
</ul>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>تفاوت Wireshark با tcpdump:</strong>ابزار <code>tcpdump</code> یک ابزار خط فرمان است و برای سرورهای لینوکسی (بدون GUI) استفاده می‌شود. اما Wireshark یک ابزار گرافیکی است و برای تحلیل‌های عمیق‌تر و آموزشی بسیار مناسب‌تر است. در واقع، Wireshark در پشت صحنه از موتور <code>dumpcap</code> (شبیه tcpdump) استفاده می‌کند.</div></div>

<p>حالا که با خود ابزار آشنا شدیم، بیایید ببینیم وقتی این ابزار را روی یک شبکه شلوغ اجرا می‌کنیم، چطور می‌توانیم در میان هزاران بسته، به داده‌های مورد نظرمان برسیم.</p>

<h2>02. فیلترهای Wireshark: هنر پیدا کردن سوزن در انبار کاه</h2>
<p>تصور کنید Wireshark را در یک شبکه شلوغ اجرا کرده‌اید. در عرض چند ثانیه، هزاران بسته روی صفحه ظاهر می‌شود. شما نمی‌توانید همه آن‌ها را یکی‌یکی بررسی کنید! اینجاست که <strong>فیلترها (Filters)</strong> وارد می‌شوند. فیلتر به شما اجازه می‌دهد فقط بسته‌های مورد نظر خود را ببینید و بقیه را نادیده بگیرید. در واقع، فیلتر کردن در Wireshark، مثل استفاده از «ذره‌بین» برای پیدا کردن یک آدرس خاص در یک دفترچه تلفن هزار صفحه‌ای است. فیلترها را می‌توان بر اساس آدرس IP، پورت، پروتکل یا ترکیبی از این‌ها ساخت.</p>

<h3>۱-۲. فیلترهای بر اساس آدرس IP</h3>
<p>یکی از رایج‌ترین کاربردهای Wireshark، دنبال کردن ترافیک یک دستگاه خاص است.</p>
<div class="code-container"><div class="code-label">wireshark · filter</div><pre class="code-block no-prompt">ip.addr == 10.0.0.1        &#8592; نمایش تمام بسته‌های مربوط به IP 10.0.0.1 (مبدأ یا مقصد)
ip.src == 10.0.0.1         &#8592; فقط بسته‌هایی که مبدأ آن‌ها 10.0.0.1 است
ip.dst == 10.0.0.1         &#8592; فقط بسته‌هایی که مقصد آن‌ها 10.0.0.1 است
ip.src != 10.0.0.1         &#8592; نمایش بسته‌هایی که مبدأ آن‌ها 10.0.0.1 نیست</pre></div>

<h3>۲-۲. فیلترهای بر اساس پورت</h3>
<p>اگر فقط می‌خواهید ترافیک یک سرویس خاص (مثلاً وب) را ببینید، از فیلتر پورت استفاده کنید.</p>
<div class="code-container"><div class="code-label">wireshark · filter</div><pre class="code-block no-prompt">tcp.port == 80              &#8592; نمایش تمام ترافیک TCP روی پورت 80 (وب)
tcp.srcport == 80           &#8592; فقط بسته‌هایی که پورت مبدأ آن‌ها 80 است
tcp.dstport == 443          &#8592; فقط بسته‌هایی که مقصد آن‌ها پورت 443 (HTTPS) است
udp.port == 53              &#8592; نمایش ترافیک DNS (پورت 53)</pre></div>

<h3>۳-۲. فیلترهای بر اساس پروتکل</h3>
<p>Wireshark به صورت هوشمند پروتکل‌ها را تشخیص می‌دهد. کافی است نام پروتکل را وارد کنید.</p>
<div class="code-container"><div class="code-label">wireshark · filter</div><pre class="code-block no-prompt">http                         &#8592; فقط نمایش بسته‌های HTTP
dns                          &#8592; فقط نمایش بسته‌های DNS
arp                          &#8592; فقط نمایش بسته‌های ARP
icmp                         &#8592; فقط نمایش بسته‌های ICMP (Ping)</pre></div>

<h3>۴-۲. فیلترهای پیشرفته (ترکیب شرط‌ها)</h3>
<p>در نهایت، قدرتمندترین حالت زمانی است که این شرط‌ها را با هم ترکیب کنیم. می‌توانید چند شرط را با <code>and</code> (و) و <code>or</code> (یا) ترکیب کنید تا فیلتر دقیق‌تری بسازید.</p>
<div class="code-container"><div class="code-label">wireshark · filter</div><pre class="code-block no-prompt">ip.dst == 10.0.0.1 and tcp.dstport == 80     &#8592; ترافیک به سمت IP 10.0.0.1 روی پورت 80
http.request.method == GET                    &#8592; فقط درخواست‌های GET (بازیابی صفحه)
http.request.method == POST                   &#8592; فقط درخواست‌های POST (ارسال فرم)
tcp contains "windowsupdate.com"              &#8592; بسته‌هایی که محتوای آن‌ها شامل این عبارت است
eth.addr == 5d:55:b8:88:84:e5                 &#8592; فیلتر بر اساس آدرس MAC
arp.duplicate-address-detected                &#8592; شناسایی حمله ARP Poisoning</pre></div>

<div class="box note"><i class="fas fa-user-secret"></i><div><strong>یک مثال واقعی از فیلتر پیشرفته:</strong>فرض کنید می‌خواهید بفهمید آیا کسی در شبکه در حال ارسال رمز عبور Telnet است یا نه. کافی است فیلتر <code>tcp.port == 23</code> (پورت Telnet) را اعمال کنید و بسته‌ها را بررسی کنید. اگر رشته‌هایی مثل <code>login:</code> یا <code>password:</code> را در بسته‌ها دیدید، یعنی رمز عبور به صورت متن ساده ارسال می‌شود و شما آن را دیده‌اید!</div></div>

<p>Wireshark ابزار اصلی است، اما تنها ابزار نیست. بسته به نیاز، ابزارهای تخصصی‌تری هم وجود دارند.</p>

<h2>03. ابزارهای Sniffing (دسکتاپ و موبایل)</h2>
<p>ابزارهای زیادی برای اهداف مختلف وجود دارد که برخی از مهم‌ترین آن‌ها عبارتند از:</p>

<img src="images/CEHv13_08/slide_52.webp" alt="Sniffing Tools" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۵۲: لیست ابزارهای Sniffing برای دسکتاپ</div>

<h3>۱-۳. ابزارهای دسکتاپ</h3>
<ul>
<li><strong>Wireshark:</strong> استاندارد طلایی تحلیل پروتکل (متن‌باز).</li>
<li><strong>tcpdump / windump:</strong> ابزارهای خط فرمان (برای سیستم‌های بدون GUI).</li>
<li><strong>Ettercap:</strong> تخصصی در حملات MITM و ARP Poisoning.</li>
<li><strong>Dsniff:</strong> مجموعه‌ای از ابزارها برای شنود رمز عبور (شامل <code>urlsnarf</code>، <code>arpspoof</code> و <code>macof</code>).</li>
<li><strong>Cain & Abel:</strong> ابزار جامع ویندوزی برای بازیابی رمز و تحلیل شبکه.</li>
<li><strong>OmniPeek / Observer:</strong> ابزارهای تجاری قدرتمند برای تحلیل شبکه.</li>
<li><strong>Colasoft Packet Builder / CommView:</strong> ابزارهای تجاری برای ضبط و ساخت بسته.</li>
</ul>

<h3>۲-۳. ابزارهای موبایل (Sniffing در اندروید)</h3>
<p>شاید تعجب کنید، اما حتی با یک گوشی اندروید هم می‌توان Sniffing انجام داد. ابزارهایی مثل <strong>Wi.cap.Network Sniffer Pro</strong> و <strong>Face Niff</strong> به شما اجازه می‌دهند ترافیک شبکه Wi-Fi را که به آن متصل هستید، تحلیل کنید.</p>

<img src="images/CEHv13_08/slide_53.webp" alt="Mobile Sniffing Tools" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۵۳: ابزارهای Sniffing برای موبایل (Wi.cap، Face Niff)</div>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>هشدار اخلاقی:</strong>استفاده از این ابزارها روی شبکه‌ای که مالک آن نیستید (مثلاً Wi-Fi کافه)، غیرقانونی است و می‌تواند عواقب حقوقی جدی داشته باشد. همیشه قبل از هرگونه تست، مجوز کتبی داشته باشید.</div></div>

<p>تا اینجا همه‌چیز از دید مهاجم بود. حالا بیایید جایمان را عوض کنیم و از دید مدافع ببینیم چطور می‌شود این Snifferها را شناسایی کرد.</p>

<h2>04. شناسایی Snifferها: چطور بفهمیم کسی در حال شنود است؟</h2>
<p>فرض کنید مدیر شبکه هستید و می‌خواهید بفهمید آیا کسی در شبکه شما در حال شنود است یا نه. سه روش اصلی برای شناسایی وجود دارد که مکمل یکدیگرند:</p>

<img src="images/CEHv13_08/slide_57.webp" alt="Sniffing Detection" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۵۷: سه روش شناسایی Sniffer (بررسی Promiscuous Mode، IDS، ابزارهای شبکه)</div>

<h3>۱-۴. بررسی دستگاه‌های در حالت Promiscuous Mode</h3>
<p>همان‌طور که در جلسه اول گفتیم، یک Sniffer برای دیدن تمام ترافیک، کارت شبکه‌اش را در حالت Promiscuous Mode قرار می‌دهد. بنابراین، اگر بتوانیم دستگاه‌هایی که در این حالت هستند را پیدا کنیم، می‌توانیم Sniffer را شناسایی کنیم.</p>

<p><strong>چرا این کار در شبکه‌های سوییچ‌شده سخت است؟</strong> چون یک Sniffer در حالت Promiscuous، به بسته‌هایی که برای او نیستند هم پاسخ نمی‌دهد. بنابراین، از دید شبکه، او یک دستگاه ساکت است. اما یک ترفند وجود دارد: <strong>اگر یک بسته ICMP (Ping) به یک دستگاه بفرستید و MAC آن دستگاه با MAC موجود در بسته پاسخ مطابقت داشته باشد، آن دستگاه در حالت Promiscuous است.</strong></p>

<p>ابزاری مثل <strong>Nmap</strong> با اسکریپت <code>sniffer-detect</code> و ابزار <strong>Promqry UI</strong> این کار را انجام می‌دهند:</p>
<div class="code-container"><div class="code-label">bash · nmap</div><pre class="code-block">nmap --script=sniffer-detect 192.168.1.0/24</pre></div>

<h3>۲-۴. استفاده از IDS (سیستم تشخیص نفوذ)</h3>
<p>یک IDS (مثل Snort یا Suricata) می‌تواند تغییرات مشکوک در شبکه را شناسایی کند. مثلاً اگر یک دستگاه شروع به ارسال بسته‌های ARP جعلی (ARP Poisoning) کند یا MAC address روتر را تغییر دهد، IDS می‌تواند به مدیر شبکه هشدار دهد.</p>

<h3>۳-۴. استفاده از ابزارهای شبکه</h3>
<p>ابزارهایی مثل <strong>Capsa Network Analyzer</strong> یا <strong>PRTG Network Monitor</strong> می‌توانند ترافیک شبکه را به طور مداوم پایش کنند و بسته‌های غیرعادی (مثل افزایش ناگهانی ترافیک، بسته‌های ناشناس یا MACهای تکراری) را شناسایی کنند.</p>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>چرا شناسایی Sniffer سخت است؟</strong>چون یک Sniffer خوب، هیچ بسته‌ای به شبکه ارسال نمی‌کند (در حالت Passive). او فقط گوش می‌دهد. بنابراین، هیچ اثری از خودش به جا نمی‌گذارد. تنها راه شناسایی، بررسی رفتار غیرعادی شبکه (مثل MACهای تکراری یا Promiscuous Mode) است.</div></div>

<p>و در پایان، پس از شناسایی، نوبت به مقابله می‌رسد. دفاع در برابر Sniffing نیازمند یک استراتژی چندلایه است.</p>

<h2>05. مقابله با Sniffing: چطور از خود محافظت کنیم؟</h2>
<p>هیچ لایه‌ای به‌تنهایی کافی نیست؛ باید چند لایه دفاعی را در کنار هم قرار داد:</p>

<img src="images/CEHv13_08/slide_55.webp" alt="Sniffing Countermeasures" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۵۵: راه‌های مقابله با Sniffing</div>

<ul>
<li><strong>محدود کردن دسترسی فیزیکی به شبکه:</strong> اطمینان حاصل کنید که هیچ شخص غیرمجازی نمی‌تواند به پورت‌های شبکه دسترسی داشته باشد و Sniffer نصب کند.</li>
<li><strong>استفاده از پروتکل‌های امن (HTTPS، SFTP، SSH):</strong> به جای HTTP از HTTPS، به جای FTP از SFTP و به جای Telnet از SSH استفاده کنید. این کار حتی اگر Sniffer ترافیک را ببیند، نمی‌تواند محتوای آن را بخواند.</li>
<li><strong>جایگزین نمودن سوئیچ به جای هاب:</strong> همان‌طور که بارها گفتیم، سوئیچ ترافیک را فقط به مقصد می‌فرستد و Passive Sniffing را بی‌اثر می‌کند.</li>
<li><strong>استفاده از رمزنگاری (VPN، IPSec):</strong> برای ارتباطات حساس، از VPN و IPSec استفاده کنید.</li>
<li><strong>استفاده از آدرس IP استاتیک و جدول ARP استاتیک:</strong> جلوگیری از ARP Poisoning.</li>
<li><strong>استفاده از IP ورژن ۶ به جای ورژن ۴:</strong> IPv6 مکانیزم امنیتی بهتری برای ARP (Neighbor Discovery) دارد.</li>
<li><strong>شناسایی دستگاه‌های Sniffer:</strong> از ابزارهای تشخیص Promiscuous Mode (مثل Nmap) به طور دوره‌ای استفاده کنید.</li>
</ul>

<div class="image-caption">اسلاید ۵۸: شناسایی و مقابله با Sniffing (Promqry UI و Nmap)</div>

<div class="section-header"><div class="section-badge">23</div><div><h1>مفاهیم و حملات Human-Based</h1><div class="meta">Module 09 · Social Engineering · Session 1 of 3</div></div></div>

<p>به نهمین فصل از دوره CEH v13 خوش آمدید! تا اینجا تمام تمرکز ما روی هک کردن <strong>سیستم‌ها</strong> بود: شبکه‌ها، پورت‌ها، بدافزارها و رمزهای عبور. اما در این فصل، با یکی از قدرتمندترین و قدیمی‌ترین روش‌های نفوذ آشنا می‌شویم: <strong>مهندسی اجتماعی (Social Engineering)</strong>. در این روش، مهاجم به جای هک کردن کامپیوتر، <strong>انسان</strong> را هک می‌کند. به جای شکستن فایروال، از کارمند سازمان می‌خواهد که در را باز کند! در این جلسه ابتدا می‌بینیم مهندسی اجتماعی چیست و چرا کار می‌کند، سپس رفتارهای آسیب‌پذیر و نشانه‌های حمله را مرور می‌کنیم، بعد مراحل و طبقه‌بندی این حملات را می‌بینیم و در پایان با تکنیک‌های Human-Based مثل جعل هویت، استراق سمع، نگاه از روی شانه، زباله‌گردی و دنباله‌روی آشنا می‌شویم.</p>

<h2>01. مهندسی اجتماعی چیست؟ (Social Engineering Concept)</h2>
<p>بیایید با جمله‌ای از کوین میتنیک، یکی از معروف‌ترین هکرهای تاریخ، شروع کنیم: <em>«شما می‌توانید هر چقدر که می‌خواهید برای خرید تجهیزات تکنولوژیکی خرج کنید، اما زیرساخت‌های شبکه شما هنوز در برابر دستکاری‌های سنتی آسیب‌پذیر باقی می‌ماند.»</em></p>

<p><strong>مهندسی اجتماعی</strong> هنر بهره‌برداری از رفتارهای انسانی برای استخراج اطلاعات حساس است. در این روش، مهاجم از علم روانشناسی استفاده می‌کند تا فرد را متقاعد و وادار نماید که اطلاعات محرمانه را آشکار نماید. مهندسین اجتماعی به این حقیقت امید دارند که مردم نسبت به اطلاعات باارزش خود بی‌اطلاع بوده و نسبت به محافظت از آن بی‌مبالات هستند.</p>

<img src="images/CEHv13_09/slide_7.webp" alt="Social Engineering" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۷: مفهوم مهندسی اجتماعی (هنر متقاعد کردن)</div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>چرا مهندسی اجتماعی مؤثرتر از حملات فنی است؟</strong>یک فایروال را می‌توان با یک وصله امنیتی یا یک قانون جدید مسدود کرد. اما انسان را نمی‌توان با یک وصله تغییر داد. انسان‌ها ذاتاً کمک‌کننده، قابل‌اعتماد و گاهی ساده‌لوح هستند. مهاجم از همین ویژگی‌های طبیعی سوءاستفاده می‌کند. به همین دلیل، بسیاری از کارشناسان امنیتی می‌گویند: <strong>«ضعیف‌ترین حلقه در زنجیره امنیت، انسان است.»</strong></div></div>

<p>حالا که فهمیدیم چرا این حملات کار می‌کنند، بیایید ببینیم دقیقاً کدام ویژگی‌های انسانی، ما را آسیب‌پذیر می‌کنند.</p>

<h2>02. رفتارهای آسیب‌پذیر (Vulnerable Behaviors)</h2>
<p>چرا برخی افراد در برابر مهندسی اجتماعی آسیب‌پذیرترند؟ طبق اسلاید ۱۱، چهار عامل اصلی وجود دارد که مهاجم روی آن‌ها حساب باز می‌کند:</p>

<img src="images/CEHv13_09/slide_11.webp" alt="Vulnerable Behaviors" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۱: رفتارهای آسیب‌پذیر در برابر مهندسی اجتماعی</div>

<ol>
<li><strong>اعتماد طبیعی انسان (Human Nature of Trust):</strong> انسان‌ها ذاتاً به یکدیگر اعتماد می‌کنند. وقتی کسی با لباس فرم یا با لحنی رسمی از شما درخواستی می‌کند، تمایل دارید به او اعتماد کنید.</li>
<li><strong>بی‌اطلاعی از تأثیرات (Lack of Awareness):</strong> بسیاری از افراد نمی‌دانند که اطلاعاتی که به اشتراک می‌گذارند (مثل نام همسر، تاریخ تولد، یا حتی نام پروژه‌ای که روی آن کار می‌کنند) چقدر می‌تواند برای یک مهاجم ارزشمند باشد.</li>
<li><strong>امید به دادن پاداش (Hope for Reward):</strong> مهاجمان اغلب وعده پاداش (مثل یک هدیه، تخفیف یا ارتقای شغلی) می‌دهند تا فرد را به افشای اطلاعات ترغیب کنند.</li>
<li><strong>ترساندن کاربران (Intimidation):</strong> گاهی مهاجم با ایجاد ترس (مثلاً «حساب شما هک شده است، فوراً رمز عبور خود را تغییر دهید») فرد را مجبور به انجام کاری می‌کند.</li>
</ol>

<div class="box note"><i class="fas fa-user-friends"></i><div><strong>مثال از دنیای واقعی:</strong>فرض کنید یک کارمند بخش مالی هستید. یک روز تماس تلفنی دریافت می‌کنید که می‌گوید: «سلام، من از پشتیبانی فنی هستم. یک مشکل امنیتی در حساب شما شناسایی شده و برای رفع آن، نیاز به رمز عبور فعلی شما دارم.» اگر شما ذاتاً به این تماس اعتماد کنید و رمز خود را بدهید، قربانی مهندسی اجتماعی شده‌اید.</div></div>

<p>حالا که فهمیدیم چرا انسان‌ها آسیب‌پذیرند، بیایید ببینیم یک حمله مهندسی اجتماعی از کجا شروع می‌شود و چه نشانه‌هایی دارد.</p>

<h2>03. نشانه‌های یک حمله مهندسی اجتماعی</h2>
<p>چگونه می‌توانیم یک حمله مهندسی اجتماعی را تشخیص دهیم؟ طبق اسلاید ۱۳، نشانه‌های زیر باید زنگ خطر را به صدا درآورند. این نشانه‌ها را می‌توانید به‌عنوان یک چک‌لیست در ذهن خود نگه دارید:</p>

<img src="images/CEHv13_09/slide_13.webp" alt="Signs of SE Attack" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۳: نشانه‌های خطرناک یک حمله مهندسی اجتماعی</div>

<ul>
<li><strong>تعارفات غیرمعمولی و ستایش فرد:</strong> مهاجم ممکن است با تعریف و تمجید از شما (مثلاً «شما بهترین کارمند این بخش هستید»)، اعتماد شما را جلب کند.</li>
<li><strong>درخواست‌های فوری و با عجله:</strong> مهاجم شما را تحت فشار قرار می‌دهد تا در زمانی کوتاه تصمیمی بگیرید (مثلاً «فوراً این فایل را باز کنید، وگرنه پروژه شکست می‌خورد»). عجله، تفکر منطقی را از بین می‌برد.</li>
<li><strong>ناراحتی هنگام پرسش سؤال:</strong> اگر از مهاجم بپرسید «چرا این اطلاعات را می‌خواهید؟»، ممکن است عصبانی یا ناراحت شود تا شما را از پرسیدن سؤال بیشتر منصرف کند.</li>
<li><strong>تهدید برای عدم پاسخ به درخواست‌ها:</strong> مهاجم ممکن است شما را تهدید کند که اگر پاسخ ندهید، عواقب بدی در انتظار شماست.</li>
<li><strong>ارجاع به مقامات بالاتر:</strong> مهاجم ممکن است بگوید «این دستور مستقیم مدیرعامل است» تا شما را مجبور به اطاعت کند.</li>
</ul>

<p>این نشانه‌ها معمولاً در قالب یک الگوی مشخص ظاهر می‌شوند. بیایید ببینیم یک حمله مهندسی اجتماعی از ابتدا تا انتها چه مراحلی را طی می‌کند.</p>

<h2>04. مراحل یک حمله مهندسی اجتماعی</h2>
<p>یک حمله مهندسی اجتماعی معمولاً از یک الگوی پنج‌مرحله‌ای پیروی می‌کند که در آن مهاجم ابتدا اطلاعات جمع می‌کند، سپس اعتماد می‌سازد و در پایان از آن اعتماد سوءاستفاده می‌کند:</p>

<ol>
<li><strong>Research (تحقیق):</strong> مهاجم اطلاعات مربوط به قربانی را جمع‌آوری می‌کند (نام، سمت، عادت‌ها، علایق) از طریق شبکه‌های اجتماعی، وب‌سایت شرکت و منابع عمومی.</li>
<li><strong>Developing Rapport (ایجاد رابطه):</strong> مهاجم با قربانی ارتباط برقرار می‌کند و اعتماد او را جلب می‌نماید. این مرحله ممکن است روزها یا هفته‌ها طول بکشد.</li>
<li><strong>Exploiting Trust (بهره‌برداری از اعتماد):</strong> مهاجم از اعتماد ایجادشده استفاده می‌کند و درخواست اطلاعات حساس یا دسترسی را مطرح می‌کند.</li>
<li><strong>Execution (اجرا):</strong> مهاجم از اطلاعات به دست آمده برای انجام حمله اصلی (مثل نفوذ به شبکه یا سرقت داده) استفاده می‌کند.</li>
<li><strong>Exit (خروج):</strong> مهاجم ردپای خود را پاک می‌کند و از صحنه خارج می‌شود (اگر شناسایی شده باشد).</li>
</ol>

<p>حالا که مراحل کلی را فهمیدیم، بیایید ببینیم این حملات بر اساس نوع واسطه به چند دسته تقسیم می‌شوند؛ چون تکنیک‌های هر دسته کاملاً متفاوت است.</p>

<h2>05. طبقه‌بندی حملات مهندسی اجتماعی</h2>
<p>حملات مهندسی اجتماعی بر اساس «واسطه» به سه دسته اصلی تقسیم می‌شوند:</p>

<img src="images/CEHv13_09/slide_23.webp" alt="Types of SE" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۳: طبقه‌بندی حملات به Computer-Based، Mobile-Based و Human-Based</div>

<ul>
<li><strong>Computer-Based (مبتنی بر کامپیوتر):</strong> با استفاده از کامپیوتر و اینترنت انجام می‌شود (مثل Phishing، Scareware، Pop-up).</li>
<li><strong>Mobile-Based (مبتنی بر موبایل):</strong> با استفاده از اپلیکیشن‌های موبایل و پیام‌رسان‌ها (مثل SMiShing).</li>
<li><strong>Human-Based (مبتنی بر انسان):</strong> با استفاده از تعامل مستقیم انسانی انجام می‌شود (مثل Impersonation، Shoulder Surfing). <strong>موضوع اصلی این جلسه ماست.</strong></li>
</ul>

<p>حالا که این دسته‌بندی را می‌دانیم، سراغ مهم‌ترین تکنیک‌های Human-Based می‌رویم. توجه کنید که این تکنیک‌ها برخلاف حملات فنی، همه در دنیای فیزیکی یا از طریق تماس مستقیم انسانی رخ می‌دهند.</p>

<h2>06. تکنیک‌های Human-Based (مبتنی بر انسان)</h2>
<p>در این بخش، با مهم‌ترین تکنیک‌هایی که مهاجم در دنیای فیزیکی (یا با تماس مستقیم) استفاده می‌کند آشنا می‌شویم. این تکنیک‌ها را می‌توان بر اساس نوع سوءاستفاده دسته‌بندی کرد: برخی سوءاستفاده از اعتماد (Impersonation)، برخی از بی‌توجهی قربانی (Shoulder Surfing, Eavesdropping) و برخی از بی‌احتیاطی سازمان (Dumpster Diving, Tailgating).</p>

<h3>۱-۶. جعل هویت (Impersonation)</h3>
<p>در این تکنیک، مهاجم خود را به جای یک فرد مجاز یا دارای صلاحیت جا می‌زند تا اطلاعات حساس را به دست آورد. این کار نیازمند تحقیقات قبلی (Research) است تا مهاجم بتواند با اعتماد کامل ظاهر شود.</p>

<img src="images/CEHv13_09/slide_25.webp" alt="Impersonation" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۵: سه سناریوی رایج Impersonation</div>

<ul>
<li><strong>وانمود به یک کاربر عادی:</strong> «سلام! من جان از بخش مالی هستم. رمز عبورم رو فراموش کردم، می‌تونید برام بفرستید.»</li>
<li><strong>وانمود به یک کاربر مهم (VIP):</strong> «سلام! من کوین، منشی مدیر مالی هستم. یه پروژه فوری دارم و رمز سیستمم رو گم کردم. می‌تونید کمکم کنید؟»</li>
<li><strong>وانمود به پشتیبانی فنی:</strong> «سلام، من متیو از پشتیبانی فنی هستم. دیشب سیستم Crash کرد و داریم داده‌ها رو بازیابی می‌کنیم. لطفاً رمز عبور و شناسه‌ی خود را به من بدهید.»</li>
</ul>

<p>جعل هویت مبتنی بر تعامل مستقیم است. اما مهاجم می‌تواند بدون اینکه حتی با قربانی حرف بزند، اطلاعات را از او بدزدد.</p>

<h3>۲-۶. استراق سمع (Eavesdropping)</h3>
<p>گوش دادن یا خواندن غیرمجاز مکالمات و پیام‌ها بدون اطلاع طرف مقابل. این می‌تواند شامل گوش دادن به مکالمات تلفنی در یک اتاق کنفرانس، یا خواندن پیام‌های نمایش داده شده روی صفحه گوشی یک فرد در کنار شما باشد.</p>

<img src="images/CEHv13_09/slide_26.webp" alt="Eavesdropping" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۶: استراق سمع (شنیدن مکالمات بدون اجازه)</div>

<h3>۳-۶. نگاه از روی شانه (Shoulder Surfing)</h3>
<p>در این روش، مهاجم با نگاه کردن از بالای شانه فرد یا از فاصله دور (با دوربین یا دوربین دوچشمی) اطلاعات حساس او را مشاهده می‌کند. این تکنیک ممکن است در محیط‌های شلوغ (مانند کافی‌نت، فرودگاه، مترو) اتفاق بیفتد. هدف اصلی، سرقت اطلاعاتی است که کاربر در حال وارد کردن یا مشاهده آن است (مثل رمز عبور، شماره کارت بانکی، یا کد ملی).</p>

<img src="images/CEHv13_09/slide_27.webp" alt="Shoulder Surfing" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۷: Shoulder Surfing (نگاه کردن از روی شانه)</div>

<p>تا اینجا تکنیک‌ها همه حول شخص قربانی بودند. اما گاهی سازمان، خودش اطلاعات را دور می‌ریزد و مهاجم فقط باید آن‌ها را جمع کند.</p>

<h3>۴-۶. زباله‌گردی (Dumpster Diving)</h3>
<p>در این روش، مهاجم با جستجو در زباله‌های دیگران (سطل زباله شرکت، پرینتر، میز کارکنان) به دنبال اطلاعات حساس است. چه چیزهایی در زباله‌ها پیدا می‌شود؟</p>
<ul>
<li><strong>اطلاعات تماس:</strong> دفترچه تلفن کارمندان.</li>
<li><strong>اطلاعات مالی:</strong> فیش‌های حقوقی، صورت‌حساب‌ها.</li>
<li><strong>اطلاعات عملیاتی یا سازمانی:</strong> اسناد محرمانه، نقشه‌های شبکه، گزارش‌های پروژه.</li>
<li><strong>یادداشت‌های چسب‌دار روی میز کارکنان:</strong> که ممکن است شامل رمز عبور باشند!</li>
</ul>

<img src="images/CEHv13_09/slide_28.webp" alt="Dumpster Diving" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۸: Dumpster Diving (جستجو در زباله‌ها)</div>

<p>و در نهایت، آخرین دسته از تکنیک‌های Human-Based به امنیت فیزیکی ساختمان مربوط می‌شوند؛ جایی که مهاجم بدون هیچ ابزاری، فقط با استفاده از اعتماد یا بی‌توجهی کارکنان، وارد ساختمان می‌شود.</p>

<h3>۵-۶. دنباله‌روی و سواری مجانی (Tailgating و Piggybacking)</h3>
<p>این دو تکنیک مربوط به امنیت فیزیکی ساختمان هستند و ظاهراً شبیه هم، اما تفاوت ظریفی دارند:</p>

<ul>
<li><strong>Tailgating (دنباله‌روی):</strong> در این روش، مهاجم بدون اطلاع فرد مجاز، از یک درب امنیتی عبور می‌کند. مثلاً وقتی یک کارمند با کارت خود درب را باز می‌کند، مهاجم بدون اینکه کارمند متوجه شود، پشت سر او وارد می‌شود.</li>
<li><strong>Piggybacking (سواری مجانی):</strong> در این روش، فرد مجاز <strong>عمداً یا سهواً</strong> اجازه می‌دهد یک فرد غیرمجاز همراه او وارد شود. مثلاً مهاجم با گفتن «کارت شناسایی‌ام رو جا گذاشتم، لطفاً اجازه بدید وارد شم»، از مهربانی یا اعتماد فرد مجاز سوءاستفاده می‌کند.</li>
</ul>

<img src="images/CEHv13_09/slide_29.webp" alt="Tailgating" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۹: Tailgating (عبور بدون اطلاع فرد مجاز)</div>

<img src="images/CEHv13_09/slide_30.webp" alt="Piggybacking" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۰: Piggybacking (عبور با اجازه فرد مجاز)</div>

<div class="box note"><i class="fas fa-door-open"></i><div><strong>تفاوت کلیدی:</strong>در Tailgating، فرد مجاز از حضور مهاجم بی‌خبر است. در Piggybacking، فرد مجاز از حضور مهاجم خبر دارد و حتی به او کمک می‌کند (مثلاً در را نگه می‌دارد). هر دو روش بسیار رایج هستند و نشان می‌دهند که امنیت فیزیکی بدون آموزش کارکنان بی‌فایده است.</div></div>

<h2>01. حملات Computer-Based (مبتنی بر کامپیوتر)</h2>
<p>بیایید با یک مقایسه شروع کنیم. حملات Human-Based که در جلسه قبل دیدیم، به حضور فیزیکی یا تعامل مستقیم نیاز داشتند و در نتیجه دامنه محدودی داشتند. اما در حملات <strong>Computer-Based</strong>، مهاجم از ابزارهای دیجیتال (وب‌سایت، ایمیل، پیام‌رسان) برای فریب کاربر استفاده می‌کند. نتیجه این است که این حملات می‌توانند به صورت انبوه (Mass Attack) انجام شوند و هزاران قربانی را همزمان هدف قرار دهند؛ بدون اینکه مهاجم حتی یک بار با آن‌ها روبرو شود.</p>

<img src="images/CEHv13_09/slide_31.webp" alt="Computer Based Attacks" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۱: انواع حملات Computer-Based</div>

<p>در ادامه، پنج نوع رایج این حملات را مرور می‌کنیم. دقت کنید که هر کدام یک روش متفاوت برای فریب کاربر دارند: یکی از طریق پنجره بازشو، یکی از طریق ایمیل زنجیره‌ای، یکی از طریق هرزنامه، یکی از طریق ترساندن و آخری از طریق چت آنی.</p>

<h3>۱-۱. پنجره‌های بازشو (Pop-Up Windows)</h3>
<p>این پنجره‌ها کاربر را فریب می‌دهند تا روی یک لینک کلیک کند که او را به صفحات جعلی هدایت می‌کند. این صفحات ممکن است اطلاعات شخصی درخواست کنند یا باعث دانلود بدافزار شوند.</p>
<p><strong>چرا کار می‌کند؟</strong> یک Pop-up خوب طراحی شده، شبیه یک هشدار واقعی سیستم به نظر می‌رسد (مثلاً «سیستم شما ویروسی شده!»). کاربر با دیدن این هشدار، دچار اضطراب می‌شود و بدون فکر کردن روی دکمه «پاک‌سازی» کلیک می‌کند. در واقع، همین کلیک، در را برای نصب بدافزار باز می‌کند.</p>

<img src="images/CEHv13_09/slide_32.webp" alt="Pop-Up Windows" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۲: نمونه‌ای از Pop-up جعلی هشدار ویروس</div>

<h3>۲-۱. نامه‌های زنجیره‌ای جعلی (Hoax Letters)</h3>
<p>این پیام‌ها درباره یک تهدید جعلی (مثل یک ویروس کامپیوتری غیرواقعی) به گیرنده هشدار می‌دهند. ویژگی‌های این پیام‌ها:</p>
<ul>
<li>با استفاده از مهندسی اجتماعی گسترش می‌یابند (کاربر فریب‌خورده، پیام را برای دوستانش هم می‌فرستد).</li>
<li>معمولاً خطر فیزیکی یا از دست رفتن اطلاعات واقعی ندارند، اما باعث کاهش بهره‌وری سازمانی و هدر رفتن منابع شبکه می‌شوند.</li>
<li>هدف آن‌ها ایجاد اضطراب، ترس یا هدر دادن زمان کاربران و مدیران شبکه است.</li>
</ul>

<img src="images/CEHv13_09/slide_33.webp" alt="Hoax Letters" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۳: نمونه‌ای از یک نامه زنجیره‌ای جعلی (Hoax)</div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>چرا Hoax Letters خطرناک نیستند اما آزاردهنده‌اند؟</strong>یک Hoax واقعاً ویروس نیست که به سیستم شما آسیب بزند. اما اگر شما آن را برای ۵۰ نفر از همکارانتان بفرستید، پهنای باند شبکه را اشغال می‌کند و وقت همه را تلف می‌کند. در سازمان‌های بزرگ، این کار می‌تواند به یک بحران تبدیل شود.</div></div>

<h3>۳-۱. ایمیل‌های هرزنامه (Spam Email)</h3>
<p>اگر Hoax فقط وقت تلف می‌کرد، Spam خطر واقعی دارد. ایمیل‌هایی که حاوی لینک‌هایی برای سرقت اطلاعات بانکی یا ورود هستند، یا فایل‌هایی که شامل ویروس، تروجان یا بدافزار می‌باشند. مهاجم برای جلوگیری از شناسایی، پسوند فایل‌ها را با نام‌های طولانی و فریبنده پنهان می‌کند (مثلاً <code>invoice.pdf.exe</code>). هدف این نوع حمله، فریب کاربران برای اجرای فایل مخرب یا ارائه اطلاعات حساس است.</p>

<img src="images/CEHv13_09/slide_34.webp" alt="Spam Email" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۴: نمونه‌ای از ایمیل هرزنامه با پیوست مخرب</div>

<h3>۴-۱. نرم‌افزارهای وحشت‌آفرین (Scareware)</h3>
<p>این نوع، که با Spam ارتباط نزدیک دارد، نوعی بدافزار است که کاربر را با ترساندن یا هشدارهای جعلی وادار به انجام کاری خاص می‌کند. ویژگی‌های این مدل:</p>
<ul>
<li>معمولاً به شکل پاپ‌آپ‌هایی ظاهر می‌شود که ادعا می‌کنند سیستم کاربر ویروسی شده.</li>
<li>وانمود می‌کند که از طرف شرکت‌های امنیتی معتبر است (مثلاً آنتی‌ویروس‌ها).</li>
<li>همیشه حس اضطرار ایجاد می‌کند (مثلاً «فقط ۵ دقیقه فرصت دارید!»).</li>
</ul>
<p>این روش باعث می‌شود کاربر با دست خودش بدافزار را دانلود و اجرا کند.</p>

<img src="images/CEHv13_09/slide_35.webp" alt="Scareware" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۵: نمونه‌ای از Scareware (هشدار جعلی ویروس)</div>

<h3>۵-۱. پیام‌رسان‌های چت آنی (Instant Chat Messenger)</h3>
<p>و آخرین نوع در این دسته، برخلاف چهار مورد قبلی، از یک کانال ارتباطی دوطرفه استفاده می‌کند. مهاجم از طریق پیام‌های آنلاین با قربانیان صحبت می‌کند تا اطلاعات حساس را به دست آورد. اطلاعات مورد نظر در این مدل عبارتند از:</p>
<ul>
<li>تاریخ تولد</li>
<li>نام و نام خانوادگی</li>
<li>سایر داده‌های شخصی قابل استفاده برای نفوذ به حساب‌ها</li>
</ul>
<p>مهاجم پس از جمع‌آوری این اطلاعات، از آن‌ها برای هک حساب‌های کاربری قربانیان استفاده می‌کند (مثلاً با استفاده از گزینه «رمز عبور خود را فراموش کرده‌اید؟»).</p>

<img src="images/CEHv13_09/slide_36.webp" alt="Instant Chat Messenger" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۶: فریب کاربر از طریق چت آنلاین</div>

<p>همه این پنج نوع، در نهایت یک هدف مشترک دارند: کاربر را فریب دهند تا اطلاعاتش را افشا کند یا کاری انجام دهد. اما یک روش خاص وجود دارد که در آن، این فریب در قالب یک «طعمه» کاملاً حرفه‌ای طراحی می‌شود. اینجاست که فیشینگ وارد می‌شود.</p>

<h2>02. فیشینگ (Phishing): قلاب انداختن در دریای کاربران</h2>
<p>فیشینگ یکی از رایج‌ترین و شناخته‌شده‌ترین حملات مهندسی اجتماعی است. نام آن از کلمه «Fishing» (ماهیگیری) گرفته شده است. مهاجم یک «طعمه» (یک ایمیل یا سایت جعلی) درست می‌کند و آن را در «دریای کاربران» (اینترنت) پخش می‌کند. اگر کاربری گول بخورد و روی لینک کلیک کند، «به دام می‌افتد».</p>

<p>در یک حمله فیشینگ، مهاجم خود را به عنوان یک نهاد معتبر (مثل بانک، سازمان دولتی یا همکار) جا می‌زند و از کاربر می‌خواهد اطلاعات حساس (نام کاربری، رمز عبور، شماره کارت) را وارد کند.</p>

<img src="images/CEHv13_09/slide_38.webp" alt="Phishing Examples" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۸: نمونه‌ای از ایمیل‌های فیشینگ (جعل هویت بانک و PayPal)</div>

<h3>۱-۲. انواع فیشینگ</h3>
<p>فیشینگ فقط یک نوع نیست؛ مهاجمان بر اساس هدف و روش، آن را به اشکال مختلفی انجام می‌دهند. بیایید از ساده‌ترین به پیچیده‌ترین پیش برویم:</p>

<h4>۱-۱-۲. فیشینگ نیزه‌ای (Spear Phishing)</h4>
<p>این نوع، یک حمله <strong>هدفمند</strong> است. مهاجم به جای ارسال ایمیل به هزاران نفر، یک ایمیل کاملاً شخصی‌سازی‌شده برای یک فرد خاص (یا یک گروه کوچک) ارسال می‌کند. او قبلاً تحقیقات زیادی درباره قربانی انجام داده و می‌داند که او چه پروژه‌ای دارد، با چه کسی کار می‌کند و به چه زبانی صحبت می‌کند. به همین دلیل، Spear Phishing بسیار مؤثرتر از فیشینگ معمولی است.</p>

<h4>۲-۱-۲. نهنگ‌گیری (Whaling)</h4>
<p>این نوع، یک Spear Phishing بسیار خاص است که <strong>مدیران ارشد (C-Level)</strong> مثل مدیرعامل (CEO)، مدیر مالی (CFO) یا اعضای هیئت مدیره را هدف قرار می‌دهد. هدف مهاجم معمولاً سرقت اطلاعات بسیار حساس (مثل طرح‌های استراتژیک شرکت) یا انجام یک تراکنش مالی بزرگ است.</p>

<h4>۳-۱-۲. فارمینگ (Pharming)</h4>
<p>فارمینگ شبیه فیشینگ است، اما تفاوت مهمی دارد. در فیشینگ، کاربر روی یک لینک جعلی کلیک می‌کند و به سایت جعلی می‌رود. اما در <strong>Pharming</strong>، مهاجم کاری می‌کند که حتی اگر کاربر آدرس سایت واقعی را هم در مرورگر تایپ کند، به سایت جعلی هدایت شود! این کار معمولاً با <strong>DNS Poisoning</strong> (که در فصل ۸ یاد گرفتیم) یا دستکاری فایل <code>hosts</code> سیستم انجام می‌شود.</p>

<div class="box note"><i class="fas fa-network-wired"></i><div><strong>تفاوت Phishing و Pharming:</strong>در Phishing، مهاجم طعمه را به سمت خود می‌کشد (لینک جعلی). در Pharming، مهاجم مسیر رسیدن به مقصد واقعی را تغییر می‌دهد (تغییر DNS). به همین دلیل، Pharming بسیار خطرناک‌تر است، چون کاربر هیچ لینک جعلی را نمی‌بیند و ممکن است متوجه نشود.</div></div>

<h4>۴-۱-۲. اسپیمینگ (Spimming)</h4>
<p>این نوع فیشینگ از طریق <strong>پیام‌رسان‌های آنی (Instant Messaging)</strong> انجام می‌شود. مهاجم یک حساب کاربری (معمولاً یک حساب هک‌شده از یکی از دوستان قربانی) را انتخاب کرده و لینک‌های مخرب را برای مخاطبین آن حساب ارسال می‌کند. چون کاربر فکر می‌کند پیام از طرف یک دوست معتبر است، روی لینک کلیک می‌کند.</p>

<img src="images/CEHv13_09/slide_37.webp" alt="Phishing Types" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۷: انواع فیشینگ (Spear Phishing، Whaling، Pharming، Spimming)</div>

<p>تا اینجا دیدیم که فیشینگ چطور با ایمیل، سایت و پیام‌رسان کار می‌کند. اما در همه این‌ها، کاربر هنوز می‌توانست با دقت کردن به آدرس فرستنده یا لینک، متوجه جعلی بودن شود. حالا با ورود هوش مصنوعی، حتی این آخرین خط دفاعی هم در حال از بین رفتن است.</p>

<h2>03. جعل عمیق و شبیه‌سازی صدا با هوش مصنوعی</h2>
<p>حالا به پیشرفته‌ترین و وحشتناک‌ترین بخش این جلسه می‌رسیم. تا اینجا، اگر ایمیلی از طرف «بانک» دریافت می‌کردید، می‌توانستید با دقت به آدرس ایمیل فرستنده، متوجه جعلی بودن آن شوید. اما با ظهور هوش مصنوعی، دیگر «دیدن و شنیدن» هم تضمینی برای «باور کردن» نیست.</p>

<h3>۱-۳. Deepfake (جعل عمیق ویدیویی)</h3>
<p>حملات <strong>Deepfake</strong> نوعی حمله فیشینگ هستند که در آن، مهاجمان با استفاده از فناوری‌هایی مثل یادگیری ماشین و هوش مصنوعی، ویدیوها یا صداهای جعلی از یک فرد (مثلاً مدیرعامل شرکت) تولید می‌کنند تا دیگران را فریب دهند.</p>
<p><strong>چطور کار می‌کند؟</strong> مهاجم هزاران ساعت ویدیو و صدای یک فرد (از مصاحبه‌ها، سخنرانی‌ها و شبکه‌های اجتماعی) را جمع‌آوری می‌کند و به یک مدل هوش مصنوعی می‌دهد. این مدل یاد می‌گیرد که چطور صورت و صدای آن فرد را شبیه‌سازی کند. نتیجه، یک ویدیوی کاملاً جعلی است که در آن، آن فرد (مثلاً رئیس جمهور یا مدیرعامل) حرفی می‌زند که هرگز نگفته است.</p>

<img src="images/CEHv13_09/slide_40.webp" alt="Deepfake" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۰: تولید ویدیوی جعلی با تکنولوژی Deepfake</div>

<div class="box warning"><i class="fas fa-video"></i><div><strong>یک سناریوی واقعی:</strong>در سال ۲۰۱۹، یک مدیرعامل یک شرکت بریتانیایی با یک تماس تلفنی (که صدا کاملاً شبیه مدیرعامل مادر بود) فریب خورد و ۲۴۳,۰۰۰ دلار به یک حساب جعلی منتقل کرد. این اولین باری بود که از هوش مصنوعی برای یک حمله سایبری استفاده می‌شد.</div></div>

<h3>۲-۳. شبیه‌سازی صدا با AI (Voice Cloning)</h3>
<p>حملات تقلید صدا با استفاده از هوش مصنوعی شامل به کارگیری الگوریتم‌های پیشرفته یادگیری ماشین برای ایجاد تقلیدهای بسیار قانع‌کننده از صدای افراد است. این حملات از تکنیک‌هایی مانند ترکیب گفتار (Speech Synthesis) و مدل‌های مبتنی بر شبکه‌های عصبی برای بازسازی ویژگی‌های منحصر به فرد صدای یک فرد، از جمله تن، لحن و سبک صحبت کردن، استفاده می‌کنند.</p>
<p><strong>چرا این‌قدر خطرناک است؟</strong> چون برای شبیه‌سازی صدا، فقط به چند ثانیه صدای یک فرد نیاز است! اگر شما یک ویدیو ۱۰ ثانیه‌ای از خودتان در اینستاگرام گذاشته باشید، یک مهاجم می‌تواند با هوش مصنوعی، صدای شما را شبیه‌سازی کند و با صدای شما با خانواده یا همکارانتان تماس بگیرد.</p>

<img src="images/CEHv13_09/slide_41.webp" alt="Voice Cloning" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۱: ابزارهای شبیه‌سازی صدا با هوش مصنوعی</div>

<p>حالا که این تهدیدات را شناختیم، بیایید ببینیم چطور می‌توانیم حداقل در سطح ایمیل‌های فیشینگ، از خود دفاع کنیم. این نکات ساده می‌توانند شما را از یک فاجعه نجات دهند.</p>

<h2>04. چگونه یک ایمیل فیشینگ را شناسایی کنیم؟</h2>
<p>تشخیص یک ایمیل فیشینگ از یک ایمیل واقعی، یک مهارت قابل یادگیری است. این نکات می‌توانند شما را از یک فاجعه نجات دهند:</p>

<img src="images/CEHv13_09/slide_61.webp" alt="How to Spot Phishing" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۶۱: نشانه‌های شناسایی ایمیل فیشینگ</div>

<ul>
<li><strong>آدرس ایمیل فرستنده را با دقت بررسی کنید:</strong> به جای <code>support@bank.com</code>، ممکن است <code>support@bankk.com</code> (با دو k) یا <code>support@bank-support.com</code> باشد.</li>
<li><strong>به لحن پیام توجه کنید:</strong> اگر پیام فوریت دارد (مثلاً «فوراً رمز عبور خود را تغییر دهید»)، باید شک کنید.</li>
<li><strong>روی لینک‌ها کلیک نکنید:</strong> ماوس را روی لینک نگه دارید (بدون کلیک) تا ببینید آدرس واقعی مقصد چیست.</li>
<li><strong>به پیوست‌ها شک کنید:</strong> هرگز فایل‌های <code>.exe</code>، <code>.zip</code> یا <code>.pdf</code> ناشناس را باز نکنید.</li>
<li><strong>به خطاهای املایی توجه کنید:</strong> ایمیل‌های فیشینگ اغلب دارای غلط املایی یا گرامری هستند.</li>
</ul>

<p>در دو جلسه قبل یاد گرفتیم چطور یک مهاجم با فریب انسان‌ها (مهندسی اجتماعی) به اطلاعات دسترسی پیدا می‌کند؛ یک بار از طریق تعامل مستقیم انسانی و یک بار از طریق فناوری و فیشینگ. اما در این جلسه به سراغ عمیق‌ترین و خطرناک‌ترین لایه می‌رویم: <strong>دنیای درون سازمان</strong>. گاهی بزرگ‌ترین تهدید از بیرون نمی‌آید؛ از <strong>داخل</strong> می‌آید. کارمندی که ناراضی است، یک پیمانکار که دسترسی‌هایش محدود نشده، یا حتی یک کارمند ساده‌لوح که قربانی فیشینگ شده است. در این جلسه ابتدا با <strong>سرقت هویت</strong> و روش‌های آن آشنا می‌شویم، سپس جعل هویت در شبکه‌های اجتماعی را می‌بینیم، بعد به سراغ <strong>تهدیدات داخلی</strong> و انواع آن می‌رویم، در ادامه راه‌های دفاع در برابر مهندسی اجتماعی را مرور می‌کنیم و در پایان ابزارهای شناسایی فیشینگ را بررسی می‌کنیم.</p>

<h2>01. سرقت هویت (Identity Theft)</h2>
<p>بیایید با یک تعریف ساده شروع کنیم. سرقت هویت هنگامی اتفاق می‌افتد که فردی با قصد فریب، اطلاعات هویتی یک فرد را به سرقت می‌برد. این اطلاعات می‌تواند شامل نام، شماره ملی، تاریخ تولد، شماره کارت بانکی، یا حتی عکس و امضای فرد باشد. سرقت هویت یک <strong>جرم</strong> محسوب می‌شود و می‌تواند عواقب حقوقی و مالی شدیدی برای قربانی داشته باشد.</p>

<img src="images/CEHv13_09/slide_50.webp" alt="Identity Theft" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۵۰: سرقت هویت (جعل گواهینامه رانندگی با اطلاعات و عکس جعلی)</div>

<p>نفوذگر می‌تواند با سرقت هویت، به صورت فیزیکی به سازمان یا شرکت مورد نظر وارد شده و فعالیت‌های مورد نظر خود را انجام دهد. تصور کنید یک مهاجم با استفاده از اطلاعات هویتی یک کارمند (که از شبکه‌های اجتماعی یا زباله‌ها به دست آورده)، یک کارت شناسایی جعلی درست می‌کند و وارد ساختمان شرکت می‌شود. او حالا از دید نگهبان، یک کارمند قانونی است!</p>

<h3>۱-۱. روش‌های کسب اطلاعات برای سرقت هویت</h3>
<p>حالا که فهمیدیم سرقت هویت چیست، بیایید ببینیم یک مهاجم چطور اطلاعات لازم برای آن را به دست می‌آورد. این روش‌ها را می‌توانید به‌عنوان یک چک‌لیست در نظر بگیرید:</p>

<img src="images/CEHv13_09/slide_51.webp" alt="Identity Theft Methods" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۵۱: روش‌های به دست آوردن اطلاعات برای سرقت هویت</div>

<ul>
<li><strong>سرقت کامپیوتر، تلفن همراه یا کیف پول:</strong> ساده‌ترین و مستقیم‌ترین راه. اگر لپ‌تاپ شما دزدیده شود، مهاجم به تمام فایل‌های شخصی شما دسترسی پیدا می‌کند.</li>
<li><strong>جستجو در اینترنت:</strong> بسیاری از افراد اطلاعات شخصی خود را در شبکه‌های اجتماعی، وبلاگ‌ها یا انجمن‌ها منتشر می‌کنند.</li>
<li><strong>مهندسی اجتماعی:</strong> فریب دادن قربانی برای افشای اطلاعات (مثلاً با تماس تلفنی جعلی از طرف بانک).</li>
<li><strong>Shoulder Surfing و Dumpster Diving:</strong> نگاه کردن از روی شانه و جستجو در زباله‌ها برای یافتن اسناد حاوی اطلاعات هویتی.</li>
<li><strong>Phishing:</strong> ارسال ایمیل‌های جعلی برای دریافت اطلاعات بانکی.</li>
<li><strong>Skimming:</strong> نصب دستگاه‌های جعلی روی عابربانک برای کپی کردن اطلاعات کارت بانکی.</li>
<li><strong>دسترسی و در اختیار گرفتن سیستم کاربر:</strong> نفوذ به کامپیوتر قربانی و استخراج فایل‌های حاوی اطلاعات هویتی.</li>
<li><strong>استفاده از بدافزار:</strong> نصب کی‌لاگر یا جاسوس‌افزار برای سرقت اطلاعات.</li>
</ul>

<div class="box warning"><i class="fas fa-id-card"></i><div><strong>چرا سرقت هویت خطرناک است؟</strong>برخلاف سرقت پول که ممکن است جبران شود، سرقت هویت می‌تواند سال‌ها طول بکشد تا پاک شود. مهاجم می‌تواند با هویت شما وام بگیرد، خانه اجاره کند، یا حتی جرم مرتکب شود و شما را درگیر کند. به همین دلیل، حفاظت از اطلاعات هویتی بسیار حیاتی است.</div></div>

<h3>۲-۱. مقابله با سرقت هویت</h3>
<p>وقتی فهمیدیم چه روش‌هایی برای سرقت هویت استفاده می‌شود، مقابله هم روشن می‌شود: باید دسترسی مهاجم به این روش‌ها را محدود کنیم. اقدامات زیر را می‌توان به کار برد:</p>

<img src="images/CEHv13_09/slide_53.webp" alt="Identity Theft Countermeasures" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۵۳: روش‌های مقابله با سرقت هویت</div>

<ul>
<li>تمام اسناد حاوی اطلاعات خصوصی خود را ایمن‌سازی یا خرد کنید.</li>
<li>مطمئن شوید نام شما در لیست‌های بازاریاب‌ها وجود ندارد.</li>
<li>صورت‌حساب کارت اعتباری خود را به‌طور منظم بررسی کرده و آن را دور از دسترس دیگران نگهداری کنید.</li>
<li>هرگز اطلاعات شخصی خود را از طریق تلفن بیان نکنید (مگر اینکه مطمئن باشید با یک نهاد معتبر صحبت می‌کنید).</li>
<li>ایمیل‌های دریافتی را سریعاً از صندوق پستی خالی کرده و ایمن نگه دارید.</li>
<li>در مورد تمام درخواست‌ها برای اطلاعات شخصی، با احتیاط و دقت عمل کرده و آن‌ها را تأیید کنید.</li>
<li>از عمومی شدن اطلاعات شخصی خود جلوگیری کنید.</li>
<li>مگر در موارد ضروری، هیچ‌گونه شماره حساب یا اطلاعات تماس را نمایش ندهید یا به اشتراک نگذارید.</li>
<li>فعالیت‌های بانکی آنلاین خود را به‌طور مرتب بررسی کنید.</li>
<li>هیچ‌گونه شناسه شخصی (مانند کد ملی، شماره کارت) را در شبکه‌های اجتماعی منتشر نکنید.</li>
</ul>

<p>حالا که می‌دانیم چطور از اطلاعات هویتی خود محافظت کنیم، بیایید ببینیم مهاجم در فضای شبکه‌های اجتماعی چطور از هویت افراد سوءاستفاده می‌کند.</p>

<h2>02. جعل هویت در شبکه‌های اجتماعی (Impersonation)</h2>
<p>شبکه‌های اجتماعی به یک میدان جنگ جدید برای مهاجمان تبدیل شده‌اند. مهاجم با ساختن یک پروفایل جعلی از یک فرد یا شرکت، سعی می‌کند اعتماد دیگران را جلب کند و به اطلاعات یا منابع آن‌ها دسترسی پیدا کند.</p>

<p>سایت‌های شبکه‌های اجتماعی یک منبع گسترده از اطلاعات شخصی و سازمانی هستند. مهاجم می‌تواند با ایجاد یک پروفایل جعلی از یک کارمند شرکت، با همکاران او ارتباط برقرار کند و از آن‌ها اطلاعات حساس (مثل نام پروژه‌ها، جزئیات شبکه یا حتی رمز عبور) بگیرد.</p>

<img src="images/CEHv13_09/slide_52.webp" alt="Social Media Impersonation" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۵۲: نمونه‌ای از جمع‌آوری اطلاعات از طریق پروفایل جعلی در LinkedIn</div>

<div class="box note"><i class="fas fa-user-secret"></i><div><strong>یک سناریوی واقعی از حمله به LinkedIn:</strong>مهاجم یک پروفایل جعلی با نام «مدیر استخدام» در LinkedIn می‌سازد. سپس با کارمندان یک شرکت تماس می‌گیرد و می‌گوید: «ما در حال استخدام برای یک موقعیت شغلی عالی هستیم. لطفاً رزومه خود را ارسال کنید.» کارمند با ارسال رزومه، اطلاعات شخصی خود (شماره تماس، آدرس، سابقه کاری) را فاش می‌کند. مهاجم از این اطلاعات برای حملات بعدی (مثل فیشینگ هدفمند) استفاده می‌کند.</div></div>

<p>تا اینجا تهدید از بیرون سازمان می‌آمد؛ یا از طریق سرقت هویت یا از طریق پروفایل جعلی. اما تهدیداتی وجود دارند که از داخل سازمان شروع می‌شوند و به همین دلیل بسیار خطرناک‌ترند.</p>

<h2>03. تهدیدات داخلی (Insider Threats)</h2>
<p>حالا به خطرناک‌ترین بخش این جلسه می‌رسیم: <strong>تهدیدات داخلی</strong>. تهدید داخلی به خطری گفته می‌شود که از طرف فردی درون سازمان (مثل کارمند، پیمانکار یا شریک تجاری) متوجه اطلاعات یا سیستم‌های سازمان می‌شود. طبق آمار، حدود ۶۰ درصد از حملات از پشت فایروال (یعنی از داخل) اتفاق می‌افتد!</p>

<p>چرا تهدیدات داخلی این‌قدر خطرناک هستند؟ سه دلیل اصلی وجود دارد:</p>
<ul>
<li><strong>پیشگیری از آن‌ها سخت است:</strong> چون فرد داخلی دسترسی قانونی به سیستم دارد.</li>
<li><strong>شناسایی مهاجم دشوار است:</strong> چون رفتار او در ظاهر شبیه به یک کارمند عادی است.</li>
<li><strong>یک مهاجم داخلی به راحتی می‌تواند موفق شود:</strong> چون نیازی به دور زدن فایروال ندارد.</li>
</ul>

<h3>۱-۳. انواع تهدیدات داخلی</h3>
<p>تهدیدات داخلی فقط به معنای «کارمند ناراضی» نیست. بر اساس اسلاید ۴۴، چهار نوع تهدید داخلی وجود دارد که هر کدام انگیزه و رفتار متفاوتی دارند:</p>

<ul>
<li><strong>Malicious Insider (تهدید داخلی مخرب):</strong> یک کارمند ناراضی یا اخراج‌شده که داده‌های مربوط به سازمان را از روی عمد، توسط ایجاد یک بدافزار و انتشار آن، به سرقت برده و یا از بین می‌برد.</li>
<li><strong>Negligent Insider (تهدید داخلی سهل‌انگار):</strong> کارمندانی که از روی غفلت یا عدم آگاهی نسبت به تهدیدات امنیتی، اقدام به عبور از فرآیندهای امنیتی جهت ورود به بخش خاصی می‌کنند. مثلاً یک کارمند که برای راحتی بیشتر، رمز عبور خود را روی یک یادداشت چسبان می‌نویسد.</li>
<li><strong>Professional Insider (تهدید داخلی حرفه‌ای):</strong> کارمندان خطرناکی که از دانش فنی خود به منظور شناسایی نقاط ضعف و آسیب‌پذیری‌های سازمان نموده و آن را در اختیار رقبا قرار داده و یا آن‌ها را در Black Market ارائه می‌کنند.</li>
<li><strong>Compromised Insider (تهدید داخلی نفوذی):</strong> یک فرد خارجی که داخل سازمان بوده و به دارایی‌های حساس سازمان دسترسی دارد (مثلاً یک جاسوس که به عنوان پیمانکار استخدام شده است).</li>
</ul>

<h3>۲-۳. نشانه‌های وجود یک تهدید داخلی</h3>
<p>حالا که انواع آن را شناختیم، چطور می‌توانیم یک تهدید داخلی را در عمل شناسایی کنیم؟ برخی از نشانه‌های هشداردهنده عبارتند از:</p>
<ul>
<li>ورود به حساب‌های کاربری مختلف از سیستم‌های مختلف.</li>
<li>تلاش برای دسترسی به اطلاعاتی که در محدوده شغلی فرد نیست.</li>
<li>دانلود حجم زیادی از داده‌ها در زمان‌های غیرعادی (مثلاً نیمه‌شب).</li>
<li>استفاده از دستگاه‌های USB ناشناس.</li>
<li>بی‌تفاوتی نسبت به مسائل امنیتی یا ابراز نارضایتی از سازمان.</li>
</ul>

<h3>۳-۳. مقابله با تهدیدات داخلی</h3>
<p>برای مقابله با تهدیدات داخلی، باید ترکیبی از کنترل‌های فنی و مدیریتی را پیاده‌سازی کرد. هیچ یک به‌تنهایی کافی نیست:</p>

<img src="images/CEHv13_09/slide_57.webp" alt="Insider Threat Countermeasures" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۵۷: روش‌های مقابله با تهدیدات داخلی</div>

<ul>
<li><strong>بررسی پیشینه کارمندان (Background Check):</strong> قبل از استخدام، سابقه کیفری و اعتبار فرد بررسی شود.</li>
<li><strong>جداسازی و چرخش وظایف (Separation of Duties):</strong> هیچ کارمندی نباید به تنهایی کنترل کامل یک فرآیند حساس را در دست داشته باشد.</li>
<li><strong>اعمال دسترسی‌ها در سطوح پایین (Least Privilege):</strong> هر کارمند فقط به اندازه‌ای که برای انجام وظایفش لازم است، دسترسی داشته باشد.</li>
<li><strong>مانیتور نمودن کاربران دارای دسترسی بالا:</strong> فعالیت مدیران و ادمین‌ها باید به دقت رصد شود.</li>
<li><strong>غیرفعال نمودن تمامی دسترسی‌های کارمندانی که خاتمه همکاری داده‌اند:</strong> این یک اصل اساسی است. اگر حساب کاربری یک کارمند اخراج‌شده فعال بماند، یک درِ باز برای حمله است.</li>
<li><strong>بازبینی و ثبت لاگ‌ها:</strong> لاگ‌های سیستم باید به طور منظم بررسی شوند تا فعالیت‌های غیرعادی شناسایی شوند.</li>
<li><strong>امنیت فیزیکی و کنترل ورود و خروج:</strong> ورود و خروج افراد به بخش‌های حساس باید کنترل شود.</li>
<li><strong>نصب دوربین‌های مداربسته و مانیتور کردن تمام دارایی‌های حساس.</strong></li>
<li><strong>ایجاد سیاست‌های قانونی و آموزشی:</strong> کارمندان باید بدانند که چه رفتارهایی قابل قبول است و چه عواقبی دارد.</li>
<li><strong>استفاده از ابزارهای DLP (Data Loss Prevention):</strong> برای جلوگیری از خروج غیرمجاز داده‌ها.</li>
<li><strong>استفاده از ابزارهای IAM (Identity and Access Management):</strong> برای مدیریت هویت و دسترسی‌ها.</li>
</ul>
