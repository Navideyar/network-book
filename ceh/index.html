<div class="section-header"><div class="section-badge">15</div><div><h1>اجرا و پنهان‌سازی</h1><div class="meta">Module 06 · System Hacking · Session 3 of 4</div></div></div>

<p>در جلسه قبل یاد گرفتیم چطور به بالاترین سطح دسترسی (ادمین) برسیم. اما اگر نتوانیم خودمان و ابزارهایمان را پنهان کنیم، خیلی زود شناسایی و اخراج می‌شویم. در این جلسه، با ابزارهای جاسوسی مثل Keyloggerها و Spywareها آشنا می‌شویم، یاد می‌گیریم چطور با Rootkitها ردپای خود را محو کنیم و در نهایت، تکنیک جادویی پنهان‌سازی فایل در ویندوز (ADS) را بررسی می‌کنیم. </p>

<h2>01. اجرای برنامه‌ها (Executing Applications)</h2>
<p>در این مرحله، نفوذگر اقدام به اجرای برنامه‌های مخرب بر روی سیستم هدف می‌نماید. در برخی موارد به این مرحله <strong>مالکیت سیستم (Owning)</strong> نیز گفته می‌شود. چرا؟ چون وقتی یک برنامه مخرب (مثل بک‌دور یا کی‌لاگر) را نصب می‌کنید، عملاً کنترل سیستم را در دست گرفته‌اید و می‌توانید هر زمان که خواستید به آن برگردید.</p>

<img src="images/CEHv13_06/slide_34.webp" alt="Executing Applications" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۴: چرخه اجرای برنامه‌های مخرب (Keylogger، Spyware، Backdoor، Cracker)</div>

<p>چهار ابزار اصلی که در این مرحله استفاده می‌شوند عبارتند از:</p>
<ul>
<li><strong>Keylogger (کی‌لاگر):</strong> برای ثبت تمام کلیدهای فشرده‌شده توسط کاربر (مثل رمز عبور، پیام‌ها، شماره کارت).</li>
<li><strong>Spyware (جاسوس‌افزار):</strong> نرم‌افزاری که فعالیت‌های کاربر را بدون اطلاع او ضبط می‌کند.</li>
<li><strong>Backdoor (درب پشتی):</strong> راهی مخفی برای برگشتن به سیستم بدون نیاز به احراز هویت مجدد.</li>
<li><strong>Cracker (کرکر):</strong> ابزاری برای شکستن رمز عبور فایل‌ها یا سیستم.</li>
</ul>

<h2>02. انواع کی‌لاگرها (Keyloggers)</h2>
<p>کی‌لاگرها به دو دسته اصلی سخت‌افزاری و نرم‌افزاری تقسیم می‌شوند. یک هکر بسته به اینکه به سیستم قربانی دسترسی فیزیکی دارد یا نه، یکی از این دو را انتخاب می‌کند.</p>

<h3>۱-۲. کی‌لاگرهای سخت‌افزاری (Hardware Keyloggers)</h3>
<p>این کی‌لاگرها به صورت فیزیکی بین صفحه‌کلید و کامپیوتر قرار می‌گیرند. از آنجا که در سطح سیستم‌عامل نصب نمی‌شوند، آنتی‌ویروس‌ها و ابزارهای نرم‌افزاری نمی‌توانند آن‌ها را شناسایی کنند. برای نصب این نوع، مهاجم باید به سیستم قربانی دسترسی فیزیکی داشته باشد.</p>

<img src="images/CEHv13_06/slide_35.webp" alt="Hardware Keyloggers" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۵: انواع کی‌لاگرهای سخت‌افزاری (PS/2، USB، Wi-Fi، بلوتوث و تعبیه‌شده در کیبورد)</div>

<ul>
<li><strong>PS/2 Keylogger:</strong> در پورت قدیمی PS/2 قرار می‌گیرد (امروزه کمتر استفاده می‌شود).</li>
<li><strong>USB Keylogger:</strong> در پورت USB قرار می‌گیرد و ظاهری شبیه به یک فلش کوچک دارد.</li>
<li><strong>Wi-Fi / Bluetooth Keylogger:</strong> داده‌های فشرده‌شده را به صورت بی‌سیم به مهاجم می‌فرستد.</li>
<li><strong>Keylogger embedded in keyboard:</strong> کی‌لاگر مستقیماً داخل بدنه صفحه‌کلید تعبیه شده است (فقط با باز کردن پیچ‌های کیبورد قابل تشخیص است).</li>
</ul>

<h3>۲-۲. کی‌لاگرهای نرم‌افزاری (Software Keyloggers)</h3>
<p>این نوع، به صورت یک برنامه مخفی روی سیستم‌عامل نصب می‌شود و نیاز به دسترسی فیزیکی ندارد. می‌تواند از راه دور توسط هکر فعال شود. ابزارهای تجاری زیادی برای ویندوز و مک وجود دارند که برخی از آن‌ها عبارتند از:</p>
<ul>
<li><strong>برای ویندوز:</strong> Advanced Keylogger، Spyrix Personal Monitor، Elite Keylogger، REFOG Personal Monitor.</li>
<li><strong>برای مک (MAC):</strong> Aobo Mac Keylogger، Perfect Keylogger for Mac، Kid Logger for Mac.</li>
</ul>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>چرا کی‌لاگرها خطرناک هستند؟</strong> حتی اگر رمز عبور شما بسیار قوی و پیچیده باشد، کی‌لاگر تمام کاراکترهای وارد شده را ثبت می‌کند و به مهاجم می‌فرستد. به همین دلیل، همیشه توصیه می‌شود از کیبورد مجازی (On-Screen Keyboard) برای وارد کردن اطلاعات حساس در کامپیوترهای عمومی استفاده کنید.</div></div>

<h2>03. جاسوس‌افزارها (Spyware)</h2>
<p><strong>Spyware</strong> برنامه‌هایی هستند که فعالیت کاربر را بدون اینکه متوجه شود ضبط می‌کنند. این نرم‌افزارها بدون آشکارسازی خود اجرا می‌شوند و فایل‌ها، پردازش‌ها و دیگر قسمت‌های آن از دید کاربر پنهان می‌ماند تا از حذف شدن آن جلوگیری به عمل آید.</p>

<img src="images/CEHv13_06/slide_38.webp" alt="Spyware Concept" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۸: مفهوم جاسوس‌افزار و راه‌های انتشار آن</div>

<p><strong>راه‌های انتشار Spyware:</strong></p>
<ul>
<li>آسیب‌پذیری مرورگر وب (Web Browser Vulnerabilities).</li>
<li>اضافات یا Add-ons مخرب مرورگر.</li>
<li>تغییر ظاهر به عنوان یک نرم‌افزار امنیتی (Anti-Spyware جعلی).</li>
<li>از طریق دانلود نرم‌افزارهای رایگان (Freeware).</li>
</ul>

<p><strong>انواع Spyware:</strong></p>
<ul>
<li><strong>Desktop Spyware:</strong> ضبط فعالیت‌های روی دسکتاپ (مثل کلیک‌ها و پنجره‌ها).</li>
<li><strong>Email and Internet Spyware:</strong> ردیابی ایمیل‌ها و فعالیت‌های اینترنتی.</li>
<li><strong>Child Monitoring Spyware:</strong> نرم‌افزارهای کنترل والدین (که گاهی به اشتباه نصب می‌شوند).</li>
<li><strong>Audio/Video Spyware:</strong> دسترسی به میکروفون و دوربین.</li>
<li><strong>GPS Spyware:</strong> ردیابی موقعیت مکانی دستگاه.</li>
</ul>

<h2>04. مقابله با کی‌لاگر و جاسوس‌افزار</h2>
<p>چطور از خود در برابر این جاسوسان دیجیتال محافظت کنیم؟</p>

<h3>۱-۴. مقابله با Keylogger</h3>
<ul>
<li>نصب نرم‌افزارهای آنتی‌ویروس و بروزرسانی آن‌ها.</li>
<li>نصب یک HIDS (سیستم تشخیص نفوذ میزبان) یا فایروال نرم‌افزاری.</li>
<li>بررسی فیزیکی سیستم‌های سخت‌افزاری (مخصوصاً کابل‌های صفحه‌کلید) برای اطمینان از عدم نصب کی‌لاگر.</li>
<li>استفاده از ابزارهای ثبت کلید مجازی (Virtual Keyboard) با کاراکترهای به هم ریخته.</li>
<li>عدم کلیک بر روی لینک‌های ناخواسته در ایمیل‌ها و پیام‌ها.</li>
</ul>

<img src="images/CEHv13_06/slide_42.webp" alt="Anti Keylogger" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۲: نرم‌افزار Zemana AntiLogger (نمونه‌ای از Anti-Keylogger)</div>

<p>ابزارهای Anti-Keylogger مثل <strong>Zemana AntiLogger</strong>، KeyScrambler و Guarded ID با رمزنگاری ورودی‌های صفحه‌کلید، از ثبت آن‌ها توسط کی‌لاگرها جلوگیری می‌کنند.</p>

<h3>۲-۴. مقابله با Spyware</h3>
<ul>
<li>انجام تنظیمات امنیتی مرورگر (مثل مسدود کردن Pop-upها و افزونه‌های ناشناس).</li>
<li>عدم دانلود فایل‌های رایگان از منابع نامعتبر.</li>
<li>استفاده از حساب کاربری Administrator برای کارهای روزمره (مگر در موارد ضروری).</li>
<li>نصب و استفاده از برنامه‌های Anti-Spyware مثل <strong>SuperAntiSpyware</strong>، <strong>Spybot</strong> و <strong>Malwarebytes</strong>.</li>
<li>اسکن دوره‌ای سیستم برای کشف جاسوس‌افزارها.</li>
</ul>

<h2>05. پنهان‌سازی فایل‌ها با Rootkit</h2>
<p>حالا به بخش هیجان‌انگیز جلسه می‌رسیم: **چطور ردپای خود را پاک کنیم؟** قوی‌ترین ابزار برای این کار، <strong>Rootkit</strong> است.</p>
<p>روت‌کیت‌ها ابزارهایی هستند که حضور نفوذگر و فعالیت‌های مخرب وی را در سیستم قربانی مخفی می‌کنند. یک روت‌کیت می‌تواند شامل برنامه‌های درب پشتی، برنامه‌های DDoS، برنامه‌های شنود بسته، ابزارهای حذف لاگ‌ها و مانند این باشد. روت‌کیت‌ها معمولاً ابزارها و توابع سیستم‌عامل را با نسخه دستکاری‌شده‌ای از آن‌ها جایگزین کرده و موجب کاهش سطح امنیتی سیستم می‌شوند.</p>

<img src="images/CEHv13_06/slide_47.webp" alt="Rootkit Goals" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۷: اهداف روت‌کیت‌ها (گرفتن دسترسی Root، مخفی‌سازی ردپا، جمع‌آوری اطلاعات)</div>

<p><strong>نحوه توزیع روت‌کیت‌ها:</strong></p>
<ul>
<li>مخفی‌سازی آن در بسته‌ها و ابزارهای عمومی مانند بازی.</li>
<li>نصب آن بر روی کامپیوترهای عمومی یا کامپیوترهای یک شرکت از طریق مهندسی اجتماعی.</li>
<li>انجام حملات Zero Day.</li>
</ul>

<h3>انواع Rootkit</h3>
<p>روت‌کیت‌ها بر اساس سطح دسترسی و نحوه عملکرد به دسته‌های زیر تقسیم می‌شوند:</p>

<img src="images/CEHv13_06/slide_48.webp" alt="Types of Rootkit" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۸: انواع روت‌کیت بر اساس سطح عملکرد</div>

<ul>
<li><strong>Kernel Level Rootkit:</strong> کدهای مخرب به برنامه‌های هسته سیستم‌عامل اضافه یا جایگزین می‌شوند. خطرناک‌ترین نوع است چون در سطح Ring 0 اجرا می‌شود و کنترل کامل سیستم را در دست دارد.</li>
<li><strong>Application Level Rootkit:</strong> جایگزینی کدهای کتابخانه‌ای یا تغییر رفتار برنامه‌های موجود با تزریق کدهای مخرب.</li>
<li><strong>Hardware/Firmware Rootkit:</strong> در دستگاه‌های سخت‌افزاری یا فریم‌ور (مثل BIOS یا کارت شبکه) پنهان می‌شود و قابل بازیابی نیست.</li>
<li><strong>Boot Loader Level Rootkit:</strong> در این روش، بوت‌لودر اصلی (Boot Loader) سیستم‌عامل با یک نسخه دستکاری‌شده جایگزین می‌شود.</li>
<li><strong>Library Level Rootkit:</strong> توابع پرکاربرد سیستم‌عامل را با نسخه جعلی جایگزین می‌کند تا اطلاعات مربوط به مهاجم را مخفی کند.</li>
</ul>

<h3>شناسایی روت‌کیت</h3>
<p>چون روت‌کیت‌ها در سطح بسیار پایین کار می‌کنند، شناسایی آن‌ها با ابزارهای معمولی (مثل Task Manager) تقریباً غیرممکن است. روش‌های شناسایی:</p>
<ul>
<li><strong>Signature Based Detection:</strong> مقایسه مشخصات فرآیندها و فایل‌های سیستمی با پایگاه داده روت‌کیت‌های شناخته‌شده.</li>
<li><strong>Integrity Based Detection:</strong> مقایسه فایل‌های سیستم، رکوردهای بوت و حافظه با یک مورد پایه (Baseline) شناخته‌شده و قابل اطمینان.</li>
<li><strong>Heuristic Detection:</strong> استفاده از انحراف الگوهای طبیعی و رفتارها برای شناسایی روت‌کیت‌های ناشناخته.</li>
<li><strong>Runtime Execution Path Profiling:</strong> مقایسه مسیرهای اجرایی همه فرآیندهای سیستم قبل و بعد از تأثیرگذاری روت‌کیت.</li>
<li><strong>Analyzing Memory Dumps:</strong> بررسی فایل‌های Dump حافظه (Memory Dumps) برای پیدا کردن آثار روت‌کیت.</li>
</ul>

<h3>ابزارهای Anti-Rootkit و مقابله</h3>
<p>ابزارهایی مثل <strong>GMER</strong>، <strong>TDSSKiller</strong>، <strong>Rootkit Buster</strong> و <strong>Malwarebytes Anti-Rootkit</strong> برای شناسایی و پاک‌سازی روت‌کیت‌ها طراحی شده‌اند.</p>
<p><strong>مقابله با Rootkit:</strong></p>
<ul>
<li>نصب مجدد سیستم‌عامل از یک منبع مطمئن (تنها راه حل قطعی برای روت‌کیت‌های سطح هسته).</li>
<li>آموزش کارمندان برای عدم دانلود فایل از منابع ناشناس.</li>
<li>نصب فایروال‌های مبتنی بر میزبان (Host-based Firewall).</li>
<li>بروزرسانی وصله‌های امنیتی و آنتی‌ویروس.</li>
</ul>

<h2>06. جریان‌های داده جایگزین (Alternate Data Streams - ADS)</h2>
<p>این بخش یکی از جذاب‌ترین و پرکاربردترین تکنیک‌های پنهان‌سازی در آزمون CEH و دنیای واقعی است. <strong>ADS</strong> یک ویژگی در فایل‌سیستم <strong>NTFS</strong> (مربوط به ویندوز) است.</p>

<p>در فایل‌سیستم‌های قدیمی (مثل FAT32)، هر فایل فقط یک "جریان داده" (Data Stream) داشت. اما NTFS به هر فایل اجازه می‌دهد چندین جریان داده داشته باشد. جریان داده‌ی پیش‌فرض (که با باز کردن فایل می‌بینید) با <code>:$DATA</code> نشان داده می‌شود. اما شما می‌توانید یک جریان داده‌ی مخفی با یک نام دلخواه ایجاد کنید.</p>

<img src="images/CEHv13_06/slide_54.webp" alt="ADS Concept" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۵۴: نحوه ایجاد یک جریان داده مخفی در Notepad (بدون تغییر در حجم فایل اصلی)</div>

<p><strong>نحوه ایجاد ADS با Notepad:</strong></p>
<div class="code-container"><div class="code-label">cmd · ads</div><pre class="code-block">c:\\> notepad myfile.txt:lion.txt</pre></div>
<p>با اجرای این دستور، یک فایل متنی جدید (lion.txt) داخل فایل myfile.txt (که در ظاهر حجمش تغییر نمی‌کند) ایجاد می‌شود. اگر فایل myfile.txt را باز کنید، هیچ متنی نمی‌بینید، اما اگر همین دستور را دوباره اجرا کنید، متن مخفی را مشاهده خواهید کرد.</p>

<p><strong>چرا ADS خطرناک است؟</strong> چون می‌توان یک فایل اجرایی مخرب (مثل Trojan.exe) را داخل یک فایل متنی بی‌خطر (مثل Readme.txt) پنهان کرد. در ظاهر، فایل Readme.txt حجم 0 بایت دارد و هیچ آنتی‌ویروسی به آن شک نمی‌کند، اما فایل مخرب درون آن پنهان است.</p>

<img src="images/CEHv13_06/slide_55.webp" alt="ADS Execution" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۵۵: نحوه جاسازی Trojan.exe در فایل Readme.txt و اجرای آن از طریق mklink</div>

<p><strong>مراحل پنهان‌سازی و اجرای فایل مخرب با ADS:</strong></p>
<ol>
<li><strong>انتقال فایل مخرب به ADS:</strong> دستور <code>type c:\\Trojan.exe &gt; c:\\Readme.txt:Trojan.exe</code> فایل Trojan.exe را داخل جریان داده‌ی Readme.txt قرار می‌دهد. حجم Readme.txt همچنان ۰ بایت است!</li>
<li><strong>ایجاد یک لینک (Shortcut) به فایل مخفی:</strong> دستور <code>mklink backdoor.exe Readme.txt:Trojan.exe</code> یک فایل اجرایی (backdoor.exe) می‌سازد که در واقع به Trojan.exe مخفی اشاره می‌کند.</li>
<li><strong>اجرا:</strong> با دستور <code>backdoor</code> یا دابل کلیک روی backdoor.exe، فایل مخرب اجرا می‌شود.</li>
</ol>

<div class="box warning"><i class="fas fa-eye-slash"></i><div><strong>چگونه ADS را شناسایی کنیم؟</strong> دستور <code>dir</code> در ویندوز ADS را نشان نمی‌دهد. برای دیدن آن باید از دستور <code>dir /r</code> استفاده کنید یا از ابزارهای تخصصی مثل <strong>Stream Armor</strong>، <strong>ADS Scanner</strong> و <strong>GMER</strong> استفاده نمایید.</div></div>

<p><strong>۱.</strong> پس از نفوذ، مهاجم ابزارهای مخرب مثل Keylogger (سخت‌افزاری/نرم‌افزاری) و Spyware را برای جمع‌آوری اطلاعات اجرا می‌کند.</p>
<p><strong>۲.</strong> کی‌لاگرهای سخت‌افزاری در سطح سیستم‌عامل نصب نمی‌شوند و آنتی‌ویروس‌ها نمی‌توانند آن‌ها را شناسایی کنند. برای مقابله با کی‌لاگرهای نرم‌افزاری از Anti-Keylogger و کیبورد مجازی استفاده کنید.</p>
<p><strong>۳.</strong> Spywareها برای ردیابی فعالیت‌های کاربر و سرقت اطلاعات طراحی شده‌اند و با Anti-Spywareهایی مثل Malwarebytes و SuperAntiSpyware قابل شناسایی هستند.</p>
<p><strong>۴.</strong> Rootkitها خطرناک‌ترین ابزار پنهان‌سازی هستند که در سطوح مختلف (Kernel، Application، Bootloader، Library) عمل می‌کنند. شناسایی آن‌ها با روش‌های Signature، Integrity، Heuristic و Memory Dump انجام می‌شود.</p>
<p><strong>۵.</strong> بهترین راه مقابله با روت‌کیت‌های سطح هسته، نصب مجدد سیستم‌عامل است.</p>

<div class="section-header"><div class="section-badge">16</div><div><h1>پاک کردن ردپا</h1><div class="meta">Module 06 · System Hacking · Session 4 of 4</div></div></div>

<p>به چهارمین و آخرین جلسه از فصل System Hacking رسیدیم. تا اینجا یاد گرفتیم وارد سیستم شویم، دسترسی خود را بالا ببریم و ابزارهای جاسوسی را نصب کنیم. اما فرض کنید یک کارآگاه وارد صحنه جرم می‌شود. اگر ما اثر انگشت، رد پا و DNA خودمان را روی صحنه جا گذاشته باشیم، خیلی زود شناسایی می‌شویم. در دنیای سایبری، این «اثر انگشت» همان <strong>لاگ‌ها (Logs)</strong>، <strong>تایم‌استمپ‌ها (Timestamps)</strong> و <strong>فایل‌های موقت</strong>ی هستند که ویندوز و لینوکس به طور خودکار ثبت می‌کنند. در این جلسه، یاد می‌گیریم چطور این ردپاها را پاک کنیم. اما مهم‌تر از یادگیری تکنیک، باید بفهمیم <strong>چرا</strong> این ردپاها وجود دارند، چون تنها در این صورت است که می‌فهمیم چطور باید آن‌ها را محو کنیم.</p>

<h2>01. مفهوم Covering Tracks و منطق پشت آن</h2>
<p>وقتی یک مهاجم وارد سیستم می‌شود، سیستم‌عامل به طور خودکار شروع به ثبت رویدادها می‌کند. این ثبت رویدادها برای مدیران شبکه یک نعمت است (چون می‌توانند بفهمند چه اتفاقی افتاده) و برای مهاجم یک دردسر بزرگ (چون همه‌چیز ثبت شده است). بنابراین، آخرین مرحله از هر حمله سایبری، <strong>پاک کردن این ردپاها</strong> است.</p>
<p>روش‌های پاک کردن ردپا در سه سطح انجام می‌شود:</p>
<ol>
<li><strong>سطح لاگ‌های سیستم‌عامل:</strong> پاک کردن یا دستکاری Event Logهای ویندوز یا Syslogهای لینوکس.</li>
<li><strong>سطح ردپای فایل‌سیستم:</strong> پاک کردن تایم‌استمپ‌های دسترسی، غیرفعال کردن قابلیت‌های ویندوز که ردپا به جا می‌گذارند.</li>
<li><strong>سطح لاگ‌های برنامه‌ها:</strong> پاک کردن تاریخچه دستورات شل (Bash History) در لینوکس.</li>
</ol>

<div class="box note"><i class="fas fa-search"></i><div><strong>نبرد مهاجم و تحلیل‌گر فارنزیک:</strong> هر تکنیکی که در این جلسه یاد می‌گیرید، در واقع یک پاسخ به یک روش فارنزیکی است. تحلیل‌گر دنبال «شواهد» است، و مهاجم دنبال «حذف شواهد». مثلاً تحلیل‌گر از لاگ‌ها استفاده می‌کند، پس مهاجم لاگ‌ها را پاک می‌کند. تحلیل‌گر از Timestamp دسترسی به فایل‌ها استفاده می‌کند، پس مهاجم آن را غیرفعال می‌کند. این یک بازی گربه و موش است.</div></div>

<h2>02. پاک کردن لاگ‌های ویندوز (Windows Event Logs)</h2>
<p>ویندوز به طور پیش‌فرض سه نوع لاگ اصلی ثبت می‌کند: <strong>Security</strong> (رویدادهای امنیتی مثل لاگین)، <strong>System</strong> (رویدادهای سیستم‌عامل) و <strong>Application</strong> (رویدادهای برنامه‌ها). وقتی مهاجم وارد سیستم می‌شود، این لاگ‌ها پر از شواهد می‌شوند. پس چطور آن‌ها را پاک کنیم؟</p>

<h3>۱-۲. ابزار Auditpol (مدیریت ممیزی)</h3>
<p>ابزار خط فرمان <code>auditpol</code> در ویندوز برای مدیریت «سیاست‌های ممیزی» (Audit Policies) طراحی شده است. اما یک مهاجم از این ابزار برای پاک کردن سیاست‌های ممیزی استفاده می‌کند تا از این به بعد سیستم هیچ رویدادی را ثبت نکند!</p>

<img src="images/CEHv13_06/slide_63.webp" alt="Auditpol" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۶۳: ابزار Auditpol</div>

<p>دستوراتی که در اسلاید ۷۴ آمده‌اند، به ترتیب:</p>
<div class="code-container"><div class="code-label">cmd · auditpol</div><pre class="code-block">auditpol /get /category:*                              &#8592; دیدن تنظیمات فعلی ممیزی
auditpol /set /category:"system","account logon" /success:enable /failure:enable  &#8592; فعال کردن ثبت رویدادها (برای تست)
auditpol /clear /y                                     &#8592; پاک کردن تمام تنظیمات ممیزی (ردپا محو می‌شود)
auditpol \\\\IP /disable                               &#8592; غیرفعال کردن ممیزی روی یک سیستم از راه دور
elsev -s \\\\ip -l security -c                        &#8592; پاک کردن لاگ‌های امنیتی یک سیستم از راه دور</pre></div>

<p><strong>چرا این کار جواب می‌دهد؟</strong> چون سیستم‌های امنیتی و تحلیل‌گران به این لاگ‌ها وابسته‌اند. اگر لاگ نباشد، حمله‌ای که رخ داده، در نظر تحلیل‌گر «هیچ اتفاقی نیفتاده» به نظر می‌رسد. البته یک تحلیل‌گر حرفه‌ای متوجه می‌شود که لاگ‌ها پاک شده‌اند (مثلاً فاصله زمانی خالی در لاگ‌ها یا تغییر تنظیمات ممیزی خودش یک نشانه است!)، اما برای مهاجم آماتور کارساز است.</p>

<h3>۲-۲. ابزارهای پاک کردن لاگ</h3>
<p>ابزارهای متعددی برای پاک کردن لاگ‌های ویندوز وجود دارد که دو نمونه معروف آن‌ها عبارتند از:</p>
<ul>
<li><strong>clearlogs.exe:</strong> یک ابزار خط فرمان که لاگ‌های Security، System و Application را پاک می‌کند.</li>
<li><strong>Meterpreter (از Metasploit):</strong> اگر سیستم با Metasploit هک شده باشد، مهاجم می‌تواند از دستور <code>clearev</code> در شل Meterpreter استفاده کند تا تمام لاگ‌های ویندوز را پاک کند.</li>
</ul>

<div class="image-caption">اسلاید ۶۴: ابزار clearlogs.exe و دستور clearev در Meterpreter</div>

<h2>03. غیرفعال کردن قابلیت‌های ویندوز (برای جلوگیری از ثبت ردپا)</h2>
<p>این بخش جذاب‌ترین قسمت این جلسه است، چون درک آن نیازمند دانستن این است که «ویندوز اصلاً چرا این قابلیت‌ها را دارد؟». هر قابلیتی که در ادامه می‌بینید، در اصل برای بهبود عملکرد و راحتی کاربر طراحی شده، اما هر کدام می‌توانند به عنوان یک شاهد علیه مهاجم عمل کنند. پس مهاجم آن‌ها را غیرفعال می‌کند.</p>

<h3>۱-۳. غیرفعال کردن Timestamp آخرین دسترسی (Last Access Timestamp)</h3>
<p>ویندوز به طور پیش‌فرض هر بار که یک فایل را باز می‌کنید (حتی فقط برای خواندن)، زمان آن را در فایل ثبت می‌کند. این یعنی تحلیل‌گر می‌تواند بفهمد مهاجم چه فایل‌هایی را و در چه زمانی باز کرده است.</p>
<p>برای غیرفعال کردن این قابلیت، از دستور زیر استفاده می‌شود:</p>
<div class="code-container"><div class="code-label">cmd · fsutil</div><pre class="code-block">fsutil behavior set disablelastaccess 1</pre></div>

<img src="images/CEHv13_06/slide_66.webp" alt="Disable Last Access" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۶۶: غیرفعال کردن Last Access Timestamp با دستور fsutil</div>

<div class="box warning"><i class="fas fa-info-circle"></i><div><strong>نکته مهم:</strong> از ویندوز ویستا به بعد، این قابلیت به طور پیش‌فرض غیرفعال شده است. اما در بسیاری از سازمان‌ها هنوز فعال است. مهاجم با اجرای این دستور، مطمئن می‌شود که حتی اگر سیستم فعال باشد، دیگر تایم‌استمپی ثبت نشود.</div></div>

<h3>۲-۳. غیرفعال کردن Hibernation (خواب زمستانی)</h3>
<p>وقتی سیستم را در حالت Hibernate قرار می‌دهید، ویندوز تمام محتویات RAM را در یک فایل مخفی به نام <code>hiberfil.sys</code> در ریشه درایو ذخیره می‌کند. این فایل ممکن است حاوی اطلاعات حساسی مثل رمزهای عبور باز، کلیدهای رمزنگاری و حتی شواهد فعالیت مهاجم باشد.</p>
<p>تحلیل‌گر فارنزیک می‌تواند این فایل را استخراج کرده و از آن برای بازسازی صحنه جرم استفاده کند. پس مهاجم Hibernate را غیرفعال می‌کند تا این فایل تولید نشود.</p>

<img src="images/CEHv13_06/slide_67.webp" alt="Disable Hibernation" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۶۷: غیرفعال کردن Hibernate از طریق رجیستری</div>

<h3>۳-۳. غیرفعال کردن Paging File (حافظه مجازی)</h3>
<p>Paging File (یا Virtual Memory) یک فایل روی هارد است که وقتی RAM پر می‌شود، ویندوز بخشی از داده‌ها را به آن منتقل می‌کند. این فایل می‌تواند حاوی داده‌های رمزگشایی‌شده باشد که مهاجم قبلاً رمز آن‌ها را شکسته است.</p>
<p>اگر مهاجم فایلی را رمزگشایی کرده باشد، حتی بعد از خروج او، ممکن است نسخه رمزگشایی‌شده در Paging File باقی بماند. تحلیل‌گر می‌تواند این فایل را بررسی کند. پس مهاجم Paging File را غیرفعال می‌کند تا این شواهد تولید نشوند.</p>

<img src="images/CEHv13_06/slide_68.webp" alt="Disable Paging File" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۶۸: غیرفعال کردن Paging File از تنظیمات System Properties</div>

<h3>۴-۳. غیرفعال کردن System Restore Points</h3>
<p>System Restore Points یا نقاط بازگردانی سیستم، به صورت دوره‌ای از فایل‌های سیستمی و رجیستری نسخه پشتیبان می‌گیرند. اگر مهاجم فایلی را حذف کند، ممکن است تحلیل‌گر آن را از یک Restore Point بازیابی کند! پس مهاجم تمام Restore Pointها را غیرفعال و پاک می‌کند.</p>

<img src="images/CEHv13_06/slide_69.webp" alt="Disable System Restore" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۶۹: غیرفعال کردن و پاک کردن System Restore Points</div>

<h3>۵-۳. غیرفعال کردن Thumbnail Cache (thumbs.db)</h3>
<p>وقتی یک پوشه را باز می‌کنید، ویندوز برای نمایش سریع‌تر، تصویر بندانگشتی (Thumbnail) تمام فایل‌های تصویری و اسناد را در یک فایل مخفی به نام <code>thumbs.db</code> ذخیره می‌کند. اگر مهاجم یک فایل مخرب را داخل یک تصویر پنهان کرده باشد و بعد آن تصویر را حذف کند، Thumbnail آن تصویر همچنان در <code>thumbs.db</code> باقی می‌ماند و تحلیل‌گر می‌فهمد که آن فایل قبلاً روی سیستم وجود داشته است.</p>

<img src="images/CEHv13_06/slide_70.webp" alt="Disable Thumbnail Cache" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۷۰: غیرفعال کردن Thumbnail Cache از طریق Group Policy</div>

<h3>۶-۳. غیرفعال کردن Prefetch</h3>
<p>Prefetch یکی از قابلیت‌های ویندوز است که اطلاعاتی درباره برنامه‌هایی که کاربر معمولاً اجرا می‌کند ذخیره می‌کند تا بارگذاری آن‌ها سریع‌تر شود. اما اگر مهاجم یک برنامه مخرب را نصب و بعد حذف کند، یک نسخه از آن برنامه در فایل‌های Prefetch (پوشه <code>C:\\Windows\\Prefetch</code>) باقی می‌ماند و تحلیل‌گر می‌تواند از آن برای شناسایی فعالیت‌های مشکوک استفاده کند.</p>

<img src="images/CEHv13_06/slide_71.webp" alt="Disable Prefetch" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۷۱: غیرفعال کردن سرویس SysMain (که مسئول Prefetch است)</div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>الگوی مشترک این ۶ تکنیک چیست؟</strong> هر کدام از این قابلیت‌های ویندوز، یک نوع ردپا (Timestamp، فایل Cache، فایل Dump) به جا می‌گذارند. مهاجم با غیرفعال کردن آن‌ها، سعی می‌کند اطمینان حاصل کند که هیچ شاهدی از فعالیت او باقی نماند. اما دقت کنید: <strong>غیرفعال کردن هر کدام از این قابلیت‌ها خودش یک تغییر سیستم است</strong> که ممکن است توسط ابزارهای مانیتورینگ شناسایی شود.</div></div>

<h2>04. پاک کردن ردپا در لینوکس (Bash History)</h2>
<p>در لینوکس، پوسته پیش‌فرض <code>bash</code> است. Bash هر دستوری که شما تایپ می‌کنید را در یک فایل به نام <code>~/.bash_history</code> ذخیره می‌کند. اگر مهاجم یک سری دستور برای اکسپلویت، نصب بک‌دور یا پاک کردن لاگ‌ها اجرا کرده باشد، همه آن‌ها در این فایل ثبت شده‌اند. تحلیل‌گر می‌تواند این فایل را بررسی کند و بفهمد مهاجم دقیقاً چه کاری انجام داده است.</p>

<img src="images/CEHv13_06/slide_72.webp" alt="Bash History" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۷۲: دستورات پاک کردن تاریخچه Bash</div>

<p>چند روش برای پاک کردن ردپا در Bash وجود دارد:</p>
<div class="code-container"><div class="code-label">bash · clear_history</div><pre class="code-block">export HISTSIZE=0                        &#8592; غیرفعال کردن تاریخچه برای جلسه فعلی
history -c                               &#8592; پاک کردن تاریخچه ذخیره‌شده در حافظه
history -w                               &#8592; پاک کردن تاریخچه از شل فعلی
cat /dev/null > ~/.bash_history          &#8592; خالی کردن کامل فایل تاریخچه
shred ~/.bash_history                    &#8592; بازنویسی و تخریب فایل تاریخچه (بهترین روش)
history -c && exit                       &#8592; پاک کردن و خروج</pre></div>

<p><strong>تفاوت <code>cat /dev/null</code> با <code>shred</code>:</strong> وقتی فایل را با <code>cat /dev/null</code> خالی می‌کنید، محتوای آن پاک می‌شود اما ممکن است داده‌های قدیمی همچنان روی دیسک باقی بمانند و با ابزارهای فارنزیک بازیابی شوند. اما <code>shred</code> فایل را چندین بار با داده‌های تصادفی بازنویسی می‌کند تا بازیابی آن تقریباً غیرممکن شود.</p>

<h2>05. پنهان‌سازی فایل در سیستم‌عامل (OS)</h2>
<p>روش‌های پنهان‌سازی فایل در ویندوز و لینوکس متفاوت است. در ویندوز از ADS (که در جلسه قبل یاد گرفتیم) استفاده می‌شود، اما در لینوکس روش ساده‌تر است:</p>

<img src="images/CEHv13_06/slide_73.webp" alt="Covering Tracks on OS" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۷۳: پنهان‌سازی فایل در ویندوز (ADS) و لینوکس (پیشوند نقطه)</div>

<ul>
<li><strong>در ویندوز:</strong> پنهان کردن فایل در NTFS Alternate Data Streams (ADS) با دستور <code>type c:\\SecretFile.txt &gt; c:\\LegitFile.txt:SecretFile.txt</code>.</li>
<li><strong>در لینوکس:</strong> کافی است یک نقطه (.) به ابتدای نام فایل اضافه کنید. فایل‌هایی که با نقطه شروع می‌شوند (مثل <code>.secret</code> یا <code>.hidden</code>) به طور پیش‌فرض در خروجی دستور <code>ls</code> نمایش داده نمی‌شوند (باید از <code>ls -a</code> استفاده کنید).</li>
</ul>

        const toFa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

        const allSections = [];
        course.forEach((ch, chIdx) => {
            ch.sections.forEach((sec, secIdx) => {
                allSections.push(Object.assign({}, sec, {
                    chapterId: ch.id,
                    chapterTitle: ch.title,
                    badge: ch.badge,
                    num: sec.num,
                    chapterIndex: chIdx,

                    totalInChapter: ch.sections.length
                }));
            });

        let currentIndex = 0;

        function buildTOC() {
            const toc = document.getElementById('tocNav');
            toc.innerHTML = '';
            course.forEach((ch, idx) => {
                const details = document.createElement('details');
                details.className = 'toc-chapter';
                if (idx === 0) details.open = true; 
                const summary = document.createElement('summary');
                summary.innerHTML = '<span class="chapter-num">' + ch.badge + '</span><span>' + ch.title + '</span>';
                details.appendChild(summary);
                const ul = document.createElement('ul');
                ul.className = 'toc-sections';
                ch.sections.forEach(sec => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = '#' + sec.id;
                    a.textContent = toFa(sec.num) + '. ' + sec.title;
                    a.dataset.id = sec.id;
                    a.addEventListener('click', function(e) {
                        e.preventDefault();
                        const index = allSections.findIndex(s => s.id === sec.id);
                        if (index !== -1) showSection(index);
                    });
                    li.appendChild(a);
                    ul.appendChild(li);
                });
                details.appendChild(ul);
                toc.appendChild(details);
            });
        }

        function buildSections() {
            const main = document.getElementById('mainContent');
            main.innerHTML = '';
            allSections.forEach((sec, idx) => {
                const div = document.createElement('div');
                div.className = 'section' + (idx === 0 ? ' active' : '');
                div.id = sec.id;
                const isFirst = idx === 0;
                const isLast = idx === allSections.length - 1;
                let body = '';
                if (richContent[sec.id]) {
                    body = richContent[sec.id];
                } else {
                    body = `
                        <div class="section-header">
                            <div class="section-badge">${sec.badge}</div>
                            <div>
                                <h1>${sec.title}</h1>
                                <div class="meta">Module ${sec.badge} · ${sec.chapterTitle} · Session ${toFa(sec.sectionIndex + 1)} of ${toFa(sec.totalInChapter)}</div>
                            </div>
                        </div>
                        <div class="placeholder">
                            <i class="fas fa-terminal"></i>
                            <p>محتوای این جلسه در حال آماده‌سازی است...</p>
                            <p style="font-size:0.88rem;margin-top:6px;opacity:0.7;">${sec.chapterTitle} — ${sec.title}</p>
                        </div>
                    `;
                }
                body += `
                    <div class="nav-buttons">
                        <button class="nav-btn" ${isFirst ? 'disabled' : ''} onclick="goToPrev()">
                            ${isFirst ? 'جلسه قبلی' : '<i class="fas fa-arrow-right"></i> جلسه قبلی'}
                        </button>
                        <button class="nav-btn" ${isLast ? 'disabled' : ''} onclick="goToNext()">
                            ${isLast ? 'پایان' : 'جلسه بعدی <i class="fas fa-arrow-left"></i>'}
                        </button>
                    </div>
                `;
                div.innerHTML = body;
                main.appendChild(div);
            });
        }

        function showSection(index) {
            if (index < 0 || index >= allSections.length) return;
            currentIndex = index;
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(allSections[index].id);
            if (target) target.classList.add('active');
            document.querySelectorAll('.toc-sections a').forEach(a => {
                a.classList.remove('active');
                if (a.dataset.id === allSections[index].id) a.classList.add('active');
            });
            const chIdx = allSections[index].chapterIndex;
            document.querySelectorAll('.toc-chapter').forEach((d, i) => { d.open = (i === chIdx); });
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (window.innerWidth <= 1000) closeSidebar();
        }

        function goToPrev() { if (currentIndex > 0) showSection(currentIndex - 1); }
        function goToNext() { if (currentIndex < allSections.length - 1) showSection(currentIndex + 1); }

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const toggleBtn = document.getElementById('sidebarToggle');
        const closeBtn = document.getElementById('sidebarClose');

        function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = ''; }

        toggleBtn.addEventListener('click', openSidebar);
        closeBtn.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') !== 'light';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('ceh-theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.querySelector('.theme-icon');
            if (!icon) return;
            if (theme === 'light') {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            } else {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
        }

        const savedTheme = localStorage.getItem('ceh-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme === 'light' ? 'light' : 'dark');
        updateThemeIcon(savedTheme);

        function selectOption(btn) {

            parent.querySelectorAll('button').forEach(b => {
                b.classList.remove('selected', 'correct', 'wrong');
                if (b.dataset.correct === 'true') b.classList.add('correct');
            });
            if (!isCorrect) btn.classList.add('wrong');
            parent.nextElementSibling.classList.add('show');
        }

        window.onscroll = function() {
            const scroll = document.documentElement.scrollTop || document.body.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            document.getElementById('progressBar').style.width = (height > 0 ? (scroll / height * 100) : 0) + '%';
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSidebar();
            if (e.key === 'ArrowLeft') goToNext();
            if (e.key === 'ArrowRight') goToPrev();
        });

        function wrapTables() {
            document.querySelectorAll('.section table').forEach(function(table) {
                if (table.parentElement && table.parentElement.classList.contains('table-wrap')) return;
                var wrap = document.createElement('div');
                wrap.className = 'table-wrap';
                table.parentNode.insertBefore(wrap, table);
                wrap.appendChild(table);
            });
        }


        // ---------- بهبودهای ظاهری درسنامه ----------
        // شماره‌ی ابتدای تیترهای h2 (مثل «01.») به صورت چیپ جدا نمایش داده می‌شود
        function enhanceHeadings() {
            document.querySelectorAll('.section h2').forEach(function(h) {
                if (h.classList.contains('has-num')) return;
                var m = h.textContent.match(/^\s*([0-9۰-۹]{1,3})\s*[.\-–:]\s*(.+)$/s);
                if (!m) return;
                h.classList.add('has-num');
                h.innerHTML = '<span class="h2-num"></span><span class="h2-text"></span>';
                h.querySelector('.h2-num').textContent = m[1];
                h.querySelector('.h2-text').textContent = m[2];
            });
        }

        // هر تصویر اسلاید + کپشن داخل یک کادر (figure) و قابل بزرگ‌نمایی
        function enhanceSlides() {
            document.querySelectorAll('.section img.pdf-image').forEach(function(img) {
                if (img.parentElement.classList.contains('slide-fig')) return;
                var fig = document.createElement('figure');
                fig.className = 'slide-fig';
                img.parentNode.insertBefore(fig, img);
                fig.appendChild(img);
                var cap = fig.nextElementSibling;
                if (cap && cap.classList.contains('image-caption')) fig.appendChild(cap);
                img.decoding = 'async';
                img.addEventListener('click', function() { openLightbox(img); });
            });
        }

        var lightbox = document.getElementById('lightbox');
        function openLightbox(img) {
            document.getElementById('lightboxImg').src = img.currentSrc || img.src;
            document.getElementById('lightboxImg').alt = img.alt || '';
            var cap = img.parentElement.querySelector('.image-caption');
            document.getElementById('lightboxCap').textContent = cap ? cap.textContent : '';
            lightbox.classList.add('open');
            lightbox.setAttribute('aria-hidden', 'false');
        }
        function closeLightbox() {
            lightbox.classList.remove('open');
            lightbox.setAttribute('aria-hidden', 'true');
        }
        lightbox.addEventListener('click', closeLightbox);
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });

        // اندازه‌ی فونت (ذخیره در مرورگر)
        var fontScale = parseFloat(localStorage.getItem('ceh-fs')) || 1;
        function applyFont() { document.documentElement.style.setProperty('--fs', fontScale); }
        function changeFont(dir) {
            fontScale = Math.min(1.3, Math.max(0.85, Math.round((fontScale + dir * 0.05) * 100) / 100));
            localStorage.setItem('ceh-fs', fontScale);
            applyFont();
        }
        applyFont();

        buildTOC();
        buildSections();
        wrapTables();
        enhanceHeadings();
        enhanceSlides();
        showSection(0); // شروع از جلسه ۱
    </script>

</body>
</html>
