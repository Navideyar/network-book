<h2>02. ابزارهای Footprinting</h2>
<p>علاوه بر روش‌های دستی، ابزارهای قدرتمندی برای اتوماتیک‌سازی فرآیند Footprinting وجود دارند که سرعت و دقت کار را چندین برابر می‌کنند:</p>

<img src="images/CEHv13_02/slide_36.webp" alt="Footprinting Tools" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۶: ابزارهای پیشرفته Footprinting</div>

<ul>
<li><strong>Maltego:</strong> یک ابزار قدرتمند برای تحلیل داده‌ها و کشف روابط بین موجودیت‌ها (افراد، سازمان‌ها، دامنه‌ها، IPها). Maltego این روابط را به صورت گرافیکی (نمودار) نمایش می‌دهد.</li>
<li><strong>Recon-ng:</strong> یک چارچوب (Framework) ماژولار برای Footprinting و Reconnaissance که شبیه به Metasploit عمل می‌کند و از ماژول‌های مختلف برای جمع‌آوری اطلاعات از منابع عمومی (OSINT) استفاده می‌کند.</li>
<li><strong>FOCA:</strong> ابزاری برای استخراج متادیتا (Metadata) از اسناد (مثل PDF، Word، Excel) که به‌طور عمومی در وب‌سایت‌ها منتشر شده‌اند. متادیتا می‌تواند شامل نام کاربری، مسیرهای شبکه، نرم‌افزارهای استفاده‌شده و حتی رمزهای عبور باشد!</li>
<li><strong>Metagoofil:</strong> مشابه FOCA، برای استخراج متادیتا از فایل‌های عمومی طراحی شده است.</li>
<li><strong>ابزارهای دیگر:</strong> Prefix Whois، Netmask، Net Scan Tools Pro، Binging، Tctrace، Search Bug.</li>
</ul>

<div class="box note"><i class="fas fa-search-plus"></i><div><strong>چرا FOCA خطرناک است؟</strong>سازمان‌ها اغلب فایل‌های PDF یا Word خود (مثل بروشورها یا گزارش‌های مالی) را به صورت آنلاین قرار می‌دهند. این فایل‌ها حاوی متادیتای پنهانی هستند که ممکن است شامل نام نویسنده، مسیر ذخیره‌سازی (مثل <code>C:\\Users\\Admin\\Desktop\\SecretProject</code>) و حتی نام سرورهای داخلی باشد. FOCA این اطلاعات را استخراج کرده و نقشه‌ای از شبکه داخلی به مهاجم می‌دهد.</div></div>

<h2>03. ابزارهای OSINT مبتنی بر هوش مصنوعی (AI-Powered OSINT)</h2>
<p>هوش مصنوعی انقلابی در جمع‌آوری اطلاعات ایجاد کرده است. ابزارهای AI-Powered OSINT می‌توانند حجم عظیمی از داده‌ها را در چند ثانیه تحلیل کنند و الگوهایی را کشف کنند که برای انسان‌ها قابل مشاهده نیست.</p>

<img src="images/CEHv13_02/slide_37.webp" alt="Taranis AI" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۷: Taranis AI و ابزارهای OSINT مبتنی بر هوش مصنوعی</div>

<ul>
<li><strong>Taranis AI:</strong> یک ابزار OSINT است که با استفاده از هوش مصنوعی، اطلاعاتی را از منابع متنوع مثل وب‌سایت‌ها و خبرگزاری‌ها استخراج می‌کند. کاربرد اصلی آن در تحلیل ریسک در فضای سایبری، نظارت بر اخبار امنیتی درباره یک کشور، سازمان یا فرد است. Taranis AI برای سناریوهایی مثل تحلیل لحظه‌ای تهدیدات سایبری، پایش ریسک رسانه‌ای یا پیش‌بینی بحران‌های امنیتی، ابزاری بسیار هوشمند و کارآمد محسوب می‌شود.</li>
<li><strong>DorkGPT و DorkGenius:</strong> ابزارهای مبتنی بر AI برای تولید خودکار Google Dorkهای پیشرفته. شما یک هدف را وارد می‌کنید و AI بهترین Dorkها را برای یافتن اطلاعات حساس تولید می‌کند.</li>
<li><strong>DarkGPT:</strong> یک ابزار AI برای جستجو و تحلیل در وب تاریک (Dark Web). این ابزار می‌تواند به شناسایی تهدیدات و اطلاعات لو رفته در بازارهای سیاه کمک کند.</li>
<li><strong>سایر ابزارها:</strong> ossinsight.io، cyclect.io، exploreai.vercel.app</li>
</ul>

<h2>04. مقابله با Footprinting (Countermeasures)</h2>
<p>حالا که با قدرت Footprinting آشنا شدیم، وقت آن است که یاد بگیریم چطور از سازمان خود در برابر آن محافظت کنیم. مقابله با Footprinting شامل مسدود کردن دسترسی به اطلاعات و افزایش آگاهی است.</p>

<img src="images/CEHv13_02/slide_38.webp" alt="Footprinting Countermeasures" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۸: راه‌های مقابله با Footprinting</div>

<p>مهم‌ترین اقدامات دفاعی عبارتند از:</p>
<ul>
<li><strong>محدودسازی شبکه:</strong> محدود نمودن کارمندان برای دسترسی به سایت‌های شبکه‌های اجتماعی از طریق شبکه سازمان.</li>
<li><strong>پیکربندی صحیح سرور:</strong> پیکربندی صحیح وب سرور برای جلوگیری از نشت اطلاعات و غیرفعال کردن پروتکل‌های ناخواسته (مثل بستن Directory Listing در Apache).</li>
<li><strong>استفاده از IDS:</strong> استفاده از سیستم تشخیص نفوذ به منظور شناسایی ترافیک‌های مشکوک Footprinting.</li>
<li><strong>آموزش کارمندان:</strong> آموزش کارمندان برای استفاده از نام‌های مستعار در وبلاگ‌ها و انجمن‌ها و عدم افشای اطلاعات شخصی/سازمانی.</li>
<li><strong>ارزیابی اطلاعات:</strong> ارزیابی دقیق اطلاعات قبل از انتشار در وب‌سایت و عدم استفاده از اطلاعات حساس در گزارش‌های سالانه عمومی، اخبار یا کاتالوگ محصولات.</li>
</ul>

<img src="images/CEHv13_02/slide_39.webp" alt="Footprinting Countermeasures 2" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۹: اقدامات تکمیلی برای مقابله با Footprinting</div>

<p>اقدامات تکمیلی و فنی‌تر:</p>
<ul>
<li><strong>حفاظت از موقعیت مکانی:</strong> غیرفعال کردن Geo-Location در موبایل و غیرفعال کردن Geo-Tagging در دوربین‌ها.</li>
<li><strong>شبکه‌های اجتماعی:</strong> عدم انتشار موقعیت مکانی یا برنامه سفر در شبکه‌های اجتماعی.</li>
<li><strong>DNS امن:</strong> جدا سازی سرور DNS داخلی و خارجی با استفاده از Split DNS و محدودسازی Zone Transfer.</li>
<li><strong>رمزنگاری:</strong> رمزنگاری و محافظت با پسورد برای اطلاعات حساس.</li>
<li><strong>فیلتر ایمیل:</strong> جلوگیری از پذیرش ایمیل ناشناس توسط میل سرورها.</li>
<li><strong>جمع‌آوری اطلاعات علیه خود:</strong> اجرای عملیات Footprinting علیه سازمان خود و حذف اطلاعات حساس یافت‌شده (Self-Footprinting).</li>
</ul>

<div class="section-header"><div class="section-badge">08</div><div><h1>مفاهیم و کشف میزبان</h1><div class="meta">Module 03 · Scanning Networks · Session 1 of 3</div></div></div>

<p>تا اینجا یاد گرفتیم چطور بدون اینکه حتی یک بسته به سمت هدف بفرستیم، اطلاعات حیاتی جمع‌آوری کنیم. اما Footprinting فقط نیمی از داستان است. حالا وقت آن رسیده که وارد فاز دوم بشویم: <strong>Network Scanning (اسکن شبکه)</strong>. در این مرحله، ما به طور مستقیم با شبکه هدف تعامل می‌کنیم تا ببینیم چه میزبان‌هایی زنده هستند و چه پورت‌هایی بازند. با ما همراه باشید تا با تکنیک‌های کشف میزبان (Host Discovery) آشنا شویم.</p>

<h2>01. تعریف و اهداف Network Scanning</h2>
<p><strong>Network Scanning</strong> مجموعه‌ای از فرآیندهای مختلف برای شناسایی میزبان (Host)، پورت‌ها و سرویس‌های شبکه است که منجر به ایجاد یک پروفایل و نقشه از شبکه هدف می‌گردد. این فاز یکی از اجزای حیاتی جمع‌آوری اطلاعات (Information Gathering) است و شبیه به این است که مهاجم با ارسال بسته‌های TCP/IP (Probes) به شبکه، اطلاعاتی را از آن پس می‌گیرد.</p>

<img src="images/CEHv13_03/slide_3.webp" alt="Network Scanning Concept" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳: مفهوم اسکن شبکه (ارسال Probe و دریافت اطلاعات)</div>

<p>اهداف اصلی Network Scanning عبارتند از:</p>
<ul>
<li><strong>شناسایی میزبان‌های در دسترس:</strong> کدام کامپیوترها یا سرورها روشن و متصل به شبکه هستند؟</li>
<li><strong>شناسایی پورت‌های باز:</strong> روی آن میزبان‌ها چه پورت‌هایی (مثل 80، 443، 22) باز است؟</li>
<li><strong>شناسایی سیستم‌عامل و معماری:</strong> سیستم‌عامل هدف ویندوز است یا لینوکس؟ چه نسخه‌ای دارد؟</li>
<li><strong>شناسایی سرویس‌های در حال اجرا:</strong> روی پورت‌های باز چه سرویس‌هایی (مثل Apache، SSH، FTP) در حال اجرا هستند؟</li>
<li><strong>کشف آسیب‌پذیری‌ها:</strong> آیا سرویس‌های اجراشده دارای نقاط ضعف شناخته‌شده هستند؟</li>
</ul>

<div class="box note"><i class="fas fa-crosshairs"></i><div><strong>نکته طلایی</strong>در دنیای تست نفوذ اخلاقی، اسکن شبکه اولین مرحله‌ای است که در آن احتمال شناسایی شما توسط IDS/IPS وجود دارد. بنابراین، یک هکر اخلاقی باید بداند چطور با تکنیک‌های Stealth (مخفیانه) اسکن کند تا شناسایی نشود.</div></div>

<h2>02. ارتباط TCP/IP (TCP/IP Communication)</h2>
<p>برای درک بهتر اسکن شبکه، باید بدانیم که یک اتصال TCP چطور برقرار می‌شود و چطور پایان می‌یابد. این دانش پایه، اساس تمام تکنیک‌های اسکن است.</p>

<h3>۱-۲. برقراری اتصال (Three-way Handshake)</h3>
<p>هر اتصال TCP با یک دست‌دادن سه‌مرحله‌ای شروع می‌شود:</p>
<ol>
<li><strong>SYN:</strong> کلاینت یک بسته SYN با شماره توالی (SEQ) اولیه به سرور می‌فرستد. (درخواست برای برقراری ارتباط)</li>
<li><strong>SYN + ACK:</strong> سرور با یک بسته SYN+ACK پاسخ می‌دهد. (تأیید دریافت و درخواست متقابل)</li>
<li><strong>ACK:</strong> کلاینت یک بسته ACK نهایی می‌فرستد. (تأیید نهایی و برقراری اتصال)</li>
</ol>

<h3>۲-۲. پایان اتصال (TCP Session Termination)</h3>
<p>برای قطع اتصال، از یک فرآیند چهارمرحله‌ای با فلگ FIN استفاده می‌شود:</p>
<ol>
<li>کلاینت یک بسته <strong>FIN</strong> ارسال می‌کند.</li>
<li>سرور با <strong>ACK</strong> پاسخ می‌دهد و اعلام می‌کند که درخواست را دریافت کرده است.</li>
<li>سرور هم یک بسته <strong>FIN</strong> ارسال می‌کند.</li>
<li>کلاینت با <strong>ACK</strong> نهایی پاسخ می‌دهد و اتصال بسته می‌شود.</li>
</ol>

<div class="image-caption">اسلاید ۵: نحوه برقراری (Three-way Handshake) و پایان اتصال TCP</div>

<h2>03. متدولوژی اسکن در CEH (CEH Scanning Methodology)</h2>
<p>در دوره CEH، فرآیند اسکن شبکه به یک متدولوژی منظم و گام‌به‌گام تقسیم می‌شود که هر مرحله پیش‌نیاز مرحله بعدی است:</p>

<img src="images/CEHv13_03/slide_6.webp" alt="CEH Scanning Methodology" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۶: متدولوژی اسکن شبکه CEH</div>

<ol>
<li><strong>Check for Live Systems:</strong> بررسی اینکه کدام میزبان‌ها زنده هستند (همین جلسه).</li>
<li><strong>Check for Open Ports:</strong> شناسایی پورت‌های باز روی میزبان‌های زنده (جلسه بعد).</li>
<li><strong>Banner Grabbing:</strong> استخراج اطلاعات بیشتر از سرویس‌های روی پورت‌های باز (مثل نسخه نرم‌افزار).</li>
<li><strong>Scan for Vulnerability:</strong> جستجوی آسیب‌پذیری‌های شناخته‌شده با ابزارهای اسکن.</li>
<li><strong>Draw Network Diagram:</strong> ترسیم نقشه شبکه هدف برای درک بهتر معماری.</li>
<li><strong>Prepare Proxies:</strong> آماده‌سازی پروکسی برای مخفی نگه داشتن هویت واقعی خود.</li>
</ol>

<h2>04. تکنیک‌های کشف میزبان (Host Discovery Techniques)</h2>
<p>قبل از اینکه بخواهیم پورت‌ها را اسکن کنیم، باید بدانیم کدام کامپیوترها در شبکه روشن هستند. به این کار <strong>Host Discovery</strong> یا کشف میزبان می‌گویند. تکنیک‌های مختلفی برای این کار وجود دارد:</p>

<h3>۱-۴. ARP Ping Scan</h3>
<p>این روش یکی از دقیق‌ترین و سریع‌ترین روش‌ها برای کشف میزبان‌ها در <strong>شبکه محلی (LAN)</strong> است. ابزار <code>Nmap</code> با ارسال درخواست ARP و بررسی پاسخ‌ها، میزبان‌های زنده را شناسایی می‌کند. اگر میزبانی پاسخ ARP بدهد، ۱۰۰٪ زنده است. این روش معمولاً توسط فایروال‌ها مسدود نمی‌شود.</p>

<h3>۲-۴. UDP Ping Scan</h3>
<p>در این روش، بسته‌های UDP به پورت‌های خاصی ارسال می‌شود. اگر پورت بسته باشد، پاسخ ICMP Port Unreachable دریافت می‌شود که نشان می‌دهد میزبان زنده است.</p>

<h3>۳-۴. ICMP ECHO Ping Scan</h3>
<p>همان دستور <code>ping</code> معروف! با ارسال بسته ICMP ECHO Request، منتظر ICMP ECHO Reply می‌مانیم. اگر پاسخ دریافت شود، میزبان زنده است. این روش ساده است، اما اغلب فایروال‌ها و ویندوزهای امروزی ICMP را مسدود می‌کنند.</p>

<h3>۴-۴. ICMP ECHO Ping Sweep</h3>
<p>مشابه Ping Scan، اما به جای یک میزبان، برای یک <strong>محدوده کامل</strong> از آدرس‌های IP (مثلاً 192.168.1.1 تا 192.168.1.254) اجرا می‌شود تا تمام میزبان‌های زنده شبکه پیدا شوند.</p>

<h3>۵-۴. TCP SYN Ping Scan</h3>
<p>در این روش، یک بسته SYN به پورت خاصی (مثلاً 80) ارسال می‌شود. اگر میزبان با SYN+ACK یا RST پاسخ دهد، یعنی زنده است. این روش stealth است زیرا اتصال TCP هرگز کامل نمی‌شود (Handshake کامل نمی‌شود) و معمولاً در لاگ‌ها ثبت نمی‌شود.</p>

<h3>۶-۴. TCP ACK Ping Scan</h3>
<p>در این روش، یک بسته ACK خالی به میزبان ارسال می‌شود. اگر میزبان زنده باشد، با یک بسته RST پاسخ می‌دهد. این روش برای عبور از فایروال‌هایی که SYN را مسدود می‌کنند، بسیار مؤثر است.</p>

<img src="images/CEHv13_03/slide_11.webp" alt="TCP ACK Ping Scan" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۱: TCP ACK Ping Scan (اگر RST دریافت شود، میزبان زنده است)</div>

<h3>۷-۴. IP Protocol Ping Scan</h3>
<p>در این روش، بسته‌های IP با پروتکل‌های مختلف (مثل ICMP، TCP، UDP) ارسال می‌شود تا بررسی شود کدام یک از پروتکل‌ها توسط میزبان پاسخ داده می‌شوند. این روش برای شناسایی میزبان‌هایی است که فایروال آن‌ها فقط برخی از پروتکل‌های خاص را عبور می‌دهد.</p>

<div class="section-header"><div class="section-badge">09</div><div><h1>کشف پورت و سرویس</h1><div class="meta">Module 03 · Scanning Networks · Session 2 of 3</div></div></div>

<p>در جلسه قبل یاد گرفتیم چطور با ارسال بسته‌های ICMP یا ARP، میزبان‌های زنده را پیدا کنیم. اما یک میزبان زنده، فقط یک آدرس IP است. برای اینکه بفهمیم روی این میزبان چه سرویس‌هایی در حال اجراست، باید پورت‌های باز آن را شناسایی کنیم. در این جلسه، با تکنیک‌های مختلف اسکن پورت، از روش‌های ساده و پر سر و صدا تا روش‌های مخفیانه و پیچیده، آشنا می‌شویم.</p>

<h2>01. Port and Service Discovery (کشف پورت و سرویس)</h2>
<p>یک سیستم می‌تواند تا ۶۵,۵۳۵ پورت TCP و ۶۵,۵۳۵ پورت UDP داشته باشد. هر سرویس (مثل وب، ایمیل، SSH) روی یک یا چند پورت خاص گوش می‌دهد. هدف از اسکن پورت، پیدا کردن پورت‌هایی است که در حالت <strong>باز (Open)</strong> یا <strong>فیلترشده (Filtered)</strong> قرار دارند.</p>

<img src="images/CEHv13_03/slide_14.webp" alt="Port and Service Discovery Tree" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۴: درخت دسته‌بندی روش‌های کشف پورت و سرویس</div>

<p>روش‌های اسکن پورت به دسته‌های زیر تقسیم می‌شوند:</p>
<ul>
<li><strong>Open TCP Scanning:</strong> شامل TCP Connect (Full Open) و Stealth (Half-open) است.</li>
<li><strong>Stealth TCP Scanning:</strong> شامل Inverse TCP Flag (Xmas, FIN, NULL) و ACK Flag Probe است.</li>
<li><strong>Third Party and Spoofed:</strong> شامل IDLE/IPID Header Scan است.</li>
<li><strong>UDP Scanning</strong></li>
<li><strong>SCTP Scanning:</strong> شامل SCTP INIT و SCTP COOKIE ECHO است.</li>
</ul>

<h2>02. TCP Connect / Full Open Scan</h2>
<p>این ساده‌ترین و بنیادی‌ترین روش اسکن پورت است. در این روش، اسکنر یک <strong>اتصال TCP کامل (Three-way Handshake)</strong> با هدف برقرار می‌کند.</p>

<ul>
<li><strong>نحوه کار:</strong> اسکنر یک بسته SYN به پورت مورد نظر می‌فرستد. اگر پورت باز باشد، سرور با SYN+ACK پاسخ می‌دهد. اسکنر هم ACK نهایی را می‌فرستد و اتصال کامل می‌شود (اتصال برقرار). سپس اسکنر اتصال را می‌بندد. اگر پورت بسته باشد، سرور با RST پاسخ می‌دهد.</li>
<li><strong>مزایا:</strong> دقت بسیار بالا (۱۰۰٪)، نیازی به دسترسی Root ندارد (با یک کاربر معمولی هم می‌توان اجرا کرد).</li>
<li><strong>معایب:</strong> به شدت پر سر و صدا است و در لاگ‌های سرور (Application Logs) و IDS/IPS ثبت می‌شود.</li>
</ul>

<p>دستور Nmap برای این اسکن:</p>
<div class="code-container"><div class="code-label">bash · nmap</div><pre class="code-block">nmap -sT 192.168.1.10</pre></div>

<h2>03. Stealth / Half-Open Scan (اسکن مخفیانه)</h2>
<p>این روش که به <strong>TCP SYN Scan</strong> نیز معروف است، پرکاربردترین روش اسکن در دنیای هک اخلاقی است. در این روش، اتصال TCP هرگز کامل نمی‌شود (Half-Open).</p>

<ul>
<li><strong>نحوه کار:</strong> اسکنر یک بسته SYN به پورت هدف می‌فرستد.
    <ul>
        <li>اگر پورت <strong>باز</strong> باشد، سرور با SYN+ACK پاسخ می‌دهد. اسکنر بلافاصله یک بسته <strong>RST</strong> می‌فرستد تا اتصال را قطع کند (قبل از اینکه کامل شود).</li>
        <li>اگر پورت <strong>بسته</strong> باشد، سرور با RST پاسخ می‌دهد.</li>
    </ul>
</li>
<li><strong>مزایا:</strong> بسیار سریع، مخفیانه (چون اتصال کامل نمی‌شود، در لاگ‌های برنامه ثبت نمی‌شود).</li>
<li><strong>معایب:</strong> نیاز به دسترسی Root/Administrator دارد (برای ساخت بسته‌های خام).</li>
</ul>

<img src="images/CEHv13_03/slide_16.webp" alt="Stealth Half-open Scan" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۶: نحوه کار Stealth Scan (ارسال RST بلافاصله بعد از SYN+ACK)</div>

<p>دستور Nmap:</p>
<div class="code-container"><div class="code-label">bash · nmap</div><pre class="code-block">nmap -sS 192.168.1.10</pre></div>

<h2>04. Inverse TCP Flag Scans (Xmas, FIN, NULL, Maimon)</h2>
<p>این روش‌ها بر اساس یک نقص در پیاده‌سازی پروتکل TCP (RFC 793) کار می‌کنند. طبق استاندارد، اگر یک پورت <strong>بسته</strong> باشد، باید به هر بسته غیرمنتظره‌ای با <strong>RST</strong> پاسخ دهد. اما اگر پورت <strong>باز</strong> باشد، باید بسته را نادیده بگیرد و پاسخی ندهد. این روش‌ها از این قانون سوءاستفاده می‌کنند.</p>

<h3>۱-۴. FIN Scan</h3>
<p>یک بسته با فلگ FIN (بدون هیچ فلگ دیگری) ارسال می‌شود.</p>
<ul>
<li>پورت باز: پاسخ نمی‌دهد (No Response).</li>
<li>پورت بسته: RST می‌فرستد.</li>
</ul>

<h3>۲-۴. NULL Scan</h3>
<p>یک بسته با <strong>هیچ فلگی</strong> (هیچ کدام از فلگ‌های TCP ست نشده) ارسال می‌شود.</p>
<ul>
<li>پورت باز: پاسخ نمی‌دهد.</li>
<li>پورت بسته: RST می‌فرستد.</li>
</ul>

<h3>۳-۴. Xmas Scan</h3>
<p>یک بسته با فلگ‌های <strong>FIN، PSH و URG</strong> همزمان ارسال می‌شود. (چون همه چراغ‌ها روشن می‌شوند، به آن Xmas می‌گویند).</p>

<img src="images/CEHv13_03/slide_18.webp" alt="Xmas Scan" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۸: Xmas Scan (ارسال FIN+URG+PSH)</div>

<ul>
<li>پورت باز: پاسخ نمی‌دهد.</li>
<li>پورت بسته: RST می‌فرستد.</li>
</ul>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>نکته بسیار مهم</strong>این روش‌ها (FIN، NULL، Xmas) <strong>فقط روی سیستم‌های مبتنی بر UNIX/Linux</strong> کار می‌کنند. سیستم‌عامل ویندوز از استاندارد RFC 793 پیروی نمی‌کند و به <strong>تمام</strong> این بسته‌ها (حتی برای پورت‌های باز) با RST پاسخ می‌دهد. بنابراین، این اسکن‌ها روی ویندوز شکست می‌خورند.</div></div>

<h3>۴-۴. TCP Maimon Scan</h3>
<p>این روش توسط Uriel Maimon کشف شد. در این روش، یک بسته با فلگ‌های <strong>FIN + ACK</strong> ارسال می‌شود.</p>
<ul>
<li>پورت باز: پاسخ نمی‌دهد.</li>
<li>پورت بسته: RST می‌فرستد.</li>
</ul>
<p>دستور Nmap برای این اسکن‌ها:</p>
<div class="code-container"><div class="code-label">bash · nmap</div><pre class="code-block">nmap -sF 192.168.1.10 # FIN Scan
nmap -sN 192.168.1.10 # NULL Scan
nmap -sX 192.168.1.10 # Xmas Scan
nmap -sM 192.168.1.10 # Maimon Scan</pre></div>

<h2>05. ACK Flag Scanning و ACK Flag Probe Scanning</h2>
<p>برخلاف اسکن‌های قبلی، اسکن ACK برای تشخیص <strong>پورت‌های باز</strong> نیست، بلکه برای تشخیص <strong>وجود فایروال</strong> و قوانین آن طراحی شده است.</p>

<h3>۱-۵. ACK Flag Scan</h3>
<p>یک بسته ACK به هدف ارسال می‌شود.</p>
<ul>
<li>اگر هدف پاسخ <strong>RST</strong> دهد، یعنی هیچ فایروال Stateful در مسیر نیست (Unfiltered).</li>
<li>اگر هدف پاسخی ندهد، یعنی یک فایروال Stateful (مثل Cisco ASA) بسته را دور ریخته است.</li>
</ul>

<img src="images/CEHv13_03/slide_22.webp" alt="ACK Flag Scanning" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۲: تفاوت ACK Scan در حضور فایروال و عدم حضور آن</div>

<h3>۲-۵. ACK Flag Probe Scan</h3>
<p>در این روش، علاوه بر ارسال بسته ACK، فیلدهای <strong>TTL</strong> یا <strong>Window</strong> بسته RST دریافتی بررسی می‌شوند تا بفهمیم آیا پورت باز است یا خیر. (البته این روش به ندرت جواب می‌دهد و بیشتر جنبه آموزشی دارد).</p>
<ul>
<li><strong>TTL-based:</strong> اگر مقدار TTL بسته RST کمتر از ۶۴ باشد، پورت باز است.</li>
<li><strong>Window-based:</strong> اگر مقدار Window در بسته RST غیر صفر باشد، پورت باز است.</li>
</ul>

<img src="images/CEHv13_03/slide_23.webp" alt="ACK Flag Probe" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۳: ACK Flag Probe (بررسی TTL و Window)</div>

<h2>06. IDLE / IPID Header Scan (اسکن کاملاً کور)</h2>
<p>این یکی از پیچیده‌ترین و مخفیانه‌ترین روش‌های اسکن است. در این روش، مهاجم از یک ماشین واسط (Zombie) استفاده می‌کند و هرگز آدرس IP خود را به هدف نشان نمی‌دهد. به همین دلیل به آن <strong>Blind Scan</strong> (اسکن کور) می‌گویند.</p>

<h3>مراحل انجام IDLE Scan</h3>
<ol>
<li><strong>گام ۱ (Probe Zombie):</strong> مهاجم یک بسته SYN/ACK به زامبی می‌فرستد. زامبی با یک بسته RST پاسخ می‌دهد که حاوی یک مقدار <strong>IPID</strong> (مثلاً ۳۱۳۳۷) است.</li>
<li><strong>گام ۲ (Spoofed SYN):</strong> مهاجم یک بسته SYN به هدف می‌فرستد، اما آدرس مبدأ را <strong>آدرس IP زامبی</strong> جعل می‌کند.</li>
<li><strong>گام ۳ (واکنش هدف):</strong>
    <ul>
        <li>اگر پورت هدف <strong>باز</strong> باشد، هدف یک SYN/ACK به زامبی می‌فرستد. زامبی (که غافلگیر شده) یک RST به هدف می‌فرستد و مقدار IPID خود را <strong>یک واحد افزایش می‌دهد</strong> (۳۱۳۳۸).</li>
        <li>اگر پورت هدف <strong>بسته</strong> باشد، هدف یک RST به زامبی می‌فرستد. زامبی این RST را نادیده می‌گیرد و IPID تغییر نمی‌کند.</li>
    </ul>
</li>
<li><strong>گام ۴ (Probe Zombie Again):</strong> مهاجم دوباره به زامبی بسته SYN/ACK می‌فرستد و IPID جدید را می‌خواند. اگر IPID <strong>۲ واحد</strong> افزایش یافته باشد (۳۱۳۳۹)، یعنی پورت هدف باز بوده است.</li>
</ol>

<img src="images/CEHv13_03/slide_24.webp" alt="IDLE Scan" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۴: مراحل IDLE Scan (استفاده از IPID زامبی)</div>

<p>دستور Nmap:</p>
<div class="code-container"><div class="code-label">bash · nmap</div><pre class="code-block">nmap -Pn -sI zombie_host target_host</pre></div>

<h2>07. UDP Scanning</h2>
<p>اسکن UDP بسیار کندتر و دشوارتر از TCP است، زیرا UDP اتصال‌گرا نیست.</p>
<ul>
<li><strong>نحوه کار:</strong> یک بسته UDP خالی به پورت هدف فرستاده می‌شود.
    <ul>
        <li>اگر پورت <strong>بسته</strong> باشد، سرور یک پیام <strong>ICMP Port Unreachable</strong> برمی‌گرداند.</li>
        <li>اگر پورت <strong>باز</strong> باشد، ممکن است هیچ پاسخی ندهد (یا اگر سرویس پاسخ‌ده باشد، پاسخ UDP بدهد).</li>
    </ul>
</li>
<li><strong>چالش:</strong> چون پاسخ ندادن می‌تواند هم معنای باز بودن پورت باشد و هم فیلتر شدن آن توسط فایروال، تشخیص دقیق دشوار است.</li>
</ul>

<img src="images/CEHv13_03/slide_26.webp" alt="UDP Scanning" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۶: UDP Scanning (پورت باز = بدون پاسخ، پورت بسته = ICMP Unreachable)</div>

<p>دستور Nmap:</p>
<div class="code-container"><div class="code-label">bash · nmap</div><pre class="code-block">nmap -sU 192.168.1.10</pre></div>

<h2>08. SCTP INIT و SCTP COOKIE ECHO Scanning</h2>
<p>SCTP (Stream Control Transmission Protocol) یک پروتکل انتقالی است که بیشتر در شبکه‌های مخابراتی (VoIP) استفاده می‌شود. اسکن آن شبیه به TCP SYN Scan است.</p>

<h3>۱-۸. SCTP INIT Scanning</h3>
<p>یک بسته INIT به هدف ارسال می‌شود.</p>
<ul>
<li>پورت باز: پاسخ <strong>INIT+ACK</strong> دریافت می‌شود.</li>
<li>پورت بسته: پاسخ <strong>ABORT</strong> دریافت می‌شود.</li>
</ul>

<h3>۲-۸. SCTP COOKIE ECHO Scanning</h3>
<p>یک بسته COOKIE ECHO ارسال می‌شود.</p>
<ul>
<li>پورت باز: هیچ پاسخی نمی‌آید (No Response).</li>
<li>پورت بسته: پاسخ <strong>ABORT</strong> دریافت می‌شود.</li>
</ul>

<img src="images/CEHv13_03/slide_27.webp" alt="SCTP Scanning" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۷: SCTP INIT Scanning (مقایسه با Four-way Handshake)</div>

<p>دستور Nmap:</p>
<div class="code-container"><div class="code-label">bash · nmap</div><pre class="code-block">nmap -sY 192.168.1.10 # SCTP INIT Scan
nmap -sZ 192.168.1.10 # SCTP COOKIE ECHO Scan</pre></div>

<h2>09. SYN/FIN Scanning با IP Fragments</h2>
<p>این یک روش جدید نیست، بلکه یک اصلاح (Modification) روی روش‌های قبلی است. در این روش، هدر TCP به چندین قطعه (Fragment) کوچک تقسیم می‌شود تا فایروال‌ها و سیستم‌های IDS نتوانند محتوای بسته را به درستی تحلیل کنند.</p>

<img src="images/CEHv13_03/slide_29.webp" alt="IP Fragmentation" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۹: SYN/FIN Scanning با استفاده از IP Fragments</div>

<p>دستور Nmap:</p>
<div class="code-container"><div class="code-label">bash · nmap</div><pre class="code-block">nmap -sS -f -T4 -A -v 192.168.168.5</pre></div>

<h2>10. Service Version Discovery و OS Discovery</h2>
<p>وقتی پورت‌های باز را پیدا کردیم، باید بفهمیم چه سرویسی و با چه نسخه‌ای روی آن‌ها اجرا می‌شود. این کار به ما کمک می‌کند آسیب‌پذیری‌های مربوط به آن نسخه را پیدا کنیم.</p>

<h3>Service Version Discovery</h3>
<p>ابزار Nmap با ارسال بسته‌های خاص و تحلیل پاسخ‌ها، نسخه سرویس را تشخیص می‌دهد.</p>
<div class="code-container"><div class="code-label">bash · nmap</div><pre class="code-block">nmap -sV 192.168.1.10</pre></div>

<h3>OS Discovery</h3>
<p>با تحلیل نحوه پاسخ‌دهی TCP/IP Stack (مثلاً مقدار TTL، اندازه پنجره، ترتیب گزینه‌ها)، می‌توان سیستم‌عامل را تشخیص داد.</p>
<div class="code-container"><div class="code-label">bash · nmap</div><pre class="code-block">nmap -O 192.168.1.10</pre></div>

<h2>11. Banner Grabbing (استخراج بنر)</h2>
<p><strong>Banner Grabbing</strong> فرآیند استخراج اطلاعات (Banner) از سرویس‌های در حال اجرا روی پورت‌های باز است. این اطلاعات معمولاً شامل نام نرم‌افزار، نسخه آن و گاهی سیستم‌عامل است.</p>

<h3>۱-۱۱. Passive Banner Grabbing</h3>
<p>در این روش، مهاجم بدون ارسال درخواست مستقیم، اطلاعات را از منابع غیرمستقیم جمع‌آوری می‌کند:</p>
<ul>
<li><strong>Banner Grabbing from Error Message:</strong> ایجاد یک خطا (مثلاً ارسال درخواست نامعتبر) و خواندن پیام خطا که حاوی نسخه نرم‌افزار است.</li>
<li><strong>Sniffing Network Traffic:</strong> شنود ترافیک شبکه و تحلیل بسته‌های تبادل‌شده.</li>
<li><strong>Banner Grabbing from Web Page:</strong> بررسی کدهای HTML صفحه و متادیتای آن.</li>
<li><strong>Banner Grabbing with Netcraft:</strong> استفاده از سایت Netcraft برای شناسایی وب‌سرور.</li>
</ul>

<h3>۲-۱۱. Active Banner Grabbing</h3>
<p>در این روش، مهاجم مستقیماً با سرویس تعامل می‌کند:</p>
<ul>
<li><strong>Specially Crafted Packet:</strong> ارسال بسته‌های دستکاری‌شده و تحلیل پاسخ.</li>
<li><strong>Banner Grabbing with Telnet:</strong> اتصال به پورت (مثلاً 80) با Telnet و خواندن پاسخ سرور.</li>
<li><strong>Banner Grabbing with Ping (TTL):</strong> تشخیص سیستم‌عامل از روی مقدار TTL اولیه (لینوکس=۶۴، مایکروسافت=۱۲۸، سیسکو=۲۵۵).</li>
</ul>

<img src="images/CEHv13_03/slide_37.webp" alt="Banner Grabbing Tools" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۷: ابزار ID Serve برای Banner Grabbing</div>

<p>مثال استفاده از Netcat (nc) برای Banner Grabbing:</p>
<div class="code-container"><div class="code-label">bash · netcat</div><pre class="code-block">nc -vv www.example.com 80
GET / HTTP/1.0
[Press Enter twice]</pre></div>

<h2>12. مقابله با اسکن پورت و Banner Grabbing</h2>

<h3>۱-۱۲. Countermeasures ضد Port Scanning</h3>
<ul>
<li>پیکربندی قوانین فایروال و سیستم تشخیص نفوذ برای شناسایی و مسدود کردن درخواست‌های اسکن.</li>
<li>استفاده از ابزارهای اسکن پورت برای تست دوره‌ای شبکه و بررسی عملکرد دستگاه‌های امنیتی.</li>
<li>اطمینان از بروزرسانی دستگاه‌های امنیتی (فایروال، روتر، IDS).</li>
<li>غیرفعال نمودن سرویس‌ها و پورت‌های بلااستفاده.</li>
<li>مسدود کردن تمام ترافیک‌های ICMP (برای جلوگیری از ICMP Ping Scan).</li>
</ul>

<h3>۲-۱۲. Countermeasures ضد Banner Grabbing</h3>
<ul>
<li>غیرفعال نمودن سرویس‌های غیرضروری برای محدودسازی افشای اطلاعات.</li>
<li>نمایش بنرهای اشتباه برای گمراه کردن نفوذگران.</li>
<li>استفاده از ابزارهایی مانند ServerMask و IIS Lockdown برای تغییر بنر IIS.</li>
<li>تغییر <code>ServerTokens</code> به <code>Prod</code> و <code>ServerSignature</code> به <code>Off</code> در فایل <code>httpd.conf</code> آپاچی.</li>
<li>غیرفعال کردن بخش <code>expose_php</code> در فایل <code>php.ini</code>.</li>
<li>مدیریت پسوند صفحات وب در آپاچی با <code>mod_negotiation</code> و در IIS با نرم‌افزارهایی مانند PageXchanger.</li>
</ul>

<p><strong>۱.</strong> TCP Connect Scan یک اتصال کامل برقرار می‌کند (دقیق اما پر سر و صدا)، در حالی که Stealth Scan از اتصال Half-Open استفاده می‌کند (سریع و مخفیانه، اما نیازمند Root).</p>
<p><strong>۲.</strong> Inverse TCP Flag Scans (FIN، NULL، Xmas) از عدم پاسخ‌دهی پورت‌های باز برای تشخیص استفاده می‌کنند، اما روی ویندوز کار نمی‌کنند.</p>

<p><strong>۴.</strong> UDP Scan کند و دشوار است، اما برای کشف سرویس‌های مبتنی بر UDP (مثل DNS و SNMP) ضروری است.</p>
<p><strong>۵.</strong> Service Version Discovery و OS Discovery با Nmap به ما می‌گویند چه سرویس‌هایی و با چه نسخه‌ای روی پورت‌های باز در حال اجرا هستند.</p>
<p><strong>۶.</strong> Banner Grabbing (فعال یا غیرفعال) اطلاعات بیشتری از سرویس‌ها استخراج می‌کند و با غیرفعال کردن بنرها و تغییر تنظیمات سرور (مثل ServerTokens در آپاچی) می‌توان با آن مقابله کرد.</p>

<div class="section-header"><div class="section-badge">10</div><div><h1>دور زدن و ناشناسی</h1><div class="meta">Module 03 · Scanning Networks · Session 3 of 3</div></div></div>

<p>در جلسات قبل یاد گرفتیم چطور با ارسال بسته‌های مختلف، پورت‌های باز و سرویس‌های شبکه را شناسایی کنیم. اما یک هکر اخلاقی یا یک مهاجم حرفه‌ای، هیچ‌وقت نمی‌خواهد که هویت واقعی‌اش لو برود. در این جلسه، به سراغ تکنیک‌های <strong>دور زدن (Evasion)</strong> و <strong>ناشناسی (Anonymity)</strong> می‌رویم؛ از جعل آدرس IP و پورت مبدأ گرفته تا استفاده از شبکه‌های تور (TOR) و ابزارهای پاک‌سازی ردپا. </p>

<h2>01. دستکاری پورت مبدأ (Source Port Manipulation)</h2>
<p>بسیاری از فایروال‌ها قوانینی دارند که به ترافیک ورودی از پورت‌های خاصی (مثل پورت ۵۳ برای DNS یا پورت ۸۰ برای HTTP) اجازه عبور می‌دهند. مهاجم با <strong>جعل پورت مبدأ</strong> (Source Port) می‌تواند خود را شبیه به یک سرویس قانونی جا بزند و از فایروال عبور کند.</p>

<p>ابزار Nmap با سوییچ <code>--source-port</code> (یا <code>-g</code>) این امکان را فراهم می‌کند:</p>
<div class="code-container"><div class="code-label">bash · nmap</div><pre class="code-block">nmap -sS --source-port 53 192.168.1.10</pre></div>
<p>در این مثال، اسکنر خود را به عنوان یک درخواست DNS (پورت ۵۳) نشان می‌دهد تا احتمال مسدود شدنش توسط فایروال کاهش یابد.</p>

<h2>02. جعل آدرس IP با Decoy (طعمه)</h2>
<p>در روش <strong>IP Address Decoy</strong>، مهاجم علاوه بر آدرس IP واقعی خود، تعداد زیادی آدرس IP جعلی (طعمه) را نیز به عنوان مبدأ بسته‌ها قرار می‌دهد. هدف این است که سیستم‌های امنیتی و لاگ‌ها را گمراه کند تا نتوانند منبع واقعی حمله را تشخیص دهند.</p>

<p>دستور Nmap برای استفاده از Decoy:</p>
<div class="code-container"><div class="code-label">bash · nmap</div><pre class="code-block">nmap -D RND:10 192.168.1.10</pre></div>
<p>در این دستور، ۱۰ آدرس IP تصادفی (RND) به عنوان طعمه تولید می‌شود و همراه با IP واقعی شما به سمت هدف ارسال می‌گردد. مدیر شبکه فکر می‌کند که ۱۱ سیستم مختلف در حال اسکن هستند!</p>

<h2>03. جعل آدرس IP (IP Address Spoofing)</h2>
<p>در <strong>IP Spoofing</strong>، مهاجم آدرس IP مبدأ بسته را به طور کامل جعل می‌کند (مثلاً به جای IP خود، IP یک سرور معروف یا یک آدرس نامربوط را قرار می‌دهد). این کار باعث می‌شود قربانی پاسخ‌ها را به آدرس جعلی بفرستد و نتواند مهاجم واقعی را ردیابی کند.</p>

<img src="images/CEHv13_03/slide_42.webp" alt="IP Spoofing" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۲: IP Spoofing با استفاده از Hping3</div>

<p>ابزار <strong>Hping3</strong> یکی از قدرتمندترین ابزارها برای جعل IP و ارسال بسته‌های سفارشی است. سوییچ <code>-a</code> (یا <code>--spoof</code>) برای جعل آدرس مبدأ استفاده می‌شود:</p>
<div class="code-container"><div class="code-label">bash · hping3</div><pre class="code-block">hping3 www.certifiedhacker.com -a 7.7.7.7</pre></div>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>نکته مهم</strong>وقتی از IP Spoofing استفاده می‌کنید، پاسخ سرور به آدرس جعلی می‌رود، نه به شما! بنابراین این تکنیک بیشتر برای حملات DoS یا اسکن‌های کور (Blind Scan) استفاده می‌شود، نه برای سناریوهایی که نیاز به دریافت پاسخ دارید.</div></div>

<h2>04. ایجاد بسته‌های سفارشی (Custom Packets)</h2>
<p>گاهی اوقات برای دور زدن فایروال‌ها و سیستم‌های IDS/IPS، باید بسته‌های شبکه را دقیقاً مطابق میل خود بسازیم. دو ابزار اصلی برای این کار وجود دارند:</p>

<h3>۱-۴. Colasoft Packet Builder</h3>
<p>یک ابزار گرافیکی ویندوزی که به شما اجازه می‌دهد بسته‌های شبکه را از صفر بسازید، هدرهای TCP/IP را ویرایش کنید و حتی بسته‌های قطعه‌قطعه‌شده (Fragmented) تولید کنید تا سیستم‌های امنیتی نتوانند محتوای آن‌ها را تحلیل کنند.</p>

<img src="images/CEHv13_03/slide_43.webp" alt="Colasoft Packet Builder" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴۳: رابط کاربری Colasoft Packet Builder</div>

<h3>۲-۴. ساخت بسته سفارشی در Nmap</h3>
<p>Nmap با سوییچ‌های <code>--data</code> و <code>--data-string</code> به شما اجازه می‌دهد یک payload دلخواه به بسته‌های ارسالی اضافه کنید. این کار برای دور زدن IDSهایی که به دنبال الگوهای خاص هستند، بسیار مفید است.</p>

<img src="images/CEHv13_03/slide_44.webp" alt="Nmap Custom Packets" class="pdf-image" loading="lazy">

<div class="code-container"><div class="code-label">bash · nmap</div><pre class="code-block">nmap 10.10.10.10 --data 0xdeadbeef
nmap 10.10.10.10 --data-string "Ph34r my l33t skills"</pre></div>

<h2>05. ترسیم نقشه شبکه (Draw Network Diagram)</h2>
<p>پس از جمع‌آوری اطلاعات و اسکن شبکه، نوبت به ترسیم نقشه می‌رسد. <strong>ترسیم نقشه شبکه</strong> اطلاعات باارزشی در مورد شبکه و معماری آن به نفوذگر می‌دهد. نقشه شبکه، ساختار فیزیکی و منطقی شبکه هدف را مشخص می‌کند و به مهاجم کمک می‌کند تا مسیر حمله را پیدا کند.</p>

<h2>06. آماده‌سازی پروکسی (Prepare Proxies)</h2>
<p>سرور پروکسی دارای برنامه‌ای است که به عنوان یک واسط (Intermediary) برای برقراری ارتباط با سیستم‌های دیگر استفاده می‌شود. نفوذگران برای مخفی ماندن آدرس مبدأ خود، از سرورهای پروکسی استفاده می‌کنند. آن‌ها معمولاً از یک <strong>زنجیره (Chain)</strong> از این سرورها استفاده می‌کنند تا ردیابی را بسیار دشوارتر کنند.</p>

<h2>07. ابزارهای ناشناسی (Anonymizers)</h2>
<p>یک <strong>Anonymizer</strong> کلیه اطلاعات قابل شناسایی را از سیستم کاربر حذف می‌کند. این اطلاعات می‌تواند مربوط به جستجوها و فعالیت‌های کاربر (Internet Surf) باشد. Anonymizers فعالیت‌های کاربر را مخفی نموده و باعث عدم شناسایی و Trace شدن می‌شوند.</p>

<h3>۱-۷. Tails (سیستم‌عامل ناشناس)</h3>
<p><strong>Tails</strong> یک سیستم‌عامل زنده (Live) است که کاربر می‌تواند آن را روی هر سیستمی از طریق USB، SD card یا DVD اجرا کند. هدف این ابزار حفظ حریم خصوصی است و به شما کمک می‌کند تا در اینترنت به صورت مخفی فعالیت نمایید و بدون ردیابی بر روی کامپیوتر مدنظر، آن را ترک کنید. تمام ترافیک اینترنت شما در Tails به طور خودکار از شبکه TOR عبور می‌کند.</p>

<img src="images/CEHv13_03/slide_50.webp" alt="Tails OS" class="pdf-image" loading="lazy">

<p>گوگل برای ردیابی فعالیت‌های وب کاربری مانند کلیدهای جستجو، نتایج جستجو و سایت‌های مشاهده‌شده، مجموعه‌ای از کوکی‌ها را بر روی سیستم کاربر تنظیم و ذخیره می‌کند. از اطلاعات موجود در کوکی‌های گوگل می‌توان به عنوان شواهد (Evidence) جهت ارائه به دادگاه استفاده نمود. ابزار <strong>G-Zapper</strong> برای حذف و مدیریت این اطلاعات طراحی شده است.</p>

<div class="section-header"><div class="section-badge">11</div><div><h1>Enumeration (کامل)</h1><div class="meta">Module 04 · Enumeration · Session 1 of 1</div></div></div>

<p>در جلسات قبل یاد گرفتیم چطور میزبان‌های زنده و پورت‌های باز را پیدا کنیم. اما پیدا کردن یک پورت باز، فقط در را باز می‌کند. برای اینکه بفهمیم پشت این در چه کسی و چه چیزی است، باید <strong>Enumeration</strong> انجام دهیم. در این جلسه با پروتکل‌های حیاتی مثل NetBIOS، SNMP، LDAP، SMTP و... آشنا می‌شویم و یاد می‌گیریم چطور اطلاعات ارزشمند را از دل آن‌ها بیرون بکشیم.</p>

<h2>01. مفهوم Enumeration و منابع آن</h2>
<p><strong>Enumeration</strong> به معنای شمارش است و در این مرحله، نفوذگر یک ارتباط فعال با سیستم برقرار نموده و درخواست‌های مختلفی را به آن ارسال می‌کند تا اطلاعات بیشتری را از هدف به دست آورد. این اطلاعات به نفوذگر اجازه می‌دهد تا برای حملات بعدی (مثل حدس رمز عبور، سرریز بافر و...) آماده شود.</p>

<p>منابع مختلفی برای Enumeration وجود دارند:</p>
<ul>
<li>منابع شبکه و فایل‌های به اشتراک گذاشته شده (Network Shares)</li>
<li>جداول مسیریابی (Routing Tables)</li>
<li>تنظیمات سرویس‌ها</li>
<li>جزئیات DNS و SNMP</li>
<li>نام ماشین‌ها (Hostnames)</li>
<li>نام‌های کاربری و گروه‌ها (Usernames & Groups)</li>
<li>بنرها و برنامه‌های کاربردی (Banners)</li>
</ul>

<h2>02. NetBIOS Enumeration</h2>
<p><strong>NetBIOS</strong> یک API قدیمی در ویندوز است که برای ارتباط بین کامپیوترها در یک شبکه محلی استفاده می‌شود. این پروتکل اطلاعات بسیار مفیدی مانند نام کامپیوتر، نام کاربران و سرویس‌های اشتراک‌گذاری فایل را فاش می‌کند.</p>

<h3>ابزارها و دستورات اصلی:</h3>
<ul>
<li><strong><code>nbtstat -c</code>:</strong> محتویات کش NetBIOS شامل نام‌های NetBIOS و آدرس‌های IP مربوطه را نشان می‌دهد.</li>
<li><strong><code>nbtstat -a &lt;IP&gt;</code>:</strong> جدول نام‌های NetBIOS یک کامپیوتر از راه دور را نشان می‌دهد.</li>
<li><strong><code>net view \\\\&lt;IP&gt; /ALL</code>:</strong> لیست تمام فایل‌های به اشتراک گذاشته شده (Shares) و منابع موجود روی کامپیوتر هدف را نمایش می‌دهد.</li>
</ul>

<h2>03. SNMP Enumeration</h2>
<p><strong>SNMP (Simple Network Management Protocol)</strong> پروتکلی برای مدیریت و پایش دستگاه‌های شبکه (روترها، سوئیچ‌ها، پرینترها و سرورها) است. اگر SNMP به درستی پیکربندی نشده باشد، می‌تواند اطلاعات بسیار حساسی را لو دهد.</p>

<h3>نحوه کارکرد SNMP</h3>
<ul>
<li><strong>SNMP Agent:</strong> نرم‌افزاری که روی دستگاه شبکه اجرا می‌شود و روی پورت <strong>۱۶۱/UDP</strong> گوش می‌دهد.</li>
<li><strong>SNMP Manager:</strong> نرم‌افزاری که برای مدیریت و پایش Agentها استفاده می‌شود.</li>
<li><strong>Trap و Inform:</strong> پیام‌هایی که Agent برای گزارش رویدادها (بدون درخواست) به Manager می‌فرستد (روی پورت ۱۶۲/UDP).</li>
<li><strong>Community String:</strong> یک رمز عبور ساده (متن ساده) که در نسخه‌های ۱ و ۲ استفاده می‌شود (پیش‌فرض: <code>public</code> برای خواندن و <code>private</code> برای نوشتن).</li>
</ul>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>خطر امنیتی بزرگ</strong>اگر یک دستگاه شبکه از Community String پیش‌فرض (مثل public) استفاده کند، هر کسی می‌تواند با ابزارهایی مثل <code>snmp-check</code> به آن متصل شود و اطلاعاتی مثل نسخه سیستم‌عامل، کاربران، پورت‌های باز و جداول مسیریابی را استخراج کند.</div></div>

<img src="images/CEHv13_04/slide_9.webp" alt="SNMP Working" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۹: نحوه کار SNMP (Agent و Manager)</div>

<p>ابزارهای SNMP Enumeration:</p>
<ul>
<li><strong>snmp-check</strong> (لینوکس): یکی از بهترین ابزارهای خط فرمان.</li>
<li><strong>OpUtils</strong> و <strong>SolarWinds Engineer’s Toolset</strong> (ویندوز): ابزارهای تجاری.</li>
<li>ابزارهای دیگر: SNMP Scanner، Getif، OidView، Net-SNMP.</li>
</ul>

<h2>04. LDAP Enumeration</h2>
<p><strong>LDAP (Lightweight Directory Access Protocol)</strong> یک پروتکل برای دسترسی به سرویس‌های دایرکتوری (مثل Active Directory در ویندوز) است. از آن برای جستجوی سریع اطلاعاتی مانند نام کاربران، ایمیل‌ها و کامپیوترها استفاده می‌شود. پورت پیش‌فرض آن <strong>۳۸۹/TCP</strong> است.</p>

<h3>Enumeration دستی با پایتون</h3>
<p>مهاجمان می‌توانند با استفاده از کتابخانه <code>ldap3</code> در پایتون، شمارش LDAP را به صورت دستی انجام دهند:</p>

<div class="code-container"><div class="code-label">python · ldap_enum.py</div><pre class="code-block no-prompt">pip3 install ldap3
>>> import ldap3
>>> server = ldap3.Server('Target IP Address', get_info = ldap3.ALL, port = 389)
>>> connection = ldap3.Connection(server)
>>> connection.bind()
True
>>> server.info</pre></div>

<p>پس از اتصال موفق، با دستور <code>connection.search()</code> می‌توان تمام اشیای دایرکتوری را استخراج کرد:</p>
<div class="code-container"><div class="code-label">python · ldap_search.py</div><pre class="code-block no-prompt">>>> connection.search(
    search_base='DC=DOMAIN,DC=DOMAIN',
    search_filter='(&amp;(objectClass=*))',
    search_scope='SUBTREE',
    attributes='*'
)
>>> connection.entries</pre></div>

<h2>05. NTP Enumeration</h2>
<p><strong>NTP (Network Time Protocol)</strong> برای همسان‌سازی زمان در شبکه استفاده می‌شود و از پورت <strong>۱۲۳/UDP</strong> استفاده می‌کند. مهاجم با ارسال درخواست به سرور NTP می‌تواند اطلاعات زیر را جمع‌آوری کند:</p>
<ul>
<li>لیست میزبان‌های متصل به سرور NTP.</li>
<li>آدرس IP کلاینت‌ها در شبکه.</li>
<li>نام سیستم‌ها و مشخصات سیستم‌عامل.</li>
</ul>

<h2>06. SMTP Enumeration</h2>
<p><strong>SMTP (Simple Mail Transfer Protocol)</strong> برای ارسال ایمیل استفاده می‌شود و روی پورت <strong>۲۵/TCP</strong> گوش می‌دهد. با استفاده از دستورات داخلی SMTP مثل <code>VRFY</code> (تأیید کاربر) و <code>EXPN</code> (نمایش لیست ایمیل)، می‌توان نام کاربران معتبر را استخراج کرد.</p>

<p>ابزار <strong>Nmap</strong> با اسکریپت <code>smtp-enum-users</code> می‌تواند لیست کاربران را پیدا کند:</p>
<div class="code-container"><div class="code-label">bash · nmap</div><pre class="code-block">nmap -p 25 --script smtp-enum-users 10.10.10.19</pre></div>

<img src="images/CEHv13_04/slide_17.webp" alt="SMTP Enumeration" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۷: شمارش کاربران SMTP با Nmap</div>

<p>همچنین می‌توان با <code>telnet</code> به پورت ۲۵ متصل شد و دستورات <code>VRFY</code> و <code>EXPN</code> را تست کرد.</p>

<h2>07. DNS Enumeration</h2>
<p><strong>DNS Enumeration</strong> شامل پیدا کردن سرورهای DNS، رکوردهای موجود و استخراج نام سرورها، نام میزبان‌ها و آدرس‌های IP است. یکی از خطرناک‌ترین آسیب‌پذیری‌ها، <strong>Zone Transfer (AXFR)</strong> است که اگر سرور DNS به درستی پیکربندی نشده باشد، مهاجم می‌تواند تمام رکوردهای دامنه را کپی کند.</p>

<h3>روش‌های DNS Enumeration:</h3>
<ul>
<li><strong>nslookup:</strong> دستور کلاسیک (تنظیم <code>set type=any</code> و سپس <code>ls -d domain.com</code>).</li>
<li><strong>DNSSEC Zone Walking:</strong> در صورت استفاده از DNSSEC، مهاجم می‌تواند رکوردها را با ابزارهای <code>ldns-walk</code> یا <code>dnsrecon -z</code> استخراج کند.</li>
<li><strong>OWASP Amass:</strong> یک ابزار بسیار قدرتمند برای DNS Enumeration که از روش‌های فعال و غیرفعال استفاده می‌کند و اطلاعات حیاتی را بدون فعال‌سازی هشدارهای امنیتی استخراج می‌کند.</li>
</ul>

<h2>08. IPSec Enumeration</h2>
<p><strong>IPSec</strong> مجموعه‌ای از پروتکل‌ها برای امنیت ارتباطات VPN است. از پروتکل <strong>ISAKMP</strong> (Internet Security Association and Key Management Protocol) روی پورت <strong>۵۰۰/UDP</strong> استفاده می‌کند. با استفاده از ابزار <strong>ike-scan</strong>، مهاجم می‌تواند اطلاعاتی مثل نوع الگوریتم رمزنگاری، هش و احراز هویت را استخراج کند.</p>

<h2>09. VoIP Enumeration</h2>
<p><strong>VoIP</strong> برای انتقال صدا و تصویر روی IP استفاده می‌شود و از پروتکل <strong>SIP</strong> استفاده می‌کند. پورت‌های پیش‌فرض SIP عبارتند از <strong>۵۰۶۰</strong> و <strong>۵۰۶۱</strong> (TCP/UDP). با ابزار <strong>svmap</strong> یا اسکریپت‌های Metasploit، می‌توان اطلاعاتی مثل IP-PBX Systems، VoIP Gateways و کاربران VoIP را پیدا کرد.</p>

<h2>10. Linux Enumeration</h2>
<p>بررسی کاربران موجود در سیستم‌های Unix/Linux یکی از مراحل مهم در فرآیند Enumeration است. این فرآیند لیستی از کاربران به همراه اطلاعاتی مثل نام کاربری، نام میزبان، تاریخ و زمان شروع هر نشست را فراهم می‌کند. دستورات مهم:</p>
<ul>
<li><strong><code>rusers</code>:</strong> لیست کاربران وارد شده به سیستم را نشان می‌دهد.</li>
<li><strong><code>rwho</code>:</strong> لیست کاربران تمام سیستم‌های شبکه را نشان می‌دهد (در صورت فعال بودن سرویس rwhod).</li>
<li><strong><code>finger</code>:</strong> اطلاعاتی مثل نام کامل، دایرکتوری خانه و زمان آخرین ورود کاربر را نشان می‌دهد.</li>
</ul>

<h2>11. مقابله با Enumeration</h2>
<p>برای جلوگیری از لو رفتن اطلاعات توسط مهاجمان، باید اقدامات زیر را انجام داد:</p>

<h3>۱-۱۱. Countermeasures ضد LDAP Enumeration</h3>
<ul>
<li>استفاده از <strong>SSL/TLS</strong> برای رمزنگاری ترافیک LDAP (پورت ۶۳۶).</li>
<li>انتخاب نام کاربری متفاوت از آدرس ایمیل.</li>
<li>فعال‌سازی <strong>Account Lockout</strong> برای جلوگیری از حملات Brute Force.</li>
</ul>

<h3>۲-۱۱. Countermeasures ضد SMTP Enumeration</h3>
<ul>
<li>پیکربندی سرور برای چشم‌پوشی از ارسال پیام‌های ایمیلی که برای گیرنده ناشناس باشد.</li>
<li>عدم ارسال پاسخ‌هایی که شامل اطلاعات و جزئیات سیستم ارسال پست الکترونیکی، اطلاعات میزبان و مواردی از این دست باشد (غیرفعال کردن VRFY و EXPN).</li>
</ul>

<div class="section-header"><div class="section-badge">12</div><div><h1>Vulnerability Analysis (کامل)</h1><div class="meta">Module 05 · Vulnerability Analysis · Session 1 of 1</div></div></div>

<p>تا اینجا یاد گرفتیم چطور میزبان‌ها و سرویس‌ها را شناسایی کنیم. اما در دنیای امنیت، دانستن اینکه "یک در باز است" کافی نیست؛ باید بدانیم "آیا قفل این در خراب است یا نه؟". به این فرآیند، <strong>Vulnerability Analysis</strong> می‌گویند. در این جلسه، یاد می‌گیریم چطور نقاط ضعف را پیدا کنیم، به آن‌ها امتیاز بدهیم و برای رفعشان برنامه‌ریزی کنیم. این جلسه، پایه و اساس تمام تست‌های نفوذ حرفه‌ای است.</p>

<h2>01. Vulnerability Research و Classification</h2>
<p><strong>Vulnerability Research</strong> فرآیندی است که در آن اقدام به شناسایی آسیب‌پذیری‌ها و نقاط ضعف در طراحی می‌شود. آسیب‌پذیری ممکن است در یک سیستم‌عامل یا یک برنامه باشد که منجر به حمله یا سوءاستفاده می‌گردد.</p>

<img src="images/CEHv13_05/slide_4.webp" alt="Vulnerability Research" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۴: مفهوم Vulnerability Research و دسته‌بندی آن</div>

<p>آسیب‌پذیری‌ها بر اساس شدت به دسته‌های <strong>Low, Medium, High, Critical</strong> و بر اساس نوع اکسپلویت به دو دسته <strong>Local</strong> (نیازمند دسترسی به سیستم) و <strong>Remote</strong> (قابل بهره‌برداری از راه دور) تقسیم می‌شوند.</p>

<h3>دسته‌بندی آسیب‌پذیری‌ها (Classification)</h3>
<p>آسیب‌پذیری‌ها از نظر منشأ به دسته‌های زیر تقسیم می‌شوند:</p>
<ul>
<li><strong>Misconfiguration:</strong> پیکربندی اشتباه سیستم یا نرم‌افزار (مثلاً باز گذاشتن یک پورت غیرضروری).</li>
<li><strong>Default Installation:</strong> نصب نرم‌افزار با تنظیمات پیش‌فرض ناامن (مثلاً رمز پیش‌فرض admin/admin).</li>
<li><strong>Buffer Overflows:</strong> سرریز بافر در برنامه‌ها که منجر به اجرای کد مخرب می‌شود.</li>
<li><strong>Unpatched Servers:</strong> سرورهایی که وصله‌های امنیتی (Patch) روی آن‌ها نصب نشده است.</li>
<li><strong>Design Flaws و Operation System Flaws:</strong> نقص در طراحی معماری یا سیستم‌عامل.</li>
<li><strong>Application Flaws:</strong> نقص در کد نرم‌افزارهای کاربردی (مثل SQL Injection).</li>
<li><strong>Open Services:</strong> سرویس‌های غیرضروری که باز هستند و می‌توانند نقطه ورود باشند.</li>
</ul>

<h2>02. سیستم‌های امتیازدهی و پایگاه‌های داده (CVSS, CVE, NVD, CWE)</h2>
<p>در دنیای امنیت، اگر نتوانیم یک آسیب‌پذیری را به یک زبان مشترک توصیف کنیم، نمی‌توانیم آن را مدیریت کنیم. به همین دلیل، چهار مفهوم اساسی وجود دارد که باید به خوبی بشناسید. این چهار مفهوم، مثل ارکان یک ساختمان هستند:</p>

<h3>۱-۲. Common Vulnerability Scoring System (CVSS)</h3>
<p><strong>CVSS</strong> یک استاندارد باز است که برای توصیف ویژگی‌ها و تأثیرات آسیب‌پذیری‌های IT استفاده می‌شود. این سیستم با استفاده از یک مدل کمی امتیازدهی، امکان اندازه‌گیری دقیق و قابل تکرار را فراهم می‌سازد.</p>

<img src="images/CEHv13_05/slide_7.webp" alt="CVSS" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۷: سیستم امتیازدهی CVSS و کاربردهای آن</div>

<p>ویژگی‌های کلیدی آسیب‌پذیری را به صورت عددی ثبت می‌کند و شدت آن را از طریق مقیاس ۱ تا ۱۰ نشان می‌دهد. سپس این مقدار عددی به صورت کیفی (کم، متوسط، زیاد، بحرانی) تفسیر می‌شود.</p>

<p><strong>گروه‌های متریک CVSS (Metrics):</strong></p>
<ul>
<li><strong>Base Metric (پایه):</strong> ویژگی‌های ذاتی آسیب‌پذیری که در طول زمان و در محیط‌های کاربری مختلف ثابت هستند (شامل Exploitability و Impact).</li>
<li><strong>Threat Metric (تهدید):</strong> ویژگی‌های مربوط به تهدیدات که ممکن است در طول زمان تغییر کنند (مثل اینکه آیا اکسپلویت برای این آسیب‌پذیری به صورت عمومی منتشر شده است یا خیر).</li>
<li><strong>Environmental Metric (محیطی):</strong> ویژگی‌هایی از آسیب‌پذیری که مختص محیط یا مصرف‌کننده خاصی هستند (مثلاً اهمیت آن سیستم برای کسب‌وکار).</li>
<li><strong>Supplemental Metric (تکمیلی):</strong> ویژگی‌های بیرونی اضافی که زمینه‌سازی می‌کنند (مثل قابلیت خودکارسازی یا میزان تلاش برای رفع).</li>
</ul>

<p><strong>مقیاس شدت CVSS:</strong></p>
<table>
<thead><tr><th>Severity</th><th>Base Score Range</th></tr></thead>
<tbody>
<tr><td>None (هیچ)</td><td>0.0</td></tr>
<tr><td>Low (کم)</td><td>0.1 - 3.9</td></tr>
<tr><td>Medium (متوسط)</td><td>4.0 - 6.9</td></tr>
<tr><td>High (زیاد)</td><td>7.0 - 8.9</td></tr>
<tr><td>Critical (بحرانی)</td><td>9.0 - 10.0</td></tr>
</tbody>
</table>

<div class="box note"><i class="fas fa-calculator"></i><div><strong>برداری از CVSS (CVSS Vector)</strong>یک آسیب‌پذیری با بردار زیر را تصور کنید:<br><code style="direction:ltr; display:inline-block;">CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H</code><br>این بردار نشان می‌دهد که حمله از طریق شبکه (AV:N)، پیچیدگی پایین (AC:L)، بدون نیاز به دسترسی (PR:N) و بدون تعامل کاربر (UI:N) است و تأثیر آن بر محرمانگی، یکپارچگی و دسترس‌پذیری، بالا (H) است. این ترکیب، معمولاً امتیاز 9.8 (Critical) را به همراه دارد.</div></div>

<h3>۲-۲. Common Vulnerability and Exposures (CVE)</h3>
<p><strong>CVE</strong> یک لیست عمومی و رایگان از آسیب‌پذیری‌های افشا شده است. هر آسیب‌پذیری در CVE یک شناسه منحصربه‌فرد (مثل CVE-2024-23296) دریافت می‌کند. این شناسه‌ها به عنوان یک زبان مشترک برای ابزارهای مختلف اسکن آسیب‌پذیری عمل می‌کنند.</p>

<h3>۳-۲. National Vulnerability Database (NVD)</h3>
<p><strong>NVD</strong> مخزن رسمی دولت ایالات متحده برای داده‌های مدیریت آسیب‌پذیری است. در واقع، NVD اطلاعات CVE را غنی‌سازی می‌کند و امتیاز CVSS، دسته‌بندی CWE و سایر اطلاعات فنی را به آن اضافه می‌کند.</p>

<img src="images/CEHv13_05/slide_11.webp" alt="NVD" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۱: نمونه‌ای از یک رکورد CVE در پایگاه داده NVD</div>

<h3>۴-۲. Common Weakness Enumeration (CWE)</h3>
<p><strong>CWE</strong> یک سیستم دسته‌بندی برای آسیب‌پذیری‌ها و ضعف‌های نرم‌افزاری است. اگر CVE به یک آسیب‌پذیری *خاص* اشاره دارد، CWE به *نوع* آن ضعف اشاره می‌کند. مثلاً CWE-79 به "Cross-Site Scripting" (XSS) اشاره دارد. این استاندارد توسط مرکز تحقیقات امنیت سایبری ملی آمریکا (FFRDC) پشتیبانی می‌شود و متعلق به شرکت MITRE است.</p>

<img src="images/CEHv13_05/slide_12.webp" alt="CWE" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۲: وب‌سایت Common Weakness Enumeration (CWE)</div>

<div class="box important"><i class="fas fa-link"></i><div><strong>رابطه این چهار مفهوم را حفظ کنید:</strong><br>
<strong>CWE</strong> = نوع ضعف (مثلاً XSS).<br>
<strong>CVE</strong> = شناسه یک آسیب‌پذیری خاص (مثلاً CVE-2024-1234).<br>
<strong>CVSS</strong> = امتیاز شدت آن آسیب‌پذیری (مثلاً 9.8).<br>
<strong>NVD</strong> = پایگاه داده‌ای که همه این اطلاعات را در کنار هم دارد.</div></div>

<h3>منابع تحقیق آسیب‌پذیری</h3>
<p>علاوه بر NVD، منابع دیگری برای تحقیق درباره آسیب‌پذیری‌ها وجود دارد:</p>
<ul>
<li><strong>Exploit Database:</strong> بزرگ‌ترین آرشیو عمومی اکسپلویت‌ها و Dorkها.</li>
<li><strong>Microsoft Vulnerability Research (MSVR):</strong> اطلاعات آسیب‌پذیری‌های مایکروسافت.</li>
<li><strong>Security Focus و Security Tracker:</strong> پایگاه‌های داده امنیتی.</li>
<li><strong>SC Magazine، Computerworld و Trend Micro:</strong> مجلات و منابع خبری امنیتی.</li>
</ul>

<img src="images/CEHv13_05/slide_13.webp" alt="Vulnerability Research Resources" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۳: منابع مختلف برای تحقیق در مورد آسیب‌پذیری‌ها</div>

<h2>03. چرخه مدیریت آسیب‌پذیری (Vulnerability Management Life Cycle)</h2>
<p>مدیریت آسیب‌پذیری یک فرآیند ۸ مرحله‌ای و مستمر است که به سازمان کمک می‌کند تا نقاط ضعف خود را به طور مداوم شناسایی، ارزیابی و رفع کند.</p>

<img src="images/CEHv13_05/slide_14.webp" alt="Vulnerability Management Life Cycle" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۴: چرخه ۸ مرحله‌ای مدیریت آسیب‌پذیری</div>

<ol>
<li><strong>Identify Assets (شناسایی دارایی‌ها):</strong> چه سیستم‌ها، سرورها و تجهیزاتی در شبکه داریم؟</li>
<li><strong>Create a Baseline (ایجاد خط پایه):</strong> وضعیت امنیتی اولیه سیستم‌ها را ثبت می‌کنیم تا بعداً تغییرات را بسنجیم.</li>
<li><strong>Vulnerability Scan (اسکن آسیب‌پذیری):</strong> اسکن خودکار برای یافتن نقاط ضعف.</li>
<li><strong>Vulnerability Analysis (تحلیل):</strong> آیا آسیب‌پذیری‌های یافت‌شده واقعاً قابل بهره‌برداری هستند؟ (کاهش False Positive).</li>
<li><strong>Risk Assessment (ارزیابی ریسک):</strong> اولویت‌بندی آسیب‌پذیری‌ها بر اساس شدت (CVSS) و اهمیت دارایی.</li>
<li><strong>Remediation (اصلاح/درمان):</strong> نصب وصله، تغییر پیکربندی یا اعمال کنترل‌های جبرانی.</li>
<li><strong>Verification (تأیید):</strong> آیا اقدامات اصلاحی واقعاً مؤثر بوده‌اند؟ (اسکن مجدد).</li>
<li><strong>Monitoring (پایش):</strong> نظارت مستمر برای شناسایی آسیب‌پذیری‌های جدید.</li>
</ol>

<h2>04. Vulnerability Scanning and Analysis</h2>
<p><strong>اسکن آسیب‌پذیری</strong> شامل تحلیل پروتکل‌ها، سرویس‌ها و تنظیمات برای کشف آسیب‌پذیری‌ها و نقص‌های طراحی است. ابزارهای اسکنر به دنبال چه چیزهایی می‌گردند؟</p>
<ul>
<li>نسخه سیستم‌عامل دستگاه‌ها (OS Version).</li>
<li>پورت‌های باز TCP/UDP.</li>
<li>اپلیکیشن‌های نصب‌شده (Installed Applications).</li>
<li>حساب‌های کاربری با رمز عبور ضعیف (Weak Passwords).</li>
<li>پوشه‌ها با مجوزهای ضعیف (Weak Permissions).</li>
<li>پیکربندی‌های شبکه ضعیف یا خطرناک.</li>
<li>تنظیمات نادرست امنیتی.</li>
</ul>

<h2>05. انواع ارزیابی آسیب‌پذیری (Types of Assessment)</h2>
<p>بسته به اینکه از کجا اسکن می‌کنیم، چه چیزی را هدف قرار می‌دهیم و چه سطحی از دسترسی داریم، ارزیابی آسیب‌پذیری به دسته‌های زیر تقسیم می‌شود:</p>

<img src="images/CEHv13_05/slide_16.webp" alt="Types of Vulnerability Assessment" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۶: ۹ نوع مختلف ارزیابی آسیب‌پذیری</div>

<ul>
<li><strong>External Scanning:</strong> اسکن از دید یک هکر در اینترنت (برای یافتن آسیب‌پذیری‌های قابل دسترسی از بیرون).</li>
<li><strong>Internal Scanning:</strong> اسکن زیرساخت داخلی برای یافتن آسیب‌پذیری‌ها (پس از عبور از فایروال).</li>
<li><strong>Host-based Scanning:</strong> بررسی سطح پیکربندی سیستم‌عامل، فایل‌ها و رجیستری.</li>
<li><strong>Network-based Scanning:</strong> تعیین حملات شبکه‌ای ممکن بر روی سیستم‌های سازمان.</li>
<li><strong>Application Scanning:</strong> تست و تحلیل وب‌سایت‌ها و اپلیکیشن‌ها برای یافتن نقص‌های پیکربندی و کد.</li>
<li><strong>Credentialed Scanning:</strong> اسکن با دسترسی معتبر (نام کاربری و رمز) برای بررسی دقیق‌تر و کامل‌تر.</li>
<li><strong>Non-Credentialed Scanning:</strong> اسکن بدون دسترسی معتبر (مثل یک هکر خارجی).</li>
<li><strong>Manual Scanning:</strong> شناسایی و ارزیابی دستی آسیب‌پذیری‌ها.</li>
<li><strong>Automated Scanning:</strong> استفاده از ابزارهای خودکار مثل Nessus، Qualys و GFI LanGuard.</li>
</ul>

<h2>06. ویژگی‌های یک راهکار ارزیابی خوب</h2>
<p>یک ابزار ارزیابی آسیب‌پذیری خوب باید چه ویژگی‌هایی داشته باشد؟</p>
<ul>
<li><strong>دقت:</strong> اطمینان از نتایج صحیح در تست شبکه، منابع، پورت‌ها و سیستم‌عامل‌ها.</li>
<li><strong>به‌روزرسانی:</strong> امکان اسکن خودکار و بروزرسانی دائمی پایگاه داده.</li>
<li><strong>گزارش‌دهی:</strong> امکان ایجاد گزارش‌های مختصر، عملی، قابل تنظیم و مبتنی بر شدت آسیب‌پذیری.</li>
<li><strong>پشتیبانی:</strong> پشتیبانی از شبکه‌های مختلف و ارائه راه‌حل برای اصلاح آسیب‌پذیری‌ها.</li>
<li><strong>عدم اختلال:</strong> عدم ایجاد اختلال در کارایی شبکه و کسب‌وکار.</li>
<li><strong>زمان‌بندی:</strong> امکان ذخیره نتایج و زمان‌بندی در انجام اسکن.</li>
</ul>

<h2>07. ابزارهای اسکن آسیب‌پذیری</h2>
<p>ابزارهای متعددی برای اسکن آسیب‌پذیری وجود دارد که معروف‌ترین آن‌ها عبارتند از:</p>

<img src="images/CEHv13_05/slide_18.webp" alt="Vulnerability Scanning Tools" class="pdf-image" loading="lazy">

<ul>
<li><strong>Nessus:</strong> محبوب‌ترین و قدرتمندترین ابزار اسکن آسیب‌پذیری (تجاری).</li>
<li><strong>OpenVAS:</strong> نسخه متن‌باز و رایگان Nessus.</li>
<li><strong>Qualys Free Scan:</strong> ابزار ابری محبوب.</li>
<li><strong>GFI LanGuard:</strong> تمرکز بر شبکه‌های ویندوزی.</li>

<h2>08. گزارش‌های ارزیابی آسیب‌پذیری (Vulnerability Assessment Reports)</h2>
<p>پس از اتمام اسکن، نوبت به نگارش گزارش می‌رسد. گزارش باید شامل سه بخش اصلی باشد:</p>

<div class="section-header"><div class="section-badge">13</div><div><h1>احراز هویت و رمز عبور</h1><div class="meta">Module 06 · System Hacking · Session 1 of 4</div></div></div>

<p>در جلسات قبل یاد گرفتیم چطور نقاط ضعف را پیدا کنیم. حالا وقت آن است که از این نقاط ضعف استفاده کنیم. در این جلسه، با <strong>System Hacking</strong> آشنا می‌شویم و به طور خاص، روی اولین و مهم‌ترین سد دفاعی یعنی <strong>رمز عبور</strong> تمرکز می‌کنیم. یاد می‌گیریم ویندوز رمزها را کجا و چگونه ذخیره می‌کند، چرا بعضی از الگوریتم‌های هش قدیمی خطرناک هستند و چگونه می‌توان با تکنیک‌های مختلف آن‌ها را شکست.</p>

<h2>01. متدولوژی هک CEH و اهداف System Hacking</h2>
<p>در متدولوژی CEH، ما ۵ فاز اصلی داریم. تا الان ۴ فاز اول را پشت سر گذاشتیم:</p>
<ol>
<li><strong>Footprinting (جمع‌آوری اطلاعات)</strong></li>
<li><strong>Scanning (اسکن شبکه)</strong></li>
<li><strong>Enumeration (شمارش و شناسایی دقیق)</strong></li>
<li><strong>Vulnerability Analysis (تحلیل آسیب‌پذیری)</strong></li>
</ol>

<p>و حالا به فاز پنجم و هیجان‌انگیزترین بخش می‌رسیم: <strong>System Hacking</strong>. این فاز خودش شامل چهار مرحله است:</p>

<img src="images/CEHv13_06/slide_3.webp" alt="CEH Hacking Methodology" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳: مراحل System Hacking در متدولوژی CEH</div>

<ul>
<li><strong>Gaining Access (کسب دسترسی):</strong> نفوذ به سیستم از طریق کرک رمز عبور یا اکسپلویت کردن یک آسیب‌پذیری.</li>
<li><strong>Escalating Privileges (ارتقای دسترسی):</strong> از یک کاربر معمولی به یک ادمین (Admin) تبدیل شدن.</li>
<li><strong>Maintaining Access (حفظ دسترسی):</strong> نصب بک‌دور (Backdoor) برای برگشتن در آینده.</li>
<li><strong>Clearing Logs (پاک کردن ردپا):</strong> پاک کردن لاگ‌ها تا شناسایی نشویم.</li>
</ul>

<h2>02. احراز هویت مایکروسافت (Microsoft Authentication)</h2>
<p>ویندوز رمزهای عبور را به صورت متن ساده (Clear Text) ذخیره نمی‌کند. در عوض، آن‌ها را به صورت <strong>هش (Hash)</strong> ذخیره می‌کند. هش یک تابع یک‌طرفه است که ورودی را به یک رشته با طول ثابت تبدیل می‌کند و برگرداندن آن به حالت اولیه تقریباً غیرممکن است.</p>

<h3>۱-۲. پایگاه داده SAM (Security Account Manager)</h3>
<p>در ویندوز، رمزهای عبور محلی در فایلی به نام <strong>SAM</strong> ذخیره می‌شوند. این فایل در مسیر زیر قرار دارد:</p>
<div class="code-container"><div class="code-label">path · windows</div><pre class="code-block no-prompt">C:\\Windows\\System32\\config\\SAM</pre></div>

<img src="images/CEHv13_06/slide_6.webp" alt="SAM File Structure" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۶: ساختار فایل SAM (Username، User ID، LM Hash، NTLM Hash)</div>

<p>همان‌طور که در تصویر می‌بینید، ساختار هر خط شامل نام کاربری، شناسه کاربری (User ID)، هش LM و هش NTLM است.</p>

<h3>۲-۲. فرآیند احراز هویت NTLM</h3>
<p><strong>NTLM</strong> (New Technology LAN Manager) یک پروتکل احراز هویت چالش-پاسخ (Challenge-Response) است. وقتی شما می‌خواهید به یک سرور یا دامنه وصل شوید، رمز عبور شما به هش تبدیل می‌شود و این هش با یک "چالش" (یک عدد تصادفی) ترکیب شده و به سمت سرور می‌رود.</p>

<img src="images/CEHv13_06/slide_9.webp" alt="NTLM Authentication Process" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۹: فرآیند احراز هویت NTLM (Challenge-Response)</div>

<ul>
<li>کلاینت درخواست الگین می‌فرستد.</li>
<li>سرور (Domain Controller) یک چالش (عدد تصادفی) ارسال می‌کند.</li>
<li>کلاینت هش رمز عبور را با چالش ترکیب کرده و پاسخ (Response) را می‌فرستد.</li>
<li>سرور پاسخ را با هش ذخیره‌شده خود مقایسه می‌کند. اگر مطابقت داشت، ورود موفق است.</li>
</ul>

<h3>۳-۲. فرآیند احراز هویت Kerberos</h3>
<p>مایکروسافت احراز هویت پیش‌فرض خود را در دامنه‌ها به <strong>Kerberos</strong> ارتقا داده است که قدرتمندتر از NTLM است. این پروتکل از یک مرکز توزیع کلید (KDC) استفاده می‌کند که شامل دو بخش است:</p>
<ul>
<li><strong>Authentication Server (AS):</strong> هویت کاربر را تأیید می‌کند و یک Ticket Granting Ticket (TGT) به او می‌دهد.</li>
<li><strong>Ticket Granting Server (TGS):</strong> با استفاده از TGT، یک Service Ticket برای دسترسی به سرویس مورد نظر صادر می‌کند.</li>
</ul>

<img src="images/CEHv13_06/slide_10.webp" alt="Kerberos Authentication" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۰: فرآیند احراز هویت Kerberos (KDC، AS، TGS)</div>

<h2>03. هش‌های ویندوز (LM در برابر NTLM)</h2>
<p>ویندوز از دو نوع هش برای ذخیره رمز عبور استفاده می‌کند:</p>

<h3>۱-۳. LM Hash (Lan Manager Hash)</h3>
<p>این الگوریتم بسیار قدیمی و به شدت ضعیف است. نحوه کار آن به این صورت است:</p>
<ul>
<li>رمز عبور به حروف بزرگ (Uppercase) تبدیل می‌شود.</li>
<li>به دو نیمه ۷ کاراکتری تقسیم می‌شود.</li>
<li>هر نیمه با الگوریتم DES رمزنگاری می‌شود.</li>
</ul>

<img src="images/CEHv13_06/slide_7.webp" alt="LM Hash Calculation" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۷: نحوه محاسبه LM Hash (تقسیم به دو نیمه ۷ کاراکتری)</div>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>ضعف بزرگ LM Hash:</strong> اگر رمز عبور کمتر از ۷ کاراکتر باشد، نیمه دوم آن همیشه یک مقدار ثابت است: <code>AAD3B435B51404EE</code>. همچنین چون به حروف بزرگ تبدیل می‌شود، حساسیت به حروف بزرگ و کوچک از بین می‌رود. از ویندوز ویستا به بعد، LM Hash به طور پیش‌فرض غیرفعال شده است.</div></div>

<h3>۲-۳. NTLM Hash</h3>
<p>این الگوریتم مدرن‌تر است و از تابع هش <strong>MD4</strong> استفاده می‌کند. برخلاف LM، NTLM به حروف بزرگ و کوچک حساس است و کل رمز عبور را به یکباره هش می‌کند. با این حال، هنوز هم در برابر حملات Rainbow Table آسیب‌پذیر است.</p>

<h2>04. نمک زدن به رمز عبور (Password Salting)</h2>
<p>برای جلوگیری از حملات Rainbow Table (جدول‌های از پیش محاسبه‌شده)، از تکنیکی به نام <strong>Salting</strong> استفاده می‌شود. در این روش، یک رشته تصادفی (Salt) به رمز عبور اضافه می‌شود و سپس هش گرفته می‌شود.</p>

<img src="images/CEHv13_06/slide_11.webp" alt="Password Salting" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۱: تکنیک Password Salting</div>

<p>مزیت: حتی اگر دو کاربر رمز عبور یکسانی داشته باشند، به دلیل Salt متفاوت، هش‌های متفاوتی خواهند داشت. این کار کرک کردن رمز را بسیار دشوارتر می‌کند.</p>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته بسیار مهم برای آزمون CEH:</strong> <strong>هش‌های ویندوز (NTLM) به صورت پیش‌فرض Salt نمی‌شوند!</strong> این یعنی اگر دو کاربر ویندوزی رمز عبور یکسانی داشته باشند، هش آن‌ها دقیقاً یکسان خواهد بود. این یکی از دلایلی است که حمله به هش‌های ویندوز بسیار رایج است.</div></div>

<h2>05. تکنیک‌های کرک رمز عبور (Password Cracking)</h2>
<p>حالا که فهمیدیم رمزها چطور ذخیره می‌شوند، بیایید ببینیم مهاجم چطور آن‌ها را می‌شکند. تکنیک‌های کرک به چهار دسته اصلی تقسیم می‌شوند:</p>

<img src="images/CEHv13_06/slide_13.webp" alt="Types of Password Attacks" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۳: دسته‌بندی حملات رمز عبور (Passive, Active, Offline, Non-Electronic)</div>

<h3>۱-۵. حملات غیرفعال آنلاین (Passive Online Attacks)</h3>
<p>مهاجم فقط ترافیک شبکه را شنود می‌کند و هیچ تعاملی با سیستم قربانی ندارد.</p>
<ul>
<li><strong>Wire Sniffing:</strong> شنود بسته‌ها در شبکه (مخصوصاً در هاب‌ها).</li>
<li><strong>MITM (Man-in-the-Middle):</strong> قرار گرفتن بین دو طرف ارتباط در سوئیچ‌ها.</li>
<li><strong>Replay Attack:</strong> ضبط بسته‌های احراز هویت و ارسال مجدد آن‌ها.</li>
</ul>

<h3>۲-۵. حملات فعال آنلاین (Active Online Attacks)</h3>
<p>مهاجم به طور فعال با سیستم هدف تعامل می‌کند تا رمز عبور را حدس بزند یا استخراج کند.</p>
<ul>
<li><strong>Password Guessing:</strong> حدس زدن رمز عبور با استفاده از اطلاعات عمومی (تاریخ تولد، نام).</li>
<li><strong>Trojan/Spyware/Keylogger:</strong> نصب نرم‌افزار مخرب برای ثبت کلیدهای فشرده‌شده.</li>
<li><strong>Hash Injection / Pass the Hash:</strong> دزدیدن هش NTLM و استفاده از آن برای احراز هویت بدون نیاز به رمز عبور اصلی.</li>
<li><strong>LLMNR/NBT-NS Poisoning:</strong> (در بخش بعدی به طور کامل توضیح داده می‌شود).</li>
</ul>

<h3>۳-۵. حملات آفلاین (Offline Attacks)</h3>
<p>مهاجم فایل SAM یا هش‌ها را به دست می‌آورد و در سیستم خود (بدون ارتباط با هدف) اقدام به کرک آن می‌کند.</p>
<ul>
<li><strong>Rainbow Attack:</strong> استفاده از جدول‌های از پیش محاسبه‌شده برای برگرداندن هش به رمز.</li>
<li><strong>Dictionary Attack:</strong> تست لیستی از کلمات رایج.</li>
<li><strong>Brute Force Attack:</strong> تست تمام ترکیب‌های ممکن (زمان‌بر اما جامع).</li>
<li><strong>Rule-based Attack:</strong> ترکیب دیکشنری و تغییرات روی کلمات (مثلاً <code>password</code> -> <code>P@ssword123</code>).</li>
</ul>

<h3>۴-۵. حملات غیرالکترونیکی (Non-Electronic Attacks)</h3>
<ul>
<li><strong>Shoulder Surfing:</strong> نگاه کردن از روی شانه.</li>
<li><strong>Social Engineering:</strong> فریب دادن کاربر برای افشای رمز.</li>
<li><strong>Dumpster Diving:</strong> جستجو در زباله‌ها برای یافتن یادداشت‌های رمز.</li>
</ul>

<h2>06. مسمومیت LLMNR / NBT-NS (LLMNR/NBT-NS Poisoning)</h2>
<p>این یکی از هوشمندانه‌ترین و خطرناک‌ترین حملات در شبکه‌های ویندوزی است. وقتی یک کاربر می‌خواهد به یک منابع اشتراکی (مثلاً <code>\\\\FileServer</code>) دسترسی پیدا کند، ویندوز ابتدا از DNS می‌پرسد. اگر DNS پاسخ ندهد (مثلاً به دلیل اشتباه تایپی یا سرور DNS در دسترس نباشد)، ویندوز به عنوان یک مکانیزم پشتیبان، یک درخواست <strong>Broadcast</strong> به کل شبکه محلی می‌فرستد و می‌پرسد: "آیا کسی FileServer را می‌شناسد؟"</p>

<img src="images/CEHv13_06/slide_15.webp" alt="LLMNR Poisoning" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۵: مسمومیت LLMNR/NBT-NS (مهاجم خود را به جای سرور واقعی جا می‌زند)</div>

<p>مهاجم با ابزاری مثل <strong>Responder</strong> در شبکه گوش می‌دهد. وقتی این درخواست Broadcast را می‌بیند، بلافاصله پاسخ می‌دهد: "من FileServer هستم! هش NTLM خود را برای احراز هویت به من بده." کاربر ناآگاهانه هش خود را برای مهاجم می‌فرستد. مهاجم حالا می‌تواند این هش را به صورت آفلاین کرک کند یا از آن برای حملات Pass-the-Hash استفاده کند.</p>

<div class="box warning"><i class="fas fa-shield-alt"></i><div><strong>چگونه از LLMNR Poisoning جلوگیری کنیم؟</strong><br>۱. <strong>غیرفعال کردن LLMNR:</strong> از طریق Group Policy (Computer Configuration > Administrative Templates > Network > DNS Client).<br>۲. <strong>غیرفعال کردن NetBIOS over TCP/IP:</strong> در تنظیمات کارت شبکه (IPv4 > Advanced > WINS).</div></div>

<img src="images/CEHv13_06/slide_19.webp" alt="Disable LLMNR" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۹: غیرفعال کردن LLMNR از طریق Group Policy</div>

<h2>07. ابزارهای کرک رمز عبور</h2>
<p>ابزارهای زیادی برای کرک رمز عبور وجود دارد که معروف‌ترین آن‌ها عبارتند از:</p>

<img src="images/CEHv13_06/slide_18.webp" alt="Password Cracking Tools" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۱۸: لیست ابزارهای کرک رمز عبور</div>

<ul>
<li><strong>John the Ripper:</strong> یکی از محبوب‌ترین و قدرتمندترین ابزارهای کرک رمز (متن‌باز).</li>
<li><strong>L0phtCrack:</strong> ابزار ویندوزی برای استخراج و کرک هش‌های SAM.</li>
<li><strong>Cain & Abel:</strong> یک ابزار جامع برای بازیابی رمز عبور و تحلیل شبکه.</li>
<li><strong>Ophcrack:</strong> ابزاری مبتنی بر جدول‌های Rainbow برای کرک هش‌های LM و NTLM.</li>
<li><strong>Pwdump / FGdump:</strong> برای استخراج هش‌ها از حافظه سیستم.</li>
</ul>

<h2>08. روش‌های مقابله با کرک رمز عبور</h2>
<p>برای جلوگیری از شکستن رمز عبور، باید اقدامات زیر را انجام داد:</p>

<img src="images/CEHv13_06/slide_20.webp" alt="Password Cracking Countermeasures" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۰: راه‌های مقابله با کرک رمز عبور</div>

<ul>
<li>ایجاد پسورد پیچیده به طول ۸ تا ۱۲ کاراکتر (حروف بزرگ، کوچک، اعداد و علائم).</li>
<li>استفاده از Policy برای تغییر دوره‌ای پسورد (مثلاً هر ۳۰ روز).</li>
<li>مانیتور کردن لاگ‌های سرور برای شناسایی حملات Brute Force.</li>
<li>غیرفعال کردن حساب‌هایی که تعداد زیادی تلاش برای ورود دارند (Account Lockout).</li>
<li>عدم استفاده از رمزهای دیکشنری، تاریخ تولد و نام افراد.</li>
<li>عدم استفاده از رمزهای پیش‌فرض.</li>
<li>استفاده از تکنیک <strong>Salting</strong> برای ذخیره‌سازی پسوردها.</li>
</ul>

<div class="section-header"><div class="section-badge">14</div><div><h1>بهره‌برداری و ارتقای دسترسی</h1><div class="meta">Module 06 · System Hacking · Session 2 of 4</div></div></div>

<p>در جلسه قبل یاد گرفتیم چطور با کرک رمز عبور یا دزدیدن هش، به یک سیستم نفوذ کنیم. اما نفوذ با یک حساب کاربری معمولی (User) معمولاً کافی نیست. یک هکر اخلاقی باید بداند چطور دسترسی خود را به سطح مدیر (Administrator/root) ارتقا دهد تا به اطلاعات حساس دسترسی پیدا کند. در این جلسه، با ابزار محبوب <strong>Metasploit</strong> و تکنیک‌های <strong>Privilege Escalation</strong> آشنا می‌شویم.</p>

<h2>01. متاسپلویت (Metasploit Framework)</h2>
<p>Metasploit یکی از قدرتمندترین و محبوب‌ترین چارچوب‌های تست نفوذ در دنیاست. در حقیقت، امروزه Metasploit یک مجموعه یکپارچه از اجزای حمله است که به شما امکان می‌دهد از جمع‌آوری اطلاعات تا اکسپلویت کردن و نگهداری دسترسی را در یک محیط واحد انجام دهید.</p>

<img src="images/CEHv13_06/slide_21.webp" alt="Metasploit Framework" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۱: لوگوی Metasploit و کاربردهای آن</div>

<p>عملیاتی که در Metasploit قابل انجام است:</p>
<ul>
<li>جمع‌آوری اطلاعات (Information Gathering)</li>
<li>اسکن شبکه (Network Scanning)</li>
<li>اکسپلویتینگ (Exploiting)</li>
<li>ایجاد محتوای مخرب و عبور از سیستم‌های امنیتی</li>
<li>انجام حملات کلمه عبور (Password Attacks)</li>
<li>انجام حملات علیه برنامه‌های تحت وب (Web Application Attacks)</li>
</ul>

<h3>ماژول‌های اصلی Metasploit</h3>
<p>محیط Metasploit از چندین ماژول اصلی تشکیل شده است که هر کدام نقش خاصی دارند:</p>

<img src="images/CEHv13_06/slide_22.webp" alt="Metasploit Modules" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۲: چهار ماژول اصلی Metasploit</div>

<ul>
<li><strong>Auxiliary (کمکی):</strong> ابزارهای جانبی مثل اسکنرها، Snifferها، حملات Brute Force و ماژول‌های جمع‌آوری اطلاعات. (این ماژول‌ها مستقیماً سیستم را هک نمی‌کنند، بلکه اطلاعات جمع می‌کنند).</li>
<li><strong>Exploit (اکسپلویت):</strong> کدی که از یک آسیب‌پذیری خاص (مثلاً در SMB یا Apache) سوءاستفاده می‌کند و باعث اجرای کد روی سیستم هدف می‌شود.</li>
<li><strong>Payload (پی‌لود):</strong> کدی که <em>بعد از</em> موفقیت اکسپلویت، روی سیستم هدف اجرا می‌شود. مثلاً یک Shell (شل معکوس یا بایند) که به مهاجم دسترسی می‌دهد.</li>
<li><strong>Post (پس از بهره‌برداری):</strong> ماژول‌هایی که بعد از به دست آوردن دسترسی اجرا می‌شوند (مثلاً برای جمع‌آوری پسوردها، ارتقای دسترسی، یا Pivoting).</li>
</ul>

<div class="code-container"><div class="code-label">bash · msfconsole</div><pre class="code-block">msfconsole
msf6 > use exploit/windows/smb/ms17_010_eternalblue
msf6 exploit(ms17_010_eternalblue) > set RHOSTS 10.10.10.10
msf6 exploit(ms17_010_eternalblue) > set PAYLOAD windows/x64/meterpreter/reverse_tcp
msf6 exploit(ms17_010_eternalblue) > exploit</pre></div>

<h2>02. ارتقای سطح دسترسی (Privilege Escalation)</h2>
<p><strong>Privilege Escalation</strong> به فرآیندی گفته می‌شود که در آن یک نفوذگر با استفاده از یک اکانت معمولی به شبکه متصل شده و در مرحله بعد دسترسی خود را به سطح مدیر (Administrator/root) افزایش می‌دهد.</p>

<p>ارتقای سطح دسترسی به نفوذگر این اجازه را می‌دهد تا به اطلاعات حساس دسترسی پیدا کند، فایل‌ها را حذف نماید، برنامه‌های مخرب نصب نموده و یا مواردی از این دست را انجام دهد.</p>

<img src="images/CEHv13_06/slide_23.webp" alt="Privilege Escalation Concept" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۳: مفهوم Privilege Escalation (از کاربر عادی به ادمین)</div>

<h3>انواع Privilege Escalation</h3>
<p>Privilege Escalation به دو دسته زیر تقسیم می‌شود:</p>

<img src="images/CEHv13_06/slide_24.webp" alt="Horizontal vs Vertical Privilege Escalation" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۴: تفاوت Horizontal و Vertical Privilege Escalation</div>

<ul>
<li><strong>Horizontal Privilege Escalation (افقی):</strong> در این روش، یک کاربر غیرمجاز تلاش می‌کند تا به منابع، توابع و موارد دیگر از <strong>یک کاربر مجاز در سطح دسترسی خودش</strong> دسترسی پیدا کند. (مثلاً کاربر A به منابع کاربر B دسترسی پیدا کند، هر دو در یک سطح هستند).</li>
<li><strong>Vertical Privilege Escalation (عمودی):</strong> در این روش، یک کاربر غیرمجاز تلاش می‌کند تا به منابع، توابع و موارد دیگر از <strong>یک کاربر مجاز با سطح دسترسی بالاتر از خودش</strong> دسترسی پیدا کند. (مثلاً کاربر A به منابع ادمین دسترسی پیدا کند).</li>
</ul>

<h2>03. PrivEsc با اکسپلویت کردن آسیب‌پذیری‌ها</h2>
<p>در این روش، نفوذگر با استفاده از اکسپلویت نمودن یک آسیب‌پذیری نرم‌افزاری یا سخت‌افزاری، سطح دسترسی خود را ارتقا می‌دهد. برای این منظور، نفوذگر می‌تواند در سایت <strong>Exploit-DB</strong> جستجو کرده و اکسپلویت‌های مورد نظر خود برای بالا بردن سطح دسترسی را شناسایی نماید.</p>

<img src="images/CEHv13_06/slide_25.webp" alt="Exploit-DB Privilege Escalation" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۵: جستجوی اکسپلویت‌های Privilege Escalation در Exploit-DB</div>

<h3>آسیب‌پذیری‌های Spectre و Meltdown</h3>
<p>این دو آسیب‌پذیری در سطح سخت‌افزار (پردازنده) هستند و بسیار خطرناک محسوب می‌شوند:</p>

<img src="images/CEHv13_06/slide_26.webp" alt="Spectre and Meltdown" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۶: آسیب‌پذیری‌های Spectre و Meltdown (CVE-2017-5754، CVE-2017-5715)</div>

<ul>
<li><strong>Meltdown (CVE-2017-5754):</strong> به هکرها امکان می‌دهد تا به قطعات حافظه کامپیوتر که توسط برنامه‌ها و سیستم‌عامل مورد استفاده قرار می‌گیرند، دسترسی داشته باشند. این حفره بر پردازشگرهای <strong>Intel</strong> تأثیرگذار است.</li>
<li><strong>Spectre (CVE-2017-5715 و CVE-2017-5753):</strong> به هکرها اجازه می‌دهد تا به اطلاعات نفوذ یافته در فایل‌های Kernel/Cache یا داده‌های ذخیره شده در حافظه برنامه‌های در حال اجرا (همچون گواهی‌ها، رمز عبورها، کلیدهای Login) دسترسی پیدا کنند. این آسیب‌پذیری بر پردازنده‌های <strong>Intel، AMD و ARM</strong> اثرگذار است.</li>
</ul>

<h2>04. PrivEsc با Named Pipe Impersonation</h2>
<p>در سیستم‌عامل ویندوز، از <strong>Named Pipe</strong>ها به منظور ارتباط بین پروسس‌های در حال اجرا استفاده می‌گردد. در این تکنیک، پیام‌ها به وسیله یک فایل بین پروسس‌ها مبادله می‌شود.</p>

<img src="images/CEHv13_06/slide_27.webp" alt="Named Pipe Impersonation" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۲۷: نحوه کارکرد Named Pipe و Impersonation</div>

<p>به عنوان مثال، اگر پروسس A بخواهد یک پیام را برای پروسس B ارسال کند، آن را در یک فایل نوشته و پروسس B آن پیام را از این فایل می‌خواند.</p>

<ul>
<li>هنگامی که یک پروسس یک Pipe را ایجاد می‌کند، نقش یک <strong>Pipe Server</strong> را بازی می‌کند.</li>
<li>اگر هر پروسس دیگری بخواهد با این پروسس ارتباط برقرار کند، به عنوان <strong>Pipe Client</strong> این کار را انجام خواهد داد.</li>
<li>هنگامی که یک کلاینت به Pipe Server متصل می‌شود، Pipe Client می‌تواند از <strong>Security Context و Access Privilege</strong> مربوط به Pipe Server بهره‌برداری نماید.</li>
</ul>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>نحوه سوءاستفاده مهاجم:</strong> نفوذگر از این ویژگی سوءاستفاده نموده و با ایجاد یک <strong>Pipe Server با دسترسی پایین</strong>، سعی می‌کند تا یک کلاینت با <strong>دسترسی بالاتر</strong> (مثلاً ادمین) را به سرور خود متصل کند. سپس با Impersonation، هویت آن کلاینت را جعل کرده و دسترسی خود را ارتقا می‌دهد.</div></div>

<h2>05. PrivEsc با Service Object Permission</h2>
<p>گاهی اوقات تنظیمات اشتباه برای یک سرویس (Service) ممکن است به نفوذگر اجازه تغییر یا تنظیم مجدد Attributeهای مرتبط با سرور را بدهد. این موضوع حتی می‌تواند منجر به تغییر مسیر اجرای برنامه توسط نفوذگر شده و موجب اجرای فایل‌های مخرب شود.</p>

<p>اگر یک سرویس با دسترسی SYSTEM اجرا شود و مهاجم بتواند فایل اجرایی آن سرویس را جایگزین کند، دفعه بعد که سرویس استارت می‌شود، کد مخرب مهاجم با بالاترین سطح دسترسی اجرا خواهد شد.</p>

<h2>06. PrivEsc با Unattended Install</h2>
<p>نصب <strong>Unattended</strong> به نفوذگران اجازه می‌دهد که تا سیستم‌عامل ویندوز را بدون دخالت ادمین Deploy نمایند. مدیران شبکه می‌بایست فایل‌های نصب را که اغلب در فایلی با نام <strong>Unattend.xml</strong> ذخیره می‌شود را حذف نمایند.</p>

<p>در این فایل اطلاعات زیادی در خصوص تنظیمات و فرآیندهای نصب سیستم‌عامل قرار دارد (تنظیمات، نام کاربری یا حتی پسورد). این فایل‌ها در مسیرهای زیر قرار دارند:</p>

<div class="code-container"><div class="code-label">path · windows unattend</div><pre class="code-block no-prompt">C:\\windows\\Panther
C:\\windows\\Panther\\Unattend\\
C:\\windows\\System32\\
C:\\windows\\Panther\\sysprep</pre></div>

<p>اگر این فایل‌ها پاک نشوند، مهاجم می‌تواند با دسترسی به آن‌ها، رمز عبور ادمین محلی (Local Admin) را استخراج کند.</p>

<h2>07. چرخش و پاسخ به ماشین‌های خارجی (Pivoting)</h2>
<p>در این دستور <code>route</code> در Metrepreter، تمامی ترافیک‌های محیط کنسول از طریق ارتباط با آدرس وارد شده هدایت می‌شوند. به این کار <strong>Pivoting</strong> می‌گویند.</p>

<img src="images/CEHv13_06/slide_31.webp" alt="Pivoting" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۱: مفهوم Pivoting (استفاده از سیستم هک‌شده برای حمله به شبکه‌های داخلی)</div>

<p>فرض کنید شما یک ماشین (Target1) را هک کرده‌اید. این ماشین به شبکه داخلی دیگری متصل است که از اینترنت قابل دسترسی نیست. با استفاده از Pivoting، شما از Target1 به عنوان یک پل (Router) استفاده می‌کنید و با تنظیم مسیرها، به سراغ Target2 می‌روید.</p>

<div class="code-container"><div class="code-label">bash · meterpreter</div><pre class="code-block">meterpreter > route add 10.0.0.0 255.255.255.0 1
msf6 > use exploit/windows/smb/ms17_010_eternalblue
msf6 exploit(ms17_010_eternalblue) > set RHOSTS 10.0.0.5
msf6 exploit(ms17_010_eternalblue) > set PAYLOAD windows/x64/meterpreter/reverse_tcp
msf6 exploit(ms17_010_eternalblue) > exploit</pre></div>

<h2>08. ابزارهای ارتقای دسترسی</h2>
<p>ابزارهای متعددی برای کشف خودکار مسیرهای ارتقای دسترسی وجود دارد که در تست‌های نفوذ بسیار کمک‌کننده هستند:</p>

<img src="images/CEHv13_06/slide_32.webp" alt="Privilege Escalation Tools" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۳۲: ابزارهای BeRoot (ویندوز) و Linprivchecker (لینوکس)</div>

<ul>
<li><strong>BeRoot (ویندوز):</strong> اسکریپتی که سیستم را بررسی کرده و پیکربندی‌های اشتباه (مثل سرویس‌های آسیب‌پذیر یا مجوزهای ضعیف) را پیدا می‌کند.</li>
<li><strong>Linprivchecker (لینوکس):</strong> ابزاری برای بررسی سیستم‌های لینوکسی و پیدا کردن راه‌های ارتقای دسترسی.</li>
<li><strong>ابزارهای دیگر:</strong> PowerUp، WinPEAS، LinPEAS، Seatbelt.</li>
</ul>

<h3>🧠 جمع‌بندی جلسه ۶-۲</h3>
<p><strong>۱.</strong> Metasploit یک چارچوب یکپارچه برای تست نفوذ است و شامل ماژول‌های Auxiliary (اسکن)، Exploit (بهره‌برداری)، Payload (اجرای کد) و Post (پس از بهره‌برداری) است.</p>
<p><strong>۲.</strong> Privilege Escalation به دو نوع Horizontal (دسترسی به منابع هم‌سطح) و Vertical (دسترسی به منابع سطح بالاتر) تقسیم می‌شود.</p>
<p><strong>۳.</strong> آسیب‌پذیری‌های سخت‌افزاری Spectre و Meltdown امکان خواندن حافظه محافظت‌شده را فراهم می‌کنند و بسیار خطرناک هستند.</p>
<p><strong>۴.</strong> پیکربندی اشتباه سرویس‌ها (Service Object Permission) و فایل‌های نصب خودکار (Unattend.xml) از رایج‌ترین دلایل ارتقای دسترسی در ویندوز هستند.</p>
<p><strong>۵.</strong> با Pivoting می‌توان از یک سیستم هک‌شده به عنوان پل برای حمله به شبکه‌های داخلی استفاده کرد.</p>
<p><strong>۶.</strong> ابزارهایی مثل BeRoot و Linprivchecker به کشف خودکار مسیرهای ارتقای دسترسی کمک می‌کنند.</p>
