<p>همه این اقدامات دفاعی، در واقع یک هدف مشترک دارند: محدود کردن دسترسی و افزایش آگاهی. همین اصول در مقابله با مهندسی اجتماعی هم به کار می‌آیند.</p>

<h2>04. مقابله با مهندسی اجتماعی (Countermeasures)</h2>
<p>چون مهندسی اجتماعی از انسان سوءاستفاده می‌کند، دفاع در برابر آن نیازمند ترکیبی از <strong>فناوری</strong>، <strong>سیاست</strong> و <strong>آموزش</strong> است. در این بخش، سه لایه اصلی دفاع را مرور می‌کنیم: امنیت فیزیکی، سیاست کلمه عبور و اقدامات تکمیلی.</p>

<h3>۱-۴. سیاست امنیت فیزیکی</h3>
<p>امنیت فیزیکی اولین سد دفاعی است. اگر مهاجم نتواند وارد ساختمان شود، بسیاری از حملات Human-Based (مثل Tailgating و Impersonation) از همان ابتدا شکست می‌خورند:</p>
<ul>
<li><strong>شناسایی کارمندان با ID Card، یونیفرم و غیره.</strong></li>
<li><strong>همراهی ملاقات‌کنندگان (Escorting):</strong> هیچ ملاقات‌کننده‌ای نباید بدون همراه در ساختمان حرکت کند.</li>
<li><strong>محدودسازی دسترسی به محیط‌های کاری مختلف (حساس و محافظت‌شده).</strong></li>
<li><strong>امحای مناسب اطلاعات (استفاده از کاغذ خردکن):</strong> اسناد حاوی اطلاعات حساس باید قبل از دور ریخته شدن، خرد شوند.</li>
<li><strong>استفاده از افراد مناسب جهت امنیت فیزیکی (حراست).</strong></li>
</ul>

<h3>۲-۴. سیاست کلمه عبور</h3>
<p>حتی اگر مهاجم وارد ساختمان شود، سیاست کلمه عبور قوی می‌تواند جلوی دسترسی به سیستم‌ها را بگیرد:</p>
<ul>
<li><strong>تغییر کلمه عبور به صورت زمان‌بندی شده:</strong> مثلاً هر ۳۰ یا ۶۰ روز.</li>
<li><strong>عدم تنظیم کلمه عبور قابل حدس:</strong> مثل تاریخ تولد، نام فرزند، یا کلماتی مثل <code>123456</code>.</li>
<li><strong>مسدودسازی حساب کاربری بعد از تلاش‌های ناموفق (Account Lockout).</strong></li>
<li><strong>افزایش تعداد کاراکترهای تنظیم‌شده برای کلمه عبور:</strong> حداقل ۸ تا ۱۲ کاراکتر.</li>
<li><strong>تنظیم کلمه عبور پیچیده:</strong> ترکیبی از حروف بزرگ، کوچک، اعداد و علائم.</li>
<li><strong>رازداری کلمه عبور:</strong> هرگز رمز عبور خود را با دیگران به اشتراک نگذارید.</li>
</ul>

<h3>۳-۴. موارد تکمیلی (برخی از مهم‌ترین اقدامات)</h3>
<p>علاوه بر دو لایه قبل، مجموعه‌ای از اقدامات تکمیلی وجود دارد که مکمل دفاع هستند. این اقدامات را می‌توانید بر اساس اینکه روی «انسان»، «فرآیند» یا «فناوری» تمرکز دارند دسته‌بندی کنید:</p>

<ul>
<li><strong>آموزش افراد سازمان در مورد مهندسی اجتماعی و تکنیک‌های آن:</strong> این مهم‌ترین راه دفاع است. کارمندان باید بدانند که چگونه یک حمله را تشخیص دهند.</li>
<li><strong>وجود سطوح دسترسی مشخص در سازمان:</strong> هر کس فقط به اطلاعاتی که برای کارش لازم است دسترسی داشته باشد.</li>
<li><strong>دسترسی به اطلاعات تنها برای کاربران احراز هویت شده.</strong></li>
<li><strong>دسته‌بندی اطلاعات و مشخص نمودن افراد مجاز برای دسترسی به آن‌ها.</strong></li>
<li><strong>وجود یک تیم پاسخ‌گویی به حادثه (Incident Response Team) در سازمان.</strong></li>
<li><strong>استفاده از Background Check در فرآیند استخدام افراد.</strong></li>
<li><strong>ایجاد فرآیند مناسب در خاتمه همکاری افراد.</strong></li>
<li><strong>استفاده از لایه‌های مختلف امنیتی مانند آنتی‌ویروس و سیستم تشخیص نفوذ.</strong></li>
<li><strong>استفاده از احراز هویت دو مرحله‌ای (MFA).</strong></li>
<li><strong>ایجاد فرآیند Change Management.</strong></li>
<li><strong>اطمینان از بروزرسانی سیستم‌عامل و نرم‌افزارها.</strong></li>
</ul>

<h2>05. شناسایی ایمیل‌های Phishing و ابزارهای آن</h2>
<p>در جلسه قبل یاد گرفتیم که فیشینگ چیست. حالا می‌خواهیم ببینیم چطور می‌توان یک ایمیل فیشینگ را در عمل شناسایی کرد و چه ابزارهایی برای این کار وجود دارد.</p>

<h3>۱-۵. چگونه یک ایمیل فیشینگ را شناسایی کنیم؟</h3>
<p>ایمیل‌های فیشینگ اغلب نشانه‌هایی دارند که اگر به آن‌ها دقت کنید، می‌توانید آن‌ها را تشخیص دهید:</p>

<img src="images/CEHv13_09/slide_61.webp" alt="Spot Phishing Email" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۶۱: نشانه‌های شناسایی ایمیل فیشینگ (آدرس ایمیل، لینک‌ها، متن)</div>

<ul>
<li><strong>آدرس ایمیل فرستنده را با دقت بررسی کنید:</strong> به جای <code>support@bank.com</code>، ممکن است <code>support@bankk.com</code> (با دو k) یا <code>support@bank-support.com</code> باشد.</li>
<li><strong>به لحن پیام توجه کنید:</strong> اگر پیام فوریت دارد (مثلاً «فوراً رمز عبور خود را تغییر دهید»)، باید شک کنید.</li>
<li><strong>روی لینک‌ها کلیک نکنید:</strong> ماوس را روی لینک نگه دارید (بدون کلیک) تا ببینید آدرس واقعی مقصد چیست.</li>
<li><strong>به پیوست‌ها شک کنید:</strong> هرگز فایل‌های <code>.exe</code>، <code>.zip</code> یا <code>.pdf</code> ناشناس را باز نکنید.</li>
<li><strong>به خطاهای املایی توجه کنید:</strong> ایمیل‌های فیشینگ اغلب دارای غلط املایی یا گرامری هستند.</li>
</ul>

<h3>۲-۵. ابزارهای شناسایی و شبیه‌سازی Phishing</h3>
<p>علاوه بر دقت انسانی، ابزارهایی هم وجود دارند که می‌توانند در شناسایی و آموزش فیشینگ کمک کنند:</p>

<h4>۱-۲-۵. Netcraft Extension</h4>
<p><strong>Netcraft</strong> یک افزونه مرورگر است که وب‌سایت‌های مشکوک را شناسایی و مسدود می‌کند. وقتی شما وارد یک صفحه فیشینگ می‌شوید، Netcraft هشدار می‌دهد که «این صفحه مشکوک است» و از شما می‌خواهد که آن را ترک کنید.</p>

<img src="images/CEHv13_09/slide_62.webp" alt="Netcraft" class="pdf-image" loading="lazy">
<div class="image-caption">اسلاید ۶۲: افزونه Netcraft برای شناسایی صفحات فیشینگ</div>

<h4>۲-۲-۵. PhishTank</h4>
<p><strong>PhishTank</strong> یک پایگاه داده آنلاین از وب‌سایت‌های فیشینگ است. کاربران می‌توانند آدرس‌های مشکوک را در آن ثبت کنند تا توسط دیگران تأیید شوند. افزونه PhishTank نیز در مرورگرها قابل نصب است.</p>

<h4>۳-۲-۵. GoPhish</h4>
<p><strong>GoPhish</strong> یک ابزار متن‌باز برای <strong>شبیه‌سازی حملات فیشینگ</strong> است. این ابزار برای تست نفوذ اخلاقی استفاده می‌شود تا سازمان‌ها بتوانند کارمندان خود را آموزش دهند و ببینند که آیا آن‌ها در برابر فیشینگ آسیب‌پذیر هستند یا نه. (البته مهاجمان هم می‌توانند از آن استفاده کنند!)</p>

                    a.addEventListener('click', function(e) {
                        e.preventDefault();
                        const index = allSections.findIndex(s => s.id === sec.id);
                        if (index !== -1) showSection(index);
                    });
                    li.appendChild(a);
                    ul.appendChild(li);
                });
                details.appendChild(ul);
                toc.appendChild(details);
            });
        }

        function buildSections() {
            const main = document.getElementById('mainContent');
            main.innerHTML = '';
            allSections.forEach((sec, idx) => {
                const div = document.createElement('div');
                div.className = 'section' + (idx === 0 ? ' active' : '');
                div.id = sec.id;
                const isFirst = idx === 0;
                const isLast = idx === allSections.length - 1;
                let body = '';
                if (richContent[sec.id]) {
                    body = richContent[sec.id];
                } else {
                    body = `
                        <div class="section-header">
                            <div class="section-badge">${sec.badge}</div>
                            <div>
                                <h1>${sec.title}</h1>
                                <div class="meta">Module ${sec.badge} · ${sec.chapterTitle} · Session ${toFa(sec.sectionIndex + 1)} of ${toFa(sec.totalInChapter)}</div>
                            </div>
                        </div>
                        <div class="placeholder">
                            <i class="fas fa-terminal"></i>
                            <p>محتوای این جلسه در حال آماده‌سازی است...</p>
                            <p style="font-size:0.88rem;margin-top:6px;opacity:0.7;">${sec.chapterTitle} — ${sec.title}</p>
                        </div>
                    `;
                }
                body += `
                    <div class="nav-buttons">
                        <button class="nav-btn" ${isFirst ? 'disabled' : ''} onclick="goToPrev()">
                            ${isFirst ? 'جلسه قبلی' : '<i class="fas fa-arrow-right"></i> جلسه قبلی'}
                        </button>
                        <button class="nav-btn" ${isLast ? 'disabled' : ''} onclick="goToNext()">
                            ${isLast ? 'پایان' : 'جلسه بعدی <i class="fas fa-arrow-left"></i>'}
                        </button>
                    </div>
                `;
                div.innerHTML = body;
                main.appendChild(div);
            });
        }

        function showSection(index) {
            if (index < 0 || index >= allSections.length) return;
            currentIndex = index;
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(allSections[index].id);
            if (target) target.classList.add('active');
            document.querySelectorAll('.toc-sections a').forEach(a => {
                a.classList.remove('active');
                if (a.dataset.id === allSections[index].id) a.classList.add('active');
            });
            const chIdx = allSections[index].chapterIndex;
            document.querySelectorAll('.toc-chapter').forEach((d, i) => { d.open = (i === chIdx); });
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (window.innerWidth <= 1000) closeSidebar();
        }

        function goToPrev() { if (currentIndex > 0) showSection(currentIndex - 1); }
        function goToNext() { if (currentIndex < allSections.length - 1) showSection(currentIndex + 1); }

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const toggleBtn = document.getElementById('sidebarToggle');
        const closeBtn = document.getElementById('sidebarClose');

        function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); document.body.style.overflow = 'hidden'; }
        function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = ''; }

        toggleBtn.addEventListener('click', openSidebar);
        closeBtn.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') !== 'light';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('ceh-theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.querySelector('.theme-icon');
            if (!icon) return;
            if (theme === 'light') {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            } else {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
        }

        const savedTheme = localStorage.getItem('ceh-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme === 'light' ? 'light' : 'dark');
        updateThemeIcon(savedTheme);

        function selectOption(btn) {
            const parent = btn.parentElement;
            if (parent.classList.contains('answered')) return;
            parent.classList.add('answered');
            const isCorrect = btn.dataset.correct === 'true';
            parent.querySelectorAll('button').forEach(b => {
                b.classList.remove('selected', 'correct', 'wrong');
                if (b.dataset.correct === 'true') b.classList.add('correct');
            });
            if (!isCorrect) btn.classList.add('wrong');
            parent.nextElementSibling.classList.add('show');
        }

        window.onscroll = function() {
            const scroll = document.documentElement.scrollTop || document.body.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            document.getElementById('progressBar').style.width = (height > 0 ? (scroll / height * 100) : 0) + '%';
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSidebar();
            if (e.key === 'ArrowLeft') goToNext();
            if (e.key === 'ArrowRight') goToPrev();
        });

        function wrapTables() {
            document.querySelectorAll('.section table').forEach(function(table) {
                if (table.parentElement && table.parentElement.classList.contains('table-wrap')) return;
                var wrap = document.createElement('div');
                wrap.className = 'table-wrap';
                table.parentNode.insertBefore(wrap, table);
                wrap.appendChild(table);
            });
        }


        // ---------- بهبودهای ظاهری درسنامه ----------
        // شماره‌ی ابتدای تیترهای h2 (مثل «01.») به صورت چیپ جدا نمایش داده می‌شود
        function enhanceHeadings() {
            document.querySelectorAll('.section h2').forEach(function(h) {
                if (h.classList.contains('has-num')) return;
                var m = h.textContent.match(/^\s*([0-9۰-۹]{1,3})\s*[.\-–:]\s*(.+)$/s);
                if (!m) return;
                h.classList.add('has-num');
                h.innerHTML = '<span class="h2-num"></span><span class="h2-text"></span>';
                h.querySelector('.h2-num').textContent = m[1];
                h.querySelector('.h2-text').textContent = m[2];
            });
        }

        // هر تصویر اسلاید + کپشن داخل یک کادر (figure) و قابل بزرگ‌نمایی
        function enhanceSlides() {
            document.querySelectorAll('.section img.pdf-image').forEach(function(img) {
                if (img.parentElement.classList.contains('slide-fig')) return;
                var fig = document.createElement('figure');
                fig.className = 'slide-fig';
                img.parentNode.insertBefore(fig, img);
                fig.appendChild(img);
                var cap = fig.nextElementSibling;
                if (cap && cap.classList.contains('image-caption')) fig.appendChild(cap);
                img.decoding = 'async';
                img.addEventListener('click', function() { openLightbox(img); });
            });
        }

        var lightbox = document.getElementById('lightbox');
        function openLightbox(img) {
            document.getElementById('lightboxImg').src = img.currentSrc || img.src;
            document.getElementById('lightboxImg').alt = img.alt || '';
            var cap = img.parentElement.querySelector('.image-caption');
            document.getElementById('lightboxCap').textContent = cap ? cap.textContent : '';
            lightbox.classList.add('open');
            lightbox.setAttribute('aria-hidden', 'false');
        }
        function closeLightbox() {
            lightbox.classList.remove('open');
            lightbox.setAttribute('aria-hidden', 'true');
        }
        lightbox.addEventListener('click', closeLightbox);
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });

        // اندازه‌ی فونت (ذخیره در مرورگر)
        var fontScale = parseFloat(localStorage.getItem('ceh-fs')) || 1;
        function applyFont() { document.documentElement.style.setProperty('--fs', fontScale); }
        function changeFont(dir) {
            fontScale = Math.min(1.3, Math.max(0.85, Math.round((fontScale + dir * 0.05) * 100) / 100));
            localStorage.setItem('ceh-fs', fontScale);
            applyFont();
        }
        applyFont();

        buildTOC();
        buildSections();
        wrapTables();
        enhanceHeadings();
        enhanceSlides();
        showSection(0); // شروع از جلسه ۱
    </script>

</body>
</html>
