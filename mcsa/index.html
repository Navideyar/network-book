  <h1>MPIO و Data Deduplication — مسیرهای چندگانه و حذف داده‌های تکراری</h1>
  <div class="meta">فصل ۵ · iSCSI، MPIO و Data Deduplication · جلسه ۲ از ۲</div>
</div>

<p>در جلسه قبل با Storage و iSCSI آشنا شدیم؛ یعنی امکان اتصال سرور به فضای ذخیره‌سازی از طریق شبکه. در این جلسه دو قابلیت مهم Windows Server را یاد می‌گیریم:</p>

<ul>
  <li><strong>MPIO:</strong> استفاده از چند مسیر ارتباطی برای دسترسی مطمئن‌تر به Storage.</li>
  <li><strong>Data Deduplication:</strong> کاهش فضای مصرف‌شده با حذف نگهداری تکراری داده‌ها.</li>
</ul>

<div class="box note">
  <strong>هدف درس:</strong> بتوانی تشخیص بدهی چه زمانی به MPIO برای افزایش دسترس‌پذیری نیاز داریم و چه زمانی Data Deduplication برای صرفه‌جویی در فضای ذخیره‌سازی مفید است.
</div>

<h2 class="lesson-title">۱. MPIO چیست؟</h2>

<p>عبارت <strong>MPIO</strong> مخفف <strong>Multipath I/O</strong> است. این قابلیت اجازه می‌دهد سرور از چند مسیر ارتباطی برای دسترسی به یک دستگاه ذخیره‌سازی استفاده کند.</p>

<p>فرض کن یک سرور از طریق شبکه به یک Storage مرکزی متصل است. اگر فقط یک مسیر ارتباطی داشته باشیم و همان مسیر قطع شود، ممکن است سرور دسترسی خود را به Storage از دست بدهد.</p>

<div class="code-container">
  <span class="code-label">بدون MPIO</span>
  <div class="code-block no-prompt">Server
   |
   | یک مسیر
   |
Storage</div>
</div>

<p>حالا اگر چند مسیر مستقل و درست پیکربندی‌شده داشته باشیم، در صورت از کار افتادن یکی از مسیرها، مسیر دیگری می‌تواند ارتباط را برقرار نگه دارد.</p>

<div class="code-container">
  <span class="code-label">با MPIO</span>
  <div class="code-block no-prompt">          ┌── Path 1 ──┐
Server ───┤            ├── Storage
          └── Path 2 ──┘</div>
</div>

<div class="box important">
  <strong>نکته مهم:</strong> وجود دو کابل یا دو کارت شبکه به‌تنهایی به معنی راه‌اندازی MPIO نیست. مسیرها، Storage، درایورها و تنظیمات مربوط باید از چندمسیره بودن پشتیبانی کنند و درست پیکربندی شوند.
</div>

<h2 class="lesson-title">۲. مزایای MPIO</h2>

<table>
  <thead>
    <tr>
      <th>قابلیت</th>
      <th>توضیح</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><strong>Failover</strong></td>
      <td>در صورت خرابی یک مسیر، استفاده از مسیر جایگزین؛ به شرط پیکربندی صحیح.</td>
    </tr>
    <tr>
      <td><strong>Load Balancing</strong></td>
      <td>توزیع درخواست‌های ورودی و خروجی بین مسیرها، در صورت پشتیبانی و انتخاب سیاست مناسب.</td>
    </tr>
    <tr>
      <td><strong>Availability</strong></td>
      <td>افزایش دسترس‌پذیری Storage در برابر خرابی یک مسیر.</td>
    </tr>
  </tbody>
</table>

<div class="box note">
  <strong>تفاوت مهم:</strong> Failover روی ادامه کار هنگام خرابی یک مسیر تمرکز دارد؛ Load Balancing روی استفاده از مسیرها برای توزیع بار تمرکز می‌کند. رفتار واقعی به تنظیمات و پشتیبانی تجهیزات بستگی دارد.
</div>

<h2 class="lesson-title">۳. آشنایی با DSM</h2>

<p><strong>DSM</strong> مخفف <strong>Device Specific Module</strong> است. در محیط‌های MPIO، ماژول‌های DSM می‌توانند نحوه مدیریت مسیرهای مربوط به دستگاه ذخیره‌سازی را تعیین کنند.</p>

<p>بسته به نوع Storage و سازنده آن، ممکن است به DSM مخصوص نیاز داشته باشیم. بنابراین قبل از راه‌اندازی، سازگاری تجهیزات و راهنمای سازنده را بررسی می‌کنیم.</p>

<div class="box warning">
  <strong>نکته اجرایی:</strong> فعال‌کردن MPIO به‌تنهایی تضمین نمی‌کند که همه مسیرهای Storage شناسایی یا به‌درستی استفاده شوند. شناسایی دستگاه، سازگاری سخت‌افزار و تنظیمات مسیرها نیز اهمیت دارند.
</div>

<h2 class="lesson-title">۴. نصب و بررسی MPIO در Windows Server</h2>

<p>در محیطی که تجهیزات از MPIO پشتیبانی می‌کنند، روند کلی به این صورت است:</p>

<ol>
  <li>وارد <strong>Server Manager</strong> شو.</li>
  <li>از مسیر <strong>Manage → Add Roles and Features</strong>، ویزارد نصب قابلیت‌ها را باز کن.</li>
  <li>در بخش <strong>Features</strong>، قابلیت <strong>Multipath I/O</strong> را انتخاب کن.</li>
  <li>مراحل نصب را کامل کن؛ اگر سیستم درخواست راه‌اندازی مجدد داشت، طبق برنامه انجام بده.</li>
  <li>ابزار MPIO را باز کن و دستگاه‌های چندمسیره را مطابق مستندات Storage شناسایی و تنظیم کن.</li>
  <li>مسیرها و وضعیت دسترسی به Storage را بررسی کن.</li>
</ol>

<div class="box important">
  <strong>احتیاط:</strong> روی سرور عملیاتی، تنظیم مسیرهای Storage را بدون بررسی مستندات سازنده و برنامه تغییرات انجام نده. پیکربندی اشتباه ممکن است دسترسی به دیسک‌ها را مختل کند.
</div>

<h2 class="lesson-title">۵. Data Deduplication چیست؟</h2>

<p><strong>Data Deduplication</strong> قابلیتی برای کاهش فضای ذخیره‌سازی مصرف‌شده توسط داده‌های تکراری است.</p>

<p>فرض کن یک فایل مشابه در تعداد زیادی پوشه یا نسخه‌های مختلف داده وجود داشته باشد. در حالت عادی ممکن است داده‌های یکسان چندین بار ذخیره شوند. Deduplication داده‌ها را تحلیل می‌کند و با نگهداری یک نسخه از بخش‌های تکراری و استفاده از ارجاع‌ها به آن‌ها، می‌تواند فضای مصرفی را کاهش دهد.</p>

<div class="code-container">
  <span class="code-label">مفهوم ساده</span>
  <div class="code-block no-prompt">قبل:
File A → داده X
File B → داده X
File C → داده X

پس از Deduplication:
داده X → یک نسخه مشترک
File A ─┐
File B ─┼── ارجاع به داده X
File C ─┘</div>
</div>

<p>این نمایش فقط برای درک مفهوم است؛ روش داخلی ذخیره‌سازی به پیاده‌سازی Windows Server وابسته است و لزوماً به معنی ساخت یک فایل معمولی مشترک نیست.</p>

<h2 class="lesson-title">۶. مزایای Data Deduplication</h2>

<ul>
  <li>کاهش فضای ذخیره‌سازی موردنیاز.</li>
  <li>استفاده بهینه‌تر از ظرفیت Volume.</li>
  <li>امکان نگهداری داده‌های بیشتر روی فضای موجود.</li>
  <li>مفید بودن برای داده‌هایی که بخش‌های تکراری زیادی دارند؛ مانند بعضی مخازن فایل و نسخه‌های پشتیبان.</li>
</ul>

<div class="box note">
  <strong>مثال:</strong> اگر یک سرور فایل تعداد زیادی نسخه مشابه از اسناد یا فایل‌های یکسان داشته باشد، Deduplication ممکن است فضای قابل‌توجهی ذخیره کند. میزان صرفه‌جویی به نوع داده و میزان تکرار آن بستگی دارد.
</div>

<h2 class="lesson-title">۷. نصب و فعال‌سازی Data Deduplication</h2>

<p>مراحل کلی فعال‌سازی در Windows Server به این شکل است:</p>

<ol>
  <li>در <strong>Server Manager</strong> وارد <strong>Manage → Add Roles and Features</strong> شو.</li>
  <li>در بخش مربوط به قابلیت‌ها، گزینه <strong>Data Deduplication</strong> را در قسمت <strong>File and Storage Services</strong> پیدا و انتخاب کن.</li>
  <li>نصب را کامل کن.</li>
  <li>از بخش <strong>File and Storage Services → Volumes</strong>، Volume موردنظر را بررسی و تنظیمات Deduplication را مطابق نیاز انجام بده.</li>
  <li>نوع کاربرد Volume و زمان‌بندی بهینه‌سازی را متناسب با حجم کاری انتخاب کن.</li>
  <li>پس از فعال‌سازی، وضعیت بهینه‌سازی و میزان فضای صرفه‌جویی‌شده را پایش کن.</li>
</ol>

<div class="box warning">
  <strong>قبل از فعال‌سازی:</strong> پشتیبانی نسخه Windows Server، نوع Volume و مناسب‌بودن حجم کاری را بررسی کن. همه داده‌ها و همه بارهای کاری به یک اندازه برای Deduplication مناسب نیستند.
</div>

      <td>نسخه‌های پشتیبان با داده‌های تکراری</td>
      <td>ممکن است صرفه‌جویی خوبی ایجاد کند؛ سازگاری نرم‌افزار پشتیبان‌گیری را بررسی کن.</td>
    </tr>
    <tr>
      <td>فایل‌های از قبل فشرده‌شده یا رمزگذاری‌شده</td>

<h2 class="lesson-title">۱۰. سناریوی عملی</h2>

<p>یک شرکت سرور فایل دارد که از طریق iSCSI به Storage مرکزی وصل است. شرکت دو هدف دارد:</p>

<ul>
  <li>اگر یک مسیر ارتباطی از کار افتاد، سرور تا حد امکان دسترسی خود به Storage را حفظ کند.</li>
  <li>فضای مصرفی فایل‌های تکراری کاهش پیدا کند.</li>
</ul>

<p><strong>راه‌حل پیشنهادی:</strong></p>

<ol>
  <li>برای هدف اول، سازگاری Storage و شبکه را بررسی کرده و MPIO را با مسیرهای مستقل و پیکربندی صحیح راه‌اندازی می‌کنیم.</li>
  <li>برای هدف دوم، نوع داده‌ها و Volume را بررسی کرده و در صورت پشتیبانی و مناسب‌بودن، Data Deduplication را فعال می‌کنیم.</li>
  <li>پس از پیاده‌سازی، سلامت مسیرها، دسترسی به Storage و میزان صرفه‌جویی را پایش می‌کنیم.</li>
</ol>

<div class="box important">
  <strong>جمع‌بندی سناریو:</strong> MPIO برای مسیرهای دسترسی به Storage است؛ Data Deduplication برای استفاده بهینه از فضای ذخیره‌سازی.
</div>

<div class="section-header">
  <div class="section-badge">14</div>
  <h1>Name Resolution و DNS Namespace</h1>
  <div class="meta">فصل ۶ · سیستم‌های Name Resolution و راه‌اندازی DNS · جلسه ۱ از ۲</div>
</div>

<p>تصور کن می‌خواهی وارد یک وب‌سایت شوی. به‌جای حفظ کردن آدرس IP آن، نام سایت را وارد می‌کنی. کامپیوتر چگونه این نام را به آدرس IP تبدیل می‌کند؟ این کار به فرایندی به نام <strong>Name Resolution</strong> مربوط است.</p>

<div class="box note">
  <strong>هدف جلسه:</strong> با مفهوم Name Resolution، نقش DNS، ساختار نام‌های دامنه، FQDN و تفاوت نام میزبان با نام دامنه آشنا شوی.
</div>

<h2 class="lesson-title">۱. Name Resolution چیست؟</h2>

<p><strong>Name Resolution</strong> یعنی تبدیل یک نام قابل‌خواندن برای انسان به اطلاعاتی که سیستم بتواند برای برقراری ارتباط از آن استفاده کند؛ معمولاً آدرس IP.</p>

<p>برای مثال، کاربر می‌خواهد به سروری با نام زیر دسترسی پیدا کند:</p>

<div class="code-container">
  <span class="code-label">Example</span>
  <div class="code-block no-prompt">server01.example.com</div>
</div>

<p>کامپیوتر باید راهی پیدا کند تا آدرس IP مرتبط با این نام را به دست آورد.</p>

<div class="code-container">
  <span class="code-label">Name Resolution</span>
  <div class="code-block no-prompt">نام سرور
   ↓
Name Resolution
   ↓
آدرس IP
   ↓
برقراری ارتباط شبکه‌ای</div>
</div>

<p>این فرایند در شبکه‌های داخلی نیز اهمیت دارد؛ مثلاً وقتی کاربر می‌خواهد به یک File Server یا Domain Controller متصل شود.</p>

<h2 class="lesson-title">۲. DNS چیست؟</h2>

<p><strong>DNS</strong> مخفف <strong>Domain Name System</strong> است. DNS یک سیستم نام‌گذاری توزیع‌شده و سلسله‌مراتبی است که اطلاعات مربوط به نام‌های دامنه را نگهداری می‌کند و به پیدا کردن اطلاعات موردنیاز برای ارتباط با میزبان‌ها کمک می‌کند.</p>

<p>یکی از رایج‌ترین کاربردهای DNS، پیدا کردن آدرس IP متناظر با یک نام است.</p>

<div class="code-container">
  <span class="code-label">Example</span>
  <div class="code-block no-prompt">www.example.com
       ↓
      DNS
       ↓
     IP Address</div>
</div>

<p>DNS فقط برای تبدیل نام به IPv4 نیست. این سیستم می‌تواند اطلاعات دیگری مانند آدرس‌های IPv6، سرورهای ایمیل و سرویس‌های شبکه را نیز با استفاده از رکوردهای مختلف ارائه کند.</p>

<div class="box important">
  <strong>نکته مهم:</strong> DNS و IP جایگزین یکدیگر نیستند. نام برای شناسایی و استفاده آسان‌تر است؛ آدرس IP برای برقراری ارتباط شبکه‌ای کاربرد دارد.
</div>

<h2 class="lesson-title">۳. تفاوت Hostname، Domain Name و FQDN</h2>

<p>این سه اصطلاح شبیه یکدیگرند، اما معنی یکسانی ندارند.</p>

<table>
  <thead>
    <tr>
      <th>اصطلاح</th>
      <th>معنی</th>
      <th>مثال</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><strong>Hostname</strong></td>
      <td>نام یک میزبان در شبکه</td>
      <td><code>server01</code></td>
    </tr>
    <tr>
      <td><strong>Domain Name</strong></td>
      <td>نام یک دامنه در فضای نام DNS</td>
      <td><code>example.com</code></td>
    </tr>
    <tr>
      <td><strong>FQDN</strong></td>
      <td>نام کامل و دقیق یک میزبان در فضای نام DNS</td>
      <td><code>server01.example.com</code></td>
    </tr>
  </tbody>
</table>

<p><strong>FQDN</strong> مخفف <strong>Fully Qualified Domain Name</strong> است.</p>

<p>اگر نام میزبان <code>server01</code> در دامنه <code>example.com</code> قرار داشته باشد، نام کامل آن می‌تواند این باشد:</p>

<div class="code-container">
  <span class="code-label">FQDN</span>
  <div class="code-block no-prompt">server01.example.com</div>
</div>

<div class="box note">
  <strong>برای به خاطر سپردن:</strong>
  <ul>
    <li><code>server01</code> = نام میزبان</li>
    <li><code>example.com</code> = نام دامنه</li>
    <li><code>server01.example.com</code> = نام کامل میزبان در DNS</li>
  </ul>
</div>

<h2 class="lesson-title">۴. DNS Namespace چیست؟</h2>

<p><strong>DNS Namespace</strong> به ساختار سلسله‌مراتبی نام‌ها در DNS گفته می‌شود. این ساختار مانند یک درخت است که از ریشه شروع می‌شود و به دامنه‌ها و زیر‌دامنه‌ها می‌رسد.</p>

<div class="code-container">
  <span class="code-label">DNS Namespace</span>
  <div class="code-block no-prompt">                 Root (.)
                    |
          ┌─────────┴─────────┐
         com                 org
          |
       example
          |
       server01</div>
</div>

<p>در این مثال، نام کامل میزبان می‌تواند <code>server01.example.com</code> باشد. در نمایش معمولی نام‌ها، نقطه پایانی ریشه اغلب نوشته نمی‌شود؛ شکل کامل DNS آن از نظر نظری به صورت <code>server01.example.com.</code> نمایش داده می‌شود.</p>

<h2 class="lesson-title">۵. اجزای سلسله‌مراتب DNS</h2>

<h3>Root Domain</h3>
<p>ریشه بالاترین سطح فضای نام DNS است و با نقطه <code>.</code> نشان داده می‌شود.</p>

<h3>Top-Level Domain (TLD)</h3>
<p>دامنه سطح بالا بلافاصله زیر ریشه قرار دارد. نمونه‌ها:</p>
<ul>
  <li><code>.com</code></li>
  <li><code>.org</code></li>
  <li><code>.net</code></li>
  <li><code>.de</code></li>
</ul>

<h3>Second-Level Domain</h3>
<p>نامی است که زیر یک TLD قرار می‌گیرد. در <code>example.com</code>، عبارت <code>example</code> دامنه سطح دوم است.</p>

<h3>Subdomain</h3>
<p>زیر‌دامنه بخشی از فضای نام است که زیر یک دامنه دیگر قرار می‌گیرد. برای مثال، در <code>sales.example.com</code>، عبارت <code>sales</code> یک زیر‌دامنه از <code>example.com</code> است.</p>

<div class="code-container">
  <span class="code-label">ساختار نام</span>
  <div class="code-block no-prompt">server01.sales.example.com
│        │      │       │
│        │      │       └── TLD
│        │      └────────── Second-Level Domain
│        └───────────────── Subdomain
└────────────────────────── Hostname</div>
</div>

<div class="box important">
  <strong>نکته امتحانی:</strong> DNS ساختاری سلسله‌مراتبی دارد. هنگام خواندن نام‌های دامنه، بخش‌ها با نقطه از هم جدا می‌شوند و بخش سمت راست‌تر به سطح بالاتری از سلسله‌مراتب اشاره می‌کند.
</div>

<h2 class="lesson-title">۶. تفاوت DNS عمومی و DNS داخلی</h2>

<p>DNS می‌تواند در اینترنت عمومی یا در شبکه داخلی سازمان استفاده شود.</p>

<table>
  <thead>
    <tr>
      <th>نوع</th>
      <th>کاربرد</th>
      <th>مثال</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><strong>Public DNS</strong></td>
      <td>پاسخ‌گویی به نام‌هایی که در فضای DNS عمومی قابل‌دسترسی هستند</td>
      <td>نام یک وب‌سایت عمومی</td>
    </tr>
    <tr>
      <td><strong>Internal DNS</strong></td>
      <td>حل نام‌ها و ارائه اطلاعات DNS موردنیاز شبکه داخلی</td>
      <td><code>fileserver.corp.example.com</code></td>
    </tr>
  </tbody>
</table>

<p>در شبکه‌های سازمانی مبتنی بر Active Directory، DNS داخلی اهمیت زیادی دارد؛ زیرا کلاینت‌ها برای پیدا کردن سرویس‌های دامنه، از جمله Domain Controllerها، به رکوردهای DNS مناسب نیاز دارند.</p>

<div class="box warning">
  <strong>دقت کن:</strong> داخلی یا عمومی بودن DNS به کاربرد و پیکربندی آن مربوط است. هر نامی که ظاهری شبیه نام دامنه اینترنتی دارد، لزوماً از اینترنت قابل‌دسترسی نیست.
</div>

<h2 class="lesson-title">۷. آیا DNS تنها روش Name Resolution است؟</h2>

<p>خیر. سیستم‌عامل می‌تواند برای پیدا کردن آدرس مرتبط با یک نام از منابع مختلف استفاده کند. رفتار دقیق به سیستم‌عامل، نوع نام و تنظیمات شبکه بستگی دارد.</p>

<h3>DNS</h3>
<p>روش رایج برای حل نام‌های دامنه و میزبان در شبکه‌های IP است.</p>

<h3>Hosts File</h3>
<p>فایل محلی‌ای است که می‌توان در آن نام‌ها را به آدرس‌های IP مرتبط کرد. این فایل برای آزمایش یا تنظیمات خاص کاربرد دارد.</p>

<p>در Windows مسیر فایل Hosts معمولاً این است:</p>

<div class="code-container">
  <span class="code-label">Windows</span>
  <div class="code-block no-prompt">C:\\Windows\\System32\\drivers\\etc\\hosts</div>
</div>

<p>نمونه‌ای از یک ورودی Hosts:</p>

<div class="code-container">
  <span class="code-label">Hosts Entry</span>
  <div class="code-block no-prompt">192.168.1.10    fileserver</div>
</div>

<p>این ورودی یک نگاشت محلی بین نام <code>fileserver</code> و آدرس <code>192.168.1.10</code> ایجاد می‌کند. چنین نگاشتی به‌خودی‌خود رکوردی در DNS ایجاد نمی‌کند.</p>

<h3>LLMNR و NetBIOS Name Resolution</h3>
<p>در برخی شبکه‌ها و محیط‌های سازگار، روش‌های دیگری نیز برای حل نام‌های محلی وجود دارند؛ مانند LLMNR و NetBIOS Name Resolution. این روش‌ها با DNS یکسان نیستند و ممکن است به تنظیمات و محدودیت‌های امنیتی خاصی وابسته باشند.</p>

<div class="box note">
  <strong>نکته:</strong> در شبکه‌های سازمانی، برای نام‌گذاری قابل‌اعتماد و پیدا کردن سرویس‌های دامنه، معمولاً باید DNS به‌درستی پیکربندی شده باشد؛ نباید به روش‌های جایگزین حل نام تکیه کرد.
</div>

<h2 class="lesson-title">۸. روند ساده حل نام با DNS</h2>

<p>فرض کنیم کاربر می‌خواهد به <code>server01.example.com</code> متصل شود. در یک سناریوی ساده، روند به شکل زیر است:</p>

<ol>
  <li>برنامه از سیستم‌عامل درخواست می‌کند آدرس مرتبط با نام را پیدا کند.</li>
  <li>سیستم‌عامل منابع محلی و تنظیمات Name Resolution را طبق سیاست خود بررسی می‌کند.</li>
  <li>اگر لازم باشد، پرس‌وجوی DNS به DNS Resolver پیکربندی‌شده ارسال می‌شود.</li>
  <li>Resolver پاسخ را از حافظه Cache یا با پرس‌وجو از سرورهای DNS به دست می‌آورد.</li>
  <li>آدرس به برنامه برگردانده می‌شود تا بتواند ارتباط شبکه‌ای را برقرار کند.</li>
</ol>

<div class="box important">
  <strong>نکته کلیدی:</strong> دریافت پاسخ DNS به معنی تضمین برقراری ارتباط نیست. ممکن است آدرس پیدا شود، اما سرور خاموش باشد، مسیر شبکه مشکل داشته باشد یا اتصال توسط Firewall مسدود شود.
</div>

<div class="quiz-card">
  <p><strong>سؤال ۸:</strong> اگر DNS نام سرور را به IP تبدیل کند، آیا ارتباط حتماً برقرار می‌شود؟</p>
  <div class="quiz-options">

</div>

<h2 class="lesson-title">۱۰. جمع‌بندی نهایی</h2>

<div class="summary-box">

<div class="section-header">

<p>در جلسه قبل یاد گرفتیم DNS چیست و نام‌هایی مانند <code>server01.example.com</code> چگونه ساختار پیدا می‌کنند. در این جلسه یاد می‌گیریم درخواست DNS چگونه پاسخ داده می‌شود و چطور یک DNS Server را در Windows Server نصب و آزمایش کنیم.</p>

<div class="box note">
  <strong>اهداف جلسه:</strong>
  <ul>
    <li>درک تفاوت DNS Client، DNS Server و DNS Resolver.</li>
    <li>آشنایی با Recursive Query و Iterative Query.</li>
    <li>نصب DNS Server از طریق Server Manager.</li>
    <li>ساخت Forward Lookup Zone و رکورد A.</li>
    <li>آزمایش Name Resolution با ابزارهای Windows.</li>
  </ul>
</div>

<h2 class="lesson-title">۱. اجزای اصلی DNS</h2>

<p>برای درک عملکرد DNS بهتر است سه نقش را از هم جدا کنیم:</p>

<table>
  <thead>
    <tr><th>جزء</th><th>وظیفه</th></tr>
  </thead>
  <tbody>
    <tr><td><strong>DNS Client</strong></td><td>سیستمی که برای پیدا کردن اطلاعات یک نام، درخواست می‌فرستد؛ مانند کامپیوتر کاربر.</td></tr>
    <tr><td><strong>DNS Resolver</strong></td><td>بخشی که درخواست را پیگیری می‌کند تا پاسخ DNS به دست آید. معمولاً سیستم‌عامل یک Stub Resolver دارد و ممکن است از DNS Resolver شبکه استفاده کند.</td></tr>
    <tr><td><strong>DNS Server</strong></td><td>سروری که به درخواست DNS پاسخ می‌دهد؛ ممکن است پاسخ را از Zone خود، Cache یا سرورهای دیگر به دست آورد.</td></tr>
  </tbody>
</table>

<div class="code-container">
  <span class="code-label">مدل ساده</span>
  <div class="code-block no-prompt">Client
  |
  | DNS Query
  v
DNS Server / Resolver
  |
  | DNS Response
  v
Client</div>
</div>

<p>در شبکه سازمانی ممکن است DNS Server داخلی، اطلاعات مربوط به سرورهای شرکت را نگهداری کند و هم‌زمان برای نام‌های خارج از شبکه نیز پاسخ پیدا کند.</p>

<h2 class="lesson-title">۲. Recursive Query و Iterative Query</h2>

<h3>Recursive Query</h3>
<p>در درخواست Recursive، کلاینت از DNS Server می‌خواهد پاسخ نهایی را برایش پیدا کند یا در صورت امکان خطای مربوط را برگرداند. در این حالت کلاینت معمولاً خودش با مجموعه‌ای از DNS Serverها جست‌وجو نمی‌کند.</p>

<h3>Iterative Query</h3>
<p>در درخواست Iterative، سرور پاسخ موجود یا ارجاعی به سرور دیگری را برمی‌گرداند. Resolver می‌تواند با استفاده از این ارجاع‌ها به سرورهای بعدی مراجعه کند.</p>

<div class="code-container">
  <span class="code-label">مقایسه ساده</span>
  <div class="code-block no-prompt">Recursive:
Client ── "پاسخ نهایی را پیدا کن" ──▶ DNS Resolver

Iterative:
Resolver ──▶ DNS Server
Resolver ◀── پاسخ یا Referral
Resolver ──▶ سرور بعدی، در صورت نیاز</div>
</div>

<div class="box important">
  <strong>نکته امتحانی:</strong> در سناریوی معمول، کلاینت از DNS Resolver درخواست Recursive می‌کند و Resolver برای یافتن پاسخ ممکن است از Queryهای Iterative به سرورهای دیگر استفاده کند. این دو اصطلاح را با هم اشتباه نگیر.
</div>

<h2 class="lesson-title">۳. Cache در DNS</h2>

<p>برای اینکه هر درخواست مجبور نباشد از ابتدا همه مراحل را طی کند، پاسخ‌های DNS می‌توانند برای مدت مشخصی Cache شوند.</p>

<p>مدت نگهداری یک رکورد در Cache معمولاً با مقدار <strong>TTL (Time To Live)</strong> مشخص می‌شود.</p>

<ul>
  <li>Cache می‌تواند سرعت پاسخ‌گویی را افزایش دهد.</li>
  <li>با منقضی شدن TTL، Resolver باید در صورت نیاز پاسخ را دوباره به دست آورد.</li>
  <li>پس از تغییر یک رکورد DNS، ممکن است برخی سیستم‌ها تا پایان زمان Cache همچنان اطلاعات قبلی را ببینند.</li>
</ul>

<p>برای مشاهده و پاک‌کردن Cache محلی DNS در Windows می‌توان از این دستورات استفاده کرد:</p>

<div class="code-container">
  <span class="code-label">CMD</span>
  <div class="code-block no-prompt">ipconfig /displaydns
ipconfig /flushdns</div>
</div>

<p>دستور اول اطلاعات Cache محلی DNS را نمایش می‌دهد و دستور دوم Cache محلی Resolver ویندوز را پاک می‌کند. این دستور Cache همه DNS Serverهای شبکه را پاک نمی‌کند.</p>

<h2 class="lesson-title">۴. نصب DNS Server در Windows Server</h2>

<p>برای نصب DNS Server از محیط گرافیکی، مراحل زیر را انجام بده. بهتر است این تمرین را در ماشین مجازی یا محیط آزمایشگاهی انجام دهی.</p>

<ol>
  <li>وارد Windows Server شو.</li>
  <li>برنامه <strong>Server Manager</strong> را باز کن.</li>
  <li>از منوی <strong>Manage</strong> گزینه <strong>Add Roles and Features</strong> را انتخاب کن.</li>
  <li>در بخش Installation Type، گزینه <strong>Role-based or feature-based installation</strong> را انتخاب کن.</li>
  <li>سرور مقصد را انتخاب کن.</li>
  <li>در بخش Server Roles، گزینه <strong>DNS Server</strong> را فعال کن.</li>
  <li>اگر ویزارد نصب قابلیت‌های موردنیاز را پیشنهاد کرد، آن‌ها را اضافه کن.</li>
  <li>مراحل را ادامه بده و روی <strong>Install</strong> کلیک کن.</li>
  <li>پس از پایان نصب، از منوی Tools در Server Manager، کنسول <strong>DNS</strong> را باز کن.</li>
</ol>

<div class="box note">
  <strong>مسیر مدیریتی:</strong> Server Manager → Tools → DNS
</div>

<p>نصب Role فقط سرویس DNS را در سرور فراهم می‌کند. برای اینکه نام‌های موردنیاز شبکه پاسخ مناسبی دریافت کنند، باید پیکربندی Zone و رکوردهای لازم را هم انجام بدهی.</p>

<h2 class="lesson-title">۵. آشنایی با DNS Zone</h2>

<p><strong>DNS Zone</strong> بخشی از فضای نام DNS است که اطلاعات آن تحت مدیریت مشخصی قرار دارد. DNS Server می‌تواند Zoneهای مربوط به دامنه‌های خودش را میزبانی کند.</p>

<p>برای مثال، در یک شبکه آزمایشگاهی می‌توانیم دامنه‌ای مانند <code>corp.example.com</code> را برای تمرین در نظر بگیریم و رکوردهای داخلی آن را روی DNS Server بسازیم.</p>

<div class="box warning">
  <strong>توجه:</strong> نام <code>corp.example.com</code> در این درس صرفاً نمونه آموزشی است. آن را با دامنه واقعی سازمان یا دامنه‌ای که مجوز استفاده از آن را داری، اشتباه نگیر.
</div>

<h2 class="lesson-title">۶. ساخت Forward Lookup Zone</h2>

<p><strong>Forward Lookup Zone</strong> برای نگهداری رکوردهایی استفاده می‌شود که به پیدا کردن اطلاعات یک نام کمک می‌کنند؛ از جمله نگاشت نام میزبان به آدرس IP.</p>

<p>برای ساخت Zone در کنسول DNS:</p>

<ol>
  <li>در کنسول DNS، نام سرور را باز کن.</li>
  <li>روی <strong>Forward Lookup Zones</strong> راست‌کلیک کن.</li>
  <li>گزینه <strong>New Zone</strong> را انتخاب کن.</li>
  <li>در ویزارد، نوع Zone را انتخاب کن. برای یک آزمایش ساده و مستقل می‌توان از Primary Zone استفاده کرد.</li>
  <li>نام Zone را وارد کن؛ در این تمرین از <code>corp.example.com</code> استفاده می‌کنیم.</li>
  <li>تنظیمات فایل Zone و Dynamic Update را مطابق نیاز آزمایشگاه انتخاب کن.</li>
  <li>ویزارد را کامل کن و وجود Zone را در کنسول بررسی کن.</li>
</ol>

<div class="box important">
  <strong>نکته:</strong> گزینه‌های مربوط به Active Directory-integrated Zone فقط در شرایط سازگار با Active Directory در دسترس هستند. برای تمرین ساده‌ای که در این درس انجام می‌دهیم، لازم نیست سرور حتماً Domain Controller باشد.
</div>

<h2 class="lesson-title">۷. ساخت رکورد A</h2>

<p>رکورد <strong>A</strong> نام میزبان را به یک آدرس IPv4 مرتبط می‌کند.</p>

<p>در Zone آزمایشگاهی خود، رکوردی برای یک سرور فرضی بساز:</p>

<table>
  <thead>
    <tr><th>فیلد</th><th>مقدار نمونه</th></tr>
  </thead>
  <tbody>
    <tr><td>Name</td><td><code>server01</code></td></tr>
    <tr><td>IP address</td><td><code>192.168.1.10</code></td></tr>
    <tr><td>نام کامل حاصل</td><td><code>server01.corp.example.com</code></td></tr>
  </tbody>
</table>

<p>مراحل ساخت رکورد:</p>

<ol>
  <li>در کنسول DNS، وارد Zone به نام <code>corp.example.com</code> شو.</li>
  <li>روی فضای خالی یا Zone راست‌کلیک کن و گزینه <strong>New Host (A or AAAA)</strong> را انتخاب کن.</li>
  <li>در Name عبارت <code>server01</code> را وارد کن.</li>
  <li>در IP address مقدار نمونه <code>192.168.1.10</code> را وارد کن.</li>
  <li>رکورد را اضافه کن و بررسی کن که در فهرست Zone ظاهر شده باشد.</li>
</ol>

<div class="box warning">
  <strong>آدرس نمونه است:</strong> آدرس <code>192.168.1.10</code> فقط برای مثال استفاده شده است. در شبکه واقعی باید IP درست سرور مقصد را وارد کنی و از تداخل آدرس‌ها جلوگیری شود.
</div>

<h2 class="lesson-title">۸. آزمایش DNS با nslookup</h2>

<p>پس از ساخت رکورد، می‌توانیم با ابزار <strong>nslookup</strong> بررسی کنیم که نام به IP تبدیل می‌شود یا نه.</p>

<div class="code-container">
  <span class="code-label">CMD</span>
  <div class="code-block no-prompt">nslookup server01.corp.example.com</div>
</div>

<p>برای اینکه نتیجه معتبر باشد، کامپیوتری که فرمان را اجرا می‌کند باید از DNS Serverای استفاده کند که Zone و رکورد موردنظر را می‌شناسد؛ یا باید سرور DNS موردنظر را صریحاً در دستور مشخص کنیم.</p>

<div class="code-container">
  <span class="code-label">CMD — تعیین DNS Server</span>
  <div class="code-block no-prompt">nslookup server01.corp.example.com 192.168.1.5</div>
</div>

<p>در مثال دوم، <code>192.168.1.5</code> آدرس نمونه DNS Server است. اگر DNS Server آزمایشگاهت IP دیگری دارد، همان آدرس واقعی را جایگزین کن.</p>

<p>برای بررسی مستقیم یک نام و رکوردهای مرتبط، می‌توانی از فرمان‌های زیر هم استفاده کنی:</p>

<div class="code-container">
  <span class="code-label">CMD</span>
  <div class="code-block no-prompt">nslookup
set type=A
server01.corp.example.com
exit</div>
</div>

<div class="box note">
  <strong>یادت باشد:</strong> موفق بودن پاسخ DNS فقط نشان می‌دهد نام از طریق DNS قابل‌حل بوده است؛ این نتیجه به‌تنهایی دسترسی شبکه‌ای یا فعال بودن سرویس روی میزبان را ثابت نمی‌کند.
</div>

<h2 class="lesson-title">۹. آشنایی اولیه با Forwarder</h2>

<p>اگر DNS Server پاسخ یک نام را در Zoneهای خودش یا Cache پیدا نکند، ممکن است لازم باشد درخواست را به DNS Server دیگری منتقل کند. یکی از روش‌های این کار استفاده از <strong>DNS Forwarder</strong> است.</p>

<p>در شبکه سازمانی، می‌توان DNS Server داخلی را طوری پیکربندی کرد که درخواست‌های مربوط به نام‌های خارج از Zoneهای داخلی را به یک Resolver مشخص ارسال کند.</p>

<div class="code-container">
  <span class="code-label">مدل مفهومی</span>
  <div class="code-block no-prompt">Client
  |
  v
Internal DNS
  |
  | درخواست نام خارجی
  v
Forwarder / Upstream DNS
  |
  v
پاسخ DNS</div>
</div>

<p>جزئیات تنظیم Forwarder و تفاوت آن با Root Hints را در جلسه‌های بعدی DNS بررسی می‌کنیم.</p>

<h2 class="lesson-title">۱۰. خطاهای رایج در آزمایش DNS</h2>

<table>
  <thead>
    <tr><th>مشکل</th><th>مواردی که باید بررسی کنی</th></tr>
  </thead>
  <tbody>
    <tr><td>نام پیدا نمی‌شود</td><td>نام Zone، نام رکورد، نوع رکورد و DNS Server مورد استفاده را بررسی کن.</td></tr>
    <tr><td>رکورد جدید دیده نمی‌شود</td><td>Cache محلی و Cache سرور را در نظر بگیر؛ مطمئن شو رکورد در Zone درست ساخته شده است.</td></tr>
    <tr><td>درخواست Timeout می‌شود</td><td>آدرس DNS Server، اتصال شبکه، سرویس DNS و قوانین Firewall را بررسی کن.</td></tr>
    <tr><td>نام به IP تبدیل می‌شود اما سرور در دسترس نیست</td><td>IP، مسیر شبکه، وضعیت مقصد، پورت و سرویس موردنظر را بررسی کن.</td></tr>
  </tbody>
</table>

  <div class="quiz-answer">پاسخ صحیح: نگهداری رکوردهای DNS که برای پیدا کردن اطلاعات مرتبط با نام‌ها استفاده می‌شوند.</div>
</div>

<div class="quiz-card">
  <p><strong>سؤال ۵:</strong> کدام نوع رکورد، نام میزبان را به IPv4 مرتبط می‌کند؟</p>
  <div class="quiz-options">

<h2 class="lesson-title">۱۲. تمرین عملی</h2>

<div class="box note">
  <strong>تمرین پیشنهادی در ماشین مجازی:</strong>
  <ol>
    <li>نقش DNS Server را نصب کن.</li>
    <li>یک Forward Lookup Zone آزمایشگاهی با نام <code>corp.example.com</code> بساز.</li>
    <li>رکورد A با نام <code>server01</code> و IP آزمایشی مناسب اضافه کن.</li>
    <li>با دستور <code>nslookup</code> نام کامل را آزمایش کن.</li>
    <li>اگر پاسخ نگرفتی، بررسی کن که دستور به DNS Server درست ارسال شده باشد.</li>
  </ol>
  <p>اگر این تمرین را روی شبکه واقعی انجام می‌دهی، از نام‌ها و آدرس‌های سازگار با همان شبکه استفاده کن و تنظیمات DNS سیستم‌های دیگر را بدون برنامه تغییر نده.</p>
</div>

<div class="summary-box">
  <h3>جمع‌بندی جلسه</h3>
  <ul>
    <li>DNS Server می‌تواند از Zoneهای خودش، Cache یا سرورهای دیگر برای پاسخ‌گویی استفاده کند.</li>
    <li>Recursive Query و Iterative Query دو رفتار متفاوت در فرایند حل نام هستند.</li>
    <li>TTL بر مدت اعتبار اطلاعات در Cache اثر می‌گذارد.</li>
    <li>Forward Lookup Zone رکوردهای مرتبط با نام‌ها را نگهداری می‌کند.</li>
    <li>رکورد A نام را به IPv4 مرتبط می‌کند.</li>
    <li>nslookup ابزاری مفید برای بررسی پاسخ DNS است.</li>
  </ul>
</div>

<div class="box note">
  <strong>جلسه بعد:</strong> در جلسه ۱۶ وارد DNS Forwarding می‌شویم و تفاوت Forwarder با Root Hints و کاربرد آن‌ها را در شبکه بررسی می‌کنیم.
</div>
`,
};

        const toFa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

        // ============================================================
        // آرایه flat از تمام بخش‌ها
        // ============================================================
        const allSections = [];
        course.forEach((ch, chIdx) => {
            ch.sections.forEach((sec, secIdx) => {
                allSections.push(Object.assign({}, sec, {
                    chapterId: ch.id,
                    chapterTitle: ch.title,
                    badge: ch.badge,
                    num: sec.num,
                    chapterIndex: chIdx,
                    sectionIndex: secIdx,
                    totalInChapter: ch.sections.length
                }));
            });
        });

        let currentIndex = 0;

        // ============================================================
        // فهرست مطالب
        // ============================================================
        function buildTOC() {
            const toc = document.getElementById('tocNav');
            toc.innerHTML = '';

            course.forEach((ch, idx) => {
                const details = document.createElement('details');
                details.className = 'toc-chapter';
                if (idx === 0) details.open = true;

                const summary = document.createElement('summary');
                summary.innerHTML = '<span class="chapter-num">' + ch.badge + '</span><span>' + ch.title + '</span>';
                details.appendChild(summary);

                const ul = document.createElement('ul');
                ul.className = 'toc-sections';

                ch.sections.forEach(sec => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = '#' + sec.id;
                    a.textContent = toFa(sec.num) + '. ' + sec.title;
                    a.dataset.id = sec.id;

                    a.addEventListener('click', function(e) {
                        e.preventDefault();
                        const index = allSections.findIndex(s => s.id === sec.id);
                        if (index !== -1) showSection(index);
                    });

                    li.appendChild(a);
                    ul.appendChild(li);
                });

                details.appendChild(ul);
                toc.appendChild(details);
            });
        }

        // ============================================================
        // ساخت بخش‌ها
        // ============================================================
        function buildSections() {
            const main = document.getElementById('mainContent');
            main.innerHTML = '';

            allSections.forEach((sec, idx) => {
                const div = document.createElement('div');
                div.className = 'section' + (idx === 0 ? ' active' : '');
                div.id = sec.id;

                const isFirst = idx === 0;
                const isLast = idx === allSections.length - 1;

                let body = '';

                if (richContent[sec.id]) {
                    body = richContent[sec.id];
                } else {
                    body = `
                        <div class="section-header">
                            <div class="section-badge">${toFa(sec.num)}</div>
                            <div>
                                <h1>${sec.title}</h1>
                                <div class="meta">فصل ${sec.badge} · ${sec.chapterTitle} · جلسه ${toFa(sec.sectionIndex + 1)} از ${toFa(sec.totalInChapter)}</div>
                            </div>
                        </div>
                        <div class="placeholder">
                            <i class="fas fa-laptop-code"></i>
                            <p>محتوای این بخش در حال آماده‌سازی است...</p>
                            <p style="font-size:0.9rem;margin-top:6px;opacity:0.8;">${sec.chapterTitle} — ${sec.title}</p>
                        </div>
                    `;
                }

                body += `
                    <div class="nav-buttons">
                        <button class="nav-btn" ${isFirst ? 'disabled' : ''} onclick="goToPrev()">
                            ${isFirst ? 'جلسه قبلی' : '<i class="fas fa-arrow-right"></i> جلسه قبلی'}
                        </button>
                        <button class="nav-btn" ${isLast ? 'disabled' : ''} onclick="goToNext()">
                            ${isLast ? 'پایان' : 'جلسه بعدی <i class="fas fa-arrow-left"></i>'}
                        </button>
                    </div>
                `;

                div.innerHTML = body;
                main.appendChild(div);
            });
        }

        // ============================================================
        // نمایش بخش و ناوبری
        // ============================================================
        function showSection(index) {
            if (index < 0 || index >= allSections.length) return;
            currentIndex = index;

            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(allSections[index].id);
            if (target) target.classList.add('active');

            document.querySelectorAll('.toc-sections a').forEach(a => {
                a.classList.remove('active');
                if (a.dataset.id === allSections[index].id) a.classList.add('active');
            });

            const chIdx = allSections[index].chapterIndex;
            document.querySelectorAll('.toc-chapter').forEach((d, i) => {
                d.open = (i === chIdx);
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (window.innerWidth <= 1000) closeSidebar();
        }

        function goToPrev() {
            if (currentIndex > 0) showSection(currentIndex - 1);
        }

        function goToNext() {
            if (currentIndex < allSections.length - 1) showSection(currentIndex + 1);
        }

        // ============================================================
        // کنترل سایدبار
        // ============================================================
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const toggleBtn = document.getElementById('sidebarToggle');
        const closeBtn = document.getElementById('sidebarClose');

        function openSidebar() {
            sidebar.classList.add('open');
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        toggleBtn.addEventListener('click', openSidebar);
        closeBtn.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);

        // ============================================================
        // تم روشن/تاریک (پیش‌فرض تاریک)
        // ============================================================
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.querySelector('.theme-icon');
            if (theme === 'dark') {
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        // ============================================================
        // کوئیز (پاسخ درست: سبز / اشتباه: قرمز)
        // ============================================================
        function selectOption(btn) {
            const parent = btn.parentElement;
            if (parent.classList.contains('answered')) return;
            parent.classList.add('answered');

            const isCorrect = btn.dataset.correct === 'true';

            parent.querySelectorAll('button').forEach(b => {
                b.classList.remove('selected', 'correct', 'wrong');
                if (b.dataset.correct === 'true') b.classList.add('correct');
            });

            if (!isCorrect) btn.classList.add('wrong');

            parent.nextElementSibling.classList.add('show');
        }

        // ============================================================
        // نوار پیشرفت
        // ============================================================
        window.onscroll = function() {
            const scroll = document.documentElement.scrollTop || document.body.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            document.getElementById('progressBar').style.width = (height > 0 ? (scroll / height * 100) : 0) + '%';
        };

        // ============================================================
        // کیبورد
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSidebar();
            if (e.key === 'ArrowLeft') goToNext();
            if (e.key === 'ArrowRight') goToPrev();
        });

        // ============================================================
        // بسته‌بندی جدول‌ها
        // ============================================================
        function wrapTables() {
            document.querySelectorAll('.section table').forEach(function(table) {
                if (table.parentElement && table.parentElement.classList.contains('table-wrap')) return;
                var wrap = document.createElement('div');
                wrap.className = 'table-wrap';
                table.parentNode.insertBefore(wrap, table);
                wrap.appendChild(table);
            });
        }

        // ============================================================
        // مقداردهی اولیه
        // ============================================================
        buildTOC();
        buildSections();
        wrapTables();
        showSection(0);
    </script>
