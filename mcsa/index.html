<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebBook-MCSA</title>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
/* ===== WebBook-MCSA — نسخه بهبودیافته استایل =====
   جایگزین کامل محتوای تگ <style>؛ HTML و JS بدون تغییر کار می‌کنند. */

/* ---------- ۱. توکن‌ها ---------- */
:root{
  --primary:#0067C0; --primary-hover:#005AA6; --primary-soft:#E8F1FB;
  --primary-glow:rgba(0,103,192,.22); --accent:#00A4EF;
  --bg-body:#F3F5F8; --bg-card:#fff; --bg-navbar:rgba(255,255,255,.86); --bg-sunken:#F6F8FB;
  --text-main:#2B3340; --text-heading:#10161F; --text-muted:#667085;
  --border:#E3E8EF; --border-strong:#CBD3DF;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05); --shadow:0 6px 24px -8px rgba(16,24,40,.12);
  --radius:14px; --radius-sm:9px;
  --note-bg:#EEF8F0; --note-border:#2E9B4E;
  --important-bg:#EAF3FD; --important-border:#1A73D9;
  --warning-bg:#FFF6E5; --warning-border:#E08A00;
  --correct-bg:#EAF7EE; --correct-border:#2E9B4E; --correct-text:#1E6B35;
  --wrong-bg:#FDECEC; --wrong-border:#D93B3B; --wrong-text:#A12525;
  --code-bg:#0E1726; --code-bar:#162238; --code-text:#E6EDF7; --terminal-green:#7EE787;
  --sidebar-width:312px;
}
[data-theme="dark"]{
  --primary:#4DA3FF; --primary-hover:#79BAFF; --primary-soft:rgba(77,163,255,.13);
  --primary-glow:rgba(77,163,255,.28); --accent:#38BDF8;
  --bg-body:#0F141B; --bg-card:#171D27; --bg-navbar:rgba(23,29,39,.82); --bg-sunken:#131923;
  --text-main:#D5DBE5; --text-heading:#F4F7FB; --text-muted:#8F9BAD;
  --border:#263041; --border-strong:#364359;
  --shadow-sm:none; --shadow:0 10px 30px -10px rgba(0,0,0,.6);
  --note-bg:rgba(46,155,78,.12); --note-border:#5CC47A;
  --important-bg:rgba(77,163,255,.12); --important-border:#6DB4FF;
  --warning-bg:rgba(240,162,30,.12); --warning-border:#F2B84B;
  --correct-bg:rgba(46,155,78,.16); --correct-border:#5CC47A; --correct-text:#A6E3B8;
  --wrong-bg:rgba(217,59,59,.16); --wrong-border:#F26B6B; --wrong-text:#FFA3A3;
  --code-bg:#0A101B; --code-bar:#111A2B; --code-text:#DDE6F3;
}

/* ---------- ۲. پایه ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;max-width:100%;scroll-behavior:smooth}
body{
  font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg-body);color:var(--text-main);
  line-height:1.95;font-size:16.5px;padding-top:64px;max-width:100%;overflow-x:hidden;
  transition:background .3s,color .3s;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 380px at 85% -80px,var(--primary-glow),transparent 70%);
  background-repeat:no-repeat;
}
::selection{background:var(--primary);color:#fff}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- ۳. نوار بالا ---------- */
.navbar{
  position:fixed;inset:0 0 auto 0;height:60px;display:flex;align-items:center;gap:16px;padding:0 22px;
  background:var(--bg-navbar);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border);z-index:1000;
}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:1.05rem;color:var(--text-heading);white-space:nowrap}
.brand-icon{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:1.05rem;
  background:linear-gradient(135deg,var(--accent),var(--primary));box-shadow:0 4px 12px var(--primary-glow);
}
.nav-spacer{flex:1}
.theme-btn{
  width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-muted);font-size:1rem;cursor:pointer;transition:.2s;flex-shrink:0;
}
.theme-btn:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-soft)}

.progress-track{position:fixed;top:60px;inset-inline:0;height:3px;z-index:999}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:0 3px 3px 0;transition:width .12s}

/* ---------- ۴. سایدبار و فهرست ---------- */
.sidebar{
  position:fixed;top:60px;right:0;width:var(--sidebar-width);height:calc(100vh - 60px);overflow-y:auto;z-index:900;
  background:var(--bg-card);border-left:1px solid var(--border);transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.sidebar-header{
  display:flex;justify-content:space-between;align-items:center;padding:16px 18px;position:sticky;top:0;z-index:2;
  background:var(--bg-card);border-bottom:1px solid var(--border);
}
.sidebar-header h3{font-size:.98rem;margin:0;display:flex;align-items:center;gap:9px;color:var(--text-heading)}
.sidebar-header h3 i{color:var(--primary)}
.sidebar-close{display:none;background:none;border:none;font-size:1.1rem;color:var(--text-muted);cursor:pointer;width:36px;height:36px;border-radius:10px}
.sidebar-close:hover{background:var(--primary-soft);color:var(--primary)}

.toc{padding:10px 10px 30px}
.toc-chapter{border:0;margin-bottom:4px;border-radius:var(--radius-sm);overflow:hidden}
.toc-chapter summary{
  padding:11px 12px;font-weight:700;font-size:.9rem;line-height:1.45;color:var(--text-heading);cursor:pointer;
  list-style:none;display:flex;align-items:flex-start;gap:10px;user-select:none;border-radius:var(--radius-sm);transition:background .2s;
}
.toc-chapter summary::-webkit-details-marker{display:none}
.toc-chapter summary::after{
  content:'\f107';font-family:'Font Awesome 6 Free';font-weight:900;margin-right:auto;margin-top:2px;
  font-size:.8rem;color:var(--text-muted);transition:transform .25s;flex-shrink:0;
}
.toc-chapter[open] summary::after{transform:rotate(180deg)}
.toc-chapter summary:hover{background:var(--bg-sunken)}
.toc-chapter[open]>summary{color:var(--primary)}
.chapter-num{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;margin-top:0;
  background:var(--primary-soft);color:var(--primary);font-size:.78rem;font-weight:800;
}
.toc-chapter[open] .chapter-num{background:var(--primary);color:#fff}
.toc-sections{list-style:none;margin:2px 22px 8px 0;padding:0 12px 0 0;border-right:2px solid var(--border);background:none}
.toc-sections li a{
  display:block;padding:7px 14px 7px 10px;margin-right:-2px;color:var(--text-muted);text-decoration:none;font-size:.85rem;line-height:1.5;
  border-right:2px solid transparent;border-radius:0 8px 8px 0;transition:.18s;
}
.toc-sections li a:hover{color:var(--text-heading);background:var(--bg-sunken)}
.toc-sections li a.active{color:var(--primary);background:var(--primary-soft);border-right-color:var(--primary);font-weight:700}

.sidebar-toggle{
  display:none;position:fixed;bottom:22px;left:22px;width:54px;height:54px;border-radius:16px;border:none;cursor:pointer;
  background:var(--primary);color:#fff;font-size:1.2rem;align-items:center;justify-content:center;z-index:950;
  box-shadow:0 10px 24px var(--primary-glow);transition:transform .2s,background .2s;
}
.sidebar-toggle:hover{background:var(--primary-hover);transform:translateY(-2px)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(8,12,20,.5);z-index:850;backdrop-filter:blur(3px)}
.sidebar-overlay.open{display:block}

/* ---------- ۵. محتوا ---------- */
.main{
  max-width:860px;width:100%;min-width:0;margin:0 auto;margin-right:calc(var(--sidebar-width) + 28px);
  padding:34px 28px 90px;overflow-x:hidden;transition:margin .3s;
}
.section{display:none;max-width:100%;min-width:0;overflow-wrap:break-word;animation:fadeIn .3s ease}
.section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.section-header{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:18px;margin-bottom:30px;padding:24px 26px;
  background:linear-gradient(135deg,var(--primary-soft),var(--bg-card) 70%);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
}
.section-header::before{content:'';position:absolute;top:0;right:0;width:5px;height:100%;background:linear-gradient(var(--accent),var(--primary))}
.section-badge{
  width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;color:#fff;font-size:1.15rem;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--primary));box-shadow:0 8px 18px var(--primary-glow);
}
.section-header h1{font-size:1.45rem;line-height:1.45;font-weight:800;color:var(--text-heading);margin-bottom:2px}
.section-header .meta{font-size:.85rem;color:var(--text-muted)}

/* تایپوگرافی */
h2{
  display:flex;align-items:center;gap:12px;margin:40px 0 14px;padding-bottom:10px;font-size:1.25rem;font-weight:800;
  color:var(--text-heading);border-bottom:1px solid var(--border);
}
h2::before{content:'';width:5px;height:1.2em;border-radius:3px;background:linear-gradient(var(--accent),var(--primary));flex-shrink:0}
h3{margin:24px 0 8px;font-size:1.06rem;font-weight:700;color:var(--text-heading)}
h3::before{content:'';display:inline-block;width:7px;height:7px;margin-left:9px;border-radius:2px;background:var(--primary);transform:rotate(45deg);vertical-align:middle}
p{margin-bottom:14px;text-align:start;max-width:72ch}
strong{color:var(--text-heading);font-weight:700}
ul,ol{margin:10px 0 20px;padding-right:24px;max-width:72ch}
li{margin-bottom:7px}
li::marker{color:var(--primary);font-weight:700}
blockquote{
  margin:22px 0;padding:16px 20px;font-style:normal;color:var(--text-heading);
  background:var(--primary-soft);border-right:4px solid var(--primary);border-radius:var(--radius-sm);
}
blockquote p{margin:0;max-width:none}
:not(pre):not(.code-block)>code{
  font-family:'JetBrains Mono',monospace;font-size:.86em;padding:2px 7px;border-radius:6px;direction:ltr;unicode-bidi:isolate;
  background:var(--primary-soft);color:var(--primary);border:1px solid var(--border);
}

/* ---------- ۶. جعبه‌های اطلاعاتی ---------- */
.box{
  display:flex;gap:14px;margin:24px 0;padding:16px 18px;max-width:100%;min-width:0;overflow-wrap:break-word;
  background:var(--bg-card);border:1px solid var(--border);border-right-width:4px;border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);
}
.box>div{min-width:0;flex:1;font-size:.96rem}
.box i{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-size:1rem;margin-top:1px;
}
.box strong{display:block;margin-bottom:3px}
.box.note{background:var(--note-bg);border-color:var(--note-border)}
.box.note i{background:var(--note-border);color:#fff}
.box.note strong{color:var(--note-border)}
.box.important{background:var(--important-bg);border-color:var(--important-border)}
.box.important i{background:var(--important-border);color:#fff}
.box.important strong{color:var(--important-border)}
.box.warning{background:var(--warning-bg);border-color:var(--warning-border)}
.box.warning i{background:var(--warning-border);color:#fff}
.box.warning strong{color:var(--warning-border)}
.box.note,.box.important,.box.warning{border-top-color:transparent;border-bottom-color:transparent;border-left-color:transparent}

/* ---------- ۷. کد (پنجره ترمینال) ---------- */
.code-container{position:relative;margin:26px 0;width:100%;max-width:100%;min-width:0}
.code-label{
  position:absolute;top:0;left:0;right:0;height:38px;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;z-index:1;
  font:600 .72rem 'JetBrains Mono',monospace;color:#8FA3C0;background:transparent;border-radius:0;pointer-events:none;direction:ltr;
}
.code-container::before{
  content:'';position:absolute;top:13px;left:16px;width:11px;height:11px;border-radius:50%;z-index:2;
  background:#FF5F57;box-shadow:17px 0 0 #FEBC2E,34px 0 0 #28C840;
}
.code-block{
  display:block;width:100%;max-width:100%;min-width:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  padding:54px 20px 20px;border-radius:12px;border:1px solid var(--border-strong);
  background:linear-gradient(var(--code-bar) 0 38px,var(--code-bg) 38px);
  color:var(--code-text);font:.9rem/1.8 'JetBrains Mono',monospace;direction:ltr;text-align:left;unicode-bidi:isolate;white-space:pre;
  box-shadow:var(--shadow);
}
.code-block::before{content:'$ ';color:var(--terminal-green);font-weight:600}
.code-block.no-prompt::before{content:none}

/* ---------- ۸. جدول ---------- */
.table-wrap{
  width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:24px 0;
  border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);box-shadow:var(--shadow-sm);
}
.table-wrap table{margin:0;border:0;border-radius:0}
table{width:100%;border-collapse:separate;border-spacing:0;margin:24px 0;font-size:.93rem;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
th,td{padding:12px 16px;text-align:right;vertical-align:top;border:0;border-bottom:1px solid var(--border)}
th{background:var(--primary-soft);color:var(--text-heading);font-weight:700;white-space:nowrap;border-bottom:2px solid var(--primary)}
tbody tr:nth-child(even) td{background:var(--bg-sunken)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--primary-soft)}
td code{white-space:nowrap}

/* ---------- ۹. جزئیات باز/بسته ---------- */
details.content-details{margin:18px 0;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm)}
details.content-details summary{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--text-heading);cursor:pointer;list-style:none}
details.content-details summary::-webkit-details-marker{display:none}
details.content-details[open] summary{margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--border)}

/* ---------- ۱۰. خودآزمایی ---------- */
.quiz-card{
  margin:24px 0 18px;padding:24px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
}
.quiz-card>p{margin-bottom:16px;max-width:none;font-weight:700;font-size:1.04rem;line-height:1.8;color:var(--text-heading)}
.quiz-options{display:flex;flex-direction:column;gap:9px}
.quiz-options button{
  display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:13px 16px;text-align:right;
  font:inherit;font-size:.95rem;color:var(--text-main);background:var(--bg-sunken);
  border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:border-color .2s,background .2s,transform .15s;
}
.quiz-options button:hover:not(.correct):not(.wrong){border-color:var(--primary);background:var(--primary-soft);transform:translateX(-3px)}
.quiz-options.answered button{cursor:default}
.quiz-options.answered button:not(.correct):not(.wrong){opacity:.55}
.quiz-options button.correct{border-color:var(--correct-border);background:var(--correct-bg);color:var(--correct-text);font-weight:700}
.quiz-options button.wrong{border-color:var(--wrong-border);background:var(--wrong-bg);color:var(--wrong-text);font-weight:700}
.quiz-options button.correct::after,.quiz-options button.wrong::after{
  font-family:'Font Awesome 6 Free';font-weight:900;font-size:1rem;flex-shrink:0;
}
.quiz-options button.correct::after{content:'\f058'}
.quiz-options button.wrong::after{content:'\f057'}
.quiz-answer{
  display:none;margin-top:16px;padding:14px 18px;font-size:.95rem;line-height:1.9;color:var(--text-heading);
  background:var(--note-bg);border-right:4px solid var(--note-border);border-radius:var(--radius-sm);
}
.quiz-answer.show{display:block;animation:fadeIn .3s}

/* ---------- ۱۱. جمع‌بندی، placeholder، ناوبری ---------- */
.summary-box{
  margin:28px 0;padding:22px 24px;max-width:100%;min-width:0;overflow-wrap:break-word;
  background:linear-gradient(180deg,var(--primary-soft),var(--bg-card) 90px);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
}
.summary-box h3{margin-top:0;color:var(--primary)}
.summary-box h3::before{display:none}
.summary-box p{max-width:none}
.summary-box .code-container,.summary-box .code-block,.box .code-container,.box .code-block{max-width:100%;min-width:0}

.placeholder{padding:56px 20px;text-align:center;color:var(--text-muted);background:var(--bg-card);border:1.5px dashed var(--border-strong);border-radius:var(--radius)}
.placeholder i{display:block;margin-bottom:14px;font-size:2.2rem;color:var(--primary);opacity:.75}
.placeholder p{margin-inline:auto;text-align:center}

.nav-buttons{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:26px;border-top:1px solid var(--border)}
.nav-btn{
  display:flex;align-items:center;gap:9px;padding:12px 24px;font:inherit;font-size:.95rem;font-weight:600;color:#fff;
  background:var(--primary);border:0;border-radius:12px;cursor:pointer;box-shadow:0 6px 16px var(--primary-glow);transition:.2s;
}
.nav-btn:hover:not(:disabled){background:var(--primary-hover);transform:translateY(-2px)}
.nav-btn:disabled{background:var(--bg-sunken);color:var(--text-muted);border:1px solid var(--border);box-shadow:none;cursor:not-allowed}

/* ---------- ۱۲. واکنش‌گرا ---------- */
@media (max-width:1000px){
  body{padding-top:56px;font-size:15.5px;line-height:1.85}
  .navbar{height:56px;padding:0 12px;gap:10px}
  .progress-track{top:56px}
  .brand span{display:none}
  .sidebar{top:0;height:100vh;width:316px;max-width:88vw;transform:translateX(100%);border-left:0;box-shadow:-10px 0 34px rgba(0,0,0,.2);-webkit-overflow-scrolling:touch}
  .sidebar.open{transform:none}
  .sidebar-close{display:flex;align-items:center;justify-content:center}
  .sidebar-toggle{display:flex}
  .main{margin-right:0!important;padding:20px 14px 100px}
  .section-header{padding:16px;gap:12px;flex-wrap:wrap}
  .section-badge{width:42px;height:42px;font-size:1rem}
  .section-header h1{font-size:1.15rem;word-break:break-word}
  h2{font-size:1.1rem;margin-top:32px}
  p,ul,ol{max-width:none}
  .code-block{font-size:.78rem;padding:50px 12px 14px}
  .table-wrap{margin:16px -4px}
  table{font-size:.82rem;min-width:420px}
  th,td{padding:9px 11px}
  .box{padding:13px;gap:10px}
  .quiz-card{padding:16px}
  .quiz-options button{padding:11px 13px;font-size:.9rem}
  .nav-buttons{flex-wrap:wrap}
  .nav-btn{flex:1 1 auto;justify-content:center;padding:11px 16px;font-size:.88rem}
}
@media (max-width:480px){
  .sidebar-toggle{bottom:18px;left:18px;width:48px;height:48px}
  .main{padding:14px 10px 100px}
  .code-block{font-size:.72rem}
  table{min-width:360px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media print{
  .navbar,.progress-track,.sidebar,.sidebar-toggle,.nav-buttons{display:none!important}
  body{padding:0;background:#fff;color:#000}
  .main{margin:0;max-width:none;padding:0}
  .section{display:block!important}
}

    </style>
</head>

<body>

    <!-- نوار ناوبری -->
    <nav class="navbar">
        <div class="brand">
            <div class="brand-icon"><i class="fab fa-windows"></i></div>
            <span>ZeroDay · MCSA</span>
        </div>
        <div class="nav-spacer"></div>
        <button class="theme-btn" onclick="toggleTheme()" title="تغییر تم" aria-label="تغییر تم">
            <i class="fas fa-moon theme-icon"></i>
        </button>
    </nav>

    <!-- نوار پیشرفت -->
    <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
    </div>

    <!-- دکمه سایدبار -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="فهرست مطالب">
        <i class="fas fa-list-ul"></i>
    </button>

    <!-- اوورلی -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- سایدبار -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-book-open"></i> فهرست مطالب</h3>
            <button class="sidebar-close" id="sidebarClose" aria-label="بستن">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <nav class="toc" id="tocNav"></nav>

├── General Server Workloads
└── Advanced Datacenter / Virtualization Scenarios</div></div><p>در دنیای واقعی انتخاب Edition فقط بر اساس «قوی‌تر بودن» نیست؛ <strong>Licensing، Virtualization و نیازهای سازمان</strong> هم مهم‌اند.</p>
<h2>۷. Standard vs Datacenter</h2><p>برای سطح MCSA لازم نیست وارد جزئیات پیچیده‌ی Licensing شوی. این مقایسه را حفظ کن:</p><table><thead><tr><th>ویژگی</th><th>Standard</th><th>Datacenter</th></tr></thead><tbody><tr><td>Roleهای معمول (File، DNS، DHCP، ...)</td><td>✅</td><td>✅</td></tr><tr><td>مناسب Serverهای معمولی</td><td>✅</td><td>✅</td></tr><tr><td>قابلیت‌های پیشرفته‌ی Datacenter</td><td>محدودتر</td><td>بیشتر</td></tr><tr><td>سناریوهای Virtualization گسترده</td><td>محدودتر</td><td>مناسب‌تر</td></tr></tbody></table><div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته آزمونی</strong>اگر سناریو روی <strong>محیط بزرگ Virtualization / Datacenter</strong> تأکید کرد، به <strong>Datacenter</strong> فکر کن. اگر نیازهای سازمانی معمولی مطرح بود، <strong>Standard</strong> می‌تواند کافی باشد.</div></div><div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>توجه</strong>جزئیات دقیق Licensing و قابلیت‌های هر Edition (مثل تعداد VMهای مجاز) بین نسخه‌های Windows Server فرق می‌کند. برای کار واقعی همیشه مستندات رسمی Microsoft همان نسخه را بررسی کن.</div></div>
<h2>۸. یک اشتباه رایج: Edition با GUI/Core</h2><p>ممکن است کسی فکر کند «Standard یعنی Core و Datacenter یعنی GUI». ❌ <strong>کاملاً اشتباه است</strong>، چون این دو انتخاب مستقل‌اند:</p><div class="code-container"><span class="code-label">انتخاب مستقل</span><div class="code-block no-prompt">Windows Server Standard
├── Server Core
└── Desktop Experience

Windows Server Datacenter
├── Server Core
└── Desktop Experience</div></div><p><strong>Standard / Datacenter</strong> یک موضوع است و <strong>Core / Desktop Experience</strong> موضوعی دیگر.</p>
<h2>۹. Server Core چیست؟</h2><p><strong>Server Core</strong> نسخه‌ای از Windows Server است که بدون محیط گرافیکی کامل Desktop ارائه می‌شود؛ یعنی خبری از Desktop کامل مثل Windows Client نیست.</p><div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">Desktop Experience
   ↓
Full GUI
   ↓
GUI-based Management

Server Core
   ↓
No Full GUI
   ↓
Command / Remote Management</div></div><p>پس Server Core از نظر Roleها یک Windows Server کامل است، اما محیط گرافیکی بسیار محدودتری دارد.</p>
<h2>۱۰. چرا Server Core وجود دارد و چه مزایایی دارد؟</h2><p>فرض کن Serverی فقط قرار است AD DS، DNS و DHCP اجرا کند. آیا واقعاً لازم است Desktop کامل و برنامه‌های گرافیکی متعدد روی آن باشد؟ لزومی ندارد. Server Core برای داشتن یک محیط <strong>حداقلی‌تر و کم‌حجم‌تر</strong> طراحی شده است.</p><h3>کاهش سطح حمله</h3><p>هرچه اجزای غیرضروری کمتر باشد، Componentهای بالقوه‌ی قابل حمله هم کمتر می‌شود.</p><h3>مصرف منابع کمتر</h3><p>محیط گرافیکی کامل وجود ندارد، پس منابع کمتری برای GUI مصرف می‌شود.</p><h3>مناسب Serverهای اختصاصی</h3><p>اگر Server فقط یک یا چند Role مشخص اجرا می‌کند، Core می‌تواند انتخاب مناسبی باشد.</p><h3>مدیریت از راه دور</h3><p>در محیط سازمانی می‌توان بسیاری از Serverهای Core را از یک سیستم مدیریتی دیگر مدیریت کرد.</p>
<h2>۱۱. آیا Server Core یعنی بدون مدیریت؟</h2><p>خیر؛ این یک اشتباه مهم است. Server Core <strong>بدون Full GUI است، نه بدون Management</strong>. برای مدیریت آن می‌توان از این‌ها استفاده کرد:</p><ul><li>Command Line</li><li>PowerShell</li><li>Remote Management</li><li>Windows Admin Center</li><li>MMC / RSAT در سناریوهای مناسب</li></ul><div class="code-container"><span class="code-label">مدیریت</span><div class="code-block no-prompt">Administrator
      │
      ▼
Management Tools
      │
      ▼
Server Core</div></div><p>یعنی Administrator الزاماً نباید پشت خود Server Core بنشیند.</p>

<div class="section-header"><div class="section-badge">۳</div><div><h1>Windows Server Upgrade و Server Environment</h1><div class="meta">فصل ۱ · آشنایی با Windows Server و نصب آن · جلسه ۳ از ۳</div></div></div>
<p>جلسه‌ی قبل یاد گرفتیم هنگام نصب باید بین <strong>Edition</strong> و <strong>Installation Option</strong> تفاوت بگذاریم و با Server Core و Desktop Experience آشنا شدیم. حالا یک سؤال واقعی‌تر داریم:</p><blockquote><strong>اگر سازمانی همین الان یک Windows Server قدیمی دارد، آیا حتماً باید Server جدید را از صفر نصب کنیم؟</strong></blockquote><p>نه. گاهی می‌توانیم <strong>Upgrade</strong> انجام دهیم؛ اما Upgrade همیشه بهترین یا حتی ممکن‌ترین گزینه نیست. در این جلسه همین تصمیم‌گیری را یاد می‌گیریم.</p>
<h2>۱. اهداف جلسه</h2><p>در پایان این جلسه باید بتوانی:</p><ul><li>مفهوم <strong>Upgrade</strong> را از <strong>Migration</strong> و نصب جدید تفکیک کنی.</li><li>تفاوت <strong>In-Place Upgrade</strong> و <strong>Clean Installation</strong> را بفهمی.</li><li>بدانی قبل از Upgrade چه مواردی باید بررسی شوند.</li><li>محدودیت‌های مهم Upgrade را تشخیص بدهی.</li><li>مفهوم <strong>Server Environment</strong> را در یک سازمان درک کنی.</li><li>برای یک سناریوی واقعی بین Upgrade، Migration و نصب جدید تصمیم بگیری.</li><li>خطاهای رایج Upgrade را عیب‌یابی کنی.</li></ul>
<h2>۲. پیش‌نیاز</h2><p>دو جلسه‌ی قبل را داریم. الان می‌دانیم Windows Server چیست و چه نوع نصب‌هایی دارد:</p><div class="code-container"><span class="code-label">مسیر سه جلسه اول</span><div class="code-block no-prompt">Session 1: What is Windows Server?
        ↓
Session 2: Edition + Core / Desktop Experience
        ↓
Session 3: Upgrade + Server Environment</div></div>
<h2>۳. Upgrade یعنی چه؟ (In-Place Upgrade)</h2><p>فرض کن یک Server قدیمی داریم و سازمان می‌خواهد به نسخه‌ی جدیدتر Windows Server برود:</p><div class="code-container"><span class="code-label">Server قدیمی</span><div class="code-block no-prompt">Old Server
Windows Server 2012 R2
      ├── DNS
      └── File Server</div></div><p>یک راه این است که سیستم‌عامل فعلی را کنار بگذاریم و سیستم‌عامل جدید نصب کنیم. راه دیگر این است که سیستم‌عامل موجود را به نسخه‌ی جدیدتر <strong>ارتقا</strong> بدهیم. این می‌شود <strong>In-Place Upgrade</strong>: همان Server و همان Installation را نگه می‌داریم و فقط سیستم‌عامل را ارتقا می‌دهیم.</p><div class="code-container"><span class="code-label">In-Place Upgrade</span><div class="code-block no-prompt">Before                       After
┌──────────────────────┐     ┌──────────────────────┐
│ Existing Server      │     │ Same Server          │
│ Old Windows Server   │ ──▶ │ New Windows Server   │
│ Apps / Roles / Data  │     │ Apps / Roles / Data  │
└──────────────────────┘     └──────────────────────┘</div></div><p>هدف این است که تا حد ممکن تنظیمات، Applicationها، Roleها و Data را روی همان Server حفظ کنیم.</p><div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>توجه</strong>Upgrade به معنی «هیچ ریسکی ندارد» نیست.</div></div>
<h2>۴. Clean Installation چیست؟</h2><p>در Clean Installation سیستم‌عامل جدید را از ابتدا نصب می‌کنیم و موارد موردنیاز را دوباره <strong>نصب، Configuration و Migration</strong> می‌کنیم.</p><div class="code-container"><span class="code-label">Clean Install</span><div class="code-block no-prompt">Old OS
  ↓
Remove / Replace
  ↓
New OS</div></div>
<h2>۵. Migration چیست؟</h2><p>این مفهوم را نباید با Upgrade قاطی کنی. فرض کن Server قدیمی <code>SERVER01</code> با Windows Server 2012 R2 داریم و یک Server جدید <code>SERVER02</code> با Windows Server 2022 می‌سازیم. بعد Data و Roleها یا سرویس‌های موردنیاز را از SERVER01 به SERVER02 منتقل می‌کنیم. این <strong>Migration</strong> است.</p><div class="code-container"><span class="code-label">Migration</span><div class="code-block no-prompt">SERVER01            SERVER02
Old OS   ─────────▶ New OS
      Migration</div></div><p>در Upgrade همان Server را ارتقا می‌دهیم؛ در Migration معمولاً <strong>محیط جدیدی می‌سازیم و سرویس‌ها/داده‌ها را منتقل می‌کنیم</strong>.</p>
<h2>۶. سه مسیر اصلی کنار هم</h2><div class="code-container"><span class="code-label">سه مسیر</span><div class="code-block no-prompt">              Existing Server
                    │
       ┌────────────┼────────────┐
    Upgrade     Migration     Clean Install
       │            │              │
  Same server   New server     New / rebuilt
  New OS        + move data    + fresh setup</div></div><table><thead><tr><th>مورد</th><th>In-Place Upgrade</th><th>Migration</th><th>Clean Installation</th></tr></thead><tbody><tr><td>همان Server</td><td>معمولاً بله</td><td>نه، Server جدید</td><td>لزوماً نه</td></tr><tr><td>سیستم‌عامل قبلی</td><td>ارتقا داده می‌شود</td><td>روی Server قدیمی می‌ماند تا انتقال کامل شود</td><td>جایگزین می‌شود</td></tr><tr><td>تنظیمات موجود</td><td>بخشی حفظ می‌شود</td><td>باید منتقل یا دوباره ساخته شود</td><td>معمولاً باید دوباره تنظیم شود</td></tr><tr><td>ریسک وابستگی‌های قدیمی</td><td>وجود دارد</td><td>کمتر</td><td>کمتر</td></tr><tr><td>کنترل روی محیط جدید</td><td>محدودتر</td><td>بیشتر</td><td>بیشتر</td></tr><tr><td>نیاز به برنامه‌ریزی</td><td>زیاد</td><td>زیاد</td><td>زیاد</td></tr></tbody></table><div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>هیچ‌کدام ذاتاً همیشه بهتر نیستند. انتخاب به <strong>سناریو</strong> بستگی دارد.</div></div>
<h2>۷. چرا Upgrade می‌کنیم؟ چرا گاهی نه؟</h2><h3>دلیل Upgrade</h3><p>Serverی دارد که Application مهمی روی آن نصب است، Configuration پیچیده و تنظیمات زیادی دارد و انتقالش به Server جدید دشوار است. اگر مسیر Upgrade پشتیبانی شود، می‌توانیم با تغییرات کمتر به نسخه‌ی جدید برویم. مزیت اصلی: <strong>کاهش بازسازی و Migration موردنیاز</strong>.</p><h3>دلیل نکردن Upgrade</h3><p>اگر Server قدیمی پر از Application، Driver و Configuration قدیمی و وابستگی‌های ناشناخته باشد، با Upgrade بخشی از مشکلات قدیمی هم همراه آن می‌ماند. گاهی بهتر است Server جدید با OS تمیز، Configuration جدید و سرویس‌های Migrate‌شده بسازیم.</p><div class="code-container"><span class="code-label">محیط تمیز</span><div class="code-block no-prompt">New Server
├── Clean OS
├── New Configuration
└── Migrated Services</div></div>
<h2>۸. قبل از Upgrade چه چیزهایی را بررسی کنیم؟</h2><p>قبل از Upgrade نباید گفت «ISO را اجرا کن و Next بزن». اول باید <strong>Assessment</strong> انجام دهیم:</p><div class="code-container"><span class="code-label">Upgrade Assessment</span><div class="code-block no-prompt">Upgrade Assessment
├── Supported Version?
├── Edition?
├── Architecture?
├── Applications?
├── Drivers?
├── Roles?
├── Disk Space?
├── Hardware?

└── Recovery Plan?</div></div><h3>Compatibility</h3><p>اول بررسی کن آیا مسیر Upgrade از نسخه‌ی فعلی به نسخه‌ی مقصد <strong>پشتیبانی می‌شود</strong>. نباید فرض کنی هر نسخه‌ی خیلی قدیمی را می‌شود مستقیم به هر نسخه‌ی جدید برد؛ Upgrade مسیرهای مشخص و پشتیبانی‌شده دارد. پس نسخه‌ی مبدأ، نسخه‌ی مقصد و مسیر Upgrade را در مستندات رسمی Microsoft بررسی کن.</p><h3>Edition و Installation Option</h3><p>همان‌طور که جلسه‌ی قبل گفتیم Standard و Datacenter Edition هستند. در Upgrade فقط Version را نگاه نکن؛ سازگاری Edition را هم بررسی کن.</p><div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>دقت</strong>در Upgrade معمولاً نوع نصب (Server Core یا Desktop Experience) تغییر نمی‌کند؛ اگر Server الان Core است، بعد از Upgrade هم Core می‌ماند. این را قبل از شروع در مستندات نسخه‌ی مقصد بررسی کن.</div></div><h3>Applications و Drivers</h3><p>یکی از خطرهای اصلی Upgrade ناسازگاری نرم‌افزارها و Driverهاست:</p><div class="code-container"><span class="code-label">وابستگی‌ها</span><div class="code-block no-prompt">Windows Server (old)
├── Backup Software
├── Antivirus
├── Monitoring Agent
├── Database
└── Custom Application</div></div><ul><li>Applicationها در نسخه‌ی جدید Supported هستند؟</li><li>Driverها سازگارند؟</li><li>Agentهای مدیریتی نسخه‌ی جدید را پشتیبانی می‌کنند؟</li></ul><h3>Roles و Features</h3><p>Server ممکن است Roleهای مختلفی داشته باشد (DNS، DHCP، File Services و ...). بررسی کن آیا Roleها و Featureهای فعلی با نسخه‌ی مقصد سازگارند. این در Serverهای Production اهمیت بیشتری دارد.</p><h3>Backup و Recovery Plan</h3><p>قبل از تغییر بزرگ روی Production باید <strong>Recovery Plan</strong> داشته باشی:</p><div class="code-container"><span class="code-label">Recovery</span><div class="code-block no-prompt">Upgrade Failed
      ↓
Can we recover?
      ↓
Backup / Restore</div></div><p>داشتن «یک فایل Backup» کافی نیست. باید بدانی:</p><ul><li>چه چیزی Backup شده؟</li><li>Backup سالم است؟</li><li>Restore چگونه انجام می‌شود؟</li><li>Recovery Time چقدر است؟</li></ul>
<h2>۹. Upgrade روی Domain Controller</h2><p>اگر Server ما Domain Controller باشد، ساده فکر نکن که «Old DC ← Upgrade». باید به معماری Active Directory توجه کنی. اگر DC دیگری داریم، معمولاً می‌توانیم یک DC جدید بسازیم و با Replication اطلاعات AD را در دسترس آن قرار دهیم:</p><div class="code-container"><span class="code-label">DC جدید</span><div class="code-block no-prompt">Old DC

AD Replication

New DC</div></div><p>یعنی در بسیاری از سناریوهای Active Directory، <strong>Migration به DC جدید</strong> رویکرد مهمی است. این را در فصل Active Directory عملی یاد می‌گیریم.</p>
<h2>۱۰. Server Environment یعنی چه؟</h2><p>منظور از <strong>Server Environment</strong> فقط خود Windows Server نیست؛ کل محیطی است که Server در آن کار می‌کند. یک Administrator واقعی فقط Windows را نمی‌بیند.</p><div class="code-container"><span class="code-label">Server Environment</span><div class="code-block no-prompt">                  Server Environment

Logs / Temp / Old Files</div></div><p>قبل از پاک‌سازی، فایل‌های ناشناخته یا System Fileها را کورکورانه حذف نکن.</p><h3>مشکل ۳: Application بعد از Upgrade کار نمی‌کند</h3><div class="code-container"><span class="code-label">ترتیب بررسی</span><div class="code-block no-prompt">Application

<h2>۱۴. نکات آزمونی</h2><h3>نکته ۱: Upgrade ≠ Migration</h3><p><strong>Upgrade:</strong> همان Installation به نسخه‌ی جدیدتر می‌رود.<br><strong>Migration:</strong> محیط جدید ساخته می‌شود و سرویس/داده منتقل می‌شود.</p><h3>نکته ۲</h3><p>قبل از Upgrade: <strong>Compatibility + Backup + Recovery Plan</strong>.</p><h3>نکته ۳</h3><p>اگر سؤال گفت «Server جدید ساخته شده و Data/Role از Server قدیمی منتقل می‌شود»، به <strong>Migration</strong> فکر کن.</p><h3>نکته ۴</h3><p>اگر گفت «سیستم‌عامل فعلی همان Server مستقیماً به نسخه‌ی جدید ارتقا پیدا می‌کند»، به <strong>In-Place Upgrade</strong> فکر کن.</p><h3>نکته ۵</h3><p>در Domain Controllerها باید Active Directory و Replication را در طراحی Upgrade/Migration در نظر گرفت.</p>

<h2>۱۲. چرا NIC Teaming؟</h2><h3>۱. Redundancy</h3><p>اگر NIC1 خراب شود و Team درست طراحی شده باشد، ارتباط می‌تواند از NIC دیگر ادامه پیدا کند. پس خرابی یک NIC الزاماً Server را از شبکه خارج نمی‌کند.</p><div class="code-container"><span class="code-label">Redundancy</span><div class="code-block no-prompt">NIC1 ───X
NIC2 ─────── Network</div></div><h3>۲. Load Distribution</h3><p>در برخی Teaming Modeها می‌توان ترافیک را بین Adapterها توزیع کرد.</p><div class="code-container"><span class="code-label">Load Distribution</span><div class="code-block no-prompt">Traffic
   │
   ▼
NIC Team
 /    \\
NIC1  NIC2</div></div><h3>دام آزمون: سرعت یک Connection</h3><p>فرض کن سرعت هر NIC برابر 1 Gbps است. آیا یک انتقال فایل واحد حتماً با 2 Gbps انجام می‌شود؟ <strong>نه.</strong> رفتار به Teaming Mode، Load Balancing Algorithm، Switch Configuration و نوع Traffic بستگی دارد.</p><div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>توجه</strong>NIC Teaming را با <strong>Redundancy و Load Distribution</strong> مرتبط کن، نه «جمع ساده‌ی سرعت NICها».</div></div>
<h2>۱۳. Teaming Modeها</h2><p>برای سطح MCSA سه حالت را بشناس:</p><div class="code-container"><span class="code-label">Modeها</span><div class="code-block no-prompt">NIC Teaming
├── Switch Independent
├── Static Teaming
└── LACP</div></div><h3>Switch Independent</h3><p>NICها برای تشکیل Team به یک Switch مشترک وابسته نیستند. می‌تواند برای Redundancy مناسب باشد.</p><div class="code-container"><span class="code-label">Switch Independent</span><div class="code-block no-prompt">Server
├── NIC1 ─── Switch A
└── NIC2 ─── Switch B</div></div><h3>Static Teaming</h3><p>Teaming با پیکربندی دو طرفه و بدون LACP انجام می‌شود؛ Switch هم باید متناسب با این طراحی پیکربندی شود.</p><div class="code-container"><span class="code-label">Static Teaming</span><div class="code-block no-prompt">Server Team
   ├── NIC1 ─┐
   └── NIC2 ─┴── Switch (configured)</div></div><h3>LACP</h3><p><strong>LACP = Link Aggregation Control Protocol</strong>؛ پروتکل استاندارد مذاکره و تشکیل Link Aggregation. اگر در آزمون LACP دیدی، به <strong>Link Aggregation / Dynamic Teaming</strong> فکر کن.</p><div class="code-container"><span class="code-label">LACP</span><div class="code-block no-prompt">Server
├── NIC1 ──┐
└── NIC2 ──┴── Switch (LACP)</div></div><table><thead><tr><th>Mode</th><th>ایده‌ی اصلی</th></tr></thead><tbody><tr><td>Switch Independent</td><td>وابستگی کمتر به یک Switch واحد</td></tr><tr><td>Static Teaming</td><td>Teaming استاتیک با پیکربندی Switch</td></tr><tr><td>LACP</td><td>استفاده از LACP برای Link Aggregation</td></tr></tbody></table><p>در این دوره لازم نیست وارد جزئیات عمیق Switching و استانداردهای Ethernet شویم.</p><div class="box note"><i class="fas fa-lightbulb"></i><div><strong>برای Hyper-V</strong>در نسخه‌های جدید Windows Server برای Hyper-V قابلیت دیگری به نام Switch Embedded Teaming (SET) هم وجود دارد؛ در این دوره فقط NIC Teaming کلاسیک را می‌خواهیم.</div></div>
<h2>۱۴. Lab — NIC Teaming</h2><p>فرض کن LAB-SRV01 دو NIC دارد (<code>Ethernet 1</code> و <code>Ethernet 2</code>) و هدف این است:</p><div class="code-container"><span class="code-label">هدف</span><div class="code-block no-prompt">NIC1 ──┐
       ├── Team01
NIC2 ──┘</div></div><p>در Windows Server می‌توان Team را از ابزارهای مدیریتی سیستم (مثل Server Manager یا PowerShell) ساخت. نمونه با PowerShell (نام Adapterها در سیستم تو ممکن است فرق کند):</p><div class="code-container"><span class="code-label">PowerShell</span><div class="code-block no-prompt">PS&gt; New-NetLbfoTeam -Name &quot;Team01&quot; -TeamMembers &quot;Ethernet 1&quot;,&quot;Ethernet 2&quot; -TeamingMode SwitchIndependent</div></div><p>بعد وضعیت <strong>Connectivity</strong>، <strong>Team Status</strong> و <strong>Adapter Status</strong> را بررسی می‌کنیم.</p>
<h2>۱۵. Troubleshooting Remote Management</h2><p>فرض کن Admin-PC نمی‌تواند Server را مدیریت کند. به‌جای «RSAT خراب است»، مرحله‌ای بررسی کن و از <strong>پایه‌ترین لایه‌ها</strong> شروع کن:</p><div class="code-container"><span class="code-label">ترتیب بررسی</span><div class="code-block no-prompt">Admin-PC
   ↓
Network Connectivity
   ↓
IP Configuration
   ↓
DNS Resolution
   ↓
Firewall
   ↓
Remote Management Service
   ↓
Credentials / Permissions
   ↓
Management Tool</div></div><h3>مثال</h3><p>Administrator می‌گوید «نمی‌توانم Server01 را با نام پیدا کنم». اول:</p><div class="code-container"><span class="code-label">ping</span><div class="code-block no-prompt">ping Server01</div></div><p>اگر Name Resolution مشکل داشت، <strong>DNS</strong> را بررسی می‌کنیم. اگر نام Resolve شد ولی Connection برقرار نشد، <strong>Firewall، Remote Management و Credentials</strong> را.</p><div class="box important"><i class="fas fa-info-circle"></i><div><strong>قانون کلی دوره</strong><strong>اول Connectivity، بعد Name Resolution، بعد Service، بعد Permission.</strong></div></div><div class="box note"><i class="fas fa-lightbulb"></i><div><strong>PowerShell Remoting</strong>برای بررسی سرویس Remote Management می‌توانی از <code>Test-WSMan</code> و برای فعال‌سازی از <code>Enable-PSRemoting</code> استفاده کنی. در نسخه‌های جدید Windows Server این قابلیت معمولاً به‌صورت پیش‌فرض فعال است، ولی همیشه وضعیت واقعی را بررسی کن.</div></div>
<h2>۱۶. Troubleshooting NIC Teaming</h2><p>Team ساخته شده ولی Network کار نمی‌کند؟ ترتیب بررسی:</p><div class="code-container"><span class="code-label">ترتیب بررسی</span><div class="code-block no-prompt">NIC Physical/Virtual Status
        ↓
Team Status
        ↓
IP Configuration
        ↓
Switch Configuration
        ↓
VLAN
        ↓
Driver
        ↓
Teaming Mode</div></div><div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>دقت</strong>اگر از <strong>Static Teaming / LACP</strong> استفاده می‌کنی، Configuration سمت Switch را فراموش نکن.</div></div>
<h2>۱۷. نکات آزمونی مهم</h2><h3>نکته 1</h3><p><strong>RSAT = Remote Server Administration Tools</strong>؛ ابزارهای مدیریتی Remote.</p><h3>نکته 2</h3><p><strong>Windows Admin Center:</strong> ابزار مدیریتی Web-based برای Windows Server و منابع مرتبط.</p><h3>نکته 3</h3><p><strong>RDP ≠ Remote Management.</strong> RDP فقط یکی از روش‌های Remote Access/Management است.</p><h3>نکته 4</h3><p><strong>NIC Teaming</strong> بیشتر با <strong>Redundancy + Load Distribution</strong> مرتبط است.</p><h3>نکته 5</h3><p>دو NIC الزاماً NIC Teaming نیست؛ باید در Windows در یک <strong>Team</strong> قرار گرفته باشند.</p><h3>نکته 6</h3><p><strong>LACP</strong> یعنی Link Aggregation با استفاده از LACP.</p><h3>نکته 7</h3><p>NIC Teaming الزاماً سرعت یک Connection واحد را دو برابر نمی‌کند.</p>

<div class="section-header"><div class="section-badge">۵</div><div><h1>Disk و File System</h1><div class="meta">فصل ۲ · Remote Management، NIC Teaming و مدیریت دیسک · جلسه ۲ از ۳</div></div></div>
<p>در جلسه‌ی قبل Server را از راه دور مدیریت کردیم و با NIC و NIC Teaming آشنا شدیم. حالا به یکی از پایه‌ای‌ترین بخش‌های مدیریت Server می‌رسیم:</p>
<blockquote><strong>اطلاعات Server کجا ذخیره می‌شوند و Windows Server چگونه آن‌ها را روی Disk مدیریت می‌کند؟</strong></blockquote>
<p>برای اینکه در جلسات بعد درباره‌ی RAID، Storage Pool، File Sharing، Quota، iSCSI و Data Deduplication حرف بزنیم، اول باید ساختار Disk را درست بفهمیم.</p>

<h2>۱. اهداف جلسه</h2>
<p>در پایان این جلسه باید بتوانی:</p>
<ul>
<li>تفاوت <strong>Physical Disk، Partition، Volume و File System</strong> را توضیح بدهی.</li>
<li>مفهوم <strong>MBR و GPT</strong> را بفهمی.</li>
<li>تفاوت <strong>Basic Disk و Dynamic Disk</strong> را تشخیص بدهی.</li>
<li>File System را تعریف کنی و تفاوت <strong>NTFS و ReFS</strong> را در سطح این دوره بدانی.</li>
<li>مسیر درست Online ← Initialize ← Volume ← Format را هم با GUI و هم با PowerShell اجرا کنی.</li>
<li>خطاهای رایج Disk و Volume را به‌صورت منطقی Troubleshoot کنی.</li>
<li>در سناریوهای آزمونی بین MBR/GPT، Basic/Dynamic و NTFS/ReFS انتخاب مناسب‌تری داشته باشی.</li>
</ul>

<h2>۲. پیش‌نیاز</h2>
<p>از جلسات قبل می‌دانیم Server می‌تواند سرویس‌هایی مثل File Server ارائه کند:</p>

  │
  ▼
File Server
  │
  ▼
Storage</div></div>
<p>اما هنوز یک سؤال جواب داده نشده: این فایل‌ها دقیقاً چطور روی Storage قرار می‌گیرند؟ برای جواب دادن باید چند لایه را بشناسیم.</p>

<h2>۳. مدل ذهنی اصلی Storage</h2>
<p>این مهم‌ترین تصویر جلسه است:</p>
<div class="code-container"><span class="code-label">زنجیره Storage</span><div class="code-block no-prompt">Physical Disk
      ↓
Partition
      ↓
Volume
      ↓
File System
      ↓

<p>اگر این زنجیره را بفهمی، بخش بزرگی از Storage برایت ساده می‌شود.</p>
<h3>Physical Disk</h3>
<p>دیسک فیزیکی (یا مجازی در VM) مثل <code>Disk 0</code>، <code>Disk 1</code> و <code>Disk 2</code>. در Server واقعی ممکن است HDD، SSD یا NVMe باشند. Windows اول همین Storage Device را می‌بیند.</p>
<h3>Partition</h3>
<p>یک Physical Disk را می‌توان به بخش‌هایی تقسیم کرد؛ به هر کدام <strong>Partition</strong> می‌گوییم.</p>
<div class="code-container"><span class="code-label">Partition</span><div class="code-block no-prompt">Disk 0
 ├── Partition 1  →  C:
 └── Partition 2  →  D:</div></div>
<p>رابطه‌ی Partition و Drive Letter همیشه به این سادگی نیست، اما برای مدل ذهنی اولیه مناسب است.</p>
<h3>Volume</h3>
<p><strong>Volume</strong> فضایی است که Windows می‌تواند برای ذخیره‌سازی و File System استفاده کند. در سناریوهای ساده، Partition و Volume تقریباً هم‌جهت دیده می‌شوند، اما از نظر مفهومی یکی نیستند؛ این تفاوت در Storageهای پیشرفته‌تر (مثل Dynamic Volume و Storage Spaces) مهم‌تر می‌شود.</p>

<h2>۴. File System چیست؟</h2>
<p>Windows باید بداند فایل کجاست، اندازه‌اش چقدر است، چه کسی به آن دسترسی دارد، پوشه‌ها چطور سازمان‌دهی شوند و Metadata فایل‌ها کجا ذخیره شود. این وظیفه‌ی File System است.</p>
<blockquote><strong>File System روشی است که سیستم‌عامل با آن فایل‌ها و ساختار ذخیره‌سازی را سازمان‌دهی و مدیریت می‌کند.</strong></blockquote>
<p>اتاقی پر از کاغذ را تصور کن که هیچ نظم و فهرستی ندارد؛ پیدا کردن فایل‌ها بسیار سخت می‌شود. File System مثل یک <strong>سیستم سازمان‌دهی</strong> برای اطلاعات است:</p>
<div class="code-container"><span class="code-label">File System</span><div class="code-block no-prompt">Volume
   │
File System
   ├── Folder
   │    ├── File
   │    └── File
   └── Folder
        └── File</div></div>

<h2>۵. NTFS و ReFS</h2>
<h3>NTFS</h3>
<p><strong>NTFS = New Technology File System</strong>، یکی از مهم‌ترین File Systemهای Windows. چون قابلیت‌هایی مثل File/Folder Permissions، Security، Compression، Encryption (EFS)، Quota و Metadata Management را پشتیبانی می‌کند، برای Windows Server بسیار مهم است. چند جلسه‌ی بعد روی NTFS Permissions کار می‌کنیم.</p>
<h3>ReFS</h3>
<p><strong>ReFS = Resilient File System</strong>؛ برای برخی سناریوهای Storage و Server طراحی شده و روی <strong>Resiliency و Data Integrity</strong> تمرکز دارد.</p>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>توجه</strong>NTFS و ReFS در همه‌ی سناریوها جایگزین کامل یکدیگر نیستند. در این دوره بیشتر با <strong>NTFS</strong> کار می‌کنیم، چون برای File Server، Permissions و بسیاری از سناریوهای پایه‌ی Windows Server بسیار مهم است.</div></div>
<table><thead><tr><th>ویژگی</th><th>NTFS</th><th>ReFS</th></tr></thead><tbody>
<tr><td>File System ویندوز</td><td>✅</td><td>✅</td></tr>
<tr><td>File/Folder Permissions</td><td>✅</td><td>پشتیبانی می‌شود</td></tr>
<tr><td>هدف</td><td>عمومی و بسیار رایج</td><td>تخصصی‌تر</td></tr>
<tr><td>Resiliency / Data Integrity</td><td>خوب</td><td>تمرکز بیشتر</td></tr>
<tr><td>Compression و EFS Encryption</td><td>✅</td><td>بسته به نسخه، محدودتر یا پشتیبانی‌نشده</td></tr>
<tr><td>سازگاری عمومی</td><td>گسترده‌تر</td><td>محدودیت‌های خاص</td></tr>
<tr><td>انتخاب پیش‌فرض بسیاری از Labها</td><td>✅</td><td>معمولاً نه</td></tr>
</tbody></table>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته آزمونی</strong>اگر سناریو روی <strong>سازگاری عمومی، Permissions و File Server معمولی</strong> بود، NTFS آشناتر است. اگر روی <strong>Resiliency و Storageهای خاص</strong> (مثل Storage Spaces یا Hyper-V) تأکید داشت، ReFS را بررسی کن. قابلیت‌های دقیق ReFS بین نسخه‌های Windows Server فرق می‌کند؛ برای کار واقعی مستندات همان نسخه را ببین.</div></div>

<h2>۶. MBR و GPT</h2>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>خیلی مهم</strong><strong>MBR و GPT File System نیستند.</strong> آن‌ها روش‌های <strong>Partitioning</strong> (Partition Style) هستند؛ یعنی جواب می‌دهند: Disk چگونه Partitionهای خود را سازمان‌دهی کند؟</div></div>
<div class="code-container"><span class="code-label">Partition Style</span><div class="code-block no-prompt">Disk
 └── Partition Style
       ├── MBR
       └── GPT

MBR / GPT  ≠  NTFS / ReFS</div></div>
<h3>MBR</h3>
<p><strong>MBR = Master Boot Record</strong>؛ Partition Style قدیمی‌تر. به‌طور سنتی برای اندازه‌ی یک Disk حدود <strong>2 TB</strong> محدودیت دارد و تعداد Partitionهای Primary هم محدود است (حداکثر ۴؛ برای بیشتر باید از Extended Partition و Logical Drive استفاده کرد).</p>
<div class="code-container"><span class="code-label">MBR</span><div class="code-block no-prompt">MBR
 ├── Primary Partitions (حداکثر 4)
 └── Extended Partition
       └── Logical Drives</div></div>
<h3>GPT</h3>
<p><strong>GPT = GUID Partition Table</strong>؛ Partition Style مدرن‌تر برای Diskهای بزرگ و سیستم‌های مدرن. مزیت‌ها: پشتیبانی از Diskهای بسیار بزرگ‌تر از 2 TB، تعداد Partition بیشتر (در Windows تا ۱۲۸)، ساختار مدرن‌تر (نگهداری نسخه‌ی پشتیبان جدول Partition) و استفاده در سیستم‌های مبتنی بر UEFI.</p>
<table><thead><tr><th>ویژگی</th><th>MBR</th><th>GPT</th></tr></thead><tbody>
<tr><td>نسل</td><td>قدیمی‌تر</td><td>مدرن‌تر</td></tr>
<tr><td>Disk بزرگ‌تر از 2TB</td><td>محدودیت مهم</td><td>مناسب</td></tr>
<tr><td>Partitionها</td><td>محدودتر (۴ Primary)</td><td>بیشتر</td></tr>
<tr><td>Boot با UEFI</td><td>مناسب نیست</td><td>مناسب</td></tr>
<tr><td>Boot با Legacy BIOS</td><td>✅</td><td>معمولاً نه</td></tr>
<tr><td>انتخاب مدرن</td><td>معمولاً خیر</td><td>معمولاً بله</td></tr>
</tbody></table>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>انتخاب</strong>اگر Disk جدید و مدرن داری و محدودیت خاصی نداری، <strong>GPT</strong> معمولاً انتخاب مناسب‌تری است. تبدیل MBR به GPT روی Diskی که داده دارد، با ابزارهایی مثل <code>mbr2gpt</code> (برای Disk سیستم) ممکن است؛ ولی در Disk Management تبدیل معمولاً نیاز به <strong>حذف Volumeها</strong> دارد. پس قبل از تبدیل حتماً Backup بگیر.</div></div>
<h3>UEFI و GPT</h3>
<div class="code-container"><span class="code-label">Firmware</span><div class="code-block no-prompt">Modern Firmware → UEFI → GPT → Windows
Legacy BIOS → MBR</div></div>
<p>این را به‌عنوان مدل ذهنی آزمونی نگه دار: برای Boot کردن Windows از Disk سیستمی در حالت UEFI به GPT نیاز داریم. اما برای یک <strong>Disk داده</strong> (غیر Boot) می‌توان GPT را مستقل از Firmware انتخاب کرد.</p>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>دام آزمون</strong>اگر پرسید «کدام گزینه برای Disk بزرگ‌تر از 2TB مناسب‌تر است؟» جواب <strong>GPT</strong> است، نه NTFS، ReFS یا Dynamic Disk؛ چون سؤال درباره‌ی Partition Style است.</div></div>

<h2>۷. Basic Disk و Dynamic Disk</h2>
<h3>Basic Disk</h3>
<p>روش معمول و پیش‌فرض مدیریت Disk در Windows. معمولاً با Partition، Volume و File System کار می‌کنیم و برای بیشتر نیازهای معمول Server کافی است.</p>
<h3>Dynamic Disk</h3>
<p>مدل قدیمی‌تر و تخصصی‌تر که امکان ساخت <strong>Dynamic Volume</strong> را فراهم می‌کند: Simple، Spanned، Striped، Mirrored و RAID-5. این مدل امروز به‌عنوان راهکار قدیمی (Legacy) شناخته می‌شود و Microsoft برای سناریوهای جدید <strong>Storage Spaces</strong> را توصیه می‌کند. برای آزمون باید مفهومش را بشناسی؛ جلسه‌ی بعد وارد RAID و Storage Pool می‌شویم.</p>
<table><thead><tr><th>ویژگی</th><th>Basic Disk</th><th>Dynamic Disk</th></tr></thead><tbody>
<tr><td>مدل رایج‌تر</td><td>✅</td><td>❌</td></tr>
<tr><td>Partitionهای معمول</td><td>✅</td><td>متفاوت (Dynamic Volume)</td></tr>
<tr><td>Dynamic Volumes</td><td>❌</td><td>✅</td></tr>
<tr><td>مدیریت</td><td>ساده‌تر</td><td>پیچیده‌تر</td></tr>
<tr><td>استفاده در سناریوهای جدید</td><td>رایج‌تر</td><td>محدودتر</td></tr>
</tbody></table>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>دقت</strong><strong>Dynamic Disk را با Storage Spaces یکی ندان.</strong> این‌ها دو فناوری متفاوت هستند و Diskهایی که Dynamic هستند را نمی‌توان در Storage Pool استفاده کرد.</div></div>
<h3>انواع Dynamic Volume</h3>
<table><thead><tr><th>نوع</th><th>شرح</th><th>هدف</th></tr></thead><tbody>
<tr><td>Simple</td><td>روی یک Dynamic Disk قرار می‌گیرد</td><td>—</td></tr>
<tr><td>Spanned</td><td>فضای چند Disk را به یک Volume گسترش می‌دهد</td><td>افزایش فضا، <strong>نه Redundancy</strong>؛ اگر یکی از Diskها خراب شود Volume مشکل پیدا می‌کند</td></tr>
<tr><td>Striped</td><td>داده بین چند Disk توزیع می‌شود</td><td>Performance، نه Redundancy</td></tr>
<tr><td>Mirrored</td><td>داده روی دو Disk Mirror می‌شود</td><td>Redundancy</td></tr>
<tr><td>RAID-5</td><td>Striping همراه با Parity</td><td>Performance + Fault Tolerance؛ در طراحی‌های جدید راهکارهای مدرن‌تر را هم در نظر بگیر</td></tr>
</tbody></table>
<div class="code-container"><span class="code-label">انواع</span><div class="code-block no-prompt">Spanned:   Disk 1 ──┐
                    ├── one Volume
           Disk 2 ──┘

Striped:   Disk 1 ──┐
           Disk 2 ──┼── Performance
           Disk 3 ──┘

Mirrored:     Data
              /  \\
         Disk 1  Disk 2</div></div>

<h2>۸. سه لایه را با هم قاطی نکن</h2>
<div class="code-container"><span class="code-label">سه سؤال متفاوت</span><div class="code-block no-prompt">Partition Style:  MBR   / GPT
Disk Type:        Basic / Dynamic
File System:      NTFS  / ReFS</div></div>
<table><thead><tr><th>سؤال</th><th>جواب</th></tr></thead><tbody>
<tr><td>Disk چگونه Partition شود؟</td><td>MBR / GPT</td></tr>
<tr><td>Disk چگونه در Windows مدیریت شود؟</td><td>Basic / Dynamic</td></tr>
<tr><td>فایل‌ها چگونه روی Volume سازمان‌دهی شوند؟</td><td>NTFS / ReFS</td></tr>
</tbody></table>
<p>اگر این تفکیک را یاد بگیری، خیلی از سؤال‌های Storage ساده می‌شوند.</p>

<h2>۹. Lab — اضافه کردن Disk با GUI</h2>
<p>فرض کن VM ما یک Disk جدید گرفته است:</p>
<div class="code-container"><span class="code-label">Disks</span><div class="code-block no-prompt">LAB-SRV01
   ├── Disk 0 → OS
   └── Disk 1 → New Storage</div></div>
<p>فرآیند معمول:</p>
<div class="code-container"><span class="code-label">مراحل</span><div class="code-block no-prompt">New Physical / Virtual Disk
          ↓
       Online
          ↓
      Initialize
          ↓
Partition / Volume
          ↓
      File System
          ↓
     Drive Letter
          ↓
        Ready</div></div>
<h3>Online</h3>
<p>ممکن است Disk جدید Offline دیده شود؛ اول باید آن را Online کنیم.</p>
<h3>Initialize</h3>
<p>سپس Windows از ما می‌خواهد Disk را Initialize کنیم. اینجا Partition Style را انتخاب می‌کنیم: MBR یا GPT. برای یک Disk مدرن جدید معمولاً <strong>GPT</strong> انتخاب مناسبی است.</p>
<h3>ساخت Volume</h3>
<p>بعد از Initialize فضای Unallocated داریم. از آن یک Volume می‌سازیم و Format می‌کنیم:</p>
<div class="code-container"><span class="code-label">Volume</span><div class="code-block no-prompt">Unallocated → New Simple Volume → Format → NTFS</div></div>
<h3>Format چیست؟</h3>
<p>Format یعنی File System را روی Volume ایجاد و آماده کنیم. <strong>Format کردن با Partition کردن یکی نیست</strong>؛ این هم یک دام آزمونی است. در Wizard معمولاً گزینه‌ی <strong>Perform a quick format</strong> را داریم؛ Quick Format فقط ساختار File System را می‌سازد و سریع است، ولی Full Format علاوه بر آن سطوح Disk را هم بررسی می‌کند و زمان بیشتری می‌برد.</p>
<h3>Drive Letter</h3>
<p>بعد از ساخت Volume می‌توانیم آن را به یک Drive Letter مثل <code>C:</code> یا <code>D:</code> وصل کنیم. Drive Letter فقط یک روش دسترسی به Volume است و خود Volume نیست. (Volume را می‌توان به یک پوشه‌ی NTFS هم Mount کرد.)</p>

<h2>۱۰. Lab — همان کار با PowerShell</h2>
<p>در جلسه‌ی قبل دیدیم Server Core و Remote Management با هم گره خورده‌اند. روی Server Core ابزار Disk Management گرافیکی نداریم، پس باید این کار را با PowerShell هم بلد باشی:</p>
<div class="code-container"><span class="code-label">PowerShell</span><div class="code-block no-prompt">PS&gt; Get-Disk
PS&gt; Set-Disk -Number 1 -IsOffline $false
PS&gt; Initialize-Disk -Number 1 -PartitionStyle GPT
PS&gt; New-Partition -DiskNumber 1 -UseMaximumSize -DriveLetter D
PS&gt; Format-Volume -DriveLetter D -FileSystem NTFS -NewFileSystemLabel &quot;Data&quot;</div></div>
<table><thead><tr><th>دستور</th><th>کاربرد</th></tr></thead><tbody>
<tr><td><code>Get-Disk</code></td><td>نمایش Diskها، وضعیت Online/Offline و Partition Style</td></tr>
<tr><td><code>Set-Disk</code></td><td>Online/Offline کردن Disk</td></tr>
<tr><td><code>Initialize-Disk</code></td><td>انتخاب MBR یا GPT</td></tr>
<tr><td><code>New-Partition</code></td><td>ساخت Partition و تخصیص Drive Letter</td></tr>
<tr><td><code>Format-Volume</code></td><td>ساخت File System (NTFS/ReFS)</td></tr>
</tbody></table>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>احتیاط</strong><code>Initialize-Disk</code> و <code>Format-Volume</code> عملیات Destructive هستند. قبل از اجرا حتماً با <code>Get-Disk</code> مطمئن شو Number درست را انتخاب کرده‌ای؛ اشتباه گرفتن Disk 0 و Disk 1 در Production فاجعه است.</div></div>

<h2>۱۱. Lab پیشنهادی دوره</h2>
<div class="code-container"><span class="code-label">Lab</span><div class="code-block no-prompt">LAB-SRV01
├── Disk 0
│    └── C: → OS
└── Disk 1
     └── D: → Data

Disk 1 → GPT → Basic Disk → NTFS → D:</div></div>
<p>این Volume در جلسات بعد می‌تواند تبدیل شود به <code>D:\\Data</code>، <code>D:\\Shares</code> و <code>D:\\Backup</code> و روی آن Sharing، NTFS Permissions، Compression، Encryption و Quota را تمرین می‌کنیم. یعنی Lab ما از همین‌جا به جلسات بعد وصل می‌شود.</p>

<h2>۱۲. Troubleshooting</h2>
<h3>Disk دیده نمی‌شود</h3>
<p>فرض کن Disk جدید اضافه کرده‌ای ولی در File Explorer نمی‌بینی. اول سراغ File Explorer نرو:</p>
<div class="code-container"><span class="code-label">ترتیب بررسی</span><div class="code-block no-prompt">Physical / Virtual Hardware
          ↓
Disk Management
          ↓
Online?
          ↓
Initialized?
          ↓
Partition / Volume?
          ↓
Formatted?
          ↓
Drive Letter?</div></div>
<p>مثلاً اگر Disk، Volume و File System وجود دارد ولی Drive Letter ندارد، Volume در File Explorer دیده نمی‌شود.</p>
<h3>Disk Offline است</h3>
<ul><li>Disk Management را بررسی کن.</li><li>علت Offline بودن را مشخص کن.</li><li>در صورت اطمینان، آن را Online کن.</li></ul>
<p>در Production نباید بدون بررسی، Disk را کورکورانه Online/Offline کرد؛ ممکن است به Storage Shared یا سناریوهای خاص مربوط باشد.</p>
<h3>Volume ساخته شده ولی قابل استفاده نیست</h3>
<div class="code-container"><span class="code-label">حالت‌ها</span><div class="code-block no-prompt">Volume ✓  Format ✗
Volume ✓  Drive Letter ✗</div></div>
<p>وضعیت File System و Drive Letter را بررسی کن.</p>
<h3>Disk جدید بزرگ‌تر از 2TB فقط 2TB را نشان می‌دهد</h3>
<p>احتمالاً با MBR Initialize شده است. ببین Partition Style چیست؛ در صورت نیاز با Backup و تبدیل مناسب به GPT مسئله حل می‌شود.</p>

<h2>۱۳. نکات آزمونی مهم</h2>
<h3>نکته 1</h3><p><strong>MBR / GPT</strong> = Partition Style.</p>
<h3>نکته 2</h3><p><strong>NTFS / ReFS</strong> = File System.</p>
<h3>نکته 3</h3><p><strong>Basic / Dynamic</strong> = مدل مدیریت Disk در Windows.</p>
<h3>نکته 4</h3><p>Disk بزرگ‌تر از 2TB ← <strong>GPT</strong> را بررسی کن.</p>
<h3>نکته 5</h3><p>File Sharing معمولی ← <strong>NTFS</strong> انتخاب بسیار رایج.</p>
<h3>نکته 6</h3><p><strong>Spanned ≠ Redundancy</strong>؛ Spanned فقط فضای چند Disk را گسترش می‌دهد.</p>
<h3>نکته 7</h3><p><strong>Striped ≠ Mirrored</strong>؛ Striped ← Performance، Mirrored ← Redundancy.</p>

<h2>۱۵. خودآزمایی</h2>
<p>قبل از دیدن پاسخ، خودت جواب بده.</p>

`,
"s6": `
<div class="section-header"><div class="section-badge">۶</div><div><h1>RAID و Storage Pool</h1><div class="meta">فصل ۲ · Remote Management، NIC Teaming و مدیریت دیسک · جلسه ۳ از ۳</div></div></div>
<p>در جلسه‌ی قبل زنجیره‌ی Disk ← Partition/Volume ← File System ← Files را یاد گرفتیم. حالا یک سؤال واقعی‌تر داریم:</p>
<blockquote><strong>اگر روی Server چند Disk داریم، آیا بهتر نیست آن‌ها را طوری کنار هم بگذاریم که هم سرعت بهتر شود، هم خرابی Disk باعث از بین رفتن اطلاعات نشود؟</strong></blockquote>
<p>اینجاست که <strong>RAID</strong> و <strong>Storage Pool</strong> وارد می‌شوند.</p>

<h2>۱. اهداف جلسه</h2>
<p>در پایان این جلسه باید بتوانی:</p>
<ul>
<li>مفهوم RAID را بدون حفظ‌کردن تعریف‌های خشک توضیح بدهی.</li>
<li>تفاوت <strong>Performance، Capacity و Fault Tolerance</strong> را بفهمی.</li>
<li>RAID 0، RAID 1، RAID 5، RAID 6 و RAID 10 را مقایسه کنی و ظرفیت قابل استفاده‌ی هر کدام را حساب کنی.</li>
<li>بفهمی چرا RAID Backup نیست.</li>
<li>مفهوم Storage Pool و Storage Space را توضیح بدهی.</li>
<li>تفاوت <strong>RAID سنتی</strong> و <strong>Storage Spaces</strong> را در سطح MCSA تشخیص بدهی.</li>
<li>در یک سناریو انتخاب منطقی‌تری بین RAIDها داشته باشی.</li>
<li>خرابی Disk را در محیط RAID و Storage Spaces به‌صورت مفهومی Troubleshoot کنی.</li>
</ul>

<h2>۲. پیش‌نیاز</h2>
<p>از جلسه‌ی قبل سه مفهوم مهم داریم: Physical Disk ← Volume ← File System. فرض کن Server ما چهار Disk دارد:</p>
<div class="code-container"><span class="code-label">Server</span><div class="code-block no-prompt">Server
├── Disk 1
├── Disk 2
├── Disk 3
└── Disk 4</div></div>
<p>سؤال: این Diskها را جداگانه استفاده کنیم یا با یک روش خاص ترکیبشان کنیم؟</p>

<h2>۳. مدل ذهنی RAID</h2>
<blockquote><strong>RAID یعنی استفاده از چند Disk با یک طراحی مشخص برای رسیدن به ترکیبی از Performance، Capacity و/یا Fault Tolerance.</strong></blockquote>
<table><thead><tr><th>هدف</th><th>معنی</th></tr></thead><tbody>
<tr><td>Performance</td><td>داده سریع‌تر خوانده/نوشته شود</td></tr>
<tr><td>Fault Tolerance</td><td>خرابی یک یا چند Disk باعث از دست رفتن کل Storage نشود</td></tr>
<tr><td>Capacity</td><td>از فضای چند Disk در یک Storage استفاده کنیم</td></tr>
</tbody></table>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>Trade-off</strong>هیچ RAIDی همه‌چیز را به حداکثر نمی‌رساند؛ معمولاً باید بین این ویژگی‌ها مصالحه کنیم.</div></div>

<h2>۴. RAID 0 — Striping</h2>
<p>در RAID 0 داده‌ها بین چند Disk توزیع می‌شوند (<strong>Striping</strong>):</p>
<div class="code-container"><span class="code-label">RAID 0</span><div class="code-block no-prompt">Data
 ├── A ──▶ Disk 1
 ├── B ──▶ Disk 2
 ├── C ──▶ Disk 1
 └── D ──▶ Disk 2</div></div>
<p><strong>مزیت:</strong> Performance می‌تواند افزایش پیدا کند.<br><strong>عیب بسیار مهم:</strong> هیچ Fault Tolerance ندارد. اگر یکی از Diskها خراب شود، کل مجموعه ممکن است غیرقابل استفاده شود.</p>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>خلاصه</strong><strong>RAID 0 = Performance، نه Redundancy</strong></div></div>

<h2>۵. RAID 1 — Mirroring</h2>
<p>در RAID 1 داده‌ها روی دو Disk کپی می‌شوند:</p>
<div class="code-container"><span class="code-label">RAID 1</span><div class="code-block no-prompt">        Data
       /    \\
   Disk 1  Disk 2
     A       A
     B       B
     C       C</div></div>
<p>اگر Disk 1 خراب شود، نسخه‌ی دوم هنوز وجود دارد.<br><strong>مزیت:</strong> Fault Tolerance.<br><strong>عیب:</strong> ظرفیت قابل استفاده کم می‌شود؛ مثلاً دو Disk یک‌ترابایتی (ظرفیت خام 2TB) تقریباً <strong>1TB</strong> فضای قابل استفاده می‌دهند.</p>

<h2>۶. RAID 5 — Parity</h2>
<p>به‌جای یک کپی کامل، اطلاعات و <strong>Parity</strong> بین Diskها توزیع می‌شوند:</p>
<div class="code-container"><span class="code-label">RAID 5</span><div class="code-block no-prompt">Disk 1    Disk 2    Disk 3
  A         B         P
  C         P         D
  P         E         F</div></div>
<p>حرف P یعنی Parity. Parity به RAID اجازه می‌دهد در صورت خرابی یک Disk، اطلاعات از دست‌رفته را بازسازی کند.</p>
<ul><li>Performance مناسب (به‌خصوص برای Read)</li><li>استفاده‌ی بهتر از ظرفیت نسبت به RAID 1</li><li>تحمل خرابی <strong>یک Disk</strong></li></ul>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>فرمول ظرفیت</strong>در RAID 5 با N عدد Disk هم‌اندازه، ظرفیت قابل استفاده تقریباً <strong>(N − 1) × اندازه‌ی یک Disk</strong> است؛ یعنی ظرفیت یک Disk صرف Parity می‌شود. مثلاً چهار Disk دو‌ترابایتی ← حدود 6TB.</div></div>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>محدودیت</strong>اگر دو Disk هم‌زمان از بین بروند، RAID 5 معمولاً دیگر نمی‌تواند مجموعه را حفظ کند. همچنین در Diskهای بسیار بزرگ، زمان Rebuild طولانی است و در این مدت اگر Disk دیگری خراب شود، داده از دست می‌رود.</div></div>

<h2>۷. RAID 6 — دو Parity (آشنایی)</h2>
<p>RAID 6 مثل RAID 5 است ولی <strong>دو Parity</strong> دارد، پس می‌تواند خرابی <strong>دو Disk</strong> را تحمل کند. در عوض ظرفیت دو Disk صرف Parity می‌شود (ظرفیت تقریبی: (N − 2) × اندازه‌ی یک Disk) و حداقل ۴ Disk لازم است. در آزمون بیشتر با RAID 0/1/5/10 روبه‌رو می‌شوی، ولی اسم RAID 6 را هم بشناس.</p>

<h2>۸. RAID 10 — ترکیب Mirror و Stripe</h2>
<p>RAID 10 را می‌توان به‌صورت ساده <strong>RAID 1 + RAID 0</strong> دید:</p>
<div class="code-container"><span class="code-label">RAID 10</span><div class="code-block no-prompt">          RAID 10
             │
      ┌──────┴──────┐
   Mirror         Mirror
   /    \\          /   \\
 Disk1  Disk2    Disk3 Disk4
      \\             /
       └── Stripe ──┘</div></div>
<p>هم Performance خوب داریم هم Fault Tolerance؛ اما ظرفیت قابل استفاده حدود 50٪ ظرفیت خام است. حداقل چهار Disk لازم است، چون باید Mirrorها را بسازیم و بعد Stripe کنیم. اگر از هر Mirror حداکثر یک Disk خراب شود، مجموعه سالم می‌ماند؛ ولی اگر هر دو Disk یک Mirror خراب شوند، داده از دست می‌رود.</p>

<h2>۹. مقایسه‌ی RAIDهای مهم</h2>
<table><thead><tr><th>RAID</th><th>روش</th><th>Performance</th><th>Fault Tolerance</th><th>ظرفیت قابل استفاده</th><th>حداقل Disk</th></tr></thead><tbody>
<tr><td>RAID 0</td><td>Striping</td><td>بالا</td><td>❌</td><td>100٪</td><td>2</td></tr>
<tr><td>RAID 1</td><td>Mirroring</td><td>خوب</td><td>✅ یک Disk</td><td>حدود 50٪</td><td>2</td></tr>
<tr><td>RAID 5</td><td>Striping + Parity</td><td>خوب</td><td>✅ یک Disk</td><td>(N−1)/N</td><td>3</td></tr>
<tr><td>RAID 6</td><td>Striping + دو Parity</td><td>خوب</td><td>✅ دو Disk</td><td>(N−2)/N</td><td>4</td></tr>
<tr><td>RAID 10</td><td>Mirror + Stripe</td><td>بالا</td><td>✅ (بسته به محل خرابی)</td><td>حدود 50٪</td><td>4</td></tr>
</tbody></table>
<p>این جدول را برای آزمون خوب به خاطر بسپار.</p>
<h3>سناریو: چهار Disk یک‌ترابایتی</h3>
<table><thead><tr><th>انتخاب</th><th>ظرفیت قابل استفاده (تقریبی)</th><th>Fault Tolerance</th></tr></thead><tbody>
<tr><td>RAID 0</td><td>حدود 4TB</td><td>ندارد</td></tr>
<tr><td>RAID 5</td><td>حدود 3TB</td><td>یک Disk</td></tr>
<tr><td>RAID 6</td><td>حدود 2TB</td><td>دو Disk</td></tr>
<tr><td>RAID 10</td><td>حدود 2TB</td><td>دارد، با Performance خوب</td></tr>
</tbody></table>

<h2>۱۰. RAID Backup نیست!</h2>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>خیلی مهم</strong><strong>RAID ≠ Backup</strong></div></div>
<p>در RAID 1 اگر کاربر اشتباهاً یک فایل را Delete کند، حذف روی هر دو طرف Mirror اتفاق می‌افتد:</p>
<div class="code-container"><span class="code-label">حذف فایل</span><div class="code-block no-prompt">File Deleted
     ↓
Disk 1 → Deleted
Disk 2 → Deleted</div></div>
<p>RAID در برابر <strong>خرابی Disk</strong> کمک می‌کند، نه در برابر این‌ها:</p>
<ul><li>حذف اشتباه فایل</li><li>Ransomware</li><li>خراب شدن Application</li><li>اشتباه Administrator</li><li>Disaster</li><li>خرابی کل Server</li></ul>
<p>برای این موارد Backup لازم داریم.</p>

<h2>۱۱. RAID سخت‌افزاری و نرم‌افزاری</h2>
<h3>Hardware RAID</h3>
<p>یک RAID Controller مسئول مدیریت RAID است و سیستم‌عامل ممکن است فقط یک Logical Disk ببیند.</p>
<div class="code-container"><span class="code-label">Hardware RAID</span><div class="code-block no-prompt">Server
  │
RAID Controller
  ├── Disk
  ├── Disk
  └── Disk</div></div>
<h3>Software RAID</h3>
<p>خود سیستم‌عامل بخشی از مدیریت RAID را انجام می‌دهد. در Windows Server قدیمی‌تر، Dynamic Disk و Dynamic Volumes (جلسه‌ی قبل) این نقش را داشتند؛ امروز راهکار پیشنهادی Microsoft برای Software-defined Storage، <strong>Storage Spaces</strong> است.</p>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>Hot Spare</strong>در بسیاری از طراحی‌ها یک Disk اضافی به‌عنوان <strong>Hot Spare</strong> آماده نگه داشته می‌شود تا با خرابی یک Disk، Rebuild به‌صورت خودکار شروع شود.</div></div>

<h2>۱۲. Storage Pool و Storage Space</h2>
<p>فرض کن چند Disk داریم. به‌جای اینکه هر Disk را کاملاً مستقل مدیریت کنیم، می‌توانیم آن‌ها را در یک <strong>Storage Pool</strong> قرار دهیم؛ مجموعه‌ای منطقی از چند Physical Disk که Storage Spaces از آن برای ایجاد و مدیریت Storage استفاده می‌کند. بعد، Storage موردنیازمان را از Pool می‌سازیم. هر Storage ساخته‌شده از Pool یک <strong>Storage Space</strong> (Virtual Disk) است.</p>
<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">Physical Disks
      ↓
Storage Pool
      ↓
Storage Space (Virtual Disk)
      ↓
Volume
      ↓
File System</div></div>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>مزیت</strong><strong>مدیریت انعطاف‌پذیر Storage</strong>؛ به‌جای وابستگی به ساختار ثابت Diskها، Storage را از Pool مدیریت می‌کنیم و می‌توانیم بعداً Disk جدید به Pool اضافه کنیم.</div></div>

<h2>۱۳. Storage Spaces و Resiliency</h2>
<p>Storage Spaces می‌تواند Spaceهایی با Resiliency مختلف بسازد:</p>
<table><thead><tr><th>نوع</th><th>توضیح</th><th>مشابه ذهنی</th><th>حداقل Disk (معمولاً)</th></tr></thead><tbody>
<tr><td>Simple</td><td>بدون Redundancy؛ اگر Disk خراب شود محافظت نداریم</td><td>RAID 0 (Striping)</td><td>1</td></tr>
<tr><td>Two-Way Mirror</td><td>دو کپی از داده؛ تحمل خرابی یک Disk</td><td>RAID 1</td><td>2</td></tr>
<tr><td>Three-Way Mirror</td><td>سه کپی؛ تحمل خرابی دو Disk ولی مصرف Storage بیشتر</td><td>—</td><td>5</td></tr>
<tr><td>Parity</td><td>Fault Tolerance با استفاده‌ی بهتر از ظرفیت نسبت به Mirror</td><td>RAID 5</td><td>3</td></tr>
</tbody></table>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>حداقل تعداد Diskها ممکن است بسته به نسخه و پیکربندی فرق کند؛ برای کار واقعی مستندات رسمی را ببین.</div></div>

<h2>۱۴. RAID vs Storage Spaces</h2>
<table><thead><tr><th>RAID</th><th>Storage Spaces</th></tr></thead><tbody>
<tr><td>فناوری RAID</td><td>فناوری Windows</td></tr>
<tr><td>معمولاً با RAID Controller یا روش‌های RAID پیاده می‌شود</td><td>بر پایه‌ی Storage Pool</td></tr>
<tr><td>مدل‌های RAID مثل 0/1/5/10</td><td>Simple / Mirror / Parity</td></tr>
<tr><td>مدیریت Storage به روش RAID</td><td>مدیریت انعطاف‌پذیر Pool</td></tr>
<tr><td>می‌تواند Hardware-based باشد</td><td>Windows-based</td></tr>
</tbody></table>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>خلاصه</strong>Storage Spaces نسخه‌ی دیگری از RAID نیست؛ یک فناوری متفاوت برای مدیریت Storage است که مفاهیم Resiliency مشابهی دارد.</div></div>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته عملی</strong>برای Storage Spaces معمولاً Diskها باید مستقیم و بدون RAID Controller (مثلاً HBA یا JBOD) در اختیار Windows باشند. اگر Diskها پشت یک Hardware RAID باشند، Windows فقط Logical Disk را می‌بیند و Pool معمولاً درست کار نمی‌کند. این را قبل از طراحی بررسی کن.</div></div>

<h2>۱۵. Raw vs Usable Capacity، Thin و Thick Provisioning</h2>
<p>اگر چهار Disk دو‌ترابایتی را در یک Pool بگذاریم، حدود <strong>8TB Raw Capacity</strong> داریم. بسته به نوع Storage Space، بخشی از ظرفیت برای Redundancy استفاده می‌شود؛ پس <strong>Raw Capacity با Usable Capacity یکی نیست</strong> (همین در RAID هم صدق می‌کرد).</p>
<h3>Thin Provisioning</h3>
<p>می‌توانیم یک Storage Space منطقی بزرگ‌تر از فضای فیزیکی فعلی تعریف کنیم:</p>
<div class="code-container"><span class="code-label">Thin</span><div class="code-block no-prompt">Physical Pool         →  4TB
Virtual Storage Space →  10TB</div></div>
<p>یعنی الزاماً از ابتدا 10TB فضای فیزیکی نداریم. با افزایش مصرف باید Pool را مدیریت و در صورت نیاز Disk اضافه کنیم؛ وگرنه فضای Pool تمام می‌شود و Space دچار مشکل می‌شود.</p>
<h3>Fixed/Thick Provisioning</h3>
<p>فضای فیزیکی موردنیاز از ابتدا تخصیص داده می‌شود.</p>
<table><thead><tr><th>نوع</th><th>ایده</th></tr></thead><tbody>
<tr><td>Thin</td><td>انعطاف‌پذیری بیشتر در تخصیص، نیاز به نظارت روی فضای Pool</td></tr>
<tr><td>Fixed/Thick</td><td>تخصیص فیزیکی مستقیم‌تر</td></tr>
</tbody></table>

<h2>۱۷. Troubleshooting</h2>
<h3>RAID</h3>
<p>اول مشخص کن مشکل کجاست:</p>
<div class="code-container"><span class="code-label">لایه‌ها</span><div class="code-block no-prompt">Physical Disk
     ↓
RAID Controller
     ↓
RAID Array
     ↓
Logical Disk
     ↓
Volume
     ↓
File System</div></div>
<p>مثلاً اگر در RAID 1 یکی از Diskها خراب شود، Array در وضعیت <strong>Degraded</strong> قرار می‌گیرد: هنوز کار می‌کند، اما محافظت کامل و وضعیت عادی خود را از دست داده است. باید Disk خراب را تعویض و Array را <strong>Rebuild</strong> کنیم.</p>
<div class="code-container"><span class="code-label">Degraded</span><div class="code-block no-prompt">Disk 1 ✓
Disk 2 ❌   →   Array: Degraded</div></div>
<h3>Storage Pool</h3>
<div class="code-container"><span class="code-label">لایه‌ها</span><div class="code-block no-prompt">Physical Disk
      ↓
Storage Pool
      ↓
Storage Space
      ↓
Virtual Disk / Volume</div></div>
<p>اگر یک Disk خراب شود، ببین Resiliency انتخاب‌شده توان تحمل آن خرابی را دارد یا نه. پس سؤال اول همیشه این است: <strong>چه نوع Resiliency ساخته شده؟</strong> برای دیدن وضعیت می‌توانی از <code>Get-StoragePool</code>، <code>Get-VirtualDisk</code> و <code>Get-PhysicalDisk</code> استفاده کنی (ستون‌های HealthStatus و OperationalStatus).</p>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>اشتباه خطرناک</strong>اگر Administrator ببیند <code>Disk → Failed</code> و سریع آن را Initialize یا Format کند، ممکن است وضعیت بدتر شود. در Storageهای RAID/Pool اول وضعیت Array/Pool را بررسی کن؛ بعد اقدام کن. در Production بدون شناخت معماری Storage عملیات Destructive انجام نده.</div></div>
