<h2>۱. اهداف جلسه</h2>
<p>در پایان این جلسه باید بتوانی:</p>
<ul>
<li>مفهوم <strong>Share</strong> و تفاوت آن با خود Folder را توضیح بدهی.</li>
<li>نقش پروتکل <strong>SMB</strong> را در File Sharing بفهمی.</li>
<li>مسیر <strong>UNC</strong> را بنویسی و یک Share را به‌صورت Mapped Drive وصل کنی.</li>
<li>سه سطح <strong>Share Permissions</strong> را بشناسی: Read، Change و Full Control.</li>
<li>بدانی Share Permissions و NTFS Permissions چطور با هم ترکیب می‌شوند و <strong>Effective Permission</strong> را حساب کنی.</li>
<li>Share را با Server Manager، File Explorer و PowerShell بسازی.</li>
<li>Hidden Share و Administrative Share را تشخیص بدهی.</li>
<li>مشکل‌های رایج دسترسی به Share را مرحله‌ای عیب‌یابی کنی.</li>
</ul>

<h2>۲. پیش‌نیاز</h2>
<p>از جلسه‌ی ۵ یک Volume با NTFS داریم (<code>D:</code>) و از جلسه‌ی ۶ می‌دانیم این Volume می‌تواند روی Storage Pool هم ساخته شود. حالا همین Volume را به‌اشتراک می‌گذاریم:</p>
<div class="code-container"><span class="code-label">مسیر تا اینجا</span><div class="code-block no-prompt">Disk / Storage Pool
        ↓
Volume (NTFS)
        ↓
Folder
        ↓
Share   ◀── جلسه ۷</div></div>

<h2>۳. مدل ذهنی: Folder یا Share؟</h2>
<p>یک Folder روی Disk فقط یک پوشه است؛ هیچ کاربر شبکه‌ای آن را نمی‌بیند. وقتی همان Folder را <strong>Share</strong> می‌کنیم، یک «در ورودی» روی شبکه برایش تعریف می‌شود:</p>
<div class="code-container"><span class="code-label">Folder → Share</span><div class="code-block no-prompt">D:\\Shares\\Finance          (Folder روی Disk)
        │
        │  Share
        ▼
\\\\LAB-SRV01\\Finance        (نام در شبکه)</div></div>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته مهم</strong>Share یک <strong>تنظیم روی Folder</strong> است، نه یک کپی از آن. فایل‌ها همان‌جا روی Disk می‌مانند و کاربران از طریق شبکه به آن‌ها دسترسی پیدا می‌کنند.</div></div>
<div class="code-container"><span class="code-label">مدل کلی</span><div class="code-block no-prompt">Client ── SMB ──▶ File Server
                     │
                  Share
                     │
                  Folder
                     │
                NTFS Volume</div></div>

<h2>۴. SMB چیست؟</h2>
<p><strong>SMB = Server Message Block</strong>؛ پروتکلی که Windows برای File Sharing (و Printer Sharing) از آن استفاده می‌کند. وقتی کاربری یک Share را باز می‌کند، در پشت صحنه Client با SMB به Server وصل می‌شود.</p>
<ul>
<li>SMB روی <strong>TCP پورت 445</strong> کار می‌کند.</li>
<li>نسخه‌های جدید (<strong>SMB 3.x</strong>) قابلیت‌هایی مثل رمزگذاری ترافیک (SMB Encryption) و Multichannel دارند.</li>
<li>نسخه‌ی قدیمی <strong>SMB 1.0</strong> از نظر امنیتی ضعیف است و در نسخه‌های جدید Windows معمولاً غیرفعال یا حذف شده است؛ آن را فعال نکن مگر ضرورت جدی داشته باشی.</li>
</ul>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>برای آزمون</strong>اگر پرسیدند «File Sharing در Windows با چه پروتکلی انجام می‌شود؟» جواب <strong>SMB</strong> است. (NFS پروتکل رایج Linux/UNIX است و Windows Server هم می‌تواند آن را به‌عنوان Role جداگانه ارائه کند.)</div></div>

<h2>۵. مسیر UNC و Mapped Drive</h2>
<p>برای اشاره به یک Share از <strong>UNC Path</strong> استفاده می‌کنیم:</p>
<div class="code-container"><span class="code-label">UNC</span><div class="code-block no-prompt">\\\\ServerName\\ShareName
\\\\LAB-SRV01\\Finance
\\\\LAB-SRV01\\Finance\\Reports\\2026.xlsx</div></div>
<p>به‌جای تایپ هر بار مسیر کامل، کاربر می‌تواند Share را به یک Drive Letter وصل کند. این کار را <strong>Map Network Drive</strong> می‌گوییم:</p>
<div class="code-container"><span class="code-label">Mapped Drive</span><div class="code-block no-prompt">net use Z: \\\\LAB-SRV01\\Finance
New-PSDrive -Name Z -PSProvider FileSystem -Root \\\\LAB-SRV01\\Finance -Persist</div></div>
<p>از این به بعد Z: برای کاربر مثل یک Disk محلی دیده می‌شود، ولی در واقع به Share روی Server وصل است.</p>

<h2>۶. Share Permissions</h2>
<p>هر Share یک لیست دسترسی مخصوص خودش دارد. Share Permissions سه سطح ساده دارند:</p>
<table><thead><tr><th>Permission</th><th>اجازه می‌دهد</th></tr></thead><tbody>
<tr><td>Read</td><td>دیدن لیست فایل‌ها، خواندن فایل‌ها و اجرای برنامه‌ها</td></tr>
<tr><td>Change</td><td>همه‌ی کارهای Read + ساخت، ویرایش و حذف فایل و پوشه</td></tr>
<tr><td>Full Control</td><td>همه‌ی کارهای Change + تغییر Permissionها</td></tr>
</tbody></table>
<p>برای هر سطح می‌توان <strong>Allow</strong> یا <strong>Deny</strong> تعریف کرد. قاعده‌های ترکیب در همین لیست:</p>
<ul>
<li>اگر کاربر عضو چند گروه باشد، Permissionهای <strong>Allow</strong> آن‌ها با هم <strong>جمع</strong> می‌شوند (بالاترین سطح می‌ماند).</li>
<li><strong>Deny</strong> معمولاً بر Allow غلبه می‌کند.</li>
</ul>
<div class="code-container"><span class="code-label">مثال جمع‌شدن</span><div class="code-block no-prompt">User عضو Group A → Share: Read
User عضو Group B → Share: Change
─────────────────────────────────
Share Permission مؤثر = Change</div></div>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>دقت</strong>Share Permissions فقط وقتی اعمال می‌شوند که کاربر <strong>از طریق شبکه</strong> وارد شود. اگر کاربر مستقیماً روی خود Server لاگین کند (Local یا RDP)، فقط NTFS Permissions کار می‌کند.</div></div>

<h2>۷. Share Permissions + NTFS Permissions</h2>
<p>اینجا مهم‌ترین قاعده‌ی جلسه است. یک فایل روی Disk NTFS دو لایه دسترسی دارد:</p>
<div class="code-container"><span class="code-label">دو لایه</span><div class="code-block no-prompt">User (از شبکه)
     │
     ▼
Share Permissions   ← لایه ۱ (فقط در دسترسی شبکه‌ای)
     │
     ▼
NTFS Permissions    ← لایه ۲ (همیشه)
     │
     ▼
File</div></div>
<p>روش محاسبه‌ی <strong>Effective Permission</strong> برای دسترسی شبکه‌ای:</p>
<ol>
<li>Share Permissions کاربر را (با جمع‌کردن گروه‌ها و اعمال Deny) حساب کن.</li>
<li>NTFS Permissions کاربر را هم جداگانه (با جمع‌کردن گروه‌ها و اعمال Deny) حساب کن.</li>
<li>بین این دو نتیجه، <strong>محدودکننده‌ترین</strong> را بردار.</li>
</ol>
<table><thead><tr><th>Share Permission</th><th>NTFS Permission</th><th>دسترسی مؤثر از شبکه</th></tr></thead><tbody>
<tr><td>Full Control</td><td>Read</td><td><strong>Read</strong></td></tr>
<tr><td>Read</td><td>Full Control</td><td><strong>Read</strong></td></tr>
<tr><td>Change</td><td>Modify</td><td><strong>Change / Modify</strong></td></tr>
<tr><td>Full Control</td><td>Full Control</td><td><strong>Full Control</strong></td></tr>
<tr><td>Change</td><td>بدون دسترسی</td><td><strong>بدون دسترسی</strong></td></tr>
</tbody></table>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>رویکرد رایج در عمل</strong>برای ساده‌تر شدن مدیریت، خیلی از Administratorها Share Permission را گسترده می‌گذارند (مثلاً Authenticated Users با Change یا Full Control) و کنترل دقیق را با <strong>NTFS Permissions</strong> انجام می‌دهند؛ چون NTFS هم برای دسترسی شبکه‌ای و هم محلی کار می‌کند و جزئیات بیشتری دارد. در فصل بعد NTFS Permissions را عمیق کار می‌کنیم.</div></div>

<h2>۸. روش‌های ساخت Share</h2>
<div class="code-container"><span class="code-label">روش‌ها</span><div class="code-block no-prompt">Share Creation
├── Server Manager → File and Storage Services → Shares
├── File Explorer → Properties → Sharing → Advanced Sharing
├── PowerShell → New-SmbShare
└── Command Line → net share</div></div>
<h3>Server Manager (New Share Wizard)</h3>
<p>مسیر: <strong>File and Storage Services ← Shares ← Tasks ← New Share</strong>. ویزارد چند Profile می‌دهد:</p>
<table><thead><tr><th>Profile</th><th>کاربرد</th></tr></thead><tbody>
<tr><td>SMB Share – Quick</td><td>Share ساده‌ی عمومی (رایج‌ترین)</td></tr>
<tr><td>SMB Share – Advanced</td><td>Share همراه با گزینه‌های بیشتر مثل Quota و Classification</td></tr>
<tr><td>SMB Share – Applications</td><td>Share با تنظیمات مناسب Applicationها (مثل Hyper-V یا Database)</td></tr>
<tr><td>NFS Share – Quick / Advanced</td><td>Share برای کلاینت‌های NFS (نیازمند Role مربوط)</td></tr>
</tbody></table>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>Role لازم برای این ویزارد، <strong>File Server</strong> است (زیر File and Storage Services). پیش‌فرض Share Permissionها بسته به روش ساخت فرق می‌کند؛ بعد از ساخت همیشه آن‌ها را بررسی کن.</div></div>

<h2>۹. Hidden Share و Administrative Share</h2>
<p>اگر آخر نام Share علامت <code>$</code> بگذاریم، Share در لیست Browse کردن شبکه نمایش داده نمی‌شود، ولی اگر کسی نام دقیقش را بداند و Permission داشته باشد، می‌تواند وصل شود:</p>
<div class="code-container"><span class="code-label">Hidden Share</span><div class="code-block no-prompt">\\\\LAB-SRV01\\HR$</div></div>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>اشتباه رایج</strong>Hidden Share یک روش <strong>امنیتی</strong> نیست؛ فقط «پنهان از لیست» است. امنیت واقعی را Permissionها تأمین می‌کنند.</div></div>
<p>Windows خودش هم چند Share مخفی می‌سازد که به آن‌ها <strong>Administrative Share</strong> می‌گوییم:</p>
<table><thead><tr><th>Share</th><th>کاربرد</th></tr></thead><tbody>
<tr><td><code>C$</code>، <code>D$</code> و ...</td><td>ریشه‌ی هر Volume؛ فقط برای Administratorها</td></tr>
<tr><td><code>ADMIN$</code></td><td>پوشه‌ی Windows (مثلاً <code>C:\\Windows</code>)</td></tr>
<tr><td><code>IPC$</code></td><td>ارتباط بین پردازش‌ها (Named Pipes) برای مدیریت Remote</td></tr>
</tbody></table>

<h2>۱۰. Lab — ساخت Share با GUI</h2>
<p>فرض کن روی <code>LAB-SRV01</code> پوشه‌ی <code>D:\\Shares\\Finance</code> را ساخته‌ایم:</p>
<div class="code-container"><span class="code-label">Lab</span><div class="code-block no-prompt">LAB-SRV01
└── D:
     └── Shares
          └── Finance   ← می‌خواهیم Share شود</div></div>
<h3>مرحله ۱</h3>
<p>Server Manager ← File and Storage Services ← Shares ← <strong>New Share</strong> و انتخاب <strong>SMB Share – Quick</strong>.</p>
<h3>مرحله ۲</h3>
<p>انتخاب مسیر پوشه (<code>D:\\Shares\\Finance</code>) و نام Share (<code>Finance</code>).</p>
<h3>مرحله ۳</h3>
<p>در بخش Permissions گزینه‌ی <strong>Customize permissions</strong> را باز کن و هم Share Permissions و هم NTFS Permissions را بررسی کن.</p>
<h3>مرحله ۴</h3>
<p>ویزارد را تمام کن و از یک Client با <code>\\\\LAB-SRV01\\Finance</code> تست کن.</p>

<h2>۱۱. Lab — همان کار با PowerShell</h2>
<p>مثل جلسه‌ی ۵ و ۶، روی Server Core هم باید این کار را بلد باشی:</p>
<div class="code-container"><span class="code-label">PowerShell</span><div class="code-block no-prompt">PS&gt; New-Item -Path D:\\Shares\\Finance -ItemType Directory
PS&gt; New-SmbShare -Name Finance -Path D:\\Shares\\Finance -ChangeAccess &quot;Authenticated Users&quot; -FullAccess &quot;Administrators&quot;
PS&gt; Get-SmbShare
PS&gt; Get-SmbShareAccess -Name Finance</div></div>
<table><thead><tr><th>دستور</th><th>کاربرد</th></tr></thead><tbody>
<tr><td><code>New-SmbShare</code></td><td>ساخت Share</td></tr>
<tr><td><code>Get-SmbShare</code></td><td>لیست Shareها</td></tr>
<tr><td><code>Get-SmbShareAccess</code></td><td>دیدن Share Permissions</td></tr>
<tr><td><code>Grant-SmbShareAccess</code> / <code>Revoke-SmbShareAccess</code></td><td>اضافه/حذف دسترسی</td></tr>
<tr><td><code>Set-SmbShare</code></td><td>تغییر تنظیمات Share</td></tr>
<tr><td><code>Remove-SmbShare</code></td><td>حذف Share (پوشه و فایل‌ها حذف نمی‌شوند)</td></tr>
</tbody></table>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>با <code>Remove-SmbShare</code> فقط «در ورودی» از بین می‌رود؛ فایل‌ها روی Disk سالم می‌مانند. این تفاوت Share و Folder است.</div></div>
<h3>تست از سمت Client</h3>
<div class="code-container"><span class="code-label">Client</span><div class="code-block no-prompt">PS&gt; Test-NetConnection -ComputerName LAB-SRV01 -Port 445
C:\\&gt; net view \\\\LAB-SRV01
C:\\&gt; net use Z: \\\\LAB-SRV01\\Finance
C:\\&gt; dir Z:\\</div></div>

<h2>۱۲. Troubleshooting</h2>
<p>فرض کن کاربر نمی‌تواند به <code>\\\\LAB-SRV01\\Finance</code> وصل شود. با قانون کلی دوره از پایه‌ترین لایه شروع کن: <strong>اول Connectivity، بعد Name Resolution، بعد Service، بعد Permission.</strong></p>
<div class="code-container"><span class="code-label">ترتیب بررسی</span><div class="code-block no-prompt">Network Connectivity (ping / Test-NetConnection)
          ↓
Name Resolution (DNS)
          ↓
Firewall (File and Printer Sharing / پورت 445)
          ↓
Server Service (LanmanServer) و وجود Share
          ↓
Credentials
          ↓
Share Permissions
          ↓
NTFS Permissions</div></div>
<h3>مشکل ۱: با IP وصل می‌شود ولی با نام نه</h3>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">\\\\192.168.1.10\\Finance  ✓
\\\\LAB-SRV01\\Finance     ✗   →   مشکل Name Resolution / DNS</div></div>
<h3>مشکل ۲: Access Denied با وجود Full Control روی Share</h3>
<p>احتمالاً NTFS Permissions محدودکننده است. یادت باشد: از دو لایه، <strong>محدودکننده‌تر</strong> مؤثر است.</p>
<h3>مشکل ۳: Share دیده نمی‌شود</h3>
<p>با <code>Get-SmbShare</code> مطمئن شو Share وجود دارد؛ بعد بررسی کن نام آن <code>$</code> دارد یا نه (Hidden Share).</p>
<h3>مشکل ۴: Timeout یا «Network path not found»</h3>
<p>Firewall یا پورت 445 را بررسی کن:</p>
<div class="code-container"><span class="code-label">Firewall</span><div class="code-block no-prompt">PS&gt; Enable-NetFirewallRule -DisplayGroup &quot;File and Printer Sharing&quot;
PS&gt; Get-Service LanmanServer</div></div>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>اشتباه خطرناک</strong>برای رفع Access Denied سریع Everyone را روی NTFS و Share با Full Control نگذار. اول بررسی کن کدام لایه مشکل دارد، بعد فقط به گروه موردنیاز دسترسی بده.</div></div>

<h2>۱۳. نکات آزمونی مهم</h2>
<h3>نکته 1</h3><p>File Sharing ویندوز ← <strong>SMB</strong> (پورت TCP 445).</p>
<h3>نکته 2</h3><p>Effective Permission شبکه‌ای = <strong>محدودکننده‌ترین</strong> بین Share و NTFS.</p>
<h3>نکته 3</h3><p>Share Permissions فقط برای دسترسی از <strong>شبکه</strong> است؛ NTFS هم شبکه‌ای و هم محلی.</p>
<h3>نکته 4</h3><p>داخل یک لایه (Share یا NTFS): Allowها جمع می‌شوند، <strong>Deny غالب</strong> است.</p>
<h3>نکته 5</h3><p>Share Permissions سه سطح دارند: <strong>Read / Change / Full Control</strong>.</p>
<h3>نکته 6</h3><p>نام Share با <code>$</code> ← Hidden Share؛ <code>C$</code>، <code>ADMIN$</code> و <code>IPC$</code> ← Administrative Share.</p>
<h3>نکته 7</h3><p>حذف Share با <code>Remove-SmbShare</code> فایل‌ها را حذف نمی‌کند.</p>

<h2>۱۴. Cheat Sheet</h2>
<table><thead><tr><th>مفهوم</th><th>کلید ذهنی</th></tr></thead><tbody>
<tr><td>Share</td><td>در ورودی شبکه‌ای برای یک Folder</td></tr>
<tr><td>SMB</td><td>پروتکل File Sharing ویندوز (TCP 445)</td></tr>
<tr><td>UNC</td><td><code>\\\\Server\\Share</code></td></tr>
<tr><td>Mapped Drive</td><td>اتصال Share به Drive Letter (<code>net use</code>)</td></tr>
<tr><td>Share Permissions</td><td>Read / Change / Full Control؛ فقط دسترسی شبکه‌ای</td></tr>
<tr><td>NTFS Permissions</td><td>دسترسی دقیق‌تر؛ شبکه‌ای و محلی</td></tr>
<tr><td>Effective Permission</td><td>محدودکننده‌ترین بین Share و NTFS</td></tr>
<tr><td>Deny</td><td>معمولاً بر Allow غلبه می‌کند</td></tr>
<tr><td>Hidden Share</td><td>نام با <code>$</code>؛ فقط مخفی، نه امن</td></tr>
<tr><td>Administrative Share</td><td><code>C$</code>، <code>ADMIN$</code>، <code>IPC$</code></td></tr>
<tr><td>New-SmbShare</td><td>ساخت Share با PowerShell</td></tr>
<tr><td>ترتیب عیب‌یابی</td><td>Connectivity ← Name ← Service ← Permission</td></tr>
</tbody></table>

<h2>۱۵. خودآزمایی</h2>
<p>قبل از دیدن پاسخ، خودت جواب بده.</p>

<h3>اگر فقط ۵ نکته یادت بماند</h3>
<p><strong>۱.</strong> Share یک در ورودی شبکه‌ای برای Folder است و از طریق SMB کار می‌کند.</p>
<p><strong>۲.</strong> مسیر دسترسی: <code>\\\\Server\\Share</code>.</p>
<p><strong>۳.</strong> Share Permissions سه سطح دارند: Read، Change و Full Control.</p>
<p><strong>۴.</strong> دسترسی شبکه‌ای مؤثر = محدودکننده‌ترین بین Share و NTFS.</p>
<p><strong>۵.</strong> عیب‌یابی: Connectivity ← Name Resolution ← Service ← Permission.</p></div>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>ارتباط با جلسه بعد</strong>حالا می‌توانیم یک Share بسازیم و Permissionهایش را مدیریت کنیم. در جلسه‌ی بعد سراغ تنظیمات پیشرفته‌ی Share می‌رویم: Access-Based Enumeration، SMB Encryption، محدودیت اتصال هم‌زمان، و بعد مفهوم <strong>Caching</strong> برای دسترسی سریع‌تر یا آفلاین به فایل‌ها (Offline Files و BranchCache).<br><strong>جلسه ۸:</strong> Sharing پیشرفته و Caching</div></div>
`,
"s8": `
<div class="section-header"><div class="section-badge">۸</div><div><h1>Sharing پیشرفته و Caching</h1><div class="meta">فصل ۳ · File Sharing و Caching · جلسه ۲ از ۲</div></div></div>
<p>جلسه‌ی قبل یک Share ساختیم و دیدیم Share Permissions و NTFS Permissions چطور با هم ترکیب می‌شوند. اما یک Share واقعی فقط «Permission» نیست. باید به این سؤال‌ها هم جواب بدهیم:</p>
<blockquote><strong>کاربر فقط چیزهایی را ببیند که به آن‌ها دسترسی دارد؟ ترافیک شبکه محافظت شود؟ و اگر کاربر در شعبه‌ای با اینترنت کند کار می‌کند یا اصلاً به Server وصل نیست، چه کنیم؟</strong></blockquote>
<p>در این جلسه تنظیمات پیشرفته‌ی Share و بعد مفهوم <strong>Caching</strong> را یاد می‌گیریم.</p>

<h2>۱. اهداف جلسه</h2>
<p>در پایان این جلسه باید بتوانی:</p>
<ul>
<li>تنظیمات پیشرفته‌ی Share را بشناسی: محدودیت اتصال، <strong>Access-Based Enumeration</strong> و <strong>SMB Encryption</strong>.</li>
<li>مفهوم <strong>Caching</strong> و دلیل نیاز به آن را توضیح بدهی.</li>
<li>تفاوت چهار حالت Caching روی Share را بدانی.</li>
<li>مفهوم <strong>Offline Files</strong> را بفهمی.</li>
<li>مفهوم <strong>BranchCache</strong> و تفاوت <strong>Distributed Cache</strong> و <strong>Hosted Cache</strong> را توضیح بدهی.</li>
<li>تفاوت Offline Files و BranchCache را در یک سناریو تشخیص بدهی.</li>
<li>مشکل‌های رایج Caching را مرحله‌ای عیب‌یابی کنی.</li>
</ul>

<h2>۲. پیش‌نیاز</h2>
<p>از جلسه‌ی قبل می‌دانیم:</p>
<div class="code-container"><span class="code-label">جلسه ۷</span><div class="code-block no-prompt">Client ── SMB ──▶ Share ──▶ Folder (NTFS)

Effective Permission = محدودکننده‌ترین (Share, NTFS)</div></div>
<p>حالا روی همین Share، دو دسته قابلیت اضافه می‌کنیم:</p>
<div class="code-container"><span class="code-label">مسیر جلسه ۸</span><div class="code-block no-prompt">Share
 ├── تنظیمات پیشرفته
 │     ├── Access-Based Enumeration
 │     ├── SMB Encryption
 │     └── Concurrent User Limit
 └── Caching
       ├── Offline Files   (سمت کلاینت)
       └── BranchCache     (برای شعبه‌ها)</div></div>

<h2>۳. تنظیمات پیشرفته‌ی Share</h2>
<table><thead><tr><th>تنظیم</th><th>کاربرد</th><th>PowerShell</th></tr></thead><tbody>
<tr><td>Access-Based Enumeration</td><td>کاربر فقط آیتم‌هایی را ببیند که به آن‌ها دسترسی دارد</td><td><code>Set-SmbShare -FolderEnumerationMode AccessBased</code></td></tr>
<tr><td>SMB Encryption</td><td>رمزگذاری ترافیک بین Client و Server</td><td><code>Set-SmbShare -EncryptData $true</code></td></tr>
<tr><td>Concurrent User Limit</td><td>محدودکردن تعداد اتصال هم‌زمان به Share</td><td><code>Set-SmbShare -ConcurrentUserLimit 10</code></td></tr>
<tr><td>Caching Mode</td><td>تعیین نحوه‌ی Cache شدن فایل‌های Share روی Clientها</td><td><code>Set-SmbShare -CachingMode ...</code></td></tr>
</tbody></table>
<p>اگر این تنظیمات را در GUI می‌خواهی، مسیر آن Properties پوشه ← Sharing ← Advanced Sharing (و دکمه‌ی Caching) یا Properties خود Share در Server Manager است.</p>

<h2>۴. Access-Based Enumeration (ABE)</h2>
<p>فرض کن یک Share بزرگ داریم که پوشه‌ی هر دپارتمان داخل آن است:</p>
<div class="code-container"><span class="code-label">بدون ABE</span><div class="code-block no-prompt">\\\\LAB-SRV01\\Departments
 ├── Finance      ← کاربر Sales دسترسی ندارد
 ├── HR           ← کاربر Sales دسترسی ندارد
 └── Sales        ← کاربر Sales دسترسی دارد</div></div>
<p>بدون ABE هر کاربر <strong>اسم</strong> همه‌ی پوشه‌ها را می‌بیند، حتی اگر نتواند واردشان شود. با فعال کردن ABE، کاربر فقط پوشه‌هایی را می‌بیند که حداقل Read به آن‌ها دارد:</p>
<div class="code-container"><span class="code-label">با ABE (دید کاربر Sales)</span><div class="code-block no-prompt">\\\\LAB-SRV01\\Departments
 └── Sales</div></div>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته مهم</strong>ABE جلوی <strong>دسترسی</strong> را نمی‌گیرد؛ آن کار Permissionهاست. ABE فقط <strong>نمایش</strong> آیتم‌هایی را که کاربر به آن‌ها دسترسی ندارد پنهان می‌کند. این هم بهتر است از نظر امنیتی (کمتر اطلاعات نشت می‌کند) و هم از نظر تجربه‌ی کاربر.</div></div>

<h2>۵. SMB Encryption</h2>
<p>به‌صورت پیش‌فرض ترافیک SMB رمزگذاری نمی‌شود. اگر Share حاوی داده‌ی حساس است و ترافیک از شبکه‌ی غیرقابل‌اعتماد عبور می‌کند، می‌توان رمزگذاری را روی Share یا کل Server فعال کرد:</p>
<div class="code-container"><span class="code-label">SMB Encryption</span><div class="code-block no-prompt">PS&gt; Set-SmbShare -Name Finance -EncryptData $true
PS&gt; Set-SmbServerConfiguration -EncryptData $true</div></div>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>دقت</strong>SMB Encryption از <strong>SMB 3.x</strong> به بعد وجود دارد. Clientهای قدیمی‌تر که SMB 3 را پشتیبانی نمی‌کنند، به Shareی که رمزگذاری اجباری دارد معمولاً نمی‌توانند وصل شوند. همچنین رمزگذاری کمی بار پردازشی اضافه می‌کند.</div></div>

<h2>۶. Caching چیست و چرا لازم است؟</h2>
<p>فرض کن شرکتی دفتر مرکزی و یک شعبه‌ی کوچک دارد. File Server در دفتر مرکزی است و شعبه با یک لینک WAN کند و گران به آن وصل شده است:</p>
<div class="code-container"><span class="code-label">مشکل شعبه</span><div class="code-block no-prompt">Branch Office                        Head Office
  Client ──── WAN (کند / گران) ────▶ File Server</div></div>
<p>اگر ۲۰ کاربر شعبه هر روز یک فایل ۵۰ مگابایتی را باز کنند، همان فایل ۲۰ بار از WAN رد می‌شود! یا کاربری که با لپ‌تاپ سفر می‌کند اصلاً به Server وصل نیست ولی باید روی فایل‌ها کار کند. راه‌حل در هر دو مورد <strong>Caching</strong> است:</p>
<blockquote><strong>Caching یعنی نگه‌داشتن یک نسخه‌ی محلی از داده در جایی نزدیک‌تر به کاربر تا لازم نباشد هر بار آن را از Server اصلی بگیریم.</strong></blockquote>
<p>Windows Server برای این منظور دو فناوری اصلی دارد:</p>
<div class="code-container"><span class="code-label">دو فناوری</span><div class="code-block no-prompt">Caching
├── Offline Files   → نسخه‌ی محلی روی خود Client
└── BranchCache     → Cache مشترک برای کاربران یک شعبه</div></div>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>اصطلاح</strong>Cache با Backup یکی نیست. Cache برای <strong>سرعت و دسترس‌پذیری</strong> است، نه برای محافظت از داده در برابر حذف یا خرابی.</div></div>

<h2>۷. Offline Files</h2>
<p><strong>Offline Files</strong> به Client اجازه می‌دهد نسخه‌ی محلی از فایل‌های یک Share داشته باشد. وقتی ارتباط با Server قطع یا کند است، کاربر روی همین نسخه‌ی محلی کار می‌کند و بعد از برقراری ارتباط، تغییرات با Server <strong>Sync</strong> می‌شود.</p>
<div class="code-container"><span class="code-label">Offline Files</span><div class="code-block no-prompt">Online:   Client ◀──▶ Share (Server)
                │
                └─ نسخه‌ی محلی (Cache) ساخته می‌شود

Offline:  Client ──▶ نسخه‌ی محلی
Online دوباره:  Sync با Server</div></div>
<ul>
<li>این قابلیت در سمت <strong>Client</strong> فعال می‌شود (Sync Center در Windows Client).</li>
<li>سمت <strong>Server</strong> فقط تعیین می‌کنیم آیا Share اجازه‌ی Cache شدن را بدهد و به چه صورت.</li>
<li>اگر فایل هم روی Client و هم روی Server تغییر کرده باشد، <strong>Sync Conflict</strong> پیش می‌آید و کاربر باید انتخاب کند کدام نسخه (یا هر دو) نگه داشته شود.</li>
</ul>

<h2>۸. حالت‌های Caching روی Share</h2>
<p>در تنظیمات Caching هر Share (<strong>Advanced Sharing ← Caching</strong>) چهار حالت اصلی داریم:</p>
<table><thead><tr><th>حالت</th><th>معنی</th><th>CachingMode در PowerShell</th></tr></thead><tbody>
<tr><td>Only the files and programs that users specify are available offline</td><td>فقط فایل‌هایی که کاربر خودش «Always available offline» کند Cache می‌شوند (حالت پیش‌فرض)</td><td><code>Manual</code></td></tr>
<tr><td>All files and programs that users open from the share are automatically available offline</td><td>هر فایلی که کاربر باز کند خودکار Cache می‌شود</td><td><code>Documents</code></td></tr>
<tr><td>Same + Optimized for performance</td><td>مثل حالت قبل ولی برای برنامه‌ها و فایل‌های اجرایی بهینه شده است</td><td><code>Programs</code></td></tr>
<tr><td>No files or programs from the share are available offline</td><td>Cache روی Client ممنوع است</td><td><code>None</code></td></tr>
</tbody></table>
<div class="code-container"><span class="code-label">PowerShell</span><div class="code-block no-prompt">PS&gt; Set-SmbShare -Name Finance -CachingMode Manual
PS&gt; Set-SmbShare -Name Finance -CachingMode None
PS&gt; Get-SmbShare -Name Finance | Format-List Name, CachingMode</div></div>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>برای آزمون</strong>اگر سناریو گفت «کاربران نباید هیچ نسخه‌ی آفلاینی از فایل‌های Share داشته باشند»، به <strong>None</strong> فکر کن. اگر گفت «کاربر خودش انتخاب کند چه فایل‌هایی آفلاین باشند»، به <strong>Manual</strong>.</div></div>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>دقت امنیتی</strong>Cache شدن فایل‌ها روی لپ‌تاپ Client یعنی داده‌ی Share روی Disk آن دستگاه هم هست. برای داده‌ی حساس، Caching را کلاً غیرفعال کن (<code>None</code>)، یا Disk Client را رمزگذاری کن (در فصل بعد با Encryption آشنا می‌شویم).</div></div>

<h2>۹. BranchCache چیست؟</h2>
<p>Offline Files برای «یک کاربر و یک Client» مناسب است. اما مشکل شعبه این بود که <strong>چند کاربر</strong> یک فایل را از WAN می‌گیرند. <strong>BranchCache</strong> برای همین طراحی شده است:</p>
<blockquote><strong>BranchCache اجازه می‌دهد وقتی اولین کاربر یک شعبه فایل را از Server مرکزی می‌گیرد، نسخه‌ی آن در شعبه Cache شود و کاربران بعدی آن را از داخل شعبه بگیرند، نه از WAN.</strong></blockquote>
<div class="code-container"><span class="code-label">BranchCache</span><div class="code-block no-prompt">Branch Office                              Head Office
┌──────────────────────┐
│ Client 1 ── (بار اول) ──── WAN ─────▶ Content Server
│    │
│ Cache در شعبه
│    │
│ Client 2, 3, ... ◀─ از Cache شعبه
└──────────────────────┘</div></div>
<ul>
<li>برای <strong>کاهش مصرف پهنای‌باند WAN</strong> و افزایش سرعت دسترسی در شعبه‌هاست.</li>
<li>با SMB (Share)، HTTP/HTTPS و BITS کار می‌کند.</li>
<li>امن است: فایل تنها وقتی از Cache تحویل داده می‌شود که Client Permission معتبر روی Server اصلی داشته باشد و محتوای Cache با اطلاعات (Hash) Server یکسان باشد.</li>
</ul>

<h2>۱۰. نقش‌ها در BranchCache</h2>
<div class="code-container"><span class="code-label">اجزا</span><div class="code-block no-prompt">BranchCache
├── Content Server  → File Server دفتر مرکزی (فایل‌ها اینجاست)
├── Client          → کامپیوترهای شعبه
└── Cache           → جایی که نسخه‌ی محلی نگهداری می‌شود</div></div>
<h3>Content Server</h3>
<p>Server دفتر مرکزی که فایل‌ها روی آن است. باید Role Service مربوط به <strong>BranchCache for Network Files</strong> روی آن نصب باشد و روی Share، گزینه‌ی <strong>Enable BranchCache</strong> (<code>CachingMode BranchCache</code>) فعال باشد.</p>
<h3>Hash Publication</h3>
<p>Content Server برای هر فایل یک «Content Information» (شامل Hash) می‌سازد؛ Clientها با همین Hash مطمئن می‌شوند نسخه‌ی Cache با نسخه‌ی اصلی یکی است. این قابلیت معمولاً با Group Policy فعال می‌شود (تنظیم Hash Publication for BranchCache).</p>

<h2>۱۱. دو حالت Distributed و Hosted</h2>
<h3>Distributed Cache</h3>
<p>Clientهای شعبه خودشان Cache را بین هم به اشتراک می‌گذارند (Peer-to-Peer)؛ <strong>Server اختصاصی در شعبه لازم نیست</strong>.</p>
<div class="code-container"><span class="code-label">Distributed</span><div class="code-block no-prompt">Client 1 ◀──▶ Client 2
   ▲              ▲
   └──── Client 3 ┘
 (Cache روی خود Clientها)</div></div>
<h3>Hosted Cache</h3>
<p>یک Server در شعبه به‌عنوان <strong>Hosted Cache Server</strong> Cache مشترک را نگه می‌دارد و Clientها از آن می‌گیرند.</p>
<div class="code-container"><span class="code-label">Hosted</span><div class="code-block no-prompt">Client 1 ─┐
Client 2 ─┼──▶ Hosted Cache Server (در شعبه)
Client 3 ─┘</div></div>
<table><thead><tr><th>ویژگی</th><th>Distributed Cache</th><th>Hosted Cache</th></tr></thead><tbody>
<tr><td>Server در شعبه</td><td>لازم نیست</td><td>لازم است</td></tr>
<tr><td>محل ذخیره‌ی Cache</td><td>روی خود Clientها</td><td>روی Hosted Cache Server</td></tr>
<tr><td>مناسب برای</td><td>شعبه‌ی کوچک بدون Server</td><td>شعبه‌ی بزرگ‌تر یا چند Subnet</td></tr>
<tr><td>در دسترس بودن Cache</td><td>وابسته به روشن بودن Clientها</td><td>بیشتر (Server همیشه روشن)</td></tr>
</tbody></table>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>برای آزمون</strong>«شعبه‌ی کوچک بدون Server» ← <strong>Distributed Cache</strong>. «Server در شعبه داریم و می‌خواهیم Cache مرکزی باشد» ← <strong>Hosted Cache</strong>.</div></div>

<h2>۱۲. Offline Files vs BranchCache</h2>
<table><thead><tr><th>Offline Files</th><th>BranchCache</th></tr></thead><tbody>
<tr><td>مخصوص یک Client</td><td>Cache مشترک برای کاربران یک شعبه</td></tr>
<tr><td>کار با فایل در حالت <strong>قطع</strong> ارتباط</td><td>کاهش ترافیک WAN وقتی <strong>ارتباط برقرار</strong> است</td></tr>
<tr><td>با Sync تغییرات را برمی‌گرداند</td><td>فقط برای خواندن/دریافت سریع‌تر محتوا</td></tr>
<tr><td>نیاز به تنظیم روی Client (و Share)</td><td>نیاز به Content Server، GPO و Clientها</td></tr>
<tr><td>مثال: لپ‌تاپ کاربر در سفر</td><td>مثال: شعبه‌ی ۲۰ نفره با WAN کند</td></tr>
</tbody></table>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>اشتباه رایج</strong>Caching را با Backup یا Shadow Copies اشتباه نگیر. <strong>Shadow Copies (Previous Versions)</strong> قابلیت دیگری است که نسخه‌های قبلی فایل را برای برگرداندن حذف یا تغییر اشتباه نگه می‌دارد؛ هدفش Caching نیست. (به یاد بیاور: RAID هم Backup نبود.)</div></div>

<h2>۱۳. Lab — Caching و تنظیمات پیشرفته</h2>
<div class="code-container"><span class="code-label">Lab</span><div class="code-block no-prompt">LAB-SRV01  (Server)    → Share: Finance
LAB-CL01   (Client)    → Windows Client</div></div>
<h3>مرحله ۱ — Access-Based Enumeration</h3>
<div class="code-container"><span class="code-label">PowerShell</span><div class="code-block no-prompt">PS&gt; Set-SmbShare -Name Finance -FolderEnumerationMode AccessBased
PS&gt; Get-SmbShare -Name Finance | Format-List Name, FolderEnumerationMode</div></div>
<h3>مرحله ۲ — Caching Mode</h3>
<div class="code-container"><span class="code-label">PowerShell</span><div class="code-block no-prompt">PS&gt; Set-SmbShare -Name Finance -CachingMode Manual</div></div>
<h3>مرحله ۳ — رمزگذاری و محدودیت اتصال</h3>
<div class="code-container"><span class="code-label">PowerShell</span><div class="code-block no-prompt">PS&gt; Set-SmbShare -Name Finance -EncryptData $true
PS&gt; Set-SmbShare -Name Finance -ConcurrentUserLimit 10</div></div>
<h3>مرحله ۴ — مشاهده‌ی اتصال‌های فعال</h3>
<div class="code-container"><span class="code-label">مانیتورینگ</span><div class="code-block no-prompt">PS&gt; Get-SmbSession
PS&gt; Get-SmbOpenFile
PS&gt; Get-SmbServerConfiguration | Select EnableSMB1Protocol, EncryptData</div></div>
<h3>مرحله ۵ — Offline Files روی Client</h3>
<p>روی <code>LAB-CL01</code> به Share وصل شو، یک فایل را <strong>Always available offline</strong> کن، بعد کابل شبکه (یا Adapter VM) را قطع کن و ببین فایل هنوز باز می‌شود. بعد ارتباط را وصل کن و Sync را در Sync Center ببین.</p>
<h3>BranchCache (در سطح آشنایی)</h3>
<div class="code-container"><span class="code-label">BranchCache</span><div class="code-block no-prompt">PS&gt; Install-WindowsFeature FS-BranchCache
PS&gt; Set-SmbShare -Name Finance -CachingMode BranchCache
PS&gt; Enable-BCDistributed          # روی Client (Distributed Cache)
PS&gt; Get-BCStatus</div></div>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>نکته</strong>برای Hosted Cache روی Server شعبه از <code>Enable-BCHostedServer</code> و روی Clientها از <code>Enable-BCHostedClient</code> استفاده می‌شود. راه‌اندازی کامل BranchCache به GPO و چند Subnet نیاز دارد؛ در این دوره بیشتر مفهوم و تفاوت حالت‌ها مهم است. دستورهای دقیق را در مستندات نسخه‌ی Windows Server خودت چک کن.</div></div>

<h2>۱۴. Troubleshooting</h2>
<h3>Offline Files کار نمی‌کند</h3>
<div class="code-container"><span class="code-label">ترتیب بررسی</span><div class="code-block no-prompt">Share CachingMode = None ؟
        ↓
Offline Files روی Client فعال است؟
        ↓
فایل Always available offline شده؟
        ↓
Sync Center / Sync Conflict</div></div>
<p>اگر <code>CachingMode</code> برابر <code>None</code> باشد، Client اصلاً اجازه‌ی Cache کردن ندارد.</p>
<h3>Sync Conflict</h3>
<p>وقتی نسخه‌ی Client و Server هر دو تغییر کرده‌اند، Windows از کاربر می‌خواهد انتخاب کند: نسخه‌ی محلی، نسخه‌ی Server، یا نگه‌داشتن هر دو. بدون بررسی «Keep Local» را نزن؛ ممکن است تغییرات دیگران از بین برود.</p>
<h3>BranchCache در شعبه اثر ندارد</h3>
<div class="code-container"><span class="code-label">ترتیب بررسی</span><div class="code-block no-prompt">Content Server: نقش BranchCache for Network Files نصب است؟
        ↓
Share روی حالت BranchCache است؟
        ↓
Hash Publication فعال است؟ (GPO)
        ↓
Client: BranchCache فعال و حالت درست؟
        ↓
Firewall بین Clientها / Hosted Server
        ↓
Get-BCStatus</div></div>
<h3>Clientهای قدیمی به Share رمزگذاری‌شده وصل نمی‌شوند</h3>
<p>EncryptData نیاز به SMB 3.x دارد. نسخه‌ی SMB Client را بررسی کن و در صورت امکان Client را ارتقا بده.</p>
<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>اشتباه خطرناک</strong>برای رفع مشکل Client قدیمی، SMB 1.0 را روی Server فعال نکن. این کار کل Server را در معرض ضعف‌های شناخته‌شده می‌گذارد. بهتر است Client ارتقا یابد.</div></div>

<h2>۱۵. نکات آزمونی مهم</h2>
<h3>نکته 1</h3><p><strong>ABE</strong> ← کاربر فقط آیتم‌هایی را می‌بیند که به آن‌ها دسترسی دارد؛ جلوی دسترسی را Permission می‌گیرد، نه ABE.</p>
<h3>نکته 2</h3><p><strong>SMB Encryption</strong> ← رمزگذاری ترافیک؛ نیاز به SMB 3.x.</p>
<h3>نکته 3</h3><p><strong>Offline Files</strong> ← نسخه‌ی محلی روی Client برای کار در حالت قطع/کند، با Sync.</p>
<h3>نکته 4</h3><p>حالت‌های Caching: <strong>Manual / Documents / Programs / None</strong>؛ برای جلوگیری کامل از Cache، <strong>None</strong>.</p>
<h3>نکته 5</h3><p><strong>BranchCache</strong> ← کاهش ترافیک WAN شعبه‌ها با Cache مشترک.</p>
<h3>نکته 6</h3><p><strong>Distributed</strong> ← Cache روی Clientها، بدون Server در شعبه. <strong>Hosted</strong> ← Cache روی Server شعبه.</p>
<h3>نکته 7</h3><p>Caching ≠ Backup؛ Shadow Copies هم یک قابلیت جدا است.</p>

<h2>۱۶. Cheat Sheet</h2>
<table><thead><tr><th>مفهوم</th><th>کلید ذهنی</th></tr></thead><tbody>
<tr><td>ABE</td><td>پنهان‌کردن آیتم‌های غیرقابل‌دسترس (نه جلوگیری از دسترسی)</td></tr>

<tr><td>Concurrent User Limit</td><td>حداکثر اتصال هم‌زمان به Share</td></tr>
<tr><td>Caching</td><td>نسخه‌ی محلی برای سرعت/دسترس‌پذیری</td></tr>
<tr><td>Offline Files</td><td>Cache روی Client با Sync</td></tr>
<tr><td>Manual</td><td>کاربر مشخص می‌کند چه فایل‌هایی آفلاین شوند</td></tr>
<tr><td>Documents</td><td>فایل‌های بازشده خودکار Cache می‌شوند</td></tr>
<tr><td>None</td><td>Cache ممنوع</td></tr>
<tr><td>BranchCache</td><td>Cache مشترک شعبه برای کاهش ترافیک WAN</td></tr>

</tbody></table>

 ┌────┼─────┐            ┌──────┴──────┐

<h3>اگر فقط ۵ نکته یادت بماند</h3>
<p><strong>۱.</strong> ABE فقط نمایش را کنترل می‌کند؛ دسترسی را Permission تعیین می‌کند.</p>
<p><strong>۲.</strong> SMB Encryption رمزگذاری ترافیک است و به SMB 3.x نیاز دارد.</p>
<p><strong>۳.</strong> Offline Files = نسخه‌ی محلی روی Client با Sync؛ BranchCache = Cache مشترک شعبه برای کاهش ترافیک WAN.</p>
<p><strong>۴.</strong> Distributed = Cache روی Clientها؛ Hosted = Cache روی Server شعبه.</p>
<p><strong>۵.</strong> Caching نه Backup است و نه Shadow Copies.</p></div>

<p>در جلسات قبل با اشتراک‌گذاری فایل و پوشه آشنا شدیم. حالا می‌خواهیم یک موضوع مهم‌تر را یاد بگیریم: چگونه تعیین کنیم هر کاربر به چه فایل‌هایی دسترسی داشته باشد و چه کارهایی بتواند انجام دهد؟</p>

<blockquote><strong>هدف این جلسه: یاد بگیریم دسترسی کاربران به فایل‌ها و پوشه‌ها را با NTFS Permissions کنترل کنیم.</strong></blockquote>

<h2>۱. هدف جلسه</h2>
<p>در پایان این جلسه باید بتوانی:</p>
<ul>
    <li>مفهوم NTFS Permissions را به زبان ساده توضیح بدهی.</li>
    <li>مجوزهای Read، Write، Modify و Full Control را تشخیص بدهی.</li>
    <li>برای کاربران و گروه‌ها مجوز مناسب انتخاب کنی.</li>
    <li>تفاوت Allow و Deny را درک کنی.</li>
    <li>مفهوم Inheritance یا وراثت مجوزها را بفهمی.</li>
    <li>تفاوت NTFS Permission و Share Permission را توضیح بدهی.</li>
    <li>سناریوهای متداول دسترسی در شبکه را تحلیل کنی.</li>
</ul>

<h2>۲. پیش‌نیاز جلسه</h2>
<p>برای شروع، کافی است مفهوم سادهٔ اشتراک‌گذاری پوشه را به یاد داشته باشی.</p>

<div class="code-container">
    <span class="code-label">مرور جلسه‌های قبل</span>
    <div class="code-block no-prompt">Server
   |
   └── Shared Folder
           |
           ├── File1.docx
           ├── File2.xlsx
           └── File3.pdf</div>
</div>

<p>در این مثال، پوشه‌ای روی سرور قرار دارد و کاربران شبکه می‌توانند از طریق مسیر اشتراکی به آن مراجعه کنند.</p>

<p>اما اشتراک‌گذاری به‌تنهایی پاسخ همهٔ سؤال‌ها را نمی‌دهد:</p>
<ul>
    <li>آیا همهٔ کاربران باید بتوانند فایل‌ها را تغییر دهند؟</li>
    <li>آیا کارمند باید بتواند فایل مدیر را حذف کند؟</li>
    <li>آیا کاربر بخش فروش باید به اسناد حسابداری دسترسی داشته باشد؟</li>
</ul>

<p>برای پاسخ به این سؤال‌ها، به مجوزهای دسترسی نیاز داریم.</p>

<h2>۳. NTFS Permission چیست؟</h2>

<p><strong>NTFS Permission</strong> مجموعه‌ای از مجوزهاست که مشخص می‌کند یک کاربر یا گروه چه عملیاتی را روی فایل‌ها و پوشه‌های دارای فایل‌سیستم NTFS انجام دهد.</p>

<p>مثلاً فرض کن پوشه‌ای به نام <code>Accounting</code> داریم. می‌خواهیم:</p>

<div class="code-container">
    <span class="code-label">مدل ذهنی</span>
    <div class="code-block no-prompt">Accounting
    |
    ├── Accounting Group → Modify
    |
    ├── Managers → Read
    |
    └── Other Users → No Access</div>
</div>

<p>در این مثال، گروه حسابداری می‌تواند فایل‌ها را تغییر دهد، مدیران می‌توانند آن‌ها را بخوانند و سایر کاربران دسترسی مجاز ندارند.</p>

<div class="box important">
    <i class="fas fa-info-circle"></i>
    <div>
        <strong>نکته مهم</strong>
        NTFS Permission برای کنترل دسترسی به فایل‌ها و پوشه‌هاست؛ اما Share Permission دسترسی از مسیر اشتراکی شبکه را کنترل می‌کند. این دو مفهوم را با هم اشتباه نگیر.
    </div>
</div>

<h2>۴. مجوزهای اصلی NTFS</h2>

<p>برای یادگیری این بخش، ابتدا مجوزها را از ساده‌ترین سطح به سطح گسترده‌تر بررسی می‌کنیم.</p>

<h3>۴.۱. Read — خواندن</h3>
<p>مجوز <code>Read</code> برای زمانی است که کاربر باید بتواند محتوای مجاز را مشاهده و بخواند، اما نیازی به ویرایش ندارد.</p>

<p>مثال: کارمند باید گزارش ماهانه را مشاهده کند، ولی نباید آن را تغییر دهد.</p>

<h3>۴.۲. Write — نوشتن</h3>
<p>مجوز <code>Write</code> امکان نوشتن یا ایجاد محتوا را در محدودهٔ مجوز فراهم می‌کند. این مجوز به‌تنهایی به معنای داشتن تمام امکانات Modify نیست.</p>

<p>مثال: کاربر باید بتواند اطلاعاتی را در فایل یا پوشهٔ مجاز وارد کند.</p>

<h3>۴.۳. Read &amp; Execute — خواندن و اجرا</h3>
<p>این مجوز امکان خواندن فایل‌ها و اجرای فایل‌های قابل اجرا را در محدودهٔ مجاز فراهم می‌کند. همچنین برای پیمایش پوشه‌ها و دسترسی به محتویات مجاز کاربرد دارد.</p>

<h3>۴.۴. Modify — تغییر</h3>
<p><code>Modify</code> مجوزی گسترده‌تر است. کاربر معمولاً می‌تواند فایل‌ها را بخواند، ایجاد یا ویرایش کند، تغییر نام دهد و حذف کند؛ اما صرف داشتن Modify به معنای امکان مدیریت مجوزهای NTFS نیست.</p>

<h3>۴.۵. Full Control — کنترل کامل</h3>
<p><code>Full Control</code> سطح گسترده‌ای از دسترسی را فراهم می‌کند؛ از جمله عملیات معمول روی فایل‌ها و پوشه‌ها و امکان مدیریت مجوزها و مالکیت در محدودهٔ مجاز.</p>

<table>
    <thead>
        <tr>
            <th>مجوز</th>
            <th>مفهوم ساده</th>
            <th>مثال</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td><code>Read</code></td>
            <td>خواندن و مشاهده</td>
            <td>مشاهدهٔ گزارش</td>
        </tr>
        <tr>
            <td><code>Write</code></td>
            <td>نوشتن یا ایجاد محتوا</td>
            <td>واردکردن اطلاعات</td>
        </tr>
        <tr>
            <td><code>Read &amp; Execute</code></td>
            <td>خواندن و اجرای فایل‌های مجاز</td>
            <td>اجرای یک برنامه</td>
        </tr>
        <tr>
            <td><code>Modify</code></td>
            <td>خواندن، تغییر و حذف</td>
            <td>مدیریت فایل‌های کاری</td>
        </tr>
        <tr>
            <td><code>Full Control</code></td>
            <td>کنترل کامل، از جمله مدیریت مجوزها</td>
            <td>مدیریت دسترسی پوشه</td>
        </tr>
    </tbody>
</table>

<div class="box note">
    <i class="fas fa-lightbulb"></i>
    <div>
        <strong>نکته آزمونی</strong>
        اگر کاربر فقط باید گزارش را بخواند، Read معمولاً کافی است. اگر باید فایل را ویرایش و حذف کند، Modify گزینهٔ مناسب‌تری است. برای مدیریت مجوزها، Full Control را در نظر بگیر.
    </div>
</div>

<h2>۵. مجوزها را به کاربر بدهیم یا گروه؟</h2>

<p>ویندوز اجازه می‌دهد مجوزها را به کاربر یا گروه اختصاص دهیم. در محیط سازمانی، استفاده از گروه‌ها معمولاً مدیریت دسترسی‌ها را ساده‌تر می‌کند.</p>

<p>فرض کن ۲۰ کارمند در بخش حسابداری داریم. به‌جای تنظیم جداگانهٔ مجوز برای هر نفر، می‌توانیم آن‌ها را عضو یک گروه کنیم.</p>

<div class="code-container">
    <span class="code-label">مثال</span>
    <div class="code-block no-prompt">Group: Accounting
    |
    ├── Ali
    ├── Sara
    ├── Reza
    └── Mina

Folder: Accounting
    |
    └── Accounting → Modify</div>
</div>

<p>در این حالت، مجوز Modify به گروه Accounting اختصاص داده می‌شود. کاربران عضو گروه می‌توانند از این مجوز بهره‌مند شوند، البته به شرط آنکه مجوزهای مؤثر دیگر مانع دسترسی آن‌ها نشوند.</p>

<div class="box important">
    <i class="fas fa-info-circle"></i>
    <div>
        <strong>روش بهتر در سازمان</strong>
        برای گروهی از کاربران با وظایف مشابه، مجوز را به گروه مناسب بده؛ این روش معمولاً از مدیریت تعداد زیادی مجوز مستقل ساده‌تر است.
    </div>
</div>

<h2>۶. تفاوت Allow و Deny</h2>

<p>هنگام تنظیم مجوزهای NTFS، با دو مفهوم مهم روبه‌رو می‌شوی:</p>

<ul>
    <li><strong>Allow:</strong> اجازهٔ انجام یک عملیات را می‌دهد.</li>
    <li><strong>Deny:</strong> یک عملیات مشخص را صریحاً ممنوع می‌کند.</li>
</ul>

<p>برای مثال، اگر برای گروه Accounting مجوز Read را Allow کنیم، این گروه از این ورودی مجوز برای خواندن برخوردار می‌شود.</p>

<p>اما اگر برای یکی از اعضای این گروه، مجوز Read به‌صورت صریح Deny شود، نتیجهٔ نهایی ممکن است دسترسی او را محدود کند.</p>

<div class="code-container">
    <span class="code-label">مثال مفهومی</span>
    <div class="code-block no-prompt">Ali عضو Accounting است
        |
        └── Allow: Read

برای Ali یک ورودی دیگر وجود دارد
        |
        └── Deny: Read

نتیجه:
باید مجوزهای مؤثر را بررسی کنیم.</div>
</div>

<div class="box warning">
    <i class="fas fa-exclamation-triangle"></i>
    <div>
        <strong>هشدار</strong>
        Deny را بدون دلیل اضافه نکن. ورودی‌های Deny صریح معمولاً بر Allowهای مرتبط غلبه می‌کنند. پیش از تغییر، مجوزهای کاربر، گروه‌ها و وراثت را بررسی کن.
    </div>
</div>

<h2>۷. Inheritance — وراثت مجوزها</h2>

<p>تصور کن پوشهٔ اصلی شرکت ۳۰ زیرپوشه دارد. اگر لازم باشد مجوزهای تمام زیرپوشه‌ها را جداگانه تنظیم کنیم، کار بسیار زمان‌بر خواهد بود.</p>

<p>ویندوز قابلیتی به نام <strong>Inheritance</strong> دارد که اجازه می‌دهد مجوزهای قابل‌وراثت از پوشهٔ والد به فایل‌ها و زیرپوشه‌های آن منتقل شوند.</p>

<div class="code-container">
    <span class="code-label">مثال وراثت</span>
    <div class="code-block no-prompt">D:\\Company
    |
    ├── Reports
    |     └── مجوزهای به‌ارث‌رسیده
    |
    ├── Documents
    |     └── مجوزهای به‌ارث‌رسیده
    |
    └── Archive
          └── مجوزهای به‌ارث‌رسیده</div>
</div>

<p>فرض کن روی پوشهٔ Company، مجوز Modify برای گروه Accounting تعریف شده و این مجوز قابلیت وراثت دارد. در این صورت، فایل‌ها و زیرپوشه‌های مرتبط ممکن است این مجوز را به ارث ببرند.</p>

<h3>۷.۱. آیا همهٔ زیرپوشه‌ها همیشه مجوز یکسان دارند؟</h3>

<p>خیر. ممکن است برای یک زیرپوشه، مجوز مستقلی تعریف شده باشد یا وراثت آن تغییر کرده باشد. بنابراین، نباید بدون بررسی فرض کنیم تمام فایل‌ها دقیقاً مجوز یکسانی دارند.</p>

<p>مثلاً پوشهٔ Confidential را در نظر بگیر که فقط مدیران باید به آن دسترسی داشته باشند. در این حالت، باید وراثت و مجوزهای خود پوشه را با دقت بررسی و دسترسی مناسب را تنظیم کنیم.</p>

<div class="box warning">
    <i class="fas fa-exclamation-triangle"></i>
    <div>
        <strong>توجه</strong>
        غیرفعال‌کردن وراثت ممکن است باعث تبدیل مجوزهای به‌ارث‌رسیده به مجوزهای مستقل یا حذف آن‌ها شود. قبل از انتخاب هر گزینه، اثر آن بر دسترسی کاربران را بررسی کن.
    </div>
</div>

<h2>۸. مشاهده و تغییر مجوزهای NTFS</h2>

<p>برای بررسی مجوزهای یک پوشه در Windows Server، مراحل زیر را انجام بده:</p>

<ol>
    <li>روی پوشهٔ موردنظر راست‌کلیک کن.</li>
    <li>گزینهٔ <code>Properties</code> را انتخاب کن.</li>
    <li>وارد زبانهٔ <code>Security</code> شو.</li>
    <li>کاربر یا گروه موردنظر را انتخاب کن.</li>
    <li>مجوزهای نمایش‌داده‌شده را بررسی کن.</li>
    <li>در صورت نیاز و داشتن دسترسی مدیریتی، از <code>Edit</code> برای تغییر مجوزها استفاده کن.</li>
</ol>

<div class="code-container">
    <span class="code-label">مسیر تنظیمات</span>
    <div class="code-block no-prompt">Right-click Folder
        ↓
Properties
        ↓
Security
        ↓
Select User / Group
        ↓
Review Permissions
        ↓
Edit (if required)</div>
</div>

<p>اگر به تنظیمات دقیق‌تر نیاز داشته باشی، دکمهٔ <code>Advanced</code> امکانات بیشتری مانند مشاهدهٔ ورودی‌های مجوز، بررسی وراثت و مدیریت مالکیت را در اختیار می‌گذارد.</p>

<div class="box note">
    <i class="fas fa-lightbulb"></i>
    <div>
        <strong>نکته عملی</strong>
        پیش از تغییر مجوزها، ابتدا وضعیت فعلی را بررسی کن. تغییر نادرست مجوزها ممکن است دسترسی کاربران یا سرویس‌های موردنیاز را مختل کند.
    </div>
</div>

<h2>۹. NTFS Permission در برابر Share Permission</h2>

<p>این بخش ادامهٔ مستقیم مباحث File Sharing جلسه‌های قبل است.</p>

<p>برای یک پوشهٔ اشتراکی، ممکن است هم NTFS Permission و هم Share Permission تنظیم شده باشند؛ اما هرکدام وظیفهٔ متفاوتی دارند.</p>

<ul>
    <li><strong>NTFS Permission:</strong> دسترسی به فایل‌ها و پوشه‌ها را در فایل‌سیستم NTFS کنترل می‌کند.</li>
    <li><strong>Share Permission:</strong> دسترسی به پوشه از طریق مسیر اشتراکی شبکه را کنترل می‌کند.</li>
</ul>

<h3>۹.۱. دسترسی نهایی از شبکه چگونه تعیین می‌شود؟</h3>

<p>هنگامی که کاربر از طریق شبکه به یک فایل در پوشهٔ اشتراکی دسترسی پیدا می‌کند، باید هر دو مجموعهٔ مجوز را در نظر بگیریم. در حالت معمول، دسترسی نهایی به محدودکننده‌ترین مجوز مؤثر بین Share و NTFS وابسته است.</p>

<div class="code-container">
    <span class="code-label">مثال اول</span>
    <div class="code-block no-prompt">Share Permission: Read
NTFS Permission: Modify

Access over Network: Read</div>
</div>

<p>در این مثال، Share اجازهٔ تغییر فایل را نمی‌دهد؛ پس داشتن Modify در NTFS به‌تنهایی برای ویرایش از طریق شبکه کافی نیست.</p>

<div class="code-container">
    <span class="code-label">مثال دوم</span>
    <div class="code-block no-prompt">Share Permission: Full Control
NTFS Permission: Read

Access over Network: Read</div>
</div>

<p>در مثال دوم، Share Permission گسترده است، اما NTFS فقط خواندن را مجاز می‌داند. بنابراین کاربر از طریق شبکه نمی‌تواند صرفاً با تکیه بر Full Control در Share، فایل را تغییر دهد.</p>

<div class="box important">
    <i class="fas fa-info-circle"></i>
    <div>
        <strong>نکته مهم آزمونی</strong>
        هنگام بررسی دسترسی شبکه، هر دو مجوز را بررسی کن. مجوز گسترده‌تر در یکی، محدودیت مجموعهٔ دیگر را خودبه‌خود برطرف نمی‌کند.
    </div>
</div>

<h2>۱۰. سناریوی عملی: پوشهٔ حسابداری</h2>

<p>نیاز شرکت این است که کارمندان حسابداری بتوانند فایل‌ها را ویرایش کنند، مدیران آن‌ها را بخوانند و سایر کاربران دسترسی نداشته باشند.</p>

<h2>۱۱. اشتباهات رایج</h2>

<ul>
    <li>دادن Full Control به همهٔ کاربران، فقط برای راحت‌ترشدن مدیریت.</li>
    <li>فراموش‌کردن مجوزهای به‌ارث‌رسیده از پوشهٔ والد.</li>
    <li>تصور اینکه Share Permission جای NTFS Permission را می‌گیرد.</li>
    <li>افزودن Deny بدون بررسی عضویت کاربر در گروه‌ها.</li>
    <li>فرض‌کردن اینکه تمام فایل‌های یک پوشه حتماً مجوزهای یکسان دارند.</li>
    <li>تغییر مجوزها بدون بررسی نیاز واقعی کاربران و سرویس‌ها.</li>
</ul>

<h2>۱۲. نکات آزمونی</h2>

<h3>Read در برابر Modify</h3>
<p><strong>Read</strong> برای خواندن است؛ <strong>Modify</strong> علاوه بر خواندن، امکان تغییر و حذف را در محدودهٔ مجوز فراهم می‌کند.</p>

<h3>Modify در برابر Full Control</h3>
<p><strong>Full Control</strong> امکان مدیریت مجوزها را نیز فراهم می‌کند؛ Modify به‌تنهایی معادل Full Control نیست.</p>

<h3>Inheritance</h3>
<p>مجوزهای قابل‌وراثت می‌توانند از پوشهٔ والد به فایل‌ها و زیرپوشه‌ها منتقل شوند.</p>

<h3>Share در برابر NTFS</h3>
<p>در دسترسی شبکه، هر دو مجموعهٔ مجوز را بررسی کن. نتیجه به مجوزهای مؤثر و محدودیت‌های هر دو وابسته است.</p>

<h3>Allow و Deny</h3>
<p>Deny صریح می‌تواند بر Allow مرتبط غلبه کند؛ پس در استفاده از آن دقت کن.</p>

<h2>۲. Compression چیست؟</h2>

<p><strong>Compression</strong> یعنی فشرده‌سازی داده‌ها برای کاهش فضای موردنیاز جهت ذخیره‌سازی آن‌ها.</p>

<p>فرض کن یک پوشه شامل فایل‌هایی است که مجموعاً ۱۰۰ مگابایت فضا اشغال می‌کنند. اگر فایل‌ها قابلیت فشرده‌سازی داشته باشند، ممکن است پس از فشرده‌سازی فضای کمتری مصرف کنند.</p>

<div class="code-container">
  <span class="code-label">Compression</span>
  <div class="code-block no-prompt">Before:
File Data ──▶ 100 MB

After Compression:
Compressed Data ──▶ Less Storage Space</div>
</div>

<p>مقدار کاهش حجم به نوع فایل و محتوای آن بستگی دارد. برای مثال، فایل‌های متنی معمولاً بهتر از بسیاری از فایل‌های تصویری یا ویدئوییِ از قبل فشرده‌شده، قابلیت فشرده‌سازی دارند.</p>

<h3>مزایای Compression</h3>
<ul>
  <li>کاهش فضای مصرفی دیسک، در صورت فشرده‌شدن مؤثر فایل‌ها.</li>
  <li>امکان ذخیره‌ی داده‌های بیشتر در فضای موجود.</li>
  <li>کاهش حجم برخی داده‌ها بدون حذف محتوای اصلی.</li>
</ul>

<h3>محدودیت‌ها</h3>
<ul>
  <li>فشرده‌سازی و بازکردن داده‌ها ممکن است از CPU استفاده کند.</li>
  <li>همه‌ی فایل‌ها به یک اندازه فشرده نمی‌شوند.</li>
  <li>فشرده‌سازی به معنی رمزگذاری یا محافظت از اطلاعات نیست.</li>
</ul>

<div class="box important">
  <i class="fas fa-star"></i>
  <div>
    <strong>نکته‌ی کلیدی</strong>
    Compression برای کاهش فضای ذخیره‌سازی است، نه برای جلوگیری از خواندن فایل توسط افراد غیرمجاز.
  </div>
</div>

<h2>۳. NTFS Compression</h2>

<p>در Windows، فایل‌سیستم NTFS از قابلیت فشرده‌سازی فایل‌ها و پوشه‌ها پشتیبانی می‌کند. با فعال‌کردن این قابلیت، داده‌ها می‌توانند روی دیسک با فضای کمتری ذخیره شوند.</p>

<p>این قابلیت با فشرده‌سازی یک فایل به ZIP متفاوت است؛ لازم نیست هر بار برای استفاده از فایل، ابتدا آن را به‌صورت دستی از یک آرشیو استخراج کنی.</p>

<h3>فعال‌کردن از طریق رابط گرافیکی</h3>
<ol>
  <li>روی فایل یا پوشه‌ی موردنظر راست‌کلیک کن.</li>
  <li>وارد <strong>Properties</strong> شو.</li>
  <li>در تب <strong>General</strong>، گزینه‌ی <strong>Advanced</strong> را باز کن.</li>
  <li>در صورت پشتیبانی فایل‌سیستم و شرایط مناسب، گزینه‌ی <strong>Compress contents to save disk space</strong> را فعال کن.</li>
  <li>تغییرات را تأیید کن و در صورت درخواست، محدوده‌ی اعمال تغییرات را انتخاب کن.</li>
</ol>

<div class="box note">
  <i class="fas fa-lightbulb"></i>
  <div>
    <strong>توجه</strong>
    درایو، فایل‌سیستم و نوع فایل می‌توانند روی در دسترس بودن یا مفید بودن Compression تأثیر بگذارند. در محیط عملی، نتیجه را بررسی کن و فرض نکن همه‌ی فایل‌ها حتماً کوچک‌تر می‌شوند.
  </div>
</div>

<h3>نمونه دستور Compact</h3>

<p>ابزار خط فرمان <code>compact</code> برای مشاهده و مدیریت فشرده‌سازی NTFS کاربرد دارد.</p>

<div class="code-container">
  <span class="code-label">Command Prompt</span>
  <div class="code-block no-prompt">compact /?</div>
</div>

<p>این دستور راهنمای گزینه‌های ابزار را نمایش می‌دهد.</p>

<p>برای بررسی وضعیت فشرده‌سازی فایل‌های یک پوشه می‌توان از این دستور استفاده کرد:</p>

<div class="code-container">
  <span class="code-label">Command Prompt</span>
  <div class="code-block no-prompt">compact C:\\Data</div>
</div>

<p>برای فعال‌کردن Compression روی فایل‌های موجود در یک پوشه، می‌توان از دستور زیر استفاده کرد:</p>

<div class="code-container">
  <span class="code-label">Command Prompt</span>
  <div class="code-block no-prompt">compact /c /s:C:\\Data</div>
</div>

<p>این دستور را فقط روی مسیر آزمایشی یا مسیری که مجاز به تغییر آن هستی اجرا کن. گزینه‌ها و اثر آن‌ها را با راهنمای <code>compact /?</code> بررسی کن.</p>

<h2>۴. Encryption چیست؟</h2>

<p><strong>Encryption</strong> یعنی رمزگذاری داده‌ها؛ به‌طوری‌که محتوای آن‌ها بدون روش یا کلید مناسب قابل خواندن نباشد.</p>

<p>هدف Encryption کاهش فضای ذخیره‌سازی نیست، بلکه محافظت از محرمانگی داده‌هاست.</p>

<div class="code-container">
  <span class="code-label">Encryption</span>
  <div class="code-block no-prompt">Readable Data
      |
      v
Encryption + Key
      |
      v
Encrypted Data
      |
      v
Decryption with Authorized Key
      |
      v
Readable Data</div>
</div>

<p>رمزگذاری به‌تنهایی جایگزین همه‌ی کنترل‌های امنیتی نیست. برای محافظت از داده‌ها همچنان باید مجوزها، حساب‌های کاربری، کلیدها و نسخه‌های پشتیبان را درست مدیریت کرد.</p>

<h2>۵. EFS چیست؟</h2>

<p><strong>EFS</strong> مخفف <em>Encrypting File System</em> است. این قابلیت در نسخه‌ها و ویرایش‌های پشتیبانی‌شده‌ی Windows، برای رمزگذاری فایل‌ها و پوشه‌ها روی NTFS به کار می‌رود.</p>

<p>تصور کن فایل‌های محرمانه‌ی یک کارمند روی سیستم ذخیره شده‌اند. با EFS می‌توان محتوای فایل را رمزگذاری کرد تا دسترسی به داده‌ها به کلیدها و گواهی‌های مجاز وابسته باشد.</p>

<h3>مدل ساده‌ی EFS</h3>

<div class="code-container">
  <span class="code-label">EFS</span>
  <div class="code-block no-prompt">File on NTFS
     |
     v
EFS Encryption
     |
     v
Encrypted File

Authorized User + Required Key
     |
     v
Access to Readable Content</div>
</div>

<h3>نکات مهم EFS</h3>
<ul>
  <li>EFS برای رمزگذاری فایل‌ها و پوشه‌ها در NTFS طراحی شده است.</li>
  <li>دسترسی به فایل رمزگذاری‌شده به مجوزهای لازم و کلید یا گواهی مناسب وابسته است.</li>
  <li>گم‌کردن کلید خصوصی یا نداشتن روش بازیابی مناسب می‌تواند دسترسی به اطلاعات را به خطر بیندازد.</li>
  <li>باید از گواهی و کلید خصوصی موردنیاز، طبق سیاست امنیتی سازمان، نسخه‌ی پشتیبان امن تهیه شود.</li>
  <li>رمزگذاری فایل، نیاز به NTFS Permissions و کنترل دسترسی را از بین نمی‌برد.</li>
</ul>

<div class="box warning">
  <i class="fas fa-exclamation-triangle"></i>
  <div>
    <strong>هشدار مهم</strong>
    پیش از استفاده از EFS روی اطلاعات واقعی، فرایند پشتیبان‌گیری و بازیابی گواهی و کلید را آزمایش کن. صرفاً رمزگذاری فایل بدون برنامه‌ی بازیابی مناسب، ممکن است باعث از دست رفتن دسترسی به داده‌ها شود.
  </div>
</div>

<h2>۶. فعال‌کردن EFS از طریق رابط گرافیکی</h2>

<p>در محیطی که EFS پشتیبانی و فعال است، می‌توان از مسیر زیر اقدام کرد:</p>

<ol>
  <li>روی فایل یا پوشه‌ی موردنظر راست‌کلیک کن.</li>
  <li>وارد <strong>Properties</strong> شو.</li>
  <li>در تب <strong>General</strong>، گزینه‌ی <strong>Advanced</strong> را باز کن.</li>
  <li>گزینه‌ی <strong>Encrypt contents to secure data</strong> را بررسی و در صورت نیاز فعال کن.</li>
  <li>تغییرات را تأیید کن و محدوده‌ی اعمال آن را مشخص کن.</li>
</ol>

<p>اگر گزینه نمایش داده نمی‌شود، ابتدا نسخه‌ی Windows، نوع فایل‌سیستم، سیاست‌های سیستم و شرایط پشتیبانی EFS را بررسی کن.</p>

<h2>۷. تفاوت EFS و BitLocker</h2>

<p>این دو قابلیت هر دو با Encryption ارتباط دارند، اما برای یک هدف و در یک سطح طراحی نشده‌اند.</p>

<table>
  <thead>
    <tr>
      <th>ویژگی</th>
      <th>EFS</th>
      <th>BitLocker</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>محدوده‌ی معمول</td>
      <td>فایل‌ها و پوشه‌های منتخب روی NTFS</td>
      <td>درایو یا Volume</td>
    </tr>
    <tr>
      <td>هدف اصلی</td>
      <td>محافظت از محتوای فایل‌ها</td>
      <td>محافظت از داده‌های ذخیره‌شده روی Volume، به‌ویژه در صورت دسترسی آفلاین یا سرقت دستگاه</td>
    </tr>
    <tr>
      <td>مدیریت دسترسی</td>
      <td>با مجوزها و کلیدها یا گواهی‌های EFS</td>
      <td>با روش‌های احراز هویت و بازیابی BitLocker</td>
    </tr>
    <tr>
      <td>مثال</td>
      <td>رمزگذاری پوشه‌ی حاوی فایل‌های محرمانه‌ی یک کاربر</td>
      <td>رمزگذاری Volume سیستم‌عامل یا یک درایو داده</td>
    </tr>
  </tbody>
</table>

<div class="box important">
  <i class="fas fa-star"></i>
  <div>
    <strong>برای امتحان به خاطر بسپار</strong>
    EFS معمولاً برای رمزگذاری فایل و پوشه است؛ BitLocker برای رمزگذاری در سطح درایو یا Volume استفاده می‌شود. این دو را با هم اشتباه نگیر.
  </div>
</div>

<h2>۸. آیا می‌توان Compression و EFS را هم‌زمان روی یک فایل فعال کرد؟</h2>

<p>در NTFS، یک فایل نمی‌تواند هم‌زمان به‌صورت NTFS-compressed و EFS-encrypted باشد. این دو ویژگی روی یک فایل با یکدیگر سازگار نیستند.</p>

<p>اگر برای یک فایل محرمانه به Encryption نیاز داری، نباید فرض کنی می‌توانی همان فایل را هم‌زمان با NTFS Compression فشرده کنی.</p>

<div class="code-container">
  <span class="code-label">مقایسه</span>
  <div class="code-block no-prompt">Compression:
هدف = کاهش فضای ذخیره‌سازی

EFS Encryption:
هدف = محافظت از محرمانگی فایل

یک فایل در NTFS:
NTFS Compression + EFS Encryption
             |
             v
      هم‌زمان پشتیبانی نمی‌شود</div>
</div>

<p>البته این موضوع به معنی آن نیست که هیچ فایل رمزگذاری‌شده‌ای در هیچ شرایطی قابل فشرده‌سازی نیست؛ منظور مشخصاً ناسازگاری NTFS Compression با EFS روی همان فایل است.</p>

<h2>۹. دستور Cipher و بررسی EFS</h2>

<p>ابزار خط فرمان <code>cipher</code> برای مشاهده و مدیریت برخی قابلیت‌های مرتبط با EFS استفاده می‌شود.</p>

<p>برای مشاهده‌ی راهنمای دستور:</p>

<div class="code-container">
  <span class="code-label">Command Prompt</span>
  <div class="code-block no-prompt">cipher /?</div>
</div>

<p>برای بررسی وضعیت EFS در یک پوشه:</p>

<div class="code-container">
  <span class="code-label">Command Prompt</span>
  <div class="code-block no-prompt">cipher /s:C:\\Data</div>
</div>

<p>این دستور برای بررسی وضعیت فایل‌ها در مسیر مشخص‌شده کاربرد دارد. قبل از اجرای گزینه‌هایی که فایل‌ها را تغییر می‌دهند، راهنما را بخوان و مسیر موردنظر را دقیق بررسی کن.</p>

<div class="box warning">
  <i class="fas fa-exclamation-triangle"></i>
  <div>
    <strong>نکته‌ی عملی</strong>
    دستورات مربوط به Encryption را روی پوشه‌های حساس یا اطلاعات واقعی بدون شناخت گزینه‌ها و داشتن نسخه‌ی پشتیبان آزمایش نکن.
  </div>
</div>

<h2>۱۰. سناریوی کاربردی</h2>

<p>فرض کن روی یک File Server دو نوع داده داریم:</p>

<div class="code-container">
  <span class="code-label">File Server</span>
  <div class="code-block no-prompt">C:\\Shared\\Reports
  └── Reports and Documents

C:\\Shared\\Confidential
  └── Sensitive Files</div>
</div>

<p>برای هر مسیر باید هدف را مشخص کنیم:</p>

<ul>
  <li><strong>Reports:</strong> اگر کاهش فضای ذخیره‌سازی هدف باشد و فایل‌ها قابلیت فشرده‌سازی مناسبی داشته باشند، می‌توان NTFS Compression را بررسی کرد.</li>
  <li><strong>Confidential:</strong> اگر محرمانگی محتوا هدف باشد، باید راهکار رمزگذاری مناسب، مجوزهای NTFS و مدیریت کلیدها را بررسی کنیم.</li>
</ul>

<p>انتخاب ابزار باید بر اساس نیاز امنیتی و نوع داده انجام شود، نه صرفاً بر اساس نام فایل یا پوشه.</p>

<h2>۱۳. جمع‌بندی نهایی</h2>

<div class="summary-box">
  <ul>
    <li><strong>Compression:</strong> کاهش فضای موردنیاز برای ذخیره‌سازی.</li>
    <li><strong>NTFS Compression:</strong> فشرده‌سازی فایل‌ها و پوشه‌ها روی NTFS.</li>
    <li><strong>Encryption:</strong> محافظت از محرمانگی داده‌ها با رمزگذاری.</li>
    <li><strong>EFS:</strong> رمزگذاری فایل و پوشه در NTFS در محیط‌های پشتیبانی‌شده.</li>
    <li><strong>BitLocker:</strong> رمزگذاری درایو یا Volume.</li>
    <li><strong>compact:</strong> ابزار خط فرمان مرتبط با NTFS Compression.</li>
    <li><strong>cipher:</strong> ابزار خط فرمان مرتبط با EFS و عملیات رمزگذاری فایل.</li>
    <li><strong>NTFS Permissions:</strong> کنترل مجوزهای دسترسی؛ مستقل از هدف Compression.</li>
  </ul>

<p><strong>جلسه‌ی بعد: Quota</strong> — مدیریت و محدودکردن فضای مصرفی کاربران روی Volume.</p>

<div class="section-header"><div class="section-badge">۱۱</div><div><h1>Quota — مدیریت فضای مصرفی کاربران</h1><div class="meta">فصل ۴ · NTFS Permissions، Compression، Encryption و Quota · جلسه ۳</div></div></div>

<p>در جلسه قبل یاد گرفتیم چگونه با Compression فضای مصرفی فایل‌ها را کاهش دهیم و با Encryption از محرمانگی اطلاعات محافظت کنیم. حالا می‌خواهیم به سؤال دیگری پاسخ بدهیم:</p>

<blockquote><strong>چطور جلوی مصرف بیش‌ازحد فضای دیسک توسط یک کاربر را بگیریم؟</strong></blockquote>

<h2>۱. هدف جلسه</h2>
<p>در پایان این جلسه باید بتوانی:</p>
<ul>
<li>مفهوم Disk Quota را توضیح بدهی.</li>
<li>تفاوت Quota و NTFS Permissions را تشخیص بدهی.</li>
<li>با مفهوم Limit و Warning Level آشنا شوی.</li>
<li>بدانی Quota چگونه مصرف فضای کاربران را مدیریت می‌کند.</li>
<li>تنظیمات پایه Quota را در ویندوز بررسی کنی.</li>
<li>با دستورهای مرتبط با مدیریت Quota آشنا شوی.</li>
</ul>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>ایده اصلی</strong>Quota برای مدیریت مقدار فضای دیسکی است که کاربران مصرف می‌کنند. Permission تعیین می‌کند کاربر چه کاری انجام دهد؛ Quota مشخص می‌کند چه مقدار فضا مصرف کند.</div></div>

<h2>۲. Quota چیست؟</h2>
<p><strong>Disk Quota</strong> قابلیتی برای کنترل و پایش میزان فضای دیسک مصرف‌شده توسط کاربران است. در ویندوز، قابلیت NTFS Quota می‌تواند مصرف فضای کاربران را روی یک Volume دارای NTFS مدیریت کند.</p>

<p>فرض کن یک File Server در شرکت داری و چندین کارمند فایل‌های خود را روی آن ذخیره می‌کنند. اگر یک کاربر صدها گیگابایت فایل ذخیره کند، ممکن است فضای آزاد دیسک برای دیگران کم شود. Quota به مدیر سیستم کمک می‌کند این مصرف را کنترل کند.</p>

<div class="code-container"><span class="code-label">مثال ساده</span><div class="code-block no-prompt">Volume: D:\\

کاربر Ali      → مصرف  4 GB
کاربر Sara     → مصرف  8 GB
کاربر Reza     → مصرف 25 GB

سیاست سازمان:
حداکثر مصرف هر کاربر = 10 GB

نتیجه:
Ali   → در محدوده
Sara  → در محدوده
Reza  → بیش از حد مجاز</div></div>

<h2>۳. دو مفهوم مهم: Limit و Warning Level</h2>
<p>در تنظیمات Quota معمولاً دو مقدار مهم را مشخص می‌کنیم.</p>

<h3>Quota Limit</h3>
<p>حداکثر فضای مجاز برای مصرف کاربر است. بسته به تنظیمات، می‌توان مصرف بیشتر از این مقدار را محدود کرد یا فقط آن را پایش کرد.</p>

<h3>Warning Level</h3>
<p>سطح هشدار است. وقتی مصرف کاربر به این مقدار برسد، سیستم می‌تواند رویداد هشدار ثبت کند؛ البته رفتار دقیق به تنظیمات و سیاست انتخاب‌شده بستگی دارد.</p>

<div class="code-container"><span class="code-label">مثال تنظیمات</span><div class="code-block no-prompt">Quota Limit   = 10 GB
Warning Level = 8 GB

مصرف 5 GB   → زیر سطح هشدار
مصرف 8 GB   → رسیدن به سطح هشدار
مصرف 9 GB   → نزدیک به سقف مجاز
مصرف 10 GB  → رسیدن به حد مجاز</div></div>

<div class="box important"><i class="fas fa-exclamation-circle"></i><div><strong>نکته امتحانی</strong>Warning Level با Limit یکسان نیست. Warning برای هشدار است؛ Limit حد مصرف تعیین‌شده را مشخص می‌کند.</div></div>

<h2>۴. تفاوت Quota و NTFS Permissions</h2>
<p>این دو قابلیت به هم مرتبط‌اند، اما وظیفه یکسانی ندارند.</p>

<table>
<thead><tr><th>ویژگی</th><th>NTFS Permissions</th><th>Disk Quota</th></tr></thead>
<tbody>
<tr><td>هدف</td><td>کنترل دسترسی به فایل و پوشه</td><td>کنترل میزان فضای مصرفی</td></tr>
<tr><td>سؤال اصلی</td><td>کاربر اجازه خواندن یا نوشتن دارد؟</td><td>کاربر چه مقدار فضا مصرف کرده است؟</td></tr>
<tr><td>نمونه</td><td>کاربر فقط اجازه Read دارد</td><td>کاربر حداکثر 10 GB فضا دارد</td></tr>
<tr><td>کاربرد</td><td>امنیت و مدیریت دسترسی</td><td>مدیریت ظرفیت ذخیره‌سازی</td></tr>
</tbody>
</table>

<div class="code-container"><span class="code-label">به خاطر بسپار</span><div class="code-block no-prompt">NTFS Permissions
    └── چه کاری مجاز است؟

Disk Quota
    └── چه مقدار فضا مصرف شده یا مجاز است؟</div></div>

<h2>۵. انواع رفتار Quota</h2>
<p>در تنظیمات Quota، مدیر سیستم می‌تواند مشخص کند مصرف کاربران چگونه پایش شود.</p>

<h3>حالت اول: فقط پایش مصرف</h3>
<p>سیستم میزان مصرف را دنبال می‌کند و می‌تواند در سطح هشدار یا حد تعیین‌شده رویداد ثبت کند. این حالت برای بررسی الگوی مصرف پیش از اعمال محدودیت سخت‌گیرانه مفید است.</p>

<h3>حالت دوم: اعمال محدودیت مصرف</h3>
<p>سیستم علاوه بر پایش، حد مصرف تعریف‌شده را اعمال می‌کند. اگر کاربر به حد مجاز برسد، ممکن است نتواند داده بیشتری روی Volume مربوطه ذخیره کند.</p>

<div class="box warning"><i class="fas fa-exclamation-triangle"></i><div><strong>قبل از اعمال Limit</strong> اگر روی سرور کاربران واقعی کار می‌کنند، ابتدا مصرف فعلی آن‌ها را بررسی کن. تعیین Limit پایین‌تر از مصرف موجود می‌تواند باعث اختلال در ذخیره فایل‌های جدید شود.</div></div>

<h2>۶. Quota در چه سطحی تنظیم می‌شود؟</h2>
<p>قابلیت NTFS Disk Quota معمولاً روی یک <strong>Volume</strong> تنظیم می‌شود؛ سپس تنظیمات مصرف کاربران روی همان Volume بررسی و اعمال می‌شود.</p>

<div class="code-container"><span class="code-label">ساختار نمونه</span><div class="code-block no-prompt">File Server
└── D: (NTFS Volume)
    ├── Users
    │   ├── Ali
    │   ├── Sara
    │   └── Reza
    └── Shared

Quota Settings
└── تنظیم و پایش مصرف کاربران روی D:</div></div>

<p>نکته مهم این است که Quota سنتی NTFS بر اساس مالکیت فایل‌ها، مصرف هر کاربر را روی Volume مربوطه محاسبه می‌کند؛ این موضوع با محدودکردن اندازه یک پوشه خاص یکسان نیست.</p>

<h2>۷. فعال‌کردن Quota از محیط گرافیکی</h2>
<p>برای آشنایی با مسیر تنظیمات، در یک محیط آزمایشی مراحل زیر را دنبال کن:</p>

<ol>
<li>File Explorer را باز کن.</li>
<li>روی Volume موردنظر، برای مثال درایو D:، راست‌کلیک کن.</li>
<li>گزینه Properties را انتخاب کن.</li>
<li>وارد تب <strong>Quota</strong> شو.</li>
<li>روی <strong>Show Quota Settings</strong> کلیک کن.</li>
<li>گزینه <strong>Enable quota management</strong> را بررسی و در صورت نیاز فعال کن.</li>
<li>در صورت نیاز، گزینه <strong>Deny disk space to users exceeding quota limit</strong> را برای اعمال محدودیت انتخاب کن.</li>
<li>Warning Level و Limit پیش‌فرض را تعیین کن.</li>
<li>تنظیمات را تأیید کن و وضعیت مصرف کاربران را بررسی کن.</li>
</ol>

<div class="box note"><i class="fas fa-info-circle"></i><div><strong>توجه</strong>نام و در دسترس بودن گزینه‌ها ممکن است بر اساس نسخه ویندوز و نوع Volume متفاوت باشد. این مراحل برای آشنایی با مسیر معمول تنظیمات هستند.</div></div>

<h2>۸. بررسی مصرف کاربران</h2>
<p>در پنجره Quota Settings، گزینه‌ای مانند <strong>Quota Entries</strong> می‌تواند برای مشاهده اطلاعات مصرف کاربران استفاده شود. در آنجا می‌توانی وضعیت مصرف و تنظیمات مربوط به هر کاربر را بررسی کنی.</p>

<p>برای مثال، اگر حد مجاز یک کاربر 10 GB باشد و مصرف او به 9.5 GB رسیده باشد، می‌توانی پیش از رسیدن به سقف، درباره افزایش ظرفیت یا پاک‌سازی فایل‌های غیرضروری تصمیم بگیری.</p>

<table>
<thead><tr><th>وضعیت</th><th>اقدام پیشنهادی مدیر</th></tr></thead>
<tbody>
<tr><td>مصرف پایین</td><td>پایش عادی</td></tr>
<tr><td>رسیدن به Warning Level</td><td>بررسی مصرف و اطلاع‌رسانی</td></tr>
<tr><td>نزدیک‌شدن به Limit</td><td>بررسی نیاز واقعی کاربر و فضای آزاد</td></tr>
<tr><td>رسیدن به Limit</td><td>بررسی سیاست محدودیت، مالکیت فایل‌ها و نیاز به افزایش ظرفیت</td></tr>
</tbody>
</table>

<h2>۹. نکات مهم درباره NTFS Quota</h2>
<ul>
<li>Quota به مدیر سیستم کمک می‌کند مصرف فضای کاربران را مدیریت کند.</li>
<li>Quota جایگزین NTFS Permissions نیست.</li>
<li>Warning Level و Limit دو مقدار متفاوت هستند.</li>
<li>محدودیت اعمال‌شده به Volume مربوط است؛ تنظیمات یک Volume لزوماً روی Volume دیگر اعمال نمی‌شود.</li>
<li>برای تصمیم‌گیری درست، مصرف واقعی کاربران و نیازهای کاری آن‌ها را بررسی کن.</li>
<li>در محیط‌های سازمانی، پایش مصرف و گزارش‌گیری پیش از اعمال محدودیت سخت‌گیرانه مفید است.</li>
</ul>

<h2>۱۰. سناریوی عملی</h2>
<p>فرض کن در شرکت سه کاربر روی درایو D: فایل ذخیره می‌کنند. سیاست سازمان تعیین کرده است که هر کاربر حداکثر 20 GB فضا داشته باشد و در 16 GB هشدار دریافت کند.</p>

<div class="code-container"><span class="code-label">سیاست ذخیره‌سازی</span><div class="code-block no-prompt">Quota Limit   = 20 GB
Warning Level = 16 GB

Ali  = 12 GB  → زیر هشدار
Sara = 17 GB  → از سطح هشدار عبور کرده
Reza = 20 GB  → به حد مجاز رسیده</div></div>

<p><strong>تحلیل:</strong></p>
<ol>
<li>مصرف Ali هنوز از Warning Level کمتر است.</li>
<li>مصرف Sara از Warning Level عبور کرده؛ باید بررسی شود.</li>
<li>مصرف Reza به Limit رسیده است؛ اگر اعمال محدودیت فعال باشد، ممکن است ذخیره فایل جدید برای او متوقف شود.</li>
<li>مدیر باید پیش از تغییر Limit، نیاز کاری کاربران و ظرفیت Volume را بررسی کند.</li>
</ol>

<h2>۱۱. خطاها و برداشت‌های اشتباه</h2>
<ul>
<li><strong>اشتباه:</strong> Quota تعیین می‌کند کاربر اجازه خواندن فایل را دارد یا نه. <br><strong>درست:</strong> این کار عمدتاً وظیفه Permission است.</li>
<li><strong>اشتباه:</strong> Warning Level یعنی ذخیره فایل حتماً متوقف می‌شود. <br><strong>درست:</strong> Warning برای هشدار است؛ محدودیت به تنظیمات Limit و سیاست اعمال آن وابسته است.</li>
<li><strong>اشتباه:</strong> Quota روی همه درایوهای سرور به‌صورت خودکار اعمال می‌شود. <br><strong>درست:</strong> تنظیمات را برای Volume موردنظر بررسی کن.</li>
<li><strong>اشتباه:</strong> Limit را بدون بررسی مصرف فعلی تنظیم کنیم. <br><strong>درست:</strong> ابتدا مصرف موجود و نیازهای کاربران را بررسی کن.</li>
</ul>

<h2>۳. تفاوت DAS، NAS و SAN</h2>

<h3>DAS — Direct Attached Storage</h3>
<p>فضای ذخیره‌سازی مستقیماً به یک کامپیوتر یا سرور متصل است؛ مثلاً هارد داخلی سرور یا یک دیسک متصل از طریق USB.</p>

<h2>۴. iSCSI چیست؟</h2>

<p><strong>iSCSI</strong> مخفف <em>Internet Small Computer Systems Interface</em> است. این فناوری دستورات ذخیره‌سازی SCSI را از طریق شبکه‌های مبتنی بر IP منتقل می‌کند.</p>

<p>به زبان ساده، iSCSI کمک می‌کند سرور از طریق شبکه به یک فضای ذخیره‌سازی راه دور متصل شود و آن را مانند یک دیسک در اختیار داشته باشد.</p>

<p>برای مثال، یک سازمان می‌تواند دستگاه ذخیره‌سازی جداگانه‌ای داشته باشد و یک فضای مشخص را از طریق iSCSI به سرور برنامه‌های خود ارائه کند.</p>

<h3>ب) Target</h3>
<p><strong>Target</strong> سمتِ ارائه‌دهنده فضای ذخیره‌سازی است. این سمت فضای موردنیاز را در اختیار Initiator مجاز قرار می‌دهد.</p>

<p>پورت رایج iSCSI برابر <code>TCP 3260</code> است. البته پورت و تنظیمات واقعی باید با پیکربندی محیط هماهنگ باشند.</p>

<h3>د) IQN</h3>
<p><strong>IQN</strong> یا iSCSI Qualified Name شناسه‌ای برای نام‌گذاری یک Initiator یا Target است.</p>

<h3>مرحله اول: آماده‌سازی سمت Storage</h3>

<h3>مرحله دوم: باز کردن iSCSI Initiator</h3>
<p>در Windows Server می‌توان از ابزار <strong>iSCSI Initiator</strong> برای شناسایی و اتصال به Target استفاده کرد.</p>

<p>در نسخه‌های دارای این ابزار، معمولاً می‌توان آن را از طریق جست‌وجوی منوی Start باز کرد. ممکن است برای اولین اجرا، سیستم درخواست فعال‌سازی سرویس مربوطه را نمایش دهد.</p>

<h3>مرحله سوم: وارد کردن آدرس Target Portal</h3>
<p>در بخش Discovery یا افزودن Portal، آدرس IP دستگاه ارائه‌دهنده ذخیره‌سازی را وارد می‌کنیم. سپس برای پیدا کردن Targetهای در دسترس اقدام می‌کنیم.</p>

<div class="box note">
  <i class="fas fa-lightbulb"></i>
  <div>
    <strong>مثال فرضی</strong>
    اگر آدرس Storage برابر <code>192.168.10.20</code> باشد، باید مطمئن شویم این آدرس از سرور قابل دسترسی است و تنظیمات شبکه و Firewall اجازه اتصال iSCSI را می‌دهند.
  </div>
</div>

<h3>مرحله چهارم: اتصال به Target</h3>
<p>Target شناسایی‌شده را انتخاب می‌کنیم و اتصال را برقرار می‌سازیم. اگر دسترسی به Initiator خاصی محدود شده باشد، شناسه یا مجوزهای آن باید در سمت Target به‌درستی تنظیم شده باشند.</p>

<p>در بعضی محیط‌ها برای احراز هویت از <strong>CHAP</strong> استفاده می‌شود. این قابلیت باید مطابق تنظیمات هر دو سمت پیکربندی شود.</p>

<h3>مرحله پنجم: آماده‌سازی Disk</h3>
<p>پس از اتصال موفق، فضای ذخیره‌سازی ممکن است در ابزارهای مدیریت دیسک Windows نمایش داده شود.</p>

<p>اگر Disk جدید و خالی باشد، بسته به وضعیت آن باید مراحل لازم را انجام دهیم:</p>
<ol>
  <li>بررسی Disk در Disk Management.</li>
  <li>در صورت نیاز، Initialize کردن Disk.</li>
  <li>ساخت Partition یا Volume.</li>
  <li>فرمت‌کردن Volume با File System مناسب.</li>
  <li>اختصاص Drive Letter یا Mount Point در صورت نیاز.</li>
</ol>

<div class="box warning">
  <i class="fas fa-exclamation-triangle"></i>
  <div>
    <strong>هشدار مهم درباره داده‌ها</strong>
    اگر Disk از قبل حاوی اطلاعات یا عضوی از یک ساختار ذخیره‌سازی است، آن را بدون بررسی Initialize یا Format نکن. این عملیات می‌تواند به دسترسی به داده‌ها آسیب بزند.
  </div>
</div>

<h2>۷. CHAP چیست؟</h2>

<p><strong>CHAP</strong> روشی برای احراز هویت در اتصال iSCSI است. در محیط‌هایی که این روش فعال است، باید تنظیمات لازم در دو سمت اتصال هماهنگ باشد.</p>

<ul>
  <li>CHAP برای احراز هویت استفاده می‌شود.</li>
  <li>اطلاعات احراز هویت باید به‌شکل امن نگهداری شوند.</li>
  <li>نام کاربری یا Secret اشتباه می‌تواند مانع برقراری اتصال شود.</li>
  <li>فعال‌بودن CHAP به‌تنهایی جایگزین طراحی امن شبکه و کنترل دسترسی نیست.</li>
</ul>

<h2>۸. Troubleshooting — وقتی iSCSI متصل نمی‌شود</h2>

<p>اگر Target در دسترس نیست یا اتصال برقرار نمی‌شود، بهتر است بررسی را از موارد پایه شروع کنیم.</p>

<div class="code-container">
  <span class="code-label">ترتیب عیب‌یابی</span>

      |
      v
بررسی IP و Subnet

  </div>
</div>

<h2>۹. سناریوی عملی</h2>

<p>فرض کن این دو سیستم را داریم:</p>

<div class="code-container">
  <span class="code-label">Lab Scenario</span>
  <div class="code-block no-prompt">Windows Server
IP: 192.168.10.10
Role: iSCSI Initiator

Storage Server
IP: 192.168.10.20
Role: iSCSI Target</div>
</div>

<p>هدف این است که فضای ذخیره‌سازی ارائه‌شده از سمت Storage Server را به Windows Server متصل کنیم.</p>

<p>قبل از اتصال، این موارد را بررسی می‌کنیم:</p>
<ul>
  <li>هر دو سیستم در شبکه قابل دسترسی هستند.</li>
  <li>Target روی Storage Server ساخته شده است.</li>
  <li>Initiator موردنظر اجازه دسترسی دارد.</li>
  <li>پورت و تنظیمات Firewall با پیکربندی محیط هماهنگ هستند.</li>
  <li>در صورت فعال‌بودن CHAP، اطلاعات احراز هویت صحیح هستند.</li>
</ul>

<p>پس از اتصال، Disk را در Windows بررسی می‌کنیم. اگر دیسک خالی و جدید باشد، می‌توان آن را طبق نیاز آماده کرد؛ اما اگر حاوی داده باشد، ابتدا باید وضعیت و مالکیت آن را مشخص کنیم.</p>

<h2>۱۰. ارتباط iSCSI با MPIO</h2>

<p>فرض کن اتصال سرور به Storage فقط از یک مسیر شبکه‌ای انجام شود. اگر همان مسیر دچار مشکل شود، دسترسی به Storage ممکن است قطع شود.</p>

<p>در محیط‌های مناسب، <strong>MPIO</strong> یا Multipath I/O امکان استفاده از چند مسیر ارتباطی به فضای ذخیره‌سازی را فراهم می‌کند. در نتیجه، اگر یک مسیر از کار بیفتد، مسیر دیگری ممکن است همچنان قابل استفاده باشد.</p>

<div class="code-container">
  <span class="code-label">مفهوم چندمسیره</span>
  <div class="code-block no-prompt">                 ┌── Path 1 ──┐
Windows Server ──┤            ├── Storage
                 └── Path 2 ──┘</div>
</div>

<p>MPIO به تنظیمات سازگار در سرور، شبکه و دستگاه ذخیره‌سازی نیاز دارد. در جلسه بعد، آن را دقیق‌تر بررسی می‌کنیم.</p>

<h2>۱۱. اشتباهات رایج</h2>
<ul>
  <li>اشتباه گرفتن iSCSI با یک Shared Folder معمولی.</li>
  <li>تصور اینکه Initiator فضای ذخیره‌سازی را ارائه می‌کند؛ درحالی‌که Target ارائه‌دهنده است.</li>
  <li>فراموش‌کردن تنظیمات Firewall و دسترسی شبکه.</li>
  <li>فرض اینکه هر Disk متصل‌شده باید فوراً Format شود.</li>
  <li>تصور اینکه اتصال iSCSI به‌تنهایی باعث ایجاد Backup یا Fault Tolerance می‌شود.</li>
  <li>نادیده‌گرفتن امنیت دسترسی به Target.</li>
</ul>

<h2>۱۲. مرور سریع امتحانی</h2>

<div class="summary-box">
  <ul>
    <li><strong>DAS:</strong> ذخیره‌سازی با اتصال مستقیم.</li>
    <li><strong>NAS:</strong> ارائه فایل و پوشه از طریق شبکه.</li>
    <li><strong>SAN:</strong> زیرساخت ذخیره‌سازی شبکه‌ای که معمولاً دسترسی Block ارائه می‌دهد.</li>
    <li><strong>iSCSI:</strong> انتقال دستورات SCSI از طریق شبکه IP.</li>
    <li><strong>Initiator:</strong> آغازکننده اتصال.</li>
    <li><strong>Target:</strong> ارائه‌دهنده فضای ذخیره‌سازی.</li>
    <li><strong>Portal:</strong> نقطه دسترسی شبکه‌ای به Target.</li>
    <li><strong>IQN:</strong> شناسه نام‌گذاری iSCSI.</li>
    <li><strong>LUN:</strong> واحد منطقی ذخیره‌سازی.</li>
    <li><strong>TCP 3260:</strong> پورت رایج iSCSI.</li>
    <li><strong>CHAP:</strong> روش احراز هویت.</li>
    <li><strong>MPIO:</strong> استفاده از چند مسیر برای دسترسی به Storage.</li>
  </ul>
</div>

<h2>۱۳. آزمون تعاملی</h2>
<p>به هر سؤال پاسخ بده. پس از انتخاب گزینه، پاسخ صحیح و توضیح آن نمایش داده می‌شود.</p>

<div class="quiz-card">

<h2>۱۴. جمع‌بندی جلسه</h2>

<p>در این جلسه یاد گرفتیم که ذخیره‌سازی می‌تواند مستقیماً به سرور متصل باشد یا از طریق شبکه ارائه شود. NAS معمولاً فایل و پوشه را به اشتراک می‌گذارد؛ اما iSCSI امکان دسترسی به فضای ذخیره‌سازی در سطح Block را از طریق IP فراهم می‌کند.</p>

<p>همچنین با Initiator، Target، Portal، IQN، LUN و CHAP آشنا شدیم و مسیر کلی اتصال و عیب‌یابی iSCSI را بررسی کردیم.</p>

<div class="summary-box">
  <strong>اگر فقط سه نکته را به خاطر بسپاری:</strong>
  <ol>
    <li>Initiator اتصال را آغاز می‌کند؛ Target فضای ذخیره‌سازی را ارائه می‌دهد.</li>
    <li>iSCSI از شبکه IP برای دسترسی به Storage استفاده می‌کند.</li>
    <li>اتصال موفق به معنی Backup یا تحمل خرابی نیست؛ حفاظت از داده‌ها باید جداگانه طراحی شود.</li>
  </ol>
</div>

<p><strong>جلسه بعد:</strong> MPIO و Data Deduplication — آشنایی با مسیرهای چندگانه دسترسی به Storage و کاهش فضای مصرفی داده‌ها.</p>
