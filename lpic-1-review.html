<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <!-- ============================================================
         سرصفحه (Head)
         شامل متا تگ‌ها، عنوان، فونت‌ها، آیکون‌ها و استایل‌های اصلی
         ============================================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرور LPIC-1</title>

    <!-- فونت وزیرمتن برای متن‌های فارسی -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet">
    <!-- فونت JetBrains Mono برای نمایش کدها -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 برای آیکون‌ها -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ============================================================
           بخش ۱ – متغیرهای CSS (تم روشن و تاریک)
           ============================================================ */
        :root {
            --primary: #E95420;            /* رنگ اصلی (نارنجی اوبونتو) */
            --primary-hover: #c7461a;
            --primary-soft: #fde8e0;
            --primary-glow: rgba(233, 84, 32, 0.18);

            --bg-body: #f7f7f7;
            --bg-card: #ffffff;
            --bg-navbar: rgba(255, 255, 255, 0.92);

            --text-main: #333333;
            --text-heading: #1a1a1a;
            --text-muted: #666666;

            --border: #e0e0e0;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --radius: 12px;

            --note-bg: #e8f5e9;
            --note-border: #4caf50;
            --important-bg: #e3f2fd;
            --important-border: #2196f3;
            --warning-bg: #fff8e1;
            --warning-border: #ff9800;

            --code-bg: #2c001e;
            --code-text: #eeeeee;
            --terminal-green: #8ae234;

            --sidebar-width: 300px;
        }

        /* تم تاریک – با استفاده از attribute selector */
        [data-theme="dark"] {
            --primary: #E95420;
            --primary-hover: #ff6b3d;
            --primary-soft: rgba(233, 84, 32, 0.15);
            --primary-glow: rgba(233, 84, 32, 0.2);

            --bg-body: #1e1e1e;
            --bg-card: #2a2a2a;
            --bg-navbar: rgba(42, 42, 42, 0.95);

            --text-main: #e0e0e0;
            --text-heading: #ffffff;
            --text-muted: #aaaaaa;

            --border: #404040;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);

            --note-bg: rgba(76, 175, 80, 0.12);
            --note-border: #81c784;
            --important-bg: rgba(33, 150, 243, 0.12);
            --important-border: #64b5f6;
            --warning-bg: rgba(255, 152, 0, 0.12);
            --warning-border: #ffb74d;

            --code-bg: #1a1a1a;
            --code-text: #e0e0e0;
        }

        /* ============================================================
           بخش ۲ – ریست و استایل‌های عمومی
           ============================================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            overflow-x: hidden;
            max-width: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.85;
            font-size: 16.5px;
            padding-top: 64px;          /* ارتفاع نوار بالا */
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            max-width: 100%;
        }

        /* ============================================================
           بخش ۳ – نوار ناوبری (Navbar) ثابت در بالا
           ============================================================ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-navbar);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            white-space: nowrap;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
        }

        .nav-spacer {
            flex: 1;          /* فضای خالی بین برند و دکمه تم */
        }

        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .theme-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        /* ============================================================
           بخش ۴ – نوار پیشرفت (Progress Bar)
           ============================================================ */
        .progress-track {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            z-index: 999;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #ff7a45);
            width: 0%;
            transition: width 0.12s;
        }

        /* ============================================================
           بخش ۵ – نوار کناری (Sidebar) شامل فهرست مطالب
           ============================================================ */
        .sidebar {
            position: fixed;
            top: 60px;
            right: 0;
            width: var(--sidebar-width);
            height: calc(100vh - 60px);
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            z-index: 900;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.06);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg-card);
            z-index: 2;
        }

        .sidebar-header h3 {
            font-size: 1rem;
            color: var(--text-heading);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-header h3 i {
            color: var(--primary);
        }

        .sidebar-close {
            display: none;        /* در موبایل نمایش داده می‌شود */
            background: none;
            border: none;
            font-size: 1.15rem;
            color: var(--text-muted);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: 0.2s;
        }
        .sidebar-close:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }

        /* ============================================================
           بخش ۶ – استایل فهرست مطالب (TOC)
           ============================================================ */
        .toc {
            padding: 8px 0 30px;
        }

        .toc-chapter {
            border-bottom: 1px solid var(--border);
        }
        .toc-chapter:last-child {
            border-bottom: none;
        }

        .toc-chapter summary {
            padding: 12px 14px;
            font-weight: 600;
            color: var(--text-heading);
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: background 0.2s;
            user-select: none;
            font-size: 0.92rem;
            line-height: 1.4;
        }
        .toc-chapter summary::-webkit-details-marker {
            display: none;
        }

        /* فلش باز/بسته شدن */
        .toc-chapter summary::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            margin-right: auto;
            margin-top: 2px;
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: transform 0.25s;
            flex-shrink: 0;
        }
        .toc-chapter[open] summary::after {
            transform: rotate(180deg);
        }

        .toc-chapter summary:hover {
            background: var(--primary-soft);
        }
        .toc-chapter[open] > summary {
            background: var(--primary-soft);
            color: var(--primary);
        }

        .chapter-num {
            width: 24px;
            height: 24px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .toc-sections {
            list-style: none;
            padding: 0 0 8px 0;
            margin: 0;
            background: var(--bg-body);
        }

        .toc-sections li a {
            display: block;
            padding: 8px 14px 8px 48px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.18s;
            border-right: 3px solid transparent;
            line-height: 1.45;
        }
        .toc-sections li a:hover {
            color: var(--primary);
            background: var(--primary-soft);
        }
        .toc-sections li a.active {
            color: var(--primary);
            background: var(--primary-soft);
            border-right-color: var(--primary);
            font-weight: 600;
        }

        /* ============================================================
           بخش ۷ – دکمه باز کردن سایدبار (در موبایل) و اوورلی
           ============================================================ */
        .sidebar-toggle {
            display: none;          /* فقط در موبایل نشان داده می‌شود */
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            font-size: 1.25rem;
            box-shadow: 0 6px 20px var(--primary-glow);
            z-index: 950;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }
        .sidebar-toggle:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 850;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.open {
            display: block;
        }

        /* ============================================================
           بخش ۸ – محتوای اصلی (Main)
           ============================================================ */
        .main {
            max-width: 820px;
            margin: 0 auto;
            margin-right: calc(var(--sidebar-width) + 24px);
            padding: 32px 24px 80px;
            transition: margin 0.3s;
            min-width: 0;
            width: 100%;
            overflow-x: hidden;
        }

        /* هر بخش (section) به صورت پیش‌فرض مخفی است */
        .section {
            display: none;
            animation: fadeIn 0.35s ease;
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }
        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           بخش ۹ – هدر هر بخش (عنوان، شماره، متا)
           ============================================================ */
        .section-header {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }
        .section-header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background: var(--primary);
        }

        .section-badge {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .section-header h1 {
            font-size: 1.3rem;
            color: var(--text-heading);
            margin-bottom: 3px;
        }
        .section-header .meta {
            font-size: 0.84rem;
            color: var(--text-muted);
        }

        /* ============================================================
           بخش ۱۰ – تایپوگرافی محتوا (عنوان‌ها، پاراگراف‌ها، لیست‌ها و ...)
           ============================================================ */
        h2 {
            color: var(--text-heading);
            font-size: 1.2rem;
            margin: 28px 0 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            flex-shrink: 0;
        }

        h3 {
            color: var(--text-heading);
            font-size: 1.05rem;
            margin: 18px 0 8px;
        }

        p {
            margin-bottom: 14px;
            text-align: justify;
        }

        strong {
            color: var(--text-heading);
        }

        ul,
        ol {
            margin: 10px 0 18px;
            padding-right: 22px;
        }
        li {
            margin-bottom: 6px;
        }

        blockquote {
            background: var(--primary-soft);
            border-right: 4px solid var(--primary);
            padding: 14px 18px;
            margin: 20px 0;
            border-radius: 0 10px 10px 0;
            color: var(--text-heading);
            font-style: italic;
        }

        /* ============================================================
           بخش ۱۱ – جعبه‌های اطلاعاتی (نکته، مهم، هشدار)
           ============================================================ */
        .box {
            display: flex;
            gap: 14px;
            padding: 16px 18px;
            border-radius: 10px;
            margin: 22px 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            max-width: 100%;
            min-width: 0;
            overflow-x: hidden;
            overflow-wrap: break-word;
        }

        .box > div {
            min-width: 0;
            flex: 1;
            overflow-wrap: break-word;
        }
        .box i {
            font-size: 1.3rem;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .box strong {
            display: block;
            margin-bottom: 3px;
        }

        .box.note {
            background: var(--note-bg);
            border-color: var(--note-border);
        }
        .box.note i,
        .box.note strong {
            color: var(--note-border);
        }

        .box.important {
            background: var(--important-bg);
            border-color: var(--important-border);
        }
        .box.important i,
        .box.important strong {
            color: var(--important-border);
        }

        .box.warning {
            background: var(--warning-bg);
            border-color: var(--warning-border);
        }
        .box.warning i,
        .box.warning strong {
            color: var(--warning-border);
        }

        /* ============================================================
           بخش ۱۲ – نمایش کدها (Code Blocks)
           ============================================================ */
        .code-container {
            position: relative;
            margin: 24px 0;
            max-width: 100%;
            min-width: 0;
            width: 100%;
        }

        .code-label {
            position: absolute;
            top: -11px;
            left: 14px;
            background: var(--primary);
            color: #fff;
            font-size: 0.72rem;
            padding: 2px 12px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            z-index: 1;
        }

        .code-block {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 28px 18px 18px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            direction: ltr;
            text-align: left;
            unicode-bidi: isolate;
            white-space: pre;
            overflow-x: auto;
            border: 1px solid var(--border);
            max-width: 100%;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
        }

        /* جمع‌بندی‌ها و خطوط دو زبانه روی موبایل داخل کادر بمانند */
        .summary-box,
        .summary-box .code-container,
        .summary-box .code-block,
        .box .code-container,
        .box .code-block {
            max-width: 100%;
            min-width: 0;
        }

        code, .section code {
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        /* پرامپت $ برای خطوط فرمان */
        .code-block::before {
            content: '$ ';
            color: var(--terminal-green);
        }
        .code-block.no-prompt::before {
            content: none;
        }

        /* ============================================================
           بخش ۱۳ – جدول‌ها
           ============================================================ */
        .table-wrap {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 22px 0;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .table-wrap table {
            margin: 0;
            border: none;
            border-radius: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 22px 0;
            font-size: 0.93rem;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            min-width: 0;
        }

        th,
        td {
            border: 1px solid var(--border);
            padding: 11px 14px;
            text-align: right;
            vertical-align: top;
        }

        th {
            background: var(--primary-soft);
            color: var(--text-heading);
            font-weight: 600;
            white-space: nowrap;
        }

        tr:hover td {
            background: var(--bg-body);
        }

        td code {
            white-space: nowrap;
        }

        /* ============================================================
           بخش ۱۴ – جزئیات قابل باز و بسته شدن (details)
           ============================================================ */
        details.content-details {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            margin: 18px 0;
        }
        details.content-details summary {
            font-weight: 600;
            color: var(--text-heading);
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        details.content-details summary::-webkit-details-marker {
            display: none;
        }
        details.content-details[open] summary {
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border);
        }

        /* ============================================================
           بخش ۱۵ – کارت‌های آزمون (Quiz)
           ============================================================ */
        .quiz-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
            margin: 28px 0 16px;
            box-shadow: var(--shadow);
        }

        .quiz-card>p {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-heading);
            margin-bottom: 16px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quiz-options button {
            background: var(--bg-body);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            text-align: right;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.2s;
        }
        .quiz-options button:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        .quiz-options button.selected {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .quiz-answer {
            display: none;
            margin-top: 14px;
            padding: 14px 16px;
            background: var(--note-bg);
            border-radius: 10px;
            border-right: 4px solid var(--note-border);
            color: var(--text-heading);
            font-size: 0.95rem;
        }
        .quiz-answer.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        /* ============================================================
           بخش ۱۶ – حالت placeholder برای بخش‌های خالی
           ============================================================ */
        .placeholder {
            text-align: center;
            color: var(--text-muted);
            padding: 48px 20px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px dashed var(--border);
        }
        .placeholder i {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 14px;
            opacity: 0.7;
            display: block;
        }

        /* ============================================================
           بخش ۱۷ – دکمه‌های ناوبری بین بخش‌ها
           ============================================================ */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            gap: 12px;
        }

        .nav-btn {
            padding: 11px 22px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 24px;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 4px 14px var(--primary-glow);
        }
        .nav-btn:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }
        .nav-btn:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* ============================================================
           بخش ۱۸ – جعبه جمع‌بندی (Summary Box)
           ============================================================ */
        .summary-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            margin: 24px 0;
            box-shadow: var(--shadow);
            max-width: 100%;
            min-width: 0;
            overflow-x: hidden;
            overflow-wrap: break-word;
        }
        .summary-box h3 {
            margin-top: 0;
            color: var(--primary);
        }

        /* ============================================================

<h2>۱. قبل از شروع...</h2>
<p>فرض کن داخل Terminal این دستور را می‌نویسی:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ls</div></div>
<p>و فایل‌ها و پوشه‌ها نمایش داده می‌شوند. در ظاهر اتفاق ساده‌ای است؛ اما پشت صحنه تقریباً این مسیر را داریم:</p>
<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">User\n  │\n  ▼\nTerminal\n  │\n  ▼\nShell\n  │\n  ▼\nCommand / Program\n  │\n  ▼\nKernel\n  │\n  ▼\nHardware</div></div>
<p>البته این شکل یک <strong>مدل ساده‌شده</strong> است؛ هدف آن درک ارتباط اجزاست، نه نشان دادن تمام جزئیات فنی.</p>

<h2>۲. Linux چیست؟</h2>
<p>در صحبت روزمره وقتی می‌گوییم «Linux»، معمولاً منظورمان کل محیط سیستم‌عامل لینوکسی است. اما از نظر فنی:</p>
<blockquote><strong>Linux نام Kernel است.</strong></blockquote>
<p>یک سیستم لینوکسی معمولاً از Kernel به همراه ابزارها، کتابخانه‌ها، برنامه‌ها و محیط‌های مختلف تشکیل می‌شود. به مجموعه‌ای که این اجزا را در کنار هم ارائه می‌کند، معمولاً <strong>Distribution یا Distro</strong> می‌گوییم. مثلاً:</p>
<div class="code-container"><span class="code-label">توزیع‌ها</span><div class="code-block no-prompt">Ubuntu\nDebian\nFedora\nRocky Linux</div></div>
<p>همگی از <strong>Linux Kernel</strong> استفاده می‌کنند، اما مجموعه نرم‌افزاری متفاوتی دارند.</p>
<h3>تصویر ذهنی</h3>
<div class="code-container"><span class="code-label">ساختار توزیع</span><div class="code-block no-prompt">Linux Distribution\n│\n├── Linux Kernel\n├── System Libraries\n├── System Utilities\n├── Shell\n├── Applications\n└── GUI / Desktop</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> Linux به‌طور دقیق نام Kernel است، نه نام تمام نرم‌افزارهای یک Distribution.</div></div>

<h2>۳. Kernel چیست؟</h2>
<p>Kernel هسته اصلی سیستم است. Kernel بین نرم‌افزارها و سخت‌افزار قرار دارد و منابع سیستم را مدیریت می‌کند. مثلاً:</p>
<ul>
<li>CPU</li>
<li>RAM</li>
<li>Disk</li>
<li>Network</li>
<li>Devices</li>
<li>Processها</li>
</ul>
<p>برنامه‌ها معمولاً برای انجام عملیات سطح پایین، از طریق <strong>System Call</strong> با Kernel درخواست ارتباط می‌کنند.</p>
<h3>مثال</h3>
<p>وقتی می‌نویسیم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">cat file.txt</div></div>
<p>برنامه <code>cat</code> برای دسترسی به فایل از امکانات سیستم‌عامل/Kernel استفاده می‌کند. به زبان ساده:</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">cat\n ↓\nKernel\n ↓\nFilesystem / Disk\n ↓\nfile.txt</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> Kernel مسئول کارهایی مثل <strong>Process + Memory + Device + Filesystem + Networking</strong> است.</div></div>

<h2>۴. Shell چیست؟</h2>
<p>Shell برنامه‌ای است که به عنوان <strong>Command Interpreter</strong> عمل می‌کند. یعنی دستوری که کاربر وارد می‌کند را دریافت و تفسیر می‌کند و در صورت نیاز برنامه یا عملیات مناسب را اجرا می‌کند. مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">mkdir test</div></div>
<p>Shell متوجه می‌شود که باید دستور <code>mkdir</code> اجرا شود.</p>
<h3>Shellهای معروف</h3>
<div class="code-container"><span class="code-label">نمونه</span><div class="code-block no-prompt">sh\nbash\nzsh\nfish</div></div>
<p>در LPIC-1، <strong>Bash</strong> اهمیت زیادی دارد.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> Shell = Command Interpreter. Shell خودش Kernel نیست.</div></div>

<h2>۵. Terminal چیست؟</h2>
<p>Terminal محیطی است که از طریق آن با Shell تعامل می‌کنیم. در محیط گرافیکی، Terminal معمولاً به شکل یک پنجره دیده می‌شود:</p>
<div class="code-container"><span class="code-label">نمایش</span><div class="code-block no-prompt">┌─────────────────────────────┐\n│ Terminal                    │\n│                             │\n│ $ ls                        │\n│ file.txt  test/             │\n│                             │\n└─────────────────────────────┘</div></div>
<p>داخل این Terminal ممکن است Shellای مثل Bash اجرا شود. پس:</p>
<div class="code-container"><span class="code-label">سلسله‌مراتب</span><div class="code-block no-prompt">Terminal\n   │\n   └── Bash\n          │\n          └── Commands</div></div>
<h3>تفاوت خیلی مهم</h3>
<div class="table-wrap">
<table>
<thead><tr><th>مفهوم</th><th>وظیفه</th></tr></thead>
<tbody>
<tr><td>Terminal</td><td>محیط/رابط تعامل متنی با Shell</td></tr>
<tr><td>Shell</td><td>تفسیر و اجرای دستورات</td></tr>
<tr><td>Kernel</td><td>مدیریت منابع و ارتباط سطح پایین با سخت‌افزار</td></tr>
<tr><td>Command</td><td>دستور یا برنامه‌ای که اجرا می‌شود</td></tr>
</tbody>
</table>
</div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> این دو را یکی ندان: <code>Terminal ≠ Shell</code>. Terminal محل تعامل است؛ Shell مفسر دستورات است.</div></div>

<h2>۶. Command چیست؟</h2>
<p>Command یعنی دستوری که به Shell می‌دهیم تا یک عملیات انجام شود. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">pwd</div></div>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls</div></div>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">mkdir test</div></div>
<p>یک Command ممکن است یک برنامه مستقل باشد یا یک قابلیت داخلی Shell باشد. مثلاً <code>cd</code> در Bash یک <strong>Shell Builtin</strong> است، اما <code>ls</code> معمولاً یک برنامه مستقل است.</p>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته مهم</strong> همه Commandها الزاماً فایل اجرایی مستقل نیستند. این موضوع در LPIC-1 مهم است، مخصوصاً هنگام کار با <code>type</code> و <code>which</code>.</div></div>

<h2>۷. ساختار فایل‌ها در لینوکس</h2>
<p>یکی از تفاوت‌های مهم لینوکس و ویندوز این است که در لینوکس یک درخت فایل داریم که ریشه آن <code>/</code> است. به آن <strong>Root Directory</strong> می‌گوییم. ساختار ساده:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">/\n├── home\n├── etc\n├── var\n├── usr\n├── boot\n├── tmp\n└── dev</div></div>
<p>همه مسیرها در نهایت از <code>/</code> منشعب می‌شوند.</p>

<h2>۸. چند Directory مهم</h2>
<div class="table-wrap">
<table>
<thead><tr><th>Directory</th><th>کاربرد کلی</th></tr></thead>
<tbody>
<tr><td><code>/</code></td><td>ریشه سیستم</td></tr>
<tr><td><code>/home</code></td><td>Home کاربران معمولی</td></tr>
<tr><td><code>/root</code></td><td>Home کاربر root</td></tr>
<tr><td><code>/etc</code></td><td>فایل‌های تنظیمات سیستم</td></tr>
<tr><td><code>/var</code></td><td>داده‌های متغیر مثل Log</td></tr>
<tr><td><code>/tmp</code></td><td>فایل‌های موقت</td></tr>
<tr><td><code>/boot</code></td><td>فایل‌های مربوط به Boot</td></tr>
<tr><td><code>/dev</code></td><td>Device Fileها</td></tr>
<tr><td><code>/usr</code></td><td>بخش بزرگی از برنامه‌ها و فایل‌های سیستم</td></tr>
</tbody>
</table>
</div>
<p>لازم نیست فعلاً تمام جزئیات این پوشه‌ها را حفظ کنی؛ کاربرد کلی آنها مهم است.</p>

<h2>۹. Path چیست؟</h2>
<p>Path یعنی <strong>آدرس یک فایل یا Directory</strong>. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال مسیر</span><div class="code-block no-prompt">/home/ali/Documents/file.txt</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">درخت</span><div class="code-block no-prompt">/\n└── home\n    └── ali\n        └── Documents\n            └── file.txt</div></div>
<p>مثل آدرس یک خانه است.</p>

<h2>۱۰. Absolute Path</h2>
<p>مسیر کامل که از Root شروع می‌شود. مثلاً:</p>
<div class="code-container"><span class="code-label">مطلق</span><div class="code-block no-prompt">/home/ali/Documents/file.txt</div></div>
<p>از <code>/</code> شروع شده است. پس <strong>Absolute Path = مسیر کامل از Root</strong></p>

<h2>۱۱. Relative Path</h2>
<p>مسیر نسبی نسبت به <strong>Directory فعلی</strong> است. فرض کن:</p>
<div class="code-container"><span class="code-label">مسیر فعلی</span><div class="code-block">pwd</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">/home/ali</div></div>
<p>حالا اگر فایلی داشته باشیم:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block no-prompt">/home/ali/Documents/file.txt</div></div>
<p>می‌توانیم آن را به صورت Relative بنویسیم:</p>
<div class="code-container"><span class="code-label">نسبی</span><div class="code-block no-prompt">Documents/file.txt</div></div>
<p>چون مسیر از محل فعلی شروع شده است.</p>
<h3>مقایسه</h3>
<div class="table-wrap">
<table>
<thead><tr><th>Absolute</th><th>Relative</th></tr></thead>
<tbody>
<tr><td><code>/home/ali/file.txt</code></td><td><code>file.txt</code></td></tr>
<tr><td>از <code>/</code> شروع می‌شود</td><td>از محل فعلی شروع می‌شود</td></tr>
<tr><td>مستقل از Directory فعلی</td><td>وابسته به Directory فعلی</td></tr>
</tbody>
</table>
</div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong>
<ul>
<li><code>/</code> → Root</li>
<li><code>~</code> → Home کاربر فعلی</li>
<li><code>.</code> → Directory فعلی</li>
<li><code>..</code> → Directory والد</li>
</ul>
</div></div>

<h2>۱۲. <code>pwd</code></h2>
<p>مخفف <strong>Print Working Directory</strong> یعنی «الان داخل کدام Directory هستم؟»</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">pwd</div></div>
<p>خروجی نمونه:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">/home/ali</div></div>

<h2>۱۳. <code>cd</code></h2>
<p>مخفف <strong>Change Directory</strong> برای تغییر Directory استفاده می‌شود.</p>
<h3>رفتن به یک Directory</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cd Documents</div></div>
<h3>رفتن به Root</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cd /</div></div>
<h3>رفتن به Home</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cd</div></div>
<p>یا</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cd ~</div></div>
<h3>رفتن به Directory والد</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cd ..</div></div>
<h3>رفتن به مسیر قبلی</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cd -</div></div>

<h3><code>cd ..</code> در برابر <code>cd -</code></h3>
<p><code>cd ..</code> یعنی یک سطح بالاتر برو. مثلاً از <code>/home/ali/Documents</code> با <code>cd ..</code> می‌شویم <code>/home/ali</code>.</p>
<p><code>cd -</code> یعنی به Directory قبلی که در آن بودم برگرد.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> این دو را با هم اشتباه نکن: <code>cd ..</code> ≠ <code>cd -</code></div></div>

<h2>۱۴. <code>ls</code></h2>
<p>برای مشاهده محتویات Directory استفاده می‌شود.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Documents\nDownloads\nfile.txt\ntest</div></div>
<h3>گزینه‌های مهم <code>ls</code></h3>
<ul>
<li><strong>نمایش جزئیات:</strong> <code>ls -l</code> اطلاعاتی مانند Permission، Owner، Group، Size، Time، Name را نمایش می‌دهد.</li>
<li><strong>نمایش فایل‌های مخفی:</strong> <code>ls -a</code> فایل‌هایی که نامشان با <code>.</code> شروع می‌شود (مانند <code>.bashrc</code>) را نشان می‌دهد.</li>
<li><strong>حجم خواناتر:</strong> <code>ls -lh</code> اندازه را به صورت <code>4.0K</code> نمایش می‌دهد.</li>
<li><strong>ترکیب گزینه‌ها:</strong> <code>ls -lah</code> ترکیبی از <code>-l</code>، <code>-a</code> و <code>-h</code>.</li>
<li><strong>نمایش بازگشتی:</strong> <code>ls -R</code> محتویات Directoryها و زیرDirectoryها را به صورت Recursive نمایش می‌دهد.</li>
</ul>

<h2>۱۵. فایل‌های مخفی</h2>
<p>در لینوکس فایل مخفی معمولاً فایلی است که نام آن با <code>.</code> شروع شود. مثلاً <code>.bashrc</code>، <code>.config</code>، <code>.profile</code>. برای مشاهده آنها:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ls -a</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> Hidden بودن به معنی «امن یا رمزگذاری‌شده» نیست. فقط یک ویژگی نام‌گذاری/نمایش است.</div></div>

<h2>۱۶. <code>.</code> و <code>..</code></h2>
<ul>
<li><code>.</code> → Current Directory</li>
<li><code>..</code> → Parent Directory</li>
</ul>
<p>مثلاً <code>cd .</code> یعنی در همان Directory بمان و <code>cd ..</code> یعنی یک سطح بالاتر برو.</p>

<h2>۱۷. ساخت Directory با <code>mkdir</code></h2>
<p>برای ساخت Directory:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">mkdir test</div></div>
<p>ساخت چند Directory:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">mkdir dir1 dir2 dir3</div></div>
<h3><code>mkdir -p</code></h3>
<p>فرض کن می‌خواهیم مسیر <code>a/b/c</code> را بسازیم. اگر <code>a</code> و <code>b</code> وجود نداشته باشند، با <code>-p</code> همه مسیر لازم ایجاد می‌شود:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">mkdir -p a/b/c</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> <code>mkdir</code> ساخت Directory، <code>mkdir -p</code> ساخت مسیرهای والد در صورت نیاز.</div></div>

<h2>۱۸. ساخت فایل با <code>touch</code></h2>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">touch file.txt</div></div>
<p>اگر فایل وجود نداشته باشد، یک فایل خالی ایجاد می‌شود. اگر فایل از قبل وجود داشته باشد، <code>touch</code> معمولاً Timestampهای آن را به‌روزرسانی می‌کند.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>touch</code> ابزار اصلی برای نوشتن محتویات فایل نیست؛ فقط فایل خالی ایجاد می‌کند یا Timestamp را به‌روز می‌کند.</div></div>

<h2>۱۹. <code>cat</code></h2>
<p>برای نمایش محتویات فایل:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat file.txt</div></div>
<p>خروجی نمونه:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Hello\nLinux\nLPIC-1</div></div>
<p><code>cat</code> می‌تواند برای اتصال چند فایل هم استفاده شود، اما کاربرد اصلی فعلی نمایش سریع محتویات فایل است.</p>

<h2>۲۰. <code>head</code></h2>
<p>برای مشاهده ابتدای فایل:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">head file.txt</div></div>
<p>به صورت پیش‌فرض چند خط اول را نمایش می‌دهد. مثلاً برای ۵ خط اول:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">head -n 5 file.txt</div></div>

<h2>۲۱. <code>tail</code></h2>
<p>برای مشاهده انتهای فایل:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">tail file.txt</div></div>
<p>مثلاً ۵ خط آخر:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">tail -n 5 file.txt</div></div>

<h2>۲۲. <code>less</code></h2>
<p>برای مشاهده فایل‌های طولانی به صورت صفحه‌به‌صفحه:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">less file.txt</div></div>
<p>در فایل‌های بزرگ، <code>less</code> مناسب‌تر از <code>cat</code> است. حرکت در <code>less</code>:</p>
<ul>
<li><code>↑</code> <code>↓</code> حرکت</li>
<li><code>Space</code> صفحه بعد</li>
<li><code>q</code> خروج</li>
</ul>
<h3>مقایسه سریع</h3>
<div class="table-wrap">
<table>
<thead><tr><th>Command</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>cat</code></td><td>نمایش سریع محتوا</td></tr>
<tr><td><code>head</code></td><td>ابتدای فایل</td></tr>
<tr><td><code>tail</code></td><td>انتهای فایل</td></tr>
<tr><td><code>less</code></td><td>مشاهده صفحه‌به‌صفحه</td></tr>
</tbody>
</table>
</div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> اگر فایل خیلی بزرگ است و فقط می‌خواهی آن را بررسی کنی، <code>less file.txt</code> انتخاب مناسبی است.</div></div>

<h2>۲۳. Variable چیست؟</h2>
<p>Variable یعنی یک نام برای نگهداری یک مقدار. مثلاً:</p>
<div class="code-container"><span class="code-label">تعریف</span><div class="code-block">name=Ali</div></div>
<p>حالا:</p>
<div class="code-container"><span class="code-label">نمایش</span><div class="code-block">echo $name</div></div>
<p>خروجی <code>Ali</code>. علامت <code>$</code> برای دسترسی به مقدار Variable استفاده می‌شود.</p>
<h3>یک نکته مهم در Assignment</h3>
<p>در Bash معمولاً نباید اطراف <code>=</code> فاصله بگذاریم:</p>
<p>درست: <code>name=Ali</code></p>
<p>غلط: <code>name = Ali</code></p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> در Bash <code>name=Ali</code> درست است اما <code>name = Ali</code> به عنوان Assignment معتبر نیست.</div></div>

<h2>۲۴. <code>echo</code></h2>
<p>برای نمایش مقدار یا متن استفاده می‌شود.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo Hello</div></div>
<p>خروجی <code>Hello</code>. برای Variable:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo $name</div></div>
<p>خروجی <code>Ali</code>.</p>

<h2>۲۵. <code>PATH</code></h2>
<p>یکی از مهم‌ترین Environment Variableها <code>PATH</code> است. برای Shell مشخص می‌کند هنگام اجرای یک Command، در چه Directoryهایی به دنبال برنامه بگردد. مشاهده:</p>
<div class="code-container"><span class="code-label">نمایش</span><div class="code-block">echo $PATH</div></div>
<p>خروجی نمونه:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">/usr/local/bin:/usr/bin:/bin</div></div>
<p>هر مسیر با <code>:</code> از مسیر بعدی جدا شده است.</p>
<h3>مثال مفهومی</h3>
<p>وقتی می‌نویسی <code>ls</code>، Shell باید بفهمد برنامه <code>ls</code> کجاست. PATH به آن می‌گوید: «اینجاها را جستجو کن.»</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> PATH = محل‌های جستجوی Commandها.</div></div>

<h2>۲۶. <code>env</code></h2>
<p>برای مشاهده Environment Variableها:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">env</div></div>
<p>خروجی نمونه:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">USER=ali\nHOME=/home/ali\nPATH=/usr/bin:/bin\nSHELL=/bin/bash</div></div>

<h2>۲۷. History</h2>
<p>Shell معمولاً دستورات قبلی را در History نگه می‌دارد. نمایش History:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">history</div></div>
<p>خروجی نمونه:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">  1  pwd\n  2  ls\n  3  cd Documents\n  4  cat file.txt</div></div>
<h3>اجرای آخرین Command</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">!!</div></div>
<p>مثلاً اگر آخرین دستور <code>ls</code> بوده باشد، <code>!!</code> دوباره <code>ls</code> را اجرا می‌کند.</p>
<h3>اجرای Command شماره مشخص</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">!15</div></div>
<p>یعنی Command شماره ۱۵ در History را اجرا کن.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>history</code> فقط برای دیدن دستورات نیست؛ می‌توان از History برای اجرای دوباره دستورات نیز استفاده کرد.</div></div>

<h2>۲۸. گرفتن Help</h2>
<p>در لینوکس لازم نیست همه Commandها را حفظ کنیم. اگر دستوری را بلد نیستی، اول از خودش کمک بگیر. سه روش مهم:</p>
<div class="code-container"><span class="code-label">روش‌ها</span><div class="code-block">command --help\nman command\ninfo command</div></div>

<h2>۲۹. <code>--help</code></h2>
<p>برای راهنمای سریع Command:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls --help</div></div>
<p>معمولاً گزینه‌های مهم و Syntax را نشان می‌دهد. مناسب برای یادآوری سریع.</p>

<h2>۳۰. <code>man</code></h2>
<p>مخفف <strong>Manual</strong>. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">man ls</div></div>
<p>صفحه Manual مربوط به <code>ls</code> را باز می‌کند. در <code>man</code> معمولاً اطلاعاتی مثل Name، Synopsis، Description، Options وجود دارد. خروج با <code>q</code>.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> اگر سؤال بپرسد «برای مشاهده Manual یک Command از چه چیزی استفاده می‌کنیم؟» جواب <code>man</code> است.</div></div>

<h2>۳۱. <code>info</code></h2>
<p><code>info</code> نیز برای مشاهده Documentation استفاده می‌شود:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">info ls</div></div>
<p>در بعضی پروژه‌ها و ابزارهای GNU، مستندات Info ساختاریافته‌تر و مفصل‌تر از Manual معمولی هستند. اما برای مرور LPIC-1:</p>
<ul>
<li><code>--help</code> → سریع</li>
<li><code>man</code> → Manual</li>
<li><code>info</code> → Documentation ساختاریافته</li>
</ul>

<h2>۳۲. مقایسه Helpها</h2>
<div class="table-wrap">
<table>
<thead><tr><th>روش</th><th>کاربرد اصلی</th></tr></thead>
<tbody>
<tr><td><code>command --help</code></td><td>راهنمای سریع</td></tr>
<tr><td><code>man command</code></td><td>Manual استاندارد</td></tr>
<tr><td><code>info command</code></td><td>Documentation ساختاریافته، مخصوصاً ابزارهای GNU</td></tr>
</tbody>
</table>
</div>
<h3>پیشنهاد عملی</h3>
<p>اگر Command را نمی‌شناسی: <code>command --help</code> و اگر توضیح کامل‌تر می‌خواهی: <code>man command</code>.</p>

<h2>۳۳. یک سناریوی واقعی</h2>
<p>فرض کن تازه وارد سیستم شده‌ای و می‌خواهی یک فایل را پیدا و مشاهده کنی.</p>
<ol>
<li>اول <code>pwd</code> تا بفهمی کجا هستی.</li>
<li>بعد <code>ls</code> تا محتویات را ببینی.</li>
<li>وارد Directory موردنظر: <code>cd Documents</code></li>
<li>دوباره <code>pwd</code> برای اطمینان از مسیر.</li>
<li>بعد <code>ls -l</code> برای دیدن جزئیات.</li>
<li>اگر فایل متنی باشد: <code>less file.txt</code></li>
<li>و اگر دستور <code>less</code> را یادت نباشد: <code>man less</code></li>
</ol>
<p>این دقیقاً همان چیزی است که باید از خط فرمان یاد بگیری:</p>
<div class="code-container"><span class="code-label">روال</span><div class="code-block no-prompt">بدان کجا هستی\n      ↓\nمحتویات را ببین\n      ↓\nحرکت کن\n      ↓\nفایل را پیدا کن\n      ↓\nفایل را مشاهده کن\n      ↓\nاگر دستوری را بلد نیستی → Help</div></div>

<h2>۳۶. دام‌های مهم امتحانی ⚠️</h2>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۱</strong> Linux = فقط یک برنامه؟ خیر. از نظر فنی Linux نام Kernel است؛ یک Distribution مجموعه‌ای از Kernel و اجزای دیگر است.</div></div>

<h2>۴. <code>grep</code></h2>
<p>یکی از مهم‌ترین ابزارهای پردازش متن در Linux:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">grep</div></div>
<p>وظیفه ساده آن: <strong>پیدا کردن الگو یا متن در خطوط ورودی</strong>.</p>
<p>مثلاً فایل <code>users.txt</code> داریم:</p>

<p>اگر فقط <code>Amir</code> را بخواهیم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">grep Amir users.txt</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">Amir</div></div>

<h2>۵. <code>grep</code> روی خروجی Command</h2>
<p><code>grep</code> فقط روی فایل کار نمی‌کند. می‌توانیم خروجی یک Command را نیز به آن بدهیم. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">history | grep ssh</div></div>
<p>اینجا:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">history\n   ↓\nخروجی History\n   ↓\ngrep ssh\n   ↓\nفقط خطوط دارای ssh</div></div>
<p>این یکی از مهم‌ترین کاربردهای Pipe است که کمی جلوتر می‌بینیم.</p>

<h2>۶. <code>grep -i</code></h2>
<p>به صورت عادی، <code>grep</code> به بزرگی و کوچکی حروف حساس است. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep linux file.txt</div></div>
<p>ممکن است فقط <code>linux</code> را پیدا کند. اما:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep -i linux file.txt</div></div>
<p>به Case حساس نیست و می‌تواند مواردی مثل <code>linux</code>، <code>Linux</code>، <code>LINUX</code> و <code>LiNuX</code> را پیدا کند.</p>
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">-i → Ignore Case</div></div>

<h2>۷. <code>grep -v</code></h2>
<p>گزینه <code>-v</code> نتیجه را معکوس می‌کند. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep -v root /etc/passwd</div></div>
<p>یعنی خطوطی را نشان بده که شامل الگوی <code>root</code> نیستند.</p>
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">-v → Invert Match</div></div>

<h2>۸. <code>^</code> و <code>$</code> در <code>grep</code></h2>

<h3><code>^</code></h3>
<p>یعنی ابتدای خط. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep "^root" file.txt</div></div>
<p>فقط خطوطی که با <code>root</code> شروع می‌شوند.</p>
<h3><code>$</code></h3>
<p>یعنی انتهای خط. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep "bash$" /etc/passwd</div></div>
<p>خطوطی را پیدا می‌کند که به <code>bash</code> ختم می‌شوند.</p>
<h4>مثال</h4>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">محتوای /etc/passwd</span><div class="code-block no-prompt">root:x:0:0:/root:/bin/bash\nali:x:1000:1000:/home/ali:/bin/bash\ntest:x:1001:1001:/home/test:/bin/sh</div></div>
<p>دستور:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">grep "bash$" /etc/passwd</div></div>
<p>خطوطی را پیدا می‌کند که آخرشان <code>bash</code> است.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong>
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">^text → text در ابتدای خط\ntext$ → text در انتهای خط</div></div>
</div></div>

<h2>۹. چند گزینه مهم دیگر <code>grep</code></h2>
<h3>شماره خط</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">grep -n root file.txt</div></div>
<p>شماره خط را نیز نمایش می‌دهد.</p>
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">-n → line number</div></div>
<h3>جستجوی بازگشتی</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">grep -r "Linux" directory/</div></div>
<p>در فایل‌های داخل Directory نیز جستجو می‌کند.</p>
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">-r → recursive</div></div>
<p>فعلاً لازم نیست تمام گزینه‌های <code>grep</code> را حفظ کنی. گزینه‌های مهم برای این دوره را بشناس و در صورت نیاز با <code>man grep</code> بقیه را پیدا کن.</p>

<h2>۱۰. <code>grep</code> در برابر <code>find</code></h2>
<p>یکی از مهم‌ترین تفاوت‌های آزمون:</p>
<h3><code>grep</code></h3>
<p>داخل <strong>محتوای فایل‌ها</strong> دنبال Pattern می‌گردد:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">grep "error" log.txt</div></div>
<p>یعنی داخل فایل دنبال <code>error</code> بگرد.</p>
<h3><code>find</code></h3>
<p>خود <strong>File/Directory</strong>ها را بر اساس ویژگی‌هایی مثل نام، نوع و... پیدا می‌کند:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find /var -name "*.log"</div></div>
<p>یعنی فایل‌هایی با نام مناسب را پیدا کن.</p>
<h4>مقایسه</h4>
<div class="table-wrap">
<table>
<thead><tr><th><code>grep</code></th><th><code>find</code></th></tr></thead>
<tbody>
<tr><td>جستجوی محتوا/Pattern</td><td>پیدا کردن File/Directory</td></tr>
<tr><td>روی متن خطوط کار می‌کند</td><td>روی File System جستجو می‌کند</td></tr>
<tr><td><code>grep "error" log.txt</code></td><td><code>find . -name "*.log"</code></td></tr>
</tbody>
</table>
</div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> اگر سؤال گفت «فایلی که اسمش <code>report.txt</code> است را پیدا کن» به <code>find</code> فکر کن. اگر گفت «داخل فایل‌ها دنبال کلمه <code>error</code> بگرد» به <code>grep</code> فکر کن.</div></div>

<h2>۱۱. Redirect چیست؟</h2>
<p>به طور معمول:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls</div></div>
<p>خروجی را روی Terminal می‌بینیم. اما می‌توانیم مسیر خروجی را تغییر دهیم. به این کار <strong>Redirection</strong> می‌گوییم. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls > files.txt</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">ls\n ↓\nstdout\n ↓\nfiles.txt</div></div>
<p>پس به جای Terminal، خروجی داخل فایل می‌رود.</p>

<h2>۱۲. <code>&gt;</code></h2>
<p>علامت <code>&gt;</code> برای Redirect کردن <code>stdout</code> استفاده می‌شود. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">date > date.txt</div></div>
<p>خروجی <code>date</code> داخل <code>date.txt</code> ذخیره می‌شود.</p>
<h3>نکته بسیار مهم</h3>
<p>اگر فایل از قبل وجود داشته باشد:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">date > date.txt</div></div>
<p>محتوای قبلی فایل <strong>Overwrite</strong> می‌شود. یعنی:</p>
<div class="code-container"><span class="code-label">نحوه کار</span><div class="code-block no-prompt">محتوای قبلی\n     ↓\n   حذف/جایگزین\n     ↓\nخروجی جدید</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong>
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">> → Overwrite (نه Append)</div></div>
</div></div>

<h2>۱۳. <code>&gt;&gt;</code></h2>
<p>برای اضافه کردن خروجی به انتهای فایل:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">date >> date.txt</div></div>
<p>اگر فایل وجود داشته باشد، محتوای قبلی باقی می‌ماند و خروجی جدید به انتهای آن اضافه می‌شود.</p>
<div class="code-container"><span class="code-label">نحوه کار</span><div class="code-block no-prompt">محتوای قبلی\n     +\nخروجی جدید</div></div>
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">>   → Overwrite\n>>  → Append</div></div>

<h2>۱۴. Redirect کردن Error</h2>
<p>پیام خطا در <code>stderr</code> قرار می‌گیرد. شماره آن <code>2</code> است. پس:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls /abc 2> error.txt</div></div>
<p>یعنی خطای Command را داخل <code>error.txt</code> ذخیره کن.</p>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">stdout → 1\nstderr → 2</div></div>
<p>بنابراین:</p>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block">command > output.txt\ncommand 2> error.txt</div></div>
<p>دستور اول خروجی معمولی را Redirect می‌کند؛ دستور دوم خطا را Redirect می‌کند.</p>

<h2>۱۵. <code>2&gt;&gt;</code></h2>
<p>برای Append کردن Error:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">command 2>> error.txt</div></div>
<p>یعنی خطاهای جدید را به انتهای فایل اضافه کن.</p>

<h2>۱۶. Redirect ورودی با <code>&lt;</code></h2>
<p>Redirect فقط برای خروجی نیست. می‌توانیم ورودی یک Command را نیز از فایل بگیریم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">command < file.txt</div></div>
<p>یعنی محتوای <code>file.txt</code> را به عنوان <code>stdin</code> به Command بده.</p>
<p>مدل کلی:</p>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt"><   → stdin\n>   → stdout\n2>  → stderr</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> این چهار مورد را بشناس:
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt"><   → stdin\n>   → stdout\n>>  → stdout + append\n2>  → stderr</div></div>
</div></div>

<h2>۱۷. Pipe چیست؟</h2>
<p>علامت Pipe <code>|</code> خروجی یک Command را به ورودی Command بعدی متصل می‌کند. یعنی:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">Command 1\n   │\n stdout\n   │\n   ▼\n  Pipe\n   │\n stdin\n   │\n   ▼\nCommand 2</div></div>

<h2>۱۸. مثال ساده Pipe</h2>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat users.txt | grep Amir</div></div>
<p>چه اتفاقی می‌افتد؟</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">cat users.txt\n      ↓\nخروجی فایل\n      ↓\n      |\n      ↓\ngrep Amir\n      ↓\nفقط خطوط مربوط به Amir</div></div>
<p>پس Pipe فایل نمی‌سازد. فقط <strong>stdout یک Command را به stdin Command بعدی وصل می‌کند.</strong></p>

<h2>۱۹. یک مثال واقعی</h2>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">history | grep ssh</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">history\n   ↓\nتمام History\n   ↓\ngrep ssh\n   ↓\nفقط خطوطی که ssh دارند</div></div>
<p>این یکی از مهم‌ترین الگوهای خط فرمان است.</p>

<h2>۲۰. Pipe در برابر Redirect</h2>
<p>این دو را هرگز یکی ندان.</p>
<h3>Pipe</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">command1 | command2</div></div>
<p>خروجی را به <strong>Command بعدی</strong> می‌دهد.</p>
<h3>Redirect</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">command > file</div></div>
<p>خروجی را به <strong>File</strong> می‌دهد.</p>
<div class="table-wrap">
<table>
<thead><tr><th>Pipe</th><th>Redirect</th></tr></thead>
<tbody>
<tr><td><code>|</code></td><td><code>&gt;</code></td></tr>
<tr><td>خروجی → Command بعدی</td><td>خروجی → File</td></tr>
<tr><td>برای زنجیره Commandها</td><td>برای ذخیره/تغییر مقصد جریان</td></tr>
</tbody>
</table>
</div>
<div class="box important"><i class="fas fa-star"></i><div><strong>حفظی طلایی ⭐</strong>
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">| → Command\n> → File</div></div>
</div></div>

<h2>۲۱. ترکیب Pipe و Redirect</h2>
<p>می‌توان آنها را با هم ترکیب کرد:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">history | grep ssh > ssh_commands.txt</div></div>
<p>مراحل:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">history\n   ↓\ngrep ssh\n   ↓\nssh_commands.txt</div></div>
<p>یعنی:</p>
<ol>
<li>History را بگیر.</li>
<li>فقط خطوط دارای <code>ssh</code> را نگه دار.</li>
<li>نتیجه را داخل فایل ذخیره کن.</li>
</ol>
<p>این دقیقاً همان چیزی است که در خط فرمان Linux بسیار زیاد انجام می‌دهیم.</p>

<h2>۲۲. ترتیب Commandها مهم است</h2>
<p>به این مثال توجه کن:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">command1 | command2 > result.txt</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">command1\n   ↓\ncommand2\n   ↓\nresult.txt</div></div>
<p>اما اگر جای آنها را عوض کنیم، مفهوم Commandها نیز تغییر می‌کند. پس Pipe و Redirect فقط علامت‌های تزئینی نیستند؛ <strong>جریان داده را مشخص می‌کنند.</strong></p>

<h2>۲۳. <code>sed</code></h2>
<p><code>sed</code> یک <strong>Stream Editor</strong> است. یعنی می‌تواند متن ورودی را پردازش و تغییر دهد. یکی از رایج‌ترین کاربردهای آن <strong>جایگزینی متن</strong> است.</p>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">ورودی</span><div class="code-block no-prompt">Linux is powerful.\nLinux is popular.</div></div>
<p>می‌خواهیم <code>Linux</code> را به <code>LPIC</code> تبدیل کنیم.</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sed 's/Linux/LPIC/' file.txt</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">LPIC is powerful.\nLPIC is popular.</div></div>

<h2>۲۴. ساختار <code>s</code></h2>
<p>این قسمت مهم است:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">sed 's/old/new/' file.txt</div></div>
<p>یعنی:</p>
<ul>
<li><code>s</code> → substitute</li>
<li><code>old</code> → متن قدیمی</li>
<li><code>new</code> → متن جدید</li>
</ul>
<p>پس:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed 's/Linux/LPIC/' file.txt</div></div>
<p>یعنی <code>Linux</code> را با <code>LPIC</code> جایگزین کن.</p>

<h2>۲۵. گزینه <code>g</code> در <code>sed</code></h2>
<p>به طور معمول:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed 's/Linux/LPIC/' file.txt</div></div>
<p>در هر خط، اولین مورد را جایگزین می‌کند. اگر بخواهیم <strong>تمام موارد موجود در هر خط</strong> جایگزین شوند:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed 's/Linux/LPIC/g' file.txt</div></div>
<p>اینجا <code>g</code> یعنی global.</p>
<h4>مثال</h4>
<p>ورودی:</p>
<div class="code-container"><span class="code-label">ورودی</span><div class="code-block no-prompt">Linux Linux Linux</div></div>
<p>بدون <code>g</code>:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">LPIC Linux Linux</div></div>
<p>با <code>g</code>:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">LPIC LPIC LPIC</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> در LPIC-1: <code>s</code> → substitute، <code>g</code> → global را به خوبی بشناس.</div></div>

<h2>۲۶. آیا <code>sed</code> فایل اصلی را تغییر می‌دهد؟</h2>
<p>به طور پیش‌فرض:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed 's/Linux/LPIC/' file.txt</div></div>
<p>فایل اصلی را تغییر نمی‌دهد. فقط نتیجه پردازش را روی <code>stdout</code> نمایش می‌دهد. اگر بخواهی نتیجه را در فایل دیگری ذخیره کنی:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed 's/Linux/LPIC/g' file.txt > new.txt</div></div>
<p>حالا <code>file.txt</code> اصلی و <code>new.txt</code> نتیجه جدید است.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>sed</code> به صورت پیش‌فرض فایل اصلی را تغییر نمی‌دهد.</div></div>

<h2>۲۷. <code>xargs</code></h2>
<p><code>xargs</code> در ابتدا ممکن است کمی عجیب باشد، اما ایده آن ساده است: <strong>ورودی را به Argument برای یک Command تبدیل می‌کند.</strong></p>
<p>مثلاً فرض کن این خروجی را داریم:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">file1.txt\nfile2.txt\nfile3.txt</div></div>
<p>و می‌خواهیم آنها را به یک Command بدهیم. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">printf '%s\\n' file1.txt file2.txt file3.txt | xargs echo</div></div>
<p>تقریباً به این مفهوم است:</p>
<div class="code-container"><span class="code-label">معادل</span><div class="code-block">echo file1.txt file2.txt file3.txt</div></div>
<p>پس:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">Input\n  ↓\nxargs\n  ↓\nArguments\n  ↓\nCommand</div></div>

<h2>۲۸. <code>xargs</code> در برابر Pipe</h2>
<p>این تفاوت بسیار مهم است.</p>
<h3>Pipe</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">command1 | command2</div></div>
<p>خروجی <code>command1</code> را به <strong>stdin</strong> دستور دوم می‌دهد.</p>
<h3><code>xargs</code></h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">command1 | xargs command2</div></div>
<p>خروجی <code>command1</code> را به <strong>Argument</strong>های <code>command2</code> تبدیل می‌کند.</p>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">Pipe:\nstdout → stdin\n\nxargs:\nstdout → arguments</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> اگر Command دوم انتظار دارد اطلاعات را از <strong>stdin</strong> بگیرد → <code>|</code>. اگر لازم است خروجی Command اول به شکل <strong>Argument</strong> به Command دوم داده شود → <code>xargs</code> ممکن است مناسب باشد.</div></div>

<h2>۲۹. مثال معروف <code>xargs</code></h2>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -name "*.tmp" -print0 | xargs -0 rm</div></div>
<p>مفهوم:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">find\n ↓\nفایل‌های tmp\n ↓\nxargs\n ↓\nrm file1.tmp file2.tmp ...</div></div>
<p>یعنی نام فایل‌های پیدا شده به عنوان Argument به <code>rm</code> داده می‌شوند.</p>
<h4>چرا <code>-print0</code> و <code>-0</code>؟</h4>
<p>چون نام فایل ممکن است شامل فاصله یا بعضی کاراکترهای خاص باشد. روش ساده:</p>
<div class="code-container"><span class="code-label">مثال ساده</span><div class="code-block">find . -name "*.tmp" | xargs rm</div></div>
<p>ممکن است در بعضی نام فایل‌ها مشکل ایجاد کند. روش <code>-print0</code> و <code>xargs -0</code> برای انتقال امن‌تر نام فایل‌ها مناسب‌تر است.</p>
<blockquote>برای LPIC-1 مهم است مفهوم <code>xargs</code> را بفهمی؛ لازم نیست تمام جزئیات Parsing آن را حفظ کنی.</blockquote>

<h2>۳۰. دام مهم <code>xargs</code> ⚠️</h2>
<p>این تصور اشتباه است:</p>
<div class="code-container"><span class="code-label">تصور غلط</span><div class="code-block no-prompt">xargs = Pipe</div></div>
<div class="code-container"><span class="code-label">واقعیت</span><div class="code-block no-prompt">| → stdin\nxargs → arguments</div></div>
<p>این یکی از تفاوت‌های مفهومی مهم این جلسه است.</p>

<h2>۳۱. Checksum چیست؟</h2>
<p>فرض کن یک فایل ISO چند گیگابایتی دانلود کرده‌ای. از کجا بفهمی فایل در مسیر دانلود خراب یا تغییر نکرده؟ اینجا <strong>Checksum</strong> به کار می‌آید. Checksum را می‌توان مثل یک <strong>اثر انگشت دیجیتال فایل</strong> در نظر گرفت.</p>

<h2>۳۲. <code>md5sum</code></h2>
<p>برای تولید MD5:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">md5sum file.iso</div></div>
<p>خروجی چیزی شبیه:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">d41d8cd98f00b204e9800998ecf8427e  file.iso</div></div>
<p>اگر Checksum فایل دانلودشده را با مقدار رسمی مقایسه کنیم، می‌توانیم متوجه اختلاف شویم.</p>

<h2>۳۳. <code>sha256sum</code></h2>
<p>برای SHA-256:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sha256sum file.iso</div></div>
<p>SHA-256 امروزه انتخاب بسیار مناسب‌تری برای بررسی Integrity نسبت به MD5 است.</p>
<h4>نکته مهم</h4>
<p>Checksum را می‌توان برای بررسی این موضوع استفاده کرد که <strong>آیا فایل با داده مورد انتظار مطابقت دارد یا خیر؟</strong> اما اگر هدف <strong>امنیت رمزنگاری یا جلوگیری از جعل</strong> باشد، صرفاً داشتن یک Hash کافی نیست؛ باید به منبع و روش اعتبارسنجی نیز اعتماد داشت. برای سطح LPIC-1 همین تفاوت مفهومی کافی است.</p>

<h2>۳۴. MD5 در برابر SHA-256</h2>
<div class="table-wrap">
<table>
<thead><tr><th>MD5</th><th>SHA-256</th></tr></thead>
<tbody>
<tr><td>قدیمی‌تر</td><td>جدیدتر</td></tr>
<tr><td>128-bit</td><td>256-bit</td></tr>
<tr><td>امروزه برای امنیت رمزنگاری مناسب نیست</td><td>بسیار قوی‌تر</td></tr>
<tr><td>برای برخی بررسی‌های ساده Integrity دیده می‌شود</td><td>انتخاب رایج‌تر برای Integrity</td></tr>
</tbody>
</table>
</div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> اگر سؤال پرسید کدام‌یک از این دو برای امنیت مدرن مناسب‌تر است؟ پاسخ:
<div class="code-container"><span class="code-label">پاسخ</span><div class="code-block no-prompt">SHA-256</div></div>
</div></div>

<h2>۳۵. ترکیب ابزارها</h2>
<p>قدرت واقعی Linux زمانی مشخص می‌شود که Commandها را با هم ترکیب کنیم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">history | grep ssh</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">History\n   ↓\nFilter</div></div>
<p>حالا اگر بخواهیم ذخیره کنیم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">history | grep ssh > ssh.txt</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">History\n   ↓\ngrep\n   ↓\nFile</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat file.txt | sed 's/Linux/LPIC/g'</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">File\n ↓\ncat\n ↓\nsed\n ↓\nModified Output</div></div>

<h2>۳۶. یک سناریوی واقعی</h2>
<p>فرض کن یک فایل Log بزرگ داریم به نام <code>server.log</code> و فقط خطاها را می‌خواهیم.</p>
<div class="code-container"><span class="code-label">مرحله ۱</span><div class="code-block">grep "ERROR" server.log</div></div>
<p>حالا می‌خواهیم نتیجه را ذخیره کنیم:</p>
<div class="code-container"><span class="code-label">مرحله ۲</span><div class="code-block">grep "ERROR" server.log > errors.txt</div></div>
<p>حالا می‌خواهیم فقط خطاهای مربوط به SSH را بگیریم:</p>
<div class="code-container"><span class="code-label">مرحله ۳</span><div class="code-block">grep "ERROR" server.log | grep ssh</div></div>
<p>و در نهایت ذخیره کنیم:</p>
<div class="code-container"><span class="code-label">مرحله ۴</span><div class="code-block">grep "ERROR" server.log | grep ssh > ssh_errors.txt</div></div>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">جریان نهایی</span><div class="code-block no-prompt">server.log\n    ↓\n grep ERROR\n    ↓\n grep ssh\n    ↓\nssh_errors.txt</div></div>
<p>این همان فلسفه اصلی خط فرمان است: <strong>یک ابزار کار مشخصی انجام می‌دهد؛ سپس خروجی آن را به ابزار بعدی می‌دهیم.</strong></p>

<h2>۳۷. یک سناریوی دیگر با <code>sed</code></h2>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">ورودی</span><div class="code-block no-prompt">Linux is great.\nLinux is powerful.</div></div>
<p>می‌خواهیم <code>Linux</code> را به <code>LPIC</code> تبدیل کنیم و نتیجه در فایل جدید ذخیره شود:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sed 's/Linux/LPIC/g' file.txt > new.txt</div></div>
<p>جریان:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">file.txt\n   ↓\nsed\n   ↓\nReplace\n   ↓\nnew.txt</div></div>
<p>فایل اصلی دست‌نخورده باقی می‌ماند.</p>

<h2>۳۸. جدول طلایی Commandهای جلسه</h2>
<div class="table-wrap">
<table>

<tr><td><code>sha256sum</code></td><td>تولید SHA-256</td></tr>

<div class="table-wrap">

<tbody>
<tr><td><code>0</code></td><td><code>stdin</code></td><td>ورودی</td></tr>

</div>
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">0 → in\n1 → out\n2 → error</div></div>

<h2>۴۰. مقایسه‌های طلایی جلسه</h2>
<h3><code>grep</code> در برابر <code>find</code></h3>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">grep → داخل محتوا\nfind → پیدا کردن File/Directory</div></div>
<h3>Pipe در برابر Redirect</h3>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">| → Command\n> → File</div></div>
<h3><code>&gt;</code> در برابر <code>&gt;&gt;</code></h3>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">>  → Overwrite\n>> → Append</div></div>
<h3>Pipe در برابر <code>xargs</code></h3>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">|     → stdout → stdin\nxargs → stdout → arguments</div></div>
<h3><code>sed</code> در برابر <code>grep</code></h3>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">grep → پیدا کن\nsed  → تغییر/پردازش کن</div></div>
<h3><code>md5sum</code> در برابر <code>sha256sum</code></h3>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">MD5    → قدیمی‌تر و ضعیف‌تر\nSHA256 → قوی‌تر و مناسب‌تر برای Integrity مدرن</div></div>

<h2>۴۱. دام‌های مهم امتحانی ⚠️</h2>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۱</strong> — <code>&gt;</code> فایل را Append می‌کند؟ خیر.
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">> → Overwrite\n>> → Append</div></div>
</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۲</strong> — Pipe خروجی را داخل فایل می‌ریزد؟ خیر.
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">| → Command بعدی\n> → File</div></div>
</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۳</strong> — <code>2&gt;</code> خروجی معمولی را Redirect می‌کند؟ خیر. <code>2&gt;</code> → stderr.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۴</strong> — <code>grep</code> نام فایل را جستجو می‌کند؟ به طور معمول <code>grep</code> برای جستجوی Pattern در <strong>محتوای متن</strong> است. برای پیدا کردن File/Directory بر اساس نام، <code>find</code> ابزار مناسب‌تری است.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۵</strong> — <code>sed</code> همیشه فایل اصلی را تغییر می‌دهد؟ خیر. به طور پیش‌فرض خروجی را تولید می‌کند و فایل اصلی را تغییر نمی‌دهد.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۶</strong> — <code>g</code> یعنی فقط یک بار؟ خیر. <code>g</code> → Global یعنی جایگزینی تمام Matchهای مناسب در هر خط.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۷</strong> — <code>xargs</code> همان Pipe است؟ خیر.
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">Pipe → stdin\nxargs → arguments</div></div>
</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۸</strong> — MD5 امن است؟ برای کاربردهای امنیت رمزنگاری مدرن، MD5 امن محسوب نمی‌شود. در مقایسه با MD5، SHA-256 انتخاب بسیار مناسب‌تری است.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۹</strong> — هر خروجی Command الزاماً stdout است؟ خیر. پیام‌های خطا معمولاً به <code>stderr</code> می‌روند. به همین دلیل:
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">command > output.txt</div></div>
ممکن است خروجی معمولی را ذخیره کند ولی خطا همچنان روی Terminal دیده شود.</div></div>

<h2>🧠 نقشه ذهنی جلسه</h2>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Command Output\n│\n├── Standard Streams\n│     ├── stdin  → 0\n│     ├── stdout → 1\n│     └── stderr → 2\n│\n├── grep\n│     ├── -i\n│     ├── -v\n│     ├── -n\n│     ├── -r\n│     ├── ^\n│     └── $\n│\n├── Redirect\n│     ├── <   → stdin\n│     ├── >   → stdout / Overwrite\n│     ├── >>  → stdout / Append\n│     └── 2>  → stderr\n│\n├── Pipe\n│     └── stdout → stdin\n│\n├── sed\n│     ├── s → substitute\n│     └── g → global\n│\n├── xargs\n│     └── input → arguments\n│\n└── Checksum\n      ├── md5sum\n      └── sha256sum</div></div>

<div class="code-container"><span class="code-label">جریان کلی</span><div class="code-block no-prompt">             Command\n                │\n                ▼\n              Output\n                │\n        ┌───────┼────────┐\n        │       │        │\n        ▼       ▼        ▼\n      grep     sed       >\n    Filter    Modify    File\n        │       │\n        └───┬───┘\n            │\n            ▼\n           |\n            │\n            ▼\n      Another Command\n            │\n            ▼\n          xargs\n            │\n            ▼\n        Arguments</div></div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>⚡ حفظی‌های جلسه — مرور ۲ تا ۳ دقیقه‌ای</strong>
<p>اگر فقط چند دقیقه وقت داری، این قسمت را بخوان:</p>
<h4>Standard Streams</h4>
<div class="code-container"><span class="code-label">اعداد</span><div class="code-block no-prompt">0 → stdin\n1 → stdout\n2 → stderr</div></div>
<h4><code>grep</code></h4>
<div class="code-container"><span class="code-label">گزینه‌ها</span><div class="code-block no-prompt">grep       → جستجوی Pattern\n-i         → Ignore Case\n-v         → Invert\n-n         → شماره خط\n-r         → Recursive\n^          → ابتدای خط\n$          → انتهای خط</div></div>
