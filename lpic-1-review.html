<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <!-- ============================================================
         سرصفحه (Head)
         شامل متا تگ‌ها، عنوان، فونت‌ها، آیکون‌ها و استایل‌های اصلی
         ============================================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرور LPIC-1</title>

    <!-- فونت وزیرمتن برای متن‌های فارسی -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet">
    <!-- فونت JetBrains Mono برای نمایش کدها -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 برای آیکون‌ها -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ============================================================
           بخش ۱ – متغیرهای CSS (تم روشن و تاریک)
           ============================================================ */
        :root {
            --primary: #E95420;            /* رنگ اصلی (نارنجی اوبونتو) */
            --primary-hover: #c7461a;
            --primary-soft: #fde8e0;
            --primary-glow: rgba(233, 84, 32, 0.18);

            --bg-body: #f7f7f7;
            --bg-card: #ffffff;
            --bg-navbar: rgba(255, 255, 255, 0.92);

            --text-main: #333333;
            --text-heading: #1a1a1a;
            --text-muted: #666666;

            --border: #e0e0e0;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --radius: 12px;

            --note-bg: #e8f5e9;
            --note-border: #4caf50;
            --important-bg: #e3f2fd;
            --important-border: #2196f3;
            --warning-bg: #fff8e1;
            --warning-border: #ff9800;

            --code-bg: #2c001e;
            --code-text: #eeeeee;
            --terminal-green: #8ae234;

            --sidebar-width: 300px;
        }

        /* تم تاریک – با استفاده از attribute selector */
        [data-theme="dark"] {
            --primary: #E95420;
            --primary-hover: #ff6b3d;
            --primary-soft: rgba(233, 84, 32, 0.15);
            --primary-glow: rgba(233, 84, 32, 0.2);

            --bg-body: #1e1e1e;
            --bg-card: #2a2a2a;
            --bg-navbar: rgba(42, 42, 42, 0.95);

            --text-main: #e0e0e0;
            --text-heading: #ffffff;
            --text-muted: #aaaaaa;

            --border: #404040;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);

            --note-bg: rgba(76, 175, 80, 0.12);
            --note-border: #81c784;
            --important-bg: rgba(33, 150, 243, 0.12);
            --important-border: #64b5f6;
            --warning-bg: rgba(255, 152, 0, 0.12);
            --warning-border: #ffb74d;

            --code-bg: #1a1a1a;
            --code-text: #e0e0e0;
        }

        /* ============================================================
           بخش ۲ – ریست و استایل‌های عمومی
           ============================================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            overflow-x: hidden;
            max-width: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.85;
            font-size: 16.5px;
            padding-top: 64px;          /* ارتفاع نوار بالا */
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            max-width: 100%;
        }

        /* ============================================================
           بخش ۳ – نوار ناوبری (Navbar) ثابت در بالا
           ============================================================ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-navbar);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            white-space: nowrap;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
        }

        .nav-spacer {
            flex: 1;          /* فضای خالی بین برند و دکمه تم */
        }

        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .theme-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        /* ============================================================
           بخش ۴ – نوار پیشرفت (Progress Bar)
           ============================================================ */
        .progress-track {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            z-index: 999;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #ff7a45);
            width: 0%;
            transition: width 0.12s;
        }

        /* ============================================================
           بخش ۵ – نوار کناری (Sidebar) شامل فهرست مطالب
           ============================================================ */
        .sidebar {
            position: fixed;
            top: 60px;
            right: 0;
            width: var(--sidebar-width);
            height: calc(100vh - 60px);
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            z-index: 900;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.06);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg-card);
            z-index: 2;
        }

        .sidebar-header h3 {
            font-size: 1rem;
            color: var(--text-heading);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-header h3 i {
            color: var(--primary);
        }

        .sidebar-close {
            display: none;        /* در موبایل نمایش داده می‌شود */
            background: none;
            border: none;
            font-size: 1.15rem;
            color: var(--text-muted);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: 0.2s;
        }
        .sidebar-close:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }

        /* ============================================================
           بخش ۶ – استایل فهرست مطالب (TOC)
           ============================================================ */
        .toc {
            padding: 8px 0 30px;
        }

        .toc-chapter {
            border-bottom: 1px solid var(--border);
        }
        .toc-chapter:last-child {
            border-bottom: none;
        }

        .toc-chapter summary {
            padding: 12px 14px;
            font-weight: 600;
            color: var(--text-heading);
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: background 0.2s;
            user-select: none;
            font-size: 0.92rem;
            line-height: 1.4;
        }
        .toc-chapter summary::-webkit-details-marker {
            display: none;
        }

        /* فلش باز/بسته شدن */
        .toc-chapter summary::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            margin-right: auto;
            margin-top: 2px;
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: transform 0.25s;
            flex-shrink: 0;
        }
        .toc-chapter[open] summary::after {
            transform: rotate(180deg);
        }

        .toc-chapter summary:hover {
            background: var(--primary-soft);
        }
        .toc-chapter[open] > summary {
            background: var(--primary-soft);
            color: var(--primary);
        }

        .chapter-num {
            width: 24px;
            height: 24px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .toc-sections {
            list-style: none;
            padding: 0 0 8px 0;
            margin: 0;
            background: var(--bg-body);
        }

        .toc-sections li a {
            display: block;
            padding: 8px 14px 8px 48px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.18s;
            border-right: 3px solid transparent;
            line-height: 1.45;
        }
        .toc-sections li a:hover {
            color: var(--primary);
            background: var(--primary-soft);
        }
        .toc-sections li a.active {
            color: var(--primary);
            background: var(--primary-soft);
            border-right-color: var(--primary);
            font-weight: 600;
        }

        /* ============================================================
           بخش ۷ – دکمه باز کردن سایدبار (در موبایل) و اوورلی
           ============================================================ */
        .sidebar-toggle {
            display: none;          /* فقط در موبایل نشان داده می‌شود */
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            font-size: 1.25rem;
            box-shadow: 0 6px 20px var(--primary-glow);
            z-index: 950;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }
        .sidebar-toggle:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 850;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.open {
            display: block;
        }

        /* ============================================================
           بخش ۸ – محتوای اصلی (Main)
           ============================================================ */
        .main {
            max-width: 820px;
            margin: 0 auto;
            margin-right: calc(var(--sidebar-width) + 24px);
            padding: 32px 24px 80px;
            transition: margin 0.3s;
            min-width: 0;
            width: 100%;
            overflow-x: hidden;
        }

        /* هر بخش (section) به صورت پیش‌فرض مخفی است */
        .section {
            display: none;
            animation: fadeIn 0.35s ease;
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }
        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           بخش ۹ – هدر هر بخش (عنوان، شماره، متا)
           ============================================================ */
        .section-header {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }
        .section-header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background: var(--primary);
        }

        .section-badge {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .section-header h1 {
            font-size: 1.3rem;
            color: var(--text-heading);
            margin-bottom: 3px;
        }
        .section-header .meta {
            font-size: 0.84rem;
            color: var(--text-muted);
        }

        /* ============================================================
           بخش ۱۰ – تایپوگرافی محتوا (عنوان‌ها، پاراگراف‌ها، لیست‌ها و ...)
           ============================================================ */
        h2 {
            color: var(--text-heading);
            font-size: 1.2rem;
            margin: 28px 0 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            flex-shrink: 0;
        }

        h3 {
            color: var(--text-heading);
            font-size: 1.05rem;
            margin: 18px 0 8px;
        }

        p {
            margin-bottom: 14px;
            text-align: justify;
        }

        strong {
            color: var(--text-heading);
        }

        ul,
        ol {
            margin: 10px 0 18px;
            padding-right: 22px;
        }
        li {
            margin-bottom: 6px;
        }

        blockquote {
            background: var(--primary-soft);
            border-right: 4px solid var(--primary);
            padding: 14px 18px;
            margin: 20px 0;
            border-radius: 0 10px 10px 0;
            color: var(--text-heading);
            font-style: italic;
        }

        /* ============================================================
           بخش ۱۱ – جعبه‌های اطلاعاتی (نکته، مهم، هشدار)
           ============================================================ */
        .box {
            display: flex;
            gap: 14px;
            padding: 16px 18px;
            border-radius: 10px;
            margin: 22px 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            max-width: 100%;
            min-width: 0;
            overflow-x: hidden;
            overflow-wrap: break-word;
        }

        .box > div {
            min-width: 0;
            flex: 1;
            overflow-wrap: break-word;
        }
        .box i {
            font-size: 1.3rem;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .box strong {
            display: block;
            margin-bottom: 3px;
        }

        .box.note {
            background: var(--note-bg);
            border-color: var(--note-border);
        }
        .box.note i,
        .box.note strong {
            color: var(--note-border);
        }

        .box.important {
            background: var(--important-bg);
            border-color: var(--important-border);
        }
        .box.important i,
        .box.important strong {
            color: var(--important-border);
        }

        .box.warning {
            background: var(--warning-bg);
            border-color: var(--warning-border);
        }
        .box.warning i,
        .box.warning strong {
            color: var(--warning-border);
        }

        /* ============================================================
           بخش ۱۲ – نمایش کدها (Code Blocks)
           ============================================================ */
        .code-container {
            position: relative;
            margin: 24px 0;
            max-width: 100%;
            min-width: 0;
            width: 100%;
        }

        .code-label {
            position: absolute;
            top: -11px;
            left: 14px;
            background: var(--primary);
            color: #fff;
            font-size: 0.72rem;
            padding: 2px 12px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            z-index: 1;
        }

        .code-block {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 28px 18px 18px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            direction: ltr;
            text-align: left;
            unicode-bidi: isolate;
            white-space: pre;
            overflow-x: auto;
            border: 1px solid var(--border);
            max-width: 100%;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
        }

        /* جمع‌بندی‌ها و خطوط دو زبانه روی موبایل داخل کادر بمانند */
        .summary-box,
        .summary-box .code-container,
        .summary-box .code-block,
        .box .code-container,
        .box .code-block {
            max-width: 100%;
            min-width: 0;
        }

        code, .section code {
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        /* پرامپت $ برای خطوط فرمان */
        .code-block::before {
            content: '$ ';
            color: var(--terminal-green);
        }
        .code-block.no-prompt::before {
            content: none;
        }

        /* ============================================================
           بخش ۱۳ – جدول‌ها
           ============================================================ */
        .table-wrap {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 22px 0;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .table-wrap table {
            margin: 0;
            border: none;
            border-radius: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 22px 0;
            font-size: 0.93rem;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            min-width: 0;
        }

        th,
        td {
            border: 1px solid var(--border);
            padding: 11px 14px;
            text-align: right;
            vertical-align: top;
        }

        th {
            background: var(--primary-soft);
            color: var(--text-heading);
            font-weight: 600;
            white-space: nowrap;
        }

        tr:hover td {
            background: var(--bg-body);
        }

        td code {
            white-space: nowrap;
        }

        /* ============================================================
           بخش ۱۴ – جزئیات قابل باز و بسته شدن (details)
           ============================================================ */
        details.content-details {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            margin: 18px 0;
        }
        details.content-details summary {
            font-weight: 600;
            color: var(--text-heading);
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        details.content-details summary::-webkit-details-marker {
            display: none;
        }
        details.content-details[open] summary {
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border);
        }

        /* ============================================================
           بخش ۱۵ – کارت‌های آزمون (Quiz)
           ============================================================ */
        .quiz-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
            margin: 28px 0 16px;
            box-shadow: var(--shadow);
        }

        .quiz-card>p {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-heading);
            margin-bottom: 16px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quiz-options button {
            background: var(--bg-body);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            text-align: right;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.2s;
        }
        .quiz-options button:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        .quiz-options button.selected {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .quiz-answer {
            display: none;
            margin-top: 14px;
            padding: 14px 16px;
            background: var(--note-bg);
            border-radius: 10px;
            border-right: 4px solid var(--note-border);
            color: var(--text-heading);
            font-size: 0.95rem;
        }
        .quiz-answer.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        /* ============================================================
           بخش ۱۶ – حالت placeholder برای بخش‌های خالی
           ============================================================ */
        .placeholder {
            text-align: center;
            color: var(--text-muted);
            padding: 48px 20px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px dashed var(--border);
        }
        .placeholder i {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 14px;
            opacity: 0.7;
            display: block;
        }

        /* ============================================================
           بخش ۱۷ – دکمه‌های ناوبری بین بخش‌ها
           ============================================================ */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            gap: 12px;
        }

        .nav-btn {
            padding: 11px 22px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 24px;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 4px 14px var(--primary-glow);
        }
        .nav-btn:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }
        .nav-btn:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* ============================================================
           بخش ۱۸ – جعبه جمع‌بندی (Summary Box)
           ============================================================ */
        .summary-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            margin: 24px 0;
            box-shadow: var(--shadow);
            max-width: 100%;
            min-width: 0;
            overflow-x: hidden;
            overflow-wrap: break-word;
        }
        .summary-box h3 {
            margin-top: 0;
            color: var(--primary);
        }

        /* ============================================================

<div class="section-header">

    <div>
        <h1>نقشه راه لینوکس و خط فرمان</h1>
        <div class="meta">دوره مرور LPIC-1 · جلسه ۱ از ۱۰</div>

<blockquote><strong>آنچه در این جلسه مرور می‌کنیم:</strong> Linux، Kernel، Shell، Terminal، Command، ساختار فایل‌ها و مسیرها، pwd، cd، ls، ساخت فایل و پوشه، مشاهده فایل‌ها، Variables، History، Help (man، info، --help).</blockquote>

<h2>قبل از شروع...</h2>
<p>یک سؤال: وقتی داخل ترمینال می‌نویسی <code>ls</code> چه اتفاقی می‌افتد؟</p>
<p>اکثر افراد جواب می‌دهند: <q>فایل‌ها نمایش داده می‌شوند.</q></p>
<p>درست است... اما <strong>در پشت صحنه</strong> چه اتفاقی افتاد؟ اگر این را بفهمی، نصف خط فرمان لینوکس را فهمیده‌ای.</p>

<h2>Linux چیست؟</h2>
<p>Linux در واقع <strong>سیستم‌عامل</strong> است. وظیفه سیستم‌عامل این است که بین <strong>کاربر</strong> و <strong>سخت‌افزار</strong> واسطه باشد. مثلاً وقتی برنامه‌ای می‌خواهد فایل بخواند، خودش مستقیماً به هارد دسترسی ندارد؛ اول از سیستم‌عامل درخواست می‌کند و سیستم‌عامل این درخواست را بررسی کرده و نتیجه را برمی‌گرداند.</p>
<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">کاربر\n   │\nبرنامه\n   │\nسیستم عامل\n   │\nسخت افزار</div></div>

<h2>Kernel چیست؟</h2>
<p>کرنل (Kernel) مهم‌ترین بخش لینوکس است. اگر لینوکس را یک شهر فرض کنیم، کرنل مثل <strong>شهردار شهر</strong> است. همه چیز باید از او اجازه بگیرد: استفاده از RAM، CPU، نوشتن روی دیسک، خواندن فایل، استفاده از کارت شبکه، اتصال فلش و ... . بدون Kernel، لینوکس اصلاً کار نمی‌کند.</p>
<p>وقتی دستور <code>cat file.txt</code> را اجرا می‌کنی، خود دستور نمی‌تواند فایل را بخواند؛ او از Kernel درخواست می‌کند فایل را برایش بخواند و Kernel فایل را از دیسک خوانده و نتیجه را به <code>cat</code> می‌دهد.</p>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> Kernel تنها بخشی از سیستم‌عامل است که مستقیماً با سخت‌افزار ارتباط دارد.</div></div>

<h2>Shell چیست؟</h2>
<p>کاربر مستقیماً با Kernel صحبت نمی‌کند؛ بین آن‌ها یک واسطه وجود دارد به نام <strong>Shell</strong>. Shell دستورات ما را می‌گیرد (مثلاً <code>mkdir test</code>)، آن را بررسی کرده و اگر درست باشد، از Kernel می‌خواهد پوشه را بسازد.</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">User\n ↓\nShell\n ↓\nKernel\n ↓\nHardware</div></div>
<p>معروف‌ترین Shellها: <code>bash</code>، <code>sh</code>، <code>zsh</code>، <code>fish</code>. در LPIC بیشتر با <strong>bash</strong> سروکار داریم.</p>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> Shell یک <strong>Command Interpreter</strong> است؛ یعنی دستورات را تفسیر می‌کند.</div></div>

<h2>Terminal چیست؟</h2>
<p>بعضی افراد Shell و Terminal را یکی می‌دانند، اما اشتباه است. Terminal فقط <strong>پنجره‌ای</strong> است که داخل آن Shell اجرا می‌شود. مانند Windows Terminal که داخل آن PowerShell یا CMD اجرا می‌شود. در لینوکس نیز GNOME Terminal داخل آن bash اجرا می‌شود.</p>
<p><strong>تفاوت:</strong> Terminal = پنجره، Shell = برنامه‌ای که دستورها را اجرا می‌کند.</p>

<h2>Command چیست؟</h2>
<p>Command یعنی دستور؛ مانند <code>ls</code>، <code>pwd</code>، <code>mkdir</code>. Shell این دستورها را اجرا می‌کند.</p>

<h3>جمع‌بندی مفاهیم اصلی</h3>
<div class="code-container"><span class="code-label">چرخه</span><div class="code-block no-prompt">کاربر\n   │\nTerminal\n   │\nShell\n   │\nKernel\n   │\nHardware</div></div>
<p>اگر این شکل را یادت بماند، نصف مفاهیم پایه لینوکس را بلدی.</p>

<h2>ساختار فایل‌ها در لینوکس</h2>
<p>در ویندوز معمولاً <code>C:</code>، <code>D:</code> و ... را می‌بینی، اما در لینوکس فقط <strong>یک ریشه (Root)</strong> به نام <code>/</code> وجود دارد و همه چیز از همین نقطه شروع می‌شود.</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">/\n├── home\n├── etc\n├── var\n├── usr\n├── boot</div></div>
<p>مثلاً خانه کاربر Amir: <code>/home/amir</code> و پوشه Documents: <code>/home/amir/Documents</code>.</p>

<h2>مسیر (Path)</h2>
<p>Path یعنی آدرس، مانند آدرس خانه. دو نوع Path داریم:</p>
<ul>
<li><strong>Absolute Path</strong> – از ریشه شروع می‌شود: <code>/home/amir/file.txt</code> (همیشه با <code>/</code> شروع می‌شود).</li>
<li><strong>Relative Path</strong> – از محل فعلی شروع می‌شود: اگر داخل <code>/home/amir</code> باشی، می‌توانی بنویسی <code>Documents/file.txt</code>.</li>
</ul>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> <code>/</code> ریشه سیستم است، اما <code>~</code> خانه (Home) کاربر فعلی است.</div></div>

<h2>دستور pwd</h2>
<p>مخفف <strong>Print Working Directory</strong> و به معنی «الآن کجا هستم؟» است.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">pwd</div></div>
<p>خروجی نمونه: <code>/home/amir</code></p>

<h2>دستور cd</h2>
<p>مخفف <strong>Change Directory</strong> برای تغییر پوشه.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cd Documents</div></div>
<table>
<thead><tr><th>دستور</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>cd</code> یا <code>cd ~</code></td><td>رفتن به Home</td></tr>
<tr><td><code>cd ..</code></td><td>یک پوشه بالاتر</td></tr>
<tr><td><code>cd /</code></td><td>رفتن به Root</td></tr>
<tr><td><code>cd -</code></td><td>بازگشت به آخرین مسیر قبلی</td></tr>
</tbody>
</table>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>cd ..</code> یعنی یک پوشه بالاتر، اما <code>cd -</code> یعنی برگشت به آخرین مسیر قبلی.</div></div>

<h2>دستور ls</h2>
<p>نمایش محتویات پوشه.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls</div></div>
<table>
<thead><tr><th>دستور</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>ls -l</code></td><td>نمایش جزئیات</td></tr>
<tr><td><code>ls -a</code></td><td>نمایش فایل‌های مخفی</td></tr>
<tr><td><code>ls -lh</code></td><td>نمایش خواناتر حجم فایل‌ها</td></tr>
<tr><td><code>ls -R</code></td><td>نمایش بازگشتی زیرپوشه‌ها</td></tr>
</tbody>
</table>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> فایل‌هایی که با <code>.</code> شروع می‌شوند، <strong>مخفی (Hidden)</strong> هستند؛ مانند <code>.bashrc</code> و <code>.profile</code>.</div></div>

<h2>ساخت فایل و پوشه</h2>
<h3>ساخت پوشه</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">mkdir test</div></div>
<p>ساخت چند پوشه: <code>mkdir dir1 dir2 dir3</code></p>
<p>ساخت مسیر کامل: <code>mkdir -p a/b/c</code></p>
<h3>ساخت فایل</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">touch file.txt</div></div>
<p><strong>تفاوت:</strong> <code>mkdir</code> پوشه می‌سازد، <code>touch</code> فایل خالی می‌سازد یا زمان آخرین تغییر فایل را به‌روز می‌کند.</p>

<h2>مشاهده فایل‌ها</h2>
<table>
<thead><tr><th>دستور</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>cat file.txt</code></td><td>نمایش کل فایل</td></tr>
<tr><td><code>head file.txt</code></td><td>چند خط اول</td></tr>
<tr><td><code>tail file.txt</code></td><td>چند خط آخر</td></tr>
<tr><td><code>less file.txt</code></td><td>مرور صفحه‌به‌صفحه</td></tr>
</tbody>
</table>

<h2>Variables (مرور سریع)</h2>
<p>Variable محلی برای نگهداری یک مقدار است.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">name=Ali\necho $name</div></div>
<p>مشاهده متغیرهای محیطی: <code>env</code></p>
<p>یکی از مهم‌ترین متغیرها: <code>echo $PATH</code> که به Shell می‌گوید برنامه‌ها را در چه مسیرهایی جستجو کند.</p>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> برای دسترسی به مقدار یک Variable از علامت <code>$</code> استفاده می‌شود.</div></div>

<h2>History</h2>
<p>Shell دستورات قبلی را نگه می‌دارد.</p>
<div class="code-container"><span class="code-label">دستورات</span><div class="code-block">history      # نمایش تاریخچه\n!!           # اجرای دوباره آخرین دستور\n!15          # اجرای دستور شماره ۱۵</div></div>

<h2>Help</h2>
<p>سه روش مهم برای گرفتن راهنما:</p>
<div class="code-container"><span class="code-label">روش‌ها</span><div class="code-block">command --help\nman command\ninfo command</div></div>
<table>
<thead><tr><th>دستور</th><th>مناسب برای</th></tr></thead>
<tbody>
<tr><td><code>--help</code></td><td>یادآوری سریع گزینه‌ها</td></tr>
<tr><td><code>man</code></td><td>مستندات استاندارد و کامل</td></tr>
<tr><td><code>info</code></td><td>توضیحات مفصل‌تر و ساختاریافته</td></tr>
</tbody>
</table>

<h2>نقشه ذهنی جلسه</h2>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Linux\n│\n├── Kernel\n│\n├── Shell\n│\n├── Terminal\n│\n├── Command\n│\n├── Path\n│     ├── Absolute\n│     └── Relative\n│\n├── Commands\n│     ├── pwd\n│     ├── cd\n│     ├── ls\n│     ├── mkdir\n│     ├── touch\n│     ├── cat\n│     ├── head\n│     ├── tail\n│     └── less\n│\n├── Variables\n│\n├── History\n│\n└── Help</div></div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>چک‌لیست مرور ۲ دقیقه‌ای ✅</strong>
اگر بتوانی بدون نگاه کردن به جزوه به این سؤال‌ها جواب بدهی، این جلسه را مرور کرده‌ای:
<ul>
<li>تفاوت <strong>Linux، Kernel، Shell و Terminal</strong> چیست؟</li>
<li>چرا کاربر مستقیماً با Kernel صحبت نمی‌کند؟</li>
<li>تفاوت <strong>Absolute Path</strong> و <strong>Relative Path</strong> چیست؟</li>
<li>تفاوت <code>/</code> و <code>~</code> چیست؟</li>
<li><code>pwd</code>، <code>cd</code> و <code>ls</code> هر کدام چه کاری انجام می‌دهند؟</li>
<li>تفاوت <code>mkdir</code> و <code>touch</code> چیست؟</li>
<li>تفاوت <code>cat</code>، <code>head</code>، <code>tail</code> و <code>less</code> چیست؟</li>

</ul>
<p>این جلسه پایه‌ی همه‌ی جلسات بعدی است؛ اگر این مفاهیم را خوب درک کنی، مباحثی مثل <code>grep</code>، <code>pipe</code>، اسکریپت‌نویسی و مدیریت سیستم در ادامه خیلی راحت‌تر قابل فهم خواهند بود.</p>
</div></div>

<div class="section-header">
    <div class="section-badge">۲</div>
    <div>
        <h1>پردازش متن و دستورات پرکاربرد</h1>
        <div class="meta">دوره مرور LPIC-1 · جلسه ۲ از ۱۰</div>
    </div>
</div>

<blockquote><strong>هدف این جلسه:</strong> یاد بگیریم چگونه خروجی یک دستور را بگیریم، آن را فیلتر کنیم، به دستور دیگری بدهیم و در نهایت فقط اطلاعاتی که لازم داریم را استخراج کنیم.</blockquote>

<h2>قبل از شروع...</h2>
<p>فرض کن دستور <code>ls -l</code> را اجرا می‌کنی و خروجی زیر را داری:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">-rw-r--r-- file1.txt\n-rw-r--r-- file2.txt\ndrwxr-xr-x test\n-rw-r--r-- report.pdf\n-rw-r--r-- image.jpg</div></div>
<p>اما تو فقط می‌خواهی فایل PDF را ببینی. لینوکس ابزارهایی دارد که خروجی را <strong>فیلتر</strong> می‌کنند. از اینجا مبحث امروز شروع می‌شود.</p>

<h2>grep</h2>
<p>یکی از مهم‌ترین دستورهای LPIC-1. <strong>grep یعنی جستجو داخل متن.</strong> فرض کن یک کتاب هزار صفحه‌ای داری؛ به جای اینکه همه را بخوانی، فقط دنبال کلمه <strong>Linux</strong> می‌گردی. <code>grep</code> دقیقاً همین کار را انجام می‌دهد.</p>

<h3>مثال</h3>
<div class="code-container"><span class="code-label">فایل users.txt</span><div class="code-block no-prompt">Ali\nSara\nReza\nAmir</div></div>
<div class="code-container"><span class="code-label">جستجو</span><div class="code-block">grep Amir users.txt</div></div>
<p>خروجی: <code>Amir</code></p>

<h3>مهم‌ترین گزینه‌ها</h3>
<ul>
<li><strong>بدون حساسیت به بزرگی و کوچکی حروف</strong> – <code>grep -i linux file.txt</code> (پیدا می‌کند: linux، Linux، LINUX، LiNuX)</li>
<li><strong>برعکس جستجو</strong> – <code>grep -v root /etc/passwd</code> یعنی هر خطی که <code>root</code> نیست.</li>
<li><strong>جستجو از انتهای خط</strong> – <code>grep "sh$" /etc/passwd</code> (علامت <code>$</code> یعنی آخر خط)</li>
<li><strong>جستجو از ابتدای خط</strong> – <code>grep "^root" /etc/passwd</code> (علامت <code>^</code> یعنی ابتدای خط)</li>
</ul>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> <code>grep</code> داخل <strong>محتوای فایل</strong> جستجو می‌کند، نه اسم فایل. اگر بخواهی فایل‌ها را پیدا کنی از <code>find</code> استفاده می‌کنی.</div></div>

<h2>Redirect</h2>
<p>تا اینجا خروجی همه دستورها روی صفحه نمایش می‌آمد. اما اگر بخواهیم آن را داخل فایل ذخیره کنیم، از Redirect استفاده می‌کنیم.</p>

<h3><code>&gt;</code> – ذخیره خروجی (Overwrite)</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls > files.txt</div></div>
<p>اگر فایل وجود داشته باشد، کاملاً پاک می‌شود و خروجی جدید جایگزین می‌شود.</p>

<h3><code>&gt;&gt;</code> – اضافه کردن به انتهای فایل (Append)</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">date >> log.txt</div></div>

<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>تفاوت</strong> <code>&gt;</code> = بازنویسی (Overwrite) · <code>&gt;&gt;</code> = اضافه‌کردن (Append)</div></div>

<h3>Redirect خطا (STDERR)</h3>
<p>گاهی دستور خطا می‌دهد. مثلاً:</p>
<div class="code-container"><span class="code-label">خطا</span><div class="code-block">ls abc</div></div>
<p>برای ذخیره خطا در فایل:</p>
<div class="code-container"><span class="code-label">ذخیره خطا</span><div class="code-block">ls abc 2> error.txt</div></div>
<p>اضافه کردن خطا: <code>2&gt;&gt;</code></p>

<table>
<thead><tr><th>نام</th><th>شماره</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td>STDIN</td><td>0</td><td>ورودی</td></tr>
<tr><td>STDOUT</td><td>1</td><td>خروجی معمولی</td></tr>
<tr><td>STDERR</td><td>2</td><td>پیام خطا</td></tr>
</tbody>
</table>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> <code>&gt;</code> فقط STDOUT را منتقل می‌کند؛ <code>2&gt;</code> فقط STDERR را.</div></div>

<h2>Pipe (<code>|</code>)</h2>
<p>یکی از زیباترین ویژگی‌های لینوکس. Pipe خروجی یک دستور را به عنوان ورودی دستور بعدی می‌دهد.</p>

<p>فرض کن کارخانه‌ای داری که هر دستگاه خروجی دستگاه قبلی را می‌گیرد. Pipe دقیقاً همین است.</p>

<h3>مثال</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat users.txt | grep Amir</div></div>
<p>مراحل: <code>cat</code> فایل را خواند → خروجی را به <code>grep</code> داد → <code>grep</code> فقط Amir را نشان داد.</p>

<div class="code-container"><span class="code-label">مثال دیگر</span><div class="code-block">history | grep ssh</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> Pipe فایل نمی‌سازد؛ فقط خروجی یک دستور را ورودی دستور بعدی می‌کند.</div></div>

<h2>ترکیب Pipe و Redirect</h2>
<p>می‌توان هر دو را با هم استفاده کرد.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">history | grep ssh > ssh_commands.txt</div></div>

<h2>sed</h2>
<p>sed یک ویرایشگر متن است، اما معمولاً برای <strong>جایگزینی متن</strong> استفاده می‌شود.</p>

<h3>مثال</h3>
<p>داخل فایل نوشته شده <code>Linux</code>؛ می‌خواهیم همه <code>Linux</code>ها تبدیل شوند به <code>LPIC</code>:</p>
<div class="code-container"><span class="code-label">جایگزینی</span><div class="code-block">sed 's/Linux/LPIC/' file.txt</div></div>
<p>برای جایگزینی همه موارد در هر خط:</p>
<div class="code-container"><span class="code-label">همه موارد</span><div class="code-block">sed 's/Linux/LPIC/g'</div></div>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> sed به طور پیش‌فرض فایل اصلی را تغییر نمی‌دهد و فقط خروجی جدید را نمایش می‌دهد.</div></div>

<h2>xargs</h2>
<p>اولین باری که همه با آن گیج می‌شوند، ولی در واقع ساده است.</p>
<p>فرض کن خروجی زیر را داری: <code>file1 file2 file3</code>. حالا می‌خواهی همه را حذف کنی. <code>rm</code> خروجی دستور قبلی را نمی‌گیرد. اینجا <code>xargs</code> کمک می‌کند.</p>

<h3>مثال</h3>
<div class="code-container"><span class="code-label">حذف فایل‌های tmp</span><div class="code-block">find . -name "*.tmp" | xargs rm</div></div>
<p>ترجمه فارسی: ۱. تمام فایل‌های tmp را پیدا کن. ↓ ۲. اسم آن‌ها را به <code>rm</code> بده. ↓ ۳. <code>rm</code> حذفشان کند.</p>
<p><strong>تعریف ساده:</strong> <code>xargs</code> خروجی یک دستور را به آرگومان دستور بعدی تبدیل می‌کند.</p>

<h2>Checksum</h2>
<p>Checksum یک اثر انگشت برای فایل می‌سازد. اگر دو فایل Checksum برابر داشته باشند، محتوایشان یکسان است.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">md5sum file.iso\nsha256sum file.iso</div></div>
<p><strong>کاربرد:</strong> بعد از دانلود ISO لینوکس برای اطمینان از سالم بودن فایل.</p>

<h2>تفاوت ابزارها</h2>
<table>
<thead><tr><th>دستور</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>grep</code></td><td>جستجو داخل متن</td></tr>
<tr><td><code>|</code> (Pipe)</td><td>انتقال خروجی به دستور بعد</td></tr>
<tr><td><code>&gt;</code> / <code>&gt;&gt;</code> (Redirect)</td><td>ذخیره خروجی در فایل</td></tr>
<tr><td><code>sed</code></td><td>جایگزینی یا ویرایش متن</td></tr>
<tr><td><code>xargs</code></td><td>تبدیل خروجی به آرگومان</td></tr>
<tr><td><code>md5sum</code></td><td>ساخت Checksum</td></tr>
<tr><td><code>sha256sum</code></td><td>ساخت Checksum قوی‌تر</td></tr>
</tbody>
</table>

<h2>یک مثال واقعی</h2>
<p>پیدا کردن همه کاربران Bash و ذخیره در فایل:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat /etc/passwd | grep "bash$" > bash_users.txt</div></div>

<p>پیدا کردن فایل‌های Log و حذف آن‌ها:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -name "*.log" | xargs rm</div></div>

<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام‌های امتحانی ⚠️</strong>
<ul>
<li><strong>grep یا find؟</strong> <code>grep</code> داخل فایل جستجو می‌کند؛ <code>find</code> دنبال فایل می‌گردد.</li>
<li><strong>Pipe یا Redirect؟</strong> Pipe خروجی را به دستور بعدی می‌دهد؛ Redirect خروجی را داخل فایل ذخیره می‌کند.</li>
<li><strong>&gt; یا &gt;&gt;؟</strong> <code>&gt;</code> بازنویسی (Overwrite)؛ <code>&gt;&gt;</code> اضافه‌کردن (Append).</li>
<li><strong>md5 یا sha256؟</strong> SHA256 امن‌تر و امروزی‌تر است.</li>
</ul>
</div></div>

<h2>نقشه ذهنی جلسه</h2>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Text Processing\n│\n├── grep\n│      ├── -i\n│      ├── -v\n│      ├── ^\n│      └── $\n│\n├── Redirect\n│      ├── &gt;\n│      ├── &gt;&gt;\n│      └── 2&gt;\n│\n├── Pipe |\n│\n├── sed\n│\n├── xargs\n│\n└── Checksum\n       ├── md5sum\n       └── sha256sum</div></div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>چک‌لیست مرور ۲ دقیقه‌ای ✅</strong>
اگر بتوانی به این سؤال‌ها جواب بدهی، این جلسه را خوب مرور کرده‌ای:
<ul>
<li>تفاوت <strong><code>grep</code></strong> و <strong><code>find</code></strong> چیست؟</li>
<li>تفاوت <strong><code>&gt;</code></strong> و <strong><code>&gt;&gt;</code></strong> چیست؟</li>
<li>تفاوت <strong>Pipe (<code>|</code>)</strong> و <strong>Redirect (<code>&gt;</code>)</strong> چیست؟</li>
<li><code>2&gt;</code> چه چیزی را ذخیره می‌کند؟</li>
<li><code>grep -i</code>، <code>grep -v</code>، <code>^</code> و <code>$</code> چه کاربردی دارند؟</li>
<li><code>sed</code> به طور پیش‌فرض فایل اصلی را تغییر می‌دهد یا فقط خروجی را نمایش می‌دهد؟</li>
<li><code>xargs</code> چه مشکلی را حل می‌کند؟</li>
<li>Checksum چیست و چرا از <code>sha256sum</code> بیشتر از <code>md5sum</code> استفاده می‌شود؟</li>
</ul>
<p><strong>نکته مهم:</strong> در LPIC-1 حفظ کردن دستورها کافی نیست. سعی کن همیشه در ذهنت این زنجیره را ببینی: <strong>دستور → خروجی → فیلتر → انتقال → ذخیره</strong>. اگر این جریان را درک کنی، بخش بزرگی از کار با خط فرمان برایت طبیعی و قابل پیش‌بینی می‌شود.</p>
</div></div>

"s3": `
<div class="section-header">
    <div class="section-badge">۳</div>
    <div>
        <h1>مدیریت نرم‌افزار و Processها</h1>
        <div class="meta">دوره مرور LPIC-1 · جلسه ۳ از ۱۰</div>
    </div>
</div>

<blockquote><strong>هدف این جلسه:</strong> بفهمیم برنامه‌ها در لینوکس چگونه نصب می‌شوند، Process چیست، چگونه آن را ببینیم، مدیریت کنیم و در صورت نیاز متوقف کنیم.</blockquote>

<h2>قبل از شروع...</h2>
<p>فرض کن روی لینوکس می‌خواهی <strong>Firefox</strong> نصب کنی، یا <strong>tmux</strong> را اجرا کنی، یا برنامه‌ای هنگ کرده و باید آن را ببندی. همه این‌ها به دو موضوع مربوط می‌شوند: مدیریت نرم‌افزار (Software Management) و مدیریت Processها.</p>

<h2>نرم‌افزار در لینوکس چگونه نصب می‌شود؟</h2>
<p>در ویندوز معمولاً <code>setup.exe</code> را دانلود کرده و Next می‌زنید، اما در لینوکس برنامه‌ها معمولاً از <strong>Repository</strong> نصب می‌شوند.</p>

<h3>Repository چیست؟</h3>
<p>Repository را مثل <strong>فروشگاه رسمی برنامه‌ها</strong> تصور کن. همان‌طور که گوشی اندروید Google Play دارد، لینوکس هم مخزن نرم‌افزار دارد. وقتی می‌نویسی:</p>
<div class="code-container"><span class="code-label">نصب</span><div class="code-block">sudo apt install nginx</div></div>
<p>در واقع: کامپیوتر → Repository → دانلود → نصب</p>
<p><strong>مزیت Repository:</strong> نسخه‌های تست‌شده، نصب آسان، به‌روزرسانی آسان، مدیریت وابستگی‌ها (Dependencies).</p>

<h2>Package چیست؟</h2>
<p>برنامه‌ها در لینوکس معمولاً داخل <strong>Package</strong> قرار دارند. Package یعنی یک فایل که برنامه + اطلاعات نصب + وابستگی‌ها را در خود دارد. مثل یک جعبه آماده.</p>

<h3>دو خانواده مهم</h3>
<ul>
<li><strong>Debian</strong> – <code>.deb</code> – مدیر بسته: <code>apt</code> و <code>dpkg</code></li>
<li><strong>Red Hat</strong> – <code>.rpm</code> – مدیر بسته: <code>dnf</code> و <code>rpm</code></li>
</ul>
<table>
<thead><tr><th>Debian</th><th>RedHat</th></tr></thead>
<tbody>
<tr><td><code>.deb</code></td><td><code>.rpm</code></td></tr>
<tr><td><code>apt</code></td><td><code>dnf</code></td></tr>
</tbody>
</table>

<h2>apt و dpkg</h2>
<p>خیلی‌ها این دو را یکی می‌دانند، در حالی که فرق دارند.</p>
<ul>
<li><strong>dpkg</strong> – مستقیماً فایل <code>.deb</code> را نصب می‌کند: <code>sudo dpkg -i file.deb</code></li>
<li><strong>apt</strong> – هوشمندتر است و وابستگی‌ها را خودش دانلود می‌کند: <code>sudo apt install nginx</code></li>
</ul>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> <code>apt</code> از Repository استفاده می‌کند، اما <code>dpkg</code> فقط فایل <code>.deb</code> را نصب می‌کند.</div></div>

<h2>dnf و rpm</h2>
<p>در RedHat هم همین داستان وجود دارد:</p>
<ul>
<li><code>rpm -ivh file.rpm</code> – فقط فایل را نصب می‌کند.</li>
<li><code>dnf install nginx</code> – وابستگی‌ها را هم مدیریت می‌کند.</li>
</ul>

<h2>نصب از Source Code</h2>
<p>گاهی برنامه به صورت سورس منتشر می‌شود (مثلاً <code>project.tar.gz</code>). مراحل معمول:</p>
<div class="code-container"><span class="code-label">نصب از سورس</span><div class="code-block">./configure\nmake\nsudo make install</div></div>
<p><strong>تفاوت با Package:</strong> Package مثل خریدن غذای آماده است؛ Source Code مثل خریدن مواد اولیه و آشپزی کردن.</p>
<ul>
<li><strong>مزایا:</strong> آخرین نسخه، امکان تغییر کد.</li>
<li><strong>معایب:</strong> زمان بیشتر، مدیریت سخت‌تر، به‌روزرسانی سخت‌تر.</li>
</ul>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> برنامه‌ای که از سورس نصب شده معمولاً توسط <code>apt</code> یا <code>dnf</code> مدیریت نمی‌شود.</div></div>

<h2>Snap و AppImage</h2>
<p>روش‌های جدید نصب برنامه:</p>
<ul>
<li><strong>Snap</strong> – برنامه همراه با وابستگی‌های خودش نصب می‌شود و روی تقریباً همه توزیع‌ها اجرا می‌شود.</li>
<li><strong>AppImage</strong> – اصلاً نصب لازم ندارد؛ فقط <code>chmod +x file.AppImage</code> و سپس <code>./file.AppImage</code>. مثل فایل‌های Portable در ویندوز.</li>
</ul>

<h2>Process چیست؟</h2>
<p>برنامه‌ای که در حال اجراست، دیگر فقط یک فایل نیست؛ تبدیل می‌شود به <strong>Process</strong>. تعریف ساده: <strong>Process یعنی یک برنامه در حال اجرا.</strong></p>
<p>مثال: <code>Firefox</code> (فایل) → اجرا → Firefox Process</p>
<p>هر Process دارای:</p>
<ul>
<li>شماره مخصوص (<strong>PID</strong>) – مثل شماره ملی Process، هیچ دو Process در یک لحظه PID یکسان ندارند.</li>
<li>حافظه (RAM)</li>
<li>زمان اجرا</li>
<li>وضعیت</li>
<li>کاربر اجراکننده</li>
</ul>

<h2>مشاهده Processها</h2>
<h3>ps</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ps</div></div>
<p>معمولاً: <code>ps aux</code> یا <code>ps -ef</code></p>
<table>
<thead><tr><th>دستور</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>ps</code></td><td>نمایش لحظه‌ای Processها</td></tr>
</tbody>
</table>

<h3>top</h3>
<p><code>ps</code> فقط یک عکس می‌گیرد، اما <code>top</code> فیلم زنده است و هر چند ثانیه اطلاعات را به‌روز می‌کند. داخل <code>top</code> می‌توان دید: مصرف CPU، مصرف RAM، PID، کاربر، وضعیت Process.</p>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>تفاوت</strong> <code>ps</code> = عکس · <code>top</code> = نمایش زنده</div></div>

<h2>kill</h2>
<p>اگر برنامه‌ای هنگ کند، از <code>kill PID</code> استفاده می‌کنیم. مثلاً <code>kill 2451</code></p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>آیا kill همیشه برنامه را می‌کشد؟</strong> نه! <code>kill</code> در واقع یک <strong>Signal</strong> ارسال می‌کند. اگر برنامه فرصت داشته باشد، به صورت مرتب بسته می‌شود. اگر بسته نشد: <code>kill -9 PID</code> که یعنی اجبار در پایان Process.</div></div>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> <code>kill</code> با PID کار می‌کند.</div></div>

<h2>pkill و killall</h2>
<p>گاهی PID را نمی‌دانیم، مثلاً <code>firefox</code>. می‌توان نوشت:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">pkill firefox\nkillall firefox</div></div>
<table>
<thead><tr><th>دستور</th><th>بر اساس</th></tr></thead>
<tbody>
<tr><td><code>kill</code></td><td>PID</td></tr>
<tr><td><code>pkill</code></td><td>نام</td></tr>
<tr><td><code>killall</code></td><td>نام</td></tr>
</tbody>
</table>

<h2>Job Control</h2>
<p>فرض کن نوشتی <code>sleep 300</code> و ترمینال قفل شد. با <kbd>Ctrl + Z</kbd> برنامه متوقف می‌شود.</p>
<ul>
<li><code>jobs</code> – مشاهده Jobها</li>
<li><code>bg</code> – ادامه در پس‌زمینه</li>
<li><code>fg</code> – برگشت به جلو</li>
</ul>
<p><strong>تفاوت Process و Job:</strong> Process مفهوم سیستم‌عامل است؛ Job مفهوم Shell است. یعنی Shell چند Process را به عنوان یک Job مدیریت می‌کند.</p>

<h2>nohup</h2>
<p>فرض کن با SSH به سرور وصل شده‌ای، برنامه‌ای اجرا می‌کنی و بعد ارتباط قطع می‌شود. برنامه هم متوقف می‌شود. برای جلوگیری:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">nohup command &amp;</div></div>
<p>برنامه حتی بعد از خروج از SSH به کار ادامه می‌دهد.</p>

<h2>tmux</h2>
<p>یکی از محبوب‌ترین ابزارهای مدیران لینوکس. فرض کن روی سرور هستی و وسط کار اینترنت قطع شد. اگر داخل tmux باشی، وقتی دوباره وصل شوی، همه چیز همان‌جاست. به همین دلیل tmux برای مدیریت سرورها بسیار کاربردی است.</p>

<h2>مقایسه سریع</h2>
<table>
<thead><tr><th>ابزار</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>ps</code></td><td>مشاهده Processها</td></tr>
<tr><td><code>top</code></td><td>مشاهده زنده Processها</td></tr>
<tr><td><code>kill</code></td><td>ارسال Signal به PID</td></tr>
<tr><td><code>pkill</code></td><td>پایان Process بر اساس نام</td></tr>
<tr><td><code>killall</code></td><td>پایان همه Processهای هم‌نام</td></tr>
<tr><td><code>jobs</code></td><td>مشاهده Jobهای Shell</td></tr>
<tr><td><code>bg</code></td><td>ادامه در پس‌زمینه</td></tr>
<tr><td><code>fg</code></td><td>بازگرداندن به پیش‌زمینه</td></tr>
<tr><td><code>nohup</code></td><td>ادامه اجرای برنامه بعد از خروج</td></tr>
<tr><td><code>tmux</code></td><td>مدیریت Sessionهای ترمینال</td></tr>
</tbody>
</table>

<h2>یک سناریوی واقعی</h2>
<p>فرض کن روی سرور کار می‌کنی:</p>
<ol>
<li>وارد tmux می‌شوی: <code>tmux</code></li>
<li>برنامه‌ای را اجرا می‌کنی.</li>
<li>با <code>top</code> مصرف CPU را بررسی می‌کنی.</li>
<li>اگر برنامه هنگ کرد، PID را پیدا می‌کنی: <code>ps aux</code></li>
<li>برنامه را متوقف می‌کنی: <code>kill PID</code> و اگر لازم بود <code>kill -9 PID</code></li>
</ol>

<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام‌های امتحانی ⚠️</strong>
<ul>
<li><strong>Process یا Program؟</strong> Program فایل روی دیسک است؛ Process برنامه در حال اجرا.</li>
<li><strong>apt یا dpkg؟</strong> <code>apt</code> Repository + وابستگی‌ها؛ <code>dpkg</code> فقط فایل <code>.deb</code>.</li>
<li><strong>dnf یا rpm؟</strong> <code>dnf</code> مدیریت وابستگی؛ <code>rpm</code> فقط Package.</li>
<li><strong>ps یا top؟</strong> <code>ps</code> عکس؛ <code>top</code> نمایش زنده.</li>
<li><strong>kill یا kill -9؟</strong> <code>kill</code> درخواست پایان برنامه؛ <code>kill -9</code> پایان اجباری.</li>
</ul>
</div></div>

<h2>نقشه ذهنی جلسه</h2>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Software\n│\n├── Repository\n├── Package\n│      ├── DEB\n│      └── RPM\n├── apt / dnf\n├── dpkg / rpm\n├── Source Install\n├── Snap\n└── AppImage\n\nProcess\n│\n├── PID\n├── ps\n├── top\n├── kill\n├── pkill\n├── killall\n├── jobs\n├── bg\n├── fg\n├── nohup\n└── tmux</div></div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>چک‌لیست مرور ۲ دقیقه‌ای ✅</strong>
اگر بتوانی به این سؤال‌ها جواب بدهی، این جلسه را خوب مرور کرده‌ای:
<ul>
<li>تفاوت <strong>Program</strong> و <strong>Process</strong> چیست؟</li>
<li>Repository چه نقشی در نصب نرم‌افزار دارد؟</li>
<li>تفاوت <code>apt</code> با <code>dpkg</code> و <code>dnf</code> با <code>rpm</code> چیست؟</li>
<li>مزایا و معایب نصب از <strong>Source Code</strong> چیست؟</li>
<li>تفاوت <code>ps</code> و <code>top</code> چیست؟</li>
<li>PID چیست و چرا مهم است؟</li>
<li>تفاوت <code>kill</code>، <code>pkill</code> و <code>killall</code> چیست؟</li>
<li>تفاوت <strong>Process</strong> و <strong>Job</strong> چیست؟</li>
<li><code>nohup</code> و <code>tmux</code> هر کدام چه مشکلی را حل می‌کنند؟</li>
</ul>
<p><strong>جمع‌بندی ذهنی:</strong> اول برنامه را <strong>نصب</strong> می‌کنی (Repository، Package، Source)، بعد آن را <strong>اجرا</strong> می‌کنی و تبدیل به <strong>Process</strong> می‌شود، سپس با ابزارهایی مثل <code>ps</code> و <code>top</code> آن را <strong>بررسی</strong> می‌کنی و در صورت نیاز با <code>kill</code> یا ابزارهای مشابه آن را <strong>مدیریت</strong> می‌کنی. این زنجیره، هسته‌ی مدیریت نرم‌افزار و Process در لینوکس است.</p>
</div></div>

<div class="section-header">

    <div>
        <h1>فایل‌ها، مجوزها و آرشیو</h1>
        <div class="meta">دوره مرور LPIC-1 · جلسه ۵ از ۱۰</div>
    </div>
</div>

<blockquote><strong>هدف این جلسه:</strong> یاد بگیریم فایل‌ها را مدیریت کنیم، آن‌ها را فشرده و آرشیو کنیم، از آن‌ها نسخه پشتیبان بگیریم، تفاوت Linkها را بفهمیم و مهم‌تر از همه، سیستم مجوزهای لینوکس (Permissions) را به صورت مفهومی درک کنیم.</blockquote>

<h2>قبل از شروع...</h2>
<p>فرض کن روی سرور یک فایل مهم داری: <code>report.txt</code>. حالا چند سؤال:</p>
<ul>
<li>اگر بخواهی آن را کپی کنی چه؟</li>
<li>اگر بخواهی آن را فشرده کنی؟</li>
<li>اگر بخواهی فقط مدیر سیستم اجازه ویرایش آن را داشته باشد؟</li>
<li>اگر بخواهی یک "میانبر" از آن بسازی؟</li>
<li>اگر بخواهی فردا پیدایش کنی؟</li>
</ul>
<p>تمام این سؤال‌ها در همین جلسه جواب داده می‌شوند.</p>

<h2>مدیریت فایل‌ها</h2>
<p>در لینوکس بیشتر وقت مدیر سیستم صرف کار با فایل‌ها می‌شود. مهم‌ترین دستورات:</p>
<table>
<thead><tr><th>دستور</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>cp</code></td><td>کپی</td></tr>
<tr><td><code>mv</code></td><td>جابه‌جایی یا تغییر نام</td></tr>
<tr><td><code>rm</code></td><td>حذف</td></tr>
<tr><td><code>mkdir</code></td><td>ساخت پوشه</td></tr>
<tr><td><code>rmdir</code></td><td>حذف پوشه خالی</td></tr>
</tbody>
</table>

<h3>cp</h3>
<p>کپی فایل:</p>
<div class="code-container"><span class="code-label">کپی</span><div class="code-block">cp file1.txt file2.txt</div></div>
<p>یعنی از <code>file1.txt</code> یک نسخه با نام <code>file2.txt</code> بساز.</p>
<p>کپی پوشه:</p>
<div class="code-container"><span class="code-label">کپی بازگشتی</span><div class="code-block">cp -r dir1 dir2</div></div>
<p><code>-r</code> یعنی Recursive (همه زیرپوشه‌ها را هم کپی کن.)</p>

<h3>mv</h3>
<p>دو کاربرد دارد:</p>
<ul>
<li><strong>تغییر نام:</strong> <code>mv old.txt new.txt</code></li>
<li><strong>انتقال:</strong> <code>mv file.txt /home/amir/</code></li>
</ul>

<h3>rm</h3>
<p>حذف فایل:</p>
<div class="code-container"><span class="code-label">حذف</span><div class="code-block">rm file.txt</div></div>
<p>حذف پوشه:</p>
<div class="code-container"><span class="code-label">حذف پوشه</span><div class="code-block">rm -r test</div></div>
<p>حذف اجباری:</p>
<div class="code-container"><span class="code-label">حذف اجباری</span><div class="code-block">rm -rf test</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>rm -rf /</code> یکی از خطرناک‌ترین دستورهای لینوکس است؛ زیرا کل سیستم را حذف می‌کند (در سیستم‌های امروزی معمولاً محافظت‌هایی وجود دارد، اما مفهوم آن را باید بدانید).</div></div>

<h2>Compression و Archive</h2>
<p>خیلی‌ها این دو را یکی می‌دانند، در حالی که فرق دارند:</p>
<ul>
<li><strong>Archive</strong> – چند فایل را در یک فایل جمع می‌کند (مثل اینکه چند برگه را داخل یک پوشه قرار بدهی).</li>
<li><strong>Compression</strong> – حجم فایل را کم می‌کند (مثل اینکه لباس‌ها را داخل یک کیسه وکیوم قرار بدهی).</li>
</ul>
<p>معمولاً اول Archive، بعد Compression.</p>

<h2>tar</h2>
<p>مهم‌ترین ابزار Archive:</p>
<div class="code-container"><span class="code-label">ساخت Archive</span><div class="code-block">tar -cf backup.tar mydir</div></div>
<div class="code-container"><span class="code-label">استخراج</span><div class="code-block">tar -xf backup.tar</div></div>

<h3>gzip</h3>
<p>فشرده‌سازی:</p>
<div class="code-container"><span class="code-label">فشرده‌سازی</span><div class="code-block">gzip file.txt</div></div>
<p>خروجی: <code>file.txt.gz</code></p>

<h3>ترکیب tar و gzip</h3>
<p>بیشتر مواقع این را می‌بینی:</p>
<div class="code-container"><span class="code-label">فشرده‌سازی + آرشیو</span><div class="code-block">tar -czf backup.tar.gz mydir</div></div>
<div class="code-container"><span class="code-label">استخراج</span><div class="code-block">tar -xzf backup.tar.gz</div></div>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> <code>tar</code> فایل‌ها را جمع می‌کند؛ <code>gzip</code> حجم را کم می‌کند.</div></div>

<h2>Backup</h2>
<p>Backup یعنی داشتن یک نسخه اضافی از اطلاعات. اگر فایل اصلی خراب شد، از نسخه Backup استفاده می‌کنیم.</p>

<h2>dd</h2>
<p>یکی از قوی‌ترین ابزارهای لینوکس که گاهی <strong>Disk Duplicator</strong> هم نامیده می‌شود.</p>
<div class="code-container"><span class="code-label">ایجاد Image از دیسک</span><div class="code-block">dd if=/dev/sda of=disk.img</div></div>
<p>ترجمه: دیسک → فایل Image</p>
<div class="code-container"><span class="code-label">نوشتن Image روی دیسک</span><div class="code-block">dd if=disk.img of=/dev/sdb</div></div>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> <code>if</code> = Input File · <code>of</code> = Output File</div></div>

<h2>Hard Link و Symbolic Link</h2>
<p>یکی از سؤال‌های محبوب LPIC.</p>

<h3>Symbolic Link</h3>
<p>مثل Shortcut در ویندوز:</p>
<div class="code-container"><span class="code-label">ساخت Symbolic Link</span><div class="code-block">ln -s report.txt shortcut.txt</div></div>
<p>اگر فایل اصلی حذف شود، Shortcut خراب می‌شود.</p>

<h3>Hard Link</h3>
<p>به خود داده‌های فایل اشاره می‌کند؛ اگر فایل اصلی حذف شود، Hard Link هنوز کار می‌کند.</p>
<div class="code-container"><span class="code-label">ساخت Hard Link</span><div class="code-block">ln report.txt hardlink.txt</div></div>
<p><strong>تفاوت تصویری:</strong> Symbolic Link → Shortcut → report.txt · Hard Link → Data ← report.txt (هر دو به یک داده اشاره می‌کنند).</p>

<table>
<thead><tr><th>Hard Link</th><th>Symbolic Link</th></tr></thead>
<tbody>
<tr><td>به داده اشاره می‌کند</td><td>به مسیر اشاره می‌کند</td></tr>
<tr><td>با حذف فایل اصلی باقی می‌ماند</td><td>با حذف فایل اصلی خراب می‌شود</td></tr>
<tr><td>روی همان Filesystem</td><td>می‌تواند بین Filesystemها باشد</td></tr>
</tbody>
</table>

<h2>Permission</h2>
<p>مهم‌ترین بخش این جلسه. هر فایل سه گروه کاربر دارد: <strong>Owner</strong>، <strong>Group</strong>، <strong>Others</strong>. و هر گروه سه مجوز دارد: <strong>r</strong> (Read)، <strong>w</strong> (Write)، <strong>x</strong> (Execute).</p>

<h3>نمایش Permission</h3>
<div class="code-container"><span class="code-label">مشاهده مجوزها</span><div class="code-block">ls -l</div></div>
<p>نمونه: <code>-rwxr-xr--</code></p>
<p>تفسیر: <code>-</code> (نوع فایل) · <code>rwx</code> (مالک) · <code>r-x</code> (گروه) · <code>r--</code> (سایر کاربران)</p>

<h3>حالت عددی</h3>
<p>هر مجوز یک عدد دارد: <code>r = 4</code>، <code>w = 2</code>، <code>x = 1</code>.</p>
<ul>
<li><code>rwx</code> = 4+2+1 = 7</li>
<li><code>rw-</code> = 4+2 = 6</li>
<li><code>r--</code> = 4</li>
</ul>
<p>مثلاً <code>755</code> یعنی Owner: 7 (rwx)، Group: 5 (r-x)، Others: 5 (r-x).</p>

<table>
<thead><tr><th>عدد</th><th>معنی</th></tr></thead>
<tbody>
<tr><td>777</td><td>همه همه‌چیز</td></tr>
<tr><td>755</td><td>مالک کامل، بقیه فقط اجرا و خواندن</td></tr>
<tr><td>644</td><td>مالک ویرایش، بقیه فقط خواندن</td></tr>
<tr><td>700</td><td>فقط مالک</td></tr>
</tbody>
</table>

<h3>chmod</h3>
<p>تغییر Permission به صورت عددی:</p>
<div class="code-container"><span class="code-label">عددی</span><div class="code-block">chmod 755 script.sh</div></div>
<p>به صورت نمادین:</p>
<div class="code-container"><span class="code-label">نمادین</span><div class="code-block">chmod u+x script.sh</div></div>
<ul>
<li><code>u</code> = Owner</li>
<li><code>g</code> = Group</li>
<li><code>o</code> = Others</li>
<li><code>a</code> = All</li>
</ul>

<h2>Ownership</h2>
<p>هر فایل یک Owner و یک Group دارد.</p>
<div class="code-container"><span class="code-label">تغییر مالک</span><div class="code-block">chown ali file.txt</div></div>
<div class="code-container"><span class="code-label">تغییر گروه</span><div class="code-block">chgrp developers file.txt</div></div>

<h2>ACL</h2>
<p>Permission معمولی فقط سه گروه دارد: Owner، Group، Others. اما اگر بخواهی فقط یک کاربر خاص دسترسی داشته باشد؟ <strong>ACL</strong> کمک می‌کند. مثلاً علی نباید به فایل دسترسی داشته باشد، ولی سارا باید داشته باشد. ACL این کار را انجام می‌دهد.</p>
<ul>
<li>دستور تنظیم: <code>setfacl</code></li>
<li>دستور مشاهده: <code>getfacl</code></li>
</ul>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> ACL کنترل دسترسی دقیق‌تر از Permission معمولی فراهم می‌کند.</div></div>

<h2>File Search</h2>
<h3>find</h3>
<p>جستجوی واقعی فایل:</p>
<div class="code-container"><span class="code-label">جستجو</span><div class="code-block">find /home -name "*.txt"</div></div>

<h3>locate</h3>
<p>خیلی سریع‌تر است؛ چون از Database استفاده می‌کند. اگر Database قدیمی باشد:</p>
<div class="code-container"><span class="code-label">به‌روزرسانی</span><div class="code-block">updatedb</div></div>
<p><strong>تفاوت:</strong> <code>find</code> = جستجوی واقعی · <code>locate</code> = جستجو در Database.</p>

<h2>تفاوت ابزارها</h2>
<table>
<thead><tr><th>ابزار</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>cp</code></td><td>کپی</td></tr>
<tr><td><code>mv</code></td><td>انتقال یا تغییر نام</td></tr>
<tr><td><code>rm</code></td><td>حذف</td></tr>
<tr><td><code>tar</code></td><td>آرشیو</td></tr>
<tr><td><code>gzip</code></td><td>فشرده‌سازی</td></tr>
<tr><td><code>dd</code></td><td>کپی سطح دیسک</td></tr>
<tr><td><code>ln</code></td><td>ساخت Link</td></tr>
<tr><td><code>chmod</code></td><td>تغییر Permission</td></tr>
<tr><td><code>chown</code></td><td>تغییر مالک</td></tr>
<tr><td><code>chgrp</code></td><td>تغییر گروه</td></tr>
<tr><td><code>find</code></td><td>جستجوی فایل</td></tr>
<tr><td><code>locate</code></td><td>جستجوی سریع فایل</td></tr>
</tbody>
</table>

<h2>یک سناریوی واقعی</h2>
<p>فرض کن پوشه پروژه را می‌خواهی برای ارسال آماده کنی:</p>
<div class="code-container"><span class="code-label">مراحل</span><div class="code-block no-prompt">Project\n↓\ntar -cf project.tar Project\n↓\ngzip project.tar\n↓\nproject.tar.gz\n↓\nBackup</div></div>
<p>بعد Permission را تنظیم می‌کنی:</p>
<div class="code-container"><span class="code-label">تنظیم مجوز</span><div class="code-block">chmod 644 report.txt</div></div>
<p>اگر لازم شد Owner را تغییر می‌دهی:</p>
<div class="code-container"><span class="code-label">تغییر مالک</span><div class="code-block">chown ali report.txt</div></div>
<p>اگر بعداً فایل را گم کردی:</p>
<div class="code-container"><span class="code-label">جستجو</span><div class="code-block">find /home -name report.txt</div></div>

<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام‌های امتحانی ⚠️</strong>
<ul>
<li><strong>tar یا gzip؟</strong> <code>tar</code> = جمع کردن فایل‌ها · <code>gzip</code> = کم کردن حجم.</li>
<li><strong>cp یا mv؟</strong> <code>cp</code> = کپی · <code>mv</code> = جابجایی یا تغییر نام.</li>
<li><strong>Hard Link یا Symbolic Link؟</strong> Hard Link = به داده · Symbolic Link = به مسیر.</li>
<li><strong>df یا du؟</strong> <code>df</code> = فضای Filesystem · <code>du</code> = حجم فایل.</li>
<li><strong>find یا locate؟</strong> <code>find</code> = جستجوی واقعی · <code>locate</code> = Database.</li>
</ul>
</div></div>

<h2>نقشه ذهنی جلسه</h2>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Files\n│\n├── cp\n├── mv\n├── rm\n│\n├── Archive\n│      └── tar\n│\n├── Compression\n│      └── gzip\n│\n├── Backup\n│      └── dd\n│\n├── Links\n│      ├── Hard\n│      └── Symbolic\n│\n├── Permissions\n│      ├── chmod\n│      ├── chown\n│      ├── chgrp\n│      └── ACL\n│\n└── Search\n       ├── find\n       └── locate</div></div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>چک‌لیست مرور ۲ دقیقه‌ای ✅</strong>
اگر بتوانی به این سؤال‌ها جواب بدهی، این جلسه را خوب مرور کرده‌ای:
<ul>

<li>تفاوت <strong>Archive</strong> و <strong>Compression</strong> چیست؟</li>
<li><code>tar</code> چه کاری انجام می‌دهد و <code>gzip</code> چه کاری؟</li>
<li><code>dd</code> بیشتر برای چه کاری استفاده می‌شود؟</li>
<li>تفاوت <strong>Hard Link</strong> و <strong>Symbolic Link</strong> چیست؟</li>
<li>Permissionهای <code>r</code>، <code>w</code> و <code>x</code> چه معنایی دارند؟</li>
<li>عددهای 755 و 644 را چگونه تفسیر می‌کنی؟</li>
<li>تفاوت <code>chmod</code>، <code>chown</code> و <code>chgrp</code> چیست؟</li>

</ul>
<p><strong>خلاصه طلایی جلسه ⭐</strong></p>
<div class="code-container"><div class="code-block no-prompt">ساخت و مدیریت فایل\n        │\n        ▼\ncp / mv / rm\n        │\n        ▼\nArchive (tar)\n        │\n        ▼\nCompression (gzip)\n        │\n        ▼\nBackup (dd)\n        │\n        ▼\nLinks (Hard / Symbolic)\n        │\n        ▼\nPermissions (chmod / chown / ACL)\n        │\n        ▼\nSearch (find / locate)</div></div>
<p>اگر این جریان را در ذهنت داشته باشی، تقریباً تمام سؤالات این بخش از LPIC-1 برایت قابل تحلیل خواهند بود، نه صرفاً حفظی.</p>

        <h1>سخت‌افزار، دیسک و Filesystem</h1>
        <div class="meta">دوره مرور LPIC-1 · جلسه ۴ از ۱۰</div>
    </div>

<blockquote><strong>هدف این جلسه:</strong> بفهمیم داده‌ها در لینوکس از لحظه‌ای که روی هارد نوشته می‌شوند تا زمانی که به صورت فایل در اختیار ما قرار می‌گیرند، چه مسیری را طی می‌کنند.</blockquote>

<h2>قبل از شروع...</h2>
<p>فرض کن یک هارد نو خریده‌ای. آیا همین الان می‌توانی داخل آن فایل ذخیره کنی؟ خیر. چون هنوز لینوکس نمی‌داند این هارد چگونه باید استفاده شود. برای اینکه یک دیسک قابل استفاده شود، چند مرحله پشت سر هم انجام می‌شود. اگر این مراحل را بفهمی، تقریباً تمام مباحث دیسک در LPIC-1 را متوجه می‌شوی.</p>

<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نقشه کلی</strong> همه چیز از این مسیر عبور می‌کند:
<div class="code-container" style="margin:10px 0 0;"><div class="code-block no-prompt">Hard Disk\n     │\nPartition\n     │\nFilesystem\n     │\nMount\n     │\nDirectory\n     │\nFile</div></div>
<p><strong>این مهم‌ترین شکل این جلسه است.</strong> اگر فقط این را حفظ نکنی و <strong>درکش کنی</strong>، نصف مبحث Storage را یاد گرفته‌ای.</p>
</div></div>

<h2>سخت‌افزار (Hardware)</h2>
<p>سخت‌افزار یعنی قطعات فیزیکی کامپیوتر: CPU، RAM، Hard Disk / SSD، کارت شبکه، کارت گرافیک و ... . لینوکس باید این قطعات را بشناسد تا بتواند از آن‌ها استفاده کند.</p>

<h3>lshw</h3>
<p>برای مشاهده اطلاعات سخت‌افزار:</p>
<div class="code-container"><span class="code-label">اطلاعات کامل</span><div class="code-block">sudo lshw</div></div>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block">sudo lshw -short</div></div>

<h3>ابزارهای دیگر</h3>
<div class="code-container"><span class="code-label">CPU</span><div class="code-block">lscpu</div></div>
<div class="code-container"><span class="code-label">RAM</span><div class="code-block">lsmem</div></div>
<div class="code-container"><span class="code-label">دیسک‌ها و پارتیشن‌ها</span><div class="code-block">lsblk</div></div>

<h2>Kernel Module</h2>
<p>آیا Kernel همه Driverهای دنیا را از اول داخل خودش دارد؟ نه. برای همین چیزی به نام <strong>Kernel Module</strong> وجود دارد. Kernel Module یک قطعه کد است که هنگام نیاز داخل Kernel بارگذاری می‌شود. مثلاً وقتی فلش USB وصل می‌کنی، Module مربوط به USB بارگذاری شده و فلش قابل استفاده می‌شود.</p>

<h3>دستورات مهم</h3>
<table>
<thead><tr><th>دستور</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>lsmod</code></td><td>نمایش Moduleها</td></tr>
<tr><td><code>modinfo module_name</code></td><td>اطلاعات یک Module</td></tr>
<tr><td><code>modprobe module_name</code></td><td>بارگذاری Module</td></tr>
</tbody>
</table>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> <code>modprobe</code> Module را همراه با وابستگی‌هایش بارگذاری می‌کند.</div></div>

<h2>Disk چیست؟</h2>
<p>Disk همان فضای ذخیره‌سازی است: HDD، SSD، NVMe و ... . اما هنوز قابل استفاده نیست.</p>

<h2>Partition</h2>
<p>فرض کن یک هارد ۱ ترابایتی خریده‌ای. می‌توانی آن را به چند قسمت تقسیم کنی. هر قسمت می‌شود <strong>Partition</strong>.</p>
<p><strong>چرا Partition می‌سازیم؟</strong> مثلاً برای نصب چند سیستم‌عامل مجزا یا جداسازی داده‌های بک‌آپ.</p>

<h3>fdisk</h3>
<p>برای مدیریت Partitionها:</p>
<div class="code-container"><span class="code-label">مدیریت</span><div class="code-block">sudo fdisk /dev/sda</div></div>
<div class="code-container"><span class="code-label">مشاهده</span><div class="code-block">sudo fdisk -l</div></div>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> <code>fdisk</code> برای ساخت و حذف Partition استفاده می‌شود، نه برای ساخت Filesystem.</div></div>

<h2>Filesystem</h2>
<p>فرض کن یک کتابخانه داری. اگر کتاب‌ها را بدون نظم روی زمین بریزی، پیدا کردنشان سخت می‌شود. Filesystem همان سیستم مرتب‌سازی فایل‌هاست. بدون Filesystem، دیسک فقط تعدادی صفر و یک است.</p>
<p>مثال Filesystemها: <code>ext4</code>، <code>xfs</code>، <code>btrfs</code>، <code>vfat</code>.</p>
<div class="code-container"><span class="code-label">ساخت Filesystem</span><div class="code-block">mkfs.ext4 /dev/sdb1</div></div>
<p><strong>تفاوت:</strong> Partition = تقسیم دیسک · Filesystem = نحوه ذخیره فایل.</p>

<h2>Mount</h2>
<p>فرض کن فلش را وصل کرده‌ای. آیا فوراً داخل <code>/home</code> ظاهر می‌شود؟ نه. لینوکس باید آن را به یک پوشه متصل کند. این اتصال <strong>Mount</strong> نام دارد.</p>
<div class="code-container"><span class="code-label">نمایش Mountها</span><div class="code-block">mount</div></div>
<div class="code-container"><span class="code-label">Mount کردن</span><div class="code-block">mount /dev/sdb1 /mnt</div></div>
<div class="code-container"><span class="code-label">جدا کردن</span><div class="code-block">umount /mnt</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>نکته امتحانی ⚠️</strong> قبل از جدا کردن فلش باید <code>umount</code> انجام شود.</div></div>

<h2>lsblk</h2>
<p>یکی از پرکاربردترین دستورهای LPIC:</p>
<div class="code-container"><span class="code-label">نمایش دیسک‌ها</span><div class="code-block">lsblk</div></div>
<p>نمونه خروجی:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">sda\n├── sda1\n├── sda2\n└── sda3</div></div>
<p>خیلی سریع نشان می‌دهد: دیسک‌ها، Partitionها، Mount Point.</p>

<h2>blkid</h2>
<p>نمایش UUID:</p>
<div class="code-container"><span class="code-label">UUID</span><div class="code-block">blkid</div></div>
<p><strong>UUID چیست؟</strong> هر Filesystem یک شناسه یکتا دارد (مثل شماره ملی). در فایل <code>/etc/fstab</code> معمولاً از UUID استفاده می‌شود، چون ممکن است نام دیسک تغییر کند.</p>

<h2>df</h2>
<p>Disk Free – نمایش فضای Filesystemها:</p>
<div class="code-container"><span class="code-label">فضای دیسک</span><div class="code-block">df -h</div></div>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>سؤال امتحانی</strong> کدام دستور فضای آزاد دیسک را نشان می‌دهد؟ جواب: <code>df</code></div></div>

<h2>du</h2>
<p>Disk Usage – بررسی حجم فایل یا پوشه:</p>
<div class="code-container"><span class="code-label">حجم پوشه</span><div class="code-block">du -sh Downloads</div></div>
<p><strong>تفاوت:</strong> <code>df</code> = فضای کل Filesystem · <code>du</code> = حجم فایل یا پوشه.</p>

<h2>LVM</h2>
<p>فرض کن بعد از مدتی فضای هارد کم شد، اما نمی‌خواهی دوباره Partitionها را حذف کنی. اینجا <strong>LVM</strong> کمک می‌کند. ایده اصلی: به جای اینکه مستقیم با Partition کار کنیم، یک لایه انعطاف‌پذیر وسط قرار می‌دهیم.</p>
<div class="code-container"><span class="code-label">ساختار LVM</span><div class="code-block no-prompt">Disk\n↓\nPartition\n↓\nPV\n↓\nVG\n↓\nLV\n↓\nFilesystem</div></div>
<ul>
<li><strong>PV</strong> = Physical Volume</li>
<li><strong>VG</strong> = Volume Group</li>
<li><strong>LV</strong> = Logical Volume</li>
</ul>
<p><strong>مزیت:</strong> بعداً می‌توانی LV را بزرگ‌تر یا کوچک‌تر کنی بدون دردسر زیاد.</p>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته امتحانی ✅</strong> LVM برای مدیریت <strong>انعطاف‌پذیر فضای ذخیره‌سازی</strong> استفاده می‌شود.</div></div>

<h2>RAID</h2>
<p>RAID چند هارد را با هم ترکیب می‌کند. هدف: افزایش سرعت، افزایش امنیت، یا هر دو.</p>
<table>
<thead><tr><th>RAID</th><th>ویژگی</th></tr></thead>
<tbody>
<tr><td><strong>RAID 0</strong></td><td>سرعت بالا، بدون تحمل خرابی (اگر یکی خراب شود همه اطلاعات از بین می‌رود)</td></tr>
<tr><td><strong>RAID 1</strong></td><td>امنیت بالا، آینه (Mirror) – اطلاعات روی هر دو نوشته می‌شود</td></tr>
<tr><td><strong>RAID 5</strong></td><td>حداقل ۳ دیسک – تعادل بین سرعت و تحمل خرابی</td></tr>
<tr><td><strong>RAID 10</strong></td><td>ترکیب RAID 1 و RAID 0 – هم سرعت، هم امنیت</td></tr>
</tbody>
</table>

<h2>تفاوت مفاهیم</h2>
<table>
<thead><tr><th>مفهوم</th><th>وظیفه</th></tr></thead>
<tbody>
<tr><td>Disk</td><td>سخت‌افزار ذخیره‌سازی</td></tr>
<tr><td>Partition</td><td>تقسیم دیسک</td></tr>
<tr><td>Filesystem</td><td>سازماندهی فایل‌ها</td></tr>
<tr><td>Mount</td><td>متصل کردن Filesystem به یک مسیر</td></tr>
<tr><td>LVM</td><td>مدیریت انعطاف‌پذیر فضای ذخیره‌سازی</td></tr>
<tr><td>RAID</td><td>ترکیب چند دیسک برای سرعت یا امنیت</td></tr>
</tbody>
</table>

<h2>یک سناریوی واقعی</h2>
<p>هارد جدید وصل کردی. مراحل چیست؟</p>
<div class="code-container"><span class="code-label">مراحل</span><div class="code-block no-prompt">هارد جدید\n↓\nfdisk (ساخت Partition)\n↓\nmkfs.ext4 (ساخت Filesystem)\n↓\nmount (اتصال به یک پوشه)\n↓\nآماده ذخیره فایل</div></div>
<p><strong>اگر این چهار مرحله را یادت باشد، بخش بزرگی از سؤالات Storage را می‌توانی جواب بدهی.</strong></p>

<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام‌های امتحانی ⚠️</strong>
<ul>
<li><strong>Partition یا Filesystem؟</strong> Partition = تقسیم دیسک · Filesystem = نحوه ذخیره فایل.</li>
<li><strong>df یا du؟</strong> <code>df</code> = فضای کل Filesystem · <code>du</code> = حجم فایل یا پوشه.</li>
<li><strong>lsblk یا blkid؟</strong> <code>lsblk</code> = نمایش دیسک‌ها و پارتیشن‌ها · <code>blkid</code> = نمایش UUID.</li>
<li><strong>LVM یا RAID؟</strong> LVM = انعطاف در مدیریت فضا · RAID = سرعت یا تحمل خرابی.</li>
</ul>
</div></div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>چک‌لیست مرور ۲ دقیقه‌ای ✅</strong>
اگر بتوانی به این سؤال‌ها جواب بدهی، این جلسه را خوب مرور کرده‌ای:

<p>هر زمان در آزمون سؤالی درباره دیسک، پارتیشن، فایل‌سیستم یا Mount دیدی، ابتدا این مسیر را در ذهنت مرور کن؛ معمولاً پاسخ سؤال در همین زنجیره پیدا می‌شود.</p>
