<h4><code>xargs</code></h4>
<div class="code-container"><span class="code-label">نکته</span><div class="code-block no-prompt">xargs → تبدیل Input به Arguments</div></div>
<div class="code-container"><span class="code-label">پس</span><div class="code-block no-prompt">| → stdin\nxargs → arguments</div></div>
<h4>Checksum</h4>
<div class="code-container"><span class="code-label">دستورات</span><div class="code-block no-prompt">md5sum    → MD5\nsha256sum → SHA-256\n\nSHA-256 → قوی‌تر و مناسب‌تر از MD5</div></div>
<h4>مقایسه‌های خیلی مهم</h4>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">grep  → داخل محتوا\nfind  → پیدا کردن File/Directory\n\n|     → Command\n>     → File\n\n>     → Overwrite\n>>    → Append\n\ngrep  → Find\nsed   → Modify\n\n|     → stdin\nxargs → arguments</div></div>
</div></div>

<div class="box important"><i class="fas fa-check-circle"></i><div><strong>🎯 تست نهایی جلسه</strong>
<p>بدون نگاه کردن به جزوه جواب بده:</p>
<ol>
<li><code>grep</code> چه کاری انجام می‌دهد؟</li>
<li>تفاوت <code>grep</code> و <code>find</code> چیست؟</li>

<li>در دستور زیر جریان داده را توضیح بده:

</li>
</ol>
</div></div>

<div class="box important"><i class="fas fa-trophy"></i><div><strong>🏆 یک سؤال طلایی</strong>

    <div>
        <h1>مدیریت نرم‌افزار و Processها</h1>
        <div class="meta">دوره مرور LPIC-1 · جلسه ۳ از ۱۰</div>
    </div>
</div>

<blockquote><strong>🎯 هدف جلسه:</strong> یاد بگیریم نرم‌افزار در لینوکس چگونه نصب و مدیریت می‌شود، یک برنامه هنگام اجرا چگونه به <strong>Process</strong> تبدیل می‌شود، چگونه Processها را مشاهده کنیم و در صورت نیاز آن‌ها را مدیریت یا متوقف کنیم.</blockquote>

<h2>قبل از شروع...</h2>
<p>فرض کنید روی یک سرور لینوکس می‌خواهید:</p>
<ul>
<li>یک نرم‌افزار مثل <code>nginx</code> نصب کنید.</li>
<li>یک برنامه را اجرا کنید.</li>
<li>ببینید چه Processهایی در حال اجرا هستند.</li>
<li>مصرف CPU و RAM را بررسی کنید.</li>
<li>یک برنامه‌ی هنگ‌کرده را متوقف کنید.</li>
<li>کاری کنید که برنامه بعد از قطع SSH همچنان اجرا شود.</li>
</ul>
<p>همه‌ی این کارها در دو بخش اصلی قرار می‌گیرند:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">Software Management\n        │\n        ├── نصب\n        ├── حذف\n        └── به‌روزرسانی\n\nProcess Management\n        │\n        ├── مشاهده\n        ├── بررسی\n        ├── مدیریت\n        └── توقف</div></div>

<h2>بخش اول — مدیریت نرم‌افزار</h2>

<h3>۱. Repository چیست؟</h3>
<p>در لینوکس، نرم‌افزارها معمولاً از <strong>Repository</strong> نصب می‌شوند. Repository را می‌توان مثل یک <strong>مخزن مرکزی نرم‌افزارها</strong> در نظر گرفت. مثال در Debian/Ubuntu:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo apt install nginx</div></div>
<p>تقریباً چنین اتفاقی رخ می‌دهد:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">دستور نصب\n   ↓\nPackage Manager\n   ↓\nRepository\n   ↓\nدریافت Package\n   ↓\nبررسی Dependencies\n   ↓\nنصب</div></div>
<p><strong>چرا Repository مهم است؟</strong> چون Package Manager می‌تواند نرم‌افزار را پیدا کند، آن را دانلود کند، وابستگی‌ها را مدیریت کند، نرم‌افزار را به‌روزرسانی کند و نسخه‌ی مناسب را نصب کند.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> در سؤال‌های LPIC وقتی صحبت از نصب نرم‌افزار <strong>از مخزن و همراه با مدیریت وابستگی‌ها</strong> است، ذهنمان باید به سمت Package Managerهایی مثل <code>apt</code> و <code>dnf</code> برود.</div></div>

<h3>۲. Package چیست؟</h3>
<p>یک نرم‌افزار در لینوکس معمولاً به صورت یک <strong>Package</strong> توزیع می‌شود. Package فقط فایل اجرایی برنامه نیست؛ می‌تواند شامل مواردی مثل فایل‌های برنامه، اطلاعات نسخه، اطلاعات نصب، اطلاعات وابستگی‌ها و اسکریپت‌های لازم برای نصب یا حذف باشد.</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">Package\n   │\n   ├── Program files\n   ├── Metadata\n   ├── Dependencies information\n   └── Installation information</div></div>

<h3>۳. دو خانواده مهم Package</h3>
<p>در LPIC-1 دو خانواده‌ی بسیار مهم را باید بشناسیم:</p>
<div class="table-wrap">
<table>
<thead><tr><th>خانواده</th><th>فرمت Package</th><th>ابزارهای مهم</th></tr></thead>
<tbody>
<tr><td>Debian</td><td><code>.deb</code></td><td><code>apt</code>, <code>dpkg</code></td></tr>
<tr><td>Red Hat</td><td><code>.rpm</code></td><td><code>dnf</code>, <code>rpm</code></td></tr>
</tbody>
</table>
</div>
<p>مثلاً <code>nginx.deb</code> یک Package از خانواده Debian است و <code>nginx.rpm</code> یک Package از خانواده RPM است.</p>
<div class="box note"><i class="fas fa-circle-info"></i><div><strong>نکته</strong> <code>.rpm</code> نام فرمت Package است و در عین حال <code>rpm</code> نام ابزار مدیریت آن Packageها نیز هست.</div></div>

<h3>۴. <code>apt</code> و <code>dpkg</code></h3>
<p>این دو را با هم اشتباه نکنید.</p>
<ul>
<li><strong>dpkg:</strong> ابزار سطح پایین Debian برای کار با Packageهای <code>.deb</code>. مثال: <div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo dpkg -i file.deb</div></div> یعنی Package مشخص‌شده را مستقیماً نصب کن.</li>
<li><strong>apt:</strong> ابزار سطح بالاتری است که برای مدیریت Packageها استفاده می‌شود. مثال: <div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo apt install nginx</div></div> در این حالت <code>apt</code> می‌تواند Package را از Repository دریافت کند و وابستگی‌های موردنیاز را نیز مدیریت کند.</li>
</ul>
<div class="code-container"><span class="code-label">مدل ذهنی</span><div class="code-block no-prompt">apt\n │\n ├── Repository\n ├── Download\n ├── Dependencies\n └── Package Management\n\ndpkg\n │\n └── کار مستقیم با .deb</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> این جمله را دقیق به خاطر بسپارید: <code>dpkg</code> یک Package Manager سطح پایین برای <code>.deb</code> است؛ <code>apt</code> مدیریت سطح بالاتر و وابستگی‌ها و Repository را انجام می‌دهد. پس نگویید «<code>dpkg</code> اصلاً Dependency را نمی‌شناسد»؛ بلکه بگویید: <code>dpkg</code> وابستگی‌ها را به شکل سطح پایین بررسی می‌کند، اما خودش مانند <code>apt</code> آن‌ها را از Repository دریافت و حل نمی‌کند.</div></div>

<h3>۵. <code>dnf</code> و <code>rpm</code></h3>
<p>در خانواده Red Hat نیز مشابه همین مدل را داریم.</p>
<ul>
<li><strong>rpm:</strong> برای کار مستقیم با Packageهای RPM: <div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo rpm -ivh file.rpm</div></div></li>
<li><strong>dnf:</strong> برای مدیریت سطح بالاتر Packageها: <div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo dnf install nginx</div></div> <code>dnf</code> می‌تواند Package را از Repository دریافت کرده و Dependencyهای آن را نیز مدیریت کند.</li>
</ul>
<h4>مقایسه طلایی</h4>
<div class="table-wrap">
<table>
<thead><tr><th>ابزار</th><th>نقش اصلی</th></tr></thead>
<tbody>
<tr><td><code>apt</code></td><td>مدیریت سطح بالاتر Package در Debian</td></tr>
<tr><td><code>dpkg</code></td><td>کار مستقیم با <code>.deb</code></td></tr>
<tr><td><code>dnf</code></td><td>مدیریت سطح بالاتر Package در Red Hat</td></tr>
<tr><td><code>rpm</code></td><td>کار مستقیم با <code>.rpm</code></td></tr>
</tbody>
</table>
</div>

<h3>۶. نصب نرم‌افزار از Source Code</h3>
<p>همه‌ی نرم‌افزارها الزاماً به شکل Package آماده ارائه نمی‌شوند. گاهی <strong>Source Code</strong> در اختیار ما قرار می‌گیرد (مثلاً <code>project.tar.gz</code> که داخل آن به جای Package آماده، کد منبع برنامه قرار دارد). فرآیند سنتی ساخت یک نرم‌افزار ممکن است چیزی شبیه این باشد:</p>
<div class="code-container"><span class="code-label">مراحل</span><div class="code-block">./configure\nmake\nsudo make install</div></div>
<p>اما این نکته بسیار مهم است: <strong>همه‌ی پروژه‌ها دقیقاً از این سه دستور استفاده نمی‌کنند.</strong> امروزه بعضی پروژه‌ها از ابزارهای دیگری مانند CMake، Meson، Autotools یا سیستم‌های Build مخصوص خودشان استفاده می‌کنند. برای LPIC-1، مفهوم اصلی مهم‌تر از حفظ کردن یک روش خاص است:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">Source Code\n    ↓\nBuild / Compile\n    ↓\nInstall</div></div>

<h4>Package یا Source؟</h4>
<p>یک مقایسه‌ی ساده:</p>
<div class="code-container"><span class="code-label">تشبیه</span><div class="code-block no-prompt">Package = غذای آماده\nSource Code = مواد اولیه + آشپزی</div></div>
<div class="table-wrap">
<table>
<thead><tr><th></th><th>Package</th><th>Source</th></tr></thead>
<tbody>
<tr><td><strong>مزایا</strong></td><td>نصب ساده‌تر، مدیریت Dependency، مدیریت آسان‌تر Update و Remove، هماهنگی بیشتر با Distribution</td><td>امکان انتخاب بعضی تنظیمات Build، امکان استفاده از نسخه‌ای که در Repository موجود نیست، امکان تغییر کد</td></tr>
<tr><td><strong>معایب</strong></td><td>—</td><td>Build پیچیده‌تر، مدیریت Dependency دشوارتر، مدیریت Update و Remove سخت‌تر</td></tr>
</tbody>
</table>
</div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> اگر نرم‌افزار را از Source نصب کنید، Package Manager توزیع معمولاً اطلاعات آن نصب را مانند Package نصب‌شده در اختیار ندارد.</div></div>

<h3>۷. Snap و AppImage</h3>
<p>دو روش دیگر برای توزیع نرم‌افزار، Snap و AppImage هستند. این‌ها با Packageهای سنتی <code>.deb</code> و <code>.rpm</code> یکسان نیستند.</p>
<ul>
<li><strong>Snap:</strong> برنامه را به صورت یک Package قابل توزیع ارائه می‌کند و بسیاری از Dependencyهای موردنیاز را نیز در قالب Snap یا محیط مربوط به آن مدیریت می‌کند. مثال: <div class="code-container"><span class="code-label">دستور</span><div class="code-block">snap install package-name</div></div> یکی از ایده‌های اصلی Snap این است که نرم‌افزارها را تا حد زیادی مستقل از Package Management سنتی توزیع کند.</li>
<li><strong>AppImage:</strong> بیشتر شبیه یک برنامه‌ی Portable است. معمولاً: <div class="code-container"><span class="code-label">دستور</span><div class="code-block">chmod +x program.AppImage\n./program.AppImage</div></div> در بسیاری از موارد نصب سنتی لازم نیست.</li>
</ul>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> این دو را یکی ندانید: <code>Snap</code> → Package/Containerized application format + مدیریت توسط snapd؛ <code>AppImage</code> → فایل اجرایی قابل حمل، معمولاً بدون نصب سنتی.</div></div>

<h2>بخش دوم — Process Management</h2>
<p>حالا فرض کنیم نرم‌افزار نصب شده است (مثلاً Firefox روی سیستم وجود دارد). وقتی آن را اجرا می‌کنیم چه اتفاقی می‌افتد؟</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">Program\n   ↓\nExecution\n   ↓\nProcess</div></div>

<h3>۸. Program در برابر Process</h3>
<p>این یکی از مهم‌ترین مفاهیم جلسه است.</p>
<ul>
<li><strong>Program:</strong> برنامه‌ی موجود روی دیسک است (مثلاً <code>/usr/bin/something</code>). هنوز فقط یک فایل است.</li>
<li><strong>Process:</strong> وقتی برنامه اجرا می‌شود، سیستم‌عامل یک نمونه‌ی در حال اجرای آن ایجاد می‌کند.</li>
</ul>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">Program\n   ↓ execute\nProcess</div></div>
<p>پس: <strong>Program = برنامه روی دیسک</strong>، <strong>Process = نمونه‌ی در حال اجرای برنامه</strong>. ممکن است یک Program چند Process ایجاد کند.</p>

<h3>۹. Process چه اطلاعاتی دارد؟</h3>
<p>هر Process اطلاعات مختلفی دارد، از جمله: PID، User، وضعیت، CPU usage، Memory usage، زمان اجرا و ارتباط با Processهای دیگر. مهم‌ترین مورد برای مدیریت Process:</p>
<p><strong>PID</strong> مخفف <strong>Process ID</strong> است. مثلاً <code>Firefox → PID = 2451</code>. وقتی PID را داشته باشیم می‌توانیم دقیقاً همان Process را هدف قرار دهیم.</p>

<h3>۱۰. <code>ps</code> — مشاهده Processها</h3>
<p>برای مشاهده Processها از <code>ps</code> استفاده می‌کنیم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ps</div></div>
<p>اما <code>ps</code> معمولاً فقط Processهای مرتبط با همان Terminal را نشان می‌دهد. برای مشاهده‌ی اطلاعات گسترده‌تر می‌توان از:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ps aux</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ps -ef</div></div>
<p>استفاده کرد. این دستورات اطلاعاتی مانند User، PID، CPU، Memory، Start time و Command را نمایش می‌دهند. در امتحان باید هر دو فرم را بشناسید.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> اگر سؤال گفت «یک Snapshot از Processهای سیستم بگیر»، ذهن به سمت <code>ps</code> می‌رود.</div></div>

<h3>۱۱. <code>top</code> — مشاهده‌ی زنده</h3>
<p><code>ps</code> یک <strong>Snapshot</strong> از وضعیت Processها می‌دهد، اما <code>top</code> اطلاعات را به صورت زنده و دوره‌ای به‌روزرسانی می‌کند:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">top</div></div>
<p>در <code>top</code> می‌توان مواردی مانند PID، User، CPU usage، Memory usage و Process state را مشاهده کرد.</p>
<div class="code-container"><span class="code-label">مدل ذهنی</span><div class="code-block no-prompt">ps\n↓\n📸 Snapshot\n\ntop\n↓\n🔄 Live / Updating View</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> نگویید <code>ps</code> اصلاً اطلاعات CPU یا RAM ندارد؛ <code>ps</code> می‌تواند این اطلاعات را نمایش دهد، تفاوت اصلی این است که <code>top</code> برای مشاهده‌ی پویا و مداوم طراحی شده است.</div></div>

<h3>۱۲. Signal چیست؟</h3>
<p>در لینوکس Processها می‌توانند <strong>Signal</strong> دریافت کنند. Signal یک پیام/درخواست کنترلی از طرف سیستم یا Process دیگر است:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">Process A\n   │\n   │ Signal\n   ↓\nProcess B</div></div>
<p>برای ارسال Signal معمولاً از <code>kill</code> استفاده می‌کنیم.</p>

<h3>۱۳. <code>kill</code></h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">kill 2451</div></div>
<p><code>2451</code> در اینجا PID است. <code>kill</code> به Process مربوط به این PID یک Signal ارسال می‌کند.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>نکته بسیار مهم</strong> اسم <code>kill</code> به این معنی نیست که همیشه Process را فوراً می‌کشد. Signal پیش‌فرض <code>kill</code> معمولاً <code>SIGTERM</code> است؛ یعنی به Process درخواست می‌شود که به شکل مرتب خاتمه پیدا کند.</div></div>

<h3>۱۴. <code>kill -9</code></h3>
<p>اگر Process به <code>SIGTERM</code> پاسخ ندهد، ممکن است از این استفاده کنیم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">kill -9 2451</div></div>
<p>عدد <code>9</code> مربوط به <code>SIGKILL</code> است. <code>SIGKILL</code> قابل Catch، Ignore یا Handle شدن توسط Process نیست و سیستم‌عامل Process را متوقف می‌کند.</p>
<p>اما یک نکته مهم: <code>kill -9</code> باید معمولاً <strong>آخرین راه‌حل</strong> باشد؛ چون برنامه فرصت Cleanup عادی خود را ندارد (ممکن است فایل‌های باز داشته باشد، داده‌ای هنوز روی دیسک نوشته نشده باشد، یا منابعی در اختیار داشته باشد).</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>kill PID</code> لزوماً به معنی «کشتن فوری» نیست؛ بلکه یعنی ارسال Signal.</div></div>

<h3>۱۵. <code>pkill</code></h3>
<p>گاهی PID را نمی‌دانیم اما نام Process را می‌دانیم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">pkill firefox</div></div>
<p><code>pkill</code> بر اساس نام یا ویژگی‌های Process، Signal ارسال می‌کند. پس: <code>kill</code> → معمولاً بر اساس PID؛ <code>pkill</code> → بر اساس نام/ویژگی Process.</p>

<h3>۱۶. <code>killall</code></h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">killall firefox</div></div>
<p><code>killall</code> می‌تواند Signal را به Processهای مطابق نام مشخص‌شده ارسال کند؛ یعنی Processهای دارای نام <code>firefox</code> را هدف قرار می‌دهد.</p>
<div class="box note"><i class="fas fa-circle-info"></i><div><strong>نکته مهم</strong> <code>killall</code> را با <code>kill</code> اشتباه نکنید: <code>kill</code> → PID؛ <code>pkill</code> → Pattern/Process attributes؛ <code>killall</code> → Process name. جزئیات دقیق Matching بین <code>pkill</code> و <code>killall</code> مهم‌تر از این سطح برای LPIC-1 نیست.</div></div>

<h3>۱۷. Job Control</h3>
<p>تا اینجا درباره‌ی <strong>Process</strong> صحبت کردیم. حالا یک مفهوم دیگر: <strong>Job</strong>. Job بیشتر مفهومی مربوط به <strong>Shell</strong> است. فرض کنید اجرا کنیم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sleep 300</div></div>
<p>این دستور در Foreground اجرا می‌شود؛ یعنی Terminal درگیر آن Process است.</p>

<h3>۱۸. <code>Ctrl + Z</code></h3>
<p>اگر هنگام اجرای آن <code>Ctrl + Z</code> بزنیم، Shell معمولاً Process را Suspend می‌کند و آن را به عنوان یک Job متوقف‌شده نگه می‌دارد.</p>

<h3>۱۹. <code>jobs</code></h3>
<p>برای مشاهده‌ی Jobهای Shell:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">jobs</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">[1]+  Stopped    sleep 300</div></div>
<p>اینجا <code>[1]</code> شماره‌ی Job است؛ این با PID یکی نیست.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> PID → شناسه Process در سیستم‌عامل؛ Job ID → شناسه Job در Shell.</div></div>

<h3>۲۰. <code>bg</code></h3>
<p>اگر Job متوقف‌شده‌ای داشته باشیم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">bg %1</div></div>
<p>آن Job را در <strong>Background</strong> ادامه می‌دهد. مثلاً <code>sleep 300</code> را با <code>Ctrl+Z</code> متوقف کرده‌ایم؛ بعد <code>bg %1</code> باعث می‌شود در پس‌زمینه ادامه پیدا کند.</p>

<h3>۲۱. <code>fg</code></h3>
<p>برای برگرداندن Job به Foreground:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">fg %1</div></div>
<div class="code-container"><span class="code-label">مدل ذهنی Job Control</span><div class="code-block no-prompt">Foreground\n    │\n    │ Ctrl + Z\n    ↓\nStopped\n    │\n    │ bg\n    ↓\nBackground\n    │\n    │ fg\n    ↓\nForeground</div></div>

<h3>۲۲. Process و Job چه تفاوتی دارند؟</h3>
<div class="table-wrap">
<table>
<thead><tr><th>Process</th><th>Job</th></tr></thead>
<tbody>
<tr><td>مفهوم سیستم‌عامل</td><td>مفهوم Shell</td></tr>
<tr><td>دارای PID</td><td>دارای Job ID</td></tr>
<tr><td>توسط Kernel مدیریت می‌شود</td><td>توسط Shell مدیریت می‌شود</td></tr>
<tr><td>مستقل از Terminal می‌تواند وجود داشته باشد</td><td>به Job Control همان Shell مربوط است</td></tr>
</tbody>
</table>
</div>
<div class="box note"><i class="fas fa-circle-info"></i><div><strong>نکته مهم</strong> یک Job می‌تواند شامل یک یا چند Process باشد. پس Job و Process را یکی ندانید.</div></div>

<h3>۲۳. Foreground و Background</h3>
<ul>
<li><strong>Foreground:</strong> برنامه در ارتباط مستقیم با Shell/Terminal است: <div class="code-container"><span class="code-label">دستور</span><div class="code-block">command</div></div></li>
<li><strong>Background:</strong> برنامه در پس‌زمینه اجرا می‌شود؛ معمولاً با: <div class="code-container"><span class="code-label">دستور</span><div class="code-block">command &</div></div> مثلاً: <div class="code-container"><span class="code-label">دستور</span><div class="code-block">sleep 300 &</div></div> در این حالت Shell می‌تواند دوباره Command دریافت کند.</li>
</ul>

<h3>۲۴. <code>nohup</code></h3>
<p>فرض کنید با SSH به یک Server متصل شده‌اید:</p>
<div class="code-container"><span class="code-label">اتصال</span><div class="code-block no-prompt">Your PC\n   │\n   │ SSH\n   ↓\nServer</div></div>
<p>یک برنامه‌ی طولانی اجرا می‌کنید:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">long-command</div></div>
<p>اگر Session قطع شود، ممکن است Process نیز به دلیل دریافت SIGHUP خاتمه پیدا کند. برای اجرای Command به شکلی که از Hangup ناشی از خروج Session مستقل‌تر باشد، می‌توان از این استفاده کرد:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">nohup command &</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">nohup ./backup.sh &</div></div>
<p>به‌طور پیش‌فرض خروجی معمولی <code>nohup</code> معمولاً به فایلی مانند <code>nohup.out</code> هدایت می‌شود، اگر جای دیگری Redirect نشده باشد.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> هدف اصلی <code>nohup</code>: جلوگیری از تأثیر Hangup شدن Session بر اجرای Command.</div></div>

<h3>۲۵. <code>tmux</code></h3>
<p>حالا ابزار حرفه‌ای‌تر و بسیار مهمی داریم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">tmux</div></div>
<p><code>tmux</code> یک <strong>Terminal Multiplexer</strong> است؛ یعنی می‌توانید داخل یک Session ترمینال، چند Window و Pane داشته باشید و Session را حفظ کنید.</p>
<p><strong>چرا برای SSH مفید است؟</strong></p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">SSH\n ↓\nServer\n ↓\ntmux session\n ↓\nlong-running command</div></div>
<p>اگر ارتباط SSH قطع شود، Session <code>tmux</code> می‌تواند روی Server باقی بماند. بعداً دوباره وصل می‌شوید:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">tmux attach</div></div>
<p>و به همان Session برمی‌گردید. <code>tmux</code> به‌خصوص برای کار تعاملی بسیار مناسب است.</p>
<div class="code-container"><span class="code-label">تفاوت مهم با nohup</span><div class="code-block no-prompt">nohup\n→ اجرای Command را از Hangup مستقل‌تر می‌کند\n\ntmux\n→ یک Session ترمینال پایدار ایجاد می‌کند</div></div>

<h3>۲۶. <code>nohup</code> یا <code>tmux</code>؟</h3>
<div class="table-wrap">
<table>
<thead><tr><th>ویژگی</th><th><code>nohup</code></th><th><code>tmux</code></th></tr></thead>
<tbody>
<tr><td>اجرای Command بعد از قطع Session</td><td>✅</td><td>✅</td></tr>
<tr><td>محیط تعاملی</td><td>محدود</td><td>✅</td></tr>
<tr><td>حفظ Session ترمینال</td><td>❌</td><td>✅</td></tr>
<tr><td>چند Window/Pane</td><td>❌</td><td>✅</td></tr>
<tr><td>مناسب کار طولانی روی SSH</td><td>✅</td><td>⭐ بسیار مناسب</td></tr>
</tbody>
</table>
</div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> اگر سؤال درباره‌ی <strong>ادامه‌ی یک Command بدون وابستگی به Hangup</strong> باشد → <code>nohup</code>. اگر درباره‌ی <strong>حفظ یک Session ترمینال و اتصال مجدد به آن</strong> باشد → <code>tmux</code>.</div></div>

<h3>۲۷. یک سناریوی واقعی</h3>
<p>فرض کنید روی یک Server از طریق SSH کار می‌کنید:</p>
<ol>
<li><strong>ایجاد Session:</strong> <div class="code-container"><span class="code-label">دستور</span><div class="code-block">tmux</div></div></li>
<li><strong>اجرای برنامه:</strong> <div class="code-container"><span class="code-label">دستور</span><div class="code-block">./backup.sh</div></div></li>
<li><strong>بررسی Processها</strong> (در یک Pane یا Window دیگر): <div class="code-container"><span class="code-label">دستور</span><div class="code-block">ps aux</div></div></li>
<li><strong>بررسی مصرف منابع:</strong> <div class="code-container"><span class="code-label">دستور</span><div class="code-block">top</div></div></li>
<li><strong>پیدا کردن PID:</strong> مثلاً <code>backup.sh → PID = 2451</code></li>
<li><strong>درخواست پایان:</strong> <div class="code-container"><span class="code-label">دستور</span><div class="code-block">kill 2451</div></div></li>
<li><strong>اگر پاسخ نداد:</strong> <div class="code-container"><span class="code-label">دستور</span><div class="code-block">kill -9 2451</div></div></li>
<li><strong>اگر اتصال SSH قطع شد:</strong> بعداً دوباره وصل می‌شوید و <div class="code-container"><span class="code-label">دستور</span><div class="code-block">tmux attach</div></div> به Session برمی‌گردید.</li>
</ol>

<h2>مقایسه‌های طلایی LPIC-1</h2>
<h3><code>apt</code> vs <code>dpkg</code></h3>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">apt\n→ سطح بالاتر\n→ Repository\n→ Dependency Management\n\ndpkg\n→ سطح پایین‌تر\n→ کار مستقیم با .deb</div></div>
<h3><code>dnf</code> vs <code>rpm</code></h3>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">dnf\n→ سطح بالاتر\n→ Repository\n→ Dependency Management\n\nrpm\n→ سطح پایین‌تر\n→ کار مستقیم با .rpm</div></div>
<h3><code>ps</code> vs <code>top</code></h3>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">ps\n→ Snapshot\n\ntop\n→ Dynamic / Live</div></div>
<h3><code>kill</code> vs <code>pkill</code> vs <code>killall</code></h3>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">kill\n→ PID\n\npkill\n→ Pattern / Process attributes\n\nkillall\n→ Process name</div></div>
<h3>Process vs Job</h3>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">Process\n→ Kernel\n→ PID\n\nJob\n→ Shell\n→ Job ID</div></div>
<h3><code>nohup</code> vs <code>tmux</code></h3>
<div class="code-container"><span class="code-label">مقایسه</span><div class="code-block no-prompt">nohup\n→ جلوگیری از تأثیر Hangup بر Command\n\ntmux\n→ حفظ Session ترمینال</div></div>

<h2>دام‌های امتحانی ⚠️</h2>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۱</strong> <code>kill</code> همیشه Process را فوراً می‌کشد؟ ❌ خیر؛ <code>kill</code> یک Signal ارسال می‌کند.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۲</strong> <code>kill -9</code> یعنی Signal شماره ۹ را به صورت عادی قابل کنترل ارسال کن؟ ❌ خیر؛ <code>SIGKILL</code> قابل Catch یا Ignore نیست.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۳</strong> <code>ps</code> نمایش زنده است؟ ❌ خیر؛ <code>ps</code> یک Snapshot می‌دهد.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۴</strong> Program و Process یکی هستند؟ ❌ خیر؛ Program روی دیسک است، Process نمونه‌ی در حال اجرای آن است.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۵</strong> Job همان Process است؟ ❌ خیر؛ Job مفهومی در Shell است و می‌تواند شامل یک یا چند Process باشد.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۶</strong> <code>dpkg</code> همان <code>apt</code> است؟ ❌ خیر؛ هر دو مربوط به Debian هستند، اما سطح و نقش یکسانی ندارند.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۷</strong> <code>rpm</code> و <code>dnf</code> کاملاً یکسان هستند؟ ❌ خیر؛ <code>rpm</code> ابزار سطح پایین‌تر برای Packageهای RPM است؛ <code>dnf</code> مدیریت سطح بالاتر و Dependency/Repository را انجام می‌دهد.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۸</strong> <code>tmux</code> فقط برای اجرای Background است؟ ❌ خیر؛ <code>tmux</code> یک Terminal Multiplexer برای حفظ و مدیریت Sessionهای ترمینال است.</div></div>

<h2>🧠 نقشه ذهنی جلسه</h2>
<div class="code-container"><span class="code-label">نقشه</span><div class="code-block no-prompt">Software Management\n│\n├── Repository\n│\n├── Package\n│   ├── .deb\n│   │   ├── apt\n│   │   └── dpkg\n│   │\n│   └── .rpm\n│       ├── dnf\n│       └── rpm\n│\n├── Source Code\n│\n├── Snap\n└── AppImage\n\n\nProcess Management\n│\n├── Program\n│     ↓ Execute\n├── Process\n│     └── PID\n│\n├── ps\n├── top\n│\n├── Signals\n│     ├── kill\n│     ├── pkill\n│     └── killall\n│\n├── Job Control\n│     ├── jobs\n│     ├── bg\n│     └── fg\n│\n├── nohup\n└── tmux</div></div>

<h2>جمع‌بندی مفهومی</h2>
<p>کل جلسه را می‌توان در این زنجیره دید:</p>
<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">Software\n   ↓\nInstall\n   │\n   ├── Repository / Package\n   ├── Source\n   ├── Snap\n   └── AppImage\n   ↓\nExecute\n   ↓\nProcess\n   ↓\nPID\n   ↓\nObserve\n   ├── ps\n   └── top\n   ↓\nManage\n   ├── kill\n   ├── pkill\n   └── killall</div></div>
<p>و برای کنترل اجرای برنامه‌ها:</p>
<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">Shell\n │\n ├── Foreground\n │\n ├── Background\n │\n ├── jobs\n │\n ├── bg\n │\n └── fg\n\nLong-running / Remote Work\n │\n ├── nohup\n └── tmux</div></div>

<h2>⚡ حفظی‌های همان جلسه — مرور ۲ تا ۳ دقیقه‌ای</h2>
<h3>Software</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">.deb → Debian → apt / dpkg\n.rpm → Red Hat → dnf / rpm</div></div>
<h3>Process</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Program → Execute → Process → PID</div></div>
<h3>مشاهده</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">ps  → Snapshot\ntop → Live</div></div>
<h3>Signal</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">kill PID\nkill -9 PID → SIGKILL</div></div>
<h3>نام Process</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">pkill\nkillall</div></div>
<h3>Job</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Ctrl+Z → Stop\njobs   → Show Jobs\nbg     → Background\nfg     → Foreground</div></div>
<h3>Session</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">nohup → مقاومت در برابر Hangup\ntmux  → حفظ Session ترمینال</div></div>

<h2>🎯 خودآزمایی جلسه ۳</h2>
<div class="box note"><i class="fas fa-check-circle"></i><div><strong>قبل از رفتن به جلسه بعد، بدون نگاه کردن به جزوه جواب دهید:</strong>
<ol>
<li>Repository چیست؟</li>
<li>Package چیست؟</li>
<li>تفاوت <code>.deb</code> و <code>.rpm</code> چیست؟</li>
<li>تفاوت <code>apt</code> و <code>dpkg</code> چیست؟</li>
<li>تفاوت <code>dnf</code> و <code>rpm</code> چیست؟</li>
<li>Source Code چه تفاوتی با Package دارد؟</li>
<li>Snap چیست؟</li>
<li>AppImage چه تفاوتی با Package سنتی دارد؟</li>
<li>Program و Process چه تفاوتی دارند؟</li>
<li>PID چیست؟</li>
<li><code>ps</code> چه کاری انجام می‌دهد؟</li>
<li>تفاوت <code>ps</code> و <code>top</code> چیست؟</li>
<li>Signal چیست؟</li>
<li><code>kill PID</code> چه کاری انجام می‌دهد؟</li>
<li><code>kill -9 PID</code> چه تفاوتی با <code>kill PID</code> دارد؟</li>
<li><code>pkill</code> چه زمانی مفید است؟</li>
<li><code>killall</code> چه زمانی مفید است؟</li>
<li>Job چیست؟</li>
<li><code>Ctrl+Z</code> چه می‌کند؟</li>
<li>تفاوت <code>bg</code> و <code>fg</code> چیست؟</li>
<li><code>nohup</code> چه مشکلی را حل می‌کند؟</li>
<li><code>tmux</code> چه مشکلی را حل می‌کند؟</li>
<li>تفاوت Job ID و PID چیست؟</li>
<li>اگر Processی با <code>kill</code> خاتمه پیدا نکرد، چه گزینه‌ای دارید؟</li>
<li>اگر بخواهید بعد از قطع SSH یک محیط ترمینال قابل بازگشت داشته باشید، کدام ابزار مناسب‌تر است؟</li>
</ol>
</div></div>

<h2>⭐ سؤال طلایی جلسه</h2>
<p>فرض کنید <code>./server.sh</code> را اجرا کرده‌اید. برنامه خیلی CPU مصرف می‌کند و می‌خواهید آن را بررسی کنید. اول:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">top</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ps aux</div></div>
<p>بعد PID را پیدا می‌کنید؛ مثلاً <code>server.sh → PID 2451</code>. سپس:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">kill 2451</div></div>
<p>اگر به Signal عادی پاسخ نداد:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">kill -9 2451</div></div>
<div class="code-container"><span class="code-label">زنجیره طلایی</span><div class="code-block no-prompt">اجرای Program\n      ↓\nProcess\n      ↓\nPID\n      ↓\nObserve\n      ↓\nps / top\n      ↓\nSignal\n      ↓\nkill</div></div>
<p>این زنجیره یکی از مهم‌ترین مدل‌های ذهنی این جلسه است.</p>

<div class="code-container"><span class="code-label">مسیر جلسه بعد</span><div class="code-block no-prompt">Hardware\n   ↓\nDisk\n   ↓\nPartition\n   ↓\nFilesystem\n   ↓\nMount\n   ↓\nStorage Management</div></div>
که پایه‌ی بخش مهمی از مدیریت سیستم در لینوکس و LPIC-1 است.
</div></div>

<h2>قبل از شروع...</h2>
<p>فرض کن یک SSD جدید به سیستم وصل کرده‌ای. آیا همین الان می‌توانی داخل آن فایل ذخیره کنی؟ ❌ معمولاً نه. برای استفاده از آن باید چند مفهوم را پشت سر هم بفهمیم:</p>
<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">Disk\n  ↓\nPartition\n  ↓\nFilesystem\n  ↓\nMount\n  ↓\nDirectory\n  ↓\nFile</div></div>
<p>این <strong>مهم‌ترین نقشه‌ی جلسه</strong> است. اما یک نکته: همه‌ی سیستم‌ها الزاماً دقیقاً به این شکل نیستند؛ مثلاً می‌توان Filesystem را مستقیماً روی یک Disk ساخت، یا در LVM/RAID لایه‌های دیگری بین این اجزا قرار داد.</p>

<h2>بخش اول — Hardware</h2>

<h3>۱. سخت‌افزار چیست؟</h3>
<p>Hardware یعنی قطعات فیزیکی سیستم. مثلاً:</p>
<ul>
<li>CPU</li>
<li>RAM</li>
<li>HDD / SSD / NVMe</li>
<li>Network Card</li>
<li>GPU</li>
<li>USB Devices</li>
</ul>
<p>سیستم‌عامل باید بتواند این سخت‌افزارها را شناسایی و کنترل کند.</p>

<h3>۲. Kernel و Hardware</h3>
<p>در لینوکس، <strong>Kernel</strong> نقش اصلی را در ارتباط با Hardware دارد. مدل ذهنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Application\n     ↓\nKernel\n     ↓\nHardware</div></div>
<p>مثلاً یک برنامه می‌خواهد روی Disk داده بنویسد. مستقیماً با سخت‌افزار صحبت نمی‌کند؛ درخواست خود را از طریق Kernel انجام می‌دهد.</p>

<h3>۳. <code>lshw</code></h3>
<p>برای مشاهده‌ی اطلاعات سخت‌افزار می‌توان از:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo lshw</div></div>
<p>استفاده کرد. برای خروجی خلاصه‌تر:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo lshw -short</div></div>

<h4>ابزارهای کاربردی دیگر</h4>
<div class="table-wrap">
<table>
<thead><tr><th>هدف</th><th>دستور</th><th>توضیح</th></tr></thead>
<tbody>
<tr><td>CPU</td><td><code>lscpu</code></td><td>اطلاعات CPU را نمایش می‌دهد</td></tr>
<tr><td>Memory</td><td><code>lsmem</code></td><td>اطلاعات مربوط به Memory را نمایش می‌دهد</td></tr>
<tr><td>Storage</td><td><code>lsblk</code></td><td>دیسک‌ها و Block Deviceها و Partitionها را نمایش می‌دهد</td></tr>
</tbody>
</table>
</div>

<h2>بخش دوم — Kernel Module</h2>

<h3>۴. Kernel Module چیست؟</h3>
<p>Kernel برای پشتیبانی از Hardware و قابلیت‌های مختلف از <strong>Module</strong>ها نیز استفاده می‌کند. Kernel Module را می‌توان به صورت ساده یک <strong>قطعه کد قابل بارگذاری در Kernel</strong> در نظر گرفت. مثلاً ممکن است یک Driver به صورت Module در اختیار Kernel قرار گیرد. مدل ذهنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Hardware\n   ↓\nDriver / Kernel Module\n   ↓\nKernel\n   ↓\nLinux</div></div>
<div class="box note"><i class="fas fa-circle-info"></i><div><strong>نکته</strong> مثال USB را بیش از حد ساده نکن. وصل کردن فلش لزوماً به این معنی نیست که «یک Module جدید همان لحظه بارگذاری می‌شود». بسیاری از Moduleهای موردنیاز ممکن است از قبل در Kernel یا به صورت Module آماده باشند.</div></div>

<h3>۵. <code>lsmod</code></h3>
<p>برای مشاهده‌ی Kernel Moduleهای بارگذاری‌شده:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">lsmod</div></div>

<h3>۶. <code>modinfo</code></h3>
<p>برای مشاهده‌ی اطلاعات یک Module:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">modinfo module_name</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">modinfo e1000e</div></div>

<h3>۷. <code>modprobe</code></h3>
<p>برای بارگذاری یک Module:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo modprobe module_name</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sudo modprobe dummy</div></div>
<p><code>modprobe</code> می‌تواند Dependencyهای Module را نیز مدیریت کند. همچنین برای حذف Module:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo modprobe -r module_name</div></div>
<p>استفاده می‌شود.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>Exam Tip ⭐</strong>
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">lsmod\n→ Moduleهای Loaded\n\nmodinfo\n→ اطلاعات Module\n\nmodprobe\n→ Load / Remove Module + Dependency handling</div></div>
</div></div>

<h2>بخش سوم — Disk و Partition</h2>

<h3>۸. Disk چیست؟</h3>
<p>Disk یا Storage Device سخت‌افزار ذخیره‌سازی است. مثلاً:</p>
<ul>
<li>HDD</li>
<li>SATA SSD</li>
<li>NVMe SSD</li>
</ul>
<p>در لینوکس این دستگاه‌ها معمولاً به صورت <strong>Block Device</strong> دیده می‌شوند. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">/dev/sda\n/dev/sdb</div></div>
<p>یا در NVMe:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">/dev/nvme0n1</div></div>

<h3>۹. Partition چیست؟</h3>
<p>Partition یعنی یک بخش منطقی از یک Disk. مثلاً یک Disk یک ترابایتی:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">1 TB Disk\n│\n├── Partition 1 → 200 GB\n├── Partition 2 → 500 GB\n└── Partition 3 → 300 GB</div></div>
<p>Partition به تنهایی Filesystem نیست. فقط مشخص می‌کند یک محدوده از Disk متعلق به یک Partition است.</p>

<h3>۱۰. چرا Partition می‌سازیم؟</h3>
<p>دلایل مختلفی وجود دارد:</p>
<ul>
<li>جدا کردن بخش‌های مختلف Storage</li>
<li>نصب سیستم‌عامل‌های مختلف</li>
<li>ایجاد ساختار مناسب برای Storage</li>
<li>قرار دادن Filesystemهای متفاوت در بخش‌های مختلف</li>
</ul>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">/dev/sda1 → Linux\n/dev/sda2 → Data\n/dev/sda3 → Swap</div></div>

<h3>۱۱. <code>fdisk</code></h3>
<p>یکی از ابزارهای معروف برای مدیریت Partitionها:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo fdisk /dev/sda</div></div>
<p>و برای نمایش جدول Partitionها:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo fdisk -l</div></div>
<p>با <code>fdisk</code> می‌توان Partitionها را ایجاد، حذف و تغییر داد.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>Exam Trap ⚠️</strong> <code>fdisk</code> برای <strong>Partitioning</strong> است. برای ساخت Filesystem از آن استفاده نمی‌کنیم.
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">fdisk\n→ Partition\n\nmkfs\n→ Filesystem</div></div>
</div></div>

<h2>بخش چهارم — Filesystem</h2>

<h3>۱۲. Filesystem چیست؟</h3>
<p>حالا فرض کن Partition ساخته‌ای. آیا هنوز می‌توانی فایل بسازی؟ معمولاً باید روی آن یک <strong>Filesystem</strong> داشته باشی. Filesystem مشخص می‌کند داده‌ها چگونه روی Storage سازماندهی و مدیریت شوند. مثلاً:</p>
<ul>
<li>فایل‌ها کجا قرار بگیرند</li>
<li>Directoryها چگونه مدیریت شوند</li>
<li>Metadata چگونه نگهداری شود</li>
<li>فضای Storage چگونه مدیریت شود</li>
</ul>
<h4>مثال</h4>
<p>Filesystemهای معروف:</p>
<div class="code-container"><span class="code-label">نمونه‌ها</span><div class="code-block no-prompt">ext4\nXFS\nBtrfs\nVFAT</div></div>

<h3>۱۳. ساخت Filesystem</h3>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo mkfs.ext4 /dev/sdb1</div></div>
<p>یعنی روی <code>/dev/sdb1</code> یک Filesystem از نوع ext4 ایجاد کن. مدل ذهنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Disk\n ↓\nPartition\n ↓\nmkfs.ext4\n ↓\next4 Filesystem</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>Exam Trap ⚠️</strong> این دو را اشتباه نکن:
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">fdisk\n→ Partition</div></div>
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">mkfs\n→ Filesystem</div></div>
</div></div>

<h3>۱۴. Partition و Filesystem چه تفاوتی دارند؟</h3>
<p>یک تشبیه ساده:</p>
<div class="table-wrap">
<table>
<thead><tr><th>Partition</th><th>Filesystem</th></tr></thead>
<tbody>
<tr><td>اتاق</td><td>سیستم قفسه‌بندی و مدیریت وسایل داخل اتاق</td></tr>
</tbody>
</table>
</div>
<p>Partition می‌گوید: «این قسمت از Disk متعلق به این بخش است.» Filesystem می‌گوید: «داده‌ها را در این قسمت چگونه مدیریت کنیم؟»</p>

<h2>بخش پنجم — Mount</h2>

<h3>۱۵. Mount چیست؟</h3>
<p>این قسمت بسیار مهم است. در لینوکس Filesystem باید به یک مسیر در Directory Tree <strong>متصل (Mount)</strong> شود تا بتوان از آن از طریق آن مسیر استفاده کرد. مثلاً:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">/dev/sdb1\n    │\n    │ mount\n    ↓\n/mnt/data</div></div>
<p>بعد از Mount:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">/mnt/data/file.txt</div></div>
<p>می‌تواند فایلی روی Filesystem مربوط به <code>/dev/sdb1</code> باشد.</p>

<h3>۱۶. Mount Point چیست؟</h3>
<p>مسیر مقصدی که Filesystem روی آن Mount می‌شود <strong>Mount Point</strong> نام دارد. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">/mnt/data</div></div>
<p>یک Mount Point است.</p>

<h3>۱۷. <code>mount</code></h3>
<p>برای Mount کردن:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo mount /dev/sdb1 /mnt/data</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Filesystem\n/dev/sdb1\n     ↓\n/mnt/data</div></div>
<p>برای دیدن اطلاعات Mountها می‌توان از:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">mount</div></div>
<p>استفاده کرد. همچنین:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">findmnt</div></div>
<p>ابزار بسیار مناسبی برای مشاهده‌ی Mountهاست.</p>

<h3>۱۸. <code>umount</code></h3>
<p>برای Unmount کردن:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo umount /mnt/data</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo umount /dev/sdb1</div></div>
<p>بعد از Unmount، آن Filesystem دیگر از آن Mount Point در دسترس نیست.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>نکته مهم ⚠️</strong> دستور درست:
<div class="code-container"><span class="code-label">درست</span><div class="code-block">umount</div></div>
است. نه:
<div class="code-container"><span class="code-label">نادرست</span><div class="code-block no-prompt">unmount</div></div>
</div></div>

<h3>۱۹. چرا باید قبل از جدا کردن Storage آن را Unmount کنیم؟</h3>
<p>ممکن است سیستم هنوز در حال:</p>
<ul>
<li>خواندن داده</li>
<li>نوشتن داده</li>
<li>استفاده از فایل‌های آن Filesystem</li>
</ul>
<p>باشد. Unmount کمک می‌کند Filesystem به شکل صحیح از Directory Tree جدا شود و عملیات‌های لازم به پایان برسند.</p>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته مهم</strong> Unmount کردن به معنی خاموش کردن فیزیکی Disk نیست. برای مثال:
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">umount\n→ جدا کردن Filesystem از مسیر</div></div>
با:
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">Power Off / Remove Device\n→ خارج کردن فیزیکی Device</div></div>
یکسان نیست.</div></div>

<h2>بخش ششم — <code>lsblk</code> و <code>blkid</code></h2>

<h3>۲۰. <code>lsblk</code></h3>
<p>یکی از مهم‌ترین دستورات Storage:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">lsblk</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">خروجی نمونه</span><div class="code-block no-prompt">NAME        SIZE TYPE MOUNTPOINT\nsda         500G disk\n├─sda1      100G part /\n└─sda2      400G part /home\nsdb           1T disk\n└─sdb1        1T part /data</div></div>
<p>با <code>lsblk</code> می‌توان ساختار Block Deviceها را دید. اطلاعاتی مانند:</p>
<ul>
<li>Disk</li>
<li>Partition</li>
<li>Size</li>
<li>Type</li>
<li>Mount Point</li>
</ul>
<p>را می‌توان مشاهده کرد.</p>

<h3>۲۱. <code>blkid</code></h3>
<p>برای مشاهده‌ی اطلاعات Block Deviceها، مخصوصاً UUID و Filesystem Type:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo blkid</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">خروجی نمونه</span><div class="code-block no-prompt">/dev/sdb1: UUID="8b3f..." TYPE="ext4"</div></div>

<h3>۲۲. UUID چیست؟</h3>
<p>UUID مخفف <strong>Universally Unique Identifier</strong> است. Filesystem یا Partition می‌تواند یک شناسه‌ی یکتا داشته باشد. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">UUID=8b3f-1234-....</div></div>
<p>یکی از کاربردهای مهم UUID در:</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">/etc/fstab</div></div>
<p>است.</p>
<h4>چرا UUID مفید است؟</h4>
<p>نام Deviceها همیشه بهترین گزینه برای شناسایی دائمی نیست. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">/dev/sda\n/dev/sdb</div></div>
<p>ممکن است در شرایطی نسبت به ترتیب شناسایی Deviceها تغییر کنند. اما UUID به عنوان شناسه‌ی پایدارتر برای شناسایی Filesystem بسیار مناسب است. مدل ذهنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">/dev/sdb1\n     ↓\nFilesystem\n     ↓\nUUID\n     ↓\n/etc/fstab</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>Exam Tip ⭐</strong> اگر سؤال درباره‌ی «شناسه یکتا برای شناسایی Filesystem» باشد، یکی از پاسخ‌های مهم:
<div class="code-container"><span class="code-label">پاسخ</span><div class="code-block no-prompt">UUID</div></div>
است.</div></div>

<h2>بخش هفتم — <code>df</code> و <code>du</code></h2>

<h3>۲۳. <code>df</code></h3>
<p><code>df</code> مخفف <strong>Disk Free</strong> است. برای مشاهده‌ی فضای استفاده‌شده و آزاد Filesystemها:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">df</div></div>
<p>برای خوانایی بهتر:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">df -h</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">خروجی نمونه</span><div class="code-block no-prompt">Filesystem   Size   Used   Avail   Use%\n/dev/sda1     50G    30G    20G     60%</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>سؤال امتحانی</strong> اگر بپرسند «چقدر فضای Filesystem آزاد است؟» ذهنمان:
<div class="code-container"><span class="code-label">پاسخ</span><div class="code-block">df -h</div></div>
</div></div>

<h3>۲۴. <code>du</code></h3>
<p><code>du</code> مخفف <strong>Disk Usage</strong> است. برای بررسی حجم مصرف‌شده توسط فایل‌ها و Directoryها. مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">du -sh Downloads</div></div>
<p>یعنی حجم کلی <code>Downloads</code> را به شکل خوانا نشان بده.</p>

<h3>۲۵. <code>df</code> در برابر <code>du</code></h3>
<p>این یکی از مهم‌ترین مقایسه‌های جلسه است.</p>
<div class="table-wrap">
<table>
<thead><tr><th><code>df</code></th><th><code>du</code></th></tr></thead>
<tbody>
<tr><td>Filesystem</td><td>File / Directory</td></tr>
<tr><td>فضای Used / Available</td><td>حجم مصرف‌شده</td></tr>
</tbody>
</table>
</div>
<h4>مثال</h4>
<p>اگر می‌پرسی «چقدر فضای <code>/</code> باقی مانده؟»</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">df -h /</div></div>
<p>اگر می‌پرسی «پوشه <code>/var/log</code> چقدر فضا گرفته؟»</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">du -sh /var/log</div></div>

<h2>بخش هشتم — LVM</h2>

<h3>۲۶. LVM چیست؟</h3>
<p>LVM مخفف <strong>Logical Volume Manager</strong> است. هدف اصلی آن فراهم کردن یک لایه‌ی انعطاف‌پذیر برای مدیریت Storage است. به جای اینکه همیشه مستقیماً با Partitionها کار کنیم، LVM یک لایه‌ی منطقی ایجاد می‌کند.</p>

<h3>۲۷. ساختار LVM</h3>
<p>مدل اصلی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Physical Disk\n      ↓\nPartition\n      ↓\nPV\n      ↓\nVG\n      ↓\nLV\n      ↓\nFilesystem</div></div>
<p>سه مفهوم اصلی:</p>
<h4>PV — Physical Volume</h4>
<p>منبع فیزیکی‌ای که LVM از آن استفاده می‌کند. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">/dev/sdb1</div></div>
<p>می‌تواند به عنوان PV استفاده شود.</p>
<h4>VG — Volume Group</h4>
<p>مجموعه‌ای از فضای PVها. مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">PV1 ─┐\n     ├── VG\nPV2 ─┘</div></div>
<h4>LV — Logical Volume</h4>
<p>فضایی منطقی که از VG ایجاد می‌شود.</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">VG\n ↓\nLV</div></div>
<p>سپس می‌توان روی LV یک Filesystem ساخت.</p>

<h3>۲۸. مزیت LVM</h3>
<p>مزیت اصلی LVM: <strong>انعطاف‌پذیری در مدیریت فضای Storage</strong>. مثلاً می‌توان Logical Volumeها را در صورت فراهم بودن شرایط، Resize کرد. همچنین یک VG می‌تواند از چند PV تشکیل شود. مدل ذهنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Several PVs\n     ↓\n    VG\n     ↓\nSeveral LVs\n     ↓\nFilesystems</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>Exam Trap ⚠️</strong> LVM را با RAID یکی نکن.
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">LVM\n→ مدیریت انعطاف‌پذیر Logical Storage</div></div>
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">RAID\n→ ترکیب/توزیع داده روی چند Disk برای هدف‌هایی مثل Redundancy یا Performance</div></div>
</div></div>

<h2>بخش نهم — RAID</h2>

<h3>۲۹. RAID چیست؟</h3>
<p>RAID مخفف <strong>Redundant Array of Independent Disks</strong> است. RAID چند Disk را طبق یک روش مشخص برای دستیابی به ویژگی‌هایی مانند:</p>
<ul>
<li>Redundancy</li>
<li>Fault Tolerance</li>
<li>Performance</li>
</ul>
<p>ترکیب می‌کند.</p>

<h3>۳۰. RAID 0</h3>
<p>RAID 0 از <strong>Striping</strong> استفاده می‌کند. داده‌ها بین چند Disk توزیع می‌شوند.</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Data\n ↓\n┌────────┬────────┐\n│ Disk 1 │ Disk 2 │\n└────────┴────────┘</div></div>
<h4>مزیت</h4>
<p>Performance بهتر.</p>
<h4>عیب بسیار مهم</h4>
<p><strong>هیچ Redundancy ندارد.</strong> اگر یکی از Diskها خراب شود، Array از بین می‌رود و داده‌ها قابل بازیابی از خود Array نیستند.</p>
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">RAID 0\n→ Speed\n→ No Fault Tolerance</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>Exam Trap ⚠️</strong> RAID 0 را «امن» یا «Redundant» تصور نکن.</div></div>

<h3>۳۱. RAID 1</h3>
<p>RAID 1 از <strong>Mirroring</strong> استفاده می‌کند.</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Data\n ↓\n┌────────┬────────┐\n│ Disk 1 │ Disk 2 │\n│  DATA  │  DATA  │\n└────────┴────────┘</div></div>
<p>داده روی Diskهای Mirror نوشته می‌شود.</p>
<h4>مزیت</h4>
<p>اگر یک Disk خراب شود، Copy دیگر باقی می‌ماند.</p>
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">RAID 1\n→ Mirroring\n→ Redundancy</div></div>

<h3>۳۲. RAID 5</h3>
<p>RAID 5 از <strong>Striping + Distributed Parity</strong> استفاده می‌کند. حداقل به <strong>۳ Disk</strong> نیاز دارد. مدل ساده:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Disk 1   Disk 2   Disk 3\n Data      Data    Parity\n Data    Parity     Data\nParity     Data     Data</div></div>
<h4>ویژگی مهم</h4>
<p>می‌تواند خرابی <strong>یک Disk</strong> را تحمل کند.</p>

<h3>۳۳. RAID 10</h3>
<p>RAID 10 ترکیبی از:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">RAID 1\n+\nRAID 0</div></div>
<p>است. یعنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Mirroring\n   +\nStriping</div></div>
<p>حداقل معمولاً <strong>۴ Disk</strong> نیاز دارد.</p>
<h4>ویژگی</h4>
<p>ترکیبی از:</p>
<ul>
<li>Performance</li>
<li>Redundancy</li>
</ul>
<p>را ارائه می‌دهد.</p>

<h3>جدول طلایی RAID</h3>
<div class="table-wrap">
<table>
<thead><tr><th>RAID</th><th>تکنیک</th><th>تحمل خرابی</th><th>نکته اصلی</th></tr></thead>
<tbody>
<tr><td>RAID 0</td><td>Striping</td><td>❌</td><td>Performance، بدون Redundancy</td></tr>
<tr><td>RAID 1</td><td>Mirroring</td><td>✅</td><td>یک Copy روی Disk دیگر</td></tr>
<tr><td>RAID 5</td><td>Striping + Parity</td><td>✅ یک Disk</td><td>Parity توزیع‌شده</td></tr>
<tr><td>RAID 10</td><td>Mirror + Stripe</td><td>✅</td><td>Performance + Redundancy</td></tr>
</tbody>
</table>
</div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> این چهار کلمه را خوب به خاطر بسپار:
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">RAID 0 → Striping\nRAID 1 → Mirroring\nRAID 5 → Parity\nRAID 10 → Mirror + Stripe</div></div>
</div></div>

<h3>یک نکته بسیار مهم درباره RAID ⚠️</h3>
<p>RAID را با Backup یکی نکن. مثلاً RAID 1 یک Copy دیگر از داده ایجاد می‌کند، اما اگر:</p>
<ul>
<li>فایل را اشتباهی حذف کنی،</li>
<li>Ransomware داده‌ها را رمزگذاری کند،</li>
<li>یا اطلاعات خراب شوند،</li>
</ul>
<p>ممکن است همان تغییر روی Copy دیگر نیز اعمال شود. پس:</p>
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">RAID ≠ Backup</div></div>
<p>RAID بیشتر برای <strong>Availability / Fault Tolerance / Performance</strong> استفاده می‌شود.</p>

<h2>سناریوی واقعی — یک Disk جدید</h2>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">/dev/sdb</div></div>
<p>یک Disk جدید است.</p>

<h3>مرحله ۱ — بررسی Disk</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">lsblk</div></div>

<h3>مرحله ۲ — ساخت Partition</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo fdisk /dev/sdb</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">/dev/sdb1</div></div>
<p>ایجاد می‌شود.</p>

<h3>مرحله ۳ — ساخت Filesystem</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo mkfs.ext4 /dev/sdb1</div></div>

<h3>مرحله ۴ — ساخت Mount Point</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo mkdir /mnt/data</div></div>

<h3>مرحله ۵ — Mount</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo mount /dev/sdb1 /mnt/data</div></div>

<h3>مرحله ۶ — بررسی</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">lsblk\ndf -h</div></div>
<p>حالا:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">/mnt/data</div></div>
<p>به Filesystem جدید متصل است.</p>

<h2>🧠 مسیر کامل Storage</h2>
<p>حالا کل مسیر را ببین:</p>
<div class="code-container"><span class="code-label">زنجیره کامل</span><div class="code-block no-prompt">Physical Disk\n      ↓\nPartition\n      ↓\nFilesystem\n      ↓\nMount\n      ↓\nDirectory\n      ↓\nFile</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">/dev/sdb\n   ↓\n/dev/sdb1\n   ↓\next4\n   ↓\n/mnt/data\n   ↓\n/mnt/data/report.txt</div></div>
<p>این یکی از مهم‌ترین مدل‌های ذهنی کل فصل Storage است.</p>

<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۲</strong> ❌ Partition همان Filesystem است. ✅ Partition یک بخش از Disk است؛ Filesystem ساختار مدیریت داده روی آن است.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۳</strong> ❌ <code>mount</code> یعنی فایل‌ها را از Disk کپی کن. ✅ <code>mount</code> یعنی Filesystem را به یک مسیر در Directory Tree متصل کن.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۴</strong> ❌ <code>df</code> حجم یک Directory را نشان می‌دهد. ✅ <code>df</code> فضای Used/Available Filesystemها را نشان می‌دهد. برای حجم Directory:
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">du -sh directory</div></div>
</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۵</strong> ❌ <code>lsblk</code> فقط Partitionها را نشان می‌دهد. ✅ Block Deviceها، Diskها و Partitionها و در صورت درخواست، Mount Pointها را نشان می‌دهد.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۶</strong> ❌ UUID فقط نام دیگری برای <code>/dev/sda1</code> است. ✅ UUID یک شناسه‌ی یکتا برای شناسایی Storage Object/Filesystem است.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۷</strong> ❌ RAID 0 امنیت بیشتری دارد. ✅ RAID 0 هیچ Redundancy ندارد.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۸</strong> ❌ RAID 1 یعنی Backup. ✅ RAID 1 یعنی Mirroring و Redundancy؛ Backup نیست.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۹</strong> ❌ LVM و RAID یک کار انجام می‌دهند. ✅ LVM روی مدیریت انعطاف‌پذیر Logical Storage تمرکز دارد؛ RAID روی ترکیب Diskها با ویژگی‌هایی مثل Redundancy و Performance.</div></div>

<h2>🧠 نقشه ذهنی جلسه</h2>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Hardware\n│\n├── CPU\n├── RAM\n├── Disk\n└── Network\n      │\n      ↓\n    Kernel\n      │\n      └── Kernel Modules\n             ├── lsmod\n             ├── modinfo\n             └── modprobe\n\n\nStorage\n│\n├── Disk\n│\n├── Partition\n│     └── fdisk\n│\n├── Filesystem\n│     └── mkfs\n│\n├── Mount\n│     ├── mount\n│     └── umount\n│\n├── Identification\n│     ├── lsblk\n│     └── blkid\n│\n├── Space\n│     ├── df\n│     └── du\n│\n├── LVM\n│     ├── PV\n│     ├── VG\n│     └── LV\n│\n└── RAID\n      ├── 0 → Stripe\n      ├── 1 → Mirror\n      ├── 5 → Parity\n      └── 10 → Mirror + Stripe</div></div>

<div class="box important"><i class="fas fa-check-circle"></i><div><strong>✅ چک‌لیست مرور ۲ دقیقه‌ای</strong>
اگر بتوانی این سؤال‌ها را جواب بدهی، جلسه را خوب یاد گرفته‌ای:
<ul>
<li>Hardware و Kernel چه ارتباطی دارند؟</li>
<li>Kernel Module چیست؟</li>
<li>تفاوت <code>lsmod</code>، <code>modinfo</code> و <code>modprobe</code> چیست؟</li>
<li>Disk و Partition چه تفاوتی دارند؟</li>
<li><code>fdisk</code> چه کاری انجام می‌دهد؟</li>
<li>Filesystem چیست؟</li>

<li><code>lsblk</code> چه چیزی نشان می‌دهد؟</li>
<li><code>blkid</code> چه اطلاعاتی می‌دهد؟</li>

<li>LVM چیست؟</li>

<li>RAID 0 چه ویژگی‌ای دارد؟</li>
<li>RAID 1 چه ویژگی‌ای دارد؟</li>
<li>RAID 5 چه ویژگی‌ای دارد؟</li>

</div></div>

<div class="box note"><i class="fas fa-flag-checkered"></i><div><strong>⚡ حفظی‌های همان جلسه — مرور ۲ تا ۳ دقیقه‌ای</strong>
<h4>Storage Path</h4>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Disk\n ↓\nPartition\n ↓\nFilesystem\n ↓\nMount\n ↓\nFile</div></div>
<h4>Partition / Filesystem</h4>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">fdisk → Partition\nmkfs  → Filesystem</div></div>

<h4>مشاهده Storage</h4>

<h4>فضای Storage</h4>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">df → Filesystem Space\ndu → File / Directory Usage</div></div>
<h4>LVM</h4>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">PV → VG → LV → Filesystem</div></div>

<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">0  → Stripe\n1  → Mirror\n5  → Parity\n10 → Mirror + Stripe</div></div>

<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">lsmod   → Loaded Modules\nmodinfo → Module Info\nmodprobe → Load / Remove</div></div>
</div></div>

<div class="box important"><i class="fas fa-star"></i><div><strong>⭐ سؤال طلایی جلسه</strong>
فرض کن یک Disk جدید داری:

<h2>قبل از شروع...</h2>
<p>فرض کن روی یک Server فایل مهمی داری:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block">report.txt</div></div>
<p>حالا ممکن است بخواهی:</p>
<ul>
<li>از آن یک Copy بسازی.</li>
<li>آن را جابه‌جا یا Rename کنی.</li>
