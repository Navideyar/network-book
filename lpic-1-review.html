<h2>مقایسه‌های طلایی LPIC-1</h2>
<h3><code>/etc/passwd</code> vs <code>/etc/shadow</code></h3>
<div class="code-container"><span class="code-label">passwd</span><div class="code-block no-prompt">/etc/passwd\n→ Account Information</div></div>
<div class="code-container"><span class="code-label">shadow</span><div class="code-block no-prompt">/etc/shadow\n→ Password Information</div></div>

<h3>User vs Group</h3>
<div class="code-container"><span class="code-label">User</span><div class="code-block no-prompt">User\n→ یک Account</div></div>
<div class="code-container"><span class="code-label">Group</span><div class="code-block no-prompt">Group\n→ مجموعه‌ای از Userها</div></div>

<h3><code>su</code> vs <code>sudo</code></h3>
<div class="code-container"><span class="code-label">su</span><div class="code-block no-prompt">su\n→ Switch User\n→ Shell</div></div>
<div class="code-container"><span class="code-label">sudo</span><div class="code-block no-prompt">sudo\n→ Run Command\n→ Elevated Privileges</div></div>

<h3><code>su</code> vs <code>su -</code></h3>
<div class="code-container"><span class="code-label">su</span><div class="code-block no-prompt">su\n→ Switch User</div></div>
<div class="code-container"><span class="code-label">su -</span><div class="code-block no-prompt">su -\n→ Login Shell\n→ Environment User مقصد</div></div>

<h3><code>chmod</code> vs <code>sudo</code></h3>
<p>این دو را با هم اشتباه نکن:</p>
<div class="code-container"><span class="code-label">chmod</span><div class="code-block no-prompt">chmod\n→ Permission فایل/Directory</div></div>
<div class="code-container"><span class="code-label">sudo</span><div class="code-block no-prompt">sudo\n→ اجرای Command با Privilege بالاتر</div></div>

<h3>Log File vs Journal</h3>
<div class="code-container"><span class="code-label">Log File</span><div class="code-block no-prompt">/var/log\n→ محل رایج Logهای متنی</div></div>
<div class="code-container"><span class="code-label">Journal</span><div class="code-block no-prompt">journalctl\n→ مشاهده Journal مربوط به systemd</div></div>

<h3><code>date</code> vs <code>timedatectl</code></h3>
<div class="code-container"><span class="code-label">date</span><div class="code-block no-prompt">date\n→ مشاهده زمان</div></div>
<div class="code-container"><span class="code-label">timedatectl</span><div class="code-block no-prompt">timedatectl\n→ مدیریت Time / Time Zone / NTP</div></div>

<h3>GUI vs CLI</h3>
<div class="code-container"><span class="code-label">CLI</span><div class="code-block no-prompt">CLI\n→ Command\n→ Shell</div></div>
<div class="code-container"><span class="code-label">GUI</span><div class="code-block no-prompt">GUI\n→ Windows\n→ Menus\n→ Mouse</div></div>

<h3>SSH vs VNC/RDP</h3>
<div class="code-container"><span class="code-label">SSH</span><div class="code-block no-prompt">SSH\n→ Remote CLI</div></div>
<div class="code-container"><span class="code-label">VNC / RDP</span><div class="code-block no-prompt">VNC / RDP\n→ Remote GUI</div></div>

<h2>دام‌های امتحانی ⚠️</h2>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۱</strong> ❌ Password واقعی User در <code>/etc/passwd</code> قرار دارد. ✅ معمولاً اطلاعات Password در <code>/etc/shadow</code> قرار دارد.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۲</strong> ❌ <code>usermod -G</code> همیشه Group قبلی را حفظ می‌کند. ✅ برای اضافه کردن بدون حذف supplementary groupهای قبلی معمولاً <code>usermod -aG group user</code> استفاده می‌کنیم.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۳</strong> ❌ <code>su</code> و <code>sudo</code> یکی هستند. ✅ <code>su</code> → Switch User / Shell؛ <code>sudo</code> → Execute Command with elevated privileges.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۴</strong> ❌ <code>sudo</code> یعنی تبدیل شدن دائمی به root. ✅ <code>sudo</code> معمولاً یک Command را با Privilege مناسب اجرا می‌کند.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۵</strong> ❌ برای ویرایش <code>/etc/sudoers</code> بهتر است با Editor معمولی آن را تغییر دهیم. ✅ <code>visudo</code> انتخاب مناسب‌تری است چون Syntax را بررسی می‌کند.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۶</strong> ❌ تمام Linuxها Logهای خود را دقیقاً در یک فایل مشخص ذخیره می‌کنند. ✅ ساختار Log بین Distributionها متفاوت است، اما <code>/var/log</code> مسیر مهمی است.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۷</strong> ❌ <code>journalctl</code> فقط برای Kernel Log است. ✅ Journal می‌تواند Logهای مختلف سیستم و Serviceهای systemd را در خود داشته باشد.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۸</strong> ❌ <code>date</code> مسئول NTP است. ✅ <code>date</code> برای مشاهده/کار با زمان است؛ همگام‌سازی شبکه‌ای زمان با NTP انجام می‌شود و ابزارهایی مانند <code>timedatectl</code> وضعیت آن را مدیریت/نشان می‌دهند.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۹</strong> ❌ GUI همان Linux است. ✅ Linux Kernel می‌تواند کاملاً بدون GUI اجرا شود.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۱۰</strong> ❌ Desktop Environment همان Window Manager است. ✅ Desktop Environment مجموعه‌ی بزرگ‌تری از اجزای محیط Desktop است.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۱۱</strong> ❌ SSH برای Remote Desktop گرافیکی طراحی شده است. ✅ SSH عمدتاً برای Remote Command Line استفاده می‌شود.</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام ۱۲</strong> ❌ VNC و SSH دقیقاً یک کار انجام می‌دهند. ✅ <code>SSH</code> → Remote CLI؛ <code>VNC</code> → Remote GUI.</div></div>

<h2>نقشه ذهنی جلسه</h2>
<div class="code-container"><span class="code-label">نقشه</span><div class="code-block no-prompt">Users / Services / Time\n│\n├── Users\n│    ├── User\n│    ├── UID\n│    ├── /etc/passwd\n│    ├── /etc/shadow\n│    └── useradd / usermod / userdel\n│\n├── Groups\n│    ├── GID\n│    ├── /etc/group\n│    ├── groupadd\n│    └── groupdel\n│\n├── Privileges\n│    ├── su\n│    ├── sudo\n│    └── visudo\n│\n├── Logs\n│    ├── /var/log\n│    ├── journald\n│    └── journalctl\n│\n├── Time\n│    ├── date\n│    ├── timedatectl\n│    ├── Time Zone\n│    └── NTP\n│\n├── Printer\n│    ├── CUPS\n│    ├── lp\n│    └── lpstat\n│\n└── GUI / Remote\n     ├── GUI\n     ├── X\n     ├── Wayland\n     ├── Desktop Environment\n     ├── SSH\n     ├── VNC\n     └── RDP</div></div>

<h2>ارتباط جلسه ۶ و ۷ 🔗</h2>
<p>جلسه‌ی قبلی را به یاد بیاور:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">BIOS/UEFI\n ↓\nGRUB\n ↓\nKernel\n ↓\ninitramfs\n ↓\nsystemd\n ↓\nServices</div></div>
<p>حالا جلسه‌ی هفتم ادامه‌ی همان داستان است:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">systemd\n   │\n   ├── Services\n   │\n   ├── Users / Sessions\n   │\n   ├── Logs\n   │\n   └── Time-related Services</div></div>
<p>یعنی جلسه‌ی ۶ توضیح داد:</p>
<blockquote>سیستم چگونه Boot می‌شود؟</blockquote>
<p>و جلسه‌ی ۷ توضیح می‌دهد:</p>
<blockquote>بعد از Boot، کاربران و سرویس‌ها و زمان و دسترسی Remote را چگونه مدیریت کنیم؟</blockquote>

<h2>چک‌لیست مرور ۲ دقیقه‌ای ✅</h2>
<p>قبل از رفتن به جلسه‌ی بعد باید بتوانی به این سؤال‌ها جواب بدهی:</p>
<ul>
<li>User چیست؟</li>
<li>UID چیست؟</li>
<li>چرا root ویژه است؟</li>
<li>UID مربوط به root چیست؟</li>
<li><code>/etc/passwd</code> چه اطلاعاتی دارد؟</li>
<li><code>/etc/shadow</code> چه چیزی را نگهداری می‌کند؟</li>
<li>Group چیست؟</li>
<li>GID چیست؟</li>
<li><code>/etc/group</code> چیست؟</li>
<li><code>useradd</code> چه می‌کند؟</li>
<li><code>passwd</code> چه می‌کند؟</li>
<li><code>usermod -aG</code> چه کاربردی دارد؟</li>
<li>تفاوت <code>userdel</code> و <code>userdel -r</code> چیست؟</li>
<li><code>groupadd</code> چه می‌کند؟</li>
<li><code>id</code> چه اطلاعاتی نشان می‌دهد؟</li>
<li><code>su</code> چیست؟</li>
<li><code>su -</code> چه تفاوتی با <code>su</code> دارد؟</li>
<li><code>sudo</code> چیست؟</li>
<li>تفاوت <code>su</code> و <code>sudo</code> چیست؟</li>
<li><code>/etc/sudoers</code> چیست؟</li>
<li>چرا <code>visudo</code> استفاده می‌کنیم؟</li>
<li>Log چیست و چرا مهم است؟</li>
<li><code>/var/log</code> چیست؟</li>
<li><code>journalctl</code> چیست؟</li>
<li><code>journalctl -b</code> چه می‌کند؟</li>
<li><code>journalctl -u</code> چه می‌کند؟</li>
<li><code>date</code> چه می‌کند؟</li>
<li><code>timedatectl</code> چه می‌کند؟</li>
<li>Time Zone چیست؟</li>
<li>UTC چیست؟</li>
<li>NTP چیست؟</li>
<li>چرا Time Synchronization مهم است؟</li>
<li>CUPS چیست؟</li>
<li><code>lp</code> چه می‌کند؟</li>
<li><code>lpstat</code> چه می‌کند؟</li>
<li>GUI چیست؟</li>
<li>CLI و GUI چه تفاوتی دارند؟</li>
<li>X و Wayland چه هستند؟</li>
<li>Desktop Environment چیست؟</li>
<li>SSH چه نوع Remote Accessی فراهم می‌کند؟</li>
<li>VNC و RDP چه کاربردی دارند؟</li>
<li>تفاوت Remote CLI و Remote GUI چیست؟</li>
</ul>

<h2>⭐ سؤال طلایی جلسه</h2>
<p>فرض کن یک Linux Server داریم و می‌خواهیم یک User جدید برای تیم توسعه بسازیم. مسیر ذهنی:</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">Create User\n    ↓\nuseradd\n    ↓\npasswd\n    ↓\nCreate Group\n    ↓\ngroupadd\n    ↓\nAdd User\n    ↓\nusermod -aG\n    ↓\nCheck\n    ↓\nid</div></div>
<p>حالا اگر User نیاز به اجرای یک دستور مدیریتی داشته باشد:</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">User\n ↓\nsudo\n ↓\nAdministrative Command</div></div>
<p>اگر مشکلی ایجاد شد:</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">Problem\n ↓\njournalctl\n ↓\nLogs\n ↓\nTroubleshooting</div></div>
<p>اگر ساعت Server اشتباه بود:</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">timedatectl\n ↓\nNTP\n ↓\nTime Synchronization</div></div>
<p>و اگر بخواهیم از کامپیوتر خودمان به Server وصل شویم:</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">CLI\n→ SSH\n\nGUI\n→ VNC / RDP</div></div>

<h2>جمع‌بندی نهایی جلسه</h2>
<p>در این جلسه دیدیم که بعد از Boot شدن Linux، مدیریت سیستم فقط به Serviceها محدود نمی‌شود. ما باید بتوانیم:</p>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Users\n   ↓\nGroups\n   ↓\nPermissions / Privileges\n   ↓\nServices\n   ↓\nLogs\n   ↓\nTime\n   ↓\nPrinter\n   ↓\nGUI\n   ↓\nRemote Access</div></div>
<p>را مدیریت کنیم. اگر بخواهیم کل جلسه را در یک جمله خلاصه کنیم:</p>
<blockquote>در Linux کاربران و Groupها با ابزارهای User/Group Management مدیریت می‌شوند، <code>su</code> و <code>sudo</code> برای تغییر یا افزایش سطح دسترسی استفاده می‌شوند، Logها برای Troubleshooting حیاتی‌اند، <code>timedatectl</code> و NTP برای مدیریت و همگام‌سازی زمان به کار می‌روند، CUPS سیستم چاپ را مدیریت می‌کند و برای کار با سیستم از راه دور می‌توان از SSH برای CLI و فناوری‌هایی مانند VNC/RDP برای GUI استفاده کرد.</blockquote>
<p>با این جلسه، بخش مهمی از <strong>System Administration</strong> را پوشش دادیم.</p>

<div class="box note"><i class="fas fa-link"></i><div><strong>🔗 اتصال به جلسه بعد</strong> در جلسه‌ی بعد وارد <strong>شبکه در Linux</strong> می‌شویم؛ یعنی IP، DNS، Interfaceها، <code>ip</code>، <code>ping</code>، <code>ss</code>، <code>hostname</code>، <code>dig</code>، <code>host</code>، <code>curl</code> و <code>wget</code> و تمام این‌ها را به یک مسیر مفهومی واحد وصل می‌کنیم.</div></div>

<h2>قبل از شروع...</h2>
<p>فرض کنید یک Linux Server دارید. می‌خواهید بفهمید:</p>
<ul>
<li>آیا Network Interface فعال است؟</li>
<li>IP سیستم چیست؟</li>
<li>آیا به یک سیستم دیگر دسترسی داریم؟</li>
<li>DNS درست کار می‌کند؟</li>
<li>چه Connectionهایی روی سیستم باز هستند؟</li>
<li>یک Website در دسترس است؟</li>
<li>یک فایل را از اینترنت دانلود کنیم؟</li>
</ul>
<p>تمام این موارد هسته‌ی جلسه‌ی هشتم هستند.</p>

<h2>بخش اول — مفاهیم پایه شبکه</h2>

<h3>۱. Network Interface چیست؟</h3>
<p>Linux برای اتصال به شبکه از <strong>Network Interface</strong> استفاده می‌کند. مثال‌ها: <code>eth0</code>، <code>ens33</code>، <code>enp0s3</code>.</p>
<p>برای مشاهده Interfaceها:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ip link\nip addr</div></div>

<h3>۲. IP Address چیست؟</h3>
<p>هر دستگاه در شبکه برای شناسایی شدن به یک <strong>IP Address</strong> نیاز دارد. مثال: <code>192.168.1.20</code>. IP را می‌توان مانند آدرس یک دستگاه در شبکه در نظر گرفت.</p>

<h3>۳. IPv4</h3>
<p>یکی از رایج‌ترین انواع IP <strong>IPv4</strong> است. IPv4 از چهار بخش تشکیل می‌شود: <code>192 . 168 . 1 . 20</code>. هر بخش بین <code>0 تا 255</code> قرار می‌گیرد.</p>

<h3>۴. IPv6</h3>
<p>IPv6 برای فضای بسیار بزرگ‌تر Addressing ایجاد شده است. مثال: <code>2001:db8::10</code>. در LPIC-1 باید مفهوم IPv6 را بشناسید، اما تمرکز عملی مثال‌ها روی IPv4 خواهد بود.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> <code>IPv4</code> → 32-bit؛ <code>IPv6</code> → 128-bit.</div></div>

<h3>۵. Network Interface و IP یکی نیستند</h3>
<p>این دو را با هم اشتباه نکنید. <strong>Network Interface</strong> → کارت/رابط شبکه در Linux؛ <strong>IP Address</strong> → آدرس منطقی اختصاص‌یافته به Interface. مثال: <code>Interface: eth0</code>، <code>IP: 192.168.1.20</code>.</p>

<h2>بخش دوم — مشاهده تنظیمات شبکه</h2>

<h3>۶. دستور <code>ip</code></h3>
<p>یکی از مهم‌ترین ابزارهای شبکه در Linux <code>ip</code> است.</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ip addr\nip a</div></div>

<h3>۷. دیدن Interfaceها</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ip link</div></div>
<p>خروجی نمونه: <code>1: lo</code>، <code>2: eth0</code>.</p>
<p><code>lo</code> چیست؟ <strong>Loopback</strong> رابط مجازی خود سیستم است. آدرس معروف آن <code>127.0.0.1</code> است.</p>

<h3>۸. Loopback</h3>
<p>وقتی می‌خواهید خود سیستم را از طریق Network Stack خودش آزمایش کنید:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ping 127.0.0.1\nping localhost</div></div>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Application\n    ↓\nNetwork Stack\n    ↓\n   lo\n    ↓\nهمان سیستم</div></div>
<p>بنابراین <code>127.0.0.1</code> به سیستم محلی اشاره می‌کند.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>127.0.0.1</code> را با IP کارت شبکه اشتباه نکنید. این Address مربوط به <strong>Loopback</strong> است.</div></div>

<h3>۹. مشاهده Route</h3>
<p>برای دیدن Routing Table:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ip route</div></div>
<p>خروجی نمونه: <code>default via 192.168.1.1 dev eth0</code> یعنی برای مقصدهایی که Route مشخص دیگری ندارند، ترافیک از Gateway <code>192.168.1.1</code> ارسال می‌شود.</p>

<h3>۱۰. Default Gateway چیست؟</h3>
<p>فرض کنید Linux می‌خواهد با یک سیستم خارج از شبکه محلی ارتباط برقرار کند. معمولاً Packet را به <strong>Default Gateway</strong> می‌فرستد.</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Linux\n192.168.1.20\n     │\n     ↓\nGateway\n192.168.1.1\n     │\n     ↓\nInternet</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> <code>IP</code> → آدرس سیستم؛ <code>Gateway</code> → مسیر خروج از شبکه محلی؛ <code>DNS</code> → تبدیل نام به IP. این سه مفهوم را جدا نگه دارید.</div></div>

<h2>بخش سوم — DNS</h2>

<h3>۱۱. DNS چیست؟</h3>
<p>Computer برای برقراری ارتباط معمولاً به IP Address نیاز دارد. DNS این تبدیل را انجام می‌دهد: <code>example.com → DNS → IP Address</code>. به زبان ساده: DNS نام‌های قابل‌فهم برای انسان را به IP تبدیل می‌کند.</p>

<h3>۱۲. DNS Server</h3>
<p>سیستم Linux می‌تواند از یک DNS Server استفاده کند.</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Linux\n  │\n  │ "example.com چه IPای دارد؟"\n  ↓\nDNS Server\n  │\n  ↓\nIP Address</div></div>

<h3>۱۳. تفاوت DNS و Gateway</h3>
<p>این دو بسیار مهم هستند. <strong>Gateway</strong> → مسیر ارسال Packet به شبکه‌های دیگر؛ <strong>DNS</strong> → حل کردن نام‌های Domain. پس <code>Gateway</code> → Where should traffic go?؛ <code>DNS</code> → What IP belongs to this name?</p>

<h2>بخش چهارم — تست اتصال با <code>ping</code></h2>

<h3>۱۴. <code>ping</code> چیست؟</h3>
<p><code>ping</code> برای بررسی دسترسی شبکه‌ای و پاسخ‌گویی مقصد استفاده می‌شود.</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ping 8.8.8.8\nping example.com</div></div>
<p>در Linux معمولاً <code>ping</code> به‌صورت پیوسته اجرا می‌شود. برای توقف: <code>Ctrl + C</code>.</p>

<h3>۱۵. <code>ping</code> چه چیزی را بررسی می‌کند؟</h3>
<p><code>ping</code> در واقع بررسی می‌کند که آیا مقصد به درخواست‌های ICMP Echo پاسخ می‌دهد یا نه. اگر Reply دریافت شود، ارتباط در آن سطح برقرار است.</p>

<h3>۱۶. آیا Ping موفق یعنی Internet کاملاً سالم است؟</h3>
<p>❌ نه. ممکن است <code>ping</code> موفق باشد ولی HTTP کار نکند. یا یک Firewall پاسخ ICMP را مسدود کرده باشد. پس <code>Ping Success ≠ Everything is working</code>.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> اگر <code>ping</code> جواب ندهد، الزاماً به این معنی نیست که مقصد کاملاً Down است. ممکن است ICMP توسط Firewall یا Policy مسدود شده باشد.</div></div>

<h2>بخش پنجم — <code>hostname</code></h2>

<h3>۱۷. <code>hostname</code> چیست؟</h3>
<p>هر سیستم Linux معمولاً یک <strong>Hostname</strong> دارد. برای مشاهده:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">hostname</div></div>

<h3>۱۸. <code>hostnamectl</code></h3>
<p>در سیستم‌های دارای systemd می‌توان اطلاعات بیشتری را دید:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">hostnamectl</div></div>
<p>برای تنظیم Hostname:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo hostnamectl set-hostname server01</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> <code>hostname</code> → نمایش Hostname؛ <code>hostnamectl</code> → مدیریت/مشاهده اطلاعات Hostname در سیستم‌های دارای systemd.</div></div>

<h2>بخش ششم — مشاهده Connectionها با <code>ss</code></h2>

<h3>۱۹. <code>ss</code> چیست؟</h3>
<p><code>ss</code> برای مشاهده اطلاعات مربوط به <strong>Socket</strong>ها استفاده می‌شود. مثال‌ها: Connectionها و Portهای در حال Listen.</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ss</div></div>

<h3>۲۰. Port چیست؟</h3>
<p>هر Service معمولاً روی یک <strong>Port</strong> گوش می‌دهد. مثال‌ها: SSH → <code>22</code>، HTTP → <code>80</code>، HTTPS → <code>443</code>.</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Server\n│\n├── Port 22  → SSH\n├── Port 80  → HTTP\n└── Port 443 → HTTPS</div></div>

<h3>۲۱. Listening چیست؟</h3>
<p>وقتی یک Service منتظر دریافت Connection است <strong>Listening</strong> است. برای مشاهده Portهای Listening:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ss -l\nss -tulpn</div></div>
<p><code>-t</code> → TCP، <code>-u</code> → UDP، <code>-l</code> → Listening، <code>-p</code> → Process، <code>-n</code> → Numeric.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> یکی از دستورات مهم برای بررسی Portها: <code>ss -tulpn</code>.</div></div>

<h3>۲۲. Connectionهای TCP</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ss -t      # TCP\nss -u      # UDP</div></div>

<h2>بخش هفتم — DNS با <code>dig</code></h2>

<h3>۲۳. <code>dig</code> چیست؟</h3>
<p><code>dig</code> یکی از ابزارهای مهم برای Query کردن DNS است.</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">dig example.com</div></div>

<h3>۲۴. مشاهده فقط Answer</h3>
<p>برای خروجی خلاصه‌تر:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">dig +short example.com</div></div>

<h3>۲۵. Query کردن Record خاص</h3>
<ul>
<li><strong>A Record:</strong> <code>dig example.com A</code> (IPv4)</li>
<li><strong>AAAA:</strong> <code>dig example.com AAAA</code> (IPv6)</li>
<li><strong>MX:</strong> <code>dig example.com MX</code> (Mail Server)</li>
<li><strong>NS:</strong> <code>dig example.com NS</code> (Name Server)</li>
</ul>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> <code>A</code> → IPv4؛ <code>AAAA</code> → IPv6؛ <code>MX</code> → Mail Exchange؛ <code>NS</code> → Name Server.</div></div>

<h2>بخش هشتم — <code>host</code></h2>

<h3>۲۶. <code>host</code> چیست؟</h3>
<p><code>host</code> نیز برای Query کردن DNS استفاده می‌شود.</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">host example.com</div></div>
<p>خروجی نمونه: <code>example.com has address 93.184.216.34</code></p>

<h3>۲۷. <code>dig</code> vs <code>host</code></h3>
<p>هر دو می‌توانند برای DNS Query استفاده شوند. اما <code>host</code> → ساده و خوانا؛ <code>dig</code> → جزئیات بیشتر و مناسب‌تر برای Troubleshooting.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> اگر سؤال گفت DNS را Query کن، هر دو ابزار مهم‌اند: <code>dig</code> و <code>host</code>.</div></div>

<h2>بخش نهم — <code>curl</code></h2>

<h3>۲۸. <code>curl</code> چیست؟</h3>
<p><code>curl</code> ابزاری برای انتقال داده از طریق Network Protocolها است. یکی از کاربردهای بسیار رایج:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">curl https://example.com</div></div>

<h3>۲۹. <code>curl</code> برای تست HTTP</h3>
<p>فرض کنید می‌خواهید ببینید Web Server پاسخ می‌دهد یا نه:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">curl https://example.com</div></div>

<h3>۳۰. فقط Headerها</h3>
<p>برای مشاهده Headerهای HTTP:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">curl -I https://example.com</div></div>
<p><code>-I</code> برای دریافت Headerها در یک درخواست HEAD استفاده می‌شود.</p>

<h3>۳۱. <code>curl</code> فقط برای Website نیست</h3>
<p><code>curl</code> می‌تواند با Protocolها و سرویس‌های مختلف کار کند و برای APIها نیز بسیار رایج است. مثال: <code>curl https://api.example.com</code>.</p>

<h2>بخش دهم — <code>wget</code></h2>

<h3>۳۲. <code>wget</code> چیست؟</h3>
<p><code>wget</code> بیشتر به عنوان ابزار Download کردن فایل‌ها از Network شناخته می‌شود.</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">wget https://example.com/file.iso</div></div>

<h3>۳۳. <code>curl</code> vs <code>wget</code></h3>
<p>هر دو می‌توانند داده را از Network دریافت کنند. اما مدل ذهنی ساده:</p>
<ul>
<li><code>curl</code> → انتقال داده / Request / API / HTTP</li>
<li><code>wget</code> → Download فایل</li>
</ul>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> برای سؤال‌های ساده: <code>Download</code> → <code>wget</code>؛ <code>HTTP Request / API / مشاهده Response</code> → <code>curl</code>. اما این یک تقسیم‌بندی مطلق نیست؛ <code>curl</code> نیز می‌تواند فایل دانلود کند.</div></div>

<h2>بخش یازدهم — سناریوی Troubleshooting</h2>
<p>حالا تمام ابزارها را کنار هم قرار دهیم. فرض کنید کاربر می‌گوید: Server اینترنت ندارد. از کجا شروع کنیم؟</p>
<h3>مرحله ۱ — Interface</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ip link</div></div>
<h3>مرحله ۲ — IP</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ip addr</div></div>
<h3>مرحله ۳ — Route</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ip route</div></div>
<h3>مرحله ۴ — Gateway</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ping 192.168.1.1</div></div>
<h3>مرحله ۵ — IP مقصد</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ping 8.8.8.8</div></div>
<h3>مرحله ۶ — DNS</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ping example.com\ndig example.com</div></div>
<h3>مرحله ۷ — HTTP</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">curl -I https://example.com</div></div>

<h3>نقشه Troubleshooting ⭐</h3>
<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">Network Problem\n      │\n      ↓\nip link\n      │\n      ↓\nInterface?\n      │\n      ↓\nip addr\n      │\n      ↓\nIP?\n      │\n      ↓\nip route\n      │\n      ↓\nGateway?\n      │\n      ↓\nping Gateway\n      │\n      ↓\nping IP\n      │\n      ↓\nDNS?\n      │\n      ↓\ndig / host\n      │\n      ↓\nHTTP?\n      │\n      ↓\ncurl</div></div>
<p>این ترتیب بسیار مهم است. به جای اینکه مستقیم بگویید <code>curl example.com</code>، اول باید بفهمید مشکل در کدام Layer قرار دارد.</p>

<h2>یک سناریوی واقعی 🎯</h2>
<p>فرض کنید: <code>Server IP: 192.168.1.20</code>، <code>Gateway: 192.168.1.1</code>.</p>
<h3>۱. بررسی Interface</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ip link</div></div>
<h3>۲. بررسی IP</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ip addr</div></div>
<h3>۳. بررسی Route</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ip route</div></div>
<h3>۴. تست Gateway</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ping 192.168.1.1</div></div>
<h3>۵. تست Internet با IP</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ping 8.8.8.8</div></div>
<h3>۶. تست DNS</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">dig example.com</div></div>
<h3>۷. تست HTTP</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">curl -I https://example.com</div></div>
<p>نتیجه: اگر <code>ping 8.8.8.8</code> موفق باشد ولی <code>dig example.com</code> مشکل داشته باشد، احتمالاً Network Connectivity OK است اما DNS مشکل دارد.</p>

<h2>جدول طلایی دستورات</h2>
<table>
<thead><tr><th>دستور</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>ip addr</code></td><td>مشاهده IP و Addressها</td></tr>
<tr><td><code>ip link</code></td><td>مشاهده Network Interfaceها</td></tr>
<tr><td><code>ip route</code></td><td>مشاهده Routing Table</td></tr>
<tr><td><code>ping</code></td><td>تست دسترسی شبکه‌ای با ICMP</td></tr>
<tr><td><code>hostname</code></td><td>مشاهده Hostname</td></tr>
<tr><td><code>hostnamectl</code></td><td>مدیریت/مشاهده Hostname</td></tr>
<tr><td><code>ss</code></td><td>مشاهده Socket / Connection / Listening Port</td></tr>
<tr><td><code>ss -tulpn</code></td><td>مشاهده TCP/UDP Listening و Processها</td></tr>
<tr><td><code>dig</code></td><td>DNS Query</td></tr>
<tr><td><code>host</code></td><td>DNS Query ساده</td></tr>
<tr><td><code>curl</code></td><td>انتقال داده / HTTP Request</td></tr>
<tr><td><code>wget</code></td><td>Download فایل</td></tr>
</tbody>
</table>

<h2>مقایسه‌های طلایی LPIC-1</h2>
<h3>IP vs Gateway vs DNS</h3>
<p>IP → آدرس سیستم؛ Gateway → مسیر خروج به شبکه‌های دیگر؛ DNS → تبدیل/حل نام به IP.</p>
<h3><code>ip addr</code> vs <code>ip route</code></h3>
<p><code>ip addr</code> → Address / IP؛ <code>ip route</code> → مسیرهای شبکه.</p>
<h3><code>ping</code> vs <code>curl</code></h3>
<p><code>ping</code> → ICMP → بررسی دسترسی شبکه‌ای؛ <code>curl</code> → Application-level protocols مثل HTTP/HTTPS → بررسی سرویس و Response.</p>
<h3><code>dig</code> vs <code>host</code></h3>
<p><code>dig</code> → جزئیات بیشتر DNS؛ <code>host</code> → خروجی ساده‌تر DNS.</p>
<h3><code>curl</code> vs <code>wget</code></h3>
<p><code>curl</code> → Request / Transfer / API؛ <code>wget</code> → Download.</p>

<h2>دام‌های امتحانی ⚠️</h2>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><ul>
<li><strong>دام ۱:</strong> IP همان Network Interface است؟ ❌ خیر؛ Interface یک رابط شبکه است و IP یک Address منطقی روی آن است.</li>
<li><strong>دام ۲:</strong> Gateway وظیفه DNS را انجام می‌دهد؟ ❌ خیر؛ Gateway مسیر خروج Packet به شبکه‌های دیگر است؛ DNS نام‌ها را Resolve می‌کند.</li>
<li><strong>دام ۳:</strong> <code>127.0.0.1</code> آدرس کارت شبکه اصلی است؟ ❌ خیر؛ <code>127.0.0.1</code> آدرس Loopback است.</li>
<li><strong>دام ۴:</strong> اگر <code>ping</code> جواب ندهد، حتماً سیستم مقصد خاموش است؟ ❌ خیر؛ ممکن است ICMP توسط Firewall یا Policy مسدود شده باشد.</li>
<li><strong>دام ۵:</strong> <code>ping</code> برای تست Web Server کافی است؟ ❌ خیر؛ <code>ping</code> در سطح ICMP کار می‌کند؛ برای تست HTTP بهتر است از <code>curl</code> استفاده شود.</li>
<li><strong>دام ۶:</strong> <code>ip route</code> آدرس IP سیستم را نشان می‌دهد؟ ❌ خیر؛ <code>ip addr</code> برای Addressهاست؛ <code>ip route</code> Routing Table را نشان می‌دهد.</li>
<li><strong>دام ۷:</strong> <code>dig</code> برای Download فایل است؟ ❌ خیر؛ <code>dig</code> برای DNS Query است.</li>
<li><strong>دام ۸:</strong> <code>wget</code> تنها ابزار دریافت اطلاعات از اینترنت است؟ ❌ خیر؛ <code>curl</code> نیز می‌تواند داده و فایل دریافت کند.</li>
<li><strong>دام ۹:</strong> <code>ss</code> فقط Port 22 را نشان می‌دهد؟ ❌ خیر؛ <code>ss</code> اطلاعات Socketها، Connectionها و Listening Portها را نمایش می‌دهد.</li>
</ul></div></div>

<h2>🧠 نقشه ذهنی جلسه</h2>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Linux Networking\n│\n├── Interface\n│     ├── ip link\n│     └── ip addr\n│\n├── Addressing\n│     ├── IPv4\n│     └── IPv6\n│\n├── Routing\n│     └── ip route\n│\n├── Connectivity\n│     └── ping\n│\n├── Hostname\n│     ├── hostname\n│     └── hostnamectl\n│\n├── Socket / Port\n│     └── ss\n│\n├── DNS\n│     ├── dig\n│     └── host\n│\n└── Network Transfer\n      ├── curl\n      └── wget</div></div>

<h2>⚡ حفظی‌های همان جلسه — مرور ۲ تا ۳ دقیقه‌ای</h2>
<h3>Networking</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Interface → رابط شبکه\nIP → آدرس منطقی\nGateway → مسیر خروج\nDNS → Name → IP</div></div>
<h3>Commands</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">ip addr → IP / Address\nip link → Interface\nip route → Routing\nping → Connectivity / ICMP\nhostname → Hostname\nss → Socket / Port / Connection\ndig / host → DNS\ncurl → Request / Transfer\nwget → Download</div></div>
<h3>Network Troubleshooting</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Interface\n    ↓\nIP\n    ↓\nRoute\n    ↓\nGateway\n    ↓\nIP Connectivity\n    ↓\nDNS\n    ↓\nApplication</div></div>

<h2>⭐ سؤال طلایی جلسه</h2>
<p>فرض کنید کاربر می‌گوید: <code>https://example.com</code> برای من باز نمی‌شود. به ترتیب چه چیزهایی را بررسی می‌کنید؟</p>
<div class="code-container"><span class="code-label">پاسخ مفهومی</span><div class="code-block no-prompt">1. ip link\n   ↓\nInterface\n\n2. ip addr\n   ↓\nIP\n\n3. ip route\n   ↓\nRoute / Gateway\n\n4. ping Gateway\n   ↓\nLocal Network\n\n5. ping IP\n   ↓\nIP Connectivity\n\n6. dig example.com\n   ↓\nDNS\n\n7. curl -I https://example.com\n   ↓\nHTTP/HTTPS</div></div>
<p>این یعنی به جای حدس زدن، Layer by Layer مشکل را پیدا می‌کنیم.</p>

<h2>جمع‌بندی نهایی جلسه</h2>
<p>در این جلسه یاد گرفتیم که Networking در Linux فقط «داشتن یک IP» نیست. یک ارتباط شبکه‌ای معمولاً چند بخش دارد: Network Interface، IP Address، Routing، Gateway، DNS و Application Protocol. و برای بررسی آن‌ها ابزارهای مختلفی داریم: <code>ip</code> برای Interface/IP/Route، <code>ping</code> برای Connectivity، <code>ss</code> برای Socket/Port/Connection، <code>dig</code>/<code>host</code> برای DNS، <code>curl</code> برای HTTP/Data Transfer و <code>wget</code> برای Download.</p>
<p>اگر یک جمله از کل جلسه بخواهیم حفظ کنیم:</p>
<blockquote><strong>با <code>ip</code> وضعیت Interface، IP و Route را بررسی می‌کنیم؛ با <code>ping</code> اتصال شبکه‌ای را تست می‌کنیم؛ با <code>ss</code> Socket و Portها را می‌بینیم؛ با <code>dig</code> و <code>host</code> DNS را بررسی می‌کنیم و با <code>curl</code> و <code>wget</code> با سرویس‌ها و داده‌های شبکه کار می‌کنیم.</strong></blockquote>

<div class="box important"><i class="fas fa-link"></i><div><strong>🔗 اتصال به جلسه بعد</strong>
در جلسه‌ی بعد وارد <strong>Shell Scripting</strong> می‌شویم؛ یعنی از اجرای دستورات منفرد عبور می‌کنیم و یاد می‌گیریم چگونه چند دستور و منطق را در قالب یک Script خودکار کنیم.
</div></div>

<div class="section-header">
    <div class="section-badge">۹</div>
    <div>
        <h1>Shell Scripting</h1>
        <div class="meta">دوره مرور LPIC-1 · جلسه ۹ از ۱۰</div>
    </div>
</div>

<blockquote><strong>🎯 هدف جلسه:</strong> یاد بگیریم چگونه چند دستور Linux را در قالب یک Script کنار هم قرار دهیم و با استفاده از Variable، ورودی کاربر، شرط، حلقه و زمان‌بندی، کارها را خودکار کنیم.</blockquote>

<h2>قبل از شروع...</h2>
<p>تا اینجا معمولاً دستورات را یکی‌یکی اجرا می‌کردیم. اما اگر بخواهیم همین کار را هر روز، صدها بار یا روی چندین سیستم انجام دهیم، اجرای دستی منطقی نیست. اینجاست که <strong>Shell Script</strong> وارد می‌شود.</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Command\nCommand\nCommand\n   ↓\nShell Script\n   ↓\nAutomation</div></div>

<h2>بخش اول — Shell Script چیست؟</h2>

<h3>۱. Script یعنی چه؟</h3>
<p>Script یک فایل متنی است که مجموعه‌ای از دستورات را در خود دارد.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">#!/bin/bash\n\necho "Hello"\npwd\nls</div></div>
<p>وقتی این Script اجرا شود، دستورات به ترتیب اجرا می‌شوند.</p>

<h3>۲. چرا Shell Script مهم است؟</h3>
<p>با Script می‌توانیم کارهای تکراری را خودکار کنیم، چند دستور را به هم متصل کنیم، تصمیم‌گیری انجام دهیم، روی چند فایل عملیات انجام دهیم، خروجی یک دستور را بررسی کنیم و کارها را در زمان مشخص اجرا کنیم.</p>

<h2>بخش دوم — Shebang</h2>

<h3>۳. خط اول Script</h3>
<p>معمولاً Script را با این خط شروع می‌کنیم:</p>
<div class="code-container"><span class="code-label">Shebang</span><div class="code-block">#!/bin/bash</div></div>
<p>به این خط <strong>Shebang</strong> گفته می‌شود. معنای آن تقریباً این است که این Script را با <code>/bin/bash</code> اجرا کن.</p>

<h3>۴. ساخت اولین Script</h3>
<p>یک فایل بسازید:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">nano hello.sh</div></div>
<p>داخل آن:</p>
<div class="code-container"><span class="code-label">محتوای فایل</span><div class="code-block">#!/bin/bash\n\necho "Hello Linux"</div></div>
<p>سپس:</p>
<div class="code-container"><span class="code-label">دستورات</span><div class="code-block">chmod +x hello.sh\n./hello.sh</div></div>
<p>خروجی: <code>Hello Linux</code></p>

<h3>۵. چرا <code>./</code>؟</h3>
<p><code>./hello.sh</code> یعنی فایل <code>hello.sh</code> موجود در Directory فعلی را اجرا کن. <code>./</code> یعنی Current Directory.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>hello.sh</code> با <code>./hello.sh</code> یکسان نیست. اگر Directory فعلی در <code>PATH</code> نباشد، Shell معمولاً <code>hello.sh</code> را با نام تنها پیدا نمی‌کند.</div></div>

<h2>بخش سوم — Variable</h2>

<h3>۶. Variable چیست؟</h3>
<p>Variable یعنی یک نام برای نگهداری یک مقدار.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">name="Zara"\necho "$name"</div></div>
<p>خروجی: <code>Zara</code></p>

<h3>۷. قانون مهم Assignment</h3>
<p>در Bash هنگام Assignment نباید اطراف <code>=</code> فاصله بگذاریم.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>name="Zara"</code> صحیح است، اما <code>name = "Zara"</code> به شکل Assignment تفسیر نمی‌شود.</div></div>

<h3>۸. استفاده از Variable</h3>
<p>برای دسترسی به مقدار Variable از <code>$</code> استفاده می‌کنیم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">name="Zara"\necho "$name"\necho "${name}"</div></div>

<h3>۹. Variableهای مهم محیط Shell</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "$HOME"   # Home Directory\necho "$USER"   # کاربر فعلی\necho "$PATH"   # مسیرهای جستجوی Commandها</div></div>

<h3>جدول مهم Variableها</h3>
<table>
<thead><tr><th>Variable</th><th>مفهوم</th></tr></thead>
<tbody>
<tr><td><code>$HOME</code></td><td>Home Directory</td></tr>
<tr><td><code>$USER</code></td><td>کاربر فعلی</td></tr>
<tr><td><code>$PATH</code></td><td>مسیر جستجوی Commandها</td></tr>
<tr><td><code>$PWD</code></td><td>Directory فعلی</td></tr>
<tr><td><code>$SHELL</code></td><td>Shell پیش‌فرض/محیط Shell</td></tr>
</tbody>
</table>

<h2>بخش چهارم — <code>echo</code></h2>

<h3>۱۰. <code>echo</code></h3>
<p><code>echo</code> برای نمایش متن یا مقدار Variable استفاده می‌شود.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">echo "Hello"\nname="Linux"\necho "$name"</div></div>

<h2>بخش پنجم — گرفتن ورودی با <code>read</code></h2>

<h3>۱۱. <code>read</code></h3>
<p>برای دریافت ورودی از کاربر:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">#!/bin/bash\n\necho "Enter your name:"\nread name\n\necho "Hello $name"</div></div>

<h3>۱۲. Prompt با <code>read -p</code></h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">read -p "Enter your name: " name\necho "Hello $name"</div></div>

<h2>بخش ششم — Exit Status</h2>
<p>یکی از مهم‌ترین مفاهیم Shell Scripting <strong>Exit Status</strong> است. هر Command بعد از اجرا یک Status برمی‌گرداند. معمولاً <code>0</code> یعنی موفق و Non-zero یعنی خطا یا وضعیت غیرموفق.</p>

<h3>۱۳. مشاهده Exit Status</h3>
<p>بعد از اجرای یک Command:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ls\necho $?</div></div>
<p>اگر موفق باشد خروجی <code>0</code> است.</p>

<h3>۱۴. چرا Exit Status مهم است؟</h3>
<p>چون Script می‌تواند بر اساس آن تصمیم بگیرد.</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Command\n   ↓\nExit Status\n   │\n   ├── 0\n   │    ↓\n   │   Success\n   │\n   └── non-zero\n        ↓\n       Failure</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> <code>$?</code> یعنی Exit Status آخرین Command اجراشده.</div></div>

<h2>بخش هفتم — Operators</h2>
<p>برای شرط‌گذاری به مقایسه نیاز داریم.</p>

<tr><td><code>-le</code></td><td>کوچک‌تر یا مساوی</td></tr>

<h2>بخش هشتم — <code>if</code></h2>

<h3>۱۵. ساختار <code>if</code></h3>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block">if [ condition ]; then\n    command\nfi</div></div>
<p>مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">if [ "$USER" = "root" ]; then\n    echo "You are root"\nfi</div></div>

<h3>۱۶. <code>if / else</code></h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">if [ "$USER" = "root" ]; then\n    echo "Root user"\nelse\n    echo "Regular user"\nfi</div></div>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Condition\n   │\n   ├── TRUE\n   │    ↓\n   │   then\n   │\n   └── FALSE\n        ↓\n       else</div></div>

<h3>۱۷. <code>elif</code></h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">if [ "$x" -gt 10 ]; then\n    echo "Large"\nelif [ "$x" -eq 10 ]; then\n    echo "Equal"\nelse\n    echo "Small"\nfi</div></div>

<h3>۱۸. بررسی وجود فایل</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">if [ -f "/etc/passwd" ]; then\n    echo "File exists"\nelse\n    echo "File not found"\nfi</div></div>
<p>برای Directory:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">if [ -d "/etc" ]; then\n    echo "Directory exists"\nfi</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> سه تست بسیار مهم: <code>-f</code> → Regular File؛ <code>-d</code> → Directory؛ <code>-e</code> → Exists.</div></div>

<h2>بخش نهم — <code>case</code></h2>

<h3>۱۹. چرا <code>case</code>؟</h3>
<p>وقتی چند حالت مختلف داریم، <code>case</code> می‌تواند از چندین <code>if</code> خواناتر باشد.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">read -p "Enter a number: " choice\n\ncase "$choice" in\n    1)\n        echo "Start"\n        ;;\n    2)\n        echo "Stop"\n        ;;\n    3)\n        echo "Exit"\n        ;;\n    *)\n        echo "Invalid choice"\n        ;;\nesac</div></div>

<h3>۲۰. ساختار <code>case</code></h3>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block">case "$variable" in\n    pattern1)\n        commands\n        ;;\n    pattern2)\n        commands\n        ;;\n    *)\n        default\n        ;;\nesac</div></div>
<p>دو مورد را به خاطر بسپارید: <code>;;</code> پایان هر Case و <code>*)</code> حالت پیش‌فرض.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> پایان <code>case</code> با <code>esac</code> است. <code>esac</code> در واقع <code>case</code> برعکس‌شده است.</div></div>

<h2>بخش دهم — <code>for</code></h2>

<h3>۲۱. حلقه چیست؟</h3>
<p>گاهی می‌خواهیم یک کار را چند بار انجام دهیم. به جای چند بار نوشتن Command از <code>for</code> استفاده می‌کنیم.</p>

<h3>۲۲. ساده‌ترین <code>for</code></h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">for i in 1 2 3 4 5\ndo\n    echo "$i"\ndone</div></div>
<p>خروجی: <code>1 2 3 4 5</code></p>

<h3>۲۳. <code>for</code> روی فایل‌ها</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">for file in *.txt\ndo\n    echo "$file"\ndone</div></div>

<h3>۲۴. ساختار <code>for</code></h3>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block">for variable in list\ndo\n    commands\ndone</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> <code>for</code> لیست را یکی‌یکی پردازش می‌کند.</div></div>

<h2>بخش یازدهم — <code>while</code></h2>

<h3>۲۵. <code>while</code> چیست؟</h3>
<p><code>while</code> تا زمانی که یک شرط درست باشد، ادامه می‌دهد.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">count=1\n\nwhile [ "$count" -le 5 ]\ndo\n    echo "$count"\n    count=$((count + 1))\ndone</div></div>
<p>خروجی: <code>1 2 3 4 5</code></p>

<h3>۲۶. تفاوت <code>for</code> و <code>while</code></h3>
<p><code>for</code> وقتی معمولاً مجموعه‌ای از موارد داریم (Files, Users, Numbers, Items) استفاده می‌شود. <code>while</code> وقتی می‌گوییم تا زمانی که شرط برقرار است، ادامه بده.</p>

<h2>بخش دوازدهم — <code>select</code></h2>

<h3>۲۷. <code>select</code> چیست؟</h3>
<p><code>select</code> برای ساخت Menu ساده در Bash استفاده می‌شود.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">select choice in Start Stop Exit\ndo\n    echo "You selected $choice"\n    break\ndone</div></div>
<p>Bash یک Menu شماره‌گذاری‌شده ایجاد می‌کند.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> <code>select</code> → ساخت Menu ساده در Bash.</div></div>

<h2>بخش سیزدهم — محاسبات ساده</h2>
<p>برای محاسبات عددی از Arithmetic Expansion استفاده می‌کنیم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">a=10\nb=5\n\nresult=$((a + b))\n\necho "$result"</div></div>
<p>خروجی: <code>15</code></p>
<p>مثال افزایش Counter:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">count=$((count + 1))</div></div>

<h2>بخش چهاردهم — Script واقعی</h2>
<p>حالا یک Script ساده برای بررسی وجود فایل:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">#!/bin/bash\n\nfile="/etc/passwd"\n\nif [ -f "$file" ]; then\n    echo "$file exists"\nelse\n    echo "$file does not exist"\nfi</div></div>

<h2>بخش پانزدهم — Cron</h2>
<p>تا اینجا Script را دستی اجرا می‌کردیم. اما اگر بخواهیم هر روز ساعت ۲ بامداد اجرا شود؟ از <strong>cron</strong> استفاده می‌کنیم.</p>

<h3>۲۸. Cron چیست؟</h3>
<p><code>cron</code> یک Scheduler در Linux است. یعنی می‌توانیم اجرای Command یا Script را برای زمان مشخص برنامه‌ریزی کنیم.</p>

<h3>۲۹. <code>crontab</code></h3>
<p>برای تنظیم Jobهای کاربر:</p>
<div class="code-container"><span class="code-label">دستورات</span><div class="code-block">crontab -e    # ویرایش\ncrontab -l    # نمایش</div></div>

<h3>۳۰. ساختار Cron</h3>
<p>ساختار معمول:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">minute hour day-of-month month day-of-week command</div></div>
<div class="code-container"><span class="code-label">نمایش</span><div class="code-block no-prompt">* * * * * command\n│ │ │ │ │\n│ │ │ │ └── روز هفته\n│ │ │ └──── ماه\n│ │ └────── روز ماه\n│ └──────── ساعت\n└────────── دقیقه</div></div>

<h3>۳۱. مثال Cron</h3>
<p>اجرای <code>/home/user/backup.sh</code> هر روز ساعت 2:30:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">30 2 * * * /home/user/backup.sh</div></div>

<h3>۳۲. معنی <code>*</code></h3>
<p>در Cron <code>*</code> یعنی همه مقادیر مجاز. پس <code>* * * * *</code> یعنی هر دقیقه.</p>

<h3>۳۳. مثال‌های مهم Cron</h3>
<table>
<thead><tr><th>الگو</th><th>معنی</th></tr></thead>
<tbody>
<tr><td><code>0 2 * * *</code></td><td>هر روز ساعت 02:00</td></tr>
<tr><td><code>0 * * * *</code></td><td>هر ساعت در دقیقه 0</td></tr>
<tr><td><code>*/5 * * * *</code></td><td>هر 5 دقیقه</td></tr>
<tr><td><code>30 3 * * 0</code></td><td>هر یکشنبه ساعت 03:30</td></tr>
</tbody>
</table>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> ترتیب Cron را اشتباه نکنید: minute, hour, day-of-month, month, day-of-week. نه hour, minute, ...</div></div>

<h2>بخش شانزدهم — <code>at</code></h2>

<h3>۳۴. تفاوت <code>cron</code> و <code>at</code></h3>
<p><code>cron</code> برای Jobهای تکرارشونده مناسب است، اما <code>at</code> برای اجرای یک‌بار در آینده.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">at 15:00</div></div>
<p>سپس Command موردنظر را وارد می‌کنید.</p>

<h3>مقایسه</h3>
<table>
<thead><tr><th>ابزار</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>cron</code></td><td>اجرای تکرارشونده</td></tr>
<tr><td><code>at</code></td><td>اجرای یک‌باره در زمان مشخص</td></tr>
</tbody>
</table>

<h2>بخش هفدهم — <code>nohup</code></h2>

<h3>۳۵. مشکل چیست؟</h3>
<p>اگر <code>./backup.sh</code> را از یک Terminal اجرا کرده‌اید و Session قطع شود، ممکن است Process تحت تأثیر قرار بگیرد. برای اجرای Command به شکلی که نسبت به قطع Terminal مقاوم‌تر باشد از <code>nohup</code> استفاده می‌شود.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">nohup ./backup.sh &</div></div>

<h3>۳۶. <code>nohup</code> چه کار می‌کند؟</h3>
<p>معمولاً خروجی در <code>nohup.out</code> ذخیره می‌شود، مگر اینکه Redirect دیگری تعیین کرده باشید.</p>

<h3>مقایسه مهم</h3>
<table>
<thead><tr><th>ابزار</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>cron</code></td><td>زمان‌بندی</td></tr>
<tr><td><code>at</code></td><td>اجرای یک‌باره</td></tr>
<tr><td><code>nohup</code></td><td>ادامه اجرای Command پس از قطع Session، در شرایط مناسب</td></tr>
</tbody>
</table>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>nohup</code> ابزار Scheduling نیست. یعنی <code>nohup</code> برای اجرای Script فردا ساعت 5 نیست، بلکه کمک به ادامه اجرای Process پس از خروج/قطع Session است.</div></div>

<h2>یک سناریوی واقعی 🎯</h2>
<p>فرض کنید مدیر سیستم می‌خواهد هر شب Backup بگیرد و اگر فایل Backup وجود داشت، وضعیت را اعلام کند.</p>
<p>ابتدا Script:</p>
<div class="code-container"><span class="code-label">backup.sh</span><div class="code-block">#!/bin/bash\n\nbackup="/backup/data.tar.gz"\n\nif [ -f "$backup" ]; then\n    echo "Backup exists"\nelse\n    echo "Backup missing"\nfi</div></div>
<p>حالا این Script را هر شب اجرا می‌کنیم:</p>
<div class="code-container"><span class="code-label">Cron</span><div class="code-block no-prompt">cron\n ↓\nbackup.sh\n ↓\nif\n ↓\nCheck backup</div></div>

<table>
<thead><tr><th>دستور / مفهوم</th><th>کاربرد</th></tr></thead>

<tr><td><code>if</code></td><td>شرط</td></tr>
<tr><td><code>case</code></td><td>چند حالت</td></tr>
<tr><td><code>for</code></td><td>تکرار روی مجموعه</td></tr>

<h2>مقایسه‌های طلایی LPIC-1</h2>
<h3><code>if</code> vs <code>case</code></h3>
<p><code>if</code> → بررسی شرط‌ها؛ <code>case</code> → چند حالت بر اساس یک مقدار/Pattern.</p>
<h3><code>for</code> vs <code>while</code></h3>
<p><code>for</code> → پردازش مجموعه‌ای از موارد؛ <code>while</code> → تکرار تا زمانی که شرط برقرار است.</p>
<h3><code>cron</code> vs <code>at</code></h3>
<p><code>cron</code> → تکراری؛ <code>at</code> → یک‌باره.</p>
<h3><code>cron</code> vs <code>nohup</code></h3>
<p><code>cron</code> → چه زمانی اجرا شود؟؛ <code>nohup</code> → اجرای Command در برابر خروج/قطع Session مقاوم‌تر باشد.</p>

<h2>دام‌های امتحانی ⚠️</h2>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><ul>
<li><strong>دام ۱:</strong> <code>name = "Linux"</code> صحیح است؟ ❌ خیر؛ صحیح <code>name="Linux"</code> است.</li>
<li><strong>دام ۲:</strong> <code>$?</code> مقدار Variable قبلی است؟ ❌ خیر؛ <code>$?</code> Exit Status آخرین Command اجراشده را نشان می‌دهد.</li>
<li><strong>دام ۳:</strong> Exit Status صفر یعنی خطا؟ ❌ خیر؛ معمولاً <code>0</code> → Success، non-zero → Failure.</li>
<li><strong>دام ۴:</strong> <code>-f</code> یعنی File یا Directory؟ ❌ خیر؛ <code>-f</code> → Regular File، <code>-d</code> → Directory، <code>-e</code> → Exists.</li>
<li><strong>دام ۵:</strong> <code>case</code> با <code>fi</code> تمام می‌شود؟ ❌ خیر؛ <code>esac</code>.</li>
<li><strong>دام ۶:</strong> <code>for</code> فقط برای اعداد است؟ ❌ خیر؛ <code>for</code> می‌تواند روی مجموعه‌ای از Stringها، فایل‌ها، اعداد و... تکرار کند.</li>
<li><strong>دام ۷:</strong> <code>cron</code> برای اجرای یک‌باره است؟ ❌ خیر؛ <code>cron</code> برای Jobهای زمان‌بندی‌شده و تکرارشونده است.</li>
<li><strong>دام ۸:</strong> <code>at</code> برای اجرای دائمی و تکراری است؟ ❌ خیر؛ <code>at</code> برای اجرای یک‌باره در آینده است.</li>

</ul></div></div>

<h2>🧠 نقشه ذهنی جلسه</h2>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Shell Scripting\n│\n├── Script\n│    └── #!/bin/bash\n│\n├── Variables\n│    ├── Assignment\n│    └── $VAR\n│\n├── Input / Output\n│    ├── echo\n│    └── read\n│\n├── Status\n│    └── $?\n│\n├── Decision\n│    ├── if\n│    └── case\n│\n├── Loops\n│    ├── for\n│    └── while\n│\n├── Menu\n│    └── select\n│\n└── Scheduling / Execution\n     ├── cron\n     ├── at\n     └── nohup</div></div>

<h2>⚡ حفظی‌های همان جلسه — مرور ۲ تا ۳ دقیقه‌ای</h2>
<h3>Script</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">#!/bin/bash → Bash Interpreter</div></div>
<h3>Variable</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">x="Linux" → Assignment\n$x → Value</div></div>
<h3>Status</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">$? → Exit Status\n0 → Success</div></div>
<h3>Condition</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">if → شرط\ncase → چند حالت</div></div>
<h3>File Tests</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">-f → Regular File\n-d → Directory\n-e → Exists</div></div>
<h3>Loops</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">for → روی مجموعه\nwhile → تا وقتی شرط برقرار است\nselect → Menu</div></div>
<h3>Scheduling</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">cron → تکراری\nat → یک‌باره\nnohup → ادامه اجرای Command در برابر قطع Session</div></div>

<h2>⭐ سؤال طلایی جلسه</h2>
<p>فرض کنید این Script را داریم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">#!/bin/bash\n\nif [ -f "/tmp/test.txt" ]; then\n    echo "File exists"\nelse\n    echo "File does not exist"\nfi</div></div>
<p>اگر <code>/tmp/test.txt</code> وجود داشته باشد، بخش <code>if</code> اجرا می‌شود و اگر وجود نداشته باشد، بخش <code>else</code> اجرا می‌شود.</p>
<p>حالا اگر بخواهیم این بررسی را هر روز ساعت ۲ انجام دهیم، Script را به <code>cron</code> می‌دهیم:</p>
<div class="code-container"><span class="code-label">Cron</span><div class="code-block">0 2 * * * /home/user/check.sh</div></div>
<p>نکته مهم این جلسه: <strong>Shell Script منطق کار را تعریف می‌کند؛ Cron زمان اجرای آن را تعیین می‌کند.</strong></p>

<h2>بخش سوم — Redirection و Pipe</h2>
<h3>۵. Redirection</h3>
<div class="code-container"><span class="code-label">دستورات</span><div class="code-block">command > file   # Overwrite\ncommand >> file  # Append\ncommand < file   # Input from file</div></div>

<h3>۶. Standard Streams</h3>

<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>></code> → overwrite؛ <code>>></code> → append.</div></div>

<h3>۷. Pipe</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">command1 | command2</div></div>
<p>یعنی <code>Output command1 → Input command2</code>. مثال: <code>ps aux | grep ssh</code></p>

<h2>بخش چهارم — پردازش متن</h2>
<h3>۸. <code>grep</code></h3>
<p>برای جست‌وجوی Pattern در متن:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">grep "error" logfile</div></div>
<p>گزینه‌های مهم: <code>-i</code> ignore case، <code>-v</code> inverse match، <code>-n</code> line number، <code>-r</code> recursive.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>مقایسه:</strong> <code>grep</code> → جست‌وجوی داخل محتوا؛ <code>find</code> → پیدا کردن فایل‌ها بر اساس ویژگی‌ها.</div></div>

<h3>۹. <code>sed</code></h3>
<p><code>sed</code> برای پردازش و تغییر Streamهای متنی است.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed 's/old/new/g' file.txt</div></div>

<h3>۱۰. <code>xargs</code></h3>
<p><code>xargs</code> خروجی ورودی را به Argumentهای یک Command تبدیل می‌کند.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -name "*.tmp" -print0 | xargs -0 rm</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> <code>grep</code> → search text؛ <code>sed</code> → transform text؛ <code>xargs</code> → build command arguments.</div></div>

<h3>۱۹. Package چیست؟</h3>
<p>Package یک واحد بسته‌بندی نرم‌افزار است که می‌تواند شامل Program، Configuration، Dependencies Information و Files باشد.</p>

<h3>۲۰. خانواده Debian</h3>

<h3>۲۱. خانواده Red Hat</h3>
<p>فرمت: <code>.rpm</code>. ابزارهای مهم: <code>rpm</code>، <code>dnf</code>.</p>

<h3>۲۲. تفاوت Package Managerها</h3>
<p><code>dpkg / rpm</code> → کار سطح پایین‌تر با Package؛ <code>apt / dnf</code> → مدیریت Repository و Dependencyها.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> Debian → <code>.deb</code> → <code>dpkg / apt</code>؛ Red Hat → <code>.rpm</code> → <code>rpm / dnf</code>.</div></div>

<h3>۲۳. Source Compile</h3>

<p>این سه را قاطی نکنید: <code>Disk → Partition → Filesystem → Mount → Directory</code>. مثال: <code>/dev/sda → /dev/sda1 → ext4 → /mnt/data</code></p>

<h3>۲۶. دستورات مهم Disk</h3>
<table>
<thead><tr><th>Command</th><th>کاربرد</th></tr></thead>

<h3>۲۷. <code>df</code> vs <code>du</code></h3>
<p><code>df</code> → فضای Filesystem؛ <code>du</code> → مصرف فضا توسط فایل‌ها و Directoryها.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">df -h\ndu -sh /var/log</div></div>

<h3>۲۸. UUID</h3>
<p>Filesystem می‌تواند UUID داشته باشد. <code>blkid</code> برای مشاهده UUID استفاده می‌شود.</p>

<h3>۲۹. <code>/etc/fstab</code></h3>

<h2>بخش هشتم — LVM</h2>
<h3>۳۰. LVM</h3>
<p>ساختار پایه: <code>Physical Volume → Volume Group → Logical Volume → Filesystem</code>. حفظی: <code>PV → VG → LV</code>.</p>

<h3>۳۱. مفهوم LVM</h3>
<p>LVM باعث می‌شود مدیریت Storage انعطاف‌پذیرتر شود.</p>

<h2>بخش نهم — RAID</h2>
<h3>۳۲. RAID</h3>
<p>RAID برای ترکیب چند Disk با اهدافی مانند Redundancy، Performance و Availability است. اما <strong>RAID جای Backup نیست.</strong></p>

<h3>۳۳. RAID مهم</h3>
<ul>
<li><strong>RAID 0:</strong> Striping، Performance بهتر، No Redundancy.</li>
<li><strong>RAID 1:</strong> Mirroring، داده روی Diskها Mirror می‌شود.</li>
<li><strong>RAID 5:</strong> Striping + Parity، معمولاً تحمل خرابی یک Disk را دارد.</li>
<li><strong>RAID 6:</strong> Striping + Double Parity، معمولاً تحمل خرابی دو Disk را دارد.</li>
<li><strong>RAID 10:</strong> ترکیبی از RAID 1 + RAID 0 برای Redundancy و Performance.</li>
</ul>

<h3>جدول طلایی RAID</h3>
<table>
<thead><tr><th>Level</th><th>مفهوم اصلی</th></tr></thead>
<tbody>
<tr><td>RAID 0</td><td>Striping</td></tr>
<tr><td>RAID 1</td><td>Mirroring</td></tr>
<tr><td>RAID 5</td><td>Striping + Parity</td></tr>
<tr><td>RAID 6</td><td>Double Parity</td></tr>
<tr><td>RAID 10</td><td>Mirror + Stripe</td></tr>
</tbody>
</table>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>RAID 0</code> → Redundancy ندارد. و <code>RAID ≠ Backup</code>.</div></div>

<h2>بخش دهم — File، Link و Permission</h2>
<h3>۳۴. Hard Link vs Symbolic Link</h3>
<ul>
<li><strong>Hard Link:</strong> دو Directory Entry به یک Inode اشاره می‌کنند.</li>
<li><strong>Symbolic Link:</strong> یک فایل/Entry که به Path دیگری اشاره می‌کند.</li>
</ul>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">file1 ──┐\n        ├──→ inode\nfile2 ──┘\n\nlink\n ↓\ntarget</div></div>

<h3>۳۵. Symbolic Link</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ln -s /var/log/app.log app.log</div></div>
<p>اگر Target حذف شود، Symbolic Link می‌تواند Broken شود.</p>

<h3>۳۶. Permission</h3>
<p>سه Permission اصلی: <code>r</code> → read، <code>w</code> → write، <code>x</code> → execute. مقادیر: <code>r = 4</code>، <code>w = 2</code>، <code>x = 1</code>.</p>

<h3>۳۷. Permissionهای عددی</h3>
<div class="code-container"><span class="code-label">مقادیر</span><div class="code-block no-prompt">rwx = 7\nrw- = 6\nr-x = 5\nr-- = 4</div></div>
<p><code>755</code> یعنی Owner → rwx، Group → r-x، Other → r-x. <code>644</code> یعنی Owner → rw-، Group → r--، Other → r--.</p>

<h3>۳۸. Permission در Directory</h3>
<p>برای Directory: <code>r</code> → دیدن نام Entryها؛ <code>w</code> → ایجاد/حذف/تغییر Entryها؛ <code>x</code> → Traverse / ورود و دسترسی به Entryهای داخل Directory.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>x</code> روی Directory به معنی «اجرای Directory» نیست. معنای مهم آن <strong>Traverse</strong> است.</div></div>

<h3>۳۹. <code>chmod</code></h3>
<div class="code-container"><span class="code-label">دستورات</span><div class="code-block">chmod 755 script.sh\nchmod u+x script.sh</div></div>

<h3>۴۰. Ownership</h3>
<div class="code-container"><span class="code-label">دستورات</span><div class="code-block">chown user file\nchgrp group file\nchown user:group file</div></div>

<h3>۴۱. ACL</h3>
<p>Permissionهای سنتی فقط Owner، Group و Other را دارند. ACL امکان Permissionهای دقیق‌تر برای User/Groupهای مشخص را فراهم می‌کند.</p>
<div class="code-container"><span class="code-label">دستورات</span><div class="code-block">setfacl\ngetfacl</div></div>

<h2>بخش یازدهم — <code>find</code> و <code>locate</code></h2>
<h3>۴۲. <code>find</code></h3>
<p>برای جست‌وجوی Filesystem:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">find /var -name "*.log"</div></div>
<p>می‌توان بر اساس name، type، size، user، permission و time جست‌وجو کرد.</p>

<h3>۴۳. <code>locate</code></h3>
<p><code>locate</code> معمولاً بر اساس Database جست‌وجو می‌کند. Database ممکن است با <code>updatedb</code> به‌روزرسانی شود.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>مقایسه:</strong> <code>find</code> → جست‌وجوی مستقیم‌تر روی Filesystem؛ <code>locate</code> → جست‌وجوی Database.</div></div>

<h2>بخش دوازدهم — Archive و Compression</h2>
<h3>۴۴. Archive vs Compression</h3>
<p><code>Archive</code> → چند فایل را در یک Container قرار می‌دهد؛ <code>Compression</code> → حجم داده را کاهش می‌دهد.</p>

<h3>۴۵. <code>tar</code></h3>
<div class="code-container"><span class="code-label">دستورات</span><div class="code-block">tar -cf backup.tar files/   # ساخت\njar -xf backup.tar           # Extract</div></div>

<h3>۴۶. <code>tar</code> + <code>gzip</code></h3>
<div class="code-container"><span class="code-label">دستورات</span><div class="code-block">tar -czf backup.tar.gz files/   # ساخت\njar -xzf backup.tar.gz           # Extract</div></div>
<p>حفظی: <code>c</code> → create، <code>x</code> → extract، <code>f</code> → file، <code>z</code> → gzip.</p>

<h3>۴۷. <code>gzip</code></h3>
<div class="code-container"><span class="code-label">دستورات</span><div class="code-block">gzip file\ngunzip file.gz</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>tar</code> ذاتاً به معنی Compression نیست. <code>tar</code> → Archive و <code>gzip</code> → Compression است.</div></div>

<h2>بخش سیزدهم — Backup و <code>dd</code></h2>
<h3>۴۸. <code>dd</code></h3>
<p><code>dd</code> برای Copy کردن داده در سطح Block/Stream بسیار قدرتمند است.</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">dd if=input.img of=output.img</div></div>
<p><code>if</code> → input file؛ <code>of</code> → output file.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> اشتباه در <code>if</code> و <code>of</code> می‌تواند به Overwrite شدن داده منجر شود. قبل از اجرای <code>dd</code> همیشه Device و جهت Copy را دوباره بررسی کنید.</div></div>

<h2>بخش چهاردهم — Boot</h2>
<h3>۴۹. مسیر Boot</h3>
<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">BIOS / UEFI\n      ↓\nBootloader\n      ↓\nGRUB\n      ↓\nKernel\n      ↓\ninitramfs\n      ↓\nsystemd\n      ↓\nServices / Targets</div></div>

<h3>۵۰. BIOS و UEFI</h3>
<p>این‌ها Firmwareهایی هستند که قبل از Operating System اجرا می‌شوند.</p>

<h3>۵۱. GRUB</h3>
<p>GRUB یک Bootloader رایج در Linux است. کار اصلی: Select / Load Kernel.</p>

<h3>۵۲. Kernel</h3>
<p>Kernel هسته سیستم‌عامل است. وظایف مهم: Process Management، Memory Management، Hardware Interaction و System Calls.</p>

<h3>۵۳. <code>initramfs</code></h3>
<p>یک Filesystem موقت اولیه است که در مراحل ابتدایی Boot برای آماده‌سازی محیط لازم برای راه‌اندازی سیستم استفاده می‌شود.</p>

<h3>۵۴. <code>systemd</code></h3>
<p>در بسیاری از Linux Distributionهای امروزی، <code>systemd</code> نقش Init System را دارد. برای مدیریت Services:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">systemctl status ssh</div></div>

<h3>۵۵. <code>start</code> vs <code>enable</code></h3>
<p><code>systemctl start service</code> → الان Service را Start کن. <code>systemctl enable service</code> → Service را برای شروع خودکار در Boot فعال کن. برای هر دو: <code>systemctl enable --now service</code>.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>enable ≠ start</code>.</div></div>

<h2>بخش پانزدهم — Users و Groups</h2>
<h3>۵۶. فایل‌های مهم User</h3>
<ul>
<li><strong><code>/etc/passwd</code>:</strong> اطلاعات حساب کاربری مانند Username، UID، GID، Home و Shell را نگهداری می‌کند.</li>
<li><strong><code>/etc/shadow</code>:</strong> اطلاعات Password Hash و Password Aging.</li>
<li><strong><code>/etc/group</code>:</strong> تعریف Groupها و Membership.</li>
</ul>

<h3>۵۷. User Commands</h3>
<div class="code-container"><span class="code-label">دستورات</span><div class="code-block">useradd user      # ساخت User\npasswd user       # تنظیم Password\nusermod ...       # تغییر ویژگی User\nuserdel user      # حذف User</div></div>

<h3>۵۸. Group Commands</h3>
<div class="code-container"><span class="code-label">دستورات</span><div class="code-block">groupadd group    # ساخت Group\ngroupdel group    # حذف Group</div></div>

<h3>۵۹. افزودن User به Supplementary Group</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">usermod -aG group user</div></div>
<p><code>-G</code> → Supplementary Groups را تعیین می‌کند؛ <code>-a</code> → Append می‌کند.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>usermod -G docker user</code> می‌تواند Membershipهای Supplementary قبلی را جایگزین کند. برای افزودن: <code>usermod -aG docker user</code>.</div></div>

<h3>۶۰. UID و GID</h3>
<p><code>UID</code> → User ID؛ <code>GID</code> → Group ID. <code>UID 0</code> → root.</p>

<h3>۶۱. مشاهده هویت</h3>
<div class="code-container"><span class="code-label">دستورات</span><div class="code-block">whoami   # کاربر فعلی\nid       # اطلاعات UID/GID و Groups\nwho      # کاربرانی که Login کرده‌اند</div></div>

<h2>بخش شانزدهم — <code>su</code> و <code>sudo</code></h2>
<h3>۶۲. <code>su</code></h3>
<p>برای تغییر User: <code>su - user</code>. مثال: <code>su - root</code>.</p>

<h3>۶۳. <code>sudo</code></h3>
<p>برای اجرای یک Command با Privilegeهای مجاز: <code>sudo command</code>. مثال: <code>sudo systemctl restart ssh</code>.</p>

<h3>۶۴. <code>su</code> vs <code>sudo</code></h3>
<p><code>su</code> → Switch User؛ <code>sudo</code> → Execute command with elevated/authorized privileges. برای مدیریت امن‌تر: <code>sudo</code> → معمولاً مناسب‌تر برای Least Privilege.</p>

<h3>۶۵. <code>sudoers</code></h3>
<p>Configuration اصلی: <code>/etc/sudoers</code> و Directory رایج: <code>/etc/sudoers.d/</code>. برای ویرایش امن: <code>visudo</code>.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> <code>visudo</code> → ویرایش امن sudoers.</div></div>

<h2>بخش هفدهم — Services</h2>
<h3>۶۶. Service چیست؟</h3>
<p>Service معمولاً یک قابلیت یا برنامه‌ی پس‌زمینه‌ای است که سیستم آن را مدیریت می‌کند. مثال: <code>sshd</code>، <code>cups</code>، <code>chronyd</code>.</p>

<h3>۶۷. Service vs Process</h3>
<p><code>Process</code> → Instance در حال اجرای Program؛ <code>Service</code> → قابلیت/Daemon مدیریت‌شده در سیستم.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> Service و Process مفهوم یکسانی نیستند.</div></div>

<h2>بخش هجدهم — Logs</h2>
<h3>۶۸. چرا Log مهم است؟</h3>
<p>وقتی مشکلی رخ می‌دهد، Logها پاسخ این سؤال را می‌دهند که چه اتفاقی افتاده است.</p>

<h3>۶۹. <code>/var/log</code></h3>
<p>در بسیاری از سیستم‌ها Logهای سنتی در <code>/var/log</code> قرار دارند. مثال‌ها: <code>/var/log/auth.log</code> یا در برخی Distributionها <code>/var/log/secure</code>.</p>

<h3>۷۰. systemd Journal</h3>
<p>برای مشاهده Journal:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">journalctl</div></div>

<h3>۷۱. چند دستور مهم <code>journalctl</code></h3>
<div class="code-container"><span class="code-label">دستورات</span><div class="code-block">journalctl -b       # آخرین Boot\njournalctl -u ssh   # Log یک Service\njournalctl -f       # دنبال کردن Live</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> <code>journalctl</code> → systemd Journal.</div></div>

<h3>۷۲. <code>dmesg</code></h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">dmesg</div></div>
<p>برای مشاهده پیام‌های مربوط به Kernel Ring Buffer استفاده می‌شود.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>مقایسه:</strong> <code>journalctl</code> → Journal؛ <code>dmesg</code> → Kernel messages / ring buffer.</div></div>

<h3>۷۳. <code>logrotate</code></h3>
<p>Logrotate برای مدیریت Rotation و نگهداری نسخه‌های قدیمی Logها استفاده می‌شود.</p>

<h2>بخش نوزدهم — Time و NTP</h2>
<h3>۷۴. سه مفهوم مهم</h3>
<p>Time، Timezone و Synchronization را از هم جدا کنید.</p>

<h3>۷۵. <code>date</code></h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">date</div></div>

<h3>۷۶. <code>timedatectl</code></h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">timedatectl</div></div>

<h3>۷۷. Timezone</h3>
<p>مثال‌ها: <code>UTC</code>، <code>Europe/Paris</code>. Timezone مشخص می‌کند زمان چگونه نسبت به منطقه جغرافیایی نمایش داده شود.</p>

<h3>۷۸. NTP</h3>
<p>NTP برای Synchronization ساعت با Time Sourceهای شبکه استفاده می‌شود. پیاده‌سازی‌ها می‌توانند متفاوت باشند؛ مثلاً <code>chrony</code>، <code>systemd-timesyncd</code>.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> Timezone و NTP یکی نیستند. Timezone → منطقه زمانی؛ NTP → Synchronization.</div></div>

<h2>بخش بیستم — Printing</h2>
<h3>۷۹. CUPS</h3>
<p>یکی از مهم‌ترین سیستم‌های Printing در Linux <code>CUPS</code> است.</p>

<h3>۸۰. دستورات مهم</h3>
<div class="code-container"><span class="code-label">دستورات</span><div class="code-block">lpstat              # مشاهده Printer/Queue\nlp -d printer file  # ارسال Job\ncancel job-id       # لغو Job</div></div>

<h2>بخش بیست‌ویکم — GUI</h2>
<h3>۸۱. GUI چیست؟</h3>
<p>GUI یعنی <strong>Graphical User Interface</strong>. در Linux محیط‌هایی مانند <code>GNOME</code> و <code>KDE Plasma</code> نمونه Desktop Environment هستند.</p>

<h3>۸۲. Desktop Environment چیست؟</h3>
<p>یک Desktop Environment معمولاً مجموعه‌ای از اجزای گرافیکی است: Desktop، Window Manager، Panels، Menus، Applications و Settings.</p>

<h3>۸۳. X11 و Wayland</h3>
<p><code>GNOME</code> و <code>KDE</code> → Desktop Environment؛ <code>X11/Xorg</code> و <code>Wayland</code> → Graphics/display protocol & stack.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> GNOME یک Display Server نیست. KDE نیز Display Server نیست.</div></div>

<h3>۸۴. <code>graphical.target</code></h3>
<p>در سیستم‌های systemd می‌توان Target گرافیکی را به‌عنوان Default Target تنظیم کرد.</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">systemctl get-default</div></div>

<h2>بخش بیست‌ودوم — Remote Access</h2>
<h3>۸۵. SSH</h3>
<p>برای Remote Shell: <code>ssh user@server</code>.</p>

<h3>۸۶. SSH و Remote Desktop یکی نیستند</h3>
<p><code>SSH</code> → Remote Terminal؛ <code>VNC / RDP</code> → Graphical Remote Desktop.</p>

<h3>۸۷. X11 Forwarding</h3>
<p>در بعضی سناریوها: <code>ssh -X user@server</code> می‌تواند یک Application گرافیکی Remote را از طریق SSH Forward کند. اما این را با Remote Desktop کامل یکی ندانید.</p>

<h2>بخش بیست‌وپنجم — Security Golden Review</h2>
<h3>۱۰۰. Permission</h3>
<p><code>r = 4</code>، <code>w = 2</code>، <code>x = 1</code>.</p>

<h3>۱۰۱. SSH</h3>
<p>SSH برای Remote Access امن‌تر نسبت به پروتکل‌های قدیمی و بدون رمزنگاری است. مفهوم مهم: <code>SSH</code> → Secure Remote Access.</p>

<h3>۱۰۲. GPG</h3>

<h2>بخش بیست‌ونهم — مقایسه‌های فوق‌العاده مهم</h2>
<h3><code>grep</code> vs <code>find</code></h3>
<p><code>grep</code> → داخل محتوا؛ <code>find</code> → خود فایل‌ها.</p>
<h3><code>df</code> vs <code>du</code></h3>
<p><code>df</code> → Filesystem؛ <code>du</code> → Files / Directories.</p>
<h3>Hard Link vs Symbolic Link</h3>
<p>Hard Link → همان Inode؛ Symbolic Link → اشاره به Path.</p>
<h3><code>su</code> vs <code>sudo</code></h3>
<p><code>su</code> → Switch User؛ <code>sudo</code> → Execute authorized command.</p>
<h3><code>start</code> vs <code>enable</code></h3>
<p><code>start</code> → Now؛ <code>enable</code> → Boot.</p>
<h3><code>cron</code> vs <code>at</code></h3>
<p><code>cron</code> → Repeating؛ <code>at</code> → One-time.</p>
<h3><code>ping</code> vs <code>curl</code></h3>
<p><code>ping</code> → ICMP / Network Reachability؛ <code>curl</code> → Application-level Request / Transfer.</p>
<h3><code>tar</code> vs <code>gzip</code></h3>
<p><code>tar</code> → Archive؛ <code>gzip</code> → Compression.</p>

<h2>بخش سی‌وسوم — ۱۰ سؤال مفهومی بسیار مهم</h2>
<ol>
<li><strong>چرا <code>sudo</code> از نظر مدیریت دسترسی مهم است؟</strong> چون می‌توان Privilege را بر اساس Policy و Commandهای مجاز محدود کرد.</li>
<li><strong>چرا RAID Backup نیست؟</strong> چون RAID عمدتاً برای Availability/Redundancy/Performance است، نه نگهداری مستقل نسخه پشتیبان.</li>
<li><strong>چرا <code>df</code> و <code>du</code> عدد یکسانی نمی‌دهند؟</strong> چون یکی وضعیت فضای Filesystem را بررسی می‌کند و دیگری مصرف فضای فایل‌ها و Directoryها را.</li>
<li><strong>چرا <code>/etc/passwd</code> و <code>/etc/shadow</code> جدا هستند؟</strong> برای جداسازی اطلاعات عمومی‌تر Account از اطلاعات حساس Password.</li>
<li><strong>چرا <code>usermod -aG</code> مهم است؟</strong> چون بدون <code>-a</code> ممکن است Supplementary Groupهای قبلی جایگزین شوند.</li>
<li><strong>چرا <code>ping</code> برای تست Website کافی نیست؟</strong> چون Ping در سطح ICMP است و وضعیت HTTP/HTTPS را مستقیماً بررسی نمی‌کند.</li>
<li><strong>چرا <code>enable</code> با <code>start</code> فرق دارد؟</strong> چون <code>start</code> → الآن؛ <code>enable</code> → Boot.</li>
<li><strong>چرا <code>tar</code> با <code>gzip</code> فرق دارد؟</strong> چون <code>tar</code> → Archive؛ <code>gzip</code> → Compression.</li>
<li><strong>چرا <code>cron</code> با <code>at</code> فرق دارد؟</strong> چون <code>cron</code> → Repeating؛ <code>at</code> → One-time.</li>
<li><strong>چرا Shell Script قدرتمند است؟</strong> چون می‌تواند Commands + Variables + Conditions + Loops + Input + Exit Status + Scheduling را با هم ترکیب کند.</li>
</ol>

<h2>بخش سی‌وچهارم — حفظی‌های نهایی 🧠</h2>
<p>اگر فقط <strong>۲ دقیقه</strong> وقت داشتید، این بخش را بخوانید:</p>
<div class="code-container"><span class="code-label">حفظی</span><div class="code-block no-prompt">/       → Root\n.       → Current Directory\n..      → Parent\n\n>       → Overwrite\n>>      → Append\n|       → Pipe\n2>      → stderr\n\nps      → Process Snapshot\ntop     → Live Process View\nkill    → Signal\njobs    → Jobs\nbg      → Background\nfg      → Foreground\n\ndf      → Filesystem Space\ndu      → Directory/File Usage\n\nPV → VG → LV\n\nRAID 0  → Stripe\nRAID 1  → Mirror\nRAID 5  → Parity\nRAID 6  → Double Parity\nRAID 10 → Mirror + Stripe\n\nr=4\nw=2\nx=1\n\n755 → rwx r-x r-x\n644 → rw- r-- r--\n\npasswd  → Account\nshadow  → Password\ngroup   → Groups\n\nsu      → Switch User\nsudo    → Privileged Command\nvisudo  → sudoers\n\nstart   → Now\nenable  → Boot\n\njournalctl → Journal\ndmesg      → Kernel Messages\n\nTimezone → منطقه زمانی\nNTP      → Synchronization\n\nip addr   → IP\nip link   → Interface\nip route  → Route\nping      → ICMP\nss        → Socket/Port\ndig       → DNS\nhost      → DNS\ncurl      → Request/Transfer\nwget      → Download\n\n$?       → Exit Status\n0        → Success\n\nif       → Condition\ncase     → Multiple Choices\nfor      → Iterate\nwhile    → Repeat While\n\ncron     → Repeating\nat       → One-time\nnohup    → Session-independent execution aid</div></div>

<h2>⭐ سؤال طلایی نهایی</h2>
<p>اگر در امتحان یک سؤال پیچیده دیدید، سعی کنید اول آن را به یکی از این دسته‌ها تبدیل کنید:</p>
<div class="code-container"><span class="code-label">دسته‌بندی</span><div class="code-block no-prompt">این سؤال درباره چیست؟\n       │\n       ├── File؟\n       │\n       ├── Permission؟\n       │\n       ├── Process؟\n       │\n       ├── User؟\n       │\n       ├── Boot؟\n       │\n       ├── Filesystem؟\n       │\n       ├── Network؟\n       │\n       ├── Service؟\n       │\n       └── Script؟</div></div>
<p>بعد Command مناسب را پیدا کنید. این نوع دسته‌بندی ذهنی از حفظ کردن کورکورانه‌ی Commandها بسیار مهم‌تر است.</p>

<h2>جمع‌بندی نهایی کل دوره 🎓</h2>
<p>اگر کل LPIC-1 را در یک جمله خلاصه کنیم:</p>
<blockquote><strong>Linux Administrator باید بتواند سیستم را از Command Line کنترل کند، فایل‌ها و Permissionها را مدیریت کند، Process و Software را کنترل کند، Storage و Filesystem را مدیریت کند، Boot و Services را بشناسد، Userها و دسترسی‌ها را مدیریت کند، شبکه را Troubleshoot کند و کارهای تکراری را با Shell Script خودکار کند.</strong></blockquote>
<p>و نقشه نهایی شما:</p>
<div class="code-container"><span class="code-label">نقشه نهایی</span><div class="code-block no-prompt">                    Linux Administration\n                            │\n      ┌─────────────────────┼─────────────────────┐\n      ↓                     ↓                     ↓\n Command Line            System                Network\n      │                     │                     │\n Files / Text          Boot / systemd        IP / DNS\n      │                     │                     │\n Permissions            Users / Services      Routing\n      │                     │                     │\n Filesystem             Logs / Time           Troubleshooting\n      │\n LVM / RAID\n      │\n Backup\n\n                    Shell Scripting\n                           │\n              Automation / Scheduling</div></div>

<h2>🏁 پایان دوره</h2>
<p>شما حالا باید بتوانید به جای اینکه فقط بگویید «این Command را حفظ کرده‌ام»، بگویید: <strong>«می‌دانم این مشکل متعلق به کدام بخش Linux است، چه مفهومی پشت آن وجود دارد و کدام ابزار برای بررسی یا حل آن مناسب است.»</strong> این دقیقاً همان طرز فکری است که در سؤالات LPIC-1 به آن نیاز دارید.</p>
