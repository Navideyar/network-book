<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <!-- ============================================================
         سرصفحه (Head)
         شامل متا تگ‌ها، عنوان، فونت‌ها، آیکون‌ها و استایل‌های اصلی
         ============================================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرور LPIC-1</title>

    <!-- فونت وزیرمتن برای متن‌های فارسی -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet">
    <!-- فونت JetBrains Mono برای نمایش کدها -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 برای آیکون‌ها -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ============================================================
           بخش ۱ – متغیرهای CSS (تم روشن و تاریک)
           ============================================================ */
        :root {
            --primary: #E95420;            /* رنگ اصلی (نارنجی اوبونتو) */
            --primary-hover: #c7461a;
            --primary-soft: #fde8e0;
            --primary-glow: rgba(233, 84, 32, 0.18);

            --bg-body: #f7f7f7;
            --bg-card: #ffffff;
            --bg-navbar: rgba(255, 255, 255, 0.92);

            --text-main: #333333;
            --text-heading: #1a1a1a;
            --text-muted: #666666;

            --border: #e0e0e0;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --radius: 12px;

            --note-bg: #e8f5e9;
            --note-border: #4caf50;
            --important-bg: #e3f2fd;
            --important-border: #2196f3;
            --warning-bg: #fff8e1;
            --warning-border: #ff9800;

            --code-bg: #2c001e;
            --code-text: #eeeeee;
            --terminal-green: #8ae234;

            --sidebar-width: 300px;
        }

        /* تم تاریک – با استفاده از attribute selector */
        [data-theme="dark"] {
            --primary: #E95420;
            --primary-hover: #ff6b3d;
            --primary-soft: rgba(233, 84, 32, 0.15);
            --primary-glow: rgba(233, 84, 32, 0.2);

            --bg-body: #1e1e1e;
            --bg-card: #2a2a2a;
            --bg-navbar: rgba(42, 42, 42, 0.95);

            --text-main: #e0e0e0;
            --text-heading: #ffffff;
            --text-muted: #aaaaaa;

            --border: #404040;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);

            --note-bg: rgba(76, 175, 80, 0.12);
            --note-border: #81c784;
            --important-bg: rgba(33, 150, 243, 0.12);
            --important-border: #64b5f6;
            --warning-bg: rgba(255, 152, 0, 0.12);
            --warning-border: #ffb74d;

            --code-bg: #1a1a1a;
            --code-text: #e0e0e0;
        }

        /* ============================================================
           بخش ۲ – ریست و استایل‌های عمومی
           ============================================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            overflow-x: hidden;
            max-width: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.85;
            font-size: 16.5px;
            padding-top: 64px;          /* ارتفاع نوار بالا */
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            max-width: 100%;
        }

        /* ============================================================
           بخش ۳ – نوار ناوبری (Navbar) ثابت در بالا
           ============================================================ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-navbar);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            white-space: nowrap;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
        }

        .nav-spacer {
            flex: 1;          /* فضای خالی بین برند و دکمه تم */
        }

        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .theme-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        /* ============================================================
           بخش ۴ – نوار پیشرفت (Progress Bar)
           ============================================================ */
        .progress-track {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            z-index: 999;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #ff7a45);
            width: 0%;
            transition: width 0.12s;
        }

        /* ============================================================
           بخش ۵ – نوار کناری (Sidebar) شامل فهرست مطالب
           ============================================================ */
        .sidebar {
            position: fixed;
            top: 60px;
            right: 0;
            width: var(--sidebar-width);
            height: calc(100vh - 60px);
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            z-index: 900;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.06);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg-card);
            z-index: 2;
        }

        .sidebar-header h3 {
            font-size: 1rem;
            color: var(--text-heading);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-header h3 i {
            color: var(--primary);
        }

        .sidebar-close {
            display: none;        /* در موبایل نمایش داده می‌شود */
            background: none;
            border: none;
            font-size: 1.15rem;
            color: var(--text-muted);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: 0.2s;
        }
        .sidebar-close:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }

        /* ============================================================
           بخش ۶ – استایل فهرست مطالب (TOC)
           ============================================================ */
        .toc {
            padding: 8px 0 30px;
        }

        .toc-chapter {
            border-bottom: 1px solid var(--border);
        }
        .toc-chapter:last-child {
            border-bottom: none;
        }

        .toc-chapter summary {
            padding: 12px 14px;
            font-weight: 600;
            color: var(--text-heading);
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: background 0.2s;
            user-select: none;
            font-size: 0.92rem;
            line-height: 1.4;
        }
        .toc-chapter summary::-webkit-details-marker {
            display: none;
        }

        /* فلش باز/بسته شدن */
        .toc-chapter summary::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            margin-right: auto;
            margin-top: 2px;
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: transform 0.25s;
            flex-shrink: 0;
        }
        .toc-chapter[open] summary::after {
            transform: rotate(180deg);
        }

        .toc-chapter summary:hover {
            background: var(--primary-soft);
        }
        .toc-chapter[open] > summary {
            background: var(--primary-soft);
            color: var(--primary);
        }

        .chapter-num {
            width: 24px;
            height: 24px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .toc-sections {
            list-style: none;
            padding: 0 0 8px 0;
            margin: 0;
            background: var(--bg-body);
        }

        .toc-sections li a {
            display: block;
            padding: 8px 14px 8px 48px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.18s;
            border-right: 3px solid transparent;
            line-height: 1.45;
        }
        .toc-sections li a:hover {
            color: var(--primary);
            background: var(--primary-soft);
        }
        .toc-sections li a.active {
            color: var(--primary);
            background: var(--primary-soft);
            border-right-color: var(--primary);
            font-weight: 600;
        }

        /* ============================================================
           بخش ۷ – دکمه باز کردن سایدبار (در موبایل) و اوورلی
           ============================================================ */
        .sidebar-toggle {
            display: none;          /* فقط در موبایل نشان داده می‌شود */
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            font-size: 1.25rem;
            box-shadow: 0 6px 20px var(--primary-glow);
            z-index: 950;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }
        .sidebar-toggle:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 850;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.open {
            display: block;
        }

        /* ============================================================
           بخش ۸ – محتوای اصلی (Main)
           ============================================================ */
        .main {
            max-width: 820px;
            margin: 0 auto;
            margin-right: calc(var(--sidebar-width) + 24px);
            padding: 32px 24px 80px;
            transition: margin 0.3s;
            min-width: 0;
            width: 100%;
            overflow-x: hidden;
        }

        /* هر بخش (section) به صورت پیش‌فرض مخفی است */
        .section {
            display: none;
            animation: fadeIn 0.35s ease;
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }
        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           بخش ۹ – هدر هر بخش (عنوان، شماره، متا)
           ============================================================ */
        .section-header {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }
        .section-header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background: var(--primary);
        }

        .section-badge {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .section-header h1 {
            font-size: 1.3rem;
            color: var(--text-heading);
            margin-bottom: 3px;
        }
        .section-header .meta {
            font-size: 0.84rem;
            color: var(--text-muted);
        }

        /* ============================================================
           بخش ۱۰ – تایپوگرافی محتوا (عنوان‌ها، پاراگراف‌ها، لیست‌ها و ...)
           ============================================================ */
        h2 {
            color: var(--text-heading);
            font-size: 1.2rem;
            margin: 28px 0 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            flex-shrink: 0;
        }

        h3 {
            color: var(--text-heading);
            font-size: 1.05rem;
            margin: 18px 0 8px;
        }

        p {
            margin-bottom: 14px;
            text-align: justify;
        }

        strong {
            color: var(--text-heading);
        }

        ul,
        ol {
            margin: 10px 0 18px;
            padding-right: 22px;
        }
        li {
            margin-bottom: 6px;
        }

        blockquote {
            background: var(--primary-soft);
            border-right: 4px solid var(--primary);
            padding: 14px 18px;
            margin: 20px 0;
            border-radius: 0 10px 10px 0;
            color: var(--text-heading);
            font-style: italic;
        }

        /* ============================================================
           بخش ۱۱ – جعبه‌های اطلاعاتی (نکته، مهم، هشدار)
           ============================================================ */
        .box {
            display: flex;
            gap: 14px;
            padding: 16px 18px;
            border-radius: 10px;
            margin: 22px 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            max-width: 100%;
            min-width: 0;
            overflow-x: hidden;
            overflow-wrap: break-word;
        }

        .box > div {
            min-width: 0;
            flex: 1;
            overflow-wrap: break-word;
        }
        .box i {
            font-size: 1.3rem;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .box strong {
            display: block;
            margin-bottom: 3px;
        }

        .box.note {
            background: var(--note-bg);
            border-color: var(--note-border);
        }
        .box.note i,
        .box.note strong {
            color: var(--note-border);
        }

        .box.important {
            background: var(--important-bg);
            border-color: var(--important-border);
        }
        .box.important i,
        .box.important strong {
            color: var(--important-border);
        }

        .box.warning {
            background: var(--warning-bg);
            border-color: var(--warning-border);
        }
        .box.warning i,
        .box.warning strong {
            color: var(--warning-border);
        }

        /* ============================================================
           بخش ۱۲ – نمایش کدها (Code Blocks)
           ============================================================ */
        .code-container {
            position: relative;
            margin: 24px 0;
            max-width: 100%;
            min-width: 0;
            width: 100%;
        }

        .code-label {
            position: absolute;
            top: -11px;
            left: 14px;
            background: var(--primary);
            color: #fff;
            font-size: 0.72rem;
            padding: 2px 12px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            z-index: 1;
        }

        .code-block {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 28px 18px 18px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            direction: ltr;
            text-align: left;
            unicode-bidi: isolate;
            white-space: pre;
            overflow-x: auto;
            border: 1px solid var(--border);
            max-width: 100%;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
        }

        /* جمع‌بندی‌ها و خطوط دو زبانه روی موبایل داخل کادر بمانند */
        .summary-box,
        .summary-box .code-container,
        .summary-box .code-block,
        .box .code-container,
        .box .code-block {
            max-width: 100%;
            min-width: 0;
        }

        code, .section code {
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        /* پرامپت $ برای خطوط فرمان */
        .code-block::before {
            content: '$ ';
            color: var(--terminal-green);
        }
        .code-block.no-prompt::before {
            content: none;
        }

        /* ============================================================
           بخش ۱۳ – جدول‌ها
           ============================================================ */
        .table-wrap {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 22px 0;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .table-wrap table {
            margin: 0;
            border: none;
            border-radius: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 22px 0;
            font-size: 0.93rem;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            min-width: 0;
        }

        th,
        td {
            border: 1px solid var(--border);
            padding: 11px 14px;
            text-align: right;
            vertical-align: top;
        }

        th {
            background: var(--primary-soft);
            color: var(--text-heading);
            font-weight: 600;
            white-space: nowrap;
        }

        tr:hover td {
            background: var(--bg-body);
        }

        td code {
            white-space: nowrap;
        }

        /* ============================================================
           بخش ۱۴ – جزئیات قابل باز و بسته شدن (details)
           ============================================================ */
        details.content-details {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            margin: 18px 0;
        }
        details.content-details summary {
            font-weight: 600;
            color: var(--text-heading);
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        details.content-details summary::-webkit-details-marker {
            display: none;
        }
        details.content-details[open] summary {
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border);
        }

        /* ============================================================
           بخش ۱۵ – کارت‌های آزمون (Quiz)
           ============================================================ */
        .quiz-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
            margin: 28px 0 16px;
            box-shadow: var(--shadow);
        }

        .quiz-card>p {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-heading);
            margin-bottom: 16px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quiz-options button {
            background: var(--bg-body);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            text-align: right;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.2s;
        }
        .quiz-options button:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        .quiz-options button.selected {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .quiz-answer {
            display: none;
            margin-top: 14px;
            padding: 14px 16px;
            background: var(--note-bg);
            border-radius: 10px;
            border-right: 4px solid var(--note-border);
            color: var(--text-heading);
            font-size: 0.95rem;
        }
        .quiz-answer.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        /* ============================================================
           بخش ۱۶ – حالت placeholder برای بخش‌های خالی
           ============================================================ */
        .placeholder {
            text-align: center;
            color: var(--text-muted);
            padding: 48px 20px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px dashed var(--border);
        }
        .placeholder i {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 14px;
            opacity: 0.7;
            display: block;
        }

        /* ============================================================
           بخش ۱۷ – دکمه‌های ناوبری بین بخش‌ها
           ============================================================ */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            gap: 12px;
        }

        .nav-btn {
            padding: 11px 22px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 24px;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 4px 14px var(--primary-glow);
        }
        .nav-btn:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }
        .nav-btn:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* ============================================================
           بخش ۱۸ – جعبه جمع‌بندی (Summary Box)
           ============================================================ */
        .summary-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            margin: 24px 0;
            box-shadow: var(--shadow);
            max-width: 100%;
            min-width: 0;
            overflow-x: hidden;
            overflow-wrap: break-word;
        }
        .summary-box h3 {
            margin-top: 0;
            color: var(--primary);
        }

        /* ============================================================

<h2>۱. قبل از شروع...</h2>
<p>فرض کنید داخل Terminal این دستور را می‌نویسید:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ls</div></div>
<p>و فایل‌ها و پوشه‌ها نمایش داده می‌شوند. در ظاهر اتفاق ساده‌ای است؛ اما پشت صحنه تقریباً این مسیر را داریم:</p>
<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">User\n  │\n  ▼\nTerminal\n  │\n  ▼\nShell\n  │\n  ▼\nCommand / Program\n  │\n  ▼\nKernel\n  │\n  ▼\nHardware</div></div>
<p>البته این یک مدل ساده‌شده است؛ هدف آن درک ارتباط اجزاست، نه نشان دادن تمام جزئیات فنی.</p>

<h2>۲. Linux چیست؟</h2>
<p>در صحبت روزمره وقتی می‌گوییم «Linux»، معمولاً منظورمان کل محیط سیستم‌عامل لینوکسی است. اما از نظر فنی:</p>
<blockquote><strong>Linux نام Kernel است.</strong></blockquote>
<p>یک سیستم لینوکسی معمولاً از Kernel به همراه ابزارها، کتابخانه‌ها، برنامه‌ها و محیط‌های مختلف تشکیل می‌شود. به مجموعه‌ای که این اجزا را در کنار هم ارائه می‌کند، معمولاً <strong>Distribution یا Distro</strong> می‌گوییم. مثال‌ها: Ubuntu، Debian، Fedora، Rocky Linux. همگی از <strong>Linux Kernel</strong> استفاده می‌کنند، اما مجموعه نرم‌افزاری متفاوتی دارند.</p>
<h3>تصویر ذهنی</h3>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">Linux Distribution\n│\n├── Linux Kernel\n├── System Libraries\n├── System Utilities\n├── Shell\n├── Applications\n└── GUI / Desktop</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> Linux به‌طور دقیق نام Kernel است، نه نام تمام نرم‌افزارهای یک Distribution.</div></div>

<h2>۳. Kernel چیست؟</h2>
<p>Kernel هسته اصلی سیستم است. Kernel بین نرم‌افزارها و سخت‌افزار قرار دارد و منابع سیستم را مدیریت می‌کند: CPU، RAM، Disk، Network، Devices، Processها و ... . برنامه‌ها معمولاً برای انجام عملیات سطح پایین، از طریق <strong>System Call</strong> با Kernel درخواست ارتباط می‌کنند.</p>
<h3>مثال</h3>
<p>وقتی می‌نویسیم <code>cat file.txt</code>، برنامه <code>cat</code> برای دسترسی به فایل از امکانات سیستم‌عامل/Kernel استفاده می‌کند.</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">cat\n ↓\nKernel\n ↓\nFilesystem / Disk\n ↓\nfile.txt</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> Kernel مسئول کارهایی مثل <strong>Process + Memory + Device + Filesystem + Networking</strong> است.</div></div>

<h2>۴. Shell چیست؟</h2>
<p>Shell برنامه‌ای است که به عنوان <strong>Command Interpreter</strong> عمل می‌کند. یعنی دستوری که کاربر وارد می‌کند را دریافت و تفسیر می‌کند و در صورت نیاز برنامه یا عملیات مناسب را اجرا می‌کند.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">mkdir test</div></div>
<p>Shell متوجه می‌شود که باید دستور <code>mkdir</code> اجرا شود.</p>
<p>Shellهای معروف: <code>sh</code>، <code>bash</code>، <code>zsh</code>، <code>fish</code>. در LPIC-1، <strong>Bash</strong> اهمیت زیادی دارد.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> Shell = Command Interpreter. Shell خودش Kernel نیست.</div></div>

<h2>۵. Terminal چیست؟</h2>
<p>Terminal محیطی است که از طریق آن با Shell تعامل می‌کنیم. در محیط گرافیکی، Terminal معمولاً به شکل یک پنجره دیده می‌شود. داخل این Terminal ممکن است Shellای مثل Bash اجرا شود.</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">Terminal\n   │\n   └── Bash\n          │\n          └── Commands</div></div>
<h3>تفاوت خیلی مهم</h3>
<table>
<thead><tr><th>مفهوم</th><th>وظیفه</th></tr></thead>
<tbody>
<tr><td>Terminal</td><td>محیط/رابط تعامل متنی با Shell</td></tr>
<tr><td>Shell</td><td>تفسیر و اجرای دستورات</td></tr>
<tr><td>Kernel</td><td>مدیریت منابع و ارتباط سطح پایین با سخت‌افزار</td></tr>
<tr><td>Command</td><td>دستور یا برنامه‌ای که اجرا می‌شود</td></tr>
</tbody>
</table>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> Terminal ≠ Shell. Terminal محل تعامل است؛ Shell مفسر دستورات است.</div></div>

<h2>۶. Command چیست؟</h2>
<p>Command یعنی دستوری که به Shell می‌دهیم تا یک عملیات انجام شود. مثال‌ها: <code>pwd</code>، <code>ls</code>، <code>mkdir test</code>. یک Command ممکن است یک برنامه مستقل باشد یا یک قابلیت داخلی Shell باشد. مثلاً <code>cd</code> در Bash یک <strong>Shell Builtin</strong> است، اما <code>ls</code> معمولاً یک برنامه مستقل است.</p>
<div class="box important"><i class="fas fa-info-circle"></i><div><strong>نکته مهم</strong> همه Commandها الزاماً فایل اجرایی مستقل نیستند. این موضوع در LPIC-1 مهم است، مخصوصاً هنگام کار با <code>type</code> و <code>which</code>.</div></div>

<h2>۷. ساختار فایل‌ها در لینوکس</h2>
<p>یکی از تفاوت‌های مهم لینوکس و ویندوز این است که در لینوکس یک درخت فایل داریم که ریشه آن <code>/</code> (Root Directory) است.</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">/\n├── home\n├── etc\n├── var\n├── usr\n├── boot\n├── tmp\n└── dev</div></div>
<p>همه مسیرها در نهایت از <code>/</code> منشعب می‌شوند.</p>

<h2>۸. چند Directory مهم</h2>
<table>
<thead><tr><th>Directory</th><th>کاربرد کلی</th></tr></thead>
<tbody>
<tr><td><code>/</code></td><td>ریشه سیستم</td></tr>
<tr><td><code>/home</code></td><td>Home کاربران معمولی</td></tr>
<tr><td><code>/root</code></td><td>Home کاربر root</td></tr>
<tr><td><code>/etc</code></td><td>فایل‌های تنظیمات سیستم</td></tr>
<tr><td><code>/var</code></td><td>داده‌های متغیر مثل Log</td></tr>
<tr><td><code>/tmp</code></td><td>فایل‌های موقت</td></tr>
<tr><td><code>/boot</code></td><td>فایل‌های مربوط به Boot</td></tr>
<tr><td><code>/dev</code></td><td>Device Fileها</td></tr>
<tr><td><code>/usr</code></td><td>بخش بزرگی از برنامه‌ها و فایل‌های سیستم</td></tr>
</tbody>
</table>
<p>لازم نیست فعلاً تمام جزئیات این پوشه‌ها را حفظ کنید؛ کاربرد کلی آنها مهم است.</p>

<h2>۹. Path چیست؟</h2>
<p>Path یعنی <strong>آدرس یک فایل یا Directory</strong>. مانند <code>/home/ali/Documents/file.txt</code>. یعنی:</p>
<div class="code-container"><span class="code-label">درخت</span><div class="code-block no-prompt">/\n└── home\n    └── ali\n        └── Documents\n            └── file.txt</div></div>

<h2>۱۰. Absolute Path</h2>
<p>مسیر کامل که از Root شروع می‌شود. مثال: <code>/home/ali/Documents/file.txt</code>. از <code>/</code> شروع شده است. پس Absolute Path = مسیر کامل از Root.</p>

<h2>۱۱. Relative Path</h2>
<p>مسیر نسبی نسبت به <strong>Directory فعلی</strong> است. فرض کنید <code>pwd</code> خروجی <code>/home/ali</code> است. اگر فایلی در <code>/home/ali/Documents/file.txt</code> داشته باشیم، می‌توانیم آن را به صورت Relative بنویسیم: <code>Documents/file.txt</code>.</p>
<h3>مقایسه</h3>
<table>
<thead><tr><th>Absolute</th><th>Relative</th></tr></thead>
<tbody>
<tr><td><code>/home/ali/file.txt</code></td><td><code>file.txt</code></td></tr>
<tr><td>از <code>/</code> شروع می‌شود</td><td>از محل فعلی شروع می‌شود</td></tr>
<tr><td>مستقل از Directory فعلی</td><td>وابسته به Directory فعلی</td></tr>
</tbody>
</table>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> <code>/</code> → Root، <code>~</code> → Home کاربر فعلی، <code>.</code> → Directory فعلی، <code>..</code> → Directory والد.</div></div>

<h2>۱۲. <code>pwd</code></h2>
<p>مخفف <strong>Print Working Directory</strong>؛ یعنی الان داخل کدام Directory هستم؟</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">pwd</div></div>
<p>خروجی نمونه: <code>/home/ali</code></p>

<h2>۱۳. <code>cd</code></h2>
<p>مخفف <strong>Change Directory</strong> برای تغییر Directory.</p>
<h3>رفتن به یک Directory</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cd Documents</div></div>
<h3>رفتن به Root</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cd /</div></div>
<h3>رفتن به Home</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cd\ncd ~</div></div>
<h3>رفتن به Directory والد</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cd ..</div></div>
<h3>رفتن به مسیر قبلی</h3>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cd -</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>cd ..</code> یعنی یک سطح بالاتر برو، اما <code>cd -</code> یعنی به Directory قبلی که در آن بودی برگرد. این دو را با هم اشتباه نکن.</div></div>

<h2>۱۴. <code>ls</code></h2>
<p>برای مشاهده محتویات Directory استفاده می‌شود.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls</div></div>
<h3>گزینه‌های مهم</h3>
<table>
<thead><tr><th>دستور</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>ls -l</code></td><td>نمایش جزئیات (Permission، Owner، Group، Size، Time، Name)</td></tr>
<tr><td><code>ls -a</code></td><td>نمایش فایل‌های مخفی (نام‌هایی که با <code>.</code> شروع می‌شوند)</td></tr>
<tr><td><code>ls -lh</code></td><td>حجم خواناتر (مثلاً 4.0K)</td></tr>
<tr><td><code>ls -R</code></td><td>نمایش بازگشتی محتویات Directoryها و زیرDirectoryها</td></tr>
</tbody>
</table>
<p>ترکیب گزینه‌ها: <code>ls -lah</code> یعنی <code>-l</code> جزئیات، <code>-a</code> Hidden، <code>-h</code> حجم خواناتر.</p>

<h2>۱۵. فایل‌های مخفی</h2>
<p>در لینوکس فایل مخفی معمولاً فایلی است که نام آن با <code>.</code> شروع شود. مثال‌ها: <code>.bashrc</code>، <code>.config</code>، <code>.profile</code>. برای مشاهده آنها: <code>ls -a</code>.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> Hidden بودن به معنی «امن یا رمزگذاری‌شده» نیست؛ فقط یک ویژگی نام‌گذاری/نمایش است.</div></div>

<h2>۱۶. <code>.</code> و <code>..</code></h2>
<p><code>.</code> → Current Directory، <code>..</code> → Parent Directory. مثلاً <code>cd .</code> یعنی در همان Directory بمان؛ <code>cd ..</code> یعنی یک سطح بالاتر برو.</p>

<h2>۱۷. ساخت Directory با <code>mkdir</code></h2>
<p>ساخت Directory: <code>mkdir test</code>. ساخت چند Directory: <code>mkdir dir1 dir2 dir3</code>.</p>
<h3><code>mkdir -p</code></h3>
<p>اگر مسیر <code>a/b/c</code> را بخواهید بسازید و <code>a</code> و <code>b</code> وجود نداشته باشند، <code>mkdir -p a/b/c</code> همه مسیر لازم را ایجاد می‌کند.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> <code>mkdir</code> → ساخت Directory؛ <code>mkdir -p</code> → ساخت مسیرهای والد در صورت نیاز.</div></div>

<h2>۱۸. ساخت فایل با <code>touch</code></h2>
<p><code>touch file.txt</code> اگر فایل وجود نداشته باشد، یک فایل خالی ایجاد می‌کند. اگر فایل از قبل وجود داشته باشد، <code>touch</code> معمولاً Timestampهای آن را به‌روزرسانی می‌کند.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>touch</code> ابزار اصلی برای نوشتن محتویات فایل نیست؛ فقط فایل خالی ایجاد می‌کند یا Timestamp را به‌روز می‌کند.</div></div>

<h2>۱۹. <code>cat</code></h2>
<p>برای نمایش محتویات فایل: <code>cat file.txt</code>. همچنین <code>cat</code> می‌تواند برای اتصال چند فایل هم استفاده شود، اما کاربرد اصلی در این جلسه نمایش سریع محتویات فایل است.</p>

<h2>۲۰. <code>head</code></h2>
<p>برای مشاهده ابتدای فایل: <code>head file.txt</code> (به صورت پیش‌فرض چند خط اول را نمایش می‌دهد). مثال: <code>head -n 5 file.txt</code> یعنی ۵ خط اول را نمایش بده.</p>

<h2>۲۱. <code>tail</code></h2>
<p>برای مشاهده انتهای فایل: <code>tail file.txt</code>. مثال: <code>tail -n 5 file.txt</code> یعنی ۵ خط آخر را نمایش بده.</p>

<h2>۲۲. <code>less</code></h2>
<p>برای مشاهده فایل‌های طولانی به صورت صفحه‌به‌صفحه: <code>less file.txt</code>. در فایل‌های بزرگ، <code>less</code> معمولاً مناسب‌تر از <code>cat</code> است. حرکت در <code>less</code>: <code>↑ ↓</code> حرکت، <code>Space</code> صفحه بعد، <code>q</code> خروج.</p>
<h3>مقایسه سریع</h3>
<table>
<thead><tr><th>Command</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>cat</code></td><td>نمایش سریع محتوا</td></tr>
<tr><td><code>head</code></td><td>ابتدای فایل</td></tr>
<tr><td><code>tail</code></td><td>انتهای فایل</td></tr>
<tr><td><code>less</code></td><td>مشاهده صفحه‌به‌صفحه</td></tr>
</tbody>
</table>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> اگر فایل خیلی بزرگ است و فقط می‌خواهید آن را بررسی کنید، <code>less file.txt</code> انتخاب مناسبی است.</div></div>

<h2>۲۳. Variable چیست؟</h2>
<p>Variable یعنی یک نام برای نگهداری یک مقدار. مثال: <code>name=Ali</code>. برای دسترسی به مقدار Variable از علامت <code>$</code> استفاده می‌شود: <code>echo $name</code> خروجی <code>Ali</code>.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> در Bash معمولاً نباید اطراف <code>=</code> فاصله بگذاریم. درست: <code>name=Ali</code>، غلط: <code>name = Ali</code>.</div></div>

<h2>۲۴. <code>echo</code></h2>
<p>برای نمایش مقدار یا متن: <code>echo Hello</code> خروجی <code>Hello</code>؛ برای Variable: <code>echo $name</code> خروجی <code>Ali</code>.</p>

<h2>۲۵. <code>PATH</code></h2>
<p>یکی از مهم‌ترین Environment Variableهاست. برای Shell مشخص می‌کند هنگام اجرای یک Command، در چه Directoryهایی به دنبال برنامه بگردد. مشاهده: <code>echo $PATH</code>. خروجی نمونه: <code>/usr/local/bin:/usr/bin:/bin</code>. هر مسیر با <code>:</code> از مسیر بعدی جدا شده است.</p>
<h3>مثال مفهومی</h3>
<p>وقتی می‌نویسید <code>ls</code>، Shell باید بفهمد برنامه <code>ls</code> کجاست. PATH به آن می‌گوید که اینجاها را جستجو کن.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> PATH = محل‌های جستجوی Commandها.</div></div>

<h2>۲۶. <code>env</code></h2>
<p>برای مشاهده Environment Variableها: <code>env</code>. ممکن است خروجی شامل <code>USER=ali</code>، <code>HOME=/home/ali</code>، <code>PATH=/usr/bin:/bin</code>، <code>SHELL=/bin/bash</code> و ... باشد.</p>

<h2>۲۷. History</h2>
<p>Shell معمولاً دستورات قبلی را در History نگه می‌دارد. نمایش History: <code>history</code>. اجرای آخرین Command: <code>!!</code>. اجرای Command شماره مشخص: مثلاً <code>!15</code> یعنی Command شماره ۱۵ در History را اجرا کن.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>history</code> فقط برای دیدن دستورات نیست؛ می‌توان از History برای اجرای دوباره دستورات نیز استفاده کرد.</div></div>

<h2>۲۸. گرفتن Help</h2>
<p>در لینوکس لازم نیست همه Commandها را حفظ کنید. اگر دستوری را بلد نیستید، اول از خودش کمک بگیرید. سه روش مهم:</p>
<div class="code-container"><span class="code-label">روش‌ها</span><div class="code-block">command --help\nman command\ninfo command</div></div>

<h2>۲۹. <code>--help</code></h2>
<p>برای راهنمای سریع Command: <code>ls --help</code>. معمولاً گزینه‌های مهم و Syntax را نشان می‌دهد. مناسب برای یادآوری سریع.</p>

<h2>۳۰. <code>man</code></h2>
<p>مخفف <strong>Manual</strong>. مثال: <code>man ls</code> صفحه Manual مربوط به <code>ls</code> را باز می‌کند. در <code>man</code> معمولاً اطلاعاتی مثل Name، Synopsis، Description، Options وجود دارد. خروج با <code>q</code>.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> اگر سؤال بپرسد «برای مشاهده Manual یک Command از چه چیزی استفاده می‌کنیم؟» جواب <code>man</code> است.</div></div>

<h2>۳۱. <code>info</code></h2>
<p><code>info</code> نیز برای مشاهده Documentation استفاده می‌شود: <code>info ls</code>. در بعضی پروژه‌ها و ابزارهای GNU، مستندات Info ساختاریافته‌تر و مفصل‌تر از Manual معمولی هستند. اما برای مرور LPIC-1: <code>--help</code> سریع، <code>man</code> Manual، <code>info</code> Documentation ساختاریافته را به خاطر بسپارید.</p>

<h2>۳۲. مقایسه Helpها</h2>
<table>
<thead><tr><th>روش</th><th>کاربرد اصلی</th></tr></thead>
<tbody>
<tr><td><code>command --help</code></td><td>راهنمای سریع</td></tr>
<tr><td><code>man command</code></td><td>Manual استاندارد</td></tr>
<tr><td><code>info command</code></td><td>Documentation ساختاریافته، مخصوصاً ابزارهای GNU</td></tr>
</tbody>
</table>
<p><strong>پیشنهاد عملی:</strong> اگر Command را نمی‌شناسید: <code>command --help</code>؛ اگر توضیح کامل‌تر می‌خواهید: <code>man command</code>.</p>

<h2>۳۳. یک سناریوی واقعی</h2>
<p>فرض کنید تازه وارد سیستم شده‌اید و می‌خواهید یک فایل را پیدا و مشاهده کنید. اول <code>pwd</code> تا بدانید کجا هستید، بعد <code>ls</code> تا محتویات را ببینید، وارد Directory موردنظر شوید با <code>cd Documents</code>، دوباره <code>pwd</code> برای اطمینان از مسیر، سپس <code>ls -l</code> برای دیدن جزئیات. اگر فایل متنی باشد، <code>less file.txt</code> و اگر دستور <code>less</code> را یادتان نباشد، <code>man less</code>. این دقیقاً همان چیزی است که باید از خط فرمان یاد بگیرید: بدانید کجا هستید → محتویات را ببینید → حرکت کنید → فایل را پیدا کنید → فایل را مشاهده کنید → اگر دستوری را بلد نیستید → Help.</p>

<h2>۳۶. دام‌های مهم امتحانی ⚠️</h2>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><ul>
<li><strong>دام ۱:</strong> Linux = فقط یک برنامه؟ خیر. از نظر فنی Linux نام Kernel است؛ یک Distribution مجموعه‌ای از Kernel و اجزای دیگر است.</li>
<li><strong>دام ۲:</strong> Terminal = Shell؟ خیر. Terminal → محیط تعامل، Shell → Command Interpreter.</li>
<li><strong>دام ۳:</strong> <code>/</code> = Home؟ خیر. <code>/</code> → Root، <code>~</code> → Home کاربر فعلی.</li>
<li><strong>دام ۴:</strong> <code>cd ..</code> = مسیر قبلی؟ خیر. <code>cd ..</code> → Parent Directory، <code>cd -</code> → Previous Directory.</li>
<li><strong>دام ۵:</strong> <code>touch</code> = نوشتن متن در فایل؟ خیر. <code>touch</code> برای ایجاد فایل خالی در صورت نبودن فایل و به‌روزرسانی Timestamp فایل موجود استفاده می‌شود.</li>
<li><strong>دام ۶:</strong> <code>ls</code> = نمایش فقط فایل‌ها؟ خیر. <code>ls</code> محتویات Directory را نمایش می‌دهد؛ فایل‌ها و Directoryها را.</li>
<li><strong>دام ۷:</strong> <code>ls</code> = نمایش فایل‌های مخفی؟ به صورت معمول خیر. برای آنها <code>ls -a</code>.</li>
<li><strong>دام ۸:</strong> <code>PATH</code> = مسیر فعلی؟ خیر. <code>pwd</code> → مسیر فعلی، <code>PATH</code> → مسیرهای جستجوی Commandها.</li>
</ul></div></div>

<h2>⚡ حفظی‌های جلسه — مرور ۲ تا ۳ دقیقه‌ای</h2>
<p>اگر وقت خیلی کمی دارید، فقط این قسمت را مرور کنید:</p>
<h3>مفاهیم</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Linux → Kernel\nShell → Command Interpreter\nTerminal → محیط تعامل با Shell</div></div>
<h3>Filesystem</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">/  → Root\n~  → Home کاربر فعلی\n.  → Current Directory\n.. → Parent Directory</div></div>
<h3>Path</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Absolute → از / شروع می‌شود\nRelative → نسبت به محل فعلی</div></div>
<h3>Navigation</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">pwd      # کجا هستم؟\ncd       # تغییر مسیر\ncd ..    # یک سطح بالا\ncd -     # مسیر قبلی\ncd ~     # Home\ncd /     # Root\nls       # محتویات</div></div>
<h3>ساخت</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">mkdir test\ntouch file.txt\n# mkdir → Directory\n# touch → File / Timestamp</div></div>
<h3>مشاهده فایل</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">cat file.txt\nhead file.txt\ntail file.txt\nless file.txt\n# cat  → کل/سریع\n# head → اول\n# tail → آخر\n# less → صفحه‌ای</div></div>
<h3>Variable</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">name=Ali\necho $name\n# $ → دسترسی به مقدار Variable</div></div>
<h3>PATH</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">echo $PATH\n# PATH → محل‌های جستجوی Commandها</div></div>
<h3>History</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">history\n!!\n!15</div></div>

        <h1>پردازش متن و دستورات پرکاربرد</h1>

<blockquote><strong>🎯 هدف جلسه:</strong> یاد بگیریم چگونه خروجی یک Command را بگیریم، فیلتر کنیم، به Command دیگری بدهیم، تغییر دهیم یا داخل فایل ذخیره کنیم. مفاهیم اصلی: <code>grep</code>، Redirect، <code>|</code>، <code>sed</code>، <code>xargs</code>، <code>md5sum</code>، <code>sha256sum</code>، ترکیب Commandها و دام‌های رایج خط فرمان.</blockquote>

<h2>۱. قبل از شروع...</h2>
<p>فرض کنید این دستور را اجرا می‌کنیم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ls -l</div></div>
<p>و خروجی زیادی دریافت می‌کنیم. اما فقط فایل‌های PDF را می‌خواهیم. به جای اینکه خروجی را دستی بررسی کنیم، می‌توانیم آن را <strong>فیلتر</strong> کنیم. اینجا ابزارهایی مثل <code>grep</code>، <code>|</code>، <code>></code>، <code>sed</code> و <code>xargs</code> وارد می‌شوند.</p>

<h2>۲. مدل ذهنی این جلسه</h2>
<p>تقریباً تمام جلسه را می‌توان با این زنجیره فهمید:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">Command\n   │\n   ▼\nOutput\n   │\n   ├── grep → Filter\n   │\n   ├── sed → Transform\n   │\n   ├── | → Send to another Command\n   │\n   └── > → Save to File</div></div>
<p>و گاهی: <code>Command 1 → Output → xargs → Command 2</code>. اگر این مدل را بفهمید، لازم نیست Commandها را جدا و بی‌ارتباط حفظ کنید.</p>

<h2>۳. Standard Streams</h2>
<p>قبل از Pipe و Redirect باید یک مفهوم مهم را بشناسیم. هر Process به طور معمول سه <strong>Standard Stream</strong> دارد:</p>
<table>
<thead><tr><th>Stream</th><th>شماره</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>stdin</code></td><td><code>0</code></td><td>ورودی</td></tr>
<tr><td><code>stdout</code></td><td><code>1</code></td><td>خروجی معمولی</td></tr>
<tr><td><code>stderr</code></td><td><code>2</code></td><td>پیام خطا</td></tr>
</tbody>
</table>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">             ┌─────────────┐\nstdin  ────► │   Process   │ ────► stdout\n             │             │\n             └─────────────┘\n                    │\n                    └────────► stderr</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> شماره‌های مهم: <code>0 → stdin</code>، <code>1 → stdout</code>، <code>2 → stderr</code>. این سه شماره را حتماً بلد باشید.</div></div>

<h2>۴. <code>grep</code></h2>
<p>یکی از مهم‌ترین ابزارهای پردازش متن در Linux: <code>grep</code>. وظیفه ساده آن: <strong>پیدا کردن الگو یا متن در خطوط ورودی</strong>.</p>
<p>مثال: فایل <code>users.txt</code> با محتوای:</p>
<div class="code-container"><span class="code-label">محتوا</span><div class="code-block no-prompt">Ali\nSara\nReza\nAmir</div></div>
<p>اگر فقط <code>Amir</code> را بخواهیم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">grep Amir users.txt</div></div>
<p>خروجی: <code>Amir</code></p>

<h2>۵. <code>grep</code> روی خروجی Command</h2>
<p><code>grep</code> فقط روی فایل کار نمی‌کند. می‌توانیم خروجی یک Command را نیز به آن بدهیم. مثال:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">history | grep ssh</div></div>
<p>اینجا خروجی <code>history</code> به <code>grep ssh</code> داده می‌شود و فقط خطوط دارای <code>ssh</code> نمایش داده می‌شوند.</p>

<h2>۶. <code>grep -i</code></h2>
<p>به صورت عادی، <code>grep</code> به بزرگی و کوچکی حروف حساس است. اما <code>grep -i</code> به Case حساس نیست و می‌تواند مواردی مثل <code>linux</code>، <code>Linux</code>، <code>LINUX</code> و <code>LiNuX</code> را پیدا کند.</p>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>حفظی</strong> <code>-i</code> → Ignore Case</div></div>

<h2>۷. <code>grep -v</code></h2>
<p>گزینه <code>-v</code> نتیجه را معکوس می‌کند. مثال:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">grep -v root /etc/passwd</div></div>
<p>یعنی خطوطی را نشان بده که شامل الگوی <code>root</code> نیستند.</p>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>حفظی</strong> <code>-v</code> → Invert Match</div></div>

<h2>۸. <code>^</code> و <code>$</code> در <code>grep</code></h2>
<p><code>^</code> یعنی ابتدای خط. مثال: <code>grep "^root" file.txt</code> فقط خطوطی که با <code>root</code> شروع می‌شوند.</p>
<p><code>$</code> یعنی انتهای خط. مثال: <code>grep "bash$" /etc/passwd</code> خطوطی را پیدا می‌کند که به <code>bash</code> ختم می‌شوند.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> <code>^text</code> → text در ابتدای خط؛ <code>text$</code> → text در انتهای خط.</div></div>

<h2>۹. چند گزینه مهم دیگر <code>grep</code></h2>
<table>
<thead><tr><th>گزینه</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>-n</code></td><td>نمایش شماره خط (line number)</td></tr>
<tr><td><code>-r</code></td><td>جستجوی بازگشتی (recursive) در فایل‌های داخل Directory</td></tr>
</tbody>
</table>

<h2>۱۰. <code>grep</code> در برابر <code>find</code></h2>
<p>یکی از مهم‌ترین تفاوت‌های آزمون:</p>
<ul>
<li><code>grep</code> داخل <strong>محتوای فایل‌ها</strong> دنبال Pattern می‌گردد. مثال: <code>grep "error" log.txt</code></li>
<li><code>find</code> خود <strong>File/Directory</strong>ها را بر اساس ویژگی‌هایی مثل نام، نوع و ... پیدا می‌کند. مثال: <code>find /var -name "*.log"</code></li>
</ul>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> اگر سؤال گفت «فایلی که اسمش <code>report.txt</code> است را پیدا کن» → به <code>find</code> فکر کنید. اگر گفت «داخل فایل‌ها دنبال کلمه <code>error</code> بگرد» → به <code>grep</code> فکر کنید.</div></div>

<h2>۱۱. Redirect چیست؟</h2>
<p>به طور معمول خروجی را روی Terminal می‌بینیم. اما می‌توانیم مسیر خروجی را تغییر دهیم. به این کار <strong>Redirection</strong> می‌گوییم.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls > files.txt</div></div>
<p>یعنی خروجی <code>ls</code> به جای Terminal داخل <code>files.txt</code> می‌رود.</p>

<h2>۱۲. <code>></code></h2>
<p>علامت <code>></code> برای Redirect کردن <code>stdout</code> استفاده می‌شود. مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">date > date.txt</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>نکته بسیار مهم</strong> اگر فایل از قبل وجود داشته باشد، محتوای قبلی <strong>Overwrite</strong> می‌شود. پس <code>></code> → Overwrite، نه Append.</div></div>

<h2>۱۳. <code>>></code></h2>
<p>برای اضافه کردن خروجی به انتهای فایل:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">date >> date.txt</div></div>
<p>اگر فایل وجود داشته باشد، محتوای قبلی باقی می‌ماند و خروجی جدید به انتهای آن اضافه می‌شود.</p>
<div class="box note"><i class="fas fa-lightbulb"></i><div><strong>حفظی</strong> <code>></code> → Overwrite، <code>>></code> → Append.</div></div>

<h2>۱۴. Redirect کردن Error</h2>
<p>پیام خطا در <code>stderr</code> (شماره <code>2</code>) قرار می‌گیرد. پس:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">ls /abc 2> error.txt</div></div>
<p>یعنی خطای Command را داخل <code>error.txt</code> ذخیره کن.</p>

<h2>۱۵. <code>2>></code></h2>
<p>برای Append کردن Error:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">command 2>> error.txt</div></div>

<h2>۱۶. Redirect ورودی با <code><</code></h2>
<p>می‌توانیم ورودی یک Command را نیز از فایل بگیریم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">command < file.txt</div></div>
<p>یعنی محتوای <code>file.txt</code> را به عنوان <code>stdin</code> به Command بده.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> این چهار مورد را بشناسید: <code><</code> → stdin، <code>></code> → stdout، <code>>></code> → stdout + append، <code>2></code> → stderr.</div></div>

<h2>۱۷. Pipe چیست؟</h2>
<p>علامت Pipe (<code>|</code>) خروجی یک Command را به ورودی Command بعدی متصل می‌کند.</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Command 1\n   │\n stdout\n   │\n   ▼\n  Pipe\n   │\n stdin\n   │\n   ▼\nCommand 2</div></div>

<h2>۱۸. مثال ساده Pipe</h2>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat users.txt | grep Amir</div></div>
<p><code>cat users.txt</code> خروجی فایل را می‌دهد، Pipe آن را به <code>grep Amir</code> می‌دهد و فقط خطوط مربوط به Amir نمایش داده می‌شوند. Pipe فایل نمی‌سازد؛ فقط <strong>stdout یک Command را به stdin Command بعدی وصل می‌کند.</strong></p>

<h2>۱۹. یک مثال واقعی</h2>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">history | grep ssh</div></div>
<p>این یکی از مهم‌ترین الگوهای خط فرمان است.</p>

<h2>۲۰. Pipe در برابر Redirect</h2>
<table>
<thead><tr><th>Pipe</th><th>Redirect</th></tr></thead>
<tbody>
<tr><td><code>|</code></td><td><code>></code>، <code>>></code>، <code>2></code></td></tr>
<tr><td>خروجی → Command بعدی</td><td>خروجی → File</td></tr>
<tr><td>برای زنجیره Commandها</td><td>برای ذخیره/تغییر مقصد جریان</td></tr>
</tbody>
</table>
<div class="box important"><i class="fas fa-star"></i><div><strong>حفظی طلایی ⭐</strong> <code>|</code> → Command، <code>></code> → File.</div></div>

<h2>۲۱. ترکیب Pipe و Redirect</h2>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">history | grep ssh > ssh_commands.txt</div></div>
<p>مراحل: <code>history</code> → <code>grep ssh</code> → <code>ssh_commands.txt</code>. یعنی History را بگیر، فقط خطوط دارای <code>ssh</code> را نگه دار، نتیجه را داخل فایل ذخیره کن.</p>

<h2>۲۲. ترتیب Commandها مهم است</h2>
<p><code>command1 | command2 > result.txt</code> یعنی خروجی <code>command1</code> به <code>command2</code> داده می‌شود و نتیجه نهایی در فایل ذخیره می‌شود. ترتیب جریان داده را مشخص می‌کند.</p>

<h2>۲۳. <code>sed</code></h2>
<p><code>sed</code> یک <strong>Stream Editor</strong> است که می‌تواند متن ورودی را پردازش و تغییر دهد. یکی از رایج‌ترین کاربردهای آن جایگزینی متن است.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed 's/Linux/LPIC/' file.txt</div></div>
<p>اگر ورودی <code>Linux is powerful.</code> باشد، خروجی <code>LPIC is powerful.</code> می‌شود.</p>

<h2>۲۴. ساختار <code>s</code></h2>
<p><code>sed 's/old/new/' file.txt</code> یعنی <code>s</code> → substitute، <code>old</code> → متن قدیمی، <code>new</code> → متن جدید.</p>

<h2>۲۵. گزینه <code>g</code> در <code>sed</code></h2>
<p>به طور معمول در هر خط، اولین مورد جایگزین می‌شود. اگر بخواهیم <strong>تمام موارد موجود در هر خط</strong> جایگزین شوند:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed 's/Linux/LPIC/g' file.txt</div></div>
<p><code>g</code> → global. ورودی <code>Linux Linux Linux</code> با <code>g</code> تبدیل به <code>LPIC LPIC LPIC</code> می‌شود.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> در LPIC-1: <code>s</code> → substitute، <code>g</code> → global را به خوبی بشناسید.</div></div>

<h2>۲۶. آیا <code>sed</code> فایل اصلی را تغییر می‌دهد؟</h2>
<p>به طور پیش‌فرض خیر؛ فقط نتیجه پردازش را روی <code>stdout</code> نمایش می‌دهد. برای ذخیره نتیجه:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed 's/Linux/LPIC/g' file.txt > new.txt</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>sed</code> به صورت پیش‌فرض فایل اصلی را تغییر نمی‌دهد.</div></div>

<h2>۲۷. <code>xargs</code></h2>
<p><code>xargs</code> ورودی را به <strong>Argument</strong> برای یک Command تبدیل می‌کند. مثال:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">printf '%s\\n' file1.txt file2.txt file3.txt | xargs echo</div></div>
<p>تقریباً به این مفهوم است: <code>echo file1.txt file2.txt file3.txt</code></p>

<h2>۲۸. <code>xargs</code> در برابر Pipe</h2>
<p>این تفاوت بسیار مهم است:</p>
<ul>
<li>Pipe: <code>command1 | command2</code> → خروجی <code>command1</code> به <strong>stdin</strong> دستور دوم می‌رود.</li>
<li>xargs: <code>command1 | xargs command2</code> → خروجی <code>command1</code> به <strong>Argument</strong>های <code>command2</code> تبدیل می‌شود.</li>
</ul>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> اگر Command دوم انتظار دارد اطلاعات را از <strong>stdin</strong> بگیرد → <code>|</code>. اگر لازم است خروجی Command اول به شکل <strong>Argument</strong> به Command دوم داده شود → <code>xargs</code>.</div></div>

<h2>۲۹. مثال معروف <code>xargs</code></h2>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">find . -name "*.tmp" -print0 | xargs -0 rm</div></div>
<p>یعنی نام فایل‌های tmp پیدا شده به عنوان Argument به <code>rm</code> داده می‌شوند. استفاده از <code>-print0</code> و <code>-0</code> برای انتقال امن‌تر نام فایل‌ها (به دلیل وجود فاصله یا کاراکترهای خاص) مناسب‌تر است.</p>

<h2>۳۰. دام مهم <code>xargs</code> ⚠️</h2>
<p><code>xargs</code> همان Pipe نیست. <code>|</code> → stdin، <code>xargs</code> → arguments. این یکی از تفاوت‌های مفهومی مهم این جلسه است.</p>

<h2>۳۱. Checksum چیست؟</h2>
<p>Checksum مانند یک <strong>اثر انگشت دیجیتال فایل</strong> است. برای بررسی اینکه فایل در مسیر دانلود خراب یا تغییر نکرده، از Checksum استفاده می‌شود.</p>

<h2>۳۲. <code>md5sum</code></h2>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">md5sum file.iso</div></div>
<p>خروجی نمونه: <code>d41d8cd98f00b204e9800998ecf8427e  file.iso</code></p>

<h2>۳۳. <code>sha256sum</code></h2>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sha256sum file.iso</div></div>
<p>SHA-256 امروزه انتخاب بسیار مناسب‌تری برای بررسی Integrity نسبت به MD5 است.</p>

<h2>۳۴. MD5 در برابر SHA-256</h2>
<table>

<tr><td>امروزه برای امنیت رمزنگاری مناسب نیست</td><td>بسیار قوی‌تر</td></tr>
<tr><td>برای برخی بررسی‌های ساده Integrity دیده می‌شود</td><td>انتخاب رایج‌تر برای Integrity</td></tr>
</tbody>
</table>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> کدام‌یک برای امنیت مدرن مناسب‌تر است؟ <code>SHA-256</code>.</div></div>

<h2>۳۵. ترکیب ابزارها</h2>
<p>قدرت واقعی Linux زمانی مشخص می‌شود که Commandها را با هم ترکیب کنیم.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">history | grep ssh > ssh.txt</div></div>
<p>یعنی History → grep → File.</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">cat file.txt | sed 's/Linux/LPIC/g'</div></div>
<p>یعنی File → cat → sed → Modified Output.</p>

<h2>۳۶. یک سناریوی واقعی</h2>
<p>فرض کنید یک فایل Log بزرگ داریم و فقط خطاها را می‌خواهیم:</p>
<div class="code-container"><span class="code-label">مراحل</span><div class="code-block">grep "ERROR" server.log > errors.txt\ngrep "ERROR" server.log | grep ssh > ssh_errors.txt</div></div>
<p>مدل ذهنی: <code>server.log → grep ERROR → grep ssh → ssh_errors.txt</code>. این فلسفه اصلی خط فرمان است: یک ابزار کار مشخصی انجام می‌دهد؛ سپس خروجی آن را به ابزار بعدی می‌دهیم.</p>

<h2>۳۷. یک سناریوی دیگر با <code>sed</code></h2>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block">sed 's/Linux/LPIC/g' file.txt > new.txt</div></div>
<p>جریان: <code>file.txt → sed → Replace → new.txt</code>. فایل اصلی دست‌نخورده باقی می‌ماند.</p>

<h2>۴۰. مقایسه‌های طلایی جلسه</h2>
<h3><code>grep</code> در برابر <code>find</code></h3>
<p><code>grep</code> → داخل محتوا، <code>find</code> → پیدا کردن File/Directory.</p>
<h3>Pipe در برابر Redirect</h3>
<p><code>|</code> → Command، <code>></code> → File.</p>
<h3><code>></code> در برابر <code>>></code></h3>
<p><code>></code> → Overwrite، <code>>></code> → Append.</p>
<h3>Pipe در برابر <code>xargs</code></h3>
<p><code>|</code> → stdout → stdin، <code>xargs</code> → stdout → arguments.</p>
<h3><code>sed</code> در برابر <code>grep</code></h3>
<p><code>grep</code> → پیدا کن، <code>sed</code> → تغییر/پردازش کن.</p>
<h3><code>md5sum</code> در برابر <code>sha256sum</code></h3>
<p>MD5 قدیمی‌تر و ضعیف‌تر، SHA256 قوی‌تر و مناسب‌تر برای Integrity مدرن.</p>

<h2>بخش اول — مدیریت نرم‌افزار</h2>

<h3>۱. Repository چیست؟</h3>
<p>در لینوکس، نرم‌افزارها معمولاً از <strong>Repository</strong> نصب می‌شوند. Repository را می‌توان مثل یک <strong>مخزن مرکزی نرم‌افزارها</strong> در نظر گرفت. مثال در Debian/Ubuntu:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo apt install nginx</div></div>
<p>تقریباً چنین اتفاقی رخ می‌دهد:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">دستور نصب\n   ↓\nPackage Manager\n   ↓\nRepository\n   ↓\nدریافت Package\n   ↓\nبررسی Dependencies\n   ↓\nنصب</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> در سؤال‌های LPIC وقتی صحبت از نصب نرم‌افزار <strong>از مخزن و همراه با مدیریت وابستگی‌ها</strong> است، ذهنمان باید به سمت Package Managerهایی مثل <code>apt</code> و <code>dnf</code> برود.</div></div>

<h3>۲. Package چیست؟</h3>
<p>یک نرم‌افزار در لینوکس معمولاً به صورت یک <strong>Package</strong> توزیع می‌شود. Package فقط فایل اجرایی برنامه نیست؛ می‌تواند شامل مواردی مثل فایل‌های برنامه، اطلاعات نسخه، اطلاعات نصب، اطلاعات وابستگی‌ها و اسکریپت‌های لازم برای نصب یا حذف باشد.</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">Package\n   │\n   ├── Program files\n   ├── Metadata\n   ├── Dependencies information\n   └── Installation information</div></div>

<h3>۳. دو خانواده مهم Package</h3>
<p>در LPIC-1 دو خانواده‌ی بسیار مهم را باید بشناسیم:</p>
<table>
<thead><tr><th>خانواده</th><th>فرمت Package</th><th>ابزارهای مهم</th></tr></thead>
<tbody>
<tr><td>Debian</td><td><code>.deb</code></td><td><code>apt</code>, <code>dpkg</code></td></tr>
<tr><td>Red Hat</td><td><code>.rpm</code></td><td><code>dnf</code>, <code>rpm</code></td></tr>
</tbody>
</table>
<p>مثلاً <code>nginx.deb</code> یک Package از خانواده Debian است و <code>nginx.rpm</code> یک Package از خانواده RPM است.</p>

<h3>۴. <code>apt</code> و <code>dpkg</code></h3>
<p>این دو را با هم اشتباه نکنید.</p>
<ul>
<li><strong>dpkg:</strong> ابزار سطح پایین Debian برای کار با Packageهای <code>.deb</code>. مثال: <code>sudo dpkg -i file.deb</code> (Package مشخص‌شده را مستقیماً نصب کن).</li>
<li><strong>apt:</strong> ابزار سطح بالاتری که می‌تواند Package را از Repository دریافت کند و وابستگی‌های موردنیاز را نیز مدیریت کند. مثال: <code>sudo apt install nginx</code>.</li>
</ul>
<div class="code-container"><span class="code-label">مدل ذهنی</span><div class="code-block no-prompt">apt\n │\n ├── Repository\n ├── Download\n ├── Dependencies\n └── Package Management\n\ndpkg\n │\n └── کار مستقیم با .deb</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>dpkg</code> یک Package Manager سطح پایین برای <code>.deb</code> است؛ <code>apt</code> مدیریت سطح بالاتر و وابستگی‌ها و Repository را انجام می‌دهد.</div></div>

<h3>۵. <code>dnf</code> و <code>rpm</code></h3>
<p>در خانواده Red Hat نیز مشابه همین مدل را داریم.</p>
<ul>
<li><strong>rpm:</strong> برای کار مستقیم با Packageهای RPM: <code>sudo rpm -ivh file.rpm</code></li>
<li><strong>dnf:</strong> برای مدیریت سطح بالاتر: <code>sudo dnf install nginx</code> (Package را از Repository دریافت کرده و Dependencyها را مدیریت می‌کند).</li>
</ul>
<h4>مقایسه طلایی</h4>
<table>
<thead><tr><th>ابزار</th><th>نقش اصلی</th></tr></thead>
<tbody>
<tr><td><code>apt</code></td><td>مدیریت سطح بالاتر Package در Debian</td></tr>
<tr><td><code>dpkg</code></td><td>کار مستقیم با <code>.deb</code></td></tr>
<tr><td><code>dnf</code></td><td>مدیریت سطح بالاتر Package در Red Hat</td></tr>
<tr><td><code>rpm</code></td><td>کار مستقیم با <code>.rpm</code></td></tr>
</tbody>
</table>

<h3>۶. نصب نرم‌افزار از Source Code</h3>
<p>همه‌ی نرم‌افزارها الزاماً به شکل Package آماده ارائه نمی‌شوند. گاهی <strong>Source Code</strong> در اختیار ما قرار می‌گیرد (مثلاً <code>project.tar.gz</code>). فرآیند سنتی ساخت ممکن است چیزی شبیه این باشد:</p>
<div class="code-container"><span class="code-label">مراحل</span><div class="code-block">./configure\nmake\nsudo make install</div></div>
<p>اما همه‌ی پروژه‌ها دقیقاً از این سه دستور استفاده نمی‌کنند. برای LPIC-1، مفهوم اصلی مهم‌تر از حفظ کردن یک روش خاص است:</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">Source Code\n    ↓\nBuild / Compile\n    ↓\nInstall</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> اگر نرم‌افزار را از Source نصب کنید، Package Manager توزیع معمولاً اطلاعات آن نصب را مانند Package نصب‌شده در اختیار ندارد.</div></div>

<h3>۷. Snap و AppImage</h3>
<p>دو روش دیگر برای توزیع نرم‌افزار:</p>
<ul>
<li><strong>Snap:</strong> برنامه را به صورت یک Package قابل توزیع ارائه می‌کند و بسیاری از Dependencyهای موردنیاز را نیز مدیریت می‌کند. مثال: <code>snap install package-name</code>.</li>
<li><strong>AppImage:</strong> بیشتر شبیه یک برنامه‌ی Portable است. معمولاً: <code>chmod +x program.AppImage</code> و سپس <code>./program.AppImage</code> (در بسیاری از موارد نصب سنتی لازم نیست).</li>
</ul>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> این دو را یکی ندانید: <code>Snap</code> → Package/Containerized application format + مدیریت توسط snapd؛ <code>AppImage</code> → فایل اجرایی قابل حمل، معمولاً بدون نصب سنتی.</div></div>

<h2>بخش دوم — Process Management</h2>
<p>حالا فرض کنید نرم‌افزار نصب شده است. وقتی آن را اجرا می‌کنیم چه اتفاقی می‌افتد؟</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">Program\n   ↓\nExecution\n   ↓\nProcess</div></div>

<h3>۸. Program در برابر Process</h3>
<p>این یکی از مهم‌ترین مفاهیم جلسه است.</p>
<ul>
<li><strong>Program:</strong> برنامه‌ی موجود روی دیسک است (مثلاً <code>/usr/bin/something</code>). هنوز فقط یک فایل است.</li>
<li><strong>Process:</strong> وقتی برنامه اجرا می‌شود، سیستم‌عامل یک نمونه‌ی در حال اجرای آن ایجاد می‌کند.</li>
</ul>
<p>پس <strong>Program = برنامه روی دیسک</strong>، <strong>Process = نمونه‌ی در حال اجرای برنامه</strong>. ممکن است یک Program چند Process ایجاد کند.</p>

<h3>۹. Process چه اطلاعاتی دارد؟</h3>
<p>هر Process اطلاعات مختلفی دارد، از جمله: <strong>PID</strong> (Process ID)، User، وضعیت، CPU usage، Memory usage، زمان اجرا و ارتباط با Processهای دیگر. مهم‌ترین مورد <strong>PID</strong> است که شناسه‌ی منحصر‌به‌فرد Process در سیستم‌عامل است.</p>

<h3>۱۰. <code>ps</code> — مشاهده Processها</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ps\nps aux\nps -ef</div></div>
<p><code>ps</code> معمولاً فقط Processهای مرتبط با همان Terminal را نشان می‌دهد. برای مشاهده‌ی اطلاعات گسترده‌تر از <code>ps aux</code> یا <code>ps -ef</code> استفاده می‌کنیم. این دستورات اطلاعاتی مانند User، PID، CPU، Memory، Start time و Command را نمایش می‌دهند.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> اگر سؤال گفت «یک Snapshot از Processهای سیستم بگیر» → ذهن به سمت <code>ps</code> می‌رود.</div></div>

<h3>۱۱. <code>top</code> — مشاهده‌ی زنده</h3>
<p><code>ps</code> یک <strong>Snapshot</strong> از وضعیت Processها می‌دهد، اما <code>top</code> اطلاعات را به صورت زنده و دوره‌ای به‌روزرسانی می‌کند.</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">top</div></div>
<p>مدل ذهنی: <code>ps</code> → 📸 Snapshot، <code>top</code> → 🔄 Live / Updating View.</p>

<h3>۱۲. Signal چیست؟</h3>
<p>در لینوکس Processها می‌توانند <strong>Signal</strong> دریافت کنند. Signal یک پیام/درخواست کنترلی از طرف سیستم یا Process دیگر است. برای ارسال Signal معمولاً از <code>kill</code> استفاده می‌کنیم.</p>

<h3>۱۳. <code>kill</code></h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">kill 2451</div></div>
<p><code>2451</code> PID است. <code>kill</code> به Process مربوط به این PID یک Signal ارسال می‌کند. Signal پیش‌فرض <code>kill</code> معمولاً <code>SIGTERM</code> است که به Process درخواست می‌شود به شکل مرتب خاتمه پیدا کند.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>نکته مهم</strong> اسم <code>kill</code> به این معنی نیست که همیشه Process را فوراً می‌کشد.</div></div>

<h3>۱۴. <code>kill -9</code></h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">kill -9 2451</div></div>
<p>عدد <code>9</code> مربوط به <code>SIGKILL</code> است. <code>SIGKILL</code> قابل Catch، Ignore یا Handle شدن توسط Process نیست و سیستم‌عامل Process را متوقف می‌کند. اما باید معمولاً <strong>آخرین راه‌حل</strong> باشد، چون برنامه فرصت Cleanup عادی خود را ندارد.</p>

<h3>۱۵. <code>pkill</code></h3>
<p>گاهی PID را نمی‌دانیم اما نام Process را می‌دانیم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">pkill firefox</div></div>
<p><code>pkill</code> بر اساس نام یا ویژگی‌های Process، Signal ارسال می‌کند. پس <code>kill</code> → معمولاً بر اساس PID، <code>pkill</code> → بر اساس نام/ویژگی Process.</p>

<h3>۱۶. <code>killall</code></h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">killall firefox</div></div>
<p><code>killall</code> می‌تواند Signal را به Processهای مطابق نام مشخص‌شده ارسال کند.</p>

<h3>۱۷. Job Control</h3>
<p>Job بیشتر مفهومی مربوط به <strong>Shell</strong> است. فرض کنید اجرا کنیم:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sleep 300</div></div>
<p>این دستور در Foreground اجرا می‌شود (Terminal درگیر آن Process است).</p>

<h3>۱۸. <code>Ctrl + Z</code></h3>
<p>اگر هنگام اجرای آن <code>Ctrl + Z</code> بزنید، Shell معمولاً Process را Suspend می‌کند و آن را به عنوان یک Job متوقف‌شده نگه می‌دارد.</p>

<h3>۱۹. <code>jobs</code></h3>
<p>برای مشاهده‌ی Jobهای Shell:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">jobs</div></div>
<p>مثال خروجی: <code>[1]+  Stopped    sleep 300</code>. <code>[1]</code> شماره‌ی Job است که با PID یکی نیست.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> PID → شناسه Process در سیستم‌عامل، Job ID → شناسه Job در Shell.</div></div>

<h3>۲۰. <code>bg</code></h3>
<p>اگر Job متوقف‌شده‌ای داشته باشیم، آن را در <strong>Background</strong> ادامه می‌دهد:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">bg %1</div></div>

<h3>۲۱. <code>fg</code></h3>
<p>برای برگرداندن Job به Foreground:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">fg %1</div></div>

<div class="code-container"><span class="code-label">مدل ذهنی Job Control</span><div class="code-block no-prompt">Foreground\n    │\n    │ Ctrl + Z\n    ↓\nStopped\n    │\n    │ bg\n    ↓\nBackground\n    │\n    │ fg\n    ↓\nForeground</div></div>

<h3>۲۲. Process و Job چه تفاوتی دارند؟</h3>
<table>
<thead><tr><th>Process</th><th>Job</th></tr></thead>
<tbody>
<tr><td>مفهوم سیستم‌عامل</td><td>مفهوم Shell</td></tr>
<tr><td>دارای PID</td><td>دارای Job ID</td></tr>
<tr><td>توسط Kernel مدیریت می‌شود</td><td>توسط Shell مدیریت می‌شود</td></tr>
<tr><td>مستقل از Terminal می‌تواند وجود داشته باشد</td><td>به Job Control همان Shell مربوط است</td></tr>
</tbody>
</table>
<p>یک Job می‌تواند شامل یک یا چند Process باشد.</p>

<h3>۲۳. Foreground و Background</h3>
<ul>
<li><strong>Foreground:</strong> برنامه در ارتباط مستقیم با Shell/Terminal است: <code>command</code></li>
<li><strong>Background:</strong> برنامه در پس‌زمینه اجرا می‌شود: <code>command &</code> (مثلاً <code>sleep 300 &</code>)</li>
</ul>

<h3>۲۴. <code>nohup</code></h3>
<p>برای اجرای Command به شکلی که از Hangup ناشی از خروج Session مستقل‌تر باشد:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">nohup ./backup.sh &</div></div>
<p>به‌طور پیش‌فرض خروجی معمولی <code>nohup</code> معمولاً به فایلی مانند <code>nohup.out</code> هدایت می‌شود.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> هدف اصلی <code>nohup</code>: جلوگیری از تأثیر Hangup شدن Session بر اجرای Command.</div></div>

<h3>۲۵. <code>tmux</code></h3>
<p><code>tmux</code> یک <strong>Terminal Multiplexer</strong> است که می‌توانید داخل یک Session ترمینال، چند Window و Pane داشته باشید و Session را حفظ کنید.</p>
<p>اگر ارتباط SSH قطع شود، Session <code>tmux</code> می‌تواند روی Server باقی بماند. بعداً دوباره وصل می‌شوید: <code>tmux attach</code> و به همان Session برمی‌گردید.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> <code>nohup</code> → اجرای Command را از Hangup مستقل‌تر می‌کند؛ <code>tmux</code> → یک Session ترمینال پایدار ایجاد می‌کند.</div></div>

<h2>مقایسه‌های طلایی LPIC-1</h2>
<h3><code>apt</code> vs <code>dpkg</code></h3>
<p><code>apt</code> → سطح بالاتر، Repository، Dependency Management؛ <code>dpkg</code> → سطح پایین‌تر، کار مستقیم با <code>.deb</code>.</p>
<h3><code>dnf</code> vs <code>rpm</code></h3>
<p><code>dnf</code> → سطح بالاتر، Repository، Dependency Management؛ <code>rpm</code> → سطح پایین‌تر، کار مستقیم با <code>.rpm</code>.</p>
<h3><code>ps</code> vs <code>top</code></h3>
<p><code>ps</code> → Snapshot؛ <code>top</code> → Dynamic / Live.</p>
<h3><code>kill</code> vs <code>pkill</code> vs <code>killall</code></h3>
<p><code>kill</code> → PID؛ <code>pkill</code> → Pattern / Process attributes؛ <code>killall</code> → Process name.</p>
<h3>Process vs Job</h3>
<p>Process → Kernel، PID؛ Job → Shell، Job ID.</p>
<h3><code>nohup</code> vs <code>tmux</code></h3>
<p><code>nohup</code> → جلوگیری از تأثیر Hangup بر Command؛ <code>tmux</code> → حفظ Session ترمینال.</p>

<h2>دام‌های امتحانی ⚠️</h2>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><ul>
<li><strong>دام ۱:</strong> <code>kill</code> همیشه Process را فوراً می‌کشد؟ ❌ خیر؛ <code>kill</code> یک Signal ارسال می‌کند.</li>
<li><strong>دام ۲:</strong> <code>kill -9</code> یعنی Signal شماره ۹ را به صورت عادی قابل کنترل ارسال کن؟ ❌ خیر؛ <code>SIGKILL</code> قابل Catch یا Ignore نیست.</li>
<li><strong>دام ۳:</strong> <code>ps</code> نمایش زنده است؟ ❌ خیر؛ <code>ps</code> یک Snapshot می‌دهد.</li>
<li><strong>دام ۴:</strong> Program و Process یکی هستند؟ ❌ خیر؛ Program روی دیسک است؛ Process نمونه‌ی در حال اجرای آن است.</li>
<li><strong>دام ۵:</strong> Job همان Process است؟ ❌ خیر؛ Job مفهومی در Shell است و می‌تواند شامل یک یا چند Process باشد.</li>
<li><strong>دام ۶:</strong> <code>dpkg</code> همان <code>apt</code> است؟ ❌ خیر؛ هر دو مربوط به Debian هستند، اما سطح و نقش یکسانی ندارند.</li>
<li><strong>دام ۷:</strong> <code>rpm</code> و <code>dnf</code> کاملاً یکسان هستند؟ ❌ خیر؛ <code>rpm</code> ابزار سطح پایین‌تر برای Packageهای RPM است؛ <code>dnf</code> مدیریت سطح بالاتر و Dependency/Repository را انجام می‌دهد.</li>
<li><strong>دام ۸:</strong> <code>tmux</code> فقط برای اجرای Background است؟ ❌ خیر؛ <code>tmux</code> یک Terminal Multiplexer برای حفظ و مدیریت Sessionهای ترمینال است.</li>
</ul></div></div>

<h2>🧠 نقشه ذهنی جلسه</h2>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Software Management\n│\n├── Repository\n│\n├── Package\n│   ├── .deb\n│   │   ├── apt\n│   │   └── dpkg\n│   │\n│   └── .rpm\n│       ├── dnf\n│       └── rpm\n│\n├── Source Code\n│\n├── Snap\n└── AppImage\n\n\nProcess Management\n│\n├── Program\n│     ↓ Execute\n├── Process\n│     └── PID\n│\n├── ps\n├── top\n│\n├── Signals\n│     ├── kill\n│     ├── pkill\n│     └── killall\n│\n├── Job Control\n│     ├── jobs\n│     ├── bg\n│     └── fg\n│\n├── nohup\n└── tmux</div></div>

<h2>⚡ حفظی‌های همان جلسه — مرور ۲ تا ۳ دقیقه‌ای</h2>
<h3>Software</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">.deb → Debian → apt / dpkg\n.rpm → Red Hat → dnf / rpm</div></div>
<h3>Process</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Program → Execute → Process → PID</div></div>
<h3>مشاهده</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">ps  → Snapshot\ntop → Live</div></div>
<h3>Signal</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">kill PID\nkill -9 PID → SIGKILL</div></div>
<h3>نام Process</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">pkill\nkillall</div></div>
<h3>Job</h3>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Ctrl+Z → Stop\njobs   → Show Jobs\nbg     → Background\nfg     → Foreground</div></div>
<h3>Session</h3>
