<li>حجم Archive را کاهش دهی.</li>
<li>از اطلاعات Image تهیه کنی.</li>
<li>دسترسی کاربران را محدود کنی.</li>
<li>یک Link به فایل بسازی.</li>
<li>فایل را بعداً پیدا کنی.</li>
</ul>
<p>تمام این موضوعات هسته‌ی جلسه‌ی پنجم هستند.</p>

<h2>بخش اول — مدیریت فایل و Directory</h2>

<h3>۱. دستورات پایه</h3>
<p>مهم‌ترین دستورات:</p>
<table>
<thead><tr><th>دستور</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>cp</code></td><td>Copy</td></tr>
<tr><td><code>mv</code></td><td>Move / Rename</td></tr>
<tr><td><code>rm</code></td><td>حذف</td></tr>
<tr><td><code>mkdir</code></td><td>ساخت Directory</td></tr>
<tr><td><code>rmdir</code></td><td>حذف Directory خالی</td></tr>
</tbody>
</table>

<h3>۲. <code>cp</code></h3>
<p>برای Copy کردن:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">cp file1.txt file2.txt</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">file1.txt\n    ↓\nCopy\n    ↓\nfile2.txt</div></div>
<p>برای Copy کردن Directory به همراه محتویات:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">cp -r dir1 dir2</div></div>
<p><code>-r</code> یعنی <strong>Recursive</strong>؛ یعنی وارد زیرDirectoryها نیز شود.</p>

<h3>۳. <code>mv</code></h3>
<p><code>mv</code> دو کاربرد اصلی دارد.</p>
<h4>جابه‌جایی</h4>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">mv file.txt /home/user/</div></div>
<h4>تغییر نام</h4>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">mv old.txt new.txt</div></div>
<p>در لینوکس Rename کردن در واقع یکی از کاربردهای <code>mv</code> است.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>Exam Tip ⭐</strong> <code>cp</code> → Copy؛ <code>mv</code> → Move / Rename.</div></div>

<h3>۴. <code>rm</code></h3>
<p>حذف فایل:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">rm file.txt</div></div>
<p>حذف Directory و محتویات آن:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">rm -r test/</div></div>
<p>گزینه‌ی <code>-f</code> باعث می‌شود حذف بدون درخواست تأیید انجام شود:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">rm -rf test/</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>⚠️ هشدار</strong> <code>rm</code> معمولاً فایل را به Recycle Bin منتقل نمی‌کند. بنابراین <code>rm file.txt</code> را نباید با «انتقال به سطل زباله» اشتباه بگیری.</div></div>

<h2>بخش دوم — Archive و Compression</h2>

<h3>۵. Archive چیست؟</h3>
<p>فرض کن این فایل‌ها را داریم:</p>
<div class="code-container"><span class="code-label">فایل‌ها</span><div class="code-block no-prompt">file1.txt\nfile2.txt\nimage.jpg\nreport.pdf</div></div>
<p>می‌توانیم آن‌ها را در یک فایل واحد قرار دهیم:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">┌─────────────┐\n│ file1.txt   │\n│ file2.txt   │\n│ image.jpg   │\n│ report.pdf  │\n└─────────────┘\n       ↓\n   backup.tar</div></div>
<p>این کار <strong>Archive</strong> نام دارد.</p>
<blockquote>Archive یعنی چند فایل و Directory را در یک مجموعه/فایل واحد قرار دهیم.</blockquote>

<h3>۶. Compression چیست؟</h3>
<p>Compression یعنی کاهش حجم داده. مثلاً:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">100 MB\n  ↓\nCompression\n  ↓\n70 MB</div></div>
<blockquote>هدف: اشغال فضای کمتر یا انتقال سریع‌تر داده.</blockquote>

<h3>۷. Archive با Compression یکی نیست</h3>
<p>این نکته بسیار مهم است.</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">tar\n↓\nArchive</div></div>
<p>در حالت معمول <code>tar</code> خودش Compression انجام نمی‌دهد. در مقابل:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">gzip\n↓\nCompression</div></div>
<p>پس:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">tar ≠ gzip</div></div>

<h3>۸. <code>tar</code></h3>
<p>ساخت یک Archive:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">tar -cf backup.tar mydir/</div></div>
<p>معنی گزینه‌ها:</p>
<div class="code-container"><span class="code-label">گزینه‌ها</span><div class="code-block no-prompt">-c → create\n-f → file</div></div>
<p>استخراج:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">tar -xf backup.tar</div></div>
<div class="code-container"><span class="code-label">گزینه‌ها</span><div class="code-block no-prompt">-x → extract\n-f → file</div></div>

<h3>۹. <code>gzip</code></h3>
<p>برای فشرده‌سازی یک فایل:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">gzip file.txt</div></div>
<p>معمولاً نتیجه:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block">file.txt.gz</div></div>
<p>برای باز کردن Compression:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">gunzip file.txt.gz</div></div>

<h3>۱۰. <code>tar</code> + <code>gzip</code></h3>
<p>در دنیای لینوکس بسیار رایج است:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">tar -czf backup.tar.gz mydir/</div></div>
<p>اینجا:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">tar\n ↓\nArchive\n\ngzip\n ↓\nCompression</div></div>
<p>و در یک دستور انجام می‌شود. گزینه‌ی <code>-z</code> یعنی استفاده از gzip.</p>
<h4>استخراج</h4>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">tar -xzf backup.tar.gz</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">گزینه‌ها</span><div class="code-block no-prompt">-x → Extract\n-z → gzip\n-f → File</div></div>

<h3>۱۱. <code>tar.gz</code> یعنی چه؟</h3>
<p>وقتی می‌بینی:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block">backup.tar.gz</div></div>
<p>ذهنمان باید این را ببیند:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Files / Directories\n       ↓\n      tar\n       ↓\n    Archive\n       ↓\n     gzip\n       ↓\nCompressed Archive</div></div>
<p>بنابراین:</p>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">.tar\n→ Archive\n\n.gz\n→ gzip Compression</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>Exam Trap ⚠️</strong> <code>tar</code> به‌تنهایی لزوماً فایل را کوچک نمی‌کند. کار اصلی آن <strong>Archive کردن</strong> است.</div></div>

<h2>بخش سوم — Backup و <code>dd</code></h2>

<h3>۱۲. Backup چیست؟</h3>
<p>Backup یعنی:</p>
<blockquote>یک Copy قابل استفاده از داده برای بازیابی در صورت خرابی یا از دست رفتن داده.</blockquote>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Original Data\n      │\n      ├────→ Backup 1\n      └────→ Backup 2</div></div>
<p>هدف Backup: <strong>Recovery</strong> است.</p>

<h3>۱۳. <code>dd</code></h3>
<p><code>dd</code> یک ابزار بسیار مهم برای Copy کردن داده در سطح پایین است. مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">dd if=/dev/sda of=disk.img</div></div>
<p>یعنی داده را از:</p>
<div class="code-container"><span class="code-label">ورودی</span><div class="code-block">if=/dev/sda</div></div>
<p>بخوان و در:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block">of=disk.img</div></div>
<p>بنویس.</p>
<h4><code>if</code> و <code>of</code></h4>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">if\n↓\nInput File</div></div>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">of\n↓\nOutput File</div></div>
<p>هرچند اسمشان File است، اما می‌توانند Device نیز باشند. در لینوکس بسیاری از Deviceها از طریق Fileهای موجود در <code>/dev</code> در اختیار ابزارها قرار می‌گیرند.</p>

<h3>۱۴. Disk Image</h3>
<p>دستور:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">dd if=/dev/sda of=disk.img</div></div>
<p>می‌تواند یک Image از Disk ایجاد کند. برعکس:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">dd if=disk.img of=/dev/sdb</div></div>
<p>Image را روی Device مقصد می‌نویسد.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>⚠️ هشدار بسیار مهم</strong> <code>dd</code> ابزار قدرتمندی است و اشتباه در <code>of=</code> می‌تواند باعث <strong>Overwrite شدن داده‌ها</strong> شود. مثلاً:</div></div>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">dd if=image.img of=/dev/sdb</div></div>
<p>مقصد <code>/dev/sdb</code> است؛ بنابراین باید قبل از اجرای آن Device را با دقت بررسی کرد.</p>

<h3>۱۵. آیا <code>dd</code> همان Backup است؟</h3>
<p>نه دقیقاً. <code>dd</code> یک ابزار <strong>Low-Level Copy</strong> است. می‌توان از آن برای ایجاد Image یا بعضی روش‌های Backup استفاده کرد، اما:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">dd ≠ Backup System</div></div>
<p>مثلاً Backup یک Directory می‌تواند با ابزارهایی مثل <code>tar</code> یا ابزارهای تخصصی Backup انجام شود.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>Exam Tip ⭐</strong> اگر سؤال درباره‌ی Copy کردن Blockها یا ساخت Image از Disk/Partition باشد، <code>dd</code> یکی از ابزارهای مهم است.</div></div>

<h2>بخش چهارم — Links</h2>

<h3>۱۶. Link چیست؟</h3>
<p>گاهی نمی‌خواهیم یک فایل را دوباره Copy کنیم. می‌خواهیم یک نام/Reference دیگر برای همان داده داشته باشیم. اینجا Linkها وارد می‌شوند. دو نوع مهم:</p>
<div class="code-container"><span class="code-label">انواع</span><div class="code-block no-prompt">Hard Link\nSymbolic Link</div></div>

<h3>۱۷. Symbolic Link</h3>
<p>Symbolic Link یا <strong>Symlink</strong> مثل یک Reference به یک Path است.</p>
<p>ساخت:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ln -s report.txt shortcut.txt</div></div>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">shortcut.txt\n      │\n      ↓\n  report.txt</div></div>
<p>اگر <code>report.txt</code> حذف شود:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">shortcut.txt\n      ↓\n   ❌ Broken</div></div>
<p>چون Symlink به Path اشاره می‌کند.</p>

<h3>۱۸. Hard Link</h3>
<p>Hard Link متفاوت است. مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ln report.txt hardlink.txt</div></div>
<p>حالا:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">report.txt ──┐\n             ↓\n          File Data\n             ↑\nhardlink.txt ┘</div></div>
<p>هر دو نام به همان File/Filesystem Object اشاره می‌کنند. بنابراین اگر <code>report.txt</code> را حذف کنیم، <code>hardlink.txt</code> هنوز می‌تواند به داده دسترسی داشته باشد، تا زمانی که حداقل یک Link به آن داده باقی مانده باشد.</p>

<h3>۱۹. چرا Hard Link بعد از حذف فایل اصلی کار می‌کند؟</h3>
<p>در واقع چیزی به نام «فایل اصلی» از نظر Filesystem به آن معنای ساده وجود ندارد. هر دو نام، <strong>Directory Entries</strong> هستند که به یک inode اشاره می‌کنند. مدل دقیق‌تر:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">report.txt ──┐\n             ↓\n          inode\n             ↓\n           Data\n             ↑\nhardlink.txt ┘</div></div>
<p>وقتی یکی از نام‌ها حذف شود، inode و داده تا زمانی که Link دیگری وجود داشته باشد باقی می‌مانند. برای LPIC-1 همین مفهوم کافی است.</p>

<h3>۲۰. محدودیت‌های Hard Link</h3>
<p>به طور معمول Hard Link:</p>
<ul>
<li>نمی‌تواند به Directory معمولی ساخته شود.</li>
<li>نمی‌تواند بین Filesystemهای مختلف باشد.</li>
</ul>
<p>در مقابل Symbolic Link:</p>
<ul>
<li>می‌تواند به Directory اشاره کند.</li>
<li>می‌تواند به مسیر روی Filesystem دیگری اشاره کند.</li>
<li>اگر Target حذف یا جابه‌جا شود، ممکن است Broken شود.</li>
</ul>

<h3>جدول طلایی Linkها</h3>
<table>
<thead><tr><th>ویژگی</th><th>Hard Link</th><th>Symbolic Link</th></tr></thead>
<tbody>
<tr><td>ساخت</td><td><code>ln file link</code></td><td><code>ln -s file link</code></td></tr>
<tr><td>اشاره به</td><td>همان inode</td><td>Path</td></tr>
<tr><td>حذف نام اصلی</td><td>Link دیگر باقی می‌ماند</td><td>ممکن است Broken شود</td></tr>
<tr><td>بین Filesystemها</td><td>❌</td><td>✅</td></tr>
<tr><td>اشاره به Directory</td><td>معمولاً ❌</td><td>✅</td></tr>
<tr><td>inode مشترک با Target</td><td>✅</td><td>❌</td></tr>
</tbody>
</table>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>Exam Trap ⚠️</strong> نگو «Hard Link یک Copy از فایل است» — ❌ اشتباه. Hard Link یک نام/Directory Entry دیگر برای همان File است و داده را Duplicate نمی‌کند.</div></div>

<h2>بخش پنجم — Permissions</h2>

<h3>۲۱. چرا Permission مهم است؟</h3>
<p>در لینوکس هر کاربر نباید بتواند هر فایل و Directory را تغییر دهد. مثلاً:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block">/etc/passwd</div></div>
<p>نباید توسط هر کاربری به شکل دلخواه تغییر کند. Linux برای کنترل دسترسی از <strong>Permissions</strong> استفاده می‌کند.</p>

<h3>۲۲. سه دسته اصلی Permission</h3>
<p>برای یک File معمولاً سه دسته‌ی اصلی داریم:</p>
<div class="code-container"><span class="code-label">دسته‌ها</span><div class="code-block no-prompt">Owner\nGroup\nOthers</div></div>
<ul>
<li><strong>Owner:</strong> مالک فایل.</li>
<li><strong>Group:</strong> کاربرانی که عضو Group مربوط به فایل هستند.</li>
<li><strong>Others:</strong> سایر کاربران.</li>
</ul>

<h3>۲۳. سه Permission اصلی</h3>
<p>سه Permission پایه:</p>
<div class="code-container"><span class="code-label">دسته‌ها</span><div class="code-block no-prompt">r\nw\nx</div></div>
<ul>
<li><strong><code>r</code> — Read:</strong> اجازه‌ی خواندن.</li>
<li><strong><code>w</code> — Write:</strong> اجازه‌ی تغییر محتوا.</li>
<li><strong><code>x</code> — Execute:</strong> اجازه‌ی اجرا.</li>
</ul>

<h3>۲۴. مشاهده Permission</h3>
<p>با:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ls -l</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block">-rwxr-xr--</div></div>
<p>آن را به بخش‌های زیر تقسیم می‌کنیم:</p>
<div class="code-container"><span class="code-label">تقسیم‌بندی</span><div class="code-block no-prompt">-\nrwx\nr-x\nr--</div></div>

<h3>۲۵. اولین کاراکتر چیست؟</h3>
<p>در:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">-rwxr-xr--\n^</div></div>
<p>اولین کاراکتر نوع File را نشان می‌دهد. مثلاً <code>-</code> یعنی Regular File، و <code>d</code> یعنی Directory. پس:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block">drwxr-xr-x</div></div>
<p>یک Directory است.</p>

<h3>۲۶. Owner / Group / Others</h3>
<p>در:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block">-rwxr-xr--</div></div>
<p>داریم:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">- | rwx | r-x | r--\n    │      │      │\n Owner    Group  Others</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Owner  → rwx\nGroup  → r-x\nOthers → r--</div></div>

<h3>۲۷. Permission عددی</h3>
<p>سه Permission پایه مقادیر زیر را دارند:</p>
<div class="code-container"><span class="code-label">مقادیر</span><div class="code-block no-prompt">r = 4\nw = 2\nx = 1</div></div>
<p>پس:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">rwx\n4+2+1\n= 7</div></div>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">rw-\n4+2\n= 6</div></div>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">r-x\n4+1\n= 5</div></div>

<h3>۲۸. مثال 755</h3>
<div class="code-container"><span class="code-label">عدد</span><div class="code-block">755</div></div>
<p>به سه بخش تقسیم می‌شود:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">7 | 5 | 5\n│   │   │\nU   G   O</div></div>
<p>پس:</p>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Owner  → 7 → rwx\nGroup  → 5 → r-x\nOthers → 5 → r-x</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Owner  → Read + Write + Execute\nGroup  → Read + Execute\nOthers → Read + Execute</div></div>

<h3>۲۹. مثال 644</h3>
<div class="code-container"><span class="code-label">عدد</span><div class="code-block">644</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Owner  → 6 → rw-\nGroup  → 4 → r--\nOthers → 4 → r--</div></div>
<p>در نتیجه:</p>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Owner  → Read + Write\nGroup  → Read\nOthers → Read</div></div>

<h3>۳۰. Permissionهای پرکاربرد</h3>
<table>
<thead><tr><th>Permission</th><th>معنی معمول</th></tr></thead>
<tbody>
<tr><td><code>777</code></td><td>همه <code>rwx</code></td></tr>
<tr><td><code>755</code></td><td>Owner کامل، بقیه <code>r-x</code></td></tr>
<tr><td><code>644</code></td><td>Owner <code>rw-</code>، بقیه <code>r--</code></td></tr>
<tr><td><code>700</code></td><td>فقط Owner <code>rwx</code></td></tr>
</tbody>
</table>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>نکته امنیتی ⚠️</strong> <code>777</code> را صرفاً به این دلیل که «کار می‌کند» استفاده نکن. دادن Write به همه کاربران می‌تواند یک ریسک امنیتی جدی باشد.</div></div>

<h3>۳۱. <code>chmod</code></h3>
<p>برای تغییر Permission:</p>
<h4>Numeric</h4>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">chmod 755 script.sh</div></div>
<h4>Symbolic</h4>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">chmod u+x script.sh</div></div>
<p>معنی:</p>
<div class="code-container"><span class="code-label">حروف</span><div class="code-block no-prompt">u → User / Owner\ng → Group\no → Others\na → All</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">chmod g-w file.txt</div></div>
<p>یعنی Write را از Group حذف کن. یا:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">chmod o+r file.txt</div></div>
<p>یعنی Read را برای Others اضافه کن.</p>

<h3>۳۲. Permission روی Directory</h3>
<p>این قسمت بسیار مهم است. Permission روی Directory دقیقاً همان معنایی را که روی File دارد، ندارد. برای Directory:</p>
<ul>
<li><strong><code>r</code>:</strong> امکان مشاهده‌ی نام Entryهای داخل Directory.</li>
<li><strong><code>w</code>:</strong> امکان ایجاد، حذف و Rename کردن Entryها، البته در کنار Permissionهای لازم دیگر.</li>
<li><strong><code>x</code>:</strong> امکان <strong>Traverse</strong> کردن Directory؛ یعنی عبور/دسترسی به آن و دسترسی به Entryهای داخل آن در صورت داشتن مجوزهای لازم.</li>
</ul>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Directory\n│\n├── r → دیدن نام‌ها\n├── w → ایجاد/حذف/تغییر نام\n└── x → عبور و دسترسی</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>Exam Trap ⚠️</strong> <code>x</code> روی Directory را با «اجرای Directory» اشتباه نکن. Directory اجرا نمی‌شود. <code>x</code> روی Directory یعنی اجازه‌ی Traverse/Search.</div></div>

<h2>بخش ششم — Ownership</h2>

<h3>۳۳. Owner و Group</h3>
<p>هر File/Directory یک:</p>
<div class="code-container"><span class="code-label">مفهوم</span><div class="code-block">Owner</div></div>
<p>و یک:</p>
<div class="code-container"><span class="code-label">مفهوم</span><div class="code-block">Group</div></div>
<p>دارد. با:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ls -l</div></div>
<p>می‌توان آن‌ها را مشاهده کرد. مثلاً:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block">-rw-r--r-- 1 ali developers 1200 report.txt</div></div>
<p>در اینجا:</p>
<div class="code-container"><span class="code-label">خلاصه</span><div class="code-block no-prompt">Owner → ali\nGroup → developers</div></div>

<h3>۳۴. <code>chown</code></h3>
<p>برای تغییر Owner:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo chown sara report.txt</div></div>
<p>برای تغییر Owner و Group:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo chown sara:developers report.txt</div></div>

<h3>۳۵. <code>chgrp</code></h3>
<p>برای تغییر Group:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo chgrp developers report.txt</div></div>
<p>مقایسه:</p>
<div class="code-container"><span class="code-label">chown</span><div class="code-block no-prompt">chown\n→ Owner\n→ می‌تواند Group را نیز تنظیم کند</div></div>
<div class="code-container"><span class="code-label">chgrp</span><div class="code-block no-prompt">chgrp\n→ Group</div></div>

<h2>بخش هفتم — ACL</h2>

<h3>۳۶. مشکل Permission معمولی</h3>
<p>Permission سنتی سه دسته دارد:</p>
<div class="code-container"><span class="code-label">دسته‌ها</span><div class="code-block no-prompt">Owner\nGroup\nOthers</div></div>
<p>اما فرض کن:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block">report.txt</div></div>
<p>این Permission را دارد:</p>
<div class="code-container"><span class="code-label">Permission</span><div class="code-block">-rw-r-----</div></div>
<p>و می‌خواهی:</p>
<div class="code-container"><span class="code-label">هدف</span><div class="code-block no-prompt">Ali → دسترسی نداشته باشد\nSara → Read داشته باشد</div></div>
<p>بدون اینکه Group اصلی را تغییر دهی. Permission معمولی برای چنین سناریوهایی محدود است. اینجا <strong>ACL</strong> به کار می‌آید.</p>

<h3>۳۷. ACL چیست؟</h3>
<p>ACL مخفف <strong>Access Control List</strong> است. ACL امکان تعریف Ruleهای دقیق‌تر برای کاربران و Groupهای مشخص را فراهم می‌کند. مثلاً:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">File\n│\n├── Owner\n├── Group\n├── Others\n│\n└── ACL\n      ├── Sara → Read\n      └── Ali  → Read/Write</div></div>

<h3>۳۸. <code>setfacl</code></h3>
<p>برای تنظیم ACL:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">setfacl -m u:sara:r report.txt</div></div>
<p>یعنی برای کاربر <code>sara</code> مجوز Read ایجاد/تنظیم کن.</p>
<p>مشاهده:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">getfacl report.txt</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>Exam Tip ⭐</strong> <code>chmod</code> → Permissionهای پایه؛ <code>setfacl</code> → ACL؛ <code>getfacl</code> → مشاهده ACL.</div></div>

<h2>بخش هشتم — Search</h2>

<h3>۳۹. <code>find</code></h3>
<p><code>find</code> برای جستجوی File و Directory در یک مسیر و بر اساس معیارهای مختلف استفاده می‌شود. مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">find /home -name "*.txt"</div></div>
<p>یعنی: در <code>/home</code> فایل‌هایی با الگوی <code>*.txt</code> پیدا کن.</p>
<p>می‌توان معیارهای دیگری نیز داشت، مثل:</p>
<ul>
<li>Name</li>
<li>Type</li>
<li>Size</li>
<li>User</li>
<li>Permission</li>
<li>Time</li>
</ul>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">find /var -type f -name "*.log"</div></div>

<h3>۴۰. <code>locate</code></h3>
<p><code>locate</code> روش متفاوتی دارد. به جای اینکه هر بار کل مسیر را از ابتدا جستجو کند، معمولاً از یک <strong>Database از مسیر فایل‌ها</strong> استفاده می‌کند. مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">locate report.txt</div></div>
<p>به همین دلیل می‌تواند بسیار سریع باشد. اما:</p>
<blockquote>اگر Database به‌روز نباشد، ممکن است نتیجه‌ی جدیدترین وضعیت Filesystem را نشان ندهد.</blockquote>
<p>برای به‌روزرسانی Database در سیستم‌هایی که <code>updatedb</code> در دسترس است:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo updatedb</div></div>

<h3>۴۱. <code>find</code> vs <code>locate</code></h3>
<div class="code-container"><span class="code-label">find</span><div class="code-block no-prompt">find\n↓\nجستجوی Filesystem\n↓\nانعطاف‌پذیر</div></div>
<div class="code-container"><span class="code-label">locate</span><div class="code-block no-prompt">locate\n↓\nجستجو در Database\n↓\nسریع</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>Exam Trap ⚠️</strong> <code>locate</code> الزاماً «بهتر» از <code>find</code> نیست. انتخاب آن‌ها به نیاز بستگی دارد: دقت و معیارهای متنوع → <code>find</code>؛ پیدا کردن سریع Path → <code>locate</code>.</div></div>

<h2>یک سناریوی واقعی 🎯</h2>
<p>فرض کن یک پروژه داری:</p>
<div class="code-container"><span class="code-label">ساختار</span><div class="code-block no-prompt">Project/\n├── report.txt\n├── data.txt\n└── images/</div></div>
<h3>مرحله ۱ — Archive</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">tar -cf project.tar Project/</div></div>
<h3>مرحله ۲ — Compression</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">gzip project.tar</div></div>
<p>نتیجه:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block">project.tar.gz</div></div>
<p>یا همه را یکجا:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">tar -czf project.tar.gz Project/</div></div>
<h3>مرحله ۳ — Permission</h3>
<p>فرض کن <code>report.txt</code> باید فقط توسط Owner قابل ویرایش باشد:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">chmod 644 report.txt</div></div>
<h3>مرحله ۴ — تغییر Owner</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo chown ali report.txt</div></div>
<h3>مرحله ۵ — دسترسی خاص برای یک کاربر</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">setfacl -m u:sara:r report.txt</div></div>
<h3>مرحله ۶ — پیدا کردن فایل</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">find /home -name report.txt</div></div>

<blockquote><strong>🎯 هدف جلسه:</strong> یاد بگیریم وقتی یک سیستم Linux روشن می‌شود چه مراحلی را طی می‌کند، نقش BIOS/UEFI، GRUB، Kernel و <code>initramfs</code> چیست، <code>systemd</code> چگونه سیستم را مدیریت می‌کند، Targetها چه هستند، در شرایط خرابی چگونه وارد حالت Recovery شویم و در نهایت تفاوت Virtual Machine، Container، KVM و Proxmox را به‌صورت مفهومی درک کنیم.</blockquote>

<h2>قبل از شروع...</h2>
<p>فرض کنید یک Server خاموش است. دکمه Power را می‌زنید. چه اتفاقی می‌افتد؟</p>
<div class="code-container"><span class="code-label">زنجیره Boot</span><div class="code-block no-prompt">Power ON\n   ↓\nBIOS / UEFI\n   ↓\nBootloader\n   ↓\nGRUB\n   ↓\nKernel + initramfs\n   ↓\nsystemd\n   ↓\nServices\n   ↓\nLogin</div></div>
<p>این دقیقاً موضوع اصلی جلسه‌ی ششم است. در ادامه ابتدا این مسیر را مرحله‌به‌مرحله می‌شناسیم، سپس یاد می‌گیریم اگر سیستم درست Boot نشد چه کنیم.</p>

<h2>بخش اول — Boot Process</h2>

<h3>۱. Boot چیست؟</h3>
<p>Boot یعنی <strong>فرآیند راه‌اندازی سیستم از لحظه روشن شدن تا رسیدن به یک سیستم عامل قابل استفاده</strong>.</p>
<div class="code-container"><span class="code-label">مراحل</span><div class="code-block no-prompt">خاموش\n  ↓\nروشن شدن Hardware\n  ↓\nپیدا کردن Bootloader\n  ↓\nاجرای Kernel\n  ↓\nراه‌اندازی User Space\n  ↓\nاجرای Services\n  ↓\nLogin</div></div>

<h3>۲. Boot Process در Linux</h3>
<div class="code-container"><span class="code-label">زنجیره اصلی</span><div class="code-block no-prompt">┌───────────────┐\n│ Power On      │\n└───────┬───────┘\n        ↓\n┌───────────────┐\n│ BIOS / UEFI   │\n└───────┬───────┘\n        ↓\n┌───────────────┐\n│ GRUB          │\n└───────┬───────┘\n        ↓\n┌───────────────┐\n│ Kernel        │\n└───────┬───────┘\n        ↓\n┌───────────────┐\n│ initramfs     │\n└───────┬───────┘\n        ↓\n┌───────────────┐\n│ systemd       │\n└───────┬───────┘\n        ↓\n┌───────────────┐\n│ Services      │\n└───────┬───────┘\n        ↓\n      Login</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> اگر سؤال از ترتیب کلی Boot در Linux پرسید: <code>BIOS/UEFI → Bootloader/GRUB → Kernel → initramfs → systemd → Services</code>.</div></div>

<h2>بخش دوم — BIOS و UEFI</h2>

<h3>۳. BIOS چیست؟</h3>
<p><strong>BIOS</strong> مخفف <strong>Basic Input/Output System</strong> است. Firmwareای است که در مراحل اولیه‌ی روشن شدن سیستم اجرا می‌شود و Hardware اولیه را آماده می‌کند و مسیر Boot را مشخص می‌کند.</p>

<h3>۴. UEFI چیست؟</h3>
<p><strong>UEFI</strong> نسل جدیدتر Firmware برای راه‌اندازی سیستم است. در سیستم‌های جدید معمولاً UEFI را می‌بینیم. UEFI معمولاً با <strong>GPT</strong> و <strong>EFI System Partition (ESP)</strong> در سیستم‌های مدرن استفاده می‌شود.</p>

<h3>۵. BIOS vs UEFI</h3>
<table>
<thead><tr><th>ویژگی</th><th>BIOS</th><th>UEFI</th></tr></thead>
<tbody>
<tr><td>نسل</td><td>قدیمی‌تر</td><td>جدیدتر</td></tr>
<tr><td>Firmware</td><td>✅</td><td>✅</td></tr>
<tr><td>Boot Mode</td><td>Legacy</td><td>UEFI</td></tr>
<tr><td>GPT</td><td>محدودیت‌های Legacy BIOS</td><td>پشتیبانی مناسب</td></tr>
<tr><td>EFI System Partition</td><td>❌</td><td>✅</td></tr>
<tr><td>Secure Boot</td><td>❌</td><td>معمولاً پشتیبانی می‌شود</td></tr>
</tbody>
</table>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> BIOS و UEFI را با GRUB یکی ندانید. <code>BIOS / UEFI</code> → Firmware، اما <code>GRUB</code> → Bootloader.</div></div>

<h3>۶. EFI System Partition</h3>
<p>در سیستم UEFI معمولاً یک Partition مخصوص وجود دارد: <strong>EFI System Partition (ESP)</strong>. این Partition محل نگهداری فایل‌های مربوط به Bootloaderهای UEFI است. معمولاً Filesystem آن <code>FAT32</code> است.</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">UEFI\n ↓\nEFI System Partition\n ↓\nBootloader\n ↓\nGRUB</div></div>

<h2>بخش سوم — GRUB</h2>

<h3>۷. GRUB چیست؟</h3>
<p><strong>GRUB</strong> مخفف <strong>GRand Unified Bootloader</strong> است. GRUB یک <strong>Bootloader</strong> است. وظیفه‌ی اصلی آن این است که Kernel مناسب را پیدا و بارگذاری کند و پارامترهای لازم را به Kernel منتقل کند.</p>

<h3>۸. GRUB کجای Boot قرار دارد؟</h3>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block no-prompt">BIOS / UEFI\n      ↓\n     GRUB\n      ↓\n    Kernel</div></div>
<p>پس <code>BIOS/UEFI ≠ GRUB</code>. BIOS/UEFI Firmware است، GRUB Bootloader است.</p>

<h3>۹. GRUB Menu</h3>
<p>در سیستم‌هایی که چند Kernel یا چند Operating System دارند، ممکن است GRUB چنین منویی نشان دهد:</p>
<div class="code-container"><span class="code-label">نمونه</span><div class="code-block no-prompt">GNU GRUB\n\nLinux\nAdvanced options for Linux\nMemory test</div></div>

<h3>۱۰. فایل‌های مهم GRUB</h3>
<p>یکی از فایل‌های مهم تنظیمات <code>/etc/default/grub</code> است. Configuration نهایی GRUB معمولاً در <code>/boot/grub/grub.cfg</code> یا مسیر مخصوص UEFI قرار دارد. در بسیاری از Debian-basedها:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo update-grub</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> به‌صورت مفهومی: <code>/etc/default/grub → GRUB Configuration Generation → grub.cfg</code>.</div></div>

<h3>۱۱. Kernel Parameters</h3>
<p>GRUB می‌تواند هنگام Boot پارامترهایی را به Kernel بدهد. مثلاً <code>root=/dev/sda2</code> یعنی Kernel بداند Root Filesystem از کجا باید در دسترس قرار بگیرد. این موضوع بعدها در Recovery بسیار مهم می‌شود.</p>

<h2>بخش چهارم — Linux Kernel</h2>

<h3>۱۲. Kernel چیست؟</h3>
<p>Kernel هسته‌ی اصلی Linux است. Kernel بین <strong>Hardware</strong> و <strong>Software</strong> قرار می‌گیرد.</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Applications\n     ↓\nUser Space\n     ↓\nKernel\n     ↓\nHardware</div></div>
<p>Kernel مسئول مدیریت منابع مهم سیستم است: CPU، Memory، Devices، Processes، Networking، Filesystems.</p>

<h3>۱۳. Kernel در Boot چه می‌کند؟</h3>
<p>بعد از اینکه Bootloader Kernel را Load کرد، Kernel شروع به راه‌اندازی محیط پایه سیستم می‌کند. اما Kernel به‌تنهایی تمام سیستم User Space را مدیریت نمی‌کند. در ادامه <strong>initramfs</strong> اهمیت پیدا می‌کند.</p>

<h2>بخش پنجم — initramfs</h2>

<h3>۱۴. initramfs چیست؟</h3>
<p><code>initramfs</code> مخفف <strong>Initial RAM Filesystem</strong> است. یک Filesystem کوچک است که در RAM قرار می‌گیرد و در مراحل اولیه‌ی Boot در اختیار Kernel قرار می‌گیرد. هدف اصلی: <strong>فراهم کردن ابزارها و Driverهای لازم برای ادامه‌ی Boot و پیدا کردن/آماده کردن Root Filesystem</strong>.</p>

<h3>۱۵. چرا initramfs لازم است؟</h3>
<p>Kernel ممکن است برای دسترسی به Root Filesystem به Driver، LVM، RAID، Encryption یا Filesystem tools نیاز داشته باشد. بعضی از این موارد باید <strong>قبل از Mount شدن Root Filesystem</strong> در دسترس باشند.</p>
<div class="code-container"><span class="code-label">جریان</span><div class="code-block no-prompt">Kernel\n ↓\ninitramfs\n ↓\nPrepare required environment\n ↓\nFind / prepare Root Filesystem\n ↓\nContinue Boot</div></div>

<h3>۱۶. initramfs در RAM است</h3>
<p><code>initramfs</code> → Filesystem اولیه، در RAM، برای مراحل ابتدایی Boot.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>initramfs</code> را با Root Filesystem اصلی اشتباه نکنید. <code>initramfs</code> محیط اولیه و موقت Boot است، در حالی که Root Filesystem محیط اصلی سیستم است.</div></div>

<h2>بخش ششم — systemd</h2>

<h3>۱۷. systemd چیست؟</h3>
<p>بعد از مراحل ابتدایی Boot، سیستم باید وارد User Space شود و سرویس‌ها را راه‌اندازی کند. در بسیاری از Linuxهای امروزی این وظیفه بر عهده‌ی <strong>systemd</strong> است. systemd سیستم را مدیریت می‌کند و مسئولیت‌هایی مانند مدیریت Services، مدیریت Targets، مدیریت برخی منابع و واحدها و هماهنگی فرآیند Startup را بر عهده دارد.</p>

<h3>۱۸. systemd و PID 1</h3>
<p>در سیستم‌هایی که systemd به عنوان init system استفاده می‌شود، معمولاً <code>systemd → PID 1</code> است. یعنی اولین Process اصلی User Space با PID <code>1</code> است.</p>
<div class="code-container"><span class="code-label">بررسی</span><div class="code-block">ps -p 1 -o comm=</div></div>
<p>خروجی ممکن است <code>systemd</code> باشد.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> یکی از مهم‌ترین نکات: <code>systemd → PID 1</code>.</div></div>

<h3>۱۹. systemctl</h3>
<p>ابزار اصلی مدیریت systemd <code>systemctl</code> است.</p>
<div class="code-container"><span class="code-label">دستورات</span><div class="code-block">systemctl status ssh\nsudo systemctl start ssh\nsudo systemctl stop ssh\nsudo systemctl restart ssh</div></div>

<h3>۲۰. Start vs Enable</h3>
<p>این تفاوت بسیار مهم است.</p>
<ul>
<li><strong>Start:</strong> <code>sudo systemctl start nginx</code> → همین الان Service را اجرا کن.</li>
<li><strong>Enable:</strong> <code>sudo systemctl enable nginx</code> → Service را طوری تنظیم کن که در Bootهای بعدی به‌صورت خودکار راه‌اندازی شود.</li>
</ul>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> <code>enable</code> لزوماً به معنی «همین الان اجرا کردن Service» نیست.</div></div>

<h3>۲۱. enable --now</h3>
<p>اگر هم بخواهید «الان اجرا شود» و «در Bootهای آینده هم اجرا شود»:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo systemctl enable --now nginx</div></div>

<h2>بخش هفتم — systemd Targets</h2>

<h3>۲۲. Target چیست؟</h3>
<p>در systemd به جای مفهوم قدیمی Runlevelها، از <strong>Target</strong> استفاده می‌شود. Target یک حالت/گروه منطقی از واحدها و سرویس‌هایی است که سیستم می‌خواهد به آن وضعیت برسد.</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Target\n   ↓\nUnits / Services\n   ↓\nSystem State</div></div>

<h3>۲۳. Targetهای مهم</h3>
<ul>
<li><strong>multi-user.target:</strong> محیط چندکاربره بدون GUI کامل. Multi User + Network + Services - GUI.</li>
<li><strong>graphical.target:</strong> محیط گرافیکی. multi-user + GUI.</li>
</ul>

<h3>۲۴. Target پیش‌فرض</h3>
<p>مشاهده Target پیش‌فرض:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">systemctl get-default</div></div>
<p>خروجی نمونه: <code>graphical.target</code> یا <code>multi-user.target</code>.</p>

<h3>۲۵. تغییر Target پیش‌فرض</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo systemctl set-default multi-user.target\nsudo systemctl set-default graphical.target</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> <code>get-default</code> → مشاهده Default Target؛ <code>set-default</code> → تغییر Default Target.</div></div>

<h3>۲۶. Targetهای Recovery</h3>
<ul>
<li><strong>rescue.target:</strong> محیط Recovery نسبتاً کامل‌تر.</li>
<li><strong>emergency.target:</strong> محیط بسیار حداقلی برای شرایط جدی‌تر.</li>
</ul>
<p>این‌ها در Troubleshooting و Recovery اهمیت دارند.</p>

<h2>بخش هشتم — Single User / Rescue Mode</h2>

<h3>۲۷. Single User Mode چیست؟</h3>
<p>در سیستم‌های قدیمی Linux مفهوم <strong>Single User Mode</strong> رایج بود. هدف آن ورود به یک محیط حداقلی برای تعمیر و مدیریت سیستم، معمولاً با دسترسی مدیریتی. در systemd این مفهوم بیشتر با <code>rescue.target</code> مرتبط است.</p>

<h3>۲۸. ورود به Rescue Mode</h3>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo systemctl rescue</div></div>
<p>سیستم وارد حالت Rescue می‌شود.</p>

<h3>۲۹. Rescue vs Emergency</h3>
<table>
<thead><tr><th>ویژگی</th><th>Rescue</th><th>Emergency</th></tr></thead>
<tbody>
<tr><td>محیط</td><td>نسبتاً کامل‌تر</td><td>حداقلی‌تر</td></tr>
<tr><td>هدف</td><td>تعمیر و Recovery</td><td>شرایط بسیار بحرانی</td></tr>
<tr><td>Services</td><td>محدود</td><td>بسیار محدود</td></tr>
<tr><td>استفاده</td><td>Troubleshooting</td><td>Emergency Recovery</td></tr>
</tbody>
</table>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> اگر سؤال درباره‌ی یک محیط Recovery نسبتاً کاربردی در systemd باشد، <code>rescue.target</code> یکی از پاسخ‌های مهم است.</div></div>

<h2>بخش نهم — Reset Root Password</h2>

<h3>۳۰. چرا Reset Password لازم می‌شود؟</h3>
<p>اگر Root Password را فراموش کرده‌اید، نمی‌توانید با رمز قبلی وارد Root شوید. در بسیاری از Linuxها می‌توان از GRUB برای ورود به یک محیط Recovery و تغییر Password استفاده کرد.</p>

<h3>۳۱. ایده‌ی کلی Reset Root Password</h3>
<div class="code-container"><span class="code-label">زنجیره</span><div class="code-block no-prompt">GRUB\n ↓\nModify Boot Parameters\n ↓\nBoot into Recovery Environment\n ↓\nAccess Root Filesystem\n ↓\nMake Root Filesystem writable if necessary\n ↓\npasswd\n ↓\nReboot</div></div>

<h3>۳۲. چرا روش‌ها متفاوت‌اند؟</h3>
<p>روش Reset Password بین Distributionها یکسان نیست. برای مثال در بعضی سیستم‌ها از <code>rd.break</code> استفاده می‌شود، در برخی دیگر <code>init=/bin/bash</code>. بنابراین همیشه روش مناسب همان Distribution را در نظر بگیرید.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته LPIC-1 ⭐</strong> برای امتحان بیشتر از حفظ یک روش Distribution-specific، این زنجیره را بفهمید: <code>GRUB → Recovery → Root Filesystem → Writable → passwd → Reboot</code>.</div></div>

<h3>۳۳. چرا Root Filesystem باید Writable باشد؟</h3>
<p>ممکن است Root Filesystem در محیط Recovery به صورت <strong>Read-Only</strong> در دسترس باشد. برای تغییر Password باید بتوانیم اطلاعات مربوط به Authentication را تغییر دهیم.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> صرفاً وارد شدن به Shell به معنی این نیست که همه فایل‌های سیستم حتماً قابل نوشتن هستند.</div></div>

<h2>بخش دهم — Virtualization</h2>

<h3>۳۵. Virtualization چیست؟</h3>
<p>Virtualization یعنی <strong>ایجاد یک محیط محاسباتی مجازی روی یک سیستم فیزیکی</strong>. یک Hardware فیزیکی می‌تواند چند سیستم مجازی را اجرا کند.</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Physical Server\n      │\n      ├── VM 1 → Linux\n      ├── VM 2 → Linux\n      └── VM 3 → Windows</div></div>

<h3>۳۶. Host و Guest</h3>
<ul>
<li><strong>Host:</strong> سیستم فیزیکی یا سیستم اصلی که Virtualization روی آن اجرا می‌شود.</li>
<li><strong>Guest:</strong> ماشین مجازی‌ای که روی Host اجرا می‌شود.</li>
</ul>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Physical Hardware\n       ↓\n     Host\n       ↓\n Hypervisor\n   ┌───┼───┐\n   ↓   ↓   ↓\n  VM1 VM2 VM3</div></div>

<h3>۳۷. Hypervisor چیست؟</h3>
<p>Hypervisor مسئول ایجاد و مدیریت Virtual Machineها است. هر VM منابعی مانند CPU، RAM، Disk و Network را به‌صورت مجازی دریافت می‌کند.</p>

<h2>بخش یازدهم — KVM</h2>

<h3>۳۹. KVM چیست؟</h3>
<p><strong>KVM</strong> مخفف <strong>Kernel-based Virtual Machine</strong> است. KVM قابلیت Virtualization را در Kernel Linux فراهم می‌کند.</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Linux Kernel\n     ↓\n    KVM\n     ↓\nVirtual Machines</div></div>

<h3>۴۰. KVM چه چیزی است؟</h3>
<p>KVM را می‌توان به عنوان فناوری/زیرساخت Virtualization مبتنی بر Kernel Linux در نظر گرفت. برای اجرای VMها معمولاً KVM در کنار ابزارهایی مانند <strong>QEMU</strong> استفاده می‌شود.</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Linux\n │\n ├── KVM\n │\n └── QEMU\n       ↓\n      VM</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>نکته امتحانی ⭐</strong> اگر سؤال پرسید «Linux-based virtualization technology چیست؟» یکی از مهم‌ترین پاسخ‌ها <code>KVM</code> است.</div></div>

<h3>۴۱. KVM vs VM</h3>
<p><code>KVM</code> → فناوری/زیرساخت Virtualization، در حالی که <code>VM</code> → ماشین مجازی است.</p>

<h2>بخش دوازدهم — Container و Docker</h2>

<h3>۴۲. Container چیست؟</h3>
<p>Container نیز نوعی محیط ایزوله برای اجرای Application است. اما با VM تفاوت بنیادی دارد.</p>
<ul>
<li><strong>VM:</strong> Host → Hypervisor → Guest OS → Application</li>
<li><strong>Container:</strong> Host Linux Kernel → Container → Application</li>
</ul>
<p>Container معمولاً Kernel جداگانه‌ای برای هر Container اجرا نمی‌کند.</p>

<h3>۴۳. Docker چیست؟</h3>
<p><strong>Docker</strong> یک پلتفرم بسیار معروف برای ساخت، اجرا و مدیریت Containerها است.</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Docker\n ├── Container 1 → Nginx\n ├── Container 2 → App\n └── Container 3 → Database</div></div>

<h3>۴۴. Docker vs Virtual Machine</h3>
<div class="code-container"><span class="code-label">VM</span><div class="code-block no-prompt">Hardware\n   ↓\nHypervisor\n   ↓\nGuest OS\n   ↓\nApplication</div></div>
<div class="code-container"><span class="code-label">Container</span><div class="code-block no-prompt">Hardware\n   ↓\nHost OS / Kernel\n   ↓\nContainer Runtime\n   ↓\nContainer\n   ↓\nApplication</div></div>
<p>Containerها معمولاً سبک‌تر و سریع‌تر برای راه‌اندازی هستند، چون Guest Kernel جداگانه ندارند.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>دام امتحانی ⚠️</strong> Docker یک VM نیست. Docker از Containerization استفاده می‌کند.</div></div>

<h3>۴۵. Docker و Kernel</h3>
<p><code>Container → Kernel Host را Share می‌کند</code>. به همین دلیل Container Linux به Kernel سازگار Host وابسته است. این یکی از تفاوت‌های اساسی Container و VM است.</p>

<h2>بخش سیزدهم — Proxmox</h2>

<h3>۴۶. Proxmox چیست؟</h3>
<p><strong>Proxmox VE</strong> یک پلتفرم مدیریت Virtualization است. Proxmox بر پایه Debian است و از فناوری‌هایی مانند <code>KVM</code> و <code>LXC</code> استفاده می‌کند.</p>

<h3>۴۷. Proxmox چه کاری انجام می‌دهد؟</h3>
<p>Proxmox یک محیط مدیریتی برای مواردی مانند ساخت VM، مدیریت Storage، مدیریت Network، مدیریت منابع، مدیریت Cluster و مدیریت Container فراهم می‌کند.</p>

<h3>۴۸. KVM vs Docker vs Proxmox</h3>
<table>
<thead><tr><th>فناوری</th><th>مفهوم</th></tr></thead>
<tbody>
<tr><td>KVM</td><td>Virtualization در Linux</td></tr>
<tr><td>Docker</td><td>Container Platform</td></tr>
<tr><td>Proxmox</td><td>پلتفرم مدیریت Virtualization</td></tr>
<tr><td>VM</td><td>ماشین مجازی</td></tr>
<tr><td>Container</td><td>محیط ایزوله برای Application</td></tr>
</tbody>
</table>
<div class="code-container"><span class="code-label">مدل کلی</span><div class="code-block no-prompt">Virtualization\n│\n├── KVM\n│     ↓\n│    VM\n│\n├── Containerization\n│     ↓\n│    Docker / LXC\n│\n└── Management\n      ↓\n    Proxmox</div></div>

<h2>یک سناریوی واقعی 🎯</h2>
<p>فرض کنید یک Linux Server داریم و می‌خواهیم آن را روشن کنیم.</p>
<div class="code-container"><span class="code-label">مراحل</span><div class="code-block no-prompt">۱. Power ON\n۲. BIOS / UEFI\n۳. GRUB\n۴. Linux Kernel\n۵. initramfs\n۶. systemd (PID 1)\n۷. Target (multi-user یا graphical)\n۸. Services (SSH, Network, ...)\n۹. Login</div></div>

<h2>سناریوی Recovery 🎯</h2>
<p>فرض کنید Root Password را فراموش کرده‌اید:</p>
<div class="code-container"><span class="code-label">زنجیره Recovery</span><div class="code-block no-prompt">Reboot\n  ↓\nGRUB\n  ↓\nModify Boot Entry\n  ↓\nRecovery Environment\n  ↓\nRoot Filesystem\n  ↓\nRead-Write\n  ↓\npasswd\n  ↓\nReboot</div></div>
<p>نکته مهم: روش دقیق Recovery می‌تواند بین Distributionها متفاوت باشد.</p>

<h2>جدول طلایی Boot</h2>
<table>
<thead><tr><th>مفهوم</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td>BIOS</td><td>Firmware قدیمی‌تر</td></tr>
<tr><td>UEFI</td><td>Firmware مدرن</td></tr>
<tr><td>ESP</td><td>Partition مربوط به UEFI</td></tr>
<tr><td>GRUB</td><td>Bootloader</td></tr>
<tr><td>Kernel</td><td>هسته Linux</td></tr>
<tr><td>initramfs</td><td>محیط اولیه Boot در RAM</td></tr>
<tr><td>systemd</td><td>Init/System Manager</td></tr>
<tr><td>PID 1</td><td>Process اصلی User Space در systemd</td></tr>
<tr><td>Target</td><td>وضعیت/گروه منطقی systemd</td></tr>

<h2>مقایسه‌های طلایی LPIC-1</h2>
<h3>BIOS vs UEFI</h3>
<p>BIOS → Firmware قدیمی‌تر؛ UEFI → Firmware مدرن‌تر با ESP و Secure Boot.</p>
<h3>BIOS/UEFI vs GRUB</h3>
<p>BIOS/UEFI → Firmware؛ GRUB → Bootloader.</p>
<h3>Kernel vs initramfs</h3>
<p>Kernel → هسته اصلی Linux؛ initramfs → محیط اولیه برای ادامه Boot در RAM.</p>
<h3>initramfs vs Root Filesystem</h3>
<p>initramfs → Initial/temporary environment؛ Root Filesystem → محیط اصلی سیستم.</p>
<h3>systemd vs GRUB</h3>
<p>GRUB → Bootloader (قبل از Kernel/User Space)؛ systemd → System Manager/init (بعد از Kernel).</p>
<h3>start vs enable</h3>
<p>start → الآن اجرا کن؛ enable → در Bootهای آینده اجرا شود.</p>
<h3>rescue vs emergency</h3>
<p>rescue → Recovery نسبتاً کامل؛ emergency → Recovery حداقلی‌تر.</p>
<h3>VM vs Container</h3>
<p>VM → Guest OS با Kernel جدا؛ Container → Kernel Host را Share می‌کند.</p>
<h3>KVM vs Docker</h3>
<p>KVM → Virtual Machine؛ Docker → Container.</p>
<h3>KVM vs Proxmox</h3>
<p>KVM → Virtualization Technology؛ Proxmox → Virtualization Management Platform.</p>

<h2>دام‌های امتحانی ⚠️</h2>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><ul>
<li><strong>دام ۱:</strong> GRUB همان BIOS است؟ ❌ خیر؛ <code>BIOS/UEFI</code> → Firmware، <code>GRUB</code> → Bootloader.</li>
<li><strong>دام ۲:</strong> Kernel اولین Process سیستم با PID 1 است؟ ❌ خیر؛ در systemd-based: <code>systemd → PID 1</code>.</li>
<li><strong>دام ۳:</strong> initramfs همان Root Filesystem اصلی است؟ ❌ خیر؛ initramfs یک محیط اولیه در RAM برای ادامه‌ی Boot است.</li>
<li><strong>دام ۴:</strong> <code>systemctl start</code> باعث می‌شود Service در Bootهای بعدی خودکار اجرا شود؟ ❌ خیر؛ <code>start</code> → الآن، <code>enable</code> → Bootهای بعدی.</li>
<li><strong>دام ۵:</strong> <code>enable</code> یعنی Service همین الان اجرا شده است؟ ❌ خیر؛ <code>enable</code> مربوط به فعال شدن برای Startup است.</li>
<li><strong>دام ۶:</strong> Single User Mode دقیقاً همان یک دستور ثابت در تمام Distributionها است؟ ❌ خیر؛ روش Recovery بین Distributionها متفاوت است.</li>
<li><strong>دام ۷:</strong> Docker یک Virtual Machine است؟ ❌ خیر؛ Docker از Containerization استفاده می‌کند.</li>
<li><strong>دام ۸:</strong> هر Container یک Linux Kernel مستقل دارد؟ ❌ خیر؛ Containerها معمولاً Kernel Host را Share می‌کنند.</li>
<li><strong>دام ۹:</strong> KVM یک VM است؟ ❌ خیر؛ KVM فناوری Virtualization است.</li>
<li><strong>دام ۱۰:</strong> Proxmox خودش فقط یک Linux Distribution معمولی است؟ ❌ خیر؛ Proxmox VE یک پلتفرم مدیریت Virtualization است.</li>
</ul></div></div>

<h2>قبل از شروع...</h2>
<p>فرض کن یک Linux Server داری که چند کاربر روی آن کار می‌کنند. ممکن است بخواهی:</p>
<ul>
<li>User جدید بسازی.</li>
<li>User را عضو یک Group کنی.</li>
<li>رمز عبور User را تغییر دهی.</li>
<li>برای انجام یک دستور خاص دسترسی مدیریتی بدهی.</li>
<li>بفهمی چه اتفاقی در سیستم افتاده است.</li>
<li>ساعت سیستم را تنظیم و همگام کنی.</li>
<li>Printer را مدیریت کنی.</li>
<li>از راه دور به Server وصل شوی.</li>
<li>در صورت نیاز محیط گرافیکی داشته باشی.</li>
</ul>
<p>تمام این موضوعات، هسته‌ی جلسه‌ی هفتم هستند.</p>

<h2>بخش اول — User و Group</h2>

<h3>۱. User چیست؟</h3>
<p>در Linux تقریباً هر کاری توسط یک <strong>User</strong> انجام می‌شود. مثلاً:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">User\n ↓\nRun Command\n ↓\nAccess File\n ↓\nRun Process</div></div>
<p>سیستم بر اساس User مشخص می‌کند:</p>
<blockquote>این کاربر اجازه انجام این کار را دارد یا نه؟</blockquote>

<h3>۲. Root چیست؟</h3>
<p><code>root</code> کاربر مدیریتی Linux است. به‌صورت ساده:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Normal User\n→ دسترسی محدودتر\n\nroot\n→ دسترسی مدیریتی بسیار گسترده</div></div>
<p>Root می‌تواند کارهایی انجام دهد که User معمولی اجازه انجام آن‌ها را ندارد؛ مانند:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">useradd ...</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">systemctl restart ...</div></div>
<p>در بسیاری از سیستم‌ها برای انجام کارهای مدیریتی از <code>sudo</code> استفاده می‌شود تا لازم نباشد مستقیماً با حساب root کار کنیم.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>Exam Tip ⭐</strong> شناسه‌ی کاربر <code>root</code> معمولاً <code>UID = 0</code> است.</div></div>

<h3>۳. UID چیست؟</h3>
<p>هر User در Linux یک شناسه‌ی عددی دارد: <strong>UID = User ID</strong>. مثلاً:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">ali → UID 1000\nsara → UID 1001</div></div>
<p>برای root:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">root → UID 0</div></div>
<p>سیستم در سطح داخلی بیشتر با UID کار می‌کند تا فقط نام User.</p>

<h3>۴. مشاهده Userها</h3>
<p>اطلاعات Userها در:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block">/etc/passwd</div></div>
<p>نگهداری می‌شود. مشاهده:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">cat /etc/passwd</div></div>
<p>مثلاً یک Entry می‌تواند شبیه این باشد:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block">ali:x:1000:1000:Ali:/home/ali:/bin/bash</div></div>
<p>به‌صورت مفهومی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">username\n   ↓\npassword placeholder\n   ↓\nUID\n   ↓\nGID\n   ↓\nhome\n   ↓\nshell</div></div>

<h3>۵. <code>/etc/passwd</code></h3>
<p>فایل <code>/etc/passwd</code> اطلاعات پایه‌ی Accountهای User را نگهداری می‌کند.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>Exam Trap ⚠️</strong> در سیستم‌های مدرن، Password واقعی User معمولاً داخل <code>/etc/passwd</code> ذخیره نمی‌شود. مقادیر Hash شده‌ی Password معمولاً در <code>/etc/shadow</code> قرار دارند.</div></div>

<h3>۶. <code>/etc/shadow</code></h3>
<p>این فایل اطلاعات حساس مربوط به Passwordهای User را نگهداری می‌کند.</p>
<div class="code-container"><span class="code-label">passwd</span><div class="code-block no-prompt">/etc/passwd\n→ اطلاعات Account</div></div>
<div class="code-container"><span class="code-label">shadow</span><div class="code-block no-prompt">/etc/shadow\n→ اطلاعات Password / Authentication</div></div>
<p>دسترسی به <code>/etc/shadow</code> معمولاً محدودتر است.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>Exam Tip ⭐</strong> <code>passwd</code> → User Account information؛ <code>shadow</code> → Password information.</div></div>

<h3>۷. Group چیست؟</h3>
<p>Group مجموعه‌ای از Userهاست که می‌توانند یک سطح دسترسی یا نقش مشترک داشته باشند. مثلاً:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">developers\n│\n├── ali\n├── sara\n└── reza</div></div>
<p>به جای اینکه Permission را برای تک‌تک Userها تنظیم کنیم، می‌توانیم آن را برای Group تنظیم کنیم.</p>

<h3>۸. GID چیست؟</h3>
<p>هر Group نیز یک شناسه عددی دارد: <strong>GID = Group ID</strong>. مثلاً:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">developers → GID 1002</div></div>

<h3>۹. <code>/etc/group</code></h3>
<p>اطلاعات Groupها معمولاً در:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block">/etc/group</div></div>
<p>قرار دارد. مشاهده:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">cat /etc/group</div></div>

<h2>بخش دوم — ساخت و مدیریت User</h2>

<h3>۱۰. <code>useradd</code></h3>
<p>برای ایجاد User:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo useradd ali</div></div>
<p>اما این دستور به‌تنهایی ممکن است تمام تنظیمات مورد انتظار یک User معمولی، مانند Home Directory، را ایجاد نکند؛ بسته به گزینه‌ها و Distribution. برای ساخت User همراه با Home Directory معمولاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo useradd -m ali</div></div>
<p>استفاده می‌شود.</p>
<div class="code-container"><span class="code-label">گزینه</span><div class="code-block no-prompt">-m\n↓\nCreate Home Directory</div></div>

<h3>۱۱. <code>passwd</code></h3>
<p>برای تعیین یا تغییر Password:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo passwd ali</div></div>
<p>سپس Password جدید را وارد می‌کنیم. برای تغییر Password User فعلی:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">passwd</div></div>

<h3>۱۲. <code>usermod</code></h3>
<p>برای تغییر ویژگی‌های User:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo usermod ...</div></div>
<p>مثلاً اضافه کردن User به یک Group:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo usermod -aG developers ali</div></div>
<p>معنی:</p>
<div class="code-container"><span class="code-label">گزینه‌ها</span><div class="code-block no-prompt">-a → append\n-G → supplementary groups</div></div>
<p>یعنی:</p>
<blockquote>Group <code>developers</code> را به Groupهای supplementary کاربر <code>ali</code> اضافه کن.</blockquote>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>Exam Trap ⚠️</strong> دقت کن: <code>usermod -G developers ali</code> می‌تواند Groupهای supplementary قبلی را جایگزین کند. اما <code>usermod -aG developers ali</code> عضویت جدید را <strong>اضافه</strong> می‌کند. پس <code>-aG</code> → Add to supplementary group، یکی از نکات مهم امتحانی است.</div></div>

<h3>۱۳. <code>userdel</code></h3>
<p>برای حذف User:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo userdel ali</div></div>
<p>اگر بخواهیم Home Directory نیز حذف شود:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo userdel -r ali</div></div>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>⚠️ هشدار</strong> <code>-r</code> می‌تواند Home Directory و Mail Spool مربوط به User را نیز حذف کند. پس <code>userdel</code> → حذف Account؛ <code>userdel -r</code> → حذف Account + داده‌های مرتبط مشخص.</div></div>

<h2>بخش سوم — مدیریت Group</h2>

<h3>۱۴. <code>groupadd</code></h3>
<p>ساخت Group:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo groupadd developers</div></div>

<h3>۱۵. <code>groupdel</code></h3>
<p>حذف Group:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo groupdel developers</div></div>

<h3>۱۶. مشاهده عضویت Group</h3>
<p>برای دیدن Groupهای User:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">groups ali</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">id ali</div></div>
<p><code>id</code> اطلاعاتی مانند:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">UID\nGID\nGroups</div></div>
<p>را نشان می‌دهد.</p>

<h3>جدول طلایی User و Group</h3>
<table>
<thead><tr><th>دستور</th><th>کاربرد</th></tr></thead>
<tbody>
<tr><td><code>useradd</code></td><td>ساخت User</td></tr>
<tr><td><code>passwd</code></td><td>تنظیم/تغییر Password</td></tr>
<tr><td><code>usermod</code></td><td>تغییر ویژگی User</td></tr>
<tr><td><code>userdel</code></td><td>حذف User</td></tr>
<tr><td><code>groupadd</code></td><td>ساخت Group</td></tr>
<tr><td><code>groupdel</code></td><td>حذف Group</td></tr>
<tr><td><code>groups</code></td><td>نمایش Groupهای User</td></tr>
<tr><td><code>id</code></td><td>UID/GID/Groups</td></tr>
</tbody>
</table>

<h2>بخش چهارم — <code>su</code></h2>

<h3>۱۷. <code>su</code> چیست؟</h3>
<p><code>su</code> مخفف <strong>Switch User</strong> است. با آن می‌توانیم Shell را با User دیگری اجرا کنیم. مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">su ali</div></div>
<p>یا برای گرفتن Shell به‌عنوان root:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">su -</div></div>

<h3>۱۸. چرا <code>su -</code> مهم است؟</h3>
<p>وقتی می‌نویسیم <code>su -</code>، یک Login Shell برای User مقصد ایجاد می‌شود. در نتیجه محیط آن User، از جمله Environment و مسیر Home، نیز مطابق User مقصد تنظیم می‌شود. مدل ذهنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Current User\n      ↓\n    su -\n      ↓\nLogin Shell\n      ↓\n   root</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>Exam Tip ⭐</strong> <code>su</code> → Switch User؛ <code>su -</code> → Login Shell as target User.</div></div>

<h2>بخش پنجم — <code>sudo</code></h2>

<h3>۱۹. <code>sudo</code> چیست؟</h3>
<p><code>sudo</code> یعنی:</p>
<blockquote>اجرای یک Command با مجوز User دیگر، معمولاً root.</blockquote>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo systemctl restart ssh</div></div>
<p>در اینجا User معمولی دستور مدیریتی را با مجوز مناسب اجرا می‌کند.</p>

<h3>۲۰. <code>su</code> vs <code>sudo</code></h3>
<p>این تفاوت بسیار مهم است.</p>
<div class="code-container"><span class="code-label">su</span><div class="code-block no-prompt">su\n↓\nSwitch User\n↓\nShell</div></div>
<div class="code-container"><span class="code-label">sudo</span><div class="code-block no-prompt">sudo\n↓\nRun one command\n↓\nwith elevated privileges</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo apt update</div></div>
<p>فقط همان Command را با مجوز لازم اجرا می‌کنیم.</p>

<h3>۲۱. چرا sudo بهتر از Login مستقیم به root می‌تواند باشد؟</h3>
<p>استفاده از <code>sudo</code> معمولاً امکان می‌دهد:</p>
<ul>
<li>دسترسی مدیریتی محدودتر باشد.</li>
<li>مشخص باشد چه Userای چه Commandی اجرا کرده است.</li>
<li>نیاز به استفاده دائمی از Shell root کاهش یابد.</li>
</ul>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Normal User\n     │\n     ├── Normal Commands\n     │\n     └── sudo\n          ↓\n     Administrative Command</div></div>

<h3>۲۲. <code>sudoers</code></h3>
<p>قواعد <code>sudo</code> در:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block">/etc/sudoers</div></div>
<p>و فایل‌های مرتبط در:</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block">/etc/sudoers.d/</div></div>
<p>قرار می‌گیرند. برای ویرایش فایل اصلی بهتر است از:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">visudo</div></div>
<p>استفاده شود. چرا؟ چون Syntax را بررسی می‌کند و از خراب شدن Configuration جلوگیری می‌کند.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>Exam Tip ⭐</strong> <code>sudo</code> → اجرای Command با Privilege بالاتر؛ <code>sudoers</code> → تعریف اینکه چه کسی چه دسترسی‌ای داشته باشد؛ <code>visudo</code> → ویرایش امن Configuration مربوط به sudo.</div></div>

<h2>بخش ششم — Logs</h2>

<h3>۲۳. Log چیست؟</h3>
<p>Log گزارشی از اتفاقات سیستم است. مثلاً:</p>
<div class="code-container"><span class="code-label">نمونه‌ها</span><div class="code-block no-prompt">Login\nError\nService Start\nService Stop\nAuthentication\nKernel Event</div></div>
<p>ممکن است در Log ثبت شوند. مدل ذهنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Event\n  ↓\nLogging System\n  ↓\nLog\n  ↓\nTroubleshooting</div></div>

<h3>۲۴. چرا Log مهم است؟</h3>
<p>فرض کن SSH کار نمی‌کند. به جای حدس زدن:</p>
<div class="code-container"><span class="code-label">حدس‌ها</span><div class="code-block no-prompt">SSH مشکل دارد؟\nNetwork مشکل دارد؟\nAuthentication مشکل دارد؟\nConfiguration مشکل دارد؟</div></div>
<p>به Log مراجعه می‌کنیم. پس:</p>
<div class="code-container"><span class="code-label">نتیجه</span><div class="code-block no-prompt">Log\n→ Evidence\n→ Troubleshooting</div></div>

<h3>۲۵. <code>/var/log</code></h3>
<p>در بسیاری از Linuxها فایل‌های Log در:</p>
<div class="code-container"><span class="code-label">مسیر</span><div class="code-block">/var/log/</div></div>
<p>قرار دارند. مثلاً ممکن است فایل‌هایی مانند:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block">/var/log/auth.log</div></div>
<p>در Debian-basedها یا:</p>
<div class="code-container"><span class="code-label">فایل</span><div class="code-block">/var/log/secure</div></div>
<p>در برخی Red Hat-basedها وجود داشته باشند.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>Exam Trap ⚠️</strong> نام دقیق فایل‌های Log بین Distributionها یکسان نیست. اما <code>/var/log</code> یک مسیر مهم و شناخته‌شده برای Logs است.</div></div>

<h3>۲۶. systemd Journal</h3>
<p>در سیستم‌های systemd-based، Logها می‌توانند توسط <strong>systemd-journald</strong> جمع‌آوری شوند. برای مشاهده:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">journalctl</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">journalctl -b</div></div>
<p>یعنی:</p>
<blockquote>Logهای مربوط به Boot فعلی.</blockquote>
<p>یا:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">journalctl -u ssh</div></div>
<p>برای مشاهده Logهای یک Service مشخص.</p>

<h3>۲۷. <code>journalctl</code></h3>
<p>چند دستور مهم:</p>
<div class="code-container"><span class="code-label">همه</span><div class="code-block">journalctl</div></div>
<p>همه Journalهای قابل دسترس.</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">journalctl -b</div></div>
<p>Logهای Boot فعلی.</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">journalctl -u nginx</div></div>
<p>Logهای Service مشخص.</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">journalctl -f</div></div>
<p>مشاهده‌ی زنده‌ی Logها. مدل ذهنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">journalctl\n│\n├── -b → Boot\n├── -u → Unit/Service\n└── -f → Follow</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>Exam Tip ⭐</strong> اگر سؤال درباره‌ی Logهای systemd باشد، <code>journalctl</code> یکی از مهم‌ترین دستورات است.</div></div>

<h2>بخش هفتم — Time در Linux</h2>

<h3>۲۸. چرا Time مهم است؟</h3>
<p>زمان درست فقط برای نمایش ساعت نیست. در Linux زمان برای مواردی مانند:</p>
<ul>
<li>Logها</li>
<li>Authentication</li>
<li>Certificateها</li>
<li>Cron</li>
<li>Troubleshooting</li>
<li>Distributed Systems</li>
</ul>
<p>مهم است. مثلاً اگر ساعت اشتباه باشد:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">Log A → 10:00\nLog B → 08:00</div></div>
<p>ممکن است ترتیب واقعی اتفاقات را اشتباه تحلیل کنیم.</p>

<h3>۲۹. مشاهده زمان</h3>
<p>دستور:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">date</div></div>
<p>زمان فعلی سیستم را نشان می‌دهد.</p>

<h3>۳۰. <code>timedatectl</code></h3>
<p>در سیستم‌های systemd-based:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">timedatectl</div></div>
<p>برای مشاهده و مدیریت تنظیمات زمان استفاده می‌شود. مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">timedatectl status</div></div>
<p>اطلاعاتی درباره‌ی:</p>
<div class="code-container"><span class="code-label">اطلاعات</span><div class="code-block no-prompt">Local Time\nUniversal Time\nRTC Time\nTime Zone\nNTP</div></div>
<p>نشان می‌دهد.</p>

<h3>۳۱. Time Zone</h3>
<p>Time Zone مشخص می‌کند ساعت محلی سیستم چگونه نسبت به UTC نمایش داده شود. مثلاً:</p>
<div class="code-container"><span class="code-label">نمونه</span><div class="code-block no-prompt">UTC\nEurope/Paris\nAsia/Tehran</div></div>
<p>برای مشاهده:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">timedatectl</div></div>
<p>برای تنظیم Time Zone می‌توان از:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">sudo timedatectl set-timezone Europe/Paris</div></div>
<p>استفاده کرد.</p>

<h3>۳۲. UTC چیست؟</h3>
<p><strong>UTC</strong> یک استاندارد جهانی برای زمان است. در سیستم‌های مختلف ممکن است زمان محلی متفاوت باشد، اما UTC یک مرجع مشترک فراهم می‌کند. مدل ذهنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">UTC\n ↓\nTime Zone\n ↓\nLocal Time</div></div>

<h2>بخش هشتم — NTP</h2>

<h3>۳۳. NTP چیست؟</h3>
<p><strong>NTP = Network Time Protocol</strong>، پروتکلی برای همگام‌سازی ساعت سیستم با Time Serverها است. مدل ذهنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Time Server\n     ↓\n    NTP\n     ↓\nLinux System\n     ↓\nCorrect Time</div></div>

<h3>۳۴. چرا NTP مهم است؟</h3>
<p>فرض کن چند Server داریم:</p>
<div class="code-container"><span class="code-label">مثال</span><div class="code-block no-prompt">Server A → 10:00:02\nServer B → 09:59:40\nServer C → 10:00:05</div></div>
<p>این اختلاف می‌تواند در:</p>
<ul>
<li>Log Analysis</li>
<li>Authentication</li>
<li>Distributed Systems</li>
<li>Security</li>
</ul>
<p>مشکل ایجاد کند. NTP کمک می‌کند زمان سیستم‌ها هماهنگ بماند.</p>

<h3>۳۵. NTP در systemd</h3>
<p>در بسیاری از systemd-based systems می‌توان وضعیت NTP را با:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">timedatectl</div></div>
<p>دید. مثلاً:</p>
<div class="code-container"><span class="code-label">خروجی</span><div class="code-block no-prompt">System clock synchronized: yes\nNTP service: active</div></div>
<p>در بعضی سیستم‌ها سرویس‌هایی مانند:</p>
<div class="code-container"><span class="code-label">سرویس‌ها</span><div class="code-block no-prompt">chronyd\nsystemd-timesyncd</div></div>
<p>برای Time Synchronization استفاده می‌شوند.</p>
<div class="box important"><i class="fas fa-star"></i><div><strong>Exam Tip ⭐</strong> مهم‌ترین مفهوم: <code>NTP</code> → Network Time Synchronization. لازم نیست نام تمام پیاده‌سازی‌ها را حفظ کنیم.</div></div>

<h2>بخش نهم — Printer Management</h2>

<h3>۳۶. Printer در Linux</h3>
<p>Linux می‌تواند Printerها را مدیریت کند. یکی از سیستم‌های رایج <strong>CUPS</strong> است. CUPS مخفف <strong>Common UNIX Printing System</strong> است.</p>

<h3>۳۷. CUPS چیست؟</h3>
<p>CUPS یک سیستم Printing است که مدیریت Printer و Print Jobها را فراهم می‌کند. مدل ذهنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Application\n    ↓\nPrint Job\n    ↓\nCUPS\n    ↓\nPrinter</div></div>

<h3>۳۸. Printer Queue</h3>
<p>فرض کن سه فایل برای چاپ داریم:</p>
<div class="code-container"><span class="code-label">فایل‌ها</span><div class="code-block no-prompt">job1\njob2\njob3</div></div>
<p>آن‌ها در Queue قرار می‌گیرند:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Print Queue\n│\n├── job1\n├── job2\n└── job3</div></div>
<p>CUPS این Jobها را مدیریت می‌کند.</p>

<h3>۳۹. دستورهای مهم Printing</h3>
<p>در محیط‌های CUPS می‌توان از ابزارهایی مانند <code>lp</code> و <code>lpstat</code> استفاده کرد. مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">lp report.pdf</div></div>
<p>ارسال فایل برای چاپ. مشاهده وضعیت:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">lpstat -p</div></div>

<h3>۴۰. CUPS Service</h3>
<p>در بسیاری از سیستم‌ها Service مربوط به CUPS:</p>
<div class="code-container"><span class="code-label">Service</span><div class="code-block">cups</div></div>
<p>است. می‌توان وضعیت آن را بررسی کرد:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">systemctl status cups</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>Exam Tip ⭐</strong> <code>CUPS</code> → Printing System؛ <code>lp</code> → Send Print Job؛ <code>lpstat</code> → Printer / Queue Status.</div></div>

<h2>بخش دهم — GUI</h2>

<h3>۴۱. GUI چیست؟</h3>
<p><strong>GUI = Graphical User Interface</strong>، یعنی محیطی که کاربر به جای فقط Command Line، با عناصر گرافیکی مانند:</p>
<div class="code-container"><span class="code-label">عناصر</span><div class="code-block no-prompt">Windows\nMenus\nButtons\nIcons\nMouse</div></div>
<p>کار می‌کند.</p>

<h3>۴۲. CLI vs GUI</h3>
<h4>CLI</h4>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Command\n ↓\nShell\n ↓\nOutput</div></div>
<h4>GUI</h4>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Mouse / Keyboard\n       ↓\nGraphical Application\n       ↓\nSystem</div></div>

<h3>۴۳. آیا GUI همان Linux است؟</h3>
<p>خیر. این نکته مهم است.</p>
<div class="code-container"><span class="code-label">Linux</span><div class="code-block no-prompt">Linux\n→ Kernel</div></div>
<div class="code-container"><span class="code-label">GUI</span><div class="code-block no-prompt">GUI\n→ Graphical Environment</div></div>
<p>یعنی Linux می‌تواند بدون GUI نیز اجرا شود. مثلاً یک Server ممکن است فقط:</p>
<div class="code-container"><span class="code-label">محیط</span><div class="code-block">CLI</div></div>
<p>داشته باشد.</p>

<h3>۴۴. Display Server</h3>
<p>برای محیط گرافیکی یک لایه‌ی مهم وجود دارد که ارتباط Applicationها با Display/Input را مدیریت می‌کند. در Linux سنتی:</p>
<div class="code-container"><span class="code-label">سیستم</span><div class="code-block">X Window System</div></div>
<p>بسیار رایج بوده است. در سیستم‌های مدرن:</p>
<div class="code-container"><span class="code-label">سیستم</span><div class="code-block">Wayland</div></div>
<p>نیز بسیار رایج است. مدل ساده:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">GUI Application\n      ↓\nDisplay System\n   ┌──┴──┐\n   ↓     ↓\n   X   Wayland</div></div>
<div class="box important"><i class="fas fa-star"></i><div><strong>Exam Tip ⭐</strong> برای LPIC-1 بدان: <code>X</code> → قدیمی‌تر و بسیار رایج؛ <code>Wayland</code> → معماری مدرن‌تر. لازم نیست وارد جزئیات پیاده‌سازی آن‌ها شویم.</div></div>

<h3>۴۵. Desktop Environment</h3>
<p>Desktop Environment مجموعه‌ای از اجزای گرافیکی است که یک محیط کامل Desktop فراهم می‌کند. نمونه‌ها:</p>
<div class="code-container"><span class="code-label">نمونه‌ها</span><div class="code-block no-prompt">GNOME\nKDE Plasma\nXFCE</div></div>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Linux\n ↓\nDisplay System\n ↓\nDesktop Environment\n ↓\nGUI Applications</div></div>

<h3>۴۶. Window Manager</h3>
<p>Window Manager مسئول مدیریت Windowها است. مثلاً:</p>
<div class="code-container"><span class="code-label">وظایف</span><div class="code-block no-prompt">Window\nMove\nResize\nMinimize\nMaximize</div></div>
<p>را مدیریت می‌کند. در Desktop Environmentهای کامل، Window Management بخشی از معماری Desktop است.</p>
<div class="box warning"><i class="fas fa-triangle-exclamation"></i><div><strong>Exam Trap ⚠️</strong> Desktop Environment و Window Manager را یکی ندان. <code>Desktop Environment</code> → محیط کامل Desktop؛ <code>Window Manager</code> → مدیریت Windowها.</div></div>

<h2>بخش یازدهم — Remote Desktop</h2>

<h3>۴۷. Remote Access چیست؟</h3>
<p>گاهی می‌خواهیم از یک سیستم دیگر به Linux وصل شویم. مثلاً:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Your PC\n    │\n    │ Network\n    ↓\nLinux Server</div></div>
<p>اگر فقط Shell لازم داشته باشیم، معمولاً <strong>SSH</strong> راه‌حل اصلی است. اما اگر GUI کامل بخواهیم، به Remote Desktop Technology نیاز داریم.</p>

<h3>۴۸. Remote Desktop</h3>
<p>Remote Desktop یعنی:</p>
<blockquote>مشاهده و کنترل محیط Desktop یک سیستم از طریق شبکه.</blockquote>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Client\n   │\n   │ Network\n   ↓\nLinux Server\n   │\n   ↓\nDesktop Session</div></div>

<h3>۴۹. SSH vs Remote Desktop</h3>
<h4>SSH</h4>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">SSH\n→ Remote Command Line</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">دستور</span><div class="code-block">ssh ali@server</div></div>
<h4>Remote Desktop</h4>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">Remote Desktop\n→ Remote Graphical Session</div></div>
<p>برای مثال می‌توان از فناوری‌هایی مانند:</p>
<div class="code-container"><span class="code-label">فناوری‌ها</span><div class="code-block no-prompt">VNC\nRDP</div></div>
<p>استفاده کرد.</p>

<h3>۵۰. VNC</h3>
<p><strong>VNC = Virtual Network Computing</strong>، یک فناوری برای دسترسی Remote به محیط گرافیکی است. مدل:</p>
<div class="code-container"><span class="code-label">مدل</span><div class="code-block no-prompt">VNC Client\n    ↓\n Network\n    ↓\nVNC Server\n    ↓\nGUI</div></div>

<h3>۵۱. RDP</h3>
<p><strong>RDP = Remote Desktop Protocol</strong>، پروتکلی برای Remote Desktop است که بیشتر با دنیای Microsoft شناخته می‌شود، اما Linux نیز می‌تواند در نقش Client یا Server از راهکارهای سازگار با RDP استفاده کند.</p>

<h3>۵۲. SSH vs VNC/RDP</h3>
<table>
<thead><tr><th>ویژگی</th><th>SSH</th><th>VNC / RDP</th></tr></thead>
<tbody>
<tr><td>Remote Access</td><td>✅</td><td>✅</td></tr>
<tr><td>Command Line</td><td>✅</td><td>ممکن است</td></tr>
<tr><td>GUI</td><td>❌ به‌صورت معمول</td><td>✅</td></tr>
<tr><td>کاربرد Server Management</td><td>بسیار رایج</td><td>GUI Management</td></tr>
<tr><td>مصرف منابع</td><td>معمولاً کمتر</td><td>معمولاً بیشتر</td></tr>
</tbody>
</table>
<div class="box important"><i class="fas fa-star"></i><div><strong>Exam Tip ⭐</strong> <code>SSH</code> → Remote CLI؛ <code>VNC / RDP</code> → Remote GUI.</div></div>

<p>فرض کن یک Server به نام:</p>

<p>داریم.</p>
