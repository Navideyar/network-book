<h2 class="lesson-title">24. یک اشتباه رایج در <code>enumerate()</code></h2>
<p>کد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

for name, index in enumerate(names):
    print(index, name)</div></div>
<p>از نظر Syntax مشکلی ندارد، اما ترتیب متغیرها اشتباه انتخاب شده است.</p>
<p><code>enumerate()</code> مقدارها را به این شکل می‌دهد:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">index, value</div></div>
<p>پس بهتر است بنویسیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, name in enumerate(names):
    print(index, name)</div></div>
<h3>نکته </h3>
<p>ترتیب را به خاطر بسپار:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, value in enumerate(items):</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">🧠 مدل ذهنی کل جلسه</h2>
<p>تا اینجا سه ابزار مهم داریم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">                 LOOP
                   │
          ┌────────┴────────┐
          │                 │
        while              for
          │                 │
    شرط و وضعیت        پیمایش داده
                            │
                     ┌──────┴──────┐
                     │             │
                   range       enumerate
                     │             │
                دنباله عددی    Index + Value</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(5):
    print(i)</div></div>
<p>یعنی:</p>
<blockquote>برای هر عدد موجود در این بازه، کد را اجرا کن.</blockquote>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, value in enumerate(names):
    print(index, value)</div></div>
<p>یعنی:</p>
<blockquote>برای هر عنصر لیست، Index و Value آن را در اختیارم قرار بده.</blockquote>
<hr class="lesson-divider">
<h1 class="lesson-title section-troubleshoot">Troubleshooting</h1>
<h3>مشکل ۱ — چرا عدد آخر چاپ نشد؟</h3>
<p>کد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(1, 5):
    print(i)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
2
3
4</div></div>
<p>علت:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">stop = 5</div></div>
<p>و <code>5</code> شامل نمی‌شود.</p>
<p>اگر 5 هم لازم است:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">range(1, 6)</div></div>
<h3>مشکل ۲ — چرا حلقه معکوس کار نمی‌کند؟</h3>
<p>این کد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(5, 0):
    print(i)</div></div>
<p>چیزی چاپ نمی‌کند.</p>
<p>چرا؟</p>
<p>چون <code>range()</code> به‌صورت پیش‌فرض با <code>step = 1</code> جلو می‌رود، در حالی که اینجا باید به سمت پایین حرکت کنیم.</p>
<p>راه درست:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(5, 0, -1):
    print(i)</div></div>
<h3>مشکل ۳ — چرا <code>enumerate()</code> را اشتباه می‌نویسم؟</h3>
<p>اگر Index و Value هر دو لازم هستند، الگوی اصلی را به خاطر بسپار:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, value in enumerate(items):
    ...</div></div>
<p>نه برعکس.</p>
<h3>مشکل ۴ — آیا همیشه باید از <code>range()</code> استفاده کنم؟</h3>
<p>خیر.</p>
<p>اگر خود داده‌ها را داری:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

for name in names:
    print(name)</div></div>
<p>نیازی به <code>range()</code> نداری.</p>
<p><code>range()</code> بیشتر زمانی مفید است که:</p>
<ul><li>دنباله‌ای از اعداد می‌خواهی.</li><li>تعداد مشخصی تکرار نیاز داری.</li><li>به Index نیاز داری و روش مناسب مسئله را انتخاب می‌کنی.</li></ul>
<hr class="lesson-divider">
<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li><code>for</code> برای پیمایش روی داده‌ها و اجرای تکراری کد استفاده می‌شود.</li><li>ساختار اصلی: <code>for variable in iterable: code</code></li><li><code>for</code> می‌تواند روی <code>list</code> و <code>string</code> حرکت کند.</li><li><code>range()</code> برای ایجاد دنباله عددی مناسب برای حلقه‌ها استفاده می‌شود.</li><li>در <code>range()</code> مقدار <code>stop</code> <strong>شامل نمی‌شود</strong>.</li><li>در <code>range(start, stop, step)</code> می‌توان مقدار شروع، پایان و گام را تعیین کرد.</li><li><code>step</code> منفی برای حرکت معکوس استفاده می‌شود.</li><li>برای اجرای یک کد تعداد مشخصی بار می‌توان از <code>for _ in range(n):</code> استفاده کرد.</li><li><code>enumerate()</code> برای دسترسی هم‌زمان به Index و Value بسیار کاربردی است.</li><li>ساختار رایج آن: <code>for index, value in enumerate(items):</code></li><li>با <code>start=</code> می‌توان شماره شروع <code>enumerate()</code> را تغییر داد.</li><li>اگر مسئله درباره <strong>پیمایش مجموعه</strong> باشد، معمولاً <code>for</code> انتخاب مناسبی است.</li><li>اگر مسئله درباره <strong>ادامه دادن تا برقرار بودن یک شرط</strong> باشد، معمولاً <code>while</code> مناسب‌تر است.</li></ul>
<hr class="lesson-divider">
<h2 class="lesson-title">🔄 Recall سریع</h2>
<p>بدون نگاه کردن به درس جواب بده:</p>
<ol><li>تفاوت اصلی <code>for</code> و <code>while</code> چیست؟</li><li>خروجی این کد چیست؟ <code>for i in range(4): print(i)</code></li><li>خروجی این کد چیست؟ <code>for i in range(2, 8, 2): print(i)</code></li><li>چرا <code>range(1, 5)</code> عدد 5 را شامل نمی‌شود؟</li><li><code>enumerate()</code> چه مشکلی را حل می‌کند؟</li><li>در این کد <code>index</code> و <code>name</code> چه مقادیری می‌گیرند؟ <code>names = ["Ali", "Sara"]<br>for index, name in enumerate(names):<br>    print(index, name)</code></li><li>برای حرکت از 10 به 1 در <code>range()</code> چه <code>step</code>ای لازم است؟</li></ol>
<p>پاسخ‌های اصلی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">for       → پیمایش / تکرار روی داده
while     → تکرار بر اساس شرط

range(4)  → 0, 1, 2, 3

range(2, 8, 2) → 2, 4, 6

enumerate() → Index + Value

حرکت معکوس → step = -1</div></div>

<h1 class="lesson-title section-scenario">سناریوی ترکیبی — نمایش نمرات دانش‌آموزان</h1>
<p>فرض کن می‌خواهیم یک برنامه ساده برای نمایش <strong>نمرات دانش‌آموزان</strong> بسازیم.</p>
<p>داده‌ها:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">scores = [18, 12, 20, 9, 15]</div></div>
<p>می‌خواهیم:</p>
<ol><li>شماره هر دانش‌آموز را نمایش دهیم.</li><li>نمره او را نمایش دهیم.</li><li>مشخص کنیم قبول شده یا مردود.</li></ol>
<p>قانون:</p>
<blockquote>نمره 10 یا بیشتر → قبول<br>نمره کمتر از 10 → مردود</blockquote>
<h3>مرحله ۱ — پیمایش لیست</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for score in scores:
    print(score)</div></div>
<p>اما هنوز شماره دانش‌آموز را نداریم.</p>
<h3>مرحله ۲ — استفاده از <code>enumerate()</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, score in enumerate(scores, start=1):
    print(index, score)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1 18
2 12
3 20
4 9
5 15</div></div>
<h3>مرحله ۳ — اضافه کردن شرط</h3>
<p>حالا <code>if</code> را اضافه می‌کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, score in enumerate(scores, start=1):

    if score >= 10:
        result = "Pass"
    else:
        result = "Fail"

    print(index, score, result)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1 18 Pass
2 12 Pass
3 20 Pass
4 9 Fail
5 15 Pass</div></div>
<h3>مرحله ۴ — تحلیل مدل ذهنی</h3>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">scores
   │
   ▼
enumerate()
   │
   ├── index
   └── score
        │
        ▼
     score >= 10 ?
       /       \
     True      False
      │           │
    Pass         Fail
       \         /
          print</div></div>
<p>اینجا چند مفهوم را کنار هم استفاده کردیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">List
  ↓
for
  ↓
enumerate()
  ↓
if / else
  ↓
Comparison
  ↓
print()</div></div>
<p>این دقیقاً همان مهارتی است که باید در این مرحله از Python داشته باشی:</p>
<blockquote>مسئله را به چند بخش ساده تقسیم کن و مفاهیمی که قبلاً یاد گرفته‌ای را کنار هم قرار بده.</blockquote>
<h3>یک تمرین برای خودت 🧑‍💻</h3>
<p>حالا همین سناریو را تغییر بده.</p>
<p>لیست زیر را در نظر بگیر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">scores = [7, 14, 19, 8, 11, 20]</div></div>
<p>برنامه‌ای بنویس که:</p>
<ul><li>شماره دانش‌آموز را نمایش دهد.</li><li>نمره را نمایش دهد.</li><li>برای نمره‌های <code>>= 10</code> بنویسد <code>Pass</code>.</li><li>برای نمره‌های <code>< 10</code> بنویسد <code>Fail</code>.</li></ul>
<p>سعی کن قبل از دیدن راه‌حل آن را خودت بنویسی.</p>
<h3>راه‌حل</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">scores = [7, 14, 19, 8, 11, 20]

for index, score in enumerate(scores, start=1):

    if score >= 10:
        result = "Pass"
    else:
        result = "Fail"

    print(index, score, result)</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1 7 Fail
2 14 Pass
3 19 Pass
4 8 Fail
5 11 Pass
6 20 Pass</div></div>

2</div></div>
<p>یعنی:</p>
<blockquote>در 3 فقط آن مورد را رد نکردیم؛ <strong>کل حلقه را متوقف کردیم.</strong></blockquote>
<p>اگر فقط بخواهیم 3 را رد کنیم، باید از <code>continue</code> استفاده کنیم.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">7. <code>continue</code> چیست؟ </h2>
<p><code>continue</code> یعنی:</p>
<blockquote><strong>تکرار فعلی را متوقف کن و برو سراغ تکرار بعدی.</strong></blockquote>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(1, 6):
    if number == 3:
        continue

    print(number)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
2
4
5</div></div>
<p>وقتی <code>number</code> برابر 3 شد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">continue</div></div>
<p>اجرا می‌شود.</p>
<p>در نتیجه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(number)</div></div>
<p>برای 3 اجرا نمی‌شود.</p>
<p>اما حلقه <strong>تمام نمی‌شود</strong>.</p>
<p>می‌رود سراغ:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">4</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">8. مدل ذهنی <code>continue</code></h2>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">       شروع تکرار
            ↓
        بررسی شرط
        /        \
     False       True
       │           │
       ▼           ▼
   ادامه کد      continue
       │           │
       ▼           │
 پایان تکرار       │
       │           │
       └─────┬─────┘
             ▼
        تکرار بعدی</div></div>
<p>تفاوت مهم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">break
↓
پایان کل حلقه


continue
↓
پایان فقط تکرار فعلی
↓
رفتن به تکرار بعد</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">9. مثال کاربردی <code>continue</code></h2>
<p>فرض کن می‌خواهیم اعداد 1 تا 10 را بررسی کنیم، ولی اعداد زوج را چاپ نکنیم.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(1, 11):

    if number % 2 == 0:
        continue

    print(number)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
3
5
7
9</div></div>
<p>بیایید یکی از تکرارها را بررسی کنیم.</p>
<p>وقتی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">number = 4</div></div>
<p>شرط:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">number % 2 == 0</div></div>
<p>برابر <code>True</code> می‌شود.</p>
<p>پس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">continue</div></div>
<p>اجرا می‌شود.</p>
<p>در نتیجه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(number)</div></div>
<p>اجرا نمی‌شود.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">10. <code>break</code> و <code>continue</code> را با هم مقایسه کنیم</h2>
<div class="table-wrap"><table><thead><tr><th>دستور</th><th>رفتار</th></tr></thead><tbody><tr><td><code>break</code></td><td>کل حلقه را متوقف می‌کند</td></tr><tr><td><code>continue</code></td><td>فقط تکرار فعلی را رد می‌کند</td></tr><tr><td><code>pass</code></td><td>هیچ کار خاصی انجام نمی‌دهد</td></tr></tbody></table></div>
<p>مثال:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt"># break
for i in range(5):
    if i == 2:
        break</div></div>
<p>حلقه در <code>2</code> تمام می‌شود.</p>
<p>اما:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt"># continue
for i in range(5):
    if i == 2:
        continue

    print(i)</div></div>
<p>فقط <code>2</code> چاپ نمی‌شود و حلقه ادامه دارد.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">11. <code>pass</code> چیست؟ </h2>
<p>حالا به سومین دستور می‌رسیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">pass</div></div>
<p><code>pass</code> یعنی:</p>
<blockquote><strong>فعلاً هیچ کاری انجام نده.</strong></blockquote>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(5):
    if number == 2:
        pass

    print(number)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0
1
2
3
4</div></div>
<p>چرا؟</p>
<p>چون <code>pass</code> حلقه را متوقف نمی‌کند.</p>
<p>همچنین تکرار را رد نمی‌کند.</p>
<p>فقط می‌گوید:</p>
<blockquote>اینجا فعلاً دستوری ندارم.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">12. تفاوت <code>pass</code> و <code>continue</code></h2>
<p>این دو را خیلی‌ها اشتباه می‌گیرند.</p>
<h3><code>pass</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(3):
    if number == 1:
        pass

    print(number)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0
1
2</div></div>
<p><code>pass</code> هیچ اثری روی ادامه اجرای حلقه ندارد.</p>
<h3><code>continue</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(3):
    if number == 1:
        continue

    print(number)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0
2</div></div>
<p>چون <code>continue</code> باعث می‌شود ادامه بدنه آن تکرار اجرا نشود.</p>
<h3> نکته امتحانی</h3>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">pass     → هیچ کاری نکن
continue → این تکرار را رد کن
break    → کل حلقه را تمام کن</div></div>
<p>این سه جمله را خوب به خاطر بسپار.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">13. چرا اصلاً <code>pass</code> داریم؟</h2>
<p>گاهی می‌خواهیم ساختار یک برنامه را بنویسیم، اما هنوز نمی‌دانیم داخل یک بخش چه کدی باید قرار بگیرد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in numbers:
    pass</div></div>
<p>Python انتظار دارد بعد از <code>:</code> یک دستور وجود داشته باشد.</p>
<p><code>pass</code> می‌تواند موقتاً آن جای خالی را پر کند.</p>
<p>در سطح Basic، مهم‌ترین کاربردی که باید بلد باشی همین است:</p>
<blockquote><code>pass</code> یعنی «فعلاً هیچ عملی انجام نده».</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">14. <code>break</code>، <code>continue</code> و <code>pass</code> در یک مثال</h2>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(1, 6):

    if number == 2:

    print(number)</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">number == 2</div></div>
<p>درست است.</p>
<p>پس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">continue</div></div>
<p>اجرا می‌شود.</p>
<p>2 چاپ نمی‌شود.</p>
<h3>عدد 3</h3>
<p>چاپ می‌شود:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">3</div></div>
<h3>عدد 4</h3>
<p>شرط:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">number == 4</div></div>
<p>درست است.</p>
<p>پس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">break</div></div>
<p>اجرا می‌شود.</p>
<p>حلقه تمام می‌شود.</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
3</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">15. حلقه‌های تو در تو — Nested Loops </h2>
<p>حالا یک قدم مهم‌تر.</p>
<p>گاهی داخل یک حلقه، حلقه دیگری قرار می‌دهیم.</p>
<p>به این ساختار می‌گوییم:</p>
<blockquote><strong>Nested Loop — حلقه تو‌در‌تو</strong></blockquote>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(3):
    for j in range(2):
        print(i, j)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0 0
0 1
1 0
1 1
2 0
2 1</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">16. حلقه تو در تو چگونه کار می‌کند؟</h2>
<p>این قسمت را خوب بفهم.</p>
<p>کد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(3):
    for j in range(2):
        print(i, j)</div></div>
<p>وقتی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">i = 0</div></div>
<p>حلقه داخلی کامل اجرا می‌شود:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">j = 0
j = 1</div></div>
<p>بعد می‌رویم سراغ:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">i = 1</div></div>
<p>و دوباره حلقه داخلی از اول اجرا می‌شود:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">j = 0
j = 1</div></div>
<p>و همین‌طور برای <code>i = 2</code>.</p>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">i = 0
 ├── j = 0
 └── j = 1

i = 1
 ├── j = 0
 └── j = 1

i = 2
 ├── j = 0
 └── j = 1</div></div>
<h3>نکته مهم </h3>
<blockquote>برای هر یک بار اجرای حلقه بیرونی، حلقه داخلی <strong>به‌طور کامل</strong> اجرا می‌شود.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">17. تعداد اجرا در Nested Loop</h2>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(3):
    for j in range(2):
        print(i, j)</div></div>
<p>حلقه بیرونی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">3 بار</div></div>
<p>حلقه داخلی برای هر بار:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">2 بار</div></div>
<p>پس <code>print</code> در مجموع:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">3 × 2 = 6</div></div>
<p>بار اجرا می‌شود.</p>
<p>این موضوع در سؤال‌های خروجی بسیار مهم است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">18. Nested Loop با شکل ساده</h2>
<p>یکی از کاربردهای رایج Nested Loop، ساخت الگوهاست.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for row in range(3):
    for col in range(4):
        print("*", end=" ")
    print()</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">* * * *
* * * *
* * * *</div></div>
<p>اینجا:</p>
<ul><li>حلقه بیرونی → ردیف‌ها</li><li>حلقه داخلی → ستون‌ها</li></ul>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Row 1 → * * * *
Row 2 → * * * *
Row 3 → * * * *</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">19. چرا <code>end=" "</code> استفاده کردیم؟</h2>
<p>به‌صورت پیش‌فرض:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print("*")</div></div>
<p>بعد از چاپ به خط بعد می‌رود.</p>
<p>اما:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print("*", end=" ")</div></div>
<p>بعد از چاپ، به خط بعد نمی‌رود و یک فاصله قرار می‌دهد.</p>
<p>پس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for col in range(4):
    print("*", end=" ")</div></div>
<p>باعث می‌شود ستاره‌ها در یک خط قرار بگیرند.</p>
<p>سپس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print()</div></div>
<p>ما را به خط بعد می‌برد.</p>
<p>این مثال همچنین مرور خوبی برای جلسه ۵ است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">20. <code>break</code> در Nested Loop</h2>
<p>در حلقه‌های تو‌در‌تو یک نکته مهم وجود دارد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(3):
    for j in range(3):

        if j == 1:
            break

        print(i, j)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0 0
1 0
2 0</div></div>
<p>چرا؟</p>
<p><code>break</code> داخل حلقه داخلی است.</p>
<p>پس:</p>
<blockquote>فقط <strong>حلقه داخلی</strong> را متوقف می‌کند.</blockquote>
<p>حلقه بیرونی همچنان ادامه می‌دهد.</p>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">حلقه بیرونی
   │
   ├── حلقه داخلی
   │      │
   │      └── break
   │            ↓

   │
   └── ادامه بیرونی</div></div>
<h3> نکته مهم</h3>

<hr class="lesson-divider">
<h2 class="lesson-title">21. <code>zip()</code> چیست؟ </h2>
<p>حالا فرض کن دو لیست داریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]
scores = [18, 20, 15]</div></div>
<p>می‌خواهیم نام و نمره مربوط به هر فرد را با هم چاپ کنیم.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(len(names)):
    print(names[i], scores[i])</div></div>
<p>اما راه ساده‌تر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for name, score in zip(names, scores):
    print(name, score)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali 18
Sara 20
Reza 15</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">22. مدل ذهنی <code>zip()</code></h2>
<p>دو لیست:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">names:  Ali    Sara    Reza
         │      │       │
         │      │       │
scores: 18      20      15</div></div>
<p><code>zip()</code> آن‌ها را جفت می‌کند:</p>

(Sara, 20)
(Reza, 15)</div></div>
<p>و سپس <code>for</code> روی این جفت‌ها حرکت می‌کند.</p>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for name, score in zip(names, scores):</div></div>
<p>در هر تکرار:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">name  ← نام
score ← نمره</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">23. <code>zip()</code> با سه لیست</h2>
<p><code>zip()</code> می‌تواند بیش از دو مجموعه را هم با هم پیمایش کند.</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali  + 20 + Tehran
Sara + 22 + Shiraz
Reza + 19 + Tabriz</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">24. اگر طول لیست‌ها برابر نباشد چه می‌شود؟</h2>
<p>این نکته مهم است.</p>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]
scores = [18, 20]</div></div>
<p>حالا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for name, score in zip(names, scores):
    print(name, score)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali 18
Sara 20</div></div>

<p>به زبان خیلی ساده:</p>

<h1 class="lesson-title section-troubleshoot">Troubleshooting</h1>
<h3>مشکل ۱ — چرا <code>break</code> فقط یک حلقه را متوقف کرد؟</h3>
<p>در:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(3):
    for j in range(3):

        if j == 1:
            break</div></div>
<p><code>break</code> داخل حلقه داخلی قرار دارد.</p>
<p>پس فقط همان حلقه داخلی متوقف می‌شود.</p>
<h3>مشکل ۲ — چرا <code>continue</code> باعث توقف کامل نشد؟</h3>
<p>چون وظیفه <code>continue</code> این نیست.</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">break
→ پایان حلقه

continue
→ تکرار فعلی تمام
→ تکرار بعدی</div></div>
<h3>مشکل ۳ — چرا <code>pass</code> هیچ تفاوتی در خروجی ایجاد نکرد؟</h3>
<p>چون <code>pass</code> عملاً کاری انجام نمی‌دهد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if condition:
    pass</div></div>
<p>بعد از آن Python اجرای برنامه را ادامه می‌دهد.</p>
<h3>مشکل ۴ — چرا <code>zip()</code> همه عناصر را نشان نداد؟</h3>
<p>طول مجموعه‌ها را بررسی کن.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]
scores = [18, 20]</div></div>
<p>نتیجه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali 18
Sara 20</div></div>
<p>چون <code>scores</code> فقط دو عنصر دارد.</p>
<h3>مشکل ۵ — چرا Nested Loop تعداد زیادی خروجی ایجاد کرد؟</h3>
<p>به تعداد اجراها دقت کن.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(4):
    for j in range(3):
        print(i, j)</div></div>
<p>حلقه بیرونی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">4 بار</div></div>
<p>حلقه داخلی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">3 بار برای هر بار</div></div>
<p>پس:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">4 × 3 = 12</div></div>
<p>بار <code>print()</code> اجرا می‌شود.</p>
<hr class="lesson-divider">
<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li><code>break</code> کل حلقه فعلی را متوقف می‌کند.</li><li><code>continue</code> فقط تکرار فعلی را رد می‌کند.</li><li><code>pass</code> هیچ عملیات خاصی انجام نمی‌دهد.</li><li>در <code>Nested Loop</code>، حلقه داخلی برای هر بار اجرای حلقه بیرونی کامل اجرا می‌شود.</li><li><code>break</code> داخل حلقه داخلی، به‌طور عادی فقط همان حلقه داخلی را متوقف می‌کند.</li><li><code>zip()</code> چند مجموعه را برای پیمایش هم‌زمان کنار هم قرار می‌دهد.</li><li>در حالت معمول، <code>zip()</code> تا کوتاه‌ترین مجموعه ادامه پیدا می‌کند.</li><li>الگوی مهم <code>zip()</code>: <code>for a, b in zip(list1, list2):</code></li><li>الگوی مهم <code>enumerate()</code> که جلسه قبل یاد گرفتیم: <code>for index, value in enumerate(items):</code></li><li>تفاوت این دو را حفظ کن: <code>enumerate → Index + Value یک مجموعه</code> و <code>zip → Valueهای چند مجموعه</code></li></ul>
<hr class="lesson-divider">
<h2 class="lesson-title">🔄 Recall سریع</h2>
<p>بدون نگاه کردن به درس جواب بده:</p>
<ol><li><code>break</code> چه کاری انجام می‌دهد؟</li><li><code>continue</code> چه تفاوتی با <code>break</code> دارد؟</li><li><code>pass</code> چه تفاوتی با <code>continue</code> دارد؟</li><li>خروجی چیست؟ <code>for i in range(5):<br>    if i == 3:<br>        break<br>    print(i)</code></li><li>خروجی چیست؟ <code>for i in range(5):<br>    if i == 3:<br>        continue<br>    print(i)</code></li><li>در Nested Loop زیر <code>print</code> چند بار اجرا می‌شود؟ <code>for i in range(4):<br>    for j in range(2):<br>        print(i, j)</code></li><li><code>zip()</code> چه زمانی مفید است؟</li><li>اگر دو لیست 5 و 3 عنصر داشته باشند، <code>zip()</code> چند جفت ایجاد می‌کند؟</li></ol>
<p>پاسخ‌های کلیدی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">break      → پایان حلقه
continue   → رد تکرار فعلی
pass       → هیچ کاری نکن

Nested Loop:
4 × 2 = 8

zip:
تا کوتاه‌ترین مجموعه</div></div>

<h1 class="lesson-title section-scenario">سناریوی ترکیبی</h1>

 ↓
for
 ↓
if

Comparison</div></div>
<h3>مرحله ۱ — پیمایش هم‌زمان</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for name, score in zip(names, scores):
    print(name, score)</div></div>
<h3>مرحله ۲ — رد کردن نمره‌های کمتر از 5</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for name, score in zip(names, scores):

    if score < 5:

<p>در اینجا <code>Omid</code> با نمره 4 رد می‌شود.</p>
<h3>مرحله ۳ — توقف در نمره 20</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for name, score in zip(names, scores):

    if score < 5:
        continue

<h3>مرحله ۴ — اضافه کردن وضعیت قبولی</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza", "Mina", "Omid"]
scores = [18, 7, 15, 20, 4]

for name, score in zip(names, scores):

    if score < 5:

    if score == 20:

        print(name, score, "Fail")</div></div>

<p>و شرط:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if score == 20:

<p>باعث شد کل حلقه متوقف شود.</p>
<p><code>Omid</code> هم قبل از رسیدن به این مرحله به خاطر:</p>

<p>با <code>continue</code> رد می‌شد؛ اما چون <code>break</code> در <code>Mina</code> اجرا شده، اصلاً به <code>Omid</code> نمی‌رسیم.</p>
<h3>مدل ذهنی سناریو</h3>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">          names + scores

<p>این سناریو نشان می‌دهد که ابزارهای ساده‌ای که یاد گرفته‌ایم می‌توانند کنار هم یک منطق نسبتاً واقعی بسازند.</p>

<h2 class="lesson-title">🎯 جمع‌بندی جلسه</h2>
<p>تا اینجا ابزارهای کنترل حلقه‌ها را کامل‌تر کردیم.</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">                 کنترل حلقه
                     │
       ┌─────────────┼─────────────┐

<p>اگر بخواهیم همه چیز را در چند جمله خلاصه کنیم:</p>

say_hello()</div></div>

هنوز اجرا نشده</div></div>

<p>حالا باید بین <strong>Parameter</strong> و <strong>Argument</strong> تفاوت بگذاریم.</p>

<p>تابع قبلی:</p>

<h1><code>return</code></h1>
<hr class="lesson-divider">
<h2 class="lesson-title">16. <code>return</code> چیست؟ </h2>
<p><code>return</code> یعنی:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def square(number):

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = square(5)

print(result)</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">25</div></div>

25

result</div></div>

<h2 class="lesson-title">17. تفاوت <code>print</code> و <code>return</code> </h2>

<h3>با <code>print</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def square(number):
    print(number * number)</div></div>
<p>وظیفه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">نتیجه را نمایش بده</div></div>
<h3>با <code>return</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def square(number):
    return number * number</div></div>
<p>وظیفه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">نتیجه را برگردان</div></div>
<p>جدول:</p>
<div class="table-wrap"><table><thead><tr><th><code>print()</code></th><th><code>return</code></th></tr></thead><tbody><tr><td>نتیجه را نمایش می‌دهد</td><td>نتیجه را از تابع برمی‌گرداند</td></tr><tr><td>برای نمایش مناسب است</td><td>برای استفاده مجدد در برنامه مناسب است</td></tr><tr><td>خودش نتیجه را برای ادامه برنامه برنمی‌گرداند</td><td>مقدار را به محل فراخوانی برمی‌گرداند</td></tr></tbody></table></div>
<hr class="lesson-divider">
<h2 class="lesson-title">18. یک مثال مهم برای تفاوت <code>print</code> و <code>return</code></h2>
<p>تابع اول:</p>

<p>حالا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = add(3, 4)
print(result)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">7
None</div></div>
<p>چرا؟</p>
<p>تابع <code>7</code> را چاپ کرد، اما چیزی <code>return</code> نکرد.</p>
<p>در نتیجه مقدار برگشتی تابع:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">None</div></div>
<p>است.</p>
<p>حالا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):
    return a + b</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = add(3, 4)
print(result)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">7</div></div>

<h3> قانون طلایی</h3>
<p>اگر می‌خواهی <strong>نتیجه را فقط نشان بدهی</strong>:</p>

<p>اگر می‌خواهی <strong>نتیجه را تحویل بخش دیگری از برنامه بدهی</strong>:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">return</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">19. بعد از <code>return</code> چه اتفاقی می‌افتد؟</h2>
<p>وقتی Python به <code>return</code> می‌رسد:</p>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def test():

    print(&quot;B&quot;)</div></div>
<p>فراخوانی:</p>

<p><code>B</code> چاپ نمی‌شود.</p>
<p>چون:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">return</div></div>
<p>باعث خروج از تابع می‌شود.</p>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">شروع Function
      ↓
اجرای کد
      ↓
   return
      ↓
خروج از Function</div></div>

<h1 class="lesson-title section-troubleshoot">Troubleshooting</h1>
<h3>مشکل ۱ — تابع اجرا نمی‌شود</h3>
<p>بررسی کن که آن را Call کرده باشی:</p>

<h3>مشکل ۲ — <code>None</code> دریافت می‌کنم</h3>

<h3>مشکل ۳ — <code>SyntaxError</code></h3>
<p>تعریف تابع را بررسی کن:</p>

<h3>مشکل ۴ — <code>IndentationError</code></h3>

    return a + b</div></div>
<h3>مشکل ۵ — تعداد آرگومان‌ها اشتباه است</h3>
<p>اگر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">add(2, 3)</div></div>

<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li>تابع با <code>def</code> تعریف می‌شود.</li><li>تعریف تابع به‌تنهایی باعث اجرای آن نمی‌شود.</li><li>برای اجرای تابع از Function Call استفاده می‌کنیم: <code>say_hello()</code></li><li><code>Parameter</code> در زمان تعریف تابع مشخص می‌شود.</li><li><code>Argument</code> هنگام فراخوانی تابع ارسال می‌شود.</li><li>تعداد و ترتیب آرگومان‌ها مهم است.</li><li><code>return</code> مقدار را از تابع برمی‌گرداند.</li><li><code>return</code> باعث پایان اجرای همان تابع می‌شود.</li><li><code>print()</code> برای نمایش است.</li><li><code>return</code> برای تحویل نتیجه به بخش دیگر برنامه است.</li><li>اگر تابع چیزی <code>return</code> نکند، مقدار برگشتی آن معمولاً <code>None</code> است.</li><li>یک تابع بهتر است یک وظیفه مشخص داشته باشد.</li><li>Functionها می‌توانند با شرط‌ها، حلقه‌ها و سایر مفاهیم قبلی ترکیب شوند.</li></ul>

<h1 class="lesson-title section-scenario">سناریوی ترکیبی</h1>
<p>فرض کن می‌خواهیم یک برنامه ساده برای فروشگاه بنویسیم.</p>
<p>قیمت محصول و تعداد خرید را داریم و می‌خواهیم مبلغ کل را محاسبه کنیم.</p>
<p>همچنین اگر مبلغ خرید حداقل 500 باشد، 10٪ تخفیف بدهیم.</p>
<p>در این مسئله از چند مفهوم استفاده می‌کنیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Function
   +
Parameter
   +
return
   +
if
   +
Arithmetic</div></div>
<h3>مرحله ۱ — محاسبه مبلغ اولیه</h3>
<p>تابعی می‌سازیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_total(price, quantity):
    return price * quantity</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">total = calculate_total(200, 3)

print(total)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">600</div></div>
<h3>مرحله ۲ — محاسبه تخفیف</h3>
<p>حالا یک تابع دیگر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_discount(total):

    if total >= 500:
        return total * 0.10
    else:
        return 0</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">discount = calculate_discount(600)

print(discount)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">60.0</div></div>
<h3>مرحله ۳ — محاسبه مبلغ نهایی</h3>
<p>حالا می‌توانیم از نتیجه تابع قبلی استفاده کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">final_price = total - discount

print(final_price)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">540.0</div></div>
<h3>مرحله ۴ — نسخه کامل</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_total(price, quantity):
    return price * quantity


def calculate_discount(total):

    if total >= 500:
        return total * 0.10
    else:
        return 0


price = 200
quantity = 3

total = calculate_total(price, quantity)
discount = calculate_discount(total)

final_price = total - discount

print(&quot;Total:&quot;, total)
print(&quot;Discount:&quot;, discount)
print(&quot;Final price:&quot;, final_price)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Total: 600
Discount: 60.0
Final price: 540.0</div></div>
<h3>مدل ذهنی سناریو</h3>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">price + quantity
       │
       ▼
calculate_total()
       │
       ▼
     total
       │
       ▼
calculate_discount()
       │
       ▼
   discount
       │
       ▼
total - discount
       │
       ▼
 final_price</div></div>
<p>نکته مهم اینجاست که Functionها باعث شدند برنامه را به قسمت‌های کوچک‌تر تقسیم کنیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">calculate_total
        ↓
محاسبه مبلغ

calculate_discount
        ↓
محاسبه تخفیف

بخش اصلی برنامه
        ↓
ترکیب نتایج</div></div>
<p>این دقیقاً یکی از دلایل اصلی استفاده از Function در برنامه‌نویسی است.</p>

<h2 class="lesson-title">🎯 جمع‌بندی جلسه</h2>
<p>در این جلسه از یک مشکل ساده شروع کردیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">کدهای تکراری
     ↓
سازمان‌دهی بهتر
     ↓
Function</div></div>
<p>سپس یاد گرفتیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">def
 ↓
تعریف تابع
 ↓
Parameter
 ↓
دریافت ورودی
 ↓
Processing
 ↓
return
 ↓
برگرداندن نتیجه</div></div>
<p>مهم‌ترین الگوی جلسه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def function_name(parameter):
    # processing
    return result</div></div>
<p>و هنگام استفاده:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = function_name(argument)</div></div>

«نتیجه را نشان بده»

return
↓

<h2 class="lesson-title">1. مرور جلسه قبل</h2>
<p>جلسه قبل با این الگو آشنا شدیم:</p>

<h2 class="lesson-title">2. چرا انواع Argument مهم هستند؟ </h2>
<p>فرض کن تابع زیر را داریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def introduce(name, age):

<p>می‌توانیم آن را این‌طور صدا بزنیم:</p>

<p>اما Python روش‌های دیگری هم برای ارسال اطلاعات به Function دارد.</p>
<p>این موضوع زمانی مهم می‌شود که:</p>
<ul><li>تعداد پارامترها زیاد شود.</li><li>بخواهیم کد خواناتر باشد.</li><li>بخواهیم بعضی ورودی‌ها مقدار پیش‌فرض داشته باشند.</li></ul>
<p>در این جلسه مهم‌ترین روش‌های Basic را یاد می‌گیریم.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">3. Positional Argument </h2>
<p>تا اینجا بیشتر از این روش استفاده کردیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def introduce(name, age):
    print(name)
    print(age)

introduce("Ali", 20)</div></div>
<p>در اینجا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">"Ali" → name
20     → age</div></div>
<p>یعنی جایگاه Argument تعیین می‌کند به کدام Parameter منتقل شود.</p>
<p>به این نوع می‌گوییم:</p>
<blockquote><strong>Positional Argument</strong></blockquote>
<p>چون بر اساس <strong>موقعیت</strong> کار می‌کند.</p>
<h3>مثال</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def subtract(a, b):
    return a - b

print(subtract(10, 3))</div></div>
<p>اینجا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">a = 10
b = 3</div></div>
<p>پس:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">10 - 3 = 7</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">7</div></div>
<p>اما اگر بنویسیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(subtract(3, 10))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">-7</div></div>
<p>چون جای Argumentها عوض شده است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">4. Keyword Argument </h2>
<p>در روش Keyword، به جای اینکه فقط موقعیت مقدار را مشخص کنیم، <strong>نام Parameter</strong> را هم مشخص می‌کنیم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def introduce(name, age):
    print("Name:", name)
    print("Age:", age)</div></div>
<p>می‌توانیم بنویسیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">introduce(name="Ali", age=20)</div></div>
<p>اینجا کاملاً مشخص است:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">name → "Ali"
age  → 20</div></div>
<p>حتی می‌توانیم ترتیب را تغییر دهیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">introduce(age=20, name="Ali")</div></div>
<p>خروجی همچنان:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Name: Ali
Age: 20</div></div>
<p>چون Python از نام Parameterها استفاده کرده است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">5. Positional در مقابل Keyword</h2>
<div class="table-wrap"><table><thead><tr><th>نوع</th><th>مثال</th><th>وابسته به ترتیب؟</th></tr></thead><tbody><tr><td>Positional</td><td><code>add(10, 20)</code></td><td>بله </td></tr><tr><td>Keyword</td><td><code>add(a=10, b=20)</code></td><td>نه </td></tr></tbody></table></div>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Positional
10 → پارامتر اول
20 → پارامتر دوم


Keyword
a=10 → پارامتر a
b=20 → پارامتر b</div></div>

<h2 class="lesson-title">6. ترکیب Positional و Keyword</h2>
<p>می‌توانیم این دو روش را با هم استفاده کنیم.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def introduce(name, age):
    print(name, age)

introduce("Ali", age=20)</div></div>
<p>این کد درست است.</p>
<p>اما یک قانون مهم وجود دارد:</p>
<blockquote><strong>Argumentهای Positional باید قبل از Keyword Argumentها بیایند.</strong></blockquote>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">introduce("Ali", age=20)</div></div>
<p>درست است.</p>
<p>ولی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">introduce(name="Ali", 20)</div></div>
<p>اشتباه است.</p>
<p>چون بعد از Keyword Argument نمی‌توانیم یک Positional Argument معمولی قرار دهیم.</p>
<h3> نکته امتحانی</h3>
<p>ترتیب مجاز:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Positional → Keyword</div></div>
<p>نه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Keyword → Positional</div></div>

<h2 class="lesson-title">7. Default Parameter </h2>
<p>حالا به یک مشکل واقعی برسیم.</p>

greet("Sara")</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def greet(name="Guest"):

<h2 class="lesson-title">8. Default Parameter چگونه کار می‌کند؟</h2>
<p>وقتی تابع را این‌طور تعریف می‌کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def greet(name="Guest"):</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">اگر name داده شد
      ↓
از مقدار ارسال‌شده استفاده کن

اگر name داده نشد
      ↓
از "Guest" استفاده کن</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">greet("Reza")</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">name = "Reza"</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">greet()</div></div>

<h2 class="lesson-title">9. مثال کاربردی Default Parameter</h2>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(calculate_price(100))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">100.0</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(calculate_price(100, 20))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">80.0</div></div>

<p>در مثال:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_price(price, discount=0):</div></div>
<p>داریم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">price
 ↓
پارامتر اجباری

 ↓
پارامتر دارای مقدار پیش‌فرض</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">calculate_price()</div></div>

<h2 class="lesson-title">11. یک قانون مهم در تعریف Parameterها</h2>
<p>وقتی پارامتر Default داریم، پارامترهای معمولی باید قبل از آن قرار بگیرند.</p>

Language: French</div></div>

<h2 class="lesson-title">14. Scope یعنی چه؟ </h2>
<p>Scope یعنی:</p>
<blockquote><strong>محدوده‌ای که یک متغیر در آن قابل دسترسی است.</strong></blockquote>
<p>فعلاً در Python Basic با دو مفهوم اصلی کار داریم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Local Scope
Global Scope</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">15. Local Variable</h2>
<p>اگر متغیری داخل Function تعریف شود، در سطح Basic آن را یک <strong>Local Variable</strong> در نظر می‌گیریم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate():
    result = 100
    print(result)</div></div>
<p>اینجا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">result</div></div>
<p>داخل تابع ساخته شده است.</p>
<p>پس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">calculate()</div></div>
<p>درست است.</p>
<p>ولی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(result)</div></div>
<p>خارج تابع قابل استفاده نیست.</p>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">                 برنامه
        ┌─────────────────────┐
        │                     │
        │   Function          │
        │   ┌─────────────┐   │
        │   │ result     │   │
        │   └─────────────┘   │
        │                     │
        └─────────────────────┘

result فقط در محدوده خودش تعریف شده</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">16. Global Variable</h2>
<p>اگر متغیر خارج Function تعریف شود، در سطح Basic می‌توانیم آن را <strong>Global Variable</strong> در نظر بگیریم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name = "Ali"

def say_hello():
    print(name)

say_hello()</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali</div></div>
<p>تابع توانسته مقدار <code>name</code> را بخواند.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">17. یک نکته مهم درباره Global Variable</h2>
<p>اگر فقط می‌خواهیم مقدار Global Variable را <strong>بخوانیم</strong>، معمولاً می‌توانیم آن را داخل تابع استفاده کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">score = 20

def show_score():
    print(score)

show_score()</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">20</div></div>
<p>اما تغییر دادن Global Variable داستان متفاوتی دارد.</p>
<p>برای Python Basic فعلاً اصل مهم‌تر این است:</p>
<blockquote>تا حد امکان اطلاعات را از طریق Parameter به Function بده و نتیجه را با <code>return</code> برگردان.</blockquote>
<p>این روش برنامه را قابل‌فهم‌تر می‌کند.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">18. چرا بهتر است زیاد به Global Variable وابسته نباشیم؟</h2>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">score = 20

def check_score():

        return "Pass"
    else:
        return "Fail"</div></div>
<p>این تابع به یک متغیر بیرونی وابسته است.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def check_score(score):
    if score >= 10:
        return "Pass"
    else:
        return "Fail"</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = check_score(20)</div></div>
<p>این نسخه بهتر است، چون تابع ورودی خودش را دریافت می‌کند.</p>
<p>مدل:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Global dependency
     ↓
تابع به بیرون وابسته است


Parameter
     ↓
تابع ورودی خودش را دریافت می‌کند</div></div>

<h2 class="lesson-title">19. یک Function خوب: Input → Process → Output </h2>
<p>یکی از بهترین مدل‌های ذهنی برای طراحی تابع:</p>

         ↓
     Function
         ↓
     Processing
         ↓
       Output</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_average(score1, score2):

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">score1
score2</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">جمع → تقسیم بر 2</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">average</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">20. چرا <code>return</code> بهتر از وابستگی به <code>print</code> است؟</h2>
<p>تابع:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_average(a, b):
    return (a + b) / 2</div></div>
<p>انعطاف‌پذیر است.</p>
<p>می‌توانیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">average = calculate_average(10, 20)</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(calculate_average(10, 20))</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if calculate_average(10, 20) >= 15:

<p>اما اگر تابع فقط:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_average(a, b):
    print((a + b) / 2)</div></div>
<p>باشد، استفاده از نتیجه در بخش‌های دیگر سخت می‌شود.</p>

بخش اصلی برنامه → print</div></div>

<h2 class="lesson-title">21. Functionها می‌توانند همدیگر را صدا بزنند</h2>

    ↓
return
    ↓
Function B
    ↓
return</div></div>

محاسبه تخفیف
محاسبه مالیات
نمایش نتیجه</div></div>

<h2 class="lesson-title">23. یک نکته مهم درباره Scope و Parameter</h2>
<p>به این کد نگاه کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def greet(name):

├── name

<h2 class="lesson-title">24. نام یک متغیر داخل و خارج تابع</h2>
<p>ممکن است یک نام مشابه در دو Scope داشته باشیم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name = "Ali"

def show_name():

show_name()
print(name)</div></div>

<p>چون:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">داخل Function
name = "Sara"

خارج Function
name = "Ali"</div></div>
<p>این دو متغیر در دو محدوده متفاوت هستند.</p>
<h3> نکته امتحانی</h3>
<p>وجود یک نام مشابه به این معنی نیست که حتماً یک متغیر واحد داریم.</p>

<hr class="lesson-divider">
<h2 class="lesson-title">25. پارامتر هم داخل Scope تابع است</h2>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def square(number):

number = 5

25</div></div>

<h2 class="lesson-title">26. طراحی Function با نام مناسب</h2>
<p>Function خوب فقط Functionای نیست که درست اجرا شود؛ باید خوانا هم باشد.</p>

<h3>قانون ساده:</h3>
<blockquote>نام Function باید تا حد ممکن نشان دهد Function چه کاری انجام می‌دهد.</blockquote>

<p>درست:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def test(a, b=10):
    ...</div></div>
<h3>مشکل ۳ — متغیر داخل Function بیرون آن پیدا نمی‌شود</h3>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def test():
    result = 10

print(result)</div></div>
<p><code>result</code> داخل Function تعریف شده و بیرون آن قابل دسترسی مستقیم نیست.</p>
<p>اگر می‌خواهی نتیجه را بیرون استفاده کنی، از <code>return</code> استفاده کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def test():
    result = 10
    return result


result = test()
print(result)</div></div>
<h3>مشکل ۴ — تابع به Global Variable وابسته شده</h3>
<p>این روش ممکن است کار کند:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">score = 20

def check():
    return score >= 10</div></div>
<p>اما طراحی بهتر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def check(score):
    return score >= 10


print(check(20))</div></div>
<p>تابع دوم مستقل‌تر و قابل استفاده مجددتر است.</p>
<h3>مشکل ۵ — انتظار داریم <code>print</code> نتیجه را برگرداند</h3>
<p>این:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):
    print(a + b)</div></div>
<p>برای نمایش مناسب است.</p>
<p>ولی اگر بخواهی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = add(2, 3)</div></div>
<p>و <code>result</code> برابر <code>5</code> شود، باید:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):
    return a + b</div></div>
<p>بنویسی.</p>
<hr class="lesson-divider">
<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li><strong>Positional Argument</strong> بر اساس ترتیب ارسال می‌شود.</li><li><strong>Keyword Argument</strong> با نام Parameter ارسال می‌شود.</li><li>Positional باید قبل از Keyword قرار بگیرد.</li><li>Parameter دارای مقدار پیش‌فرض را <strong>Default Parameter</strong> می‌گوییم.</li><li>پارامترهای اجباری باید قبل از Default Parameterها قرار بگیرند.</li><li>Scope یعنی محدوده دسترسی یک متغیر.</li><li>متغیر تعریف‌شده داخل Function معمولاً Local است.</li><li>متغیر تعریف‌شده خارج Function می‌تواند Global باشد.</li><li>Function می‌تواند مقدار Global را بخواند، اما بهتر است برای طراحی تمیز، وابستگی غیرضروری به Globalها نداشته باشیم.</li><li>برای انتقال اطلاعات به Function از Parameter استفاده کن.</li><li>برای گرفتن نتیجه از Function از <code>return</code> استفاده کن.</li><li>Function بهتر است یک وظیفه مشخص داشته باشد.</li><li>نام مناسب Function و Parameter خوانایی کد را بالا می‌برد.</li><li>خروجی یک Function می‌تواند ورودی Function دیگری باشد.</li></ul>
<hr class="lesson-divider">
<h2 class="lesson-title">🔄 Recall سریع</h2>
<ol><li>این دو چه تفاوتی دارند؟ <code>add(10, 20)</code> و <code>add(a=10, b=20)</code></li><li>مقدار پیش‌فرض کجاست؟ <code>def greet(name="Guest"):</code></li><li>آیا این درست است؟ <code>def test(a=10, b): ...</code></li><li>Scope چیست؟</li><li>خروجی چیست؟ <code>x = 10<br>def test():<br>    x = 20<br>    print(x)<br>test()<br>print(x)</code></li><li>برای انتقال نتیجه Function به بیرون از آن معمولاً از چه چیزی استفاده می‌کنیم؟</li></ol>

<h1 class="lesson-title section-scenario">سناریوی ترکیبی</h1>
<p>فرض کن می‌خواهیم یک سیستم ساده برای بررسی نمرات دانش‌آموز بسازیم.</p>
<p>اطلاعات:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">نام دانش‌آموز
نمره اول
نمره دوم</div></div>
<p>می‌خواهیم:</p>
<ol><li>میانگین را محاسبه کنیم.</li><li>قبولی را بررسی کنیم.</li><li>گزارش نهایی نمایش دهیم.</li></ol>
<p>اینجا سه Function مناسب داریم.</p>
<h3>مرحله ۱ — محاسبه میانگین</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_average(score1, score2):
    return (score1 + score2) / 2</div></div>
<h3>مرحله ۲ — بررسی وضعیت</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def check_result(average):
    if average >= 10:
        return "Pass"

    return "Fail"</div></div>
<h3>مرحله ۳ — ساخت گزارش</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def create_report(name, average, result):
    return f"{name}: {average} - {result}"</div></div>
<h3>مرحله ۴ — ترکیب Functionها</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name = "Ali"
score1 = 18
score2 = 16

average = calculate_average(score1, score2)
result = check_result(average)

report = create_report(name, average, result)

print(report)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali: 17.0 - Pass</div></div>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">score1 + score2
       ↓
calculate_average()
       ↓
   average
       ↓
check_result()
       ↓
   Pass/Fail
       ↓
create_report()
       ↓
    report</div></div>
<h3>چرا این طراحی خوب است؟</h3>
<p>چون هر Function یک کار مشخص انجام می‌دهد:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">calculate_average
        ↓
محاسبه میانگین

check_result
        ↓
بررسی وضعیت

create_report
        ↓
ساخت گزارش</div></div>
<p>و هیچ Function مجبور نیست همه کارها را به‌تنهایی انجام دهد.</p>
<h3>🧪 بخش کدنویسی برای تو</h3>
<p>حالا همین سناریو را کمی تغییر بده:</p>
<p>برنامه‌ای بنویس که:</p>
<ul><li>سه نمره بگیرد.</li><li>میانگین سه نمره را محاسبه کند.</li><li>اگر میانگین حداقل <code>12</code> بود <code>"Pass"</code> و در غیر این صورت <code>"Fail"</code> برگرداند.</li><li>در پایان نام دانش‌آموز، میانگین و وضعیت را چاپ کند.</li></ul>
<h3>یک راه‌حل ممکن</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_average(score1, score2, score3):

score3 = float(input("Score 3: "))

average = calculate_average(score1, score2, score3)
result = check_result(average)

print("Name:", name)
print("Average:", average)
print("Result:", result)</div></div>

<h1 class="lesson-title section-test">تست پایانی — ۷ سؤال</h1>
<p>هر سؤال را پاسخ بده و بعد گزینه‌ات را انتخاب کن تا پاسخ و توضیح همان سؤال نمایش داده شود.</p>
<div class="quiz-card"><p>❓ سؤال ۱ — Positional: خروجی چیست؟ <br><code>def subtract(a, b): return a - b<br>print(subtract(10, 3))</code></p><div class="quiz-options"><button onclick="selectOption(this)">الف) <code>3</code></button><button onclick="selectOption(this)">ب) <code>7</code></button><button onclick="selectOption(this)">ج) <code>-7</code></button><button onclick="selectOption(this)">د) <code>13</code></button></div><div class="quiz-answer"><strong>✅ پاسخ: ب</strong><br>در Positional Argument، <code>10</code> به <code>a</code> و <code>3</code> به <code>b</code> می‌رسد.</div></div>
<div class="quiz-card"><p>❓ سؤال ۲ — Keyword Argument: کدام فراخوانی با تعریف زیر صحیح است؟ <br><code>def introduce(name, age): print(name, age)</code></p><div class="quiz-options"><button onclick="selectOption(this)">الف) <code>introduce(age=20, name="Ali")</code></button><button onclick="selectOption(this)">ب) <code>introduce(name="Ali", 20)</code></button><button onclick="selectOption(this)">ج) <code>introduce(age, name)</code></button><button onclick="selectOption(this)">د) <code>introduce(name="Ali", age)</code></button></div><div class="quiz-answer"><strong>✅ پاسخ: الف</strong><br>Keyword Argumentها می‌توانند جابه‌جا شوند، اما در گزینه‌های B و D یک Positional بعد از Keyword آمده است.</div></div>
<div class="quiz-card"><p>❓ سؤال ۳ — Default Parameter: خروجی چیست؟ <br><code>def greet(name="Guest"): return "Hello " + name<br>print(greet())</code></p><div class="quiz-options"><button onclick="selectOption(this)">الف) <code>Hello</code></button><button onclick="selectOption(this)">ب) <code>Guest</code></button><button onclick="selectOption(this)">ج) <code>Hello Guest</code></button><button onclick="selectOption(this)">د) خطا</button></div><div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br>چون Argument ارسال نشده، مقدار پیش‌فرض <code>"Guest"</code> استفاده می‌شود.</div></div>

        const allSections = [];
        course.forEach((ch, chIdx) => {
            ch.sections.forEach((sec, secIdx) => {
                allSections.push(Object.assign({}, sec, {
                    chapterId: ch.id,

            if (chapterExercises[ch.id]) {

        function buildTOC() {
            const toc = document.getElementById('tocNav');
            toc.innerHTML = '';

            course.forEach((ch, idx) => {
                const details = document.createElement('details');
                details.className = 'toc-chapter';
                if (idx === 0) details.open = true;

                const summary = document.createElement('summary');

                '</span>';
                details.appendChild(summary);

                const ul = document.createElement('ul');

                ch.sections.forEach(sec => {

                    a.addEventListener('click', function(e) {
                        e.preventDefault();

                        if (index !== -1) showSection(index);

        // ============================================================
        // Syntax Highlighting for static code blocks (Highlight.js)
        // ============================================================
        function highlightCodeBlocks(root) {
            if (typeof hljs === 'undefined') return;
            const scope = root || document;
            const blocks = scope.querySelectorAll('.code-block:not(.hljs-processed)');
            blocks.forEach(function(block) {
                if (block.querySelector('pre code')) {
                    block.classList.add('hljs-processed');
                    return;
                }
                const codeText = block.textContent;
                if (!codeText || !codeText.trim()) {
                    block.classList.add('hljs-processed');
                    return;
                }
                // Detect label from parent container to decide language
                let lang = 'python';
                const container = block.closest('.code-container');
                if (container) {
                    const label = container.querySelector('.code-label');
                    if (label) {
                        const t = (label.textContent || '').trim().toLowerCase();
                        // Only pure output / non-code labels stay unhighlighted (plaintext)
                        if (t === 'output' || t === 'خروجی' || t === 'اطلاعات' || t === 'مثال') {
                            lang = 'plaintext';
                        }
                    }
                }
                const isNoPrompt = block.classList.contains('no-prompt');
                const pre = document.createElement('pre');
                pre.className = 'hljs';
                const code = document.createElement('code');
                code.className = 'language-' + lang;
                code.textContent = codeText;
                pre.appendChild(code);
                block.textContent = '';
                block.appendChild(pre);
                block.classList.add('hljs-processed');
                if (isNoPrompt) block.classList.add('no-prompt');
                try {
                    hljs.highlightElement(code);
                } catch (e) {
                    console.warn('Highlight error:', e);
                }
            });
            scope.querySelectorAll('pre code[class*="language-"]:not(.hljs)').forEach(function(el) {
                try { hljs.highlightElement(el); } catch (e) {}
            });
        }

        function buildSections() {
            const main = document.getElementById('mainContent');
            main.innerHTML = '';

            allSections.forEach((sec, idx) => {
                const div = document.createElement('div');
                div.className = 'section' + (idx === 0 ? ' active' : '');
                div.id = sec.id;

                const isFirst = idx === 0;
                const isLast = idx === allSections.length - 1;

                let body = '';

                if (sec.isExercise && chapterExercises[sec.chapterId]) {
                    body = `

                        ${chapterExercises[sec.chapterId]}

                    body = richContent[sec.id];

                                <div class="meta">${sec.chapterTitle} · بخش ${sec.sectionIndex + 1} از ${sec.totalInChapter}</div>

                            <p style="font-size:0.9rem;margin-top:6px;opacity:0.8;">${sec.chapterTitle} — ${sec.title}</p>
                        </div>
                    `;
                }

                body += `
                    <div class="nav-buttons">
                        <button class="nav-btn" ${isFirst ? 'disabled' : ''} onclick="goToPrev()">
                            ${isFirst ? 'بخش قبلی' : '<i class="fas fa-arrow-right"></i> بخش قبلی'}
                        </button>
                        <button class="nav-btn" ${isLast ? 'disabled' : ''} onclick="goToNext()">
                            ${isLast ? 'پایان' : 'بخش بعدی <i class="fas fa-arrow-left"></i>'}
                        </button>
                    </div>
                `;

                div.innerHTML = body;
                main.appendChild(div);
            });
        }

        // ============================================================
        // توابع ناوبری
        // ============================================================
        // تمرینات فصل به‌عنوان section عادی نمایش داده می‌شوند
        function showChapterExercises(chapterId, chapterTitle) {
            const practiceId = 'chapter-exercises-' + chapterId;
            const index = allSections.findIndex(s => s.id === practiceId);
            if (index !== -1) {
                showSection(index);
                return;
            }
            alert('تمرینات این فصل هنوز آماده نشده است.');
        }

        function showSection(index) {
            if (index < 0 || index >= allSections.length) return;

            currentIndex = index;

            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(allSections[index].id);
            if (target) target.classList.add('active');

            document.querySelectorAll('.toc-sections a').forEach(a => {
                a.classList.remove('active');
                if (a.dataset.id === allSections[index].id) a.classList.add('active');
            });

            const chIdx = allSections[index].chapterIndex;
            document.querySelectorAll('.toc-chapter').forEach((d, i) => {
                d.open = (i === chIdx);
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (window.innerWidth <= 1000) closeSidebar();

            // بعد از نمایش بخش، ادیتورهای CodeMirror را refresh کن + هایلایت کدهای ثابت
            setTimeout(function() {
                document.querySelectorAll('.section.active .python-playground .CodeMirror').forEach(function(cmEl) {
                    if (cmEl.CodeMirror) {
                        try { cmEl.CodeMirror.refresh(); } catch (e) {}
                    }
                });
                // هایلایت بلاک‌های کد پایتون در بخش فعلی
                const activeSec = document.querySelector('.section.active');
                if (activeSec) highlightCodeBlocks(activeSec);
            }, 50);
        }

        function goToPrev() {
            if (currentIndex > 0) showSection(currentIndex - 1);
        }

        function goToNext() {
            if (currentIndex < allSections.length - 1) showSection(currentIndex + 1);
        }

        // ============================================================
        // سایدبار
        // ============================================================
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const toggleBtn = document.getElementById('sidebarToggle');
        const closeBtn = document.getElementById('sidebarClose');

        function openSidebar() {
            sidebar.classList.add('open');
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        toggleBtn.addEventListener('click', openSidebar);
        closeBtn.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);

        // ============================================================
        // تم
        // ============================================================
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.querySelector('.theme-icon');
            if (theme === 'dark') {
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        // ============================================================
        // کوئیزها
        // ============================================================
        function selectOption(btn) {
            const parent = btn.parentElement;
            parent.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            parent.nextElementSibling.classList.add('show');
        }

        // ============================================================
        // نوار پیشرفت
        // ============================================================
        window.onscroll = function() {
            const scroll = document.documentElement.scrollTop || document.body.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            document.getElementById('progressBar').style.width = (height > 0 ? (scroll / height * 100) : 0) + '%';
        };

        // ============================================================
        // کلیدهای صفحه‌کلید
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSidebar();
            if (e.key === 'ArrowLeft') goToNext();
            if (e.key === 'ArrowRight') goToPrev();
        });

        // ============================================================
        // بسته‌بندی جدول‌ها
        // ============================================================
        function wrapTables() {
            document.querySelectorAll('.section table').forEach(function(table) {
                if (table.parentElement && table.parentElement.classList.contains('table-wrap')) return;
                var wrap = document.createElement('div');
                wrap.className = 'table-wrap';
                table.parentNode.insertBefore(wrap, table);
                wrap.appendChild(table);
            });
        }

        // ============================================================
        // مقداردهی اولیه
        // ============================================================
        buildTOC();
        buildSections();
        wrapTables();
        // Highlight all static code blocks after content is built
        setTimeout(function() { highlightCodeBlocks(document); }, 100);
        showSection(0);

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
