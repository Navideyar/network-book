<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دوره Python · ZeroDay</title>

    <!-- فونت‌ها -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- CodeMirror (editor) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />

    <style>
        /* ===== متغیرهای CSS ===== */
        :root {
            --primary: #306998;
            --primary-hover: #1d4b6e;
            --primary-soft: #d1e0f0;
            --primary-glow: rgba(48, 105, 152, 0.25);
            --link: #245f96;
            --link-hover: #17466f;

            --bg-body: #f5f7fa;
            --bg-card: #ffffff;
            --bg-navbar: rgba(255, 255, 255, 0.92);
            --bg-code: #1e293b;
            --bg-toc-hover: #eef4fb;

            --text-main: #2d3748;
            --text-heading: #1a202c;
            --text-muted: #4a5568;

            --border: #e2e8f0;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --radius-sm: 10px;

            --note-bg: #e6ffed;
            --note-border: #2b8a3e;
            --important-bg: #e3f2fd;
            --important-border: #1976d2;
            --warning-bg: #fff8e1;
            --warning-border: #f57c00;

            --code-text: #e2e8f0;
            --terminal-green: #8ae234;
            --sidebar-width: 300px;
        }

        [data-theme="dark"] {
            --primary: #4d8dc7;
            --primary-hover: #5fa3d9;
            --primary-soft: rgba(77, 141, 199, 0.15);
            --primary-glow: rgba(77, 141, 199, 0.25);
            --link: #7fc4ff;
            --link-hover: #a9d9ff;

            --bg-body: #1a1e26;
            --bg-card: #242a36;
            --bg-navbar: rgba(30, 34, 44, 0.95);
            --bg-code: #0f131a;
            --bg-toc-hover: rgba(77, 141, 199, 0.12);

            --text-main: #e2e8f0;
            --text-heading: #f0f4fa;
            --text-muted: #a0aec0;

            --border: #3a4050;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);

            --note-bg: rgba(43, 138, 62, 0.15);
            --note-border: #5fbf7a;
            --important-bg: rgba(25, 118, 210, 0.15);
            --important-border: #64b5f6;
            --warning-bg: rgba(245, 124, 0, 0.15);
            --warning-border: #ffb74d;

            --code-text: #e2e8f0;
        }

        /* ===== ریست و پایه ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            overflow-x: hidden;
            max-width: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.8;
            font-size: 16.5px;
            padding-top: 64px;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            max-width: 100%;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== نوار بالا ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-navbar);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
            z-index: 1000;
            transition: background 0.3s, border-color 0.3s;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            white-space: nowrap;
        }
        .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
        }
        .nav-spacer {
            flex: 1;
        }
        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .theme-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        /* ===== نوار پیشرفت ===== */
        .progress-track {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            z-index: 999;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #7ab7e0);
            width: 0%;
            transition: width 0.15s;
        }

        /* ===== سایدبار ===== */
        .sidebar {
            position: fixed;
            top: 60px;
            right: 0;
            width: var(--sidebar-width);
            height: calc(100vh - 60px);
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            z-index: 900;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s, border-color 0.3s;
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.04);
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg-card);
            z-index: 2;
        }
        .sidebar-header h3 {
            font-size: 1rem;
            color: var(--text-heading);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-header h3 i {
            color: var(--primary);
        }
        .sidebar-close {
            display: none;
            background: none;
            border: none;
            font-size: 1.15rem;
            color: var(--text-muted);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: 0.2s;
        }
        .sidebar-close:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }

        /* ===== فهرست مطالب ===== */
        .toc {
            padding: 8px 0 30px;
        }
        .toc-chapter {
            border-bottom: 1px solid var(--border);
        }
        .toc-chapter:last-child {
            border-bottom: none;
        }
        .toc-chapter summary {
            padding: 12px 14px;
            font-weight: 600;
            color: var(--text-heading);
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: background 0.15s;
            user-select: none;
            font-size: 0.92rem;
            line-height: 1.4;
            border-radius: 0;
        }
        .toc-chapter summary::-webkit-details-marker {
            display: none;
        }
        .toc-chapter summary::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            margin-right: auto;
            margin-top: 2px;
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: transform 0.25s;
            flex-shrink: 0;
        }
        .toc-chapter[open] summary::after {
            transform: rotate(180deg);
        }
        .toc-chapter summary:hover {
            background: var(--bg-toc-hover);
        }
        .toc-chapter[open]>summary {
            background: var(--primary-soft);
            color: var(--primary);
        }
        .chapter-num {
            width: 24px;
            height: 24px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .toc-sections {
            list-style: none;
            padding: 0 0 8px 0;
            margin: 0;
            background: var(--bg-body);
        }
        .toc-sections li a {
            display: block;
            padding: 8px 14px 8px 48px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.15s;
            border-right: 3px solid transparent;
            line-height: 1.45;
        }
        .toc-sections li a:hover {
            color: var(--primary);
            background: var(--bg-toc-hover);
        }
        .toc-sections li a.active {
            color: var(--primary);
            background: var(--primary-soft);
            border-right-color: var(--primary);
            font-weight: 600;
        }

        .toc-practice {
            display: block;
            padding: 0;
            margin-top: 2px;
            font-size: 0.83rem;
            line-height: 1.45;
        }

        .toc-practice a {
            display: block;
            padding: 8px 14px 10px 48px;
            color: var(--link);
            text-decoration: none;
            border-right: 3px solid transparent;
            cursor: pointer;
        }

        .toc-practice a:hover {
            color: var(--link-hover);
            background: var(--primary-soft);
            border-right-color: var(--primary);
        }

        .toc-practice i {
            color: inherit;
            margin-left: 5px;
            font-size: 0.8rem;
        }

        /* ===== دکمه باز کردن سایدبار ===== */
        .sidebar-toggle {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            font-size: 1.25rem;
            box-shadow: 0 6px 20px var(--primary-glow);
            z-index: 950;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }
        .sidebar-toggle:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 850;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.open {
            display: block;
        }

        /* ===== محتوای اصلی ===== */
        .main {
            max-width: 820px;
            margin: 0 auto;
            margin-right: calc(var(--sidebar-width) + 24px);
            padding: 32px 24px 80px;
            transition: margin 0.3s;
            min-width: 0;
            width: 100%;
            overflow-x: hidden;
        }
        .section {
            display: none;
            animation: fadeIn 0.35s ease;
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }
        .section.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== هدر بخش ===== */
        .section-header {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
            transition: background 0.3s, border-color 0.3s;
        }
        .section-header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background: var(--primary);
        }
        .section-badge {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .section-header h1 {
            font-size: 1.3rem;
            color: var(--text-heading);
            margin-bottom: 3px;
            line-height: 1.4;
        }
        .section-header .meta {
            font-size: 0.84rem;
            color: var(--text-muted);
        }

        /* ===== تایپوگرافی ===== */
        h2 {
            color: var(--text-heading);
            font-size: 1.25rem;
            margin: 32px 0 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            flex-shrink: 0;
        }
        h3 {
            color: var(--text-heading);
            font-size: 1.05rem;
            margin: 20px 0 8px;
        }

        .lesson-title {
            color: var(--text-heading);
            margin-top: 30px;
        }
        p {
            margin-bottom: 14px;
            text-align: justify;
        }
        strong {
            color: var(--text-heading);
        }

        /* ===== تمرینات فصل ===== */
        .exercise-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.65);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }

        .exercise-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .exercise-modal-content {
            position: relative;
            width: min(420px, 100%);
            padding: 32px 24px;
            text-align: center;
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
        }

        .exercise-modal-close {
            position: absolute;
            top: 8px;
            left: 12px;
            border: 0;
            background: transparent;
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
        }

        .exercise-modal-icon {
            color: var(--primary);
            font-size: 30px;
            margin-bottom: 10px;
        }

        .exercise-modal-content h2 {
            margin: 0 0 8px;
            color: var(--text-heading);
        }

        .exercise-modal-chapter {
            margin: 0 0 18px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .exercise-modal-message {
            margin: 0;
            color: var(--link);
            font-weight: 600;
        }

        /* ===== لینک‌ها ===== */
        a {
            color: var(--link);
            text-decoration-thickness: 1px;
            text-underline-offset: 2px;
            transition: color 0.15s, background 0.15s;
        }

        a:hover {
            color: var(--link-hover);
        }

        /* لینک‌های فهرست ظاهر اختصاصی خودشان را حفظ می‌کنند */
        .toc-sections li a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .toc-sections li a:hover,
        .toc-sections li a.active {
            color: var(--primary);
        }
        ul,
        ol {
            margin: 10px 0 18px;
            padding-right: 24px;
        }
        li {
            margin-bottom: 6px;
        }
        blockquote {
            background: var(--primary-soft);
            border-right: 4px solid var(--primary);
            padding: 14px 18px;
            margin: 20px 0;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            color: var(--text-heading);
            font-style: italic;
            transition: background 0.3s, border-color 0.3s;
        }

        /* ===== جعبه‌های اطلاعاتی ===== */
        .box {
            display: flex;
            gap: 14px;
            padding: 16px 18px;
            border-radius: var(--radius-sm);
            margin: 22px 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            transition: background 0.3s, border-color 0.3s;
        }
        .box>div {
            min-width: 0;
            flex: 1;
            overflow-wrap: break-word;
        }
        .box i {
            font-size: 1.3rem;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .box strong {
            display: block;
            margin-bottom: 3px;
        }
        .box.note {
            background: var(--note-bg);
            border-color: var(--note-border);
        }
        .box.note i,
        .box.note strong {
            color: var(--note-border);
        }
        .box.important {
            background: var(--important-bg);
            border-color: var(--important-border);
        }
        .box.important i,
        .box.important strong {
            color: var(--important-border);
        }
        .box.warning {
            background: var(--warning-bg);
            border-color: var(--warning-border);
        }
        .box.warning i,
        .box.warning strong {
            color: var(--warning-border);
        }

        /* ===== کد ===== */
        .code-container {
            position: relative;
            margin: 24px 0;
            max-width: 100%;
            min-width: 0;
            width: 100%;
        }
        .code-label {
            position: absolute;
            top: -11px;
            left: 14px;
            background: var(--primary);
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 14px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            z-index: 1;
            letter-spacing: 0.3px;
        }
        .code-block {
            background: var(--bg-code);
            color: var(--code-text);
            padding: 28px 18px 18px;
            border-radius: var(--radius-sm);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            direction: ltr;
            text-align: left;
            unicode-bidi: isolate;
            white-space: pre;
            overflow-x: auto;
            border: 1px solid var(--border);
            max-width: 100%;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
            transition: background 0.3s, border-color 0.3s;
            line-height: 1.6;
        }
        .code-block::before {
            content: '>>> ';
            color: var(--terminal-green);
        }
        .code-block.no-prompt::before {
            content: none;
        }

        /* ===== جدول ===== */
        .table-wrap {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 22px 0;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0;
            font-size: 0.93rem;
            border-radius: var(--radius-sm);
            overflow: hidden;
            min-width: 0;
        }
        th,
        td {
            border: 1px solid var(--border);
            padding: 11px 14px;
            text-align: right;
            vertical-align: top;
        }
        th {
            background: var(--primary-soft);
            color: var(--text-heading);
            font-weight: 600;
            white-space: nowrap;
        }
        tr:hover td {
            background: var(--bg-body);
        }
        td code {
            white-space: nowrap;
        }

        /* ===== جمع‌بندی ===== */
        .summary-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            margin: 24px 0;
            box-shadow: var(--shadow);
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            transition: background 0.3s, border-color 0.3s;
        }
        .summary-box h3 {
            margin-top: 0;
            color: var(--primary);
        }

        /* ===== کوئیز ===== */
        .quiz-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            margin: 28px 0 16px;
            box-shadow: var(--shadow);
            transition: background 0.3s, border-color 0.3s;
        }
        .quiz-card>p {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-heading);
            margin-bottom: 16px;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .quiz-options button {
            background: var(--bg-body);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            text-align: right;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.2s;
        }
        .quiz-options button:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        .quiz-options button.selected {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .quiz-answer {
            display: none;
            margin-top: 14px;
            padding: 14px 16px;
            background: var(--note-bg);
            border-radius: var(--radius-sm);
            border-right: 4px solid var(--note-border);
            color: var(--text-heading);
            font-size: 0.95rem;
            transition: background 0.3s, border-color 0.3s;
        }
        .quiz-answer.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        /* ===== ویرایشگر پایتون (Playground) ===== */
        .python-playground {
            margin: 24px 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
            background: #1e1e2e;
            border: 1px solid #313244;
            direction: ltr;
            max-width: 100%;
        }
        .playground-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #181825;
            padding: 10px 14px;

     │

 Compiler

     ▼
Machine Code / Executable
     │
     ▼
     CPU</div></div>
<p>مثلاً در زبان‌هایی مثل C، معمولاً ابتدا برنامه را کامپایل می‌کنیم و بعد فایل اجرایی تولیدشده را اجرا می‌کنیم.</p>

 Execution</div></div>
<p>مثلاً وقتی در Terminal می‌نویسیم:</p>

<h2 class="lesson-title">4. پس Python کامپایلر است یا Interpreter؟</h2>
<p>اینجا یکی از نکات مهم Python Basic قرار دارد. ⭐⭐⭐</p>
<p>اگر در یک سؤال ساده پرسیدند:</p>
<blockquote>Python is a compiled language or interpreted language?</blockquote>
<p>معمولاً در سطح Basic پاسخ مورد انتظار:</p>
<blockquote><strong>Python یک زبان interpreted است.</strong></blockquote>
<p>اما از نظر فنی، داستان کمی دقیق‌تر است.</p>
<p>در پیاده‌سازی رایج Python یعنی <strong>CPython</strong>، کد Python ابتدا به <strong>Bytecode</strong> تبدیل می‌شود و سپس توسط Python Virtual Machine اجرا می‌شود.</p>
<p>مدل ساده‌تر و دقیق‌تر:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Python Source Code
        │
        ▼
      CPython
        │
        ▼
     Bytecode
        │
        ▼
 Python Virtual Machine
        │
        ▼
     Execution</div></div>
<p>پس این دو جمله را با هم به خاطر بسپار:</p>
<blockquote><strong>در سطح Basic:</strong> Python را یک زبان interpreted می‌دانیم.</blockquote>
<blockquote><strong>از نظر فنی:</strong> CPython کد Python را به bytecode تبدیل کرده و آن را اجرا می‌کند.</blockquote>
<h3>نکته امتحانی ⭐</h3>
<p>نگو:</p>
<blockquote>Python هیچ‌وقت compile نمی‌شود.</blockquote>
<p>این جمله دقیق نیست.</p>
<p>در CPython مرحله‌ای برای تبدیل Source Code به <strong>Bytecode</strong> وجود دارد.</p>

<h2> Troubleshooting<h1 class="lesson-title section-troubleshoot">Troubleshooting — اگر Python اجرا نشد</h1>
<h3>مشکل ۱</h3>

<p>اگر مشکل ادامه داشت، نصب Python و PATH را بررسی کن. در Windows، مسیر <code>python.exe</code> و پوشه <code>Scripts</code> می‌توانند به PATH اضافه شوند. (<a href="https://docs.python.org/3.13/using/windows.html "4. Using Python on Windows — Python 3.13.15 documentation"" target="_blank" rel="noopener noreferrer">Python Documentation</a>)</p>

<p>نسخه‌ای غیر از نسخه‌ای که انتظار داری نشان دهد.</p>
<p>این معمولاً به وجود چند Python یا تنظیمات PATH مربوط است.</p>
<p>در ادامه دوره، هنگام یادگیری <code>venv</code> این موضوع را دقیق‌تر مدیریت خواهیم کرد.</p>

<h2 class="lesson-title">⭐ نکات مهم جلسه</h2>
<ul><li><strong>Python</strong> یک زبان برنامه‌نویسی General-Purpose است.</li></ul>
<ul><li>در سطح Basic، Python را یک زبان <strong>Interpreted</strong> می‌دانیم.</li></ul>
<ul><li>در CPython، کد ابتدا به <strong>Bytecode</strong> تبدیل می‌شود.</li></ul>
<ul><li><code>&gt;&gt;&gt;</code> علامت ورود به <strong>REPL</strong> است.</li></ul>
<ul><li>REPL یعنی <strong>Read → Evaluate → Print → Loop</strong>.</li></ul>
<ul><li>فایل‌های Python معمولاً پسوند <code>.py</code> دارند.</li></ul>
<ul><li><code>python --version</code> نسخه Python را نشان می‌دهد.</li></ul>
<ul><li>در <code>3.14.0</code>، سه بخش اصلی داریم: <strong>Major / Minor / Patch</strong>.</li></ul>
<ul><li><code>PATH</code> به سیستم کمک می‌کند executableهایی مثل Python را پیدا کند.</li></ul>
<ul><li><strong>VS Code جای Python Interpreter را نمی‌گیرد.</strong></li></ul>
<ul><li>Python Extension امکانات Python را به VS Code اضافه می‌کند.</li></ul>
<ul><li>VS Code و Python Interpreter دو چیز متفاوت هستند.</li></ul>

<ol><li>Bytecode چیست؟</li></ol>

<ol><li>VS Code چه تفاوتی با Python Interpreter دارد؟</li></ol>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">30</div></div>

print(age + 5)</div></div>
<p>خطا می‌دهد، چون Python نمی‌تواند به شکل مستقیم <code>str</code> و <code>int</code> را با <code>+</code> جمع کند.</p>
<p>این موضوع در جلسه <strong>Type Casting</strong> به‌صورت کامل‌تر بررسی خواهد شد.</p>

<h2 class="lesson-title">14. <code>bool</code> — مقدار منطقی ⭐⭐⭐</h2>
<p><code>bool</code> مخفف <strong>Boolean</strong> است.</p>
<p>فقط دو مقدار دارد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">True
False</div></div>
<p>دقت کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">True</div></div>
<p>با:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">&quot;True&quot;</div></div>
<p>متفاوت است.</p>
<p>اولی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">bool</div></div>
<p>دومی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">str</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">is_student = True
is_admin = False</div></div>
<p>این نوع داده بعداً در شرط‌ها بسیار مهم خواهد شد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">is_logged_in = True</div></div>
<p>می‌تواند بیان کند که کاربر وارد سیستم شده است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">15. <code>None</code> — یعنی «فعلاً هیچ مقداری نداریم» ⭐⭐</h2>
<p><code>None</code> یک مقدار خاص در Python است که معمولاً برای نشان دادن <strong>نبودن مقدار</strong> استفاده می‌شود.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = None</div></div>
<p>یعنی فعلاً <code>result</code> مقدار مشخصی ندارد.</p>
<p>نوع آن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(type(result))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&lt;class 'NoneType'&gt;</div></div>
<h3>نکته مهم</h3>
<p><code>None</code> با صفر یکی نیست:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">None ≠ 0</div></div>
<p>و با رشته خالی هم یکی نیست:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">None ≠ &quot;&quot;</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">x = None
y = 0
z = &quot;&quot;</div></div>
<p>سه مقدار متفاوت داریم.</p>
<p>در Python Basic فعلاً همین مدل ذهنی کافی است:</p>
<blockquote><code>None</code> یعنی «مقدار وجود ندارد / فعلاً مقداری تعیین نشده».</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">16. جدول مهم Data Types</h2>
<p>این جدول را حتماً بلد باش. ⭐⭐⭐</p>
<div class="table-wrap"><table><thead><tr><th>Type</th><th>نام</th><th>مثال</th><th>کاربرد</th></tr></thead><tbody><tr><td><code>int</code></td><td>Integer</td><td><code>25</code></td><td>عدد صحیح</td></tr><tr><td><code>float</code></td><td>Floating Point</td><td><code>3.14</code></td><td>عدد اعشاری</td></tr><tr><td><code>str</code></td><td>String</td><td><code>"Python"</code></td><td>متن</td></tr><tr><td><code>bool</code></td><td>Boolean</td><td><code>True</code></td><td>درست/غلط</td></tr><tr><td><code>NoneType</code></td><td>None</td><td><code>None</code></td><td>نبود مقدار</td></tr></tbody></table></div>
<p>مدل حفظی ساده:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">int      → عدد صحیح
float    → عدد اعشاری
str      → متن
bool     → True / False
None     → نبود مقدار</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">17. تابع <code>type()</code> ⭐⭐⭐</h2>
<p>برای فهمیدن Data Type یک مقدار از <code>type()</code> استفاده می‌کنیم.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">x = 10

print(type(x))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&lt;class 'int'&gt;</div></div>
<p>مثال:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name = &quot;Ali&quot;
price = 10.5
active = True
data = None

print(type(name))
print(type(price))
print(type(active))
print(type(data))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&lt;class 'str'&gt;
&lt;class 'float'&gt;
&lt;class 'bool'&gt;
&lt;class 'NoneType'&gt;</div></div>
<p>پس:</p>
<blockquote><code>type()</code> برای بررسی نوع داده یک مقدار استفاده می‌شود.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">18. Variable و Data Type چه ارتباطی دارند؟</h2>
<p>این دو مفهوم را قاطی نکن.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 25</div></div>
<p>داریم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Variable → age
Value    → 25
Type     → int</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name = &quot;Ali&quot;</div></div>
<p>داریم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Variable → name
Value    → &quot;Ali&quot;
Type     → str</div></div>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">             Variable
                │
                ▼
              Value
                │
                ▼
              Type</div></div>
<p>در واقع Variable نامی است که با آن به داده دسترسی پیدا می‌کنیم؛ Data Type ویژگی نوع آن داده است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">19. Python Dynamic Typing دارد</h2>
<p>یکی از ویژگی‌های مهم Python این است که لازم نیست هنگام ساخت Variable نوع آن را از قبل بنویسیم.</p>
<p>مثلاً نمی‌نویسیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">int age = 25</div></div>
<p>بلکه می‌نویسیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 25</div></div>
<p>Python خودش می‌فهمد که <code>25</code> یک <code>int</code> است.</p>
<p>حتی می‌توانیم بعداً مقدار دیگری به همان Variable بدهیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">x = 10

print(type(x))

x = &quot;Hello&quot;

print(type(x))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&lt;class 'int'&gt;
&lt;class 'str'&gt;</div></div>
<p>یعنی Variable <code>x</code> ابتدا به یک <code>int</code> اشاره می‌کند و بعد به یک <code>str</code>.</p>
<h3>نکته مهم ⭐⭐</h3>
<p>در Python:</p>
<blockquote>نوع داده به <strong>Value</strong> مربوط است و Variable مجبور نیست برای همیشه یک نوع ثابت داشته باشد.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">20. چند نوع داده در یک برنامه</h2>
<p>حالا چیزهایی که یاد گرفتیم را کنار هم بگذاریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name = &quot;Ali&quot;
age = 25
height = 1.75
is_student = True
phone = None

print(name)
print(age)
print(height)
print(is_student)
print(phone)</div></div>
<p>مدل ذهنی برنامه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">name        → &quot;Ali&quot;   → str
age         → 25      → int
height      → 1.75    → float
is_student  → True    → bool
phone       → None    → NoneType</div></div>
<p>این اولین تصویر واقعی ما از داده‌ها در Python است.</p>

<h1 class="lesson-title section-troubleshoot">اشتباهات رایج</h1>
<h3>۱. استفاده از <code>=</code> به جای مقایسه</h3>
<p>فعلاً بدان:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">x = 10</div></div>
<p>برای Assignment است.</p>
<p>موضوع مقایسه را در <strong>Operators</strong> به شکل کامل یاد می‌گیریم.</p>
<h3>۲. اشتباه گرفتن <code>"10"</code> و <code>10</code></h3>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">10</div></div>
<p>یک <code>int</code> است.</p>
<p>اما:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&quot;10&quot;</div></div>
<p>یک <code>str</code> است.</p>
<p>ظاهرشان شبیه است، اما Python آن‌ها را دو نوع داده متفاوت می‌داند.</p>
<h3>۳. نوشتن <code>true</code> به جای <code>True</code></h3>
<p>در Python درست:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">True
False</div></div>
<p>غلط:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">true
false</div></div>
<p>Python به حروف بزرگ و کوچک حساس است.</p>
<h3>۴. نوشتن <code>None</code> داخل quotation</h3>
<p>این:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">x = None</div></div>
<p>با این:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">x = &quot;None&quot;</div></div>
<p>فرق دارد.</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">None     → NoneType
&quot;None&quot;   → str</div></div>

<h2 class="lesson-title">⭐ نکات مهم جلسه</h2>
<ul><li>Variable یک <strong>نام برای دسترسی به یک مقدار</strong> است.</li><li><code>=</code> برای Assignment استفاده می‌شود.</li><li>نام Variable نمی‌تواند با عدد شروع شود.</li><li>فاصله در نام Variable مجاز نیست؛ از <code>_</code> استفاده کن.</li><li>Python به حروف بزرگ و کوچک حساس است.</li><li><code>int</code> → عدد صحیح</li><li><code>float</code> → عدد اعشاری</li><li><code>str</code> → متن</li><li><code>bool</code> → <code>True</code> / <code>False</code></li><li><code>None</code> → نبود مقدار</li><li><code>type()</code> نوع داده را مشخص می‌کند.</li><li><code>10</code> و <code>"10"</code> دو نوع داده متفاوت هستند.</li><li>Python <strong>Dynamic Typing</strong> دارد.</li><li>نوع داده به Value مربوط است، نه اینکه Variable برای همیشه یک Type ثابت داشته باشد.</li></ul>
<hr class="lesson-divider">
<h2 class="lesson-title">🔄 Recall سریع</h2>
<p>بدون نگاه‌کردن به درس، سعی کن به این ۸ سؤال جواب بده:</p>
<ol><li>Variable چیست؟</li><li><code>=</code> چه کاری انجام می‌دهد؟</li><li>کدام نوع داده برای اعداد صحیح است؟</li><li>کدام نوع داده برای متن است؟</li><li><code>bool</code> چه مقدارهایی می‌گیرد؟</li><li><code>None</code> یعنی چه؟</li><li>تابع <code>type()</code> چه کاربردی دارد؟</li><li>Python Dynamic Typing یعنی چه؟</li></ol>
<p>اگر توانستی این‌ها را توضیح بدهی، هسته جلسه ۲ را یاد گرفته‌ای.</p>

            html.setAttribute('data-theme', newTheme);

                icon.classList.replace('fa-moon', 'fa-sun');

        const savedTheme = localStorage.getItem('theme') || 'dark';

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

<script>
(function () {
    const playgrounds = Array.from(document.querySelectorAll('.python-playground[data-playground]'));
    if (!playgrounds.length || typeof CodeMirror === 'undefined') return;

    let pyodide = null;
    let pyodideReady = false;
    let loadingPromise = null;
    const editors = new Map();

    function setOutput(root, text, type) {
        const out = root.querySelector('.playground-output');
        if (!out) return;
        out.textContent = text;
        out.classList.remove('error', 'success', 'loading');
        if (type) out.classList.add(type);
    }
    function setStatus(root, text) {
        const el = root.querySelector('.playground-status');
        if (el) el.textContent = text;
    }

    function setupEditors() {
        playgrounds.forEach(root => {
            const ta = root.querySelector('.python-editor');
            if (!ta) return;
            const editor = CodeMirror.fromTextArea(ta, {
                mode: 'python', theme: 'dracula', lineNumbers: true,
                indentUnit: 4, tabSize: 4, indentWithTabs: false,
                lineWrapping: true, autofocus: false, viewportMargin: Infinity,
                extraKeys: {
                    'Ctrl-Enter': () => run(root),
                    'Cmd-Enter': () => run(root),
                    'Tab': cm => cm.somethingSelected() ? cm.indentSelection('add') : cm.replaceSelection('    ', 'end')
                }
            });
            editors.set(root, editor);
            root.querySelector('[data-action="run"]').addEventListener('click', () => run(root));
            root.querySelector('[data-action="clear"]').addEventListener('click', () => {
                setOutput(root, '▶ خروجی پاک شد. کد را اجرا کنید.');
                setStatus(root, pyodideReady ? 'آماده' : 'در حال آماده‌سازی...');
            });
            setTimeout(() => editor.refresh(), 200);
        });
    }

    async function loadPyodideOnce() {
        if (pyodideReady) return true;
        if (loadingPromise) return loadingPromise;
        loadingPromise = (async () => {
            playgrounds.forEach(r => { setStatus(r, 'بارگذاری...'); setOutput(r, '⏳ در حال بارگذاری مفسر پایتون (اولین بار کمی طول می‌کشد)...', 'loading'); });
            try {
                pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });
                pyodide.runPython(`
import builtins
from js import prompt as _browser_prompt
def _input(prompt=""):
    result = _browser_prompt(str(prompt) if prompt else "")
    return "" if result is None else str(result)
builtins.input = _input
`);
                pyodideReady = true;
                playgrounds.forEach(r => { setStatus(r, 'آماده'); setOutput(r, '✅ مفسر آماده است..', 'success'); });
                return true;
            } catch (err) {
                playgrounds.forEach(r => { setStatus(r, 'خطا'); setOutput(r, '❌ خطا در بارگذاری مفسر: ' + (err.message || String(err)), 'error'); });
                return false;
            }
        })();
        return loadingPromise;
    }

    async function run(root) {
        const editor = editors.get(root);
        if (!editor || root.dataset.running === '1') return;
        root.dataset.running = '1';
        const runBtn = root.querySelector('[data-action="run"]');
        if (runBtn) runBtn.disabled = true;
        try {
            if (!(await loadPyodideOnce())) return;
            const code = editor.getValue();
            if (!code.trim()) { setOutput(root, '⚠️ لطفاً کدی بنویسید.', 'loading'); return; }
            setOutput(root, '⏳ در حال اجرا...', 'loading'); setStatus(root, 'اجرا...');
            pyodide.runPython(`
import sys
from io import StringIO
__stdout_backup = sys.stdout
__stderr_backup = sys.stderr
sys.stdout = StringIO()
sys.stderr = StringIO()
`);
            let result = null, error = null;
            try { result = await pyodide.runPythonAsync(code); } catch (e) { error = e; }
            const captured = pyodide.runPython(`
out = sys.stdout.getvalue()
err = sys.stderr.getvalue()
sys.stdout = __stdout_backup
sys.stderr = __stderr_backup
out + (err if err else "")
`);
            let finalOutput = (captured || '').trimEnd();
            if (result !== undefined && result !== null && String(result) !== 'None') finalOutput += (finalOutput ? '\n' : '') + String(result);
            if (error) {
                let msg = error.message || String(error);
                msg = msg.replace(/File "<exec>", line \d+, in <module>\n?/g, '').replace(/File "<exec>", line \d+, in /g, '').trim();
                setOutput(root, (finalOutput ? finalOutput + '\n\n' : '') + '❌ ' + msg, 'error');
                setStatus(root, 'خطا');
            } else {
                setOutput(root, finalOutput || '✅ اجرا شد (بدون خروجی)', finalOutput ? null : 'success');
                setStatus(root, 'آماده');
            }
        } finally {
            root.dataset.running = '0';
            if (runBtn) runBtn.disabled = false;
            try { editor.refresh(); } catch(e) {}
        }
    }

    document.querySelectorAll('.solution-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
            const target = document.getElementById(btn.dataset.solution);
            if (!target) return;
            const show = target.classList.toggle('show');
            btn.innerHTML = show ? '<i class="fas fa-eye-slash"></i> مخفی‌کردن پاسخ' : '<i class="fas fa-eye"></i> نمایش پاسخ';
        });
    });

    setupEditors();
    window.addEventListener('resize', () => editors.forEach(e => { try { e.refresh(); } catch(_) {} }));
    window.addEventListener('load', () => setTimeout(loadPyodideOnce, 400));
    if (document.readyState === 'complete') setTimeout(loadPyodideOnce, 500);
})();
</script>

</body>
</html>
