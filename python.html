<h3>نکته مهم </h3>
<blockquote>برای هر یک بار اجرای حلقه بیرونی، حلقه داخلی <strong>به‌طور کامل</strong> اجرا می‌شود.</blockquote>

<h2 class="lesson-title">17. تعداد اجرا در Nested Loop</h2>

<p>این موضوع در سؤال‌های خروجی بسیار مهم است.</p>

<h2 class="lesson-title">18. Nested Loop با شکل ساده</h2>

Row 2 → * * * *
Row 3 → * * * *</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">19. چرا <code>end=" "</code> استفاده کردیم؟</h2>

<p>سپس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print()</div></div>
<p>ما را به خط بعد می‌برد.</p>
<p>این مثال همچنین مرور خوبی برای جلسه ۵ است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">20. <code>break</code> در Nested Loop</h2>
<p>در حلقه‌های تو‌در‌تو یک نکته مهم وجود دارد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(3):
    for j in range(3):

        if j == 1:
            break

        print(i, j)</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0 0
1 0
2 0</div></div>

<p><code>break</code> داخل حلقه داخلی است.</p>
<p>پس:</p>
<blockquote>فقط <strong>حلقه داخلی</strong> را متوقف می‌کند.</blockquote>

<h3> نکته مهم</h3>

<hr class="lesson-divider">
<h2 class="lesson-title">21. <code>zip()</code> چیست؟ </h2>
<p>حالا فرض کن دو لیست داریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]
scores = [18, 20, 15]</div></div>
<p>می‌خواهیم نام و نمره مربوط به هر فرد را با هم چاپ کنیم.</p>
<p>می‌توانیم با Index کار کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(len(names)):
    print(names[i], scores[i])</div></div>
<p>اما راه ساده‌تر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for name, score in zip(names, scores):
    print(name, score)</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali 18
Sara 20
Reza 15</div></div>
<hr class="lesson-divider">

<p>به زبان خیلی ساده:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">break
«دیگه ادامه نده»

<h1 class="lesson-title section-troubleshoot">Troubleshooting</h1>
<h3>مشکل ۱ — چرا <code>break</code> فقط یک حلقه را متوقف کرد؟</h3>
<p>در:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(3):
    for j in range(3):

        if j == 1:
            break</div></div>
<p><code>break</code> داخل حلقه داخلی قرار دارد.</p>
<p>پس فقط همان حلقه داخلی متوقف می‌شود.</p>
<h3>مشکل ۲ — چرا <code>continue</code> باعث توقف کامل نشد؟</h3>
<p>چون وظیفه <code>continue</code> این نیست.</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">break
→ پایان حلقه

continue
→ تکرار فعلی تمام
→ تکرار بعدی</div></div>
<h3>مشکل ۳ — چرا <code>pass</code> هیچ تفاوتی در خروجی ایجاد نکرد؟</h3>
<p>چون <code>pass</code> عملاً کاری انجام نمی‌دهد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if condition:
    pass</div></div>
<p>بعد از آن Python اجرای برنامه را ادامه می‌دهد.</p>
<h3>مشکل ۴ — چرا <code>zip()</code> همه عناصر را نشان نداد؟</h3>
<p>طول مجموعه‌ها را بررسی کن.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]
scores = [18, 20]</div></div>
<p>نتیجه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali 18
Sara 20</div></div>
<p>چون <code>scores</code> فقط دو عنصر دارد.</p>
<h3>مشکل ۵ — چرا Nested Loop تعداد زیادی خروجی ایجاد کرد؟</h3>
<p>به تعداد اجراها دقت کن.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(4):
    for j in range(3):
        print(i, j)</div></div>
<p>حلقه بیرونی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">4 بار</div></div>
<p>حلقه داخلی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">3 بار برای هر بار</div></div>
<p>پس:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">4 × 3 = 12</div></div>
<p>بار <code>print()</code> اجرا می‌شود.</p>
<hr class="lesson-divider">
<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li><code>break</code> کل حلقه فعلی را متوقف می‌کند.</li><li><code>continue</code> فقط تکرار فعلی را رد می‌کند.</li><li><code>pass</code> هیچ عملیات خاصی انجام نمی‌دهد.</li><li>در <code>Nested Loop</code>، حلقه داخلی برای هر بار اجرای حلقه بیرونی کامل اجرا می‌شود.</li><li><code>break</code> داخل حلقه داخلی، به‌طور عادی فقط همان حلقه داخلی را متوقف می‌کند.</li><li><code>zip()</code> چند مجموعه را برای پیمایش هم‌زمان کنار هم قرار می‌دهد.</li><li>در حالت معمول، <code>zip()</code> تا کوتاه‌ترین مجموعه ادامه پیدا می‌کند.</li><li>الگوی مهم <code>zip()</code>: <code>for a, b in zip(list1, list2):</code></li><li>الگوی مهم <code>enumerate()</code> که جلسه قبل یاد گرفتیم: <code>for index, value in enumerate(items):</code></li><li>تفاوت این دو را حفظ کن: <code>enumerate → Index + Value یک مجموعه</code> و <code>zip → Valueهای چند مجموعه</code></li></ul>
<hr class="lesson-divider">
<h2 class="lesson-title">🔄 Recall سریع</h2>
<p>بدون نگاه کردن به درس جواب بده:</p>
<ol><li><code>break</code> چه کاری انجام می‌دهد؟</li><li><code>continue</code> چه تفاوتی با <code>break</code> دارد؟</li><li><code>pass</code> چه تفاوتی با <code>continue</code> دارد؟</li><li>خروجی چیست؟ <code>for i in range(5):<br>    if i == 3:<br>        break<br>    print(i)</code></li><li>خروجی چیست؟ <code>for i in range(5):<br>    if i == 3:<br>        continue<br>    print(i)</code></li><li>در Nested Loop زیر <code>print</code> چند بار اجرا می‌شود؟ <code>for i in range(4):<br>    for j in range(2):<br>        print(i, j)</code></li><li><code>zip()</code> چه زمانی مفید است؟</li><li>اگر دو لیست 5 و 3 عنصر داشته باشند، <code>zip()</code> چند جفت ایجاد می‌کند؟</li></ol>
<p>پاسخ‌های کلیدی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">break      → پایان حلقه

zip:
تا کوتاه‌ترین مجموعه</div></div>

<h1 class="lesson-title section-scenario">سناریوی ترکیبی</h1>
<p>حالا یک مسئله نسبتاً واقعی حل کنیم.</p>
<p>فرض کن اطلاعات دانش‌آموزان را در دو لیست داریم:</p>

<p>می‌خواهیم:</p>

<p>اینجا چند مفهوم را با هم ترکیب می‌کنیم:</p>

 ↓
for
 ↓
if

Comparison</div></div>
<h3>مرحله ۱ — پیمایش هم‌زمان</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for name, score in zip(names, scores):
    print(name, score)</div></div>
<h3>مرحله ۲ — رد کردن نمره‌های کمتر از 5</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for name, score in zip(names, scores):

<p>در اینجا <code>Omid</code> با نمره 4 رد می‌شود.</p>
<h3>مرحله ۳ — توقف در نمره 20</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for name, score in zip(names, scores):

    if score < 5:
        continue

<h3>مرحله ۴ — اضافه کردن وضعیت قبولی</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza", "Mina", "Omid"]
scores = [18, 7, 15, 20, 4]

for name, score in zip(names, scores):

    if score < 5:
        continue

    if score == 20:

    if score >= 10:
        print(name, score, "Pass")
    else:
        print(name, score, "Fail")</div></div>

Sara 7 Fail

<p>چون:</p>

<p>و شرط:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if score == 20:
    break</div></div>
<p>باعث شد کل حلقه متوقف شود.</p>
<p><code>Omid</code> هم قبل از رسیدن به این مرحله به خاطر:</p>

<p>با <code>continue</code> رد می‌شد؛ اما چون <code>break</code> در <code>Mina</code> اجرا شده، اصلاً به <code>Omid</code> نمی‌رسیم.</p>
<h3>مدل ذهنی سناریو</h3>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">          names + scores
                 │
                 ▼
               zip
                 │
                 ▼
            name + score
                 │
                 ▼
            score < 5 ?

            │          │
        continue       ▼
                  score == 20 ?

                  │           │
                break         ▼
                         score >= 10 ?

<h2 class="lesson-title">🎯 جمع‌بندی جلسه</h2>
<p>تا اینجا ابزارهای کنترل حلقه‌ها را کامل‌تر کردیم.</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">                 کنترل حلقه
                     │
       ┌─────────────┼─────────────┐
       │             │             │
     break        continue        pass
       │             │             │
   توقف کامل     رد یک تکرار    هیچ کاری
       │             │
       └─────────────┴─────────────┐
                                   │
                            Nested Loops
                                   │
                              حلقه در حلقه
                                   │
                                   ▼
                                  zip()
                                   │
                           چند مجموعه با هم</div></div>
<p>اگر بخواهیم همه چیز را در چند جمله خلاصه کنیم:</p>
<blockquote><code>break</code> می‌گوید <strong>دیگر ادامه نده</strong>.</blockquote>
<blockquote><code>continue</code> می‌گوید <strong>این تکرار را رد کن و برو بعدی</strong>.</blockquote>
<blockquote><code>pass</code> می‌گوید <strong>فعلاً هیچ کاری نکن</strong>.</blockquote>
<blockquote>Nested Loop یعنی <strong>یک حلقه داخل حلقه دیگر</strong>.</blockquote>
<blockquote><code>zip()</code> یعنی <strong>چند مجموعه را هم‌زمان پیمایش کن</strong>.</blockquote>
<p>و مهم‌ترین تفاوت سه دستور:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">break      → Exit Loop
continue   → Skip Current Iteration
pass       → Do Nothing</div></div>
<p>از اینجا به بعد، دیگر فقط با حلقه‌های ساده سروکار نداریم؛ می‌توانیم <strong>جریان اجرای حلقه را کنترل کنیم</strong> و چند داده را هم‌زمان پردازش کنیم.</p>
<p>در جلسه بعد وارد یکی از مهم‌ترین بخش‌های Python می‌شویم:</p>

<h2 class="lesson-title">1. قبل از شروع: مشکل کدهای تکراری چیست؟ </h2>
<p>فرض کن می‌خواهیم سه بار یک پیام را چاپ کنیم:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">عدد

<p>اگر این عملیات در قسمت‌های مختلف برنامه تکرار شود، مجبوریم کد را دوباره بنویسیم.</p>
<p>این موضوع چند مشکل ایجاد می‌کند:</p>
<ul><li>کد طولانی‌تر می‌شود.</li><li>تغییر دادن کد سخت‌تر می‌شود.</li><li>احتمال خطا بیشتر می‌شود.</li><li>خوانایی برنامه پایین می‌آید.</li></ul>
<p>اینجاست که <strong>Function</strong> وارد می‌شود.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">2. Function چیست؟ </h2>
<p>تابع را فعلاً این‌طور تصور کن:</p>
<blockquote><strong>تابع یک بخش نام‌گذاری‌شده از کد است که یک کار مشخص انجام می‌دهد و هر زمان لازم باشد می‌توانیم آن را اجرا کنیم.</strong></blockquote>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">                 Function
                    │
             ┌──────┴──────┐
             │             │
          Input          Output
             │             │
             ▼             ▲
          پردازش  ────────┘</div></div>
<p>مثلاً یک تابع برای محاسبه مربع:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">عدد
 ↓
تابع square
 ↓
عدد × عدد
 ↓
نتیجه</div></div>
<p>به جای اینکه هر بار منطق را بنویسیم، یک بار آن را داخل تابع قرار می‌دهیم و بعد هر چند بار که خواستیم تابع را صدا می‌زنیم.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">3. اولین تابع ما</h2>
<p>برای تعریف تابع در Python از کلمه کلیدی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def</div></div>
<p>استفاده می‌کنیم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def say_hello():
    print(&quot;Hello!&quot;)</div></div>
<p>این کد یک تابع به نام <code>say_hello</code> تعریف می‌کند.</p>
<p>اما یک نکته مهم:</p>
<blockquote><strong>تعریف کردن تابع با اجرای تابع فرق دارد.</strong></blockquote>
<p>تا اینجا فقط تابع را ساخته‌ایم.</p>
<p>برای اجرای آن باید بنویسیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">say_hello()</div></div>
<p>پس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def say_hello():
    print(&quot;Hello!&quot;)

say_hello()</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Hello!</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">4. ساختار یک Function</h2>
<p>به این کد دقت کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def say_hello():
    print(&quot;Hello!&quot;)</div></div>
<p>اجزای آن:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">def
 │
 ▼
نام تابع
 │
 ▼
say_hello
 │
 ▼
()
 │
 ▼
:
 │
 ▼
بدنه تابع</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def function_name():
    # function body</div></div>
<h3>سه بخش مهم:</h3>
<h3>1️⃣ <code>def</code></h3>
<p>به Python می‌گوید:</p>
<blockquote>می‌خواهم یک تابع تعریف کنم.</blockquote>
<h3>2️⃣ نام تابع</h3>
<p>مثل:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">say_hello</div></div>
<h3>3️⃣ <code>()</code></h3>
<p>محل پارامترهای تابع است که کمی بعد با آن آشنا می‌شویم.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">5. چرا بعد از تعریف تابع چیزی چاپ نشد؟</h2>
<p>به این کد نگاه کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def say_hello():
    print(&quot;Hello!&quot;)</div></div>
<p>اگر همین را اجرا کنیم، خروجی نداریم.</p>
<p>چرا؟</p>
<p>چون هنوز تابع را <strong>فراخوانی نکرده‌ایم</strong>.</p>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">تعریف تابع
    ↓
تابع ساخته شد
    ↓
هنوز اجرا نشده</div></div>
<p>برای اجرا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">say_hello()</div></div>
<p>حالا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">تعریف
 ↓
فراخوانی
 ↓
اجرای بدنه</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">6. Function Call چیست؟</h2>
<p>وقتی می‌نویسیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">say_hello()</div></div>
<p>می‌گوییم تابع را <strong>فراخوانی (Call)</strong> کن.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def say_hello():
    print(&quot;Hello!&quot;)

say_hello()
say_hello()
say_hello()</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Hello!
Hello!
Hello!</div></div>
<p>تابع یک بار تعریف شد، ولی سه بار استفاده شد.</p>
<p>این یکی از مهم‌ترین مزیت‌های Function است:</p>
<blockquote><strong>یک بار بنویس، چند بار استفاده کن.</strong></blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">7. تابع بدون ورودی</h2>
<p>تا اینجا تابع ما هیچ ورودی نداشت:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def say_hello():
    print(&quot;Hello!&quot;)</div></div>
<p>چنین تابعی می‌تواند یک کار ثابت انجام دهد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def show_menu():
    print(&quot;1. Start&quot;)
    print(&quot;2. Exit&quot;)</div></div>
<p>فراخوانی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">show_menu()</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1. Start
2. Exit</div></div>
<p>اما خیلی وقت‌ها می‌خواهیم تابع روی داده‌های مختلف کار کند.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">سلام علی
سلام سارا
سلام رضا</div></div>
<p>اینجاست که <strong>Parameter</strong> وارد می‌شود.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">8. Parameter چیست؟ </h2>
<p>پارامتر را می‌توانیم این‌طور تعریف کنیم:</p>
<blockquote><strong>پارامتر متغیری است که هنگام تعریف تابع برای دریافت ورودی مشخص می‌کنیم.</strong></blockquote>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def say_hello(name):
    print(&quot;Hello&quot;, name)</div></div>
<p>اینجا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">name</div></div>
<p>یک <strong>Parameter</strong> است.</p>
<p>حالا می‌توانیم تابع را با مقادیر مختلف صدا بزنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">say_hello(&quot;Ali&quot;)
say_hello(&quot;Sara&quot;)
say_hello(&quot;Reza&quot;)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Hello Ali
Hello Sara
Hello Reza</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">9. مدل ذهنی Parameter</h2>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">             say_hello
                 │
                 ▼
              name
                 │
        ┌────────┼────────┐
        ▼        ▼        ▼
       Ali      Sara     Reza
        │        │        │
        ▼        ▼        ▼
   Hello Ali  Hello Sara  Hello Reza</div></div>
<p>یعنی تابع یک جای خالی دارد:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">name = ?</div></div>
<p>هر بار که تابع را صدا می‌زنیم، این جای خالی را با یک مقدار پر می‌کنیم.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">10. Argument چیست؟ </h2>
<p>حالا باید بین <strong>Parameter</strong> و <strong>Argument</strong> تفاوت بگذاریم.</p>
<p>در این کد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def say_hello(name):
    print(&quot;Hello&quot;, name)</div></div>
<p><code>name</code>:</p>
<blockquote><strong>Parameter</strong></blockquote>
<p>است.</p>
<p>اما در:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">say_hello(&quot;Ali&quot;)</div></div>
<p>مقدار <code>"Ali"</code>:</p>
<blockquote><strong>Argument</strong></blockquote>
<p>است.</p>
<h3>تفاوت:</h3>
<div class="table-wrap"><table><thead><tr><th>مفهوم</th><th>کجا قرار دارد؟</th><th>مثال</th></tr></thead><tbody><tr><td>Parameter</td><td>هنگام تعریف تابع</td><td><code>name</code></td></tr><tr><td>Argument</td><td>هنگام فراخوانی تابع</td><td><code>"Ali"</code></td></tr></tbody></table></div>
<p>پس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def say_hello(name):</div></div>
<p>پارامتر داریم.</p>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">say_hello(&quot;Ali&quot;)</div></div>
<p>آرگومان ارسال کرده‌ایم.</p>
<h3> نکته امتحانی</h3>
<p>این دو اصطلاح را با هم اشتباه نکن:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Parameter → داخل تعریف تابع

Argument → هنگام Call کردن تابع</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">11. چند Parameter</h2>
<p>یک تابع می‌تواند چند پارامتر داشته باشد.</p>
<p>مثلاً می‌خواهیم اطلاعات یک شخص را نمایش دهیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def introduce(name, age):
    print(&quot;Name:&quot;, name)
    print(&quot;Age:&quot;, age)</div></div>
<p>حالا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">introduce(&quot;Ali&quot;, 20)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Name: Ali
Age: 20</div></div>
<p>در تعریف:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">name, age</div></div>
<p>هر دو <strong>Parameter</strong> هستند.</p>
<p>در فراخوانی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&quot;Ali&quot;, 20</div></div>
<p>هر دو <strong>Argument</strong> هستند.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">12. ترتیب Argumentها مهم است</h2>
<p>به این تابع دقت کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def introduce(name, age):
    print(&quot;Name:&quot;, name)
    print(&quot;Age:&quot;, age)</div></div>
<p>اگر بنویسیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">introduce(&quot;Ali&quot;, 20)</div></div>
<p>داریم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">name = &quot;Ali&quot;
age = 20</div></div>
<p>اما اگر ترتیب را عوض کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">introduce(20, &quot;Ali&quot;)</div></div>
<p>داریم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">name = 20
age = &quot;Ali&quot;</div></div>
<p>ممکن است Python از نظر نوع داده خطا ندهد، اما منطق برنامه اشتباه می‌شود.</p>
<p>پس در این مرحله:</p>
<blockquote><strong>ترتیب آرگومان‌ها با ترتیب پارامترها اهمیت دارد.</strong></blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">13. تابع با محاسبه</h2>
<p>حالا تابع را کاربردی‌تر کنیم.</p>

100</div></div>

<hr class="lesson-divider">
<h2 class="lesson-title">14. یک نکته مهم: Variable داخل Function</h2>
<p>به این کد نگاه کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def square(number):
    result = number * number
    print(result)</div></div>
<p>متغیر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result</div></div>
<p>داخل تابع ساخته شده است.</p>
<p>فعلاً کافی است بدانیم:</p>
<blockquote>متغیرهایی که داخل تابع تعریف می‌کنیم برای همان بخش از برنامه هستند و در جلسه بعد درباره Scope دقیق‌تر صحبت خواهیم کرد.</blockquote>
<p>فعلاً روی مفهوم اصلی تمرکز کنیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Function
   ↓
Input
   ↓
Processing
   ↓
Output</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">15. مشکل <code>print()</code> چیست؟</h2>
<p>تابع قبلی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def square(number):
    result = number * number
    print(result)</div></div>
<p>نتیجه را <strong>چاپ</strong> می‌کند.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">square(5)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">25</div></div>
<p>اما شاید بخواهیم نتیجه را بگیریم و در جای دیگری از برنامه استفاده کنیم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = square(5)</div></div>
<p>آیا <code>result</code> برابر 25 می‌شود؟</p>
<p>فعلاً نه.</p>
<p>چون تابع ما فقط <code>print</code> کرده است.</p>
<p>اینجاست که یکی از مهم‌ترین مفاهیم Function را یاد می‌گیریم:</p>
<h1><code>return</code></h1>
<hr class="lesson-divider">
<h2 class="lesson-title">16. <code>return</code> چیست؟ </h2>
<p><code>return</code> یعنی:</p>
<blockquote><strong>نتیجه را از تابع برگردان.</strong></blockquote>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def square(number):
    return number * number</div></div>
<p>حالا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = square(5)

print(result)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">25</div></div>
<p>اینجا اتفاق مهمی افتاده است.</p>
<p>تابع نتیجه را برگردانده:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">square(5)
   ↓
25
   ↓
result</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">17. تفاوت <code>print</code> و <code>return</code> </h2>
<p>این یکی از مهم‌ترین بخش‌های جلسه است.</p>
<h3>با <code>print</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def square(number):
    print(number * number)</div></div>
<p>وظیفه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">نتیجه را نمایش بده</div></div>
<h3>با <code>return</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def square(number):
    return number * number</div></div>
<p>وظیفه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">نتیجه را برگردان</div></div>
<p>جدول:</p>
<div class="table-wrap"><table><thead><tr><th><code>print()</code></th><th><code>return</code></th></tr></thead><tbody><tr><td>نتیجه را نمایش می‌دهد</td><td>نتیجه را از تابع برمی‌گرداند</td></tr><tr><td>برای نمایش مناسب است</td><td>برای استفاده مجدد در برنامه مناسب است</td></tr><tr><td>خودش نتیجه را برای ادامه برنامه برنمی‌گرداند</td><td>مقدار را به محل فراخوانی برمی‌گرداند</td></tr></tbody></table></div>
<hr class="lesson-divider">
<h2 class="lesson-title">18. یک مثال مهم برای تفاوت <code>print</code> و <code>return</code></h2>
<p>تابع اول:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):
    print(a + b)</div></div>
<p>حالا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = add(3, 4)
print(result)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">7
None</div></div>
<p>چرا؟</p>
<p>تابع <code>7</code> را چاپ کرد، اما چیزی <code>return</code> نکرد.</p>
<p>در نتیجه مقدار برگشتی تابع:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">None</div></div>
<p>است.</p>

<h1 class="lesson-title section-troubleshoot">Troubleshooting</h1>
<h3>مشکل ۱ — تابع اجرا نمی‌شود</h3>
<p>بررسی کن که آن را Call کرده باشی:</p>

    print(a + b)</div></div>

<h3>مشکل ۳ — <code>SyntaxError</code></h3>

<p>وجود <code>:</code> را فراموش نکن.</p>
<h3>مشکل ۴ — <code>IndentationError</code></h3>

    return a + b</div></div>

<p>اگر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">add(2, 3)</div></div>

<h3>مرحله ۳ — محاسبه مبلغ نهایی</h3>
<p>حالا می‌توانیم از نتیجه تابع قبلی استفاده کنیم:</p>

print(final_price)</div></div>

<h3>مرحله ۴ — نسخه کامل</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_total(price, quantity):
    return price * quantity


def calculate_discount(total):

    if total >= 500:
        return total * 0.10
    else:
        return 0


price = 200
quantity = 3

total = calculate_total(price, quantity)
discount = calculate_discount(total)

final_price = total - discount

print(&quot;Total:&quot;, total)
print(&quot;Discount:&quot;, discount)
print(&quot;Final price:&quot;, final_price)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Total: 600
Discount: 60.0
Final price: 540.0</div></div>
<h3>مدل ذهنی سناریو</h3>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">price + quantity
       │
       ▼
calculate_total()
       │
       ▼
     total
       │
       ▼
calculate_discount()
       │
       ▼
   discount
       │
       ▼
total - discount
       │
       ▼
 final_price</div></div>
<p>نکته مهم اینجاست که Functionها باعث شدند برنامه را به قسمت‌های کوچک‌تر تقسیم کنیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">calculate_total
        ↓
محاسبه مبلغ

calculate_discount
        ↓
محاسبه تخفیف

بخش اصلی برنامه
        ↓
ترکیب نتایج</div></div>
<p>این دقیقاً یکی از دلایل اصلی استفاده از Function در برنامه‌نویسی است.</p>

<p>خیر.</p>
<p>چرا؟</p>
<p>چون <code>message</code> داخل محدوده Function ساخته شده است.</p>
<p>این همان مفهوم:</p>
<blockquote><strong>Scope</strong></blockquote>
<p>است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">14. Scope یعنی چه؟ </h2>
<p>Scope یعنی:</p>
<blockquote><strong>محدوده‌ای که یک متغیر در آن قابل دسترسی است.</strong></blockquote>
<p>فعلاً در Python Basic با دو مفهوم اصلی کار داریم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Local Scope
Global Scope</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">15. Local Variable</h2>
<p>اگر متغیری داخل Function تعریف شود، در سطح Basic آن را یک <strong>Local Variable</strong> در نظر می‌گیریم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate():
    result = 100
    print(result)</div></div>
<p>اینجا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">result</div></div>
<p>داخل تابع ساخته شده است.</p>
<p>پس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">calculate()</div></div>
<p>درست است.</p>
<p>ولی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(result)</div></div>
<p>خارج تابع قابل استفاده نیست.</p>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">                 برنامه
        ┌─────────────────────┐
        │                     │
        │   Function          │
        │   ┌─────────────┐   │
        │   │ result     │   │
        │   └─────────────┘   │
        │                     │
        └─────────────────────┘

result فقط در محدوده خودش تعریف شده</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">16. Global Variable</h2>
<p>اگر متغیر خارج Function تعریف شود، در سطح Basic می‌توانیم آن را <strong>Global Variable</strong> در نظر بگیریم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name = "Ali"

def say_hello():
    print(name)

say_hello()</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali</div></div>
<p>تابع توانسته مقدار <code>name</code> را بخواند.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">17. یک نکته مهم درباره Global Variable</h2>
<p>اگر فقط می‌خواهیم مقدار Global Variable را <strong>بخوانیم</strong>، معمولاً می‌توانیم آن را داخل تابع استفاده کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">score = 20

def show_score():
    print(score)

show_score()</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">20</div></div>
<p>اما تغییر دادن Global Variable داستان متفاوتی دارد.</p>
<p>برای Python Basic فعلاً اصل مهم‌تر این است:</p>
<blockquote>تا حد امکان اطلاعات را از طریق Parameter به Function بده و نتیجه را با <code>return</code> برگردان.</blockquote>
<p>این روش برنامه را قابل‌فهم‌تر می‌کند.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">18. چرا بهتر است زیاد به Global Variable وابسته نباشیم؟</h2>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">score = 20

def check_score():
    if score >= 10:
        return "Pass"
    else:
        return "Fail"</div></div>
<p>این تابع به یک متغیر بیرونی وابسته است.</p>
<p>حالا طراحی بهتر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def check_score(score):
    if score >= 10:
        return "Pass"
    else:
        return "Fail"</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = check_score(20)</div></div>
<p>این نسخه بهتر است، چون تابع ورودی خودش را دریافت می‌کند.</p>
<p>مدل:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Global dependency
     ↓
تابع به بیرون وابسته است


Parameter
     ↓
تابع ورودی خودش را دریافت می‌کند</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">19. یک Function خوب: Input → Process → Output </h2>
<p>یکی از بهترین مدل‌های ذهنی برای طراحی تابع:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">       Input
         ↓
     Function
         ↓
     Processing
         ↓
       Output</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_average(score1, score2):
    return (score1 + score2) / 2</div></div>
<p>ورودی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">score1
score2</div></div>
<p>پردازش:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">جمع → تقسیم بر 2</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">average</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">20. چرا <code>return</code> بهتر از وابستگی به <code>print</code> است؟</h2>
<p>تابع:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_average(a, b):
    return (a + b) / 2</div></div>
<p>انعطاف‌پذیر است.</p>
<p>می‌توانیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">average = calculate_average(10, 20)</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(calculate_average(10, 20))</div></div>
<p>یا حتی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if calculate_average(10, 20) >= 15:
    print("Good")</div></div>
<p>اما اگر تابع فقط:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_average(a, b):
    print((a + b) / 2)</div></div>
<p>باشد، استفاده از نتیجه در بخش‌های دیگر سخت می‌شود.</p>
<p>پس در طراحی Functionهای محاسباتی معمولاً:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Function → return
بخش اصلی برنامه → print</div></div>
<p>الگوی خوبی است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">21. Functionها می‌توانند همدیگر را صدا بزنند</h2>
<p>این قسمت بسیار مهم است.</p>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):
    return a + b</div></div>
<p>می‌توانیم تابع دیگری بسازیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_total(price, quantity):
    return add(price, quantity)</div></div>
<p>البته از نظر منطقی این مثال چندان کاربردی نیست، اما مفهوم را نشان می‌دهد.</p>
<p>یک مثال بهتر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_total(price, quantity):
    return price * quantity


def calculate_discount(total):
    return total * 0.10</div></div>
<p>حالا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">total = calculate_total(200, 3)
discount = calculate_discount(total)

print(discount)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">60.0</div></div>
<p>یعنی خروجی یک Function می‌تواند ورودی Function دیگر شود.</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Function A
    ↓
return
    ↓
Function B
    ↓
return</div></div>
<p>این الگو در برنامه‌های واقعی بسیار پرکاربرد است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">22. مثال: چند Function کوچک به جای یک Function بزرگ</h2>
<p>فرض کن می‌خواهیم برنامه خرید بنویسیم.</p>
<p>به جای اینکه همه‌چیز را در یک تابع بنویسیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">محاسبه قیمت
محاسبه تخفیف
محاسبه مالیات
نمایش نتیجه</div></div>
<p>می‌توانیم آن را تقسیم کنیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">calculate_total()
        ↓
calculate_discount()
        ↓
calculate_tax()
        ↓
calculate_final_price()</div></div>
<p>هر Function یک وظیفه مشخص دارد.</p>
<p>این باعث می‌شود:</p>
<ul><li>کد خواناتر شود.</li><li>تست کردن راحت‌تر شود.</li><li>تغییر دادن یک بخش ساده‌تر شود.</li><li>کدها دوباره قابل استفاده باشند.</li></ul>
<hr class="lesson-divider">
<h2 class="lesson-title">23. یک نکته مهم درباره Scope و Parameter</h2>
<p>به این کد نگاه کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def greet(name):
    message = "Hello " + name
    return message</div></div>
<p>اینجا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">name</div></div>
<p>یک Parameter است.</p>
<p>و:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">message</div></div>
<p>یک متغیر Local داخل تابع است.</p>
<p>هر دو داخل محدوده Function قرار دارند.</p>
<p>پس:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Function Scope
├── name
└── message</div></div>
<p>بیرون تابع نباید انتظار داشته باشیم <code>message</code> مستقیماً در دسترس باشد.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">24. نام یک متغیر داخل و خارج تابع</h2>
<p>ممکن است یک نام مشابه در دو Scope داشته باشیم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name = "Ali"

def show_name():
    name = "Sara"
    print(name)

show_name()
print(name)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Sara
Ali</div></div>
<p>چرا؟</p>
<p>چون:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">داخل Function
name = "Sara"

خارج Function
name = "Ali"</div></div>
<p>این دو متغیر در دو محدوده متفاوت هستند.</p>
<h3> نکته امتحانی</h3>
<p>وجود یک نام مشابه به این معنی نیست که حتماً یک متغیر واحد داریم.</p>
<p>Scope مهم است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">25. پارامتر هم داخل Scope تابع است</h2>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def square(number):
    return number * number</div></div>
<p><code>number</code> فقط در جریان اجرای این Function معنا دارد.</p>
<p>بیرون تابع نباید انتظار داشته باشیم بتوانیم از آن به عنوان همان Parameter استفاده کنیم.</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">square(5)
   ↓
number = 5
   ↓
25</div></div>
<p>بعد از پایان اجرای تابع، آن اجرای تابع تمام شده است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">26. طراحی Function با نام مناسب</h2>
<p>Function خوب فقط Functionای نیست که درست اجرا شود؛ باید خوانا هم باشد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_average(score1, score2):
    return (score1 + score2) / 2</div></div>
<p>نام:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">calculate_average</div></div>
<p>دقیقاً می‌گوید تابع چه کاری انجام می‌دهد.</p>
<p>در مقابل:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def f(a, b):
    return (a + b) / 2</div></div>
<p>کار می‌کند، اما خوانایی پایین‌تری دارد.</p>
<h3>قانون ساده:</h3>
<blockquote>نام Function باید تا حد ممکن نشان دهد Function چه کاری انجام می‌دهد.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">27. نام Parameter هم مهم است</h2>
<p>مقایسه کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_total(x, y):
    return x * y</div></div>
<p>با:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_total(price, quantity):
    return price * quantity</div></div>
<p>دومی خواناتر است.</p>
<p>وقتی کد را چند روز بعد باز می‌کنی، این:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">price * quantity</div></div>
<p>خیلی سریع‌تر مفهوم را منتقل می‌کند.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">28. یک Function نباید بیش از حد کار انجام دهد</h2>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def process_student():
    # دریافت نام
    # دریافت چند نمره

<p>این Function خیلی مسئولیت دارد.</p>
<p>در سطح Basic لازم نیست وارد معماری پیچیده شویم، اما بهتر است منطق را تا حد امکان به قسمت‌های مشخص تقسیم کنیم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_average(score1, score2):

def check_result(average):
    if average >= 10:
        return "Pass"

<p>حالا هر تابع کار خودش را انجام می‌دهد.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">29. ترکیب شرط با <code>return</code></h2>
<p>در جلسه قبل دیدیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def check_score(score):
    if score >= 10:
        return "Pass"
    else:
        return "Fail"</div></div>
<p>در اینجا می‌توانیم کمی کوتاه‌تر بنویسیم:</p>

    if score >= 10:
        return "Pass"

    return "Fail"</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">return "Pass"</div></div>
<p>تابع همان‌جا تمام می‌شود.</p>
<p>اگر شرط برقرار نباشد، به خط بعد می‌رسد:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">return "Fail"</div></div>
<p>این الگو را زیاد در کدهای Python خواهی دید.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">30. Default Parameter + Keyword Argument</h2>
<p>حالا چند مفهوم را با هم ترکیب کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def greet(name, message="Hello"):
    return message + " " + name</div></div>

<hr class="lesson-divider">
<h2 class="lesson-title">31. <code>input()</code> و Function</h2>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">input
 ↓
casting
 ↓
Function
 ↓
return
 ↓
print</div></div>
<p>این جداسازی معمولاً کد را تمیزتر می‌کند.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">32. Function و Loop</h2>
<p>می‌توانیم تابع را داخل حلقه هم استفاده کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def square(number):
    return number * number


for number in range(1, 6):
    result = square(number)
    print(result)</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
4
9
16

<h2 class="lesson-title">🧠 مدل ذهنی کل جلسه</h2>
<p>در پایان جلسه، Function را این‌طور ببین:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">                    Function
                       │
          ┌────────────┼────────────┐
          │            │            │
     Parameters     Processing    return
          │            │            │
          ▼            ▼            ▼
       Input        Logic         Output</div></div>
<p>روش‌های مهم ارسال داده:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Positional
    ↓
add(10, 20)


Keyword
    ↓
add(a=10, b=20)


Default
    ↓
function(a, b=0)</div></div>
<p>و Scope:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Global Scope
│

│

<h1 class="lesson-title section-troubleshoot">Troubleshooting</h1>
<h3>مشکل ۱ — <code>SyntaxError</code> در Argumentها</h3>
<p>این اشتباه است:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">introduce(name="Ali", 20)</div></div>
<p>چون Positional بعد از Keyword آمده است.</p>
<p>درست:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">introduce("Ali", age=20)</div></div>
<h3>مشکل ۲ — Default Parameter جای اشتباه قرار گرفته</h3>
<p>اشتباه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def test(a=10, b):
    ...</div></div>
<p>درست:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def test(a, b=10):
    ...</div></div>
<h3>مشکل ۳ — متغیر داخل Function بیرون آن پیدا نمی‌شود</h3>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def test():
    result = 10

print(result)</div></div>
<p><code>result</code> داخل Function تعریف شده و بیرون آن قابل دسترسی مستقیم نیست.</p>
<p>اگر می‌خواهی نتیجه را بیرون استفاده کنی، از <code>return</code> استفاده کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def test():
    result = 10
    return result


result = test()
print(result)</div></div>
<h3>مشکل ۴ — تابع به Global Variable وابسته شده</h3>
<p>این روش ممکن است کار کند:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">score = 20

def check():
    return score >= 10</div></div>
<p>اما طراحی بهتر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def check(score):
    return score >= 10


print(check(20))</div></div>
<p>تابع دوم مستقل‌تر و قابل استفاده مجددتر است.</p>
<h3>مشکل ۵ — انتظار داریم <code>print</code> نتیجه را برگرداند</h3>
<p>این:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):
    print(a + b)</div></div>
<p>برای نمایش مناسب است.</p>
<p>ولی اگر بخواهی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = add(2, 3)</div></div>
<p>و <code>result</code> برابر <code>5</code> شود، باید:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def add(a, b):
    return a + b</div></div>
<p>بنویسی.</p>
<hr class="lesson-divider">
<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li><strong>Positional Argument</strong> بر اساس ترتیب ارسال می‌شود.</li><li><strong>Keyword Argument</strong> با نام Parameter ارسال می‌شود.</li><li>Positional باید قبل از Keyword قرار بگیرد.</li><li>Parameter دارای مقدار پیش‌فرض را <strong>Default Parameter</strong> می‌گوییم.</li><li>پارامترهای اجباری باید قبل از Default Parameterها قرار بگیرند.</li><li>Scope یعنی محدوده دسترسی یک متغیر.</li><li>متغیر تعریف‌شده داخل Function معمولاً Local است.</li><li>متغیر تعریف‌شده خارج Function می‌تواند Global باشد.</li><li>Function می‌تواند مقدار Global را بخواند، اما بهتر است برای طراحی تمیز، وابستگی غیرضروری به Globalها نداشته باشیم.</li><li>برای انتقال اطلاعات به Function از Parameter استفاده کن.</li><li>برای گرفتن نتیجه از Function از <code>return</code> استفاده کن.</li><li>Function بهتر است یک وظیفه مشخص داشته باشد.</li><li>نام مناسب Function و Parameter خوانایی کد را بالا می‌برد.</li><li>خروجی یک Function می‌تواند ورودی Function دیگری باشد.</li></ul>
<hr class="lesson-divider">
<h2 class="lesson-title">🔄 Recall سریع</h2>
<ol><li>این دو چه تفاوتی دارند؟ <code>add(10, 20)</code> و <code>add(a=10, b=20)</code></li><li>مقدار پیش‌فرض کجاست؟ <code>def greet(name="Guest"):</code></li><li>آیا این درست است؟ <code>def test(a=10, b): ...</code></li><li>Scope چیست؟</li><li>خروجی چیست؟ <code>x = 10<br>def test():<br>    x = 20<br>    print(x)<br>test()<br>print(x)</code></li><li>برای انتقال نتیجه Function به بیرون از آن معمولاً از چه چیزی استفاده می‌کنیم؟</li></ol>

<h1 class="lesson-title section-scenario">سناریوی ترکیبی</h1>
<p>فرض کن می‌خواهیم یک سیستم ساده برای بررسی نمرات دانش‌آموز بسازیم.</p>
<p>اطلاعات:</p>

نمره اول

<p>می‌خواهیم:</p>

<p>اینجا سه Function مناسب داریم.</p>
<h3>مرحله ۱ — محاسبه میانگین</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def calculate_average(score1, score2):

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def check_result(average):
    if average >= 10:
        return "Pass"

    return "Fail"</div></div>
<h3>مرحله ۳ — ساخت گزارش</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">def create_report(name, average, result):
    return f"{name}: {average} - {result}"</div></div>
<h3>مرحله ۴ — ترکیب Functionها</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name = "Ali"
score1 = 18
score2 = 16

average = calculate_average(score1, score2)
result = check_result(average)

report = create_report(name, average, result)

print(report)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali: 17.0 - Pass</div></div>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">score1 + score2
       ↓
calculate_average()
       ↓
   average
       ↓
check_result()
       ↓
   Pass/Fail
       ↓
create_report()
       ↓
    report</div></div>
<h3>چرا این طراحی خوب است؟</h3>
<p>چون هر Function یک کار مشخص انجام می‌دهد:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">calculate_average
        ↓
محاسبه میانگین

check_result
        ↓
بررسی وضعیت

create_report
        ↓
ساخت گزارش</div></div>
<p>و هیچ Function مجبور نیست همه کارها را به‌تنهایی انجام دهد.</p>
<h3>🧪 بخش کدنویسی برای تو</h3>
<p>حالا همین سناریو را کمی تغییر بده:</p>
<p>برنامه‌ای بنویس که:</p>
<ul><li>سه نمره بگیرد.</li><li>میانگین سه نمره را محاسبه کند.</li><li>اگر میانگین حداقل <code>12</code> بود <code>"Pass"</code> و در غیر این صورت <code>"Fail"</code> برگرداند.</li><li>در پایان نام دانش‌آموز، میانگین و وضعیت را چاپ کند.</li></ul>
<h3>یک راه‌حل ممکن</h3>

score3 = float(input("Score 3: "))

average = calculate_average(score1, score2, score3)

print("Average:", average)
print("Result:", result)</div></div>

                icon.classList.replace('fa-moon', 'fa-sun');

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

<script>
(function () {
    const playgrounds = Array.from(document.querySelectorAll('.python-playground[data-playground]'));
    if (!playgrounds.length || typeof CodeMirror === 'undefined') return;

    let pyodide = null;
    let pyodideReady = false;
    let loadingPromise = null;
    const editors = new Map();

    function setOutput(root, text, type) {
        const out = root.querySelector('.playground-output');
        if (!out) return;
        out.textContent = text;
        out.classList.remove('error', 'success', 'loading');
        if (type) out.classList.add(type);
    }
    function setStatus(root, text) {
        const el = root.querySelector('.playground-status');
        if (el) el.textContent = text;
    }

    function setupEditors() {
        playgrounds.forEach(root => {
            const ta = root.querySelector('.python-editor');
            if (!ta) return;
            const editor = CodeMirror.fromTextArea(ta, {
                mode: 'python', theme: 'dracula', lineNumbers: true,
                indentUnit: 4, tabSize: 4, indentWithTabs: false,
                lineWrapping: true, autofocus: false, viewportMargin: Infinity,
                extraKeys: {
                    'Ctrl-Enter': () => run(root),
                    'Cmd-Enter': () => run(root),
                    'Tab': cm => cm.somethingSelected() ? cm.indentSelection('add') : cm.replaceSelection('    ', 'end')
                }
            });
            editors.set(root, editor);
            root.querySelector('[data-action="run"]').addEventListener('click', () => run(root));
            root.querySelector('[data-action="clear"]').addEventListener('click', () => {
                setOutput(root, '▶ خروجی پاک شد. کد را اجرا کنید.');
                setStatus(root, pyodideReady ? 'آماده' : 'در حال آماده‌سازی...');
            });
            setTimeout(() => editor.refresh(), 200);
        });
    }

    async function loadPyodideOnce() {
        if (pyodideReady) return true;
        if (loadingPromise) return loadingPromise;
        loadingPromise = (async () => {
            playgrounds.forEach(r => { setStatus(r, 'بارگذاری...'); setOutput(r, '⏳ در حال بارگذاری مفسر پایتون (اولین بار کمی طول می‌کشد)...', 'loading'); });
            try {
                pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });
                pyodide.runPython(`
import builtins
from js import prompt as _browser_prompt
def _input(prompt=""):
    result = _browser_prompt(str(prompt) if prompt else "")
    return "" if result is None else str(result)
builtins.input = _input
`);
                pyodideReady = true;
                playgrounds.forEach(r => { setStatus(r, 'آماده'); setOutput(r, '✅ مفسر آماده است', 'success'); });
                return true;
            } catch (err) {
                playgrounds.forEach(r => { setStatus(r, 'خطا'); setOutput(r, '❌ خطا در بارگذاری مفسر: ' + (err.message || String(err)), 'error'); });
                return false;
            }
        })();
        return loadingPromise;
    }

    async function run(root) {
        const editor = editors.get(root);
        if (!editor || root.dataset.running === '1') return;
        root.dataset.running = '1';
        const runBtn = root.querySelector('[data-action="run"]');
        if (runBtn) runBtn.disabled = true;
        try {
            if (!(await loadPyodideOnce())) return;
            const code = editor.getValue();
            if (!code.trim()) { setOutput(root, '⚠️ لطفاً کدی بنویسید.', 'loading'); return; }
            setOutput(root, '⏳ در حال اجرا...', 'loading'); setStatus(root, 'اجرا...');
            pyodide.runPython(`
import sys
from io import StringIO
__stdout_backup = sys.stdout
__stderr_backup = sys.stderr
sys.stdout = StringIO()
sys.stderr = StringIO()
`);
            let result = null, error = null;
            try { result = await pyodide.runPythonAsync(code); } catch (e) { error = e; }
            const captured = pyodide.runPython(`
out = sys.stdout.getvalue()
err = sys.stderr.getvalue()
sys.stdout = __stdout_backup
sys.stderr = __stderr_backup
out + (err if err else "")
`);
            let finalOutput = (captured || '').trimEnd();
            if (result !== undefined && result !== null && String(result) !== 'None') finalOutput += (finalOutput ? '\n' : '') + String(result);
            if (error) {
                let msg = error.message || String(error);
                msg = msg.replace(/File "<exec>", line \d+, in <module>\n?/g, '').replace(/File "<exec>", line \d+, in /g, '').trim();
                setOutput(root, (finalOutput ? finalOutput + '\n\n' : '') + '❌ ' + msg, 'error');
                setStatus(root, 'خطا');
            } else {
                setOutput(root, finalOutput || '✅ اجرا شد (بدون خروجی)', finalOutput ? null : 'success');
                setStatus(root, 'آماده');
            }
        } finally {
            root.dataset.running = '0';
            if (runBtn) runBtn.disabled = false;
            try { editor.refresh(); } catch(e) {}
        }
    }

    document.querySelectorAll('.solution-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
            const target = document.getElementById(btn.dataset.solution);
            if (!target) return;
            const show = target.classList.toggle('show');
            btn.innerHTML = show ? '<i class="fas fa-eye-slash"></i> مخفی‌کردن پاسخ' : '<i class="fas fa-eye"></i> نمایش پاسخ';
        });
    });

    setupEditors();
    window.addEventListener('resize', () => editors.forEach(e => { try { e.refresh(); } catch(_) {} }));
    window.addEventListener('load', () => setTimeout(loadPyodideOnce, 400));
    if (document.readyState === 'complete') setTimeout(loadPyodideOnce, 500);
})();
</script>

</body>
</html>
