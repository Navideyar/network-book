<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دوره Python · ZeroDay</title>

    <!-- فونت‌ها -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- CodeMirror (editor) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />

    <style>
        /* ===== متغیرهای CSS ===== */
        :root {
            --primary: #306998;
            --primary-hover: #1d4b6e;
            --primary-soft: #d1e0f0;
            --primary-glow: rgba(48, 105, 152, 0.25);
            --link: #245f96;
            --link-hover: #17466f;

            --bg-body: #f5f7fa;
            --bg-card: #ffffff;
            --bg-navbar: rgba(255, 255, 255, 0.92);
            --bg-code: #1e293b;
            --bg-toc-hover: #eef4fb;

            --text-main: #2d3748;
            --text-heading: #1a202c;
            --text-muted: #4a5568;

            --border: #e2e8f0;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --radius-sm: 10px;

            --note-bg: #e6ffed;
            --note-border: #2b8a3e;
            --important-bg: #e3f2fd;
            --important-border: #1976d2;
            --warning-bg: #fff8e1;
            --warning-border: #f57c00;

            --code-text: #e2e8f0;
            --terminal-green: #8ae234;
            --sidebar-width: 300px;
        }

        [data-theme="dark"] {
            --primary: #4d8dc7;
            --primary-hover: #5fa3d9;
            --primary-soft: rgba(77, 141, 199, 0.15);
            --primary-glow: rgba(77, 141, 199, 0.25);
            --link: #7fc4ff;
            --link-hover: #a9d9ff;

            --bg-body: #1a1e26;
            --bg-card: #242a36;
            --bg-navbar: rgba(30, 34, 44, 0.95);
            --bg-code: #0f131a;
            --bg-toc-hover: rgba(77, 141, 199, 0.12);

            --text-main: #e2e8f0;
            --text-heading: #f0f4fa;
            --text-muted: #a0aec0;

            --border: #3a4050;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);

            --note-bg: rgba(43, 138, 62, 0.15);
            --note-border: #5fbf7a;
            --important-bg: rgba(25, 118, 210, 0.15);
            --important-border: #64b5f6;
            --warning-bg: rgba(245, 124, 0, 0.15);
            --warning-border: #ffb74d;

            --code-text: #e2e8f0;
        }

        /* ===== ریست و پایه ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            overflow-x: hidden;
            max-width: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.8;
            font-size: 16.5px;
            padding-top: 64px;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            max-width: 100%;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== نوار بالا ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-navbar);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
            z-index: 1000;
            transition: background 0.3s, border-color 0.3s;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            white-space: nowrap;
        }
        .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
        }
        .nav-spacer {
            flex: 1;
        }
        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .theme-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        /* ===== نوار پیشرفت ===== */
        .progress-track {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            z-index: 999;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #7ab7e0);
            width: 0%;
            transition: width 0.15s;
        }

        /* ===== سایدبار ===== */
        .sidebar {
            position: fixed;
            top: 60px;
            right: 0;
            width: var(--sidebar-width);
            height: calc(100vh - 60px);
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            z-index: 900;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s, border-color 0.3s;
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.04);
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg-card);
            z-index: 2;
        }
        .sidebar-header h3 {
            font-size: 1rem;
            color: var(--text-heading);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-header h3 i {
            color: var(--primary);
        }
        .sidebar-close {
            display: none;
            background: none;
            border: none;
            font-size: 1.15rem;
            color: var(--text-muted);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: 0.2s;
        }
        .sidebar-close:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }

        /* ===== فهرست مطالب ===== */
        .toc {
            padding: 8px 0 30px;
        }
        .toc-chapter {
            border-bottom: 1px solid var(--border);
        }
        .toc-chapter:last-child {
            border-bottom: none;
        }
        .toc-chapter summary {
            padding: 12px 14px;
            font-weight: 600;
            color: var(--text-heading);
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: background 0.15s;
            user-select: none;
            font-size: 0.92rem;
            line-height: 1.4;
            border-radius: 0;
        }
        .toc-chapter summary::-webkit-details-marker {
            display: none;
        }
        .toc-chapter summary::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            margin-right: auto;
            margin-top: 2px;
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: transform 0.25s;
            flex-shrink: 0;
        }
        .toc-chapter[open] summary::after {
            transform: rotate(180deg);
        }
        .toc-chapter summary:hover {
            background: var(--bg-toc-hover);
        }
        .toc-chapter[open]>summary {
            background: var(--primary-soft);
            color: var(--primary);
        }
        .chapter-num {
            width: 24px;
            height: 24px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .toc-sections {
            list-style: none;
            padding: 0 0 8px 0;
            margin: 0;
            background: var(--bg-body);
        }
        .toc-sections li a {
            display: block;
            padding: 8px 14px 8px 48px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.15s;
            border-right: 3px solid transparent;
            line-height: 1.45;
        }
        .toc-sections li a:hover {
            color: var(--primary);
            background: var(--bg-toc-hover);
        }
        .toc-sections li a.active {
            color: var(--primary);
            background: var(--primary-soft);
            border-right-color: var(--primary);
            font-weight: 600;
        }

        .toc-practice {
            display: block;
            padding: 0;
            margin-top: 2px;
            font-size: 0.83rem;
            line-height: 1.45;
        }

        .toc-practice a {
            display: block;
            padding: 8px 14px 10px 48px;
            color: var(--link);
            text-decoration: none;
            border-right: 3px solid transparent;
            cursor: pointer;
        }

        .toc-practice a:hover {
            color: var(--link-hover);
            background: var(--primary-soft);
            border-right-color: var(--primary);
        }

        .toc-practice i {
            color: inherit;
            margin-left: 5px;
            font-size: 0.8rem;
        }

        /* ===== دکمه باز کردن سایدبار ===== */
        .sidebar-toggle {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            font-size: 1.25rem;
            box-shadow: 0 6px 20px var(--primary-glow);
            z-index: 950;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }
        .sidebar-toggle:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 850;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.open {
            display: block;
        }

        /* ===== محتوای اصلی ===== */
        .main {
            max-width: 820px;
            margin: 0 auto;
            margin-right: calc(var(--sidebar-width) + 24px);
            padding: 32px 24px 80px;
            transition: margin 0.3s;
            min-width: 0;
            width: 100%;
            overflow-x: hidden;
        }
        .section {
            display: none;
            animation: fadeIn 0.35s ease;
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }
        .section.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== هدر بخش ===== */
        .section-header {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
            transition: background 0.3s, border-color 0.3s;
        }
        .section-header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background: var(--primary);
        }
        .section-badge {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .section-header h1 {
            font-size: 1.3rem;
            color: var(--text-heading);
            margin-bottom: 3px;
            line-height: 1.4;
        }
        .section-header .meta {
            font-size: 0.84rem;
            color: var(--text-muted);
        }

        /* ===== تایپوگرافی ===== */
        h2 {
            color: var(--text-heading);
            font-size: 1.25rem;
            margin: 32px 0 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            flex-shrink: 0;
        }
        h3 {
            color: var(--text-heading);
            font-size: 1.05rem;
            margin: 20px 0 8px;
        }

        .lesson-title {
            color: var(--text-heading);
            margin-top: 30px;
        }
        p {
            margin-bottom: 14px;
            text-align: justify;
        }
        strong {
            color: var(--text-heading);
        }

        /* ===== تمرینات فصل ===== */
        .exercise-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.65);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }

        .exercise-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .exercise-modal-content {
            position: relative;
            width: min(420px, 100%);
            padding: 32px 24px;
            text-align: center;
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
        }

        .exercise-modal-close {
            position: absolute;
            top: 8px;
            left: 12px;
            border: 0;
            background: transparent;
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
        }

        .exercise-modal-icon {
            color: var(--primary);
            font-size: 30px;
            margin-bottom: 10px;
        }

        .exercise-modal-content h2 {
            margin: 0 0 8px;
            color: var(--text-heading);
        }

        .exercise-modal-chapter {
            margin: 0 0 18px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .exercise-modal-message {
            margin: 0;
            color: var(--link);
            font-weight: 600;
        }

        /* ===== لینک‌ها ===== */
        a {
            color: var(--link);
            text-decoration-thickness: 1px;
            text-underline-offset: 2px;
            transition: color 0.15s, background 0.15s;
        }

        a:hover {
            color: var(--link-hover);
        }

        /* لینک‌های فهرست ظاهر اختصاصی خودشان را حفظ می‌کنند */
        .toc-sections li a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .toc-sections li a:hover,
        .toc-sections li a.active {
            color: var(--primary);
        }
        ul,
        ol {
            margin: 10px 0 18px;
            padding-right: 24px;
        }
        li {
            margin-bottom: 6px;
        }
        blockquote {
            background: var(--primary-soft);
            border-right: 4px solid var(--primary);
            padding: 14px 18px;
            margin: 20px 0;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            color: var(--text-heading);
            font-style: italic;
            transition: background 0.3s, border-color 0.3s;
        }

        /* ===== جعبه‌های اطلاعاتی ===== */
        .box {
            display: flex;
            gap: 14px;
            padding: 16px 18px;
            border-radius: var(--radius-sm);
            margin: 22px 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            transition: background 0.3s, border-color 0.3s;
        }
        .box>div {
            min-width: 0;
            flex: 1;
            overflow-wrap: break-word;
        }
        .box i {
            font-size: 1.3rem;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .box strong {
            display: block;
            margin-bottom: 3px;
        }
        .box.note {
            background: var(--note-bg);
            border-color: var(--note-border);
        }
        .box.note i,
        .box.note strong {
            color: var(--note-border);
        }
        .box.important {
            background: var(--important-bg);
            border-color: var(--important-border);
        }
        .box.important i,
        .box.important strong {
            color: var(--important-border);
        }
        .box.warning {
            background: var(--warning-bg);
            border-color: var(--warning-border);
        }
        .box.warning i,
        .box.warning strong {
            color: var(--warning-border);
        }

        /* ===== کد ===== */
        .code-container {
            position: relative;
            margin: 24px 0;
            max-width: 100%;
            min-width: 0;
            width: 100%;
        }
        .code-label {
            position: absolute;
            top: -11px;
            left: 14px;
            background: var(--primary);
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 14px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            z-index: 1;
            letter-spacing: 0.3px;
        }
        .code-block {
            background: var(--bg-code);
            color: var(--code-text);
            padding: 28px 18px 18px;
            border-radius: var(--radius-sm);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            direction: ltr;
            text-align: left;
            unicode-bidi: isolate;
            white-space: pre;
            overflow-x: auto;
            border: 1px solid var(--border);
            max-width: 100%;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
            transition: background 0.3s, border-color 0.3s;
            line-height: 1.6;
        }
        .code-block::before {
            content: '>>> ';
            color: var(--terminal-green);
        }
        .code-block.no-prompt::before {
            content: none;
        }

        /* ===== جدول ===== */
        .table-wrap {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 22px 0;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0;
            font-size: 0.93rem;
            border-radius: var(--radius-sm);
            overflow: hidden;
            min-width: 0;
        }
        th,
        td {
            border: 1px solid var(--border);
            padding: 11px 14px;
            text-align: right;
            vertical-align: top;
        }
        th {
            background: var(--primary-soft);
            color: var(--text-heading);
            font-weight: 600;
            white-space: nowrap;
        }
        tr:hover td {
            background: var(--bg-body);
        }
        td code {
            white-space: nowrap;
        }

        /* ===== جمع‌بندی ===== */
        .summary-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            margin: 24px 0;
            box-shadow: var(--shadow);
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            transition: background 0.3s, border-color 0.3s;
        }
        .summary-box h3 {
            margin-top: 0;
            color: var(--primary);
        }

        /* ===== کوئیز ===== */
        .quiz-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            margin: 28px 0 16px;
            box-shadow: var(--shadow);
            transition: background 0.3s, border-color 0.3s;
        }
        .quiz-card>p {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-heading);
            margin-bottom: 16px;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .quiz-options button {
            background: var(--bg-body);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            text-align: right;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.2s;
        }
        .quiz-options button:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        .quiz-options button.selected {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .quiz-answer {
            display: none;
            margin-top: 14px;
            padding: 14px 16px;
            background: var(--note-bg);
            border-radius: var(--radius-sm);
            border-right: 4px solid var(--note-border);
            color: var(--text-heading);
            font-size: 0.95rem;
            transition: background 0.3s, border-color 0.3s;
        }
        .quiz-answer.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        /* ===== ویرایشگر پایتون (Playground) ===== */
        .python-playground {
            margin: 24px 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
            background: #1e1e2e;
            border: 1px solid #313244;
            direction: ltr;
            max-width: 100%;
        }
        .playground-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #181825;
            padding: 10px 14px;

<h2 class="lesson-title">12. Dynamic Typing در Python</h2>

<p>

<p>مثلاً در زبان‌هایی با Syntax مشابه این را نمی‌نویسیم:</p>

<div class="code-container">

<p>در Python کافی است بنویسیم:</p>

</div>

<p>

</p>

<p>
    حتی یک Variable می‌تواند بعداً به مقدار دیگری با Type متفاوت نسبت داده شود:
</p>

<div class="code-container">

</blockquote>

<h2 class="lesson-title">6. تبدیل به <code>str</code> با <code>str()</code></h2>

<h2 class="lesson-title">11. Membership Operators</h2>

<p>Membership بررسی می‌کند که آیا یک مقدار <strong>داخل یک مجموعه یا Sequence</strong> وجود دارد یا نه.</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Operator</th>
<th>معنی</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>in</code></td>
<td>عضو است؟</td>
</tr>
<tr>
<td><code>not in</code></td>
<td>عضو نیست؟</td>
</tr>
</tbody>
</table>
</div>

<h3>با String</h3>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">name = "Python"

print("P" in name)
print("z" not in name)</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">True
True</div>
</div>

<h3>با List</h3>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">colors = ["red", "blue", "green"]

print("blue" in colors)
print("black" in colors)</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">True
False</div>
</div>

<h3>دام تستی: <code>==</code> در برابر <code>in</code></h3>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>کد</th>
<th>سؤال</th>
</tr>
</thead>
<tbody>

<td><code>"blue" == colors</code></td>
<td>آیا "blue" برابر کل List است؟</td>
</tr>
<tr>
<td><code>"blue" in colors</code></td>
<td>آیا "blue" یکی از اعضای List است؟</td>
</tr>
</tbody>
</table>
</div>

<blockquote>
<strong><code>==</code> → مقایسه مقدار &nbsp;&nbsp;|&nbsp;&nbsp; <code>in</code> → بررسی عضویت</strong>
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">12. Identity Operators</h2>

<p>Identity بررسی می‌کند که آیا دو Variable به <strong>همان Object</strong> اشاره می‌کنند یا نه.</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Operator</th>
<th>کاربرد</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>is</code></td>
<td>همان Object است؟</td>
</tr>
<tr>
<td><code>is not</code></td>
<td>همان Object نیست؟</td>
</tr>
</tbody>
</table>
</div>

<p>در سطح فعلی، مهم‌ترین کاربرد آن بررسی <code>None</code> است:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">value = None

print(value is None)
print(value is not None)</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">True
False</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">13. تفاوت <code>==</code> و <code>is</code></h2>

<p>این تفاوت بسیار مهم است:</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Operator</th>
<th>بررسی می‌کند</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>==</code></td>
<td>آیا مقدارها برابرند؟</td>
</tr>
<tr>
<td><code>is</code></td>
<td>آیا دو Variable همان Object را دارند؟</td>
</tr>
</tbody>
</table>
</div>

<p>مثلاً:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">a = [1, 2]
b = [1, 2]

print(a == b)
print(a is b)</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">True
False</div>
</div>

<p>چرا؟ چون محتویات دو List یکی است، اما خود Objectها جدا هستند.</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">a ───► [1, 2]
b ───► [1, 2]

a == b → True
a is b → False</div>
</div>

<blockquote>
<strong>Value → <code>==</code></strong><br>
<strong>Identity → <code>is</code></strong>
</blockquote>

<h3>قانون مهم برای <code>None</code></h3>

<div class="code-container">

value is not None</div>
</div>

<p>برای بررسی <code>None</code> این الگو را به خاطر بسپار.</p>

<h2 class="lesson-title">1. Input و Output چیست؟</h2>

<p>تقریباً هر برنامه‌ای با داده کار می‌کند. این داده می‌تواند از کاربر وارد برنامه شود، در برنامه پردازش شود و نتیجه دوباره به کاربر نمایش داده شود.</p>

  │ Processing
  ▼
Output
  │
  ▼
User</div>
</div>

<tr>
<td><code>print()</code></td>
<td>نمایش اطلاعات به کاربر</td>
</tr>
</tbody>
</table>

<h2 class="lesson-title">2. <code>print()</code> — نمایش اطلاعات</h2>

<p>تابع <code>print()</code> برای نمایش اطلاعات در خروجی استفاده می‌شود.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">print("Hello Python")
print(10)
print(10 + 5)</div>
</div>

<p>خروجی:</p>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">Hello Python
10
15</div>

<p>نکته مهم: داخل <code>print()</code> فقط متن قرار نمی‌گیرد؛ می‌توانیم عدد، Variable یا حتی یک عبارت را نیز قرار دهیم.</p>

print(name)

<div class="code-container">

<div class="code-block no-prompt">name = "Ali"
age = 20

print(name, age)</div>
</div>

<h2 class="lesson-title">4. <code>sep</code> و <code>end</code></h2>

<p>دو پارامتر مهم <code>print()</code> برای کنترل شکل خروجی، <code>sep</code> و <code>end</code> هستند.</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>پارامتر</th>
<th>وظیفه</th>
<th>مقدار پیش‌فرض</th>

<tbody>
<tr>
<td><code>sep</code></td>
<td>جداکننده بین چند مقدار</td>
<td><code>" "</code></td>

<tr>
<td><code>end</code></td>
<td>چیزی که در انتهای <code>print()</code> قرار می‌گیرد</td>
<td><code>"\n"</code></td>
</tr>
</tbody>
</table>
</div>

<h3><code>sep</code> — جداکننده بین مقادیر</h3>

<div class="code-container">

</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">2026-09-07</div>
</div>

<p>یعنی:</p>

<div class="code-container">
<span class="code-label">مدل ذهنی</span>
<div class="code-block no-prompt">A sep B sep C</div>
</div>

<h3><code>end</code> — پایان <code>print()</code></h3>

<p>به صورت پیش‌فرض، <code>print()</code> در انتها یک <code>"\n"</code> قرار می‌دهد؛ یعنی به خط بعد می‌رود.</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">print("Hello")
print("Python")</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">Hello
Python</div>
</div>

<p>می‌توانیم این رفتار را تغییر دهیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">print("Hello", end=" ")
print("Python")</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">Hello Python</div>
</div>

<p>پس خیلی ساده به خاطر بسپار:</p>

<div class="code-container">
<span class="code-label">یادآوری</span>
<div class="code-block no-prompt">sep → بین چند مقدار
end → بعد از print()</div>
</div>

<h2 class="lesson-title">5. <code>input()</code> — دریافت اطلاعات از کاربر</h2>

<p>برای دریافت اطلاعات از کاربر از <code>input()</code> استفاده می‌کنیم.</p>

نمایش نتیجه</div>
</div>

<h2 class="lesson-title">6. نکته بسیار مهم: <code>input()</code> همیشه <code>str</code> برمی‌گرداند</h2>

<p>این مهم‌ترین نکته این جلسه است:</p>

print(type(age))</div>

<h2 class="lesson-title">7. Input + Type Casting</h2>

<p>در جلسه ۳ یاد گرفتیم که با Type Casting می‌توانیم نوع داده را تغییر دهیم.</p>

<p>پس اگر ورودی ما باید عدد باشد، آن را هنگام دریافت تبدیل می‌کنیم.</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>نوع داده موردنیاز</th>
<th>روش دریافت</th>
</tr>

<tr>
<td>متن</td>
<td><code>input()</code></td>

<tr>
<td>عدد صحیح</td>

</tr>

</table>

print(age + 5)</div>
</div>

<p>اگر کاربر <code>20</code> وارد کند، ابتدا <code>input()</code> مقدار <code>"20"</code> را می‌دهد و سپس <code>int()</code> آن را به <code>20</code> تبدیل می‌کند.</p>

<div class="code-container">

<div class="code-block no-prompt">input()

int()
   ↓

   ↓

   ↓
25</div>

<div class="code-container">
<span class="code-label">Python</span>

print(price)</div>
</div>

<p>اگر کاربر <code>19.5</code> وارد کند، مقدار <code>price</code> از نوع <code>float</code> خواهد بود.</p>

<h2 class="lesson-title">8. چرا Type Casting مهم است؟</h2>

<p>فرض کن دو عدد از کاربر دریافت می‌کنیم:</p>

<div class="code-container">

<div class="code-block no-prompt">a = input()

print(a + b)</div>

     ↓

<p>اینجا مطالب چند جلسه به یکدیگر متصل می‌شوند:</p>

        ↓

<h2 class="lesson-title">11. ساخت خروجی خوانا</h2>

<p>خروجی برنامه بهتر است برای کاربر واضح باشد.</p>

<p>مثلاً:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">age = 20

print(age)</div>
</div>

<p>کار می‌کند، اما مشخص نیست این عدد مربوط به چیست.</p>

<p>بهتر:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">print("Your age is:", age)</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">Your age is: 20</div>
</div>

<p>همچنین می‌توانیم چند مقدار را با <code>print()</code> ترکیب کنیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">name = "Ali"
score = 18

print("Name:", name, "Score:", score)</div>
</div>

<p>پس هدف فقط «چاپ کردن» نیست؛ خروجی باید <strong>خوانا و قابل‌فهم</strong> باشد.</p>

<h2 class="lesson-title">🔄 Recall سریع</h2>

<p>بدون نگاه کردن به درس جواب بده:</p>

<ol>
<li><code>input()</code> و <code>print()</code> چه کاری انجام می‌دهند؟</li>
<li><code>input()</code> چه نوع داده‌ای برمی‌گرداند؟</li>

<h2 class="lesson-title">معرفی جلسه</h2>

<p>
در جلسه قبل با <code>input()</code> و <code>print()</code> یاد گرفتیم که برنامه می‌تواند
با کاربر تعامل داشته باشد.
اما مقدار زیادی از اطلاعاتی که برنامه‌ها دریافت و پردازش می‌کنند، <strong>متن</strong> هستند.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">name = "Ali"
city = "Tehran"
message = "Hello Python"</div>
</div>

<p>
در Python به داده‌های متنی <strong>String</strong> یا <code>str</code> می‌گوییم.
در این جلسه یاد می‌گیریم چگونه داخل String حرکت کنیم، بخشی از آن را جدا کنیم،
متن را پردازش کنیم و در نهایت آن را همراه با متغیرها در خروجی نمایش دهیم.
</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">String
  │
  ├── Indexing  → دسترسی به یک کاراکتر
  │
  ├── Slicing   → استخراج بخشی از متن
  │
  ├── Methods   → پردازش متن
  │
  └── f-string  → ساخت متن خوانا</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">1. String چیست؟</h2>

<p>
<strong>String</strong> داده‌ای است که برای نگهداری متن و مجموعه‌ای از کاراکترها استفاده می‌شود.
</p>

<p>برای ساخت String معمولاً از کوتیشن تکی یا دوتایی استفاده می‌کنیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">name = "Ali"
city = 'Tehran'</div>
</div>

<p>هر دو صحیح هستند.</p>

<p>نوع داده را نیز می‌توانیم با <code>type()</code> بررسی کنیم:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">name = "Ali"

print(type(name))</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">&lt;class 'str'&gt;</div>
</div>

<p>پس:</p>

<div class="code-container">
<span class="code-label">Recall</span>
<div class="code-block no-prompt">"Ali" → str</div>
</div>

<div class="lesson-note">
<strong>نکته:</strong>
کوتیشن شروع و پایان String باید با هم هماهنگ باشند.
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">2. طول String با <code>len()</code></h2>

<p>
برای فهمیدن تعداد کاراکترهای یک String از <code>len()</code> استفاده می‌کنیم.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">word = "Python"

print(len(word))</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">6</div>
</div>

<p>
دقت کن که <code>len()</code> تعداد کاراکترها را می‌دهد، اما Indexها از <strong>0</strong> شروع می‌شوند.
</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">String:  P   y   t   h   o   n
Index:   0   1   2   3   4   5</div>
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">3. Indexing — دسترسی به یک کاراکتر</h2>

<p>
هر کاراکتر داخل String یک <strong>Index</strong> دارد.
برای دسترسی به یک کاراکتر از <code>[]</code> استفاده می‌کنیم.
</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">word = "Python"

print(word[0])
print(word[1])
print(word[5])</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">P
y
n</div>
</div>

<p>پس:</p>

<div class="code-container">
<span class="code-label">Recall</span>
<div class="code-block no-prompt">word[0] → P
word[1] → y
word[2] → t
word[3] → h
word[4] → o
word[5] → n</div>
</div>

<div class="lesson-note">
<strong>نکته امتحانی:</strong>
Index در Python از <code>0</code> شروع می‌شود، نه 1.
</div>

<hr class="lesson-divider">

<h2 class="lesson-title">4. Index منفی</h2>

<p>
Python اجازه می‌دهد از انتهای String نیز به کاراکترها دسترسی داشته باشیم.
</p>

<div class="code-container">
<span class="code-label">Code</span>
<div class="code-block no-prompt">String:     P    y    t    h    o    n
Positive:   0    1    2    3    4    5
Negative:  -6   -5   -4   -3   -2   -1</div>
</div>

<p>مهم‌ترین حالت:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">word = "Python"

print(word[-1])
print(word[-2])</div>
</div>

<div class="code-container">
<span class="code-label">Output</span>
<div class="code-block no-prompt">n
o</div>
</div>

<div class="code-container">
<span class="code-label">Recall</span>
<div class="code-block no-prompt">[0]   → اولین کاراکتر
[-1]  → آخرین کاراکتر</div>
</div>

<h2 class="lesson-title">5. اگر Index اشتباه باشد</h2>

<p>
اگر Indexای را استفاده کنیم که در String وجود ندارد، با <code>IndexError</code> مواجه می‌شویم.

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">word = "Python"

</div>

<h2 class="lesson-title">6. Slicing — استخراج بخشی از String</h2>

<p>
<strong>Indexing</strong> یک کاراکتر را برمی‌گرداند.
اما اگر بخواهیم چند کاراکتر را با هم برداریم، از <strong>Slicing</strong> استفاده می‌کنیم.
</p>

<p>ساختار:</p>

<div class="code-container">
<span class="code-label">Syntax</span>
<div class="code-block no-prompt">text[start:end]</div>
</div>

<div class="lesson-important">
<strong>قانون طلایی:</strong>
<code>start</code> شامل می‌شود، اما <code>end</code> شامل نمی‌شود.
</div>

<p>مثلاً:</p>

<div class="code-container">
<span class="code-label">Python</span>
<div class="code-block no-prompt">word = "Python"

print(word[0:2])</div>

<h3>برنامه کامل</h3>

<span class="code-label">Python</span>

<h2 class="lesson-title">13. Unpacking چیست؟</h2>

<p>

</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">person = ("Ali", 20, "Tehran")

name, age, city = person

print(name)
print(age)
print(city)</div>
</div>

    <span class="code-label">Output</span>
    <div class="code-block no-prompt">Ali
20
Tehran</div>

</blockquote>

<h2 class="lesson-title">14. قانون مهم Unpacking</h2>

<p>
    در Unpacking معمولی، تعداد متغیرها باید با تعداد مقادیر برابر باشد.
</p>

<div class="table-wrap">

        <thead>

            </tr>
        </thead>
        <tbody>
            <tr>
                <td><code>a, b, c = (1, 2, 3)</code></td>
                <td>صحیح</td>
            </tr>
            <tr>
                <td><code>a, b = (1, 2, 3)</code></td>
                <td>خطا</td>
            </tr>
            <tr>
                <td><code>a, b, c, d = (1, 2, 3)</code></td>
                <td>خطا</td>
            </tr>
        </tbody>
    </table>
</div>

<blockquote>
    <strong>نکته امتحانی:</strong>
    در Unpacking معمولی:
    <code>تعداد متغیرها = تعداد مقادیر</code>
</blockquote>

print(b)
print(c)</div>

<h2 class="lesson-title">1. Dictionary چیست؟</h2>

<p>
    تا اینجا با <code>List</code>، <code>Tuple</code> و <code>Set</code> آشنا شدیم.

<p>
    اما گاهی می‌خواهیم اطلاعات را با یک <strong>نام مشخص</strong> پیدا کنیم.

<h2 class="lesson-title">4. اگر Key وجود نداشته باشد</h2>

<p>
    اگر با <code>[]</code> به Keyای دسترسی پیدا کنیم که وجود ندارد،

<p>
    <code>get()</code> برای دریافت مقدار یک Key استفاده می‌شود و در صورت نبودن Key،

<p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">student = {

    </table>
</div>

<h2 class="lesson-title">7. Key تکراری</h2>

<p>
    Keyهای یک Dictionary باید یکتا باشند.

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">student = {
    "name": "Ali",
    "name": "Sara"
}

print(student)</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">{'name': 'Sara'}</div>
</div>

<blockquote>
    <strong>نکته امتحانی:</strong>
    <code>Dictionary → Keyهای یکتا</code>
</blockquote>

<p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">student = {

</div>

    "age": 20

</div>

<p>

<h2 class="lesson-title">11. len() و in در Dictionary</h2>

<h3><code>len()</code></h3>

<p>

</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">student = {
    "name": "Ali",
    "age": 20,
    "city": "Tehran"
}

print(len(student))</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">3</div>
</div>

<h3><code>in</code></h3>

<p>

</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">student = {
    "name": "Ali"
}

print("name" in student)

</div>

<div class="code-container">

False</div>

<h2 class="lesson-title">12. keys()، values() و items()</h2>

<p>
    این سه متد برای دریافت بخش‌های مختلف Dictionary بسیار مهم هستند.

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>متد</th>

            <tr>

            </tr>
            <tr>
                <td><code>values()</code></td>
                <td>Valueها</td>
            </tr>
            <tr>
                <td><code>items()</code></td>

            </tr>
        </tbody>
    </table>

<div class="code-container">

</div>

<h2 class="lesson-title">13. update()</h2>

<p>

    <div class="code-block no-prompt">student = {

</div>

    <div class="code-block no-prompt">{'name': 'Ali', 'age': 21, 'city': 'Tehran'}</div>

    بنابراین <code>update()</code> می‌تواند هم مقدار موجود را تغییر دهد

                <td>Block مربوط به <code>else</code></td>
            </tr>
        </tbody>
    </table>
</div>

<blockquote>
    در ساختار ساده <code>if/else</code> فقط یکی از دو Block اجرا می‌شود.
</blockquote>

<hr class="lesson-divider">

<h2 class="lesson-title">6. elif؛ چند حالت مختلف</h2>

<p>
    وقتی بیش از دو حالت داریم، از <code>elif</code> استفاده می‌کنیم.
</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">score = 16

if score >= 18:
    print("Excellent")
elif score >= 12:
    print("Good")
elif score >= 10:
    print("Pass")
else:
    print("Fail")</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">Good</div>
</div>

<p>ساختار کلی:</p>

<div class="code-container">
    <span class="code-label">Syntax</span>
    <div class="code-block no-prompt">if condition1:
    ...
elif condition2:
    ...
elif condition3:
    ...
else:
    ...</div>
</div>

<h3>قانون مهم <code>if/elif</code></h3>

<p>
    Python شرط‌ها را از بالا به پایین بررسی می‌کند و
    <strong>اولین شرط True</strong> را اجرا می‌کند.
</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">score = 19

if score >= 10:
    print("Pass")
elif score >= 18:
    print("Excellent")</div>
</div>

<p>
    خروجی <code>Pass</code> است؛ چون شرط اول از قبل <code>True</code> شده
    و Python دیگر سراغ <code>elif</code> نمی‌رود.
</p>

<blockquote>
    <strong>نکته امتحانی:</strong>
    در <code>if/elif/else</code> ترتیب شرط‌ها اهمیت دارد.
    معمولاً شرط‌های خاص‌تر را قبل از شرط‌های عمومی‌تر قرار می‌دهیم.
</blockquote>

<h2 class="lesson-title">8. شرط با String و Membership</h2>

<p>

<h3>مقایسه String</h3>

<div class="code-container">

if username == "admin":

<h3>استفاده از <code>in</code></h3>

<p>

</p>

<div class="code-container">
    <span class="code-label">Python</span>

if "A" in name:

if "banana" in fruits:

<hr class="lesson-divider">

<h2 class="lesson-title">9. Nested Condition</h2>

<p>
    اگر یک شرط داخل شرط دیگری قرار بگیرد، با
    <strong>Nested Condition</strong> روبه‌رو هستیم.
</p>

<p>مثلاً ابتدا سن را بررسی می‌کنیم و سپس کارت شناسایی را:</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">age = 20
has_id = True

if age >= 18:
    if has_id:
        print("Entry allowed")
    else:
        print("ID required")
else:
    print("Too young")</div>
</div>

<p>ترتیب تصمیم:</p>

<div class="code-container">
    <span class="code-label">Flow</span>
    <div class="code-block no-prompt">age >= 18 ?
     │
   Yes
     ↓
has_id ?
 /     \
Yes     No
 ↓       ↓
Allow   ID required

No
 ↓
Too young</div>
</div>

<h3>Nested یا <code>and</code>؟</h3>

<p>
    اگر فقط می‌خواهیم هر دو شرط برقرار باشند، معمولاً <code>and</code> ساده‌تر است:
</p>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">if age >= 18 and has_id:
    print("Allowed")</div>
</div>

<p>
    اما اگر بعد از شرط اول قرار است تصمیم‌های جداگانه‌ای گرفته شود،
    Nested Condition می‌تواند مناسب‌تر باشد.
</p>

<h2 class="lesson-title">10. چند if مستقل در برابر if/elif</h2>

<p>
    این دو ساختار رفتار متفاوتی دارند و از نکات مهم جلسه هستند.
</p>

<h3>دو <code>if</code> مستقل</h3>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">number = 15

if number > 0:

if number > 10:

</div>

Greater than 10</div>
</div>

<p>
    هر دو شرط مستقل هستند؛ بنابراین هر دو می‌توانند اجرا شوند.
</p>

<h3><code>if/elif</code></h3>

<div class="code-container">
    <span class="code-label">Python</span>
    <div class="code-block no-prompt">number = 15

if number > 0:
    print("Positive")
elif number > 10:
    print("Greater than 10")</div>
</div>

<div class="code-container">
    <span class="code-label">Output</span>
    <div class="code-block no-prompt">Positive</div>
</div>

</p>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>ساختار</th>
                <th>رفتار</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><code>if + if</code></td>
                <td>هر دو شرط مستقل هستند و ممکن است هر دو اجرا شوند.</td>
            </tr>
            <tr>
                <td><code>if + elif</code></td>

        </tbody>
    </table>
</div>

<h2 class="lesson-title">10. شرط‌های تو در تو — Nested Conditions</h2>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 20

    if has_id:
        print("Entry allowed")
    else:
        print("Valid ID required")

    print("You are too young")</div></div>

<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">age >= 18 ?
   │

بله       خیر

 ▼         ▼
has_id?   Too young
 │
 ┌┴──────┐
بله      خیر
 │        │

<hr class="lesson-divider">
<h2 class="lesson-title">11. چه زمانی Nested Condition استفاده کنیم؟</h2>
<p>Nested Condition زمانی مناسب است که <strong>تصمیم دوم وابسته به تصمیم اول باشد</strong>.</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">آیا کاربر وارد حساب شده؟

        ↓
نمایش پنل مدیریت</div></div>
<p>اما اگر بتوانیم مسئله را ساده‌تر با <code>and</code> بنویسیم، معمولاً کد ساده‌تر خوانده می‌شود.</p>
<p>مثلاً این:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if age >= 18 and has_id:
    print("Entry allowed")</div></div>
<p>می‌تواند جایگزین بخشی از Nested Condition قبلی شود.</p>
<p>پس همیشه از خودت بپرس:</p>
<blockquote>آیا واقعاً به شرط تو در تو نیاز دارم؟</blockquote>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if age >= 18 and has_id:
    print("Entry allowed")</div></div>
<p>از نظر خوانایی برای این مسئله بهتر است.</p>
<p>اما وقتی تصمیم دوم فقط بعد از تصمیم اول معنا پیدا می‌کند، Nested Condition می‌تواند مناسب‌تر باشد.</p>

if 20 <= temperature <= 30:

<h2 class="lesson-title">14. حل مسئله مرحله‌به‌مرحله: سیستم تخفیف</h2>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">مبلغ خرید 1,000,000 یا بیشتر → 20٪ تخفیف
مبلغ خرید 500,000 تا 999,999 → 10٪ تخفیف
کمتر از 500,000             → بدون تخفیف</div></div>
<h3>مرحله ۱ — مشخص کردن Input</h3>

<h1 class="lesson-title section-troubleshoot">اشتباهات رایج</h1>
<h3>۱. اشتباه در <code>></code> و <code>>=</code></h3>

<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li>قبل از کدنویسی، مسئله را به <strong>Input → Conditions → Results</strong> تبدیل کن.</li><li><code>if</code> برای بررسی یک شرط اصلی استفاده می‌شود.</li><li><code>elif</code> برای حالت‌های جایگزین مناسب است.</li><li><code>else</code> حالت باقی‌مانده را پوشش می‌دهد.</li><li>Python شرط‌ها را از <strong>بالا به پایین</strong> بررسی می‌کند.</li><li>وقتی شرطی <code>True</code> شود، در زنجیره <code>if / elif / else</code> دیگر شرط‌های بعدی بررسی نمی‌شوند.</li><li>ترتیب شرط‌های هم‌پوشان بسیار مهم است.</li><li><code>and</code> یعنی <strong>همه شرط‌ها باید درست باشند</strong>.</li><li><code>or</code> یعنی <strong>حداقل یکی از شرط‌ها باید درست باشد</strong>.</li><li>Nested Condition زمانی مناسب است که تصمیم دوم به تصمیم اول وابسته باشد.</li><li>برای مرزها به <code>></code>, <code><</code>, <code>>=</code>, <code><=</code> دقت کن.</li><li>مسائل شرطی را با چند ورودی، مخصوصاً <strong>حالت‌های مرزی</strong>، تست کن.</li><li>در مقایسه‌های <code>or</code> هر شرط را کامل بنویس.</li></ul>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1 <= 5</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<p>پس وارد بدنه حلقه می‌شود:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(count)</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1</div></div>
<p>سپس:</p>

<p>مقدار <code>count</code> می‌شود:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">2</div></div>
<p>حالا دوباره شرط بررسی می‌شود:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">2 <= 5</div></div>
<p>باز هم <code>True</code>.</p>
<p>این روند ادامه پیدا می‌کند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">count = 1 → True → چاپ 1
count = 2 → True → چاپ 2
count = 3 → True → چاپ 3
count = 4 → True → چاپ 4
count = 5 → True → چاپ 5
count = 6 → False → پایان</div></div>

               │

<h3>نکته طلایی </h3>

<h2 class="lesson-title">4. بدنه <code>while</code> و Indentation</h2>
<p>مثل <code>if</code>، در <code>while</code> نیز بعد از شرط <code>:</code> می‌گذاریم و کد داخل حلقه باید <strong>Indentation</strong> داشته باشد.</p>
<p>درست:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">while condition:
    print(&quot;Hello&quot;)</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">while condition:
print(&quot;Hello&quot;)</div></div>
<p>در Python، فاصله ابتدای خط فقط برای زیبایی نیست.</p>
<p>Indentation مشخص می‌کند:</p>
<blockquote>کدام دستورات داخل حلقه هستند.</blockquote>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">count = 1

while count <= 3:

print(&quot;Done&quot;)</div></div>
<p>در اینجا دو <code>print</code> اول داخل حلقه هستند، اما:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;Done&quot;)</div></div>
<p>خارج از حلقه است.</p>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Hello
1
Hello
2
Hello
3
Done</div></div>

<p>یکی از مهم‌ترین خطاهای <code>while</code> این است که حلقه هیچ‌وقت تمام نشود.</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">count = 1</div></div>

1
1
1
1
...</div></div>
<p>این یک <strong>Infinite Loop</strong> است.</p>
<blockquote>Infinite Loop یعنی حلقه‌ای که شرط پایان آن هیچ‌وقت <code>False</code> نمی‌شود.</blockquote>
<h3>چگونه از Infinite Loop جلوگیری کنیم؟</h3>
<p>قبل از نوشتن <code>while</code> سه سؤال از خودت بپرس:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1. شرط شروع/ادامه چیست؟
2. چه چیزی در هر تکرار تغییر می‌کند؟

while count <= 5:

متغیر تغییرکننده:
count

تغییر:
count += 1

نقطه پایان:

<p>این طرز فکر برای حل مسئله با <code>while</code> بسیار مهم است.</p>

<p>چون اگر این کار را نکنیم، شرط <code>while</code> همچنان با همان مقدار قبلی بررسی می‌شود.</p>
<p>مثلاً این کد مشکل دارد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">number = int(input(&quot;Enter a number: &quot;))

while number < 1:
    print(&quot;Invalid!&quot;)</div></div>
<p>اگر کاربر <code>0</code> وارد کند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">number = 0</div></div>
<p>و شرط:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0 < 1</div></div>
<p>همیشه <code>True</code> می‌ماند.</p>
<p>پس حلقه بی‌نهایت می‌شود.</p>
<p>باید داخل حلقه مقدار جدید دریافت کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">number = int(input(&quot;Enter a number: &quot;))

while number < 1:
    print(&quot;Invalid!&quot;)
    number = int(input(&quot;Enter a number: &quot;))</div></div>
<h3> قانون مهم</h3>
<p>اگر شرط <code>while</code> به یک متغیر وابسته است، باید مطمئن شوی که آن متغیر در مسیر اجرای برنامه <strong>به شکلی تغییر می‌کند که در نهایت شرط را False کند</strong>.</p>

<hr class="lesson-divider">
<h2 class="lesson-title">🧠 Recall کوتاه</h2>
<p>تا اینجا اگر از تو بپرسم:</p>
<blockquote>حلقه <code>while</code> چه کاری انجام می‌دهد؟</blockquote>
<p>باید بتوانی بگویی:</p>
<blockquote>یک بخش از کد را تا زمانی که شرط <code>True</code> باشد، تکرار می‌کند.</blockquote>
<p>و اگر بپرسم:</p>
<blockquote>مهم‌ترین خطر <code>while</code> چیست؟</blockquote>
<p>پاسخ:</p>
<blockquote><strong>Infinite Loop</strong></blockquote>
<p>و اگر بپرسم:</p>
<blockquote>برای جلوگیری از آن چه چیزی را باید بررسی کنیم؟</blockquote>
<p>پاسخ:</p>
<blockquote>باید مطمئن شویم وضعیت یا متغیر کنترل‌کننده حلقه به‌درستی تغییر می‌کند و در نهایت شرط <code>False</code> می‌شود.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">🧠 مدل ذهنی کل <code>while</code></h2>
<p>این مدل را حفظ کن:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">             Start
               │
               ▼
          Initial Value
               │
               ▼
         ┌────────────┐
         │  Condition │
         └─────┬──────┘
            True│
                ▼
          Execute Code
                │
                ▼
       Change / Update State
                │
                │
                └─────────────┐
                              │
                              ▼
                         Condition
                              │
                         False │
                              ▼
                             End</div></div>
<p>تقریباً هر <code>while</code> ساده‌ای که در Python می‌نویسی، می‌تواند با این مدل تحلیل شود.</p>
<hr class="lesson-divider">
<h1 class="lesson-title section-troubleshoot">مشکلات رایج <code>while</code></h1>
<h3>مشکل ۱ — حلقه تمام نمی‌شود</h3>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">x = 1

while x < 10:
    print(x)</div></div>
<p>بررسی کن:</p>
<blockquote>آیا <code>x</code> در حلقه تغییر می‌کند؟</blockquote>
<p>در اینجا جواب:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">نه ❌</div></div>
<p>پس حلقه بی‌نهایت می‌شود.</p>
<p>راه‌حل:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">x = 1

while x < 10:
    print(x)
    x += 1</div></div>
<h3>مشکل ۲ — حلقه اصلاً اجرا نمی‌شود</h3>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">x = 10

while x < 5:
    print(x)</div></div>
<p>شرط اولیه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">10 < 5</div></div>
<p><code>False</code> است.</p>
<p>پس هیچ خروجی نداریم.</p>
<h3>مشکل ۳ — خروجی غیرمنتظره است</h3>
<p>اگر انتظار داری:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
2
3
4
5</div></div>
<p>ولی می‌بینی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
3
5</div></div>
<p>به خط تغییر متغیر نگاه کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">x += 2</div></div>
<p>مقدار متغیر در هر بار دو واحد افزایش پیدا می‌کند.</p>
<hr class="lesson-divider">
<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li><code>while</code> برای <strong>تکرار مشروط</strong> استفاده می‌شود.</li><li>Syntax اصلی: <code>while condition: code</code></li><li>شرط <code>while</code> قبل از هر بار اجرای بدنه بررسی می‌شود.</li><li>اگر شرط از ابتدا <code>False</code> باشد، حلقه حتی یک بار هم اجرا نمی‌شود.</li><li>بدنه <code>while</code> باید با <strong>Indentation</strong> مشخص شود.</li><li>برای کنترل حلقه معمولاً یک متغیر مثل <code>count</code> یا <code>number</code> داریم.</li><li>باید وضعیت کنترل‌کننده حلقه به شکلی تغییر کند که در نهایت شرط <code>False</code> شود.</li><li>اگر شرط هیچ‌وقت <code>False</code> نشود، <strong>Infinite Loop</strong> ایجاد می‌شود.</li><li><code>x += 1</code> معادل <code>x = x + 1</code> است.</li><li><code>x -= 1</code> معادل <code>x = x - 1</code> است.</li><li><code>while</code> فقط برای شمارش نیست؛ برای کنترل وضعیت و تکرار تا رسیدن به یک وضعیت خاص هم استفاده می‌شود.</li><li><code>while True</code> یک حلقه بی‌نهایت ایجاد می‌کند، مگر اینکه مکانیزم خروج داشته باشد.</li></ul>
<hr class="lesson-divider">
<h2 class="lesson-title">🔄 Recall سریع</h2>
<p>بدون نگاه کردن به درس، سعی کن این سؤال‌ها را جواب بده:</p>
<ol><li><code>while</code> چه تفاوتی با <code>if</code> دارد؟</li><li>شرط <code>while</code> چه زمانی بررسی می‌شود؟</li><li>اگر شرط از ابتدا <code>False</code> باشد چه اتفاقی می‌افتد؟</li><li>چرا تغییر متغیر کنترل‌کننده مهم است؟</li><li>Infinite Loop چیست؟</li><li><code>x += 1</code> یعنی چه؟</li><li>چرا کد زیر مشکل دارد؟ <code>x = 1<br>while x <= 5:<br>    print(x)</code></li><li>آیا <code>while</code> فقط برای کار با اعداد استفاده می‌شود؟</li></ol>
<p>اگر بتوانی این موارد را بدون نگاه‌کردن به درس توضیح بدهی، مفهوم اصلی <code>while</code> را یاد گرفته‌ای.</p>
<hr class="lesson-divider">
<h1 class="lesson-title section-scenario">سناریوی ترکیبی — سیستم ورود به حساب کاربری</h1>
<p>فرض کن می‌خواهیم یک برنامه ساده برای <strong>سیستم ورود به حساب کاربری</strong> بسازیم.</p>
<p>قانون برنامه:</p>
<blockquote>کاربر حداکثر 3 بار فرصت دارد رمز عبور را وارد کند.</blockquote>
<p>رمز صحیح:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">python123</div></div>
<p>برای حل مسئله ابتدا آن را به چند بخش تقسیم می‌کنیم.</p>
<h3>مرحله ۱ — تعداد تلاش</h3>
<p>به یک متغیر نیاز داریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">attempt = 1</div></div>
<h3>مرحله ۲ — دریافت رمز</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">password = input(&quot;Enter password: &quot;)</div></div>
<h3>مرحله ۳ — بررسی رمز</h3>
<p>از <code>if</code> استفاده می‌کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if password == &quot;python123&quot;:
    print(&quot;Access granted!&quot;)</div></div>
<p>اما هنوز یک مشکل داریم:</p>
<p>اگر رمز اشتباه باشد، باید دوباره سؤال کنیم.</p>
<p>اینجاست که <code>while</code> وارد می‌شود.</p>
<h3>مرحله ۴ — ترکیب <code>while</code> و <code>if</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">attempt = 1

while attempt <= 3:
    password = input(&quot;Enter password: &quot;)

    if password == &quot;python123&quot;:
        print(&quot;Access granted!&quot;)
    else:
        print(&quot;Wrong password.&quot;)

    attempt += 1</div></div>
<p>اما این برنامه یک ایراد منطقی دارد:</p>
<p>حتی اگر رمز درست باشد، باز هم ممکن است تلاش‌های بعدی انجام شوند.</p>
<p>فعلاً در این جلسه ابزار مناسب برای خروج زودهنگام از حلقه را یاد نگرفته‌ایم.</p>
<p>پس بهتر است فعلاً سناریو را با یک متغیر وضعیت کنترل کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">attempt = 1
logged_in = False

while attempt <= 3 and not logged_in:
    password = input(&quot;Enter password: &quot;)

    if password == &quot;python123&quot;:
        print(&quot;Access granted!&quot;)
        logged_in = True
    else:
        print(&quot;Wrong password.&quot;)

    attempt += 1

if not logged_in:
    print(&quot;Account locked.&quot;)</div></div>
<h3>این برنامه چگونه کار می‌کند؟</h3>
<p>ابتدا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">attempt = 1
logged_in = False</div></div>
<p>شرط حلقه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">attempt <= 3 and not logged_in</div></div>
<p>در ابتدا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1 <= 3 → True
not False → True</div></div>
<p>پس حلقه اجرا می‌شود.</p>
<p>اگر رمز درست باشد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">logged_in = True</div></div>
<p>در بررسی بعدی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">not logged_in</div></div>
<p>می‌شود:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">False</div></div>
<p>پس حلقه تمام می‌شود.</p>
<p>اگر سه بار رمز اشتباه باشد، مقدار:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">attempt</div></div>
<p>از <code>3</code> عبور می‌کند و شرط اول <code>False</code> می‌شود.</p>
<p>در نهایت:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Account locked.</div></div>
<h3>مدل ذهنی سناریو</h3>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">             Start
               │
               ▼
       attempt = 1
       logged_in = False
               │
               ▼
     attempt <= 3 AND
       not logged_in
          /       \
       True       False
        │           │
        ▼           ▼
   دریافت رمز      پایان
        │
        ▼
   رمز درست است؟
      /       \
    Yes        No
     │          │
     ▼          ▼
 logged_in    تلاش بعدی
   = True        │
     │           ▼
     └──────► attempt += 1
                  │
                  └────► بررسی دوباره</div></div>
<p>اینجا چند مفهوم جلسه‌های قبلی را کنار هم گذاشتیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Variables
    +
input()
    +
Comparison
    +
if / else
    +
and / not
    +
while</div></div>
<p>این دقیقاً همان چیزی است که در ادامه دوره بیشتر انجام خواهیم داد: <strong>ترکیب مفاهیم ساده برای حل مسئله واقعی.</strong></p>

<h2 class="lesson-title">🎯 جمع‌بندی جلسه</h2>
<p>در جلسه ۱۰ یاد گرفتیم که با شرط‌ها می‌توانیم <strong>تصمیم بگیریم</strong>.</p>
<p>حالا در جلسه ۱۲ یک مفهوم جدید اضافه کردیم:</p>
<blockquote>با <code>while</code> می‌توانیم <strong>تا زمانی که یک وضعیت برقرار است، کاری را تکرار کنیم.</strong></blockquote>
<p>رابطه مفاهیم را این‌طور ببین:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Condition
    │
    ├──────────────┐
    │              │
    ▼              ▼
   if            while
    │              │
    ▼              ▼
 تصمیم          تکرار
    │              │
    │              └── تا وقتی شرط True است
    │
    └── یک تصمیم</div></div>
<p>و ساختار اصلی <code>while</code>:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Initial State
     ↓
Condition
     ↓
True ──→ Execute
          ↓
       Update State
          │
          └────→ Condition
                    │
                  False
                    ↓
                   End</div></div>
<p>اگر فقط <strong>یک نکته</strong> از این جلسه به خاطر بسپاری، این باشد:</p>
<blockquote> در هر حلقه <code>while</code> همیشه بدان <strong>شرط چیست، چه چیزی آن را تغییر می‌دهد و چه زمانی قرار است <code>False</code> شود.</strong></blockquote>
<p>این سه سؤال جلوی بخش بزرگی از خطاهای مربوط به <code>while</code> و Infinite Loop را می‌گیرد.</p>
<p>در جلسه بعد می‌رویم سراغ <strong><code>for</code>، <code>range()</code> و <code>enumerate()</code></strong> و می‌بینیم وقتی تعداد یا مجموعه‌ای از موارد برای تکرار مشخص است، چرا <code>for</code> معمولاً انتخاب بهتری است.</p>`

<h2 class="lesson-title">1. از <code>while</code> به <code>for</code></h2>
<p>در جلسه قبل با <code>while</code> آشنا شدیم.</p>
<p>مثلاً برای چاپ اعداد 1 تا 5:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">number = 1

<p>در بسیاری از مسائل، جواب <strong>خیر</strong> است.</p>
<p>وقتی می‌دانیم قرار است روی یک مجموعه از داده‌ها حرکت کنیم یا تعداد مشخصی تکرار داشته باشیم، <code>for</code> معمولاً ساده‌تر و خواناتر است.</p>

<p>به زبان ساده:</p>

<h3>مدل ذهنی</h3>

<p>بنابراین می‌توانی <code>for</code> را این‌طور در ذهن داشته باشی:</p>

<h2 class="lesson-title">3. Syntax حلقه <code>for</code></h2>
<p>ساختار اصلی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for variable in iterable:
    code</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in numbers:
    print(number)</div></div>
<p>سه بخش اصلی داریم:</p>
<div class="table-wrap"><table><thead><tr><th>بخش</th><th>معنی</th></tr></thead><tbody><tr><td><code>for</code></td><td>شروع حلقه</td></tr><tr><td><code>variable</code></td><td>متغیری که مقدار فعلی را دریافت می‌کند</td></tr><tr><td><code>in</code></td><td>حرکت روی عناصر</td></tr><tr><td><code>iterable</code></td><td>چیزی که می‌خواهیم روی آن حرکت کنیم</td></tr><tr><td><code>:</code></td><td>شروع بدنه</td></tr><tr><td>کد Indented</td><td>دستورات تکرارشونده</td></tr></tbody></table></div>
<p>در سطح Python Basic فعلاً کافی است مفهوم <code>iterable</code> را این‌طور در نظر بگیری:</p>
<blockquote>چیزی که می‌توانیم عناصر آن را یکی‌یکی بررسی کنیم؛ مثل <code>list</code> و <code>string</code>.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">4. <code>for</code> روی List </h2>
<p>یکی از مهم‌ترین کاربردهای <code>for</code> کار با <code>list</code> است.</p>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">fruits = ["apple", "banana", "orange"]</div></div>
<p>می‌خواهیم همه میوه‌ها را چاپ کنیم.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for fruit in fruits:
    print(fruit)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">apple
banana
orange</div></div>
<p>نکته مهم این است که لازم نیست خودمان Indexها را مدیریت کنیم.</p>
<p>Python خودش عناصر را یکی‌یکی در <code>fruit</code> قرار می‌دهد.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">5. <code>for</code> روی String</h2>
<p><code>for</code> فقط برای List نیست.</p>
<p>می‌توانیم روی String نیز حرکت کنیم.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">word = "Python"

for letter in word:
    print(letter)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">P
y
t
h
o
n</div></div>
<p>چون String از کاراکترها تشکیل شده و می‌توانیم کاراکترها را یکی‌یکی دریافت کنیم.</p>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">"Python"
   │
   ├── P
   ├── y

   ├── h
   ├── o
   └── n</div></div>
<p>و <code>for</code> هر بار یکی از این کاراکترها را در <code>letter</code> قرار می‌دهد.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">6. <code>for</code> در برابر <code>while</code> </h2>
<p>حالا به سؤال مهم جلسه می‌رسیم:</p>
<blockquote>چه زمانی <code>for</code> و چه زمانی <code>while</code>؟</blockquote>
<p>به شکل ساده:</p>
<h3><code>for</code></h3>
<p>وقتی می‌خواهیم روی یک مجموعه یا تعداد مشخصی از موارد حرکت کنیم.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

for name in names:
    print(name)</div></div>
<p>یعنی:</p>
<blockquote>برای هر نام موجود در لیست، آن را چاپ کن.</blockquote>
<h3><code>while</code></h3>
<p>وقتی تکرار به یک <strong>شرط یا وضعیت</strong> وابسته است و از قبل نمی‌دانیم دقیقاً چند بار اجرا می‌شود.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">password = ""

while password != "1234":
    password = input("Password: ")</div></div>
<p>یعنی:</p>
<blockquote>تا وقتی رمز درست نشده، دوباره رمز بگیر.</blockquote>
<h3>جدول مقایسه</h3>
<div class="table-wrap"><table><thead><tr><th><code>for</code></th><th><code>while</code></th></tr></thead><tbody><tr><td>پیمایش روی داده‌ها</td><td>تکرار بر اساس شرط</td></tr><tr><td>مناسب تعداد مشخص تکرار</td><td>مناسب تعداد نامشخص تکرار</td></tr><tr><td>معمولاً مدیریت شمارنده لازم نیست</td><td>معمولاً باید وضعیت را تغییر دهیم</td></tr><tr><td>خواناتر برای مجموعه‌ها</td><td>مناسب کنترل وضعیت</td></tr><tr><td><code>for x in items</code></td><td><code>while condition</code></td></tr></tbody></table></div>
<h3>قانون ساده </h3>
<p>اگر مسئله شبیه این است:</p>
<blockquote>«برای هر مورد موجود در این مجموعه...»</blockquote>
<p>به <code>for</code> فکر کن.</p>
<p>اگر شبیه این است:</p>
<blockquote>«تا زمانی که این شرط برقرار است...»</blockquote>
<p>به <code>while</code> فکر کن.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">7. <code>range()</code> چیست؟ </h2>
<p>یکی از مهم‌ترین ابزارهایی که همراه <code>for</code> استفاده می‌شود:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">range()</div></div>
<p><code>range()</code> برای ایجاد یک دنباله از اعداد استفاده می‌شود.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">range(5)</div></div>
<p>مقادیر این دنباله را در اختیار حلقه قرار می‌دهد:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0
1
2
3
4</div></div>
<h3>نکته بسیار مهم</h3>
<p>در:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">range(5)</div></div>
<p>عدد <code>5</code> <strong>شامل نمی‌شود</strong>.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(5):

1
2
3
4</div></div>

<h2 class="lesson-title">14. <code>for</code> و <code>range()</code> برای تکرار تعداد مشخص</h2>

<p>می‌توانیم بنویسیم:</p>

Hello
Hello
Hello
Hello</div></div>

<p>در چنین مواقعی معمولاً از <code>_</code> استفاده می‌کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for _ in range(5):
    print("Hello")</div></div>

<blockquote>مقدار این متغیر برای من مهم نیست.</blockquote>

<hr class="lesson-divider">
<h2 class="lesson-title">15. <code>enumerate()</code> چیست؟ </h2>
<p>حالا یک مسئله مهم:</p>
<p>فرض کن داریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]</div></div>
<p>می‌خواهیم هم <strong>نام</strong> را داشته باشیم و هم <strong>Index</strong> آن را.</p>
<p>یک روش این است:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(len(names)):
    print(i, names[i])</div></div>
<p>اما برای این کار روش ساده‌تر و خواناتری داریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, name in enumerate(names):
    print(index, name)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0 Ali
1 Sara
2 Reza</div></div>
<p>این دقیقاً کاربرد <code>enumerate()</code> است.</p>
<blockquote><code>enumerate()</code> هنگام پیمایش، <strong>Index و Value</strong> را با هم در اختیار ما قرار می‌دهد.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">16. مدل ذهنی <code>enumerate()</code></h2>
<p>لیست:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">["Ali", "Sara", "Reza"]</div></div>
<p>به شکل مفهومی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Index      Value

  0   →    Ali
  1   →    Sara
  2   →    Reza</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, name in enumerate(names):</div></div>
<p>در هر مرحله:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">index = 0    name = "Ali"
index = 1    name = "Sara"
index = 2    name = "Reza"</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">17. چرا <code>enumerate()</code> بهتر از <code>range(len(...))</code> است؟</h2>
<p>این دو کد را مقایسه کن.</p>
<p>روش اول:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

for i in range(len(names)):

<p>روش دوم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

for i, name in enumerate(names):
    print(i, name)</div></div>
<p>هر دو خروجی مشابهی دارند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0 Ali

2 Reza</div></div>

<blockquote>برای هر عنصر، Index و Value را بده.</blockquote>
<p>بنابراین در Python Basic، وقتی هم Index و هم Value لازم داری، <code>enumerate()</code> انتخاب بسیار خوبی است.</p>
<hr class="lesson-divider">

<h2 class="lesson-title">19. <code>for</code> با شرط <code>if</code></h2>
<p>حالا مفاهیم قبلی را ترکیب کنیم.</p>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [1, 2, 3, 4, 5, 6]</div></div>

هر عنصر

  ↓
بررسی شرط
  ↓
اجرای کد</div></div>

<h2 class="lesson-title">20. <code>for</code> روی String + شرط</h2>
<p>مثلاً می‌خواهیم تعداد حروف <code>a</code> را بررسی کنیم.</p>

<hr class="lesson-divider">
<h2 class="lesson-title">21. تفاوت مهم <code>range()</code> و <code>list</code></h2>
<p>ممکن است این دو را با هم اشتباه بگیری:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [1, 2, 3, 4]</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">range(1, 5)</div></div>
<p>هر دو می‌توانند در یک <code>for</code> استفاده شوند:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in numbers:
    print(number)</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(1, 5):
    print(number)</div></div>
<p>اما مفهومشان یکی نیست.</p>
<p><code>list</code> واقعاً یک مجموعه از مقادیر است که خودمان ساخته‌ایم.</p>
<p><code>range()</code> برای تولید یک دنباله عددی مناسب برای پیمایش استفاده می‌شود.</p>
<p>در این مرحله کافی است این تفاوت مفهومی را بدانیم.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(1, 5):
    print(i)</div></div>
<p>بعضی افراد انتظار دارند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
2
3
4
5</div></div>
<p>اما خروجی واقعی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1

<p>چون:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">range(1, 5)</div></div>
