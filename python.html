<script>
(function () {
    const playgrounds = Array.from(document.querySelectorAll('.python-playground[data-playground]'));
    if (!playgrounds.length || typeof CodeMirror === 'undefined') return;

    let pyodide = null;
    let pyodideReady = false;
    let loadingPromise = null;
    const editors = new Map();

    function setOutput(root, text, type) {
        const out = root.querySelector('.playground-output');
        if (!out) return;
        out.textContent = text;
        out.classList.remove('error', 'success', 'loading');
        if (type) out.classList.add(type);
    }
    function setStatus(root, text) {
        const el = root.querySelector('.playground-status');
        if (el) el.textContent = text;
    }

    function setupEditors() {
        playgrounds.forEach(root => {
            const ta = root.querySelector('.python-editor');
            if (!ta) return;
            const editor = CodeMirror.fromTextArea(ta, {
                mode: 'python', theme: 'dracula', lineNumbers: true,
                indentUnit: 4, tabSize: 4, indentWithTabs: false,
                lineWrapping: true, autofocus: false, viewportMargin: Infinity,
                extraKeys: {
                    'Ctrl-Enter': () => run(root),
                    'Cmd-Enter': () => run(root),
                    'Tab': cm => cm.somethingSelected() ? cm.indentSelection('add') : cm.replaceSelection('    ', 'end')
                }
            });
            editors.set(root, editor);
            root.querySelector('[data-action="run"]').addEventListener('click', () => run(root));
            root.querySelector('[data-action="clear"]').addEventListener('click', () => {
                setOutput(root, '▶ خروجی پاک شد. کد را اجرا کنید.');
                setStatus(root, pyodideReady ? 'آماده' : 'در حال آماده‌سازی...');
            });
            setTimeout(() => editor.refresh(), 200);
        });
    }

    async function loadPyodideOnce() {
        if (pyodideReady) return true;
        if (loadingPromise) return loadingPromise;
        loadingPromise = (async () => {
            playgrounds.forEach(r => { setStatus(r, 'بارگذاری...'); setOutput(r, '⏳ در حال بارگذاری مفسر پایتون (اولین بار کمی طول می‌کشد)...', 'loading'); });
            try {
                pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });
                pyodide.runPython(`
import builtins
from js import prompt as _browser_prompt
def _input(prompt=""):
    result = _browser_prompt(str(prompt) if prompt else "")
    return "" if result is None else str(result)
builtins.input = _input
`);
                pyodideReady = true;
                playgrounds.forEach(r => { setStatus(r, 'آماده'); setOutput(r, '✅ مفسر آماده است', 'success'); });
                return true;
            } catch (err) {
                playgrounds.forEach(r => { setStatus(r, 'خطا'); setOutput(r, '❌ خطا در بارگذاری مفسر: ' + (err.message || String(err)), 'error'); });
                return false;
            }
        })();
        return loadingPromise;
    }

    async function run(root) {
        const editor = editors.get(root);
        if (!editor || root.dataset.running === '1') return;
        root.dataset.running = '1';
        const runBtn = root.querySelector('[data-action="run"]');
        if (runBtn) runBtn.disabled = true;
        try {
            if (!(await loadPyodideOnce())) return;
            const code = editor.getValue();
            if (!code.trim()) { setOutput(root, '⚠️ لطفاً کدی بنویسید.', 'loading'); return; }
            setOutput(root, '⏳ در حال اجرا...', 'loading'); setStatus(root, 'اجرا...');
            pyodide.runPython(`
import sys
from io import StringIO
__stdout_backup = sys.stdout
__stderr_backup = sys.stderr
sys.stdout = StringIO()
sys.stderr = StringIO()
`);
            let result = null, error = null;
            try { result = await pyodide.runPythonAsync(code); } catch (e) { error = e; }
            const captured = pyodide.runPython(`
out = sys.stdout.getvalue()
err = sys.stderr.getvalue()
sys.stdout = __stdout_backup
sys.stderr = __stderr_backup
out + (err if err else "")
`);
            let finalOutput = (captured || '').trimEnd();
            if (result !== undefined && result !== null && String(result) !== 'None') finalOutput += (finalOutput ? '\n' : '') + String(result);
            if (error) {
                let msg = error.message || String(error);
                msg = msg.replace(/File "<exec>", line \d+, in <module>\n?/g, '').replace(/File "<exec>", line \d+, in /g, '').trim();
                setOutput(root, (finalOutput ? finalOutput + '\n\n' : '') + '❌ ' + msg, 'error');
                setStatus(root, 'خطا');
            } else {
                setOutput(root, finalOutput || '✅ اجرا شد (بدون خروجی)', finalOutput ? null : 'success');
                setStatus(root, 'آماده');
            }
        } finally {
            root.dataset.running = '0';
            if (runBtn) runBtn.disabled = false;
            try { editor.refresh(); } catch(e) {}
        }
    }

    document.querySelectorAll('.solution-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
            const target = document.getElementById(btn.dataset.solution);
            if (!target) return;
            const show = target.classList.toggle('show');
            btn.innerHTML = show ? '<i class="fas fa-eye-slash"></i> مخفی‌کردن پاسخ' : '<i class="fas fa-eye"></i> نمایش پاسخ';
        });
    });

    setupEditors();
    window.addEventListener('resize', () => editors.forEach(e => { try { e.refresh(); } catch(_) {} }));
    window.addEventListener('load', () => setTimeout(loadPyodideOnce, 400));
    if (document.readyState === 'complete') setTimeout(loadPyodideOnce, 500);
})();
</script>
