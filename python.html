<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دوره Python · ZeroDay</title>

    <!-- فونت‌ها -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- CodeMirror (editor) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />

    <style>
        /* ===== متغیرهای CSS ===== */
        :root {
            --primary: #306998;
            --primary-hover: #1d4b6e;
            --primary-soft: #d1e0f0;
            --primary-glow: rgba(48, 105, 152, 0.25);

            --bg-body: #f5f7fa;
            --bg-card: #ffffff;
            --bg-navbar: rgba(255, 255, 255, 0.92);
            --bg-code: #1e293b;
            --bg-toc-hover: #eef4fb;

            --text-main: #2d3748;
            --text-heading: #1a202c;
            --text-muted: #4a5568;

            --border: #e2e8f0;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --radius-sm: 10px;

            --note-bg: #e6ffed;
            --note-border: #2b8a3e;
            --important-bg: #e3f2fd;
            --important-border: #1976d2;
            --warning-bg: #fff8e1;
            --warning-border: #f57c00;

            --code-text: #e2e8f0;
            --terminal-green: #8ae234;
            --sidebar-width: 300px;
        }

        [data-theme="dark"] {
            --primary: #4d8dc7;
            --primary-hover: #5fa3d9;
            --primary-soft: rgba(77, 141, 199, 0.15);
            --primary-glow: rgba(77, 141, 199, 0.25);

            --bg-body: #1a1e26;
            --bg-card: #242a36;
            --bg-navbar: rgba(30, 34, 44, 0.95);
            --bg-code: #0f131a;
            --bg-toc-hover: rgba(77, 141, 199, 0.12);

            --text-main: #e2e8f0;
            --text-heading: #f0f4fa;
            --text-muted: #a0aec0;

            --border: #3a4050;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);

            --note-bg: rgba(43, 138, 62, 0.15);
            --note-border: #5fbf7a;
            --important-bg: rgba(25, 118, 210, 0.15);
            --important-border: #64b5f6;
            --warning-bg: rgba(245, 124, 0, 0.15);
            --warning-border: #ffb74d;

            --code-text: #e2e8f0;
        }

        /* ===== ریست و پایه ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            overflow-x: hidden;
            max-width: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.8;
            font-size: 16.5px;
            padding-top: 64px;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            max-width: 100%;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== نوار بالا ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-navbar);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
            z-index: 1000;
            transition: background 0.3s, border-color 0.3s;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            white-space: nowrap;
        }
        .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
        }
        .nav-spacer {
            flex: 1;
        }
        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .theme-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        /* ===== نوار پیشرفت ===== */
        .progress-track {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            z-index: 999;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #7ab7e0);
            width: 0%;
            transition: width 0.15s;
        }

        /* ===== سایدبار ===== */
        .sidebar {
            position: fixed;
            top: 60px;
            right: 0;
            width: var(--sidebar-width);
            height: calc(100vh - 60px);
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            z-index: 900;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s, border-color 0.3s;
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.04);
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg-card);
            z-index: 2;
        }
        .sidebar-header h3 {
            font-size: 1rem;
            color: var(--text-heading);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-header h3 i {
            color: var(--primary);
        }
        .sidebar-close {
            display: none;
            background: none;
            border: none;
            font-size: 1.15rem;
            color: var(--text-muted);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: 0.2s;
        }
        .sidebar-close:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }

        /* ===== فهرست مطالب ===== */
        .toc {
            padding: 8px 0 30px;
        }
        .toc-chapter {
            border-bottom: 1px solid var(--border);
        }
        .toc-chapter:last-child {
            border-bottom: none;
        }
        .toc-chapter summary {
            padding: 12px 14px;
            font-weight: 600;
            color: var(--text-heading);
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: background 0.15s;
            user-select: none;
            font-size: 0.92rem;
            line-height: 1.4;
            border-radius: 0;
        }
        .toc-chapter summary::-webkit-details-marker {
            display: none;
        }
        .toc-chapter summary::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            margin-right: auto;
            margin-top: 2px;
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: transform 0.25s;
            flex-shrink: 0;
        }
        .toc-chapter[open] summary::after {
            transform: rotate(180deg);
        }
        .toc-chapter summary:hover {
            background: var(--bg-toc-hover);
        }
        .toc-chapter[open]>summary {
            background: var(--primary-soft);
            color: var(--primary);
        }
        .chapter-num {
            width: 24px;
            height: 24px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .toc-sections {
            list-style: none;
            padding: 0 0 8px 0;
            margin: 0;
            background: var(--bg-body);
        }
        .toc-sections li a {
            display: block;
            padding: 8px 14px 8px 48px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.15s;
            border-right: 3px solid transparent;
            line-height: 1.45;
        }
        .toc-sections li a:hover {
            color: var(--primary);
            background: var(--bg-toc-hover);
        }
        .toc-sections li a.active {
            color: var(--primary);
            background: var(--primary-soft);
            border-right-color: var(--primary);
            font-weight: 600;
        }

        /* ===== دکمه باز کردن سایدبار ===== */
        .sidebar-toggle {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            font-size: 1.25rem;
            box-shadow: 0 6px 20px var(--primary-glow);
            z-index: 950;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }
        .sidebar-toggle:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 850;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.open {
            display: block;
        }

        /* ===== محتوای اصلی ===== */
        .main {
            max-width: 820px;
            margin: 0 auto;
            margin-right: calc(var(--sidebar-width) + 24px);
            padding: 32px 24px 80px;
            transition: margin 0.3s;
            min-width: 0;
            width: 100%;
            overflow-x: hidden;
        }
        .section {
            display: none;
            animation: fadeIn 0.35s ease;
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }
        .section.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== هدر بخش ===== */
        .section-header {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
            transition: background 0.3s, border-color 0.3s;
        }
        .section-header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background: var(--primary);
        }
        .section-badge {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .section-header h1 {
            font-size: 1.3rem;
            color: var(--text-heading);
            margin-bottom: 3px;
            line-height: 1.4;
        }
        .section-header .meta {
            font-size: 0.84rem;
            color: var(--text-muted);
        }

        /* ===== تایپوگرافی ===== */
        h2 {
            color: var(--text-heading);
            font-size: 1.25rem;
            margin: 32px 0 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            flex-shrink: 0;
        }
        h3 {
            color: var(--text-heading);
            font-size: 1.05rem;
            margin: 20px 0 8px;
        }
        p {
            margin-bottom: 14px;
            text-align: justify;
        }
        strong {
            color: var(--text-heading);
        }
        ul,
        ol {
            margin: 10px 0 18px;
            padding-right: 24px;
        }
        li {
            margin-bottom: 6px;
        }
        blockquote {
            background: var(--primary-soft);
            border-right: 4px solid var(--primary);
            padding: 14px 18px;
            margin: 20px 0;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            color: var(--text-heading);
            font-style: italic;
            transition: background 0.3s, border-color 0.3s;
        }

        /* ===== جعبه‌های اطلاعاتی ===== */
        .box {
            display: flex;
            gap: 14px;
            padding: 16px 18px;
            border-radius: var(--radius-sm);
            margin: 22px 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            transition: background 0.3s, border-color 0.3s;
        }
        .box>div {
            min-width: 0;
            flex: 1;
            overflow-wrap: break-word;
        }
        .box i {
            font-size: 1.3rem;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .box strong {
            display: block;
            margin-bottom: 3px;
        }
        .box.note {
            background: var(--note-bg);
            border-color: var(--note-border);
        }
        .box.note i,
        .box.note strong {
            color: var(--note-border);
        }
        .box.important {
            background: var(--important-bg);
            border-color: var(--important-border);
        }
        .box.important i,
        .box.important strong {
            color: var(--important-border);
        }
        .box.warning {
            background: var(--warning-bg);
            border-color: var(--warning-border);
        }
        .box.warning i,
        .box.warning strong {
            color: var(--warning-border);
        }

        /* ===== کد ===== */
        .code-container {
            position: relative;
            margin: 24px 0;
            max-width: 100%;
            min-width: 0;
            width: 100%;
        }
        .code-label {
            position: absolute;
            top: -11px;
            left: 14px;
            background: var(--primary);
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 14px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            z-index: 1;
            letter-spacing: 0.3px;
        }
        .code-block {
            background: var(--bg-code);
            color: var(--code-text);
            padding: 28px 18px 18px;
            border-radius: var(--radius-sm);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            direction: ltr;
            text-align: left;
            unicode-bidi: isolate;
            white-space: pre;
            overflow-x: auto;
            border: 1px solid var(--border);
            max-width: 100%;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
            transition: background 0.3s, border-color 0.3s;
            line-height: 1.6;
        }
        .code-block::before {
            content: '>>> ';
            color: var(--terminal-green);
        }
        .code-block.no-prompt::before {
            content: none;
        }

        /* ===== جدول ===== */
        .table-wrap {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 22px 0;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0;
            font-size: 0.93rem;
            border-radius: var(--radius-sm);
            overflow: hidden;
            min-width: 0;
        }
        th,
        td {
            border: 1px solid var(--border);
            padding: 11px 14px;
            text-align: right;
            vertical-align: top;
        }
        th {
            background: var(--primary-soft);
            color: var(--text-heading);
            font-weight: 600;
            white-space: nowrap;
        }
        tr:hover td {
            background: var(--bg-body);
        }
        td code {
            white-space: nowrap;
        }

        /* ===== جمع‌بندی ===== */
        .summary-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            margin: 24px 0;
            box-shadow: var(--shadow);
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            transition: background 0.3s, border-color 0.3s;
        }
        .summary-box h3 {
            margin-top: 0;
            color: var(--primary);
        }

        /* ===== کوئیز ===== */
        .quiz-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            margin: 28px 0 16px;
            box-shadow: var(--shadow);
            transition: background 0.3s, border-color 0.3s;
        }
        .quiz-card>p {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-heading);
            margin-bottom: 16px;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .quiz-options button {
            background: var(--bg-body);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            text-align: right;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.2s;
        }
        .quiz-options button:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        .quiz-options button.selected {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .quiz-answer {
            display: none;
            margin-top: 14px;
            padding: 14px 16px;
            background: var(--note-bg);
            border-radius: var(--radius-sm);
            border-right: 4px solid var(--note-border);
            color: var(--text-heading);
            font-size: 0.95rem;
            transition: background 0.3s, border-color 0.3s;
        }
        .quiz-answer.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        /* ===== ویرایشگر پایتون (Playground) ===== */
        .python-playground {
            margin: 24px 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
            background: #1e1e2e;
            border: 1px solid #313244;
            direction: ltr;
            max-width: 100%;
        }
        .playground-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #181825;
            padding: 10px 14px;
            border-bottom: 1px solid #313244;
            flex-wrap: wrap;
        }
        .playground-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cdd6f4;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }
        .playground-title i {
            color: #89b4fa;
        }
        .playground-status {
            font-size: 12px;
            color: #a6adc8;
            font-family: 'JetBrains Mono', monospace;
            margin-right: auto;
            margin-left: 8px;
        }
        .playground-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .playground-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
            border-radius: 7px;
            padding: 6px 14px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.18s;
            line-height: 1.3;
        }
        .playground-btn.run {
            background: #89b4fa;
            color: #1e1e2e;
        }
        .playground-btn.run:hover {
            background: #b4befe;
        }
        .playground-btn.run:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .playground-btn.clear {
            background: #313244;
            color: #cdd6f4;
        }
        .playground-btn.clear:hover {
            background: #45475a;
        }
        .playground-editor-wrap {
            position: relative;
            min-height: 180px;
            max-height: 360px;
            overflow: auto;
        }
        .python-playground .CodeMirror {
            height: 220px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.55;
            direction: ltr;
            text-align: left;
            background: #1e1e2e !important;
        }
        .python-playground .CodeMirror-scroll {
            min-height: 180px;
        }
        .python-playground .CodeMirror-gutters {
            background: #181825 !important;
            border-right: 1px solid #313244;
        }
        .python-playground .CodeMirror-linenumber {
            color: #6c7086;
        }
        .playground-output {
            background: #11111b;
            color: #a6adc8;
            padding: 12px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13.5px;
            min-height: 72px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            border-top: 1px solid #313244;
            direction: ltr;
            text-align: left;
            line-height: 1.5;
        }
        .playground-output.error {
            color: #f38ba8;
        }
        .playground-output.success {
            color: #a6e3a1;
        }
        .playground-output.loading {
            color: #f9e2af;
        }
        .playground-hint {
            margin-top: 10px;
            font-size: 0.9rem;

        // ============================================================
        // ساخت آرایه flat از تمام بخش‌ها
        // ============================================================
        const allSections = [];
        course.forEach((ch, chIdx) => {
            ch.sections.forEach((sec, secIdx) => {
                allSections.push(Object.assign({}, sec, {
                    chapterId: ch.id,
                    chapterTitle: ch.title,
                    badge: ch.badge,
                    chapterIndex: chIdx,
                    sectionIndex: secIdx,
                    totalInChapter: ch.sections.length
                }));
            });
        });

        let currentIndex = 0;

        // ============================================================
        // ساخت TOC
        // ============================================================
        function buildTOC() {
            const toc = document.getElementById('tocNav');
            toc.innerHTML = '';

            course.forEach((ch, idx) => {
                const details = document.createElement('details');
                details.className = 'toc-chapter';
                if (idx === 0) details.open = true;

                const summary = document.createElement('summary');
                summary.innerHTML = '<span class="chapter-num">' + ch.badge + '</span><span>' + ch.title +
                '</span>';
                details.appendChild(summary);

                const ul = document.createElement('ul');
                ul.className = 'toc-sections';

                ch.sections.forEach(sec => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = '#' + sec.id;
                    a.textContent = sec.title;
                    a.dataset.id = sec.id;

                    a.addEventListener('click', function(e) {
                        e.preventDefault();
                        const index = allSections.findIndex(s => s.id === sec.id);
                        if (index !== -1) showSection(index);
                    });

                    li.appendChild(a);
                    ul.appendChild(li);
                });

                details.appendChild(ul);
                toc.appendChild(details);
            });
        }

        // ============================================================
        // ساخت بخش‌ها
        // ============================================================
        function buildSections() {
            const main = document.getElementById('mainContent');
            main.innerHTML = '';

            allSections.forEach((sec, idx) => {
                const div = document.createElement('div');
                div.className = 'section' + (idx === 0 ? ' active' : '');
                div.id = sec.id;

                const isFirst = idx === 0;
                const isLast = idx === allSections.length - 1;

                let body = '';

                if (richContent[sec.id]) {
                    body = richContent[sec.id];
                } else {
                    body = `
                        <div class="section-header">
                            <div class="section-badge">${sec.badge}</div>
                            <div>
                                <h1>${sec.title}</h1>
                                <div class="meta">${sec.chapterTitle} · بخش ${sec.sectionIndex + 1} از ${sec.totalInChapter}</div>
                            </div>
                        </div>
                        <div class="placeholder">
                            <i class="fas fa-laptop-code"></i>
                            <p>محتوای این بخش در حال آماده‌سازی است...</p>
                            <p style="font-size:0.9rem;margin-top:6px;opacity:0.8;">${sec.chapterTitle} — ${sec.title}</p>
                        </div>
                    `;
                }

                body += `
                    <div class="nav-buttons">
                        <button class="nav-btn" ${isFirst ? 'disabled' : ''} onclick="goToPrev()">
                            ${isFirst ? 'بخش قبلی' : '<i class="fas fa-arrow-right"></i> بخش قبلی'}
                        </button>
                        <button class="nav-btn" ${isLast ? 'disabled' : ''} onclick="goToNext()">
                            ${isLast ? 'پایان' : 'بخش بعدی <i class="fas fa-arrow-left"></i>'}
                        </button>
                    </div>
                `;

                div.innerHTML = body;
                main.appendChild(div);
            });
        }

        // ============================================================
        // توابع ناوبری
        // ============================================================
        function showSection(index) {
            if (index < 0 || index >= allSections.length) return;

            currentIndex = index;

            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(allSections[index].id);
            if (target) target.classList.add('active');

            document.querySelectorAll('.toc-sections a').forEach(a => {
                a.classList.remove('active');
                if (a.dataset.id === allSections[index].id) a.classList.add('active');
            });

            const chIdx = allSections[index].chapterIndex;
            document.querySelectorAll('.toc-chapter').forEach((d, i) => {
                d.open = (i === chIdx);
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (window.innerWidth <= 1000) closeSidebar();
        }

        function goToPrev() {
            if (currentIndex > 0) showSection(currentIndex - 1);
        }

        function goToNext() {
            if (currentIndex < allSections.length - 1) showSection(currentIndex + 1);
        }

        // ============================================================
        // سایدبار
        // ============================================================
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const toggleBtn = document.getElementById('sidebarToggle');
        const closeBtn = document.getElementById('sidebarClose');

        function openSidebar() {
            sidebar.classList.add('open');
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        toggleBtn.addEventListener('click', openSidebar);
        closeBtn.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);

        // ============================================================
        // تم
        // ============================================================
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.querySelector('.theme-icon');
            if (theme === 'dark') {
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        // ============================================================
        // کوئیزها
        // ============================================================
        function selectOption(btn) {
            const parent = btn.parentElement;
            parent.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            parent.nextElementSibling.classList.add('show');
        }

        // ============================================================
        // نوار پیشرفت
        // ============================================================
        window.onscroll = function() {
            const scroll = document.documentElement.scrollTop || document.body.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            document.getElementById('progressBar').style.width = (height > 0 ? (scroll / height * 100) : 0) + '%';
        };

        // ============================================================
        // کلیدهای صفحه‌کلید
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSidebar();
            if (e.key === 'ArrowLeft') goToNext();
            if (e.key === 'ArrowRight') goToPrev();
        });

        // ============================================================
        // بسته‌بندی جدول‌ها
        // ============================================================
        function wrapTables() {
            document.querySelectorAll('.section table').forEach(function(table) {
                if (table.parentElement && table.parentElement.classList.contains('table-wrap')) return;
                var wrap = document.createElement('div');
                wrap.className = 'table-wrap';
                table.parentNode.insertBefore(wrap, table);
                wrap.appendChild(table);
            });
        }

        // ============================================================
        // مقداردهی اولیه
        // ============================================================
        buildTOC();
        buildSections();
        wrapTables();
        showSection(0);
    </script>
<!-- ===== اسکریپت‌های ویرایشگر ===== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>

<script>
(function () {
    const textarea = document.getElementById('pythonPlayground');
    const outputEl = document.getElementById('playgroundOutput');
    const statusEl = document.getElementById('playgroundStatus');
    const runBtn = document.getElementById('runPlaygroundBtn');

    if (!textarea || !outputEl) return;

    // CodeMirror setup
    const editor = CodeMirror.fromTextArea(textarea, {
        mode: 'python',
        theme: 'dracula',
        lineNumbers: true,
        indentUnit: 4,
        tabSize: 4,
        indentWithTabs: false,
        lineWrapping: true,
        autofocus: false,
        viewportMargin: Infinity,
        extraKeys: {
            'Ctrl-Enter': function () { runCodePlayground(); },
            'Cmd-Enter': function () { runCodePlayground(); },
            'Tab': function (cm) {
                if (cm.somethingSelected()) cm.indentSelection('add');
                else cm.replaceSelection('    ', 'end');
            }
        }
    });

    // Refresh when section becomes visible (fixes zero-height on some mobile browsers)
    function refreshEditor() {
        try { editor.refresh(); } catch (e) {}
    }
    setTimeout(refreshEditor, 200);
    window.addEventListener('resize', refreshEditor);

    let pyodide = null;
    let pyodideReady = false;
    let isRunning = false;

    function setStatus(text) {
        if (statusEl) statusEl.textContent = text;
    }

    function setOutput(text, type) {
        outputEl.textContent = text;
        outputEl.classList.remove('error', 'success', 'loading');
        if (type) outputEl.classList.add(type);
    }

    window.clearPlaygroundOutput = function () {
        setOutput('▶ خروجی پاک شد. کد را اجرا کنید.', null);
        setStatus(pyodideReady ? 'آماده' : 'در حال آماده‌سازی...');
    };

    async function loadPyodideForPlayground() {
        if (pyodideReady) return true;
        setOutput('⏳ در حال بارگذاری مفسر پایتون (اولین بار کمی طول می‌کشد)...', 'loading');
        setStatus('بارگذاری...');
        if (runBtn) runBtn.disabled = true;

        try {
            pyodide = await loadPyodide({
                indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/'
            });

            // Polyfill input() so it works via browser prompt
            pyodide.runPython(`
import builtins
def _input(prompt=""):
    from js import prompt as js_prompt
    result = js_prompt(str(prompt) if prompt else "")
    if result is None:
        return ""
    return str(result)
builtins.input = _input
`);

            pyodideReady = true;
            setOutput('✅ مفسر آماده است. کد را بنویسید و اجرا کنید.', 'success');
            setStatus('آماده');
            if (runBtn) runBtn.disabled = false;
            return true;
        } catch (err) {
            setOutput('❌ خطا در بارگذاری مفسر: ' + (err.message || String(err)), 'error');
            setStatus('خطا');
            if (runBtn) runBtn.disabled = false;
            return false;
        }
    }

    window.runCodePlayground = async function () {
        if (isRunning) return;

        if (!pyodideReady) {
            const ok = await loadPyodideForPlayground();
            if (!ok) return;
        }

        const code = editor.getValue();
        if (!code.trim()) {
            setOutput('⚠️ لطفاً کدی بنویسید.', 'loading');
            return;
        }

        isRunning = true;
        if (runBtn) runBtn.disabled = true;
        setOutput('⏳ در حال اجرا...', 'loading');
        setStatus('اجرا...');

        try {
            // Capture stdout/stderr
            await pyodide.runPythonAsync(`
import sys
from io import StringIO
__stdout_backup = sys.stdout
__stderr_backup = sys.stderr
sys.stdout = StringIO()
sys.stderr = StringIO()
`);

            let result = null;
            let execError = null;
            try {
                result = await pyodide.runPythonAsync(code);
            } catch (e) {
                execError = e;
            }

            const stdout = pyodide.runPython(`
out = sys.stdout.getvalue()
err = sys.stderr.getvalue()
sys.stdout = __stdout_backup
sys.stderr = __stderr_backup
out + (err if err else "")
`);

            let finalOutput = (stdout || '').trimEnd();
            if (result !== undefined && result !== null && String(result) !== 'None') {
                finalOutput += (finalOutput ? '\n' : '') + String(result);
            }

            if (execError) {
                let errMsg = execError.message || String(execError);
                // Clean common Pyodide noise
                errMsg = errMsg
                    .replace(/File "<exec>", line \d+, in <module>\n?/g, '')
                    .replace(/File "<exec>", line \d+, in /g, '')
                    .trim();
                finalOutput = (finalOutput ? finalOutput + '\n\n' : '') + '❌ ' + errMsg;
                setOutput(finalOutput || '❌ خطا', 'error');
                setStatus('خطا');
            } else {
                setOutput(finalOutput || '✅ اجرا شد (بدون خروجی)', finalOutput ? null : 'success');
                setStatus('آماده');
            }
        } catch (err) {
            let msg = err.message || String(err);
            msg = msg.replace(/File "<exec>", line \d+, in /g, '').trim();
            setOutput('❌ خطا: ' + msg, 'error');
            setStatus('خطا');
        } finally {
            isRunning = false;
            if (runBtn) runBtn.disabled = false;
            refreshEditor();
        }
    };

    // Auto-load Pyodide after page is ready
    window.addEventListener('load', function () {
        setTimeout(loadPyodideForPlayground, 400);
    });

    // Also try when document already complete
    if (document.readyState === 'complete') {
        setTimeout(loadPyodideForPlayground, 500);
    }

    console.log('✅ Python Playground initialized');
})();
</script>
