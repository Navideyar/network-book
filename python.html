<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دوره Python · ZeroDay</title>

    <!-- فونت‌ها -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- CodeMirror (editor) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />

    <style>
        /* ===== متغیرهای CSS ===== */
        :root {
            --primary: #306998;
            --primary-hover: #1d4b6e;
            --primary-soft: #d1e0f0;
            --primary-glow: rgba(48, 105, 152, 0.25);
            --link: #245f96;
            --link-hover: #17466f;

            --bg-body: #f5f7fa;
            --bg-card: #ffffff;
            --bg-navbar: rgba(255, 255, 255, 0.92);
            --bg-code: #1e293b;
            --bg-toc-hover: #eef4fb;

            --text-main: #2d3748;
            --text-heading: #1a202c;
            --text-muted: #4a5568;

            --border: #e2e8f0;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --radius-sm: 10px;

            --note-bg: #e6ffed;
            --note-border: #2b8a3e;
            --important-bg: #e3f2fd;
            --important-border: #1976d2;
            --warning-bg: #fff8e1;
            --warning-border: #f57c00;

            --code-text: #e2e8f0;
            --terminal-green: #8ae234;
            --sidebar-width: 300px;
        }

        [data-theme="dark"] {
            --primary: #4d8dc7;
            --primary-hover: #5fa3d9;
            --primary-soft: rgba(77, 141, 199, 0.15);
            --primary-glow: rgba(77, 141, 199, 0.25);
            --link: #7fc4ff;
            --link-hover: #a9d9ff;

            --bg-body: #1a1e26;
            --bg-card: #242a36;
            --bg-navbar: rgba(30, 34, 44, 0.95);
            --bg-code: #0f131a;
            --bg-toc-hover: rgba(77, 141, 199, 0.12);

            --text-main: #e2e8f0;
            --text-heading: #f0f4fa;
            --text-muted: #a0aec0;

            --border: #3a4050;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);

            --note-bg: rgba(43, 138, 62, 0.15);
            --note-border: #5fbf7a;
            --important-bg: rgba(25, 118, 210, 0.15);
            --important-border: #64b5f6;
            --warning-bg: rgba(245, 124, 0, 0.15);
            --warning-border: #ffb74d;

            --code-text: #e2e8f0;
        }

        /* ===== ریست و پایه ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            overflow-x: hidden;
            max-width: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.8;
            font-size: 16.5px;
            padding-top: 64px;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            max-width: 100%;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== نوار بالا ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-navbar);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
            z-index: 1000;
            transition: background 0.3s, border-color 0.3s;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            white-space: nowrap;
        }
        .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
        }
        .nav-spacer {
            flex: 1;
        }
        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .theme-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        /* ===== نوار پیشرفت ===== */
        .progress-track {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            z-index: 999;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #7ab7e0);
            width: 0%;
            transition: width 0.15s;
        }

        /* ===== سایدبار ===== */
        .sidebar {
            position: fixed;
            top: 60px;
            right: 0;
            width: var(--sidebar-width);
            height: calc(100vh - 60px);
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            z-index: 900;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s, border-color 0.3s;
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.04);
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg-card);
            z-index: 2;
        }
        .sidebar-header h3 {
            font-size: 1rem;
            color: var(--text-heading);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-header h3 i {
            color: var(--primary);
        }
        .sidebar-close {
            display: none;
            background: none;
            border: none;
            font-size: 1.15rem;
            color: var(--text-muted);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: 0.2s;
        }
        .sidebar-close:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }

        /* ===== فهرست مطالب ===== */
        .toc {
            padding: 8px 0 30px;
        }
        .toc-chapter {
            border-bottom: 1px solid var(--border);
        }
        .toc-chapter:last-child {
            border-bottom: none;
        }
        .toc-chapter summary {
            padding: 12px 14px;
            font-weight: 600;
            color: var(--text-heading);
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: background 0.15s;
            user-select: none;
            font-size: 0.92rem;
            line-height: 1.4;
            border-radius: 0;
        }
        .toc-chapter summary::-webkit-details-marker {
            display: none;
        }
        .toc-chapter summary::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            margin-right: auto;
            margin-top: 2px;
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: transform 0.25s;
            flex-shrink: 0;
        }
        .toc-chapter[open] summary::after {
            transform: rotate(180deg);
        }
        .toc-chapter summary:hover {
            background: var(--bg-toc-hover);
        }
        .toc-chapter[open]>summary {
            background: var(--primary-soft);
            color: var(--primary);
        }
        .chapter-num {
            width: 24px;
            height: 24px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .toc-sections {
            list-style: none;
            padding: 0 0 8px 0;
            margin: 0;
            background: var(--bg-body);
        }
        .toc-sections li a {
            display: block;
            padding: 8px 14px 8px 48px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.15s;
            border-right: 3px solid transparent;
            line-height: 1.45;
        }
        .toc-sections li a:hover {
            color: var(--primary);
            background: var(--bg-toc-hover);
        }
        .toc-sections li a.active {
            color: var(--primary);
            background: var(--primary-soft);
            border-right-color: var(--primary);
            font-weight: 600;
        }

        .toc-practice {
            display: block;
            padding: 0;
            margin-top: 2px;
            font-size: 0.83rem;
            line-height: 1.45;
        }

        .toc-practice a {
            display: block;
            padding: 8px 14px 10px 48px;
            color: var(--link);
            text-decoration: none;
            border-right: 3px solid transparent;
            cursor: pointer;
        }

        .toc-practice a:hover {
            color: var(--link-hover);
            background: var(--primary-soft);
            border-right-color: var(--primary);
        }

        .toc-practice i {
            color: inherit;
            margin-left: 5px;
            font-size: 0.8rem;
        }

        /* ===== دکمه باز کردن سایدبار ===== */
        .sidebar-toggle {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            font-size: 1.25rem;
            box-shadow: 0 6px 20px var(--primary-glow);
            z-index: 950;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }
        .sidebar-toggle:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 850;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.open {
            display: block;
        }

        /* ===== محتوای اصلی ===== */
        .main {
            max-width: 820px;
            margin: 0 auto;
            margin-right: calc(var(--sidebar-width) + 24px);
            padding: 32px 24px 80px;
            transition: margin 0.3s;
            min-width: 0;
            width: 100%;
            overflow-x: hidden;
        }
        .section {
            display: none;
            animation: fadeIn 0.35s ease;
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }
        .section.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== هدر بخش ===== */
        .section-header {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
            transition: background 0.3s, border-color 0.3s;
        }
        .section-header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background: var(--primary);
        }
        .section-badge {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .section-header h1 {
            font-size: 1.3rem;
            color: var(--text-heading);
            margin-bottom: 3px;
            line-height: 1.4;
        }
        .section-header .meta {
            font-size: 0.84rem;
            color: var(--text-muted);
        }

        /* ===== تایپوگرافی ===== */
        h2 {
            color: var(--text-heading);
            font-size: 1.25rem;
            margin: 32px 0 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            flex-shrink: 0;
        }
        h3 {
            color: var(--text-heading);
            font-size: 1.05rem;
            margin: 20px 0 8px;
        }

        .lesson-title {
            color: var(--text-heading);
            margin-top: 30px;
        }
        p {
            margin-bottom: 14px;
            text-align: justify;
        }
        strong {
            color: var(--text-heading);
        }

        /* ===== تمرینات فصل ===== */
        .exercise-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.65);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }

        .exercise-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .exercise-modal-content {
            position: relative;
            width: min(420px, 100%);
            padding: 32px 24px;
            text-align: center;
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
        }

        .exercise-modal-close {
            position: absolute;
            top: 8px;
            left: 12px;
            border: 0;
            background: transparent;
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
        }

        .exercise-modal-icon {
            color: var(--primary);
            font-size: 30px;
            margin-bottom: 10px;
        }

        .exercise-modal-content h2 {
            margin: 0 0 8px;
            color: var(--text-heading);
        }

        .exercise-modal-chapter {
            margin: 0 0 18px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .exercise-modal-message {
            margin: 0;
            color: var(--link);
            font-weight: 600;
        }

        /* ===== لینک‌ها ===== */
        a {
            color: var(--link);
            text-decoration-thickness: 1px;
            text-underline-offset: 2px;
            transition: color 0.15s, background 0.15s;
        }

        a:hover {
            color: var(--link-hover);
        }

        /* لینک‌های فهرست ظاهر اختصاصی خودشان را حفظ می‌کنند */
        .toc-sections li a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .toc-sections li a:hover,
        .toc-sections li a.active {
            color: var(--primary);
        }
        ul,
        ol {
            margin: 10px 0 18px;
            padding-right: 24px;
        }
        li {
            margin-bottom: 6px;
        }
        blockquote {
            background: var(--primary-soft);
            border-right: 4px solid var(--primary);
            padding: 14px 18px;
            margin: 20px 0;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            color: var(--text-heading);
            font-style: italic;
            transition: background 0.3s, border-color 0.3s;
        }

        /* ===== جعبه‌های اطلاعاتی ===== */
        .box {
            display: flex;
            gap: 14px;
            padding: 16px 18px;
            border-radius: var(--radius-sm);
            margin: 22px 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            transition: background 0.3s, border-color 0.3s;
        }
        .box>div {
            min-width: 0;
            flex: 1;
            overflow-wrap: break-word;
        }
        .box i {
            font-size: 1.3rem;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .box strong {
            display: block;
            margin-bottom: 3px;
        }
        .box.note {
            background: var(--note-bg);
            border-color: var(--note-border);
        }
        .box.note i,
        .box.note strong {
            color: var(--note-border);
        }
        .box.important {
            background: var(--important-bg);
            border-color: var(--important-border);
        }
        .box.important i,
        .box.important strong {
            color: var(--important-border);
        }
        .box.warning {
            background: var(--warning-bg);
            border-color: var(--warning-border);
        }
        .box.warning i,
        .box.warning strong {
            color: var(--warning-border);
        }

        /* ===== کد ===== */
        .code-container {
            position: relative;
            margin: 24px 0;
            max-width: 100%;
            min-width: 0;
            width: 100%;
        }
        .code-label {
            position: absolute;
            top: -11px;
            left: 14px;
            background: var(--primary);
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 14px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            z-index: 1;
            letter-spacing: 0.3px;
        }
        .code-block {
            background: var(--bg-code);
            color: var(--code-text);
            padding: 28px 18px 18px;
            border-radius: var(--radius-sm);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            direction: ltr;
            text-align: left;
            unicode-bidi: isolate;
            white-space: pre;
            overflow-x: auto;
            border: 1px solid var(--border);
            max-width: 100%;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
            transition: background 0.3s, border-color 0.3s;
            line-height: 1.6;
        }
        .code-block::before {
            content: '>>> ';
            color: var(--terminal-green);
        }
        .code-block.no-prompt::before {
            content: none;
        }

        /* ===== جدول ===== */
        .table-wrap {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 22px 0;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0;
            font-size: 0.93rem;
            border-radius: var(--radius-sm);
            overflow: hidden;
            min-width: 0;
        }
        th,
        td {
            border: 1px solid var(--border);
            padding: 11px 14px;
            text-align: right;
            vertical-align: top;
        }
        th {
            background: var(--primary-soft);
            color: var(--text-heading);
            font-weight: 600;
            white-space: nowrap;
        }
        tr:hover td {
            background: var(--bg-body);
        }
        td code {
            white-space: nowrap;
        }

        /* ===== جمع‌بندی ===== */
        .summary-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            margin: 24px 0;
            box-shadow: var(--shadow);
            max-width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            transition: background 0.3s, border-color 0.3s;
        }
        .summary-box h3 {
            margin-top: 0;
            color: var(--primary);
        }

        /* ===== کوئیز ===== */
        .quiz-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            margin: 28px 0 16px;
            box-shadow: var(--shadow);
            transition: background 0.3s, border-color 0.3s;
        }
        .quiz-card>p {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-heading);
            margin-bottom: 16px;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .quiz-options button {
            background: var(--bg-body);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            text-align: right;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.2s;
        }
        .quiz-options button:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        .quiz-options button.selected {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .quiz-answer {
            display: none;
            margin-top: 14px;
            padding: 14px 16px;
            background: var(--note-bg);
            border-radius: var(--radius-sm);
            border-right: 4px solid var(--note-border);
            color: var(--text-heading);
            font-size: 0.95rem;
            transition: background 0.3s, border-color 0.3s;
        }
        .quiz-answer.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        /* ===== ویرایشگر پایتون (Playground) ===== */
        .python-playground {
            margin: 24px 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
            background: #1e1e2e;
            border: 1px solid #313244;
            direction: ltr;
            max-width: 100%;
        }
        .playground-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #181825;
            padding: 10px 14px;

<h2 class="lesson-title">4. پس Python کامپایلر است یا Interpreter؟</h2>
<p>اینجا یکی از نکات مهم Python Basic قرار دارد. </p>
<p>اگر در یک سؤال ساده پرسیدند:</p>
<blockquote>Python is a compiled language or interpreted language?</blockquote>
<p>معمولاً در سطح Basic پاسخ مورد انتظار:</p>
<blockquote><strong>Python یک زبان interpreted است.</strong></blockquote>
<p>اما از نظر فنی، داستان کمی دقیق‌تر است.</p>
<p>در پیاده‌سازی رایج Python یعنی <strong>CPython</strong>، کد Python ابتدا به <strong>Bytecode</strong> تبدیل می‌شود و سپس توسط Python Virtual Machine اجرا می‌شود.</p>
<p>مدل ساده‌تر و دقیق‌تر:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Python Source Code
        │
        ▼
      CPython
        │
        ▼
     Bytecode
        │
        ▼
 Python Virtual Machine
        │
        ▼
     Execution</div></div>
<p>پس این دو جمله را با هم به خاطر بسپار:</p>
<blockquote><strong>در سطح Basic:</strong> Python را یک زبان interpreted می‌دانیم.</blockquote>
<blockquote><strong>از نظر فنی:</strong> CPython کد Python را به bytecode تبدیل کرده و آن را اجرا می‌کند.</blockquote>
<h3>نکته امتحانی </h3>
<p>نگو:</p>
<blockquote>Python هیچ‌وقت compile نمی‌شود.</blockquote>
<p>این جمله دقیق نیست.</p>
<p>در CPython مرحله‌ای برای تبدیل Source Code به <strong>Bytecode</strong> وجود دارد.</p>

<h2 class="lesson-title">1. از جلسه قبل تا اینجا</h2>

<p>حالا یک مشکل واقعی داریم.</p>
<p>فرض کن کاربر سنش را وارد می‌کند:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = &quot;25&quot;</div></div>
<p>ممکن است از خودمان بپرسیم:</p>
<blockquote>چرا <code>"25"</code> را عدد در نظر نگیریم؟</blockquote>
<p>چون <code>"25"</code> از نظر Python <strong>متن</strong> است، نه عدد.</p>

<p>اگر بخواهیم <code>"25"</code> را به <code>25</code> تبدیل کنیم، به <strong>Type Casting</strong> نیاز داریم.</p>

<h2 class="lesson-title">2. Type Casting چیست؟ </h2>
<p><strong>Type Casting</strong> یعنی تبدیل یک مقدار از یک Data Type به Data Type دیگر.</p>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Value
  │
  ▼
Type A
  │
  │ Casting
  ▼
Type B</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = &quot;25&quot;

age = int(age)</div></div>
<p>قبل:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&quot;25&quot; → str</div></div>
<p>بعد:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">25 → int</div></div>
<p>پس:</p>
<blockquote>Type Casting یعنی تلاش برای تبدیل یک مقدار به نوع داده‌ای دیگر.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">3. توابع اصلی Type Casting</h2>
<p>در Python چند تابع بسیار مهم برای تبدیل نوع داریم:</p>
<div class="table-wrap"><table><thead><tr><th>تابع</th><th>تبدیل به</th></tr></thead><tbody><tr><td><code>int()</code></td><td><code>int</code></td></tr><tr><td><code>float()</code></td><td><code>float</code></td></tr><tr><td><code>str()</code></td><td><code>str</code></td></tr><tr><td><code>bool()</code></td><td><code>bool</code></td></tr></tbody></table></div>
<p>در Python Basic همین چهار مورد را باید خیلی خوب بلد باشی. </p>
<hr class="lesson-divider">
<h2 class="lesson-title">4. تبدیل به <code>int</code> با <code>int()</code></h2>
<p>اگر بخواهیم یک مقدار را به عدد صحیح تبدیل کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">int()</div></div>
<p>استفاده می‌کنیم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = &quot;25&quot;

age = int(age)

print(age)
print(type(age))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">25
&lt;class 'int'&gt;</div></div>
<p>قبل:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&quot;25&quot; → str</div></div>
<p>بعد:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">25 → int</div></div>
<h3>تبدیل <code>float</code> به <code>int</code></h3>
<p>این هم بسیار مهم است:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">price = 19.99

price = int(price)

print(price)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">19</div></div>
<p>دقت کن!</p>
<p><code>int()</code> قسمت اعشاری را <strong>حذف می‌کند</strong>؛ گرد نمی‌کند.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">int(9.9)</div></div>
<p>نتیجه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">9</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">int(9.1)</div></div>
<p>نتیجه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">9</div></div>
<p>پس:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">9.9 → 9
9.1 → 9</div></div>
<h3>نکته امتحانی </h3>
<p><code>int()</code> برای تبدیل <code>float</code> به <code>int</code>، عدد را <strong>truncate</strong> می‌کند؛ یعنی بخش اعشاری را حذف می‌کند.</p>
<p>پس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">int(4.99)</div></div>
<p>برابر <code>5</code> نیست.</p>
<p>بلکه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">4</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">5. تبدیل به <code>float</code> با <code>float()</code></h2>
<p>برای تبدیل یک مقدار به عدد اعشاری:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">float()</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">x = &quot;12.5&quot;

x = float(x)

print(x)
print(type(x))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">12.5
&lt;class 'float'&gt;</div></div>
<p>حتی یک عدد صحیح هم می‌تواند به <code>float</code> تبدیل شود:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">x = 10

x = float(x)

print(x)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">10.0</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">10 → 10.0</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">6. تبدیل <code>str</code> به <code>float</code></h2>
<p>این هم بسیار رایج است:</p>

<p>حالا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&quot;19.99&quot; → 19.99
str       float</div></div>

<h2 class="lesson-title">7. تبدیل به <code>str</code> با <code>str()</code></h2>
<p>گاهی یک مقدار عددی داریم ولی می‌خواهیم آن را به متن تبدیل کنیم.</p>
<p>از:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">str()</div></div>
<p>استفاده می‌کنیم.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 25

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">25
&lt;class 'str'&gt;</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">25   → int
&quot;25&quot; → str</div></div>

<h2 class="lesson-title">8. چرا <code>str()</code> کاربردی است؟</h2>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 25</div></div>
<p>و می‌خواهیم مقدار را با یک متن ترکیب کنیم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">message = &quot;I am &quot; + age + &quot; years old.&quot;</div></div>
<p>این کار خطا می‌دهد، چون:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">str + int</div></div>
<p>را نمی‌توانیم به این شکل مستقیم با هم ترکیب کنیم.</p>
<p>می‌توانیم <code>age</code> را به <code>str</code> تبدیل کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 25

<p>البته در جلسه <strong>Strings</strong> با <code>f-string</code> روش بهتر و خواناتری برای این کار یاد می‌گیریم.</p>

<h2 class="lesson-title">9. تبدیل به <code>bool</code> با <code>bool()</code></h2>
<p>تابع:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">bool()</div></div>
<p>یک مقدار را به <code>True</code> یا <code>False</code> تبدیل می‌کند.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(bool(1))
print(bool(0))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True
False</div></div>
<p>برای String:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(bool(&quot;Hello&quot;))
print(bool(&quot;&quot;))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True
False</div></div>
<p>مدل ساده‌ای که فعلاً باید یاد بگیری:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0       → False
&quot;&quot;      → False

عدد غیرصفر → True
String غیرخالی → True</div></div>
<p>این مفهوم بعدها در <code>if</code> و شرط‌ها بسیار کاربردی می‌شود.</p>

<h2 class="lesson-title">10. چند مثال مهم <code>bool()</code></h2>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(bool(10))
print(bool(-5))
print(bool(0))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True
True
False</div></div>

print(bool(&quot;0&quot;))
print(bool(&quot;&quot;))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True
True
False</div></div>
<h3>نکته مهم </h3>
<p>این:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">bool(&quot;0&quot;)</div></div>
<p>برابر <code>True</code> است.</p>
<p>چرا؟</p>
<p>چون <code>"0"</code> یک <strong>String غیرخالی</strong> است.</p>

<p>پس:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0   → False
&quot;0&quot; → True</div></div>
<p>این یکی از دام‌های رایج تستی است.</p>

<p>حالا چهار تابع اصلی را کنار هم ببین:</p>

<h2 class="lesson-title">12. چه تبدیل‌هایی ممکن است خطا بدهند؟ </h2>
<p>Type Casting همیشه موفق نیست.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">int(&quot;25&quot;)</div></div>
<p>کاملاً معتبر است.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">int(&quot;hello&quot;)</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">float(&quot;3.14&quot;)</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">float(&quot;Python&quot;)</div></div>
<p>معتبر نیست.</p>
<p>پس قبل از تبدیل باید ببینیم مقدار واقعاً قابلیت تبدیل دارد یا نه.</p>

   ↓

   ↓
12
 str     float    int</div></div>

<h2 class="lesson-title">14. Type Casting و Variableها</h2>
<p>گاهی Type Casting را در یک Variable جدید ذخیره می‌کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age_text = &quot;25&quot;

<h2 class="lesson-title">15. Type Casting در محاسبات</h2>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">a = &quot;10&quot;

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(a + b)</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1020</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&quot;10&quot; + &quot;20&quot; → &quot;1020&quot;

10 + 20     → 30</div></div>
<p>پس یک عملیات یکسان، بسته به Type داده می‌تواند نتیجه متفاوتی داشته باشد.</p>

<h2 class="lesson-title">16. یک مدل ذهنی خیلی مهم</h2>
<p>وقتی با یک مقدار کار می‌کنی، همیشه این سه سؤال را از خودت بپرس:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1. Value چیست؟
2. Type چیست؟
3. آیا Type موردنیاز عملیات را دارم؟</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = &quot;25&quot;</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Value → &quot;25&quot;
Type  → str</div></div>
<p>اگر بخواهیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age + 5</div></div>

Type  → int</div></div>

<h1 class="lesson-title section-troubleshoot">اشتباهات رایج</h1>
<h3>مشکل ۱ — <code>ValueError</code></h3>
<p>اگر بنویسی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = int(&quot;twenty&quot;)</div></div>
<p>Python نمی‌تواند این String را به <code>int</code> تبدیل کند.</p>
<p>پس Type Casting به این معنی نیست که:</p>
<blockquote>هر مقداری را می‌توان به هر Typeای تبدیل کرد.</blockquote>
<p>مقدار باید قابلیت تبدیل داشته باشد.</p>
<h3>مشکل ۲ — گرد شدن <code>float</code></h3>
<p>اگر بنویسی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">int(7.9)</div></div>
<p>جواب:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">7</div></div>
<p>است، نه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">8</div></div>
<p><code>int()</code> در این حالت بخش اعشاری را حذف می‌کند.</p>
<h3>مشکل ۳ — <code>+</code> روی Stringها</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">a = &quot;10&quot;
b = &quot;20&quot;

print(a + b)</div></div>
<p>نتیجه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1020</div></div>
<p>اگر جمع عددی می‌خواهی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(int(a) + int(b))</div></div>
<p>نتیجه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">30</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title"> نکات مهم جلسه</h2>
<p>برای مرور سریع:</p>

<h2 class="lesson-title">3. Arithmetic Operators </h2>
<p>Arithmetic یعنی <strong>محاسبات ریاضی</strong>.</p>

<div class="table-wrap"><table><thead><tr><th>Operator</th><th>معنی</th></tr></thead><tbody><tr><td><code>+</code></td><td>جمع</td></tr><tr><td><code>-</code></td><td>تفریق</td></tr><tr><td><code>*</code></td><td>ضرب</td></tr><tr><td><code>/</code></td><td>تقسیم</td></tr><tr><td><code>//</code></td><td>تقسیم صحیح</td></tr><tr><td><code>%</code></td><td>باقیمانده</td></tr><tr><td><code>**</code></td><td>توان</td></tr></tbody></table></div>
<h3>3.1 جمع <code>+</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">a = 10

print(a + b)</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(10 - 3)</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">7</div></div>
<h3>3.3 ضرب <code>*</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(10 * 3)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">30</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(10 / 3)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">3.3333333333333335</div></div>
<p>یک نکته بسیار مهم:</p>
<blockquote><code>/</code> در Python نتیجه تقسیم را به صورت <code>float</code> برمی‌گرداند.</blockquote>
<p>حتی اگر تقسیم دقیق باشد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(10 / 2)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">5.0</div></div>
<p>نه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">5</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">4. تقسیم صحیح <code>//</code></h2>
<p>گاهی نمی‌خواهیم قسمت اعشاری نتیجه را داشته باشیم.</p>
<p>در این حالت از:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">//</div></div>
<p>استفاده می‌کنیم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(10 // 3)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">3</div></div>
<p>چون:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">10 ÷ 3 = 3.333...</div></div>
<p>و <code>//</code> قسمت اعشاری را کنار می‌گذارد.</p>
<h3>نکته مهم </h3>
<p>در مورد اعداد مثبت می‌توانی فعلاً آن را این‌طور به خاطر بسپاری:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">/   → تقسیم معمولی
//  → تقسیم بدون بخش اعشاری</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">5. باقیمانده <code>%</code></h2>
<p>Operator <code>%</code> باقیمانده تقسیم را برمی‌گرداند.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(10 % 3)</div></div>

<p>چرا؟</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">10 ÷ 3

3 × 3 = 9
10 - 9 = 1</div></div>

<h3>کاربرد بسیار مهم</h3>
<p>بررسی زوج و فرد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">number = 8

print(number % 2)</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0</div></div>

<p>برای مثال:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">number = 7

print(number % 2)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1</div></div>
<p>پس عدد فرد است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">6. توان <code>**</code></h2>
<p>برای محاسبه توان استفاده می‌شود:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(2 ** 3)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">8</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">2³ = 8</div></div>
<p>مثال دیگر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(5 ** 2)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">25</div></div>

<h2 class="lesson-title">7. خلاصه Arithmetic</h2>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">a = 10

   + - *      / //      % **</div></div>

<h2 class="lesson-title">8. ترتیب انجام عملیات </h2>
<p>Python هم مثل ریاضی، ترتیب خاصی برای محاسبات دارد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = 2 + 3 * 4</div></div>
<p>ممکن است فکر کنی:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">14</div></div>

<p>چون ابتدا ضرب انجام می‌شود:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">2 + (3 × 4)
2 + 12
14</div></div>
<h3>پرانتز</h3>
<p>اگر بخواهیم ترتیب را تغییر دهیم، از پرانتز استفاده می‌کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = (2 + 3) * 4

print(result)</div></div>
<p>خروجی:</p>

<p>در سطح Basic:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">()
↓
**
↓
* / // %
↓
+ -</div></div>

<h2 class="lesson-title">9. Assignment Operators </h2>
<p>حالا از محاسبات کمی فاصله بگیریم.</p>
<p>فرض کن داریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">score = 10</div></div>
<p>علامت <code>=</code> یک <strong>Assignment Operator</strong> است.</p>
<p>یعنی:</p>
<blockquote>مقدار سمت راست را به متغیر سمت چپ نسبت بده.</blockquote>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">score = 10
  ↑      ↑
متغیر   مقدار</div></div>
<h3>9.1 مقداردهی مجدد</h3>
<p>می‌توانیم مقدار متغیر را تغییر دهیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">score = 10
score = 20

print(score)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">20</div></div>
<p>مقدار قبلی با مقدار جدید جایگزین شده است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">10. Assignment ترکیبی</h2>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">score = 10</div></div>
<p>می‌خواهیم 5 واحد به آن اضافه کنیم.</p>
<p>روش معمول:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">score = score + 5</div></div>
<p>نتیجه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">15</div></div>
<p>اما Python شکل کوتاه‌تری دارد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">score += 5</div></div>
<p>این دو از نظر نتیجه یکسان‌اند.</p>
<h3>Operatorهای Assignment مهم</h3>
<div class="table-wrap"><table><thead><tr><th>شکل کوتاه</th><th>معادل</th></tr></thead><tbody><tr><td><code>x += 5</code></td><td><code>x = x + 5</code></td></tr><tr><td><code>x -= 5</code></td><td><code>x = x - 5</code></td></tr><tr><td><code>x *= 5</code></td><td><code>x = x * 5</code></td></tr><tr><td><code>x /= 5</code></td><td><code>x = x / 5</code></td></tr><tr><td><code>x //= 5</code></td><td><code>x = x // 5</code></td></tr><tr><td><code>x %= 5</code></td><td><code>x = x % 5</code></td></tr><tr><td><code>x **= 5</code></td><td><code>x = x ** 5</code></td></tr></tbody></table></div>
<h3>مثال</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">balance = 100

balance += 50
print(balance)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">150</div></div>
<p>سپس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">balance -= 30
print(balance)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">120</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">balance *= 2
print(balance)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">240</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">🧠 Recall</h2>
<p>تفاوت این دو را خوب بفهم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">x = 10</div></div>
<p>یعنی:</p>
<blockquote>مقدار <code>10</code> را به <code>x</code> نسبت بده.</blockquote>
<p>اما:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">x == 10</div></div>
<p>یعنی:</p>
<blockquote>آیا مقدار <code>x</code> برابر <code>10</code> است؟</blockquote>
<p>این دو <strong>اصلاً یک کار نمی‌کنند.</strong></p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">=   → Assignment
==  → Comparison</div></div>
<p>این یکی از اشتباهات بسیار رایج مبتدی‌هاست. </p>
<hr class="lesson-divider">
<h2 class="lesson-title">11. Comparison Operators </h2>
<p>Comparison یعنی <strong>مقایسه</strong>.</p>
<p>نتیجه Comparison همیشه یک مقدار Boolean است:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">True</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">False</div></div>
<p>Operatorهای مهم:</p>
<div class="table-wrap"><table><thead><tr><th>Operator</th><th>معنی</th></tr></thead><tbody><tr><td><code>==</code></td><td>برابر است؟</td></tr><tr><td><code>!=</code></td><td>نابرابر است؟</td></tr><tr><td><code>&gt;</code></td><td>بزرگ‌تر است؟</td></tr><tr><td><code>&lt;</code></td><td>کوچک‌تر است؟</td></tr><tr><td><code>&gt;=</code></td><td>بزرگ‌تر یا مساوی است؟</td></tr><tr><td><code>&lt;=</code></td><td>کوچک‌تر یا مساوی است؟</td></tr></tbody></table></div>
<h3>مثال</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 20

print(age == 20)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<p>چون <code>age</code> برابر 20 است.</p>
<p>اما:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(age == 18)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">False</div></div>
<h3>مثال‌های دیگر</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(10 &gt; 5)</div></div>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(10 &lt; 5)</div></div>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">False</div></div>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(10 != 5)</div></div>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(10 &gt;= 10)</div></div>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">12. Comparison در برنامه واقعی</h2>
<p>فرض کن حداقل سن ورود به یک سیستم 18 سال است:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 20

allowed = age &gt;= 18

print(allowed)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<p>اینجا یک نتیجه منطقی تولید کرده‌ایم که در جلسات آینده می‌توانیم آن را در <code>if</code> استفاده کنیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Comparison
     ↓
 True / False
     ↓
 if</div></div>
<p>پس Comparison یکی از پایه‌های اصلی <strong>شرط‌ها</strong> است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">13. Logical Operators </h2>
<p>گاهی فقط یک مقایسه کافی نیست.</p>
<p>مثلاً می‌خواهیم بررسی کنیم:</p>
<blockquote>سن فرد حداقل 18 باشد <strong>و</strong> کارت شناسایی داشته باشد.</blockquote>
<p>اینجا به <strong>Logical Operators</strong> نیاز داریم.</p>
<p>سه مورد اصلی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">and
or
not</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">14. <code>and</code></h2>
<p><code>and</code> یعنی:</p>
<blockquote>هر دو شرط باید <code>True</code> باشند.</blockquote>
<p>مثال:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 20
has_card = True

result = age &gt;= 18 and has_card

print(result)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<p>چون هر دو شرط درست هستند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">age &gt;= 18  → True
has_card   → True

True and True → True</div></div>
<h3>جدول <code>and</code></h3>
<div class="table-wrap"><table><thead><tr><th>شرط اول</th><th>شرط دوم</th><th>نتیجه</th></tr></thead><tbody><tr><td>True</td><td>True</td><td>True</td></tr><tr><td>True</td><td>False</td><td>False</td></tr><tr><td>False</td><td>True</td><td>False</td></tr><tr><td>False</td><td>False</td><td>False</td></tr></tbody></table></div>
<p>پس:</p>
<blockquote>در <code>and</code> حتی اگر یکی از شرط‌ها <code>False</code> باشد، نتیجه <code>False</code> می‌شود.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">15. <code>or</code></h2>
<p><code>or</code> یعنی:</p>
<blockquote>حداقل یکی از شرط‌ها باید <code>True</code> باشد.</blockquote>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 16
has_permission = True

result = age &gt;= 18 or has_permission

print(result)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<p>چرا؟</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">age &gt;= 18      → False
has_permission → True

False or True → True</div></div>
<h3>جدول <code>or</code></h3>
<div class="table-wrap"><table><thead><tr><th>شرط اول</th><th>شرط دوم</th><th>نتیجه</th></tr></thead><tbody><tr><td>True</td><td>True</td><td>True</td></tr><tr><td>True</td><td>False</td><td>True</td></tr><tr><td>False</td><td>True</td><td>True</td></tr><tr><td>False</td><td>False</td><td>False</td></tr></tbody></table></div>
<p>پس:</p>
<blockquote>در <code>or</code> کافی است یکی از شرط‌ها درست باشد.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">16. <code>not</code></h2>
<p><code>not</code> نتیجه Boolean را برعکس می‌کند.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">is_raining = True

print(not is_raining)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">False</div></div>
<p>چون:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True → not → False</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">is_raining = False

print(not is_raining)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">17. یک مدل ذهنی بسیار مهم برای Logical Operators</h2>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">and
└── همه باید True باشند

or
└── حداقل یکی باید True باشد

not
└── نتیجه را برعکس می‌کند</div></div>
<p>یک راه ساده برای حفظ کردن:</p>
<blockquote><strong>AND سخت‌گیر است. OR آسان‌گیر است. NOT برعکس می‌کند.</strong></blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">18. ترکیب Comparison و Logical </h2>
<p>حالا چند مفهومی که یاد گرفته‌ایم را به هم وصل کنیم.</p>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 25
salary = 5000</div></div>
<p>می‌خواهیم بررسی کنیم:</p>
<blockquote>آیا فرد حداقل 18 سال دارد و حقوقش بیشتر از 3000 است؟</blockquote>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = age &gt;= 18 and salary &gt; 3000

print(result)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<p>اینجا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">age &gt;= 18
    ↓
  True

salary &gt; 3000
    ↓
  True

True and True
    ↓
  True</div></div>
<p>این دقیقاً همان نوع منطقی است که در جلسه ۱۰، هنگام یادگیری <code>if</code>، بسیار استفاده خواهیم کرد.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">19. Membership Operators </h2>
<p>حالا می‌رسیم به دو Operator بسیار کاربردی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">in
not in</div></div>
<p>Membership یعنی:</p>
<blockquote>آیا یک مقدار <strong>عضو یک مجموعه یا Sequence</strong> است؟</blockquote>
<p>برای مثال با String:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name = "Python"

print("P" in name)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<p>چون <code>"P"</code> در <code>"Python"</code> وجود دارد.</p>
<h3><code>not in</code></h3>
<p>بررسی می‌کند چیزی وجود <strong>ندارد</strong>:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name = "Python"

print("z" not in name)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<p>چون <code>z</code> داخل <code>"Python"</code> نیست.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">20. Membership با List</h2>
<p>با List هم بسیار کاربردی است.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">colors = ["red", "blue", "green"]

print("blue" in colors)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<p>اما:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print("black" in colors)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">False</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print("black" not in colors)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">21. تفاوت Membership و Comparison</h2>
<p>این دو را قاطی نکن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">"blue" == colors</div></div>
<p>یعنی:</p>
<blockquote>آیا <code>"blue"</code> دقیقاً برابر با کل <code>colors</code> است؟</blockquote>
<p>اما:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">"blue" in colors</div></div>
<p>یعنی:</p>
<blockquote>آیا <code>"blue"</code> یکی از اعضای <code>colors</code> است؟</blockquote>
<p>پس:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">==  → مقایسه برابری
in  → بررسی عضویت</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">22. Identity Operators </h2>
<p>دو Operator دیگر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">is
is not</div></div>
<p>این‌ها برای بررسی <strong>Identity یا هویت یک Object</strong> استفاده می‌شوند.</p>
<p>در سطح Basic مهم‌ترین جایی که با آنها سروکار داریم، بررسی <code>None</code> است.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">value = None

print(value is None)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<h3><code>is not</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">value = 10

print(value is not None)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">23. تفاوت <code>==</code> و <code>is</code> </h2>
<p>این قسمت خیلی مهم است.</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">==  → آیا مقدارها برابرند؟
is  → آیا دو متغیر به همان Object اشاره می‌کنند؟</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">a = [1, 2]
b = [1, 2]

print(a == b)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<p>چون محتویات دو List برابر است.</p>
<p>اما:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(a is b)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">False</div></div>
<p>چون <code>a</code> و <code>b</code> دو List جداگانه هستند.</p>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">a ───────► [1, 2]

b ───────► [1, 2]</div></div>
<p>محتوا یکی است:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">a == b  → True</div></div>
<p>اما Object یکی نیست:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">a is b  → False</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">24. پس چرا برای <code>None</code> از <code>is</code> استفاده می‌کنیم؟</h2>
<p>در Python، روش استاندارد برای بررسی <code>None</code> این است:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">value is None</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">value is not None</div></div>
<p>مثال:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">result = None

if result is None:
    print("No result")</div></div>
<p>در این جلسه هنوز <code>if</code> را کامل یاد نگرفته‌ایم، اما این الگو را ببین و به خاطر بسپار؛ در جلسه ۱۰ کاربردش را کامل خواهیم دید.</p>
<h3>نکته امتحانی </h3>
<p>برای بررسی <code>None</code> ترجیح بده:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">value is None</div></div>
<p>نه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">value == None</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">25. یک اشتباه رایج: <code>is</code> به جای <code>==</code></h2>
<p>این کد را ببین:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 20

print(age is 20)</div></div>
<p>ممکن است رفتارهایی ببینی که باعث شود فکر کنی <code>is</code> برای مقایسه مقدارها مناسب است؛ اما این کار را انجام نده.</p>
<p>برای مقایسه مقدار:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age == 20</div></div>
<p>برای بررسی Identity:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">a is b</div></div>
<p>و برای <code>None</code>:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">value is None</div></div>
<p>این قاعده را به خاطر بسپار:</p>
<blockquote><strong>Value → <code>==</code></strong><br><strong>Identity → <code>is</code></strong></blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">26. یک جمع‌بندی از همه Operatorها</h2>
<div class="table-wrap"><table><thead><tr><th>نوع</th><th>Operatorهای اصلی</th><th>سؤال ذهنی</th></tr></thead><tbody><tr><td>Arithmetic</td><td><code>+ - * / // % **</code></td><td>چه محاسبه‌ای انجام دهم؟</td></tr><tr><td>Assignment</td><td><code>= += -= *= ...</code></td><td>چه مقداری به متغیر بدهم؟</td></tr><tr><td>Comparison</td><td><code>== != &gt; &lt; &gt;= &lt;=</code></td><td>آیا این دو مقدار چه رابطه‌ای دارند؟</td></tr><tr><td>Logical</td><td><code>and or not</code></td><td>چند نتیجه منطقی را چگونه ترکیب کنم؟</td></tr><tr><td>Membership</td><td><code>in</code>, <code>not in</code></td><td>آیا این مقدار عضو مجموعه است؟</td></tr><tr><td>Identity</td><td><code>is</code>, <code>is not</code></td><td>آیا این‌ها همان Object هستند؟</td></tr></tbody></table></div>
<hr class="lesson-divider">
<h2 class="lesson-title">🧠 مدل ذهنی کل جلسه</h2>
<p>تمام Operatorها را این‌طور در ذهن نگه دار:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">                    Operators
                        │
        ┌───────────────┼────────────────┐
        │               │                │
        ▼               ▼                ▼
   Arithmetic       Assignment      Comparison
        │               │                │
   محاسبه         تغییر مقدار       مقایسه مقدار
        │                                │
        └──────────────┬─────────────────┘
                       ▼
                  True / False
                       │
             ┌─────────┴─────────┐
             ▼                   ▼
         Logical             Membership
        and/or/not            in/not in
             │
             ▼
          ترکیب منطق
             
             Identity
             is/is not
                 │
                 ▼
             هویت Object</div></div>
<p>این جلسه در واقع یک پل مهم برای جلسات بعدی است:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Variables
    ↓
Operators
    ↓
True / False
    ↓
Conditions
    ↓
if / elif / else</div></div>

<h1 class="lesson-title section-troubleshoot">اشتباهات رایج</h1>
<h3>اشتباه ۱: استفاده از <code>=</code> برای مقایسه</h3>
<p>اشتباه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 18</div></div>
<p>اگر قصدت این باشد که بپرسی «آیا age برابر 18 است؟»، این کد مقایسه نمی‌کند؛ مقدار <code>18</code> را در <code>age</code> قرار می‌دهد.</p>
<p>مقایسه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age == 18</div></div>
<h3>اشتباه ۲: اشتباه گرفتن <code>/</code> و <code>//</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">10 / 3</div></div>
<p>نتیجه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">3.333...</div></div>
<p>اما:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">10 // 3</div></div>
<p>نتیجه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">3</div></div>
<h3>اشتباه ۳: اشتباه گرفتن <code>%</code> با <code>/</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">10 % 3</div></div>
<p>نتیجه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1</div></div>
<p>چون <code>%</code> <strong>باقیمانده</strong> را می‌دهد.</p>
<h3>اشتباه ۴: استفاده اشتباه از <code>is</code></h3>
<p>برای مقایسه مقدارها:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">a == b</div></div>
<p>برای Identity:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">a is b</div></div>
<p>و برای <code>None</code>:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">value is None</div></div>
<h3>اشتباه ۵: اشتباه در <code>and</code> و <code>or</code></h3>
<p>اگر بگوییم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">A and B</div></div>
<p>هر دو باید درست باشند.</p>
<p>اما:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">A or B</div></div>
<p>کافی است یکی درست باشد.</p>
<hr class="lesson-divider">
<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li><code>Operator</code> عملی را روی داده‌ها انجام می‌دهد.</li><li>Arithmetic برای محاسبات استفاده می‌شود.</li><li><code>/</code> تقسیم معمولی و <code>//</code> تقسیم بدون بخش اعشاری است.</li><li><code>%</code> باقیمانده تقسیم را می‌دهد.</li><li><code>**</code> برای توان است.</li><li><code>=</code> برای Assignment است.</li><li><code>==</code> برای مقایسه برابری است.</li><li>Comparison معمولاً نتیجه <code>True</code> یا <code>False</code> تولید می‌کند.</li><li><code>and</code> یعنی همه شرط‌ها باید درست باشند.</li><li><code>or</code> یعنی حداقل یکی درست باشد.</li><li><code>not</code> نتیجه منطقی را برعکس می‌کند.</li><li><code>in</code> و <code>not in</code> برای Membership هستند.</li><li><code>is</code> و <code>is not</code> برای Identity هستند.</li><li>برای بررسی <code>None</code> از <code>is None</code> و <code>is not None</code> استفاده کن.</li><li>برای مقایسه مقدارها از <code>==</code> استفاده کن، نه <code>is</code>.</li></ul>
<hr class="lesson-divider">
<h2 class="lesson-title">🔄 Recall سریع</h2>
<p>بدون نگاه کردن به درس، به این سؤال‌ها جواب بده:</p>
<ol><li>تفاوت <code>/</code> و <code>//</code> چیست؟</li><li><code>%</code> چه چیزی برمی‌گرداند؟</li><li>تفاوت <code>=</code> و <code>==</code> چیست؟</li><li>نتیجه Comparison چه نوع داده‌ای است؟</li><li>تفاوت <code>and</code> و <code>or</code> چیست؟</li><li><code>in</code> چه چیزی را بررسی می‌کند؟</li><li>تفاوت <code>==</code> و <code>is</code> چیست؟</li><li>چرا برای <code>None</code> از <code>is None</code> استفاده می‌کنیم؟</li></ol>
<p>اگر این ۸ مورد را بتوانی توضیح بدهی، پایه Operatorها را به‌خوبی گرفته‌ای.</p>

<h1 class="lesson-title section-scenario">سناریوی ترکیبی — محاسبه قیمت سفارش</h1>
<p>حالا تمام چیزهایی که امروز یاد گرفتیم را در یک مسئله واقعی استفاده کنیم.</p>
<p>فرض کن یک فروشگاه داریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">price = 120
discount = 20
quantity = 2</div></div>
<p>می‌خواهیم:</p>
<ol><li>قیمت بعد از تخفیف را حساب کنیم.</li><li>قیمت کل دو محصول را محاسبه کنیم.</li><li>بررسی کنیم آیا مبلغ نهایی بیشتر از 150 است.</li><li>بررسی کنیم آیا محصول موردنظر در لیست محصولات وجود دارد.</li></ol>
<h3>مرحله ۱ — محاسبه تخفیف</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">price = 120
discount = 20

final_price = price - discount

print(final_price)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">100</div></div>
<h3>مرحله ۲ — محاسبه قیمت کل</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">quantity = 2

total = final_price * quantity

print(total)</div></div>
<p>خروجی:</p>

<h2 class="lesson-title">🎯 جمع‌بندی جلسه</h2>
<p>در این جلسه یاد گرفتیم که Operatorها ابزار انجام عملیات روی داده‌ها هستند.</p>
<p>مسیر مفهومی جلسه این بود:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Arithmetic
   ↓
محاسبه روی داده‌ها
   ↓
Assignment
   ↓
ذخیره/تغییر نتیجه
   ↓
Comparison
   ↓
True / False
   ↓
Logical
   ↓
ترکیب نتایج منطقی
   ↓
Membership / Identity
   ↓
بررسی عضویت و هویت</div></div>
<p>مهم‌ترین تفاوت‌هایی که باید برای همیشه در ذهنت بماند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">=       → مقداردهی
==      → مقایسه مقدار

/       → تقسیم معمولی
//      → تقسیم صحیح
%       → باقیمانده
**      → توان

and     → همه درست
or      → حداقل یکی درست
not     → برعکس کردن

in      → عضو است؟
not in  → عضو نیست؟

==      → مقدار یکی است؟
is      → Object یکی است؟</div></div>
<p>و مهم‌تر از همه، Operatorها قرار است در جلسات بعدی به ما کمک کنند از <strong>داده‌های ساده</strong> به <strong>تصمیم‌گیری در برنامه</strong> برسیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Variables
     ↓
Operators
     ↓
True / False
     ↓
if / elif / else</div></div>
<p>پس جلسه بعد، یعنی <strong>جلسه ۵ — Input & Output</strong>، یاد می‌گیریم چطور اطلاعات را از کاربر بگیریم، به او خروجی بدهیم و با ترکیب <code>input()</code>، <code>print()</code> و Type Casting برنامه‌های تعاملی ساده بسازیم.</p>`

<h2 class="lesson-title">معرفی جلسه</h2>
<p>تا اینجا برنامه‌های ما بیشتر شبیه این بودند:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 20

<p>یعنی داده را <strong>خودمان داخل برنامه</strong> قرار می‌دادیم.</p>
<p>اما یک برنامه واقعی معمولاً باید بتواند با کاربر ارتباط برقرار کند:</p>

                ↙       ↘

<p>مثلاً برنامه‌ای می‌خواهیم که بپرسد:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">What is your name?</div></div>
