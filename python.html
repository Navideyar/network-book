<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali</div></div>
<p>و برنامه بگوید:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Hello Ali!</div></div>
<p>اینجاست که <code>input()</code> و <code>print()</code> وارد می‌شوند.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">1. Input و Output چیست؟</h2>
<p>در یک برنامه، دو مفهوم بسیار مهم داریم:</p>
<h3>Input</h3>
<p>اطلاعاتی که <strong>وارد برنامه</strong> می‌شود.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">نام
سن
قیمت
تعداد</div></div>
<h3>Output</h3>
<p>اطلاعاتی که <strong>برنامه به کاربر نمایش می‌دهد</strong>.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Hello Ali
Total: 250
Your age is 20</div></div>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">User
 │
 │ Input
 ▼
Program
 │
 │ Processing
 ▼
Output
 │
 ▼
User</div></div>
<p>در Python Basic:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">input()  → دریافت اطلاعات
print()  → نمایش اطلاعات</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">2. <code>print()</code> چیست؟ </h2>
<p>تابع <code>print()</code> برای <strong>نمایش اطلاعات در خروجی</strong> استفاده می‌شود.</p>
<p>ساده‌ترین مثال:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;Hello Python&quot;)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Hello Python</div></div>
<h3>چاپ عدد</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(10)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">10</div></div>
<p>می‌توانیم عبارت ریاضی هم داخل <code>print()</code> قرار دهیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(10 + 5)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">15</div></div>
<p>یعنی Python ابتدا عبارت را محاسبه می‌کند و سپس نتیجه را نمایش می‌دهد.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">3. چاپ Variable</h2>
<p>همان‌طور که در جلسه ۲ یاد گرفتیم، می‌توانیم مقدار یک Variable را چاپ کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name = &quot;Ali&quot;
age = 20

print(name)
print(age)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali
20</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">4. چاپ چند مقدار با <code>print()</code></h2>
<p>می‌توانیم چند مقدار را داخل <code>print()</code> قرار دهیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name = &quot;Ali&quot;
age = 20

print(name, age)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali 20</div></div>
<p>به‌صورت پیش‌فرض، <code>print()</code> بین چند مقدار یک فاصله قرار می‌دهد.</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">print(a, b, c)
       ↓  ↓  ↓
      فاصله بین مقادیر</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;Python&quot;, &quot;is&quot;, &quot;easy&quot;)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Python is easy</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">5. <code>sep</code> چیست؟ </h2>
<p><code>sep</code> مخفف <strong>separator</strong> است؛ یعنی جداکننده.</p>
<p>وقتی چند مقدار را با <code>print()</code> چاپ می‌کنیم، Python به صورت پیش‌فرض بین آن‌ها یک فاصله قرار می‌دهد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;2026&quot;, &quot;09&quot;, &quot;07&quot;)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">2026 09 07</div></div>
<p>اما می‌توانیم جداکننده را تغییر دهیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;2026&quot;, &quot;09&quot;, &quot;07&quot;, sep=&quot;-&quot;)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">2026-09-07</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;Ali&quot;, &quot;Python&quot;, sep=&quot; | &quot;)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali | Python</div></div>
<h3>مدل ذهنی</h3>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">print(A, B, C, sep=&quot;...&quot;)

A ... B ... C</div></div>
<h3>نکته مهم </h3>
<p>اگر <code>sep</code> را مشخص نکنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;A&quot;, &quot;B&quot;, &quot;C&quot;)</div></div>
<p>جداکننده پیش‌فرض:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&quot; &quot;</div></div>
<p>یعنی یک فاصله است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">6. <code>end</code> چیست؟ </h2>
<p>به صورت پیش‌فرض، <code>print()</code> بعد از چاپ اطلاعات به خط بعد می‌رود.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;Hello&quot;)
print(&quot;Python&quot;)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Hello
Python</div></div>
<p>چرا؟</p>
<p>چون <code>end</code> به صورت پیش‌فرض مقدار:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&quot;\n&quot;</div></div>
<p>دارد.</p>
<p>یعنی:</p>
<blockquote>بعد از چاپ، به خط بعد برو.</blockquote>
<h3>تغییر <code>end</code></h3>
<p>می‌توانیم مقدار <code>end</code> را تغییر دهیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;Hello&quot;, end=&quot; &quot;)
print(&quot;Python&quot;)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Hello Python</div></div>
<p>چون بعد از <code>"Hello"</code> به خط بعد نرفتیم؛ فقط یک فاصله چاپ شد.</p>
<p>مثال دیگر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;A&quot;, end=&quot;-&quot;)
print(&quot;B&quot;, end=&quot;-&quot;)
print(&quot;C&quot;)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">A-B-C</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">7. تفاوت <code>sep</code> و <code>end</code></h2>
<p>این دو را با هم اشتباه نکن. </p>
<h3><code>sep</code></h3>
<p>بین <strong>چند مقدار داخل یک <code>print()</code></strong> قرار می‌گیرد.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;A&quot;, &quot;B&quot;, &quot;C&quot;, sep=&quot;-&quot;)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">A-B-C</div></div>
<h3><code>end</code></h3>
<p>در <strong>انتهای یک <code>print()</code></strong> قرار می‌گیرد.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;A&quot;, end=&quot;-&quot;)
print(&quot;B&quot;)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">A-B</div></div>
<p>پس:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">sep → بین مقادیر
end → انتهای print</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">8. <code>input()</code> چیست؟ </h2>
<p>حالا نوبت گرفتن اطلاعات از کاربر است.</p>
<p>برای این کار از:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">input()</div></div>
<p>استفاده می‌کنیم.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name = input()</div></div>
<p>برنامه منتظر می‌ماند تا کاربر چیزی وارد کند.</p>
<p>اگر کاربر بنویسد:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali</div></div>
<p>مقدار <code>"Ali"</code> در متغیر <code>name</code> قرار می‌گیرد.</p>

<h2 class="lesson-title">9. نمایش سؤال با <code>input()</code></h2>
<p>معمولاً می‌خواهیم هنگام دریافت اطلاعات، به کاربر بگوییم چه چیزی وارد کند.</p>

<p>مثلاً کاربر می‌نویسد:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name = input(&quot;What is your name? &quot;)

Hello Ali</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">input()
   ↓
دریافت اطلاعات
   ↓
Variable
   ↓
Processing
   ↓
print()
   ↓
نمایش نتیجه</div></div>

<h2 class="lesson-title">11. نکته بسیار مهم: <code>input()</code> همیشه <code>str</code> برمی‌گرداند </h2>
<p>این یکی از مهم‌ترین نکات جلسه است.</p>
<p>وقتی از:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">input()</div></div>
<p>استفاده می‌کنیم، مقداری که دریافت می‌کنیم به صورت <strong>String</strong> است.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = input(&quot;Enter your age: &quot;)</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">20</div></div>

<p>کاربر وارد می‌کند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">20</div></div>
<p>حالا اگر بنویسیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(age + 5)</div></div>
<p>با خطا مواجه می‌شویم.</p>
<p>چون داریم تلاش می‌کنیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">str + int</div></div>
<p>را انجام دهیم.</p>
<p>در حالی که باید دو مقدار عددی داشته باشیم.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">13. راه‌حل: Type Casting</h2>
<p>در جلسه ۳ یاد گرفتیم که می‌توانیم نوع داده را تبدیل کنیم.</p>
<p>پس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = int(input(&quot;Enter your age: &quot;))</div></div>
<p>حالا اگر کاربر <code>20</code> وارد کند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">input()
   ↓
&quot;20&quot;
   ↓
int()
   ↓
20</div></div>
<p>بنابراین:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(type(age))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&lt;class 'int'&gt;</div></div>
<p>و حالا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(age + 5)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">25</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">14. ترکیب Input + Type Casting + Operator </h2>
<p>اینجا سه جلسه به هم متصل می‌شوند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">جلسه ۲
Variables + Data Types
       ↓
جلسه ۳
Type Casting
       ↓
جلسه ۴
Operators
       ↓
جلسه ۵
Input + Output</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">number = int(input(&quot;Enter a number: &quot;))

result = number * 2

print(result)</div></div>
<p>اگر کاربر وارد کند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">7</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">14</div></div>
<p>اینجا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Input
  ↓
&quot;7&quot;
  ↓
int()
  ↓
7
  ↓
*
  ↓
14
  ↓
print()</div></div>
<p>این الگوی بسیار مهمی برای برنامه‌های ساده Python است.</p>

<p>مثلاً می‌خواهیم برنامه‌ای بنویسیم که دو عدد از کاربر بگیرد و مجموع آن‌ها را نمایش دهد.</p>

print(a + b)</div></div>
<p>اگر کاربر وارد کند:</p>

25</div></div>

<p>این کد:</p>

b = input()

print(a + b)</div></div>
<p>اگر ورودی‌ها:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">5
7</div></div>
<p>باشند، خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">57</div></div>
<p>است.</p>
<p>اما اگر بنویسیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">a = int(input())
b = int(input())

print(a + b)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">12</div></div>
<p>پس همیشه وقتی از کاربر <strong>عدد</strong> می‌خواهیم، نوع ورودی را بررسی کن.</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">عدد صحیح → int(input())
عدد اعشاری → float(input())
متن → input()</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">19. <code>print()</code> با ترکیب چند مقدار</h2>
<p>برای نمایش نتیجه می‌توانیم چند مقدار را به <code>print()</code> بدهیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name = &quot;Ali&quot;
score = 18

print(&quot;Name:&quot;, name, &quot;Score:&quot;, score)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Name: Ali Score: 18</div></div>
<p>و می‌توانیم با <code>sep</code> خروجی را مرتب‌تر کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;Name:&quot;, name, &quot;Score:&quot;, score, sep=&quot; | &quot;)</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Name: | Ali | Score: | 18</div></div>
<p>این خروجی شاید چیزی نباشد که بخواهیم؛ بنابراین <code>sep</code> را باید جایی استفاده کنیم که واقعاً نیاز داریم.</p>
<p>مثلاً برای ساختن تاریخ بسیار مناسب‌تر است:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">day = 7
month = 9
year = 2026

print(year, month, day, sep=&quot;-&quot;)</div></div>

<p>فرض کن می‌خواهیم یک خط را مرحله‌به‌مرحله بسازیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;Python&quot;, end=&quot; &quot;)
print(&quot;is&quot;, end=&quot; &quot;)
print(&quot;fun!&quot;)</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;Python&quot;)
print(&quot;is&quot;)
print(&quot;fun!&quot;)</div></div>

fun!</div></div>

<h2 class="lesson-title">22. خروجی مناسب برای کاربر</h2>
<p>بهتر است خروجی برنامه واضح باشد.</p>
<p>مثلاً این:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 20
print(age)</div></div>
<p>کار می‌کند، اما چندان واضح نیست.</p>
<p>بهتر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;Your age is:&quot;, age)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Your age is: 20</div></div>
<p>در این مرحله هدف ما این است که برنامه را <strong>خوانا و قابل‌فهم</strong> طراحی کنیم.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">🧠 Recall کوتاه</h2>
<p>تا اینجا باید بتوانی این زنجیره را توضیح بدهی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">input()
   ↓
دریافت String
   ↓
Type Casting در صورت نیاز
   ↓
Processing / Operators
   ↓
print()
   ↓
Output</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">number = int(input(&quot;Number: &quot;))
result = number * 3
print(&quot;Result:&quot;, result)</div></div>
<hr class="lesson-divider">
<h1 class="lesson-title section-troubleshoot">خطاهای رایج</h1>
<h3>مشکل ۱ — جمع نشدن دو عدد</h3>
<p>کد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">a = input(&quot;First: &quot;)
b = input(&quot;Second: &quot;)

print(a + b)</div></div>
<p>ورودی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">10
20</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1020</div></div>
<h3>چرا؟</h3>
<p>چون:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">a → &quot;10&quot;
b → &quot;20&quot;</div></div>
<p>هر دو String هستند.</p>
<h3>راه‌حل:</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">a = int(input(&quot;First: &quot;))
b = int(input(&quot;Second: &quot;))

print(a + b)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">30</div></div>
<h3>مشکل ۲ — استفاده از <code>float</code> برای مقدار نامناسب</h3>
<p>اگر بنویسم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = float(input(&quot;Age: &quot;))</div></div>
<p>و کاربر <code>20</code> وارد کند، مقدار:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">20.0</div></div>
<p>می‌شود.</p>
<p>اگر سن را به عنوان عدد صحیح می‌خواهیم، انتخاب مناسب‌تر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = int(input(&quot;Age: &quot;))</div></div>
<h3>مشکل ۳ — فراموش کردن پرانتز <code>print()</code></h3>
<p>در Python 3 باید بنویسیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;Hello&quot;)</div></div>
<p>نه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print &quot;Hello&quot;</div></div>
<p>دومی Syntax صحیح Python 3 نیست.</p>
<hr class="lesson-divider">
<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li><code>input()</code> برای دریافت اطلاعات از کاربر است.</li><li><code>print()</code> برای نمایش اطلاعات است.</li><li>مقدار برگشتی <code>input()</code> به صورت <strong><code>str</code></strong> است.</li><li>برای دریافت عدد صحیح: <code>int(input())</code></li><li>برای دریافت عدد اعشاری: <code>float(input())</code></li><li><code>sep</code> جداکننده بین مقادیر یک <code>print()</code> است.</li><li><code>end</code> مشخص می‌کند بعد از <code>print()</code> چه چیزی قرار بگیرد.</li><li>مقدار پیش‌فرض <code>sep</code> یک فاصله است.</li><li>مقدار پیش‌فرض <code>end</code> برابر <code>"\n"</code> است.</li><li>برای محاسبات روی ورودی عددی، معمولاً باید <strong>Type Casting</strong> انجام دهیم.</li><li><code>input()</code>، Type Casting، Variables و Operators می‌توانند با هم یک برنامه تعاملی بسازند.</li><li><code>"10" + "20"</code> برابر <code>"1020"</code> است، نه <code>30</code>.</li></ul>
<hr class="lesson-divider">
<h2 class="lesson-title">🔄 Recall سریع</h2>
<p>بدون نگاه کردن به درس جواب بده:</p>
<ol><li>تفاوت Input و Output چیست؟</li><li><code>input()</code> چه نوع داده‌ای برمی‌گرداند؟</li><li>برای دریافت عدد صحیح از کاربر چه می‌نویسیم؟</li><li>برای دریافت عدد اعشاری چه می‌نویسیم؟</li><li><code>sep</code> چه کاری انجام می‌دهد؟</li><li><code>end</code> چه کاری انجام می‌دهد؟</li><li>چرا <code>input()</code> برای محاسبات عددی معمولاً نیاز به Type Casting دارد؟</li><li>نتیجه <code>"5" + "3"</code> چیست و چرا؟</li></ol>
<p>اگر توانستی این‌ها را توضیح بدهی، هسته جلسه ۵ را یاد گرفته‌ای.</p>

<h1 class="lesson-title section-scenario">سناریوی ترکیبی — فاکتور ساده فروشگاه</h1>
<p>حالا یک برنامه کوچک‌تر و واقعی‌تر بسازیم.</p>
<p>فرض کن فروشگاه می‌خواهد از کاربر:</p>
<ul><li>نام محصول</li><li>قیمت</li><li>تعداد</li></ul>
<p>را دریافت کند و قیمت کل را نمایش دهد.</p>
<h3>مرحله ۱ — دریافت نام</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">product = input(&quot;Product name: &quot;)</div></div>
<p>نام محصول String است؛ پس نیازی به تبدیل ندارد.</p>
<h3>مرحله ۲ — دریافت قیمت</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">price = float(input(&quot;Price: &quot;))</div></div>
<p>چون قیمت ممکن است اعشاری باشد، از <code>float()</code> استفاده می‌کنیم.</p>
<h3>مرحله ۳ — دریافت تعداد</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">quantity = int(input(&quot;Quantity: &quot;))</div></div>
<p>تعداد را به صورت عدد صحیح می‌گیریم.</p>
<h3>مرحله ۴ — محاسبه</h3>
<p>از Arithmetic Operator استفاده می‌کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">total = price * quantity</div></div>
<h3>مرحله ۵ — نمایش نتیجه</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;Product:&quot;, product)
print(&quot;Total:&quot;, total)</div></div>
<h3>برنامه کامل</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">product = input(&quot;Product name: &quot;)
price = float(input(&quot;Price: &quot;))
quantity = int(input(&quot;Quantity: &quot;))

total = price * quantity

print(&quot;Product:&quot;, product)
print(&quot;Total:&quot;, total)</div></div>
<p>اگر کاربر وارد کند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Product name: Mouse
Price: 15.5
Quantity: 3</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Product: Mouse
Total: 46.5</div></div>
<h3>حالا یک مرحله ترکیبی‌تر</h3>
<p>می‌توانیم خروجی را مرتب‌تر کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">product = input(&quot;Product name: &quot;)
price = float(input(&quot;Price: &quot;))
quantity = int(input(&quot;Quantity: &quot;))

total = price * quantity

print(&quot;Product&quot;, product, &quot;Total&quot;, total, sep=&quot;: &quot;)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Product: Mouse: Total: 46.5</div></div>
<p>این مثال نشان می‌دهد که <code>sep</code> صرفاً یک ابزار مکانیکی نیست؛ باید <strong>در جای مناسب</strong> استفاده شود.</p>
<p>برای خروجی تمیزتر در این سطح می‌توانیم چند <code>print()</code> داشته باشیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;Product:&quot;, product)
print(&quot;Total:&quot;, total)</div></div>
<p>خواناتر است.</p>

<h2 class="lesson-title">6. Slicing — بریدن بخشی از String </h2>

1 → y
2 → توقف</div></div>

<h2 class="lesson-title">29. مدل ذهنی کامل String</h2>
<p>حالا تمام جلسه را به هم وصل کنیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">                 String
                    │
        ┌───────────┼───────────┐
        ↓           ↓           ↓
    Indexing     Slicing      Methods
        │           │           │
     [0] [-1]    [1:4]      upper()
                                lower()
                                strip()
                                replace()
                                find()
                                ...
                    │
                    ↓
                f-string
                    │
                    ↓
             ساخت متن خوانا</div></div>
<p>پس در کار با String معمولاً این مسیر را داریم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">دریافت متن
   ↓
input()
   ↓
تمیز کردن / پردازش
   ↓
String Methods
   ↓
استفاده از Indexing / Slicing
   ↓
ساخت پیام
   ↓
f-string
   ↓
print()</div></div>
<hr class="lesson-divider">
<h1 class="lesson-title section-troubleshoot">Troubleshooting</h1>
<h3>خطای اول: <code>IndexError</code></h3>
<p>کد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">word = &quot;Hi&quot;

print(word[5])</div></div>
<p>مشکل:</p>
<p>Index شماره 5 وجود ندارد.</p>
<h3>خطای دوم: <code>TypeError</code></h3>
<p>کد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">word = &quot;Python&quot;

word[0] = &quot;J&quot;</div></div>
<p>مشکل:</p>
<p>String قابل تغییر مستقیم نیست.</p>
<h3>خطای سوم: اشتباه در <code>input()</code> و عدد</h3>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = input(&quot;Age: &quot;)

print(age + 1)</div></div>
<p>این کد خطا می‌دهد، چون <code>age</code> از نوع <code>str</code> است.</p>
<p>باید:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = int(input(&quot;Age: &quot;))

print(age + 1)</div></div>
<p>باشد.</p>

<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li>String با <code>str</code> نمایش داده می‌شود.</li><li>String را می‌توان با <code>' '</code> یا <code>" "</code> ساخت.</li><li>Index در Python از <code>0</code> شروع می‌شود.</li><li><code>[-1]</code> آخرین کاراکتر را می‌دهد.</li><li>در Slicing، <code>start</code> شامل و <code>end</code> غیرشامل است.</li><li>Stringها در Python immutable هستند.</li><li>متدهایی مانند <code>upper()</code> و <code>lower()</code> نتیجه جدید ایجاد می‌کنند.</li><li><code>strip()</code> فاصله‌های ابتدا و انتها را حذف می‌کند.</li><li><code>find()</code> در صورت پیدا نکردن عبارت، <code>-1</code> برمی‌گرداند.</li><li><code>input()</code> یک String برمی‌گرداند.</li><li>برای ساخت متن همراه با متغیرها، <code>f-string</code> روش خوانا و کاربردی است.</li></ul>

<h2 class="lesson-title">🔄 Recall سریع</h2>
<p>قبل از رفتن سراغ تمرین‌های بیشتر، این‌ها را از خودت بپرس:</p>
<ol><li>String چیست؟</li><li>اولین کاراکتر؟</li><li>آخرین کاراکتر؟</li><li>سه کاراکتر اول؟</li><li>برعکس String؟</li><li>حروف بزرگ؟</li><li>حروف کوچک؟</li><li>حذف فاصله ابتدا و انتها؟</li><li>جایگزینی؟</li><li>ساخت متن با متغیر؟</li></ol>

<p>این سناریو چند مفهوم را کنار هم قرار داد:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">input()
  ↓
String
  ↓
strip()
  ↓
Type Casting برای age

Variables
  ↓
String Method
  ↓
f-string
  ↓
print()</div></div>

<div class="quiz-card"><p>❓ سؤال ۷ : کدام گزینه برنامه را درست اجرا می‌کند؟ <br>هدف برنامه: سن کاربر را دریافت کند و سن سال آینده را نمایش دهد.</p><div class="quiz-options"><button onclick="selectOption(this)">الف) <code>age = input("Age: ")<br>print(age + 1)</code></button><button onclick="selectOption(this)">ب) <code>age = str(input("Age: "))<br>print(age + 1)</code></button><button onclick="selectOption(this)">ج) <code>age = int(input("Age: "))<br>print(age + 1)</code></button><button onclick="selectOption(this)">د) <code>age = float(input("Age: "))<br>print(age + "1")</code></button></div><div class="quiz-answer"><strong>✅ پاسخ: ج</strong><br><code>input()</code> مقدار را به صورت <code>str</code> دریافت می‌کند؛ برای انجام محاسبه عددی باید آن را به <code>int</code> تبدیل کنیم.</div></div>
<h2 class="lesson-title">جمع‌بندی</h2>
<p>در این جلسه از «متن ساده» به «پردازش متن» رسیدیم.</p>
<p>ابتدا یاد گرفتیم String چیست و چگونه به کاراکترهای آن دسترسی پیدا کنیم:</p>

text[-1]</div></div>
<p>بعد یاد گرفتیم بخشی از String را جدا کنیم:</p>

<p>بنابراین زنجیره مهم این جلسه:</p>

f-string

Output</div></div>
<p>در جلسات بعد، همین Stringها را در ساختارهای داده، شرط‌ها، حلقه‌ها، فایل‌ها، Exceptionها و پروژه نهایی بیشتر استفاده خواهیم کرد.</p>`
,
"ch7-1": `<div class="section-header">
    <div class="section-badge">۷</div>
    <div>
        <h1>List در Python</h1>
        <div class="meta">فصل ۷ · بخش ۱ از ۳</div>
    </div>
</div>
<blockquote class="lesson-goal">
<strong class="goal-title">هدف جلسه</strong>
<p>در پایان این جلسه می‌توانی:</p>
<ol>
<li>مفهوم <code>List</code> و کاربرد آن را توضیح بدهی.</li>
<li>یک List بسازی و عناصر مختلف داخل آن قرار بدهی.</li>
<li>با <strong>Indexing</strong> و <strong>Slicing</strong> به عناصر List دسترسی پیدا کنی.</li>
<li>عناصر List را تغییر، اضافه و حذف کنی.</li>
<li>از متدهای مهم List مانند <code>append()</code>، <code>insert()</code>، <code>remove()</code> و <code>pop()</code> استفاده کنی.</li>
<li>طول List و وجود یک مقدار در آن را بررسی کنی.</li>
</ol>
</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">معرفی جلسه</h2>
<p>تا اینجا بیشتر با یک مقدار در هر متغیر کار کرده‌ایم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name = &quot;Ali&quot;
age = 20</div></div>
<p>اما فرض کن می‌خواهیم نام چند دانش‌آموز را نگه داریم.</p>
<p>روش سخت و نامناسب:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">student1 = &quot;Ali&quot;
student2 = &quot;Sara&quot;
student3 = &quot;Reza&quot;
student4 = &quot;Mina&quot;</div></div>
<p>اگر 100 دانش‌آموز داشته باشیم چه؟</p>
<p>اینجاست که <code>List</code> وارد می‌شود:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">students = [&quot;Ali&quot;, &quot;Sara&quot;, &quot;Reza&quot;, &quot;Mina&quot;]</div></div>
<p>حالا به جای چهار متغیر، یک متغیر داریم که چند مقدار را در خود نگه می‌دارد.</p>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">List
 │
 ├── عنصر 0
 ├── عنصر 1
 ├── عنصر 2
 └── عنصر 3</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">students
   │
   ├── 0 → &quot;Ali&quot;
   ├── 1 → &quot;Sara&quot;
   ├── 2 → &quot;Reza&quot;
   └── 3 → &quot;Mina&quot;</div></div>
<p>پس List را می‌توانیم مثل یک <strong>جعبه چندخانه‌ای</strong> تصور کنیم.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">1. List چیست؟ </h2>
<p><code>List</code> یک ساختار داده است که می‌تواند چند مقدار را به صورت مرتب در خود نگه دارد.</p>
<p>برای ساخت List از <code>[]</code> استفاده می‌کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [10, 20, 30, 40]</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = [&quot;Ali&quot;, &quot;Sara&quot;, &quot;Reza&quot;]</div></div>
<p>نوع داده:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = [&quot;Ali&quot;, &quot;Sara&quot;, &quot;Reza&quot;]

print(type(names))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&lt;class 'list'&gt;</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">2. List می‌تواند انواع داده مختلف داشته باشد</h2>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">data = [10, &quot;Ali&quot;, 3.14, True]</div></div>
<p>این List شامل:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">int
str
float
bool</div></div>
<p>است.</p>
<p>حتی می‌توانیم List خالی بسازیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">items = []</div></div>
<p>در این حالت:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(type(items))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&lt;class 'list'&gt;</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">3. List دارای ترتیب است </h2>
<p>عناصر List ترتیب دارند.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">colors = [&quot;red&quot;, &quot;green&quot;, &quot;blue&quot;]</div></div>
<p>ترتیب:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Index      Value
  0        red
  1        green
  2        blue</div></div>
<p>بنابراین ترتیب عناصر اهمیت دارد.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">4. دسترسی به عناصر با Indexing </h2>
<p>درست مثل String، در List هم Index از <code>0</code> شروع می‌شود.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = [&quot;Ali&quot;, &quot;Sara&quot;, &quot;Reza&quot;]</div></div>
<p>پس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(names[0])</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(names[1])</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Sara</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(names[2])</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Reza</div></div>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">List:     Ali     Sara     Reza
Index:     0        1        2</div></div>
<h3>نکته امتحانی </h3>
<p>List و String هر دو از Indexing پشتیبانی می‌کنند و Index آن‌ها از <code>0</code> شروع می‌شود.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">5. Index منفی</h2>
<p>مثل String، List هم Index منفی دارد:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Value:       Ali     Sara     Reza
Positive:     0       1        2
Negative:    -3      -2       -1</div></div>
<p>پس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = [&quot;Ali&quot;, &quot;Sara&quot;, &quot;Reza&quot;]

print(names[-1])</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Reza</div></div>
<p>بنابراین:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">names[0]    # اولین عنصر
names[-1]   # آخرین عنصر</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">6. طول List با <code>len()</code> </h2>
<p>برای فهمیدن تعداد عناصر List از <code>len()</code> استفاده می‌کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = [&quot;Ali&quot;, &quot;Sara&quot;, &quot;Reza&quot;]

print(len(names))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">3</div></div>
<p>توجه کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">len(names)</div></div>
<p>تعداد <strong>عناصر</strong> را می‌دهد، نه آخرین Index را.</p>
<p>در این مثال:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">تعداد عناصر = 3
آخرین Index = 2</div></div>
<p>این یکی از نکات مهم امتحانی است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">7. Slicing در List </h2>
<p>همان Slicing که در String یاد گرفتیم، در List هم وجود دارد.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [10, 20, 30, 40, 50]</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(numbers[1:4])</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">[20, 30, 40]</div></div>
<p>چون:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Index:     0    1    2    3    4
Value:    10   20   30   40   50
                  ↑    ↑    ↑</div></div>
<p>Indexهای <code>1</code>، <code>2</code> و <code>3</code> انتخاب می‌شوند.</p>
<p>همان قانون قبلی:</p>
<blockquote><code>start</code> شامل است، <code>end</code> شامل نیست.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">8. چند نمونه Slicing</h2>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [10, 20, 30, 40, 50]</div></div>
<p>از ابتدا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(numbers[:3])</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">[10, 20, 30]</div></div>
<p>از Index دو تا انتها:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(numbers[2:])</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">[30, 40, 50]</div></div>
<p>برعکس کردن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(numbers[::-1])</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">[50, 40, 30, 20, 10]</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">9. تفاوت مهم String و List</h2>
<p>در جلسه قبل گفتیم String قابل تغییر مستقیم نیست.</p>
<p>اما List <strong>قابل تغییر</strong> است.</p>
<p>به این مثال توجه کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = [&quot;Ali&quot;, &quot;Sara&quot;, &quot;Reza&quot;]

names[1] = &quot;Mina&quot;

print(names)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">['Ali', 'Mina', 'Reza']</div></div>
<p>ما عنصر دوم را تغییر دادیم.</p>
<p>پس:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">String → Immutable
List   → Mutable</div></div>
<p>این تفاوت بسیار مهم است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">10. تغییر چند عنصر</h2>
<p>با Slicing هم می‌توانیم چند عنصر را تغییر دهیم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [10, 20, 30, 40, 50]

numbers[1:3] = [200, 300]

print(numbers)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">[10, 200, 300, 40, 50]</div></div>
<p>در این مرحله لازم نیست وارد حالت‌های پیچیده تغییر Slice شویم؛ همین مفهوم اصلی کافی است:</p>
<blockquote>List را می‌توان بعد از ساخت تغییر داد.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">11. اضافه کردن عنصر با <code>append()</code> </h2>
<p>یکی از مهم‌ترین متدهای List، <code>append()</code> است.</p>
<p><code>append()</code> یک عنصر را به <strong>انتهای List</strong> اضافه می‌کند.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = [&quot;Ali&quot;, &quot;Sara&quot;]

names.append(&quot;Reza&quot;)

print(names)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">['Ali', 'Sara', 'Reza']</div></div>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">قبل:

[Ali, Sara]

append(&quot;Reza&quot;)
      ↓

[Ali, Sara, Reza]</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">12. <code>append()</code> فقط یک عنصر اضافه می‌کند</h2>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [1, 2, 3]

numbers.append(4)</div></div>
<p>نتیجه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">[1, 2, 3, 4]</div></div>
<p>اگر یک List دیگر را با <code>append()</code> اضافه کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [1, 2, 3]

numbers.append([4, 5])

print(numbers)</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">[1, 2, 3, [4, 5]]</div></div>

<p><code>[4, 5]</code> به عنوان <strong>یک عنصر</strong> اضافه شده است.</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">append → یک عنصر</div></div>

<h2 class="lesson-title">13. اضافه کردن در موقعیت مشخص با <code>insert()</code> </h2>
<p>اگر بخواهیم عنصر را در یک Index مشخص قرار دهیم، از <code>insert()</code> استفاده می‌کنیم.</p>
<p>Syntax:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">list.insert(index, value)</div></div>

print(names)</div></div>

Index 0 → Ali

بعد:

Index 0 → Ali
Index 1 → Sara
Index 2 → Reza</div></div>

<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">items = [&quot;A&quot;, &quot;B&quot;]

<p>اما:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">items = [&quot;A&quot;, &quot;B&quot;]

items.insert(1, &quot;C&quot;)</div></div>
<p>نتیجه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">[&quot;A&quot;, &quot;C&quot;, &quot;B&quot;]</div></div>

<p>لازم نیست همه متدهای List را حفظ کنی.</p>

<h1 class="lesson-title section-troubleshoot">Troubleshooting</h1>
<h3>خطای IndexError</h3>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = [&quot;Ali&quot;, &quot;Sara&quot;]

print(names[5])</div></div>
<p>List فقط Indexهای <code>0</code> و <code>1</code> دارد.</p>
<p>بنابراین Index <code>5</code> وجود ندارد.</p>
<h3>اشتباه رایج: اشتباه گرفتن Index با تعداد عناصر</h3>
<p>اگر داشته باشیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [10, 20, 30]</div></div>
<p>تعداد عناصر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">len(numbers)</div></div>
<p>برابر <code>3</code> است.</p>
<p>اما آخرین Index:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">2</div></div>
<p>است.</p>
<p>چون:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Index:
0 → 10
1 → 20
2 → 30</div></div>
<h3>اشتباه رایج: تفاوت <code>remove()</code> و <code>pop()</code></h3>
<p>این دو را قاطی نکن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers.remove(20)</div></div>
<p>یعنی:</p>
<blockquote>مقدار <code>20</code> را پیدا کن و حذف کن.</blockquote>
<p>اما:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers.pop(1)</div></div>
<p>یعنی:</p>
<blockquote>عنصر موجود در Index <code>1</code> را حذف کن و آن را برگردان.</blockquote>
<h3>اشتباه رایج: فکر کردن <code>append()</code> Listها را باز می‌کند</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [1, 2]

numbers.append([3, 4])

print(numbers)</div></div>
<p>نتیجه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">[1, 2, [3, 4]]</div></div>
<p>یعنی <code>[3, 4]</code> یک عنصر محسوب شده است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li><code>List</code> برای نگهداری چند مقدار در یک متغیر استفاده می‌شود.</li><li>List با <code>[]</code> ساخته می‌شود.</li><li>Index از <code>0</code> شروع می‌شود.</li><li><code>[-1]</code> آخرین عنصر را برمی‌گرداند.</li><li><code>len()</code> تعداد عناصر را برمی‌گرداند.</li><li>List قابل تغییر است.</li><li><code>append()</code> به انتهای List اضافه می‌کند.</li><li><code>insert()</code> در موقعیت مشخص اضافه می‌کند.</li><li><code>remove()</code> بر اساس مقدار حذف می‌کند.</li><li><code>pop()</code> بر اساس Index حذف می‌کند و عنصر حذف‌شده را برمی‌گرداند.</li><li><code>in</code> وجود یک مقدار را بررسی می‌کند.</li><li><code>sort()</code> مرتب می‌کند.</li><li><code>reverse()</code> ترتیب فعلی را برعکس می‌کند.</li></ul>
<hr class="lesson-divider">
<h2 class="lesson-title">🔄 Recall سریع</h2>
<p>بدون نگاه کردن به درسنامه سعی کن این‌ها را بگویی:</p>
<ol><li>ساخت List: <code>items = [1, 2, 3]</code></li><li>اولین عنصر: <code>items[0]</code></li><li>آخرین عنصر: <code>items[-1]</code></li><li>تعداد عناصر: <code>len(items)</code></li><li>اضافه کردن به انتها: <code>items.append(4)</code></li><li>اضافه کردن در Index مشخص: <code>items.insert(1, 4)</code></li><li>حذف مقدار: <code>items.remove(4)</code></li><li>حذف با Index: <code>items.pop(1)</code></li><li>بررسی وجود: <code>4 in items</code></li><li>مرتب کردن: <code>items.sort()</code></li></ol>
<p>اگر بتوانی همه این‌ها را توضیح بدهی، پایه List را به‌خوبی یاد گرفته‌ای.</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">             چند مقدار
                 │
       ┌─────────┼─────────┐
       ↓         ↓         ↓
     List      Tuple      Set
       │         │         │
   قابل تغییر   ثابت    بدون تکرار
   مرتب         مرتب    ترتیب قابل اتکا نیست</div></div>
<p>و در کنار این‌ها:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Unpacking
   ↓
چند مقدار
   ↓
چند متغیر</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">بخش اول — Tuple</h2>
<h2 class="lesson-title">1. Tuple چیست؟ </h2>
<p><code>Tuple</code> شبیه <code>List</code> است، اما یک تفاوت بسیار مهم دارد:</p>
<blockquote>Tuple بعد از ساخته شدن قابل تغییر نیست.</blockquote>
<p>Tuple معمولاً با <code>()</code> ساخته می‌شود:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">colors = ("red", "green", "blue")</div></div>
<p>نوع داده:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(type(colors))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&lt;class 'tuple'&gt;</div></div>
<p>پس:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">List  → []
Tuple → ()</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">2. Tuple هم ترتیب دارد</h2>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = (10, 20, 30, 40)</div></div>
<p>مانند List، عناصر دارای Index هستند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Value:    10    20    30    40
Index:     0     1     2     3</div></div>
<p>بنابراین:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(numbers[0])
print(numbers[2])</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">10
30</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">3. Index منفی در Tuple</h2>
<p>Tuple هم از Index منفی پشتیبانی می‌کند:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = (10, 20, 30, 40)

print(numbers[-1])</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">40</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">numbers[0]  → اولین عنصر
numbers[-1] → آخرین عنصر</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">4. Slicing در Tuple</h2>
<p>Tuple مانند List از Slicing نیز پشتیبانی می‌کند.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = (10, 20, 30, 40, 50)

print(numbers[1:4])</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">(20, 30, 40)</div></div>
<p>همان قانون جلسه قبل برقرار است:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">start → شامل
end   → غیرشامل</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(numbers[:3])</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">(10, 20, 30)</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(numbers[2:])</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">(30, 40, 50)</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">5. تفاوت اصلی Tuple و List </h2>
<p>به این دو کد دقت کن.</p>
<p>List:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [10, 20, 30]

numbers[0] = 100

print(numbers)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">[100, 20, 30]</div></div>
<p>اما Tuple:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = (10, 20, 30)

numbers[0] = 100</div></div>
<p>این کد خطا ایجاد می‌کند.</p>
<p>چون Tuple قابل تغییر نیست.</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">List
  ↓
Mutable
  ↓
قابل تغییر

Tuple
  ↓
Immutable
  ↓
غیرقابل تغییر</div></div>
<h3>نکته امتحانی </h3>
<p>اگر سؤال پرسید:</p>
<blockquote>کدام ساختار برای داده‌های مرتب و غیرقابل تغییر مناسب است؟</blockquote>
<p>پاسخ معمولاً:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Tuple</div></div>
<p>است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">6. چرا اصلاً Tuple داشته باشیم؟</h2>
<p>فرض کن مشخصات یک موقعیت جغرافیایی را داریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">location = (35.7, 51.4)</div></div>
<p>یا اطلاعات یک رنگ:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">color = ("red", 255, 0, 0)</div></div>
<p>اگر این اطلاعات نباید در طول برنامه تغییر کنند، Tuple انتخاب مناسبی است.</p>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Tuple
┌───────────────┐
│ داده‌های ثابت │
└───────────────┘</div></div>
<p>در Python Basic لازم نیست برای هر موقعیت پیچیده دنبال Tuple باشی؛ فقط باید این اصل را خوب بفهمی:</p>
<blockquote>وقتی یک مجموعه مرتب از داده‌ها داریم که نمی‌خواهیم تغییر کند، Tuple می‌تواند انتخاب مناسبی باشد.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">7. Tuple تک‌عضوی</h2>
<p>یک نکته مهم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = (10)</div></div>
<p>این Tuple نیست.</p>
<p>نوع آن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(type(numbers))</div></div>
<p>برابر با:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&lt;class 'int'&gt;</div></div>
<p>برای ساخت Tuple تک‌عضوی باید <strong>ویرگول</strong> داشته باشیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = (10,)</div></div>
<p>حالا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(type(numbers))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&lt;class 'tuple'&gt;</div></div>
<h3>نکته امتحانی </h3>
<p>این دو با هم فرق دارند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">(10)    # int
(10,)   # tuple</div></div>
<p>در Tuple تک‌عضوی، ویرگول مهم است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">8. متدهای مهم Tuple</h2>
<p>چون Tuple قابل تغییر نیست، متدهای تغییر‌دهنده List مثل:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">append()
remove()
pop()</div></div>
<p>را ندارد.</p>
<p>اما می‌توانیم اطلاعات آن را بررسی کنیم.</p>
<h3><code>count()</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = (10, 20, 10, 30, 10)

print(numbers.count(10))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">3</div></div>
<h3><code>index()</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = (10, 20, 30)

print(numbers.index(20))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1</div></div>
<p>در Basic دانستن همین دو متد برای Tuple کافی است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">بخش دوم — Set</h2>
<h2 class="lesson-title">9. Set چیست؟ </h2>
<p>حالا به ساختار متفاوتی می‌رسیم.</p>
<p><code>Set</code> مجموعه‌ای از مقادیر <strong>بدون تکرار</strong> است.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = {10, 20, 30}</div></div>
<p>نوع:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(type(numbers))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&lt;class 'set'&gt;</div></div>
<p>مهم‌ترین ویژگی Set:</p>
<blockquote>هر مقدار فقط یک بار در Set نگهداری می‌شود.</blockquote>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = {10, 20, 10, 30, 20}

print(numbers)</div></div>
<p>خروجی شامل هر مقدار فقط یک بار خواهد بود، مثلاً:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">{10, 20, 30}</div></div>
<p>ترتیب نمایش Set را نباید مبنای برنامه قرار دهیم.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">10. کاربرد اصلی Set</h2>
<p>فرض کن لیستی از کدهای محصول داریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">codes = ["A", "B", "A", "C", "B", "A"]</div></div>
<p>اگر بخواهیم فقط مقادیر یکتا را داشته باشیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">unique_codes = set(codes)

print(unique_codes)</div></div>
<p>نتیجه شامل:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">A
B
C</div></div>
<p>خواهد بود.</p>
<p>پس یک کاربرد بسیار مهم Set:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">داده‌های تکراری
      ↓
     Set
      ↓
داده‌های یکتا</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">11. Set و Indexing</h2>
<p>اینجا یکی از تفاوت‌های مهم با List و Tuple را داریم.</p>
<p>در List:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers[0]</div></div>
<p>ممکن است.</p>
<p>در Tuple:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers[0]</div></div>
<p>ممکن است.</p>
<p>اما Set <strong>Indexing ندارد</strong>.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = {10, 20, 30}

print(numbers[0])</div></div>
<p>خطا ایجاد می‌کند.</p>
<p>چون Set ساختاری نیست که بتوانیم بگوییم:</p>
<blockquote>عنصر Index صفر.</blockquote>
<h3>نکته امتحانی </h3>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">List  → Index دارد
Tuple → Index دارد
Set   → Index ندارد</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">12. ساخت Set خالی</h2>
<p>این نکته بسیار مهم است:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">items = {}</div></div>
<p>این یک Set خالی نیست؛ یک Dictionary خالی است.</p>
<p>برای ساخت Set خالی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">items = set()</div></div>
<p>حالا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(type(items))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">&lt;class 'set'&gt;</div></div>
<h3>نکته امتحانی</h3>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">{}   → Dictionary خالی
set() → Set خالی</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">13. اضافه کردن با <code>add()</code> </h2>
<p>برای اضافه کردن یک مقدار به Set از <code>add()</code> استفاده می‌کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = {10, 20}

numbers.add(30)

print(numbers)</div></div>
<p>حالا Set شامل <code>10</code>، <code>20</code> و <code>30</code> است.</p>
<p>اگر مقداری که اضافه می‌کنیم از قبل وجود داشته باشد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers.add(20)</div></div>
<p>مقدار تکراری ایجاد نمی‌شود.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">14. حذف از Set</h2>
<p>برای حذف یک مقدار مشخص می‌توانیم از <code>remove()</code> استفاده کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = {10, 20, 30}

numbers.remove(20)

print(numbers)</div></div>
<p>حالا <code>20</code> حذف شده است.</p>
<p>اما اگر مقدار وجود نداشته باشد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers.remove(50)</div></div>
<p>خطا ایجاد می‌شود.</p>
<p>یک روش دیگر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers.discard(50)</div></div>
<p><code>discard()</code> اگر مقدار وجود نداشته باشد، خطا نمی‌دهد.</p>
<p>در Python Basic، مهم‌تر از حفظ جزئیات این است که بدانیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">remove()   → حذف مقدار، نبودن مقدار می‌تواند خطا بدهد
discard()  → حذف مقدار، نبودن مقدار خطا نمی‌دهد</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">15. بررسی وجود با <code>in</code></h2>
<p>مثل List، در Set هم می‌توانیم از <code>in</code> استفاده کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = {10, 20, 30}

print(20 in numbers)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(50 in numbers)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">False</div></div>
<p>این یکی از کاربردهای مهم Set است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">16. تعداد عناصر Set</h2>
<p>با <code>len()</code> می‌توانیم تعداد عناصر را به دست آوریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = {10, 20, 30}

print(len(numbers))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">3</div></div>
<p>اگر مقدار تکراری داشته باشیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = {10, 20, 10, 30}

print(len(numbers))</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">3</div></div>
<p>چون <code>10</code> فقط یک بار نگهداری می‌شود.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">17. عملیات ساده Set</h2>
<p>Set علاوه بر نگهداری داده‌های یکتا، برای کار با مجموعه‌ها هم کاربرد دارد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">a = {1, 2, 3}
b = {3, 4, 5}</div></div>
<h3>اشتراک — Intersection</h3>
<p>عناصر مشترک:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(a & b)</div></div>
<p>نتیجه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">{3}</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">a = {1, 2, 3}
b = {3, 4, 5}

        ↓

مشترک = {3}</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">18. اجتماع — Union</h2>
<p>اگر بخواهیم همه عناصر دو Set را داشته باشیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(a | b)</div></div>
<p>نتیجه شامل:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">{1, 2, 3, 4, 5}</div></div>
<p>مقادیر تکراری فقط یک بار قرار می‌گیرند.</p>
<p>در این سطح همین دو عمل اصلی کافی هستند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">& → اشتراک
| → اجتماع</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">19. List، Tuple و Set در کنار هم </h2>
<p>حالا مهم‌ترین بخش مفهومی جلسه را ببینیم.</p>
<div class="table-wrap"><table><thead><tr><th>ویژگی</th><th>List</th><th>Tuple</th><th>Set</th></tr></thead><tbody><tr><td>Syntax</td><td><code>[]</code></td><td><code>()</code></td><td><code>{}</code></td></tr><tr><td>ترتیب</td><td>دارد</td><td>دارد</td><td>قابل اتکا نیست</td></tr><tr><td>Indexing</td><td>دارد</td><td>دارد</td><td>ندارد</td></tr><tr><td>تغییرپذیر</td><td>بله</td><td>خیر</td><td>بله</td></tr><tr><td>مقدار تکراری</td><td>بله</td><td>بله</td><td>خیر</td></tr><tr><td>کاربرد اصلی</td><td>داده‌های قابل تغییر</td><td>داده‌های ثابت</td><td>داده‌های یکتا</td></tr></tbody></table></div>
<h3>انتخاب سریع</h3>
<p>اگر پرسیدی:</p>
<p><strong>«داده‌ها ممکن است تغییر کنند؟»</strong></p>
<p>→ <code>List</code></p>
<p><strong>«داده‌ها مرتب هستند ولی نباید تغییر کنند؟»</strong></p>
<p>→ <code>Tuple</code></p>
<p><strong>«تکراری بودن داده‌ها برایم مهم نیست و فقط مقادیر یکتا را می‌خواهم؟»</strong></p>
<p>→ <code>Set</code></p>
<hr class="lesson-divider">
<h2 class="lesson-title">20. یک مثال واقعی برای انتخاب ساختار</h2>
<p>فرض کن اطلاعات زیر را داریم.</p>
<h3>لیست خرید</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">shopping = ["milk", "bread", "egg"]</div></div>
<p>چون ممکن است کالا اضافه یا حذف شود:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">List</div></div>
<p>انتخاب مناسبی است.</p>
<h3>مختصات ثابت</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">location = (35.7, 51.4)</div></div>
<p>اگر قرار نیست تغییر کند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Tuple</div></div>
<p>انتخاب مناسبی است.</p>
<h3>کاربران ثبت‌نام‌شده</h3>
<p>اگر فقط شناسه‌های یکتا برایمان مهم باشند:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">user_ids = {101, 102, 103}</div></div>
<p>پس:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">List  → مجموعه قابل تغییر و مرتب
Tuple → مجموعه مرتب و ثابت
Set   → مجموعه یکتا</div></div>

<h2 class="lesson-title">بخش سوم — Unpacking</h2>
<h2 class="lesson-title">21. Unpacking چیست؟ </h2>
<p>فرض کن یک Tuple داریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">person = ("Ali", 20, "Tehran")</div></div>
<p>می‌توانیم عناصر آن را مستقیماً داخل چند متغیر قرار دهیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name, age, city = person</div></div>
<p>حالا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(name)
print(age)
print(city)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali
20
Tehran</div></div>
<p>این کار را <strong>Unpacking</strong> می‌گوییم.</p>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">("Ali", 20, "Tehran")
        ↓
       Unpack
        ↓
name   age   city</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">22. شرط مهم Unpacking</h2>
<p>تعداد متغیرها باید با تعداد مقادیر هماهنگ باشد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">person = ("Ali", 20, "Tehran")

name, age, city = person</div></div>
<p>سه مقدار داریم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali
20
Tehran</div></div>
<p>و سه متغیر:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">name
age
city</div></div>
<p>پس درست است.</p>
<p>اما:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name, age = person</div></div>
<p>خطا ایجاد می‌کند، چون تعداد متغیرها و مقادیر برابر نیست.</p>
<h3>نکته امتحانی </h3>
<p>در Unpacking معمولی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">تعداد متغیرها = تعداد مقادیر</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [10, 20, 30]

a, b, c = numbers

print(a)
print(b)
print(c)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">10
20
30</div></div>
<p>پس مفهوم اصلی این است:</p>
<blockquote>چند مقدار را هم‌زمان بین چند متغیر توزیع کنیم.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">24. Unpacking در ورودی‌های چندگانه</h2>
<p>فرض کن کاربر سه مقدار وارد می‌کند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali 20 Tehran</div></div>
<p>می‌توانیم آن را با <code>split()</code> به چند بخش تقسیم کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">data = input("Enter name age city: ").split()</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">["Ali", "20", "Tehran"]</div></div>
<p>بعد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name, age, city = data</div></div>
<p>حالا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(name)
print(age)
print(city)</div></div>
<p>نکته: مقدارهای حاصل از <code>input()</code> همچنان String هستند.</p>
<p>اگر <code>age</code> را برای محاسبه بخواهیم، باید تبدیلش کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = int(age)</div></div>
<p>این مثال ترکیبی از مباحث قبلی و جلسه امروز است.</p>

<h2 class="lesson-title">25. Unpacking با <code>*</code></h2>
<p>یک حالت کاربردی دیگر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [10, 20, 30, 40]

first, *rest = numbers

print(first)
print(rest)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">10
[20, 30, 40]</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">first → اولین مقدار
rest  → بقیه مقادیر به صورت List</div></div>
<p>در Python Basic آشنایی با این حالت کافی است؛ نیازی نیست وارد حالت‌های پیچیده Unpacking شویم.</p>
<hr class="lesson-divider">
<h1 class="lesson-title section-troubleshoot">Troubleshooting</h1>
<h3>1. اشتباه گرفتن Tuple با List</h3>
<p>این:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [10, 20, 30]</div></div>
<p>List است.</p>
<p>این:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = (10, 20, 30)</div></div>
<p>Tuple است.</p>
<p>تفاوت اصلی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">List  → قابل تغییر
Tuple → غیرقابل تغییر</div></div>
<h3>2. فراموش کردن ویرگول در Tuple تک‌عضوی</h3>
<p>اشتباه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">x = (10)</div></div>
<p>این <code>int</code> است.</p>
<p>درست:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">x = (10,)</div></div>
<p>این Tuple است.</p>
<h3>3. استفاده از <code>{}</code> برای Set خالی</h3>
<p>اشتباه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">items = {}</div></div>
<p>این Dictionary خالی است.</p>
<p>درست:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">items = set()</div></div>
<h3>4. استفاده از Indexing برای Set</h3>
<p>این کار اشتباه است:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = {10, 20, 30}

print(numbers[0])</div></div>
<p>Set دارای Index نیست.</p>
<p>اگر فقط می‌خواهی بررسی کنی مقداری وجود دارد یا نه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(20 in numbers)</div></div>
<h3>5. اشتباه در Unpacking</h3>
<p>اگر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">data = ("Ali", 20, "Tehran")</div></div>
<p>باید سه متغیر داشته باشیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">name, age, city = data</div></div>
<p>نه دو متغیر و نه چهار متغیر.</p>
<hr class="lesson-divider">
<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li><code>Tuple</code> با <code>()</code> ساخته می‌شود.</li><li>Tuple مانند List دارای ترتیب و Index است.</li><li>Tuple قابل تغییر نیست.</li><li>Tuple تک‌عضوی به ویرگول نیاز دارد: <code>(10,)</code></li><li><code>Set</code> با <code>{}</code> برای مجموعه دارای مقدار ساخته می‌شود.</li><li>Set مقدار تکراری نگه نمی‌دارد.</li><li>Set Indexing ندارد.</li><li>Set خالی را با <code>set()</code> می‌سازیم.</li><li><code>add()</code> برای اضافه کردن به Set استفاده می‌شود.</li><li><code>in</code> برای بررسی وجود مقدار در Set بسیار کاربردی است.</li><li><code>&</code> اشتراک دو Set را مشخص می‌کند.</li><li><code>|</code> اجتماع دو Set را مشخص می‌کند.</li><li>Unpacking چند مقدار را بین چند متغیر توزیع می‌کند.</li><li>در Unpacking معمولی تعداد متغیرها باید با تعداد مقادیر برابر باشد.</li></ul>
<hr class="lesson-divider">
<h2 class="lesson-title">🔄 Recall سریع</h2>
<p>بدون نگاه کردن به درسنامه سعی کن این‌ها را بگویی:</p>
<ol><li>List چیست؟ → مجموعه مرتب و قابل تغییر</li><li>Tuple چیست؟ → مجموعه مرتب و غیرقابل تغییر</li><li>Set چیست؟ → مجموعه بدون مقدار تکراری</li><li>اولین عنصر Tuple؟ → <code>data[0]</code></li><li>آخرین عنصر؟ → <code>data[-1]</code></li><li>ساخت Set خالی؟ → <code>set()</code></li><li>اضافه کردن به Set؟ → <code>data.add(value)</code></li><li>بررسی وجود؟ → <code>value in data</code></li><li>Unpacking؟ → <code>a, b, c = data</code></li></ol>
<p>اگر بتوانی همه این‌ها را توضیح بدهی، پایه این جلسه را به‌خوبی یاد گرفته‌ای.</p>

<h1 class="lesson-title section-scenario">سناریوی ترکیبی — ثبت کاربران یکتا </h1>
<p>فرض کن یک برنامه ساده داریم که شناسه چند کاربر را دریافت می‌کند.</p>
<p>ممکن است یک کاربر چند بار شناسه خودش را وارد کند.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">101
102
101
103
102</div></div>
<p>ما نمی‌خواهیم شناسه تکراری داشته باشیم.</p>
<h3>مرحله ۱ — دریافت شناسه‌ها</h3>
<p>در سطح فعلی می‌توانیم داده‌ها را به صورت یک List در نظر بگیریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">user_ids = [101, 102, 101, 103, 102]</div></div>
<h3>مرحله ۲ — حذف تکراری‌ها</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">unique_ids = set(user_ids)</div></div>
<p>حالا فقط شناسه‌های یکتا باقی می‌مانند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">101
102
103</div></div>
<h3>مرحله ۳ — بررسی وجود یک کاربر</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(102 in unique_ids)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<h3>مرحله ۴ — تبدیل دوباره به List در صورت نیاز</h3>
<p>اگر بعداً برای ادامه برنامه به List نیاز داشته باشیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">unique_ids = list(unique_ids)</div></div>
<p>حالا دوباره یک List داریم.</p>
<p>برنامه کامل:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">user_ids = [101, 102, 101, 103, 102]

unique_ids = set(user_ids)

print(f"Unique IDs: {unique_ids}")
print(f"Number of users: {len(unique_ids)}")

search_id = 102

print(f"User exists: {search_id in unique_ids}")</div></div>
<p>این سناریو یک کاربرد واقعی و مهم Set را نشان می‌دهد:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">داده خام
   ↓
List
   ↓
تکراری‌ها
   ↓
Set
   ↓
داده‌های یکتا
   ↓
in / len</div></div>

<h2 class="lesson-title">جمع‌بندی</h2>
<p>حالا سه ساختار مهم را کنار هم داریم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">             چند مقدار
                 │
       ┌─────────┼─────────┐
       ↓         ↓         ↓
     List      Tuple      Set
       │         │         │
    Mutable   Immutable   Unique
       │         │         │
    Index      Index      No Index</div></div>
<p>انتخاب ساختار داده باید بر اساس نیاز برنامه باشد.</p>
<p>اگر داده‌ها ممکن است تغییر کنند:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">items = [1, 2, 3]</div></div>
<p>اگر داده‌ها مرتب و ثابت هستند:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">items = (1, 2, 3)</div></div>
<p>اگر داده‌های یکتا می‌خواهیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">items = {1, 2, 3}</div></div>
<p>و اگر چند مقدار داریم و می‌خواهیم آن‌ها را مستقیماً در چند متغیر قرار دهیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">a, b, c = items</div></div>
<p>که همان <strong>Unpacking</strong> است.</p>
<p>در جلسه بعد سراغ <strong>Dictionary</strong> می‌رویم؛ جایی که به جای دسترسی صرفاً با Index، داده‌ها را با مفهوم <strong>Key → Value</strong> مدیریت می‌کنیم. این تغییر، مدل ذهنی مهمی برای کار با داده‌های ساختاریافته ایجاد می‌کند.</p>`

<hr class="lesson-divider">
<h2 class="lesson-title">1. معرفی جلسه</h2>
<p>تا اینجا سه ساختار مهم را یاد گرفته‌ایم:</p>
<ul><li><code>List</code> → اطلاعات را به ترتیب نگه می‌دارد.</li><li><code>Tuple</code> → شبیه List است، ولی قابل تغییر نیست.</li><li><code>Set</code> → اطلاعات یکتا را نگه می‌دارد.</li></ul>
<p>اما یک سؤال مهم:</p>
<p>فرض کن اطلاعات یک دانشجو را داریم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">نام: Ali
سن: 20
رشته: Computer</div></div>
<p>آیا منطقی است برای پیدا کردن نام، از شماره‌ی <code>0</code> استفاده کنیم؟</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">student[0]</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">student["name"]</div></div>
<p>اینجاست که <strong>Dictionary</strong> وارد می‌شود.</p>
<h3>مدل ذهنی Dictionary</h3>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Dictionary

    Key          Value
     ↓             ↓
   "name"       "Ali"
   "age"          20
   "major"   "Computer"</div></div>
<p>یعنی به‌جای اینکه اطلاعات را با <strong>شماره/index</strong> پیدا کنیم، با یک <strong>کلید/key</strong> پیدا می‌کنیم.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">2. Dictionary چیست؟ </h2>
<p><code>Dictionary</code> یا <code>dict</code> ساختاری برای نگهداری اطلاعات به شکل:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Key → Value</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">student = {
