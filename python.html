<p>در اینجا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">"name"  → "Ali"
"age"   → 20
"major" → "Computer"</div></div>
<p>هر <code>Key</code> یک <code>Value</code> مربوط به خودش دارد.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">3. ساخت Dictionary </h2>
<p>ساده‌ترین روش استفاده از <code>{}</code> است:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">student = {
    "name": "Ali",
    "age": 20,
    "score": 18.5
}</div></div>
<p>می‌توانیم انواع داده مختلفی در Value داشته باشیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">person = {
    "name": "Sara",
    "age": 21,
    "is_student": True
}</div></div>
<p>حتی Value می‌تواند یک List باشد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">student = {
    "name": "Ali",
    "scores": [18, 20, 17]
}</div></div>
<p>و بعداً می‌بینیم که حتی می‌تواند یک Dictionary دیگر باشد.</p>
<h3>Dictionary خالی</h3>
<p>می‌توانیم یک Dictionary خالی بسازیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">data = {}</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">data = dict()</div></div>
<p>هر دو یک Dictionary خالی ایجاد می‌کنند.</p>

<h2 class="lesson-title">4. دسترسی به مقدارها </h2>
<p>برای دسترسی به یک مقدار، Key را داخل <code>[]</code> می‌نویسیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">student = {

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali
20</div></div>

<p>در List می‌گفتیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers[0]</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">student["name"]</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">List       → Index
Dictionary → Key</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">5. اگر Key وجود نداشته باشد چه می‌شود؟ </h2>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">student = {
    "name": "Ali",

print(student["phone"])</div></div>

<h2 class="lesson-title">6. استفاده از get() </h2>
<p>برای دسترسی امن‌تر می‌توانیم از <code>get()</code> استفاده کنیم:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(student.get("phone"))</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">None</div></div>

<h3>مقایسه</h3>
<div class="table-wrap"><table><thead><tr><th>روش</th><th>اگر Key وجود داشته باشد</th><th>اگر وجود نداشته باشد</th></tr></thead><tbody><tr><td><code>d[key]</code></td><td>Value</td><td><code>KeyError</code></td></tr><tr><td><code>d.get(key)</code></td><td>Value</td><td><code>None</code></td></tr><tr><td><code>d.get(key, default)</code></td><td>Value</td><td>مقدار پیش‌فرض</td></tr></tbody></table></div>

<h2 class="lesson-title">7. اضافه کردن مقدار جدید </h2>

<blockquote>اگر <code>city</code> وجود ندارد، آن را اضافه کن.</blockquote>

<h2 class="lesson-title">8. تغییر مقدار موجود </h2>
<p>اگر Key از قبل وجود داشته باشد، همان دستور مقدار قبلی را تغییر می‌دهد:</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">dictionary[key] = value</div></div>
<p>اگر Key:</p>
<ul><li>وجود نداشته باشد → <strong>اضافه می‌شود</strong></li><li>وجود داشته باشد → <strong>مقدار آن تغییر می‌کند</strong></li></ul>
<p>این نکته بسیار مهم است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">9. Key تکراری چه می‌شود؟ </h2>
<p>در یک Dictionary نمی‌توانیم چند مقدار مستقل با یک Key داشته باشیم.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">student = {

    "name": "Sara"
}</div></div>
<p>در نهایت:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(student)</div></div>
<p>داریم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">{'name': 'Sara'}</div></div>
<p>مقدار آخر جای مقدار قبلی را می‌گیرد.</p>
<h3>نکته امتحانی </h3>
<p>در Dictionary، <strong>Keyها باید یکتا باشند.</strong></p>
<hr class="lesson-divider">
<h2 class="lesson-title">10. حذف اطلاعات </h2>
<p>برای حذف یک Key و Value می‌توانیم از <code>del</code> استفاده کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">student = {
    "name": "Ali",
    "age": 20,
    "city": "Tehran"
}

del student["city"]

print(student)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">{'name': 'Ali', 'age': 20}</div></div>

<h2 class="lesson-title">11. حذف با pop() </h2>
<p>روش دیگری برای حذف، <code>pop()</code> است:</p>

}

age = student.pop("age")

print(age)
print(student)</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">20
{'name': 'Ali'}</div></div>

}

print(student)</div></div>

<p>می‌توانیم تعداد Keyها را با <code>len()</code> به دست بیاوریم:</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True
False</div></div>

print("name" in student)</div></div>

<h2 class="lesson-title">15. keys()، values() و items() </h2>
<p>گاهی می‌خواهیم بخش‌های مختلف Dictionary را دریافت کنیم.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">keys()
values()
items()</div></div>
<h3>keys()</h3>
<p>کلیدها را می‌دهد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">student = {
    "name": "Ali",
    "age": 20
}

print(student.keys())</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">dict_keys(['name', 'age'])</div></div>
<h3>values()</h3>
<p>مقدارها را می‌دهد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(student.values())</div></div>

<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">keys()    → فقط Keyها
values()  → فقط Valueها
items()   → Key + Value</div></div>

<p>اگر بخواهیم چند مقدار را هم‌زمان اضافه یا تغییر دهیم، <code>update()</code> کاربردی است:</p>

<h2 class="lesson-title">18. Nested Dictionary </h2>
<p>حالا می‌رسیم به یکی از مهم‌ترین کاربردهای Dictionary.</p>
<p>گاهی Value خودش یک Dictionary است.</p>

<h2 class="lesson-title">19. Nested Data Structures </h2>
<p>Nested یعنی یک ساختار داده داخل ساختار داده دیگر قرار گرفته باشد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">student = {
    "name": "Ali",
    "scores": [18, 20, 19]
}</div></div>
<p>اینجا یک List داخل Dictionary داریم.</p>
<p>یا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">students = [
    {"name": "Ali", "age": 20},
    {"name": "Sara", "age": 21}
]</div></div>
<p>اینجا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">List
│
├── Dictionary
│     ├── name
│     └── age
│
└── Dictionary
      ├── name
      └── age</div></div>
<p>این ساختار در برنامه‌های واقعی بسیار رایج است.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">students = [
    {"name": "Ali", "score": 18},
    {"name": "Sara", "score": 20},
    {"name": "Reza", "score": 17}
]</div></div>
<p>برای دسترسی به نام دانشجوی اول:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(students[0]["name"])</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali</div></div>
<p>چرا؟</p>
<p>ابتدا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">students[0]</div></div>
<p>اولین Dictionary را می‌گیریم.</p>
<p>بعد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">["name"]</div></div>
<p>نام آن دانشجو را می‌گیریم.</p>

<h2 class="lesson-title">🧠 Recall</h2>
<p>قبل از ادامه، این سه سؤال را در ذهنت جواب بده:</p>
<h3>سؤال ۱</h3>
<p>برای List معمولاً با چه چیزی به عنصر دسترسی داریم؟</p>
<p><strong>Index</strong></p>
<h3>سؤال ۲</h3>
<p>برای Dictionary با چه چیزی به مقدار دسترسی داریم؟</p>
<p><strong>Key</strong></p>
<h3>سؤال ۳</h3>
<p>اگر Key وجود نداشته باشد، تفاوت این دو چیست؟</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">d["x"]</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">d.get("x")</div></div>
<p>اولی ممکن است <code>KeyError</code> بدهد؛ دومی <code>None</code> برمی‌گرداند.</p>

<h2 class="lesson-title">20. مقایسه Dictionary با ساختارهای قبلی</h2>
<div class="table-wrap"><table><thead><tr><th>ساختار</th><th>روش اصلی دسترسی</th><th>قابل تغییر؟</th><th>ویژگی اصلی</th></tr></thead><tbody><tr><td>List</td><td>Index</td><td>✅</td><td>ترتیب</td></tr><tr><td>Tuple</td><td>Index</td><td>❌</td><td>ترتیب + عدم تغییر</td></tr><tr><td>Set</td><td>Index ندارد</td><td>✅</td><td>مقادیر یکتا</td></tr><tr><td>Dictionary</td><td>Key</td><td>✅</td><td>Key → Value</td></tr></tbody></table></div>

<h1 class="lesson-title section-troubleshoot">اشتباه‌های رایج</h1>
<h3>اشتباه ۱: استفاده از Index برای Dictionary</h3>
<p>این کد:</p>

print(student[0])</div></div>

<h3>اشتباه ۲: اشتباه گرفتن Key و Value</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">student = {
    "name": "Ali"
}</div></div>
<p>در اینجا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">"name" → Key
"Ali"  → Value</div></div>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">"name" in student</div></div>

}</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">"name"
"Name"</div></div>

<h3>اشتباه ۴: تصور اینکه get() خطا می‌دهد</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">student.get("phone")</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">None</div></div>

<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li>Dictionary اطلاعات را به شکل <strong>Key → Value</strong> نگه می‌دارد.</li><li>برای دسترسی از Key استفاده می‌کنیم، نه Index.</li><li>Dictionary قابل تغییر است.</li><li><code>d[key]</code> در صورت نبودن Key می‌تواند <code>KeyError</code> ایجاد کند.</li><li><code>d.get(key)</code> برای دسترسی امن‌تر کاربرد دارد.</li><li><code>d[key] = value</code> هم برای اضافه کردن و هم تغییر مقدار استفاده می‌شود.</li><li><code>del</code> و <code>pop()</code> برای حذف استفاده می‌شوند.</li><li><code>pop()</code> مقدار حذف‌شده را برمی‌گرداند.</li><li><code>keys()</code> فقط Keyها، <code>values()</code> فقط Valueها و <code>items()</code> هر دو را می‌دهد.</li><li><code>in</code> در Dictionary به‌طور معمول Keyها را بررسی می‌کند.</li><li>Keyها باید یکتا باشند.</li><li>Dictionary می‌تواند داخل Dictionary یا List قرار بگیرد.</li></ul>

<h2 class="lesson-title">🔄 Recall سریع</h2>
<p>بدون نگاه کردن به درسنامه سعی کن این‌ها را بگویی:</p>
<ol><li>Dictionary با چه ساختاری داده را نگهداری می‌کند؟</li><li>چگونه به مقدار یک Key دسترسی پیدا می‌کنیم؟</li><li>تفاوت <code>d[key]</code> و <code>d.get(key)</code> چیست؟</li><li>چگونه یک Key جدید به Dictionary اضافه می‌کنیم؟</li><li>چگونه مقدار یک Key موجود را تغییر می‌دهیم؟</li><li>چگونه یک Key را حذف می‌کنیم؟</li><li><code>keys()</code>، <code>values()</code> و <code>items()</code> چه تفاوتی دارند؟</li><li>چگونه بررسی می‌کنیم که یک Key در Dictionary وجود دارد؟</li><li>Nested Dictionary چیست؟</li></ol>
<p>اگر بتوانی همه این‌ها را توضیح بدهی، پایه Dictionary را به‌خوبی یاد گرفته‌ای.</p>

<h2 class="lesson-title">🧩 جمع‌بندی مفهومی</h2>
<p>حالا مسیر Data Structures ما کامل‌تر شده است:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">             Data Structures
                   │
       ┌───────────┼───────────┐
       ↓           ↓           ↓
      List       Tuple        Set
       │           │           │
     Index       Index       Unique
       │
       └───────────────┐

<p>و این دقیقاً مقدمه ورود ما به <strong>Control Flow</strong> در جلسات بعدی است.</p>`

print(age &gt;= 18)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<p>یا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(age &lt; 18)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">False</div></div>
<p>پس:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Comparison
    ↓
True / False
    ↓
if
    ↓
تصمیم</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">3. ساختار if </h2>
<p>ساده‌ترین شکل شرط:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if condition:
    statement</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 20

if age &gt;= 18:
    print(&quot;You can enter.&quot;)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">You can enter.</div></div>
<p>چون:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age &gt;= 18</div></div>
<p>برابر <code>True</code> است.</p>
<h3>چرا <code>:</code> داریم؟</h3>
<p>بعد از شرط <code>:</code> قرار می‌دهیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if age &gt;= 18:</div></div>
<p>این <code>:</code> به Python می‌گوید:</p>
<blockquote>حالا یک Block از دستورات مربوط به این شرط شروع می‌شود.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">4. Indentation؛ تورفتگی بسیار مهم است </h2>
<p>دستورات داخل <code>if</code> باید با تورفتگی نوشته شوند.</p>
<p>در Python معمولاً از <strong>4 فاصله</strong> استفاده می‌کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 20

if age &gt;= 18:
    print(&quot;Adult&quot;)</div></div>
<p>دستور زیر داخل <code>if</code> است:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">    print(&quot;Adult&quot;)</div></div>
<p>اما این دستور خارج از <code>if</code> است:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 20

if age &gt;= 18:
    print(&quot;Adult&quot;)

print(&quot;Program finished&quot;)</div></div>
<p>در اینجا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">if
│
└── print(&quot;Adult&quot;)   ← داخل if

print(&quot;Program finished&quot;) ← خارج از if</div></div>
<h3>نکته امتحانی </h3>
<p>در Python، <code>Indentation</code> فقط برای زیبایی نیست؛ <strong>بخشی از Syntax زبان است.</strong></p>
<hr class="lesson-divider">
<h2 class="lesson-title">5. وقتی شرط False باشد</h2>

if age &gt;= 18:

<p>چون:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">15 &gt;= 18</div></div>
<p>برابر <code>False</code> است، دستور داخل <code>if</code> اجرا نمی‌شود.</p>
<p>خروجی:</p>
<p>یعنی چیزی چاپ نمی‌شود.</p>

<h2 class="lesson-title">6. else؛ حالت جایگزین </h2>
<p>گاهی می‌خواهیم اگر شرط درست نبود، کار دیگری انجام شود.</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">             age &gt;= 18 ?

             ↓         ↓
          if block  else block</div></div>
<h3>نکته مهم</h3>

else ...</div></div>

<h2 class="lesson-title">10. شرط‌های ترکیبی </h2>
<p>گاهی یک شرط به‌تنهایی کافی نیست.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 20

if age &gt;= 18 and has_id:

<div class="table-wrap"><table><thead><tr><th>شرط اول</th><th>شرط دوم</th><th>نتیجه</th></tr></thead><tbody><tr><td>True</td><td>True</td><td>True</td></tr><tr><td>True</td><td>False</td><td>True</td></tr><tr><td>False</td><td>True</td><td>True</td></tr><tr><td>False</td><td>False</td><td>False</td></tr></tbody></table></div>

<h3>خلاصه</h3>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">if + if
↓
ممکن است هر دو اجرا شوند.

if + elif
↓
فقط اولین شرط True اجرا می‌شود.</div></div>

<h2 class="lesson-title">21. شرط‌های ساده و Boolean</h2>
<p>گاهی لازم نیست بنویسیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if is_student == True:</div></div>
<p>می‌توانیم ساده‌تر بنویسیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if is_student:</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">is_student = True

if is_student:
    print(&quot;Student&quot;)</div></div>
<p>و برای False:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">is_student = False

if not is_student:
    print(&quot;Not student&quot;)</div></div>
<p>این سبک خواناتر است.</p>

<h1 class="lesson-title section-troubleshoot">خطاهای رایج</h1>
<h3>۱. فراموش کردن <code>:</code></h3>
<p>اشتباه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if age &gt;= 18
    print(&quot;Adult&quot;)</div></div>
<p>درست:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if age &gt;= 18:
    print(&quot;Adult&quot;)</div></div>
<h3>۲. اشتباه گرفتن <code>=</code> و <code>==</code></h3>
<p>برای مقداردهی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 20</div></div>
<p>برای مقایسه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age == 20</div></div>
<p>پس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if age == 20:
    print(&quot;Twenty&quot;)</div></div>
<p>درست است.</p>
<h3>۳. اشتباه در Indentation</h3>
<p>اشتباه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if age &gt;= 18:
print(&quot;Adult&quot;)</div></div>
<p>درست:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if age &gt;= 18:
    print(&quot;Adult&quot;)</div></div>
<h3>۴. ترتیب اشتباه elif</h3>
<p>اشتباه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">score = 19

if score &gt;= 10:
    print(&quot;Pass&quot;)
elif score &gt;= 18:
    print(&quot;Excellent&quot;)</div></div>
<p>شرط <code>&gt;= 18</code> هیچ‌وقت برای این مقدار اجرا نمی‌شود، چون شرط اول زودتر True شده است.</p>
<p>بهتر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if score &gt;= 18:
    print(&quot;Excellent&quot;)
elif score &gt;= 10:
    print(&quot;Pass&quot;)</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li><code>if</code> برای تصمیم‌گیری استفاده می‌شود.</li><li>شرط باید در نهایت <code>True</code> یا <code>False</code> باشد.</li><li>بعد از شرط <code>:</code> قرار می‌گیرد.</li><li>Blockهای Python با <strong>Indentation</strong> مشخص می‌شوند.</li><li><code>else</code> حالت جایگزین است.</li><li><code>elif</code> برای بررسی حالت‌های بعدی استفاده می‌شود.</li><li>در زنجیره <code>if/elif/else</code> اولین شرط True اجرا می‌شود.</li><li><code>and</code> یعنی هر دو شرط باید درست باشند.</li><li><code>or</code> یعنی حداقل یکی درست باشد.</li><li><code>not</code> نتیجه Boolean را برعکس می‌کند.</li><li>Nested Condition یعنی قرار گرفتن یک شرط داخل شرط دیگر.</li><li>چند <code>if</code> مستقل می‌توانند همگی اجرا شوند، اما در <code>if/elif</code> فقط اولین شاخه‌ی True اجرا می‌شود.</li><li><code>=</code> برای Assignment و <code>==</code> برای Comparison است.</li></ul>

<p>اگر بتوانی همه این‌ها را توضیح بدهی، پایه شرط‌ها را به‌خوبی یاد گرفته‌ای.</p>

<h2 class="lesson-title">10. شرط‌های تو در تو — Nested Conditions</h2>
<p>گاهی یک تصمیم فقط در صورتی باید بررسی شود که تصمیم قبلی برقرار باشد.</p>

<p>مثلاً:</p>
<blockquote>ابتدا بررسی کن سن کاربر حداقل 18 باشد. اگر 18 یا بیشتر بود، سپس بررسی کن کارت شناسایی معتبر دارد یا نه.</blockquote>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">age = 20
has_id = True

if age >= 18:
    if has_id:
        print("Entry allowed")
    else:
        print("Valid ID required")
else:
    print("You are too young")</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Entry allowed</div></div>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">age >= 18 ?
   │
 ┌─┴──────┐
بله       خیر

 ▼         ▼
has_id?   Too young
 │
 ┌┴──────┐
بله      خیر
 │        │
Entry    ID required</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">11. چه زمانی Nested Condition استفاده کنیم؟</h2>
<p>Nested Condition زمانی مناسب است که <strong>تصمیم دوم وابسته به تصمیم اول باشد</strong>.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">آیا کاربر وارد حساب شده؟
        │
       بله
        ↓
آیا Admin است؟
        │
       بله
        ↓
نمایش پنل مدیریت</div></div>
<p>اما اگر بتوانیم مسئله را ساده‌تر با <code>and</code> بنویسیم، معمولاً کد ساده‌تر خوانده می‌شود.</p>
<p>مثلاً این:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if age >= 18 and has_id:
    print("Entry allowed")</div></div>
<p>می‌تواند جایگزین بخشی از Nested Condition قبلی شود.</p>
<p>پس همیشه از خودت بپرس:</p>

<h2 class="lesson-title">14. حل مسئله مرحله‌به‌مرحله: سیستم تخفیف</h2>

مبلغ خرید 500,000 تا 999,999 → 10٪ تخفیف
کمتر از 500,000             → بدون تخفیف</div></div>
<h3>مرحله ۱ — مشخص کردن Input</h3>

500,000 <= price < 1,000,000
price < 500,000</div></div>

else:

<h2 class="lesson-title">20. یک اشتباه مهم در <code>or</code></h2>

<h1 class="lesson-title section-troubleshoot">اشتباهات رایج</h1>
<h3>۱. اشتباه در <code>></code> و <code>>=</code></h3>
<p>فرض کن مسئله می‌گوید: «اگر نمره حداقل 10 باشد، قبول است.»</p>
<p>«حداقل 10» یعنی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">score >= 10</div></div>
<p>نه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">score > 10</div></div>
<p>چون <code>score = 10</code> باید قبول شود.</p>
<h3>۲. شرط غیرممکن با <code>and</code></h3>
<p>اشتباه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if age < 18 and age > 60:</div></div>
<p>هیچ مقداری نمی‌تواند هم‌زمان کمتر از 18 و بیشتر از 60 باشد.</p>
<h3>۳. اشتباه در <code>or</code></h3>
<p>اشتباه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if color == "red" or "blue":</div></div>
<p>درست:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if color == "red" or color == "blue":</div></div>

<p>اشتباه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if score >= 10:
    print("Pass")
elif score >= 18:
    print("Excellent")</div></div>
<p>برای <code>score = 19</code> خروجی <code>Pass</code> می‌شود، در حالی که انتظار <code>Excellent</code> است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li>قبل از کدنویسی، مسئله را به <strong>Input → Conditions → Results</strong> تبدیل کن.</li><li><code>if</code> برای بررسی یک شرط اصلی استفاده می‌شود.</li><li><code>elif</code> برای حالت‌های جایگزین مناسب است.</li><li><code>else</code> حالت باقی‌مانده را پوشش می‌دهد.</li><li>Python شرط‌ها را از <strong>بالا به پایین</strong> بررسی می‌کند.</li><li>وقتی شرطی <code>True</code> شود، در زنجیره <code>if / elif / else</code> دیگر شرط‌های بعدی بررسی نمی‌شوند.</li><li>ترتیب شرط‌های هم‌پوشان بسیار مهم است.</li><li><code>and</code> یعنی <strong>همه شرط‌ها باید درست باشند</strong>.</li><li><code>or</code> یعنی <strong>حداقل یکی از شرط‌ها باید درست باشد</strong>.</li><li>Nested Condition زمانی مناسب است که تصمیم دوم به تصمیم اول وابسته باشد.</li><li>برای مرزها به <code>></code>, <code><</code>, <code>>=</code>, <code><=</code> دقت کن.</li><li>مسائل شرطی را با چند ورودی، مخصوصاً <strong>حالت‌های مرزی</strong>، تست کن.</li><li>در مقایسه‌های <code>or</code> هر شرط را کامل بنویس.</li></ul>
<hr class="lesson-divider">
<h2 class="lesson-title">🔄 Recall سریع</h2>
<p>بدون نگاه‌کردن به درس سعی کن جواب بده:</p>
<ol><li>برای یک مسئله چندحالتی از چه ساختاری استفاده می‌کنیم؟</li><li>چرا ترتیب <code>if</code> و <code>elif</code> مهم است؟</li><li>تفاوت <code>and</code> و <code>or</code> چیست؟</li><li>«حداقل 18» را چگونه می‌نویسیم؟</li><li>چه زمانی Nested Condition مناسب است؟</li><li>چرا تست کردن حالت‌های مرزی مهم است؟</li><li>عبارت زیر چه مشکلی دارد؟ <code>if age < 18 and age > 60:</code></li><li>برای بررسی «قرمز یا آبی» کدام صحیح است؟ <code>color == "red" or color == "blue"</code> یا <code>color == "red" or "blue"</code></li></ol>
<hr class="lesson-divider">
<h1 class="lesson-title section-scenario">سناریوی ترکیبی — سیستم بررسی خرید</h1>
<p>حالا یک مسئله متوسط را از ابتدا حل کنیم.</p>
<p>فرض کن یک فروشگاه اینترنتی داریم.</p>
<p>قوانین:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">اگر مبلغ خرید حداقل 1,000,000 باشد:
    20 درصد تخفیف

اگر مبلغ خرید حداقل 500,000 باشد:
    10 درصد تخفیف

در غیر این صورت:
    بدون تخفیف</div></div>
<p>اما یک قانون دیگر هم داریم:</p>
<blockquote>اگر مشتری عضو باشگاه باشد، 5 درصد تخفیف اضافه دریافت می‌کند.</blockquote>
<h3>مرحله ۱ — اطلاعات</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">price = 1_200_000
member = True</div></div>
<p>دو داده داریم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">price
member</div></div>
<h3>مرحله ۲ — تعیین تخفیف اصلی</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if price >= 1_000_000:
    discount = 20
elif price >= 500_000:
    discount = 10
else:
    discount = 0</div></div>
<h3>مرحله ۳ — بررسی عضویت</h3>
<p>اگر عضو باشد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if member:
    discount = discount + 5</div></div>
<h3>مرحله ۴ — محاسبه قیمت نهایی</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">discount_amount = price * discount / 100
final_price = price - discount_amount</div></div>
<h3>مرحله ۵ — برنامه کامل</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">price = 1_200_000
member = True

if price >= 1_000_000:
    discount = 20
elif price >= 500_000:
    discount = 10
else:
    discount = 0

if member:
    discount = discount + 5

discount_amount = price * discount / 100
final_price = price - discount_amount

print("Discount:", discount, "%")
print("Final price:", final_price)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Discount: 25 %
Final price: 900000.0</div></div>
<h3>حالا خودت فکر کن</h3>
<p>اگر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">price = 700_000
member = False</div></div>
<p>باشد، چه اتفاقی می‌افتد؟</p>
<p>ابتدا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">price >= 1,000,000 → False</div></div>
<p>سپس:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">price >= 500,000 → True</div></div>

<p>اینجاست که مفهوم <strong>Loop</strong> وارد می‌شود.</p>
<blockquote><strong>Loop یعنی اجرای تکراری یک بخش از کد تا زمانی که یک شرط یا قانون مشخص برقرار باشد.</strong></blockquote>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">          ┌───────────────┐
          │    Condition  │
          └───────┬───────┘
                  │
             True │
                  ▼
             Execute Code
                  │
                  │
                  └──────────┐
                             │
                             ▼
                         Condition
                             │
                         False
                             │
                             ▼
                            End</div></div>
<p>در این جلسه یکی از مهم‌ترین ابزارهای Python برای این کار را یاد می‌گیریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">while</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">2. <code>while</code> چیست؟</h2>
<p>کلمه <code>while</code> یعنی:</p>
<blockquote>«تا زمانی که...»</blockquote>
<p>حلقه <code>while</code> یک قطعه کد را <strong>تا زمانی که شرط آن <code>True</code> باشد</strong> اجرا می‌کند.</p>
<p>Syntax اصلی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">while condition:
    code</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">count = 1

while count <= 5:
    print(count)
    count += 1</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
2
3
4
5</div></div>
<p>بیایید دقیقاً ببینیم چه اتفاقی افتاد.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">3. حلقه <code>while</code> چگونه کار می‌کند؟ </h2>
<p>این قسمت را خیلی خوب یاد بگیر؛ چون اساس تمام حلقه‌های <code>while</code> است.</p>
<p>کد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">count = 1

while count <= 5:
    print(count)
    count += 1</div></div>
<p>ابتدا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">count = 1</div></div>
<p>Python شرط را بررسی می‌کند:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">count <= 5</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1 <= 5</div></div>
<p>نتیجه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<p>پس وارد بدنه حلقه می‌شود:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(count)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1</div></div>
<p>سپس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">count += 1</div></div>
<p>مقدار <code>count</code> می‌شود:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">2</div></div>
<p>حالا دوباره شرط بررسی می‌شود:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">2 <= 5</div></div>
<p>باز هم <code>True</code>.</p>
<p>این روند ادامه پیدا می‌کند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">count = 1 → True → چاپ 1
count = 2 → True → چاپ 2
count = 3 → True → چاپ 3
count = 4 → True → چاپ 4
count = 5 → True → چاپ 5
count = 6 → False → پایان</div></div>
<h3>مدل ذهنی</h3>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">          count = 1
               │
               ▼
        count <= 5 ?
          /       \
       True       False
        │           │
        ▼           ▼
      print       پایان
        │
        ▼
   count += 1
        │
        └──────────────► دوباره شرط</div></div>
<h3>نکته طلایی </h3>
<p>در <code>while</code>:</p>
<blockquote><strong>اول شرط بررسی می‌شود، سپس بدنه اجرا می‌شود.</strong></blockquote>
<p>بنابراین اگر شرط از همان ابتدا <code>False</code> باشد، بدنه حتی یک بار هم اجرا نمی‌شود.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">count = 10

while count < 5:
    print(count)</div></div>
<p>خروجی:</p>
<p>هیچ چیزی چاپ نمی‌شود.</p>
<p>چون:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">10 < 5</div></div>
<p>از ابتدا <code>False</code> است.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">4. بدنه <code>while</code> و Indentation</h2>
<p>مثل <code>if</code>، در <code>while</code> نیز بعد از شرط <code>:</code> می‌گذاریم و کد داخل حلقه باید <strong>Indentation</strong> داشته باشد.</p>
<p>درست:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">while condition:
    print(&quot;Hello&quot;)</div></div>
<p>غلط:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">while condition:
print(&quot;Hello&quot;)</div></div>
<p>در Python، فاصله ابتدای خط فقط برای زیبایی نیست.</p>
<p>Indentation مشخص می‌کند:</p>
<blockquote>کدام دستورات داخل حلقه هستند.</blockquote>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">count = 1

while count <= 3:
    print(&quot;Hello&quot;)
    print(count)

print(&quot;Done&quot;)</div></div>
<p>در اینجا دو <code>print</code> اول داخل حلقه هستند، اما:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(&quot;Done&quot;)</div></div>
<p>خارج از حلقه است.</p>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Hello
1
Hello
2
Hello
3
Done</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">5. چرا <code>count += 1</code> مهم است؟</h2>
<p>حالا به یک خط بسیار مهم برگردیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">count += 1</div></div>
<p>این خط مقدار <code>count</code> را یکی زیاد می‌کند.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">count = 1
count += 1
print(count)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">2</div></div>
<p>از نظر مفهومی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">count += 1</div></div>
<p>معادل است با:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">count = count + 1</div></div>
<p>بنابراین:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">count = 1

while count <= 5:
    print(count)
    count += 1</div></div>
<p>باعث می‌شود متغیر <code>count</code> به سمت شرط پایان حرکت کند.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">6. Infinite Loop — حلقه بی‌نهایت </h2>
<p>یکی از مهم‌ترین خطاهای <code>while</code> این است که حلقه هیچ‌وقت تمام نشود.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">count = 1

while count <= 5:
    print(count)</div></div>
<p>به نظر می‌رسد قرار است اعداد 1 تا 5 چاپ شوند.</p>
<p>اما یک مشکل داریم:</p>
<p><code>count</code> هیچ‌وقت تغییر نمی‌کند.</p>
<p>پس همیشه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">count = 1</div></div>
<p>و شرط همیشه:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1 <= 5</div></div>
<p>یعنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">True</div></div>
<p>بنابراین حلقه ادامه پیدا می‌کند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
1
1
1
1
...</div></div>
<p>این یک <strong>Infinite Loop</strong> است.</p>
<blockquote>Infinite Loop یعنی حلقه‌ای که شرط پایان آن هیچ‌وقت <code>False</code> نمی‌شود.</blockquote>
<h3>چگونه از Infinite Loop جلوگیری کنیم؟</h3>
<p>قبل از نوشتن <code>while</code> سه سؤال از خودت بپرس:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1. شرط شروع/ادامه چیست؟
2. چه چیزی در هر تکرار تغییر می‌کند؟
3. چه زمانی شرط False می‌شود؟</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">count = 1

while count <= 5:
    print(count)
    count += 1</div></div>
<p>پاسخ:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">شرط:
count <= 5

متغیر تغییرکننده:
count

تغییر:
count += 1

نقطه پایان:
count = 6</div></div>
<p>این طرز فکر برای حل مسئله با <code>while</code> بسیار مهم است.</p>

<h2 class="lesson-title">7. <code>while</code> فقط برای شمارش نیست</h2>
<p>ممکن است فکر کنی <code>while</code> فقط برای این است:</p>

while count <= 10:

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">تا وقتی کاربر رمز درست وارد نکرده:
    دوباره رمز بگیر</div></div>
<p>یا:</p>

<h2 class="lesson-title">9. عملگرهای Assignment که در <code>while</code> زیاد می‌بینیم</h2>
<p>در جلسات قبلی با Assignment Operators آشنا شدیم.</p>
<p>در حلقه‌ها این‌ها بسیار کاربردی هستند:</p>
<div class="table-wrap"><table><thead><tr><th>Syntax</th><th>معادل</th></tr></thead><tbody><tr><td><code>x += 1</code></td><td><code>x = x + 1</code></td></tr><tr><td><code>x -= 1</code></td><td><code>x = x - 1</code></td></tr><tr><td><code>x += 5</code></td><td><code>x = x + 5</code></td></tr><tr><td><code>x -= 5</code></td><td><code>x = x - 5</code></td></tr></tbody></table></div>

<h2 class="lesson-title">10. استفاده از شرط‌های ترکیبی در <code>while</code></h2>
<p>در جلسه ۱۰ یاد گرفتیم که می‌توانیم شرط‌ها را با:</p>

not</div></div>

5

<hr class="lesson-divider">
<h2 class="lesson-title">13. <code>while</code> و <code>if</code> چه تفاوتی دارند؟</h2>
<p>این دو را با هم اشتباه نکن.</p>
<h3><code>if</code></h3>
<p>یک تصمیم می‌گیرد و در حالت معمول، بدنه‌اش فقط همان بار بررسی اجرا می‌شود.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if age >= 18:
    print(&quot;Adult&quot;)</div></div>
<h3><code>while</code></h3>
<p>تا زمانی که شرط <code>True</code> باشد، دوباره و دوباره اجرا می‌کند.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">while age < 18:
    print(age)
    age += 1</div></div>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">if
 │
 └── بررسی → اجرا → پایان


while
 │
 ├── بررسی → اجرا
 │             │
 │             └── بررسی دوباره
 │
 └── False → پایان</div></div>
<h3>نکته امتحانی </h3>
<p>اگر سؤال گفت:</p>
<blockquote>«کد را تا زمانی که شرط برقرار است تکرار کن»</blockquote>
<p>ذهن تو باید سریع برود سمت:</p>

<h2 class="lesson-title">🧠 Recall کوتاه</h2>
<p>تا اینجا اگر از تو بپرسم:</p>

<h1 class="lesson-title section-troubleshoot">مشکلات رایج <code>while</code></h1>
<h3>مشکل ۱ — حلقه تمام نمی‌شود</h3>

while x < 10:

<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li><code>while</code> برای <strong>تکرار مشروط</strong> استفاده می‌شود.</li><li>Syntax اصلی: <code>while condition: code</code></li><li>شرط <code>while</code> قبل از هر بار اجرای بدنه بررسی می‌شود.</li><li>اگر شرط از ابتدا <code>False</code> باشد، حلقه حتی یک بار هم اجرا نمی‌شود.</li><li>بدنه <code>while</code> باید با <strong>Indentation</strong> مشخص شود.</li><li>برای کنترل حلقه معمولاً یک متغیر مثل <code>count</code> یا <code>number</code> داریم.</li><li>باید وضعیت کنترل‌کننده حلقه به شکلی تغییر کند که در نهایت شرط <code>False</code> شود.</li><li>اگر شرط هیچ‌وقت <code>False</code> نشود، <strong>Infinite Loop</strong> ایجاد می‌شود.</li><li><code>x += 1</code> معادل <code>x = x + 1</code> است.</li><li><code>x -= 1</code> معادل <code>x = x - 1</code> است.</li><li><code>while</code> فقط برای شمارش نیست؛ برای کنترل وضعیت و تکرار تا رسیدن به یک وضعیت خاص هم استفاده می‌شود.</li><li><code>while True</code> یک حلقه بی‌نهایت ایجاد می‌کند، مگر اینکه مکانیزم خروج داشته باشد.</li></ul>
<hr class="lesson-divider">
<h2 class="lesson-title">🔄 Recall سریع</h2>
<p>بدون نگاه کردن به درس، سعی کن این سؤال‌ها را جواب بده:</p>
<ol><li><code>while</code> چه تفاوتی با <code>if</code> دارد؟</li><li>شرط <code>while</code> چه زمانی بررسی می‌شود؟</li><li>اگر شرط از ابتدا <code>False</code> باشد چه اتفاقی می‌افتد؟</li><li>چرا تغییر متغیر کنترل‌کننده مهم است؟</li><li>Infinite Loop چیست؟</li><li><code>x += 1</code> یعنی چه؟</li><li>چرا کد زیر مشکل دارد؟ <code>x = 1<br>while x <= 5:<br>    print(x)</code></li><li>آیا <code>while</code> فقط برای کار با اعداد استفاده می‌شود؟</li></ol>
<p>اگر بتوانی این موارد را بدون نگاه‌کردن به درس توضیح بدهی، مفهوم اصلی <code>while</code> را یاد گرفته‌ای.</p>
<hr class="lesson-divider">
<h1 class="lesson-title section-scenario">سناریوی ترکیبی — سیستم ورود به حساب کاربری</h1>
<p>فرض کن می‌خواهیم یک برنامه ساده برای <strong>سیستم ورود به حساب کاربری</strong> بسازیم.</p>
<p>قانون برنامه:</p>
<blockquote>کاربر حداکثر 3 بار فرصت دارد رمز عبور را وارد کند.</blockquote>
<p>رمز صحیح:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">python123</div></div>
<p>برای حل مسئله ابتدا آن را به چند بخش تقسیم می‌کنیم.</p>
<h3>مرحله ۱ — تعداد تلاش</h3>
<p>به یک متغیر نیاز داریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">attempt = 1</div></div>
<h3>مرحله ۲ — دریافت رمز</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">password = input(&quot;Enter password: &quot;)</div></div>
<h3>مرحله ۳ — بررسی رمز</h3>
<p>از <code>if</code> استفاده می‌کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">if password == &quot;python123&quot;:
    print(&quot;Access granted!&quot;)</div></div>
<p>اما هنوز یک مشکل داریم:</p>
<p>اگر رمز اشتباه باشد، باید دوباره سؤال کنیم.</p>
<p>اینجاست که <code>while</code> وارد می‌شود.</p>
<h3>مرحله ۴ — ترکیب <code>while</code> و <code>if</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">attempt = 1

while attempt <= 3:
    password = input(&quot;Enter password: &quot;)

    if password == &quot;python123&quot;:
        print(&quot;Access granted!&quot;)
    else:
        print(&quot;Wrong password.&quot;)

    attempt += 1</div></div>
<p>اما این برنامه یک ایراد منطقی دارد:</p>
<p>حتی اگر رمز درست باشد، باز هم ممکن است تلاش‌های بعدی انجام شوند.</p>
<p>فعلاً در این جلسه ابزار مناسب برای خروج زودهنگام از حلقه را یاد نگرفته‌ایم.</p>
<p>پس بهتر است فعلاً سناریو را با یک متغیر وضعیت کنترل کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">attempt = 1
logged_in = False

while attempt <= 3 and not logged_in:
    password = input(&quot;Enter password: &quot;)

    if password == &quot;python123&quot;:
        print(&quot;Access granted!&quot;)
        logged_in = True
    else:
        print(&quot;Wrong password.&quot;)

    attempt += 1

if not logged_in:
    print(&quot;Account locked.&quot;)</div></div>
<h3>این برنامه چگونه کار می‌کند؟</h3>
<p>ابتدا:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">attempt = 1
logged_in = False</div></div>
<p>شرط حلقه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">attempt <= 3 and not logged_in</div></div>
<p>در ابتدا:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1 <= 3 → True
not False → True</div></div>
<p>پس حلقه اجرا می‌شود.</p>
<p>اگر رمز درست باشد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">logged_in = True</div></div>
<p>در بررسی بعدی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">not logged_in</div></div>
<p>می‌شود:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">False</div></div>
<p>پس حلقه تمام می‌شود.</p>
<p>اگر سه بار رمز اشتباه باشد، مقدار:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">attempt</div></div>
<p>از <code>3</code> عبور می‌کند و شرط اول <code>False</code> می‌شود.</p>
<p>در نهایت:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Account locked.</div></div>
<h3>مدل ذهنی سناریو</h3>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">             Start
               │
               ▼
       attempt = 1
       logged_in = False
               │
               ▼
     attempt <= 3 AND
       not logged_in
          /       \
       True       False
        │           │
        ▼           ▼
   دریافت رمز      پایان
        │
        ▼
   رمز درست است؟
      /       \
    Yes        No
     │          │
     ▼          ▼
 logged_in    تلاش بعدی
   = True        │
     │           ▼
     └──────► attempt += 1
                  │
                  └────► بررسی دوباره</div></div>
<p>اینجا چند مفهوم جلسه‌های قبلی را کنار هم گذاشتیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Variables
    +
input()
    +
Comparison
    +
if / else
    +
and / not

<h2 class="lesson-title">🎯 جمع‌بندی جلسه</h2>
<p>در جلسه ۱۰ یاد گرفتیم که با شرط‌ها می‌توانیم <strong>تصمیم بگیریم</strong>.</p>
<p>حالا در جلسه ۱۲ یک مفهوم جدید اضافه کردیم:</p>
<blockquote>با <code>while</code> می‌توانیم <strong>تا زمانی که یک وضعیت برقرار است، کاری را تکرار کنیم.</strong></blockquote>
<p>رابطه مفاهیم را این‌طور ببین:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Condition
    │
    ├──────────────┐
    │              │
    ▼              ▼
   if            while
    │              │
    ▼              ▼
 تصمیم          تکرار
    │              │
    │              └── تا وقتی شرط True است
    │
    └── یک تصمیم</div></div>
<p>و ساختار اصلی <code>while</code>:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Initial State
     ↓
Condition
     ↓
True ──→ Execute
          ↓
       Update State
          │
          └────→ Condition
                    │
                  False
                    ↓
                   End</div></div>
<p>اگر فقط <strong>یک نکته</strong> از این جلسه به خاطر بسپاری، این باشد:</p>
<blockquote> در هر حلقه <code>while</code> همیشه بدان <strong>شرط چیست، چه چیزی آن را تغییر می‌دهد و چه زمانی قرار است <code>False</code> شود.</strong></blockquote>
<p>این سه سؤال جلوی بخش بزرگی از خطاهای مربوط به <code>while</code> و Infinite Loop را می‌گیرد.</p>
<p>در جلسه بعد می‌رویم سراغ <strong><code>for</code>، <code>range()</code> و <code>enumerate()</code></strong> و می‌بینیم وقتی تعداد یا مجموعه‌ای از موارد برای تکرار مشخص است، چرا <code>for</code> معمولاً انتخاب بهتری است.</p>`

</div>
<blockquote class="lesson-goal">

<p>در پایان این جلسه باید بتوانی:</p>
<ol>

<h2 class="lesson-title">1. از <code>while</code> به <code>for</code></h2>
<p>در جلسه قبل با <code>while</code> آشنا شدیم.</p>
<p>مثلاً برای چاپ اعداد 1 تا 5:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">number = 1

while number <= 5:

2
3
4

<p>اما یک سؤال:</p>
<blockquote>آیا واقعاً لازم است خودمان متغیر <code>number</code> را بسازیم و در هر مرحله آن را افزایش دهیم؟</blockquote>
<p>در بسیاری از مسائل، جواب <strong>خیر</strong> است.</p>
<p>وقتی می‌دانیم قرار است روی یک مجموعه از داده‌ها حرکت کنیم یا تعداد مشخصی تکرار داشته باشیم، <code>for</code> معمولاً ساده‌تر و خواناتر است.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(1, 6):

<h2 class="lesson-title">2. <code>for</code> چیست؟ </h2>
<p>به زبان ساده:</p>
<blockquote><code>for</code> برای پیمایش (<strong>Iteration</strong>) روی مجموعه‌ای از مقادیر یا اجرای یک کد برای هر مقدار استفاده می‌شود.</blockquote>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

for name in names:
    print(name)</div></div>

Sara
Reza</div></div>

Sara
 ↓

 ↓
اجرای بدنه

Reza

 ↓
اجرای بدنه</div></div>
<h3>مدل ذهنی</h3>

<p>بنابراین می‌توانی <code>for</code> را این‌طور در ذهن داشته باشی:</p>

<h2 class="lesson-title">3. Syntax حلقه <code>for</code></h2>
<p>ساختار اصلی:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for variable in iterable:
    code</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in numbers:
    print(number)</div></div>
<p>سه بخش اصلی داریم:</p>
<div class="table-wrap"><table><thead><tr><th>بخش</th><th>معنی</th></tr></thead><tbody><tr><td><code>for</code></td><td>شروع حلقه</td></tr><tr><td><code>variable</code></td><td>متغیری که مقدار فعلی را دریافت می‌کند</td></tr><tr><td><code>in</code></td><td>حرکت روی عناصر</td></tr><tr><td><code>iterable</code></td><td>چیزی که می‌خواهیم روی آن حرکت کنیم</td></tr><tr><td><code>:</code></td><td>شروع بدنه</td></tr><tr><td>کد Indented</td><td>دستورات تکرارشونده</td></tr></tbody></table></div>
<p>در سطح Python Basic فعلاً کافی است مفهوم <code>iterable</code> را این‌طور در نظر بگیری:</p>
<blockquote>چیزی که می‌توانیم عناصر آن را یکی‌یکی بررسی کنیم؛ مثل <code>list</code> و <code>string</code>.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">4. <code>for</code> روی List </h2>
<p>یکی از مهم‌ترین کاربردهای <code>for</code> کار با <code>list</code> است.</p>

<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for fruit in fruits:
    print(fruit)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">apple
banana
orange</div></div>
<p>نکته مهم این است که لازم نیست خودمان Indexها را مدیریت کنیم.</p>
<p>Python خودش عناصر را یکی‌یکی در <code>fruit</code> قرار می‌دهد.</p>

<hr class="lesson-divider">
<h2 class="lesson-title">6. <code>for</code> در برابر <code>while</code> </h2>
<p>حالا به سؤال مهم جلسه می‌رسیم:</p>
<blockquote>چه زمانی <code>for</code> و چه زمانی <code>while</code>؟</blockquote>
<p>به شکل ساده:</p>
<h3><code>for</code></h3>
<p>وقتی می‌خواهیم روی یک مجموعه یا تعداد مشخصی از موارد حرکت کنیم.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

for name in names:
    print(name)</div></div>
<p>یعنی:</p>
<blockquote>برای هر نام موجود در لیست، آن را چاپ کن.</blockquote>
<h3><code>while</code></h3>
<p>وقتی تکرار به یک <strong>شرط یا وضعیت</strong> وابسته است و از قبل نمی‌دانیم دقیقاً چند بار اجرا می‌شود.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">password = ""

while password != "1234":
    password = input("Password: ")</div></div>
<p>یعنی:</p>
<blockquote>تا وقتی رمز درست نشده، دوباره رمز بگیر.</blockquote>
<h3>جدول مقایسه</h3>
<div class="table-wrap"><table><thead><tr><th><code>for</code></th><th><code>while</code></th></tr></thead><tbody><tr><td>پیمایش روی داده‌ها</td><td>تکرار بر اساس شرط</td></tr><tr><td>مناسب تعداد مشخص تکرار</td><td>مناسب تعداد نامشخص تکرار</td></tr><tr><td>معمولاً مدیریت شمارنده لازم نیست</td><td>معمولاً باید وضعیت را تغییر دهیم</td></tr><tr><td>خواناتر برای مجموعه‌ها</td><td>مناسب کنترل وضعیت</td></tr><tr><td><code>for x in items</code></td><td><code>while condition</code></td></tr></tbody></table></div>
<h3>قانون ساده </h3>
<p>اگر مسئله شبیه این است:</p>
<blockquote>«برای هر مورد موجود در این مجموعه...»</blockquote>
<p>به <code>for</code> فکر کن.</p>
<p>اگر شبیه این است:</p>
<blockquote>«تا زمانی که این شرط برقرار است...»</blockquote>
<p>به <code>while</code> فکر کن.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">7. <code>range()</code> چیست؟ </h2>
<p>یکی از مهم‌ترین ابزارهایی که همراه <code>for</code> استفاده می‌شود:</p>

<h2 class="lesson-title">15. <code>enumerate()</code> چیست؟ </h2>
<p>حالا یک مسئله مهم:</p>
<p>فرض کن داریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]</div></div>

<p>یک روش این است:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(len(names)):
    print(i, names[i])</div></div>
<p>اما برای این کار روش ساده‌تر و خواناتری داریم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, name in enumerate(names):
    print(index, name)</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0 Ali
1 Sara
2 Reza</div></div>
<p>این دقیقاً کاربرد <code>enumerate()</code> است.</p>
<blockquote><code>enumerate()</code> هنگام پیمایش، <strong>Index و Value</strong> را با هم در اختیار ما قرار می‌دهد.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">16. مدل ذهنی <code>enumerate()</code></h2>
<p>لیست:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">["Ali", "Sara", "Reza"]</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Index      Value

  0   →    Ali
  1   →    Sara
  2   →    Reza</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, name in enumerate(names):</div></div>
<p>در هر مرحله:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">index = 0    name = "Ali"
index = 1    name = "Sara"
index = 2    name = "Reza"</div></div>
<hr class="lesson-divider">

<p>روش اول:</p>

for i, name in enumerate(names):

<blockquote>برای هر عنصر، Index و Value را بده.</blockquote>
<p>بنابراین در Python Basic، وقتی هم Index و هم Value لازم داری، <code>enumerate()</code> انتخاب بسیار خوبی است.</p>

<h2 class="lesson-title">19. <code>for</code> با شرط <code>if</code></h2>
<p>حالا مفاهیم قبلی را ترکیب کنیم.</p>
<p>فرض کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [1, 2, 3, 4, 5, 6]</div></div>
<p>می‌خواهیم فقط اعداد زوج را چاپ کنیم.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in numbers:
    if number % 2 == 0:
        print(number)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">2
4
6</div></div>
<p>اینجا یک الگوی بسیار مهم داریم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">List
  ↓
for
  ↓
هر عنصر
  ↓
if
  ↓
بررسی شرط
  ↓
اجرای کد</div></div>
<p>این همان ترکیب مفاهیمی است که در جلسات قبل یاد گرفتیم.</p>

<h2 class="lesson-title">20. <code>for</code> روی String + شرط</h2>
<p>مثلاً می‌خواهیم تعداد حروف <code>a</code> را بررسی کنیم.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">word = "banana"

for letter in word:
    if letter == "a":
        print(letter)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">a
a
a</div></div>
<p>اینجا <code>for</code> روی کاراکترهای String حرکت می‌کند و <code>if</code> هر کاراکتر را بررسی می‌کند.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">21. تفاوت مهم <code>range()</code> و <code>list</code></h2>
<p>ممکن است این دو را با هم اشتباه بگیری:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">numbers = [1, 2, 3, 4]</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">range(1, 5)</div></div>
<p>هر دو می‌توانند در یک <code>for</code> استفاده شوند:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in numbers:
    print(number)</div></div>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(1, 5):
    print(number)</div></div>
<p>اما مفهومشان یکی نیست.</p>
<p><code>list</code> واقعاً یک مجموعه از مقادیر است که خودمان ساخته‌ایم.</p>
<p><code>range()</code> برای تولید یک دنباله عددی مناسب برای پیمایش استفاده می‌شود.</p>
<p>در این مرحله کافی است این تفاوت مفهومی را بدانیم.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">22. یک اشتباه رایج: انتظار داشتن <code>stop</code></h2>
<p>به این کد دقت کن:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(1, 5):
    print(i)</div></div>
<p>بعضی افراد انتظار دارند:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
2
3
4
5</div></div>
<p>اما خروجی واقعی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
2
3
4</div></div>
<p>چون:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">range(1, 5)</div></div>

<h2 class="lesson-title">24. یک اشتباه رایج در <code>enumerate()</code></h2>
<p>کد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

for name, index in enumerate(names):
    print(index, name)</div></div>
<p>از نظر Syntax مشکلی ندارد، اما ترتیب متغیرها اشتباه انتخاب شده است.</p>
<p><code>enumerate()</code> مقدارها را به این شکل می‌دهد:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">index, value</div></div>
<p>پس بهتر است بنویسیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, name in enumerate(names):
    print(index, name)</div></div>
<h3>نکته </h3>
<p>ترتیب را به خاطر بسپار:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, value in enumerate(items):</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">🧠 مدل ذهنی کل جلسه</h2>
<p>تا اینجا سه ابزار مهم داریم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">                 LOOP
                   │
          ┌────────┴────────┐
          │                 │
        while              for
          │                 │
    شرط و وضعیت        پیمایش داده
                            │
                     ┌──────┴──────┐
                     │             │
                   range       enumerate
                     │             │
                دنباله عددی    Index + Value</div></div>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(5):
    print(i)</div></div>
<p>یعنی:</p>
<blockquote>برای هر عدد موجود در این بازه، کد را اجرا کن.</blockquote>
<p>و:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, value in enumerate(names):
    print(index, value)</div></div>
<p>یعنی:</p>
<blockquote>برای هر عنصر لیست، Index و Value آن را در اختیارم قرار بده.</blockquote>
<hr class="lesson-divider">
<h1 class="lesson-title section-troubleshoot">Troubleshooting</h1>
<h3>مشکل ۱ — چرا عدد آخر چاپ نشد؟</h3>
<p>کد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(1, 5):
    print(i)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
2
3
4</div></div>
<p>علت:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">stop = 5</div></div>
<p>و <code>5</code> شامل نمی‌شود.</p>
<p>اگر 5 هم لازم است:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">range(1, 6)</div></div>
<h3>مشکل ۲ — چرا حلقه معکوس کار نمی‌کند؟</h3>
<p>این کد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(5, 0):
    print(i)</div></div>
<p>چیزی چاپ نمی‌کند.</p>
<p>چرا؟</p>
<p>چون <code>range()</code> به‌صورت پیش‌فرض با <code>step = 1</code> جلو می‌رود، در حالی که اینجا باید به سمت پایین حرکت کنیم.</p>
<p>راه درست:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(5, 0, -1):
    print(i)</div></div>
<h3>مشکل ۳ — چرا <code>enumerate()</code> را اشتباه می‌نویسم؟</h3>
<p>اگر Index و Value هر دو لازم هستند، الگوی اصلی را به خاطر بسپار:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, value in enumerate(items):
    ...</div></div>
<p>نه برعکس.</p>
<h3>مشکل ۴ — آیا همیشه باید از <code>range()</code> استفاده کنم؟</h3>
<p>خیر.</p>
<p>اگر خود داده‌ها را داری:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">names = ["Ali", "Sara", "Reza"]

for name in names:
    print(name)</div></div>
<p>نیازی به <code>range()</code> نداری.</p>
<p><code>range()</code> بیشتر زمانی مفید است که:</p>
<ul><li>دنباله‌ای از اعداد می‌خواهی.</li><li>تعداد مشخصی تکرار نیاز داری.</li><li>به Index نیاز داری و روش مناسب مسئله را انتخاب می‌کنی.</li></ul>
<hr class="lesson-divider">
<h2 class="lesson-title"> نکات مهم جلسه</h2>
<ul><li><code>for</code> برای پیمایش روی داده‌ها و اجرای تکراری کد استفاده می‌شود.</li><li>ساختار اصلی: <code>for variable in iterable: code</code></li><li><code>for</code> می‌تواند روی <code>list</code> و <code>string</code> حرکت کند.</li><li><code>range()</code> برای ایجاد دنباله عددی مناسب برای حلقه‌ها استفاده می‌شود.</li><li>در <code>range()</code> مقدار <code>stop</code> <strong>شامل نمی‌شود</strong>.</li><li>در <code>range(start, stop, step)</code> می‌توان مقدار شروع، پایان و گام را تعیین کرد.</li><li><code>step</code> منفی برای حرکت معکوس استفاده می‌شود.</li><li>برای اجرای یک کد تعداد مشخصی بار می‌توان از <code>for _ in range(n):</code> استفاده کرد.</li><li><code>enumerate()</code> برای دسترسی هم‌زمان به Index و Value بسیار کاربردی است.</li><li>ساختار رایج آن: <code>for index, value in enumerate(items):</code></li><li>با <code>start=</code> می‌توان شماره شروع <code>enumerate()</code> را تغییر داد.</li><li>اگر مسئله درباره <strong>پیمایش مجموعه</strong> باشد، معمولاً <code>for</code> انتخاب مناسبی است.</li><li>اگر مسئله درباره <strong>ادامه دادن تا برقرار بودن یک شرط</strong> باشد، معمولاً <code>while</code> مناسب‌تر است.</li></ul>
<hr class="lesson-divider">
<h2 class="lesson-title">🔄 Recall سریع</h2>
<p>بدون نگاه کردن به درس جواب بده:</p>
<ol><li>تفاوت اصلی <code>for</code> و <code>while</code> چیست؟</li><li>خروجی این کد چیست؟ <code>for i in range(4): print(i)</code></li><li>خروجی این کد چیست؟ <code>for i in range(2, 8, 2): print(i)</code></li><li>چرا <code>range(1, 5)</code> عدد 5 را شامل نمی‌شود؟</li><li><code>enumerate()</code> چه مشکلی را حل می‌کند؟</li><li>در این کد <code>index</code> و <code>name</code> چه مقادیری می‌گیرند؟ <code>names = ["Ali", "Sara"]<br>for index, name in enumerate(names):<br>    print(index, name)</code></li><li>برای حرکت از 10 به 1 در <code>range()</code> چه <code>step</code>ای لازم است؟</li></ol>
<p>پاسخ‌های اصلی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">for       → پیمایش / تکرار روی داده
while     → تکرار بر اساس شرط

range(4)  → 0, 1, 2, 3

range(2, 8, 2) → 2, 4, 6

enumerate() → Index + Value

حرکت معکوس → step = -1</div></div>

<h1 class="lesson-title section-scenario">سناریوی ترکیبی — نمایش نمرات دانش‌آموزان</h1>
<p>فرض کن می‌خواهیم یک برنامه ساده برای نمایش <strong>نمرات دانش‌آموزان</strong> بسازیم.</p>
<p>داده‌ها:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">scores = [18, 12, 20, 9, 15]</div></div>
<p>می‌خواهیم:</p>
<ol><li>شماره هر دانش‌آموز را نمایش دهیم.</li><li>نمره او را نمایش دهیم.</li><li>مشخص کنیم قبول شده یا مردود.</li></ol>
<p>قانون:</p>
<blockquote>نمره 10 یا بیشتر → قبول<br>نمره کمتر از 10 → مردود</blockquote>
<h3>مرحله ۱ — پیمایش لیست</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for score in scores:
    print(score)</div></div>
<p>اما هنوز شماره دانش‌آموز را نداریم.</p>
<h3>مرحله ۲ — استفاده از <code>enumerate()</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, score in enumerate(scores, start=1):
    print(index, score)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1 18
2 12
3 20
4 9
5 15</div></div>
<h3>مرحله ۳ — اضافه کردن شرط</h3>
<p>حالا <code>if</code> را اضافه می‌کنیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for index, score in enumerate(scores, start=1):

    if score >= 10:
        result = "Pass"
    else:
        result = "Fail"

    print(index, score, result)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1 18 Pass
2 12 Pass
3 20 Pass
4 9 Fail
5 15 Pass</div></div>
<h3>مرحله ۴ — تحلیل مدل ذهنی</h3>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">scores
   │
   ▼
enumerate()
   │
   ├── index
   └── score
        │
        ▼
     score >= 10 ?
       /       \
     True      False
      │           │
    Pass         Fail
       \         /
          print</div></div>
<p>اینجا چند مفهوم را کنار هم استفاده کردیم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">List
  ↓
for
  ↓
enumerate()
  ↓
if / else
  ↓
Comparison
  ↓
print()</div></div>
<p>این دقیقاً همان مهارتی است که باید در این مرحله از Python داشته باشی:</p>
<blockquote>مسئله را به چند بخش ساده تقسیم کن و مفاهیمی که قبلاً یاد گرفته‌ای را کنار هم قرار بده.</blockquote>
<h3>یک تمرین برای خودت 🧑‍💻</h3>
<p>حالا همین سناریو را تغییر بده.</p>
<p>لیست زیر را در نظر بگیر:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">scores = [7, 14, 19, 8, 11, 20]</div></div>
<p>برنامه‌ای بنویس که:</p>
<ul><li>شماره دانش‌آموز را نمایش دهد.</li><li>نمره را نمایش دهد.</li><li>برای نمره‌های <code>>= 10</code> بنویسد <code>Pass</code>.</li><li>برای نمره‌های <code>< 10</code> بنویسد <code>Fail</code>.</li></ul>
<p>سعی کن قبل از دیدن راه‌حل آن را خودت بنویسی.</p>
<h3>راه‌حل</h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">scores = [7, 14, 19, 8, 11, 20]

for index, score in enumerate(scores, start=1):

    if score >= 10:
        result = "Pass"
    else:
        result = "Fail"

    print(index, score, result)</div></div>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1 7 Fail
2 14 Pass
3 19 Pass
4 8 Fail
5 11 Pass
6 20 Pass</div></div>

       │           │
       ▼           ▼
   تکرار بعدی     پایان حلقه</div></div>
<p>نکته مهم:</p>
<blockquote><code>break</code> فقط <strong>حلقه‌ای که داخل آن قرار دارد</strong> را متوقف می‌کند.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">4. <code>break</code> در <code>while</code></h2>
<p><code>break</code> فقط برای <code>for</code> نیست.</p>
<p>در <code>while</code> هم می‌توانیم استفاده کنیم.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">number = 1

while number <= 10:
    if number == 5:
        break

    print(number)
    number += 1</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
2
3
4</div></div>
<p>وقتی <code>number == 5</code> شد، <code>break</code> اجرا می‌شود و حلقه پایان پیدا می‌کند.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">5. کاربرد واقعی <code>break</code></h2>
<p>فرض کن لیستی از نام‌ها داریم:</p>

<p>می‌خواهیم نام‌ها را بررسی کنیم، اما وقتی به <code>Reza</code> رسیدیم، دیگر ادامه ندهیم.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for name in names:
    if name == "Reza":
        break

    print(name)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">Ali
Sara</div></div>
<p>چون وقتی به <code>Reza</code> رسیدیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">break</div></div>
<p>اجرا شد.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">6. <code>break</code> به معنی «رد کردن» نیست</h2>
<p>این نکته خیلی مهم است.</p>
<p>اگر بنویسیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(1, 6):
    if number == 3:
        break

    print(number)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
2</div></div>
<p>یعنی:</p>
<blockquote>در 3 فقط آن مورد را رد نکردیم؛ <strong>کل حلقه را متوقف کردیم.</strong></blockquote>
<p>اگر فقط بخواهیم 3 را رد کنیم، باید از <code>continue</code> استفاده کنیم.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">7. <code>continue</code> چیست؟ </h2>
<p><code>continue</code> یعنی:</p>
<blockquote><strong>تکرار فعلی را متوقف کن و برو سراغ تکرار بعدی.</strong></blockquote>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(1, 6):
    if number == 3:
        continue

    print(number)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
2
4
5</div></div>
<p>وقتی <code>number</code> برابر 3 شد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">continue</div></div>
<p>اجرا می‌شود.</p>
<p>در نتیجه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(number)</div></div>
<p>برای 3 اجرا نمی‌شود.</p>
<p>اما حلقه <strong>تمام نمی‌شود</strong>.</p>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">4</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">8. مدل ذهنی <code>continue</code></h2>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">       شروع تکرار
            ↓
        بررسی شرط
        /        \
     False       True
       │           │

 پایان تکرار       │

       └─────┬─────┘
             ▼
        تکرار بعدی</div></div>
<p>تفاوت مهم:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">break
↓
پایان کل حلقه


continue
↓
پایان فقط تکرار فعلی
↓
رفتن به تکرار بعد</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">9. مثال کاربردی <code>continue</code></h2>
<p>فرض کن می‌خواهیم اعداد 1 تا 10 را بررسی کنیم، ولی اعداد زوج را چاپ نکنیم.</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(1, 11):

    if number % 2 == 0:
        continue

    print(number)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">1
3
5
7
9</div></div>
<p>بیایید یکی از تکرارها را بررسی کنیم.</p>
<p>وقتی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">number = 4</div></div>
<p>شرط:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">number % 2 == 0</div></div>
<p>برابر <code>True</code> می‌شود.</p>
<p>پس:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">continue</div></div>
<p>اجرا می‌شود.</p>
<p>در نتیجه:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">print(number)</div></div>
<p>اجرا نمی‌شود.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">10. <code>break</code> و <code>continue</code> را با هم مقایسه کنیم</h2>
<div class="table-wrap"><table><thead><tr><th>دستور</th><th>رفتار</th></tr></thead><tbody><tr><td><code>break</code></td><td>کل حلقه را متوقف می‌کند</td></tr><tr><td><code>continue</code></td><td>فقط تکرار فعلی را رد می‌کند</td></tr><tr><td><code>pass</code></td><td>هیچ کار خاصی انجام نمی‌دهد</td></tr></tbody></table></div>
<p>مثال:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt"># break
for i in range(5):
    if i == 2:
        break</div></div>
<p>حلقه در <code>2</code> تمام می‌شود.</p>
<p>اما:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt"># continue
for i in range(5):
    if i == 2:
        continue

    print(i)</div></div>
<p>فقط <code>2</code> چاپ نمی‌شود و حلقه ادامه دارد.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">11. <code>pass</code> چیست؟ </h2>
<p>حالا به سومین دستور می‌رسیم:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">pass</div></div>
<p><code>pass</code> یعنی:</p>
<blockquote><strong>فعلاً هیچ کاری انجام نده.</strong></blockquote>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(5):
    if number == 2:
        pass

    print(number)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0
1
2
3
4</div></div>
<p>چرا؟</p>
<p>چون <code>pass</code> حلقه را متوقف نمی‌کند.</p>
<p>همچنین تکرار را رد نمی‌کند.</p>
<p>فقط می‌گوید:</p>
<blockquote>اینجا فعلاً دستوری ندارم.</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">12. تفاوت <code>pass</code> و <code>continue</code></h2>
<p>این دو را خیلی‌ها اشتباه می‌گیرند.</p>
<h3><code>pass</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(3):
    if number == 1:
        pass

    print(number)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0
1
2</div></div>
<p><code>pass</code> هیچ اثری روی ادامه اجرای حلقه ندارد.</p>
<h3><code>continue</code></h3>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in range(3):
    if number == 1:
        continue

    print(number)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0
2</div></div>
<p>چون <code>continue</code> باعث می‌شود ادامه بدنه آن تکرار اجرا نشود.</p>
<h3> نکته امتحانی</h3>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">pass     → هیچ کاری نکن
continue → این تکرار را رد کن
break    → کل حلقه را تمام کن</div></div>
<p>این سه جمله را خوب به خاطر بسپار.</p>
<hr class="lesson-divider">
<h2 class="lesson-title">13. چرا اصلاً <code>pass</code> داریم؟</h2>
<p>گاهی می‌خواهیم ساختار یک برنامه را بنویسیم، اما هنوز نمی‌دانیم داخل یک بخش چه کدی باید قرار بگیرد.</p>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for number in numbers:
    pass</div></div>
<p>Python انتظار دارد بعد از <code>:</code> یک دستور وجود داشته باشد.</p>
<p><code>pass</code> می‌تواند موقتاً آن جای خالی را پر کند.</p>
<p>در سطح Basic، مهم‌ترین کاربردی که باید بلد باشی همین است:</p>
<blockquote><code>pass</code> یعنی «فعلاً هیچ عملی انجام نده».</blockquote>
<hr class="lesson-divider">
<h2 class="lesson-title">14. <code>break</code>، <code>continue</code> و <code>pass</code> در یک مثال</h2>

<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">3</div></div>

<h2 class="lesson-title">15. حلقه‌های تو در تو — Nested Loops </h2>
<p>حالا یک قدم مهم‌تر.</p>
<p>گاهی داخل یک حلقه، حلقه دیگری قرار می‌دهیم.</p>
<p>به این ساختار می‌گوییم:</p>
<blockquote><strong>Nested Loop — حلقه تو‌در‌تو</strong></blockquote>
<p>مثلاً:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(3):
    for j in range(2):
        print(i, j)</div></div>
<p>خروجی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">0 0
0 1
1 0
1 1
2 0
2 1</div></div>
<hr class="lesson-divider">
<h2 class="lesson-title">16. حلقه تو در تو چگونه کار می‌کند؟</h2>
<p>این قسمت را خوب بفهم.</p>
<p>کد:</p>
<div class="code-container"><span class="code-label">Python</span><div class="code-block no-prompt">for i in range(3):
    for j in range(2):
        print(i, j)</div></div>
<p>وقتی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">i = 0</div></div>
<p>حلقه داخلی کامل اجرا می‌شود:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">j = 0
j = 1</div></div>
<p>بعد می‌رویم سراغ:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">i = 1</div></div>
<p>و دوباره حلقه داخلی از اول اجرا می‌شود:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">j = 0
j = 1</div></div>
<p>و همین‌طور برای <code>i = 2</code>.</p>
<p>مدل ذهنی:</p>
<div class="code-container"><span class="code-label">Code</span><div class="code-block no-prompt">i = 0

i = 1
 ├── j = 0

i = 2
 ├── j = 0
